id: win2016-printing-over-http-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Wysyłanie wydruków protokołem stron sieciowych zablokowane
    en: The sending of print jobs over the web protocol blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje możliwość wysyłania zadań wydruku do drukarek
    osiągalnych protokołem stron sieciowych.

    Mechanizm ten pozwalał drukować na urządzeniu, do którego maszyna nie
    ma dostępu przez zwykłe udostępnienie — bo stoi w innej sieci, za
    zaporą, u innego dostawcy. Adres drukarki wygląda wtedy jak adres
    strony i ruch idzie tak samo.

    Z punktu widzenia obserwowania sieci jest to rzecz niewygodna. Wydruk
    przestaje być ruchem rozpoznawalnym jako wydruk i staje się ruchem
    nieodróżnialnym od przeglądania stron. Kanał wyjściowy z maszyny
    powstaje przy tym bez żadnej nowej reguły w zaporze, bo ruch ten jest
    zwykle dozwolony.

    Warto powiedzieć uczciwie, ile to waży. Nie jest to droga wejścia ani
    podniesienia uprawnień — to droga wyjścia danych, i to wąska, bo przez
    kolejkę wydruku przechodzą dokumenty, a nie dowolne pliki. Stąd
    kategoria średnia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    wyprowadzania dokumentów poza organizację, wyglądający jak zwykły ruch
    przeglądania stron.
  en: |
    The setting blocks the sending of print jobs to printers reachable over the web
    protocol.

    That mechanism let a machine print on a device it has no access to by ordinary
    sharing - because it stands on another network, behind a firewall, at another
    supplier. The printer's address then looks like a page's address and the traffic
    goes the same way.

    From the point of view of watching a network that is an awkward thing. Printing
    ceases to be traffic recognisable as printing and becomes traffic
    indistinguishable from the browsing of pages. An outward channel from the
    machine besides comes about with no new firewall rule, that traffic being as a
    rule allowed.

    Worth saying honestly how much this weighs. It is no road of entry nor of raised
    rights - it is a road out for data, and a narrow one, documents rather than any
    files at all passing through a print queue. Hence the medium category.

    What an attacker gains while the item goes unmet: a channel for taking documents
    out of the organisation, looking like ordinary browsing traffic.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy cokolwiek z tej
    maszyny drukuje w ten sposób.

    Na serwerze zwykle nic nie drukuje i wdrożenie nie zmienia nic.
    Mechanizm ten był używany rzadko już wtedy, gdy powstawał, a dziś
    spotyka się go niemal wyłącznie w środowiskach z drukarkami
    udostępnianymi przez usługę zewnętrzną.

    Sprawdzić warto dwie rzeczy. Pierwsza to drukarki dodane przez adres
    wyglądający jak adres strony — te przestaną przyjmować zadania.
    Druga to aplikacje drukujące do usługi chmurowej przez ten sam
    mechanizm; część rozwiązań do wydruku zarządzanego działa właśnie tak.

    Objaw jest natychmiastowy i jednoznaczny: zadanie nie wychodzi,
    a kolejka zgłasza błąd. Prowadzi to szybko do przyczyny.

    Rzecz warta odnotowania: punkt nie zamyka ruchu wychodzącego z maszyny
    i nie zastępuje reguły zapory. Blokuje jedną drogę jego powstawania,
    a maszyna nadal potrafi łączyć się z siecią tak jak dotąd.

    Czego to nie psuje: drukowania na drukarkach sieciowych zwykłych,
    kolejek udostępnianych, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anything on
    this machine prints that way.

    On a server as a rule nothing does and the rollout changes nothing. The
    mechanism was seldom used even when it came about, and today is met almost only
    in surroundings with printers shared by an outside service.

    Two things are worth checking. The first are printers added by an address
    looking like a page's - those will stop accepting jobs. The second are
    applications printing to a cloud service through the same mechanism; some
    managed printing arrangements work just so.

    The symptom is immediate and unambiguous: the job does not go out and the queue
    reports an error. That leads quickly to the cause.

    Worth noting: the item does not shut outward traffic from the machine and does
    not replace a firewall rule. It blocks one road of its coming about, and the
    machine can still reach the network as before.

    What this does not break: printing on ordinary network printers, shared queues,
    services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - network-and-firewall
  what_breaks:
    pl:
      - Drukarki dodane przez adres wyglądający jak adres strony przestają przyjmować zadania, a kolejka zgłasza błąd
      - Aplikacje drukujące do usługi chmurowej przez ten mechanizm przestają wysyłać zadania
      - Punkt nie zamyka ruchu wychodzącego z maszyny i nie zastępuje reguły zapory
      - Drukowanie na drukarkach sieciowych zwykłych i kolejki udostępniane pozostają bez zmian
    en:
      - Printers added by an address looking like a page's stop accepting jobs, and the queue reports an error
      - Applications printing to a cloud service through that mechanism stop sending jobs
      - The item does not shut outward traffic from the machine and does not replace a firewall rule
      - Printing on ordinary network printers and shared queues stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wydruk zarządzany w tej organizacji opiera się na usłudze osiągalnej protokołem stron sieciowych
      - Na maszynie dodano drukarkę przez adres wyglądający jak adres strony i nie ma dla niej zamiennika
    en:
      - Managed printing in this organisation rests on a service reachable over the web protocol
      - A printer has been added on the machine by an address looking like a page's and there is no replacement for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'DisableHTTPPrinting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'DisableHTTPPrinting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableHTTPPrinting' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-management-group-policy

notes:
  pl: |
    Punkt zamyka blok o wydruku i jest w nim jedynym, który nie dotyczy
    sterowników. Broni przed wyjściem danych, a nie przed wejściem kodu,
    i warto tę różnicę postawić wprost, bo inaczej ginie wśród sąsiadów
    o kategorii krytycznej.

    Kategoria średnia jest tu świadoma i opisuje realną wagę. Kanał jest
    wąski, bo przechodzą przez niego dokumenty w postaci przeznaczonej do
    druku. Nie jest to sposób na wyniesienie bazy danych, ale jest to sposób
    na wyniesienie dokumentu, którego nikt nie zobaczy w dzienniku jako
    wydruku.

    Blok o wydruku jako całość pokazuje dobrze, po co są dwie osie oceny.
    Wyłączenie usługi ma kategorię krytyczną i koszt najwyższy w zestawie.
    Ten punkt ma kategorię średnią i koszt bliski zeru. Obie te informacje
    są potrzebne, żeby ustalić kolejność.
  en: |
    The item shuts the block about printing and is the only one in it not concerned
    with drivers. It guards against data going out rather than code coming in, and
    that difference is worth putting outright, since otherwise it is lost among
    neighbours of a critical category.

    The medium category is deliberate here and describes its real weight. The
    channel is narrow, documents in a form meant for printing passing through it. It
    is no way of carrying off a database, but it is a way of carrying off a document
    nobody will see in a log as a print job.

    The block about printing as a whole shows well what the two axes of judgement
    are for. Switching the service off is of a critical category and of the highest
    cost in the set. This item is of a medium category and of a cost close to
    nothing. Both those pieces of information are needed to settle an order of work.
