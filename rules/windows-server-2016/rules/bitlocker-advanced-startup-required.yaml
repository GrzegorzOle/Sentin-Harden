id: win2016-bitlocker-advanced-startup-required

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Dodatkowe uwierzytelnienie przy starcie dysku systemowego wymagane
    en: Additional authentication at startup of the system drive required
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby odblokowanie dysku systemowego wymagało czegoś
    więcej niż samego układu zabezpieczającego maszyny — kodu startowego
    albo klucza na nośniku.

    Szyfrowanie oparte wyłącznie na układzie zabezpieczającym broni przed
    jedną rzeczą: wyjęciem dysku i podłączeniem go gdzie indziej. Klucz
    zostaje w układzie przylutowanym do płyty, więc dysk poza tą maszyną
    jest nieczytelny.

    Nie broni natomiast przed niczym, co dzieje się przy tej maszynie. Układ
    oddaje klucz każdemu, kto tę maszynę włączy — bo sprawdza stan rozruchu,
    a nie tożsamość włączającego. Serwer wyniesiony z serwerowni razem
    z obudową uruchomi się i odszyfruje dysk sam z siebie.

    Dodatkowe uwierzytelnienie zamyka tę lukę. Układ oddaje klucz dopiero po
    podaniu kodu startowego albo po włożeniu nośnika z kluczem, a więc po
    udziale kogoś, kto ten kod albo nośnik ma.

    Druga wartość, którą ten punkt niesie, jest równie ważna. Zabrania ona
    szyfrowania bez układu zabezpieczającego. Bez tego zakazu wymóg jest
    pusty: dysk da się zaszyfrować samym kodem, a wtedy cała ochrona sprowadza
    się do siły tego kodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę, która
    sama odszyfrowuje własny dysk po włączeniu, niezależnie od tego, kto ją
    włącza i gdzie stoi.
  en: |
    The setting requires that unlocking the system drive take more than the machine's security
    chip alone - a startup code or a key on a medium.

    Encryption resting on the security chip alone guards against one thing: the drive being
    taken out and plugged in elsewhere. The key stays in a chip soldered to the board, so the
    drive outside this machine cannot be read.

    It guards, on the other hand, against nothing that happens at this machine. The chip gives
    the key up to anybody who switches the machine on - it checking the state of the boot and
    not the identity of whoever switches it. A server carried out of the server room along with
    its case will start and decrypt the drive of itself.

    The additional authentication shuts that gap. The chip gives the key up only once a startup
    code is given or a medium with a key put in, which is to say once somebody who has that code
    or medium takes part.

    The second value this item carries is as weighty. It forbids encryption without the security
    chip. Without that ban the requirement is hollow: the drive can be encrypted by the code
    alone, and then the whole guard comes down to that code's strength.

    What an attacker gains while the item goes unmet: a machine that decrypts its own drive once
    switched on, whoever switches it and wherever it stands.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest jeden i poważny: po tej
    zmianie maszyna przestaje startować bez człowieka.

    Skutek ten trzeba wyłożyć dokładnie, bo bywa niedoszacowany. Kod startowy
    podaje się przed uruchomieniem systemu, a więc zanim wstanie sieć, zanim
    wstanie usługa pulpitu zdalnego i zanim wstanie cokolwiek, czym zwykle
    obsługuje się serwer. Jedyną drogą jest konsola fizyczna albo karta
    zarządzania.

    Z tego wynika lista sytuacji, w których zmiana jest błędem. Maszyna
    restartująca się sama po aktualizacjach zatrzyma się na pytaniu o kod
    i będzie stała do rana. Maszyna w lokalizacji bez obsługi zatrzyma się
    na tym samym pytaniu i nikt tam nie pojedzie tej samej doby. Maszyna bez
    działającej karty zarządzania zatrzyma się w miejscu, do którego nie ma
    dostępu.

    Przed wykonaniem trzeba więc sprawdzić dwie rzeczy, i to sprawdzić,
    a nie założyć. Pierwsza: czy droga do konsoli zarządzania działa —
    sprawdzeniem jest zalogowanie się przez nią, nie obecność adresu
    w dokumentacji. Druga: czy maszyna jest ustawiona na samodzielny restart
    po aktualizacjach.

    Na serwerze poprawnym wynikiem bywa zapisany wyjątek, a nie wdrożenie.
    Warunek ten wchodzi w konflikt z obsługą bezobsługową i konflikt ten
    jest rzeczywisty, nie pozorny.

    Czego to nie psuje: pracy systemu po starcie, usług, sieci, aplikacji,
    uwierzytelniania użytkowników.

    Wymaga restartu; cofnięcie działa po kolejnym restarcie.
  en: |
    The class is "needs a planned rollout", and the reason is a single grave one: after this
    change the machine ceases to start without a person.

    That consequence has to be set out exactly, being at times underrated. The startup code is
    given before the system starts, which is to say before the network comes up, before the
    remote desktop service comes up and before anything comes up by which a server is usually
    attended. The one road is a physical console or a management card.

    From that follows a list of situations in which the change is a mistake. A machine that
    restarts by itself after updates will stop at the question about the code and stand there
    till morning. A machine at a place without attendance will stop at the same question and
    nobody will travel there the same day. A machine without a working management card will stop
    at a place there is no access to.

    Two things therefore have to be checked before execution, and checked rather than assumed.
    The first: whether the road to the management console works - the check being a signing in
    through it, not an address's presence in the documentation. The second: whether the machine
    is set to restart by itself after updates.

    On a server a right outcome is at times a recorded exception rather than a rollout. That
    condition is at odds with unattended service, and the conflict is a real one, not a seeming
    one.

    What this does not break: the system's working after the start, services, the network,
    applications, or the authentication of users.

    Calls for a restart; the undoing works after a further restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - remote-management
  what_breaks:
    pl:
      - Maszyna przestaje startować bez człowieka - kod startowy podaje się, zanim wstanie sieć i cokolwiek innego
      - Restart po aktualizacjach zatrzymuje się na pytaniu o kod i maszyna stoi do czasu, aż ktoś do niej podejdzie
      - Maszyna w lokalizacji bez obsługi zostaje niedostępna do najbliższego wyjazdu na miejsce
      - Bez działającej karty zarządzania jedyną drogą pozostaje konsola fizyczna
      - Praca systemu po starcie, usługi, sieć i aplikacje pozostają bez zmian
    en:
      - The machine ceases to start without a person - the startup code is given before the network and anything else comes up
      - A restart after updates stops at the question about the code and the machine stands until somebody goes to it
      - A machine at a place without attendance stays unreachable until the next journey there
      - Without a working management card the one road left is a physical console
      - The system's working after the start, services, the network and applications stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest ustawiona na samodzielny restart po aktualizacjach i nikt nie czuwa przy niej w nocy
      - Nie sprawdzono drogi do konsoli zarządzania przez zalogowanie się nią, a jedynie odczytano adres z dokumentacji
      - Maszyna stoi w lokalizacji, do której nie da się dojechać tego samego dnia
    en:
      - The machine is set to restart by itself after updates and nobody keeps watch by it at night
      - The road to the management console has not been checked by signing in through it, only an address read from the documentation
      - The machine stands at a place that cannot be reached the same day
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first requires the additional
      # authentication; the second must stay at zero, otherwise encryption
      # without the hardware module is admitted and the requirement is hollow.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $advanced = $item.'UseAdvancedStartup'
        $noTpm = $item.'EnableBDEWithNoTPM'
        if ($null -eq $advanced) { 'MISSING' }
        elseif ([int]$advanced -ne 1) { 'NOT_REQUIRED' }
        elseif ($null -ne $noTpm -and [int]$noTpm -eq 1) { 'WITHOUT_MODULE_ALLOWED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      advanced         = $item.'UseAdvancedStartup'
      advanced_existed = ($null -ne $item.'UseAdvancedStartup')
      no_tpm           = $item.'EnableBDEWithNoTPM'
      no_tpm_existed   = ($null -ne $item.'EnableBDEWithNoTPM')
      key_existed      = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # After this the machine no longer starts unattended: somebody has to be at
    # the console at every boot, before the system exists. Verify the road to
    # the management console by actually signing in first. On a server that
    # restarts by itself after updates, the right answer is often a recorded
    # exception instead of this change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseAdvancedStartup' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'EnableBDEWithNoTPM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.advanced_existed) {
      Set-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -Value $b.advanced -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -ErrorAction SilentlyContinue
    }
    if ($b.no_tpm_existed) {
      Set-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -Value $b.no_tpm -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt otwiera blok o tym, co odblokowuje dysk systemowy przy starcie,
    i łączy się wprost z blokiem poprzednim. Tam chodziło o to, czy kod
    rozruchowy jest ten właściwy; tu o to, czy ktoś musi przy tym być.

    Warto odnotować, że jest to punkt, w którym zapisany wyjątek jest
    częstszym poprawnym wynikiem niż wdrożenie — i aplikacja powinna to
    powiedzieć wprost, zamiast zostawiać użytkownika z czerwoną pozycją,
    której nie da się zamknąć. Serwer bezobsługowy i wymóg obecności
    człowieka przy każdym starcie wykluczają się; nie ma tu wariantu
    pośredniego i udawanie, że jest, nikomu nie pomaga.

    Druga wartość niesiona przez ten punkt zasługuje na osobne zdanie
    w podglądzie. Wymóg dodatkowego uwierzytelnienia bez zakazu szyfrowania
    bez układu zabezpieczającego jest wymogiem pustym, a te dwa ustawienia
    leżą w interfejsie systemu obok siebie i bywają rozdzielane. Audyt
    rozróżnia tu trzy stany właśnie po to, żeby ten przypadek nie zlał się
    ze zgodnością.
  en: |
    The item opens the block about what unlocks the system drive at the start, and ties directly
    to the block before it. There the matter was whether the boot code is the right one; here it
    is whether somebody has to be present at it.

    Worth noting that it is an item where a recorded exception is a commoner right outcome than a
    rollout - and the application should say so outright rather than leave the user with a red
    entry that cannot be shut. An unattended server and a requirement that a person be there at
    every start rule one another out; there is no middle variant here and pretending there is
    helps nobody.

    The second value this item carries deserves a sentence of its own in the preview. A
    requirement of additional authentication without a ban on encryption lacking the security
    chip is a hollow requirement, and those two settings lie beside one another in the system's
    interface and are at times parted. The audit tells three states apart here precisely so that
    this case does not run together with compliance.
