id: win10-feature-updates-deferred

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Aktualizacje funkcji opóźnione o co najmniej 180 dni
    en: Feature updates put off by at least 180 days
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Aktualizacja funkcji to nowe wydanie systemu, a nie poprawka. Zmienia
    składniki, ustawienia domyślne i zachowanie mechanizmów, na których stoi
    konfiguracja bezpieczeństwa maszyny.

    Ryzyko nie leży tu w samym wydaniu, tylko w tym, że przychodzi ono wcześniej,
    niż ktokolwiek zdążył je sprawdzić. Nowe wydanie potrafi przywrócić wartości
    domyślne, usunąć ustawienie, które przestało istnieć, albo zmienić znaczenie
    tego, które zostało. Utwardzona maszyna po takiej zmianie bywa mniej utwardzona
    niż przed nią, a nikt tego nie zauważa, bo nikt tego nie robił.

    Opóźnienie daje czas na sprawdzenie wydania na maszynie kontrolnej, zanim
    trafi ono na stanowiska.
  en: |
    A feature update is a new release of the system rather than a fix. It alters
    components, default settings and the behaviour of the mechanisms the machine s
    security configuration rests on.

    The risk here does not lie in the release itself but in its arriving earlier
    than anybody managed to check it. A new release can restore default values,
    remove a setting that has ceased to exist, or change the meaning of one that
    remains. A hardened machine after such a change is sometimes less hardened than
    before it, and nobody notices, since nobody did it.

    Putting it off gives time to check the release on a control machine before it
    reaches the stations.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo dotyczy rytmu pracy działu informatycznego, a nie
    pojedynczej maszyny. Opóźnienie ma sens tylko wtedy, gdy ktoś faktycznie
    wykorzysta ten czas na sprawdzenie wydania.

    Trzeba też pilnować końca wsparcia dla używanego wydania. Zbyt długie
    opóźnienie potrafi zbiec się z zakończeniem wsparcia, a wtedy maszyna przestaje
    dostawać poprawki — skutek jest odwrotny do zamierzonego. Termin trzeba
    zestawić z harmonogramem producenta, a nie ustawiać raz na zawsze.

    Poprawki bezpieczeństwa tego nie dotyczą. Opóźnienie obejmuje wyłącznie
    wydania funkcji i nie wstrzymuje comiesięcznych poprawek.
  en: |
    The change calls for a review, since it concerns the rhythm of the IT desk s
    work rather than a single machine. Putting updates off makes sense only where
    somebody really uses that time to check the release.

    The end of support for the release in use also needs watching. Too long a delay
    can coincide with support ending, and then the machine stops receiving fixes -
    the effect is the reverse of the one intended. The period has to be set against
    the maker s schedule rather than settled once and for all.

    Security fixes are not touched by this. The delay covers feature releases only
    and does not hold back the monthly fixes.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl:
      - Nowe wydania systemu nie pojawią się na stanowiskach przez ustalony okres, nawet jeżeli użytkownik ich oczekuje
      - Funkcje zapowiadane przez producenta będą dostępne później niż na maszynach domowych, co bywa zgłaszane jako zaniedbanie
      - Zbyt długie opóźnienie może zbiec się z końcem wsparcia dla używanego wydania i odciąć maszynę od poprawek
      - Poprawki bezpieczeństwa, sterowniki, aktualizacje aplikacji i praca użytkownika pozostają bez zmian
    en:
      - New releases of the system do not appear on stations for the settled period, even where a user expects them
      - Features announced by the maker arrive later than on home machines, which gets reported as neglect
      - Too long a delay may coincide with the end of support for the release in use and cut the machine off from fixes
      - Security fixes, drivers, application updates and user work are all unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowiska, w których używane wydanie zbliża się do końca wsparcia producenta
      - Stanowiska wymagające funkcji dostępnej wyłącznie w najnowszym wydaniu systemu
      - Organizacje bez procedury sprawdzania wydań, w których opóźnienie jest tylko odsunięciem problemu
    en:
      - Environments where the release in use approaches the end of the maker s support
      - Stations needing a function available only in the newest release of the system
      - Organisations with no procedure for checking releases, where a delay merely pushes the problem back
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch and the number of days. The
      # switch set without a long enough delay is reported apart, because it is
      # the number that settles the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      $minimum = 180
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DeferFeatureUpdates'
        $days = $item.'DeferFeatureUpdatesPeriodInDays'
        if ($null -eq $switch -or $null -eq $days) { 'MISSING' }
        elseif ([int]$switch -ne 1) { 'NOT_SET' }
        elseif ([int]$days -lt $minimum) { 'BELOW_MINIMUM ' + [int]$days }
        else { 'AT_OR_ABOVE_MINIMUM' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AT_OR_ABOVE_MINIMUM'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path           = $path
      switch         = $item.'DeferFeatureUpdates'
      switch_existed = ($null -ne $item.'DeferFeatureUpdates')
      days           = $item.'DeferFeatureUpdatesPeriodInDays'
      days_existed   = ($null -ne $item.'DeferFeatureUpdatesPeriodInDays')
      key_existed    = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdates' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DeferFeatureUpdatesPeriodInDays' -Value 180 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdates' -ErrorAction SilentlyContinue
    }
    if ($b.days_existed) {
      Set-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -Value $b.days -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DeferFeatureUpdatesPeriodInDays' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt niosą dwie wartości: przełącznik i liczba dni. Przełącznik ustawiony bez
    dostatecznie długiego opóźnienia zgłaszany jest osobno wraz z zastaną liczbą
    dni, bo to liczba rozstrzyga o spełnieniu. Naprawa ustawia oba wpisy naraz.
  en: |
    Two values carry this item - the switch and the number of days. A switch set
    without a long enough delay is reported apart together with the number of days
    found, since it is the number that settles the item. The remediation sets both
    entries at once.
