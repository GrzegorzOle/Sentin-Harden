id: win2016-impersonate-client-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Podszywanie się pod klienta po uwierzytelnieniu ograniczone
    en: Impersonating a client after authentication restricted
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do podszywania się pod uwierzytelnionego klienta
    do administratorów, usług i kont systemowych.

    Mechanizm sam w sobie jest potrzebny i powszechny. Usługa przyjmująca
    połączenie — serwer plików, serwer aplikacji, usługa sieciowa — wykonuje
    pracę w imieniu klienta i musi przy tym przyjąć jego tożsamość, żeby system
    sprawdził uprawnienia klienta, a nie usługi. Bez tego każda usługa działałaby
    na swoich uprawnieniach i uprawnienia plikowe straciłyby sens.

    Kłopot zaczyna się tam, gdzie uprawnienie to ma konto, które klientów nie
    obsługuje. Wtedy przestaje być narzędziem pracy, a staje się drogą awansu:
    proces skłania konto silniejsze do połączenia się z nim, przyjmuje jego
    tożsamość i działa dalej z jego uprawnieniami.

    Kategoria wysoka. To jest jeden z najczęściej wykorzystywanych w praktyce
    sposobów przejścia z konta usługowego na konto systemowe — i wymaga tylko
    tego, żeby uprawnienie było nadane szerzej, niż trzeba.

    Na serwerze 2016 rzecz dotyczy przede wszystkim maszyn z rolą serwera stron
    albo z aplikacją branżową uruchamianą jako usługa. To właśnie tam instalator
    bywa dopisywał konto do tej listy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość konta
    silniejszego niż własne, przyjętą w ramach zwykłej pracy usługi.
  en: |
    The item limits the right to impersonate an authenticated client to
    administrators, services and system accounts.

    The mechanism itself is needed and common. A service accepting a connection - a
    file server, an application server, a network service - does work on a client's
    behalf and must take on their identity so that the system checks the client's
    rights rather than the service's. Without it every service would run on its own
    rights and file permissions would lose their point.

    The trouble begins where the right is held by an account that serves no
    clients. It then stops being a tool of work and becomes a road to promotion: a
    process induces a stronger account to connect to it, takes on that identity and
    carries on with its rights.

    The category is high. This is one of the most frequently used ways in practice
    of moving from a service account to the system account - and it needs only that
    the right be granted more widely than necessary.

    On Server 2016 the matter concerns above all machines with the web server role
    or with a line-of-business application run as a service. That is where an
    installer sometimes added an account to this list.

    What an attacker gains while the item goes unmet: the identity of an account
    stronger than their own, taken on within a service's ordinary work.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo lista bywa tu szersza niż domyślna
    i zawężenie jej potrafi zatrzymać działającą usługę.

    Wpisy spoza listy domyślnej pochodzą zwykle od aplikacji serwerowych
    napisanych tak, że przyjmują połączenia na własnym koncie usługowym.
    Dotyczy to starszych serwerów aplikacji, oprogramowania pośredniczącego
    i części systemów branżowych działających jako usługa.

    Objaw odebrania uprawnienia takiemu kontu jest charakterystyczny: usługa
    działa, połączenie jest przyjmowane, a praca w imieniu klienta kończy się
    błędem dostępu. Wygląda to na problem uprawnień plikowych i bywa tak
    diagnozowane — stąd warto wiedzieć, co się zmieniło.

    Sprawdzenie sprowadza się do przejrzenia listy i ustalenia, czy wpis spoza
    grup domyślnych należy do usługi rzeczywiście obsługującej klientów.
    Jeżeli tak, właściwą odpowiedzią bywa przeniesienie usługi na konto usługi
    sieciowej, a nie zostawienie wpisu.

    Czego to nie psuje: pracy usług systemowych, serwera plików, roli serwera
    stron ani niczego działającego na koncie systemowym lub sieciowym.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because the list is sometimes wider here than the
    default and narrowing it can stop a working service.

    Entries outside the default list usually come from server applications written
    to accept connections under their own service account. That covers older
    application servers, middleware, and some line-of-business systems run as a
    service.

    The symptom of taking the right from such an account is distinctive: the
    service runs, the connection is accepted, and the work on the client's behalf
    ends in an access error. It looks like a file permission problem and gets
    diagnosed as one - hence it is worth knowing what changed.

    The check comes down to going through the list and establishing whether an
    entry outside the default groups belongs to a service that genuinely serves
    clients. If it does, the right answer is often to move the service onto the
    network service account rather than to leave the entry.

    What this does not break: the system's services, the file server, the web
    server role, or anything running under the system or network account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Aplikacja serwerowa przyjmująca połączenia na własnym koncie usługowym przestaje wykonywać pracę w imieniu klienta
      - Objaw wygląda na problem uprawnień plikowych, bo usługa działa, a odmowa pada dopiero przy pracy w imieniu klienta
      - Oprogramowanie pośredniczące i starsze serwery aplikacji z osobnym kontem usługowym tracą to uprawnienie
      - Usługi systemowe, serwer plików i rola serwera stron działają bez zmian
    en:
      - A server application accepting connections under its own service account stops doing work on a client's behalf
      - The symptom looks like a file permission problem, because the service runs and the refusal comes only at work on the client's behalf
      - Middleware and older application servers with a separate service account lose this right
      - The system's services, the file server and the web server role work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja serwerowa przyjmująca połączenia na koncie usługowym spoza grup domyślnych i nie da się jej przenieść na konto usługi sieciowej
    en:
      - A server application accepting connections under a service account outside the default groups runs on the machine and cannot be moved onto the network service account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeImpersonatePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20,S-1-5-32-544,S-1-5-6|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeImpersonatePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeImpersonatePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is narrowed to the default groups rather than emptied - the mechanism
    # is needed, and without it file permissions would lose their point. The change
    # takes the right only from accounts that serve no clients.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeImpersonatePrivilege = *S-1-5-32-544,*S-1-5-6,*S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeImpersonatePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/impersonate-a-client-after-authentication

notes:
  pl: |
    Oczekiwana lista obejmuje administratorów lokalnych, usługę, usługę
    sieciową oraz konto usługi. Nie jest to lista pusta i nie powinna nią być:
    odebranie tego uprawnienia wszystkim zatrzymałoby serwer plików.

    Uprawnienie to bywa mylone z tworzeniem obiektu tokenu, opisanym osobną
    regułą. Różnica jest zasadnicza: tutaj tożsamość pochodzi od klienta,
    który się uwierzytelnił, tam jest wymyślana od zera.

    Na maszynie z rolą serwera stron warto sprawdzić tę listę osobno, bo
    konfiguracje pul aplikacji z czasów tego wydania systemu bywają oparte na
    kontach własnych, a nie na koncie puli.
  en: |
    The expected list covers the local administrators, the service, the network
    service and the service account. It is not an empty list and should not be one:
    taking this right from everybody would stop the file server.

    The right gets confused with creating a token object, described by a separate
    rule. The difference is fundamental: here the identity comes from a client who
    has authenticated, there it is invented from nothing.

    On a machine with the web server role this list is worth checking separately,
    because application pool configurations from the time of this release sometimes
    rest on their own accounts rather than on the pool account.
