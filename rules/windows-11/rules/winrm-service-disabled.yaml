id: win11-winrm-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania poleceniami wyłączona
    en: The service for remote management by commands disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje z sieci polecenia i wykonuje je na maszynie. Nie jest to
    przesada ani uproszczenie — na tym polega jej zadanie. Po uwierzytelnieniu
    zdalna strona uruchamia polecenia z uprawnieniami konta, którym się
    przedstawiła, i otrzymuje ich wynik.

    Dla administratora jest to narzędzie pierwszej potrzeby. Dla napastnika,
    który zdobył poświadczenia administracyjne, jest to droga najwygodniejsza
    z możliwych: nie trzeba dostarczać na maszynę żadnego pliku, nie ma czego
    wykryć jako szkodliwego programu, a ruch wygląda jak zwyczajne zarządzanie,
    bo nim właśnie jest.

    Ruch boczny w sieci prowadzony tą drogą jest w praktyce nie do odróżnienia
    od pracy działu informatycznego, jeżeli wcześniej nie wiadomo, kto i skąd
    ma prawo zarządzać. To jest właśnie powód, dla którego punkt istnieje:
    maszyna, która nie jest zarządzana zdalnie poleceniami, nie ma powodu tego
    przyjmować.

    Reszta reguł tej paczki dotyczących tego mechanizmu utwardza go:
    zakazuje uwierzytelniania podstawowego, wymaga szyfrowania, blokuje
    uruchamianie na innym koncie. Ten punkt mówi co innego — że mechanizmu
    może nie być.
  en: |
    The service takes commands from the network and runs them on the machine. That is
    neither an exaggeration nor a simplification - it is what the service is for. Once
    authenticated, the remote side runs commands with the rights of the account it
    presented and receives their results.

    For an administrator it is a tool of first necessity. For an attacker who has got
    hold of administrative credentials it is the handiest route there is: no file has to
    be delivered to the machine, there is nothing to detect as a malicious program, and
    the traffic looks like ordinary management, because that is what it is.

    Lateral movement across a network run this way is in practice indistinguishable from
    the computing department's work, unless it is known beforehand who may manage and
    from where. That is exactly why the item exists: a machine not managed remotely by
    commands has no reason to take them.

    The rest of this pack's rules about this mechanism harden it: they forbid basic
    authentication, require encryption, block running as another account. This item says
    something else - that the mechanism need not be there.

disruption_description:
  pl: |
    To jest zmiana, którą trzeba uzgodnić z osobami zarządzającymi maszynami,
    a nie wdrożyć i obserwować.

    Po wyłączeniu usługi maszyna przestaje przyjmować polecenia zdalne.
    Przestaje też odpowiadać na odpytania stanu prowadzone tą drogą —
    a prowadzi je wiele rzeczy naraz, nie zawsze oczywistych.

    Do przejrzenia są trzy obszary. Pierwszy: narzędzia zarządzania
    konfiguracją, które rozsyłają ustawienia i zbierają raport zgodności.
    Drugi: systemy monitorowania odpytujące maszyny o stan usług, miejsce na
    dysku, wersje oprogramowania. Trzeci: skrypty administracyjne uruchamiane
    na wielu maszynach naraz, w tym te, które ktoś napisał dawno i uruchamia
    raz na kwartał — właśnie one zaskakują najczęściej.

    Wyłączenie usługi na maszynie zdalnej bez przygotowanego zastępstwa
    oznacza, że kolejna zmiana na niej wymaga dostępu na miejscu albo innej
    drogi zdalnej. Przy maszynach rozproszonych jest to koszt wyższy niż sama
    zmiana.

    Zamiennikiem dla zarządzania jest narzędzie działające z agentem po stronie
    maszyny, które samo nawiązuje połączenie na zewnątrz zamiast czekać na
    połączenie przychodzące. Zamiana ta jest sama w sobie zmianą korzystną,
    ale jest projektem, a nie kliknięciem.

    Zmiana wymaga zatrzymania usługi.
  en: |
    This is a change to be agreed with whoever manages the machines, not applied and
    watched.

    Once the service is off the machine stops taking remote commands. It also stops
    answering enquiries about its state run by that route - and many things run them at
    once, not all of them obvious.

    Three areas need looking through. The first: configuration management tools that
    send settings out and gather a compliance report. The second: monitoring systems
    asking machines about the state of services, disk space, software versions. The
    third: administrative scripts run on many machines at once, including those somebody
    wrote long ago and runs once a quarter - and it is those that surprise most often.

    Disabling the service on a remote machine with no replacement ready means the next
    change to it takes reaching it in person or by another remote route. With scattered
    machines that is a cost higher than the change itself.

    The replacement for management is a tool working with an agent on the machine's
    side, which opens a connection outwards itself instead of waiting for an incoming
    one. That swap is a beneficial change in itself, but it is a project rather than a
    click.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Maszyna przestaje przyjmować polecenia zdalne i odpowiadać na odpytania stanu
      - Narzędzia zarządzania konfiguracją przestają rozsyłać ustawienia i zbierać raport
      - Skrypty administracyjne uruchamiane na wielu maszynach pomijają tę maszynę z błędem
      - Polecenia uruchamiane z tej maszyny do innych działają dalej bez zmian
    en:
      - The machine stops taking remote commands and answering enquiries about its state
      - Configuration management tools stop sending settings out and gathering a report
      - Administrative scripts run on many machines skip this one with an error
      - Commands run from this machine to others carry on working unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest zarządzana zdalnie poleceniami i nie ma innej drogi zarządzania
      - System monitorowania odpytuje maszynę o stan właśnie tą drogą
      - Maszyna stoi w miejscu, do którego dojazd jest kosztowny albo niemożliwy w krótkim czasie
    en:
      - The machine is managed remotely by commands and there is no other way of managing it
      - A monitoring system asks the machine about its state by exactly this route
      - The machine stands in a place costly or impossible to reach quickly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off a remote session this command may itself
    # be running in.
    Stop-Service -Name 'WinRM' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinRM' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WinRM' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/portal

notes:
  pl: |
    Uruchomienie tej reguły przez połączenie zdalne oparte na tej samej usłudze
    przerywa to połączenie. Polecenie wykona się do końca, ale wynik ponownego
    audytu nie wróci. Wdrażać należy z konsoli na miejscu albo inną drogą
    zdalną.

    Punkt dotyczy wyłącznie strony przyjmującej polecenia. Uruchamianie poleceń
    z tej maszyny na innych maszynach działa dalej i obsługuje je osobny
    składnik, opisany w tej paczce innymi regułami.

    Wyłączenie usługi nie zwalnia z ustawienia pozostałych reguł tego
    mechanizmu. Bronią one maszyny, na której usługa zostanie kiedykolwiek
    włączona z powrotem — a przy narzędziach zarządzania zdarza się to
    samoczynnie, bo część z nich włącza ją przy wdrożeniu.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    Running this rule through a remote connection resting on this same service breaks
    that connection off. The command will run to the end, but the result of the re-audit
    will not come back. It should be applied from a console in person or by another
    remote route.

    The item concerns the side taking commands alone. Running commands from this machine
    on other machines carries on working and is handled by a separate component,
    described by other rules in this pack.

    Disabling the service does not excuse leaving this mechanism's other rules unset.
    They guard a machine on which the service is ever switched back on - and with
    management tools that happens of its own accord, since some of them switch it on
    during a rollout.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment.
