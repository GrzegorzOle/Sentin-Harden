id: win2025-autorun-commands-not-executed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Polecenia z pliku startowego nośnika nigdy nie wykonywane
    en: Commands from a medium's startup file never executed
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że polecenie zapisane w pliku startowym nośnika nigdy
    nie zostaje wykonane. Plik taki leży w katalogu głównym nośnika
    i mówi systemowi, co uruchomić — a system, zanim ten punkt zadziała,
    to polecenie honoruje.

    Chcę rozróżnić ten punkt od poprzedniego, bo bywają mylone i stosowane
    zamiennie, a razem zamykają dopiero całość. Punkt poprzedni wyłącza
    autoodtwarzanie, czyli to, co widać: okno, które się otwiera.
    Ten punkt wyłącza to, czego nie widać: polecenie, które ma zostać
    wykonane. Można mieć pierwsze bez drugiego i mieć wrażenie, że
    zrobiło się porządek.

    Zostawiam kategorię wysoką i jest ona najwyższa w całej tej grupie.
    Powód jest prosty: to jest jedyny punkt w tej grupie, który dotyczy
    wykonania kodu, a nie wyświetlenia okna. Reszta grupy zdejmuje
    zaproszenie do działania, ten zdejmuje samo działanie.

    Na serwerze droga jest ta, którą opisałem przy autoodtwarzaniu:
    obraz zamontowany zdalnie z poziomu hipernadzorcy albo dysk
    podłączony na stałe. Plik startowy na takim nośniku zadziała bez
    logowania się na tę maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    przygotowanego polecenia na serwerze w chwili pojawienia się nośnika,
    bez żadnej decyzji po stronie maszyny.
  en: |
    The item makes it so that a command written in a bearer's file of starting is never carried out.
    Such a file lies in the head folder of the bearer and tells the system what to run - and the
    system, before this item works, honours that command.

    I would tell this item apart from the one before, they being at times mistaken one for another
    and laid on in each other's stead, whereas together alone they shut the whole. The item before
    switches off the self-playing, that is what is seen - the window that opens. This item switches
    off what is not seen - the command that is to be carried out. One may have the first without the
    second and hold that order has been made.

    I leave the category high and it is the highest in this whole group. The ground is plain - it is
    the one item in the group bearing on the carrying out of code and not on the showing of a window.
    The rest of the group takes away the bidding to a doing, this one takes the doing itself.

    On a server the road is that I set forth at the self-playing - an image mounted from afar out of
    the overseer, or a disk bound on for good. A file of starting upon such a bearer will work
    without a signing in to that machine.

    What an attacker gains while the item goes unmet - the carrying out of a made-ready command upon
    the server at the hour of the bearer's coming forth, with no deciding on the machine's side.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i uważam, że na serwerze jest to
    ocena bezpieczna.

    Zmiana nie dotyka odczytu nośnika. Dysk jest widoczny, pliki dają się
    otworzyć, obraz montuje się tak samo, kopia zapasowa działa bez
    zmian. Wyłączone zostaje wyłącznie honorowanie pliku, który mówi, co
    uruchomić.

    Jest jedna rzecz warta wskazania, bo sama z siebie wygląda na
    powód do ostrożności, a nią nie jest. Część starszych nośników
    instalacyjnych — płyt z oprogramowaniem producenta sprzętu, obrazów
    narzędzi diagnostycznych — opiera swoje uruchamianie właśnie na tym
    pliku. Po zmianie taki nośnik nie uruchomi się sam. Uruchomi się
    jednak nadal, gdy ktoś otworzy na nim program ręcznie, a na serwerze
    właśnie tak się to robi: świadomie, jednym poleceniem, w trakcie
    serwisu.

    Nie znam serwerowego zastosowania, w którym wykonanie polecenia z pliku
    startowego bez pytania jest czynnością potrzebną.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption" and hold it on a server a safe reckoning.

    The change touches not the reading of the bearer. The disk is seen, the files may be opened, an
    image mounts the same, a keeping of a copy works unaltered. What is switched off is the honouring
    of the file that says what to run alone.

    There is one thing worth naming, looking as it does of itself like a ground for wariness, which
    it is not. Some of the older bearers of installing - platters with the software of a maker of
    gear, images of tools for the finding out of faults - lean their running upon just that file.
    After the change such a bearer will not run of itself. It will run still, though, where somebody
    opens a program upon it by hand, and on a server that is just how it is done - wittingly, by one
    command, in the midst of service.

    I know of no use on a server wherein the carrying out of a command out of a file of starting,
    with no asking, is a needed doing.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - removable-media
    - scripting-and-automation
  what_breaks:
    pl:
      - Starszy nośnik instalacyjny opierający uruchamianie na pliku startowym nie uruchomi się sam
      - Program z takiego nośnika daje się nadal otworzyć ręcznie, jednym poleceniem
      - Zmiana nie dotyczy odczytu nośnika, montowania obrazu ani kopii zapasowej
      - Punkt poprzedni wyłącza okno, ten wyłącza polecenie, i dopiero razem zamykają całość
      - Brak serwerowego zastosowania, w którym wykonanie polecenia bez pytania jest potrzebne
    en:
      - An older bearer of installing that leans its running upon the file of starting will not run of itself
      - A program off such a bearer may still be opened by hand, by one command
      - The change bears not on the reading of the bearer, the mounting of an image nor a keeping of a copy
      - The item before switches off the window, this one the command, and together alone they shut the whole
      - No use on a server wherein the carrying out of a command with no asking is needed
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'NoAutorun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoAutorun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the value that stops the command running; NoDriveTypeAutoRun only
    # stops the window appearing. Both are needed.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutorun' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/shell/autoplay

notes:
  pl: |
    Rozróżnienie warte zapamiętania, bo te dwa punkty bywają mylone
    i stosowane zamiennie: poprzedni wyłącza autoodtwarzanie, czyli to,
    co widać — okno. Ten wyłącza to, czego nie widać — polecenie. Można
    mieć pierwsze bez drugiego i mieć wrażenie, że zrobiło się porządek.

    Kategoria najwyższa w całej grupie, bo jest to jedyny punkt dotyczący
    wykonania kodu, a nie wyświetlenia okna. Reszta grupy zdejmuje
    zaproszenie do działania, ten zdejmuje samo działanie.
  en: |
    A telling apart worth bearing in mind, those two items being at times mistaken one for another
    and laid on in each other's stead - the one before switches off the self-playing, that is what is
    seen, the window. This one switches off what is not seen, the command. One may have the first
    without the second and hold that order has been made.

    The highest category in the whole group, it being the one item bearing on the carrying out of
    code and not on the showing of a window. The rest of the group takes away the bidding to a doing,
    this one takes the doing itself.
