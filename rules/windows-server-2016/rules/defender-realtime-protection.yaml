id: win2016-defender-realtime-protection

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Real-time Protection
  title:
    pl: Ochrona w czasie rzeczywistym włączona
    en: Real-time protection switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza sprawdzanie plików w chwili, gdy są otwierane,
    zapisywane lub uruchamiane, zamiast dopiero przy skanowaniu
    zaplanowanym.

    Różnica jest różnicą czasu, a czas jest tutaj wszystkim. Skanowanie
    zaplanowane znajduje złośliwy plik w nocy — czyli po tym, jak został
    uruchomiony, po tym, jak zaszyfrował dane albo wysłał je dalej.
    Sprawdzanie w czasie rzeczywistym działa przed uruchomieniem, więc
    wyłapuje rzecz, zanim cokolwiek zrobi.

    Na serwerze ma to sens szczególny. Pliki trafiają na niego z zewnątrz
    przez udziały sieciowe, przez wgrywanie na stronę, przez kopie zapasowe
    i przez katalogi wymiany. Każda z tych dróg prowadzi do zapisu pliku —
    a każdy zapis jest momentem, w którym sprawdzanie w czasie rzeczywistym
    ma szansę zadziałać.

    Drugim zastosowaniem, mniej oczywistym, jest ochrona klientów. Serwer
    plików, na którym leży rzecz złośliwa, rozsyła ją dalej przy każdym
    otwarciu udziału. Sprawdzanie przy zapisie zatrzymuje ją przy wejściu,
    a nie przy wyjściu.

    Wyłączone sprawdzanie w czasie rzeczywistym jest zarazem najczęstszym
    stanem serwerów utrzymywanych przez lata — wyłączono je kiedyś, żeby coś
    działało szybciej, i nikt do tego nie wrócił.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    umieszczenia i uruchomienia pliku bez jakiegokolwiek sprawdzenia
    w chwili, która ma znaczenie, czyli przed wykonaniem.
  en: |
    The setting switches on the checking of files at the moment they are opened,
    saved or run, instead of at a scheduled scan alone.

    The difference is one of time, and time is everything here. A scheduled scan
    finds a malicious file at night - which is to say after it has been run, after
    it has encrypted data or sent it on. Real-time checking works before running, so
    it catches the thing before it does anything.

    On a server this makes particular sense. Files reach it from outside through
    network shares, through uploads to a site, through backups and through exchange
    directories. Each of those roads leads to a file being written - and every write
    is a moment at which real-time checking stands a chance of working.

    The second use, less obvious, is the protection of clients. A file server with
    something malicious lying on it passes it on at every opening of the share.
    Checking at the write stops it at the entrance rather than at the exit.

    Real-time checking switched off is at the same time the commonest state of
    servers kept for years - it was switched off once so that something might run
    faster, and nobody ever came back to it.

    What an attacker gains while the item goes unmet: the means of placing and
    running a file with no check whatever at the moment that matters, which is to
    say before execution.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to jedyny punkt w bloku,
    przy którym koszt bywa naprawdę odczuwalny.

    Sprawdzanie w czasie rzeczywistym dotyka każdego otwarcia pliku. Na
    maszynie, która otwiera pliki rzadko, nie znaczy to nic. Na maszynie,
    której rolą jest otwieranie plików bez przerwy, znaczy to wiele — i to
    jest właśnie opis serwera bazy danych, serwera plików, hosta
    wirtualizacji albo serwera kopii zapasowych.

    Dlatego wdrożenie zaczyna się nie od włączenia, tylko od wyłączeń.
    Producenci ról serwerowych publikują wykazy katalogów i rozszerzeń,
    które należy pominąć — pliki baz danych, dyski maszyn wirtualnych,
    magazyny kopii. Włączenie sprawdzania bez tych wyłączeń daje maszynę
    działającą poprawnie i wyraźnie wolniej, a zgłoszenie brzmi wtedy
    „aplikacja zwolniła", nie „włączono ochronę".

    Rzecz druga, groźniejsza od spowolnienia: pliki blokowane w czasie
    rzeczywistym bywają plikami roboczymi roli. Baza danych, której plik
    został zablokowany w trakcie zapisu, potrafi się zatrzymać. Przypadki te
    są rzadkie, ale dotkliwe, i również tu odpowiedzią są wyłączenia.

    Trzecia rzecz dotyczy chwili wdrożenia: po włączeniu następuje zwykle
    skanowanie, które samo w sobie obciąża maszynę. Warto zrobić to poza
    godzinami pracy.

    Czego to nie psuje: usług, logowania, łączności, pracy innego programu
    ochronnego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and it is the one item in the block
    where the cost can really be felt.

    Real-time checking touches every opening of a file. On a machine that opens
    files seldom that means nothing. On a machine whose role is to open files
    without pause it means a great deal - and that is just the description of a
    database server, a file server, a virtualisation host or a backup server.

    Rollout therefore begins not with the switching on but with the exclusions. The
    makers of server roles publish lists of directories and extensions to be passed
    over - database files, virtual machine disks, backup stores. Switching the
    checking on without those exclusions gives a machine working properly and
    markedly more slowly, and the report then reads "the application has slowed
    down", not "protection was switched on".

    The second thing, graver than a slowdown: files blocked in real time are at
    times the role's working files. A database whose file has been blocked in the
    course of a write can halt. Such cases are rare but painful, and here too the
    answer is exclusions.

    The third thing concerns the moment of rollout: switching on is as a rule
    followed by a scan which burdens the machine in itself. Worth doing outside
    working hours.

    What this does not break: services, signing in, connectivity, or the working of
    another protection program.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Serwer bazy danych, serwer plików, host wirtualizacji i serwer kopii zapasowych pracujące bez wyłączeń dla roli zwalniają w sposób odczuwalny
      - Plik roboczy roli zablokowany w trakcie zapisu potrafi zatrzymać bazę danych, a przypadki te są rzadkie i dotkliwe
      - Po włączeniu następuje skanowanie, które samo obciąża maszynę, więc warto zrobić to poza godzinami pracy
      - Zgłoszenie brzmi zwykle aplikacja zwolnila, a nie wlaczono ochrone, więc przyczyna bywa szukana gdzie indziej
    en:
      - A database server, a file server, a virtualisation host and a backup server working without exclusions for their role slow down noticeably
      - A working file of the role blocked in the course of a write can halt a database, and such cases are rare and painful
      - Switching on is followed by a scan which burdens the machine in itself, so it is worth doing outside working hours
      - The report as a rule reads the application has slowed down rather than protection was switched on, so the cause is at times looked for elsewhere
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przygotowano wyłączeń zalecanych przez producenta dla roli, którą ta maszyna pełni
      - Maszyna pracuje pod obciążeniem, którego nie można podnieść, a skanowanie po włączeniu jest nieuniknione
      - Rola maszyny opiera się na plikach otwieranych bez przerwy i nie sprawdzono, czy blokada w trakcie zapisu ją zatrzyma
    en:
      - The exclusions the maker recommends for the role this machine fills have not been prepared
      - The machine works under a load that cannot be raised, while a scan after switching on is unavoidable
      - The machine's role rests on files opened without pause and it has not been checked whether a blocking during a write will halt it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableRealtimeMonitoring) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableRealtimeMonitoring'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the exclusions that the machine's role calls for before this runs,
    # and not after the first report of an application working slowly.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRealtimeMonitoring' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Uwaga o wyłączeniach siedzi wprost w poleceniu naprawczym, a nie tylko
    w opisie, bo jest to warunek wdrożenia, a nie jego szczegół. Reguła
    wykonana bez przygotowania kończy się zgłoszeniem o spowolnieniu, które
    zostaje powiązane z czym innym, a wtedy ochrona bywa wyłączana ponownie
    — i tym razem na stałe.

    Kategoria krytyczna odpowiada temu, co punkt daje. Jest to jedyna
    warstwa w całej ochronie przed złośliwym oprogramowaniem działająca
    przed wykonaniem. Wszystko pozostałe, łącznie ze skanowaniem
    zaplanowanym, działa po nim.

    Audyt czyta stan działający, a nie wpis, i odróżnia maszynę z innym
    programem ochronnym od maszyny bez ochrony. Rozróżnienie to jest tu
    ważniejsze niż gdzie indziej, bo w obu przypadkach ochrona wbudowana
    stoi z boku, a znaczą one rzeczy przeciwne.
  en: |
    The remark about exclusions sits in the remedial command outright, and not in
    the description alone, since it is a condition of rollout rather than a detail
    of it. The rule run without preparation ends in a report of a slowdown which
    gets tied to something else, and then the protection is at times switched off
    again - this time for good.

    The critical category answers to what the item gives. It is the one layer in the
    whole malware protection working before execution. Everything else, the
    scheduled scan included, works after it.

    The audit reads the working state rather than the entry, and tells a machine
    with another protection program from a machine with no protection. That
    distinction matters more here than elsewhere, since in both cases the built-in
    protection stands aside, while the two mean opposite things.
