id: ubuntu2404-sudo-timestamp-timeout

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.2.6
  section: Access Control > Configure privilege escalation
  title:
    pl: Czas ważności uwierzytelnienia sudo jest poprawnie ustawiony
    en: Ensure sudo authentication timeout is configured correctly
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Po podaniu hasła sudo przez pewien czas nie pyta o nie ponownie
    w tym samym terminalu. Im dłuższy ten czas, tym dłużej pozostawiony
    terminal albo proces uruchomiony w nim przez kogoś innego może
    wykonywać polecenia jako root bez hasła.

    Punkt wymaga, żeby czas ten wynosił najwyżej 15 minut i nie był
    nieograniczony.
  en: |
    After the password is entered, sudo does not ask for it again in the
    same terminal for some time. The longer this time, the longer a
    terminal left alone, or a process started in it by someone else, can
    run commands as root without a password.

    The item requires this time to be at most 15 minutes and not unlimited.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sudo w Ubuntu ma domyślnie 15 minut, co jest
    zgodne. Jeśli wcześniej ustawiono dłuższy czas, sudo częściej prosi
    o hasło.
  en: |
    Nobody will notice: sudo on Ubuntu has 15 minutes by default, which is
    compliant. If a longer time was set before, sudo asks for the password
    more often.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Brak znanych skutków przy wartości domyślnej; przy wcześniej dłuższym czasie sudo częściej pyta o hasło
    en:
      - No known effects with the default value; with a longer time set before, sudo asks for the password more often
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v sudo >/dev/null 2>&1; then echo NOT_APPLICABLE; exit 0; fi
    sudo_flat() {
      local so
      command -v cvtsudoers >/dev/null 2>&1 || return 1
      so=$(cvtsudoers -f sudoers /etc/sudoers 2>/dev/null) || return 1
      printf '%s\n' "$so" | awk '{ if (sub(/\\$/, "")) { buf = buf $0; next } print buf $0; buf = "" }'
    }
    # One "binding<TAB>parameter" line per Defaults parameter, in sudoers order;
    # binding is empty for global Defaults, else e.g. ":alice" or "@host".
    sudo_defs() {
      local sf
      sf=$(sudo_flat) || return 1
      printf '%s\n' "$sf" | awk '
        /^Defaults/ {
          match($0, /^Defaults([:@>!][^ \t]*)?/)
          bind = substr($0, 9, RLENGTH - 8); rest = substr($0, RLENGTH + 1)
          p = ""; q = 0
          for (i = 1; i <= length(rest); i++) {
            c = substr(rest, i, 1)
            if (c == "\"") q = !q
            if (c == "," && !q) { emit(bind, p); p = ""; continue }
            p = p c
          }
          emit(bind, p)
        }
        function emit(b, s) { gsub(/^[ \t]+|[ \t]+$/, "", s); gsub(/[ \t]*=[ \t]*/, "=", s); if (s != "") print b "\t" s }'
    }
    evaluate() {
      local d g o v s
      d=$(sudo_defs) || { echo CHECK_ERROR; return 0; }
      g=$(printf '%s\n' "$d" | awk -F'\t' '$1 == "" && ($2 ~ /^timestamp_timeout=/ || $2 == "!timestamp_timeout") { v = $2 } END { print v }')
      # Entries for selected users, hosts or commands above 15 minutes or without a limit.
      o=$(printf '%s\n' "$d" | awk -F'\t' '$1 != "" && $2 ~ /^timestamp_timeout=/ { x = substr($2, 19); gsub(/"/, "", x); if (x + 0 > 15 || x + 0 < 0) print "Defaults" $1 }' | sort -u | paste -sd, -)
      case "$g" in
        "!timestamp_timeout") v=0 ;;
        timestamp_timeout=*) v=${g#timestamp_timeout=}; v=${v#\"}; v=${v%\"} ;;
        *) v=$(LC_ALL=C sudo -V 2>/dev/null | sed -n 's/^Authentication timestamp timeout: \(-\{0,1\}[0-9.]*\) minutes$/\1/p' | head -n 1)
           [ -n "$v" ] || { echo CHECK_ERROR; return 0; } ;;
      esac
      if [ -n "$g" ]; then s="timestamp_timeout=$v"; else s="timestamp_timeout=$v(default)"; fi
      if [ -n "$o" ]; then echo "NOT_OK:$s,by-hand:$o"
      elif awk -v v="$v" 'BEGIN { exit !(v + 0 >= 0 && v + 0 <= 15) }'; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
    r=$(evaluate)
    echo "$r"
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/sudoers.d/sentin-harden-timestamp-timeout
      mkdir -p "$(dirname "$b")"
      {
        echo format=sudodef-1
        if [ -f "$f" ]; then echo existed=1; cat "$f"; else echo existed=0; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/sudoers.d/sentin-harden-timestamp-timeout
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=sudodef-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    sudo_flat() {
      local so
      command -v cvtsudoers >/dev/null 2>&1 || return 1
      so=$(cvtsudoers -f sudoers /etc/sudoers 2>/dev/null) || return 1
      printf '%s\n' "$so" | awk '{ if (sub(/\\$/, "")) { buf = buf $0; next } print buf $0; buf = "" }'
    }
    # One "binding<TAB>parameter" line per Defaults parameter, in sudoers order;
    # binding is empty for global Defaults, else e.g. ":alice" or "@host".
    sudo_defs() {
      local sf
      sf=$(sudo_flat) || return 1
      printf '%s\n' "$sf" | awk '
        /^Defaults/ {
          match($0, /^Defaults([:@>!][^ \t]*)?/)
          bind = substr($0, 9, RLENGTH - 8); rest = substr($0, RLENGTH + 1)
          p = ""; q = 0
          for (i = 1; i <= length(rest); i++) {
            c = substr(rest, i, 1)
            if (c == "\"") q = !q
            if (c == "," && !q) { emit(bind, p); p = ""; continue }
            p = p c
          }
          emit(bind, p)
        }
        function emit(b, s) { gsub(/^[ \t]+|[ \t]+$/, "", s); gsub(/[ \t]*=[ \t]*/, "=", s); if (s != "") print b "\t" s }'
    }
    evaluate() {
      local d g o v s
      d=$(sudo_defs) || { echo CHECK_ERROR; return 0; }
      g=$(printf '%s\n' "$d" | awk -F'\t' '$1 == "" && ($2 ~ /^timestamp_timeout=/ || $2 == "!timestamp_timeout") { v = $2 } END { print v }')
      # Entries for selected users, hosts or commands above 15 minutes or without a limit.
      o=$(printf '%s\n' "$d" | awk -F'\t' '$1 != "" && $2 ~ /^timestamp_timeout=/ { x = substr($2, 19); gsub(/"/, "", x); if (x + 0 > 15 || x + 0 < 0) print "Defaults" $1 }' | sort -u | paste -sd, -)
      case "$g" in
        "!timestamp_timeout") v=0 ;;
        timestamp_timeout=*) v=${g#timestamp_timeout=}; v=${v#\"}; v=${v%\"} ;;
        *) v=$(LC_ALL=C sudo -V 2>/dev/null | sed -n 's/^Authentication timestamp timeout: \(-\{0,1\}[0-9.]*\) minutes$/\1/p' | head -n 1)
           [ -n "$v" ] || { echo CHECK_ERROR; return 0; } ;;
      esac
      if [ -n "$g" ]; then s="timestamp_timeout=$v"; else s="timestamp_timeout=$v(default)"; fi
      if [ -n "$o" ]; then echo "NOT_OK:$s,by-hand:$o"
      elif awk -v v="$v" 'BEGIN { exit !(v + 0 >= 0 && v + 0 <= 15) }'; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
      revert() {
        if [ "$(sed -n 2p "$b")" = existed=1 ]; then
          rt=$(mktemp /etc/sudoers.d/.sentin-harden.XXXXXX)
          tail -n +3 "$b" > "$rt"; chmod 0440 "$rt"; mv -f "$rt" "$f"
        else rm -f "$f"; fi
      }
      r=$(evaluate)
      case "$r" in
        OK*) echo "sudo already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        CHECK_ERROR*) echo "Cannot read the sudo configuration with cvtsudoers" >&2; exit 1 ;;
        *by-hand:*) echo "A Defaults entry for some users, hosts or commands sets this item; change it by hand with visudo: ${r#NOT_OK:}" >&2; exit 1 ;;
      esac
      visudo -c >/dev/null 2>&1 || { echo "The sudo configuration is already invalid; fix it with visudo -c first" >&2; exit 1; }
      # sudo skips files in sudoers.d whose names contain a dot, so it never reads the temp file.
      t=$(mktemp /etc/sudoers.d/.sentin-harden.XXXXXX)
      printf '%s\n' '# Sentin-Harden' 'Defaults timestamp_timeout=15' > "$t"
      chmod 0440 "$t"
      if ! visudo -cqf "$t" >/dev/null 2>&1; then rm -f "$t"; echo "visudo rejects the new file; nothing changed" >&2; exit 1; fi
      mv -f "$t" "$f"
      # A broken sudoers would lock out sudo, so check everything at once.
      if ! visudo -c >/dev/null 2>&1; then revert; echo "visudo rejects the configuration; restored the previous state" >&2; exit 1; fi
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) revert; echo "sudo does not meet the item after the change ($r), for example because a later Defaults entry wins over $f; restored the previous state" >&2; exit 1 ;;
      esac
      echo "Set Defaults timestamp_timeout=15 in $f"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/sudoers.d/sentin-harden-timestamp-timeout
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=sudodef-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      ex=$(sed -n '2s/^existed=//p' "$b")
      case "$ex" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ "$ex" = 1 ]; then
        # Only comments and the Defaults lines of this rule may come back.
        if tail -n +3 "$b" | grep -Evq -e '^(#.*)?$' -e '^Defaults timestamp_timeout=-?[0-9]+([.][0-9]+)?$'; then
          echo "Backup file is damaged: $b" >&2; exit 1
        fi
        t=$(mktemp /etc/sudoers.d/.sentin-harden.XXXXXX)
        tail -n +3 "$b" > "$t"
        chmod 0440 "$t"
        if ! visudo -cqf "$t" >/dev/null 2>&1; then rm -f "$t"; echo "visudo rejects the saved file; nothing changed" >&2; exit 1; fi
        old=$(mktemp /etc/sudoers.d/.sentin-harden-old.XXXXXX)
        if [ -f "$f" ]; then cp -p "$f" "$old"; else rm -f "$old"; fi
        mv -f "$t" "$f"
        if ! visudo -c >/dev/null 2>&1; then
          if [ -f "$old" ]; then mv -f "$old" "$f"; else rm -f "$f"; fi
          echo "visudo rejects the configuration with the saved file; nothing changed" >&2; exit 1
        fi
        rm -f "$old"
        echo "Restored $f"
      else
        rm -f "$f"
        echo "Removed $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://www.sudo.ws/docs/man/sudoers.man/
  - https://www.sudo.ws/docs/man/cvtsudoers.man/

notes:
  pl: |
    Sprawdzenie czyta konfigurację sudo poleceniem cvtsudoers, które
    wypisuje /etc/sudoers razem z dołączanymi plikami w tej samej
    kolejności, w jakiej czyta je sudo, i pomija te same pliki, np. pliki
    z kropką w nazwie w /etc/sudoers.d. Brak sudo daje wynik NOT_APPLICABLE.

    Naprawa zapisuje wiersz Defaults w pliku /etc/sudoers.d/sentin-harden-timestamp-timeout z uprawnieniami 0440.
    Najpierw sprawdza nowy plik, a potem całą konfigurację poleceniem
    visudo -c; gdy visudo ją odrzuca albo późniejszy wpis Defaults wygrywa,
    przywraca poprzedni stan i kończy się błędem, żeby nie odciąć dostępu do
    sudo. Gdy wartość ustawia wpis Defaults dla wybranych użytkowników,
    komputerów lub poleceń, naprawa nic nie zmienia i prosi o ręczną
    poprawkę przez visudo. Wycofanie usuwa plik albo przywraca jego
    poprzednią treść po sprawdzeniu jej przez visudo.

    Wynik OK wymaga, żeby ostatni globalny wpis ustawiał timestamp_timeout
    od 0 do 15 minut, a bez takiego wpisu, żeby domyślna wartość z sudo -V
    mieściła się w tym zakresie; -1 oznacza brak limitu. sudo w Ubuntu ma
    domyślnie 15 minut, więc świeży system spełnia punkt. Wpisy dla
    wybranych użytkowników, komputerów lub poleceń z wartością ponad 15 albo
    ujemną trzeba zmienić ręcznie. Naprawa ustawia 15 minut, czyli
    najdłuższy dopuszczalny czas, żeby jak najmniej zmieniać dotychczasowe
    działanie.
  en: |
    The check reads the sudo configuration with cvtsudoers, which prints
    /etc/sudoers together with its included files in the order sudo reads
    them and skips the same files, such as files with a dot in the name in
    /etc/sudoers.d. No sudo gives the NOT_APPLICABLE result.

    The remediation writes a Defaults line to /etc/sudoers.d/sentin-harden-timestamp-timeout with the mode 0440. It
    first checks the new file and then the whole configuration with
    visudo -c; when visudo rejects it or a later Defaults entry wins, it
    restores the previous state and ends with an error, so that sudo access
    is not cut off. When a Defaults entry for selected users, hosts or
    commands sets the value, the remediation changes nothing and asks for a
    manual fix with visudo. Rollback removes the file or restores its
    previous content after checking it with visudo.

    The OK result requires the last global entry to set timestamp_timeout
    from 0 to 15 minutes, and without such an entry, the default value from
    sudo -V to be in that range; -1 means no limit. sudo on Ubuntu has 15
    minutes by default, so a fresh system meets the item. Entries for
    selected users, hosts or commands with a value above 15 or below 0 have
    to be changed by hand. The remediation sets 15 minutes, the longest
    allowed time, to change the current behaviour as little as possible.
