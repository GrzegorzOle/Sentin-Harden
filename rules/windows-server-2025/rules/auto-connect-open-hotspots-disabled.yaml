id: win2025-auto-connect-open-hotspots-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > WLAN Service > WLAN Settings
  title:
    pl: Automatyczne łączenie z otwartymi sieciami bezprzewodowymi wyłączone
    en: Automatic connection to open wireless networks switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Domyślnie system potrafi sam przyłączyć maszynę do otwartej sieci
    bezprzewodowej sugerowanej przez usługę wyszukującą takie sieci.
    Przyłączenie następuje bez pytania i bez żadnego sprawdzenia, czyja
    ta sieć jest.

    Podszycie się pod taką sieć nie wymaga niczego poza nadajnikiem
    i nazwą. Napastnik ogłasza otwartą sieć, maszyna się do niej
    przyłącza, a od tej chwili cały jej ruch przechodzi przez jego
    sprzęt — łącznie z tym, co maszyna wysyła sama z siebie, zanim
    ktokolwiek cokolwiek zrobi.

    Trzymam kategorię wysoką i nie obniżam jej mimo tego, że wiele
    serwerów radia nie ma. Powód jest inny niż przy sąsiednich regułach
    z menedżera połączeń: tam mechanizm dotyczy czegoś, co i tak musi
    zostać wywołane. Tutaj przyłączenie jest samoczynne. Jeżeli maszyna
    ma radio, to wystarczy, że ono jest — nikt niczego nie musi kliknąć,
    a serwer nie ma komu tego zauważyć.

    Jest tu jeszcze jedna rzecz właściwa serwerom. Radio w maszynie
    bywa nie dlatego, że ktoś go chciał, tylko dlatego, że było na
    płycie albo w karcie kupionej z innego powodu. Nieużywane, nikomu
    niepotrzebne i przez to nieoglądane — a mimo to włączone. Kod
    nieużywany nie jest kodem nieszkodliwym; jest kodem nieobejrzanym,
    a to samo dotyczy nadajnika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość przyłączenia serwera do własnej sieci samym jej
    ogłoszeniem, bez udziału kogokolwiek po drugiej stronie.
  en: |
    By default the system can join the machine itself to an open wireless net put forward by the
    service that seeks such nets. The joining happens with no asking and with no checking at all of
    whose that net is.

    The taking on of such a net's guise needs nothing beyond a sender and a name. The attacker
    announces an open net, the machine joins it, and from that moment all its traffic passes
    through their gear - that which the machine sends of itself among it, before anybody does
    anything at all.

    I keep the category high and lower it not for all that many servers have no radio. The ground
    is other than at the neighbouring rules out of the manager of connections - there the mechanism
    bears on something that must be called upon anyway. Here the joining is of itself. If the
    machine has a radio, its being there is enough - nobody need click anything, and a server has
    nobody to mark it.

    There is here one thing more proper to servers. A radio is in a machine at times not because
    anybody wanted it but because it was on the board, or in a card bought for another reason.
    Unused, needed by nobody and therefore unlooked at - and switched on all the same. Code unused
    is not code harmless; it is code unexamined, and the same holds of a sender.

    What an attacker gains while the item goes unmet: the means of joining the server to a net of
    their own by the mere announcing of it, with nobody's part in it on the other side.

disruption_description:
  pl: |
    Na serwerze bez karty bezprzewodowej zmiana nie robi nic i nie ma
    czego sprawdzać.

    Na serwerze z radiem sprawdzenia wymaga jedna rzecz: czy maszyna
    korzysta z sieci otwartej, do której przyłącza się sama. Jeżeli tak,
    po zmianie przestanie — i to jest cały skutek. Sieci zapisane
    z hasłem działają bez zmiany, bo punkt dotyczy wyłącznie
    przyłączania się do sieci otwartych podpowiedzianych przez system,
    a nie do tych, które ktoś skonfigurował.

    Klasę podnoszę względem paczki stanowiska roboczego z jednego
    powodu, który powtarza się w tej paczce: serwer bywa zarządzany
    właśnie przez to połączenie. Maszyna postawiona tymczasowo, sprzęt
    w oddziale bez okablowania, urządzenie w trakcie uruchamiania —
    jeżeli trzyma łączność przez sieć otwartą, zmiana odetnie ją przy
    następnej próbie przyłączenia.

    Dlatego przed zmianą sprawdź, przez co ta maszyna jest połączona,
    a nie tylko, czy ma radio. To są dwa różne pytania.

    Zapis do konfiguracji usługi wiąże od razu dla kolejnych prób
    przyłączenia. Połączenie już zestawione nie zostaje zerwane — ale
    nie zostanie też odtworzone, gdy raz odpadnie.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    On a server with no wireless card the change does nothing and there is nothing to check.

    On a server with a radio one thing needs checking - whether the machine uses an open net it
    joins of itself. If so, after the change it will stop - and that is the whole effect. Nets
    written down with a word of passage work unaltered, the item bearing on the joining of open
    nets put forward by the system alone and not of those somebody set up.

    I raise the class against the working station's pack for one ground that comes again through
    this pack - a server is at times managed by that very connection. A machine set up for a time,
    gear in a branch with no cabling, a device in the course of being brought up - if it holds its
    link by an open net, the change will cut it at the next try at joining.

    Therefore before the change look at what this machine is joined by, and not only at whether it
    has a radio. Those are two sundry questions.

    The writing into the service's setup binds at once for the tries at joining that follow. A
    connection already set up is not broken - but neither will it be made anew once it falls away.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Maszyna przestanie sama przyłączać się do otwartych sieci bezprzewodowych podpowiadanych przez system
      - Serwer trzymający łączność przez sieć otwartą straci ją przy następnej próbie przyłączenia
      - Sieci zapisane z hasłem działają bez zmiany, punkt ich nie dotyczy
      - Połączenie już zestawione nie zostaje zerwane, ale nie odtworzy się, gdy raz odpadnie
      - Na serwerze bez karty bezprzewodowej zmiana nie robi zupełnie nic
    en:
      - The machine will stop joining of itself open wireless nets put forward by the system
      - A server holding its link by an open net will lose it at the next try at joining
      - Nets written down with a word of passage work unaltered and the item bears not on them
      - A connection already set up is not broken, but will not be made anew once it falls away
      - On a server with no wireless card the change does nothing at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer trzyma łączność zarządzania przez otwartą sieć bezprzewodową, do której przyłącza się sam
      - Maszyna jest w trakcie uruchamiania w miejscu, gdzie jedyną łącznością jest sieć otwarta
    en:
      - The server holds its link of management by an open wireless net it joins of itself
      - The machine is in the course of being brought up where the only link is an open net
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry sits outside the policy branch, in the service's own
      # configuration, so an absent value means the system default rather than
      # an unset policy - and that default leaves the automatic behaviour on.
      $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
      $name = 'AutoConnectAllowedOEM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
    $name = 'AutoConnectAllowedOEM'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the machine holds its link of management by an open net, this cuts
    # it at the next try at joining. Look at what it is joined by first.
    $path = 'HKLM:\SOFTWARE\Microsoft\wcmsvc\wifinetworkmanager\config'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AutoConnectAllowedOEM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/nativewifi/about-the-native-wifi-api

notes:
  pl: |
    Nie obniżam tu kategorii mimo tego, że wiele serwerów radia nie ma.
    Różnica wobec sąsiednich reguł z menedżera połączeń jest taka, że
    tam mechanizm dotyczy czegoś, co i tak musi zostać wywołane,
    a tutaj przyłączenie jest samoczynne — wystarczy, że radio jest.

    Radio w serwerze bywa nie dlatego, że ktoś go chciał, tylko dlatego,
    że było na płycie. Nieużywane i przez to nieoglądane, a mimo to
    włączone.

    Wartość czytana jest z konfiguracji usługi, a nie z gałęzi zasad,
    więc jej brak znaczy ustawienie domyślne systemu, czyli zachowanie
    samoczynne włączone — a nie zasadę nieustawioną.
  en: |
    I lower not the category here for all that many servers have no radio. The difference from the
    neighbouring rules out of the manager of connections is that there the mechanism bears on
    something that must be called upon anyway, while here the joining is of itself - the radio's
    being there is enough.

    A radio is in a server at times not because anybody wanted it but because it was on the board.
    Unused and therefore unlooked at, and switched on all the same.

    The value is read out of the service's setup and not out of the branch of rules, so its want
    means the system's own default, that is the behaviour of itself switched on - and not a rule
    left unset.
