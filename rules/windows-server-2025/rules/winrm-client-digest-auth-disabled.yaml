id: win2025-winrm-client-digest-auth-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Client
  title:
    pl: Uwierzytelnianie skrótem w kliencie zarządzania zdalnego wyłączone
    en: Digest authentication in the remote management client disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi zarządzania zdalnego posługiwania się
    uwierzytelnianiem skrótem.

    Mechanizm ten był pomyślany jako poprawka uwierzytelniania
    podstawowego: hasło nie idzie w treści żądania, tylko jego skrót
    wyliczony razem z wartością podaną przez drugą stronę. Poprawia to
    jedną rzecz i nie poprawia niczego więcej.

    Nadal jest to uwierzytelnianie jednostronne. Klient nie ma jak
    sprawdzić, z kim rozmawia, a to właśnie po stronie maszyny
    zarządzającej waży najbardziej. Wartość, na podstawie której
    wyliczany jest skrót, podaje ta druga strona — więc kto się pod nią
    podstawi, ten kształtuje materiał, który dostanie z powrotem.

    Skrót nie jest przy tym hasłem jawnym, ale jest materiałem, na
    którym da się pracować bez pośpiechu i bez kontaktu z maszyną.
    Różnica wobec uwierzytelniania podstawowego jest więc różnicą
    czasu, a nie rodzaju.

    Kategorię trzymam średnią i mówię wprost dlaczego: mechanizm ten
    jest w tym miejscu używany rzadko, a maszyny, które go wymagają,
    są rzadkością nawet wśród sprzętu starszego. Punkt zamyka drogę,
    z której prawie nikt nie korzysta — i właśnie dlatego nie ma powodu
    jej zostawiać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wyłudzenia od tego serwera materiału poświadczeniowego
    przez podstawienie się pod maszynę, z którą serwer chciał rozmawiać.
  en: |
    The setting forbids the remote management client to use digest authentication.

    That mechanism was thought out as a mending of basic authentication: the password does not go
    within the body of the request, only its digest reckoned together with a value given by the
    other side. It mends one thing and mends nothing further.

    It is still a one-sided authentication. The client has no way of checking whom it speaks with,
    and it is just that which weighs most at the managing machine's side. The value by which the
    digest is reckoned is given by that other side - so whoever puts themselves in its place shapes
    the matter they will get back.

    The digest is withal not a password in the clear, but it is matter that can be worked upon
    without haste and without touch with the machine. The difference against basic authentication
    is therefore a difference of time and not of kind.

    I keep the category middling and say outright why: that mechanism is in this place seldom used,
    and machines that call for it are a rarity even among older gear. The item shuts a road next to
    nobody uses - and for just that reason there is no cause to leave it.

    What an attacker gains while the item goes unmet: the means of drawing credential matter out of
    this server by putting themselves in the place of the machine the server meant to speak with.

disruption_description:
  pl: |
    Zaliczam ten punkt do klasy bez uciążliwości i podaję powody,
    zamiast opierać się na tym, że zmiana wygląda niewinnie.

    Uwierzytelnianie skrótem dotyczy wyłącznie strony klienckiej,
    czyli połączeń wychodzących z tego serwera. Nie zmienia niczego
    w tym, jak inni łączą się z nim.

    Mechanizm ten nie jest wybierany domyślnie. Klient sięga po niego
    dopiero wtedy, gdy strona przeciwna nie oferuje niczego lepszego,
    a maszyn oferujących wyłącznie to spotyka się w praktyce nie
    spotyka. Połączenia między maszynami Windows korzystają z mechanizmu
    domenowego i zmiana ich nie dotyczy.

    Nie wymaga restartu maszyny ani usługi, nie wymaga wylogowania,
    cofa się natychmiast przez przywrócenie poprzedniej wartości. Sesje
    zarządzania już trwające nie są przerywane.

    Gdyby jednak w danym środowisku istniało urządzenie przyjmujące
    wyłącznie ten mechanizm, objaw będzie jednoznaczny: połączenie do
    niego kończy się odmową uwierzytelnienia zaraz po nawiązaniu.
    Zapisuję to, mimo że przypadek jest skrajnie rzadki — reguła
    w klasie bez uciążliwości też ma mówić, czego szukać, gdy coś
    jednak pójdzie nie tak.
  en: |
    I reckon this item to the class without disruption and give the reasons, rather than resting on
    the change looking harmless.

    Digest authentication bears on the client's side alone, that is on connections going out of
    this server. It changes nothing in how others connect with it.

    That mechanism is not chosen by default. The client reaches for it only where the opposite side
    offers nothing better, and machines offering this alone are in practice not met with.
    Connections between Windows machines use the domain's mechanism and the change does not bear
    upon them.

    It takes no restart of the machine nor of a service, takes no signing off, and is undone at
    once by the setting back of the former value. Sessions of management already running are not
    broken.

    Were there, though, in a given setting a device taking this mechanism alone, the symptom will
    be plain: the connection to it ends in a refusal of authentication right after its opening. I
    write it down though the case is of the rarest - a rule in the class without disruption is to
    say too what to look for where something does go amiss.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Połączenie do urządzenia przyjmującego wyłącznie ten mechanizm zakończy się odmową uwierzytelnienia
      - Ustawienie dotyczy wyłącznie połączeń wychodzących z tego serwera i nie zmienia niczego po stronie przychodzącej
      - Połączenia między maszynami Windows korzystają z mechanizmu domenowego i zmiana ich nie dotyczy
      - Sesje zarządzania już trwające nie są przerywane
    en:
      - A connection to a device taking this mechanism alone will end in a refusal of authentication
      - The setting bears on connections going out of this server alone and changes nothing at the coming-in side
      - Connections between Windows machines use the domain's mechanism and the change does not bear upon them
      - Sessions of management already running are not broken
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W środowisku pracuje urządzenie przyjmujące wyłącznie uwierzytelnianie skrótem
      - Skrypty z tego serwera sięgają do usługi obcej, która innego mechanizmu nie oferuje
    en:
      - A device taking digest authentication alone works in the setting
      - Scripts from this server reach for a foreign service offering no other mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      $name = 'AllowDigest'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowDigest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDigest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Mechanizm miał być poprawką uwierzytelniania podstawowego. Poprawia
    jedno: hasło nie idzie jawnie. Nie poprawia tego, co waży najbardziej
    po stronie maszyny zarządzającej — nadal nie da się sprawdzić, z kim
    się rozmawia.

    Wartość, na podstawie której wyliczany jest skrót, podaje druga
    strona, więc kto się pod nią podstawi, kształtuje materiał, który
    dostanie z powrotem. Różnica wobec uwierzytelniania podstawowego
    jest różnicą czasu, a nie rodzaju.

    Jedna z nielicznych reguł w tej grupie nadająca się do zastosowania
    hurtem: mechanizm nie jest wybierany domyślnie, a maszyn oferujących
    wyłącznie to praktycznie się nie spotyka.
  en: |
    The mechanism was meant as a mending of basic authentication. It mends one thing: the password
    does not go in the clear. It does not mend what weighs most at the managing machine's side -
    there is still no way of checking whom one speaks with.

    The value by which the digest is reckoned is given by the other side, so whoever puts
    themselves in its place shapes the matter they will get back. The difference against basic
    authentication is a difference of time and not of kind.

    One of the few rules in this group fit for applying in bulk: the mechanism is not chosen by
    default, and machines offering this alone are in practice not met with.
