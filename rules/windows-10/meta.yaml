id: windows-10
nazwa: Windows 10
rodzina: windows
powloka: powershell
profil: workstation

benchmark:
  nazwa: CIS Microsoft Windows 10 Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 1 = stacja robocza. Windows 10 to numer kompilacji poniżej 22000.
  dopasowanie: '^Microsoft Windows 10 .*\|(1[0-9]{4}|2[01][0-9]{3})\|1$'

uwagi: |
  Windows 10 wszedł w fazę wygaszania wsparcia — przy planowaniu hardeningu warto
  sprawdzić, czy maszyna nie powinna być najpierw podniesiona do Windows 11.
  Część reguł ma tu odpowiedniki o innych nazwach kluczy niż w Windows 11;
  nie zakładaj, że plik reguły da się przenieść między paczkami bez weryfikacji.
