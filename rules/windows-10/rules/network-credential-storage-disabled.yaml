id: win10-network-credential-storage-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie poświadczeń do uwierzytelniania sieciowego wyłączone
    en: The keeping of credentials for network authentication switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisywania na tej maszynie poświadczeń służących
    do uwierzytelniania wobec zasobów sieciowych.

    Magazyn poświadczeń zapamiętuje hasła, żeby nie trzeba ich było
    wpisywać ponownie. Wygoda jest realna i właśnie dlatego punkt jest
    poziomu drugiego, a nie pierwszego — koszt jest odczuwalny w pracy
    codziennej każdego dnia.

    Zysk jest równie konkretny. Poświadczenia zapisane są celem samym
    w sobie: napastnik po przejęciu maszyny nie musi czekać, aż ktoś się
    zaloguje, żeby cokolwiek zebrać. Zebrane hasła bywają przy tym hasłami
    do zasobów, których na tej maszynie nie ma.

    Odnotowuję granicę reguły, bo bywa przeceniana. Ustawienie nie usuwa
    poświadczeń już zapisanych; zabrania zapisywania nowych. Wyczyszczenie
    magazynu jest czynnością osobną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła do
    zasobów sieciowych zapisane na tej maszynie, dostępne bez czekania na
    czyjekolwiek logowanie.
  en: |
    The setting forbids the writing upon this machine of credentials serving to authenticate against network
    resources.

    The credential store remembers passwords so that they need not be typed again. The convenience is real, and
    for just that the item is of the second level and not the first - the cost is felt in everyday work every
    day.

    The gain is as plain. Credentials written down are a mark in themselves: an attacker, having taken the
    machine, need not wait for somebody to log in before gathering anything. The passwords gathered are at times
    passwords to resources this machine has not.

    I set down the rule's bound, it being at times overrated. The setting does not take away credentials already
    written; it forbids the writing of new ones. The emptying of the store is an act apart.

    What an attacker gains while the item goes unmet: passwords to network resources written upon this machine,
    to be had without waiting for anybody's logging on.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co na
    tej maszynie z magazynu korzysta.

    Skutek dla człowieka jest natychmiastowy i widoczny: hasła do udziałów,
    do drukarek sieciowych i do aplikacji sieciowych przestają być
    zapamiętywane i trzeba je wpisywać przy każdym połączeniu. Przy pracy
    z kilkoma zasobami jest to kilka pytań dziennie.

    Skutek dla automatyzacji bywa gorszy, bo cichy. Zadania uruchamiane
    harmonogramem i skrypty korzystające z zapamiętanych poświadczeń
    przestaną się uwierzytelniać. Objaw pojawi się w dzienniku zadania,
    a nie przed człowiekiem.

    Odnotowuję, że reguła nie czyści magazynu. Poświadczenia zapisane
    wcześniej pozostają i działają, więc zmiana bywa początkowo
    niezauważalna — a to prowadzi do wniosku, że nic się nie stało.

    Czego to nie psuje: logowania, kont domenowych, uprawnień do zasobów,
    drukowania przez kolejkę lokalną, aplikacji lokalnych.
  en: |
    The class is "needs review", and the object of the review is what upon this machine uses the store.

    The consequence to a person is immediate and plain: passwords to shares, to network printers and to network
    applications cease being remembered and have to be typed at every joining. Working with several resources,
    that is a few questions a day.

    The consequence to automation is at times the worse, being quiet. Tasks started by a schedule and scripts
    using remembered credentials will cease authenticating. The symptom will come up in a task's log, not before
    a person.

    I set down that the rule does not empty the store. Credentials written earlier stay and work, so the change
    is at first at times unnoticed - and that leads to the conclusion that nothing has happened.

    What this does not break: logging on, domain accounts, the rights upon resources, printing through a local
    queue, or local applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - scripting-and-automation
    - printing
  what_breaks:
    pl:
      - Hasła do udziałów, drukarek sieciowych i aplikacji sieciowych przestają być zapamiętywane i trzeba je wpisywać za każdym razem
      - Zadania uruchamiane harmonogramem i skrypty korzystające z zapamiętanych poświadczeń przestają się uwierzytelniać
      - Objaw po stronie automatyzacji pojawia się w dzienniku zadania, a nie przed człowiekiem
      - Poświadczenia zapisane wcześniej pozostają i działają, więc zmiana bywa początkowo niezauważalna
      - Logowanie, konta domenowe, uprawnienia do zasobów i drukowanie przez kolejkę lokalną pozostają bez zmian
    en:
      - Passwords to shares, to network printers and to network applications cease being remembered and have to be typed each time
      - Tasks started by a schedule and scripts using remembered credentials cease authenticating
      - The symptom on the automation side comes up in a task s log, not before a person
      - Credentials written earlier stay and work, so the change is at first at times unnoticed
      - Logging on, domain accounts, the rights upon resources and printing through a local queue stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działają zadania albo skrypty opierające się na poświadczeniach zapamiętanych w magazynie
      - Praca codzienna opiera się na kilku zasobach sieciowych i dodatkowe pytania o hasło są nie do przyjęcia
    en:
      - Tasks or scripts resting upon credentials remembered in the store work upon the machine
      - Everyday work rests upon several network resources and further questions about a password are not to be borne
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key belongs to the authentication subsystem and is always there, so its
      # absence is a fault rather than a state worth reporting apart.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'DisableDomainCreds'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'DisableDomainCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # New credentials cease being written; those written earlier stay and go on
    # working. Emptying the store is an act apart, and without it the change is at
    # first unnoticed.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableDomainCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-storage-of-passwords-and-credentials-for-network-authentication

notes:
  pl: |
    Reguła jest w tym bloku jedyną poziomu drugiego i warto, żeby aplikacja
    pokazywała ten poziom razem z klasą uciążliwości. Koszt jest tu
    odczuwalny codziennie, więc odpuszczenie z zapisanym uzasadnieniem
    bywa decyzją poprawną — i aplikacja powinna wprost na to pozwolić.

    Odnotowuję granicę, bo prowadzi do fałszywego poczucia załatwienia
    sprawy. Reguła zabrania zapisywania nowych poświadczeń i nie rusza
    zapisanych wcześniej. Maszyna zgodna z tym punktem może nadal trzymać
    w magazynie komplet haseł sprzed zmiany.

    Warto, żeby aplikacja przy tej regule zaproponowała czynność drugą:
    przejrzenie i wyczyszczenie magazynu. Bez niej punkt daje zgodność
    w raporcie, a nie zmianę stanu.
  en: |
    The rule is the only one in this block of the second level, and it is well that the application show that
    level beside the class of disruption. The cost here is felt daily, so letting it go with a written
    justification is at times a sound decision - and the application ought to allow that outright.

    I set down the bound, it leading to a false sense of the matter being settled. The rule forbids the writing
    of new credentials and touches not those written earlier. A machine compliant with this item may still hold
    in its store a full set of passwords from before the change.

    It is well that the application offer, at this rule, a second act: the looking over and emptying of the
    store. Without it the item gives compliance in a report and not a change of state.
