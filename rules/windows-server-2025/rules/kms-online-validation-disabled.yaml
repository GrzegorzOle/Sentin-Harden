id: win2025-kms-online-validation-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Software Protection Platform
  title:
    pl: Sprawdzanie licencji w sieci przez klienta serwera aktywacji wyłączone
    en: Online licence validation by the activation server's client switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza dodatkowe sprawdzanie licencji w sieci producenta przez
    maszynę aktywowaną z własnego serwera aktywacji organizacji.

    Kategoria niska i chcę tu być szczery zamiast dorabiać tej regule wagę,
    której nie ma. Ten punkt nie broni przed napastnikiem. On usuwa jedno
    połączenie wychodzące, które w maszynie aktywowanej wewnętrznie nie
    pełni żadnej roli — licencja jest potwierdzana we własnej sieci
    organizacji, a to sprawdzenie jest sprawdzeniem dodatkowym.

    Wartość jest porządkowa i mieści się w dwóch zdaniach. Serwer, który
    ma nie rozmawiać z internetem, powinien rzeczywiście z nim nie
    rozmawiać — a nie mieć jedno połączenie, o którym nikt nie wie, dopóki
    nie zostanie zablokowane i nie okaże się, że coś jednak próbowało
    wyjść. W maszynie stojącej w segmencie odciętym od sieci zewnętrznej
    to połączenie i tak nie przechodzi, a zostawia w dziennikach zapory
    powtarzający się wpis, który po pół roku nikomu już nic nie mówi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    konkretnego. Mówię to wprost, bo lista, na której wszystko wygląda na
    ważne, przestaje być listą.
  en: |
    The item switches off an additional check of the licence against the
    maker's network by a machine activated from the organisation's own
    activation server.

    The category is low, and I want to be honest here rather than invent for
    this rule a weight it does not have. This item does not defend against
    an attacker. It removes one outbound connection which, on a machine
    activated internally, serves no purpose - the licence is confirmed
    within the organisation's own network, and this check is an additional
    one.

    Its value is a matter of order and fits into two sentences. A server
    that is not meant to talk to the internet should genuinely not talk to
    it - rather than have one connection nobody knows about until it gets
    blocked and it turns out something was trying to get out after all. On a
    machine standing in a segment cut off from the outside network that
    connection does not get through anyway, and it leaves in the firewall
    logs a repeating entry that tells nobody anything after six months.

    What an attacker gains while the item goes unmet: nothing in particular.
    I say so plainly, because a list on which everything looks important
    stops being a list.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie jest krótkie, bo zmiana jest
    krótka. Aktywacja maszyny nie zależy od tego sprawdzenia. Maszyna
    aktywowana z wewnętrznego serwera pozostaje aktywowana, odnawia
    aktywację tak samo i nie zmienia stanu licencji w żadną stronę.

    Nikt tego nie zobaczy w codziennej pracy, nie ma tu restartu ani
    wylogowania, a cofnięcie jest natychmiastowe.

    Jedno zastrzeżenie, które wolę postawić, chociaż nie zmienia klasy:
    to ustawienie ma sens przy aktywacji z wewnętrznego serwera
    organizacji. Na maszynie aktywowanej inaczej — kluczem przypisanym do
    maszyny albo przez usługę producenta — wpis ten po prostu nie ma na co
    działać. Nie zaszkodzi, ale też nie zrobi nic, a w sprawozdaniu będzie
    wyglądał na zabezpieczenie.

    Nie jest to powód, żeby reguły nie stosować, i nie podnoszę jej
    z tego powodu wyżej. Jest to powód, żeby wiedzieć, co się właściwie
    zapisało.
  en: |
    The class is "no disruption", and the justification is short because the
    change is short. The machine's activation does not depend on this check.
    A machine activated from an internal server stays activated, renews its
    activation the same way, and does not move the licence state in either
    direction.

    Nobody will see this in daily work, there is no restart or sign-out
    here, and undoing it is immediate.

    One caveat I would rather state, though it does not change the class:
    this setting makes sense with activation from the organisation's
    internal server. On a machine activated otherwise - with a key assigned
    to the machine, or through the maker's service - this entry simply has
    nothing to act on. It will do no harm, but it will do nothing either,
    and in a report it will look like a protection.

    That is not a reason to leave the rule unapplied, and I do not raise it
    higher on that account. It is a reason to know what has actually been
    written down.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
  what_breaks:
    pl:
      - Nic nie przestaje działać — aktywacja maszyny nie zależy od tego sprawdzenia
      - Maszyna aktywowana z wewnętrznego serwera pozostaje aktywowana i odnawia aktywację tak samo
      - Na maszynie aktywowanej inaczej wpis nie ma na co działać i w sprawozdaniu będzie wyglądał na zabezpieczenie
      - Znika jedno połączenie wychodzące, które w segmencie odciętym od sieci i tak nie przechodziło
    en:
      - Nothing stops working - the machine's activation does not depend on this check
      - A machine activated from an internal server stays activated and renews its activation the same way
      - On a machine activated otherwise the entry has nothing to act on and in a report will look like a protection
      - One outbound connection disappears, which in a cut-off segment was not getting through anyway
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna nie jest aktywowana z wewnętrznego serwera organizacji, więc wpis ten nie ma na co działać
    en:
      - The machine is not activated from the organisation's internal server, so this entry has nothing to act on
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key name holds a space - quoting the whole path is required.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoGenTicket'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
    $current = (Get-ItemProperty -Path $path -Name 'NoGenTicket' -ErrorAction SilentlyContinue).'NoGenTicket'
    [pscustomobject]@{
      path        = $path
      name        = 'NoGenTicket'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The additional check against the maker's network; activation from an
    # internal server does not depend on it. On a machine activated otherwise
    # this entry has nothing to act on.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoGenTicket' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/get-started/kms-activation-planning

notes:
  pl: |
    Wartość tej reguły jest porządkowa i mówię to wprost, zamiast dorabiać
    jej wagę, której nie ma. Serwer, który ma nie rozmawiać z internetem,
    powinien rzeczywiście z nim nie rozmawiać — a nie mieć jedno
    połączenie, o którym nikt nie wie, dopóki nie zostanie zablokowane.

    W segmencie odciętym od sieci zewnętrznej to połączenie i tak nie
    przechodzi, a zostawia w dziennikach zapory powtarzający się wpis,
    który po pół roku nikomu nic nie mówi.

    Zastrzeżenie: na maszynie aktywowanej inaczej niż z wewnętrznego
    serwera wpis nie ma na co działać. Nie zaszkodzi, ale w sprawozdaniu
    będzie wyglądał na zabezpieczenie.
  en: |
    This rule's value is a matter of order, and I say so plainly rather than
    invent a weight it does not have. A server that is not meant to talk to
    the internet should genuinely not talk to it - rather than have one
    connection nobody knows about until it gets blocked.

    In a segment cut off from the outside network that connection does not
    get through anyway, and it leaves in the firewall logs a repeating entry
    that tells nobody anything after six months.

    A caveat: on a machine activated other than from an internal server the
    entry has nothing to act on. It will do no harm, but in a report it will
    look like a protection.
