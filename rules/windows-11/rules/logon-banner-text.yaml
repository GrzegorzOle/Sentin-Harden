id: win11-logon-banner-text

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Treść komunikatu wyświetlanego przed zalogowaniem ustawiona
    en: The body of the message shown before signing in set
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Komunikat wyświetlany przed logowaniem składa się z tytułu i treści.
    Punkt dotyczy treści i to ona niesie tu cały ciężar — tytuł jest nagłówkiem,
    a oświadczenie mieści się poniżej.

    To, o czym komunikat ma mówić, sprowadza się do trzech rzeczy: że dostęp
    mają wyłącznie osoby upoważnione, że korzystanie z maszyny jest
    rejestrowane i że dane oraz zapis z dziennika należą do organizacji.
    Żadna z nich nie jest zabezpieczeniem technicznym; wszystkie trzy bywają
    rozstrzygające, gdy przychodzi cokolwiek z incydentu wyciągnąć.

    Zdanie o rejestrowaniu jest tu najważniejsze i najczęściej pomijane.
    Zbieranie zapisu o tym, co ludzie robią na stanowisku, bywa podważane jako
    obserwowanie ich bez wiedzy — a wraz z nim podważany bywa cały materiał
    dowodowy. Komunikat przed logowaniem jest najprostszym sposobem, żeby tego
    zarzutu nie było.

    Punkt wymaga, żeby treść była ustawiona i niepusta. Brzmienie jest decyzją
    organizacji i powinno być uzgodnione z kimś, kto odpowiada w niej za sprawy
    prawne.
  en: |
    The message shown before signing in has a title and a body. The item concerns the
    body, and it is the body that carries the whole weight here - the title is a
    heading and the declaration sits below it.

    What the message should say comes down to three things: that only authorised
    people have access, that use of the machine is recorded, and that the data and the
    log record belong to the organisation. None of them is a technical safeguard; all
    three can be decisive when something has to be made of an incident.

    The sentence about recording is the most important here and the most often left
    out. Gathering a record of what people do at a station gets challenged as watching
    them without their knowledge - and the whole body of evidence gets challenged
    along with it. A message before signing in is the simplest way of leaving no room
    for that charge.

    The item requires the body to be set and not empty. The wording is the
    organisation's decision and should be agreed with whoever answers for its legal
    matters.

disruption_description:
  pl: |
    Zmiana dokłada wszystkim ekran do potwierdzenia przed logowaniem, więc
    wymaga świadomego wdrożenia i uprzedzenia ludzi. Skutki są te same co przy
    tytule, bo obie części składają się na jedno okno.

    Każdy użytkownik zobaczy przy każdym logowaniu dodatkowe okno i dodatkowe
    kliknięcie. Logowanie bez człowieka — automatyczne przy starcie, kioskowe,
    testowe po restarcie — zatrzyma się na tym oknie. Sesje pulpitu zdalnego
    uruchamiane ze skryptu mogą wymagać dodatkowego potwierdzenia.

    Jest jedna różnica względem tytułu i wynika z długości. Treść bywa długa,
    a okno przed logowaniem nie przewija się dobrze na małych ekranach
    i w sesjach zdalnych o niskiej rozdzielczości. Komunikat na kilkanaście
    zdań bywa nieczytelny dokładnie tam, gdzie miał być przeczytany. Krótka
    treść działa lepiej niż wyczerpująca.

    Punkt działa w parze z tytułem, opisanym osobną regułą. Treść bez tytułu
    wyświetla się z pustym nagłówkiem, a tytuł bez treści nie wyświetla się
    w ogóle — obie części wdraża się razem.

    Nie ma restartu, ale skutek widać dopiero przy następnym logowaniu.
  en: |
    The change adds a screen to confirm before signing in for everybody, so it calls
    for a deliberate rollout and for telling people beforehand. The effects are the
    same as with the title, because both parts make up one window.

    Every user sees an added window and an added click at every sign-in. Signing in
    with no person present - automatic at start, kiosk, test machines after a restart
    - stops at this window. Remote desktop sessions started from a script may need an
    added confirmation.

    There is one difference from the title and it comes from length. A body can be
    long, and the window before signing in does not scroll well on small screens or in
    remote sessions at a low resolution. A message of a dozen or more sentences turns
    out unreadable exactly where it was meant to be read. A short body works better
    than an exhaustive one.

    The item works in a pair with the title, described by a rule of its own. A body
    without a title is shown with an empty heading, and a title without a body is not
    shown at all - both parts are applied together.

    There is no restart, but the effect shows only at the next sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Każdy użytkownik zobaczy dodatkowe okno do potwierdzenia przy każdym logowaniu
      - Automatyczne zalogowanie przy starcie zatrzyma się na tym oknie
      - Długa treść bywa nieczytelna na małych ekranach i w sesjach zdalnych o niskiej rozdzielczości
      - Uruchamianie sesji pulpitu zdalnego ze skryptu może wymagać dodatkowego potwierdzenia
    en:
      - Every user sees an added window to confirm at every sign-in
      - Automatic sign-in at start stops at this window
      - A long body turns out unreadable on small screens and in remote sessions at a low resolution
      - Starting a remote desktop session from a script may need an added confirmation
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna loguje się sama przy starcie i pracuje bez obsługi
      - Stanowisko pracuje w trybie kioskowym albo jako maszyna testowa wstająca po restarcie
    en:
      - The machine signs in by itself at start and works unattended
      - The station works in kiosk mode or as a test machine coming up after a restart
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is kept as text, but a policy set earlier can leave it as a
      # list of lines. Both forms are joined before the emptiness check.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticetext'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      else {
        $joined = if ($value -is [array]) { [string]::Join(' ', $value) } else { [string]$value }
        if ($joined.Trim() -eq '') { 'EMPTY' } else { 'SET' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: SET
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticetext'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item.
    # Agree the organisation's own wording before rolling this out widely.
    $message = 'This system is for the use of authorised people only. ' +
      'Use of it is recorded, and the records belong to the organisation ' +
      'that owns this machine.'
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'legalnoticetext' -Value $message -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-text-for-users-attempting-to-log-on

notes:
  pl: |
    Reguła sprawdza wyłącznie to, czy treść jest ustawiona i niepusta. Brzmienia
    nie ocenia — to, czy komunikat spełnia swoje zadanie, rozstrzyga prawo
    miejscowe, a nie benchmark.

    Wpis wstawiany przez naprawę jest punktem wyjścia. Zanim trafi na wiele
    stanowisk, powinien zostać zastąpiony brzmieniem uzgodnionym w organizacji.

    Wpis bywa zapisany jako pojedynczy tekst albo jako lista wierszy, zależnie
    od tego, czym go ustawiono. Reguła czyta obie postaci; naprawa zapisuje
    pojedynczy tekst, bo tylko ta postać jest ustawiana przez zasady i tylko
    ona wyświetla się zgodnie z oczekiwaniem we wszystkich wydaniach systemu.

    Gałąź zasad systemowych jest wspólna z kilkudziesięcioma innymi
    ustawieniami, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The rule checks only whether the body is set and not empty. It does not judge the
    wording - whether the message does its job is settled by local law, not by the
    benchmark.

    The entry the remediation writes is a starting point. Before it reaches many
    stations it should be replaced with the wording agreed in the organisation.

    The entry is sometimes kept as a single text and sometimes as a list of lines,
    depending on what set it. The rule reads both forms; the remediation writes a
    single text, because only that form is set by policy and only it is shown as
    expected across all editions of the system.

    The system policies key is shared with several dozen other settings, so rollback
    removes the entry alone.
