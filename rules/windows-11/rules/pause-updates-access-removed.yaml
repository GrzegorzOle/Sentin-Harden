id: win11-pause-updates-access-removed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Wstrzymywanie aktualizacji niedostępne dla użytkownika
    en: Pausing updates unavailable to the user
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    W ustawieniach aktualizacji jest przycisk wstrzymujący je na kilka tygodni.
    Powstał dla kogoś, kto ma przed sobą termin i nie chce ryzykować restartu —
    i w tej roli bywa potrzebny.

    Kłopot polega na tym, że wstrzymanie obejmuje wszystko, łącznie z poprawkami
    zamykającymi podatności wykorzystywane w danej chwili, a decyzja zapada
    jednym kliknięciem, bez śladu i bez powiadomienia kogokolwiek. Maszyna znika
    z cyklu poprawek na kilka tygodni i nikt poza osobą, która kliknęła, nie ma
    o tym pojęcia. Po upływie terminu wstrzymanie można przedłużyć.

    Skutek dla zarządzania jest taki sam jak przy odkładaniu restartu: maszyna
    wygląda na objętą aktualizacjami, a nie jest. Usunięcie przycisku nie odbiera
    prawa do wstrzymania — przenosi je tam, gdzie decyzja zostawia ślad.
  en: |
    The update settings carry a button pausing them for a few weeks. It was made
    for somebody facing a deadline who does not want to risk a restart - and in
    that role it is sometimes needed.

    The trouble is that a pause covers everything, including fixes closing
    weaknesses being exploited at that very moment, and the decision is taken with
    one click, leaving no trace and notifying nobody. The machine drops out of the
    fix cycle for several weeks and nobody but the person who clicked has any idea.
    Once the term is up, the pause can be extended.

    The effect on management is the same as with deferring a restart: the machine
    looks covered by updates and is not. Removing the button does not take away
    the right to pause - it moves that right to where the decision leaves a trace.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś z tego przycisku korzysta i dlaczego, bo
    powód bywa dobry.

    Użytkownik przestanie móc samodzielnie wstrzymać aktualizacje przed
    prezentacją, przed wyjazdem czy w dniu, w którym maszyna musi po prostu
    działać. Przycisk znika z ustawień, a nie przestaje działać po naciśnięciu —
    więc nie będzie zgłoszeń o błędzie, tylko o brakującej opcji.

    Praktyczny skutek to przeniesienie decyzji na obsługę. Tam, gdzie obsługa
    jest dostępna i umie takie wstrzymanie założyć, kosztuje to jeden telefon.
    Tam, gdzie obsługi nie ma, użytkownik zostaje bez wyjścia i przy najbliższym
    restarcie w złym momencie przypomni sobie o tym przycisku.

    Wstrzymanie już założone przed zastosowaniem punktu pozostaje w mocy do
    końca swojego terminu — przycisk znika, ale nie cofa tego, co już zrobił.
  en: |
    What needs checking is whether anybody uses the button and why, because the
    reason is sometimes a good one.

    The user can no longer pause updates themselves before a presentation, before
    a trip, or on a day when the machine simply has to work. The button vanishes
    from the settings rather than failing when pressed - so there will be no
    reports of an error, only of a missing option.

    The practical effect is that the decision moves to support. Where support is
    available and knows how to set such a pause, it costs one phone call. Where
    there is no support, the user is left without a way out and will remember the
    button at the next restart at a bad moment.

    A pause already set before the item is applied stays in force until its term
    runs out - the button disappears, but it does not undo what it has already
    done.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Użytkownik przestanie móc samodzielnie wstrzymać aktualizacje przed ważnym terminem
      - Przycisk znika z ustawień, więc zgłoszenie będzie dotyczyło brakującej opcji, a nie błędu
      - Wstrzymanie założone wcześniej pozostaje w mocy do końca swojego terminu
    en:
      - The user can no longer pause updates themselves ahead of an important deadline
      - The button vanishes from the settings, so reports will be about a missing option rather than an error
      - A pause set earlier stays in force until its term runs out
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownicy pracują bez dostępnej obsługi, która mogłaby wstrzymać aktualizacje za nich
      - Stanowisko bywa używane w sytuacjach, w których restart jest niedopuszczalny i trzeba móc go odsunąć na miejscu
    en:
      - Users work without support on hand that could pause updates for them
      - The station is sometimes used in situations where a restart is unacceptable and has to be pushed back on the spot
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      $name = 'SetDisablePauseUXAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $name = 'SetDisablePauseUXAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SetDisablePauseUXAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-configure-wufb

notes:
  pl: |
    Punkt należy do tej samej rodziny co odkładanie restartu przy zalogowanym
    użytkowniku i czyta się je razem, ale różnią się tym, kto podejmuje decyzję.
    Tamten opisuje zachowanie systemu; ten odbiera wybór człowiekowi. Maszyna
    spełniająca tamten punkt nadal potrafi stać kilka tygodni bez poprawek,
    jeśli ktoś nacisnął ten przycisk.

    Reguła jest wart uwagi przykład na to, że uciążliwość zależy od organizacji,
    a nie od maszyny. Tam, gdzie jest obsługa, kosztuje telefon; tam, gdzie jej
    nie ma, zabiera jedyne wyjście awaryjne, jakie użytkownik miał.
  en: |
    The item belongs to the same family as deferring a restart while a user is
    signed in, and the two are read together, but they differ in who takes the
    decision. That one describes the system's behaviour; this one takes the choice
    away from a person. A machine satisfying that item can still stand for weeks
    without fixes if somebody pressed this button.

    The rule is a worthwhile example of disruption depending on the organisation
    rather than on the machine. Where there is support it costs a phone call;
    where there is none it removes the only way out the user had.
