id: win10-load-driver-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Ładowanie sterowników zastrzeżone dla administratorów
    en: The loading of drivers reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo ładowania i usuwania sterowników urządzeń
    dla administratorów lokalnych.

    Sterownik nie jest zwykłym programem i warto to powiedzieć wprost.
    Działa w jądrze, czyli w tej samej warstwie, która rozstrzyga
    o uprawnieniach wszystkich pozostałych programów. Kod umieszczony tam
    nie podlega już żadnej kontroli — sam jest kontrolą.

    Prawo załadowania sterownika jest więc równoważne przejęciu maszyny
    w całości. Można nim wyłączyć zabezpieczenia, ukryć procesy przed
    listą zadań, przechwycić operacje na plikach i odczytać pamięć
    dowolnego programu. Żaden mechanizm działający w przestrzeni
    użytkownika tego nie powstrzyma, bo wszystkie stoją wyżej.

    Droga ta jest dodatkowo wygodna dla napastnika, bo nie wymaga pisania
    własnego sterownika. Wystarczy sterownik podpisany, wydany legalnie,
    w wersji zawierającej znaną podatność — a takich jest wiele i są
    publicznie dostępne.

    Odnotowuję, że sprawdzenie przyjmuje wykaz węższy niż wymagany.
    Maszyna ustawiona ostrzej nie jest niezgodna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście do
    jądra, czyli ponad wszystkie zabezpieczenia maszyny naraz.
  en: |
    The setting reserves the right of loading and unloading device drivers to the local administrators.

    A driver is no ordinary program, and it is worth saying so outright. It works in the kernel, which is to say
    in that same layer that settles the rights of every other program. Code set there stands under no watching any
    more - it is itself the watching.

    The right of loading a driver is therefore the same as the taking of the machine whole. By it the guardings
    may be switched off, processes hidden from the list of tasks, doings upon files taken over and the memory of
    any program at all read. No mechanism working in the user's room will hold that back, all of them standing
    above.

    That road is besides a handy one for an attacker, calling for no driver of their own writing. A signed driver
    is enough, lawfully issued, in a version holding a known weakness - and there are many such and they are
    openly to be had.

    I set down that the check takes a list narrower than the one called for. A machine set the stricter is not out
    of compliance.

    What an attacker gains while the item goes unmet: an entry into the kernel, which is to say above every
    guarding of the machine at once.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy ktoś
    poza administratorami ładuje sterowniki w ramach normalnej pracy.

    Miejscem najczęstszym jest oprogramowanie wirtualizacyjne
    i narzędzia diagnostyczne. Część z nich ładuje własny sterownik przy
    starcie i robi to z konta użytkownika, jeżeli prawo zostało mu nadane
    przy instalacji. Po zmianie takie narzędzie zgłosi błąd i nie wystartuje.

    Miejscem drugim są programy do obsługi urządzeń podłączanych doraźnie:
    klucze sprzętowe, czytniki, przyrządy pomiarowe. Instalacja sterownika
    przy pierwszym podłączeniu bywa wykonywana z konta użytkownika.

    Sprawdzenie polega na przeczytaniu wykazu przed zmianą. Wpis inny niż
    administratorzy oznacza, że coś tego prawa używa.

    Odnotowuję, że domyślny wykaz zawiera już samych administratorów.
    Na maszynie, której nikt w tym miejscu nie zmieniał, zmiana jest
    zapisem stanu.

    Skutek pojawia się przy następnym zalogowaniu konta, które prawo
    traci. Sterownik już załadowany działa dalej.

    Czego to nie psuje: pracy z urządzeniami mającymi sterownik już
    zainstalowany, logowania, dostępu do plików, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody beyond the administrators loads
    drivers in the ordinary course of work.

    The commonest place is software of virtualisation and tools of diagnosis. Some of them load a driver of their
    own at their start and do so from a user's account where the right was granted to it at the installing. After
    the change such a tool will report a fault and will not start.

    The second place is programs handling apparatus plugged in as need arises: keys of gear, readers, instruments
    of measuring. The installing of a driver at the first plugging in is at times done from a user's account.

    The review comes down to a reading of the list before the change. An entry other than the administrators means
    something uses this right.

    I set down that the default list already holds the administrators alone. Upon a machine nobody has changed in
    that place the change is a setting down of a state.

    The consequence shows at the next signing in of an account that loses the right. A driver already loaded works
    on.

    What this does not break: work with apparatus whose driver is already installed, logging on, the way to files,
    or printing.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - accounts-and-passwords
  what_breaks:
    pl:
      - Oprogramowanie wirtualizacyjne ładujące własny sterownik z konta użytkownika nie wystartuje
      - Instalacja sterownika przy pierwszym podłączeniu klucza sprzętowego albo czytnika przestanie się udawać z konta zwykłego
      - Wpis inny niż administratorzy oznacza, że coś na maszynie tego prawa używa
      - Sterownik już załadowany działa dalej, a skutek pojawia się przy następnym zalogowaniu
      - Praca z urządzeniami mającymi sterownik zainstalowany, logowanie, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - Software of virtualisation loading a driver of its own from a user s account will not start
      - The installing of a driver at the first plugging in of a key of gear or a reader will cease to come through from an ordinary account
      - An entry other than the administrators means something upon the machine uses this right
      - A driver already loaded works on, and the consequence shows at the next signing in
      - Work with apparatus whose driver is installed, logging on, the way to files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Użytkownicy instalują sterowniki urządzeń doraźnie podłączanych i nie ma kto robić tego za nich
      - Na maszynie stoi oprogramowanie wirtualizacyjne ładujące własny sterownik z konta użytkownika
    en:
      - The users install the drivers of apparatus plugged in as need arises and there is nobody to do it for them
      - Upon the machine stands software of virtualisation loading a driver of its own from a user s account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeLoadDriverPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeLoadDriverPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeLoadDriverPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeLoadDriverPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeLoadDriverPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/load-and-unload-device-drivers

notes:
  pl: |
    Reguła jest w całym bloku o przywilejach najostrzejsza w skutkach
    i warto, żeby aplikacja pokazała ją obok punktu o debugowaniu. Oba
    dają dostęp do wszystkiego, ale tamten przez odczyt pamięci,
    a ten przez wejście do warstwy, która pamięcią zarządza.

    Argument wart postawienia wprost dotyczy tego, że napastnik nie musi
    pisać sterownika. Wystarczy mu sterownik cudzy — podpisany przez
    uznanego wydawcę, w wersji, w której znaleziono błąd. System załaduje
    go bez zastrzeżeń, bo podpis jest prawidłowy, a błąd w kodzie nie jest
    częścią podpisu. Jest to droga stara, dobrze opisana i wciąż
    skuteczna.

    Odnotowuję, że reguła nie broni przed administratorem. Administrator
    lokalny ładuje sterowniki z definicji i nie da się tego rozdzielić.
    Wartość polega na tym, że nikt inny tego nie zrobi — a konto usługowe
    z jednym nadanym prawem przestaje być drogą do jądra.
  en: |
    The rule is of the whole block about privileges the sharpest in its effects, and it is well that the
    application show it beside the item about debugging. Both give a way to everything, but that one by the
    reading of memory and this by an entry into the layer that rules memory.

    The argument worth putting outright touches this, that an attacker need write no driver. Somebody else's
    driver is enough - signed by a known issuer, in a version in which a fault was found. The system will load it
    without demur, the signature being right and the fault in the code being no part of the signature. It is an
    old road, well set out and working still.

    I set down that the rule does not guard against an administrator. A local administrator loads drivers by
    definition and that cannot be parted. The worth lies in this, that nobody else will - and a service account
    with one right granted ceases to be a road into the kernel.
