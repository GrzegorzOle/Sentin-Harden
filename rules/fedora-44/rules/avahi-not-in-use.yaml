id: fedora44-avahi-not-in-use

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.1.2
  section: Services > Configure Server Services
  title:
    pl: Usługa Avahi nie jest używana
    en: Ensure avahi daemon services are not in use
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Avahi ogłasza w sieci lokalnej nazwę komputera i jego usługi (mDNS
    i DNS-SD) i odnajduje usługi innych urządzeń, np. drukarki i udziały.
    Każdy w tej samej sieci widzi dzięki temu, jaki to komputer i co
    udostępnia, a sam demon przyjmuje pakiety multicast z całej sieci
    lokalnej.

    Punkt wymaga, żeby Avahi nie był zainstalowany albo żeby jego gniazdo
    i usługa nie były włączone ani uruchomione. Na Fedorze Workstation oba
    są domyślnie włączone.
  en: |
    Avahi announces the computer's name and services on the local network
    (mDNS and DNS-SD) and finds the services of other devices, for example
    printers and shares. Anyone on the same network can therefore see what
    the computer is and what it offers, and the daemon itself accepts
    multicast packets from the whole local network.

    The item requires that Avahi is not installed or that its socket and
    service are neither enabled nor running. On Fedora Workstation both are
    enabled by default.

disruption_description:
  pl: |
    Użytkownicy zauważą, że nowe drukarki sieciowe nie pojawiają się same
    w ustawieniach drukowania, a w menedżerze plików nie widać komputerów
    i udziałów z sieci lokalnej. Nazwy kończące się na .local przestają się
    rozwiązywać. Drukarki dodane wcześniej pod stałym adresem działają dalej.
  en: |
    Users will notice that new network printers do not appear on their own in
    the printing settings, and the file manager does not show computers and
    shares from the local network. Names ending in .local stop resolving.
    Printers added before with a fixed address keep working.

implementation_consequences:
  impact_areas:
    - printing
    - file-sharing
    - network-and-firewall
  what_breaks:
    pl:
      - Drukarki sieciowe nie są odnajdywane automatycznie; trzeba je dodać po adresie
      - Menedżer plików nie pokazuje komputerów i udziałów z sieci lokalnej
      - Nazwy .local, np. drukarka.local albo nazwa-komputera.local, nie są rozwiązywane
      - Inne komputery nie widzą tego komputera ani jego udostępnionych usług w sieci lokalnej
    en:
      - Network printers are not found automatically; they have to be added by address
      - The file manager does not show computers and shares from the local network
      - ".local names, such as printer.local or computer-name.local, are not resolved"
      - Other computers do not see this computer or its shared services on the local network
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || ! command -v rpm >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then
      echo CHECK_ERROR; exit 0
    fi
    state() {
      bad=""
      for u in avahi-daemon.socket avahi-daemon.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        a=$(systemctl is-active "$u" 2>/dev/null) || true
        case "$e" in
          enabled|enabled-runtime|linked|linked-runtime) ;;
          *) case "$a" in active|activating|reloading) ;; *) continue ;; esac ;;
        esac
        bad="$bad,$u=${e:-none}/${a:-unknown}"
      done
      inst=""
      for p in avahi; do if rpm -q --quiet "$p"; then inst="$inst,$p"; fi; done
      if [ -n "$bad" ]; then echo "IN_USE:${bad#,}"
      elif [ -z "$inst" ]; then echo NOT_INSTALLED
      else echo "NOT_IN_USE:${inst#,}"; fi
    }
    state
  expected: '^(NOT_INSTALLED$|NOT_IN_USE:)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=units-1
        for u in avahi-daemon.socket avahi-daemon.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          echo "$u ${e:--} ${a:--}"
        done
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      state() {
        bad=""
        for u in avahi-daemon.socket avahi-daemon.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          case "$e" in
            enabled|enabled-runtime|linked|linked-runtime) ;;
            *) case "$a" in active|activating|reloading) ;; *) continue ;; esac ;;
          esac
          bad="$bad,$u=${e:-none}/${a:-unknown}"
        done
        inst=""
        for p in avahi; do if rpm -q --quiet "$p"; then inst="$inst,$p"; fi; done
        if [ -n "$bad" ]; then echo "IN_USE:${bad#,}"
        elif [ -z "$inst" ]; then echo NOT_INSTALLED
        else echo "NOT_IN_USE:${inst#,}"; fi
      }
      m=""
      for u in avahi-daemon.socket avahi-daemon.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        case "$e" in ""|not-found) continue ;; esac
        l=/etc/systemd/system/$u
        if { [ -e "$l" ] || [ -L "$l" ]; } && [ "$(readlink "$l")" != /dev/null ]; then
          echo "$l is a unit file or link of its own, not masking $u" >&2; exit 1
        fi
        m="$m $u"
      done
      if [ -z "$m" ]; then echo "None of the units is installed, nothing to change"; exit 0; fi
      systemctl mask --now $m
      s=$(state)
      case "$s" in IN_USE:*) echo "The units are still in use ($s)" >&2; exit 1 ;; esac
      echo "Stopped and masked:$m ($s)"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=units-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      lines=$(tail -n +2 "$b")
      [ -n "$lines" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      while read -r u e a x; do
        case " avahi-daemon.socket avahi-daemon.service " in *" $u "*) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$e$a" in *[!a-z-]*|"") echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        if [ -z "$a" ] || [ -n "$x" ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$lines"
      start=""
      while read -r u e a; do
        case "$e" in
          -|not-found|masked) continue ;;
          masked-runtime) systemctl unmask "$u"; systemctl mask --runtime "$u"; continue ;;
        esac
        systemctl unmask "$u"
        case "$e" in
          enabled) systemctl enable "$u" ;;
          enabled-runtime) systemctl enable --runtime "$u" ;;
          linked|linked-runtime) echo "Could not link $u again; link its unit file by hand" >&2 ;;
        esac
        case "$a" in active|activating|reloading) start="$start $u" ;; esac
      done <<< "$lines"
      if [ -n "$start" ]; then systemctl start $start; fi
      echo "Restored the previous state of the units"
    )

privileges: root
runnable: true

sources:
  - https://avahi.org/
  - https://github.com/avahi/nss-mdns
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

notes:
  pl: |
    Punkt jest spełniony, gdy pakiet nie jest zainstalowany albo gdy żadna
    z jednostek avahi-daemon.socket, avahi-daemon.service nie jest włączona ani uruchomiona. Wynik IN_USE
    wymienia jednostki w użyciu razem ze stanem z systemctl is-enabled
    i is-active, a NOT_IN_USE pakiety, które są zainstalowane, ale nie
    działają.

    Naprawa nie usuwa pakietów, bo mogą od nich zależeć inne programy.
    Zatrzymuje i maskuje jednostki poleceniem systemctl mask --now, więc nie
    da się ich uruchomić ręcznie, przez gniazdo ani jako zależność. Kopia
    zapisuje stan każdej jednostki, a wycofanie zdejmuje maskę, włącza
    jednostki, które były włączone, i uruchamia te, które działały.
    Jednostki zamaskowane wcześniej zostają zamaskowane. Naprawa odmawia,
    gdy w /etc/systemd/system leży własny plik jednostki o tej samej nazwie.

    Jeśli usługa ma zniknąć całkiem, można usunąć pakiet przez dnf remove
    po sprawdzeniu, co jeszcze zostałoby usunięte.

    Na Fedorze Workstation avahi-daemon jest włączony domyślnie, a nazwy
    .local rozwiązuje moduł mdns4_minimal z nss-mdns, który pyta avahi.
    systemd-resolved ma na Fedorze wyłączony własny mDNS, więc go nie
    zastępuje. Warto najpierw sprawdzić, czy w sieci są drukarki lub udziały
    odnajdywane automatycznie.
  en: |
    The item is met when the package is not installed or when none of the
    avahi-daemon.socket, avahi-daemon.service units is enabled or running. The IN_USE result lists the units in
    use with their state from systemctl is-enabled and is-active, and
    NOT_IN_USE lists the packages that are installed but not running.

    The remediation does not remove packages, because other programs may
    depend on them. It stops and masks the units with systemctl mask --now,
    so they cannot be started by hand, through a socket or as a dependency.
    The backup records the state of every unit, and rollback removes the
    mask, enables the units that were enabled and starts the ones that were
    running. Units that were masked before stay masked. The remediation
    refuses when /etc/systemd/system holds a unit file of its own with the
    same name.

    If the service should be gone completely, the package can be removed with
    dnf remove after checking what else would be removed.

    On Fedora Workstation avahi-daemon is enabled by default, and .local names
    are resolved by the mdns4_minimal module from nss-mdns, which asks avahi.
    systemd-resolved has its own mDNS turned off on Fedora, so it does not
    take over. It is worth checking first whether the network has printers or
    shares that are found automatically.
