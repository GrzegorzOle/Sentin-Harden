id: win2025-restrict-ntlm-outgoing

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Ograniczenie wychodzącego ruchu NTLM do serwerów zdalnych
    en: Restriction of outgoing NTLM traffic to remote servers
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm uwierzytelniania sieciowego ma wadę, której nie da
    się naprawić ustawieniami: maszyna wysyła odpowiedź wyliczoną z hasła
    do serwera, z którym się łączy, nie sprawdziwszy wcześniej, czy to
    serwer właściwy. Kto skłoni ją do połączenia u siebie, dostaje materiał
    do złamania hasła albo do przekazania dalej wobec maszyny trzeciej.

    Na serwerze ruch wychodzący tego rodzaju bywa pomijany w rozważaniach,
    bo serwer kojarzy się z przyjmowaniem połączeń, nie z nawiązywaniem.
    Jest to złudzenie. Serwer sięga po udziały sieciowe przy kopiach
    zapasowych, po źródła aktualizacji, po serwery dziennika i po inne
    serwery aplikacyjne — a każde z tych połączeń niesie poświadczenia.

    Poświadczenia te są przy tym cenniejsze niż na stanowisku roboczym.
    Usługi serwerowe pracują na kontach o szerokich uprawnieniach,
    często w całej domenie. Wymuszenie jednego takiego połączenia daje
    napastnikowi znacznie więcej niż wymuszenie połączenia ze stanowiska.

    Punkt pozwala najpierw zobaczyć skalę zjawiska, a potem je zatrzymać.
    Rejestrowanie pokazuje, do których serwerów maszyna faktycznie używa
    tego mechanizmu; odmowa zamyka drogę. Kolejność ta nie jest
    ostrożnością na wyrost — bez wykazu odmowa jest strzałem w ciemno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wywabienia z serwera poświadczeń konta usługowego przez samo skłonienie
    go do połączenia pod wskazany adres.
  en: |
    The older mechanism of network authentication has a fault no settings can mend: the
    machine sends an answer reckoned from a password to the server it connects to, without
    having checked beforehand that it is the right server. Whoever draws it into connecting
    with them gets matter for breaking the password or for passing on against a third
    machine.

    On a server outgoing traffic of this kind is at times passed over in the reckoning, since
    a server calls to mind the taking of connections rather than the making of them. That is
    a delusion. A server reaches for network shares at backups, for sources of updates, for
    log servers and for other application servers - and each of those connections carries
    credentials.

    Those credentials are at that more valuable than at a working station. Server services
    work under accounts of wide rights, often across a whole domain. Forcing one such
    connection gives an attacker far more than forcing a connection from a station.

    The item lets one first see the scale of the thing and then halt it. The recording shows
    which servers the machine in fact uses this mechanism towards; the refusal shuts the road.
    That order is no needless caution - without the list a refusal is a shot in the dark.

    What an attacker gains while the item goes unmet: the means of drawing a service account's
    credentials out of the server by the mere leading of it into connecting to a given
    address.

disruption_description:
  pl: |
    Sprawdzenia wymaga wykaz serwerów, z którymi ta maszyna łączy się
    tym mechanizmem, bo dopiero on mówi, co odmowa odetnie.

    Reguła ustawia stan pośredni — rejestrowanie, nie odmowę. Na tym
    etapie nic nie przestaje działać i nikt niczego nie zauważy. Zmienia
    się wyłącznie to, że każde takie połączenie zostawia wpis w dzienniku
    operacyjnym.

    Wpisy te są treścią, dla której punkt istnieje. Po kilku tygodniach —
    a na serwerze okres ten musi objąć cykl miesięczny, bo część zadań
    uruchamia się raz na miesiąc — wykaz jest kompletny i dopiero wtedy
    można przejść do odmowy świadomie.

    Krok drugi, czyli przejście na odmowę, jest już zmianą ciężką
    i celowo nie należy do tej reguły. Odcina połączenia do serwerów
    spoza wykazu wyjątków, a na serwerze potrafi to zatrzymać kopie
    zapasowe, przesyłanie dzienników i integracje z systemami starszymi —
    wszystkie w sposób, który zgłasza się jako odmowa dostępu, a nie jako
    błąd uwierzytelniania.

    Objętość zapisu jest na serwerze większa niż na stanowisku i warto
    o tym wiedzieć przed włączeniem, zwłaszcza przy małym dzienniku
    operacyjnym.
  en: |
    What needs checking is the list of servers this machine connects to by this mechanism,
    since only that says what a refusal would cut off.

    The rule sets a middle state - recording, not refusal. At that stage nothing stops working
    and nobody notices anything. What changes is only that each such connection leaves an
    entry in the operational log.

    Those entries are the content the item exists for. After some weeks - and on a server that
    stretch must take in a monthly cycle, since some tasks run once a month - the list is
    complete, and only then may one pass to refusal knowingly.

    The second step, the passing to refusal, is a heavy change already and deliberately does
    not belong to this rule. It cuts off connections to servers outside the list of
    exceptions, and on a server that can halt backups, the sending of logs and integrations
    with older systems - all in a way that reports itself as a refusal of access rather than
    as a fault of authentication.

    The volume of the record is greater on a server than at a station, and that is worth
    knowing before switching it on, the more so at a small operational log.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - logging-and-audit
    - file-sharing
    - remote-management
  what_breaks:
    pl:
      - Na etapie rejestrowania nic nie przestaje działać i nikt niczego nie zauważy
      - Dziennik operacyjny zaczyna rosnąć, na serwerze szybciej niż na stanowisku
      - Krok drugi, czyli odmowa, potrafi zatrzymać kopie zapasowe i przesyłanie dzienników
      - Odcięcie zgłasza się jako odmowa dostępu, a nie jako błąd uwierzytelniania
      - Wykaz zebrany krócej niż przez miesiąc pomija zadania uruchamiane cyklicznie
    en:
      - At the recording stage nothing stops working and nobody notices anything
      - The operational log starts growing, on a server faster than at a station
      - The second step, the refusal, can halt backups and the sending of logs
      - A cutting off reports itself as a refusal of access rather than a fault of authentication
      - A list gathered for less than a month passes over tasks run on a cycle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik operacyjny jest mały i nie ma miejsca na dodatkowy zapis
    en:
      - The operational log is small and there is no room for an added record
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One records, two refuses. Both count as compliant here, since the
      # benchmark takes a knowing choice rather than one particular value.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'RestrictSendingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[12]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'RestrictSendingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Audit, not deny: refusing without knowing which servers rely on this
    # mechanism cuts access off, and the list only exists once the recording
    # has run through a full monthly cycle.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictSendingNTLMTraffic' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-outgoing-ntlm-traffic-to-remote-servers

notes:
  pl: |
    Sprawdzenie przyjmuje dwie wartości zgodne: rejestrowanie i odmowę.
    Odmowa jest stanem docelowym, ale reguła ustawia rejestrowanie,
    bo przejście do odmowy wymaga wykazu, którego przed rejestrowaniem
    nie ma.

    Serwer sięga po zasoby sieciowe częściej, niż się wydaje — przy
    kopiach zapasowych, aktualizacjach i integracjach. Wykaz zebrany
    przez tydzień bywa niepełny, bo pomija zadania miesięczne.

    Punkt czyta się razem z rejestrowaniem ruchu przychodzącego. Tamten
    mówi, kto łączy się z tą maszyną; ten — dokąd łączy się ona sama.
  en: |
    The check accepts two compliant values: recording and refusal. Refusal is the end state,
    but the rule sets recording, since the passing to refusal takes a list that before the
    recording does not exist.

    A server reaches for network resources oftener than it seems - at backups, updates and
    integrations. A list gathered over a week is at times partial, since it passes over
    monthly tasks.

    The item is read together with the recording of incoming traffic. That one says who
    connects to this machine; this one, where it connects itself.
