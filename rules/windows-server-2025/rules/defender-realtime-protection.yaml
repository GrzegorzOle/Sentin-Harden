id: win2025-defender-realtime-protection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Ochrona w czasie rzeczywistym Microsoft Defender włączona
    en: Microsoft Defender real-time protection enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy ochrona w czasie rzeczywistym faktycznie działa.
    Różnica między nią a skanowaniem według harmonogramu jest różnicą
    między obejrzeniem pliku w chwili zapisu a obejrzeniem go
    w nocy — czyli, w praktyce, przed uruchomieniem albo po.

    Podnoszę kategorię do krytycznej, w odróżnieniu od oceny dla stacji
    roboczej, i powód jest prosty. Stacja robocza zapisuje głównie pliki,
    które ktoś przy niej świadomie otworzył albo pobrał. Serwer zapisuje
    pliki, których nie wybierał: z udziałów sieciowych, z wdrożeń, ze
    zrzutów przychodzących od innych systemów, z kopii zapasowych,
    z katalogów wymiany, do których pisze pół organizacji.

    Jest to więc maszyna, na której najwięcej plików pojawia się bez
    udziału kogokolwiek, kto mógłby się im przyjrzeć. Mechanizm
    oglądający je w chwili zapisu jest tu jedynym, który w ogóle
    patrzy — skanowanie nocne znajdzie to samo, tylko rano.

    Punkt ma też właściwość rzadką w tej paczce: stan „wyłączone" i stan
    „ustąpiła innemu produktowi" wyglądają z zewnątrz podobnie, a są
    przeciwieństwami. Audyt rozróżnia je i nie skleja w jedną odpowiedź.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czas
    między zapisaniem pliku na serwerze a najbliższym skanowaniem, czyli
    zwykle całą dobę — a tyle wystarcza w zupełności.
  en: |
    The item looks whether the guard in real time is truly at work. The difference between it and
    the searching by a set order of hours is the difference between the looking at a file at the
    moment of its writing and the looking at it in the night - that is, in practice, before its
    running or after.

    I raise the category to critical, unlike the reckoning for a workstation, and the ground is
    simple. A workstation writes mostly files somebody at it wittingly opened or drew down. A server
    writes files it did not choose - off shares over the net, off rollings out, off droppings coming
    in from other systems, off keepings of copies, out of folders for exchange half the body writes
    into.

    It is therefore a machine whereon the most files come without the doing of anyone who might look
    them over. The working that looks at them at the moment of writing is here the only one that
    looks at all - a searching by night will find the same, only in the morning.

    The item has besides a trait rare in this pack - the state "switched off" and the state "stood
    aside for another product" look from without alike, and are the opposites of each other. The
    audit tells them apart and glues them not into one answer.

    What an attacker gains while the item goes unmet - the time between the writing of a file on the
    server and the nearest searching, that is mostly a whole day and night, and that is fully
    enough.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia, mimo że sama zmiana jest
    natychmiastowa i nie wymaga restartu. Nie chodzi o to, jak zmiana
    przebiega, tylko o to, co robi z maszyną potem.

    Włączenie ochrony w czasie rzeczywistym na obciążonym serwerze jest
    najczęstszą przyczyną tego, że ochronę wyłącza się z powrotem — i to
    na stałe, przez tego samego administratora, w ciągu tygodnia. Dzieje
    się tak, gdy zostaje włączona bez wyłączeń dla ścieżek i procesów
    roli. Dotyczy to zwłaszcza serwera bazy danych, serwera plików,
    kontrolera domeny i hosta wirtualizacji: pliki danych, dyski maszyn
    wirtualnych i dzienniki transakcji zmieniają się nieustannie
    i drobnymi porcjami, a każda taka porcja jest dla mechanizmu
    zapisem do obejrzenia.

    Kolejność jest więc treścią tej reguły, nie przypisem. Najpierw
    wyłączenia opisane przez producenta roli, potem włączenie ochrony,
    potem obserwacja pełnego cyklu pracy maszyny — u serwera pełnym
    cyklem jest nie doba, tylko miesiąc, bo zamknięcie okresu
    i przetwarzanie miesięczne obciążają go inaczej niż każdy zwykły
    dzień.

    Objaw przy złym wdrożeniu jest mylący i to jest tu najważniejsze do
    zapamiętania. Nie pojawia się komunikat o zablokowaniu. Pojawia się
    zgłoszenie, że aplikacja działa wolno — i trafia do zespołu
    aplikacji, nie do tego, który tydzień wcześniej zmienił ustawienie.
    Powiązanie jednego z drugim potrafi zająć tygodnie.

    Zmiana cofa się natychmiast.
  en: |
    I raise the class to a witting rolling out, though the change itself is at once and takes no
    restart. It is not about how the change goes, but about what it does with the machine afterwards.

    The switching on of the guard in real time on a laden server is the commonest ground for the
    guard's being switched back off - and that for good, by the same administrator, within the week.
    So it goes where it is switched on with no leavings-out for the paths and processes of the role.
    It bears above all on a server of a base of data, a server of files, a warder of the domain and
    a host of virtualisation - the files of data, the disks of machines made by reckoning and the
    day-books of dealings alter unceasingly and in small helpings, and every such helping is to the
    working a writing to be looked at.

    The order is therefore the substance of this rule and no note at the foot. First the
    leavings-out set forth by the maker of the role, then the switching on of the guard, then the
    watching of a full round of the machine's work - with a server a full round is not a day and
    night but a month, the closing of the term and the monthly working through laying upon it
    otherwise than any ordinary day.

    The symptom at an ill rolling out misleads, and that is here the foremost thing to bear in mind.
    No word about a blocking comes. What comes is a report that the application works slowly - and
    it goes to the team of the application and not to the one that altered the setting a week
    before. The binding of the one to the other can take weeks.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - virtualization-and-containers
    - scripting-and-automation
  what_breaks:
    pl:
      - Serwer bazy danych, serwer plików i host wirtualizacji tracą wydajność, gdy brakuje wyłączeń dla ścieżek roli
      - Objawem jest zgłoszenie o wolnym działaniu aplikacji, a nie komunikat o zablokowaniu czegokolwiek
      - Zgłoszenie trafia do zespołu aplikacji, nie do tego, który tydzień wcześniej zmienił ustawienie
      - Pełnym cyklem obserwacji jest u serwera miesiąc, bo przetwarzanie miesięczne obciąża go inaczej
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy, a nie stan niespełniony
    en:
      - A server of a base of data, of files or a host of virtualisation loses its doing where the role's leavings-out are wanting
      - The symptom is a report of an application working slowly and no word about anything being blocked
      - The report goes to the team of the application and not to the one that altered the setting a week before
      - A full round of watching is with a server a month, the monthly working through laying upon it otherwise
      - Where a guarding product of another maker stands, the audit reports the state does not apply and not the state unmet
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono wyłączeń dla ścieżek i procesów opisanych przez producenta roli serwera
      - Maszyną zarządza produkt ochronny innego wytwórcy i wbudowana ochrona ma pozostać w trybie ustąpienia
    en:
      - The leavings-out for the paths and processes set forth by the maker of the server's role are not settled
      - A guarding product of another maker rules the machine and the built-in guard is to stay in its standing-aside mode
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction Stop
      if ($status.AMRunningMode -eq 'Normal') {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableRealtimeMonitoring) { 'DISABLED' } else { 'ENABLED' }
      } else {
        # Defender stands aside either because another product took over or
        # because somebody switched it off. Those are opposite situations and
        # must not share an answer: only the first one is "not applicable".
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction Stop |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
        if ($others.Count -gt 0) { 'NOT_APPLICABLE' } else { 'NO_PROTECTION' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $preference = Get-MpPreference
    [pscustomobject]@{
      setting = 'DisableRealtimeMonitoring'
      value   = [bool]$preference.DisableRealtimeMonitoring
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the role's exclusions before this runs, not after the first
    # report of an application working slowly.
    Set-MpPreference -DisableRealtimeMonitoring $false

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-MpPreference -DisableRealtimeMonitoring ([bool]$b.value)

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Kategoria podniesiona do krytycznej wobec oceny dla stacji roboczej.
    Powód: serwer zapisuje pliki, których nie wybierał — z udziałów,
    z wdrożeń, z kopii, z katalogów wymiany. To maszyna, na której
    najwięcej plików pojawia się bez udziału kogokolwiek, kto mógłby
    się im przyjrzeć.

    Klasa podniesiona do świadomego wdrożenia nie z powodu przebiegu
    zmiany, tylko tego, co robi z maszyną potem. Kolejność jest treścią
    reguły: najpierw wyłączenia dla ścieżek roli, potem włączenie,
    potem obserwacja pełnego cyklu — a pełnym cyklem serwera jest
    miesiąc, nie doba.

    Stan wyłączone i stan ustąpiła innemu produktowi wyglądają podobnie,
    a są przeciwieństwami. Audyt ich nie skleja.
  en: |
    The category is raised to critical against the reckoning for a workstation. The ground - a
    server writes files it did not choose, off shares, off rollings out, off keepings of copies, out
    of folders for exchange. It is the machine whereon the most files come without the doing of
    anyone who might look them over.

    The class is raised to a witting rolling out not for how the change goes but for what it does
    with the machine afterwards. The order is the substance of the rule - first the leavings-out for
    the role's paths, then the switching on, then the watching of a full round, and a server's full
    round is a month and not a day and night.

    The state switched off and the state stood aside for another product look alike and are the
    opposites of each other. The audit glues them not.
