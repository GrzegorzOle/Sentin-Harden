id: win2025-print-rpc-outgoing-authentication

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Uwierzytelnianie połączeń wychodzących podsystemu druku wymagane
    en: Authentication of outgoing connections of the printing subsystem required
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby podsystem druku nie rezygnował
    z uwierzytelnienia przy sięganiu do cudzych serwerów wydruku.

    Wartość, o którą tu chodzi, ma trzy stany, a groźny jest jeden:
    wyłączenie uwierzytelnienia wprost. Jest to ustawienie, które
    wprowadza się ręcznie, żeby coś zadziałało — zwykle stare urządzenie
    wielofunkcyjne, które nie potrafi się uwierzytelnić. Zostaje potem
    na zawsze, bo urządzenie działa i nikt do tego nie wraca.

    Skutkiem jest to, że maszyna łączy się z dowolnym serwerem wydruku
    bez sprawdzania, z kim rozmawia. Połączenie anonimowe nie ma jak
    ustalić, czy po drugiej stronie stoi ta kolejka, o którą chodziło —
    a to jest dokładnie ta strona, która przysyła sterownik.

    Cała droga wygląda wtedy tak: maszyna sięga do kolejki, nie sprawdza,
    kto odpowiada, i przyjmuje od niego kod. Punkt ten sam w sobie tej
    drogi nie zamyka, ale odbiera napastnikowi pierwszy krok — możliwość
    zajęcia miejsca serwera wydruku bez żadnego poświadczenia.

    Na serwerze waży dodatkowo to, że uwierzytelnienie wychodzące bywa
    tam wyłączone szerzej, niż ktokolwiek zamierzał. Wartość jest wspólna
    dla całej maszyny, więc wyłączenie jej dla jednego urządzenia
    w hali produkcyjnej wyłącza ją również dla połączeń z serwerem
    wydruku w serwerowni.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia własnej kolejki wydruku bez żadnego poświadczenia,
    bo serwer nie sprawdza, z kim się łączy.
  en: |
    The setting sees to it that the printing subsystem does not give up authentication at the
    reaching for others' print servers.

    The value in question has three states and one of them is dangerous: the switching off of
    authentication outright. It is a setting made by hand so that something may work - usually an
    old multi-purpose device unable to authenticate itself. It stays thereafter for good, the
    device working and nobody coming back to it.

    The effect is that the machine connects with any print server at all without checking whom it
    speaks with. An anonymous connection has no way of settling whether the queue meant stands on
    the other side - and that is exactly the side that sends the driver.

    The whole road looks then thus: the machine reaches for a queue, does not check who answers,
    and takes code from them. This item does not of itself shut that road, but it takes from the
    attacker the first step - the means of taking a print server's place with no credential at
    all.

    On a server there weighs besides that outgoing authentication is at times switched off there
    more widely than anyone meant. The value is common to the whole machine, so switching it off
    for one device in a production hall switches it off likewise for connections with the print
    server in the server room.

    What an attacker gains while the item goes unmet: the means of setting up a print queue of
    their own with no credential at all, the server not checking whom it connects with.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy ta maszyna drukuje przez urządzenie
    albo serwer wydruku, który przyjmuje wyłącznie połączenia anonimowe.

    Na serwerze pytanie brzmi w praktyce inaczej i to jest różnica warta
    nazwania: nie „czy ktoś tak drukuje", tylko „co jeszcze zostało
    wyłączone przy okazji". Wartość jest jedna na całą maszynę, więc
    jeżeli ktoś ją kiedyś wyłączył, zrobił to dla wszystkich połączeń
    wychodzących, a nie dla tego jednego urządzenia, o które mu chodziło.

    Niezgodność oznacza zatem zawsze wpis wprowadzony ręcznie i zawsze
    warto ustalić, dla czego. Odpowiedź „dla drukarki w magazynie" jest
    tu odpowiedzią pełną i wystarczającą do decyzji.

    Po zmianie takie urządzenie przestanie przyjmować zadania z tej
    maszyny. Objaw jest po stronie wydruku i wygląda na awarię drukarki:
    zadania stoją w kolejce albo znikają bez śladu, a urządzenie milczy.

    Rozwiązaniem właściwym jest uwierzytelnienie po stronie urządzenia
    — zwykle wystarczy konto serwisowe na wbudowanym serwerze wydruku.
    Tam, gdzie oprogramowanie wewnętrzne tego nie potrafi, właściwym
    rozwiązaniem jest drukowanie przez serwer wydruku pośredniczący,
    a nie wprost.

    Cofnięcie zmiany jest natychmiastowe, ale przywraca stan dla całej
    maszyny — czyli również dla połączeń, które akurat nie potrzebują
    tego ustępstwa.

    Zmiana wymaga ponownego uruchomienia bufora wydruku, czyli przerwania
    zadań w toku.
  en: |
    One thing needs checking: whether this machine prints through a device or a print server that
    takes anonymous connections alone.

    On a server the question runs in practice otherwise, and that is a difference worth naming:
    not "whether anyone prints so" but "what else was switched off along the way". The value is
    one for the whole machine, so where somebody once switched it off they did it for all outgoing
    connections and not for the one device they meant.

    Non-compliance therefore always means an entry made by hand, and it is always worth settling
    what for. The answer "for the printer in the store" is here a full answer and enough for a
    decision.

    After the change such a device will stop taking jobs from this machine. The symptom is on the
    printing side and looks like a fault of the printer: jobs stand in the queue or go with no
    trace, and the device keeps silent.

    The right remedy is authentication on the device's side - usually an account for service on
    the built-in print server is enough. Where the inner software cannot do it, the right remedy
    is printing through a print server standing between, and not straight.

    The undoing of the change is at once, but it brings the state back for the whole machine -
    that is for connections too which happen not to need that yielding.

    The change takes a fresh start of the print spooler, that is the breaking of jobs under way.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Urządzenie wielofunkcyjne przyjmujące wyłącznie połączenia anonimowe przestanie przyjmować zadania
      - Objaw wygląda na awarię drukarki, bo zadania stoją w kolejce, a urządzenie milczy
      - Cofnięcie zmiany przywraca stan dla całej maszyny, nie dla jednego urządzenia
      - Ponowne uruchomienie bufora przerywa zadania w toku
    en:
      - A multi-purpose device taking anonymous connections alone will stop taking jobs
      - The symptom looks like a fault of the printer, jobs standing in the queue and the device keeping silent
      - The undoing of the change brings the state back for the whole machine and not for one device
      - A fresh start of the spooler breaks jobs under way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer drukuje przez urządzenie przyjmujące wyłącznie połączenia anonimowe i nie ma serwera pośredniczącego
      - Nie ustalono, dla jakiego urządzenia wyłączono kiedyś uwierzytelnianie
    en:
      - The server prints through a device taking anonymous connections alone and there is no server standing between
      - It was not settled for what device the authentication was once switched off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero is the default handling, in which authentication is used;
      # two switches it off outright.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcAuthentication'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'RpcAuthentication'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcAuthentication' -Value 0 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-rpc-connection-settings

notes:
  pl: |
    Groźny jest jeden stan tej wartości: wyłączenie uwierzytelnienia
    wprost. Wprowadza się je ręcznie, żeby zadziałało stare urządzenie,
    i zostaje na zawsze.

    Wartość jest wspólna dla całej maszyny, więc wyłączenie jej dla
    jednego urządzenia wyłącza ją także dla połączeń z serwerem wydruku.
    Na serwerze to jest właściwe pytanie przy niezgodności — nie „czy
    ktoś tak drukuje", tylko „co jeszcze zostało wyłączone przy okazji".

    Rozwiązaniem tam, gdzie urządzenie nie potrafi się uwierzytelnić,
    jest drukowanie przez serwer pośredniczący, a nie wprost.
  en: |
    One state of this value is dangerous: the switching off of authentication outright. It is made
    by hand so that an old device may work, and it stays for good.

    The value is common to the whole machine, so switching it off for one device switches it off
    likewise for connections with a print server. On a server that is the right question at a
    non-compliance - not "whether anyone prints so" but "what else was switched off along the
    way".

    The remedy where a device cannot authenticate itself is printing through a server standing
    between, and not straight.
