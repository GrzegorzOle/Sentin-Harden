id: win2025-smb-server-idle-session-timeout

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Bezczynne sesje plikowe zawieszane po najwyżej 15 minutach
    en: Idle file sessions suspended after fifteen minutes at most
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zawiesić sesję plikową, w której przez określony
    czas nic się nie dzieje. Punkt wymaga, żeby czas ten nie przekraczał
    piętnastu minut.

    Wartość tego punktu jest porządkowa i tak ją oceniam. Sesja
    zawieszona nie jest sesją zerwaną: klient, który wróci po plik,
    nawiąże ją ponownie i zwykle niczego nie zauważy. Nie zamyka się tu
    więc żadnej drogi wejścia — zmniejsza się liczba sesji trwających
    bez powodu.

    Zysk jest dwojaki. Sesja, która nie istnieje, nie jest sesją, którą
    da się przejąć razem z maszyną, na której stoi — a stanowisko
    porzucone z otwartym połączeniem do udziału jest typowym punktem
    wyjścia. Drugi zysk jest eksploatacyjny: serwer plików utrzymujący
    tysiące sesji martwych zużywa na nie pamięć i utrudnia odczytanie
    wykazu tego, kto faktycznie pracuje.

    Na serwerze punkt ten wreszcie ma przedmiot. Na stanowisku roboczym
    mowa była o sesjach, których zwykle nie ma. Tutaj chodzi o serwer
    plików w jego właściwej roli, z sesjami liczonymi w setkach,
    i o wykaz połączeń, który ma się nadawać do czytania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesje
    trwające bezterminowo na maszynach porzuconych, gotowe do
    wykorzystania razem z nimi, oraz obraz połączeń, w którym trudno
    odróżnić pracę bieżącą od pozostałości.
  en: |
    The setting bids a file session in which nothing has happened for a set time be suspended.
    The item asks that the time not pass fifteen minutes.

    The worth of this item is one of good order and I rate it so. A suspended session is no
    broken session: a client coming back for a file will open it anew and will usually mark
    nothing. No road in is shut here - what falls is the number of sessions lasting for no
    reason.

    The gain is twofold. A session that does not exist is no session to be taken along with the
    machine it stands on - and a station abandoned with an open connection to a share is a common
    starting point. The second gain is one of husbandry: a file server holding thousands of dead
    sessions spends memory upon them and makes the list of who is actually working harder to
    read.

    On a server the item at last has a subject. At a working station what was spoken of were
    sessions that usually are not there. Here it is a file server in its proper part, with
    sessions counted in hundreds, and a list of connections that ought to be fit to read.

    What an attacker gains while the item goes unmet: sessions lasting without end on abandoned
    machines, ready to be used along with them, and a picture of connections in which present
    work is hard to tell from leavings.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z udziałów tego serwera korzysta
    oprogramowanie trzymające plik otwarty przez długi czas bez ruchu.

    W typowym korzystaniu z udziału zmiana jest niewidoczna. Klient
    współczesny nawiązuje sesję ponownie sam, bez pytania i bez
    komunikatu, a otwarte uchwyty odtwarza. Dlatego skutek dla
    użytkownika oznaczam jako niewidoczny, mimo że sesje faktycznie są
    zrywane.

    Przypadkiem pierwszym są aplikacje trzymające plik bazodanowy albo
    plik wymiany na udziale sieciowym. Wdrożenie takie jest błędem samo
    w sobie i producenci odradzają je od lat, ale spotyka się je
    i trzeba o tym powiedzieć. Zawieszenie sesji potrafi wtedy dać błąd
    zapisu albo uszkodzenie pliku, bo aplikacja nie spodziewa się
    zerwania.

    Przypadkiem drugim są klienci starsi i urządzenia z oprogramowaniem
    wbudowanym — skanery zapisujące do udziału, sterowniki maszyn,
    terminale. Bywa, że nie nawiązują sesji ponownie i po zawieszeniu
    zgłaszają brak dostępu aż do ponownego uruchomienia.

    Przypadkiem trzecim jest kopia zapasowa, która otwiera sesję, zbiera
    dane godzinami, po czym wraca zapisać wynik. Sprawdź, czy przerwa
    między tymi krokami nie przekracza wyznaczonego czasu.

    Wartość piętnastu minut jest granicą, nie zaleceniem — krótsza także
    spełnia punkt.

    Zmiana nie wymaga przerwy i dotyczy sesji bezczynnych po niej.
  en: |
    What needs checking is whether software holding a file open for a long time without traffic
    uses this server's shares.

    In ordinary use of a share the change is unseen. A present-day client opens the session anew
    of itself, without asking and without a message, and restores the open handles. Hence I mark
    the effect for a person as unseen, though sessions are indeed broken.

    The first case is applications holding a database file or a swap file on a network share.
    Such a rollout is a fault in itself and makers have counselled against it for years, but it
    is met with and must be spoken of. The suspending of a session can then give a fault in
    writing or a damaged file, the application not looking for a break.

    The second case is older clients and devices with built-in software - scanners writing to a
    share, machine controllers, terminals. It happens that they do not open the session anew and
    after a suspending report no access until they are started afresh.

    The third case is a backup that opens a session, gathers data for hours and then comes back
    to write the outcome. Check that the gap between those steps does not pass the set time.

    The worth of fifteen minutes is a bound, not a counsel - a shorter one meets the item as
    well.

    The change takes no break and bears on sessions idle after it.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
  what_breaks:
    pl:
      - Aplikacja trzymająca plik bazodanowy na udziale może zgłosić błąd zapisu po zawieszeniu sesji
      - Urządzenie z oprogramowaniem wbudowanym może nie nawiązać sesji ponownie aż do restartu
      - Kopia zapasowa wracająca po godzinach zapisać wynik może zastać sesję zawieszoną
      - Klient współczesny nawiązuje sesję ponownie sam i użytkownik niczego nie zauważy
    en:
      - An application holding a database file on a share may report a fault in writing once the session is suspended
      - A device with built-in software may not open the session anew until it is restarted
      - A backup coming back after hours to write its outcome may find the session suspended
      - A present-day client opens the session anew of itself and the person will mark nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja trzyma na udziale tego serwera plik bazodanowy albo plik wymiany
      - Do udziałów łączą się urządzenia z oprogramowaniem wbudowanym niewznawiające sesji samodzielnie
    en:
      - An application holds a database file or a swap file on this server's share
      - Devices with built-in software that do not renew a session of themselves connect to the shares
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is read as a 64-bit number, because the registry keeps it
      # unsigned and the largest possible value stands for "never suspend".
      # Reading it as a 32-bit number would turn that into minus one.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'AutoDisconnect'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        else {
          $minutes = [int64]$value
          if ($minutes -ge 4294967295 -or $minutes -lt 0) { 'NEVER' }
          elseif ($minutes -le 15) { 'WITHIN_LIMIT' }
          else { 'OVER_LIMIT ' + $minutes }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_LIMIT
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'AutoDisconnect'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AutoDisconnect' -Value 15 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-server-amount-of-idle-time-required-before-suspending-session

notes:
  pl: |
    Wartość czytam jako liczbę sześćdziesięcioczterobitową, bo rejestr
    trzyma ją bez znaku, a wartość największa znaczy „nie zawieszaj
    nigdy". Odczytana jako trzydziestodwubitowa zamieniłaby się w minus
    jeden i przeszłaby przez porównanie jako mała.

    Sesja zawieszona nie jest sesją zerwaną. Klient współczesny nawiązuje
    ją ponownie sam i odtwarza otwarte uchwyty — stąd skutek dla
    użytkownika oznaczony jako niewidoczny.

    Na serwerze plików punkt ma znaczenie także eksploatacyjne: wykaz
    połączeń przestaje być mieszaniną pracy bieżącej i pozostałości.
  en: |
    I read the value as a 64-bit number, the registry keeping it unsigned and the largest value
    standing for "never suspend". Read as a 32-bit one it would turn into minus one and pass
    through the comparison as a small value.

    A suspended session is no broken session. A present-day client opens it anew of itself and
    restores the open handles - thence the effect for a person marked as unseen.

    On a file server the item bears on husbandry as well: the list of connections stops being a
    mixture of present work and leavings.
