id: win10-uac-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kontrola konta użytkownika włączona
    en: User Account Control switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza kontrolę konta użytkownika — mechanizm, który sprawia,
    że konto administratora pracuje na co dzień z uprawnieniami zwykłymi,
    a pełne uprawnienia dostaje dopiero po wyraźnym potwierdzeniu.

    Jest to reguła nadrzędna wobec pozostałych w tym bloku. Wyłączenie tej
    jednej wartości unieważnia wszystkie pozostałe ustawienia kontroli konta:
    monity, bezpieczny pulpit, wykrywanie instalatorów i przekierowanie
    zapisów przestają mieć znaczenie, bo nie ma już czego podnosić — każdy
    proces uruchomiony przez administratora startuje od razu z pełnymi
    uprawnieniami.

    Skutek jest bezpośredni. Dokument otwarty przez administratora,
    skrypt pobrany z sieci, program uruchomiony przez pomyłkę — wszystko to
    dostaje prawa do całej maszyny bez jednego kliknięcia. Znika też
    rozdzielenie, na którym stoi ochrona pamięci procesów: bez kontroli konta
    proces użytkownika i proces uprzywilejowany działają na tym samym
    poziomie, więc wstrzyknięcie kodu z jednego do drugiego przestaje być
    przeszkodą.

    Odnotowuję rzecz, która bywa myląca: wyłączenie tej wartości w systemie
    Windows 10 psuje także aplikacje ze sklepu i część funkcji powłoki, bo
    działają one w kontenerze zależnym od tego samego mechanizmu. Maszyna
    z wyłączoną kontrolą konta nie jest więc tylko mniej bezpieczna — jest
    też niekompletna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne prawa do
    maszyny w chwili, w której uda mu się uruchomić cokolwiek na koncie
    administratora, bez żadnego potwierdzenia ze strony człowieka.
  en: |
    The setting switches on User Account Control - the mechanism by which an administrator's account works from
    day to day with ordinary rights and gets its full rights only after a plain confirmation.

    It is the rule that stands over the rest in this block. Switching this one value off voids every other
    control setting - the prompts, the secure desktop, installer detection and the redirection of writes cease
    to matter, there being nothing left to raise. Every process started by an administrator begins at once with
    full rights.

    The consequence is a direct one. A document opened by an administrator, a script fetched from the network, a
    program run by mistake - all of it gets rights to the whole machine without a single click. Gone too is the
    separation on which the protection of process memory rests: without the control a user's process and a
    privileged process run at the same level, so injecting code from one into the other ceases to be an obstacle.

    A thing worth noting, as it misleads: switching this value off on Windows 10 also breaks store applications
    and part of the shell, these working in a container that hangs on the same mechanism. A machine with the
    control switched off is therefore not merely less safe - it is incomplete.

    What an attacker gains while the item goes unmet: full rights to the machine the moment they manage to run
    anything at all on an administrator's account, without any confirmation from a person.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i to nie dlatego, że włączenie samo
    w sobie coś psuje, lecz dlatego, że wymaga restartu i odsłania to, co na
    maszynie było napisane pod brak kontroli.

    Restart jest obowiązkowy. Wartość odczytywana jest przy starcie systemu
    i do tego czasu maszyna zachowuje się po staremu, więc audyt pokaże
    zgodność, a zachowanie będzie jeszcze poprzednie.

    Po restarcie pojawiają się monity. Dotyczą one czynności
    administracyjnych — instalacji, zmian w rejestrze poza profilem, zapisu
    do katalogów systemowych. Praca codzienna ich nie wywołuje.

    Rzecz, która boli najbardziej: zadania i skrypty uruchamiane bez
    interaktywnego zalogowania, napisane w czasie, gdy kontrola była
    wyłączona. Te, które działają przez harmonogram z zaznaczoną opcją
    najwyższych uprawnień, przejdą. Te, które liczyły na to, że zwykłe
    uruchomienie wystarczy, zaczną kończyć się błędem odmowy dostępu —
    i zrobią to po cichu, bo nikogo nie ma przy ekranie.

    Osobno stoją programy starsze, zapisujące do katalogu instalacyjnego.
    Przekierowanie zapisów z reguły ostatniej w tym bloku obsłuży większość
    z nich, ale nie wszystkie.

    Czego to nie psuje: logowania, profili, sieci, drukowania, aplikacji
    pracujących w profilu użytkownika, udziałów plikowych.
  en: |
    The class is "needs a planned rollout", and that not because the switching on breaks something in itself,
    but because it calls for a restart and lays bare whatever on the machine was written for the control's
    absence.

    The restart is obligatory. The value is read at the system's start and until then the machine behaves as
    before, so an audit will show compliance while the behaviour is still the former one.

    After the restart the prompts appear. They concern administrative acts - installation, changes to the
    registry outside the profile, writing to system directories. Everyday work does not call them up.

    The thing that hurts most: tasks and scripts run without an interactive logon, written at a time when the
    control was off. Those that run through the scheduler with the highest-privileges box ticked will pass.
    Those that counted on an ordinary start being enough will begin ending in an access-denied error - and will
    do so quietly, nobody being at the screen.

    Older programs writing to their installation directory stand apart. The redirection of writes from the last
    rule in this block will handle most of them, but not all.

    What this does not break: logging on, profiles, the network, printing, applications working inside the
    user's profile, or file shares.

implementation_consequences:
  impact_areas:
    - user-interface
    - scripting-and-automation
    - updates-and-servicing
  what_breaks:
    pl:
      - Zadania i skrypty uruchamiane bez zalogowania, które liczą na pełne uprawnienia od startu, kończą się odmową dostępu
      - Czynności administracyjne wymagają od tej chwili potwierdzenia monitem, co dotyka także zdalnej obsługi maszyny
      - Starsze programy zapisujące do własnego katalogu instalacyjnego działają dalej tylko dzięki przekierowaniu zapisów
      - Zmiana wchodzi dopiero po restarcie, więc między wykonaniem a restartem audyt pokaże zgodność bez zmiany zachowania
      - Logowanie, profile użytkowników, praca sieci, drukowanie i udziały plikowe pozostają bez zmian
    en:
      - Tasks and scripts run without a logon that count on full rights from the start end in an access-denied error
      - Administrative acts call from now on for a confirmation by prompt, which touches the remote handling of the machine as well
      - Older programs writing to their own installation directory keep working only thanks to the redirection of writes
      - The change takes hold only after a restart, so between the carrying out and the restart an audit shows compliance without changed behaviour
      - Logging on, users profiles, the work of the network, printing and file shares stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie przemysłowe lub pomiarowe, którego producent wymaga wyłączonej kontroli konta
      - Nie ma okna serwisowego na restart, a maszyna pełni rolę, której nie wolno przerwać bez uprzedzenia
    en:
      - Industrial or measurement software works on the machine whose maker calls for the control to be off
      - There is no service window for a restart and the machine holds a role that may not be broken off unannounced
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableLUA'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableLUA'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is read at the system's start - until a restart the machine
    # behaves as before. Before the restart, look over the tasks that run
    # without a logon: those counting on full rights from the start will begin
    # ending in an access-denied error.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableLUA' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/user-account-control/how-user-account-control-works

notes:
  pl: |
    Reguła otwiera blok i jest w nim jedyną, bez której pozostałe nie mają
    sensu. Warto, żeby aplikacja pokazała tę zależność wprost: gdy ta wartość
    jest niespełniona, pięć kolejnych punktów w tym bloku należy czytać jako
    nieaktywne, a nie jako spełnione.

    Zestawienie obu osi jest tu rzadkie i dlatego czytelne. Kategoria
    krytyczna przy klasie wymagającej świadomego wdrożenia — zysk największy
    z możliwych, koszt realny i dający się wskazać. Jest to dokładnie ten
    przypadek, o którym mówi macierz decyzyjna: rozmowa, a nie odruch.

    Odnotowuję, że wartość bywa wyłączana ręcznie przy wdrażaniu starszego
    oprogramowania i zostaje tak na lata, bo nic o niej nie przypomina.
    Raport, który nazwie to wprost, bywa pierwszym miejscem, w którym ktoś
    się o tym dowiaduje.
  en: |
    The rule opens the block and is the only one in it without which the rest make no sense. It is well that the
    application show that dependence outright: where this value goes unmet, the five following items in the
    block are to be read as inactive rather than as met.

    The pairing of both axes is here a rare one and for that reason legible. A critical category at a class
    calling for a planned rollout - the largest gain to be had, the cost real and to be pointed at. It is
    exactly the case the decision matrix speaks of: a conversation, not a reflex.

    Worth noting that the value gets switched off by hand while older software is being brought in and stays so
    for years, nothing calling it to mind. A report that names it outright is at times the first place anybody
    learns of it.
