id: ubuntu2404-root-access-controlled

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.4.2.4
  section: Access Control > User Accounts and Environment > Configure root and system accounts and environment
  title:
    pl: Konto root ma hasło albo jest zablokowane
    en: Ensure root account access is controlled
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Konto root z pustym polem hasła w /etc/shadow pozwala zalogować się jako
    root bez hasła, na przykład na konsoli albo przez su, jeśli PAM
    dopuszcza puste hasła.

    Punkt wymaga, żeby konto root miało ustawione hasło albo było
    zablokowane.
  en: |
    A root account with an empty password field in /etc/shadow allows
    logging in as root without a password, for example on the console or
    through su, if PAM allows empty passwords.

    The item requires the root account to have a password set or to be
    locked.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/shadow.
  en: |
    Nobody will notice: the check only reads /etc/shadow.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/shadow ] || { echo "NOT_OK:shadow-unreadable"; exit 0; }
    if ! awk -F: '$1 == "root" { f = 1; exit } END { exit !f }' /etc/shadow; then echo "NOT_OK:no-root-entry"; exit 0; fi
    p=$(awk -F: '$1 == "root" { print $2; exit }' /etc/shadow)
    case "$p" in
      "") echo "NOT_OK:root-empty-password" ;;
      '!'*|'*'*) echo "OK:root-locked" ;;
      *) echo "OK:root-password-set" ;;
    esac
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man1/passwd.1.html

notes:
  pl: |
    Ubuntu domyślnie nie daje kontu root hasła (w /etc/shadow jest ! albo *),
    a administrację robi się przez sudo z konta utworzonego przy instalacji.
    Wynik NOT_OK:root-empty-password poprawia się ręcznie: poleceniem
    passwd root albo, jeśli jest inne konto z sudo, poleceniem
    passwd -l root. Sprawdzenie wymaga odczytu /etc/shadow, więc bez
    uprawnień roota daje wynik NOT_OK z dopiskiem shadow-unreadable. Reguła
    tylko sprawdza stan.
  en: |
    Ubuntu does not give the root account a password by default (/etc/shadow
    has ! or *), and administration is done through sudo from the account
    created during installation. The NOT_OK:root-empty-password result is
    fixed by hand: with passwd root or, if there is another account with
    sudo, with passwd -l root. The check needs to read /etc/shadow, so
    without root privileges it gives the NOT_OK result with a
    shadow-unreadable note. The rule only checks the state.
