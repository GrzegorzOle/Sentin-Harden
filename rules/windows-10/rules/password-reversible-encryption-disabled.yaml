id: win10-password-reversible-encryption-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Przechowywanie haseł w postaci odwracalnej wyłączone
    en: The keeping of passwords in a reversible form switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza przechowywanie haseł kont w postaci, z której da się
    odzyskać hasło pierwotne.

    Hasła przechowuje się normalnie jako skrót — wynik przekształcenia,
    z którego hasła odtworzyć się nie da; przy logowaniu porównuje się skróty,
    nie hasła. Postać odwracalna łamie to założenie. Hasło zapisane jest
    wtedy zaszyfrowane kluczem, który maszyna ma u siebie, więc kto ma
    dostęp do bazy kont i do tego klucza, ma hasła w postaci jawnej.

    Nazwa ustawienia bywa myląca, bo mówi o szyfrowaniu, a szyfrowanie brzmi
    jak zabezpieczenie. Tutaj jest odwrotnie: szyfrowanie oznacza, że hasło
    da się odczytać, podczas gdy skrót oznacza, że nie.

    Powodem istnienia tej możliwości są stare mechanizmy uwierzytelniania,
    które wymagały hasła w postaci jawnej po stronie serwera. Mechanizmy te
    są dziś niestosowane, a ustawienie zostaje włączone zwykle przez
    pomyłkę albo po wdrożeniu, które go potrzebowało i dawno zniknęło.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła kont
    w postaci jawnej, bez łamania czegokolwiek, po samym dostępie do bazy
    kont maszyny.
  en: |
    The setting switches off the keeping of accounts' passwords in a form from which the original password can
    be won back.

    Passwords are kept in the ordinary way as a hash - the outcome of a transformation from which the password
    cannot be restored; at a logon hashes are weighed against hashes, not passwords against passwords. The
    reversible form breaks that footing. The password is then written enciphered under a key the machine holds
    at home, so whoever has the accounts database and that key has the passwords in plain form.

    The setting's name misleads at times, speaking as it does of encryption, and encryption sounds like a
    safeguard. Here it is the other way about: encryption means the password can be read, while a hash means it
    cannot.

    The reason this possibility exists is old mechanisms of authentication that called for a password in plain
    form on the server's side. Those mechanisms are unused today, and the setting gets switched on as a rule by
    mistake, or after a rollout that needed it and is long gone.

    What an attacker gains while the item goes unmet: accounts' passwords in plain form, without breaking
    anything at all, upon mere access to the machine's accounts database.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślną i na maszynie nietykanej reguła
    potwierdza stan zastany. Żaden mechanizm uwierzytelniania stosowany dziś
    tej postaci nie potrzebuje.

    Wyłączenie nie zmienia haseł już zapisanych w postaci odwracalnej —
    zmienia sposób zapisu przy zmianie hasła następnej. Znaczy to, że po
    wykonaniu warto wymusić zmianę haseł kont lokalnych, bo inaczej postać
    odwracalna zostanie zapisana dotąd, dopóki hasło się nie zmieni.
    Odnotowuję to jako czynność osobną, nie jako część tej reguły.

    Przypadek, w którym coś mogłoby przestać działać, jest jeden i dziś
    praktycznie nie występuje: uwierzytelnianie mechanizmem wymagającym
    hasła w postaci jawnej po stronie serwera. Gdyby taki mechanizm był
    w użyciu, przestałby działać od razu.

    Nie ma znanych regresji.

    Czego to nie psuje: logowania, haseł już ustawionych, kont domenowych,
    usług, sieci, aplikacji, profili, drukowania.
  en: |
    The class is "no disruption".

    The value called for is the default one, and on an untouched machine the rule confirms the state found. No
    mechanism of authentication in use today needs that form.

    Switching it off does not change passwords already written in the reversible form - it changes the way of
    writing at the next change of password. That means it is well after the carrying out to force a change of
    the local accounts' passwords, else the reversible form will stay written until the password changes. I set
    that down as a separate act, not as part of this rule.

    The case in which something might cease working is single and today all but absent: authentication by a
    mechanism calling for a password in plain form on the server's side. Were such a mechanism in use, it would
    cease working at once.

    There are no known regressions.

    What this does not break: logging on, passwords already set, domain accounts, services, the network,
    applications, profiles, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
  what_breaks:
    pl:
      - Uwierzytelnianie mechanizmem wymagającym hasła w postaci jawnej po stronie serwera przestaje działać od razu
      - Hasła zapisane wcześniej w postaci odwracalnej takimi zostają, dopóki nie zostaną zmienione
      - Logowanie, hasła już ustawione oraz konta domenowe pozostają bez zmian
      - Usługi systemowe, praca sieci i aplikacje pozostają bez zmian
      - Profile użytkowników, drukowanie i udziały plikowe pozostają bez zmian
    en:
      - Authentication by a mechanism calling for a password in plain form on the servers side ceases working at once
      - Passwords written earlier in the reversible form stay so until they are changed
      - Logging on, passwords already set and domain accounts stay unchanged
      - System services, the work of the network and applications stay unchanged
      - Users profiles, printing and file shares stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie działa uwierzytelnianie wymagające hasła w postaci jawnej po stronie serwera i nie ma dla niego zamiennika
    en:
      - Authentication calling for a password in plain form on the servers side works on this machine and there is no substitute
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ClearTextPassword\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^ClearTextPassword\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'ClearTextPassword'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Passwords written earlier in the reversible form stay so until they change.
    # Where the setting had been switched on, force a change of the local accounts'
    # passwords after this - otherwise the change reaches nothing already written.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ClearTextPassword = 0',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ClearTextPassword = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption

notes:
  pl: |
    Reguła zamyka blok zasad haseł i jest w nim jedyną kategorii krytycznej.
    Zestawienie osi jest tu najkorzystniejsze z możliwych — zysk największy
    przy koszcie zerowym — więc według macierzy jest to punkt otwierający
    listę i robiony bez rozmowy.

    Warto, żeby aplikacja zwróciła uwagę na mylącą nazwę ustawienia.
    Użytkownik czytający o szyfrowaniu haseł może uznać, że reguła każe je
    zabezpieczyć, podczas gdy każe dokładnie odwrotnie — przestać je
    przechowywać w postaci, z której da się je odczytać.

    Odnotowuję rzecz, która nie mieści się w samej regule: sama zmiana
    ustawienia nie przepisuje haseł już zapisanych. Aplikacja, która to
    przemilczy, pokaże punkt jako spełniony w chwili, gdy postać odwracalna
    wciąż leży w bazie kont. Jest to dobry przykład tego, dlaczego ponowny
    audyt po naprawie nie zastępuje opisu skutków.
  en: |
    The rule closes the block of password policies and is the only one in it of a critical category. The pairing
    of the axes is here the most favourable to be had - the largest gain at no cost - so by the matrix it is the
    item opening the list and done without discussion.

    It is well that the application draw heed to the setting's misleading name. A user reading of the encryption
    of passwords may take it that the rule bids them be safeguarded, while it bids exactly the reverse - that
    they cease being kept in a form from which they can be read.

    Worth noting a thing that does not fit inside the rule itself: the change of setting alone does not rewrite
    passwords already written. An application passing that over will show the item as met at a moment when the
    reversible form still lies in the accounts database. It is a good example of why a fresh audit after a
    remedy does not stand in for a description of consequences.
