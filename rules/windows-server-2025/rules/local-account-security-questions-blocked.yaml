id: win2025-local-account-security-questions-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Pytania pomocnicze do odzyskania hasła konta lokalnego zablokowane
    en: Helper questions for recovering a local account's password blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje zakładanie pytań pomocniczych, którymi da się odzyskać
    hasło konta lokalnego bez znajomości tego hasła.

    Zostawiam kategorię średnią i chcę nazwać, na czym polega tu problem,
    bo nie na tym, że pytania są łatwe do odgadnięcia.

    Pytanie pomocnicze jest drugim hasłem do tego samego konta, tylko
    słabszym i niewidocznym dla wszystkiego, co hasła pilnuje. Nie podlega
    zasadzie długości ani złożoności. Nie wygasa. Nie jest liczone przy
    blokowaniu konta po nieudanych próbach. Nie zmienia się, gdy zmienia
    się hasło właściwe. Odpowiedź ustala się raz, przy zakładaniu konta,
    i zostaje na cały czas jego istnienia.

    Do tego odpowiedzi na takie pytania zwykle nie są sekretem. Nazwa
    pierwszego pracodawcy, miasto urodzenia albo imię zwierzęcia to rzeczy,
    które o osobie zajmującej się serwerem można zwyczajnie ustalić.

    Na serwerze ma to jeszcze jeden wymiar. Wszystkie pozostałe reguły
    z tej grupy pracują nad tym, żeby hasło lokalnego administratora było
    losowe, krótko ważne i sprzątane po użyciu. Pytanie pomocnicze omija
    ten cały porządek jednym ruchem, bo pozwala ustawić hasło na nowo bez
    znajomości starego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    zmiany hasła konta lokalnego bez znajomości tego hasła, opartą na
    danych, których nikt nigdy nie traktował jak sekretu.
  en: |
    The item blocks the setting up of helper questions by which a local
    account's password can be recovered without knowing that password.

    I keep the category medium, and I want to name what the problem
    actually is here, because it is not that the questions are easy to
    guess.

    A helper question is a second password to the same account, only a
    weaker one and invisible to everything that watches passwords. It is
    subject to no length or complexity policy. It does not expire. It is
    not counted towards locking the account after failed attempts. It does
    not change when the proper password changes. The answer is settled once,
    when the account is created, and stays for the whole of its existence.

    On top of that, the answers to such questions are usually no secret.
    The name of a first employer, a town of birth or a pet's name are
    things that can simply be established about the person who looks after
    a server.

    On a server this has one further dimension. All the other rules in this
    group work at making the local administrator password random,
    short-lived and cleared up after use. A helper question sidesteps that
    whole arrangement in one move, because it allows the password to be set
    anew without knowing the old one.

    What an attacker gains while the item goes unmet: a route to changing a
    local account's password without knowing it, resting on details nobody
    has ever treated as a secret.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", chociaż na serwerze skutek jest
    niewielki, i podaję powód, zamiast zbywać to ogólnikiem.

    Zmiana zabiera jedną drogę odzyskania dostępu do konta lokalnego.
    Tam, gdzie ta droga była jedyną zapisaną w procedurze — a zdarza się
    to na maszynach stojących poza domeną, przygotowanych przez dostawcę
    albo prowadzonych przez jedną osobę — po tej zmianie trzeba mieć inną.
    Inna to albo hasło odczytywane z katalogu przez mechanizm lokalnego
    administratora, albo drugie konto administracyjne, albo procedura
    odtworzenia maszyny. Którakolwiek z nich musi istnieć zanim, a nie
    potem.

    Rzecz do sprawdzenia, a nie do założenia: reguła blokuje zakładanie
    nowych pytań. Pytania już ustawione na istniejących kontach zostają
    tam, gdzie są, i nadal działają. Raport pokaże punkt jako spełniony,
    a droga będzie otwarta. Zamknięcie jej wymaga sprawdzenia kont
    lokalnych tej maszyny po zmianie — i to jest ta część pracy, o której
    najłatwiej zapomnieć.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", although on a server the effect is
    small, and I give the reason rather than fob it off with a generality.

    The change takes away one route to recovering access to a local
    account. Where that route was the only one written into the procedure -
    and that happens on machines standing outside a domain, prepared by a
    vendor, or run by a single person - another one has to exist after this
    change. Another one means either the password read from the directory
    through the local administrator mechanism, or a second administrative
    account, or a procedure for rebuilding the machine. Whichever it is has
    to exist beforehand, not afterwards.

    Something to check rather than assume: the rule blocks the setting up
    of new questions. Questions already set on existing accounts stay where
    they are and go on working. The report will show the item as met while
    the route stands open. Closing it requires going through this machine's
    local accounts after the change - and that is the part of the work
    easiest to forget.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Znika jedna droga odzyskania dostępu do konta lokalnego bez znajomości hasła
      - Tam, gdzie była to jedyna droga zapisana w procedurze, trzeba mieć inną, i to przed zmianą
      - Pytania już ustawione na istniejących kontach zostają i nadal działają, a raport pokaże punkt jako spełniony
      - Zamknięcie tej drogi wymaga przejrzenia kont lokalnych maszyny po zmianie, o czym najłatwiej zapomnieć
    en:
      - One route to recovering access to a local account without knowing the password goes
      - Where that was the only route written into the procedure, another has to exist, and beforehand
      - Questions already set on existing accounts stay and go on working, while the report shows the item as met
      - Closing that route requires going through the machine's local accounts afterwards, which is easiest to forget
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Pytania pomocnicze są jedyną zapisaną drogą odzyskania dostępu do konta lokalnego tej maszyny
      - Maszyna stoi poza domeną, nie ma mechanizmu hasła lokalnego administratora ani drugiego konta administracyjnego
    en:
      - Helper questions are the only recorded route to recovering access to this machine's local account
      - The machine stands outside a domain, with no local administrator password mechanism and no second administrative account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'NoLocalPasswordResetQuestions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'NoLocalPasswordResetQuestions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This blocks setting up new questions. Questions already set on existing
    # accounts stay and go on working while the report reads as met, so go
    # through this machine's local accounts afterwards.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLocalPasswordResetQuestions' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/

notes:
  pl: |
    Problem nie polega na tym, że pytania są łatwe do odgadnięcia. Pytanie
    pomocnicze jest drugim hasłem do tego samego konta, tylko słabszym
    i niewidocznym dla wszystkiego, co hasła pilnuje: nie podlega zasadzie
    długości ani złożoności, nie wygasa, nie liczy się przy blokowaniu
    konta i nie zmienia się razem z hasłem właściwym.

    Na serwerze omija to jednym ruchem cały porządek, nad którym pracują
    pozostałe reguły tej grupy, bo pozwala ustawić hasło na nowo bez
    znajomości starego.

    Część do zapamiętania: reguła blokuje zakładanie nowych pytań, a te już
    ustawione zostają i działają, podczas gdy raport pokaże punkt jako
    spełniony.
  en: |
    The problem is not that the questions are easy to guess. A helper
    question is a second password to the same account, only weaker and
    invisible to everything that watches passwords: subject to no length or
    complexity policy, never expiring, not counted towards locking the
    account, and unchanged when the proper password changes.

    On a server this sidesteps in one move the whole arrangement the other
    rules in this group work at, because it allows the password to be set
    anew without knowing the old one.

    The part to remember: the rule blocks setting up new questions, while
    those already set stay and work, and the report shows the item as met.
