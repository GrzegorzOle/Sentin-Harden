id: win10-print-spooler-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa bufora wydruku wyłączona
    en: The service holding work for the press switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą zadania wydruku, przechowującą
    je i wysyłającą do drukarki.

    Usługa ta jest jednym z najczęściej wykorzystywanych punktów
    w systemie i powód jest strukturalny. Działa z najwyższymi
    uprawnieniami, przyjmuje dane z sieci, zapisuje pliki na dysku
    i ładuje sterowniki — a robi to wszystko po to, żeby obsłużyć
    drukarkę, o którą nikt nie pyta, czy jest prawdziwa.

    Zagrożenie pierwsze to ładowanie sterowników. Wskazanie maszynie
    drukarki sieciowej potrafi skłonić ją do pobrania i uruchomienia
    kodu sterownika, a kod ten działa z uprawnieniami systemu.

    Zagrożenie drugie to zapis na dysku. Bufor tworzy pliki w miejscu
    znanym z góry, z uprawnieniami systemu, co jest klasyczną podstawą
    do podniesienia uprawnień.

    Zagrożenie trzecie to dostępność z sieci. Usługa przyjmuje zdalne
    wywołania i robi to domyślnie, także na maszynie, która nigdy nikomu
    niczego nie drukowała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługę
    o najwyższych uprawnieniach ładującą kod na wskazanie z sieci.
  en: |
    The setting switches off the service taking in tasks for the press, holding them and sending them on to the
    printer.

    That service is among the most often turned to account in the system, and the ground is of its very build. It
    works with the highest rights, takes in data from the network, writes files upon the disk and loads drivers -
    and does it all to serve a printer nobody asks whether it be true.

    The first danger is the loading of drivers. The pointing out to the machine of a printer upon the network can
    move it to bring down and set going the code of a driver, and that code works with the system's rights.

    The second danger is the writing upon the disk. The holding place makes files in a spot known beforehand, with
    the system's rights, which is a standing ground for the raising of rights.

    The third danger is its being reached from the network. The service takes in calls from afar and does so by
    default, even upon a machine that has never printed anything for anybody.

    What an attacker gains while the item goes unmet: a service of the highest rights loading code at a pointing
    from the network.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest oczywisty:
    drukowanie przestaje działać w całości.

    Miejscem pierwszym jest każda drukarka — sieciowa, przyłączona
    kablem, wirtualna. Po zmianie nie zadziała żadna, a zadania czekające
    w kolejce przepadną.

    Miejscem drugim są programy zapisujące dokument do pliku przez
    mechanizm wydruku. Zapis dokumentu przenośnego tą drogą przestanie
    działać, choć użytkownik nie uzna tego za drukowanie i zgłosi jako
    usterkę programu.

    Miejscem trzecim są programy branżowe drukujące same: wydruki
    dokumentów sprzedaży, etykiety, potwierdzenia. Tam brak wydruku
    zatrzymuje pracę, a nie tylko utrudnia.

    Odnotowuję punkt pośredni wart rozważenia zamiast tego: zamknięcie
    samego przyjmowania zdalnych wywołań przez bufor. Zdejmuje część
    zagrożenia, zostawiając drukowanie.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: sieci, poczty, logowania, pracy programów poza
    drukowaniem, dostępu do plików.
  en: |
    The class is "needs a planned rollout", and the ground is plain: printing ceases to work whole.

    The first place is every printer - upon the network, joined by a cable, or feigned. After the change none will
    work, and the tasks waiting in the line will be lost.

    The second place is programs writing a paper to a file through the mechanism of the press. The writing of a
    carried paper by that road will cease to work, though the user will hold it to be no printing and will report
    it as a fault of the program.

    The third place is programs of a trade that print of themselves: printings of papers of sale, labels,
    warrants. There the want of a printing stops the work and does not merely hinder it.

    I set down a middle item worth weighing in its stead: the shutting of the taking in of calls from afar by the
    holding place alone. It takes part of the danger away and leaves printing standing.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the network, the post, logging on, the work of programs beyond printing, or the
    reach of files.

implementation_consequences:
  impact_areas:
    - printing
    - user-interface
  what_breaks:
    pl:
      - Żadna drukarka nie zadziała, a zadania czekające w kolejce przepadną
      - Zapis dokumentu przenośnego przez mechanizm wydruku przestanie działać i zostanie zgłoszony jako usterka programu
      - Programy branżowe drukujące dokumenty sprzedaży, etykiety i potwierdzenia zatrzymają pracę
      - Punktem pośrednim wartym rozważenia jest zamknięcie samego przyjmowania zdalnych wywołań przez bufor
      - Sieć, poczta, logowanie, dostęp do plików i praca programów poza drukowaniem pozostają bez zmian
    en:
      - No printer will work, and the tasks waiting in the line will be lost
      - The writing of a carried paper through the mechanism of the press will cease to work and will be reported as a fault of the program
      - Programs of a trade printing papers of sale, labels and warrants will stop their work
      - A middle item worth weighing is the shutting of the taking in of calls from afar by the holding place alone
      - The network, the post, logging on, the reach of files and the work of programs beyond printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Ze stanowiska drukuje się cokolwiek, choćby rzadko
      - Program branżowy zapisuje dokumenty przenośne przez mechanizm wydruku
    en:
      - Anything at all is printed from the station, if only seldom
      - A program of a trade writes carried papers through the mechanism of the press
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Spooler'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Spooler'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'Spooler' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Spooler' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Spooler' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Reguła jest wzorcowym przykładem punktu z macierzy, w którym zysk
    i koszt są jednocześnie wysokie. Warto, żeby aplikacja postawiła to
    wprost: droga wejścia jest realna i wykorzystywana, a drukowanie
    przestaje działać w całości.

    Argument wart postawienia dotyczy budowy usługi. Działa
    z najwyższymi uprawnieniami, przyjmuje dane z sieci, zapisuje pliki
    i ładuje sterowniki. Każdy z tych elementów z osobna bywa punktem
    wyjścia ataku, a tutaj występują razem.

    Odnotowuję punkt pośredni i aplikacja powinna go wskazać w tym samym
    widoku: zamknięcie przyjmowania zdalnych wywołań przez bufor zdejmuje
    znaczną część zagrożenia, zostawiając drukowanie działające.
  en: |
    The rule is a pattern showing of an item from the matrix where gain and cost are both high at once. It is well
    that the application put it outright: the road in is real and turned to account, and printing ceases to work
    whole.

    The argument worth putting touches the build of the service. It works with the highest rights, takes in data
    from the network, writes files and loads drivers. Each of those by itself is at times the starting point of an
    assault, and here they stand together.

    I set down the middle item, and the application ought to point it out in that same sight: the shutting of the
    taking in of calls from afar by the holding place takes away a good part of the danger and leaves printing
    working.
