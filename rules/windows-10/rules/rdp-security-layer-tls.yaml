id: win10-rdp-security-layer-tls

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Warstwa zabezpieczeń pulpitu zdalnego ustalona na protokół szyfrujący
    en: The layer of guarding of the desk from afar fixed to the enciphering protocol
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza użycie protokołu szyfrującego jako warstwy
    zabezpieczeń połączenia pulpitu zdalnego, zamiast mechanizmu
    własnego.

    Różnica leży w potwierdzaniu tożsamości maszyny. Mechanizm własny
    szyfruje treść, ale nie daje klientowi sposobu sprawdzenia, czy
    rozmawia z właściwą maszyną. Protokół szyfrujący opiera się na
    certyfikacie, więc klient ma czego żądać i co porównać.

    Zagrożeniem jest maszyna podstawiona. Bez potwierdzenia tożsamości
    klient zestawia sesję z tym, kto odpowiedział pod danym adresem,
    a użytkownik wpisuje w nią hasło, nie mając powodu do podejrzeń.

    Drugim zastrzeżeniem jest wybór negocjowany. Ustawienie pośrednie
    pozwala stronom dogadać się co do warstwy, a wtedy o zabezpieczeniu
    decyduje słabsza z nich. Ta reguła odbiera ten wybór.

    Odnotowuję, że reguła współgra z punktem o uwierzytelnianiu na
    poziomie sieci. Tamten wymaga poświadczeń przed sesją, ten zapewnia,
    że sesja idzie do właściwej maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    pulpitu zdalnego zestawioną bez potwierdzenia tożsamości maszyny.
  en: |
    The setting drives the use of the enciphering protocol as the layer of guarding of a joining of the desk from
    afar, in the place of the mechanism of its own.

    The difference lies in the warranting of the machine's name. The mechanism of its own enciphers the content
    but gives the client no way of looking at whether it speaks with the right machine. The enciphering protocol
    rests upon a certificate, so the client has what to call for and what to set against.

    The danger is a machine set in another's place. With no warranting of the name the client sets up a session
    with whoever answered at the given address, and the user writes their password into it, having no ground to
    suspect.

    The second reservation is a choice bargained for. The middling setting lets the sides agree upon the layer,
    and then the weaker of them settles the guarding. This rule takes that choice away.

    I set down that the rule goes together with the item about warranting at the level of the network. That one
    calls for warrants before the session; this one makes sure the session goes to the right machine.

    What an attacker gains while the item goes unmet: a session of the desk from afar set up with no warranting of
    the machine's name.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest certyfikat
    maszyny.

    Miejscem pierwszym jest certyfikat samopodpisany. Maszyna wystawia
    go sama, gdy nie ma innego, a wtedy klient pokaże ostrzeżenie przy
    każdym połączeniu. Użytkownicy przyzwyczajają się je klikać, co
    osłabia sens całego punktu — właściwym rozwiązaniem jest certyfikat
    z własnego urzędu.

    Miejscem drugim są starsze klienty nieobsługujące tej warstwy.
    Przestaną się łączyć, a komunikat będzie mówił o niepowodzeniu
    negocjacji.

    Miejscem trzecim są rozwiązania pośredniczące w połączeniach pulpitu
    zdalnego, które zakładają możliwość wyboru warstwy.

    Odnotowuję, że skutek jest widoczny dla użytkownika — ostrzeżeniem
    o certyfikacie albo jego brakiem, zależnie od tego, czy certyfikat
    jest zaufany.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: sesji już otwartych, pracy programów, sieci,
    logowania przy maszynie, drukowania.
  en: |
    The class is "needs review", and the object of the review is the machine's certificate.

    The first place is a certificate signed by itself. The machine makes one when it has no other, and then the
    client will show a warning at every joining. Users grow used to pressing past them, which weakens the whole
    item's sense - the right answer is a certificate from an office of one's own.

    The second place is older clients backing not that layer. They will cease to join, and the message will speak
    of a failed bargaining.

    The third place is answers standing between for joinings of the desk from afar, which look for the layer to be
    choosable.

    I set down that the consequence is plain to the user - by a warning about the certificate or by its absence,
    after whether the certificate be trusted.

    The consequence shows at once, with no restart.

    What this does not break: sessions already open, the work of programs, the network, logging on at the machine,
    or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Przy certyfikacie samopodpisanym klient pokaże ostrzeżenie przy każdym połączeniu
      - Użytkownicy przyzwyczajają się klikać ostrzeżenia, co osłabia sens punktu
      - Właściwym rozwiązaniem jest certyfikat z własnego urzędu, a nie pozostawienie samopodpisanego
      - Starsze klienty nieobsługujące tej warstwy przestaną się łączyć
      - Sesje już otwarte, praca programów, sieć, logowanie przy maszynie i drukowanie pozostają bez zmian
    en:
      - With a certificate signed by itself the client will show a warning at every joining
      - Users grow used to pressing past warnings, which weakens the item s sense
      - The right answer is a certificate from an office of one s own and not the leaving of the self-signed one
      - Older clients backing not that layer will cease to join
      - Sessions already open, the work of programs, the network, logging on at the machine and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do maszyny łączą się klienty nieobsługujące warstwy opartej na protokole szyfrującym
      - Połączenia pulpitu zdalnego idą przez rozwiązanie pośredniczące wymagające wyboru warstwy
    en:
      - To the machine join themselves clients backing not the layer resting upon the enciphering protocol
      - Joinings of the desk from afar go through an answer standing between that calls for the layer to be chosen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'SecurityLayer'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'SecurityLayer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SecurityLayer' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Reguła daje pełen skutek dopiero z certyfikatem, któremu klient ufa,
    i warto, żeby aplikacja powiedziała to wprost. Certyfikat
    samopodpisany zostawia ostrzeżenie przy każdym połączeniu,
    a przyzwyczajenie do klikania ostrzeżeń niweczy zysk.

    Argument wart postawienia dotyczy różnicy wobec mechanizmu własnego.
    Tamten szyfruje treść, ale nie daje klientowi sposobu sprawdzenia,
    z kim rozmawia. To nie to samo co brak szyfrowania i nie to samo co
    pełna ochrona.

    Odnotowuję parę z punktem o uwierzytelnianiu na poziomie sieci.
    Tamten wymaga poświadczeń przed sesją, ten zapewnia, że sesja idzie
    do właściwej maszyny. Razem zamykają obie strony pytania.
  en: |
    The rule gives its full upshot only with a certificate the client trusts, and it is well that the application
    say so outright. A certificate signed by itself leaves a warning at every joining, and the growing used to
    pressing past warnings undoes the gain.

    The argument worth putting touches the difference against the mechanism of its own. That one enciphers the
    content but gives the client no way of looking at whom it speaks with. It is not the same as no enciphering,
    and not the same as a full guard.

    I set down the pair with the item about warranting at the level of the network. That one calls for warrants
    before the session; this one makes sure the session goes to the right machine. Together they shut both sides
    of the question.
