id: win10-builtin-administrator-renamed

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora przemianowane
    en: The built-in administrator account renamed
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zmienia nazwę wbudowanego konta administratora na inną niż
    nazwa domyślna.

    Reguła wymaga uczciwego opisu, bo jej wartość jest mniejsza, niż się
    wydaje. Identyfikator konta nie zmienia się przy zmianie nazwy, a jest
    on dostępny wieloma drogami — przez zapytania do maszyny, przez odczyt
    uprawnień do zasobów, przez zdarzenia w dzienniku. Kto potrafi tych dróg
    użyć, nazwę odczyta mimo zmiany.

    Wartość leży gdzie indziej i jest realna. Zgadywanie haseł prowadzi się
    masowo, narzędziami, które nazwy kont mają wpisane na sztywno. Takie
    narzędzie na maszynie z kontem przemianowanym nie trafia w nic i próby
    kończą się na nieistniejącym koncie — co przy okazji zostawia w dzienniku
    ślad łatwy do zauważenia.

    Jest to więc reguła, która nie zatrzyma napastnika poświęcającego tej
    maszynie uwagę, a zatrzyma tego, który szuka maszyn łatwych. Przy skali,
    w jakiej odbywa się dziś zgadywanie haseł, ta druga grupa jest liczniejsza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwę konta
    administratora znaną bez żadnego rozpoznania, gotową do użycia
    w narzędziu działającym masowo.
  en: |
    The setting changes the built-in administrator account's name to one other than the default.

    The rule calls for an honest description, its value being smaller than it seems. The account's identifier
    does not change when the name does, and it is to be had by many roads - by queries to the machine, by
    reading the rights upon resources, by events in the log. Whoever can use those roads will read the name
    despite the change.

    The value lies elsewhere and is a real one. The guessing of passwords gets carried on wholesale, by tools
    holding account names written in fast. Such a tool on a machine with a renamed account lights on nothing and
    its tries end at an account that does not exist - which leaves in passing a trace in the log easy to notice.

    It is therefore a rule that will not halt an attacker giving this machine their attention, and will halt the
    one looking for easy machines. At the scale on which passwords get guessed today, that second group is the
    more numerous.

    What an attacker gains while the item goes unmet: the administrator account's name known without any
    reconnaissance at all, ready for use in a tool working wholesale.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i to nie z powodu samej zmiany
    nazwy, tylko z powodu tego, co tę nazwę ma zapisaną.

    Zmiana nazwy jest czynnością natychmiastową i odwracalną. Konto zachowuje
    identyfikator, uprawnienia, hasło i profil — zmienia się wyłącznie to,
    co wpisuje się w okno logowania.

    I właśnie to jest kosztem. Wszystko, co loguje się tym kontem podając
    nazwę, przestanie działać w tej samej chwili: zadania w harmonogramie,
    usługi skonfigurowane ręcznie, skrypty łączące się z tą maszyną, wpisy
    w menedżerze poświadczeń na maszynach innych. Każde z nich zgłosi odmowę
    dostępu i żadne nie powie, że chodzi o nazwę.

    Dlatego zmianę tę robi się razem z przeglądem tych miejsc, a nie przed
    nim. Jest to jedyna reguła w tym bloku, przy której kolejność czynności
    rozstrzyga o tym, czy wdrożenie przejdzie gładko.

    Odnotowuję rzecz osobną: nazwa powtórzona na wszystkich maszynach wnosi
    niewiele, bo po pierwszym rozpoznaniu jest znana tak samo jak domyślna.

    Czego to nie psuje: hasła konta, jego uprawnień, profilu, pozostałych
    kont, logowania domenowego, usług systemowych, sieci.
  en: |
    The class is "needs a planned rollout", and that not because of the renaming itself but because of what
    holds that name written down.

    The renaming is an immediate act and a reversible one. The account keeps its identifier, its rights, its
    password and its profile - what changes is only what gets typed into the logon window.

    And just that is the cost. Everything logging in by that account while giving the name will cease working at
    the same moment: scheduled tasks, services set up by hand, scripts joining to this machine, entries in the
    credential manager on other machines. Each of them will report access denied and none will say the name is
    what is at issue.

    For that the change gets made together with a review of those places, not before it. It is the one rule in
    this block at which the order of acts settles whether the rollout will go smoothly.

    A separate thing I set down: a name repeated on every machine brings little, being after the first
    reconnaissance as well known as the default.

    What this does not break: the account's password, its rights, its profile, the remaining accounts, domain
    logon, system services, or the network.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Zadanie w harmonogramie logujące się kontem wbudowanym po nazwie przestaje działać w chwili zmiany
      - Usługa skonfigurowana ręcznie na to konto przestaje wstawać, a komunikat mówi o odmowie dostępu, nie o nazwie
      - Wpisy w menedżerze poświadczeń na maszynach innych przestają pasować i wymagają poprawienia po kolei
      - Konto zachowuje identyfikator, hasło, uprawnienia i profil, więc zmiana dotyczy wyłącznie nazwy wpisywanej przy logowaniu
      - Pozostałe konta, logowanie domenowe, usługi systemowe i praca sieci pozostają bez zmian
    en:
      - A scheduled task logging in by the built-in account under its name ceases working the moment it is changed
      - A service set up by hand under that account ceases coming up, its message speaking of access denied and not of the name
      - Entries in the credential manager on other machines cease to fit and call for mending one by one
      - The account keeps its identifier, password, rights and profile, so the change touches only the name typed at a logon
      - The remaining accounts, domain logon, system services and the work of the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kontem wbudowanym po nazwie logują się zadania lub usługi, których nie da się poprawić w tym samym oknie serwisowym
      - Procedura naprawy tej maszyny jest zapisana z nazwą domyślną i nie ma jej kto poprawić przed zmianą
    en:
      - Tasks or services log in by the built-in account under its name and cannot be mended in the same service window
      - The procedure for mending this machine is written down with the default name and there is nobody to mend it beforehand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The built-in account is found by the ending of its identifier, not by
      # name. The default names below are written without letters outside the
      # basic alphabet, so that the check does not depend on the encoding in
      # which the command reaches the shell.
      $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
      if ($null -eq $account) { 'CHECK_ERROR' }
      elseif ($account.Name -match '^(administrator|administrador|administrateur|amministratore|rendszergazda)$') { 'DEFAULT_NAME' }
      else { 'RENAMED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'RENAMED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    [pscustomobject]@{
      sid   = (($account.SID.Value) -join '')
      name  = (($account.Name) -join '')
      found = ($null -ne $account)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The name below is a starting point. Pick one of the organisation's own, and
    # do not give every machine the same one - a name repeated across a fleet is
    # as good as known.
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    if ($null -eq $account) { throw 'The built-in administrator account was not found.' }
    Rename-LocalUser -SID $account.SID -NewName 'adm-local'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.found) { throw 'Backup holds no built-in administrator account - nothing to restore.' }
    Rename-LocalUser -SID $b.sid -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-administrator-account

notes:
  pl: |
    Reguła zamyka blok i jest w nim jedyną, której wartość opis musi
    świadomie pomniejszyć. Przedstawianie jej jako ukrycia konta byłoby
    nieuczciwe — identyfikator zostaje, a przez niego nazwa jest do
    odczytania. Wartość polega na wypadnięciu z narzędzi działających
    masowo, nie na ukryciu.

    Warto, żeby aplikacja postawiła to rozróżnienie, bo od niego zależy
    decyzja. Kto broni się przed rozpoznaniem ukierunkowanym, może ten punkt
    świadomie odpuścić; kto broni się przed zgadywaniem masowym, dostaje
    tu wynik nieproporcjonalnie dobry względem kosztu.

    Odnotowuję dwie rzeczy w poleceniach. Sprawdzenie szuka konta po końcówce
    identyfikatora, a nie po nazwie, i rozpoznaje nazwy domyślne z kilku
    wersji językowych zapisane bez znaków spoza alfabetu podstawowego —
    inaczej wynik zależałby od kodowania, w jakim polecenie dociera do
    powłoki. Polecenie naprawcze podaje nazwę przykładową i mówi wprost,
    że ma być zmieniona; nazwa jednakowa na całym parku maszyn znaczy tyle
    co domyślna.
  en: |
    The rule closes the block and is the only one in it whose value the description must knowingly lessen.
    Setting it out as a hiding of the account would be dishonest - the identifier stays, and through it the name
    is to be read. The value rests on falling out of tools working wholesale, not on hiding.

    It is well that the application put that distinction, the decision hanging upon it. Whoever guards against a
    targeted reconnaissance may knowingly let this item go; whoever guards against wholesale guessing gets here
    an outcome disproportionately good against its cost.

    Two things I set down about the commands. The check looks for the account by its identifier's ending rather
    than by name, and recognises the default names of several language versions written without letters outside
    the basic alphabet - otherwise the outcome would hang on the encoding in which the command reaches the
    shell. The remedy command gives an example name and says outright that it is to be changed; a name alike
    across a whole fleet of machines means as much as the default.
