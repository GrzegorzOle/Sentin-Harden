id: win2025-deny-service-logon-guests

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa logowania jako usługa dla grupy Goście
    en: Deny service sign-in for the Guests group
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Logowanie jako usługa jest drogą, którą wchodzi proces uruchamiany
    przy starcie systemu i pracujący bez przerwy w tle.

    Ze wszystkich dróg logowania ta daje obecność najtrwalszą. Zadanie
    harmonogramu uruchamia się cyklicznie i między uruchomieniami nie
    ma go w pamięci; usługa jest obecna cały czas, wstaje przed
    zalogowaniem kogokolwiek i pracuje także wtedy, gdy nikt się nie
    zalogował ani razu.

    Na serwerze jest to stan normalny i właśnie dlatego skuteczny jako
    kryjówka. Serwer pracuje miesiącami bez restartu i bez sesji
    interaktywnej, a wykaz usług jest długi i rzadko czytany w całości.
    Jedna pozycja więcej nie rzuca się w oczy.

    Zapis odmowy zamyka tę drogę dla grupy Goście w sposób trwalszy niż
    wyłączenie konta: obowiązuje niezależnie od stanu konta i ma
    pierwszeństwo nad każdą zgodą, także nad nadaną później.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    utrwalenia obecności w postaci usługi, która wstaje przy starcie
    systemu i przeżywa każdy restart.
  en: |
    A service sign-in is the road a process comes in by that is started at the system's start
    and works unbroken in the background.

    Of all the roads of signing in, this one gives the most lasting presence. A scheduled task
    starts on a cycle and between startings is not in memory; a service is present the whole
    time, comes up before anybody has signed in and works also when nobody has signed in even
    once.

    On a server that is the normal state and hence effective as a hiding place. A server works
    for months without a restart and without an interactive session, while the list of services
    is long and seldom read whole. One entry more does not catch the eye.

    A record of denial shuts that road to the Guests group in a way lasting longer than the
    switching off of the account: it holds whatever the account's state and takes precedence
    over every consent, including one granted later.

    What an attacker gains while the item goes unmet: the means of fixing their presence as a
    service that comes up at the system's start and outlives every restart.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać i nikt niczego nie zauważy. Usługi na
    serwerze pracują na koncie systemu, na kontach usług wbudowanych
    albo na kontach usługowych utworzonych celowo — żadne z nich do
    grupy Goście nie należy.

    Naprawa dopisuje grupę do wykazu odmowy i zachowuje wpisy już
    obecne, żeby nie przywrócić komuś dostępu po cichu.

    Warto wiedzieć, jak wyglądałby objaw, gdyby usługa jednak została tą
    zmianą zatrzymana: usługa nie wstaje, a w dzienniku systemu pojawia
    się zapis o niepowodzeniu logowania jej konta. Jest to objaw
    natychmiastowy i jednoznaczny, w odróżnieniu od trybu wsadowego,
    gdzie łatwiej go przeoczyć.

    Na serwerze pracującym normalnie sytuacja ta nie występuje.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working and nobody notices anything. Services on a server work under the
    system's account, under built-in service accounts or under service accounts made on
    purpose - none of which belongs to the Guests group.

    The mending adds the group to the list of denial and keeps the entries present already, so
    as not to give somebody access back quietly.

    It is worth knowing what the symptom would look like should a service be halted by this
    change after all: the service does not come up, and in the system's log a record appears of
    the failed sign-in of its account. It is an immediate and unmistakable symptom, unlike the
    batch mode, where it is easier to overlook.

    On a server working normally that case does not arise.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Brak znanych regresji — usługi pracują na kontach spoza tej grupy
      - Naprawa zachowuje wpisy już obecne w wykazie odmowy
      - Zatrzymana usługa nie wstaje, a w dzienniku systemu pojawia się zapis o niepowodzeniu
      - Odmowa obowiązuje niezależnie od tego, czy konto gościa jest włączone
    en:
      - No known regressions - services work under accounts outside this group
      - The mending keeps the entries present already in the list of denial
      - A halted service does not come up and a record of the failure appears in the system's log
      - The denial holds whether the guest account is switched on or not
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których ten punkt byłby błędem
    en:
      - No known cases in which this item would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyServiceLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: S-1-5-32-546
  comparison: contains

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyServiceLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyServiceLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyServiceLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    if (-not ($members -contains '*S-1-5-32-546')) { $members += '*S-1-5-32-546' }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyServiceLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyServiceLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-log-on-as-a-service

notes:
  pl: |
    Usługa daje obecność trwalszą niż zadanie harmonogramu, bo jest
    w pamięci cały czas i wstaje przed zalogowaniem kogokolwiek. Stąd
    ten punkt i punkt o trybie wsadowym trzeba domknąć oba — zamknięcie
    jednej drogi nie zamyka drugiej.

    Objaw zatrzymanej usługi jest natychmiastowy i widoczny w dzienniku
    systemu, w odróżnieniu od trybu wsadowego, gdzie łatwiej go
    przeoczyć.

    Sprawdzenie pyta o obecność grupy w wykazie. Naprawa zachowuje wpisy
    dotychczasowe, a grupa wskazywana jest identyfikatorem.
  en: |
    A service gives a presence lasting longer than a scheduled task's, since it is in memory
    the whole time and comes up before anybody has signed in. Hence this item and the one on
    the batch mode must both be shut - shutting one road does not shut the other.

    A halted service's symptom is immediate and shows in the system's log, unlike the batch
    mode, where it is easier to overlook.

    The check asks after the group's presence in the list. The mending keeps the entries so
    far, and the group is pointed to by identifier.
