id: win2016-guest-account-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto gościa wyłączone
    en: The built-in guest account switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby wbudowane konto gościa było wyłączone.

    Kategoria wysoka, bo to konto łamie założenie, na którym opiera się reszta
    zabezpieczeń kont: że dostęp wymaga poświadczenia. Konto gościa działa bez
    hasła i istnieje na każdej maszynie z tym samym, znanym identyfikatorem.
    Nie trzeba go zgadywać, nie trzeba go znajdować — trzeba tylko sprawdzić,
    czy jest włączone.

    Na serwerze skutek jest konkretniejszy niż na stanowisku. Konto gościa
    włączone na maszynie udostępniającej pliki oznacza, że udział z prawami
    dla grupy wszystkich staje się udziałem publicznym — dostępnym dla
    każdego, kto dosięgnie maszyny po sieci, bez podania czegokolwiek.

    Na tym roczniku rzecz ma dodatkowy wymiar. Serwer 2016 bywa utrzymywany
    dla starszych rozwiązań, a włączony gość jest klasycznym obejściem
    problemu zgodności: urządzenie wielofunkcyjne nie umiało się
    uwierzytelnić, więc ktoś dawno temu otworzył mu drzwi w najprostszy
    sposób i zostawił je otwarte.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję na tej
    maszynie bez żadnego poświadczenia, a wraz z nią widok na to, co jest
    udostępnione grupie wszystkich.
  en: |
    The item requires the built-in guest account to be switched off.

    The category is high, because this account breaks the assumption the rest
    of account security rests on: that access takes a credential. The guest
    account works with no password and exists on every machine with the same,
    well-known identifier. It does not have to be guessed or found - it only
    has to be checked for being on.

    On a server the consequence is more concrete than on a workstation. A guest
    account switched on where files are shared means that a share with rights
    granted to the everyone group becomes a public share - open to anybody who
    can reach the machine over the network, supplying nothing at all.

    On this vintage the matter has a further dimension. Server 2016 is often
    kept for older arrangements, and an enabled guest is the classic way round
    a compatibility problem: a multifunction device could not authenticate, so
    somebody long ago opened the door for it in the simplest way and left it
    open.

    What an attacker gains while the item goes unmet: a session on this machine
    with no credential at all, and with it a view of whatever is shared with
    the everyone group.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo konto gościa bywa włączone celowo i coś się
    wtedy na nim opiera.

    Sprawdzenie sprowadza się do jednego pytania: czy z tej maszyny korzysta
    urządzenie albo aplikacja, która nie podaje poświadczeń. Typowe przypadki
    to skanowanie do udziału sieciowego z urządzenia wielofunkcyjnego,
    sterownik maszyny produkcyjnej zapisujący pliki na udziale oraz starsze
    oprogramowanie łączące się z udziałem bez logowania.

    Jeżeli któryś z tych przypadków tu występuje, wyłączenie konta przerwie
    jego pracę od razu — i przerwa będzie wyglądała jak awaria sieci, a nie
    jak skutek zmiany uprawnień. To jest główny powód, dla którego ten punkt
    nie idzie hurtem.

    Właściwym rozwiązaniem takiego przypadku jest konto techniczne z hasłem
    i prawami tylko do jednego katalogu, a nie powrót do gościa. Warto
    zaplanować tę zamianę razem z wyłączeniem, bo inaczej wróci ono
    pierwszego dnia po zgłoszeniu.

    Czego to nie psuje: logowania kontami nazwanymi, udziałów z uprawnieniami
    imiennymi, pracy domeny ani niczego, co się uwierzytelnia.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because a guest account is sometimes on
    deliberately and something then rests on it.

    The review comes down to one question: does a device or an application use
    this machine without supplying credentials. The usual cases are scanning to
    a network share from a multifunction device, a production machine's
    controller writing files to a share, and older software connecting to a
    share without signing in.

    If any of those is present here, switching the account off stops its work at
    once - and the outage will look like a network fault rather than a
    consequence of a rights change. That is the main reason this item does not
    go in bulk.

    The proper answer to such a case is a technical account with a password and
    rights to one directory only, not a return to guest. That swap is worth
    planning together with the switching off, or it will come back on the first
    day after the ticket.

    What this does not break: signing in with named accounts, shares with named
    permissions, the domain's work, or anything that authenticates.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - printing
    - legacy-applications
  what_breaks:
    pl:
      - Skanowanie do udziału z urządzenia wielofunkcyjnego bez poświadczeń przestaje działać od razu
      - Starsze oprogramowanie łączące się z udziałem bez logowania traci dostęp
      - Przerwa wygląda jak awaria sieci, a nie jak skutek zmiany uprawnień
      - Logowanie kontami nazwanymi i udziały z uprawnieniami imiennymi działają bez zmian
    en:
      - Scanning to a share from a multifunction device with no credentials stops working at once
      - Older software connecting to a share without signing in loses access
      - The outage looks like a network fault rather than a consequence of a rights change
      - Signing in with named accounts and shares with named permissions work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z udziałów na tej maszynie korzysta urządzenie lub aplikacja niepodająca poświadczeń, a konto techniczne dla niej nie zostało przygotowane
    en:
      - A device or application that supplies no credentials uses the shares on this machine and no technical account has been prepared for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
      if ($os.ProductType -eq 2) {
        # A domain controller keeps no local accounts. The built-in guest is a
        # domain account there and falls under a separate item.
        'NOT_APPLICABLE'
      }
      else {
        $guest = Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-501' }
        if ($null -eq $guest) { 'NOT_APPLICABLE' }
        elseif ($guest.Enabled) { 'ENABLED' }
        else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $guest = Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' }
    [pscustomobject]@{
      sid     = $guest.SID.Value
      name    = $guest.Name
      enabled = $guest.Enabled
      existed = ($null -ne $guest)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Addressed by identifier rather than by name - the account may have been
    # renamed, and a rename does not change what it is. Check first whether a
    # device writes to a share here without credentials.
    $guest = Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' }
    Disable-LocalUser -SID $guest.SID

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous state - refusing to guess one.' }
    if ($b.enabled) { Enable-LocalUser -SID $b.sid }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-guest-account-status

notes:
  pl: |
    Konto jest rozpoznawane po końcówce identyfikatora, a nie po nazwie.
    Przemianowanie go nie zmienia tego, czym jest, więc audyt oparty na nazwie
    dawałby wynik zależny od języka systemu i od tego, czy ktoś już konto
    przemianował.

    Na kontrolerze domeny reguła zwraca stan „nie dotyczy", bo tam nie ma kont
    lokalnych, a wbudowany gość jest kontem domenowym podlegającym osobnemu
    punktowi. To nie jest pominięcie, tylko właściwe rozróżnienie ról.

    Wyłączenie konta i jego przemianowanie to dwie różne reguły i obie mają
    sens. Wyłączenie zamyka drogę, przemianowanie utrudnia jej odnalezienie.
  en: |
    The account is recognised by the ending of its identifier, not by its name.
    Renaming it does not change what it is, so an audit based on the name would
    give a result depending on the system's language and on whether somebody had
    renamed the account already.

    On a domain controller the rule returns "not applicable", because there are
    no local accounts there and the built-in guest is a domain account covered
    by a separate item. That is not an omission but the right distinction
    between roles.

    Switching the account off and renaming it are two different rules and both
    have a point. Switching off closes a road; renaming makes it harder to find.
