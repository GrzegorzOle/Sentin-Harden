id: win2025-lock-screen-camera-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Personalization
  title:
    pl: Aparat niedostępny z ekranu blokady
    en: Camera unavailable from the lock screen
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera możliwość wywołania aparatu z poziomu ekranu blokady, bez
    logowania.

    Kategoria niska i zostaję przy niej świadomie, bo na serwerze aparatu
    zwykle nie ma. Nie robię jednak z tego powodu do pominięcia reguły —
    wyjątki robione „bo to drobiazg" są dokładnie tym, przez co lista
    wyjątków przestaje być znana.

    To, co ten punkt naprawdę opisuje, jest ogólniejsze niż aparat:
    ekran blokady może uruchamiać składniki systemu w imieniu osoby, która
    nie podała hasła. Aparat jest tu konkretnym przypadkiem tej możliwości,
    a nie sednem sprawy. Każdy taki składnik to kawałek kodu osiągalny przed
    uwierzytelnieniem, a kod osiągalny przed uwierzytelnieniem ma własną,
    niedobrą historię.

    Na serwerze wartość reguły jest więc głównie zapobiegawcza i taką ją
    nazywam. Jeżeli do maszyny kiedykolwiek trafi urządzenie obrazujące —
    a na serwerach zarządzanych zdalnie zdarzają się karty z wbudowanym
    wejściem obrazu — punkt będzie już zamknięty, zamiast czekać, aż ktoś
    zauważy, że przestał być teoretyczny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    składnika systemu przed podaniem hasła, a przy obecnym urządzeniu
    obrazującym także obraz z pomieszczenia.
  en: |
    The item takes away the ability to call up the camera from the lock
    screen, without signing in.

    The category is low and I stay with it deliberately, because a server
    usually has no camera. I do not make that a reason to skip the rule,
    though - exceptions made because something is a trifle are exactly what
    stops a list of exceptions from being known.

    What this item really describes is broader than the camera: the lock
    screen can start system components on behalf of somebody who has given no
    password. The camera is a particular case of that possibility, not the
    heart of the matter. Every such component is a piece of code reachable
    before authentication, and code reachable before authentication has a bad
    history of its own.

    On a server the rule's value is therefore mostly preventive, and I call
    it that. If an imaging device ever reaches the machine - and on remotely
    managed servers, cards with a built-in video input do occur - the item
    will already be closed, instead of waiting for somebody to notice it has
    stopped being theoretical.

    What an attacker gains while the item goes unmet: access to a system
    component before a password is given, and, where an imaging device is
    present, a view of the room as well.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie ma tu nic do stracenia, bo
    nie ma aparatu do wywołania.

    Skutek, gdyby urządzenie obrazujące jednak było: znika możliwość
    wywołania aparatu z ekranu blokady. Po zalogowaniu aparat działa
    normalnie i jest dostępny dla wszystkich programów, które go używają.
    Punkt odbiera drogę dostępu sprzed logowania, a nie samo urządzenie.

    Czego to nie psuje — i warto to rozróżnić, bo nazwa sugeruje szerzej:
    konferencji, sesji zdalnych z obrazem, przekierowania kamery do sesji
    zdalnej ani żadnego sterownika. Zmiana zaczyna i kończy się na ekranie
    blokady.

    Rzecz do zapamiętania: ten punkt i wyłączenie pokazu slajdów leżą pod
    jedną ścieżką rejestru, pod różnymi nazwami wartości. Znajoma ścieżka
    nie znaczy, że drugi punkt jest zrobiony.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and on a server there is nothing to lose
    here, because there is no camera to call up.

    The effect, should an imaging device be present after all: the ability to
    call up the camera from the lock screen goes. After signing in the camera
    works normally and is available to every program that uses it. The item
    takes away a route of access from before sign-in, not the device itself.

    What this does not break - and the distinction is worth making, because
    the name suggests something wider: conferences, remote sessions with
    video, redirecting a camera into a remote session, or any driver. The
    change begins and ends at the lock screen.

    Something to remember: this item and the switching off of the slideshow
    lie under one registry path, under different value names. A familiar path
    does not mean the other item is done.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Znika możliwość wywołania aparatu z ekranu blokady, czyli bez podania hasła
      - Po zalogowaniu aparat działa normalnie i jest dostępny dla wszystkich programów, które go używają
      - Konferencje, sesje zdalne z obrazem, przekierowanie kamery do sesji zdalnej i sterowniki nie są tym objęte
      - Punkt leży pod tą samą ścieżką rejestru co wyłączenie pokazu slajdów, pod inną nazwą wartości
    en:
      - The ability to call up the camera from the lock screen, that is without giving a password, goes
      - After signing in the camera works normally and is available to every program that uses it
      - Conferences, remote sessions with video, camera redirection into a remote session and drivers are not covered
      - The item lies under the same registry path as switching off the slideshow, under a different value name
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym wywołanie aparatu z ekranu blokady jest przyjętym sposobem pracy
    en:
      - The machine is a workstation where calling up the camera from the lock screen is an accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      $name = 'NoLockScreenCamera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    $name = 'NoLockScreenCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Broader than the camera: the lock screen can start system components on
    # behalf of somebody who gave no password, and code reachable before
    # authentication has a bad history of its own. After signing in the camera
    # works normally - only the route from before sign-in goes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLockScreenCamera' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

