id: win2025-application-log-retention

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Application
  title:
    pl: Zachowanie dziennika aplikacji po zapełnieniu
    en: Behaviour of the application log once it fills up
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, co dzieje się z dziennikiem aplikacji po jego
    zapełnieniu: najstarsze zapisy mają być nadpisywane nowymi.

    Zostawiam kategorię niską. Jest to trzeci z punktów o tym samym
    ustawieniu i rozstrzyga tę samą sprawę co dwa pozostałe, ale ma
    własną cechę, przez którą na serwerze zadziała najwcześniej.

    Ten dziennik wypełnia oprogramowanie, a nie system, więc jest tym
    z trzech, który zapełnia się najszybciej i najmniej przewidywalnie.
    Wystarczy jedna aplikacja w pętli błędu — sterownik
    zgłaszający ten sam wyjątek co sekundę, integracja próbująca
    połączyć się z niedostępną usługą — żeby dziennik zapełnił się
    w godziny. Przy zakazie nadpisywania właśnie w tym miejscu maszyna
    najpierw napotka skutek: dziennik zamarznie, a przestanie w nim
    przybywać zapisów dokładnie wtedy, kiedy dzieje się coś, co warto
    było zapisać.

    Chcę to powiedzieć jasno, bo brzmi jak paradoks, a nim nie jest:
    ustawienie, które wygląda na najostrożniejsze, w tym dzienniku psuje
    najwięcej, bo aplikacja w pętli błędu sama je uruchamia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przy
    zakazie nadpisywania — łatwy sposób zamrożenia dziennika aplikacji
    przed właściwym działaniem, bo wystarczy doprowadzić do wysypu
    zwykłych błędów.
  en: |
    The item sets what befalls the application log once it is full - the oldest writings are to be
    written over by new ones.

    I leave the category low. It is the third of the items upon the same setting and it settles the
    same matter as the two others, but it has a mark of its own whereby upon a server it will tell the
    earliest.

    That log is filled by software and not by the system, so it is of the three the one that fills the
    fastest and the least foreseeably. One application in a ring of error is enough - a driver telling
    of the same slip every second, a knitting-together trying to bind to a working that is not there -
    for the log to fill within hours. At a forbidding of the writing over it is in just that stead that
    the machine will meet the outcome first - the log will freeze, and writings will stop coming into
    it at just the hour when something befalls that was worth the writing down.

    I would say it clearly, it sounding like a thing against itself though it is none - the setting that
    looks the most heedful breaks in that log the most, for an application in a ring of error sets it
    off by itself.

    What an attacker gains while the item goes unmet - at a forbidding of the writing over, an easy way
    of freezing the application log before the doing in earnest, it being enough to bring about a spill
    of plain errors.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce, niczego nie zatrzymuje i nie wymaga restartu.

    Trzy punkty o zachowaniu dzienników po zapełnieniu są jedną decyzją
    i należy je stosować razem. Osobno mają sens tylko wtedy, gdy
    któryś z dzienników jest z jakiegoś powodu wyłączony spod wspólnego
    ustawienia — a jeżeli tak jest, to samo to warto sprawdzić, bo
    zwykle jest pozostałością po czyjejś decyzji sprzed lat, o której
    nikt już nie pamięta.

    To samo zastrzeżenie co przy dwóch pozostałych: jeżeli na maszynie
    ustawiono wcześniej zakaz nadpisywania i dziennik jest pełny, po tej
    zmianie najstarsze zapisy zaczną znikać. Kopię robi się przed.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule, stops nothing and takes no
    starting anew.

    The three items upon the behaviour of logs once full are one deciding and are to be laid on
    together. Apart they have sense only where one of the logs is for some ground held out from the
    shared setting - and if that be so, that itself is worth the looking into, it being mostly a
    leaving of somebody's deciding from years ago that nobody remembers any more.

    The same saving as at the two others - if upon the machine a forbidding of the writing over was set
    before and the log be full, after that change the oldest writings will begin to go away. The copy is
    made before.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie z zakazem nadpisywania dziennik zacznie się nadpisywać i najstarsze zapisy zaczną znikać
      - Przestaje działać oczekiwanie, że pełny dziennik zamarza i czeka nietknięty
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Dziennik wyłączony spod wspólnego ustawienia bywa pozostałością po decyzji sprzed lat i sam w sobie wymaga sprawdzenia
    en:
      - Upon a machine with a forbidding of the writing over the log will begin to write itself over and the oldest writings will go away
      - The looking for a full log to freeze and wait untouched stops holding
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - A log held out from the shared setting is at times a leaving of a deciding from years ago and takes a looking into of itself
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie ustawiono zakaz nadpisywania świadomie i nie zrobiono jeszcze kopii zebranych zapisów
    en:
      - Upon the machine a forbidding of the writing over was set wittingly and no copy of the gathered writings has yet been made
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text.
      # Reading it numerically would turn an absent value into a zero and
      # report a machine with no policy at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
      $name = 'Retention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Of the three logs this one fills the fastest and the least predictably:
    # a single application in an error loop fills it within hours, and with
    # overwriting forbidden it is here that the log freezes first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Trzeci z punktów o tym samym ustawieniu, ale z własną cechą: ten
    dziennik wypełnia oprogramowanie, nie system, więc zapełnia się
    najszybciej i najbardziej nieprzewidywalnie. Jedna aplikacja w pętli
    błędu wystarczy, żeby zapełnił się w godziny.

    Brzmi jak paradoks, a nim nie jest: ustawienie wyglądające na
    najostrożniejsze psuje w tym dzienniku najwięcej, bo aplikacja
    w pętli błędu sama je uruchamia.

    Dziennik wyłączony spod wspólnego ustawienia warto sprawdzić
    osobno — zwykle jest pozostałością po decyzji sprzed lat.
  en: |
    The third of the items upon the same setting, but with a mark of its own - that log is filled by
    software and not by the system, so it fills the fastest and the least foreseeably. One application
    in a ring of error is enough for it to fill within hours.

    It sounds like a thing against itself and is none - the setting that looks the most heedful breaks
    in that log the most, for an application in a ring of error sets it off by itself.

    A log held out from the shared setting is worth a looking into of its own - it is mostly a leaving
    of a deciding from years ago.
