id: win2016-rdp-security-layer-tls

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Warstwa zabezpieczeń pulpitu zdalnego ustalona na protokół szyfrujący
    en: The remote desktop security layer fixed to the encrypting protocol
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zestawiać sesję pulpitu zdalnego wewnątrz standardowego
    protokołu szyfrującego warstwy transportowej, zamiast korzystać
    z własnego mechanizmu pulpitu zdalnego albo zostawiać wybór negocjacji.

    Różnica nie dotyczy siły szyfrowania, tylko czegoś, co waży więcej:
    sprawdzenia, z kim się rozmawia. Własny mechanizm pulpitu zdalnego
    szyfruje ruch, ale nie daje łączącemu się sposobu na stwierdzenie, że
    po drugiej stronie stoi maszyna, której szukał. Standardowy protokół
    warstwy transportowej daje, bo opiera się na certyfikacie.

    Skutek jest taki, że bez tego punktu ktoś, kto siedzi na drodze między
    stanowiskiem a serwerem, może tę sesję przyjąć na siebie. Zestawia
    połączenie z klientem, zestawia drugie z serwerem i przepisuje ruch
    w obie strony. Szyfrowanie działa w obu połączeniach — tylko że oba
    kończą się u niego, więc widzi wszystko, co zostało wpisane, łącznie
    z hasłem podanym na ekranie logowania.

    Wartość wymagana zamyka negocjację, a nie tylko ją przechyla. Zgoda na
    negocjację oznacza, że o postaci sesji rozstrzyga klient — a napastnik
    w roli klienta wybierze to, co mu wygodne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję, do
    której może wejść w środek i odczytać wszystko, co w niej przechodzi,
    z poświadczeniem podanym przy logowaniu włącznie.
  en: |
    The setting has the remote desktop session set up inside the standard encrypting
    protocol of the transport layer, rather than using the remote desktop's own
    mechanism or leaving the choice to negotiation.

    The difference concerns not the strength of the encryption but something
    weighing more: the checking of who one is talking to. The remote desktop's own
    mechanism encrypts the traffic but gives whoever connects no way of establishing
    that the machine on the other side is the one they were looking for. The
    standard transport layer protocol does, since it rests on a certificate.

    The upshot is that without this item somebody sitting on the road between the
    workstation and the server can take that session upon themselves. They set up a
    connection with the client, set up a second with the server, and copy the
    traffic both ways. Encryption works in both connections - only both end at them,
    so they see everything typed, the password offered at the sign-in screen
    included.

    The required value closes the negotiation rather than merely tilting it.
    Consenting to negotiation means the form of the session is settled by the
    client - and an attacker in the client's role will pick what suits them.

    What an attacker gains while the item goes unmet: a session they can step into
    the middle of and read everything passing through it, the credential offered at
    sign-in included.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i punktem, który trzeba sprawdzić, jest
    certyfikat.

    Serwer bez własnego certyfikatu wystawia przy pierwszym połączeniu
    certyfikat wygenerowany samodzielnie. Sesja wtedy działa i jest
    szyfrowana, ale klient wyświetla ostrzeżenie, że nie potrafi tej maszyny
    rozpoznać. Ostrzeżenie to jest w codziennej pracy klikane bez czytania
    i po kilku tygodniach przestaje cokolwiek znaczyć — co odbiera regule
    połowę wartości, bo właśnie rozpoznanie maszyny jest tu treścią.

    Sprawdzić trzeba zatem nie tylko to, czy klienci obsługują protokół
    warstwy transportowej — bo obsługują go od wielu wydań — ale czy serwer
    ma certyfikat, któremu klienci ufają. Jeśli nie ma, zmianę należy poprzedzić
    jego wystawieniem, inaczej kupuje się szyfrowanie bez rozpoznania.

    Zostaje wąska grupa klientów, które protokołu warstwy transportowej nie
    znają: bardzo stare terminale, konsole wbudowane w sprzęt i własne
    implementacje w narzędziach monitorujących. Te przestaną się łączyć.

    Objaw w razie braku obsługi jest jednoznaczny — odmowa przy zestawianiu
    sesji, bez ekranu logowania.

    Czego to nie psuje: sesji już otwartych, konsoli lokalnej, zarządzania
    przez powłokę zdalną.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the point calling for a check is the
    certificate.

    A server with no certificate of its own puts up, at the first connection, a
    certificate it generated itself. The session then works and is encrypted, but
    the client shows a warning that it cannot recognise this machine. In daily work
    that warning is clicked through unread and after a few weeks means nothing at
    all - which takes half the rule's value away, since recognising the machine is
    the substance here.

    What has to be checked is therefore not only whether the clients support the
    transport layer protocol - they have for many releases - but whether the server
    has a certificate the clients trust. If it has none, the change should be
    preceded by issuing one, or else one buys encryption without recognition.

    There remains a narrow group of clients that do not know the transport layer
    protocol: very old terminals, consoles built into hardware, and implementations
    of their own in monitoring tools. Those will stop connecting.

    The symptom where support is lacking is unambiguous - a refusal while the
    session is being set up, with no sign-in screen.

    What this does not break: sessions already open, the local console, management
    through a remote shell.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Bardzo stare terminale i konsole wbudowane w sprzęt, nieznające protokołu warstwy transportowej, przestają się łączyć
      - Własne implementacje klienta w narzędziach monitorujących tracą dostęp do sesji na tej maszynie
      - Serwer bez zaufanego certyfikatu nadal wyświetla klientom ostrzeżenie o nierozpoznanej maszynie, więc reguła traci połowę wartości
      - Sesje już otwarte, konsola lokalna i zarządzanie przez powłokę zdalną pozostają bez zmian
    en:
      - Very old terminals and consoles built into hardware, which do not know the transport layer protocol, stop connecting
      - Client implementations of their own in monitoring tools lose access to sessions on this machine
      - A server with no trusted certificate still shows clients a warning about an unrecognised machine, so the rule loses half its value
      - Sessions already open, the local console and management through a remote shell stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer nie ma certyfikatu, któremu ufają łączący się klienci, i nie zaplanowano jego wystawienia
      - Do maszyny łączą się terminale albo konsole sprzętowe nieobsługujące protokołu warstwy transportowej
    en:
      - The server has no certificate that the connecting clients trust and no issuing of one has been planned
      - Terminals or hardware consoles that do not support the transport layer protocol connect to this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'SecurityLayer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'SecurityLayer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry takes values from a set: zero is the protocol's own way, one leaves
    # the choice to negotiation, two fixes the transport layer.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SecurityLayer' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt ma sens dopiero razem z certyfikatem i tak powinien być pokazany.
    Sama zmiana wpisu daje szyfrowanie standardowym protokołem; rozpoznanie
    maszyny daje dopiero certyfikat, któremu klient ufa. Aplikacja, która
    pokaże ten punkt jako zamknięty, a certyfikat przemilczy, wprowadzi
    czytelnika w błąd.

    Reguła sąsiaduje z punktem o poziomie szyfrowania i bywa z nim mylona.
    Ta rozstrzyga, w co opakowana jest sesja i czy da się maszynę rozpoznać;
    tamta — jak silne jest szyfrowanie wewnątrz. Ta waży więcej, bo
    rozpoznanie jest warunkiem, żeby szyfrowanie miało do kogo się odnosić.
  en: |
    The item makes sense only together with a certificate, and it should be shown as
    such. The change of the entry alone gives encryption by the standard protocol;
    recognising the machine comes only from a certificate the client trusts. An
    application showing this item as closed while passing over the certificate in
    silence will mislead the reader.

    The rule neighbours the item on the encryption level and is at times confused
    with it. This one settles what the session is wrapped in and whether the machine
    can be recognised; that one how strong the encryption is inside. This one weighs
    more, since recognition is the condition of the encryption having anybody to
    refer to.
