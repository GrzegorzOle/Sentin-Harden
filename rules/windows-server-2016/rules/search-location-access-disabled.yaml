id: win2016-search-location-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Dostęp wyszukiwania do położenia maszyny wyłączony
    en: The search's access to the machine's location switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera wyszukiwaniu dostęp do informacji o położeniu
    maszyny.

    Powód, dla którego to ma znaczenie na serwerze, nie jest oczywisty
    i warto go wyłożyć. Położenie maszyny nie jest samo w sobie tajemnicą,
    ale połączone z pytaniem wysyłanym na zewnątrz staje się czymś innym:
    zapytanie przestaje być anonimowym ciągiem znaków, a staje się
    zapytaniem zadanym z określonego miejsca.

    Znaczy to, że informacja o tym, gdzie ta maszyna stoi, wychodzi razem
    z tym, czego ktoś na niej szukał. Dla infrastruktury, której
    rozmieszczenie nie jest publiczne, jest to wyniesienie jednego
    z niewielu faktów, które naprawdę warto zachować dla siebie.

    Punkt jest wąski i warto to przyznać. Dotyczy wyłącznie wyszukiwania,
    a nie usługi położenia ani innych składników, które z niej korzystają.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: powiązanie
    tego, czego szukano na tej maszynie, z miejscem, w którym ona stoi.
  en: |
    The setting takes the search's access to word of the machine's location away.

    The reason that matters on a server is not an obvious one and is worth setting out. A machine's
    location is of itself no secret, but joined with a question sent outward it becomes something else:
    the query ceases to be an anonymous string of characters and becomes a query put from a particular
    place.

    That means word of where this machine stands goes out together with what somebody on it was looking
    for. For infrastructure whose siting is not public, that is the carrying out of one of the few facts
    truly worth keeping to oneself.

    The item is a narrow one and that is worth owning. It concerns searching alone, and not the location
    service or the other components that use it.

    What an attacker gains while the item goes unmet: a tying of what was searched for on this machine to
    the place where it stands.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze nic z tego nie korzysta. Wyszukiwanie działa dalej,
    a jedyna różnica dotyczy wyników zależnych od miejsca, których na
    serwerze i tak nikt nie oczekuje.

    Rozróżnienie warte zrobienia: punkt nie wyłącza usługi położenia
    i nie dotyczy składników, które z niej korzystają. Jeżeli na maszynie
    działa cokolwiek, co potrzebuje wiedzieć, gdzie stoi, będzie wiedziało
    dalej.

    Nie ma znanych regresji.

    Czego to nie psuje: wyszukiwania plików i ustawień, usługi położenia,
    aplikacji korzystających z położenia, strefy czasowej, pracy systemu,
    usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    On a server nothing uses this. Searching works on, and the one difference concerns results depending on
    place, which on a server nobody expects anyway.

    A distinction worth making: the item does not switch the location service off and does not concern the
    components that use it. If anything works on the machine that needs to know where it stands, it will go
    on knowing.

    There are no known regressions.

    What this does not break: the searching of files and settings, the location service, applications using
    the location, the time zone, the system's working, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Wyniki wyszukiwania zależne od miejsca przestają się pojawiać, a wyszukiwanie plików i ustawień działa dalej
      - Usługa położenia i aplikacje, które z niej korzystają, pozostają nietknięte
      - Strefa czasowa i ustawienia regionalne pozostają bez zmian
      - Na serwerze nic z tej drogi nie korzysta, więc zmiana nie jest odczuwalna
    en:
      - Search results depending on place cease to appear, and the searching of files and settings works on
      - The location service and the applications using it stay untouched
      - The time zone and the regional settings stay unchanged
      - On a server nothing uses that road, so the change is not felt
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa wyszukiwanie zależne od miejsca i jest to świadomie wykorzystywane w pracy
    en:
      - Searching depending on place works on the machine and is knowingly used in the work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowSearchToUseLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowSearchToUseLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Search stops reading where the machine is. The location service itself
    # and anything else that uses it are untouched by this.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSearchToUseLocation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Punkt zamyka blok i jest w nim najwęższy. Warto, żeby opis to przyznał,
    zamiast rozdmuchiwać uzasadnienie do rozmiarów sąsiadów.

    Argument, który go broni, jest jednak konkretny i wart wypowiedzenia:
    położenie samo w sobie nie jest tajemnicą, ale połączone z treścią
    zapytania przestaje nią nie być. Jest to ten sam typ rozumowania co
    przy spisie wersji oprogramowania — pojedynczy fakt nic nie znaczy,
    zestawienie faktów znaczy dużo.

    Rozróżnienie wobec usługi położenia jest drugą rzeczą wartą pokazania.
    Punkt nie wyłącza niczego poza jednym korzystającym; obawa, że maszyna
    przestanie wiedzieć, gdzie stoi, jest bezpodstawna.

    Blok kończy się tu sześcioma pozycjami, z których pięć nie kosztuje
    nic, a jedna wymaga pytania o przyzwyczajenie obsługi. Jest to dobry
    przykład zestawu, który w trybie zbiorczym da się wykonać prawie
    w całości — i warto, żeby aplikacja właśnie tak go przedstawiła.
  en: |
    The item shuts the block and is the narrowest in it. It is well that the description own that rather
    than blow the warrant up to its neighbours' size.

    The argument defending it is concrete, though, and worth uttering: a location is of itself no secret,
    but joined with the content of a query it ceases not to be one. It is the same type of reasoning as at
    the inventory of software versions - a single fact means nothing, a joining of facts means much.

    The distinction from the location service is the second thing worth showing. The item switches nothing
    off beyond one user of it; the fear that the machine will cease to know where it stands is groundless.

    The block ends here with six entries, of which five cost nothing and one calls for a question about a
    habit of the attendance. It is a good example of a set that in the bulk mode can be carried out almost
    whole - and it is well that the application present it just so.
