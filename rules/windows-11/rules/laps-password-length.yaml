id: win11-laps-password-length

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Długość losowanego hasła lokalnego administratora co najmniej piętnaście znaków
    en: Length of the randomly chosen local administrator password at least fifteen characters
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile znaków ma mieć hasło lokalnego administratora
    losowane przez system, i wymaga co najmniej piętnastu.

    Piętnaście znaków nie jest liczbą przypadkową i warto powiedzieć, skąd
    się bierze, bo próg ten pojawia się w wielu miejscach naraz. Hasła
    krótsze system przechowuje dodatkowo w postaci skrótu wyliczonego
    mechanizmem sprzed lat, słabym na tyle, że odtworzenie z niego hasła jest
    kwestią godzin niezależnie od tego, jak hasło wygląda. Od piętnastu
    znaków ten skrót przestaje powstawać.

    Znaczy to, że próg piętnastu znaków nie jest stopniowaniem — jest
    granicą, po której jeden ze sposobów odzyskania hasła znika całkowicie.
    Hasło czternastoznakowe i piętnastoznakowe różnią się nie o jeden znak,
    tylko o obecność całej klasy ataku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odtworzenia hasła lokalnego administratora ze skrótu zdjętego z maszyny,
    bez kontaktu z siecią i bez ograniczeń czasowych. A ponieważ mechanizm
    losujący ma sens tylko wtedy, gdy hasła pozostają nieznane, jest to
    droga znosząca korzyść z całej reszty.

    Hasło losowane maszynowo nie jest przez nikogo zapamiętywane, więc jego
    wydłużenie nie kosztuje nic.
  en: |
    The setting settles how many characters the local administrator's password chosen at
    random by the system is to have, and takes at least fifteen.

    Fifteen characters is no chance number and it is worth saying whence it comes, since
    that threshold appears in many places at once. Shorter passwords the system keeps
    besides in the form of a digest reckoned by a mechanism from years ago, weak enough
    that recovering the password from it is a matter of hours whatever the password looks
    like. From fifteen characters that digest stops being made.

    That means the threshold of fifteen characters is not a grading - it is a boundary past
    which one of the ways of recovering a password vanishes altogether. A fourteen- and a
    fifteen-character password differ not by one character but by the presence of a whole
    class of attack.

    What an attacker gains while the item goes unmet: the means of recovering the local
    administrator's password from a digest taken off the machine, with no contact with the
    network and no limit of time. And since the mechanism choosing at random makes sense
    only while the passwords stay unknown, it is a road undoing the benefit of all the
    rest.

    A machine-chosen password is remembered by nobody, so lengthening it costs nothing.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji i nie zmienia sposobu pracy.

    Nowa długość obowiązuje od następnego losowania; hasła bieżące nie są tą
    zmianą unieważniane. Odczyt hasła z katalogu i logowanie nim działają bez
    zmiany.

    Sprawdzenia wymagają wyłącznie narzędzia przenoszące hasło dalej.
    Zdarzają się pola wejściowe i skrypty przycinające hasło do ustalonej
    długości bez ostrzeżenia — wtedy logowanie nie powiedzie się w sposób
    trudny do rozpoznania, bo narzędzie zgłosi hasło błędne, a nie hasło
    przycięte.

    Jest to wada tych narzędzi, a nie tej zmiany.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away no function and alters no way of working.

    The new length binds from the next choosing; the current passwords are not voided by
    this change. Reading the password from the directory and signing in with it work
    unchanged.

    Only tools carrying the password further need checking. There are input fields and
    scripts that cut a password to a settled length without warning - the sign-in then
    fails in a way hard to recognise, since the tool will report a wrong password rather
    than a cut one.

    That is a fault of those tools rather than of this change.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia przycinające hasło do ustalonej długości przestają się logować
      - Nowa długość obowiązuje dopiero od następnego losowania
      - Hasła bieżące nie są tą zmianą unieważniane
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Tools cutting the password to a settled length stop signing in
      - The new length binds only from the next choosing
      - The current passwords are not voided by this change
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Hasło jest podstawiane do narzędzia przyjmującego hasła krótsze niż piętnaście znaków
    en:
      - The password is passed to a tool taking passwords shorter than fifteen characters
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordLength'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordLength' -ErrorAction SilentlyContinue).'PasswordLength'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordLength'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Fifteen is the lower bound the item takes; a longer password meets it too.
    Set-ItemProperty -Path $path -Name 'PasswordLength' -Value 15 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Porównanie jest „nie mniej niż", więc hasło dłuższe niż piętnaście znaków
    spełnia punkt tak samo. Polecenie naprawcze zapisuje wartość progową,
    bo jest to najmniejsza zmiana prowadząca do zgodności — dłuższa jest
    dopuszczalna i nie wymaga niczego dodatkowego.

    Próg piętnastu znaków wraca w tym benchmarku także przy hasłach
    użytkowników i za każdym razem z tego samego powodu. Warto o tym
    pamiętać przy czytaniu raportu: dwa różne punkty mówią o tej samej
    granicy w dwóch różnych miejscach systemu.

    Wszystkie ustawienia tego mechanizmu leżą w jednym kluczu.

    Brak wartości nie jest stanem zgodnym, bo domyślna długość jest krótsza.
  en: |
    The comparison is "not less than", so a password longer than fifteen characters meets
    the item just as well. The remedy command writes the threshold value, since that is the
    smallest change leading to compliance - a longer one is admissible and takes nothing
    further.

    The threshold of fifteen characters returns in this benchmark with users' passwords as
    well, and every time for the same reason. It is worth keeping in mind when reading the
    report: two different items speak of the same boundary in two different places of the
    system.

    All the settings of that mechanism lie in one key.

    A missing value is not a compliant state, since the default length is shorter.
