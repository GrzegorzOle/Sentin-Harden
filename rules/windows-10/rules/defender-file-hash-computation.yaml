id: win10-defender-file-hash-computation

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Wyliczanie sumy kontrolnej plików włączone
    en: Computation of a file checksum switched on
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe wyliczać sumę kontrolną każdego sprawdzanego pliku
    i zapisywać ją razem ze zdarzeniem.

    Bez tej wartości zdarzenie opisuje plik nazwą i ścieżką. Jedno
    i drugie napastnik ustala sam i jedno i drugie zmienia się przy
    kopiowaniu. Suma kontrolna opisuje zawartość, a ta jest tym samym
    plikiem na każdej maszynie, pod każdą nazwą i w każdym katalogu.

    Zysk pojawia się dopiero przy pytaniu zadanym później. „Czy ten sam
    plik był gdzieś jeszcze" jest pytaniem, na które bez sumy kontrolnej
    nie ma odpowiedzi — a jest to pytanie pierwsze po znalezieniu czegoś
    na jednej maszynie.

    Odnotowuję, że reguła niczego nie blokuje. Jest to punkt o jakości
    zapisu, nie o ochronie; sam z siebie nie zatrzymuje żadnego pliku.
    Wartość ma wtedy, gdy zdarzenia są zbierane i porównywane, a nie gdy
    leżą na maszynie do przejrzenia po fakcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    ten sam plik pod dwiema nazwami zostanie opisany jako dwie różne rzeczy.
  en: |
    The setting bids a checksum be worked out for every file checked, and written down together with the
    happening.

    Without that value the happening describes a file by its name and its path. The attacker settles both
    themselves, and both change at a copying. A checksum describes the contents, and those are the same file upon
    every machine, under every name and in every folder.

    The gain comes up only at a question asked later. "Was that same file anywhere else" is a question to which
    without a checksum there is no answer - and it is the first question after something is found upon one
    machine.

    I set down that the rule blocks nothing. It is an item about the quality of the record and not about
    protection; of itself it holds back no file. It has worth where the happenings are gathered and set against
    one another, and not where they lie upon the machine to be looked over after the fact.

    What an attacker gains while the item goes unmet: the surety that one and the same file under two names will
    be described as two different things.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    maszyna ma na to zapas mocy.

    Wyliczenie sumy kontrolnej wymaga przeczytania pliku w całości. Przy
    plikach małych jest to koszt pomijalny. Przy skanowaniu pełnym na
    maszynie z dyskiem talerzowym i z dużą liczbą plików czas skanowania
    rośnie zauważalnie, bo do każdego pliku dochodzi pełny odczyt.

    Odnotowuję, gdzie bywa to widoczne poza skanowaniem: na maszynie
    pracującej z plikami bardzo dużymi, gdzie każdy odczyt do sprawdzenia
    jest odczytem gigabajtów.

    Sprawdzić trzeba wobec tego rodzaj maszyny. Na stanowisku biurowym
    z dyskiem półprzewodnikowym zmiana jest niezauważalna. Na starszym
    sprzęcie z dyskiem talerzowym bywa różnicą godziny w skanowaniu
    pełnym.

    Druga rzecz warta sprawdzenia: sam zapis sumy kontrolnej nie ma
    wartości, jeśli zdarzenia nie są nigdzie zbierane. Wtedy punkt
    kosztuje, a nie daje nic.

    Czego to nie psuje: wykrywania zagrożeń, blokowania plików, otwierania
    dokumentów, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether the machine has the power to spare.

    The working out of a checksum calls for the reading of a file whole. With small files that cost may be passed
    over. At a full scan upon a machine with a platter disk and a great number of files the time of the scan
    grows noticeably, a full reading falling to every file.

    I set down where it shows at times outside the scan: upon a machine working with very great files, where
    every reading for a check is a reading of gigabytes.

    The kind of machine therefore has to be reviewed. Upon an office workstation with a solid-state disk the
    change goes unnoticed. Upon older gear with a platter disk it is at times a difference of an hour in a full
    scan.

    A second thing worth reviewing: the writing down of a checksum has of itself no worth where the happenings
    are gathered nowhere. The item costs then and gives nothing.

    What this does not break: the finding of threats, the blocking of files, the opening of documents, logging
    on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Skanowanie pełne na maszynie z dyskiem talerzowym wydłuża się nawet o godzinę, bo do każdego pliku dochodzi pełny odczyt
      - Maszyna pracująca z plikami bardzo dużymi odczuwa to również poza skanowaniem pełnym
      - Sam zapis sumy kontrolnej nie daje nic, jeśli zdarzenia nie są nigdzie zbierane i porównywane
      - Reguła niczego nie blokuje, bo dotyczy jakości zapisu, a nie ochrony
      - Wykrywanie zagrożeń, blokowanie plików, otwieranie dokumentów, logowanie i drukowanie pozostają bez zmian
    en:
      - A full scan upon a machine with a platter disk draws out by up to an hour, a full reading falling to every file
      - A machine working with very great files feels it outside the full scan as well
      - The writing down of a checksum gives nothing where the happenings are gathered and set against one another nowhere
      - The rule blocks nothing, touching the quality of the record and not the protection
      - The finding of threats, the blocking of files, the opening of documents, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna stoi na starszym sprzęcie z dyskiem talerzowym i skanowanie pełne już teraz nie mieści się w oknie
      - Zdarzenia ochrony nie są nigdzie zbierane, więc suma kontrolna nie ma z czym zostać porównana
    en:
      - The machine stands upon older gear with a platter disk and a full scan already does not fit the window
      - The protection s happenings are gathered nowhere, so a checksum has nothing to be set against
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableFileHashComputation'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $name = 'EnableFileHashComputation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The checksum is computed for every file scanned, so the cost falls upon the
    # scan and not upon the opening of a file.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFileHashComputation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną z poziomu drugiego oraz jedyną,
    która niczego nie chroni. Warto, żeby aplikacja to nazwała, bo punkt
    postawiony wśród mechanizmów ochrony wygląda na jeden z nich.

    Argument wart zachowania dotyczy tego, co opisuje plik. Nazwa
    i ścieżka są opisem, który napastnik ustala sam i zmienia przy każdym
    skopiowaniu. Suma kontrolna opisuje zawartość i jest tym samym ciągiem
    znaków wszędzie — a przez to jedynym, po czym da się zadać pytanie
    o wiele maszyn naraz.

    Odnotowuję warunek, pod którym punkt ma sens. Zdarzenia muszą być
    gdzieś zbierane i porównywane. Na maszynie pojedynczej, z której
    nikt nie wynosi dzienników, ta wartość kosztuje odczyt każdego
    pliku i nie daje w zamian nic — i jest to właściwy powód, żeby
    ją świadomie odpuścić.
  en: |
    The rule closes the block and is the only one in it of the second level and the only one that guards nothing.
    It is well that the application name that, an item set among the mechanisms of protection looking like one of
    them.

    The argument worth keeping touches what describes a file. A name and a path are a description the attacker
    settles themselves and changes at every copying. A checksum describes the contents and is the same string of
    marks everywhere - and by that the one thing upon which a question about many machines at once may be asked.

    I set down the condition under which the item makes sense. The happenings have to be gathered and set against
    one another somewhere. Upon a single machine from which nobody carries the logs away, that value costs the
    reading of every file and gives nothing back - and that is a proper ground for letting it go knowingly.
