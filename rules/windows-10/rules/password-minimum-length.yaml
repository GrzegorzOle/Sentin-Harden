id: win10-password-minimum-length

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najkrótsze dopuszczalne hasło
    en: The shortest password allowed
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, ilu znaków musi mieć najkrótsze hasło przyjmowane
    przez maszynę dla kont lokalnych.

    Długość jest jedyną własnością hasła, która przekłada się wprost na koszt
    jego odgadnięcia. Każdy dodany znak mnoży liczbę kombinacji, a reguły
    o rodzajach znaków — wielkich literach, cyfrach, znakach szczególnych —
    mnożą ją znacznie słabiej, bo ludzie spełniają je w sposób przewidywalny
    i w miejscach przewidywalnych.

    Rzecz istotniejsza dotyczy tego, jak hasła są dziś łamane. Napastnik,
    który zdobędzie skrót hasła, nie zgaduje go przy oknie logowania —
    liczy go u siebie, na sprzęcie do tego przeznaczonym. Przy takim
    rozwiązaniu blokada konta, opóźnienia i dziennik zdarzeń nie mają
    żadnego znaczenia. Zostaje wyłącznie długość.

    Czternaście znaków jest progiem, poniżej którego hasło złożone
    z elementów słownikowych daje się dziś policzyć w czasie liczonym
    w godzinach. Powyżej koszt rośnie na tyle, że opłaca się szukać drogi
    innej — a to jest dokładnie ten wynik, o który chodzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odzyskania hasła ze zdobytego skrótu w czasie krótkim, bez kontaktu
    z maszyną.
  en: |
    The setting says how many characters the shortest password the machine will take for local accounts must
    have.

    Length is the one property of a password that bears directly on the cost of guessing it. Each character
    added multiplies the number of combinations, while rules about kinds of character - capitals, digits,
    particular marks - multiply it far more weakly, people meeting them in a foreseeable way and in foreseeable
    places.

    A weightier matter touches how passwords get broken today. An attacker who wins a password's hash does not
    guess it at the logon window - they reckon it at their own place, on gear meant for that. Under such an
    arrangement the locking of an account, delays and the event log mean nothing whatever. Length alone remains.

    Fourteen characters is the threshold below which a password built of dictionary parts can today be reckoned
    in a time counted in hours. Above it the cost grows enough that looking for another road becomes worth
    while - and that is exactly the outcome sought.

    What an attacker gains while the item goes unmet: the means of winning a password back from a hash they have
    taken, in a short time and without touching the machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedna z niewielu reguł,
    przy których uprzedzenie ludzi jest częścią wykonania, a nie
    uprzejmością.

    Hasła już ustawione nie zostają unieważnione. Wymaganie działa dopiero
    przy następnej zmianie hasła, więc skutek rozkłada się w czasie i nie
    widać go od razu. Zmiana wykonana bez uprzedzenia objawi się dopiero po
    tygodniach, w chwili wygaśnięcia haseł, i zostanie odebrana jako awaria.

    Rzecz do sprawdzenia przed wykonaniem: konta lokalne o hasłach
    ustawianych przez skrypt albo zapisanych w konfiguracji jakiegoś
    programu. Próba ustawienia im hasła krótszego zakończy się błędem,
    a błędu tego skrypty zwykle nie obsługują — po prostu zostawiają hasło
    niezmienione i kończą się powodzeniem.

    Drugi przypadek dotyczy urządzeń, na których hasło wpisuje się ręcznie
    przy każdym uruchomieniu, bez klawiatury pełnej. Czternaście znaków
    bywa tam kosztem odczuwalnym i warto to wiedzieć wcześniej.

    Czego to nie psuje: haseł już ustawionych, logowania kontem domenowym,
    logowania kodem albo odciskiem palca, usług, sieci, aplikacji.
  en: |
    The class is "needs a planned rollout", and it is one of the few rules at which forewarning people is part
    of the carrying out rather than a courtesy.

    Passwords already set are not voided. The demand works only at the next change of password, so the
    consequence spreads over time and is not seen at once. A change made without forewarning will show itself
    only after weeks, at the moment passwords expire, and will be taken for a fault.

    A thing to review before carrying out: local accounts whose passwords get set by a script or are written
    into some program's configuration. An attempt at setting them a shorter password will end in an error, and
    that error scripts as a rule do not handle - they simply leave the password unchanged and end in success.

    The second case touches devices on which the password gets typed by hand at every start, without a full
    keyboard. Fourteen characters is at times a felt cost there, and it is well to know that beforehand.

    What this does not break: passwords already set, logging on by a domain account, logging on by a code or a
    fingerprint, services, the network, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Skrypt ustawiający hasło konta lokalnego krótsze niż wymagane kończy się powodzeniem, a hasła nie zmienia
      - Hasło zapisane w konfiguracji programu przestaje dać się ustawić ponownie po jego wygaśnięciu
      - Na urządzeniach bez pełnej klawiatury wpisywanie hasła przy każdym uruchomieniu staje się kosztem odczuwalnym
      - Hasła już ustawione nie zostają unieważnione, więc skutek pojawia się dopiero przy następnej zmianie
      - Logowanie kontem domenowym, logowanie kodem lub odciskiem palca oraz praca usług pozostają bez zmian
    en:
      - A script setting a local accounts password shorter than called for ends in success and leaves the password unchanged
      - A password written into a programs configuration ceases to be settable afresh once it has expired
      - On devices without a full keyboard typing the password at every start becomes a felt cost
      - Passwords already set are not voided, so the consequence shows only at the next change
      - Logging on by a domain account, logging on by a code or fingerprint and the work of services stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta lokalne mają hasła ustawiane skryptem, którego nie da się na razie poprawić ani sprawdzić po wykonaniu
      - Hasło wpisuje się ręcznie na urządzeniu bez pełnej klawiatury przy każdym uruchomieniu maszyny
    en:
      - Local accounts have their passwords set by a script that cannot for now be mended or checked after it runs
      - The password gets typed by hand on a device without a full keyboard at every start of the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '14'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'MinimumPasswordLength'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Passwords already set are not voided - the demand works at the next change.
    # Forewarn people, else the consequence will show in weeks, at expiry, and
    # will be taken for a fault.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordLength = 14',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordLength = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-length

notes:
  pl: |
    Reguła otwiera blok zasad haseł i jest w nim jedyną, której wartość nie
    zależy od niczego innego. Pozostałe punkty tego bloku mają sens dopiero
    przy haśle dostatecznie długim — reguły o złożoności, o historii i o
    wieku zarządzają hasłem, którego samo odgadnięcie ma być kosztowne.

    Warto, żeby aplikacja postawiła wprost argument o liczeniu poza maszyną.
    Użytkownik, który wie, że blokada konta broni przed zgadywaniem przy
    oknie logowania, zwykle nie wie, że przy skrócie zdobytym z maszyny
    blokada nie znaczy nic. Jest to właśnie ta wiedza, która tłumaczy,
    dlaczego długość stawia się wyżej niż złożoność.

    Odnotowuję, że próg czternastu znaków jest wartością przyjętą, nie
    wyliczoną raz na zawsze. Aplikacja porównuje wartość zastaną z progiem
    przez „nie mniej niż", więc maszyna z progiem wyższym przechodzi.
  en: |
    The rule opens the block of password policies and is the only one in it whose value hangs on nothing else.
    The remaining items of the block make sense only where the password is long enough - the rules about
    complexity, history and age govern a password whose mere guessing is meant to be costly.

    It is well that the application put the argument about reckoning away from the machine outright. A user who
    knows that the locking of an account guards against guessing at the logon window as a rule does not know
    that against a hash taken from the machine the locking means nothing. It is just that knowledge which
    explains why length is set above complexity.

    Worth noting that the threshold of fourteen characters is a value taken, not reckoned once for all. The
    application weighs the value found against the threshold by "not less than", so a machine with a higher
    threshold passes.
