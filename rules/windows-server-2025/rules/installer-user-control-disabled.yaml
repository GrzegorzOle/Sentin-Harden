id: win2025-installer-user-control-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Wpływ użytkownika na przebieg instalacji wyłączony
    en: User control over installation disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera kontu bez uprawnień możliwość wpływania na przebieg
    instalacji działającej z prawami podniesionymi. Chodzi o wartości
    przekazywane instalatorowi — między innymi o to, gdzie ma położyć
    pliki i co ma po drodze uruchomić.

    Zostawiam kategorię wysoką i robię to na innej podstawie niż dla
    stacji roboczej. Tam argumentem jest użytkownik. Tutaj chcę
    zauważyć coś, co bywa przeoczone: serwer nie jest maszyną bez kont
    bez uprawnień. Ma ich sporo i są to konta najciekawsze z możliwych.

    Konto puli aplikacji serwera sieciowego, konto usługi bazy danych,
    konto agenta, konto, na którym chodzi zadanie — wszystkie mają
    prawa ograniczone i wszystkie są pierwszym miejscem, na którym staje
    napastnik po wykorzystaniu błędu w aplikacji. Droga w górę z takiego
    konta jest dokładnie tym, czego on wtedy szuka.

    Ten punkt jedną z takich dróg zamyka. Instalacja podniesiona
    przestaje przyjmować wartości od strony, która uprawnień nie ma,
    więc nie da się jej użyć do zapisania czegoś tam, gdzie zapisywać
    nie wolno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podniesienie
    uprawnień z konta usługi do praw pełnych, przy okazji dowolnej
    instalacji uruchomionej na tej maszynie.
  en: |
    The item takes from an account without rights the leave to sway the going of an installing that
    works with rights raised. It is about the worths handed to the installer - among others about
    where it is to lay the files and what it is to run along the way.

    I leave the category high and do so upon another ground than for a workstation. There the reason
    is the user. Here I would mark a thing at times passed over - a server is no machine without
    accounts without rights. It has a good many and they are the most telling there could be.

    The account of the pool of a server of the net, the account of the service of a base, the account
    of an agent, the account a task works upon - all hold rights that are bounded and all are the
    first place an attacker stands upon after the using of a fault in an application. A road upward
    off such an account is just what they then seek.

    This item shuts one of those roads. A raised installing stops taking worths from a side that has
    no rights, so it cannot be used to write something down where writing is forbidden.

    What an attacker gains while the item goes unmet - a raising of rights off the account of a
    service up to full ones, at the hap of any installing run upon that machine.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i powód jest jeden, ale
    konkretny.

    Na serwerze zdarzają się instalacje uruchamiane nie przez człowieka
    i nie z konta administratora, tylko przez mechanizm chodzący na
    koncie usługi: agent aktualizacji aplikacji, narzędzie wdrożeniowe
    producenta, zadanie doinstalowujące składnik przy pierwszym
    uruchomieniu. Część z nich przekazuje instalatorowi wartości —
    najczęściej ścieżkę docelową — i to właśnie przestanie być
    przyjmowane.

    Objaw jest taki, jak zwykle na serwerze: nie komunikat, tylko
    zadanie, które przestało się udawać. Instalacja kończy się błędem
    albo, co gorsza, kończy się pozornie dobrze, kładąc pliki w miejscu
    domyślnym zamiast w tym, które podano. Drugi przypadek bywa widoczny
    dopiero wtedy, gdy zabraknie miejsca na dysku systemowym.

    Sprawdzenie jest krótkie: ustal, czy na tej maszynie cokolwiek
    instaluje się z konta innego niż administracyjne. Jeżeli nie — a na
    większości serwerów nie — zmiana nie ma czego dotknąć.

    Zmiana cofa się natychmiast i nie wymaga restartu. Instalacje już
    trwające nie są przerywane.
  en: |
    I leave the class "needs a checking" and the ground is one, but a set one.

    On a server there happen installings run not by a person and not off the account of an
    administrator but by a working going upon the account of a service - an agent of the mending of
    an application, a tool of rolling out from a maker, a task setting a piece alongside at the first
    running. Some of them hand the installer worths - most often a path meant - and it is just that
    which will stop being taken.

    The symptom is as it mostly is on a server - no word given but a task that stopped succeeding.
    The installing ends in a fault or, what is worse, ends seemingly well, laying the files in the
    stead by default in place of the one given. That second case is at times seen only when the room
    on the disk of the system runs out.

    The checking is short - settle whether anything at all upon that machine installs off an account
    other than one of ruling. If not - and on most servers not - the change has nothing to touch.

    The change is undone at once and takes no restart. Installings already under way are not broken
    off.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Agent aktualizacji aplikacji chodzący na koncie usługi przestaje przekazywać instalatorowi ścieżkę docelową
      - Instalacja kończy się błędem albo kładzie pliki w miejscu domyślnym zamiast w podanym
      - Drugi przypadek bywa widoczny dopiero wtedy, gdy zabraknie miejsca na dysku systemowym
      - Objawem jest zadanie, które przestało się udawać, a nie komunikat na ekranie
      - Instalacje uruchamiane z konta administracyjnego działają bez zmian
    en:
      - An agent of the mending of an application going upon the account of a service stops handing the installer a path meant
      - The installing ends in a fault or lays the files in the stead by default in place of the one given
      - That second case is at times seen only when the room on the disk of the system runs out
      - The symptom is a task that stopped succeeding and no word given upon a screen
      - Installings run off an account of ruling work unaltered
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie instaluje się oprogramowanie z konta innego niż administracyjne i nie ustalono, co przekazuje instalatorowi
    en:
      - Software installs upon the machine off an account other than one of ruling and it was not settled what it hands the installer
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'EnableUserControl'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'EnableUserControl'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle first whether anything installs here off a non-administrative
    # account: such an installer may end well yet lay its files in the default
    # location, which shows up only when the system disk fills.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableUserControl' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/enableusercontrol

notes:
  pl: |
    Kategoria utrzymana wysoko na innej podstawie niż dla stacji
    roboczej. Serwer nie jest maszyną bez kont bez uprawnień — ma ich
    sporo i są to konta najciekawsze z możliwych: pula aplikacji serwera
    sieciowego, usługa bazy danych, agent, zadanie.

    Wszystkie są pierwszym miejscem, na którym staje napastnik po
    wykorzystaniu błędu w aplikacji, a droga w górę z takiego konta jest
    dokładnie tym, czego on wtedy szuka.

    Objaw przy trafieniu bywa zdradliwy: instalacja kończy się pozornie
    dobrze, kładąc pliki w miejscu domyślnym — widać to dopiero, gdy
    zabraknie miejsca na dysku systemowym.
  en: |
    The category is held high upon another ground than for a workstation. A server is no machine
    without accounts without rights - it has a good many and they are the most telling there could
    be - the pool of a server of the net, the service of a base, an agent, a task.

    All of them are the first place an attacker stands upon after the using of a fault in an
    application, and a road upward off such an account is just what they then seek.

    The symptom at a striking can be treacherous - the installing ends seemingly well, laying the
    files in the stead by default, and that is seen only when the room on the disk of the system runs
    out.
