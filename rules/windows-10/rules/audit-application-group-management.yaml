id: win10-audit-application-group-management

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Management
  title:
    pl: Inspekcja zarządzania grupami aplikacyjnymi
    en: The audit of the handling of application groups
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zmiany w grupach zarządzanych przez aplikacje —
    czyli w grupach, które nie należą do systemu, lecz do oprogramowania
    korzystającego z mechanizmu autoryzacji udostępnianego przez system.

    Jest to podkategoria o najwęższym zastosowaniu w całym bloku. Na
    większości maszyn grupy tego rodzaju nie istnieją i zapis pozostaje
    pusty przez całe życie systemu.

    Wartość pojawia się tam, gdzie takie grupy są. Aplikacja opierająca na
    nich swój podział uprawnień ma własny model dostępu, zwykle
    nieobjęty żadnym innym zapisem w tej paczce. Zmiana w takiej grupie
    bywa równoznaczna z nadaniem sobie uprawnień w aplikacji — z pominięciem
    wszystkiego, co aplikacja sama o tym myśli.

    Odnotowuję, dlaczego mimo wąskiego zastosowania punkt warto spełnić.
    Koszt jest zerowy: w zbiorze, który pozostaje pusty, włączenie
    inspekcji nie kosztuje ani wpisu. Zysk jest warunkowy, ale w chwili,
    w której się pojawia, nie da się go odtworzyć wstecz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zmianę
    uprawnień w aplikacji opartej na tym mechanizmie, niewidoczną
    w żadnym innym zapisie.
  en: |
    The setting writes down changes in the groups handled by applications - which is to say in groups belonging
    not to the system but to software that uses the mechanism of authorisation the system offers.

    It is the subcategory of the narrowest use in the whole block. Upon most machines groups of that kind are
    not there at all and the record stays empty for the system's whole life.

    The worth comes up where such groups are. An application that rests its parting of rights upon them has a
    model of access of its own, as a rule taken in by no other record in this pack. A change in such a group is
    at times the same thing as a granting of rights within the application - past everything the application
    itself thinks about it.

    I set down why the item is worth meeting despite its narrow use. The cost is nought: in a set that stays
    empty the switching on of the audit costs not one entry. The gain is conditional, but at the hour it comes
    up it cannot be built up again backwards.

    What an attacker gains while the item goes unmet: a change of rights within an application resting upon that
    mechanism, seen in no other record.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnej grupy i nie wpływa na działanie
    aplikacji. Zapisuje wyłącznie zmiany w grupach tego rodzaju.

    Liczba wpisów na maszynie bez takich grup wynosi zero. Nie jest to
    przenośnia — zbiór jest pusty i pozostaje pusty.

    Odnotowuję, że pustka nie jest tu wadą. Zbiór pusty nie zapełnia
    dziennika, nie wymaga przeglądania i nie kosztuje niczego. Reguła
    wygląda przez to na pozorną, a jest po prostu warunkowa.

    Zapisywane są oba wyniki, bo w zbiorze, który w normalnej pracy
    pozostaje pusty, niepowodzenie nie kosztuje nic, a znaczy tyle samo co
    powodzenie.

    Czego to nie psuje: aplikacji korzystających z tego mechanizmu, ich
    uprawnień, logowania, kont domenowych, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no group and bears not upon an application's working. It writes down the changes in
    groups of that kind alone.

    The number of entries upon a machine without such groups is nought. That is no figure of speech - the set is
    empty and stays empty.

    I set down that the emptiness is here no fault. An empty set does not fill the log, calls for no looking
    over and costs nothing. The rule looks for that a seeming one, while it is simply conditional.

    Both outcomes are written, for in a set that in ordinary work stays empty a failure costs nothing and means
    as much as a success.

    What this does not break: the applications that use that mechanism, their rights, logging on, domain
    accounts, file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na maszynie bez grup tego rodzaju zbiór jest pusty i pozostaje pusty przez całe życie systemu
      - Pustka nie jest tu wadą, bo zbiór pusty nie zapełnia dziennika i nie wymaga przeglądania
      - Zapisywane są oba wyniki, bo w zbiorze pustym niepowodzenie nie kosztuje nic
      - Ustawienie nie zmienia żadnej grupy i nie wpływa na działanie aplikacji
      - Uprawnienia w aplikacjach, logowanie, konta domenowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Upon a machine without groups of that kind the set is empty and stays empty for the system s whole life
      - The emptiness is here no fault, an empty set neither filling the log nor calling for a looking over
      - Both outcomes are written, for in an empty set a failure costs nothing
      - The setting changes no group and bears not upon an application s working
      - Rights within applications, logging on, domain accounts, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ma powodu, żeby tego punktu nie spełnić, bo na maszynie bez takich grup nie kosztuje ani jednego wpisu
    en:
      - There is no reason not to meet this item, upon a machine without such groups it costing not one entry
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9239-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9239-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9239-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. In a set that is as a rule empty a failure costs
    # nothing to keep and is worth as much as a success.
    auditpol /set /subcategory:"{0CCE9239-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9239-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-application-group-management

notes:
  pl: |
    Reguła jest w całej paczce inspekcyjnej tą o najwęższym zastosowaniu
    i warto, żeby aplikacja to powiedziała wprost. Użytkownik, który
    odkryje to sam po tygodniu pustego zapisu, uzna raport za nierzetelny.

    Argument wart zachowania jest argumentem o koszcie, nie o zysku.
    Włączenie inspekcji w zbiorze, który pozostaje pusty, nie kosztuje ani
    wpisu — a zysk, choć warunkowy, jest w chwili wystąpienia niemożliwy do
    odtworzenia wstecz. Jest to dokładnie ten układ, w którym odpuszczenie
    punktu nie ma żadnego uzasadnienia poza porządkowym.

    Odnotowuję, że aplikacja korzystająca z inwentaryzacji może powiedzieć
    więcej niż sama reguła: czy na tej maszynie stoi oprogramowanie
    opierające podział uprawnień na tym mechanizmie. Od tej odpowiedzi
    zależy, czy punkt jest formalnością, czy jedynym zapisem o modelu
    dostępu w aplikacji.
  en: |
    The rule is, in the whole audit pack, the one of the narrowest use, and it is well that the application say
    so outright. A user who finds that out for themselves after a week of an empty record will hold the report
    unsound.

    The argument worth keeping is an argument about cost and not about gain. Switching on the audit in a set
    that stays empty costs not one entry - while the gain, conditional though it be, cannot at the hour it comes
    up be built up again backwards. It is exactly the arrangement in which letting the item go has no ground but
    a tidying one.

    I set down that an application drawing upon the taking of stock can say more than the rule itself: whether
    software resting its parting of rights upon that mechanism stands upon this machine. Upon that answer hangs
    whether the item is a formality or the one record of an application's model of access.
