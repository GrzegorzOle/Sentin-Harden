id: win2025-firewall-outbound-default-allow

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Domyślne zachowanie dla połączeń wychodzących ustalone wprost
    en: The default behaviour for outbound connections settled explicitly
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby domyślne zachowanie dla połączeń wychodzących było
    zapisane wprost jako przepuszczanie, a nie pozostawione nieustalone.

    Na pierwszy rzut oka brzmi to jak punkt odwrotny do poprzedniego:
    dla ruchu przychodzącego benchmark wymaga blokowania, dla wychodzącego
    — przepuszczania. Powód tej asymetrii jest praktyczny. Blokowanie ruchu
    wychodzącego domyślnie oznacza wypisanie reguły dla wszystkiego, co ta
    maszyna sama nawiązuje, a na serwerze jest tego bardzo dużo: aktualizacje,
    rozpoznawanie nazw, czas, kontroler domeny, monitoring, kopie zapasowe,
    aktualizacje sygnatur. Konfiguracja taka bywa wartościowa, ale jest
    kosztowna w utrzymaniu i benchmark jej nie wymaga.

    Wartością tego punktu jest samo ustalenie wprost. Stan nieustalony
    działa dziś jak przepuszczanie, ale jest wartością domyślną, a nie
    decyzją — i przy przenoszeniu konfiguracji albo przy zmianie zasad
    z góry może zachować się inaczej, niż ktokolwiek zakłada.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. To punkt o spójności konfiguracji, nie o odpieraniu
    ataku, i dlatego kategoria jest niska.

    Wart jest jednak odnotowania jeden skutek uboczny: wynik tego punktu
    mówi wprost, czy na maszynie ktoś ustawił blokowanie wychodzące — a to
    bywa przyczyną kłopotów, których nikt nie wiąże z zaporą.
  en: |
    The item takes that the default behaviour for outbound connections be recorded outright
    as letting through, rather than left unsettled.

    At first sight that sounds the reverse of the previous item: for inbound traffic the
    benchmark takes blocking, for outbound letting through. The reason for that asymmetry is
    practical. Blocking outbound traffic by default means writing out a rule for everything
    this machine sets up itself, and on a server there is a great deal of that: updates,
    name resolution, time, the domain controller, monitoring, backups, signature updates.
    Such a configuration is at times worthwhile but is dear to keep up and the benchmark
    does not take it.

    This item's worth lies in the settling itself. An unsettled state works today like
    letting through, but it is a default value rather than a decision - and at the carrying
    over of a configuration or at a change of policies from above it may behave otherwise
    than anyone assumes.

    What an attacker gains while the item goes unmet: nothing directly. It is an item about
    the consistency of the configuration rather than about fending off an attack, and hence
    the category is low.

    One side effect is worth noting, though: this item's result says outright whether
    somebody has set outbound blocking on the machine - and that is at times the cause of
    troubles nobody connects with the firewall.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy, o ile
    maszyna jest w stanie nieustalonym — a to jest przypadek typowy.

    Zapisanie przepuszczania tam, gdzie zachowanie było nieustalone, nie
    zmienia niczego w działaniu: ruch wychodzący i tak przechodził.
    Zmienia się wyłącznie to, że stan jest zapisany, a nie domyślny.

    Sytuacja wygląda inaczej tam, gdzie ktoś świadomie ustawił blokowanie
    wychodzące. Wtedy ta zmiana je zdejmuje i jest to zmiana idąca
    w kierunku mniejszego zabezpieczenia. Reguła wykrywa taki stan
    i nazywa go w wyniku wprost, właśnie po to, żeby nie zdjąć czegoś
    wartościowego przez nieuwagę.

    Wdrożenie hurtem jest dopuszczalne, ale wynik mówiący o blokowaniu
    w którymś profilu warto przeczytać osobno przed zastosowaniem.

    Zmiana nie wymaga restartu.
  en: |
    The change has no known side effects and takes no break, so far as the machine is in an
    unsettled state - and that is the typical case.

    Recording letting through where the behaviour was unsettled changes nothing in the way
    things work: outbound traffic passed anyway. What changes is only that the state is
    recorded rather than default.

    The situation looks otherwise where somebody has knowingly set outbound blocking. This
    change then lifts it, and that is a change in the direction of less protection. The rule
    detects such a state and names it in the result outright, exactly so that something
    worthwhile is not lifted through inattention.

    A rollout in bulk is admissible, but a result speaking of blocking on one of the profiles
    is worth reading apart before applying.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Brak znanych regresji, jeżeli zachowanie domyślne było nieustalone
      - Tam, gdzie ustawiono blokowanie wychodzące, zmiana je zdejmuje
      - Wynik nazywa profile z blokowaniem wprost, żeby dało się to zauważyć przed zmianą
      - Istniejące reguły dla ruchu wychodzącego nie są usuwane
    en:
      - No known regressions where the default behaviour was unsettled
      - Where outbound blocking was set, the change lifts it
      - The result names the profiles with blocking outright, so that it can be noticed before the change
      - Existing rules for outbound traffic are not removed
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze świadomie ustawiono blokowanie ruchu wychodzącego i jest ono utrzymywane
    en:
      - Blocking of outbound traffic has been knowingly set on the server and is being kept up
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # All three profiles are read at once and the weaker outcome is reported,
      # together with the names of the profiles it came from, so the report says
      # where the state differs rather than merely that it does.
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $blocking = @($profiles | Where-Object { $_.DefaultOutboundAction -eq 'Block' })
        $unset = @($profiles | Where-Object { $_.DefaultOutboundAction -eq 'NotConfigured' })
        if ($blocking.Count -gt 0) { 'BLOCKING_IN_' + ($blocking.Name -join '_') }
        elseif ($unset.Count -gt 0) { 'NOT_CONFIGURED_IN_' + ($unset.Name -join '_') }
        else { 'ALL_ALLOW' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_ALLOW
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, DefaultOutboundAction |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultOutboundAction Allow

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -DefaultOutboundAction $p.DefaultOutboundAction
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Wynik rozróżnia trzy stany, a nie dwa: przepuszczanie we wszystkich
    profilach, blokowanie w którymś oraz stan nieustalony. Rozróżnienie
    jest celowe, bo dwa ostatnie prowadzą do zupełnie innych decyzji —
    pierwszy wymaga przeczytania, drugi jest zwykłym brakiem zapisu.

    Punkt jest w klasie „bez uciążliwości", ale wynik „BLOCKING_IN_…"
    opisuje stan ostrzejszy niż wymagany. Zastosowanie zmiany zdejmuje
    wtedy zabezpieczenie i jest to jedyne miejsce w tej paczce, w którym
    naprawa może pogorszyć stan — dlatego wynik nazywa profile wprost.

    Punkt nie usuwa reguł dla ruchu wychodzącego. Dotyczy wyłącznie tego,
    co dzieje się z połączeniem, którego żadna reguła nie opisuje.
  en: |
    The result tells three states apart rather than two: letting through on all profiles,
    blocking on one of them, and an unsettled state. The distinction is deliberate, since
    the last two lead to altogether different decisions - the first takes reading, the
    second is an ordinary absence of a record.

    The item is in the "no disruption" class, but the "BLOCKING_IN_…" result describes a
    state sharper than the one taken. Applying the change then lifts a safeguard, and it is
    the one place in this pack at which a remedy may worsen the state - hence the result
    names the profiles outright.

    The item removes no rules for outbound traffic. It concerns only what happens to a
    connection no rule describes.
