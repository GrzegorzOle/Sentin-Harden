id: win11-peer-name-resolution-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa rozwiązywania nazw w sieci równorzędnej wyłączona
    en: The name resolution service for peer networking disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zamienia nazwy na adresy bez udziału serwera nazw. Maszyny
    uczestniczące w tym mechanizmie pytają o nazwę siebie nawzajem i same sobie
    odpowiadają, budując rozproszony spis, którego nikt nie prowadzi
    centralnie.

    To jest właśnie źródło problemu i warto powiedzieć je wprost. Rozwiązywanie
    nazw w sieci organizacji jest zwykle uznane za mechanizm kontrolowany:
    serwer nazw jest jeden, odpowiada tylko on, a jego odpowiedzi da się
    obserwować, filtrować i zapisywać. Ten mechanizm działa obok tego
    porządku — odpowiedź może przyjść od dowolnej maszyny w sieci i nie
    przechodzi przez żadne miejsce, w którym ktokolwiek ją sprawdza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odpowiedzenia na pytanie o nazwę zamiast maszyny właściwej. Skutkiem jest
    skierowanie połączenia do siebie, a więc przechwycenie tego, co miało
    trafić gdzie indziej — razem z próbą uwierzytelnienia, jeżeli połączenie
    jej wymagało.

    Drugi zysk jest cichszy: mechanizm ten zestawia połączenia między
    maszynami z pominięciem serwerów, także przez sieci rozdzielone. Jest to
    gotowa droga łączności dla czegoś, co już na maszynie działa i chce się
    komunikować.
  en: |
    The service turns names into addresses with no name server involved. Machines taking
    part in this mechanism ask each other about a name and answer one another, building a
    scattered register nobody keeps centrally.

    That is the source of the problem, and it is worth saying outright. Resolving names
    on an organisation's network is usually taken to be a controlled mechanism: there is
    one name server, it alone answers, and its answers can be watched, filtered and
    recorded. This mechanism works alongside that order - an answer may come from any
    machine on the network and passes through no place where anybody checks it.

    What an attacker gains while the item goes unmet: the means of answering a question
    about a name in place of the right machine. The effect is that a connection is
    directed to them, so that what was meant for elsewhere is caught - along with an
    attempt to authenticate, if the connection called for one.

    The second gain is quieter: this mechanism sets up connections between machines
    bypassing servers, including across separated networks. It is a ready channel for
    something already running on the machine that wants to communicate.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie działa cokolwiek opartego na
    łączności równorzędnej — a lista takich rzeczy jest krótka i dobrze
    znana.

    Pierwsza pozycja to pomoc zdalna zestawiana bez zaproszenia w pliku,
    czyli ta, w której osoba pomagająca dostaje krótkie hasło zamiast pliku.
    Ten wariant opiera się wprost na tym mechanizmie i po wyłączeniu usługi
    przestaje działać. Pomoc zdalna z zaproszeniem w pliku działa dalej.

    Druga to starsze narzędzia współpracy zestawiające połączenie bezpośrednio
    między maszynami, bez serwera pośredniczącego. Są to programy w większości
    wycofane i na stanowisku biurowym spotyka się je rzadko.

    Trzecia to programy branżowe, które wybrały ten mechanizm do odnajdywania
    się w sieci lokalnej. Jest to przypadek rzadki, ale kłopotliwy, bo
    dokumentacja takich programów zwykle o tym nie mówi, a objawem jest
    niemożność odnalezienia drugiej maszyny bez żadnego komunikatu o błędzie.

    Rozwiązywanie nazw przez serwer nazw działa dalej bez żadnej zmiany
    i to ono obsługuje całą zwykłą pracę.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether anything resting on peer connectivity runs on the
    machine - and the list of such things is short and well known.

    The first item is remote help set up without an invitation in a file, that is the
    kind where the helper is given a short password instead of a file. That variant rests
    on this mechanism outright and stops working once the service is off. Remote help
    with an invitation in a file carries on.

    The second is older collaboration tools setting up a connection straight between
    machines, with no server in between. These are programs mostly withdrawn and seldom
    met at an office station.

    The third is line-of-business programs that chose this mechanism for finding each
    other on the local network. That case is rare but awkward, since such programs'
    documentation usually says nothing about it, and the symptom is a failure to find the
    other machine with no error message at all.

    Resolving names through a name server carries on with no change at all, and it is
    that which handles all ordinary work.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Pomoc zdalna zestawiana krótkim hasłem zamiast pliku zaproszenia przestaje działać
      - Starsze narzędzia współpracy łączące maszyny bezpośrednio nie odnajdują drugiej strony
      - Program branżowy odnajdujący maszyny tym mechanizmem milknie bez komunikatu o błędzie
      - Rozwiązywanie nazw przez serwer nazw działa dalej bez żadnej zmiany
    en:
      - Remote help set up with a short password instead of an invitation file stops working
      - Older collaboration tools joining machines directly do not find the other side
      - A line-of-business program finding machines by this mechanism falls silent with no error
      - Resolving names through a name server carries on with no change at all
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Pomoc zdalna prowadzona jest wariantem z krótkim hasłem zamiast pliku zaproszenia
      - Program branżowy odnajduje maszyny w sieci lokalnej tym mechanizmem
    en:
      - Remote help is given in the variant with a short password instead of an invitation file
      - A line-of-business program finds machines on the local network by this mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'PNRPsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PNRPsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Reguła należy do czwórki opisującej łączność równorzędną: rozwiązywanie
    nazw, grupowanie maszyn, zarządzanie tożsamościami i publikowanie nazwy
    maszyny. Wyniki tych czterech reguł należy czytać razem — składniki
    zależą od siebie i pozostawienie jednego włączonego zwykle wystarcza, żeby
    mechanizm dało się odbudować.

    Na maszynie, na której składnik łączności równorzędnej nie jest
    zainstalowany, usługi nie ma i audyt zwróci wynik „nie dotyczy". Jest to
    wynik prawidłowy, a nie brak sprawdzenia, i taka maszyna jest już
    zabezpieczona lepiej, niż wymaga punkt.

    Wyłączenie usługi nie wpływa na rozwiązywanie nazw przez serwer nazw ani
    na rozgłoszenia nazw w sieci lokalnej obsługiwane innym mechanizmem, który
    ma w tej paczce własną regułę.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule belongs to a quartet describing peer connectivity: resolving names, grouping
    machines, managing identities and publishing the machine's name. The results of these
    four rules should be read together - the components depend on one another and leaving
    one running is usually enough for the mechanism to be built back up.

    On a machine where the peer connectivity component is not installed the service is
    absent and the audit returns "not applicable". That is a proper result rather than a
    failure to check, and such a machine is already guarded better than the item requires.

    Disabling the service affects neither resolving names through a name server nor the
    broadcasting of names on the local network handled by another mechanism, which has a
    rule of its own in this pack.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
