id: win2016-password-complexity-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Wymagania co do budowy hasła włączone
    en: Requirements on how a password is built switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza wbudowane wymagania co do budowy hasła: trzy z czterech
    rodzajów znaków oraz zakaz umieszczania w haśle nazwy konta.

    Chcę powiedzieć uczciwie, ile ten punkt wnosi, bo bywa przeceniany.
    Wymagania co do rodzajów znaków podnoszą koszt łamania znacznie mniej niż
    każdy dodatkowy znak długości. Hasło jedenastoznakowe z jedną wielką
    literą i jedną cyfrą na końcu jest hasłem, którego budowa jest
    przewidywalna — bo tak właśnie ludzie te wymagania spełniają.

    Mimo to punkt ma wartość i leży ona gdzie indziej niż w samej złożoności.
    Reguła odrzuca hasła zbudowane z nazwy konta i z imienia właściciela —
    czyli dokładnie te, od których zaczyna każdy zgadujący. To jest ta część,
    która naprawdę działa.

    Na serwerze najwięcej daje przy kontach zakładanych ręcznie i doraźnie:
    kontach wykonawców, kontach testowych, kontach utworzonych na czas jednej
    migracji. Hasło ustawione dla takiego konta bywa wpisane byle jak i to
    właśnie tam wymagania wbudowane zadziałają jako jedyne sito.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    trafienia w hasło zgadywaniem z listy oczywistej, w której pierwsze
    pozycje to nazwa konta, nazwa serwera i nazwa organizacji.
  en: |
    The item switches on the built-in requirements on how a password is built:
    three of the four kinds of character, and a ban on the account name
    appearing in the password.

    I want to say honestly how much this item gives, because it tends to be
    overrated. Requirements about kinds of character raise the cost of breaking
    a password far less than each additional character of length does. An
    eleven-character password with one capital letter and one digit at the end
    is a password whose construction is predictable - because that is exactly
    how people satisfy such requirements.

    The item has value nonetheless, and it lies elsewhere than in complexity
    itself. The rule refuses passwords built from the account name and from the
    owner's name - precisely the ones any guesser starts with. That is the part
    that really works.

    On a server it gives most with accounts created by hand and on the spur of
    the moment: contractor accounts, test accounts, accounts made for the
    duration of one migration. The password set for such an account tends to be
    typed carelessly, and it is there that the built-in requirements act as the
    only sieve.

    What an attacker gains while the item goes unmet: the chance of hitting a
    password by guessing from an obvious list, whose first entries are the
    account name, the server name and the organisation's name.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co ustawia hasła
    na tej maszynie, a nie tego, kto je wpisuje.

    Hasła bieżące nie są unieważniane. Skutek pojawia się przy pierwszej
    zmianie: hasło niespełniające wymagań zostanie odrzucone. Dla człowieka
    jest to niedogodność, dla skryptu — błąd zatrzymujący procedurę.

    To jest właściwy powód klasy. Skrypty zakładające konta z hasłem
    wyliczanym według własnego wzoru przestaną działać, jeśli wzór nie
    spełnia wymagań. Na serwerze tego rocznika takich skryptów bywa sporo,
    a data ich napisania często poprzedza dzisiejsze zasady.

    Sprawdzenia wymagają też aplikacje ustawiające hasła kont lokalnych
    samodzielnie — instalatory, narzędzia migracyjne, systemy obsługi
    urządzeń. Każda z nich ustawia hasło według własnej reguły i żadna nie
    pyta systemu, czy ta reguła wystarcza.

    Czego to nie psuje: logowania istniejącymi hasłami, kont domenowych na
    serwerze członkowskim ani niczego, co hasła nie zmienia.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about what sets passwords on
    this machine rather than who types them.

    Current passwords are not voided. The effect shows up at the first change:
    a password that does not meet the requirements is refused. For a person
    that is an inconvenience; for a script it is an error that halts the
    procedure.

    That is the real reason for the class. Scripts that create accounts with a
    password worked out to a pattern of their own stop working if the pattern
    does not meet the requirements. On a server of this vintage there tend to
    be a good number of such scripts, and the date they were written often
    predates today's policy.

    Applications that set the passwords of local accounts themselves also need
    checking - installers, migration tools, device management systems. Each
    sets a password by a rule of its own, and none of them asks the system
    whether that rule is enough.

    What this does not break: signing in with existing passwords, domain
    accounts on a member server, or anything that does not change a password.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Hasło niespełniające wymagań zostaje odrzucone przy najbliższej zmianie
      - Skrypty zakładające konta z hasłem według własnego wzoru kończą się błędem, jeśli wzór nie spełnia wymagań
      - Instalatory i narzędzia migracyjne ustawiające hasła kont lokalnych mogą przestać kończyć pracę poprawnie
      - Hasła bieżące nie są unieważniane i działają do czasu zmiany
    en:
      - A password that does not meet the requirements is refused at the next change
      - Scripts that create accounts with a password built to their own pattern fail if the pattern does not meet the requirements
      - Installers and migration tools that set local account passwords may stop finishing cleanly
      - Current passwords are not voided and work until they are changed
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta lokalne na tej maszynie zakłada narzędzie ustawiające hasło według wzoru, którego nie da się zmienić
    en:
      - Local accounts on this machine are created by a tool that sets a password to a pattern which cannot be changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordComplexity\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^PasswordComplexity\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'PasswordComplexity'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The part that really works is not the mix of character kinds but the ban
    # on the account name inside the password. Scripts that build passwords to a
    # pattern of their own are what breaks here, not people.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordComplexity = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordComplexity = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/password-must-meet-complexity-requirements

notes:
  pl: |
    Wymagania wbudowane sprawdzają rodzaje znaków i obecność nazwy konta
    w haśle. Nie sprawdzają, czy hasło jest znane z list wyciekłych, i nie
    znają słownika — to jest granica tego punktu i warto ją znać, zamiast
    zakładać, że włączona złożoność wystarcza.

    Wartość realna leży w odrzuceniu haseł zbudowanych z nazwy konta.
    Wymóg trzech rodzajów znaków ludzie spełniają w sposób przewidywalny
    i sam w sobie daje niewiele.

    Punkt działa w parze z najmniejszą długością hasła. Z tych dwóch długość
    jest ważniejsza i tak ją oceniam w swojej regule.
  en: |
    The built-in requirements check kinds of character and the presence of the
    account name in the password. They do not check whether the password is
    known from leak lists, and they know no dictionary - that is the boundary
    of this item, and worth knowing rather than assuming that complexity being
    on is enough.

    The real value lies in refusing passwords built from the account name. The
    demand for three kinds of character is met by people in a predictable way
    and gives little on its own.

    The item works as a pair with the smallest password length. Of the two,
    length matters more, and that is how I rate it in my own rule.
