id: win11-bitlocker-os-drive-recovery-options

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysku systemowego ustalony
    en: The way of recovering access to the system drive settled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Klucz odzyskiwania jest tym, co pozostaje, kiedy zawiedzie wszystko inne:
    zapomniany kod, wymieniona płyta główna, aktualizacja, po której moduł
    sprzętowy nie rozpoznaje maszyny. Bez niego zaszyfrowany dysk jest stracony
    razem z zawartością — i jest to strata nieodwracalna, w odróżnieniu od
    większości skutków wdrożeń opisanych w tej paczce.

    Punkt rozstrzyga naraz kilka rzeczy o tym kluczu: że ma powstać, że ma
    trafić do usługi katalogowej, że szyfrowanie nie ruszy, dopóki tam nie
    trafi, i że użytkownik nie zobaczy w kreatorze opcji pozwalających te
    warunki obejść.

    Ostatni warunek jest tym, który zamienia zamiar w stan faktyczny.
    Odzyskiwanie opisane w zasadzie, ale zostawione użytkownikowi do wyboru
    w oknie kreatora, kończy się kluczem wydrukowanym i schowanym w szufladzie
    albo zapisanym na tym samym dysku, który ma chronić.

    Osobno punkt zamyka drogę pełnomocnika odzyskiwania danych, czyli
    certyfikatu pozwalającego otworzyć każdy dysk w organizacji. Jest to
    zabezpieczenie wygodne i zarazem jedyny klucz, którego przejęcie otwiera
    wszystko naraz.
  en: |
    The recovery key is what remains when everything else fails: a forgotten code, a
    replaced mainboard, an update after which the hardware module does not recognise
    the machine. Without it an encrypted drive is lost along with its contents - and
    that is an irreversible loss, unlike most of the consequences of the rollouts
    described in this pack.

    The item settles several things about that key at once: that it is to come into
    being, that it is to go to the directory service, that encryption will not start
    until it does, and that the user will not see options in the wizard letting
    those conditions be sidestepped.

    The last condition is what turns intent into fact. Recovery described in a
    policy but left to the user's choice in the wizard's window ends with a key
    printed and put in a drawer, or saved onto the very drive it is meant to guard.

    Separately, the item closes off the data recovery agent - a certificate letting
    any drive in the organisation be opened. It is a convenient safeguard and at the
    same time the one key whose capture opens everything at once.

disruption_description:
  pl: |
    Jest to punkt, który na maszynie spoza domeny zatrzymuje szyfrowanie
    całkowicie, i trzeba to rozstrzygnąć przed wdrożeniem.

    Warunek, żeby nie zaczynać szyfrowania przed zapisaniem klucza w usłudze
    katalogowej, jest bezwzględny. Na maszynie, która do domeny nie należy albo
    nie ma z nią łączności, szyfrowanie po prostu nie ruszy — kreator zakończy
    się błędem o niemożności zapisania informacji odzyskiwania. Nie jest to
    usterka, tylko działanie zgodne z punktem.

    Na maszynie w domenie zmiana jest niewidoczna dla użytkownika poza tym, że
    kreator szyfrowania przestaje pytać, gdzie zapisać klucz. Jest to zmiana na
    korzyść: decyzja przenosi się z osoby, która akurat włącza szyfrowanie, do
    zasady.

    Wdrożenie wymaga przygotowania po stronie usługi katalogowej — schemat musi
    przyjmować informacje odzyskiwania, a konta maszyn muszą mieć prawo je
    zapisać. Bez tego skutek jest ten sam co poza domeną.

    Nie ma restartu. Zmiana obowiązuje przy następnym włączeniu szyfrowania.
  en: |
    This is an item that halts encryption entirely on a machine outside a domain,
    and that has to be settled before the rollout.

    The condition not to begin encrypting before the key is written into the
    directory service is absolute. On a machine that does not belong to a domain, or
    has no connection to it, encryption simply will not start - the wizard ends with
    an error about being unable to save the recovery information. That is not a
    fault but behaviour in keeping with the item.

    On a machine in a domain the change is invisible to the user except that the
    encryption wizard stops asking where to save the key. That is a change for the
    better: the decision moves from whoever happens to be switching encryption on
    into a policy.

    The rollout needs preparation on the directory service's side - the schema has
    to accept recovery information and machine accounts have to be allowed to write
    it. Without that the effect is the same as outside a domain.

    There is no restart. The change takes effect the next time encryption is
    switched on.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Na maszynie spoza domeny szyfrowanie dysku systemowego nie ruszy w ogóle, bo klucza nie ma gdzie zapisać
      - Maszyna bez łączności z usługą katalogową nie zaszyfruje dysku do czasu odzyskania łączności
      - Użytkownik przestaje wybierać w kreatorze, gdzie zapisać klucz odzyskiwania
      - Certyfikat pełnomocnika odzyskiwania danych przestaje otwierać dyski szyfrowane po wdrożeniu
    en:
      - On a machine outside a domain, encrypting the system drive will not start at all, as there is nowhere to write the key
      - A machine with no connection to the directory service will not encrypt the drive until the connection returns
      - The user stops choosing in the wizard where to save the recovery key
      - The data recovery agent's certificate stops opening drives encrypted after the rollout
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny albo usługa katalogowa nie przyjmuje informacji odzyskiwania
      - Odzyskiwanie danych opiera się na certyfikacie pełnomocnika i nie przygotowano zamiennika
    en:
      - The machines do not belong to a domain, or the directory service does not accept recovery information
      - Data recovery rests on an agent's certificate and no replacement has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result. Reading them
      # apart would let a machine set halfway pass as set.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        OSRecovery                    = 1
        OSManageDRA                   = 0
        OSRecoveryPassword            = 1
        OSRecoveryKey                 = 0
        OSHideRecoveryPage            = 1
        OSActiveDirectoryBackup       = 1
        OSActiveDirectoryInfoToStore  = 1
        OSRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'OSRecovery', 'OSManageDRA', 'OSRecoveryPassword', 'OSRecoveryKey',
      'OSHideRecoveryPage', 'OSActiveDirectoryBackup',
      'OSActiveDirectoryInfoToStore', 'OSRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      OSRecovery                     = 1
      OSManageDRA                    = 0
      OSRecoveryPassword             = 1
      OSRecoveryKey                  = 0
      OSHideRecoveryPage             = 1
      OSActiveDirectoryBackup        = 1
      OSActiveDirectoryInfoToStore   = 1
      OSRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Jest to najbardziej złożona reguła w tej paczce — osiem wartości w jednym
    rekordzie. Rozdzielenie ich nie wchodzi w grę: każda z osobna wygląda
    niewinnie, a dopiero razem dają stan, w którym klucza odzyskiwania nie da
    się zgubić. Maszyna ustawiona w połowie przechodziłaby wtedy jako ustawiona.

    Punkt zakłada domenę. Na stanowisku wolnostojącym jego wdrożenie zatrzymuje
    szyfrowanie zamiast je utwardzać, i jest to jedyny punkt w tej paczce,
    w którym wdrożenie zgodnie z benchmarkiem może pogorszyć stan bezpieczeństwa
    maszyny. Dlatego tryb kopiowania polecenia jest tu właściwszy od uruchomienia,
    dopóki nie wiadomo, czy maszyna należy do domeny.

    Wpisy nie zmieniają dysków już zaszyfrowanych. Klucz odzyskiwania powstały
    wcześniej pozostaje tam, gdzie go zapisano, i przeniesienie go do usługi
    katalogowej jest osobną czynnością.
  en: |
    This is the most involved rule in this pack - eight values in one record.
    Splitting them is out of the question: each on its own looks innocent, and only
    together do they give a state in which the recovery key cannot be lost. A
    machine set halfway would then pass as set.

    The item assumes a domain. On a standalone station applying it halts encryption
    rather than hardening it, and it is the only item in this pack where applying
    the benchmark can worsen a machine's security. That is why the copy mode suits
    better than running here, until it is known whether the machine belongs to a
    domain.

    The entries do not change drives already encrypted. A recovery key created
    earlier stays where it was saved, and moving it into the directory service is a
    separate task.
