id: win2016-wireless-connect-now-registrars-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connect Now
  title:
    pl: Przekazywanie ustawień sieci bezprzewodowej wyłączone
    en: The handing over of wireless network settings switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm przekazujący między urządzeniami
    ustawienia sieci bezprzewodowej, łącznie z kluczem dostępu.

    Zagrożenie leży w tym, co ten mechanizm ma z założenia robić. Jego
    zadaniem jest podanie nowemu urządzeniu nazwy sieci i klucza bez
    wpisywania ich ręcznie. Działa więc tak, żeby klucz przechodził
    z urządzenia na urządzenie przy jak najmniejszym udziale człowieka —
    czasem po naciśnięciu przycisku na obudowie, czasem po wpisaniu kodu
    z nalepki.

    Znaczy to, że maszyna trzymająca klucz do sieci ma włączony składnik,
    którego przeznaczeniem jest ten klucz wydać. Zabezpieczeniem jest tu
    wyłącznie sposób potwierdzenia, a sposoby te są słabe z założenia, bo
    mają być wygodne.

    Na serwerze mechanizm ten nie ma zastosowania. Serwer nie konfiguruje
    drukarek bezprzewodowych ani nie podaje nikomu klucza do sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: składnik
    zaprojektowany po to, żeby wydać klucz sieci urządzeniu, które się
    o niego poprosi.
  en: |
    The setting switches off the mechanism handing wireless network settings between devices, the access
    key included.

    The threat lies in what that mechanism is meant to do. Its task is to give a new device the network's
    name and key without their being typed in by hand. It works therefore so that the key should pass from
    device to device with as little taking part by a person as may be - at times after a button on a case
    is pressed, at times after a code from a label is typed.

    That means a machine holding the key to a network has a component switched on whose purpose is to give
    that key out. The safeguard here is the manner of confirmation alone, and those manners are weak by
    design, being meant to be convenient.

    On a server that mechanism is of no use. A server configures no wireless printers and gives the key to
    the network to nobody.

    What an attacker gains while the item goes unmet: a component designed to give the network's key to a
    device that asks for it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy urządzeń
    konfigurowanych z tej maszyny.

    Pytanie zasadnicze: czy z tej maszyny konfiguruje się urządzenia
    bezprzewodowe — drukarki, skanery, punkty dostępowe, sprzęt pomiarowy.
    Na serwerze zwykle nie, ale bywają maszyny pełniące rolę stanowiska
    serwisowego i tam odpowiedź bywa inna.

    Rozróżnienie zasadnicze, bez którego ten punkt bywa odpuszczany bez
    powodu: zmiana nie dotyczy łączenia się z siecią. Maszyna podłączona
    do sieci bezprzewodowej pozostaje podłączona, a nowe połączenie da się
    zestawić wpisując klucz ręcznie. Zamknięte zostaje wyłącznie
    przekazywanie ustawień między urządzeniami.

    Objaw po nieudanym wdrożeniu jest czytelny: kreator konfiguracji
    urządzenia nie znajduje sieci do przekazania i trzeba podać ustawienia
    ręcznie. Nie jest to awaria, tylko dłuższa droga.

    Czego to nie psuje: łączenia się z sieciami bezprzewodowymi,
    zapamiętanych sieci, sieci przewodowej, drukowania do drukarek już
    skonfigurowanych, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the devices configured from this machine.

    The cardinal question: are wireless devices configured from this machine - printers, scanners, access
    points, measuring gear. On a server as a rule not, but there are machines holding the role of a service
    workplace, and there the answer is at times another.

    The cardinal distinction, without which this item is at times let go without cause: the change does not
    concern the connecting to a network. A machine joined to a wireless network stays joined, and a new
    connection can be set up by typing the key in by hand. What is shut is solely the handing of settings
    between devices.

    The symptom after a failed rollout is legible: the wizard configuring a device finds no network to hand
    over and the settings have to be given by hand. It is no fault, only a longer road.

    What this does not break: the connecting to wireless networks, remembered networks, the wired network,
    printing to already configured printers, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Kreator konfiguracji urządzenia bezprzewodowego nie znajduje sieci do przekazania i ustawienia trzeba podać ręcznie
      - Maszyna podłączona do sieci bezprzewodowej pozostaje podłączona, a nowe połączenie da się zestawić wpisując klucz
      - Drukarki i skanery bezprzewodowe już skonfigurowane działają dalej
      - Sieć przewodowa, zapamiętane sieci, usługi i aplikacje pozostają bez zmian
    en:
      - The wizard configuring a wireless device finds no network to hand over and the settings have to be given by hand
      - A machine joined to a wireless network stays joined, and a new connection can be set up by typing the key
      - Wireless printers and scanners already configured work on
      - The wired network, remembered networks, services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny konfiguruje się urządzenia bezprzewodowe i przekazywanie ustawień jest tam sposobem pracy
      - Maszyna pełni rolę stanowiska serwisowego dla sprzętu pomiarowego łączonego bezprzewodowo
    en:
      - Wireless devices are configured from this machine and the handing of settings is there a way of working
      - The machine holds the role of a service workplace for measuring gear joined wirelessly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
      $name = 'EnableRegistrars'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
    $name = 'EnableRegistrars'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # What is shut is the handing over of network settings between devices, not
    # the connecting to a network. A machine joined to a network stays joined.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableRegistrars' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/mobilebroadband/

notes:
  pl: |
    Punkt otwiera blok o tym, jak ta maszyna zawiera znajomości w sieci —
    z kim się łączy, komu się przedstawia i co przy tej okazji wydaje.
    Wszystkie reguły bloku łączy to, że dotyczą zachowań samoczynnych,
    pomyślanych dla wygody i działających bez decyzji.

    Ta reguła jest w bloku najmocniejsza i warto ją pokazywać pierwszą.
    Jest to jedyny punkt, w którym przedmiotem wprost jest wydanie klucza
    do sieci, a nie sposób jej wyboru.

    Rozróżnienie między przekazywaniem ustawień a łączeniem się z siecią
    jest rzeczą, bez której punkt bywa odpuszczany. Obawa, że maszyna
    przestanie się łączyć bezprzewodowo, jest przy tym zupełnie
    bezpodstawna i warto ją usunąć jednym zdaniem na początku.

    Odnotowuję, że reguła ma sąsiada w tej samej sekcji, dotyczącego
    interfejsu tego mechanizmu. Wykonanie tamtego bez tego zamyka okno,
    a zostawia mechanizm — i warto, żeby aplikacja pokazywała obie razem.
  en: |
    The item opens the block about how this machine makes acquaintance on the network - with whom it
    connects, to whom it presents itself and what on that occasion it gives out. All the block's rules share
    this, that they concern behaviours of themselves, thought up for convenience and working without a
    decision.

    This rule is the strongest in the block and worth showing first. It is the only item whose subject is
    outright the giving out of a network's key, and not the manner of choosing one.

    The distinction between the handing of settings and the connecting to a network is a thing without which
    the item is at times let go. The fear that the machine will cease to connect wirelessly is here wholly
    groundless and worth removing by one sentence at the beginning.

    Worth noting that the rule has a neighbour in the same section, concerning that mechanism's interface.
    Carrying that one out without this one shuts a window and leaves the mechanism - and it is well that the
    application show both together.
