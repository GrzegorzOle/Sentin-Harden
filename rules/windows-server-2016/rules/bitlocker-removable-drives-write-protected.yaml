id: win2016-bitlocker-removable-drives-write-protected

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na niezaszyfrowanych nośnikach wymiennych zabroniony
    en: Writing to unencrypted removable media forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisywania na nośnikach wymiennych, które nie są
    zaszyfrowane, pozostawiając je do odczytu.

    Jest to jedyna reguła bloku, która cokolwiek wymusza. Pozostałe opisują,
    jak ma wyglądać szyfrowanie nośnika, gdy ktoś je włączy; ta sprawia, że
    dane nie wyjadą z maszyny na nośniku, na którym nikt szyfrowania nie
    włączył.

    Pytanie, na które ta reguła odpowiada, brzmi: co się stanie, gdy ktoś
    w pośpiechu zgra pliki na pierwszą pamięć, jaka leżała w szufladzie.
    Bez tej reguły — nic, dane wyjdą. Z nią — zapis się nie uda i trzeba
    będzie zdecydować świadomie.

    Warto zauważyć, że jest to również jedyny punkt w całym zestawie, który
    dotyczy wynoszenia danych na zewnątrz jako takiego, niezależnie od
    tego, czy wynosi je napastnik, czy ktoś dobrze myślący w złej chwili.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyniesienia dowolnej ilości danych na dowolnej pamięci, bez śladu i bez
    przeszkody.
  en: |
    The setting forbids writing to removable media that are not encrypted, leaving them to be read.

    It is the one rule of the block that enforces anything. The rest describe what the encryption of
    a medium is to look like once somebody switches it on; this one makes data not leave the machine
    on a medium nobody switched encryption on for.

    The question this rule answers runs: what will happen when somebody in haste copies files onto
    the first memory that lay in a drawer. Without this rule - nothing, the data will go out. With
    it - the write will not succeed and a knowing decision will have to be taken.

    Worth noticing that it is also the one item in the whole set that concerns the carrying of data
    outward as such, whoever carries them - an attacker or somebody well-meaning at a bad moment.

    What an attacker gains while the item goes unmet: the chance to carry any quantity of data out
    on any memory, with no trace and no hindrance.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana ta dotyka sposobu pracy
    ludzi, a nie ustawienia maszyny.

    Skutek jest natychmiastowy i szeroki. Każdy nośnik niezaszyfrowany
    przestaje przyjmować zapis: pamięć przenośna, dysk w kieszeni, karta
    pamięci, telefon podłączony kablem jako nośnik. Odczyt działa, więc
    objaw wygląda na uszkodzenie nośnika, a nie na zasadę.

    Trzy miejsca warto sprawdzić przed wykonaniem. Pierwsze: czy kopie
    zapasowe nie odkładają się na nośnik wymienny — bo takie odkładanie
    przestanie działać w nocy i zobaczy się to rano. Drugie: czy obsługa nie
    przenosi na nośnikach plików instalacyjnych i zrzutów diagnostycznych.
    Trzecie: czy do maszyny nie podłącza się urządzeń, które system widzi
    jako nośnik wymienny, choć nimi w zwykłym rozumieniu nie są.

    Reguła nie wymaga zaszyfrowania niczego. Wymaga, żeby na
    niezaszyfrowanym przestać zapisywać. Kolejność wdrożenia jest więc taka
    sama jak przy dyskach stałych: najpierw zaszyfrować nośniki, które mają
    dalej działać, potem wprowadzić zakaz.

    Czego to nie psuje: odczytu z nośników niezaszyfrowanych, zapisu na
    zaszyfrowanych, pracy systemu, sieci, udziałów.

    Nie wymaga restartu; nośniki już podłączone trzeba odłączyć i podłączyć
    ponownie.
  en: |
    The class is "needs a planned rollout", the change touching the way people work rather than a
    machine's setting.

    The consequence is immediate and wide. Every unencrypted medium ceases to take writes: a carried
    memory, a drive in a caddy, a memory card, a telephone plugged in by a cable as a medium.
    Reading works, so the symptom looks like a fault in the medium rather than a policy.

    Three places are worth checking before execution. The first: whether backup copies are not laid
    onto a removable medium - such a laying will cease to work at night and will be seen in the
    morning. The second: whether the attendance does not carry installation files and diagnostic
    dumps on media. The third: whether devices the system sees as a removable medium, though in the
    ordinary sense they are not, are not plugged into the machine.

    The rule requires nothing to be encrypted. It requires that writing to what is unencrypted
    cease. The order of rollout is therefore the same as at the fixed drives: first encrypt the media
    that are to go on working, then bring in the ban.

    What this does not break: reading from unencrypted media, writing to encrypted ones, the system's
    working, the network, or shares.

    Calls for no restart; media already plugged in have to be unplugged and plugged in again.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Każdy nośnik niezaszyfrowany przestaje przyjmować zapis, a odczyt działa dalej, więc objaw wygląda na uszkodzenie nośnika
      - Kopie zapasowe odkładane na nośnik wymienny przestaną się odkładać w nocy i zobaczy się to dopiero rano
      - Telefon podłączony kablem i karta pamięci są dla systemu nośnikami wymiennymi i podlegają temu samemu zakazowi
      - Przenoszenie plików instalacyjnych i zrzutów diagnostycznych na nośniku przestaje działać
      - Odczyt z nośników niezaszyfrowanych i zapis na zaszyfrowanych pozostają bez zmian
    en:
      - Every unencrypted medium ceases to take writes while reading works on, so the symptom looks like a fault in the medium
      - Backup copies laid onto a removable medium will cease to be laid at night and it will be seen only in the morning
      - A telephone plugged in by a cable and a memory card are to the system removable media and fall under the same ban
      - Carrying installation files and diagnostic dumps on a medium ceases to work
      - Reading from unencrypted media and writing to encrypted ones stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Kopie zapasowe odkładają się na nośnik wymienny, który nie jest zaszyfrowany
      - Nie ustalono, które podłączane do tej maszyny urządzenia system widzi jako nośnik wymienny
      - Nie ma okna na zaszyfrowanie nośników, które mają dalej przyjmować zapis, a zakaz miałby wejść wcześniej
    en:
      - Backup copies are laid onto a removable medium that is not encrypted
      - It has not been established which devices plugged into this machine the system sees as a removable medium
      - There is no window for encrypting the media that are to go on taking writes, and the ban would come in first
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'RDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'RDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt zamyka blok i jest w nim najcięższy, dokładnie tak jak jego
    odpowiednik zamykał sprawę dysków stałych. Różnica polega na tym, kogo
    dotyka: tamten zatrzymywał usługi, ten zatrzymuje ludzi.

    Warto to odzwierciedlić w opisie skutków. Usługa, która nie może
    zapisać, zgłasza błąd do dziennika. Człowiek, który nie może zapisać,
    szuka innej drogi — i zwykle ją znajduje. Wdrożenie tego punktu bez
    powiedzenia ludziom, jak mają przenosić pliki, kończy się przesyłaniem
    ich pocztą albo usługą w sieci, czyli w miejsce gorsze.

    Lista urządzeń, które system widzi jako nośnik wymienny, jest szersza,
    niż wynika z nazwy, i to jest najczęstsza pułapka tej reguły. Telefon
    podłączony kablem, aparat, czytnik kart, dysk w kieszeni — wszystkie
    podlegają temu samemu zakazowi. Inwentaryzacja z etapu audytu powinna to
    pokazać, zamiast zostawiać użytkownika z pojęciem „nośnik wymienny".

    Odnotowuję wreszcie, że wartość leży w innej gałęzi rejestru niż reszta
    bloku — tak samo jak przy dyskach stałych. Jest to właściwość samego
    ustawienia.
  en: |
    The item shuts the block and is the heaviest in it, exactly as its counterpart shut the matter of
    the fixed drives. The difference lies in whom it touches: that one stopped services, this one
    stops people.

    That is worth reflecting in the description of consequences. A service that cannot write reports
    an error to the log. A person who cannot write looks for another road - and as a rule finds one.
    Rolling this item out without telling people how they are to carry files ends in their being sent
    by post or by a service on the network, which is to say to a worse place.

    The list of devices the system sees as a removable medium is wider than the name suggests, and
    that is this rule's commonest trap. A telephone plugged in by a cable, a camera, a card reader, a
    drive in a caddy - all fall under the same ban. The inventory from the audit stage should show
    that rather than leave the user with the notion "removable medium".

    Worth noting finally that the value lies in a different branch of the registry than the rest of
    the block - as at the fixed drives. It is a property of the setting itself.
