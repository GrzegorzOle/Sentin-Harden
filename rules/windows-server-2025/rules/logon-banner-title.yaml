id: win2025-logon-banner-title

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Tytuł komunikatu wyświetlanego przed zalogowaniem ustawiony
    en: The title of the message shown before signing in set
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nadaje tytuł komunikatowi pokazywanemu przed
    zalogowaniem się na tej maszynie.

    Punkt nie broni przed niczym technicznie i trzeba to powiedzieć
    wprost, zamiast udawać, że jest inaczej. Napastnik nie zostanie
    zatrzymany przez zdanie na ekranie. Wartość leży gdzie indziej:
    w tym, że osoba wchodząca na maszynę została uprzedzona, czyja ona
    jest i na jakich zasadach wolno z niej korzystać.

    Ma to znaczenie w postępowaniu, które przychodzi po zdarzeniu.
    Dowód, że wchodzący widział ostrzeżenie, bywa różnicą między
    sprawą, którą da się poprowadzić, a sprawą, w której obrona mówi,
    że nikt niczego nie zabraniał. Jest to wartość prawna i tak ją
    oceniam — stąd kategoria niska, bo przed atakiem nie broni.

    Na serwerze komunikat pojawia się przy logowaniu na konsoli
    i przy połączeniu pulpitem zdalnym, czyli na obu drogach, którymi
    ludzie na serwer wchodzą. Różni to serwer od stanowiska roboczego,
    gdzie widzi go wyłącznie osoba siadająca przed komputerem.

    Punkt sprawdza obecność tytułu, a nie jego treść. Treść jest
    decyzją organizacji i aplikacja nie ma prawa jej narzucać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    technicznie nic. Traci na tym natomiast właściciel maszyny, gdy
    przychodzi wykazać, że wejście było nieuprawnione.
  en: |
    The setting gives a title to the message shown before signing in to this machine.

    The item guards against nothing technically, and that must be said outright rather than
    pretended otherwise. No attacker will be halted by a sentence on a screen. The worth lies
    elsewhere: in the person coming onto the machine having been warned whose it is and on what
    terms it may be used.

    That weighs in the proceedings that come after an incident. Proof that the one coming in saw
    the warning is at times the difference between a case that can be led and a case where the
    defence says nobody forbade anything. It is a worth in law and I rate it so - thence the low
    category, guarding against no attack.

    On a server the message appears at a sign-in at the console and at a connection by remote
    desktop, that is, on both roads people come onto a server by. Therein a server differs from
    a working station, where only the person sitting down before the computer sees it.

    The item checks that a title is there rather than what it says. What it says is the
    organisation's decision and the application has no business laying it down.

    What an attacker gains while the item goes unmet: technically nothing. What is lost is the
    machine's owner's, when the time comes to show that an entry was unwarranted.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy ludzi i wymaga uzgodnienia
    treści przed wprowadzeniem, a nie po nim.

    Warunkiem wstępnym jest ustalenie brzmienia komunikatu z osobą
    odpowiedzialną za sprawy prawne w organizacji. Punkt zaliczono do
    wymagających świadomego wdrożenia właśnie z tego powodu, a nie
    z powodu skutku technicznego. Komunikat pokazany wszystkim,
    o brzmieniu wymyślonym naprędce, jest gorszy niż jego brak — bo
    wygląda na oficjalny, a nikt za nim nie stoi.

    Skutek codzienny jest niewielki, ale realny. Przy każdym logowaniu
    przybywa jeden krok: komunikat trzeba zamknąć. Na serwerze
    administrowanym pulpitem zdalnym krok ten powtarza się dziesiątki
    razy dziennie i bywa odbierany jako uciążliwość.

    Przypadkiem do sprawdzenia jest logowanie zautomatyzowane. Część
    narzędzi łączących się pulpitem zdalnym w sposób nienadzorowany nie
    radzi sobie z komunikatem i zatrzymuje się na nim. Dotyczy to
    zwłaszcza rozwiązań starszych i skryptów sterujących sesją.

    Zmiana nie dotyczy sesji już otwartych ani połączeń zarządzania
    zdalnego niebędących sesją graficzną. Odczyt zdalny, zarządzanie
    wierszem poleceń i zadania harmonogramu komunikatu nie zobaczą.

    Naprawa wpisuje brzmienie przykładowe. Jest ono punktem wyjścia,
    a nie wymaganiem punktu — zastąp je własnym przed wdrożeniem
    szerokim.
  en: |
    The change surely changes how people work and takes an agreeing of the wording before it is
    brought in, not after.

    The precondition is settling the message's wording with whoever answers for matters of law
    in the organisation. The item was counted among those taking a knowing rollout for just that
    reason, not for a technical effect. A message shown to everyone, worded in haste, is worse
    than none - it looks official while nobody stands behind it.

    The everyday effect is small but real. At every sign-in one step is added: the message must
    be closed. On a server administered by remote desktop that step repeats dozens of times a
    day and is at times taken for a nuisance.

    The case to be checked is automated signing in. Some tools connecting by remote desktop with
    nobody present do not manage the message and halt upon it. That concerns older arrangements
    and scripts steering a session above all.

    The change does not bear on sessions already open or on remote management connections that
    are no graphical session. A remote reading, management by the command line and the
    scheduler's jobs will not see the message.

    The mending writes a sample wording. It is a starting point rather than a requirement of the
    item - put your own in its stead before a wide rollout.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Przy każdym logowaniu na konsoli i pulpitem zdalnym przybywa krok zamknięcia komunikatu
      - Narzędzie łączące się pulpitem zdalnym w sposób nienadzorowany może zatrzymać się na komunikacie
      - Zarządzanie wierszem poleceń i zadania harmonogramu komunikatu nie zobaczą
      - Brzmienie wpisywane przez naprawę jest przykładowe i wymaga zastąpienia własnym
    en:
      - At every sign-in at the console and by remote desktop a step of closing the message is added
      - A tool connecting by remote desktop with nobody present may halt upon the message
      - Management by the command line and the scheduler's jobs will not see the message
      - The wording the mending writes is a sample and takes replacing with your own
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brzmienie komunikatu nie zostało uzgodnione z osobą odpowiedzialną za sprawy prawne
      - Do serwera łączą się narzędzia sterujące sesją graficzną w sposób nienadzorowany
    en:
      - The message's wording was never agreed with whoever answers for matters of law
      - Tools steering a graphical session with nobody present connect to the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # An entry present but empty shows no message at all, so it is reported
      # apart from one that is missing entirely.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticecaption'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      elseif (([string]$value).Trim() -eq '') { 'EMPTY' }
      else { 'SET' }
    } catch {
      'CHECK_ERROR'
    }
  expected: SET
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticecaption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item.
    # Replace it with the organisation's own before rolling this out widely.
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'legalnoticecaption' -Value 'Authorised access only' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-title-for-users-attempting-to-log-on

notes:
  pl: |
    Punkt sprawdza obecność tytułu, a nie jego treść. Treść jest
    decyzją organizacji i aplikacja nie ma prawa jej narzucać.

    Wpis obecny, ale pusty nie pokazuje niczego, więc sprawdzenie
    raportuje go osobno od wpisu brakującego. Jest to różnica warta
    utrzymania, bo wskazuje na ustawienie porzucone w połowie.

    Czytaj razem z treścią komunikatu. Tytuł bez treści i treść bez
    tytułu dają komunikat niepełny, a system pokazuje go tylko wtedy,
    gdy obie części są ustawione.
  en: |
    The item checks that a title is there rather than what it says. What it says is the
    organisation's decision and the application has no business laying it down.

    An entry present but empty shows nothing, so the check reports it apart from one missing
    entirely. That difference is worth keeping, pointing as it does to a setting left half done.

    Read together with the message's body. A title without a body and a body without a title
    make an incomplete message, and the system shows it only where both parts are set.
