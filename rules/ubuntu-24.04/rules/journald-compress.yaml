id: ubuntu2404-journald-compress

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.1.2.3
  section: Logging and Auditing > System Logging > Configure journald
  title:
    pl: journald kompresuje duże wpisy
    en: Ensure journald Compress is configured
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Duże wpisy w dzienniku, na przykład zrzuty danych programów, szybko
    zapełniają dysk. Gdy miejsca brakuje, journald usuwa najstarsze pliki
    dziennika i razem z nimi ślady, które mogą być potrzebne po incydencie.

    Punkt wymaga, żeby Compress w journald.conf miało wartość yes, czyli
    żeby duże wpisy były kompresowane przed zapisem. Jest to wartość
    domyślna.
  en: |
    Large journal entries, for example data dumps of programs, fill the disk
    quickly. When space runs out, journald deletes the oldest journal files
    and with them traces that may be needed after an incident.

    The item requires Compress in journald.conf to be set to yes, that is,
    large entries are compressed before they are written. This is the
    default value.

disruption_description:
  pl: |
    Nikt tego nie zauważy: kompresja jest domyślnie włączona, a jej koszt
    dla procesora jest pomijalny.
  en: |
    Nobody will notice: compression is on by default and its processor cost
    is negligible.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
    if in_use rsyslog || in_use syslog-ng; then echo NOT_APPLICABLE; exit 0; fi
    if ! systemd-analyze cat-config systemd/journald.conf >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    c=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -v s="[Journal]" -v k="Compress" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
    [ -n "$c" ] || c=default
    if printf '%s\n' "$c" | grep -qxE '(yes|true|on|1|default)'; then echo "OK:$c"; else echo "NOT_OK:${c:-default}"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/systemd/journald.conf.d/zz-sentin-harden-compress.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      in_use() { case "$(systemctl is-enabled "$1.service" 2>/dev/null)" in enabled|enabled-runtime) return 0 ;; esac; systemctl is-active --quiet "$1.service" 2>/dev/null; }
      if in_use rsyslog || in_use syslog-ng; then
        echo "rsyslog or syslog-ng keeps the logs, so this item does not apply; nothing to change"; exit 0
      fi
      f=/etc/systemd/journald.conf.d/zz-sentin-harden-compress.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      mkdir -p /etc/systemd/journald.conf.d
      printf '%s\n' '# Sentin-Harden: ubuntu2404-journald-compress' '[Journal]' 'Compress=yes' > "$f"
      chmod 0644 "$f"
      c=$(systemd-analyze cat-config systemd/journald.conf 2>/dev/null | awk -v s="[Journal]" -v k="Compress" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
      if [ "$c" != "yes" ]; then
        if [ "$(sed -n 's/^existed=//p' "$b" | head -n 1)" = 1 ]; then sed '1,/^---$/d' "$b" > "$f"; else rm -f "$f"; fi
        echo "Another drop-in sets Compress after $f; the effective value is ${c:-default}; restored the previous state" >&2; exit 1
      fi
      echo "Set Compress=yes in $f"
      if [ -d /run/systemd/system ]; then
        ju="systemd-journald.service systemd-journald.socket systemd-journald-dev-log.socket"
        systemctl reset-failed $ju >/dev/null 2>&1 || true
        if ! systemctl try-reload-or-restart systemd-journald.service; then
          systemctl reset-failed $ju >/dev/null 2>&1 || true
          systemctl start systemd-journald.socket systemd-journald-dev-log.socket systemd-journald.service
        fi
        echo "Restarted systemd-journald so that it reads the configuration"
      fi
    )

  rollback_command: |
    (
      set -e
      f=/etc/systemd/journald.conf.d/zz-sentin-harden-compress.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      echo "Restored the previous state of $f"
      if [ -d /run/systemd/system ]; then
        ju="systemd-journald.service systemd-journald.socket systemd-journald-dev-log.socket"
        systemctl reset-failed $ju >/dev/null 2>&1 || true
        if ! systemctl try-reload-or-restart systemd-journald.service; then
          systemctl reset-failed $ju >/dev/null 2>&1 || true
          systemctl start systemd-journald.socket systemd-journald-dev-log.socket systemd-journald.service
        fi
        echo "Restarted systemd-journald so that it reads the configuration"
      fi
    )

privileges: root
runnable: true

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html

notes:
  pl: |
    Brak wpisu oznacza wartość domyślną yes i spełnia punkt. Compress może
    też podawać próg rozmiaru w bajtach; taki zapis sprawdzenie uznaje za
    niezgodny, bo CIS wymaga jawnego yes.

    Sprawdzenie odczytuje wartość z polecenia systemd-analyze cat-config
    systemd/journald.conf, które pokazuje plik główny i pliki z katalogów
    journald.conf.d w kolejności stosowania, więc liczy się ostatnie
    przypisanie w sekcji [Journal]. Naprawa zapisuje ustawienie w
    /etc/systemd/journald.conf.d/zz-sentin-harden-compress.conf. Nazwa zaczyna się od zz-, bo
    pliki są stosowane w kolejności nazw, a pakiet systemd na Ubuntu ma
    własny plik /usr/lib/systemd/journald.conf.d/syslog.conf. Jeśli inny plik
    nadal nadpisuje ustawienie, naprawa przywraca poprzedni stan i kończy się
    błędem. systemd-journald w systemd 255 nie obsługuje przeładowania
    konfiguracji, więc naprawa i wycofanie restartują usługę; usługi
    piszące do dziennika nie tracą połączenia, bo journald przechowuje je
    w systemd na czas restartu. Przed restartem naprawa zeruje licznik
    uruchomień jednostki (systemctl reset-failed), bo po pięciu startach
    w ciągu 10 sekund systemd zatrzymałby journald razem z jego gniazdami.
    Wycofanie przywraca poprzedni stan pliku.

    Punkty 6.1.2 dotyczą komputerów, na których dzienniki prowadzi tylko
    journald. Gdy rsyslog albo syslog-ng jest włączony lub działa, wynik to
    NOT_APPLICABLE, a naprawa niczego nie zmienia (tak samo rozstrzyga punkt
    6.1.1.4). Ubuntu Server ma domyślnie włączony rsyslog.
  en: |
    No entry means the default value yes and meets the item. Compress can
    also give a size threshold in bytes; the check treats such a setting as
    non-compliant, because CIS requires an explicit yes.

    The check reads the value from the systemd-analyze cat-config
    systemd/journald.conf command, which shows the main file and the files
    from the journald.conf.d directories in the order they are applied, so
    the last assignment in the [Journal] section counts. The remediation
    writes the setting to /etc/systemd/journald.conf.d/zz-sentin-harden-compress.conf. The name
    starts with zz-, because the files are applied in the order of their
    names, and the systemd package on Ubuntu has its own
    /usr/lib/systemd/journald.conf.d/syslog.conf file. If another file still
    overrides the setting, the remediation restores the previous state and
    ends with an error. systemd-journald in systemd 255 does not support
    reloading its configuration, so the remediation and rollback restart the
    service; services writing to the journal keep their connection, because
    journald keeps it in systemd during the restart. Before the restart the
    remediation clears the start counter of the unit (systemctl
    reset-failed), because after five starts within 10 seconds systemd would
    stop journald together with its sockets. Rollback restores the previous
    state of the file.

    Items 6.1.2 apply to computers where only journald keeps the logs. When
    rsyslog or syslog-ng is enabled or running, the result is NOT_APPLICABLE
    and the remediation changes nothing (item 6.1.1.4 decides the same way).
    Ubuntu Server has rsyslog enabled by default.
