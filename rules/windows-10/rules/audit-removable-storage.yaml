id: win10-audit-removable-storage

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Object Access
  title:
    pl: Inspekcja dostępu do nośników wymiennych
    en: The audit of access to removable media
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje odwołania do plików na nośnikach wymiennych —
    odczyty i zapisy — wraz z kontem, które ich dokonało.

    Podkategoria domyka blok i jest w nim jedyną, która widzi treść,
    a nie samo zdarzenie. Inspekcja podłączania urządzeń mówi, że nośnik się
    pojawił. Ta mówi, co z niego wzięto i co na niego zapisano.

    Jest to jedyny zapis w całej paczce odpowiadający na pytanie
    o wyprowadzenie danych drogą fizyczną — czyli na to pytanie, którego
    żaden zapis sieciowy nie obejmuje i przed którym żadna zapora nie
    broni.

    Zapisywane są oba wyniki, ale treść leży tu po stronie powodzeń,
    odwrotnie niż przy udziałach sieciowych. Odmowa dostępu do własnego
    nośnika jest rzadka; skopiowanie na niego katalogu jest zdarzeniem
    zwykłym i właśnie ono bywa tym, czego się szuka.

    Odnotowuję granicę: zapis mówi o odwołaniu do pliku, nie o jego
    zawartości ani o tym, czy kopia się powiodła w całości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: skopiowanie
    danych na nośnik wymienny niezostawiające śladu w żadnym zapisie.
  en: |
    The setting writes down the callings upon files on removable media - readings and writings - together with
    the account that made them.

    The subcategory closes the block and is the only one in it that sees substance and not the bare event. The
    audit of the joining of devices says a medium came up. This says what was taken off it and what was written
    onto it.

    It is the one record in the whole pack answering the question of data led away by a bodily road - which is
    to say the question no network record takes in and no firewall guards against.

    Both outcomes are written, but the substance lies here upon the side of successes, opposite to what holds at
    network shares. A refusal of access to one's own medium is rare; the copying of a folder onto it is an
    ordinary happening, and it is just that which is at times what is sought.

    I set down the bound: the record speaks of a calling upon a file, not of its contents nor of whether the
    copying came through whole.

    What an attacker gains while the item goes unmet: the copying of data onto a removable medium, leaving no
    trace in any record.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, jak na
    tej maszynie używa się nośników.

    Ustawienie niczego nie zabrania i nie ogranicza dostępu do nośników.
    Zapisuje wyłącznie odwołania do plików na nich.

    Sprawdzić trzeba objętość, bo jest to jedyna reguła bloku, której koszt
    zależy od zwyczajów ludzi, a nie od roli maszyny. Skopiowanie katalogu
    z tysiącem plików na nośnik daje tysiące wpisów — po jednym na plik
    i osobno na odczyt oraz zapis. Jedna czynność potrafi wypełnić dziennik
    w kilka minut.

    Na stanowisku, gdzie nośników używa się okazjonalnie, zapis jest niemal
    pusty i reguła jest tania. Na stanowisku, gdzie kopiowanie na nośnik
    jest częścią pracy, zapis zagłuszy wszystko inne.

    Odnotowuję, że reguła bywa mylona z blokadą nośników. Nie blokuje ich —
    i sama w sobie niczego nie utrudnia napastnikowi, tylko odnotowuje.

    Czego to nie psuje: używania nośników wymiennych, kopiowania na nie,
    uprawnień, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is how media are used upon this machine.

    The setting forbids nothing and bounds no access to media. It writes down the callings upon files upon them
    alone.

    What has to be reviewed is the bulk, this being the block's one rule whose cost hangs upon people's habits
    and not upon the machine's part. The copying of a folder of a thousand files onto a medium gives thousands
    of entries - one to a file, and apart for the reading and for the writing. A single act can fill a log within
    a few minutes.

    Upon a workstation where media are used now and then the record is near empty and the rule comes cheap. Upon
    a workstation where copying onto a medium is part of the work the record will drown out everything else.

    I set down that the rule is at times mistaken for a blocking of media. It blocks them not - and of itself
    makes nothing harder for an attacker, it only sets down.

    What this does not break: the use of removable media, the copying onto them, rights, logging on, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - removable-media
  what_breaks:
    pl:
      - Skopiowanie katalogu z tysiącem plików na nośnik daje tysiące wpisów, po jednym na plik i osobno na odczyt oraz zapis
      - Jedna taka czynność potrafi wypełnić dziennik zabezpieczeń w kilka minut
      - Na stanowisku, gdzie kopiowanie na nośnik jest częścią pracy, zapis zagłuszy wszystko inne
      - Reguła nie blokuje nośników i sama w sobie niczego nie utrudnia napastnikowi, tylko odnotowuje
      - Używanie nośników, uprawnienia, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Copying a folder of a thousand files onto a medium gives thousands of entries, one to a file and apart for reading and writing
      - A single such act can fill the security log within a few minutes
      - Upon a workstation where copying onto a medium is part of the work the record will drown out everything else
      - The rule blocks no media and of itself makes nothing harder for an attacker, it only sets down
      - The use of media, rights, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kopiowanie na nośniki wymienne jest częścią codziennej pracy na tej maszynie, a dziennik ma rozmiar domyślny
      - Zdarzenia nie są zbierane poza maszynę i nie ma kto czytać zapisu o tej objętości
    en:
      - Copying onto removable media is part of the daily work upon this machine while the log is of its default size
      - The events are not gathered away from the machine and there is nobody to read a record of that bulk
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9245-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9245-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9245-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. Reading from a medium and writing to it are both
    # successes, and it is the successful half that carries the substance here.
    auditpol /set /subcategory:"{0CCE9245-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9245-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-removable-storage

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną, przy której koszt zależy od
    zwyczajów ludzi, a nie od roli maszyny. Ta sama reguła na dwóch
    stanowiskach o tej samej konfiguracji potrafi być tania i nie do
    utrzymania.

    Warto, żeby aplikacja postawiła tu pytanie o sposób pracy, zamiast
    wyliczać skutek ogólny. Jest to jeden z niewielu punktów, przy których
    odpowiedź „u nas kopiuje się na nośniki codziennie" przesądza o decyzji
    mocniej niż cokolwiek w opisie reguły.

    Odnotowuję parę z inspekcją podłączania urządzeń. Tamta mówi, że nośnik
    się pojawił; ta mówi, co się z niego wzięło. Razem są jedyną
    odpowiedzią na pytanie o wyprowadzenie danych drogą fizyczną — a osobno
    pierwsza jest tania i niepełna, a druga pełna i droga.
  en: |
    The rule closes the block and is the only one in it whose cost hangs upon people's habits and not upon the
    machine's part. The same rule upon two workstations of the same setting can be cheap and not to be borne.

    It is well that the application put here a question about the manner of work rather than set out a general
    consequence. It is one of the few items at which the answer "we copy onto media daily" settles the decision
    harder than anything in the rule's description.

    I set down the pairing with the audit of the joining of devices. That says a medium came up; this says what
    was taken off it. Together they are the one answer to the question of data led away by a bodily road - while
    apart the first is cheap and incomplete, and the second complete and dear.
