id: win2025-optional-subsystems-empty

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista opcjonalnych środowisk uruchomieniowych pusta
    en: The list of optional runtime environments left empty
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    System potrafi uruchomić obok własnego środowiska uruchomieniowego
    także inne, wpisane na osobną listę. Ustawienie każe tę listę
    opróżnić.

    Środowiska te są pozostałością po czasach, gdy Windows miał
    uruchamiać programy pisane dla systemów zupełnie innych. Każde z nich
    jest osobną implementacją wywołań systemowych, czyli osobnym kodem
    działającym blisko jądra — i osobnym zestawem błędów, których nikt
    nie szuka, bo nikt tego kodu nie używa.

    Na tym polega cała treść punktu. Nie chodzi o to, że jakiś konkretny
    program jest groźny, tylko o to, że utrzymuje się gotową, rzadko
    oglądaną drogę wykonania kodu w miejscu, w którym błąd kosztuje
    najwięcej. Kod nieużywany nie jest kodem nieszkodliwym — jest kodem
    nieprzejrzanym.

    Na serwerze rzecz ma dodatkowy wymiar. Serwery żyją dłużej niż
    stanowiska robocze i częściej niosą ustawienia przeniesione przez
    kolejne migracje. Wpis na tej liście bywa śladem po decyzji sprzed
    dwóch wersji systemu i po aplikacji, której dawno nie ma — a lista
    jest odczytywana przy każdym starcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    dodatkowe, rzadko przeglądane środowisko wykonania kodu, dostępne
    lokalnie przez cały czas pracy maszyny.
  en: |
    Beside its own runtime environment the system can start others too, written on a separate
    list. The setting bids that list be emptied.

    These environments are a remnant of the time when Windows was to run programs written for
    wholly other systems. Each is a separate working out of system calls, that is separate code
    running near the kernel - and a separate set of faults nobody looks for, nobody using that
    code.

    Therein lies the whole substance of the item. It is not that some particular program is
    dangerous, but that a ready, seldom looked at road of running code is kept in the place where
    a fault costs most. Code unused is not code harmless - it is code unexamined.

    On a server the matter has a further dimension. Servers live longer than working stations and
    carry more often settings brought over by one migration after another. An entry on this list
    is at times a trace of a decision from two versions of the system ago and of an application
    long gone - and the list is read at every starting.

    What an attacker gains while the item goes unmet: a further, seldom examined environment for
    the running of code, to be had locally the whole time the machine works.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy na tym serwerze pracuje cokolwiek,
    co z wpisanego środowiska korzysta.

    Serwer w stanie domyślnym ma tę listę pustą, więc niezgodność
    oznacza zawsze wpis wprowadzony kiedyś ręcznie albo przeniesiony
    z poprzedniej instalacji. Audyt pokazuje treść wpisu, a nie samą
    niezgodność, i od niej trzeba zacząć — bo to ona mówi, czego szukać.

    Na serwerze aplikacyjnym z oprogramowaniem branżowym sprzed
    kilkunastu lat wpis taki bywa potrzebny naprawdę. Dotyczy to zwłaszcza
    systemów przeniesionych z platform uniksowych, które przy przenosinach
    zostały przy własnym zestawie wywołań zamiast zostać przepisane.

    Objaw po zmianie jest natychmiastowy i twardy: program korzystający
    z usuniętego środowiska nie uruchomi się w ogóle. Nie jest to
    pogorszenie działania ani błąd w trakcie pracy — to jest odmowa
    startu.

    Rozpoznanie prowadzi się przed zmianą, na maszynie zapasowej albo
    na jednej maszynie z grupy. Skoro wpis jest, ktoś go kiedyś zrobił
    i warto znaleźć po co, zanim się go usunie.

    Klasę podniosłem względem paczki stanowiska roboczego z dwóch
    powodów naraz. Zmiana wchodzi w życie dopiero po ponownym
    uruchomieniu maszyny, a serwer restartuje się w oknie planowanym —
    więc między zapisaniem a zadziałaniem raport pokazywałby stan
    zgodny, którego system jeszcze nie egzekwuje. I prawdopodobieństwo,
    że wpis jest tam z powodu, jest na serwerze wyższe niż na
    stanowisku.

    Cofnięcie zmiany też wymaga restartu, więc pomyłka nie naprawia się
    od ręki. Jest to argument za tym, żeby rozpoznanie zrobić rzetelnie.
  en: |
    One thing needs checking: whether anything working on this server uses the environment written
    there.

    A server in its default state holds this list empty, so non-compliance always means an entry
    made by hand at some time or brought over from a former installation. The audit shows the
    entry's contents and not the bare non-compliance, and it is from that one must begin - it
    being what says what to look for.

    On an application server with trade software from a dozen or more years ago such an entry is
    at times truly needed. That holds above all for systems brought over from unix platforms,
    which at the moving kept their own set of calls instead of being written anew.

    The symptom after the change is at once and hard: a program using the removed environment will
    not start at all. It is no worsening of working and no fault in the course of work - it is a
    refusal to start.

    The reconnaissance is led before the change, on a spare machine or on one machine of a group.
    The entry being there, somebody made it once, and it is worth finding what for before it is
    removed.

    I raised the class against the working station's pack for two reasons at once. The change
    comes into force only after a fresh start of the machine, and a server restarts in a planned
    window - so between the writing and the working a report would show a compliant state the
    system does not yet enforce. And the likelihood of the entry being there for a reason is
    higher on a server than at a station.

    The undoing of the change takes a restart too, so a slip does not mend itself out of hand. It
    is an argument for making the reconnaissance thoroughly.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Program korzystający z usuniętego środowiska nie uruchomi się w ogóle
      - Oprogramowanie branżowe przeniesione z platformy uniksowej jest typową ofiarą
      - Zmiana wchodzi w życie dopiero po ponownym uruchomieniu maszyny
      - Cofnięcie zmiany również wymaga restartu, więc pomyłka nie naprawia się od ręki
    en:
      - A program using the removed environment will not start at all
      - Trade software brought over from a unix platform is the usual victim
      - The change comes into force only after a fresh start of the machine
      - The undoing of the change takes a restart too, so a slip does not mend itself out of hand
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje program wymagający dodatkowego środowiska uruchomieniowego wpisanego na tę listę
      - Nie ustalono, po co wpis na tej liście został kiedyś wprowadzony
    en:
      - A program requiring an additional runtime environment written on this list works on the server
      - It was not settled what the entry on this list was once made for
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no additional
      # environment is started - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems'
      $name = 'Optional'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: EMPTY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems'
    $name = 'Optional'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = @($current)
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is emptied rather than removed. The value itself is expected by
    # the system, and its want is read the same way as an empty list.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\SubSystems'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Optional' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value @($b.value) -Type MultiString
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-settings-optional-subsystems

notes:
  pl: |
    Kod nieużywany nie jest kodem nieszkodliwym — jest kodem
    nieprzejrzanym. Na tym polega cała treść tego punktu.

    Audyt pokazuje treść wpisu, a nie samą niezgodność, bo to ona mówi,
    czego szukać przed usunięciem.

    Na serwerze wpis bywa śladem po decyzji sprzed dwóch wersji systemu
    i po aplikacji, której dawno nie ma — ale bywa też potrzebny naprawdę,
    zwłaszcza przy oprogramowaniu przeniesionym z platformy uniksowej.

    Klasę podniosłem z powodu restartu i z powodu wyższego
    prawdopodobieństwa, że wpis jest tam z powodu.
  en: |
    Code unused is not code harmless - it is code unexamined. Therein lies the whole substance of
    this item.

    The audit shows the entry's contents and not the bare non-compliance, it being what says what
    to look for before the removing.

    On a server the entry is at times a trace of a decision from two versions of the system ago
    and of an application long gone - but it is at times truly needed too, above all with software
    brought over from a unix platform.

    I raised the class by reason of the restart and of the higher likelihood that the entry is
    there for a reason.
