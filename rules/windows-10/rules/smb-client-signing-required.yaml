id: win10-smb-client-signing-required

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie komunikacji SMB wymagane po stronie klienta
    en: The signing of SMB traffic required on the client side
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby każda sesja z serwerem plików niosła podpis
    liczony z klucza tej sesji — i żeby maszyna odmawiała połączenia, gdy
    druga strona podpisywać nie umie.

    Bez podpisywania maszyna przyjmuje odpowiedzi serwera na słowo. Ktoś,
    kto znajdzie się w środku tej rozmowy — przez zatrucie rozpoznawania
    nazw albo przez przełączenie ruchu — może podmienić przesyłany plik
    albo przekierować sesję na własną maszynę.

    Skutkiem groźniejszym od podmiany pliku jest przekazanie
    uwierzytelnienia. Maszyna łącząc się z udziałem przedstawia się
    poświadczeniami użytkownika. Napastnik stojący w środku może to
    przedstawienie przyjąć i wykorzystać wobec serwera trzeciego, wchodząc
    tam jako ten użytkownik. Podpis to zamyka, bo sesja podpisana jest
    związana z jedną rozmową i nie daje się przełożyć na inną.

    Rzecz warta odnotowania: słowo „wymagane" odróżnia tę regułę od
    ustawienia sąsiedniego, które podpisywanie jedynie dopuszcza. Dopuszczone
    znaczy, że strona druga może je pominąć, a napastnik jest właśnie tą
    stroną drugą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przejęcie
    sesji do udziału i przekazanie cudzego uwierzytelnienia na serwer
    trzeci.
  en: |
    The setting calls for every session with a file server to carry a signature reckoned from that session's
    key - and for the machine to refuse joining where the other side cannot sign.

    Without signing the machine takes a server's answers upon its word. Somebody who comes to stand in the
    middle of that conversation - by a poisoning of name resolution or by a switching of traffic - can change a
    file being sent or turn the session aside to a machine of their own.

    A consequence graver than the changing of a file is the passing on of an authentication. Joining a share,
    the machine presents itself by the user's credentials. An attacker standing in the middle can take that
    presentation and use it against a third server, entering there as that user. A signature closes that, a
    signed session being bound to one conversation and not to be carried over to another.

    A thing worth noting: the word "required" parts this rule from the neighbouring setting, which merely allows
    signing. Allowed means the other side may leave it out, and the attacker is precisely that other side.

    What an attacker gains while the item goes unmet: the taking over of a session to a share and the passing on
    of somebody's authentication to a third server.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co ta maszyna
    montuje.

    Serwery i magazyny wspierane obsługują podpisywanie od lat i zmiany nie
    zauważą. Kłopot dotyczy magazynów sieciowych starszych, urządzeń
    przemysłowych i rejestratorów z udziałem wbudowanym — te po zmianie
    przestaną się montować, bo maszyna odmówi połączenia bez podpisu.

    Drugi skutek jest mierzalny, nie awaryjny: podpisywanie kosztuje czas
    procesora przy każdym pakiecie. Kopiowanie dużych plików zwolni, i będzie
    to widać najbardziej na sprzęcie starszym. Na stanowisku przenoszącym
    codziennie materiał wideo warto to zmierzyć przed wykonaniem, a nie po.

    Odnotowuję przerwę: zmiana wchodzi po restarcie usługi stacji roboczej,
    a ten zrywa otwarte połączenia do udziałów.

    Czego to nie psuje: udziałów na serwerach obsługujących podpisywanie,
    uprawnień do plików, logowania, kont domenowych, drukowania, aplikacji.
  en: |
    The class is "needs review", and the review touches what this machine mounts.

    Supported servers and stores have served signing for years and will not notice the change. The trouble
    touches older network stores, industrial gear and recorders with a built-in share - those will after the
    change cease mounting, the machine refusing to join without a signature.

    The second consequence is a measurable one, not a fault: signing costs processor time at every packet. The
    copying of large files will slow, and that will be seen most upon older hardware. At a workplace carrying
    video material daily it is well to measure that before the carrying out rather than after.

    I set down the break: the change takes hold after a restart of the workstation service, and that tears down
    open connections to shares.

    What this does not break: shares on servers serving signing, the rights upon files, logging on, domain
    accounts, printing, or applications.

implementation_consequences:
  impact_areas:
    - file-sharing
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Udziały na magazynach sieciowych bez obsługi podpisywania przestają się montować na tej maszynie
      - Kopiowanie dużych plików z udziałów sieciowych zwalnia, najbardziej na sprzęcie starszym
      - Wbudowane udziały w urządzeniach przemysłowych i rejestratorach przestają odpowiadać na połączenie
      - Restart usługi stacji roboczej, potrzebny do wejścia zmiany, zrywa otwarte połączenia do udziałów
      - Udziały na serwerach obsługujących podpisywanie, uprawnienia do plików, logowanie i drukowanie pozostają bez zmian
    en:
      - Shares on network stores without signing support cease mounting upon this machine
      - The copying of large files from network shares slows, most of all upon older hardware
      - Built-in shares in industrial gear and recorders cease answering a connection
      - The restart of the workstation service, needed for the change to take hold, tears down open connections to shares
      - Shares on servers serving signing, the rights upon files, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna korzysta z magazynu sieciowego, którego oprogramowanie podpisywania sesji nie obsługuje
      - Stanowisko przenosi codziennie duże pliki z udziału na sprzęcie sprzed lat, a spadku prędkości nie zmierzono
    en:
      - The machine uses a network store whose software does not serve the signing of sessions
      - The workplace carries large files daily from a share on years-old hardware and the loss of speed has not been measured
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'RequireSecuritySignature'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $name = 'RequireSecuritySignature'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine will refuse to join a share whose side cannot sign. The change
    # takes hold once the workstation service has been restarted, and that tears
    # open connections down.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSecuritySignature' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/smb-signing

notes:
  pl: |
    Reguła otwiera parę o podpisywaniu i dotyczy strony sięgającej. Warto,
    żeby aplikacja pokazywała ją razem z regułą o stronie wystawiającej, bo
    uzasadnienie mają wspólne, a zakres skutków rozłączny.

    Argument wart postawienia wprost dotyczy słowa „wymagane". Ustawienie
    sąsiednie, które podpisywanie jedynie dopuszcza, nie wnosi nic wobec
    napastnika, bo to on jest stroną decydującą o pominięciu. Bez tego
    zdania reguła wygląda na powtórzenie czegoś, co już jest ustawione.

    Odnotowuję koszt mierzalny. Jest to jedna z niewielu reguł w tej paczce,
    których skutkiem nie jest awaria, tylko spowolnienie. Aplikacja, która
    podpowie zmierzenie go przed wykonaniem, jest tu więcej warta niż
    ostrzeżenie ogólne.
  en: |
    The rule opens the pair about signing and touches the side that reaches out. It is well that the application
    show it together with the rule about the side that sets out, their grounds being shared while the reach of
    their consequences is not.

    The argument worth putting outright touches the word "required". The neighbouring setting, which merely
    allows signing, brings nothing against an attacker, they being the side deciding to leave it out. Without
    that sentence the rule looks a repeating of something already set.

    I set down the measurable cost. It is one of the few rules in this pack whose consequence is not a fault but
    a slowing. An application prompting that it be measured before the carrying out is here worth more than a
    general warning.
