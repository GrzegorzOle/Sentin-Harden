id: win11-automatic-restart-sign-on-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Logon Options
  title:
    pl: Automatyczne logowanie po restarcie wywołanym aktualizacją wyłączone
    en: Automatic sign-in after an update-driven restart turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy system uruchamia się ponownie, żeby dokończyć aktualizację, potrafi
    zalogować z powrotem tę samą osobę bez pytania o hasło i od razu zablokować
    ekran. Wygląda to jak wygoda — użytkownik wraca do swoich otwartych okien —
    i taki był zamysł.

    Żeby to zrobić, system musi przechować poświadczenia użytkownika przez czas
    ponownego uruchomienia i odtworzyć z nich sesję. Znaczy to, że sesja
    użytkownika istnieje na maszynie, zanim ktokolwiek przy niej stanął i podał
    hasło. Wszystko, co w tej sesji jest odblokowane — klucze, poświadczenia
    zapisane w magazynie, uprawnienia do zasobów sieciowych — jest odblokowane
    bez udziału człowieka.

    Dla maszyny, którą ktoś ma w rękach, jest to różnica zasadnicza. Zamiast
    ekranu logowania z pustą sesją zastaje sesję żywą, zablokowaną tylko ekranem.
    Każda droga obejścia blokady ekranu prowadzi wtedy prosto do odblokowanych
    poświadczeń, zamiast do pustego systemu. Punkt kasuje tę różnicę.
  en: |
    When the system restarts to finish an update, it can sign the same person back
    in without asking for a password and lock the screen straight away. It looks
    like a convenience - the user returns to their open windows - and that was the
    intent.

    To do this the system has to hold the user's credentials across the restart
    and rebuild a session from them. That means the user's session exists on the
    machine before anybody has stood at it and typed a password. Everything
    unlocked inside that session - keys, credentials kept in the store,
    entitlements to network resources - is unlocked with no person involved.

    For a machine somebody has in their hands this is a fundamental difference.
    Instead of a sign-in screen with an empty session they find a live session,
    locked only by the screen. Every route around a screen lock then leads
    straight to unlocked credentials rather than to an empty system. The item
    erases that difference.

disruption_description:
  pl: |
    Zmiana jest widoczna dla osoby pracującej na maszynie i to jest jedyny jej
    koszt.

    Po restarcie wywołanym aktualizacją użytkownik zastanie zwykły ekran
    logowania, a nie swoją zablokowaną sesję. Otwarte przed restartem okna
    i dokumenty nie wrócą — wrócą tylko te, które program potrafi odtworzyć sam
    przy uruchomieniu. Zgłoszenie brzmi wtedy „zniknęła mi praca po
    aktualizacji", choć znika nie praca, lecz jej odtwarzanie.

    Sprawdzenia wymaga to, czy na maszynie działa coś, co ma ruszyć samo po
    restarcie w sesji użytkownika, bez nikogo przy klawiaturze. Zadania
    uruchamiane przy logowaniu, programy działające w sesji zamiast w usłudze
    i stanowiska bez obsługi, do których nikt nie podchodzi, to trzy przypadki,
    w których punkt trzeba świadomie rozważyć.

    Na stanowisku, przy którym siedzi człowiek, zmiana kosztuje jedno wpisanie
    hasła rzadziej niż raz w miesiącu.
  en: |
    The change is visible to the person working on the machine and that is its
    only cost.

    After an update-driven restart the user meets an ordinary sign-in screen
    rather than their locked session. Windows and documents open before the
    restart do not come back - only those the program can restore by itself on
    startup will. The report then reads "my work disappeared after the update",
    though what disappears is not the work but its restoration.

    What needs checking is whether anything on the machine is meant to start by
    itself after a restart inside a user session, with nobody at the keyboard.
    Tasks run at sign-in, programs running in a session instead of a service, and
    unattended stations nobody walks up to are the three cases where the item has
    to be weighed deliberately.

    At a station with a person sitting at it, the change costs one typing of a
    password less often than once a month.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Po restarcie wywołanym aktualizacją sesja użytkownika nie zostanie odtworzona
      - Otwarte przed restartem okna i dokumenty wrócą tylko tam, gdzie program odtwarza je sam
      - Zadania i programy działające w sesji użytkownika nie ruszą, dopóki ktoś się nie zaloguje
    en:
      - After an update-driven restart the user's session is not restored
      - Windows and documents open before the restart return only where the program restores them itself
      - Tasks and programs running inside a user session do not start until somebody signs in
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa w sesji użytkownika coś, co ma ruszyć samo po restarcie
      - Stanowisko pracuje bez obsługi i nikt nie może się do niego zalogować po aktualizacji
    en:
      - Something on the machine runs inside a user session and is meant to start by itself after a restart
      - The station runs unattended and nobody can sign in to it after an update
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'DisableAutomaticRestartSignOn'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'DisableAutomaticRestartSignOn'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableAutomaticRestartSignOn' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/winlogon-automatic-restart-sign-on-arso

notes:
  pl: |
    Kategoria wysoka może zaskoczyć przy punkcie, który z pozoru dotyczy wygody
    po restarcie. Kryterium jest jednak to, co zyskuje napastnik, gdy punkt
    pozostaje niespełniony — a zyskuje maszynę z odtworzoną sesją i odblokowanymi
    poświadczeniami, stojącą bez nadzoru. Dla kogoś, kto ma do niej fizyczny
    dostęp, jest to skrócenie drogi o cały etap.

    Punkt ma znaczenie przede wszystkim na maszynach przenośnych i wszędzie tam,
    gdzie komputer bywa zostawiony sam. Na stanowisku w zamkniętym pomieszczeniu
    zysk jest mniejszy, ale koszt też, więc wdrożenie pozostaje opłacalne.
  en: |
    The high category may surprise on an item that apparently concerns convenience
    after a restart. The criterion, though, is what an attacker gains while the
    item goes unmet - and what they gain is a machine with a restored session and
    unlocked credentials, standing unattended. For somebody with physical access
    to it, that shortens the road by a whole stage.

    The item matters above all on portable machines and anywhere a computer is
    sometimes left alone. At a station in a locked room the gain is smaller, but so
    is the cost, so applying it remains worthwhile.
