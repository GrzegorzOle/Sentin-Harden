id: win2016-bitlocker-fixed-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Szyfrowanie całego dysku stałego z danymi wymuszone
    en: Full encryption of the fixed data drive enforced
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymusza szyfrowanie całej powierzchni dysku stałego z danymi,
    a nie wyłącznie obszaru obecnie zajętego.

    Szyfrowanie samego obszaru zajętego powstało dla szybkości. Dysk nowy,
    na którym nic jeszcze nie leży, szyfruje się wtedy w kilka chwil zamiast
    w kilka godzin, a wszystko, co zostanie zapisane później, i tak trafia
    na obszar szyfrowany.

    Rozumowanie to jest poprawne wyłącznie dla dysku, na którym nigdy
    niczego nie było. Dysk używany wcześniej zawiera na obszarze wolnym
    ślady wszystkiego, co z niego skasowano — bo kasowanie pliku zwalnia
    miejsce, a nie wymazuje treści.

    Skutek jest taki, że dysk zaszyfrowany w ten sposób nosi na sobie
    czytelne pozostałości. Wystarczy wyjąć go z maszyny i odczytać obszar
    wolny; nie trzeba łamać szyfrowania, bo ta część dysku nie jest
    zaszyfrowana.

    Dotyczy to zwłaszcza sprzętu używanego ponownie, dysków wyjętych z innej
    maszyny i woluminów odtworzonych z kopii.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czytelny
    dostęp do wszystkiego, co kiedykolwiek skasowano z tego dysku, mimo że
    dysk uchodzi za zaszyfrowany.
  en: |
    The setting enforces the encryption of a fixed data drive's whole surface and not solely of
    the area now taken up.

    Encrypting the taken-up area alone came about for speed. A new drive with nothing on it yet
    is then encrypted in a few moments instead of a few hours, and everything written later lands
    on the encrypted area anyway.

    That reasoning is sound solely for a drive on which there was never anything. A drive used
    before holds in its free area traces of everything deleted from it - deleting a file freeing
    the room rather than wiping the contents.

    The upshot is that a drive encrypted this way carries readable remains. It is enough to take
    it out of the machine and read the free area; the encryption need not be broken, that part of
    the drive not being encrypted.

    That touches above all hardware used again, drives taken out of another machine and volumes
    restored from a copy.

    What an attacker gains while the item goes unmet: readable access to everything ever deleted
    from this drive, for all that the drive passes as encrypted.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy czasu, nie zgodności.

    Zmiana nie dotyka dysków już zaszyfrowanych. Wolumin zaszyfrowany
    wcześniej w trybie obszaru zajętego pozostaje w tym trybie i nie
    przeszyfruje się sam. Jest to najważniejsza rzecz do powiedzenia przy
    tym punkcie, bo zgodny wpis w rejestrze łatwo wziąć za dowód, że dyski
    na tej maszynie są w porządku.

    Skutek dotyczy szyfrowania kolejnych woluminów. Przejście przez całą
    powierzchnię dysku o pojemności liczonej w terabajtach trwa godziny
    i obciąża podsystem dyskowy przez cały ten czas. Na maszynie
    obsługującej ruch w ciągu dnia warto to zaplanować na okno.

    Zaszyfrowanie na nowo woluminu istniejącego wymaga odszyfrowania go
    i zaszyfrowania ponownie — a więc dwukrotnego przejścia przez całą
    powierzchnię, w czasie którego dane są nieszyfrowane.

    Czego to nie psuje: dostępu do danych, pracy usług, sieci, aplikacji.
    Tryb szyfrowania nie zmienia sposobu odczytu ani zapisu.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns time rather than compatibility.

    The change does not touch drives already encrypted. A volume encrypted earlier in the
    taken-up-area mode stays in that mode and will not re-encrypt itself. It is the weightiest
    thing to be said at this item, a compliant entry in the registry being easily taken for proof
    that the drives on this machine are in order.

    The consequence concerns the encryption of further volumes. Going through the whole surface of
    a drive whose capacity is counted in terabytes takes hours and loads the disk subsystem all
    that while. On a machine serving traffic during the day it is worth planning into a window.

    Encrypting an existing volume anew calls for it to be decrypted and encrypted again - which is
    to say two passes through the whole surface, during which the data are unencrypted.

    What this does not break: access to data, the working of services, the network, or
    applications. The mode of encryption changes neither reading nor writing.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Woluminy zaszyfrowane wcześniej w trybie obszaru zajętego pozostają w tym trybie i nie przeszyfrują się same
      - Szyfrowanie kolejnego woluminu trwa godziny i obciąża podsystem dyskowy przez cały ten czas
      - Zaszyfrowanie na nowo woluminu istniejącego wymaga dwukrotnego przejścia przez powierzchnię, a dane są w tym czasie nieszyfrowane
      - Dostęp do danych, praca usług, sieć i aplikacje pozostają bez zmian
    en:
      - Volumes encrypted earlier in the taken-up-area mode stay in that mode and will not re-encrypt themselves
      - Encrypting a further volume takes hours and loads the disk subsystem all that while
      - Encrypting an existing volume anew calls for two passes through the surface, and the data are unencrypted meanwhile
      - Access to data, the working of services, the network and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie planowane jest szyfrowanie dużego woluminu, a okna na wielogodzinne obciążenie podsystemu dyskowego nie ma
      - Dyski stałe na tej maszynie są nowe i nigdy nie zawierały danych, a czas szyfrowania jest wąskim gardłem wdrożenia
    en:
      - The encryption of a large volume is planned on the machine and there is no window for a load on the disk subsystem lasting hours
      - The fixed drives on this machine are new and never held data, and the time of encryption is the rollout's narrow place
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FULL'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'FDVEncryptionType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One enforces full encryption, two leaves it at the used space alone, zero
    # hands the choice to whoever encrypts the drive.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt otwiera blok o dyskach stałych z danymi. Blok poprzedni dotyczył
    dysku systemowego, czyli tego, na którym stoi system; ten dotyczy
    woluminów, na których leżą dane — bazy, udziały, kopie.

    Rozróżnienie między wpisem a stanem woluminów jest tu istotniejsze niż
    gdzie indziej i warto je pokazać. Zgodny wpis znaczy wyłącznie, że
    kolejne szyfrowania pójdą całą powierzchnią. Nie mówi nic o woluminach
    już zaszyfrowanych, a to one zwykle są przedmiotem pytania.

    Warto też zauważyć, że nazwa ustawienia mówi o typie szyfrowania, a nie
    o tym, czego naprawdę dotyczy. Przedmiotem decyzji nie jest sposób
    szyfrowania, tylko to, czy obszar wolny — z całą historią skasowanych
    plików — zostanie objęty. Opis powinien to nazywać wprost, bo z nazwy
    nie wynika, że w grę wchodzą dane, które użytkownik uważa za usunięte.
  en: |
    The item opens the block about fixed data drives. The block before it concerned the system
    drive, the one the system stands on; this one concerns the volumes the data lie on - bases,
    shares, copies.

    The distinction between the entry and the state of the volumes matters more here than
    elsewhere and is worth showing. A compliant entry means solely that further encryptions will
    go over the whole surface. It says nothing about volumes already encrypted, and it is they
    that are as a rule the subject of the question.

    Worth noticing too that the setting's name speaks of the type of encryption and not of what it
    really concerns. The subject of the decision is not the manner of encrypting but whether the
    free area - with the whole history of deleted files - will be taken in. The description should
    name that outright, the name not betraying that data the user holds to be removed are at
    stake.
