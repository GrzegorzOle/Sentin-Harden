id: win2016-print-driver-download-http-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Pobieranie sterowników drukarek z zasobu internetowego zablokowane
    en: The fetching of printer drivers from an internet resource blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania systemowi pobierać sterowniki drukarek z zasobu
    internetowego przy dodawaniu urządzenia.

    Reguła domyka blok o sterownikach z innej strony niż cztery poprzednie.
    Tamte pilnowały, kto może zainstalować sterownik i skąd on przychodzi
    w obrębie organizacji. Ta odcina źródło leżące poza nią w ogóle.

    Rzecz jest w tym, czym sterownik drukarki jest. Nie jest plikiem
    opisującym urządzenie — jest kodem, który zostaje zainstalowany
    i pracuje z uprawnieniami systemu. Pobranie go z sieci publicznej
    znaczy przyjęcie kodu ze źródła, którego nikt w organizacji nie
    sprawdził i nad którym nikt nie ma kontroli.

    Na serwerze wydruku dochodzi do tego rzecz druga. Sterownik pobrany
    tutaj bywa następnie rozsyłany na maszyny, które łączą się z kolejką.
    Jedno pobranie staje się wtedy instalacją na wielu maszynach naraz.

    Kategoria średnia, bo droga wymaga, żeby ktoś dodawał drukarkę, i nie
    daje się uruchomić z zewnątrz. Nie jest to jednak droga wąska, gdy
    maszyna jest serwerem wydruku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia kodu instalowanego z uprawnieniami systemu, gdy zawiedzie
    rozwiązywanie nazw albo połączenie do sieci publicznej.
  en: |
    The setting forbids the system to fetch printer drivers from an internet
    resource when a device is added.

    The rule shuts the block about drivers from a different side than the four
    before it. Those saw to who may install a driver and where it comes from within
    the organisation. This one cuts off a source lying outside it altogether.

    The matter is what a printer driver is. It is no file describing a device - it
    is code that gets installed and works with the system's rights. Fetching it from
    a public network means taking in code from a source nobody in the organisation
    has checked and over which nobody has control.

    On a print server a second thing follows. A driver fetched here is at times sent
    on to the machines connecting to the queue. One fetching then becomes an
    installing on many machines at once.

    A medium category, the road calling for somebody to be adding a printer and not
    being startable from outside. It is not a narrow road all the same where the
    machine is a print server.

    What an attacker gains while the item goes unmet: the chance to substitute code
    installed with the system's rights, where name resolution or the connection to
    the public network fails them.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy sterowniki trafiają
    tu z sieci publicznej.

    Na serwerze zwykle nie trafiają, bo sterowniki wgrywa administrator
    albo przychodzą one z serwera wydruku organizacji. Wdrożenie nie zmienia
    wtedy nic.

    Przypadek, w którym zmienia, jest konkretny: drukarka podłączona kablem
    do maszyny, dla której system sam odszukuje sterownik w sieci. Po
    wdrożeniu odszukanie to się nie uda i urządzenie zostanie bez
    sterownika albo dostanie sterownik ogólny o ograniczonych możliwościach.

    Objaw brzmi „drukarka dodała się, ale nie drukuje" albo „drukuje bez
    kolorów" i nie wskazuje wprost na przyczynę. Jest to jedyny trudny
    skutek tej reguły.

    Odpowiedzią jest wgranie sterownika wcześniej, ze źródła sprawdzonego
    w organizacji.

    Czego to nie psuje: drukowania na drukarkach już zainstalowanych,
    kolejek udostępnianych, pobierania sterowników z serwera wydruku
    organizacji, aktualizacji systemowych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether drivers reach
    this machine from the public network.

    On a server as a rule they do not, drivers being loaded by an administrator or
    coming from the organisation's print server. The rollout then changes nothing.

    The case where it does change something is a particular one: a printer connected
    by cable to the machine, for which the system looks up a driver on the network
    itself. After the rollout that lookup will not succeed and the device will be
    left without a driver, or will get a general one of limited abilities.

    The symptom reads "the printer added itself but does not print" or "it prints
    without colour" and does not point straight at the cause. It is this rule's one
    hard consequence.

    The answer is to load the driver beforehand, from a source checked within the
    organisation.

    What this does not break: printing on printers already installed, shared queues,
    the fetching of drivers from the organisation's print server, or system updates.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Drukarka podłączona kablem, dla której system sam odszukiwał sterownik w sieci, zostanie bez sterownika albo dostanie sterownik ogólny
      - Objaw brzmi jak wada urządzenia - dodało się, ale nie drukuje albo drukuje bez kolorów - i nie wskazuje wprost na przyczynę
      - Pobieranie sterowników z serwera wydruku organizacji pozostaje bez zmian
      - Drukowanie na drukarkach już zainstalowanych i aktualizacje systemowe pozostają bez zmian
    en:
      - A printer connected by cable, for which the system looked a driver up on the network itself, will be left without one or will get a general driver
      - The symptom reads like a fault in the device - it added itself but does not print, or prints without colour - and does not point straight at the cause
      - The fetching of drivers from the organisation's print server stays unchanged
      - Printing on printers already installed and system updates stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do maszyny podłącza się urządzenia, dla których sterownik odszukuje się w sieci publicznej, i nie ma innego źródła sterowników
      - Maszyna obsługuje sprzęt zmienny i wgrywanie sterowników z wyprzedzeniem nie jest tu wykonalne
    en:
      - Devices are connected to the machine for which a driver is looked up on the public network and there is no other source of drivers
      - The machine serves changing hardware and loading drivers beforehand is not feasible here
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'DisableWebPnPDownload'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'DisableWebPnPDownload'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWebPnPDownload' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-management-group-policy

notes:
  pl: |
    Punkt otwiera drugą część bloku o wydruku. Część pierwsza dotyczyła
    tego, kto instaluje sterowniki; ta dotyczy dróg, którymi podsystem druku
    rozmawia z siecią.

    Warto zestawić go z regułą o blokadzie wydruku protokołem stron
    sieciowych, bo obie leżą w tym samym miejscu zasad i obie dotyczą tego
    samego protokołu. Tamta pilnuje ruchu wychodzącego z dokumentami,
    ta ruchu wchodzącego z kodem. Kierunek jest odwrotny i skutek odwrotny.

    Kategoria średnia, choć przedmiotem jest sterownik, bierze się z tego,
    jak wąska jest droga. Ktoś musi dodawać urządzenie, a napastnik musi
    w tym momencie kontrolować rozwiązywanie nazw albo połączenie. Na
    serwerze wydruku waga rośnie, bo pobranie jednokrotne rozchodzi się
    dalej.
  en: |
    The item opens the second part of the block about printing. The first part
    concerned who installs drivers; this one concerns the roads by which the
    printing subsystem talks to the network.

    Worth setting beside the rule blocking printing over the web protocol, both
    lying in the same place in the policies and both concerning the same protocol.
    That one sees to outward traffic carrying documents, this one to inward traffic
    carrying code. The direction is the reverse and so is the consequence.

    The medium category, a driver being the subject, comes from how narrow the road
    is. Somebody has to be adding a device, and an attacker has to be holding name
    resolution or the connection at that moment. On a print server the weight grows,
    one fetching spreading further.
