id: win2025-defender-asr-adobe-reader-child-processes

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania programów przez czytnik dokumentów PDF
    en: PDF reader blocked from launching programs
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania czytnikowi dokumentów PDF uruchamiania innych
    programów. Format ten ma wbudowane mechanizmy pozwalające
    dokumentowi zrobić coś przy otwarciu, i to właśnie one są tu
    zamykane.

    Obniżam kategorię do niskiej i jest to najdalej idące obniżenie
    w tej części grupy. Powód: czytnik dokumentów PDF na serwerze jest
    rzadkością większą niż pakiet biurowy. Serwery nie czytają
    dokumentów.

    Jest jednak przypadek, przez który nie schodzę niżej ani nie uznaję
    punktu za pozbawiony treści, i warto go nazwać, bo jest
    codziennością. Administrator na konsoli serwera otwiera dokument —
    instrukcję producenta sprzętu, opis procedury, wynik zgłoszenia
    serwisowego. Otwiera go w kontekście konta, którym właśnie coś
    naprawia, czyli konta o najwyższych uprawnieniach na tej maszynie.

    Jest to sytuacja rzadka, ale spośród wszystkich sytuacji, w których
    na serwerze otwiera się dokument, najbardziej niefortunna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z czytnikiem dokumentów PDF — możliwość uruchomienia
    programu w chwili, gdy ktoś otwiera dokument, zwykle z wysokimi
    uprawnieniami.
  en: |
    The rule forbids a reader of PDF documents to run other programs. That shape of file has
    workings built into it that let a document do something at its opening, and it is just those
    that are here shut.

    I lower the category to low and it is the furthest lowering in this part of the group. The
    ground - a reader of PDF documents on a server is a rarer thing than an office bundle. Servers
    do not read documents.

    There is, though, a case for which I go no lower and hold the item not void of substance, and
    it is worth naming, being an everyday thing. An administrator at a server's console opens a
    document - a maker's instruction for the gear, a setting forth of a procedure, the outcome of a
    call to service. They open it in the stead of the account they are just now mending something
    with, that is of the account of the highest rights on that machine.

    It is a rare case, but of all the cases wherein a document is opened on a server the most
    ill-starred.

    What an attacker gains while the item goes unmet: on a machine with a reader of PDF documents -
    the means of running a program at the moment somebody opens a document, mostly with high
    rights.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i chcę być precyzyjny co do tego,
    co to znaczy, bo „brak znanego wpływu" nie jest tym samym co
    „bezpieczne".

    Na maszynie bez czytnika dokumentów PDF zmiana nie robi nic — nie ma
    czego blokować.

    Na maszynie z czytnikiem zmiana blokuje wyłącznie uruchamianie
    programów z poziomu dokumentu. Czytanie, drukowanie, wypełnianie
    formularzy, podpisywanie i eksport działają bez zmiany. Nie znam
    zastosowania serwerowego, w którym dokument musiałby uruchomić
    program, żeby rzecz zadziałała prawidłowo.

    Przypadkiem, który wolno rozważyć, jest zestaw dokumentacji
    producenta sprzętu, w którym dokument otwiera narzędzie
    diagnostyczne przyciskiem. Spotyka się to w starszych zestawach
    serwisowych. Skutkiem jest przycisk, który nie działa — nie awaria,
    a niedogodność podczas serwisu, i dlatego nie podnoszę z tego powodu
    klasy.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I leave the class "no disruption" and mean to be exact about what that means, "no known effect"
    not being the same as "safe".

    On a machine with no reader of PDF documents the change does nothing - there is nothing to
    block.

    On a machine with a reader the change blocks the running of programs out of a document alone.
    The reading, the printing, the filling of forms, the signing and the sending out all work
    unaltered. I know of no use on a server wherein a document would have to run a program for the
    thing to work rightly.

    A case that may be weighed is a set of a gear maker's documentation wherein a document opens a
    tool of diagnosis by a button. It is met with in older sets for service. The outcome is a
    button that does not work - no fault, but an unhandiness during service, and therefore I raise
    not the class on its account.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Przycisk otwierający narzędzie diagnostyczne ze starszej dokumentacji producenta przestanie działać
      - Czytanie, drukowanie, wypełnianie formularzy i podpisywanie działają bez zmiany
      - Na maszynie bez czytnika dokumentów PDF zmiana nie robi zupełnie nic
      - Brak znanego zastosowania serwerowego wymagającego uruchomienia programu z dokumentu
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - A button opening a tool of diagnosis out of an older maker's documentation will stop working
      - The reading, printing, filling of forms and signing all work unaltered
      - On a machine with no reader of PDF documents the change does nothing at all
      - No known use on a server takes the running of a program out of a document
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwis sprzętu opiera się na dokumentacji otwierającej narzędzia diagnostyczne z dokumentu
    en:
      - The service of the gear rests upon documentation that opens tools of diagnosis out of a document
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Najdalej idące obniżenie kategorii w tej części grupy: czytnik
    dokumentów PDF na serwerze jest rzadkością większą niż pakiet
    biurowy.

    Przypadek, przez który nie schodzę niżej: administrator otwiera na
    konsoli serwera instrukcję producenta sprzętu w kontekście konta,
    którym właśnie coś naprawia. Rzadkie, ale najbardziej niefortunne
    ze wszystkich otwarć dokumentu na serwerze.

    Klasa „bez uciążliwości" oznacza tu „oceniono i nie znaleziono
    wpływu", a nie „nie sprawdzano". Czytanie, drukowanie, formularze
    i podpisywanie działają bez zmiany.
  en: |
    The furthest lowering of the category in this part of the group - a reader of PDF documents on
    a server is a rarer thing than an office bundle.

    The case for which I go no lower - an administrator opens at a server's console a gear maker's
    instruction in the stead of the account they are just now mending something with. Rare, but of
    all the openings of a document on a server the most ill-starred.

    The class "no disruption" means here "reckoned and no effect found" and not "not looked into".
    The reading, printing, forms and signing all work unaltered.
