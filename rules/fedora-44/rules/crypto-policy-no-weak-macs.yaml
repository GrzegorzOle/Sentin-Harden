id: fedora44-crypto-policy-no-weak-macs

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.6.4
  section: Initial Setup > Configure system wide crypto policy
  title:
    pl: Systemowa polityka kryptograficzna nie dopuszcza kodów MAC krótszych niż 128 bitów
    en: Ensure system wide crypto policy disables macs less than 128 bits
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Kod uwierzytelniający wiadomość (MAC) chroni każdy pakiet szyfrowanego
    połączenia przed podmianą. Przy kodzie o długości 64 bitów, np. UMAC-64
    w SSH, atakujący, który przechwytuje i modyfikuje dużo pakietów, ma
    realną szansę trafić poprawny kod i wstrzyknąć zmienione dane.

    Punkt wymaga, żeby żadna lista MAC w zastosowanej polityce, także
    we wpisach z zakresem dla poszczególnych programów, nie zawierała
    algorytmów 64-bitowych. Żadna polityka dostarczana z Fedorą 44 ich nie
    dopuszcza; mogą się pojawić tylko przez własny moduł polityki.
  en: |
    A message authentication code (MAC) protects every packet of an encrypted
    connection against tampering. With a 64-bit code, such as UMAC-64 in SSH,
    an attacker who intercepts and modifies many packets has a real chance of
    hitting a valid code and injecting changed data.

    The item requires that no MAC list in the applied policy, including the
    scoped entries for individual programs, contains 64-bit algorithms. No
    policy shipped with Fedora 44 allows them; they can only appear through a
    custom policy module.

disruption_description:
  pl: |
    Nikt tego nie zauważy, chyba że stacja łączy się przez SSH z bardzo starym
    urządzeniem, które zna tylko 64-bitowe kody MAC. Naprawa dodaje własną
    podpolitykę NO-WEAKMAC; programy przejmują ją po restarcie systemu.
  en: |
    Nobody will notice unless the workstation connects over SSH to a very old
    device that knows only 64-bit MACs. The remediation adds its own
    NO-WEAKMAC sub-policy; programs pick it up after a system restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - remote-management
  what_breaks:
    pl:
      - SSH nie łączy się z urządzeniami, które obsługują wyłącznie kod MAC umac-64
    en:
      - SSH does not connect to devices that support only the umac-64 MAC
  interruption: system-restart
  user_visible: false
  reversibility: after-restart

audit:
  shell: bash
  test_command: |
    f=/etc/crypto-policies/state/CURRENT.pol
    if [ ! -r "$f" ]; then echo CHECK_ERROR; exit 0; fi
    awk '
      { l = $0; sub(/#.*/, "", l) }
      l ~ /^[ \t]*mac(@[^ \t=]+)?[ \t]*=/ {
        v = l; sub(/^[^=]*=/, "", v); k = split(v, t, /[ \t]+/)
        for (i = 1; i <= k; i++) if (t[i] ~ /-64$/ && !(t[i] in seen)) { seen[t[i]] = 1; r = r "," t[i] } }
      END { if (r == "") print "NO_WEAK_MAC"; else print "WEAK_MAC:" substr(r, 2) }' "$f"
  expected: '^NO_WEAK_MAC$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      p=$(update-crypto-policies --show)
      [ -n "$p" ] || { echo "Cannot read the system crypto policy" >&2; exit 1; }
      {
        echo "policy=$p"
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      cur=$(update-crypto-policies --show)
      [ -n "$cur" ] || { echo "Cannot read the system crypto policy" >&2; exit 1; }
      mod=0
      t=$(mktemp "$f.XXXXXX")
      printf '%s\n' '# Sentin-Harden' 'mac = -*-64' > "$t"
      if cmp -s "$t" "$f"; then rm -f "$t"; else mv "$t" "$f"; mod=1; fi
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      new="${cur%%:*}"
      subs=""
      case "$cur" in *:*) subs=$(printf '%s' "${cur#*:}" | tr ':' ' ') ;; esac
      for s in $subs; do
        case " NO-WEAKMAC " in *" $s "*) ;; *) new="$new:$s" ;; esac
      done
      new="$new:NO-WEAKMAC"
      if [ "$new" = "$cur" ] && [ "$mod" = 0 ]; then echo "The system crypto policy is already $cur"; exit 0; fi
      update-crypto-policies --set "$new" >/dev/null
      echo "Set the system crypto policy to $new; restart the system so that all programs use it"
    )

  rollback_command: |
    (
      set -e
      f=/etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      p=$(sed -n 's/^policy=//p' "$b" | head -n 1)
      [ -n "$p" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ "$existed" = 1 ]; then sed '1,/^---$/d' "$b" > "$f"; fi
      update-crypto-policies --set "$p" >/dev/null
      if [ "$existed" = 0 ]; then rm -f "$f"; fi
      echo "Restored the system crypto policy $p; restart the system so that all programs use it"
    )

privileges: root
runnable: true

sources:
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/using-the-system-wide-cryptographic-policies_security-hardening
  - https://gitlab.com/redhat-crypto/fedora-crypto-policies

notes:
  pl: |
    Sprawdzenie przegląda wszystkie wpisy mac w pliku
    /etc/crypto-policies/state/CURRENT.pol, również z zakresem, np. mac@ssh,
    i podaje w wyniku WEAK_MAC znalezione algorytmy.

    Naprawa tworzy moduł /etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod
    z regułą mac = -*-64 i dodaje go na końcu polityki, np. DEFAULT zmienia na
    DEFAULT:NO-WEAKMAC. Wycofanie przywraca politykę i poprzedni stan pliku
    modułu.

    Naprawa zmienia politykę poleceniem update-crypto-policies --set, które
    generuje na nowo pliki w /etc/crypto-policies/back-ends. Programy czytają
    je przy starcie, więc działające usługi i otwarte programy używają starych
    ustawień do czasu ich ponownego uruchomienia; dlatego po naprawie i po
    wycofaniu trzeba zrestartować system. Kopia zapisuje wynik
    update-crypto-policies --show, a wycofanie ustawia go z powrotem.
  en: |
    The check goes through all mac entries in the
    /etc/crypto-policies/state/CURRENT.pol file, scoped ones too, such as
    mac@ssh, and lists the algorithms found in the WEAK_MAC result.

    The remediation creates the
    /etc/crypto-policies/policies/modules/NO-WEAKMAC.pmod module with the rule
    mac = -*-64 and adds it at the end of the policy, for example it changes
    DEFAULT to DEFAULT:NO-WEAKMAC. Rollback restores the policy and the
    previous state of the module file.

    The remediation changes the policy with the update-crypto-policies --set
    command, which regenerates the files in /etc/crypto-policies/back-ends.
    Programs read them at start, so running services and open programs use the
    old settings until they are started again; that is why the system has to be
    restarted after the remediation and after rollback. The backup records the
    output of update-crypto-policies --show, and rollback sets it back.
