id: ubuntu2404-bootloader-config-access

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.4.2
  section: Initial Setup > Configure Bootloader
  title:
    pl: Dostęp do konfiguracji programu rozruchowego jest ograniczony
    en: Ensure access to bootloader config is configured
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Plik /boot/grub/grub.cfg opisuje wszystkie wpisy rozruchu wraz
    z parametrami jądra, a po ustawieniu hasła GRUB także jego skrót.
    Użytkownik, który może go czytać, może próbować złamać skrót poza
    systemem; użytkownik, który może go zmieniać, decyduje, co uruchomi się
    przy następnym starcie.

    Punkt wymaga, żeby plik należał do roota i grupy root i nie był dostępny
    dla nikogo innego (tryb 600 lub bardziej restrykcyjny). update-grub
    zachowuje tryb istniejącego pliku, a nowy tworzy z trybem 600; starsze
    instalacje mogą mieć plik czytelny dla wszystkich.
  en: |
    The /boot/grub/grub.cfg file describes every boot entry with its kernel
    parameters and, once a GRUB password is set, its hash too. A user who can
    read it can try to crack the hash offline; a user who can change it decides
    what runs at the next start.

    The item requires the file to be owned by root and group root and not
    accessible to anyone else (mode 600 or stricter). update-grub keeps the
    mode of an existing file and creates a new one with mode 600; older
    installations may have a file readable by everyone.

disruption_description:
  pl: |
    Nikt tego nie zauważy: plik czytają i zmieniają tylko GRUB przy starcie
    oraz update-grub i grub-mkconfig uruchamiane jako root.
  en: |
    Nobody will notice: the file is only read and changed by GRUB at start and
    by update-grub and grub-mkconfig run as root.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    plist() { [ ! -e /boot/grub/grub.cfg ] || readlink -f -- /boot/grub/grub.cfg; }
    pok() { [ "$2" = root ] && [ "$3" = root ] && [ $(( 0$1 & 07177 )) -eq 0 ]; }
    gok() { set -- '' '' "$1"; [ "$3" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    plist() { [ ! -e /boot/grub/grub.cfg ] || readlink -f -- /boot/grub/grub.cfg; }
    pok() { [ "$2" = root ] && [ "$3" = root ] && [ $(( 0$1 & 07177 )) -eq 0 ]; }
    gok() { set -- '' '' "$1"; [ "$3" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      {
        echo format=perms-1
        printf '%s\n' "$l" | while IFS= read -r f; do
          [ -n "$f" ] && [ -e "$f" ] || continue
          printf '%s %s\n' "$(stat -c '%a %u %g' -- "$f")" "$f"
        done
      } > "$b.tmp"
      mv "$b.tmp" "$b"
      echo "Saved the owner and mode of $(( $(wc -l < "$b") - 1 )) paths"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    plist() { [ ! -e /boot/grub/grub.cfg ] || readlink -f -- /boot/grub/grub.cfg; }
    pok() { [ "$2" = root ] && [ "$3" = root ] && [ $(( 0$1 & 07177 )) -eq 0 ]; }
    gok() { set -- '' '' "$1"; [ "$3" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      n=0
      while IFS= read -r f; do
        [ -n "$f" ] && [ -e "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f")"
        ! pok "$m" "$o" "$g" || continue
        [ "$o" = root ] || chown root -- "$f"
        gok "$g" || chgrp root -- "$f"
        chmod "$(printf '0%04o' $(( 0$m & 0600 )))" -- "$f"
        n=$((n + 1))
      done <<< "$l"
      echo "Corrected $n paths"
      r=$(evaluate)
      case "$r" in OK:*) ;; *) echo "Paths still not as required ($r)" >&2; exit 1 ;; esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      if tail -n +2 "$b" | grep -qvE '^[0-7]+ [0-9]+ [0-9]+ /'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      n=0
      while read -r m u g f; do
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        read -r cm cu cg <<< "$(stat -c '%a %u %g' -- "$f")"
        k=0
        [ "$cu" = "$u" ] || { chown "$u" -- "$f"; k=1; }
        [ "$cg" = "$g" ] || { chgrp "$g" -- "$f"; k=1; }
        [ "$cm" = "$m" ] || k=1
        [ "$k" = 1 ] || continue
        chmod "$(printf '0%04o' $(( 0$m )))" -- "$f"
        echo "Restored $f"; n=$((n + 1))
      done < <(tail -n +2 "$b")
      [ "$n" -gt 0 ] || echo "Nothing to restore"
    )

privileges: root
runnable: true

sources:
  - https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html
  - https://help.ubuntu.com/community/Grub2/Passwords

notes:
  pl: |
    Naprawa odbiera tylko nadmiarowe bity (tryb i 600) i ustawia właściciela
    oraz grupę root; plik z bardziej restrykcyjnym trybem zostaje bez
    zmian. Gdy /boot/grub/grub.cfg nie istnieje, test zwraca OK:paths=0. Test odczytuje
    tylko atrybuty pliku, więc działa także bez roota.
    Wycofanie przywraca tylko to, czym reguła zarządza (tryb, właściciela
    albo grupę), i tylko dla ścieżek, które nadal istnieją, więc reguły
    trybu, właściciela i grupy tych samych plików można wycofywać osobno.
  en: |
    The remediation only removes the excess bits (mode and 600) and sets
    the owner and group to root; a file with a stricter mode stays
    unchanged. When /boot/grub/grub.cfg does not exist, the test returns OK:paths=0. The
    test only reads the file attributes, so it also works without root.
    Rollback restores only what the rule manages (mode, owner or group),
    and only for the paths that still exist, so the mode, owner and group
    rules for the same files can be rolled back separately.
