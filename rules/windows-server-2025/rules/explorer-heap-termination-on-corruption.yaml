id: win2025-explorer-heap-termination-on-corruption

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Powłoka kończy pracę przy wykryciu uszkodzenia sterty
    en: The shell stops on detecting heap corruption
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt pilnuje, żeby powłoka kończyła pracę natychmiast po wykryciu,
    że jej obszar przydzielonej pamięci został uszkodzony. Bez tego
    proces próbuje działać dalej — a uszkodzenie sterty jest stanem,
    w którym „działać dalej" znaczy wykonywać to, co zostało tam
    podłożone.

    Jest to reguła siostrzana wobec poprzedniej i obie mówią o tym
    samym: o zamianie możliwego przejęcia w zwykłą awarię. Kończąc
    proces, system rezygnuje z próby ratowania go i wybiera stan, w
    którym nic więcej się nie zdarzy. Z punktu widzenia bezpieczeństwa
    awaria jest tu wynikiem pożądanym, a nie niepowodzeniem.

    Obniżam kategorię do średniej symetrycznie do reguły poprzedniej.
    Nowoczesny system i tak kończy proces w takiej sytuacji, a wartością
    punktu jest to, że w zasadzie nie leży wpis, który by mu tego
    zabronił i kazał brnąć dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wpis
    pozwalający procesowi powłoki działać dalej w stanie, w którym
    pamięć jest już pod cudzą kontrolą.
  en: |
    The item sees to it that the shell ends its work at once upon the finding that its reach of
    dealt-out memory has been marred. Without it the process tries to work on - and a marred heap is
    a state wherein "to work on" means to carry out what has been laid there.

    It is a sister rule to the one before and both speak of the same thing - of the turning of a
    possible taking over into an ordinary fault. By ending the process the system gives up the
    trying to save it and chooses the state wherein nothing further will happen. From the side of
    safekeeping a fault is here the outcome wished for and no failing.

    I lower the category to middling in step with the rule before. A new-made system ends the
    process in such a case anyway, and the worth of the item is that no entry lies in the policy
    that would forbid it that and bid it press on.

    What an attacker gains while the item goes unmet - an entry letting the process of the shell
    work on in a state wherein the memory is already under another's hand.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" razem z regułą poprzednią i te
    dwie rzeczy warto rozważać jednym ruchem, bo dotyczą tego samego
    procesu i tego samego wpisu w zasadzie.

    Na maszynie bez wpisu zmiana zapisuje jawne zero w miejsce braku
    i nie zmienia zachowania systemu. Na maszynie z wpisem przywraca
    kończenie procesu przy wykryciu uszkodzenia.

    Skutek w drugim przypadku jest taki: okno powłoki, które dotąd
    zamykało się samo raz na jakiś czas i było otwierane z powrotem,
    teraz zamyka się w tym samym momencie, tyle że z powodu zapisanym
    w dzienniku. Zmienia się nie to, czy proces przestaje działać, tylko
    czy wiadomo dlaczego.

    Na serwerze koszt jest niewielki i chcę powiedzieć, dlaczego
    uważam tak również wtedy, gdy trafienie się zdarzy. Powłoka na
    serwerze nie trzyma pracy nikogo — nie ma w niej niezapisanego
    dokumentu ani otwartej sesji, którą trudno odtworzyć. Jest oknem
    otwartym na czas serwisu i otwiera się je z powrotem jednym
    poleceniem.

    Jeżeli zamknięcia powtarzają się, rzeczą do zrobienia nie jest
    cofnięcie tego punktu, tylko ustalenie, które rozszerzenie powłoki
    uszkadza pamięć — bo robiło to również przedtem, tylko po cichu.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption" together with the rule before, and those two things are worth
    weighing at one stroke, bearing as they do on the same process and the same entry in the policy.

    On a machine with no entry the change writes an outright nought in the place of a want and
    alters not the system's bearing. On a machine with the entry it brings back the ending of the
    process upon a finding of marring.

    The outcome in the second case is this - the window of the shell that hitherto shut of itself
    once in a while and was opened again now shuts at that same moment, save that with a ground
    written in the day-book. What alters is not whether the process stops working but whether it is
    known why.

    On a server the cost is small, and I mean to say why I hold so even where a striking does come
    to pass. The shell on a server holds nobody's work - there is in it no unwritten document nor an
    open sitting hard to raise again. It is a window opened for the time of service and it is opened
    again by one command.

    If the shuttings come again and again, the thing to do is not the undoing of this item but the
    settling of which widening of the shell mars the memory - it having done so before as well, only
    in silence.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Okno powłoki zamyka się przy wykryciu uszkodzenia pamięci, ale z powodem zapisanym w dzienniku
      - Zmienia się nie to, czy proces przestaje działać, tylko czy wiadomo dlaczego
      - Na serwerze powłoka nie trzyma pracy nikogo i otwiera się z powrotem jednym poleceniem
      - Na maszynie bez wpisu zmiana nie zmienia zachowania systemu w żaden sposób
      - Powtarzające się zamknięcia wskazują rozszerzenie powłoki, które uszkadzało pamięć również przedtem
    en:
      - The window of the shell shuts at a finding of marred memory, but with a ground written in the day-book
      - What alters is not whether the process stops working but whether it is known why
      - On a server the shell holds nobody's work and is opened again by one command
      - On a machine with no entry the change alters the system's bearing in no way
      - Shuttings coming again and again point at a widening of the shell that marred the memory before as well
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      $name = 'NoHeapTerminationOnCorruption'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoHeapTerminationOnCorruption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sister setting to NoDataExecutionPrevention in the same key: both are
    # worth weighing and applying at one stroke.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoHeapTerminationOnCorruption' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/memory/heap-functions

notes:
  pl: |
    Reguła siostrzana wobec ochrony przed wykonaniem danych: obie mówią
    o zamianie możliwego przejęcia w zwykłą awarię. Awaria jest tu
    wynikiem pożądanym, a nie niepowodzeniem.

    Kategoria obniżona symetrycznie: nowoczesny system i tak kończy
    proces w takiej sytuacji, a wartością punktu jest to, że w zasadzie
    nie leży wpis, który by mu tego zabronił.

    Rzecz do zapamiętania przy powtarzających się zamknięciach: nie
    cofaj punktu, tylko ustal, które rozszerzenie powłoki uszkadza
    pamięć — bo robiło to również przedtem, tylko po cichu.
  en: |
    A sister rule to the guard against the carrying out of data - both speak of the turning of a
    possible taking over into an ordinary fault. A fault is here the outcome wished for and no
    failing.

    The category is lowered in step - a new-made system ends the process in such a case anyway, and
    the worth of the item is that no entry lies in the policy that would forbid it that.

    The thing to bear in mind at shuttings that come again and again - undo not the item, but settle
    which widening of the shell mars the memory, it having done so before as well, only in silence.
