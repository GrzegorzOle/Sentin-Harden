id: win2025-downloaded-maps-manager-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania pobranymi mapami wyłączona
    en: The service managing downloaded maps disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zarządzającą mapami pobranymi do użytku bez
    połączenia. Usługa ta utrzymuje zapisane mapy i sama pobiera ich
    uaktualnienia.

    Zostawiam kategorię niską i mówię wprost, że jest to punkt porządku,
    a nie obrony przed czymkolwiek nazwanym. Usługa niczego nie
    udostępnia, nie nasłuchuje na połączenia i nie trzyma niczego,
    co byłoby warte zabrania.

    Zostaje jedna rzecz konkretna i ona wystarcza za uzasadnienie:
    usługa ta z własnej inicjatywy sięga do sieci po uaktualnienia
    danych, których na tej maszynie nikt nigdy nie otworzy. Ruch
    wychodzący z serwera powinien dać się wyliczyć i uzasadnić, a to jest
    ruch, którego nie uzasadnia nic.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    ponad to, co daje każdy działający bez potrzeby składnik — kod
    uruchomiony z uprawnieniami systemu, którego nikt nie obserwuje,
    bo nikt o nim nie pamięta.
  en: |
    The item switches off the service that rules the maps drawn down for use without a binding. That
    service keeps the written-down maps and of itself draws their makings anew.

    I leave the category low and say outright that it is an item of order and not of warding against
    anything named. The service deals nothing out, listens for no bindings and keeps nothing worth the
    taking.

    There is left one set thing and it is enough for a standing - that service of its own will reaches
    to the net for makings anew of data that nobody upon that machine will ever open. The traffic
    going out of a server ought to be reckoned up and stood by, and that is traffic nothing stands by.

    What an attacker gains while the item goes unmet - little beyond what every piece working without
    need gives - code running with the leaves of the system that nobody watches, because nobody
    remembers it.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i jest to, obok udostępniania
    maszyny jako urządzenia sieciowego, najczystszy taki przypadek
    w całej paczce.

    Nie umiem wskazać na serwerze żadnego zastosowania map pobranych do
    użytku bez połączenia. Nie ma aplikacji serwerowej, która by je
    czytała, nie ma roli, która by ich wymagała, i nie ma człowieka,
    który by je otwierał. Jest to składnik przeniesiony na serwer razem
    z resztą systemu, nie dlatego, że tam po coś jest.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem i jest dobrym przykładem tego, czemu ta klasa
    służy. Lista niezgodności na świeżo postawionym serwerze zawiera
    kilkaset pozycji; sens ma tylko wtedy, gdy rzeczy takie jak ta
    można zamknąć jednym ruchem i zająć się tymi, przy których trzeba
    myśleć.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease", and it is, beside the dealing out of the machine as a device of
    the net, the cleanest such case in the whole pack.

    I can name upon a server no use at all for maps drawn down for use without a binding. There is no
    application of a server that would read them, no role that would take them, and no person that
    would open them. It is a piece borne onto the server along with the rest of the system, and not
    because it is there for anything.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk, and it is a good showing
    of what that class is good for. The list of things unmet upon a newly set-up server holds some
    hundreds of entries; it has sense only if things such as this may be shut with one stroke and one
    may turn to those whereat thought is needed.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Przestaje działać obsługa map pobranych do użytku bez połączenia
      - Na serwerze nie ma aplikacji, roli ani człowieka, który by z tych map korzystał
      - Znika samoczynne sięganie do sieci po uaktualnienia danych, których nikt nie otworzy
      - Jest to składnik przeniesiony na serwer razem z resztą systemu, nie dlatego, że tam po coś jest
    en:
      - The serving of maps drawn down for use without a binding stops working
      - Upon a server there is no application, no role and no person that would draw upon those maps
      - The reaching to the net of itself for makings anew of data nobody will open goes away
      - It is a piece borne onto the server along with the rest of the system and not because it is there for anything
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja korzystająca z map pobranych do użytku bez połączenia
    en:
      - Upon the machine there stands an application drawing upon maps taken down for use without a binding
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MapsBroker'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MapsBroker'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nothing on a server reads offline maps. What goes away is a component
    # that reaches out to the network on its own for updates to data nobody
    # will ever open.
    Stop-Service -Name 'MapsBroker' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MapsBroker' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'MapsBroker' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    Punkt porządku, a nie obrony przed czymkolwiek nazwanym — i mówię to
    wprost, zamiast dorabiać uzasadnienie. Zostaje jedna rzecz konkretna:
    usługa z własnej inicjatywy sięga do sieci po uaktualnienia danych,
    których na tej maszynie nikt nigdy nie otworzy.

    Obok udostępniania maszyny jako urządzenia sieciowego najczystszy
    przypadek klasy „bez uciążliwości" w całej paczce.

    Dobry przykład tego, czemu ta klasa służy: lista niezgodności na
    świeżo postawionym serwerze zawiera kilkaset pozycji i sens ma tylko
    wtedy, gdy rzeczy takie jak ta można zamknąć jednym ruchem.
  en: |
    An item of order and not of warding against anything named - and I say it outright in the stead of
    making a standing up after the fact. There is left one set thing - the service reaches to the net
    of itself for makings anew of data that nobody upon that machine will ever open.

    Beside the dealing out of the machine as a device of the net, the cleanest case of the class "no
    unease" in the whole pack.

    A good showing of what that class is good for - the list of things unmet upon a newly set-up
    server holds some hundreds of entries, and it has sense only if things such as this may be shut
    with one stroke.
