id: win2025-defender-routine-remediation

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Samoczynne usuwanie wykrytych zagrożeń włączone
    en: Automatic removal of detected threats switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt rozstrzyga, co mechanizm robi po wykryciu: działa sam czy
    tylko zgłasza. Nazwa wpisu opisuje wyłączenie, więc stanem zgodnym
    jest zero — mechanizm działa.

    Na serwerze różnica między tymi dwoma trybami jest większa niż
    gdziekolwiek indziej i to ona wyznacza kategorię. Tryb „tylko
    zgłaszaj" zakłada, że ktoś to zgłoszenie przeczyta. Na stacji
    roboczej ten ktoś siedzi przy maszynie i zobaczy je w ciągu minuty.
    Na serwerze zgłoszenie idzie do dziennika, a dziennik czyta się
    w poniedziałek — o ile ktoś ma to w obowiązkach.

    Serwer pracuje w nocy, w weekendy i w święta, i to są dokładnie te
    godziny, w których napastnik woli działać. Mechanizm, który w tych
    godzinach tylko notuje, jest mechanizmem wyłączonym z opóźnionym
    zapisem do akt.

    Warto powiedzieć też drugą stronę, bo jest prawdziwa. Samoczynne
    działanie oznacza, że plik znika bez decyzji człowieka, i przy
    pomyłce nie ma nikogo, kto by ją w tej chwili zauważył. To jest
    realny koszt i o nim jest część o uciążliwości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: całą noc
    i cały weekend — wykrycie jest odnotowane, ale nic się z niego nie
    wynika do najbliższego dnia roboczego.
  en: |
    The item settles what the working does after a finding - whether it acts of itself or only
    reports. The name of the entry sets forth a switching off, so the meeting state is a nought -
    the working acts.

    On a server the difference between those two modes is greater than anywhere else, and it is that
    which marks out the category. The mode "only report" takes it that somebody will read that
    report. On a workstation that somebody sits at the machine and will see it within the minute. On
    a server the report goes into a day-book, and a day-book is read on Monday - if it be anyone's
    charge at all.

    A server works by night, at weekends and on holy days, and those are just the hours an attacker
    would rather work in. A working that in those hours only notes down is a working switched off
    with a delayed writing to the records.

    It is worth saying the other side too, it being true. The acting of itself means that a file
    vanishes with no person's deciding, and at a mistake there is nobody to mark it at that moment.
    That is a true cost and the part about disruption is about it.

    What an attacker gains while the item goes unmet - the whole night and the whole weekend; the
    finding is noted down, but nothing follows from it until the nearest working day.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, co się stanie przy pomyłce, i jest to ta sama
    rozmowa, którą prowadziłem przy podwyższonym progu blokowania —
    tyle że tutaj dotyczy każdego wykrycia, nie tylko niepewnego.

    Plik uznany za zagrożenie zostaje zabrany do kwarantanny. Na
    serwerze oznacza to, że usługa przestaje się uruchamiać albo zadanie
    przestaje się kończyć, a pliku, którego brakuje, nie ma na dysku
    i nie widać, dokąd poszedł. Nikt nie zobaczy przy tym komunikatu,
    bo nikt przy tej maszynie nie stoi.

    Kandydatami do takiej pomyłki są te same rzeczy co wcześniej:
    niepodpisane programy własne, narzędzia serwisowe, stare pliki
    wykonawcze systemów dziedziczonych. Wyłączenia dla ich katalogów są
    więc warunkiem tej zmiany, a nie jej dopełnieniem.

    Rzeczą, którą trzeba zrobić razem z tą zmianą i o której się
    zapomina, jest dopilnowanie, żeby zdarzenia z dziennika ochrony
    trafiały tam, gdzie ktoś na nie patrzy. Samoczynne działanie nie
    zwalnia z czytania zgłoszeń — zmienia tylko to, czy w chwili
    czytania rzecz jeszcze działa.

    Tryb „tylko zgłaszaj" bywa na pojedynczej maszynie wyborem
    prawidłowym — na przykład tam, gdzie każda przerwa jest droższa niż
    ryzyko. Wtedy właściwym wynikiem jest zapisany wyjątek z podanym
    powodem i datą przeglądu, a nie pozostawienie czerwonego wiersza.

    Zmiana cofa się natychmiast, ale plik z kwarantanny trzeba
    przywrócić osobno.
  en: |
    What needs checking is what happens at a mistake, and it is the same talk I held at the raised
    bound of blocking - save that here it bears on every finding and not on the unsure ones alone.

    A file held for a threat is taken into holding. On a server that means a service stops running
    or a task stops ending, and the file that is wanting is not on the disk and it is not seen
    whither it went. Nobody will see thereat a word given, nobody standing at that machine.

    What stands for such a mistake are the same things as before - unsigned programs of one's own,
    tools for service, old files to be carried out of inherited systems. Leavings-out for their
    folders are therefore a bond of this change and no filling out of it.

    The thing that must be done together with this change and that is forgotten is the seeing to it
    that the happenings out of the guard's day-book come where somebody looks at them. The acting of
    itself frees nobody from the reading of reports - it alters only whether at the hour of the
    reading the thing is still at work.

    The mode "only report" is on a single machine at times the right choosing - for instance where
    every break costs more than the risk. Then the right outcome is a written exception with the
    ground given and a date of looking over, and no leaving of a red line.

    The change is undone at once, but a file in holding must be brought back apart.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - Plik uznany za zagrożenie zostaje zabrany do kwarantanny bez decyzji człowieka
      - Usługa przestaje się uruchamiać, a pliku, którego brakuje, nie widać, dokąd poszedł
      - Kandydatami do pomyłki są niepodpisane programy własne i stare pliki systemów dziedziczonych
      - Cofnięcie ustawienia nie przywraca plików z kwarantanny, to trzeba zrobić osobno
      - Zdarzenia z dziennika ochrony muszą trafiać tam, gdzie ktoś na nie patrzy
    en:
      - A file held for a threat is taken into holding with no person's deciding
      - The service stops running and it is not seen whither the wanting file went
      - What stands for a mistake are unsigned programs of one's own and old files of inherited systems
      - The undoing of the setting brings no files back out of holding, that must be done apart
      - The happenings out of the guard's day-book must come where somebody looks at them
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ustalono wyłączeń dla katalogów z niepodpisanymi programami własnymi i narzędziami serwisowymi
      - Każda przerwa na tej maszynie jest droższa niż ryzyko i tryb tylko zgłaszaj jest wyborem świadomym
    en:
      - No leavings-out were settled for the folders with unsigned programs of one's own and tools for service
      - Every break on that machine costs more than the risk and the mode only report is a witting choosing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name describes a switching off: zero means the protection
      # acts on its own, one means it only reports.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableRoutinelyTakingAction'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableRoutinelyTakingAction'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRoutinelyTakingAction' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-remediation-microsoft-defender-antivirus

notes:
  pl: |
    Tryb „tylko zgłaszaj" zakłada, że ktoś to zgłoszenie przeczyta.
    Na serwerze idzie ono do dziennika, a dziennik czyta się
    w poniedziałek. Serwer pracuje w nocy i w weekendy — dokładnie
    w tych godzinach, w których napastnik woli działać.

    Druga strona jest prawdziwa i o niej jest część o uciążliwości:
    samoczynne działanie oznacza, że plik znika bez decyzji człowieka,
    a przy pomyłce nie ma nikogo, kto by ją w tej chwili zauważył.

    Rzecz zapominana przy tej zmianie: samoczynne działanie nie zwalnia
    z czytania zgłoszeń, zmienia tylko to, czy w chwili czytania rzecz
    jeszcze działa.
  en: |
    The mode "only report" takes it that somebody will read that report. On a server it goes into a
    day-book, and a day-book is read on Monday. A server works by night and at weekends - just in
    the hours an attacker would rather work in.

    The other side is true and the part about disruption is about it - the acting of itself means
    that a file vanishes with no person's deciding, and at a mistake there is nobody to mark it at
    that moment.

    The thing forgotten at this change - the acting of itself frees nobody from the reading of
    reports, it alters only whether at the hour of the reading the thing is still at work.
