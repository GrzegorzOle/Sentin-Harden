id: win2025-shutdown-on-audit-failure-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Serwer nie wyłącza się przy niepowodzeniu zapisu inspekcji
    en: The server does not shut down on a failure to record an audit entry
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, co system robi, gdy nie może zapisać wpisu
    inspekcji — i punkt wymaga, żeby nie robił nic poza utratą wpisu.

    Wariantem alternatywnym jest zatrzymanie systemu. Brzmi to jak
    zabezpieczenie i w pewnych zastosowaniach nim jest, ale na serwerze
    jest przede wszystkim gotowym sposobem na jego wyłączenie. Zapełnienie
    dziennika zabezpieczeń nie wymaga żadnych uprawnień szczególnych —
    wystarczy generować zdarzenia, które i tak są rejestrowane, na
    przykład nieudane logowania.

    Na serwerze konsekwencja jest większa niż na stanowisku roboczym
    i wprost proporcjonalna do tego, ilu ludzi z tej maszyny korzysta.
    Zatrzymanie kontrolera domeny albo serwera plików tą drogą jest
    przerwą w pracy całej organizacji, wywołaną bez sięgnięcia po
    jakiekolwiek uprawnienie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania serwera przez samo zalewanie go nieudanymi logowaniami.
    Jest to jedno z niewielu miejsc, w których ustawienie pomyślane jako
    zabezpieczenie daje gotową drogę ataku.

    Punkt jest odwrotnością większości pozostałych w tej paczce:
    zgodność polega tu na wyłączeniu reakcji, a nie na jej włączeniu.
  en: |
    The setting settles what the system does when it cannot record an audit entry - and the
    item takes that it do nothing beyond losing the entry.

    The alternative variant is halting the system. That sounds like a safeguard and in
    certain uses is one, but on a server it is above all a ready way of switching it off.
    Filling the security log takes no particular rights at all - it is enough to make events
    that are recorded anyway, failed sign-ins for instance.

    On a server the consequence is greater than at a working station and in direct
    proportion to how many people use the machine. Halting a domain controller or a file
    server by this road is a break in a whole organisation's work, brought about without
    reaching for any right whatever.

    What an attacker gains while the item goes unmet: the means of halting the server by the
    mere flooding of it with failed sign-ins. It is one of the few places at which a setting
    meant as a safeguard gives a ready road of attack.

    The item is the reverse of most others in this pack: compliance here lies in switching a
    reaction off rather than on.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać i nikt niczego nie zauważy. Zmienia się
    wyłącznie reakcja na sytuację, która w stanie prawidłowym nie
    występuje.

    Kosztem jest to, że wpisy niemożliwe do zapisania przepadają zamiast
    zatrzymać maszynę. Jest to świadoma wymiana: ciągłość pracy serwera
    za kompletność śladu inspekcji.

    Tam, gdzie ślad musi być kompletny, wymianę tę trzeba zrównoważyć
    gdzie indziej — powiększonym dziennikiem zabezpieczeń i wysyłaniem
    zdarzeń poza maszynę. Oba są osobnymi punktami tej paczki i to one,
    a nie zatrzymywanie serwera, są właściwym rozwiązaniem tego problemu.

    Zmiana nie zmniejsza ilości zbieranych danych inspekcji i nie zmienia
    tego, co jest rejestrowane.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working and nobody notices anything. What changes is only the reaction to
    a situation that in a right state does not arise.

    The cost is that entries impossible to record are lost instead of halting the machine.
    It is a knowing exchange: the server's continuity of work for the completeness of the
    audit trail.

    Where the trail must be complete, that exchange has to be balanced elsewhere - by an
    enlarged security log and by the sending of events off the machine. Both are separate
    items of this pack, and it is they, rather than halting the server, that are the right
    answer to this problem.

    The change does not lessen the amount of audit data gathered and does not change what is
    recorded.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Wpisy inspekcji, których nie da się zapisać przy zapełnionym dzienniku, przepadną
      - Serwer nie zatrzyma się już w takiej sytuacji i będzie pracował dalej
      - Ilość zbieranych danych inspekcji nie zmienia się w żaden sposób
    en:
      - Audit entries that cannot be recorded on a full log will be lost
      - The server will no longer halt in such a case and will go on working
      - The amount of audit data gathered does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer podlega wymaganiu zamkniętego śladu inspekcji, przy którym brak wpisu jest gorszy niż przerwa w pracy
    en:
      - The server is subject to a requirement for a closed audit trail, at which a missing entry is worse than a break in work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The benchmark takes this setting off, so zero is what is expected here -
      # unusually for a security item, the safeguard is the absence of a reaction.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'CrashOnAuditFail'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'CrashOnAuditFail' -ErrorAction SilentlyContinue).'CrashOnAuditFail'
    [pscustomobject]@{
      path        = $path
      name        = 'CrashOnAuditFail'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'CrashOnAuditFail' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/audit-shut-down-system-immediately-if-unable-to-log-security-audits

notes:
  pl: |
    Jest to jeden z nielicznych punktów, w których zgodność polega na
    wyłączeniu ustawienia, a nie na jego włączeniu. Wartość zerowa jest
    tu stanem pożądanym i nie należy jej czytać jako obniżenia poziomu
    zabezpieczeń.

    Ustawienie w stanie włączonym potrafi zatrzymać serwer na skutek
    działania niewymagającego żadnych uprawnień. Dlatego jego wyłączenie
    jest zabezpieczeniem dostępności, a nie rezygnacją z zabezpieczenia.

    Punkt czyta się razem z rozmiarem dziennika zabezpieczeń i z punktem
    o integralności systemu. Ten ostatni zgłasza utratę wpisów, więc
    przepadanie zdarzeń przestaje być ciche — i to jest właściwe
    zrównoważenie tej zmiany.
  en: |
    It is one of the few items at which compliance lies in switching a setting off rather
    than on. The zero value is here the wanted state and is not to be read as a lowering of
    the level of security.

    The setting in its switched-on state can halt a server through a doing that takes no
    rights at all. Hence switching it off is a safeguard of availability rather than a
    giving up of a safeguard.

    The item is read together with the security log's size and with the item on the system's
    integrity. The latter reports the loss of entries, so the losing of events stops being
    quiet - and that is the right balancing of this change.
