id: win2025-remote-shell-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Shell
  title:
    pl: Dostęp do powłoki zdalnej wyłączony
    en: Remote shell access disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka możliwość otwierania powłoki zdalnej na tej
    maszynie, czyli sesji, w której polecenia przychodzą z sieci
    i wykonują się na serwerze.

    Zacznę od rzeczy, którą trzeba powiedzieć przed opisem ryzyka,
    bo bez niej ten punkt czyta się na serwerze fałszywie.

    To nie jest utwardzenie wśród innych. To jest wyłączenie zdalnego
    zarządzania wierszem poleceń, a na większości serwerów właśnie tak
    się nimi zarządza. Sesje zdalne powłoki, wykonywanie poleceń na
    grupie maszyn, narzędzia automatyzacji, wdrożenia, zbieranie stanu
    — wszystko to idzie tą drogą.

    Dlatego prawidłowym wynikiem pracy z tym punktem na serwerze
    zarządzanym zdalnie jest zwykle zapisany wyjątek z uzasadnieniem
    i terminem przeglądu, a nie naprawa. Nie jest to porażka ani
    odpuszczenie — jest to decyzja, którą audyt ma prawo zobaczyć
    i ocenić.

    Teraz ryzyko, bo ono jest realne i punkt nie znalazł się na liście
    przypadkiem. Powłoka zdalna jest kanałem, którym napastnik
    z ważnym poświadczeniem wykonuje na serwerze cokolwiek, bez śladu
    wyglądającego na włamanie, bez konieczności zostawiania pliku na
    dysku i bez uruchamiania sesji graficznej, którą ktokolwiek by
    zauważył. Jest to pierwsze narzędzie sięgane po zdobyciu
    poświadczenia i narzędzie, którym rozchodzi się ruch boczny.

    Punkt ma zatem sens na maszynach, które z założenia nie mają być
    zarządzane tą drogą: na serwerze brzegowym, w strefie
    zdemilitaryzowanej, na maszynie o jednym przeznaczeniu, obsługiwanej
    z konsoli hosta wirtualizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    wykonywania poleceń na serwerze, wygodny do rozejścia się po
    kolejnych maszynach i niezostawiający pliku na dysku.
  en: |
    The setting shuts the means of opening a remote shell upon this machine, that is a session
    wherein orders come out of the network and are carried out upon the server.

    I begin with a thing that must be said before the describing of the risk, without it this item
    reading falsely on a server.

    This is no hardening among others. It is the switching off of remote management by a line of
    orders, and on most servers that is just how they are managed. Remote sessions of the shell,
    the carrying out of orders upon a group of machines, tools of automation, rollings out, the
    gathering of state - all of that goes by this road.

    Therefore the right outcome of work with this item on a remotely managed server is usually a
    written exception with its grounds and a date of review, and not a mending. It is no defeat nor
    a letting go - it is a decision the audit has the right to see and to weigh.

    Now the risk, for it is real and the item did not come onto the list by chance. A remote shell
    is a channel by which an attacker with a good credential carries out upon the server whatever
    they will, with no trace that looks like a breaking in, with no need of leaving a file upon the
    drive, and with no starting of a drawn session anybody would mark. It is the first tool reached
    for after a credential is won, and the tool by which movement sideways spreads.

    The item has sense therefore upon machines not meant to be managed by this road: upon an edge
    server, in a demilitarised zone, upon a machine of one purpose served from the console of the
    host of virtualisation.

    What an attacker gains while the item goes unmet: a channel for carrying out orders upon the
    server, handy for spreading onto further machines and leaving no file upon the drive.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy i na serwerze zarządzanym
    zdalnie jest zmianą, po której przestaje działać zarządzanie. Nie
    ma tu wariantu łagodnego i nie ma sensu go szukać.

    Przestaje działać sesja powłoki otwierana zdalnie, przestaje działać
    wykonanie polecenia na tej maszynie z maszyny zarządzającej,
    przestają działać skrypty obchodzące serwery po kolei i narzędzia
    automatyzacji sięgające tą drogą. Przestają działać także niektóre
    konsole zarządzania i część agentów, które pod spodem korzystają
    z tego samego mechanizmu, nie nazywając tego wprost.

    Objaw jest natychmiastowy i jednoznaczny: próba otwarcia sesji
    kończy się odmową dostępu. Mylące bywa to, że komunikat mówi
    o dostępie, a nie o wyłączonej powłoce, więc pierwsze podejrzenie
    pada na uprawnienia konta.

    Przed zmianą trzeba mieć rozstrzygnięte dwie rzeczy.

    Pierwsza to droga zarządzania, która zostaje: konsola hosta
    wirtualizacji, karta zarządzająca, pulpit zdalny. Jeżeli żadna z nich
    nie jest dostępna, ta zmiana odcina maszynę od obsługi i jest to
    błąd, którego nie da się naprawić zdalnie — bo naprawa wymagałaby
    dokładnie tego kanału, który się właśnie zamknęło.

    Druga to inwentarz tego, co sięga do tej maszyny: monitorowanie,
    kopie zapasowe, zarządzanie konfiguracją, zbieranie dzienników.
    Część z tych narzędzi korzysta z powłoki zdalnej, część nie, a bez
    sprawdzenia nie da się tego przewidzieć.

    Zmiana wchodzi w życie od razu i cofa się natychmiast — pod
    warunkiem, że jest jeszcze czym ją cofnąć.

    Sesje już otwarte nie są przerywane, więc sesja, z której zmiana
    jest wprowadzana, przeżyje ją. Następna już się nie otworzy.
  en: |
    The change surely changes how work is done, and on a remotely managed server it is a change
    after which management stops working. There is no milder turn here and no sense in looking for
    one.

    A shell session opened from afar stops working, the carrying out of an order upon this machine
    from a managing machine stops working, scripts going round the servers one by one and tools of
    automation reaching by this road stop working. Some consoles of management and some agents stop
    working too, using underneath the same mechanism without naming it outright.

    The symptom is at once and plain: the trying to open a session ends in a refusal of access. It
    misleads that the message speaks of access and not of a switched-off shell, so the first
    suspicion falls upon the account's rights.

    Two things must be settled before the change.

    The first is the road of management that is left: the console of the host of virtualisation,
    the management card, remote desktop. If none of them is to be had, this change cuts the machine
    off from being served, and it is a mistake that cannot be mended from afar - the mending taking
    exactly the channel one has just shut.

    The second is a stock of what reaches for this machine: watching, backups, the managing of
    settings, the gathering of logs. Some of those tools use the remote shell and some do not, and
    without checking it cannot be foretold.

    The change comes into force straight away and is undone at once - so long as there is still
    something to undo it by.

    Sessions already open are not broken, so the session the change is made from will outlive it.
    The next one will no longer open.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Sesja powłoki otwierana zdalnie i wykonanie polecenia z maszyny zarządzającej przestaną działać
      - Skrypty obchodzące serwery po kolei przestaną obejmować tę maszynę
      - Agenci i konsole korzystające z tego mechanizmu pod spodem przestaną działać, nie nazywając przyczyny
      - Komunikat mówi o odmowie dostępu, więc pierwsze podejrzenie pada na uprawnienia konta
      - Sesje już otwarte nie są przerywane, następna już się nie otworzy
    en:
      - A shell session opened from afar and the carrying out of an order from a managing machine will stop working
      - Scripts going round the servers one by one will stop taking in this machine
      - Agents and consoles using this mechanism underneath will stop working without naming the cause
      - The message speaks of a refusal of access, so the first suspicion falls upon the account's rights
      - Sessions already open are not broken, the next one will no longer open
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer jest zarządzany zdalnie wierszem poleceń i nie ma innej drogi obsługi
      - Nie ma konsoli hosta wirtualizacji ani karty zarządzającej, więc cofnięcie zmiany byłoby niemożliwe
    en:
      - The server is managed from afar by a line of orders and there is no other road of serving it
      - There is no console of the host of virtualisation nor a management card, so the undoing of the change would be impossible
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
      $name = 'AllowRemoteShellAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
    $name = 'AllowRemoteShellAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The road of management that is left is settled before this change. Sessions
    # already open are not broken; the next one will no longer open.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowRemoteShellAccess' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    To nie jest utwardzenie wśród innych. To jest wyłączenie zdalnego
    zarządzania wierszem poleceń, a na większości serwerów właśnie tak
    się nimi zarządza.

    Dlatego prawidłowym wynikiem pracy z tym punktem na serwerze
    zarządzanym zdalnie jest zwykle zapisany wyjątek z uzasadnieniem
    i terminem przeglądu, a nie naprawa.

    Ryzyko jest jednak realne: powłoka zdalna to pierwsze narzędzie
    sięgane po zdobyciu poświadczenia i to nim rozchodzi się ruch
    boczny. Punkt ma sens tam, gdzie maszyna z założenia nie ma być tą
    drogą zarządzana: serwer brzegowy, strefa zdemilitaryzowana, maszyna
    o jednym przeznaczeniu.

    Cofnięcie zmiany wymaga kanału, który ta zmiana zamyka — dlatego
    droga zapasowa musi być znana wcześniej.
  en: |
    This is no hardening among others. It is the switching off of remote management by a line of
    orders, and on most servers that is just how they are managed.

    Therefore the right outcome of work with this item on a remotely managed server is usually a
    written exception with its grounds and a date of review, and not a mending.

    The risk is real all the same: a remote shell is the first tool reached for after a credential
    is won and the one by which movement sideways spreads. The item has sense where a machine is
    not meant to be managed by this road: an edge server, a demilitarised zone, a machine of one
    purpose.

    The undoing of the change takes the channel this change shuts - hence the spare road must be
    known beforehand.
