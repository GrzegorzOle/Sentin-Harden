id: win2025-smb-client-signing-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie pakietów wymagane po stronie klienta udostępniania plików
    en: Packet signing required on the file-sharing client's side
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby ta maszyna, łącząc się z cudzym udziałem
    plikowym, podpisywała pakiety i nie godziła się na połączenie
    z serwerem, który podpisywać nie chce.

    Punkt jest lustrzanym odbiciem wymogu serwerowego i broni przed tym
    samym: wejściem w środek sesji plikowej. Różnica polega na kierunku.
    Tam chodzi o to, kto sięga do nas; tu o to, dokąd sięgamy my.

    Na serwerze brzmi to nieoczywiście — serwer kojarzy się z udostępnianiem,
    nie z pobieraniem. W praktyce serwery sięgają do cudzych udziałów stale
    i to w sposób najbardziej wrażliwy z możliwych: skrypty wdrożeniowe
    pobierające pliki z udziału narzędziowego, zadania kopii zapasowej
    zapisujące dane na udział, instalatory uruchamiane z zasobu sieciowego.
    Każda z tych czynności odbywa się na koncie o wysokich uprawnieniach.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia treści serwerowi w chwili, gdy ten pobiera plik. Skrypt
    uruchomiony z udziału, którego treść po drodze podmieniono, wykonuje
    się z uprawnieniami konta, które go uruchomiło.

    Jest to więc punkt broniący nie danych na tej maszynie, tylko jej
    integralności — a droga przez podmieniony plik pobrany z sieci należy
    do najskuteczniejszych, jakie są.
  en: |
    The setting takes that this machine, connecting to another's file share, sign packets
    and not agree to a connection with a server unwilling to sign.

    The item is a mirror of the server demand and guards against the same thing: a stepping
    into the middle of a file session. The difference lies in the direction. There it is
    about who reaches us; here about where we reach.

    On a server that sounds unobvious - a server calls to mind sharing rather than fetching.
    In practice servers reach others' shares constantly and in the most delicate way
    possible: deployment scripts fetching files from a tools share, backup tasks recording
    data onto a share, installers run from a network resource. Each of those doings happens
    on a highly privileged account.

    What an attacker gains while the item goes unmet: the means of putting contents in front
    of the server at the moment it fetches a file. A script run from a share whose contents
    were swapped on the way runs with the rights of the account that started it.

    It is therefore an item guarding not this machine's data but its integrity - and the
    road through a swapped file fetched from the network is among the most effective there
    are.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, do jakich udziałów ten serwer sięga — bo zmiana
    dotyczy wyłącznie połączeń wychodzących i nie rusza niczego, co do
    serwera przychodzi.

    Zakres skutków jest przez to znacznie węższy niż przy wymogu serwerowym
    i dlatego klasa jest niższa. Psuje się połączenie tej jednej maszyny
    do serwera, który podpisywać nie potrafi — a nie połączenia wszystkich
    maszyn do tej jednej.

    Serwerami bez podpisywania bywają: starsze urządzenia udostępniające
    dyski, systemy plików spoza rodziny Windows w konfiguracji domyślnej
    sprzed lat, oraz udziały wystawiane przez urządzenia wbudowane.
    Połączenie do nich zakończy się odmową.

    Objaw jest natychmiastowy i widoczny w miejscu, w którym połączenie
    ma miejsce: zadanie kopii zapasowej zgłosi błąd zapisu, skrypt
    wdrożeniowy nie znajdzie pliku. Rozpoznanie jest łatwiejsze niż przy
    wymogu serwerowym, bo objawów nie zgłasza tłum użytkowników, tylko
    jedna maszyna.

    Zmiana wymaga restartu usługi stacji roboczej.
  en: |
    What needs checking is which shares this server reaches - since the change concerns
    outgoing connections alone and touches nothing coming into the server.

    The reach of the effects is by that much narrower than with the server demand, and hence
    the class is lower. What breaks is this one machine's connection to a server unable to
    sign - not every machine's connections to this one.

    Servers without signing are at times: older devices sharing disks, file systems outside
    the Windows family in a default configuration from years ago, and shares put up by
    embedded devices. A connection to them will end in a refusal.

    The symptom is immediate and visible where the connection takes place: a backup task
    will report a write error, a deployment script will not find a file. Recognising it is
    easier than with the server demand, since the symptoms are reported not by a crowd of
    users but by one machine.

    The change takes a restart of the workstation service.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Połączenia do udziałów na urządzeniach nieumiejących podpisywać kończą się odmową
      - Zadania kopii zapasowej zapisujące dane na taki udział zgłaszają błąd zapisu
      - Skrypty pobierające pliki z udziału bez podpisywania nie znajdują plików
      - Udziały udostępniane przez tę maszynę działają bez zmiany
    en:
      - Connections to shares on devices unable to sign end in a refusal
      - Backup tasks recording data onto such a share report a write error
      - Scripts fetching files from a share without signing do not find the files
      - The shares put up by this machine work unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer sięga do udziału na urządzeniu nieumiejącym podpisywać pakietów
    en:
      - The server reaches a share on a device unable to sign packets
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'RequireSecuritySignature'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $current = (Get-ItemProperty -Path $path -Name 'RequireSecuritySignature' -ErrorAction SilentlyContinue).'RequireSecuritySignature'
    [pscustomobject]@{
      path        = $path
      name        = 'RequireSecuritySignature'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSecuritySignature' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-client-digitally-sign-communications-always

notes:
  pl: |
    Punkt dotyczy wyłącznie połączeń wychodzących z tej maszyny.
    Za połączenia przychodzące odpowiada ustawienie w gałęzi usługi
    serwera i jest ono oceniane osobno.

    Na serwerze punkt bywa uznawany za nieistotny, bo serwer „niczego nie
    pobiera". Jest to założenie warte sprawdzenia: zadania kopii zapasowej,
    skrypty wdrożeniowe i instalatory uruchamiane z zasobu sieciowego
    są połączeniami wychodzącymi i pracują na koncie uprzywilejowanym.

    Ustawienie odpowiada wymogowi bezwzględnemu. Istnieje osobna wartość
    opisująca zgodę na podpisywanie, gdy druga strona o nie poprosi —
    ta nie spełnia punktu, bo pozwala serwerowi, który podpisywania nie
    chce, uzyskać połączenie niepodpisane.
  en: |
    The item concerns outgoing connections from this machine alone. Incoming connections are
    the business of the setting in the server service's branch and it is assessed apart.

    On a server the item is at times held unimportant, since a server "fetches nothing".
    That is an assumption worth checking: backup tasks, deployment scripts and installers
    run from a network resource are outgoing connections and work on a privileged account.

    The setting answers to an absolute demand. There is a separate value describing
    agreement to sign where the other party asks for it - that one does not meet the item,
    since it lets a server unwilling to sign get an unsigned connection.
