id: win2016-take-ownership-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Przejmowanie własności obiektów tylko dla administratorów
    en: Taking ownership of objects restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do przejmowania własności plików i innych
    obiektów do grupy administratorów lokalnych.

    Rzecz działa inaczej, niż podpowiada odruch. Właściciel obiektu może
    zmienić jego uprawnienia zawsze, niezależnie od tego, co w tych
    uprawnieniach napisano — to jest zasada wpisana w system, żeby dało się
    odzyskać dostęp do zasobu, do którego nikt go już nie ma. Kto więc
    przejmie własność, ten może nadać sobie dowolny dostęp.

    Uprawnienie opisane tym punktem pozwala przejąć własność dowolnego
    obiektu na maszynie, bez oglądania się na jego dotychczasowe uprawnienia.
    Jest to więc obejście całego systemu uprawnień plikowych, wykonane
    zgodnie z jego własnymi regułami.

    Kategoria wysoka, nie krytyczna — atak wymaga dodatkowego warunku
    w postaci dostępu do maszyny, a sam nie daje kodu w jądrze ani
    poświadczeń. Zostawia natomiast ślad: zmiana właściciela jest widoczna
    i daje się wykryć, o ile ktokolwiek patrzy.

    Na serwerze 2016 rzecz dotyczy głównie udziałów plikowych. Maszyny tego
    rocznika pełnią często rolę archiwum, a struktura uprawnień na nich
    narastała latami i bywa jedyną rzeczą chroniącą dane działów przed sobą
    nawzajem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    dowolnego pliku na maszynie, również do takiego, którego uprawnienia
    wprost mu go odmawiają.
  en: |
    The item limits the right to take ownership of files and other objects to the
    local administrators group.

    The thing works other than the reflex suggests. An object's owner can always
    change its permissions, whatever those permissions say - that is a principle
    built into the system so that access to a resource nobody can reach any
    longer can be recovered. Whoever takes ownership can therefore grant
    themselves any access at all.

    The right this item describes allows ownership of any object on the machine
    to be taken, with no regard for its existing permissions. It is therefore a
    way round the whole system of file permissions, carried out in accordance
    with that system's own rules.

    The category is high rather than critical - the attack needs the further
    condition of access to the machine, and does not by itself yield kernel code
    or credentials. It does, though, leave a trace: a change of owner is visible
    and can be detected, provided anybody is looking.

    On Server 2016 the matter concerns mainly file shares. Machines of this
    vintage often serve as an archive, and the structure of permissions on them
    grew over years and is sometimes the only thing keeping departments' data
    apart from one another.

    What an attacker gains while the item goes unmet: access to any file on the
    machine, including one whose permissions refuse it to them outright.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Domyślnie uprawnienie ma wyłącznie grupa
    administratorów lokalnych, a oprogramowanie, które go naprawdę
    potrzebuje, jest rzadkością.

    Tam, gdzie na liście jest ktoś jeszcze, wpis pochodzi zwykle z migracji
    danych: przenoszenia udziału na nowy serwer, porządkowania uprawnień po
    likwidacji działu albo odzyskiwania dostępu do katalogów po odejściu
    pracownika. Są to czynności jednorazowe, a uprawnienie zostało po nich
    nadane na stałe.

    Właśnie dlatego zmiana zwykle nic nie kosztuje: czynność, dla której
    uprawnienie nadano, dawno się skończyła. Warto jednak sprawdzić, czy
    taka migracja nie trwa akurat teraz.

    Czego to nie psuje: dostępu do plików wynikającego ze zwykłych uprawnień,
    udostępniania, kopii zapasowych ani przejmowania własności przez
    administratora.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". By default the right belongs to the local
    administrators group alone, and software that genuinely needs it is rare.

    Where somebody else is on the list, the entry usually comes from a data
    migration: moving a share to a new server, tidying permissions after a
    department was wound up, or recovering access to directories after an
    employee left. Those are one-off actions, and the right was granted
    permanently after them.

    That is precisely why the change usually costs nothing: the action the right
    was granted for finished long ago. It is worth checking, though, whether such
    a migration happens to be under way now.

    What this does not break: access to files following from ordinary
    permissions, sharing, backups, or taking ownership by an administrator.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Konto spoza grupy administratorów traci możliwość przejęcia własności pliku wbrew jego uprawnieniom
      - Trwająca migracja danych opierająca się na tym uprawnieniu zatrzymuje się na odmowie dostępu
      - Narzędzie porządkujące uprawnienia na udziałach przestaje działać spoza grupy administratorów
      - Dostęp wynikający ze zwykłych uprawnień, udostępnianie i kopie zapasowe działają bez zmian
    en:
      - An account outside the administrators group loses the ability to take a file's ownership against its permissions
      - A data migration in progress that rests on this right stops at an access refusal
      - A tool tidying permissions on shares stops working from outside the administrators group
      - Access following from ordinary permissions, sharing and backups work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie trwa migracja danych albo porządkowanie uprawnień opierające się na tym uprawnieniu nadanym kontu spoza grupy administratorów
    en:
      - A data migration or a tidying of permissions resting on this right granted to an account outside the administrators group is under way on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTakeOwnershipPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTakeOwnershipPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTakeOwnershipPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An owner can always rewrite an object's permissions, so this right is a way
    # round the whole permission structure on the machine's shares.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTakeOwnershipPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTakeOwnershipPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/take-ownership-of-files-or-other-objects

notes:
  pl: |
    Uprawnienie to zostawia ślad, w odróżnieniu od większości pozostałych
    z tej grupy. Zmiana właściciela jest zdarzeniem, które da się
    zarejestrować — pod warunkiem, że audyt dostępu do obiektów jest
    włączony. Bez niego ślad istnieje wyłącznie w postaci bieżącego
    właściciela, a ten mówi, kto jest, a nie kto był.

    Reguła nie dotyczy przejmowania własności przez administratora, bo grupa
    ta zostaje na liście. Punkt ogranicza, kto jeszcze może to robić.

    Warto zestawić go z regułą o tworzeniu kopii zapasowych. Oba uprawnienia
    omijają uprawnienia plikowe, ale w różny sposób: to zmienia właściciela
    i zostawia ślad, tamto czyta bez zmieniania czegokolwiek.
  en: |
    This right leaves a trace, unlike most of the others in this group. A change
    of owner is an event that can be recorded - provided auditing of access to
    objects is on. Without it the trace exists only as the current owner, and
    that says who is, not who was.

    The rule does not bear on an administrator taking ownership, because that
    group stays on the list. The item limits who else may do it.

    It is worth setting beside the rule about backing up files. Both rights go
    round file permissions, but differently: this one changes the owner and
    leaves a trace, that one reads without changing anything.
