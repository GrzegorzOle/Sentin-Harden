id: win11-netbios-name-resolution-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozwiązywanie nazw starszym mechanizmem sieciowym wyłączone
    en: Name resolution by the older network mechanism switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm nazw sieciowych pochodzi z czasów, kiedy sieci lokalne
    nie miały serwerów nazw, a komputery ogłaszały się nawzajem rozgłoszeniem.
    Do dziś jest w systemie włączony i do dziś działa jako droga zastępcza,
    gdy zapytania do serwera nazw nie przyniosą odpowiedzi.

    Jest to najstarsza i najsłabsza z dróg rozwiązywania nazw. Nie ma
    uwierzytelnienia, nie ma podpisu, nie ma rozjemcy — odpowiada ten, kto
    odpowie pierwszy. Napastnik w tej samej sieci odpowiada na wszystko
    i kieruje ruch do siebie, a maszyna wysyła mu poświadczenia w postaci
    nadającej się do złamania offline albo do przekazania dalej.

    Jest to jedna z najczęściej wykorzystywanych dróg wewnątrz sieci i to nie
    dlatego, że jest trudna do zamknięcia, tylko dlatego, że zwykle nikt jej
    nie zamyka. Narzędzia robiące to automatycznie są publicznie dostępne od lat.

    Punkt zamyka tę drogę na poziomie zasad, dla wszystkich kart naraz —
    inaczej niż ustawienie w oknie karty sieciowej, które trzeba by powtarzać
    przy każdym nowym połączeniu.
  en: |
    The older network name mechanism comes from the days when local networks had no
    name servers and computers announced themselves to each other by broadcast. It is
    switched on in the system to this day and to this day works as a fallback route
    when queries to the name server bring no answer.

    It is the oldest and weakest of the name resolution routes. There is no
    authentication, no signature, no arbiter - whoever answers first, answers. An
    attacker on the same network answers everything and steers the traffic to
    themselves, and the machine sends them credentials in a form fit for cracking
    offline or for passing on.

    It is one of the most used routes inside a network, and not because it is hard to
    close but because nobody usually closes it. Tools doing this automatically have
    been publicly available for years.

    The item closes that route at the policy level, for every adapter at once -
    unlike the setting in an adapter's window, which would have to be repeated at
    every new connection.

disruption_description:
  pl: |
    Jest to zmiana, która potrafi odciąć starsze zasoby, i wymaga świadomego
    wdrożenia.

    Przestanie działać odwoływanie się do maszyn i udziałów po samej nazwie
    krótkiej tam, gdzie nazwa ta nie jest znana serwerowi nazw. Dotyczy to
    przede wszystkim rzeczy starych: udziałów na maszynach spoza domeny,
    urządzeń przemysłowych z wbudowanym systemem, aplikacji, które mają nazwę
    serwera wpisaną na sztywno w konfiguracji sprzed lat.

    Najczęstszym objawem jest aplikacja, która nie łączy się z bazą, mimo że
    „nic się nie zmieniło". Nazwa serwera w jej konfiguracji rozwiązywała się
    dotąd starszym mechanizmem, bo w serwerze nazw nigdy jej nie było.

    Drugim skutkiem jest przeglądanie otoczenia sieciowego. Lista maszyn
    w oknie sieci opiera się częściowo na tym mechanizmie i po wdrożeniu bywa
    pusta. Zasoby pozostają osiągalne po pełnej nazwie albo po adresie.

    Wdrożenie wymaga przejrzenia, czy nazwy używane przez aplikacje są znane
    serwerowi nazw. Jest to praca do wykonania przed zmianą, nie po niej.

    Nie ma restartu, ale wpis zaczyna obowiązywać po odnowieniu ustawień karty.
  en: |
    This is a change that can cut off older resources, and it calls for a deliberate
    rollout.

    Referring to machines and shares by a short name alone will stop working wherever
    that name is unknown to the name server. This concerns old things above all:
    shares on machines outside the domain, industrial devices with an embedded
    system, applications with a server's name written hard into a configuration made
    years ago.

    The commonest symptom is an application that will not connect to its database
    although "nothing has changed". The server's name in its configuration was
    resolved by the older mechanism until now, because it was never in the name
    server at all.

    The second effect is browsing the network neighbourhood. The list of machines in
    the network window rests partly on this mechanism and can be empty after the
    rollout. The resources stay reachable by their full name or by address.

    The rollout calls for going through whether the names applications use are known
    to the name server. That is work to be done before the change, not after.

    There is no restart, but the entry takes effect once the adapter's settings are
    renewed.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Odwoływanie się do maszyn po samej nazwie krótkiej przestanie działać tam, gdzie serwer nazw jej nie zna
      - Aplikacja z nazwą serwera wpisaną na sztywno może przestać łączyć się z bazą
      - Lista maszyn w oknie otoczenia sieciowego bywa po wdrożeniu pusta
      - Udziały na maszynach spoza domeny przestaną być osiągalne po nazwie krótkiej
    en:
      - Referring to machines by a short name alone stops working where the name server does not know it
      - An application with a server's name written hard into it may stop connecting to its database
      - The list of machines in the network neighbourhood window can be empty after the rollout
      - Shares on machines outside the domain stop being reachable by a short name
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacje odwołują się do serwerów po nazwach nieznanych serwerowi nazw
      - W sieci pracują urządzenia z wbudowanym systemem, odnajdywane wyłącznie tym mechanizmem
    en:
      - Applications refer to servers by names the name server does not know
      - Devices with embedded systems, found by this mechanism alone, work on the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero switches the mechanism off, one
      # admits it, and the further positions make it depend on the network.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'EnableNetbios'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'EnableNetbios'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableNetbios' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Wpis przyjmuje wartości ze zbioru, a nie przełącznik. Zero wyłącza
    mechanizm, jedynka go dopuszcza, a kolejne pozycje uzależniają go od
    rodzaju sieci albo każą go wyłączać w trybie nauki. Wymagane jest zero,
    więc każda inna wartość — także zawężająca — jest niezgodnością.

    Ustawienie przez zasadę różni się od ustawienia w oknie karty sieciowej
    tym, że obejmuje wszystkie karty, w tym te, które dopiero powstaną.
    Ustawienie na karcie trzeba powtarzać przy każdym nowym połączeniu
    i właśnie dlatego zwykle gdzieś zostaje pominięte.

    Punkt zamyka trzecią i ostatnią z dróg rozwiązywania nazw opartych na
    pytaniu rzuconym w sieć. Razem z wyłączeniem rozgłoszenia grupowego
    i rozgłoszenia w warstwie lokalnej zostawia maszynę pytającą wyłącznie
    serwer nazw — i to jest właściwy cel całej trójki.
  en: |
    The entry takes values from a set rather than acting as a switch. Zero switches
    the mechanism off, one admits it, and the further positions make it depend on the
    kind of network or have it switched off in a learning mode. Zero is required, so
    any other value - a narrowing one included - is a deviation.

    Setting it by policy differs from setting it in an adapter's window in that it
    covers every adapter, including those yet to come into being. The setting on an
    adapter has to be repeated at every new connection, and that is exactly why it
    usually gets missed somewhere.

    The item closes the third and last of the name resolution routes resting on a
    question thrown out onto the network. Together with switching off multicast and
    local-layer broadcast, it leaves the machine asking the name server alone - and
    that is the real aim of all three.
