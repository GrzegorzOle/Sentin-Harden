id: win2025-virtualization-based-security-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Zabezpieczenia oparte na wirtualizacji włączone
    en: Virtualization-based security enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza zabezpieczenia oparte na wirtualizacji — warstwę,
    w której część mechanizmów systemu działa odgrodzona od reszty
    systemu przez hipernadzorcę.

    Zostawiam kategorię wysoką. Jest to punkt nadrzędny wobec kilku
    następnych: pozostałe reguły z tej grupy opisują, co dokładnie
    w tej warstwie ma się dziać, a ta włącza samą warstwę. Bez niej
    tamte nie robią nic.

    Rzecz polega na tym, co ta warstwa odbiera napastnikowi. Po wejściu
    na poziom jądra systemu napastnik ma tradycyjnie dostęp do wszystkiego,
    co w tym systemie jest — łącznie z pamięcią, w której trzymane są
    poświadczenia. Oddzielenie części mechanizmów do osobnej, chronionej
    przez hipernadzorcę przestrzeni znaczy, że zdobycie jądra przestaje
    wystarczać: żeby sięgnąć po to, co jest w środku, trzeba złamać
    jeszcze jedną granicę, i to granicę pilnowaną przez sprzęt.

    Na serwerze waży to więcej niż na stacji roboczej i powód jest
    konkretny. Na stacji roboczej w pamięci leży poświadczenie jednego
    człowieka. Na serwerze — poświadczenia kont usługowych, biletów
    sesji użytkowników, którzy się na nim logowali, i kont używanych
    przez agenty zarządzania. Jest to więc maszyna, na której zawartość
    tej pamięci ma wartość nieporównanie większą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: to, że
    zdobycie jądra na tej maszynie od razu oznacza dostęp do wszystkich
    poświadczeń, jakie w niej są — bez żadnej dodatkowej granicy do
    pokonania.
  en: |
    The item switches on the warding grounded upon unbodying - the layer wherein a share of the
    workings of the system runs fenced off from the rest of the system by the over-ruler.

    I leave the category high. It is the item standing over several that come after - the other rules
    of that band tell what exactly is to befall within that layer, and this one switches on the layer
    itself. Without it those do nothing.

    The thing lies in what that layer takes from an attacker. Upon coming onto the kernel of the system
    an attacker has, after the old fashion, a reach to everything that is within that system - the
    memory among it, wherein the tokens are held. The setting apart of a share of the workings into a
    room of its own, warded by the over-ruler, means that the winning of the kernel stops being enough
    - to reach for what is within, one more bound must be broken, and a bound watched over by the gear.

    Upon a server this weighs more than upon a workstation, and the ground is a set one. Upon a
    workstation there lies in the memory the token of one person. Upon a server there lie the tokens of
    the standings of workings, the writs of the sessions of the users who signed in upon it, and the
    standings used by the agents of ruling. It is therefore a machine whereon what is in that memory is
    worth beyond all likening more.

    What an attacker gains while the item goes unmet - this, that the winning of the kernel upon that
    machine means straightway a reach to every token that is within it, with no further bound to be
    overcome.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę wyłożyć, co
    w tej grupie znaczy ona konkretnie, bo jest to pierwsza grupa reguł
    w tej paczce wymagająca restartu maszyny, a na serwerze restart nie
    jest czynnością, tylko wydarzeniem.

    Po pierwsze, warunek tej zmiany często nie leży na tej maszynie.
    Jeżeli serwer sam jest maszyną wirtualną, warstwa ta wymaga włączenia
    wirtualizacji zagnieżdżonej po stronie gospodarza. Jest to ustawienie
    na innej maszynie, należącej zwykle do innego zespołu. Wynik czerwony
    oznacza wtedy nie zaniedbanie administratora tego serwera, tylko
    zgłoszenie do właściciela środowiska wirtualnego — i warto to wiedzieć,
    zanim ktoś zacznie szukać przyczyny u siebie.

    Po drugie, warstwa ta zajmuje pamięć i kosztuje wydajność. Na maszynie
    obsługującej intensywny ruch wejścia-wyjścia albo samej goszczącej
    maszyny wirtualne koszt jest mierzalny. Nie jest to powód, żeby zmiany
    nie robić, ale jest to powód, żeby zmierzyć przed i po, zamiast
    zakładać, że nic się nie stanie.

    Po trzecie, zmiana wiąże się dopiero po restarcie, a maszyna, która
    po nim nie wstanie, wymaga dostępu do konsoli. Jest to dokładnie ten
    moment, o którym pisałem przy usłudze konsoli awaryjnej i przy
    pulpicie zdalnym: drogę awaryjną trzeba znać wcześniej i trzeba ją
    mieć sprawdzoną przez faktyczne zalogowanie, a nie przez przeczytanie
    dokumentacji. Tutaj ta droga przestaje być ostrożnością, a staje się
    warunkiem wykonania.

    Cofnięcie wymaga kolejnego restartu, czyli kolejnego okna.
  en: |
    I leave the class "needs a witting rolling out" and would set out what in this band it means in the
    set, it being the first band of rules in this pack that takes a starting anew of the machine, and
    upon a server a starting anew is no doing but a happening.

    First, the forechosen thing of that change often lies not upon that machine. If the server be
    itself an unbodily machine, that layer takes the switching on of nested unbodying upon the host's
    side. It is a setting upon another machine, mostly of another band of folk. A red outcome means
    then no heedlessness of the ruler of that server but a telling to the owner of the unbodily
    setting - and it is worth knowing before somebody begins to seek the ground at home.

    Second, that layer takes memory and costs speed. Upon a machine bearing heavy traffic in and out,
    or itself hosting unbodily machines, the cost may be measured. It is no ground for leaving the
    change undone, but it is a ground for measuring before and after rather than taking it that nothing
    will befall.

    Third, the change binds only after a starting anew, and a machine that rises not after it takes a
    reach to the board. It is just the hour whereof I wrote at the service of the board of need and at
    the far-off desk - the road of need must be known beforehand and must be proven by a true signing
    in and not by the reading of a writ of record. Here that road stops being a heedfulness and becomes
    a forechosen thing of the doing.

    The undoing takes a further starting anew, that is, a further window.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Na maszynie wirtualnej warstwa ta wymaga wirtualizacji zagnieżdżonej włączonej po stronie gospodarza
      - Warunek zmiany leży wtedy na innej maszynie, zwykle należącej do innego zespołu
      - Warstwa zajmuje pamięć i kosztuje wydajność, mierzalnie przy intensywnym ruchu wejścia-wyjścia
      - Zmiana wiąże się dopiero po restarcie, a maszyna, która po nim nie wstanie, wymaga dostępu do konsoli
      - Cofnięcie wymaga kolejnego restartu, czyli kolejnego okna serwisowego
    en:
      - Upon an unbodily machine that layer takes nested unbodying switched on upon the host's side
      - The forechosen thing of the change lies then upon another machine, mostly of another band of folk
      - The layer takes memory and costs speed, measurably at heavy traffic in and out
      - The change binds only after a starting anew, and a machine that rises not after it takes a reach to the board
      - The undoing takes a further starting anew, that is, a further window of service
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer jest maszyną wirtualną, a gospodarz nie ma włączonej wirtualizacji zagnieżdżonej
      - Nie ma sprawdzonej drogi dostępu do konsoli maszyny na wypadek, gdyby po restarcie nie wstała
      - Maszyna gości maszyny wirtualne albo obsługuje ruch, którego wydajności nie zmierzono przed zmianą
    en:
      - The server is an unbodily machine and the host has not nested unbodying switched on
      - There is no proven road to the board of the machine for the case that it rise not after the starting anew
      - The machine hosts unbodily machines or bears traffic whose speed was not measured before the change
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      $name = 'EnableVirtualizationBasedSecurity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'EnableVirtualizationBasedSecurity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The master switch of this group; the other items do nothing without it.
    # On a virtual machine it needs nested virtualization enabled on the host -
    # a setting on a different machine. The effect appears after a restart, so
    # have a tested console route before this one.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Punkt nadrzędny wobec pozostałych w tej grupie: one opisują, co ma
    się w tej warstwie dziać, ten włącza samą warstwę. Bez niego tamte
    nie robią nic.

    Na serwerze waży więcej niż na stacji roboczej, bo w pamięci leżą nie
    poświadczenia jednego człowieka, tylko konta usługowe, bilety sesji
    zalogowanych i konta agentów zarządzania.

    Trzy rzeczy do wiedzenia przed zmianą: na maszynie wirtualnej warunek
    leży u gospodarza, czyli na cudzej maszynie; warstwa kosztuje pamięć
    i wydajność, więc mierzy się przed i po; zmiana wiąże się po
    restarcie, więc droga do konsoli przestaje być ostrożnością, a staje
    się warunkiem wykonania.
  en: |
    The item standing over the rest of that band - they tell what is to befall within that layer, this
    one switches on the layer itself. Without it those do nothing.

    Upon a server it weighs more than upon a workstation, there lying in the memory not the tokens of
    one person but the standings of workings, the writs of the sessions of those signed in, and the
    standings of the agents of ruling.

    Three things to know before the change - upon an unbodily machine the forechosen thing lies with the
    host, that is, upon another's machine; the layer costs memory and speed, so one measures before and
    after; the change binds after a starting anew, so the road to the board stops being a heedfulness
    and becomes a forechosen thing of the doing.
