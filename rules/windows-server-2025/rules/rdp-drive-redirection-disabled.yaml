id: win2025-rdp-drive-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie dysków w sesji pulpitu zdalnego wyłączone
    en: Drive redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie dysków maszyny łączącej się do sesji
    zdalnej. Serwer przestaje widzieć dyski stanowiska, a stanowisko
    przestaje mieć w sesji swoje pliki.

    Jest to przekierowanie o największych skutkach spośród całej tej
    grupy, bo nie przenosi pojedynczej treści, tylko udostępnia całe
    urządzenie. Sesja na serwerze dostaje dysk maszyny, nad którą zespół
    utrzymujący serwer nie ma żadnej władzy — laptopa domowego, komputera
    firmy zewnętrznej, stanowiska, o którym nikt nie wie, co na nim stoi.

    Pierwsze zagrożenie idzie do środka. Plik uruchomiony w sesji
    z dysku przekierowanego wykonuje się na serwerze, z uprawnieniami
    osoby zalogowanej. Serwer nie wie, skąd ten plik pochodzi, i nie ma
    jak tego sprawdzić. Droga ta omija wszystko, co postawiono na
    granicy sieci, bo plik nie przechodzi przez sieć jako ruch — wchodzi
    razem z sesją.

    Drugie idzie na zewnątrz. Skopiowanie całego katalogu z serwera na
    dysk przekierowany trwa tyle, co zwykłe przeciągnięcie, i nie
    zostawia śladu w żadnym dzienniku udziału sieciowego. Na serwerze
    plikowym albo bazodanowym jest to najprostszy z możliwych sposobów
    wyniesienia zbioru.

    Wart odnotowania jest też skutek mniej oczywisty: oprogramowanie
    szyfrujące pliki, uruchomione na stanowisku łączącego się, widzi
    dyski serwera tak samo jak własne. Przekierowanie działa w obie
    strony i w obie strony przenosi kłopot.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wniesienia na serwer dowolnego pliku z maszyny spoza kontroli
    i wyniesienia z serwera dowolnej ilości danych bez śladu.
  en: |
    The setting cuts off the joining of the connecting machine's drives to the remote session. The
    server stops seeing the station's drives, and the station stops having its files in the
    session.

    It is the redirection of the greatest effects out of this whole group, carrying not a single
    content but giving over a whole device. The session on the server gets the drive of a machine
    over which the team keeping the server has no power at all - a home laptop, an outside firm's
    computer, a station of which nobody knows what stands upon it.

    The first danger goes inwards. A file run in the session off a redirected drive is carried out
    on the server, with the rights of the person signed in. The server does not know where that
    file comes from and has no way of checking. That road goes round everything set at the
    network's border, the file not going through the network as traffic - it comes in along with
    the session.

    The second goes outwards. The copying of a whole folder off the server onto a redirected drive
    takes as long as an ordinary dragging and leaves no trace in any log of a network share. On a
    file or database server it is the simplest possible way of carrying a body of data off.

    Worth noting too is a less plain effect: software encrypting files, run at the station of the
    one connecting, sees the server's drives as it sees its own. The redirection works both ways
    and carries the trouble both ways.

    What an attacker gains while the item goes unmet: a road for bringing onto the server any file
    from a machine outside control, and for carrying off the server any quantity of data without a
    trace.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy ktoś wnosi na ten serwer pliki
    właśnie tą drogą.

    Przypadków jest kilka i wszystkie dają się wskazać po nazwie.

    Pierwszy to instalacja oprogramowania i narzędzi diagnostycznych.
    Administrator przynosi pakiet na serwer, mając go na swoim dysku
    i przeciągając w sesji. Po zmianie musi mieć inną drogę: udział
    plikowy, repozytorium pakietów albo katalog przeznaczony na to na
    samym serwerze.

    Drugi to praca na serwerze terminali z własnymi dokumentami. Ludzie
    pracujący w aplikacji uruchomionej w sesji otwierają i zapisują
    pliki na swoim dysku. Po zmianie zobaczą, że ich dysków nie ma,
    i zgłoszą to jako awarię aplikacji, bo z ich strony tak to wygląda.

    Trzeci, najłatwiejszy do przeoczenia, to kopie zapasowe wykonywane
    ręcznie. Zdarza się, że eksport bazy albo konfiguracji ląduje
    u kogoś na dysku właśnie przez przekierowanie, i że jest to jedyna
    kopia, o której ta osoba wie.

    Objaw jest jednoznaczny: w oknie wyboru pliku po prostu nie ma
    dysków maszyny lokalnej. Nie pojawia się przy tym błąd
    przekierowania, więc zgłoszenie brzmi zwykle „aplikacja przestała
    widzieć moje pliki".

    Punkt ten czyta się razem z przekierowaniem schowka. Oba odcinają
    drogę przenoszenia treści między serwerem a stanowiskiem, tylko
    w innej skali — schowek przenosi zaznaczenie, dysk cały zbiór.
    Odcięcie jednego bez drugiego zostawia drogę otwartą.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane zachowują podłączone dyski do końca.
  en: |
    One thing needs checking: whether anybody brings files onto this server by just that road.

    The cases are several and all can be named by name.

    The first is the installing of software and of tools of diagnosis. The administrator brings a
    package onto the server, having it on their own drive and dragging it within the session. After
    the change they must have another road: a file share, a store of packages, or a folder set
    aside for it on the server itself.

    The second is work on a terminal server with one's own documents. People working in an
    application run in the session open and save files on their own drive. After the change they
    will see that their drives are not there, and will report it as a breakdown of the application,
    for from their side that is how it looks.

    The third, the easiest to overlook, is copies made by hand. It happens that an export of a
    database or of settings lands on somebody's drive by just this redirection, and that it is the
    only copy that person knows of.

    The symptom is plain: in the window for the choosing of a file the local machine's drives are
    simply not there. No fault of redirection shows with it, so the report usually runs "the
    application has stopped seeing my files".

    This item is read together with the redirection of the clipboard. Both cut off a road for
    carrying contents between server and station, only in another measure - the clipboard carries a
    marking, the drive a whole body. The cutting of one without the other leaves the road open.

    The change comes into force straight away and is undone at once. Sessions already opened keep
    their joined drives to their end.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - file-sharing
    - removable-media
  what_breaks:
    pl:
      - Wnoszenie pakietu instalacyjnego albo narzędzia diagnostycznego z własnego dysku przestanie działać
      - Aplikacja uruchomiona w sesji przestanie widzieć dyski maszyny lokalnej w oknie wyboru pliku
      - Zgłoszenie brzmi zwykle, że aplikacja przestała widzieć moje pliki, a nie że przekierowanie zostało odcięte
      - Ręczny eksport bazy albo konfiguracji na dysk osoby łączącej się przestanie być możliwy
      - Sesje już nawiązane zachowują podłączone dyski do końca
    en:
      - The bringing of an installing package or a tool of diagnosis off one's own drive will stop working
      - An application run in the session will stop seeing the local machine's drives in the window for choosing a file
      - The report usually runs that the application has stopped seeing my files and not that the redirection was cut off
      - A hand-made export of a database or of settings onto the connecting person's drive stops being possible
      - Sessions already opened keep their joined drives to their end
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Oprogramowanie na serwerze terminali pracuje na plikach leżących na dyskach osób łączących się
      - Nie ma innej drogi wnoszenia pakietów i narzędzi na ten serwer niż przekierowany dysk
    en:
      - Software on a terminal server works on files lying on the drives of the people connecting
      - There is no road for bringing packages and tools onto this server other than a redirected drive
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableCdm'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCdm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCdm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Przekierowanie dysków nie przenosi pojedynczej treści, tylko
    udostępnia całe urządzenie — dysk maszyny, nad którą zespół
    utrzymujący serwer nie ma żadnej władzy.

    Plik uruchomiony w sesji z dysku przekierowanego wykonuje się na
    serwerze i omija wszystko, co postawiono na granicy sieci, bo nie
    przechodzi przez sieć jako ruch.

    Skutek mniej oczywisty: oprogramowanie szyfrujące pliki, uruchomione
    na stanowisku łączącego się, widzi dyski serwera tak samo jak własne.

    Czytaj razem z przekierowaniem schowka. Odcięcie jednego bez drugiego
    zostawia drogę przenoszenia treści otwartą.
  en: |
    Drive redirection carries not a single content but gives over a whole device - the drive of a
    machine over which the team keeping the server has no power at all.

    A file run in the session off a redirected drive is carried out on the server and goes round
    everything set at the network's border, not going through the network as traffic.

    A less plain effect: software encrypting files, run at the station of the one connecting, sees
    the server's drives as it sees its own.

    Read together with the redirection of the clipboard. The cutting of one without the other
    leaves the road for carrying contents open.
