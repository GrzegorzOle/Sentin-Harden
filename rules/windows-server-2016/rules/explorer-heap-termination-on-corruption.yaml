id: win2016-explorer-heap-termination-on-corruption

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Powłoka kończy pracę przy wykryciu uszkodzenia sterty
    en: The shell stops on detecting heap corruption
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby powłoka systemu kończyła pracę natychmiast po
    wykryciu uszkodzenia obszaru pamięci, z którego sama korzysta.

    Zachowanie to wygląda na przesadne i takie nie jest. Rzecz w tym, co
    uszkodzenie sterty zwykle oznacza. Nie oznacza drobnej pomyłki — oznacza,
    że coś zapisało poza przeznaczonym dla siebie miejscem, a struktury
    opisujące pamięć przestały odpowiadać rzeczywistości.

    Program pracujący dalej w takim stanie robi rzeczy, których jego autor
    nie przewidział. Dokładnie na tym polega wykorzystanie tej klasy usterek:
    napastnik uszkadza stertę rozmyślnie, tak żeby program czytając dalej
    swoje struktury trafił tam, gdzie napastnik chce.

    Zakończenie pracy odbiera mu ten krok. Program ginie, zanim zdąży zrobić
    cokolwiek na uszkodzonych danych, a zamiast wykonania cudzego kodu
    zostaje wpis w dzienniku i zniknięcie okna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pracujący
    dalej proces powłoki, którego struktury pamięci może kształtować —
    a więc materiał na wykonanie własnego kodu zamiast zwykłej awarii.
  en: |
    The setting sees to it that the system shell stops at once on detecting damage to
    an area of memory it uses itself.

    That behaviour looks excessive and is not. The matter is what heap corruption as
    a rule means. It means no small slip - it means something wrote outside the place
    meant for it, and the structures describing memory stopped answering to reality.

    A program working on in such a state does things its author did not foresee. That
    is exactly what the use of this class of faults rests on: the attacker damages
    the heap deliberately, so that the program, reading its structures on, lands where
    the attacker wants.

    Stopping takes that step away from them. The program dies before it can do
    anything at all on the damaged data, and instead of somebody else's code being
    run there is an entry in a log and a window vanishing.

    What an attacker gains while the item goes unmet: a shell process working on,
    whose memory structures they can shape - and so material for running their own
    code instead of an ordinary crash.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zachowanie jest domyślne od wielu wydań systemu, a wpis, o którym mowa,
    służy wyłącznie do jego wyłączenia. Wdrożenie zapisuje stan, który i tak
    obowiązuje.

    Warto powiedzieć, co się dzieje, gdy mechanizm zadziała, bo brzmi to
    groźnie. Powłoka kończy pracę i uruchamia się ponownie. Na serwerze bez
    sesji interaktywnych nikt tego nie zobaczy. W sesji zdalnej objawem jest
    zniknięcie pulpitu na chwilę i powrót — otwarte okna programów zostają,
    bo nie są częścią powłoki.

    Rzecz, o której trzeba uprzedzić: zdarzenie takie bywa mylone z awarią
    i bywa zgłaszane jako usterka systemu. Jest odwrotnie — jest to
    zabezpieczenie, które właśnie coś zatrzymało, i warto przy takim
    zgłoszeniu obejrzeć dziennik, a nie wyłączać mechanizm.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.

    Czego to nie psuje: pracy z plikami, sieci, logowania, usług. Nie ma
    znanych regresji.
  en: |
    The class is "no disruption".

    The behaviour has been the default for many releases of the system, and the entry
    in question serves only to switch it off. The rollout writes down a state that
    holds anyway.

    Worth saying what happens when the mechanism takes effect, since it sounds
    alarming. The shell stops and starts again. On a server with no interactive
    sessions nobody will see it. In a remote session the symptom is the desktop
    vanishing for a moment and coming back - open program windows stay, not being
    part of the shell.

    A thing to forewarn of: such an event is at times taken for a breakdown and
    reported as a fault of the system. It is the other way round - it is a safeguard
    that has just stopped something, and at such a report it is worth looking at the
    log rather than switching the mechanism off.

    No restart, sign-out or stopping of a service goes with it.

    What this does not break: work with files, the network, signing in, or services.
    There are no known regressions.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Gdy mechanizm zadziała, powłoka kończy pracę i uruchamia się ponownie - w sesji zdalnej widać to jako zniknięcie pulpitu na chwilę
      - Zdarzenie takie bywa mylone z awarią i zgłaszane jako usterka systemu, choć jest zabezpieczeniem, które coś zatrzymało
      - Otwarte okna programów zostają, bo nie są częścią powłoki
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
    en:
      - When the mechanism takes effect the shell stops and starts again - in a remote session that shows as the desktop vanishing for a moment
      - Such an event is at times taken for a breakdown and reported as a fault of the system, though it is a safeguard that has stopped something
      - Open program windows stay, not being part of the shell
      - No restart, no sign-out, no stopping of a service
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje rozszerzenie powłoki uszkadzające stertę przy normalnej pracy i nie da się go na razie zastąpić
    en:
      - A shell extension damaging the heap in normal work runs on the machine and cannot be replaced for the time being
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      $name = 'NoHeapTerminationOnCorruption'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoHeapTerminationOnCorruption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named in the negative - zero means the stopping is not
    # switched off, so the wanted state is written with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoHeapTerminationOnCorruption' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/memory/heap-functions

notes:
  pl: |
    Punkt tworzy parę z regułą o wykonaniu danych i obie warto pokazywać
    razem. Mechanizmy są różne, ale odpowiadają na to samo: co zrobić, gdy
    pamięć procesu przestaje odpowiadać założeniom.

    Rzecz warta wpisania do interfejsu to mylenie skutku z awarią.
    Użytkownik, którego powłoka zniknęła i wróciła, zgłasza usterkę,
    a administrator szukający spokoju wyłącza mechanizm. Aplikacja, która
    tłumaczy, co się właśnie stało, zmienia tę reakcję — i to jest
    konkretny przykład na to, po co w ogóle opisywać skutki.

    Kategoria średnia z tego samego powodu co przy poprzednim punkcie:
    zabezpieczenie już działa, a punkt pilnuje, żeby nie zostało zdjęte.
  en: |
    The item makes a pair with the rule about executing data, and both are worth
    showing together. The mechanisms differ but they answer the same thing: what to
    do when a process's memory stops answering to assumptions.

    A thing worth writing into the interface is the mistaking of the consequence for
    a breakdown. A user whose shell vanished and came back reports a fault, and an
    administrator after some peace switches the mechanism off. An application that
    explains what has just happened changes that answer - and that is a particular
    example of what describing consequences is for at all.

    The medium category for the same reason as at the previous item: the safeguard
    already works, and the item sees to it not being taken away.
