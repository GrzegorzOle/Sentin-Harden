id: win11-rdp-plug-and-play-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie urządzeń rozpoznawanych samoczynnie w sesji zdalnej wyłączone
    en: Redirection of automatically recognised devices in remote sessions disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Urządzenia rozpoznawane samoczynnie — aparaty, skanery, odtwarzacze,
    telefony podłączone przewodem — dają się udostępnić maszynie przyjmującej
    połączenie. Po stronie zdalnej wygląda to tak, jakby ktoś podłączył
    urządzenie wprost do niej: system rozpoznaje je, dobiera sterownik
    i instaluje go.

    To ostatnie jest sednem sprawy. Przekierowanie nie przenosi samych danych —
    uruchamia po stronie zdalnej pełny tok rozpoznania i instalacji sterownika,
    sterowany tym, co urządzenie o sobie powie. Osoba łącząca się rozstrzyga
    więc, jaki kod zostanie zainstalowany na maszynie, do której się łączy,
    choć sama nie ma na niej takich uprawnień.

    Urządzenie podszywające się pod inne jest przy tym rzeczą zwyczajną i tanią.
    Sprzęt zgłaszający się jako aparat fotograficzny, a będący czymś innym, to
    jeden z prostszych sposobów wprowadzenia własnego sterownika tam, gdzie się
    go inaczej nie wprowadzi.

    Punkt zamyka tę drogę. Sesja pozostaje sesją, a sprzęt maszyny łączącej się
    zostaje po jej stronie.
  en: |
    Devices recognised automatically - cameras, scanners, players, phones attached by a
    cable - can be shared with the machine taking the connection. On the remote side it
    looks as though somebody had attached the device to it directly: the system
    recognises it, picks a driver and installs it.

    That last part is the heart of the matter. Redirection does not carry the data
    alone - it starts on the remote side the full course of recognising and installing a
    driver, driven by what the device says about itself. So the person connecting
    settles which code is installed on the machine they connect to, though they hold no
    such rights on it themselves.

    A device passing itself off as another is, at that, an ordinary and cheap thing.
    Equipment announcing itself as a camera while being something else is one of the
    simpler ways of bringing one's own driver where it would not otherwise get in.

    The item closes that route. A session stays a session, and the connecting machine's
    equipment stays on its own side.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś korzysta w sesji zdalnej ze sprzętu
    podłączonego do maszyny, z której się łączy.

    Na stacji, która nie przyjmuje połączeń pulpitem zdalnym, zmiana nie robi
    nic. Ustawienie działa po stronie maszyny przyjmującej połączenie.

    Tam, gdzie połączenia są przyjmowane, skutek dotyczy wyraźnie wskazanych
    zastosowań. Skanowanie dokumentu do programu uruchomionego zdalnie przestanie
    działać. Wgranie zdjęć z aparatu do systemu obiegu dokumentów po stronie
    zdalnej przestanie działać. Telefon podłączony przewodem przestanie być
    widoczny w sesji.

    Warto od razu rozróżnić dwie rzeczy, bo to pytanie pojawia się zaraz po
    wdrożeniu. Pamięć przenośna podłączana złączem uniwersalnym nie jest
    obsługiwana tym mechanizmem, tylko przekierowaniem dysków — ta droga
    pozostaje taka, jak ją ustawiono osobną regułą. Drukarki także mają własne
    ustawienie i ten punkt ich nie zmienia.

    Zamiennikiem jest zwykle obsłużenie urządzenia po stronie maszyny, do której
    jest podłączone, i przeniesienie samego pliku. Jest to jeden krok więcej,
    ale dla większości zastosowań wykonalny.

    Nie ma restartu, ale sesje już otwarte zachowują przekierowane urządzenia
    do rozłączenia.
  en: |
    What needs checking is whether anybody uses, in a remote session, equipment attached
    to the machine they connect from.

    On a workstation taking no Remote Desktop connections the change does nothing. The
    setting works on the side of the machine taking the connection.

    Where connections are taken, the effect touches plainly named uses. Scanning a
    document into a program run remotely stops working. Loading photographs from a
    camera into a document system on the remote side stops working. A phone attached by
    a cable stops being visible in the session.

    Two things are worth telling apart at once, because the question comes up right
    after the rollout. Portable storage attached by a universal connector is not handled
    by this mechanism but by drive redirection - that route stays as a rule of its own
    has set it. Printers likewise have a setting of their own and this item does not
    change them.

    The replacement is usually handling the device on the machine it is attached to and
    moving the file alone. That is one step more, but for most uses a workable one.

    There is no restart, but sessions already open keep their redirected devices until
    they disconnect.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Skanowanie dokumentu wprost do programu uruchomionego w sesji zdalnej przestaje działać
      - Aparat fotograficzny i telefon podłączone przewodem przestają być widoczne po stronie zdalnej
      - Sterownik urządzenia nie zostanie zainstalowany po stronie zdalnej przy nawiązaniu sesji
      - Przekierowanie dysków i drukarek pozostaje bez zmian, bo ma własne ustawienia
    en:
      - Scanning a document straight into a program run in a remote session stops working
      - A camera and a phone attached by a cable stop being visible on the remote side
      - A device driver is not installed on the remote side when a session is opened
      - Drive and printer redirection stays unchanged, having settings of its own
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Skanowanie do programu uruchomionego zdalnie jest ustalonym tokiem pracy i nie ma zamiennika
      - Program po stronie zdalnej odczytuje dane wprost z urządzenia pomiarowego maszyny łączącej się
    en:
      - Scanning into a program run remotely is the established way of working and has no replacement
      - A program on the remote side reads data straight from a measuring device of the connecting machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisablePNPRedir'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisablePNPRedir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisablePNPRedir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Punkt jest w tej rodzinie najważniejszy i warto to powiedzieć wprost.
    Pozostałe ograniczenia przekierowań zamykają drogi przenoszenia danych;
    ten zamyka drogę uruchomienia kodu — instalacja sterownika po stronie
    zdalnej odbywa się z wysokimi uprawnieniami, a rozstrzyga o niej urządzenie
    po stronie łączącej się.

    Zakres jest węższy, niż sugeruje nazwa. Mechanizm obejmuje urządzenia
    zgłaszające się jako przenośne — aparaty, skanery, odtwarzacze. Pamięci
    przenośne idą przez przekierowanie dysków, a drukarki przez własne
    ustawienie; obie te drogi mają w tej paczce osobne reguły.

    Wpis jest częścią gałęzi wspólnej dla wszystkich ustawień pulpitu zdalnego,
    więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    This item is the weightiest of the family and that is worth saying outright. The
    other limits on redirection close routes for moving data; this one closes a route
    for running code - installing a driver on the remote side happens with high rights,
    and what settles it is a device on the connecting side.

    Its reach is narrower than the name suggests. The mechanism covers devices
    announcing themselves as portable - cameras, scanners, players. Portable storage
    goes through drive redirection and printers through a setting of their own; both
    those routes have rules of their own in this pack.

    The entry belongs to a key shared by every Remote Desktop setting, so rollback
    removes the entry alone.
