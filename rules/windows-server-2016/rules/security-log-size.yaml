id: win2016-security-log-size

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Security
  title:
    pl: Maksymalny rozmiar dziennika zabezpieczeń
    en: Maximum size of the security log
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę pojemności dziennika zabezpieczeń.

    Jest to reguła, od której zależy sens całego bloku inspekcji. Każda
    podkategoria opisana wcześniej generuje zdarzenia, a te muszą mieć gdzie
    trafić. Dziennik o domyślnym rozmiarze mieści na aktywnym serwerze kilka
    godzin historii — czyli tyle, że dochodzenie wszczęte następnego dnia
    zastaje już pustkę.

    Skutek jest podstępny, bo nie wygląda na awarię. Dziennik działa, zdarzenia
    są zapisywane, narzędzie pokazuje wpisy. Brakuje wyłącznie tych, po które
    się sięga — najstarszych, czyli tych z chwili, w której coś się zaczęło.

    Dlatego reguła ma kategorię wysoką, mimo że sama niczego nie blokuje.
    Nie chroni przed atakiem; chroni przed tym, żeby zapis ataku nie zniknął,
    zanim ktokolwiek go przeczyta.

    Wartość wymagana jest dolną granicą, nie celem. Na serwerze o dużym ruchu
    nadal może oznaczać godziny historii, a nie tygodnie. Właściwą miarą jest
    najstarszy wpis w dzienniku: jeżeli pochodzi sprzed kilku godzin, dziennik
    jest za mały niezależnie od tego, co mówi ta reguła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    zapis jego działań zostanie nadpisany przez zwykły ruch, zanim ktokolwiek
    zacznie go szukać.
  en: |
    The item sets a lower bound on the security log's capacity.

    It is the rule the sense of the whole audit block hangs on. Every subcategory
    described before generates events, and those must have somewhere to go. A log of
    the default size holds a few hours of history on a busy server - which is to say
    that an inquiry begun the next day finds emptiness already.

    The effect is insidious, because it does not look like a failure. The log works,
    events are written, the tool shows entries. Missing are only those one reaches
    for - the oldest, which is to say those from the moment something began.

    Hence the rule's high category, although it blocks nothing itself. It guards
    against no attack; it guards against the record of an attack vanishing before
    anybody reads it.

    The required value is a lower bound, not an aim. On a server with heavy traffic
    it can still mean hours of history rather than weeks. The proper measure is the
    oldest entry in the log: if it is a few hours old, the log is too small
    whatever this rule says.

    What an attacker gains while the item goes unmet: the certainty that the record
    of their doings will be overwritten by ordinary traffic before anybody begins
    looking for it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zwiększenie pojemności dziennika nie zmienia
    niczego w działaniu maszyny — jest to zajęcie miejsca na dysku i nic poza
    tym.

    Miejsce to jest rezerwowane stopniowo, w miarę zapisywania zdarzeń, a nie
    jednorazowo przy zmianie. Nie ma więc skoku zajętości w chwili wdrożenia
    i nie ma ryzyka, że zmiana od razu wypełni wolumin.

    Jedyny przypadek wart sprawdzenia dotyczy maszyn z bardzo ciasno
    wymierzonym woluminem systemowym, gdzie zapas liczony jest w pojedynczych
    gigabajtach. Tam warto spojrzeć na wolne miejsce przed zmianą — nie dlatego,
    że dziennik jest duży, tylko dlatego, że zapas jest mały.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, przekazywania
    zdarzeń do zbieracza ani wydajności maszyny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Enlarging the log's capacity alters nothing in the
    machine's working - it is the taking of room on a disk and nothing besides.

    That room is claimed gradually, as events are written, not all at once at the
    change. There is therefore no jump in occupancy at the moment of rollout and no
    risk of the change filling the volume straight away.

    The one case worth checking concerns machines with a very tightly measured
    system volume, where the spare room is counted in single gigabytes. There it is
    worth looking at the free space before the change - not because the log is
    large, but because the spare room is small.

    What this does not break: the writing of events, the reading of the log, the
    forwarding of events to a collector, or the machine's performance.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zwiększenie pojemności jest zajęciem miejsca na dysku i niczym poza tym
      - Miejsce jest rezerwowane stopniowo w miarę zapisywania zdarzeń, więc nie ma skoku zajętości przy wdrożeniu
      - Na woluminie systemowym z zapasem liczonym w pojedynczych gigabajtach warto spojrzeć na wolne miejsce przed zmianą
      - Zapisywanie zdarzeń, odczyt dziennika i przekazywanie do zbieracza działają bez zmian
    en:
      - No regression in the working - enlarging the capacity is the taking of disk room and nothing besides
      - The room is claimed gradually as events are written, so there is no jump in occupancy at rollout
      - On a system volume with spare room counted in single gigabytes it is worth looking at free space before the change
      - The writing of events, the reading of the log and forwarding to a collector work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumin systemowy jest wymierzony bardzo ciasno i nie ma na nim zapasu na dziennik tej wielkości
    en:
      - The system volume is measured very tightly and has no spare room for a log of that size
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog Security -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '196608'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is a floor, not a target. On a busy server it can still amount to hours
    # of history - measure the span by reading the oldest record in the log and
    # size it against that.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 196608 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/view-the-security-event-log

notes:
  pl: |
    Reguła powinna być wdrażana przed regułami inspekcji, a nie po nich.
    Kolejność odwrotna daje stan, w którym zdarzeń przybywa szybciej, niż
    dziennik jest w stanie pomieścić, i najstarsze znikają od pierwszego dnia.

    Porównanie jest typu „nie mniej niż", więc maszyna z dziennikiem większym
    niż wymagany jest zgodna. Jest to celowe: wartość z benchmarku to
    minimum, a nie zalecenie.

    Właściwym uzupełnieniem tej reguły jest wysyłanie zdarzeń poza maszynę.
    Dziennik lokalny o dowolnej wielkości pozostaje skończony, a zbieracz
    zewnętrzny przeżywa również ponowną instalację systemu.
  en: |
    The rule should be rolled out before the audit rules, not after them. The
    reverse order gives a state in which events accrue faster than the log can hold
    them, and the oldest vanish from the first day.

    The comparison is of the "not less than" kind, so a machine with a log larger
    than required is compliant. That is deliberate: the benchmark's value is a
    minimum, not a recommendation.

    The proper complement to this rule is sending events off the machine. A local
    log of any size remains finite, while an outside collector outlives even a
    reinstallation of the system.
