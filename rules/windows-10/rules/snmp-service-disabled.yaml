id: win10-snmp-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania siecią starszym protokołem wyłączona
    en: The service ordering the network by an older protocol switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę udostępniającą stan maszyny przez starszy
    protokół zarządzania siecią.

    Zastrzeżenie dotyczy sposobu uwierzytelniania. W powszechnie
    używanych wersjach protokołu rolę hasła pełni krótki ciąg wspólny dla
    całej sieci, przesyłany otwartym tekstem. Bywa on domyślny, bywa
    jeden dla wszystkich urządzeń i rzadko bywa zmieniany.

    Zagrożenie pierwsze to odczyt. Podanie właściwego ciągu daje
    szczegółowy opis maszyny: nazwę, wersję systemu, wykaz kart
    sieciowych, adresy, działające procesy, czasem nazwy kont.

    Zagrożenie drugie to zapis. Część wdrożeń zezwala na zmianę
    ustawień tą samą drogą, więc ten sam ciąg pozwala nie tylko czytać.

    Zagrożenie trzecie to podsłuch. Ciąg idzie przez sieć otwartym
    tekstem, więc każdy, kto widzi ruch, ma go za darmo.

    Ocena jest wysoka, bo połączenie szczegółowego opisu maszyny
    z hasłem przesyłanym jawnie daje napastnikowi rozpoznanie sieci
    niemal bez wysiłku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis
    maszyny za hasło przesyłane jawnie i wspólne dla całej sieci.
  en: |
    The setting switches off the service giving out the machine's state by an older protocol for the ordering of a
    network.

    The reservation touches the manner of warranting. In the widely used kinds of the protocol the part of a
    password is held by a short string shared across the whole network and sent in open writing. It is at times
    the one set by default, at times one for all the gear, and is seldom changed.

    The first danger is the reading. The giving of the right string yields a close setting out of the machine: its
    name, the version of the system, the roll of cards of network, the addresses, the workings afoot, at times the
    names of reckonings.

    The second danger is the writing. Some rollouts allow settings to be changed by that same road, so that same
    string lets one do more than read.

    The third danger is the listening in. The string goes over the network in open writing, so whoever sees the
    traffic has it for nothing.

    The grading is high, for the joining of a close setting out of the machine with a password sent openly gives
    an attacker a knowing of the network with next to no labour.

    What an attacker gains while the item goes unmet: a setting out of the machine for a password sent openly and
    shared across the whole network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest nadzór
    sieci.

    Miejscem pierwszym są systemy nadzoru odpytujące maszyny tym
    protokołem. Po zmianie maszyna zniknie z nadzoru: przestanie
    odpowiadać, a narzędzie zgłosi ją jako niedostępną. Rozpoznanie
    przyczyny bywa długie, bo objaw wygląda jak awaria maszyny.

    Miejscem drugim są zestawienia inwentaryzacyjne budowane tą drogą.
    Maszyna wypadnie z wykazu, a nikt tego nie zauważy do chwili, gdy
    wykaz będzie potrzebny.

    Odnotowuję, że składnik ten nie jest instalowany domyślnie. Na
    większości stanowisk usługi nie ma i wynik audytu to pokaże.

    Zastrzegam, że jeżeli nadzór faktycznie korzysta z tego protokołu,
    właściwym rozwiązaniem nie jest odpuszczenie punktu, tylko przejście
    na wersję z uwierzytelnianiem i szyfrowaniem.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: sieci, udostępniania plików, drukowania,
    logowania, pracy programów.
  en: |
    The class is "needs review", and the object of the review is the watching of the network.

    The first place is systems of watching that ask the machines by that protocol. After the change the machine
    will vanish from the watching: it will cease to answer and the tool will give it out as beyond reach. The
    knowing of the cause takes at times long, the sign of it looking like a breakdown of the machine.

    The second place is rolls of holdings built by that road. The machine will fall out of the roll and nobody
    will mark it until the hour the roll is needed.

    I set down that this part is not laid on by default. Upon most stations the service is not there and the
    outcome of the audit will show it.

    I set down that if the watching does truly use that protocol, the right answer is not the letting go of the
    item but the passing to the kind that warrants and enciphers.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the network, the giving out of files, printing, logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Systemy nadzoru odpytujące maszynę tym protokołem zgłoszą ją jako niedostępną
      - Objaw wygląda jak awaria maszyny, więc rozpoznanie przyczyny bywa długie
      - Zestawienia inwentaryzacyjne budowane tą drogą stracą tę maszynę, a zauważy się to późno
      - Przy faktycznym korzystaniu z protokołu właściwym rozwiązaniem jest przejście na wersję z uwierzytelnianiem, a nie odpuszczenie punktu
      - Sieć, udostępnianie plików, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - Systems of watching asking the machine by that protocol will give it out as beyond reach
      - The sign of it looks like a breakdown of the machine, so the knowing of the cause takes at times long
      - Rolls of holdings built by that road will lose this machine, and it will be marked late
      - Where the protocol is truly used the right answer is the passing to the kind that warrants and not the letting go of the item
      - The network, the giving out of files, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nadzór sieci odpytuje tę maszynę tym protokołem i nie ma na niej innego agenta
    en:
      - The watching of the network asks this machine by that protocol and has no other agent upon it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service takes the machine out of every watching that reaches it
    # by this protocol.
    Stop-Service -Name 'SNMP' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SNMP' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SNMP' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/snmp/snmp-top

notes:
  pl: |
    Reguła bywa odpuszczana ze względu na nadzór i warto, żeby aplikacja
    od razu pokazała właściwą alternatywę. Jeżeli nadzór korzysta z tego
    protokołu, rozwiązaniem nie jest zostawienie starej wersji, tylko
    przejście na wersję z uwierzytelnianiem i szyfrowaniem.

    Argument wart postawienia dotyczy hasła. Rolę hasła pełni krótki ciąg
    wspólny dla całej sieci, przesyłany otwartym tekstem i rzadko
    zmieniany. Kto widzi ruch, ma go za darmo.

    Odnotowuję zakres odczytu, bo to on decyduje o wysokiej ocenie:
    nazwa maszyny, wersja systemu, karty sieciowe, adresy, działające
    procesy, czasem nazwy kont — czyli gotowe rozpoznanie.
  en: |
    The rule is at times let go for the sake of the watching, and it is well that the application show at once the
    right way instead. If the watching uses that protocol, the answer is not the leaving of the old kind but the
    passing to the kind that warrants and enciphers.

    The argument worth putting touches the password. The part of a password is held by a short string shared
    across the whole network, sent in open writing and seldom changed. Whoever sees the traffic has it for
    nothing.

    I set down the reach of the reading, that being what settles the high grading: the machine's name, the version
    of the system, the cards of network, the addresses, the workings afoot, at times the names of reckonings -
    which is to say a knowing ready made.
