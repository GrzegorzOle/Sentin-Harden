id: iis-webdav-authoring-disabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Basic Configurations
  title:
    pl: Zapis plików przez WebDAV wyłączony
    en: Writing files over WebDAV switched off

  level: 1
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    WebDAV rozszerza protokół HTTP o operacje, których ten pierwotnie nie miał:
    zapisanie pliku, przeniesienie, skasowanie, założenie katalogu, zablokowanie
    zasobu na czas edycji. Powstał po to, żeby dało się edytować zawartość
    serwisu bezpośrednio przez to samo połączenie, którym się go czyta.

    Co to odbiera atakującemu: drogę zapisu na serwer przez ten sam port, który
    i tak jest otwarty. Gdy WebDAV jest włączony, wgranie pliku nie wymaga ani
    dostępu do pulpitu zdalnego, ani udziału sieciowego, ani żadnej luki —
    wystarczy żądanie HTTP z odpowiednią metodą. Jeśli przy tym uprawnienia do
    katalogu są luźniejsze, niż ktoś zakładał, albo uwierzytelnianie dopuszcza
    konto anonimowe, to jest gotowa droga do umieszczenia własnego kodu tam,
    skąd serwer go wykona.

    Po zmianie serwer odrzuca te operacje niezależnie od uprawnień do katalogu.
    Zwykłe czytanie stron działa bez zmian — wyłączane jest wyłącznie pisanie.
  en: |
    WebDAV extends HTTP with operations it did not originally have - writing a
    file, moving it, deleting it, creating a directory, locking a resource for the
    duration of an edit. It came about so that the contents of a site could be
    edited directly over the same connection by which it is read.

    What it takes away from an attacker - a road for writing to the server through
    the very port that is open anyway. Where WebDAV is on, uploading a file calls
    for neither remote desktop access nor a network share nor any flaw at all - an
    HTTP request with the right method suffices. If the permissions on the
    directory are looser than somebody assumed, or authentication admits the
    anonymous account, that is a ready road to placing one's own code where the
    server will execute it.

    After the change the server refuses those operations regardless of the
    permissions on the directory. Ordinary reading of pages works unchanged - only
    writing is switched off.

disruption_description:
  pl: |
    Sprawdzenie zaczyna się od pytania, czy ta funkcja w ogóle jest na maszynie.
    Nie instaluje się jej domyślnie, więc na większości serwerów punkt wyjdzie
    spełniony z tego prostego powodu, że nie ma czego wyłączać.

    Jeśli jest zainstalowana i włączona, ktoś zrobił to celowo i trzeba ustalić
    po co. Są dwa typowe powody. Pierwszy to publikowanie zawartości serwisu
    wprost z narzędzia do edycji stron — wtedy wyłączenie odcina osobie
    redagującej jedyną drogę wgrania zmian i trzeba jej dać inną, zanim ta
    zniknie. Drugi to katalog udostępniony po to, żeby ludzie wrzucali do niego
    pliki przez przeglądarkę albo przez podpięty dysk sieciowy — wyłączenie
    sprawia, że dysk nadal się mapuje, ale zapis kończy się odmową.

    Objaw po stronie użytkownika jest mało czytelny: operacja kopiowania pliku
    kończy się błędem odmowy dostępu, co kieruje podejrzenia na uprawnienia,
    a nie na wyłączoną funkcję serwera. Warto o tym uprzedzić, zanim zgłoszenie
    trafi do kogoś, kto o zmianie nie wie.
  en: |
    The check starts by asking whether this feature is on the machine at all. It
    is not installed by default, so on most servers the item comes out met for the
    simple reason that there is nothing to switch off.

    Where it is installed and on, somebody did that deliberately and it must be
    established what for. There are two typical reasons. The first is publishing
    site contents straight from a page editing tool - switching it off then cuts
    off whoever edits from their only road for uploading changes, and they have to
    be given another before this one goes. The second is a directory shared so
    that people can drop files into it through a browser or a mapped network drive
    - switching it off leaves the drive still mapping, but writing ends in a
    refusal.

    The symptom on the user's side is not very legible - copying a file ends in an
    access denied error, which points suspicion at permissions rather than at a
    switched-off server feature. It is worth giving warning before the report
    reaches somebody who does not know about the change.

implementation_consequences:
  impact_areas:
    - web-server-services
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Publikowanie zawartości serwisu wprost z narzędzia do edycji stron przestaje działać
      - Dysk sieciowy podpięty do adresu serwisu nadal się mapuje, ale zapis na nim kończy się odmową dostępu
      - Błąd widziany przez użytkownika wskazuje na uprawnienia, nie na wyłączoną funkcję, więc zgłoszenie idzie w złą stronę
      - Zautomatyzowane wgrywanie plików przez to samo połączenie co odczyt przestaje się wykonywać
      - Czytanie stron, uwierzytelnianie i zawartość serwisu pozostają bez zmian
    en:
      - Publishing site contents straight from a page editing tool stops working
      - A network drive mapped to the site address still maps, but writing to it ends in an access denied error
      - The error the user sees points at permissions rather than at a switched-off feature, so the report goes the wrong way
      - Automated uploading of files over the same connection as the reading stops running
      - Reading pages, authentication and site contents are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwisy, w których redagujący publikują zawartość wprost przez to połączenie i nie mają innej drogi
      - Katalogi celowo wystawione do wrzucania plików przez przeglądarkę lub podpięty dysk sieciowy
    en:
      - Sites where editors publish contents straight over this connection and have no other road
      - Directories deliberately exposed for dropping files in through a browser or a mapped network drive
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          # An undeclared section means the feature was never installed, and here
          # that is the wanted state rather than a gap - the opposite of a
          # protection whose section is missing. It is reported under its own
          # name all the same, so the report says why the item is met.
          $declared = $null -ne (Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/webdav/authoring' -ErrorAction SilentlyContinue)
          if (-not $declared) { 'NOT_INSTALLED' }
          else {
            $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
              -Filter 'system.webServer/webdav/authoring' -Name 'enabled' -ErrorAction Stop
            $value = $raw
            if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
            if ($null -eq $value) { 'MISSING' }
            elseif ([bool]$value) { 'ENABLED' }
            else { 'AS_REQUIRED' }
          }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(AS_REQUIRED|NOT_INSTALLED)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $stamp = 'sentin-webdav-' + (Get-Date -Format 'yyyyMMddHHmmss')
    Backup-WebConfiguration -Name $stamp | Out-Null
    $declared = $null -ne (Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/webdav/authoring' -ErrorAction SilentlyContinue)
    $value = $null
    if ($declared) {
      $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter 'system.webServer/webdav/authoring' -Name 'enabled' -ErrorAction SilentlyContinue
      $value = $raw
      if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    }
    [pscustomobject]@{
      scope    = 'apphost'
      filter   = 'system.webServer/webdav/authoring'
      name     = 'enabled'
      declared = $declared
      value    = [string]$value
      backup   = $stamp
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and took a server configuration backup named $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Refuse rather than write into a section nobody declared. Setting a
    # property of an absent section reports success and changes nothing - and
    # here there is genuinely nothing to do, because an absent section means the
    # feature was never installed.
    $declared = $null -ne (Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/webdav/authoring' -ErrorAction SilentlyContinue)
    if (-not $declared) {
      throw 'The WebDAV publishing feature is not installed, so there is nothing to switch off.'
    }
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/webdav/authoring' -Name 'enabled' -Value $false

  rollback_command: |
    Import-Module WebAdministration -ErrorAction Stop
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.declared) {
      throw 'The section was absent before the change, so there is no earlier state to return to.'
    }
    $previous = $false
    if ($b.value -ne '' -and $null -ne $b.value) { $previous = [bool]::Parse($b.value) }
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/webdav/authoring' -Name 'enabled' -Value $previous

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/webdav/authoring/
  - https://learn.microsoft.com/iis/install/installing-publishing-technologies/installing-and-configuring-webdav-on-iis

notes:
  pl: |
    Tu brak sekcji znaczy coś innego niż przy ograniczeniu tempa żądań, i to
    rozróżnienie jest celowe. Tam sekcji brakowało, bo nie zainstalowano usługi
    dającej ochronę — więc ochrony nie było i punkt wychodził niespełniony.
    Tutaj brak sekcji znaczy, że nie zainstalowano funkcji stanowiącej ryzyko,
    czyli dokładnie to, o co w punkcie chodzi. Sprawdzenie zgłasza ten stan pod
    własną nazwą, zamiast zwracać zwykłe „spełnione", żeby w raporcie było
    widać różnicę między „wyłączone" a „nigdy nie zainstalowane".

    Reguła wyłącza zapis w konfiguracji serwera. Pełne usunięcie usługi roli
    jest operacją cięższą, nieodwracalną jednym poleceniem i wykraczającą poza
    ten punkt — jeśli funkcja nie jest potrzebna w ogóle, warto ją odinstalować
    osobno, świadomie i poza aplikacją.
  en: |
    Here an absent section means something different from what it meant for the
    request rate limit, and the distinction is deliberate. There the section was
    missing because the service providing the protection had not been installed -
    so the protection was absent and the item came out unmet. Here an absent
    section means the feature constituting the risk was not installed, which is
    exactly what the item is about. The check reports that state under a name of
    its own rather than returning a plain "met", so that the report shows the
    difference between "switched off" and "never installed".

    The rule switches writing off in the server configuration. Removing the role
    service entirely is a heavier operation, not undone by a single command and
    beyond this item - if the feature is not needed at all, it is worth
    uninstalling separately, deliberately and outside the application.
