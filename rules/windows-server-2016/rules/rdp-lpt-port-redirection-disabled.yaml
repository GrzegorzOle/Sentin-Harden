id: win2016-rdp-lpt-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów równoległych w sesji pulpitu zdalnego wyłączone
    en: Parallel port redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie portów równoległych stanowiska do sesji
    zdalnej. Program uruchomiony na serwerze przestaje widzieć port
    równoległy maszyny, z której ktoś się połączył.

    Jest to najlżejszy punkt spośród przekierowań i powód jest prosty: port
    równoległy zniknął ze sprzętu dawniej niż port szeregowy. Maszyny
    produkowane dziś nie mają go wcale, a tam gdzie jest, obsługuje zwykle
    jedno urządzenie kupione wiele lat temu i nadal działające.

    Rozpatrywać ten punkt należy więc nie jako zamknięcie drogi ataku, tylko
    jako sprzątanie. Przekierowanie, z którego nikt nie korzysta, utrzymuje
    otwarty kanał między maszyną kontrolowaną a niekontrolowaną i kawałek
    kodu sterownika, który ten kanał obsługuje. Zamknięcie zdejmuje jedno
    i drugie bez żadnej ceny.

    Warto przy tym rozróżnić dwie rzeczy, które brzmią podobnie. Ten punkt
    nie dotyczy drukowania w sesji zdalnej — drukarki przekierowuje się
    osobnym mechanizmem, niezależnym od portu, do którego są fizycznie
    podłączone. Dotyczy wyłącznie samego portu jako kanału, więc jego
    zamknięcie nie odcina drukowania nikomu, kto używa zwykłej drukarki
    sieciowej albo lokalnej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    kanał do urządzenia po stronie klienta, którego w praktyce już nie ma,
    i kod obsługujący przekierowanie, utrzymywany bez potrzeby.
  en: |
    The setting cuts off the attaching of the workstation's parallel ports to the
    remote session. A program running on the server ceases to see the parallel port
    of the machine somebody connected from.

    This is the lightest item among the redirections, and the reason is plain: the
    parallel port vanished from hardware earlier than the serial one. Machines built
    today have none at all, and where one is there it as a rule drives a single
    device bought many years ago and still working.

    The item should therefore be weighed not as the shutting of a road of attack but
    as tidying up. A redirection nobody uses keeps open a channel between a
    controlled machine and an uncontrolled one, and a piece of driver code handling
    that channel. Closing it takes both away at no price at all.

    Two things that sound alike are worth telling apart here. This item does not
    concern printing in a remote session - printers are redirected by a separate
    mechanism, independent of the port they are physically attached to. It concerns
    the port alone as a channel, so closing it cuts printing off from nobody using
    an ordinary network or local printer.

    What an attacker gains while the item goes unmet: not much - a channel to a
    device on the client's side that in practice is no longer there, and code
    handling the redirection, kept up without need.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", przy czym jest to klasa nadana z ostrożności,
    a nie z obserwacji. Na maszynach, na których to sprawdzano, nikt nie
    zauważył różnicy.

    Sprawdzić trzeba wyjątki, a te są nieliczne i rozpoznawalne. Drukarki
    igłowe używane do formularzy wielowarstwowych — w logistyce i księgowości
    nadal bywają jedynym sposobem wydruku dokumentu z kopią. Klucze
    sprzętowe starszych programów, podłączane do portu równoległego jako
    warunek uruchomienia. Sterowniki maszyn produkcyjnych przyjmujące
    polecenia tą drogą. Każdy z tych przypadków wiąże się ze sprzętem
    starszym niż serwer i z programem, którego nikt nie zamierza wymieniać.

    Jeżeli któryś zachodzi, jest znany konkretnej osobie i łatwo go wskazać.
    Jeżeli nie zachodzi — a tak jest zwykle — zmiana nie ma żadnego skutku
    odczuwalnego przez kogokolwiek.

    Objaw jest jednoznaczny: program w sesji nie znajduje portu i zgłasza
    brak urządzenia.

    Czego to nie psuje: drukowania w sesji zdalnej, które idzie osobnym
    mechanizmem; urządzeń podłączonych równolegle bezpośrednio do serwera;
    samej sesji zdalnej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though it is a class given out of caution rather
    than from observation. On the machines where this was checked nobody noticed a
    difference.

    What has to be checked are the exceptions, and these are few and recognisable.
    Dot matrix printers used for multi-part forms - in logistics and accounting they
    are at times still the only way of printing a document with a copy. Hardware
    keys of older programs, attached to the parallel port as the condition of their
    starting. Production machine controllers taking commands by this road. Each of
    these cases involves hardware older than the server and a program nobody means
    to replace.

    If one of them holds, it is known to a particular person and easily pointed out.
    If none holds - and as a rule none does - the change has no effect anybody will
    feel.

    The symptom is unambiguous: the program in the session does not find the port
    and reports a missing device.

    What this does not break: printing in a remote session, which goes by a separate
    mechanism; devices attached over a parallel link directly to the server; the
    remote session itself.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - printing
    - legacy-applications
  what_breaks:
    pl:
      - Program w sesji zdalnej przestaje znajdować port równoległy stanowiska i zgłasza brak urządzenia
      - Klucz sprzętowy starszego programu, podłączany do portu równoległego jako warunek uruchomienia, przestaje być widoczny w sesji
      - Sterowniki maszyn produkcyjnych przyjmujące polecenia tą drogą przestają je otrzymywać z sesji zdalnej
      - Drukowanie w sesji zdalnej idzie osobnym mechanizmem i pozostaje bez zmian, podobnie jak urządzenia podłączone bezpośrednio do serwera
    en:
      - A program in the remote session stops finding the workstation's parallel port and reports a missing device
      - A hardware key of an older program, attached to the parallel port as the condition of its starting, ceases to be visible in the session
      - Production machine controllers taking commands by this road stop receiving them from the remote session
      - Printing in a remote session goes by a separate mechanism and stays unchanged, as do devices attached directly to the server
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z sesji zdalnej obsługiwana jest drukarka igłowa do formularzy wielowarstwowych podłączona po stronie stanowiska
      - Program uruchamiany w sesji wymaga klucza sprzętowego podłączonego do portu równoległego maszyny łączącej się
    en:
      - A dot matrix printer for multi-part forms attached on the workstation's side is driven from a remote session
      - A program started in the session calls for a hardware key attached to the parallel port of the connecting machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableLPT'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableLPT'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableLPT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Punkt jest kandydatem na najtańszą zmianę w całym zestawie serwerowym:
    koszt zwykle zerowy, zysk porządkowy. Nie zmienia to jednak jego miejsca
    w macierzy — niskie ryzyko przy realnym, choć rzadkim, koszcie znaczy, że
    warto go zrobić przy okazji, a nie że warto o nim mówić osobno.

    Reguła idzie w parze z przekierowaniem portów szeregowych. Tam, gdzie
    używa się jednego, zwykle używa się i drugiego, więc obie decyzje zapadną
    naraz. Aplikacja powinna pokazywać je obok siebie.

    Rozróżnienie portu i drukowania warto powtórzyć w interfejsie, bo nazwa
    punktu sugeruje więcej, niż punkt robi. Obszar wpływu wskazuje na
    drukowanie i jest to wskazanie prawdziwe wyłącznie dla drukarek
    podłączonych do portu równoległego po stronie stanowiska — nie dla
    drukowania w sesji w ogóle.
  en: |
    The item is a candidate for the cheapest change in the whole server set: the
    cost as a rule nil, the gain one of order. That does not change its place in the
    matrix, though - low risk with a real if rare cost means it is worth doing along
    the way, not that it is worth speaking of apart.

    The rule goes in a pair with serial port redirection. Where one is used the
    other as a rule is too, so both decisions will fall together. The application
    should show them side by side.

    The telling apart of the port and of printing is worth repeating in the
    interface, since the item's name suggests more than the item does. The impact
    area points at printing, and that pointing is true for printers attached to a
    parallel port on the workstation's side alone - not for printing in a session at
    large.
