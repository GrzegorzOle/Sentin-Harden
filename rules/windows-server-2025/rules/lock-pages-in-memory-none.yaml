id: win2025-lock-pages-in-memory-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Blokowanie stron w pamięci nieprzyznane nikomu
    en: Lock pages in memory granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala procesowi zatrzymać własne dane w pamięci fizycznej
    i nie dopuścić do przeniesienia ich na dysk, gdy pamięci zaczyna
    brakować.

    Powstało z myślą o wydajności. Program, którego dane nigdy nie
    trafiają na dysk, pracuje przewidywalnie i nie zwalnia w chwili,
    gdy system porządkuje pamięć. Korzystają z tego przede wszystkim
    silniki baz danych.

    Skutkiem ubocznym jest jednak odjęcie systemowi możliwości
    zarządzania. Proces z tym prawem może zająć pamięć fizyczną i nie
    oddać jej, bo system nie ma jak go do tego zmusić. Przy odpowiedniej
    ilości — a na serwerze nie jest to trudne — reszta maszyny przestaje
    mieć czym pracować.

    Objaw jest przy tym mylący: system nie zgłasza braku pamięci, tylko
    zwalnia, zaczyna intensywnie korzystać z dysku i w końcu przestaje
    odpowiadać. Diagnoza prowadzi zwykle w stronę dysku albo sieci,
    a nie w stronę uprawnienia nadanego dawno temu.

    Na serwerze punkt ten jest trudniejszy niż na stanowisku roboczym,
    bo tutaj prawo to bywa nadane słusznie — silnik bazy danych używa
    go zgodnie z przeznaczeniem i z zaleceniem producenta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania serwera przez zajęcie pamięci fizycznej, bez sięgania po
    jakiekolwiek uprawnienie administracyjne.
  en: |
    The right lets a process hold its own data in physical memory and keep it from being moved
    to disk when memory starts running short.

    It came about with performance in mind. A program whose data never land on disk works
    predictably and does not slow at the moment the system puts memory in order. It is used
    above all by database engines.

    The side effect, though, is the taking away of the system's means of managing. A process
    with this right may take physical memory and not give it back, since the system has no way
    of forcing it to. At a sufficient amount - and on a server that is not hard - the rest of
    the machine is left with nothing to work with.

    The symptom is at that misleading: the system does not report a want of memory but slows,
    starts using the disk heavily and in the end stops answering. The diagnosis usually leads
    towards the disk or the network rather than towards a right granted long ago.

    On a server this item is harder than at a working station, since here the right is at times
    granted rightly - a database engine uses it as meant and as its maker advises.

    What an attacker gains while the item goes unmet: the means of halting the server by
    taking physical memory, without reaching for any administrative right.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze pracuje silnik bazy
    danych albo inne oprogramowanie skonfigurowane do korzystania z tego
    prawa, bo odebranie go zmieni sposób jego pracy.

    W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć.
    Na serwerze aplikacyjnym bywa jednak inaczej, i to zgodnie
    z zaleceniem producenta oprogramowania.

    Silnik bazy danych pozbawiony tego prawa zwykle nie przestaje
    działać. Uruchamia się, zgłasza w swoim dzienniku, że nie mógł
    zablokować stron, i przechodzi na tryb zwykły. Skutkiem jest
    pogorszenie wydajności, czasem znaczne, a nie awaria.

    Jest to ważne rozróżnienie: objaw nie polega na zatrzymaniu usługi,
    tylko na tym, że zaczyna ona działać wolniej, a przyczyna widoczna
    jest wyłącznie w dzienniku aplikacji, nie w dzienniku systemu.

    Część oprogramowania odmawia jednak startu bez tego prawa, jeżeli
    skonfigurowano je z wymaganiem blokowania stron. Wtedy usługa nie
    wstaje i objaw jest natychmiastowy.

    Kolejność wdrożenia jest więc taka: najpierw sprawdzić konfigurację
    aplikacji, potem odebrać prawo — a nie odwrotnie.
  en: |
    What needs checking is whether a database engine or other software configured to use this
    right works on this server, since taking it away will change how that software works.

    In the default state the list is empty and the mending has nothing to remove. On an
    application server it is at times otherwise, and that in keeping with the software maker's
    advice.

    A database engine deprived of this right usually does not stop working. It starts, reports
    in its own log that it could not lock pages, and passes to the ordinary mode. The effect is
    a worsening of performance, at times a marked one, rather than a breakdown.

    That is a weighty distinction: the symptom is not a service halting but its starting to
    work slower, and the cause shows only in the application's log, not in the system's.

    Some software, though, refuses to start without this right where it was configured to take
    the locking of pages. Then the service does not come up and the symptom is immediate.

    The order of the rollout is thus: first check the application's configuration, then take
    the right away - and not the other way about.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - virtualization-and-containers
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Silnik bazy danych zwykle działa dalej, ale wolniej, i zgłasza to we własnym dzienniku
      - Przyczyna widoczna jest wyłącznie w dzienniku aplikacji, a nie w dzienniku systemu
      - Oprogramowanie skonfigurowane z wymaganiem blokowania stron może odmówić startu
      - W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć
      - Pogorszenie wydajności bywa znaczne przy dużych zbiorach danych w pamięci
    en:
      - A database engine usually goes on working but slower, and reports it in its own log
      - The cause shows only in the application's log rather than in the system's
      - Software configured to take the locking of pages may refuse to start
      - In the default state the list is empty and the mending has nothing to remove
      - The worsening of performance is at times marked at large sets of data held in memory
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje silnik bazy danych skonfigurowany do blokowania stron zgodnie z zaleceniem producenta
      - Oprogramowanie krytyczne odmawia startu bez tego prawa i nie da się go przekonfigurować
    en:
      - A database engine configured to lock pages as its maker advises works on the server
      - Critical software refuses to start without this right and cannot be reconfigured
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeLockMemoryPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeLockMemoryPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeLockMemoryPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeLockMemoryPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeLockMemoryPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/lock-pages-in-memory

notes:
  pl: |
    Ocena uciążliwości jest tu wyższa niż w paczce stanowiska roboczego.
    Powodem jest to, że na serwerze aplikacyjnym prawo bywa nadane
    słusznie i zgodnie z zaleceniem producenta oprogramowania, a nie
    przez pomyłkę.

    Rozstrzygnięcie nie należy do aplikacji. Nadanie tego prawa jest
    zawsze wymianą: przewidywalność jednej usługi za odporność całej
    maszyny. Wymiana ta bywa opłacalna, ale ma być świadoma i zapisana
    jako wyjątek, a nie odziedziczona po instalatorze.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.
  en: |
    The judgement of disruption is higher here than in the working station's pack. The reason
    is that on an application server the right is at times granted rightly and in keeping with
    the software maker's advice rather than by mistake.

    The settling of it does not belong to the application. Granting this right is always an
    exchange: one service's predictability for the whole machine's soundness. That exchange is
    at times worth making, but it is to be knowing and recorded as an exception rather than
    inherited from an installer.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.
