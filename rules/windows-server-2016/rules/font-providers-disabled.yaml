id: win2016-font-providers-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Fonts
  title:
    pl: Pobieranie czcionek z sieci wyłączone
    en: Fetching fonts from the network switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza pobieranie brakujących czcionek z sieci w chwili,
    gdy okazują się potrzebne.

    Zagrożenie, o które tu chodzi, jest nieoczywiste i warto je wyłożyć.
    Czcionka nie jest obrazkiem. Plik czcionki zawiera instrukcje
    wykonywane przy składaniu tekstu — po to, żeby litery wyglądały dobrze
    w różnych rozmiarach. Instrukcje te wykonuje składnik systemu pracujący
    blisko jądra.

    Znaczy to, że otwarcie dokumentu żądającego nieznanej czcionki może
    sprowadzić na maszynę plik z instrukcjami i przekazać go do wykonania
    składnikowi o wysokich uprawnieniach. Ciąg zdarzeń zaczyna się od
    otwarcia dokumentu i nie wymaga od nikogo niczego więcej.

    Na serwerze droga ta jest szczególnie nie na miejscu, bo dokumentów się
    tam zwykle nie otwiera, a jeśli się otwiera, to w okolicznościach, które
    tym bardziej nie powinny sprowadzać niczego z sieci.

    Punkt nie dotyczy czcionek zainstalowanych na maszynie. Te działają
    dalej, tak samo jak dotąd.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    sprowadzenia na maszynę pliku z instrukcjami, uruchamianą samym
    otwarciem dokumentu.
  en: |
    The setting switches off the fetching of missing fonts from the network at the moment they prove
    needed.

    The threat here is not an obvious one and is worth setting out. A font is no picture. A font file
    holds instructions carried out while text is laid out - so that letters should look well at
    different sizes. Those instructions are carried out by a component of the system working close to
    the kernel.

    That means opening a document calling for an unknown font can bring onto the machine a file of
    instructions and hand it for carrying out to a component of high rights. The train of events begins
    with a document's opening and calls for nothing more from anybody.

    On a server that road is particularly out of place, documents not being opened there as a rule, and
    if they are, then in circumstances that ought all the more not to bring anything in from the
    network.

    The item does not concern fonts installed on the machine. Those work on, just as before.

    What an attacker gains while the item goes unmet: a road for bringing a file of instructions onto
    the machine, set going by the mere opening of a document.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze skutek jest zwykle żaden.

    Rzecz do sprawdzenia dotyczy dokumentów składanych na tej maszynie.
    Jeżeli serwer generuje raporty, faktury albo wydruki z szablonów, a te
    szablony wskazują czcionki spoza zestawu systemowego, skład zmieni się —
    system podstawi czcionkę zastępczą. Objawem jest inny wygląd wydruku,
    a nie błąd.

    Na maszynie, która dokumentów nie składa, zmiana nie robi nic.

    Warto powiedzieć, czego punkt nie zabiera, bo obawa przy nim bywa
    większa niż skutek. Nie zabiera czcionek już zainstalowanych ani
    możliwości zainstalowania nowych. Zabiera wyłącznie pobieranie ich
    w locie, bez niczyjej decyzji.

    Wniosek praktyczny: czcionka potrzebna do składu ma być zainstalowana,
    a nie sprowadzana za każdym razem. Jest to zresztą rozwiązanie lepsze
    także z innych powodów — skład przestaje zależeć od łączności.

    Czego to nie psuje: czcionek zainstalowanych, instalowania nowych,
    pracy systemu, usług, sieci, wydruku z czcionek obecnych na maszynie.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on a server the consequence is as a rule none.

    The thing to be reviewed concerns documents laid out on this machine. If the server makes reports,
    invoices or printouts from templates, and those templates name fonts from outside the system's own
    set, the layout will change - the system will put a substitute font in. The symptom is a different
    look to the printout rather than an error.

    On a machine that lays no documents out the change does nothing.

    It is worth saying what the item does not take away, the misgiving at it being at times greater than
    the consequence. It does not take away fonts already installed nor the possibility of installing new
    ones. It takes away solely their being fetched on the fly, at nobody's decision.

    The practical conclusion: a font needed for layout is to be installed rather than fetched every
    time. That is besides the better arrangement for other reasons too - the layout ceases to hang on
    connectivity.

    What this does not break: installed fonts, the installing of new ones, the system's working,
    services, the network, or printing from fonts present on the machine.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - user-interface
    - printing
  what_breaks:
    pl:
      - Serwer składający raporty albo wydruki z szablonów wskazujących czcionki spoza zestawu systemowego podstawi czcionkę zastępczą
      - Objawem jest inny wygląd wydruku, a nie błąd, więc przyczyna bywa szukana w szablonie
      - Czcionki już zainstalowane działają dalej, a instalowanie nowych pozostaje możliwe
      - Praca systemu, usługi, sieć i wydruk z czcionek obecnych na maszynie pozostają bez zmian
    en:
      - A server laying out reports or printouts from templates naming fonts outside the system's own set will put a substitute font in
      - The symptom is a different look to the printout rather than an error, so the cause is at times looked for in the template
      - Fonts already installed work on, and the installing of new ones stays possible
      - The system's working, services, the network and printing from fonts present on the machine stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna składa dokumenty z szablonów wskazujących czcionki spoza zestawu systemowego i wygląd wydruku ma znaczenie
      - Nie ustalono, które czcionki są potrzebne do składu, żeby zainstalować je zawczasu
    en:
      - The machine lays out documents from templates naming fonts outside the system's own set and the printout's look matters
      - It has not been established which fonts are needed for the layout, so as to install them beforehand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableFontProviders'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableFontProviders'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A font is not a picture: it holds instructions carried out while text is
    # laid out, processed by a component working close to the kernel. Without
    # this, such a file reaches the server through the mere opening of a
    # document. Fonts installed by hand are untouched.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFontProviders' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-grouppolicy

notes:
  pl: |
    Punkt jest piąty w bloku i odwraca jego kierunek. Cztery poprzednie
    dotyczyły tego, co maszyna wysyła; ten dotyczy tego, co po cichu
    pobiera — i pobiera w postaci, która jest wykonywana.

    Rozróżnienie między czcionką a obrazkiem jest tu całą treścią
    uzasadnienia i bez niego reguła wygląda na drobiazg estetyczny.
    Warto je postawić na początku opisu, bo czytelnik, który zobaczy
    „pobieranie czcionek", nie ma powodu podejrzewać, że chodzi o kod.

    Kategoria średnia odzwierciedla to, że droga ta wymaga otwarcia
    dokumentu — a więc jednego warunku dodatkowego, którego napastnik sam
    nie spełni. Na maszynie, na której dokumentów nikt nie otwiera, wartość
    tego punktu jest głównie porządkowa.

    Odnotowuję, że wartość leży w tej samej gałęzi rejestru co ustawienia
    dotyczące kontynuowania pracy między urządzeniami. Jest to gałąź
    zbierająca rzeczy o różnym przeznaczeniu i warto o tym pamiętać przy
    czytaniu kopii zapasowej: usunięcie całego klucza przy wycofywaniu
    zmiany dotknęłoby ustawień niezwiązanych.
  en: |
    The item is the fifth in the block and turns its direction about. The four before it concerned what
    the machine sends; this one concerns what it quietly fetches - and fetches in a form that is carried
    out.

    The distinction between a font and a picture is here the whole substance of the warrant, and without
    it the rule looks like an aesthetic trifle. It is worth putting at the description's beginning, a
    reader who sees "fetching fonts" having no cause to suspect that code is at stake.

    The medium category reflects that the road calls for a document to be opened - which is to say one
    further condition the attacker will not meet by themselves. On a machine where nobody opens
    documents this item's value is chiefly one of order.

    Worth noting that the value lies in the same branch of the registry as the settings about continuing
    work across devices. It is a branch gathering things of different purposes, and that is worth
    keeping in mind when reading the backup: removing the whole key when undoing the change would touch
    unrelated settings.
