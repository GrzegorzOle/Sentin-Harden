id: win2016-certificate-rules-for-executables

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Reguły oparte o certyfikat stosowane do plików wykonywalnych
    en: Rules resting on a certificate applied to executable files
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że mechanizm ograniczający uruchamianie programów
    bierze pod uwagę również reguły oparte o certyfikat podpisujący, a nie
    wyłącznie ścieżkę i sumę kontrolną pliku.

    Rzecz dotyczy trwałości reguł, a nie samego ich istnienia. Reguła
    wskazująca ścieżkę przestaje obowiązywać, gdy plik zostanie przeniesiony.
    Reguła wskazująca sumę kontrolną przestaje obowiązywać, gdy plik
    zostanie zaktualizowany. Reguła wskazująca certyfikat obowiązuje, dopóki
    podpis się zgadza — niezależnie od położenia pliku i jego wersji.

    Dla zezwoleń znaczy to mniej kłopotu w utrzymaniu. Dla zakazów znaczy
    to, że zakaz nie da się obejść przez przeniesienie pliku albo drobną
    zmianę jego zawartości, a jest to najtańsze obejście, jakie istnieje.

    Zastrzeżenie o uczciwości jest tu istotne. Ustawienie samo w sobie nie
    ogranicza niczego. Włącza rozpatrywanie pewnego rodzaju reguł, a jeżeli
    takich reguł nikt nie napisał, nie dzieje się nic. Jest to punkt
    przygotowujący grunt, nie punkt broniący.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tam, gdzie
    reguły oparte o certyfikat istnieją — możliwość ich pominięcia; tam,
    gdzie nie istnieją — nic.
  en: |
    The setting has the mechanism limiting the running of programs take rules
    resting on the signing certificate into account as well, and not the file's path
    and checksum alone.

    The matter concerns the durability of rules rather than their existence. A rule
    naming a path ceases to hold once the file is moved. A rule naming a checksum
    ceases to hold once the file is updated. A rule naming a certificate holds so
    long as the signature agrees - whatever the file's place and version.

    For permissions that means less trouble in upkeep. For prohibitions it means a
    prohibition cannot be got round by moving the file or by a small change to its
    contents, and that is the cheapest way round there is.

    The reservation about honesty matters here. The setting limits nothing by
    itself. It switches on the weighing of a certain kind of rule, and if nobody has
    written such rules, nothing happens. It is an item preparing the ground rather
    than an item defending.

    What an attacker gains while the item goes unmet: where rules resting on a
    certificate exist - the means of passing them by; where they do not exist -
    nothing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia zależy wprost od
    tego, czy na maszynie istnieją jakiekolwiek reguły ograniczające
    uruchamianie.

    Na maszynie bez takich reguł zmiana nie robi nic i jest wyłącznie
    przygotowaniem. Na maszynie z regułami zmiana rozszerza zakres ich
    rozpatrywania, a to znaczy, że część programów zacznie być oceniana
    inaczej niż dotąd.

    Skutkiem możliwym, choć niecodziennym, jest zablokowanie programu, który
    dotąd przechodził. Dzieje się tak wtedy, gdy istnieje reguła zakazująca
    oparta o certyfikat, a program jest tym certyfikatem podpisany —
    wcześniej reguła była pomijana.

    Rzecz druga dotyczy obciążenia. Sprawdzanie podpisu przy każdym
    uruchomieniu kosztuje więcej niż porównanie ścieżki, a przy plikach
    dużych albo leżących na udziale sieciowym bywa zauważalne przy starcie.

    Rzecz trzecia, warta wymienienia: podpis wygasły albo odwołany zmienia
    wynik oceny bez żadnej zmiany po stronie pliku. Program działający od
    lat potrafi zostać zablokowany w dniu, w którym certyfikat przestał być
    ważny.

    Czego to nie psuje: programów niepodlegających żadnej regule, usług,
    logowania, sieci.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check turns directly on whether
    any rules limiting the running of programs exist on the machine at all.

    On a machine without such rules the change does nothing and is a preparation
    alone. On a machine with rules the change widens the range of what is weighed,
    and that means some programs will begin to be judged otherwise than before.

    A possible consequence, though not an everyday one, is the blocking of a program
    that passed until now. That happens where a prohibiting rule resting on a
    certificate exists and the program is signed by that certificate - the rule
    having been passed over before.

    The second thing is the load. Checking a signature at every start costs more
    than comparing a path, and with large files, or files lying on a network share,
    it is at times noticeable at the start.

    The third thing, worth naming: a signature expired or revoked changes the
    judgement with no change at all on the file's side. A program working for years
    can be blocked on the day its certificate ceased to be valid.

    What this does not break: programs subject to no rule, services, signing in, or
    the network.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - encryption-and-tls
  what_breaks:
    pl:
      - Program przechodzący dotąd zostaje zablokowany, jeżeli istnieje reguła zakazująca oparta o certyfikat, którym jest podpisany
      - Sprawdzanie podpisu przy każdym uruchomieniu kosztuje więcej niż porównanie ścieżki i bywa zauważalne przy plikach dużych lub leżących na udziale sieciowym
      - Podpis wygasły albo odwołany zmienia wynik oceny bez żadnej zmiany po stronie pliku
      - Programy niepodlegające żadnej regule, usługi i logowanie pozostają bez zmian
    en:
      - A program that passed until now is blocked where a prohibiting rule resting on the certificate it is signed by exists
      - Checking a signature at every start costs more than comparing a path and is at times noticeable with large files or files on a network share
      - A signature expired or revoked changes the judgement with no change at all on the file's side
      - Programs subject to no rule, services and signing in stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje program podpisany certyfikatem objętym istniejącą regułą zakazującą i nie sprawdzono, co się z nim stanie
      - Maszyna uruchamia duże pliki wykonywalne z udziału sieciowego i opóźnienie startu byłoby odczuwalne
    en:
      - A program signed by a certificate covered by an existing prohibiting rule works on the machine and it has not been checked what will become of it
      - The machine starts large executables from a network share and a delay at the start would be felt
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
      $name = 'AuthenticodeEnabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
    $name = 'AuthenticodeEnabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AuthenticodeEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/hh994606(v=ws.11)

notes:
  pl: |
    Punkt jest jednym z nielicznych w zestawie, które same z siebie nie
    bronią przed niczym. Włączają rozpatrywanie reguł, a regułom trzeba
    nadać treść osobno. Warto to powiedzieć wprost, bo inaczej zgodność
    w tym punkcie zostanie odczytana jako ograniczenie uruchamiania, którego
    na maszynie nie ma.

    Kategoria średnia bierze się właśnie stąd. Punkt podnosi trwałość
    istniejących reguł i utrudnia najtańsze obejście, ale nie zamyka drogi
    samodzielnie.

    Zależność od ważności certyfikatu jest tu rzeczą wartą osobnej
    wzmianki. Ocena programu przestaje zależeć wyłącznie od jego zawartości
    i zaczyna zależeć od czegoś, co zmienia się poza maszyną. Jest to cecha
    mechanizmu, nie usterka, ale prowadzi do awarii, których przyczyna leży
    poza systemem i dlatego bywa trudna do odnalezienia.
  en: |
    The item is one of the few in the set that guard against nothing on their own.
    They switch on the weighing of rules, and the rules have to be given substance
    apart. That is worth saying outright, since otherwise compliance at this item
    will be read as a limit on the running of programs that the machine does not
    have.

    The medium category comes precisely from there. The item raises the durability
    of existing rules and makes the cheapest way round harder, but shuts no road on
    its own.

    The dependence on a certificate's validity deserves a mention of its own here. A
    program's judgement ceases to rest on its contents alone and begins to rest on
    something that changes outside the machine. That is a trait of the mechanism
    rather than a fault, but it leads to breakdowns whose cause lies outside the
    system and is for that reason at times hard to find.
