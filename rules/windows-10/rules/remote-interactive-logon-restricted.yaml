id: win10-remote-interactive-logon-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie przez pulpit zdalny ograniczone do administratorów i grupy pulpitu zdalnego
    en: The signing in through the remote desktop bounded to administrators and the group of the remote desktop
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo logowania przez pulpit zdalny do
    administratorów i grupy użytkowników pulpitu zdalnego.

    Pulpit zdalny jest wejściem, które łączy dwie właściwości groźne razem:
    daje pełną sesję graficzną, jak logowanie przy maszynie, i dostępny
    jest z sieci, jak udział plikowy. Napastnik, który zdobył
    poświadczenia, dostaje przez nie nie plik, tylko pulpit.

    Wartością jest zamknięcie wykazu. Prawo to bywa nadawane doraźnie,
    przy pojedynczej sprawie wymagającej zdalnej pomocy, i nie bywa
    odbierane. Po kilku latach wykaz zawiera konta, o których nikt już nie
    pamięta, dlaczego się tam znalazły.

    Odnotowuję, że punkt nie wyłącza samej usługi pulpitu zdalnego ani nie
    zmienia jej ustawień. Rozstrzyga wyłącznie, kto może się przez nią
    zalogować.

    Sprawdzenie przyjmuje wykaz zawężony do samych administratorów,
    a także pusty — maszyna bez zdalnego dostępu nie jest niezgodna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełną sesję
    graficzną z sieci, na poświadczeniach dowolnego konta.
  en: |
    The setting bounds the right of signing in through the remote desktop to the administrators and to the group
    of the users of the remote desktop.

    The remote desktop is a way in that joins two properties dangerous together: it gives a full session with a
    face, as the signing in at a machine does, and stands open from the network, as a file share does. An attacker
    who has won credentials gets through it not a file but a desktop.

    The worth lies in the shutting of the list. That right is at times granted as need arises, at a single matter
    calling for help from afar, and is at times not taken back. After some years the list holds accounts nobody
    any longer calls to mind the reason for.

    I set down that the item switches off neither the service of the remote desktop itself nor changes its
    settings. It settles solely who may sign in through it.

    The check takes a list narrowed to the administrators alone, and an empty one too - a machine with no way in
    from afar is not out of compliance.

    What an attacker gains while the item goes unmet: a full session with a face from the network, upon the
    credentials of any account at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, kto
    faktycznie łączy się z tą maszyną zdalnie.

    Miejscem najczęstszym są konta wsparcia — własnego i dostawcy
    oprogramowania. Bywają one poza grupą pulpitu zdalnego, bo nadano im
    prawo wprost. Po zmianie takie konto nie zaloguje się zdalnie,
    a osoba po drugiej stronie zobaczy odmowę bez wyjaśnienia przyczyny.

    Miejscem drugim są stanowiska, przy których ktoś pracuje wyłącznie
    zdalnie: praca z domu, obsługa maszyny w innej lokalizacji. Odebranie
    prawa odcina tę osobę od jej stanowiska całkowicie.

    Sprawdzenie polega na wypisaniu kont łączących się z maszyną zdalnie
    w ostatnim czasie i porównaniu ich z wykazem, a następnie dopisaniu
    tych, które mają zostać, do grupy pulpitu zdalnego zamiast do wykazu
    wprost.

    Skutek jest widoczny dla użytkownika: próba połączenia kończy się
    odmową z komunikatem mówiącym o braku prawa do logowania zdalnego.

    Skutek pojawia się przy następnym połączeniu. Sesje trwające nie są
    przerywane.

    Czego to nie psuje: pracy przy maszynie, dostępu do udziałów
    plikowych, usług, zadań zaplanowanych, drukowania.
  en: |
    The class is "needs review", and the object of the review is who truly joins themselves to this machine from
    afar.

    The commonest place is accounts of support - one's own and a maker of software's. They stand at times outside
    the group of the remote desktop, the right having been granted them outright. After the change such an account
    will not sign in from afar, and whoever stands upon the other side will see a refusal without a setting out of
    the ground.

    The second place is stations at which somebody works from afar alone: work from home, the handling of a
    machine in another place. The taking of the right cuts that person off from their station wholly.

    The review comes down to a writing out of the accounts that have lately joined themselves to the machine from
    afar and a setting of them beside the list, and then to the adding of those that are to stay to the group of
    the remote desktop rather than to the list outright.

    The consequence is plain to the user: an attempt at joining ends in a refusal with a message speaking of a
    right of signing in from afar that is wanting.

    The consequence shows at the next joining. Sessions at work are not broken off.

    What this does not break: work at the machine, the way to file shares, services, tasks set in the timetable,
    or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Konta wsparcia własnego i dostawcy oprogramowania nie zalogują się zdalnie, jeżeli są poza grupą pulpitu zdalnego
      - Osoba pracująca wyłącznie zdalnie zostanie odcięta od swojego stanowiska całkowicie
      - Użytkownik zobaczy odmowę z komunikatem o braku prawa do logowania zdalnego
      - Konta, które mają zostać, warto dopisać do grupy pulpitu zdalnego zamiast do wykazu wprost
      - Praca przy maszynie, dostęp do udziałów plikowych, usługi i drukowanie pozostają bez zmian
    en:
      - Accounts of one s own support and of a maker of software will not sign in from afar where they stand outside the group of the remote desktop
      - Somebody working from afar alone will be cut off from their station wholly
      - The user will see a refusal with a message about a right of signing in from afar that is wanting
      - Accounts that are to stay are best added to the group of the remote desktop rather than to the list outright
      - Work at the machine, the way to file shares, services and printing stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś pracuje przy tej maszynie wyłącznie zdalnie i jego konto jest poza grupą pulpitu zdalnego
      - Dostawca oprogramowania łączy się z maszyną zdalnie na koncie, któremu prawo nadano wprost
    en:
      - Somebody works at this machine from afar alone and their account stands outside the group of the remote desktop
      - A maker of software joins itself to the machine from afar upon an account granted the right outright
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544,S-1-5-32-555|S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRemoteInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRemoteInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the group of the remote
    # desktop. A list narrower than that meets the item too.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRemoteInteractiveLogonRight = *S-1-5-32-544,*S-1-5-32-555',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRemoteInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/allow-log-on-through-remote-desktop-services

notes:
  pl: |
    Reguła jest trzecią z rodziny praw logowania, obok lokalnego
    i sieciowego, i warto, żeby aplikacja pokazała całą trójkę razem.
    Każda z nich opisuje inną drogę wejścia, a zamknięcie jednej przy
    otwartych pozostałych daje mniej, niż się wydaje.

    Argument wart postawienia wprost dotyczy tego, dlaczego pulpit zdalny
    jest wśród nich najgroźniejszy. Dostęp sieciowy daje plik, logowanie
    lokalne wymaga obecności przy maszynie. Pulpit zdalny daje to, co
    lokalne, z odległości dowolnej — jest więc połączeniem najlepszego
    z obu stron, z punktu widzenia napastnika.

    Odnotowuję zalecenie praktyczne: konta, które mają zostać, lepiej
    dopisać do grupy pulpitu zdalnego niż do wykazu wprost. Wykaz jest
    rzadko czytany, a członkostwo w grupie widać przy każdym przeglądzie
    kont — i łatwiej je odebrać, gdy powód znika.
  en: |
    The rule is the third of the family of rights of signing in, beside the local and the network one, and it is
    well that the application show all three together. Each of them sets out another road in, and the shutting of
    one with the rest left open gives less than it seems.

    The argument worth putting outright touches why the remote desktop is among them the gravest. The way in over
    the network gives a file; the local signing in calls for a being present at the machine. The remote desktop
    gives what the local gives from any distance at all - it is therefore the joining of the best of both sides,
    from an attacker's seat.

    I set down a counsel of practice: accounts that are to stay are better added to the group of the remote
    desktop than to the list outright. A list is seldom read, while membership of a group is seen at every going
    through of accounts - and is the easier taken back when the ground for it falls away.
