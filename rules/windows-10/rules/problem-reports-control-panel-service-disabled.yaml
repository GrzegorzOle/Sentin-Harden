id: win10-problem-reports-control-panel-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi panelu zgłoszeń o problemach wyłączona
    en: The service backing the panel of reports of troubles switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę obsługującą okno, w którym użytkownik
    przegląda zgłoszenia o problemach zebrane na maszynie.

    Jest to warstwa przeglądania, nie zbierania. Zgłoszenia powstają
    niezależnie od niej; ta usługa pozwala je obejrzeć, wysłać ręcznie
    albo sprawdzić, czy producent odesłał rozwiązanie.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Nie zamyka
    drogi wejścia i nie broni przed niczym konkretnym. Zdejmuje jedną
    usługę z zestawu uruchamianych domyślnie.

    Znaczenie ma natomiast to, co okno pokazuje. Wykaz awarii z maszyny
    jest opisem tego, co na niej stoi i co się psuje — czyli wskazówką,
    gdzie szukać słabego miejsca. Okno to jest dostępne dla użytkownika
    bez uprawnień.

    Odnotowuję, że punkt ma sens przede wszystkim jako uzupełnienie
    wyłączenia zgłaszania błędów. Sam z siebie zostawia zbieranie
    nietknięte.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykaz
    awarii maszyny dostępny bez uprawnień.
  en: |
    The setting switches off the service backing the window in which a user looks over the reports of troubles
    gathered upon the machine.

    It is a layer of looking over and not of gathering. The reports come about without it; this service lets them
    be looked at, sent by hand, or checked for an answer sent back by the maker.

    The grading is low and the item is to be put forward as such. It shuts no road in and guards against nothing
    in particular. It takes one service out of the set that is set going by default.

    What has weight, however, is what the window shows. A roll of a machine's breakdowns is a setting out of what
    stands upon it and what goes wrong - which is to say a pointer to where a weak place is to be sought. That
    window is to be had by a user without rights.

    I set down that the item has its sense above all as the filling out of the switching off of the reporting of
    faults. Of itself it leaves the gathering untouched.

    What an attacker gains while the item goes unmet: a roll of the machine's breakdowns to be had without rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć sprawdzenie jest tu krótkie.

    Miejscem wartym uwagi jest dział wsparcia proszący użytkownika,
    żeby otworzył okno zgłoszeń i odczytał, co się wydarzyło. Po zmianie
    okno będzie puste albo nie otworzy się w ogóle.

    Odnotowuję, że zgłoszenia nadal powstają, jeżeli usługa zgłaszania
    błędów działa. Traci się wyłącznie wygodny sposób ich obejrzenia,
    a dzienniki zdarzeń systemu zostają nietknięte i zawierają te same
    awarie opisane inaczej.

    Zastrzegam, że wdrożenie tego punktu bez punktu o zgłaszaniu błędów
    jest połowiczne: zbieranie i wysyłanie działa dalej, znika tylko
    okno.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy programów, dzienników zdarzeń systemu,
    zbierania zgłoszeń, logowania, drukowania, dostępu do sieci.
  en: |
    The class is "needs review", though the review is here a short one.

    The place worth notice is a board of help that asks a user to open the window of reports and read what came to
    pass. After the change the window will stand empty or will not open at all.

    I set down that the reports still come about, if the service of the reporting of faults works. What is lost is
    solely a handy manner of looking at them, and the system's records of happenings stay untouched and hold those
    same breakdowns set out otherwise.

    I set down that the rolling out of this item without the item about the reporting of faults is by halves: the
    gathering and the sending work on, and only the window goes.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the work of programs, the system's records of happenings, the gathering of reports,
    logging on, printing, or the reach of the network.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
    - logging-and-audit
  what_breaks:
    pl:
      - Okno zgłoszeń o problemach będzie puste albo nie otworzy się w ogóle
      - Dział wsparcia proszący użytkownika o odczytanie zgłoszenia straci tę drogę
      - Dzienniki zdarzeń systemu zostają nietknięte i zawierają te same awarie opisane inaczej
      - Wdrożenie tego punktu bez punktu o zgłaszaniu błędów jest połowiczne, bo zbieranie działa dalej
      - Praca programów, zbieranie zgłoszeń, logowanie, drukowanie i dostęp do sieci pozostają bez zmian
    en:
      - The window of reports of troubles will stand empty or will not open at all
      - A board of help that asks a user to read out a report will lose that road
      - The system s records of happenings stay untouched and hold those same breakdowns set out otherwise
      - The rolling out of this item without the item about the reporting of faults is by halves, the gathering working on
      - The work of programs, the gathering of reports, logging on, printing and the reach of the network stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dział wsparcia prowadzi użytkownika przez okno zgłoszeń przy diagnozowaniu awarii
    en:
      - A board of help leads the user through the window of reports at the telling of the cause of a breakdown
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\wercplsupport'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\wercplsupport'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'wercplsupport' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'wercplsupport' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'wercplsupport' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Reguła jest dopełnieniem punktu o zgłaszaniu błędów i warto, żeby
    aplikacja pokazała je razem. Wdrożona sama zostawia zbieranie
    i wysyłanie nietknięte — znika wyłącznie okno, w którym użytkownik
    to oglądał.

    Argument wart zachowania dotyczy tego, co okno pokazuje. Wykaz awarii
    z maszyny opisuje, co na niej stoi i co się psuje. Jest dostępny bez
    uprawnień, więc jest to informacja, którą zdobywa się przy maszynie
    bez żadnego wysiłku.

    Odnotowuję, że dzienniki zdarzeń systemu zawierają te same awarie.
    Warto to powiedzieć, bo punkt bywa odrzucany zdaniem „stracimy ślad
    po awariach", a ślad zostaje — traci się wygodny widok.
  en: |
    The rule is the filling out of the item about the reporting of faults, and it is well that the application
    show them together. Rolled out alone it leaves the gathering and the sending untouched - only the window in
    which the user looked at them goes.

    The argument worth keeping touches what the window shows. A roll of a machine's breakdowns sets out what
    stands upon it and what goes wrong. It is to be had without rights, so it is word got at the machine with no
    labour at all.

    I set down that the system's records of happenings hold those same breakdowns. It is worth saying, the item
    being at times cast aside with the words "we shall lose the trace of the breakdowns", while the trace stays -
    what is lost is a handy sight of it.
