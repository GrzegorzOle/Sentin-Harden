id: win2025-smart-multi-homed-name-resolution-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozsyłanie zapytań o nazwę wszystkimi kartami wyłączone
    en: Sending name queries out on every adapter switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Domyślnie system pyta o nazwę wszystkimi kartami sieciowymi naraz
    i przyjmuje tę odpowiedź, która wróci pierwsza. Ustawienie każe mu
    pytać po kolei, zaczynając od karty właściwej dla danego połączenia.

    Rzecz wygląda na drobiazg wydajnościowy, a nie jest nim. Pytanie
    wysłane wszystkimi kartami trafia także tam, gdzie nie powinno —
    do sieci mniej zaufanej — a ponieważ liczy się odpowiedź pierwsza,
    o wyniku decyduje ten, kto odpowie najszybciej. Napastnik w gorszej
    sieci wygrywa z prawidłowym serwerem nazw w lepszej, bo jest bliżej.

    Na stanowisku roboczym kilka kart naraz to sytuacja szczególna:
    tunel zestawiony obok sieci domowej albo obok publicznej. Na
    serwerze jest to stan normalny. Serwer ma kartę produkcyjną, kartę
    zarządzania, często osobną kartę kopii zapasowych albo pamięci
    masowej. Warunek, który na stanowisku bywa spełniony czasem, tutaj
    jest spełniony zawsze.

    Odwraca to znaczenie punktu. Na stanowisku broni przed sytuacją
    rzadką. Na serwerze opisuje jego codzienność — i dlatego trzeba
    zauważyć, że ta sama zmiana ma tu większy koszt, nie tylko większą
    wartość.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odpowiedzenia z sieci mniej zaufanej na zapytanie, które
    serwer zadał sieci produkcyjnej, i skierowania połączenia tam,
    gdzie chce.
  en: |
    By default the system asks after a name on all cards of the net at once and takes the answer
    that comes back first. The setting bids it ask in turn, beginning with the card proper to the
    given link.

    The thing looks like a trifle of swiftness and is none. A question sent out on all cards goes
    also where it ought not - into a less trusted net - and the first answer counting, the outcome
    is settled by whoever answers quickest. An attacker in the worse net wins against the right
    server of names in the better, being nearer.

    At a working station several cards at once is a case apart - a tunnel set up beside a home net
    or beside a public one. On a server it is the ordinary state. A server has a card for
    production, a card for management, often a card apart for backups or for the store of data. The
    condition that at a station is sometimes met is here met always.

    That turns the item's meaning about. At a station it guards against a rare case. On a server it
    sets forth its every day - and therefore it must be marked that the same change has here a
    greater cost and not only a greater worth.

    What an attacker gains while the item goes unmet: the means of answering out of a less trusted
    net the question the server put to the net of production, and of sending the connection where
    they will.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia i powód leży dokładnie tam, gdzie
    jej wartość: w tym, że serwer ma kilka kart.

    Dopóki system pyta wszystkimi kartami naraz, nazwa rozwiązywalna
    tylko przez serwer nazw z drugiej sieci rozwiązuje się mimo to —
    bo pytanie idzie także tamtędy. Po zmianie idzie wyłącznie kartą
    właściwą dla połączenia, więc taka nazwa przestaje się rozwiązywać
    albo rozwiązuje się z opóźnieniem.

    Sprawdzenia wymagają zatem sieci, które mają własne nazewnictwo.
    Sieć kopii zapasowych z własnymi nazwami węzłów, sieć pamięci
    masowej, sieć zarządzania sprzętem, segment laboratoryjny —
    wszędzie tam nazwy bywają znane wyłącznie serwerowi nazw z tamtej
    strony.

    Objawem jest zwykle nie brak działania, lecz spowolnienie, i to
    czyni ten punkt trudnym do rozpoznania. Zapytania idą po kolei,
    a nie równolegle, więc każde nieudane kosztuje czas oczekiwania.
    Zadanie kopii zapasowej, które kończyło się w dwie godziny, nagle
    kończy się w trzy i nikt nie wie dlaczego.

    Rzecz do zrobienia przed zmianą: sprawdzić, czy przypisanie serwerów
    nazw do kart jest poprawne, a nazwy z sieci pomocniczych mają wpisy
    tam, gdzie maszyna ich szuka. Jeżeli druga sieć ma własną strefę
    nazw, przypisz jej serwer nazw do właściwej karty i dopiero wtedy
    zamykaj rozsyłanie.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change takes a knowing rollout, and the ground lies just where its worth lies - in the
    server's having several cards.

    While the system asks on all cards at once, a name resolvable only by the server of names of
    the second net is resolved for all that - the question going that way too. After the change it
    goes on the card proper to the link alone, so such a name stops being resolved, or is resolved
    late.

    What needs checking is therefore the nets that have a naming of their own. A net of backups
    with its own names of nodes, a net of the store of data, a net for the management of gear, a
    length for trials - in all of them names are at times known to the server of names of that side
    alone.

    The symptom is mostly not a want of working but a slowing, and that makes this item hard to
    know. Askings go in turn and not side by side, so every failed one costs the time of waiting. A
    task of backup that used to end in two hours suddenly ends in three, and nobody knows why.

    The thing to do before the change - to check whether the setting of servers of names against
    cards is right, and whether names from the helping nets have entries where the machine seeks
    them. If the second net has a zone of names of its own, set its server of names against the
    proper card and only then shut the sending out.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
  what_breaks:
    pl:
      - Nazwy znane wyłącznie serwerowi nazw z drugiej sieci przestaną się rozwiązywać albo zwolnią
      - Zadania kopii zapasowej w osobnej sieci mogą trwać dłużej, bo zapytania idą po kolei
      - Sieć pamięci masowej albo zarządzania sprzętem z własnym nazewnictwem wymaga sprawdzenia przed zmianą
      - Objawem jest zwykle spowolnienie, a nie brak działania, co utrudnia rozpoznanie przyczyny
      - Zmiana cofa się natychmiast, ale spowolnienie bywa zauważone po tygodniach
    en:
      - Names known to the server of names of the second net alone will stop being resolved or will slow
      - Tasks of backup in a net apart may last longer, the askings going in turn
      - A net of the store of data or of the management of gear with its own naming needs checking first
      - The symptom is mostly a slowing and not a want of working, which makes the cause hard to know
      - The change is undone at once, but the slowing is at times marked only after weeks
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer ma kilka kart, a druga sieć ma własną strefę nazw bez wpisów po stronie produkcyjnej
      - Nie sprawdzono przypisania serwerów nazw do poszczególnych kart tej maszyny
    en:
      - The server has several cards and the second net has a zone of names with no entries on the production side
      - The setting of servers of names against the several cards of this machine was not checked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'DisableSmartNameResolution'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'DisableSmartNameResolution'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSmartNameResolution' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Podniosłem tu klasę uciążliwości względem paczki stanowiska
    roboczego, bo warunek, który na stanowisku bywa spełniony czasem,
    na serwerze jest spełniony zawsze: kilka kart to stan normalny,
    a nie sytuacja szczególna. Ta sama zmiana ma więc na serwerze nie
    tylko większą wartość, ale i większy koszt.

    Objaw wart zapamiętania: nie brak działania, lecz spowolnienie.
    Zapytania idą po kolei, więc każde nieudane kosztuje czas
    oczekiwania — zadanie kończące się dotąd w dwie godziny kończy się
    w trzy.
  en: |
    I raised the class of disruption here against the working station's pack, the condition that at
    a station is sometimes met being on a server met always - several cards are the ordinary state
    and not a case apart. The same change has therefore on a server not only a greater worth but a
    greater cost.

    A symptom worth keeping in mind - not a want of working but a slowing. Askings go in turn, so
    every failed one costs the time of waiting; a task that used to end in two hours ends in three.
