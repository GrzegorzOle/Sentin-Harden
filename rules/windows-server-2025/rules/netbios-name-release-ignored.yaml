id: win2025-netbios-name-release-ignored

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Żądania zwolnienia nazwy NetBIOS ignorowane
    en: NetBIOS name release requests ignored
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi nie reagować na żądanie zwolnienia własnej
    nazwy NetBIOS, przysłane przez inną maszynę w sieci.

    Żądanie takie jest częścią starego sposobu rozstrzygania sporu
    o nazwę: gdy dwie maszyny zgłaszają tę samą, jedna prosi drugą
    o ustąpienie. Maszyna, która ustąpi, przestaje odpowiadać pod swoją
    nazwą.

    Sprawdzenia, kto prosi, nie ma żadnego. Nikt nie podpisuje takiego
    żądania i nikt nie potwierdza, że nadawca ma do nazwy jakikolwiek
    tytuł. Wystarczy odezwać się z tej samej sieci.

    Na stanowisku roboczym skutkiem jest kłopot jednej osoby. Na
    serwerze jest to co innego i dlatego podniosłem tu kategorię ryzyka.
    Serwer zmuszony do zwolnienia nazwy przestaje być pod nią osiągalny —
    a napastnik, który to wymusił, może tę nazwę przejąć i odpowiadać
    w jego miejsce.

    Od tej chwili klienci łączą się do maszyny napastnika w przekonaniu,
    że rozmawiają z serwerem. Idą tam próby uwierzytelnienia, a razem
    z nimi wszystko, co da się z nich wydobyć. Sama utrata nazwy jest
    tylko wstępem — wartością dla napastnika jest zajęcie zwolnionego
    miejsca.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zepchnięcia serwera z jego własnej nazwy i przyjmowania
    pod nią połączeń klientów, bez potrzeby łamania czegokolwiek.
  en: |
    The setting bids the system not answer a request to give up its own NetBIOS name sent by
    another machine on the network.

    Such a request is part of an old way of settling a quarrel over a name: where two machines
    claim the same one, one asks the other to yield. The machine that yields stops answering under
    its name.

    There is no checking at all of who asks. Nobody signs such a request and nobody bears out that
    the sender holds any title to the name. It is enough to speak from the same network.

    At a working station the effect is one person's trouble. On a server it is another matter and
    hence I raised the category of risk here. A server made to give up its name stops being
    reachable under it - and an attacker who forced that may take the name over and answer in its
    place.

    From that moment clients connect to the attacker's machine believing they speak with the
    server. Tries at authentication go there, and with them all that can be drawn out of them. The
    losing of the name itself is but a beginning - what is worth having for the attacker is the
    taking of the place left open.

    What an attacker gains while the item goes unmet: the means of pushing a server off its own
    name and taking clients' connections under it, with no need to break anything.

disruption_description:
  pl: |
    Sprawdzenia wymaga tu jedna rzecz i nie jest nią skutek zmiany:
    wartość czyta usługa nazw przy starcie, więc zmiana zaczyna działać
    dopiero po ponownym uruchomieniu maszyny.

    Z tego powodu podniosłem klasę względem paczki stanowiska
    roboczego. Skutek samej zmiany jest znikomy.

    Rozstrzyganie sporu o nazwę w ten sposób jest mechanizmem z czasów,
    gdy nazwy nie było gdzie zapisać. Dziś nazwy serwerów są w usłudze
    katalogowej i w systemie nazw domenowych, a spór o nazwę rozstrzyga
    się administracyjnie, nie przez wymianę żądań w sieci.

    Przypadkiem, który wolno rozważyć, jest sieć z serwerem WINS,
    w której dwie maszyny faktycznie zgłaszają tę samą nazwę. Po zmianie
    taki spór nie rozstrzygnie się sam i zostanie jako trwały konflikt
    do rozwiązania ręcznie. Jest to jednak stan, który i tak wymaga
    reakcji człowieka.

    Objawem byłby wpis w dzienniku o konflikcie nazw, a nie utrata
    łączności. Sama maszyna pracuje dalej pod swoją nazwą — na tym
    właśnie polega zmiana.

    Zmiana nie dotyczy rejestracji nazwy przy starcie, odpowiadania na
    zapytania o nazwę ani rozwiązywania nazw przez system domenowy.
  en: |
    One thing needs checking here and it is not the effect of the change: the name service reads
    the value at its starting, so the change begins working only after a fresh start of the
    machine.

    For that reason I raised the class against the working station's pack. The effect of the
    change itself is slight.

    The settling of a quarrel over a name in this way is a mechanism of a time when there was
    nowhere to write names down. Today servers' names live in the directory service and in the
    system of domain names, and a quarrel over a name is settled by administration and not by an
    exchange of requests over the network.

    A case that may be weighed is a network with a WINS server in which two machines truly claim
    the same name. After the change such a quarrel will not settle itself and will stand as a
    lasting conflict to be resolved by hand. It is withal a state that calls for a person's answer
    anyway.

    The symptom would be an entry in the log about a conflict of names and not a loss of
    connection. The machine itself works on under its name - therein lies the change.

    The change does not bear on the registering of a name at starting, on answering queries about
    a name, or on the resolving of names by the domain system.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Spór o tę samą nazwę między dwiema maszynami nie rozstrzygnie się sam i zostanie do rozwiązania ręcznie
      - Objawem jest wpis w dzienniku o konflikcie nazw, a nie utrata łączności
      - Rejestracja nazwy przy starcie i odpowiadanie na zapytania działają bez zmiany
      - Zmiana zaczyna działać dopiero po ponownym uruchomieniu maszyny
    en:
      - A quarrel over the same name between two machines will not settle itself and will stand to be resolved by hand
      - The symptom is an entry in the log about a conflict of names and not a loss of connection
      - The registering of a name at starting and the answering of queries work unchanged
      - The change begins working only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases in which this setting is a mistake on a server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netbt\Parameters'
      $name = 'NoNameReleaseOnDemand'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netbt\Parameters'
    $name = 'NoNameReleaseOnDemand'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value bears on requests to give up a name alone. The registering of
    # the name at starting and the answering of queries about it work on
    # unchanged.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Netbt\Parameters' `
      -Name 'NoNameReleaseOnDemand' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego.
    Na stanowisku utrata nazwy jest kłopotem jednej osoby; na serwerze
    zwolnione miejsce zajmuje napastnik i przyjmuje pod tą nazwą
    połączenia klientów razem z próbami uwierzytelnienia.

    Sama utrata nazwy jest tylko wstępem — wartością dla napastnika
    jest zajęcie zwolnionego miejsca.

    Klasę podniosłem z powodu restartu, a nie skutku zmiany.
  en: |
    I raised the category of risk against the working station's pack. At a station the losing of a
    name is one person's trouble; on a server an attacker takes the place left open and takes
    clients' connections under that name, together with their tries at authentication.

    The losing of the name itself is but a beginning - what is worth having for the attacker is
    the taking of the place left open.

    I raised the class by reason of the restart and not of the change's effect.
