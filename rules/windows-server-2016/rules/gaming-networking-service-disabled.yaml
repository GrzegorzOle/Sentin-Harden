id: win2016-gaming-networking-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa sieciowa platformy rozrywkowej wyłączona
    en: The networking service of the entertainment platform disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zestawiającą połączenia sieciowe na potrzeby
    platformy rozrywkowej.

    Ta usługa jest z całej trójki warta uwagi najbardziej i warto wyłożyć
    dlaczego. Jej zadaniem jest doprowadzenie do bezpośredniego połączenia
    między dwiema maszynami, także wtedy, gdy obie stoją za urządzeniami
    brzegowymi. Robi więc dokładnie to, czego zwykle broni się na brzegu
    sieci: otwiera drogę z zewnątrz do środka i utrzymuje ją.

    Na serwerze nie ma powodu, żeby taki składnik pracował. Nie chodzi
    nawet o to, że mógłby zostać wykorzystany — chodzi o to, że jest to
    mechanizm zestawiający połączenia bez pytania kogokolwiek o zdanie,
    a pytanie o zdanie jest przy połączeniach przychodzących całą treścią
    ochrony brzegu.

    Punkt zamyka trójkę dotyczącą tej samej platformy i ze wszystkich
    trzech jest tym, którego skutek najłatwiej uzasadnić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działający
    mechanizm potrafiący zestawić połączenie przez urządzenie brzegowe bez
    niczyjej decyzji.
  en: |
    The item switches off the service setting up network connections for the needs of the entertainment
    platform.

    That service is of the whole three the most worth attention, and it is worth setting out why. Its
    task is to bring about a direct connection between two machines, also where both stand behind edge
    devices. It does therefore exactly what is usually guarded against at the network's edge: it opens a
    road from outside to within and keeps it up.

    On a server there is no cause for such a component to work. It is not even a matter of its being
    usable - it is a matter of its being a mechanism setting connections up without asking anybody's
    leave, and asking leave is at incoming connections the whole substance of guarding the edge.

    The item shuts the three concerning that same platform and of all three is the one whose consequence
    is easiest to warrant.

    What an attacker gains while the item goes unmet: a working mechanism able to set up a connection
    through an edge device at nobody's decision.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze usługa ta nie ma czego zestawiać. Nie korzysta z niej żadna
    rola, żadna aplikacja serwerowa ani żaden mechanizm sieciowy systemu.

    Rzecz warta wyjaśnienia dotyczy nazwy. Usługa ta zajmuje się wyłącznie
    połączeniami platformy rozrywkowej i nie ma związku z obsługą sieci
    w systemie. Jej wyłączenie nie dotyka kart sieciowych, nazw, tras,
    zapory ani niczego, co maszyna robi w sieci na co dzień. Obawa bywa
    przy tym punkcie większa niż przy dwóch poprzednich właśnie przez
    słowo w nazwie.

    Przypadek wart wymienienia jest ten sam co wcześniej: maszyna wydana
    komuś do pracy.

    Nie ma innych znanych regresji.

    Czego to nie psuje: obsługi sieci w systemie, kart sieciowych, tras,
    zapory, nazw, udziałów, aplikacji serwerowych.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe.
  en: |
    The class is "no disruption".

    On a server that service has nothing to set up. No role, no server application and no networking
    mechanism of the system uses it.

    A thing worth explaining concerns the name. That service is busied solely with the entertainment
    platform's connections and has no bearing on the attending of the network within the system.
    Switching it off touches no network cards, names, routes, the firewall, or anything the machine does
    on the network day by day. The misgiving at this item is at times greater than at the two before
    because of a word in the name.

    The case worth naming is the same as before: a machine handed to somebody for work.

    There are no other known regressions.

    What this does not break: the attending of the network within the system, network cards, routes, the
    firewall, names, shares, or server applications.

    Calls for a service to be stopped; the undoing is immediate.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Na maszynie używanej jak stanowisko robocze połączenia platformy rozrywkowej przestają być zestawiane
      - Obsługa sieci w systemie, karty sieciowe, trasy i zapora pozostają bez zmian mimo słowa w nazwie usługi
      - Nazwy, udziały i aplikacje serwerowe pozostają bez zmian
      - Dwie pozostałe usługi tej samej platformy wymagają osobnego wyłączenia
    en:
      - On a machine used as a workstation the entertainment platform's connections cease to be set up
      - The attending of the network within the system, network cards, routes and the firewall stay unchanged despite a word in the service name
      - Names, shares and server applications stay unchanged
      - The two remaining services of that same platform call for a separate switching off
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest wydana komuś do pracy jak stanowisko robocze i platforma rozrywkowa jest na niej używana
    en:
      - The machine is handed to somebody for work as a workstation and the entertainment platform is used on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'XboxNetApiSvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The service opens connections between machines by itself and keeps them
    # up. On a server that is traffic nobody ordered.
    Stop-Service -Name 'XboxNetApiSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxNetApiSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'XboxNetApiSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/svchost-service-refactoring

notes:
  pl: |
    Punkt zamyka trójkę i jest z niej jedyny, przy którym uzasadnienie
    stoi o własnych siłach. Dwa poprzednie opierają się na tym, że kod bez
    zadania jest zbędny; ten opiera się na tym, co ten kod potrafi zrobić —
    otworzyć drogę przez brzeg sieci.

    Warto, żeby aplikacja tę różnicę pokazała, bo wpływa na kolejność przy
    maszynie, na której ktoś jednak pracuje. Gdyby trzeba było wybrać jeden
    z trzech punktów do wykonania mimo używania platformy, to właśnie ten.

    Ostrzeżenie o nazwie jest przy tej regule treścią, nie dodatkiem. Słowo
    „sieciowa" w nazwie usługi prowadzi do odpuszczania punktu z obawy
    przed odcięciem maszyny od sieci — obawy zupełnie bezpodstawnej,
    a spotykanej częściej niż przy dwóch pozostałych regułach razem.

    Odnotowuję, że wszystkie trzy usługi tej platformy wymagają osobnego
    wyłączenia i nie wynikają jedna z drugiej. Reguła pokazana bez tej
    informacji sugeruje, że wyłączenie platformy jest jedną czynnością.
  en: |
    The item shuts the three and is the only one of them at which the warrant stands by its own strength.
    The two before rest on code without a task being needless; this one rests on what that code can do -
    open a road through the network's edge.

    It is well that the application show that difference, bearing as it does on the order at a machine
    where somebody does work after all. Were one of the three items to be chosen for carrying out despite
    the platform being used, it would be this one.

    The warning about the name is at this rule the substance and not an addition. The word "networking"
    in the service's name leads to the item being let go from a fear of cutting the machine off from the
    network - a fear wholly groundless, and met with oftener than at the two remaining rules together.

    Worth noting that all three services of that platform call for a separate switching off and do not
    follow one from another. The rule shown without that word suggests that switching the platform off is
    one act.
