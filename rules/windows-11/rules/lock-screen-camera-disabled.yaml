id: win11-lock-screen-camera-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Personalization
  title:
    pl: Aparat niedostępny z ekranu blokady
    en: Camera unavailable from the lock screen
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ekran blokady jest granicą: przed nim stoi ktokolwiek, za nim zalogowany
    użytkownik. Każda funkcja dostępna przed tą granicą działa bez
    uwierzytelnienia, więc każda z nich powiększa to, co można zrobić z cudzym
    komputerem, nie znając hasła.

    Aparat wywoływany gestem z ekranu blokady jest tego przykładem najprostszym
    do zrozumienia: pozwala robić i zapisywać zdjęcia na zablokowanej maszynie.
    Zysk z wyłączenia jest niewielki i uczciwie trzeba to powiedzieć — wartość
    leży w konsekwencji, czyli w tym, że przed ekranem logowania nie ma nic
    poza ekranem logowania.
  en: |
    The lock screen is a boundary: in front of it stands anybody, behind it the
    signed-in user. Every function available before that boundary works without
    authentication, so each one enlarges what can be done with somebody else's
    computer without knowing the password.

    A camera invoked by a gesture from the lock screen is the easiest example to
    grasp: it allows taking and saving photographs on a locked machine. The gain
    from disabling it is small and that should be said honestly - the value lies
    in consistency, in there being nothing in front of the sign-in screen except
    the sign-in screen.

disruption_description:
  pl: |
    Nic poza tym jednym gestem nie przestaje działać. Aparat po zalogowaniu
    działa normalnie, kamera w rozmowach też. Nie ma restartu ani wylogowania.

    Realnie dotyczy to wyłącznie urządzeń z ekranem dotykowym, bo gest
    wywołujący aparat z ekranu blokady na maszynie z klawiaturą jest
    praktycznie nieużywany.
  en: |
    Nothing beyond that one gesture stops working. The camera works normally
    after signing in, and so does the camera in calls. There is no restart and no
    sign-out.

    In practice this concerns touchscreen devices only, because the gesture
    invoking the camera from the lock screen is practically unused on a machine
    with a keyboard.

implementation_consequences:
  impact_areas:
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Na urządzeniu dotykowym zniknie gest wywołujący aparat bez odblokowania ekranu
    en:
      - On a touch device the gesture invoking the camera without unlocking the screen disappears
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Urządzenie służy do szybkiego dokumentowania zdjęciem i gest z ekranu blokady jest częścią tej pracy
    en:
      - The device is used for quick photographic documentation and the lock screen gesture is part of that work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      $name = 'NoLockScreenCamera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    $name = 'NoLockScreenCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLockScreenCamera' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-abovelock

notes:
  pl: |
    Kategoria ryzyka jest niska i taka ma zostać. To punkt z grupy
    porządkowych: nie zamyka drogi wejścia, tylko odbiera funkcję działającą
    bez uwierzytelnienia. Wpisanie mu wyższej wagi tylko dlatego, że dotyczy
    kamery, zaciemniłoby listę, na której są rzeczy poważniejsze.

    Punkt wdraża się razem z pozostałymi ustawieniami ekranu blokady — pokazem
    slajdów i powiadomieniami. Osobno każdy z nich wygląda na drobiazg i nim
    jest; razem opisują jedną decyzję o tym, co wolno przed zalogowaniem.
  en: |
    The risk category is low and is meant to stay that way. This is an item from
    the housekeeping group: it closes no way in, it merely removes a function
    that works without authentication. Giving it a higher weight just because it
    involves a camera would muddy a list that holds more serious things.

    The item is rolled out together with the remaining lock screen settings -
    the slideshow and notifications. Separately each of them looks like a trifle
    and is one; together they describe a single decision about what is permitted
    before signing in.
