id: win2025-rdp-password-saving-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Connection Client
  title:
    pl: Zapisywanie haseł w kliencie pulpitu zdalnego zablokowane
    en: Saving passwords in the remote desktop client blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi pulpitu zdalnego zapamiętywania haseł
    do maszyn, z którymi się łączy.

    Punkt dotyczy strony wychodzącej, nie przychodzącej — i to jest
    powód, dla którego łatwo go na serwerze przeoczyć. Cała reszta
    ustawień pulpitu zdalnego opisuje serwer jako miejsce, do którego
    ktoś się łączy. Ten opisuje go jako miejsce, z którego ktoś łączy
    się dalej.

    Na serwerze taka rola jest częstsza, niż się wydaje. Serwer
    zarządzania, stacja skokowa, maszyna z konsolami administracyjnymi,
    serwer terminali, na którym pracuje zespół informatyczny — z każdej
    z nich ludzie łączą się do kolejnych maszyn i każda z nich może
    trzymać poświadczenia do nich wszystkich.

    Skutek jest wtedy prosty do opisania i przykry. Przejęcie takiej
    jednej maszyny nie daje napastnikowi jednego serwera, tylko listę
    wszystkich, do których ktokolwiek się z niej łączył, razem
    z hasłami. Poświadczenia zapisane w kliencie są związane
    z profilem, więc napastnik działający na koncie tej osoby używa ich
    bez znajomości hasła.

    Warto zauważyć, że maszyna pośrednicząca jest w tym układzie celem
    o wartości wyższej niż każdy z serwerów osobno. Stacja skokowa
    z zapisanymi poświadczeniami przestaje być drogą do serwerów i staje
    się ich spisem.

    Punkt czyta się w parze z wymuszaniem pytania o hasło przy
    połączeniu. Tamten mówi, czego serwer żąda od łączących się; ten
    mówi, czego serwerowi wolno zapamiętać, gdy sam się łączy. Są to
    dwie strony tej samej rzeczy i sensownie jest je wdrożyć razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: po
    przejęciu tej maszyny listę kolejnych serwerów razem
    z poświadczeniami pozwalającymi się do nich zalogować.
  en: |
    The setting forbids the remote desktop client to remember passwords to the machines it connects
    with.

    The item bears on the going-out side and not on the coming-in one - and that is why it is
    easily overlooked on a server. All the rest of the remote desktop settings describe the server
    as a place somebody connects to. This one describes it as a place somebody connects onward
    from.

    On a server such a part is commoner than it seems. A server of management, a jump station, a
    machine with administrative consoles, a terminal server whereon the computing team works - from
    each of them people connect to further machines, and each of them may hold credentials to them
    all.

    The effect is then simple to describe and unpleasant. The taking of such a single machine gives
    the attacker not one server but a list of all those anybody connected to from it, along with
    the passwords. Credentials stored in the client are bound to the profile, so an attacker acting
    on that person's account uses them with no knowledge of the password.

    It is worth marking that the machine standing between is in this arrangement a target of higher
    worth than any of the servers apart. A jump station with stored credentials stops being a road
    to the servers and becomes a roll of them.

    The item is read in a pair with the forcing of a question for a password at connection. That
    one says what the server asks of those connecting; this one says what the server may remember
    when it connects itself. They are two sides of one thing and it is sensible to roll them out
    together.

    What an attacker gains while the item goes unmet: after the taking of this machine, a list of
    further servers along with the credentials for signing in to them.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy z tej maszyny łączy się dalej coś, co
    nie ma kto obsłużyć ręcznie.

    Pierwszy przypadek to skrypty i zadania zaplanowane zestawiające
    sesję pulpitu zdalnego z zapisanym poświadczeniem. Przestaną
    działać, a objaw jest ten sam co zawsze przy tej grupie ustawień:
    zadanie nie kończy się i nie zgłasza błędu uwierzytelnienia, tylko
    czeka na pytanie, na które nikt nie odpowie.

    Drugi to narzędzia zbiorcze do łączenia się z wieloma serwerami
    naraz, trzymające poświadczenia we własnej książce połączeń.
    Zachowują się rozmaicie: część zapyta o hasło do każdej maszyny
    osobno, część nie nawiąże sesji wcale.

    Trzeci dotyczy ludzi i jest najbardziej odczuwalny. Administrator,
    który z tej maszyny obsługuje kilkanaście serwerów, będzie wpisywał
    hasło przy każdym połączeniu. Przy kilkunastu połączeniach dziennie
    jest to koszt, o którym trzeba uprzedzić.

    Rzecz, o której warto wiedzieć, zanim się zmianę wdroży: zapisane
    wcześniej poświadczenia nie znikają. Ustawienie zabrania zapisywania
    nowych, ale to, co już leży w magazynie poświadczeń profilu, zostaje
    tam do usunięcia. Wdrożenie tego punktu bez przejrzenia magazynu
    daje zgodność w raporcie i pozostawia dokładnie to, przed czym punkt
    ma bronić. Jest to różnica, której sam audyt nie pokaże, bo audyt
    czyta ustawienie, a nie zawartość magazynu.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Trwające
    sesje nie są przerywane.
  en: |
    One thing needs checking: whether anything connects onward from this machine that there is
    nobody to serve by hand.

    The first case is scripts and planned jobs setting up a remote desktop session with a stored
    credential. They will stop working, and the symptom is the same as always with this group of
    settings: the job does not finish and reports no fault of authentication, it merely waits for a
    question nobody will answer.

    The second is gathering tools for connecting with many servers at once, keeping credentials in
    a book of connections of their own. They behave variously: some will ask for the password to
    each machine apart, some will not open a session at all.

    The third bears on people and is the most felt. An administrator who serves a dozen or more
    servers from this machine will type the password at every connecting. At a dozen or more
    connectings a day that is a cost to be foretold.

    A thing worth knowing before the change is rolled out: credentials stored earlier do not
    vanish. The setting forbids the storing of new ones, but what already lies in the profile's
    store of credentials stays there until removed. Rolling this item out without a looking through
    of the store gives compliance in the report and leaves behind exactly what the item is to guard
    against. It is a difference the audit alone will not show, the audit reading the setting and
    not the store's contents.

    The change comes into force straight away and is undone at once. Sessions running are not
    broken.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypt albo zadanie zaplanowane zestawiające sesję z zapisanym poświadczeniem przestanie działać
      - Zadanie nie kończy się i nie zgłasza błędu uwierzytelnienia, tylko czeka na pytanie
      - Narzędzie zbiorcze z własną książką połączeń zapyta o hasło do każdej maszyny osobno albo nie połączy się wcale
      - Administrator obsługujący kilkanaście serwerów będzie wpisywał hasło przy każdym połączeniu
      - Poświadczenia zapisane wcześniej nie znikają i zostają w magazynie do usunięcia ręcznego
    en:
      - A script or planned job setting up a session with a stored credential will stop working
      - The job does not finish and reports no fault of authentication, it merely waits for a question
      - A gathering tool with its own book of connections will ask for the password to each machine apart or not connect at all
      - An administrator serving a dozen or more servers will type the password at every connecting
      - Credentials stored earlier do not vanish and stay in the store until removed by hand
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z tej maszyny łączą się dalej zadania zaplanowane korzystające z zapisanych poświadczeń
      - Magazyn poświadczeń profilu nie zostanie przejrzany, bo wtedy zmiana daje zgodność bez skutku
    en:
      - Planned jobs using stored credentials connect onward from this machine
      - The profile's store of credentials will not be looked through, the change then giving compliance with no effect
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'DisablePasswordSaving'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DisablePasswordSaving'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting forbids the storing of new credentials. Those already lying in
    # the profile's store stay there and are removed apart.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordSaving' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Punkt dotyczy strony wychodzącej: serwera jako miejsca, z którego
    ktoś łączy się dalej. Dlatego na serwerze łatwo go przeoczyć, choć
    rola stacji skokowej jest częstsza, niż się wydaje.

    Przejęcie takiej maszyny daje napastnikowi nie jeden serwer, tylko
    listę wszystkich, do których ktokolwiek się z niej łączył, razem
    z poświadczeniami.

    Ograniczenie, które trzeba zapisać: ustawienie zabrania zapisywania
    nowych poświadczeń, ale nie usuwa tych, które już leżą w magazynie
    profilu. Audyt czyta ustawienie, a nie zawartość magazynu, więc
    zgodność w raporcie nie oznacza, że magazyn jest pusty.

    Wdrażaj razem z wymuszaniem pytania o hasło przy połączeniu — to dwie
    strony tej samej rzeczy.
  en: |
    The item bears on the going-out side: the server as a place somebody connects onward from.
    Hence it is easily overlooked on a server, though the part of a jump station is commoner than
    it seems.

    The taking of such a machine gives the attacker not one server but a list of all those anybody
    connected to from it, along with the credentials.

    A bound that must be written down: the setting forbids the storing of new credentials but does
    not remove those already lying in the profile's store. The audit reads the setting and not the
    store's contents, so compliance in the report does not mean the store is empty.

    Roll it out together with the forcing of a question for a password at connection - they are two
    sides of one thing.
