id: win2025-ip-source-routing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Trasowanie źródłowe IPv4 wyłączone
    en: IPv4 source routing disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi odrzucać pakiety, w których nadawca sam
    wyznaczył drogę, jaką mają przebyć.

    Trasowanie źródłowe jest możliwością wpisaną w protokół od początku:
    nadawca dopisuje do pakietu wykaz przystanków, a urządzenia po
    drodze mają się do niego zastosować, zamiast wybierać drogę same.
    Miało to służyć diagnostyce sieci.

    Nadużycie jest lustrzane wobec zastosowania. Napastnik wyznacza nie
    tylko drogę do celu, ale i drogę powrotną — a to znaczy, że może
    podać się za adres, którego nie ma, i mimo to odebrać odpowiedź.
    Odpowiedź wróci tam, gdzie wskazał, a nie tam, skąd rzekomo przyszło
    pytanie.

    Stąd bierze się druga zdolność, ważniejsza: obejście reguł, które
    ufają adresowi nadawcy. Filtr przepuszczający ruch z sieci
    zarządzania przepuści pakiet podający się za pochodzący z tej sieci,
    a odpowiedź i tak trafi do napastnika, bo droga powrotna jest
    wpisana w pakiet.

    Na serwerze waży właśnie to obejście, bo to serwery bywają chronione
    regułami opartymi na adresie źródłowym. Usługa dostępna „tylko
    z sieci wewnętrznej" jest chroniona dokładnie tak dobrze, jak dobrze
    da się zaufać temu, co pakiet o sobie mówi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podania fałszywego adresu nadawcy i odebrania odpowiedzi
    mimo to, a więc obejścia reguł dostępu opartych na adresie.
  en: |
    The setting bids the system turn away packets in which the sender has themselves laid down
    the road they are to travel.

    Source routing is a means written into the protocol from the beginning: the sender adds to
    the packet a list of stops, and the devices along the way are to keep to it rather than choose
    the road themselves. It was to serve the diagnosis of networks.

    The misuse mirrors the use. An attacker lays down not only the road to the aim but the road
    back - and that means they may give themselves out for an address that is not theirs and
    still take the answer. The answer will come back where they pointed and not where the
    question seemingly came from.

    Thence comes a second power, and the weightier: the going round of rules that trust a
    sender's address. A filter letting traffic from the management network through will let
    through a packet giving itself out as coming from that network, and the answer will reach the
    attacker all the same, the road back being written into the packet.

    On a server it is that going round which weighs, servers being what is at times shielded by
    rules resting on a source address. A service to be had "only from the inner network" is
    shielded exactly as well as what a packet says of itself can be trusted.

    What an attacker gains while the item goes unmet: the means of giving a false sender's
    address and taking the answer nonetheless, and so of going round rules of access resting on
    an address.

disruption_description:
  pl: |
    Sprawdzenia wymaga tu jedna rzecz i nie jest nią skutek zmiany:
    wartość czyta stos sieciowy przy starcie, więc zmiana zaczyna
    działać dopiero po ponownym uruchomieniu maszyny.

    Z tego powodu podniosłem klasę względem paczki stanowiska
    roboczego. Skutek samej zmiany jest żaden.

    Trasowania źródłowego nie używa dziś nic. Urządzenia sieciowe
    odrzucają takie pakiety domyślnie od lat, a dostawcy łączy nie
    przepuszczają ich w ogóle. Punkt zamyka zatem drogę, której nikt nie
    używa — i właśnie dlatego jest tani.

    Ustawiana wartość oznacza odrzucanie wszystkich pakietów z wyznaczoną
    drogą, a nie ich ograniczanie. Jest to wariant najwyższy i nie ma
    powodu wybierać słabszego, bo mechanizm ten nie ma dziś zastosowania
    prawowitego.

    Jedyne narzędzie, które mogłoby to odczuć, to bardzo stare
    oprogramowanie diagnostyczne korzystające z wyznaczania drogi do
    śledzenia trasy. Narzędzia współczesne robią to inaczej.

    Zmiana nie dotyczy tras wpisanych ręcznie, trasowania między
    interfejsami ani ruchu w sieciach wirtualnych.
  en: |
    One thing needs checking here and it is not the effect of the change: the network stack reads
    the value at its starting, so the change begins working only after a fresh start of the
    machine.

    For that reason I raised the class against the working station's pack. The effect of the
    change itself is none.

    Nothing today uses source routing. Network devices have turned such packets away by default
    for years, and the carriers of links do not pass them at all. The item thus shuts a road
    nobody uses - and hence it is cheap.

    The value set means the turning away of every packet with a road laid down, rather than their
    bounding. It is the highest variant and there is no reason to choose a weaker one, the
    mechanism having today no lawful use.

    The one tool that might feel it is very old software of diagnosis using the laying down of a
    road for the tracing of a route. Present-day tools do it otherwise.

    The change does not bear on routes written by hand, on routing between interfaces or on
    traffic in virtual networks.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Bardzo stare narzędzie diagnostyczne śledzące trasę przez wyznaczanie drogi przestanie działać
      - Trasy wpisane ręcznie i trasowanie między interfejsami pozostają bez zmiany
      - Ruch w sieciach wirtualnych nie jest tym punktem dotknięty
      - Zmiana zaczyna działać dopiero po ponownym uruchomieniu maszyny
    en:
      - A very old tool of diagnosis tracing a route by laying one down will stop working
      - Routes written by hand and routing between interfaces stay unchanged
      - Traffic in virtual networks is untouched by this item
      - The change begins working only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases in which this setting is a mistake on a server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'DisableIPSourceRouting'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'DisableIPSourceRouting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two means every packet with a road laid down is turned away, rather
    # than only those aimed at this machine. The mechanism has no lawful use
    # today, so the highest variant is set.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'DisableIPSourceRouting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Wartość oznacza odrzucanie wszystkich pakietów z wyznaczoną drogą.
    Wariant słabszy odrzuca tylko te kierowane do tej maszyny i nie ma
    powodu go wybierać, bo mechanizm nie ma dziś zastosowania
    prawowitego.

    Na serwerze waży obejście reguł opartych na adresie nadawcy. Usługa
    dostępna „tylko z sieci wewnętrznej" jest chroniona tak dobrze, jak
    dobrze da się zaufać temu, co pakiet o sobie mówi.

    Czytaj razem z tym samym punktem dla protokołu szóstej wersji.
    Wyłączenie jednego bez drugiego zostawia drogę otwartą.
  en: |
    The value means the turning away of every packet with a road laid down. The weaker variant
    turns away only those aimed at this machine, and there is no reason to choose it, the
    mechanism having today no lawful use.

    On a server what weighs is the going round of rules resting on a sender's address. A service
    to be had "only from the inner network" is shielded as well as what a packet says of itself
    can be trusted.

    Read together with the same item for the sixth version of the protocol. Switching one off
    without the other leaves the road open.
