id: win2016-peer-networking-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa tożsamości dla sieci równorzędnej wyłączona
    en: The identity service for peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa prowadzi tożsamości używane przez rodzinę mechanizmów sieci
    równorzędnej — takich, w których maszyny porozumiewają się bezpośrednio
    ze sobą, bez serwera pośredniczącego i bez katalogu.

    Tożsamość w tym mechanizmie nie ma nic wspólnego z kontem w domenie ani
    z kontem lokalnym. Jest parą kluczy wytworzoną na maszynie, którą maszyna
    sama sobie nadaje i sama publikuje. Nikt jej nie zatwierdza, nikt nie
    odbiera, nikt nie sprawdza, czy stoi za nią ta osoba, za którą się
    podaje.

    To jest cała rzecz. Mechanizm pomyślany był dla sieci domowych, w których
    nie ma administratora, i dlatego zaufanie w nim rodzi się z samej
    obecności w sieci. Na serwerze w organizacji, gdzie katalog istnieje
    i działa, jest to równoległa droga zaufania, której nikt nie prowadzi.

    Usługa ta jest przy tym korzeniem rodziny. Rozpoznawanie nazw
    i grupowanie opierają się na niej, więc jej wyłączenie zatrzymuje je
    niezależnie od tego, co mają wpisane u siebie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podstawę
    tożsamości, którą maszyna wytwarza sobie sama i która nie przechodzi
    przez żadne zatwierdzenie organizacji.
  en: |
    The service keeps the identities used by the peer networking family of mechanisms -
    those in which machines come to terms directly with one another, without a server
    in between and without a directory.

    An identity in that mechanism has nothing to do with an account in the domain or a
    local account. It is a pair of keys made on the machine, which the machine grants
    itself and publishes itself. Nobody approves it, nobody takes it away, nobody
    checks whether behind it stands the person it gives itself out to be.

    That is the whole matter. The mechanism was thought up for home networks with no
    administrator, and so trust in it is born of mere presence on the network. On a
    server in an organisation, where a directory exists and works, it is a parallel road
    of trust nobody keeps.

    This service is besides the family's root. Name resolution and grouping rest upon
    it, so switching it off stops them whatever they have entered at their own end.

    What an attacker gains while the item goes unmet: a ground of identity the machine
    makes for itself, passing through no approval of the organisation.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy nie tej
    usługi, tylko dwóch, które na niej stoją.

    Wyłączenie tej usługi zatrzymuje także rozpoznawanie nazw i grupowanie
    w sieci równorzędnej. Jest to skutek zamierzony, ale trzeba go znać
    z góry, bo raport pokaże potem trzy punkty naprawione zamiast jednego,
    a operator, który wykonał jedną zmianę, będzie się temu dziwił.

    Zastosowań samego mechanizmu na serwerze jest niewiele i warto je
    wymienić, bo bywają. Pierwsze to starsza współpraca dokumentowa
    działająca bez serwera — funkcja obecna w pakietach biurowych sprzed
    lat. Drugie to narzędzia pomocy zdalnej korzystające z połączenia
    bezpośredniego zamiast z serwera pośredniczącego. Trzecie to aplikacje
    branżowe, które wybrały tę drogę, żeby nie wymagać infrastruktury.

    Objawem we wszystkich trzech przypadkach jest brak możliwości nawiązania
    połączenia, zwykle z komunikatem o niedostępności drugiej strony.
    Powiązanie z tą regułą nie jest oczywiste, bo komunikat wskazuje na
    sieć, a nie na usługę.

    Czego to nie psuje: uwierzytelniania domenowego, udostępniania plików
    zwykłą drogą, pulpitu zdalnego, zarządzania zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check concerns not this service but
    the two standing on it.

    Switching this service off stops name resolution and grouping in peer networking as
    well. That consequence is intended, but it has to be known beforehand, since the
    report will afterwards show three items mended instead of one, and an operator who
    made one change will wonder at it.

    There are few uses of the mechanism itself on a server, and they are worth naming,
    occurring as they do. The first is older document collaboration working without a
    server - a feature present in office suites of years past. The second is remote
    assistance tools using a direct connection rather than a server in between. The
    third is line-of-business applications that took this road so as not to call for
    infrastructure.

    The symptom in all three cases is an inability to make a connection, as a rule with
    a message about the other side being unreachable. The tie to this rule is not
    obvious, the message pointing at the network rather than at a service.

    What this does not break: domain authentication, file sharing by the ordinary road,
    the remote desktop, or remote management.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Rozpoznawanie nazw i grupowanie w sieci równorzędnej przestaną działać razem z tą usługą, bo stoją na niej
      - Starsza współpraca dokumentowa działająca bez serwera nie nawiąże połączenia między stanowiskami
      - Narzędzia pomocy zdalnej korzystające z połączenia bezpośredniego zgłoszą niedostępność drugiej strony, wskazując na sieć zamiast na usługę
      - Uwierzytelnianie domenowe, udostępnianie plików zwykłą drogą i pulpit zdalny pozostają bez zmian
    en:
      - Name resolution and grouping in peer networking will stop working along with this service, standing on it as they do
      - Older document collaboration working without a server will not make a connection between positions
      - Remote assistance tools using a direct connection will report the other side unreachable, pointing at the network instead of at a service
      - Domain authentication, file sharing by the ordinary road and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja branżowa na tej maszynie porozumiewa się z innymi stanowiskami drogą równorzędną i nie ma dla niej zamiennika
      - Pomoc zdalna w tej organizacji opiera się na połączeniu bezpośrednim między maszynami
    en:
      - A line-of-business application on this machine comes to terms with other positions by the peer road and has no replacement
      - Remote assistance in this organisation rests on a direct connection between machines
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'p2pimsvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This service is the root of the peer networking family. Disabling it stops
    # the grouping and name resolution services along with it, whatever their own
    # start entries say.
    Stop-Service -Name 'p2pimsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2pimsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'p2pimsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-identity-manager

notes:
  pl: |
    Punkt otwiera blok o mechanizmach, którymi maszyny szukają się nawzajem
    w sieci lokalnej bez pośrednictwa katalogu. Wszystkie one powstały
    w czasach, gdy sieć domowa i sieć biurowa wyglądały podobnie, i wszystkie
    zostały w systemie długo po tym, jak przestało to być prawdą.

    Zależność między usługami rodziny warto pokazać w interfejsie wprost.
    Ta jest korzeniem; rozpoznawanie nazw i grupowanie stoją na niej.
    Wyłączenie korzenia zatrzymuje całą rodzinę, ale nie zmienia wpisów
    pozostałych usług — te nadal wyglądają na włączone i nadal zgłaszają
    niezgodność, dopóki nie zostaną wyłączone u siebie. Jest to dokładnie
    ten rodzaj rozbieżności między raportem a stanem faktycznym, który
    podważa zaufanie do raportu.

    Kolejność wdrażania nie ma tu znaczenia dla wyniku, ale ma dla przebiegu.
    Wyłączenie korzenia na początku zatrzyma pozostałe usługi od razu
    i dalsze zmiany przejdą bez żadnego skutku widocznego.
  en: |
    The item opens the block about the mechanisms by which machines seek one another on
    the local network without a directory in between. All of them came about in times
    when a home network and an office network looked alike, and all of them stayed in
    the system long after that ceased to be true.

    The dependence among the family's services is worth showing in the interface
    outright. This one is the root; name resolution and grouping stand on it. Switching
    the root off stops the whole family but does not change the other services' entries
    - those still look switched on and still report a non-compliance until they are
    switched off at their own end. That is exactly the kind of divergence between the
    report and the state in fact which undermines trust in the report.

    The order of rollout makes no difference here to the outcome, but it does to the
    course. Switching the root off at the start will stop the other services at once and
    the further changes will pass with no visible consequence.
