id: win2016-rss-enclosure-download-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > RSS Feeds
  title:
    pl: Pobieranie załączników z kanałów informacyjnych wyłączone
    en: The fetching of enclosures from news feeds switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza automatyczne pobieranie załączników dołączanych do
    wpisów w kanałach informacyjnych.

    Punkt wygląda na pozycję o mechanizmie zapomnianym i taki po części
    jest. Rzecz, która broni go mimo wszystko, dotyczy tego, co ten
    mechanizm robi: kładzie plik na dysku maszyny na podstawie tego, co
    ktoś napisał po drugiej stronie kanału.

    Trzy cechy składają się tu na kłopot. Pierwsza: plik ląduje bez
    niczyjej decyzji o pobraniu. Druga: kanał jest subskrypcją, więc
    pobiera dalej, sam, bez ponownego udziału człowieka — raz założona
    subskrypcja pracuje w tle miesiącami. Trzecia: o zawartości decyduje
    strona przeciwna i może ją zmienić w dowolnej chwili po założeniu
    subskrypcji.

    Znaczy to, że jest to stały kanał wnoszenia plików na maszynę,
    sterowany z zewnątrz. Treść pliku nie musi być groźna sama w sobie;
    groźna jest trwałość i bezdecyzyjność kanału.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: stały kanał
    kładzenia plików na dysku maszyny, sterowany spoza organizacji.
  en: |
    The setting switches off the automatic fetching of enclosures joined to entries in news feeds.

    The item looks an entry about a forgotten mechanism and in part it is one. The thing that defends it all the
    same concerns what that mechanism does: it lays a file on the machine's disk on the strength of what somebody
    wrote on the other side of the feed.

    Three features make up the trouble here. The first: the file lands without anybody's decision to fetch. The
    second: a feed is a subscription, so it fetches on, of itself, without a person taking part again - a
    subscription once set up works in the background for months. The third: what the content is the other side
    decides, and may change it at any moment after the subscription is set up.

    That means it is a standing channel for bringing files onto the machine, steered from outside. The file's
    content need not be dangerous in itself; what is dangerous is the channel's lastingness and its want of a
    decision.

    What an attacker gains while the item goes unmet: a standing channel for laying files on the machine's disk,
    steered from outside the organisation.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wpisy z kanałów nadal się pobierają i nadal są widoczne. Znika
    wyłącznie automatyczne ściąganie załączonego pliku. Odsyłacz do niego
    zostaje, więc kto go potrzebuje, pobierze go ręcznie — czyli
    z decyzją.

    Na serwerze kanałów informacyjnych zwykle nikt nie czyta, więc zmiana
    nie zabiera nikomu niczego.

    Nie ma znanych regresji.

    Czego to nie psuje: samych kanałów, pobierania wpisów, czytania ich,
    pobierania plików ręcznie, przeglądarki, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    Entries from feeds are still fetched and still to be seen. What goes is solely the automatic drawing down of
    the joined file. The link to it stays, so whoever needs it will fetch it by hand - which is to say with a
    decision.

    On a server as a rule nobody reads news feeds, so the change takes from nobody anything.

    There are no known regressions.

    What this does not break: the feeds themselves, the fetching of entries, the reading of them, the fetching of
    files by hand, the browser, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Załączniki dołączone do wpisów przestają pobierać się same i trzeba sięgnąć po nie ręcznie
      - Odsyłacz do pliku zostaje we wpisie, więc droga do niego nie znika, tylko wymaga decyzji
      - Same kanały, pobieranie wpisów i czytanie ich pozostają bez zmian
      - Przeglądarka, usługi systemowe i aplikacje serwerowe pozostają bez zmian
    en:
      - Enclosures joined to entries cease to fetch themselves and have to be reached for by hand
      - The link to the file stays in the entry, so the road to it does not go but calls for a decision
      - The feeds themselves, the fetching of entries and the reading of them stay unchanged
      - The browser, system services and server applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Automatyczne pobieranie załączników z kanału jest na tej maszynie drogą dostarczania plików roboczych
    en:
      - The automatic fetching of enclosures from a feed is on this machine a road for delivering working files
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds'
      $name = 'DisableEnclosureDownload'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds'
    $name = 'DisableEnclosureDownload'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entries and the link to the file stay; only the automatic fetch goes.
    # Whoever wants the file still fetches it by hand, with a decision.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Internet Explorer\Feeds'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEnclosureDownload' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-inetres

notes:
  pl: |
    Punkt jest piąty w bloku i dotyczy mechanizmu w dużej mierze
    zapomnianego. Warto to przyznać, bo reguła opisana bez tego
    zastrzeżenia brzmi nieszczerze.

    Argument, który ją broni, nie dotyczy popularności kanałów, tylko
    trzech cech kanału naraz: plik ląduje bez decyzji, subskrypcja pracuje
    w tle miesiącami, a o zawartości decyduje strona przeciwna i może ją
    zmienić po założeniu subskrypcji. Kanał zapomniany jest przy tym
    kanałem, którego nikt nie ogląda — i to raczej wzmacnia argument, niż
    go osłabia.

    Kategoria średnia jest postawiona zgodnie z kryterium: punkt nie
    otwiera drogi wejścia sam z siebie, tylko utrzymuje stały dopływ
    plików sterowany z zewnątrz.

    Odnotowuję, że reguła należy do rodziny reguł o przeglądarce
    odziedziczonej, których na tym wydaniu jest sporo. Warto, żeby
    aplikacja nie pokazywała ich jako nieaktualnych — mechanizm nieużywany
    jest nadal mechanizmem włączonym.
  en: |
    The item is the fifth in the block and concerns a mechanism in large part forgotten. That is worth owning, the
    rule described without that reservation sounding insincere.

    The argument defending it does not concern the feeds' popularity but three features of the channel at once: the
    file lands without a decision, the subscription works in the background for months, and what the content is the
    other side decides and may change after the subscription is set up. A forgotten channel is at that a channel
    nobody looks at - and that rather strengthens the argument than weakens it.

    The medium category is set in keeping with the criterion: the item does not open a road in of itself but holds
    a standing inflow of files steered from outside.

    Worth noting that the rule belongs to the family of rules about the inherited browser, of which on this release
    there are a good many. It is well that the application not show them as out of date - a mechanism unused is
    still a mechanism switched on.
