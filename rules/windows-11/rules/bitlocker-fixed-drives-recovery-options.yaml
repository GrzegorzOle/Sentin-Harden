id: win11-bitlocker-fixed-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysków stałych ustalony
    en: The way of recovering access to fixed drives settled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Dysk stały z danymi ginie razem z komputerem rzadziej niż dysk systemowy
    wpada w kłopoty, ale kiedy już wpada, traci się to, co na nim leżało:
    katalogi projektów, bazy, archiwa. Klucz odzyskiwania jest jedyną drogą
    powrotu, a jego brak zamienia awarię sprzętu w utratę danych.

    Punkt rozstrzyga o tym kluczu to samo, co punkt bliźniaczy dla dysku
    systemowego: że ma powstać, że ma trafić do usługi katalogowej, że
    szyfrowanie nie ruszy, dopóki tam nie trafi, i że kreator nie pokaże
    użytkownikowi opcji pozwalających te warunki obejść.

    Ostatni warunek jest praktycznie najważniejszy. Klucz zapisany przez
    użytkownika „gdzieś u siebie" to klucz, którego nie ma — a przy dysku
    z danymi jest to szczególnie częste, bo szyfrowanie włącza się tam zwykle
    doraźnie, przy okazji porządkowania czegoś innego.

    Punkt zamyka też drogę pełnomocnika odzyskiwania danych: jeden certyfikat
    otwierający dyski w całej organizacji jest wygodą, która przy przejęciu
    staje się kluczem uniwersalnym.
  en: |
    A fixed data drive is lost with the computer less often than the system drive
    runs into trouble, but when it does, what lay on it goes: project directories,
    databases, archives. The recovery key is the only way back, and its absence
    turns a hardware failure into lost data.

    The item settles the same things about that key as its twin for the system
    drive: that it is to come into being, that it is to go to the directory service,
    that encryption will not start until it does, and that the wizard will not show
    the user options letting those conditions be sidestepped.

    The last condition matters most in practice. A key saved by the user "somewhere
    of their own" is a key that is not there - and with a data drive that is
    especially common, because encryption there is usually switched on ad hoc, while
    tidying up something else.

    The item also closes off the data recovery agent: one certificate opening drives
    across the organisation is a convenience that, once captured, becomes a
    universal key.

disruption_description:
  pl: |
    Jest to punkt, który na maszynie spoza domeny zatrzymuje szyfrowanie dysków
    z danymi, i trzeba to rozstrzygnąć przed wdrożeniem.

    Warunek zapisania klucza w usłudze katalogowej przed rozpoczęciem
    szyfrowania jest bezwzględny. Bez domeny albo bez łączności z nią kreator
    zakończy się błędem o niemożności zapisania informacji odzyskiwania.
    Użytkownik nie zobaczy powodu i zgłosi to jako usterkę szyfrowania.

    Na maszynie w domenie zmiana jest niewidoczna poza tym, że kreator przestaje
    pytać, gdzie zapisać klucz. Dyski zaszyfrowane wcześniej działają bez zmian
    i ich kluczy punkt nie przenosi.

    Wdrożenie wymaga przygotowania po stronie usługi katalogowej. Bez tego
    skutek jest ten sam co poza domeną.

    Nie ma restartu. Zmiana obowiązuje przy następnym włączeniu szyfrowania.
  en: |
    This is an item that halts the encryption of data drives on a machine outside a
    domain, and that has to be settled before the rollout.

    The condition to write the key into the directory service before encryption
    starts is absolute. Without a domain, or without a connection to it, the wizard
    ends with an error about being unable to save the recovery information. The user
    will not see the reason and will report it as a fault in the encryption.

    On a machine in a domain the change is invisible except that the wizard stops
    asking where to save the key. Drives encrypted earlier work unchanged and the
    item does not move their keys.

    The rollout needs preparation on the directory service's side. Without that the
    effect is the same as outside a domain.

    There is no restart. The change takes effect the next time encryption is
    switched on.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Na maszynie spoza domeny zaszyfrowanie dysku stałego nie ruszy, bo klucza nie ma gdzie zapisać
      - Maszyna bez łączności z usługą katalogową nie zaszyfruje dysku do czasu odzyskania łączności
      - Użytkownik przestaje wybierać w kreatorze, gdzie zapisać klucz odzyskiwania
      - Certyfikat pełnomocnika odzyskiwania danych przestaje otwierać dyski szyfrowane po wdrożeniu
    en:
      - On a machine outside a domain, encrypting a fixed drive will not start, as there is nowhere to write the key
      - A machine with no connection to the directory service will not encrypt the drive until the connection returns
      - The user stops choosing in the wizard where to save the recovery key
      - The data recovery agent's certificate stops opening drives encrypted after the rollout
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny albo usługa katalogowa nie przyjmuje informacji odzyskiwania
      - Odzyskiwanie danych opiera się na certyfikacie pełnomocnika i nie przygotowano zamiennika
    en:
      - The machines do not belong to a domain, or the directory service does not accept recovery information
      - Data recovery rests on an agent's certificate and no replacement has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        FDVRecovery                     = 1
        FDVManageDRA                    = 0
        FDVRecoveryPassword             = 2
        FDVRecoveryKey                  = 2
        FDVHideRecoveryPage             = 1
        FDVActiveDirectoryBackup        = 1
        FDVActiveDirectoryInfoToStore   = 1
        FDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'FDVRecovery', 'FDVManageDRA', 'FDVRecoveryPassword', 'FDVRecoveryKey',
      'FDVHideRecoveryPage', 'FDVActiveDirectoryBackup',
      'FDVActiveDirectoryInfoToStore', 'FDVRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      FDVRecovery                     = 1
      FDVManageDRA                    = 0
      FDVRecoveryPassword             = 2
      FDVRecoveryKey                  = 2
      FDVHideRecoveryPage             = 1
      FDVActiveDirectoryBackup        = 1
      FDVActiveDirectoryInfoToStore   = 1
      FDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Warto odnotować różnicę wobec punktu dla dysku systemowego, bo przy
    pobieżnym czytaniu wygląda na niekonsekwencję. Tam hasło odzyskiwania jest
    wymagane, a klucz na nośniku niedopuszczony; tutaj oba są dopuszczone, ale
    żadnego się nie wymaga. Powód jest praktyczny: dysk z danymi bywa
    odzyskiwany na maszynie, która nie jest tą, z której pochodzi, i zawężenie
    sposobów odzyskiwania utrudniałoby to bez zysku — klucz i tak leży
    w usłudze katalogowej.

    Reguła czyta osiem wartości naraz z tego samego powodu co jej odpowiednik
    dla dysku systemowego: maszyna ustawiona w połowie przechodziłaby jako
    ustawiona.

    Na maszynie z jednym dyskiem punkt nie ma skutku praktycznego, ale wpis
    powinien istnieć — dysk bywa dołożony później.
  en: |
    The difference from the item for the system drive is worth noting, because read
    quickly it looks like an inconsistency. There the recovery password is required
    and the key on a medium inadmissible; here both are admitted and neither
    required. The reason is practical: a data drive is sometimes recovered on a
    machine other than the one it came from, and narrowing the ways of recovering it
    would hamper that for no gain - the key lies in the directory service either
    way.

    The rule reads eight values at once for the same reason as its counterpart for
    the system drive: a machine set halfway would pass as set.

    On a machine with one disk the item has no practical effect, but the entry
    should be there - a disk is sometimes added later.
