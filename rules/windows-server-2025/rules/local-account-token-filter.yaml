id: win2025-local-account-token-filter

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Filtrowanie tokenu kont lokalnych przy dostępie sieciowym zachowane
    en: Local account token filtering for network access preserved
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy konto lokalne łączące się z tą maszyną
    przez sieć dostaje token pełny, czy token pozbawiony uprawnień
    administratora.

    Domyślnie system token przycina. Konto należące do administratorów
    lokalnych, łącząc się z maszyną zdalnie, dostaje uprawnienia
    zwykłego użytkownika — administratorem jest dopiero wtedy, gdy
    zaloguje się przy konsoli albo podniesie uprawnienia świadomie.
    Jest to zabezpieczenie przed jedną konkretną rzeczą i warto ją
    nazwać wprost.

    Tą rzeczą jest rozejście się po sieci. Hasło konta lokalnego
    administratora bywa jednakowe na wielu maszynach, bo tak je
    kiedyś wdrożono z jednego obrazu. Bez filtrowania każde takie
    hasło jest kluczem administratora do wszystkich maszyn naraz,
    osiągalnym przez sieć, bez potrzeby zbliżania się do którejkolwiek
    z nich.

    Na serwerze punkt waży bardziej niż na stanowisku roboczym,
    bo serwery bywają wdrażane z tego samego szablonu, a hasło konta
    wbudowanego bywa w nich to samo — i bo z serwera zabiera się więcej
    niż ze stanowiska.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    uprawnienia administratora na tym serwerze przez sieć, na
    poświadczeniach konta lokalnego zdobytych gdzie indziej.
  en: |
    The setting settles whether a local account connecting to this machine over the network gets
    a full token or a token stripped of administrative rights.

    By default the system trims the token. An account standing in the local administrators,
    connecting to the machine remotely, gets an ordinary user's rights - it is an administrator
    only where it signs in at the console or raises its rights knowingly. That is a safeguard
    against one particular thing, and the thing is worth naming outright.

    The thing is a spreading through the network. A local administrator account's password is at
    times the same on many machines, having been rolled out once from a single image. Without
    the filtering every such password is an administrator's key to all the machines at once,
    reachable over the network, with no need of coming near any of them.

    On a server the item weighs more than at a working station, servers being at times rolled
    out from the same template with the same built-in account password in them - and because
    more is taken from a server than from a station.

    What an attacker gains while the item goes unmet: administrative rights on this server over
    the network, on a local account's credentials won elsewhere.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy tym serwerem zarządza się zdalnie na
    koncie lokalnym, bo filtrowanie właśnie takie zarządzanie ogranicza.

    W stanie domyślnym filtrowanie działa, więc na większości serwerów
    naprawa nie zmienia niczego. Niezgodność jest tutaj zawsze
    wynikiem świadomej decyzji — wartość wyłączająca filtrowanie nie
    pojawia się sama.

    I zwykle wiadomo, kto ją wpisał. Filtrowanie przeszkadza przy
    zarządzaniu serwerem spoza domeny: przy konfiguracji zdalnej
    narzędziem automatyzującym, przy zarządzaniu maszyną w strefie
    wydzielonej i przy pracy z serwerem, który do domeny nigdy nie
    należał. W takich miejscach wartość ta bywa wpisywana przez sam
    zestaw konfiguracyjny, bez pytania.

    Objaw po naprawie jest natychmiastowy i czytelny: narzędzie łączy
    się poprawnie, uwierzytelnia poprawnie, a następnie zgłasza brak
    uprawnień do wykonania czynności. Kierunek diagnozy bywa wtedy
    mylny, bo połączenie i logowanie działają — nie działa dopiero to,
    co po nich.

    Rozwiązaniem nie jest powrót do wyłączonego filtrowania. Właściwe
    drogi to włączenie serwera do domeny i zarządzanie kontem domenowym
    albo rozwiązanie nadające kontu lokalnemu hasło niepowtarzalne
    na każdej maszynie — wtedy zdobycie jednego hasła nie otwiera
    pozostałych.

    Zmiana nie wymaga przerwy i dotyczy połączeń nawiązywanych po niej.
  en: |
    What needs checking is whether this server is managed remotely under a local account, the
    filtering bounding just such management.

    In the default state the filtering works, so on most servers the mending changes nothing.
    Non-compliance here is always the fruit of a knowing decision - the value switching the
    filtering off does not appear of itself.

    And it is usually known who wrote it. The filtering gets in the way of managing a server
    outside a domain: at a remote setting up by an automating tool, at the managing of a machine
    in a set-apart zone and at work with a server that never belonged to a domain. In such
    places the value is at times written by the configuration set itself, unasked.

    The symptom after the mending is immediate and plain: the tool connects rightly,
    authenticates rightly, and then reports a want of rights to do the act. The diagnosis is
    then at times pointed wrongly, the connecting and the signing in both working - what does
    not work is only what comes after them.

    The answer is not a return to filtering switched off. The right roads are joining the server
    to a domain and managing it by a domain account, or an arrangement giving the local account
    a password unrepeated on every machine - then the winning of one password opens none of the
    others.

    The change takes no break and bears on connections made after it.

implementation_consequences:
  impact_areas:
    - remote-management
    - accounts-and-passwords
    - scripting-and-automation
    - file-sharing
  what_breaks:
    pl:
      - Zdalne zarządzanie serwerem na koncie lokalnym straci uprawnienia administratora
      - Narzędzie automatyzujące konfigurację spoza domeny zgłosi brak uprawnień po poprawnym zalogowaniu
      - Kierunek diagnozy bywa mylny, bo połączenie i logowanie działają, a nie działa to, co po nich
      - Logowanie przy konsoli i świadome podniesienie uprawnień pozostają bez zmiany
    en:
      - Remote management of the server under a local account will lose administrative rights
      - An automating tool setting the machine up from outside a domain will report a want of rights after a right sign-in
      - The diagnosis is at times pointed wrongly, the connecting and signing in working while what comes after does not
      - Signing in at the console and a knowing raising of rights stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer nie należy do domeny i zarządza się nim zdalnie na koncie lokalnym administratora
      - Konfigurację serwera utrzymuje narzędzie automatyzujące łączące się kontem lokalnym
      - Nie przygotowano drogi zastępczej, czyli konta domenowego albo hasła niepowtarzalnego na każdej maszynie
    en:
      - The server belongs to no domain and is managed remotely under a local administrator account
      - The server's setting up is kept by an automating tool connecting with a local account
      - No spare road was prepared - a domain account, or a password unrepeated on every machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'LocalAccountTokenFilterPolicy'
      $value = $null
      if (Test-Path -Path $path -ErrorAction Stop) {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).$name
      }
      # Here the missing value is the secure state: filtering is the system
      # default and only an explicit 1 switches it off.
      if ($null -eq $value -or [int]$value -eq 0) { 'FILTERED' } else { 'NOT_FILTERED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: FILTERED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'LocalAccountTokenFilterPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Remove-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'LocalAccountTokenFilterPolicy' -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/windows-security/user-account-control-and-remote-restriction

notes:
  pl: |
    Naprawa usuwa wartość zamiast wpisywać zero. Filtrowanie jest
    zachowaniem domyślnym, więc brak wartości jest stanem właściwym
    i czytelniejszym niż zero wpisane wprost.

    Niezgodność jest tu zawsze wynikiem świadomej decyzji. Warto
    ustalić, kto i po co ją podjął, zanim się ją cofnie — bywa, że
    wartość wpisuje sam zestaw konfiguracyjny i wróci przy następnym
    przebiegu.

    Punkt czyta się razem z modelem udostępniania dla kont lokalnych.
    Tamten rozstrzyga, kim jest konto lokalne w sieci; ten — jakie
    uprawnienia ze sobą niesie.
  en: |
    The mending removes the value instead of writing a zero. The filtering is the default
    behaviour, so an absent value is the fitting state and a plainer one than a zero written
    outright.

    Non-compliance here is always the fruit of a knowing decision. It is worth settling who took
    it and what for before undoing it - the value is at times written by the configuration set
    itself and will come back at its next run.

    The item is read together with the sharing model for local accounts. That one settles who a
    local account is on the network; this one what rights it carries with it.
