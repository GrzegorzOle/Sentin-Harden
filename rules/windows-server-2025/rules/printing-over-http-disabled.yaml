id: win2025-printing-over-http-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Internet Communication Management > Internet Communication settings
  title:
    pl: Blokada wysyłania wydruków protokołem sieciowym przeglądarki
    en: Printing over the browser network protocol blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza możliwość wysyłania wydruków do drukarki protokołem
    używanym przez przeglądarki, zamiast zwykłym protokołem drukowania
    w sieci lokalnej.

    Kategoria średnia, a rzecz, którą trzeba nazwać, dotyczy zasięgu. Zwykłe
    drukowanie sieciowe działa w obrębie sieci lokalnej i nie przechodzi
    przez zapory tak łatwo. Drukowanie tym protokołem działa wszędzie tam,
    gdzie działa ruch przeglądarki — a ruch przeglądarki z serwera na ogół
    wychodzi, bo wypuszcza się go dla aktualizacji i dla narzędzi
    obsługowych.

    To jest właściwa treść punktu. Dokument wysyłany do druku opuszcza
    maszynę tą samą drogą, którą wychodzi ruch dozwolony, więc nie zatrzyma
    go reguła zapory ustawiona przeciwko drukowaniu, ani nie wyróżni się
    w zestawieniu połączeń. Na serwerze plików albo kontrolerze domeny
    drukowany dokument to zwykle sprawozdanie, wykaz kont albo wydruk
    konfiguracji.

    Druga strona to sama obecność obsługi tego protokołu w usłudze
    buforowania wydruku. Ta usługa pracuje z wysokimi uprawnieniami i ma
    długą historię błędów; każdy sposób podania jej danych, którego nie
    potrzebujemy, warto odebrać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wyprowadzenia dokumentu z serwera kanałem, który wygląda na zwykły ruch
    sieciowy.
  en: |
    The item switches off the ability to send print jobs to a printer using
    the protocol browsers use, instead of the ordinary local network printing
    protocol.

    The category is medium, and the thing to name concerns reach. Ordinary
    network printing works within the local network and does not pass
    firewalls so easily. Printing by this protocol works everywhere browser
    traffic works - and browser traffic from a server generally gets out,
    because it is let out for updates and for management tools.

    That is the real substance of the item. A document sent to print leaves
    the machine by the same route as permitted traffic, so no firewall rule
    set against printing will stop it, nor will it stand out in a list of
    connections. On a file server or a domain controller, a printed document
    is usually a report, a list of accounts or a printout of a
    configuration.

    The other side is the mere presence of support for this protocol in the
    print spooler service. That service runs with high privileges and has a
    long history of faults; every way of feeding it data that we do not need
    is worth taking away.

    What an attacker gains while the item goes unmet: a way of getting a
    document out of the server by a channel that looks like ordinary network
    traffic.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na większości serwerów ta zmiana
    nie zrobi nic — tego sposobu drukowania prawie nikt nie używa
    i w praktyce jest on pozostałością.

    Sprawdzić trzeba dwie rzeczy. Pierwsza: czy któraś drukarka jest
    podłączona przez adres internetowy zamiast przez nazwę serwera wydruku
    albo adres w sieci lokalnej. Takie połączenie przestanie działać i to
    jest cała lista skutków. Druga: czy na maszynie stoi aplikacja
    drukująca do usługi zewnętrznej — bywa to spotykane przy systemach
    wysyłkowych i przy oprogramowaniu księgowym, które drukuje do usługi
    archiwizującej.

    Czego to nie psuje — i warto to rozróżnić, bo nazwa punktu budzi
    większy niepokój, niż zasługuje. Zwykłe drukowanie sieciowe działa.
    Drukarki podłączone przez serwer wydruku działają. Drukarki lokalne
    działają. Rola serwera wydruku działa. Wyłączamy jeden sposób
    adresowania drukarki, nie drukowanie.

    Rzecz do zapamiętania: ten punkt i blokada pobierania sterowników z
    internetu leżą pod jedną ścieżką rejestru, pod różnymi nazwami wartości.
    Znajoma ścieżka nie znaczy, że drugi punkt jest zrobiony.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", although on most servers this change will do
    nothing - hardly anybody uses this way of printing and in practice it is
    a leftover.

    Two things need checking. First: whether any printer is attached by an
    internet address rather than by the name of a print server or an address
    on the local network. Such a connection will stop working, and that is
    the whole list of effects. Second: whether an application on the machine
    prints to an outside service - this is met with in dispatch systems and
    in accounting software that prints to an archiving service.

    What this does not break - and the distinction is worth making, because
    the item's name causes more alarm than it deserves. Ordinary network
    printing works. Printers attached through a print server work. Local
    printers work. The print server role works. What is switched off is one
    way of addressing a printer, not printing.

    Something to remember: this item and the block on fetching drivers from
    the internet lie under one registry path, under different value names. A
    familiar path does not mean the other item is done.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - network-and-firewall
  what_breaks:
    pl:
      - Drukarka podłączona przez adres internetowy zamiast przez serwer wydruku albo adres w sieci lokalnej przestanie działać
      - Aplikacja drukująca do usługi zewnętrznej straci tę drogę — bywa to spotykane przy systemach wysyłkowych i oprogramowaniu księgowym
      - Zwykłe drukowanie sieciowe, drukarki przez serwer wydruku, drukarki lokalne i rola serwera wydruku działają bez zmian
      - Punkt leży pod tą samą ścieżką rejestru co blokada pobierania sterowników z internetu, pod inną nazwą wartości
    en:
      - A printer attached by an internet address rather than through a print server or a local network address stops working
      - An application printing to an outside service loses that route - met with in dispatch systems and accounting software
      - Ordinary network printing, printers through a print server, local printers and the print server role work unchanged
      - The item lies under the same registry path as the block on fetching drivers from the internet, under a different value name
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja drukująca do usługi zewnętrznej albo drukarka podłączona przez adres internetowy
    en:
      - An application on the machine prints to an outside service, or a printer is attached by an internet address
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'DisableHTTPPrinting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'DisableHTTPPrinting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This way of printing reaches everywhere browser traffic reaches, so a
    # document leaves by the same route as permitted traffic. Ordinary network
    # printing, print servers and local printers are untouched - what goes is
    # one way of addressing a printer.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableHTTPPrinting' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/print-management-group-policy

notes:
  pl: |
    Rzecz dotyczy zasięgu. Zwykłe drukowanie sieciowe działa w obrębie sieci
    lokalnej. Ten protokół działa wszędzie tam, gdzie działa ruch
    przeglądarki — a ten z serwera na ogół wychodzi, bo wypuszcza się go dla
    aktualizacji i narzędzi obsługowych.

    Dokument wysłany do druku opuszcza maszynę drogą ruchu dozwolonego, więc
    nie zatrzyma go reguła zapory ustawiona przeciwko drukowaniu ani nie
    wyróżni się w zestawieniu połączeń.

    Druga strona to sama obecność obsługi tego protokołu w usłudze
    buforowania wydruku, pracującej z wysokimi uprawnieniami i mającej długą
    historię błędów.
  en: |
    The matter is reach. Ordinary network printing works within the local
    network. This protocol works everywhere browser traffic works - and that
    generally gets out of a server, because it is let out for updates and
    management tools.

    A document sent to print leaves the machine by the route of permitted
    traffic, so no firewall rule set against printing will stop it, nor will
    it stand out in a list of connections.

    The other side is the mere presence of support for this protocol in the
    print spooler, a service running with high privileges and carrying a long
    history of faults.
