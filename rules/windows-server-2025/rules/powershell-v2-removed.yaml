id: win2025-powershell-v2-removed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Features
  title:
    pl: Silnik PowerShell w wersji 2 usunięty
    en: PowerShell version 2 engine removed
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa z systemu stary silnik powłoki skryptowej, pozostawiony
    obok bieżącego dla zgodności ze skryptami sprzed wielu lat.

    Kategoria wysoka i chcę nazwać, na czym polega problem, bo brzmi to jak
    porządkowanie starych składników. Rzecz nie w tym, że silnik jest stary.
    Rzecz w tym, że nie zna żadnego z mechanizmów nadzoru dodanych później.
    Nie zapisuje treści wykonywanych poleceń, nie zgłasza się do mechanizmu
    kontroli skryptów, nie podlega trybowi ograniczonego języka.

    To jest właściwa treść punktu. Na maszynie z oboma silnikami napastnik
    ma wybór, którym uruchomić swój kod — a wybór ten jest jednym
    parametrem. Wybierze ten, który niczego nie zapisze. Cała praca włożona
    w rejestrowanie i ograniczanie skryptów dotyczy wtedy wyłącznie tych,
    którzy nie próbowali jej obejść.

    Na serwerze waży dodatkowo to, że dzienniki skryptów są tu często
    jedynym zapisem tego, co ktoś robił w sesji administracyjnej. Silnik
    niezostawiający wpisów zabiera nie tylko zabezpieczenie, ale i materiał
    do odtworzenia zdarzeń po fakcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    uruchomienia kodu w powłoce, który nie trafia do dzienników i nie
    podlega ograniczeniom nałożonym na skrypty.
  en: |
    The item removes from the system the old scripting shell engine, left
    beside the current one for compatibility with scripts written many years
    ago.

    The category is high, and I want to name where the problem lies, because
    this sounds like tidying up old components. The matter is not that the
    engine is old. The matter is that it knows none of the oversight
    mechanisms added later. It does not record the text of the commands it
    runs, does not present itself to the script control mechanism, and is not
    subject to the restricted language mode.

    That is the real substance of the item. On a machine with both engines an
    attacker has a choice of which to run their code with - and that choice
    is a single parameter. They will choose the one that records nothing. All
    the work put into logging and restricting scripts then covers only those
    who did not try to get round it.

    On a server it weighs additionally that script logs are often the only
    record here of what somebody did in an administrative session. An engine
    that leaves no entries takes away not only a protection but also the
    material for reconstructing events after the fact.

    What an attacker gains while the item goes unmet: a way of running code
    in the shell which does not reach the logs and is not subject to the
    restrictions placed on scripts.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i jest to jedyna reguła w tym bloku, która
    wymaga restartu — a więc okna serwisowego, nie kliknięcia.

    Sprawdzenie dotyczy skryptów i narzędzi, które wprost żądają starego
    silnika. Robi się to jednym parametrem przy wywołaniu powłoki, więc
    szuka się tego w zadaniach zaplanowanych, w skryptach instalacyjnych
    i w narzędziach dostarczonych przez producentów sprzętu. Po usunięciu
    silnika takie wywołanie kończy się błędem od razu, przy starcie —
    to akurat dobra wiadomość, bo awaria jest głośna, a nie cicha.

    Drugie miejsce do sprawdzenia to starsze oprogramowanie zarządzające
    i starsze moduły administracyjne, które bywają pisane pod składnię
    sprzed lat. Tu również objawem jest błąd przy uruchomieniu.

    Warto też wiedzieć, że sam składnik jest opcjonalny i na części instalacji
    serwera po prostu go nie ma. Audyt odróżni jedno od drugiego, bo czyta
    stan składnika, a nie obecność pliku.

    Czego to nie psuje: bieżącej powłoki, wszystkich zwykłych skryptów,
    modułów administracyjnych systemu, zdalnego zarządzania ani niczego,
    co nie żąda starego silnika wprost.

    Wymaga restartu i cofnięcie również wymaga restartu — planuj to razem
    z innymi zmianami potrzebującymi okna.
  en: |
    The class is "needs review", and this is the only rule in this block that
    requires a restart - and so a service window, not a click.

    The review concerns scripts and tools that explicitly ask for the old
    engine. That is done by a single parameter when the shell is called, so
    one looks for it in scheduled tasks, in installation scripts and in tools
    supplied by hardware makers. After the engine is removed such a call
    fails at once, at startup - which is in fact good news, because the
    failure is loud rather than quiet.

    The second place to check is older management software and older
    administrative modules, which are sometimes written for a syntax of years
    ago. Here too the symptom is an error at startup.

    It is also worth knowing that the component itself is optional and on
    some server installations is simply not present. The audit tells one from
    the other, because it reads the component's state rather than the
    presence of a file.

    What this does not break: the current shell, all ordinary scripts, the
    system's administrative modules, remote management, or anything that does
    not ask for the old engine explicitly.

    It requires a restart, and undoing it requires a restart too - plan it
    together with other changes that need a window.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
    - logging-and-audit
  what_breaks:
    pl:
      - Skrypty i narzędzia żądające starego silnika jednym parametrem przestaną się uruchamiać
      - Awaria jest głośna, a nie cicha — wywołanie kończy się błędem od razu, przy starcie
      - Szukaj takich wywołań w zadaniach zaplanowanych, skryptach instalacyjnych i narzędziach producentów sprzętu
      - Bieżąca powłoka, zwykłe skrypty, moduły administracyjne i zdalne zarządzanie działają bez zmian
    en:
      - Scripts and tools that ask for the old engine by a single parameter stop starting
      - The failure is loud rather than quiet - the call fails at once, at startup
      - Look for such calls in scheduled tasks, installation scripts and tools supplied by hardware makers
      - The current shell, ordinary scripts, administrative modules and remote management work unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje narzędzie albo zadanie żądające starego silnika wprost i nie ma dla niego zamiennika
    en:
      - The machine runs a tool or a task that asks for the old engine explicitly and has no replacement for it
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $feature = Get-WindowsOptionalFeature -Online `
        -FeatureName 'MicrosoftWindowsPowerShellV2Root' -ErrorAction Stop
      if ($null -eq $feature) { 'CHECK_ERROR' } else { [string]$feature.State }
    } catch {
      # Reading optional features needs elevation. Without it the call fails,
      # and a failed read must never be reported as the feature being absent.
      'CHECK_ERROR'
    }
  expected: 'Disabled'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-WindowsOptionalFeature -Online |
      Where-Object { $_.FeatureName -like 'MicrosoftWindowsPowerShellV2*' } |
      Select-Object -Property FeatureName, State |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The old engine knows none of the oversight mechanisms added later: it does
    # not record the commands it runs and is not subject to script restrictions.
    # With both engines present, the choice of which to use is one parameter.
    # Requires a restart; undoing it requires a restart as well.
    Disable-WindowsOptionalFeature -Online `
      -FeatureName 'MicrosoftWindowsPowerShellV2Root' -NoRestart

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($feature in @($b)) {
      if ($feature.State -eq 'Enabled') {
        Enable-WindowsOptionalFeature -Online -FeatureName $feature.FeatureName -NoRestart | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/scripting/windows-powershell/install/windows-powershell-system-requirements

notes:
  pl: |
    Rzecz nie w tym, że silnik jest stary, tylko w tym, że nie zna żadnego
    z mechanizmów nadzoru dodanych później: nie zapisuje treści poleceń,
    nie zgłasza się do kontroli skryptów, nie podlega trybowi ograniczonego
    języka.

    Przy obu silnikach napastnik wybiera jednym parametrem ten, który
    niczego nie zapisze. Cała praca włożona w rejestrowanie skryptów dotyczy
    wtedy tylko tych, którzy nie próbowali jej obejść.

    Jedyna reguła w tym bloku wymagająca restartu — i cofnięcie też go
    wymaga. Składnik jest opcjonalny i bywa nieobecny; audyt czyta stan
    składnika, nie obecność pliku.
  en: |
    The matter is not that the engine is old but that it knows none of the
    oversight mechanisms added later: it does not record the text of
    commands, does not present itself to script control, and is not subject
    to the restricted language mode.

    With both engines present an attacker chooses, by one parameter, the one
    that records nothing. All the work put into logging scripts then covers
    only those who did not try to get round it.

    The only rule in this block requiring a restart - and undoing it requires
    one too. The component is optional and is sometimes absent; the audit
    reads the component's state, not the presence of a file.
