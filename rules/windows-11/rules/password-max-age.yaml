id: win11-password-max-age

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Maksymalny okres ważności hasła
    en: Maximum password age
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Hasło, które nigdy nie wygasa, pozostaje ważne także wtedy, gdy dawno
    wyciekło. Skrót zdjęty z przejętej maszyny, hasło z cudzego wycieku, notatka
    po byłym pracowniku — wszystko to działa dopóty, dopóki nikt nie zmieni
    hasła, a bez wygasania nie ma powodu, żeby ktokolwiek to zrobił.

    Okres ważności ogranicza czas, przez jaki taki materiał jest przydatny. Nie
    wykrywa wycieku i go nie naprawia — po prostu skraca okno, w którym wyciek
    daje dostęp.
  en: |
    A password that never expires stays valid long after it has leaked. A hash
    lifted from a compromised machine, a password from someone else's breach, a
    note left by a former employee - all of it works as long as nobody changes
    the password, and without expiry there is no reason for anyone to.

    A maximum age limits how long such material stays useful. It neither detects
    a leak nor repairs one - it simply shortens the window in which a leak grants
    access.

disruption_description:
  pl: |
    Wygasanie haseł ma złą prasę i częściowo zasłużenie: wymuszane zbyt często
    prowadzi do haseł zmienianych o jedną cyfrę i zapisywanych na kartce. Dlatego
    ten punkt wymaga decyzji o wartości, a nie odruchowego wdrożenia — przy
    długim haśle i uwierzytelnianiu wieloskładnikowym krótki okres przynosi
    więcej szkody niż pożytku.

    Skutek praktyczny jest przewidywalny: w dniu wygaśnięcia użytkownicy muszą
    zmienić hasło, a wszystko, co ma je zapisane — poczta na telefonie, konta
    usług, zadania harmonogramu — przestaje działać do czasu aktualizacji. Bez
    zaplanowania tej fali zmiana generuje falę zgłoszeń.
  en: |
    Password expiry has a bad reputation, partly deserved: enforced too often it
    leads to passwords changed by one digit and written on a sticky note. This
    item therefore calls for a decision about the value rather than a reflex
    rollout - with a long password and multi-factor authentication a short
    period does more harm than good.

    The practical effect is predictable: on the expiry day users must change
    their password, and everything that has it stored - mail on a phone, service
    accounts, scheduled tasks - stops working until it is updated. Without
    planning for that wave, the change generates a wave of support calls.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Konta usług i zadań harmonogramu przestaną startować w dniu wygaśnięcia ich hasła
      - Poczta i aplikacje z zapisanym hasłem na urządzeniach mobilnych zaczną zgłaszać błąd logowania
      - Użytkownicy pracujący poza siecią firmową mogą nie otrzymać ostrzeżenia o zbliżającym się wygaśnięciu
    en:
      - Service and scheduled-task accounts stop starting on the day their password expires
      - Mail and applications with a stored password on mobile devices start reporting sign-in errors
      - Users working outside the corporate network may not receive the warning about an approaching expiry
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działają konta usługowe, których hasło jest wpisane w konfiguracji bez procedury rotacji
      - Organizacja świadomie zrezygnowała z wygasania haseł na rzecz długich haseł i drugiego składnika
    en:
      - The machine runs service accounts whose password sits in a configuration with no rotation procedure
      - The organisation has deliberately dropped password expiry in favour of long passwords and a second factor
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') {
          # -1 means "never expires". It must not pass an upper-bound comparison
          # as if it were the smallest possible number of days.
          if ([int]$Matches[1] -lt 1) { 'NEVER' } else { $Matches[1] }
        } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '365'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MaximumPasswordAge'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MaximumPasswordAge = 365',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MaximumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/maximum-password-age

notes:
  pl: |
    Wartość progowa jest tu świadomie górną granicą, a nie zaleceniem: punkt
    sprawdza, czy hasło w ogóle wygasa i czy nie po zbyt długim czasie. Wartość
    -1 znaczy „nigdy" i jest raportowana jako „NEVER", żeby nie przeszła przez
    porównanie liczbowe jako najmniejsza możliwa liczba dni.
  en: |
    The threshold here is deliberately an upper bound rather than a
    recommendation: the item checks that the password expires at all and not
    after an excessive time. The value -1 means "never" and is reported as
    "NEVER", so it cannot pass a numeric comparison as the smallest possible
    number of days.
