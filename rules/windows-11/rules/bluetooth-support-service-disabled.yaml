id: win11-bluetooth-support-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi łączności bezprzewodowej bliskiego zasięgu wyłączona
    en: The support service for short range wireless connectivity disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa odpowiada za odnajdywanie urządzeń w pobliżu, parowanie z nimi
    i utrzymywanie połączeń bliskiego zasięgu. Dopóki działa, maszyna jest
    widoczna i osiągalna dla sprzętu, który znalazł się obok niej — bez
    żadnego kabla, bez sieci i bez przejścia przez zaporę.

    To właśnie odróżnia tę drogę od pozostałych opisanych w tej paczce.
    Wszystkie inne zakładają, że napastnik jest gdzieś w sieci. Ta zakłada
    tylko, że jest w tym samym pomieszczeniu albo za ścianą — na korytarzu,
    w sąsiednim biurze, na parkingu pod oknem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, zależy od tego,
    co uda mu się podłączyć. Najpoważniejszy przypadek to urządzenie
    przedstawiające się jako klawiatura: sparowane, wprowadza znaki tak samo
    jak klawiatura prawdziwa, a system nie ma sposobu odróżnić jednej od
    drugiej. Wpisanie kilkudziesięciu znaków wystarczy, żeby uruchomić
    cokolwiek.

    Osobno liczy się sama widoczność. Maszyna rozgłaszająca swoją obecność
    mówi, że istnieje, jak się nazywa i mniej więcej gdzie jest — a to bywa
    informacją wartościową przed wejściem zupełnie inną drogą.
  en: |
    The service is responsible for finding devices nearby, pairing with them and keeping
    up short range connections. While it runs, the machine is visible and reachable to
    hardware that has come near it - with no cable, no network and no passing through a
    firewall.

    That is what sets this route apart from the others described in this pack. All the
    others assume an attacker is somewhere on the network. This one assumes only that
    they are in the same room or behind a wall - in the corridor, in the next office, in
    the car park under the window.

    What an attacker gains while the item goes unmet depends on what they manage to
    attach. The gravest case is a device presenting itself as a keyboard: once paired, it
    enters characters just as a real keyboard does, and the system has no way of telling
    one from the other. A few dozen characters are enough to start anything at all.

    Visibility counts separately. A machine broadcasting its presence says that it
    exists, what it is called and roughly where it is - and that is sometimes valuable
    information before entering by an entirely different route.

disruption_description:
  pl: |
    To jest zmiana, którą trzeba uzgodnić z osobami pracującymi na maszynie,
    i jedna z nielicznych w tej paczce, która potrafi odciąć człowieka od
    własnego komputera.

    Po wyłączeniu usługi przestają działać wszystkie urządzenia bezprzewodowe
    bliskiego zasięgu naraz. Kolejność sprawdzania wynika z tego, co boli
    najbardziej.

    Najpierw urządzenia wskazujące i klawiatury. Na stanowisku wyposażonym
    wyłącznie w bezprzewodową mysz i klawiaturę tego typu wyłączenie usługi
    oznacza utratę sterowania maszyną. Cofnięcie zmiany wymaga wtedy
    podłączenia sprzętu przewodowego albo dostępu zdalnego. Jest to powód,
    dla którego punkt nie nadaje się do trybu zbiorczego pod żadnym warunkiem.

    Potem słuchawki i zestawy głośnomówiące. Na stanowisku, z którego prowadzi
    się rozmowy i spotkania, jest to zmiana odczuwalna codziennie i natychmiast.

    Na końcu reszta: przesyłanie plików z telefonu, pióra, prezentery,
    czytniki. Tu skutek bywa zauważony dopiero po tygodniach, przy pierwszej
    próbie użycia.

    Zmiana wymaga zatrzymania usługi.
  en: |
    This is a change to be agreed with the people working on the machine, and one of the
    few in this pack able to cut a person off from their own computer.

    Once the service is off, every short range wireless device stops working at once. The
    order of checking follows from what hurts most.

    Pointing devices and keyboards first. At a station fitted only with a wireless mouse
    and keyboard of this kind, disabling the service means losing control of the machine.
    Undoing the change then takes attaching wired hardware or reaching the machine
    remotely. That is why the item does not suit bulk mode on any terms.

    Headsets and hands-free sets next. At a station used for calls and meetings this is a
    change felt daily and at once.

    The rest last: sending files from a phone, pens, presenters, readers. There the
    effect is sometimes noticed only weeks later, at the first attempt to use one.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Bezprzewodowa mysz i klawiatura bliskiego zasięgu przestają działać, co odcina sterowanie maszyną
      - Słuchawki i zestawy głośnomówiące przestają się łączyć z maszyną
      - Przesyłanie plików z telefonu do maszyny tą drogą przestaje być możliwe
      - Parowanie nowych urządzeń nie jest możliwe, a pozycje sparowane wcześniej zostają w systemie
    en:
      - A wireless short range mouse and keyboard stop working, which cuts off control of the machine
      - Headsets and hands-free sets stop connecting to the machine
      - Sending files from a phone to the machine by this route stops being possible
      - Pairing new devices is not possible, and items paired earlier stay in the system
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko obsługuje się bezprzewodową myszą albo klawiaturą tego typu
      - Rozmowy i spotkania prowadzi się przez słuchawki bezprzewodowe bliskiego zasięgu
      - Maszyna jest komputerem przenośnym bez portów dla sprzętu przewodowego
    en:
      - The station is operated with a wireless mouse or keyboard of this kind
      - Calls and meetings are held through short range wireless headsets
      - The machine is a portable computer with no ports for wired hardware
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A wireless mouse or keyboard attached this way stops working the moment the
    # service stops.
    Stop-Service -Name 'bthserv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'bthserv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'bthserv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Przed wdrożeniem warto wypisać urządzenia sparowane z maszyną. Lista mówi
    wprost, co przestanie działać, i jest to informacja pewniejsza niż pytanie
    użytkownika, czy z czegoś takiego korzysta — sprzęt tego rodzaju bywa
    używany codziennie bez świadomości, jaką drogą się łączy.

    Wyłączenie usługi nie usuwa urządzeń sparowanych wcześniej ani nie
    wyłącza samego układu radiowego. Po cofnięciu zmiany urządzenia wracają
    bez ponownego parowania.

    Na maszynie bez układu radiowego tego typu usługa zwykle istnieje mimo to
    i audyt zwróci jej tryb uruchamiania, a nie wynik „nie dotyczy".
    Wyłączenie jej jest wtedy zmianą bez skutków i nadal wartą zrobienia —
    układ radiowy bywa dołączany później przez port zewnętrzny.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    Listing the devices paired with the machine is worth doing before a rollout. The list
    says outright what will stop working, and it is surer information than asking the
    user whether they use anything of the sort - hardware of this kind is sometimes used
    daily with no awareness of how it connects.

    Disabling the service removes neither devices paired earlier nor the radio itself.
    Once the change is undone, the devices come back without being paired again.

    On a machine with no radio of this kind the service usually exists all the same, and
    the audit will return its startup mode rather than a "not applicable" result.
    Disabling it is then a change with no effects and still worth making - a radio is
    sometimes attached later through an external port.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
