id: win2016-system-time-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana czasu systemowego ograniczona do administratorów i usługi lokalnej
    en: Changing the system time restricted to administrators and the local service
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do zmiany czasu systemowego do administratorów
    lokalnych i konta usługi lokalnej.

    Czas wygląda na ustawienie porządkowe i nim nie jest. W sieci Windows czas
    jest częścią uwierzytelniania: bilet wydany przez kontroler domeny ma
    ważność liczoną w minutach, a maszyna, której zegar odbiega od kontrolera
    o więcej niż dopuszczalny margines, przestaje przyjmować logowania w ogóle.

    To działa też w drugą stronę i tam leży ryzyko. Cofnięcie zegara sprawia,
    że bilet wygasły znów wygląda na ważny; przesunięcie go do przodu unieważnia
    bilety bieżące. Jedno i drugie da się wykorzystać, a żadne nie wymaga
    łamania czegokolwiek.

    Drugi skutek dotyczy dzienników. Znacznik czasu przy zdarzeniu bierze się
    z zegara maszyny, więc kto zmienia zegar, ten zmienia kolejność
    i wiarygodność zapisu — również wstecz, jeżeli zdąży przed wysłaniem
    dziennika dalej.

    Kategoria wysoka. Na serwerze 2016 waży to tym bardziej, że maszyny tego
    rocznika bywają wirtualne i ich zegar już raz bywał źródłem kłopotu przy
    synchronizacji z hostem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wpływ na ważność
    biletów uwierzytelniania i na wiarygodność znaczników czasu w dziennikach.
  en: |
    The item limits the right to change the system time to the local
    administrators and the local service account.

    Time looks like a housekeeping setting and is not. In a Windows network time is
    part of authentication: a ticket issued by a domain controller has a validity
    measured in minutes, and a machine whose clock departs from the controller's by
    more than the permitted margin stops accepting sign-ins at all.

    That works the other way too, and there the risk lies. Turning the clock back
    makes an expired ticket look valid again; moving it forward invalidates the
    current ones. Either can be turned to account, and neither requires anything to
    be cracked.

    The second effect concerns the logs. An event's timestamp comes from the
    machine's clock, so whoever changes the clock changes the order and the
    credibility of the record - backwards too, if they manage it before the log is
    sent on.

    The category is high. On Server 2016 it weighs the more because machines of
    this vintage are often virtual, and their clock has already been a source of
    trouble once, over synchronisation with the host.

    What an attacker gains while the item goes unmet: influence over the validity
    of authentication tickets and over the credibility of timestamps in the logs.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo lista ta bywa rozszerzona o konta, które
    czas rzeczywiście ustawiają.

    Najczęstszy przypadek to maszyna wirtualna z narzędziami gościa
    synchronizującymi zegar z hostem. Konto usługi tych narzędzi bywa na liście
    i po zawężeniu jej synchronizacja przestanie działać — a objawem nie będzie
    błąd, tylko powolne rozjeżdżanie się zegara, zauważone po tygodniach.

    To jest ten przypadek, w którym skutek jest cichy i odroczony, więc warto
    ustalić go przed zmianą, a nie po. Na maszynie wirtualnej w domenie
    właściwym rozwiązaniem bywa zresztą wyłączenie synchronizacji z hostem
    i pozostawienie synchronizacji domenowej, bo dwa źródła czasu naraz są
    problemem same w sobie.

    Drugi przypadek to konta aplikacji branżowych ustawiających czas przy
    starcie. Jest to praktyka z czasów sprzed powszechnej synchronizacji
    sieciowej i na serwerach tego rocznika wciąż się zdarza.

    Czego to nie psuje: synchronizacji czasu z kontrolerem domeny,
    synchronizacji przez usługę czasu systemu ani zmiany strefy czasowej, którą
    opisuje osobna reguła.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because this list is sometimes widened by accounts
    that genuinely do set the time.

    The commonest case is a virtual machine with guest tools synchronising the
    clock with the host. Those tools' service account is sometimes on the list, and
    after the list is narrowed the synchronisation will stop working - and the
    symptom will not be an error but a slow drift of the clock, noticed weeks
    later.

    This is the case where the effect is quiet and deferred, so it is worth
    establishing before the change rather than after. On a virtual machine in a
    domain the right answer is often to switch off synchronisation with the host
    and leave the domain's, since two sources of time at once are a problem in
    themselves.

    The second case is the accounts of line-of-business applications that set the
    time at startup. That is a practice from before network synchronisation was
    universal, and on servers of this vintage it still happens.

    What this does not break: time synchronisation with the domain controller,
    synchronisation through the system's time service, or changing the time zone,
    which a separate rule describes.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - logging-and-audit
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Narzędzia gościa maszyny wirtualnej synchronizujące zegar z hostem przestają go ustawiać
      - Objawem nie jest błąd, tylko powolne rozjeżdżanie się zegara zauważone po tygodniach
      - Aplikacja branżowa ustawiająca czas przy starcie kończy tę czynność błędem
      - Synchronizacja z kontrolerem domeny i przez usługę czasu systemu działa bez zmian
    en:
      - A virtual machine's guest tools synchronising the clock with the host stop setting it
      - The symptom is not an error but a slow drift of the clock noticed weeks later
      - A line-of-business application setting the time at startup ends that action in an error
      - Synchronisation with the domain controller and through the system's time service works unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest wirtualna, a zegar synchronizuje narzędzie gościa na koncie spoza grupy administratorów
      - Na liście jest konto aplikacji ustawiającej czas przy starcie i nie ustalono, czy to jeszcze potrzebne
    en:
      - The machine is virtual and the clock is synchronised by a guest tool under an account outside the administrators group
      - The list holds an account of an application setting the time at startup and it has not been established whether that is still needed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemTimePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemTimePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemTimePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a virtual machine check the guest tools first. Their synchronisation does
    # not fail with an error - the clock simply drifts, and that is noticed weeks
    # later.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemTimePrivilege = *S-1-5-32-544,*S-1-5-19',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemTimePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/change-the-system-time

notes:
  pl: |
    Zmiana strefy czasowej jest osobnym uprawnieniem i opisuje ją osobna reguła.
    Strefa przesuwa wyłącznie sposób wyświetlania czasu i nie dotyka zegara,
    więc jej wpływ na uwierzytelnianie jest żaden — dlatego tam lista bywa
    szersza i jest to poprawne.

    Konto usługi lokalnej zostaje na liście celowo, bo usługa czasu systemu
    działa właśnie na nim. Usunięcie go zatrzymałoby synchronizację domenową,
    czyli dokładnie to, co ma tu działać.

    Na maszynie wirtualnej w domenie warto rozstrzygnąć, które źródło czasu
    obowiązuje. Dwa naraz — host i kontroler domeny — dają zegar, który
    poprawiają na zmianę i żadne z nich nie wygrywa na stałe.
  en: |
    Changing the time zone is a separate right and a separate rule describes it.
    The zone shifts only how time is displayed and does not touch the clock, so its
    bearing on authentication is nil - which is why the list there is sometimes
    wider, and rightly so.

    The local service account stays on the list deliberately, because the system's
    time service runs under it. Removing it would stop the domain synchronisation,
    that is, exactly what is meant to work here.

    On a virtual machine in a domain it is worth settling which source of time
    holds. Two at once - the host and the domain controller - give a clock the two
    correct in turn, with neither winning for good.
