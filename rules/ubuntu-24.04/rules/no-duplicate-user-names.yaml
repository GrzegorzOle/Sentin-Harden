id: ubuntu2404-no-duplicate-user-names

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 7.2.7
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Żadna nazwa konta nie powtarza się w /etc/passwd
    en: Ensure no duplicate user names exist
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Programy szukają konta po nazwie i biorą pierwszy pasujący wpis. Drugie
    konto o tej samej nazwie, ale z innym UID lub katalogiem domowym, jest
    niewidoczne dla logowania, a mimo to może mieć pliki i wpisy w sudoers
    czy kluczach SSH, które nie działają tak, jak wygląda.

    Punkt wymaga, żeby każda nazwa konta występowała w /etc/passwd raz.
  en: |
    Programs look up an account by name and take the first matching entry.
    A second account with the same name but another UID or home directory
    is invisible to login, yet it can own files and appear in sudoers or SSH
    keys that do not work the way they look.

    The item requires every account name to appear in /etc/passwd once.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/passwd.
  en: |
    Nobody will notice: the check only reads /etc/passwd.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd"; exit 0; }
    o=$(awk -F: '$1 != "" { n[$1]++; w[$1] = w[$1] (w[$1] == "" ? "" : "+") NR }
      END { for (k in n) if (n[k] > 1) print k "=" w[k] }' /etc/passwd | sort | paste -sd, -)
    if [ -n "$o" ]; then echo "NOT_OK:user-$o"; else echo "OK:no-duplicate-user-names"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/passwd.5.html
  - https://man7.org/linux/man-pages/man8/pwck.8.html

notes:
  pl: |
    Wynik NOT_OK podaje każdą powtórzoną nazwę z numerami wierszy
    /etc/passwd, na przykład user-anna=12+31. Zbędny wpis usuwa się albo
    zmienia ręcznie (userdel, usermod -l) po sprawdzeniu, do którego konta
    należą pliki; pwck -r pokazuje też inne niespójności. Test działa bez
    roota. Reguła tylko sprawdza stan.
  en: |
    The NOT_OK result gives each repeated name with the line numbers in
    /etc/passwd, for example user-anna=12+31. The extra entry is removed or
    renamed by hand (userdel, usermod -l) after checking which account owns
    the files; pwck -r also shows other inconsistencies. The test works
    without root. The rule only checks the state.
