id: win2025-remote-interactive-logon-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie przez pulpit zdalny ograniczone do administratorów i użytkowników pulpitu zdalnego
    en: Logging on through remote desktop restricted to administrators and remote desktop users
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo rozstrzyga, kto może założyć sesję pulpitu zdalnego na tej
    maszynie.

    Na serwerze jest to droga główna, a nie poboczna. Praca
    administracyjna odbywa się właśnie tędy, więc wykaz przypisany do
    tego prawa jest w praktyce wykazem osób mających dostęp do maszyny.
    Tym punkt różni się od paczki stanowiska roboczego, gdzie pulpit
    zdalny bywa włączany doraźnie albo nie bywa włączany wcale.

    Sesja pulpitu zdalnego daje więcej niż połączenie sieciowe do
    udziału czy do zarządzania. Jest pełnym środowiskiem pracy:
    z uruchamianiem programów, z dostępem do schowka i, jeżeli tak
    skonfigurowano, z przekierowaniem dysków i drukarek. Konto, które
    tu wejdzie, nie odczytuje pojedynczego zasobu — ono na tej maszynie
    pracuje.

    Druga rzecz dotyczy poświadczeń. Sesja zdalna pozostawia w pamięci
    maszyny materiał uwierzytelniający, a maszyna, do której loguje się
    wiele osób o różnych uprawnieniach, staje się miejscem, gdzie
    poświadczenia wyższe leżą obok sesji niższych. Zawężenie wykazu
    zmniejsza liczbę takich sąsiedztw.

    Punkt zawęża wykaz do administratorów i grupy użytkowników pulpitu
    zdalnego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne
    środowisko pracy na serwerze z konta zwykłego oraz sąsiedztwo
    poświadczeń pozostawionych przez sesje osób uprawnionych wyżej.
  en: |
    The right settles who may open a remote desktop session on this machine.

    On a server that is the main road, not a side one. Administrative work goes just that way,
    so the list set on this right is in practice the list of people with access to the machine.
    Therein the item differs from the working station's pack, where remote desktop is turned on
    as the need arises or is not turned on at all.

    A remote desktop session gives more than a network connection to a share or to management.
    It is a full working environment: with the starting of programs, with access to the
    clipboard and, where so set up, with disks and printers carried across. An account that
    comes in here does not read a single resource - it works on this machine.

    A second matter bears on credentials. A remote session leaves authenticating material in the
    machine's memory, and a machine many people of differing rights log in to becomes a place
    where higher credentials lie beside lower sessions. A narrowing of the list lessens the
    number of such neighbourhoods.

    The item narrows the list to administrators and the remote desktop users' group.

    What an attacker gains while the item goes unmet: a full working environment on the server
    from an ordinary account, and the neighbourhood of credentials left by the sessions of
    people entitled higher.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy części osób i wymaga
    uprzedzenia ich oraz okna serwisowego, bo dotyczy drogi, którą
    serwerem się administruje.

    Warunkiem wstępnym jest upewnienie się, że konto wprowadzające
    zmianę należy do administratorów albo do grupy użytkowników pulpitu
    zdalnego. Jest to punkt, przy którym pomyłka odcina od maszyny
    natychmiast i bez ostrzeżenia.

    W stanie domyślnym prawo mają administratorzy i grupa użytkowników
    pulpitu zdalnego, więc na części serwerów naprawa nie zmienia
    niczego. Niezgodność bierze się zwykle stąd, że ktoś dopisał do
    wykazu grupę domenową wprost, zamiast wpisać ją do grupy
    użytkowników pulpitu zdalnego.

    I to jest właśnie rozwiązanie przy tym punkcie: kto ma się logować,
    ten trafia do grupy użytkowników pulpitu zdalnego. Wykaz prawa
    pozostaje wtedy zgodny, a dostęp zachowany. Zmiana jest wówczas
    porządkująca, nie odbierająca.

    Osobnym przypadkiem jest serwer terminali. Tam z pulpitu zdalnego
    korzystają wszyscy użytkownicy aplikacji, więc zmiana dotyka
    wszystkich naraz i musi być poprzedzona wpisaniem ich do grupy
    użytkowników pulpitu zdalnego.

    Skutek jest natychmiastowy i widoczny: połączenie zostaje odrzucone
    z komunikatem o braku prawa do logowania zdalnego. Sesje już
    otwarte działają dalej, więc skutek ujawnia się przy następnym
    połączeniu.
  en: |
    The change surely changes how some people work and takes a warning to them and a service
    window, since it bears on the road the server is administered by.

    The precondition is making sure that the account bringing the change in belongs to the
    administrators or to the remote desktop users' group. It is an item where a slip cuts one
    off from the machine at once and without warning.

    In the default state administrators and the remote desktop users' group hold the right, so
    on some servers the mending changes nothing. Non-compliance usually comes of somebody having
    added a domain group to the list outright instead of writing it into the remote desktop
    users' group.

    And that is just the answer at this item: whoever is to log in goes into the remote desktop
    users' group. The right's list then stays compliant and the access is kept. The change is
    then one of tidying rather than of taking away.

    A separate case is a terminal server. There every user of the application uses remote
    desktop, so the change touches all of them at once and must be preceded by their being
    written into the remote desktop users' group.

    The effect is immediate and plain to see: the connection is turned away with a message about
    wanting the right to log on remotely. Sessions already open go on working, so the effect
    shows at the next connection.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - accounts-and-passwords
  what_breaks:
    pl:
      - Grupa domenowa dopisana do wykazu wprost straci możliwość łączenia się pulpitem zdalnym
      - Na serwerze terminali zmiana dotyczy wszystkich użytkowników aplikacji naraz
      - Wpisanie osób do grupy użytkowników pulpitu zdalnego zachowuje dostęp i utrzymuje zgodność
      - Sesje już otwarte działają dalej, a skutek ujawnia się przy następnym połączeniu
    en:
      - A domain group added to the list outright will lose the means of connecting by remote desktop
      - On a terminal server the change touches every user of the application at once
      - Writing people into the remote desktop users' group keeps the access and holds compliance
      - Sessions already open go on working, and the effect shows at the next connection
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konto wprowadzające zmianę nie należy do administratorów ani do grupy użytkowników pulpitu zdalnego
      - Serwer jest serwerem terminali, a użytkownicy aplikacji nie zostali wpisani do grupy użytkowników pulpitu zdalnego
      - Nie ustalono, którym grupom domenowym nadano to prawo wprost
    en:
      - The account bringing the change in belongs neither to the administrators nor to the remote desktop users' group
      - The server is a terminal server and the application's users were never written into the remote desktop users' group
      - It has not been settled which domain groups were granted this right outright
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544,S-1-5-32-555|S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRemoteInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRemoteInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRemoteInteractiveLogonRight = *S-1-5-32-544,*S-1-5-32-555',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRemoteInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/allow-log-on-through-remote-desktop-services

notes:
  pl: |
    Punkt nie odbiera nikomu dostępu, jeżeli podejść do niego właściwie.
    Kto ma się logować pulpitem zdalnym, ten trafia do grupy
    użytkowników pulpitu zdalnego — wykaz prawa pozostaje wtedy zgodny,
    a dostęp zachowany.

    Zawężenie dotyczy drogi, którą serwerem się administruje, więc
    pomyłka odcina od maszyny natychmiast. Sprawdź przynależność konta
    wprowadzającego zmianę, zanim ją wprowadzisz.

    Punkt czyta się razem z logowaniem lokalnym. Tamto rządzi konsolą,
    to pulpitem zdalnym, i są to prawa niezależne — zawężenie jednego
    nie dotyka drugiego.
  en: |
    The item takes access from nobody, where it is come at rightly. Whoever is to log in by
    remote desktop goes into the remote desktop users' group - the right's list then stays
    compliant and the access is kept.

    The narrowing bears on the road the server is administered by, so a slip cuts one off from
    the machine at once. Check the standing of the account bringing the change in before
    bringing it in.

    The item is read together with the logging in locally. That one governs the console, this
    one remote desktop, and they are rights apart - a narrowing of the one does not touch the
    other.
