id: win10-machine-account-password-changes-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zmiany hasła konta maszyny nie są wyłączone
    en: Machine account password changes not switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Maszyna w domenie ma własne konto i własne hasło, którym przedstawia się
    kontrolerowi domeny. Hasło to zmienia się samo, cyklicznie, bez udziału
    kogokolwiek — i właśnie ta cykliczność odbiera wartość hasłu wykradzionemu
    z maszyny.

    Wyłączenie zmian bywa zapisywane przy pracach z obrazami maszyn, gdzie
    przywracanie migawki rozjeżdżało hasło między maszyną a katalogiem. Zapis
    zostaje potem na lata, a hasło konta maszyny zastyga w jednym stanie.

    Skutek jest poważniejszy, niż wygląda: mając to hasło, można podszyć się pod
    maszynę w rozmowie z kontrolerem domeny i zbierać to, co maszynie przysługuje.
    Ta zasada pilnuje, żeby zmiany pozostały włączone.
  en: |
    A machine in a domain has an account and a password of its own, which it
    presents to the domain controller. That password changes by itself on a cycle,
    with nobody involved - and it is exactly that cycle which takes the value out
    of a password stolen from the machine.

    Switching the changes off tends to get written during work with machine
    images, where restoring a snapshot put the password out of step between the
    machine and the directory. The entry then stays for years and the machine
    account password sets hard in one state.

    The consequence is graver than it looks. Holding that password, one can pose
    as the machine in conversation with the domain controller and collect what the
    machine is entitled to. This rule keeps the changes switched on.

disruption_description:
  pl: |
    Włączone zmiany hasła są stanem domyślnym i na maszynie pracującej normalnie
    nie zmieniają niczego. Cofnięcie wyłączenia nie wymaga przerwy ani ponownego
    uruchomienia.

    Uwagi wymaga jedno środowisko: maszyny odtwarzane z migawek albo klonowane
    z obrazu. Tam zmiana hasła po odtworzeniu potrafi rozejść się z tym, co
    pamięta katalog, i maszyna traci zaufanie do domeny. Odpowiedzią jest jednak
    poprawienie sposobu odtwarzania, a nie zamrożenie hasła na stałe.
  en: |
    Password changes being on is the default state and on a normally running
    machine it changes nothing. Undoing the switch-off calls for no interruption
    and no restart.

    One environment does need attention - machines restored from snapshots or
    cloned from an image. There a password change after a restore can drift from
    what the directory remembers and the machine loses its trust in the domain.
    The answer, though, is to fix the way restoring is done, not to freeze the
    password for good.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - virtualization-and-containers
  what_breaks:
    pl:
      - Maszyny odtwarzane ze starszych migawek mogą stracić zaufanie do domeny, bo hasło w katalogu zdążyło się zmienić
      - Obrazy przygotowane do klonowania wymagają przygotowania kończącego związek z domeną, inaczej klony będą sobie nawzajem zmieniać hasło
      - Rozwiązania kopii zapasowej odtwarzające całą maszynę muszą uwzględniać ponowne przyłączenie do domeny w razie rozejścia się hasła
      - Logowanie użytkowników, praca na maszynie, usługi i zasady grupy działają bez zmian, dopóki zaufanie do domeny jest zachowane
    en:
      - Machines restored from older snapshots may lose trust in the domain, because the password in the directory has moved on
      - Images prepared for cloning need the step that ends the domain bond, or the clones will change one another s password
      - Backup solutions restoring a whole machine have to allow for rejoining the domain where the password has drifted
      - User sign-in, work on the machine, services and group policy all work unchanged as long as domain trust holds
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny w trakcie prac z obrazami, gdzie wyłączenie zmian jest częścią przygotowania i ma potrwać godziny, nie lata
      - Środowiska odtwarzające stanowiska z migawek starszych niż okres ważności hasła, dopóki procedura nie zostanie poprawiona
    en:
      - Machines mid-way through image work, where switching the changes off is part of preparation and is to last hours, not years
      - Environments restoring stations from snapshots older than the password term, until the procedure is corrected
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisablePasswordChange'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'DisablePasswordChange'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordChange' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-disable-machine-account-password-changes

notes:
  pl: |
    Wartością zgodną jest zero, czyli zmiany włączone; jedynka je wyłącza. Punkt
    łączy się z okresem ważności hasła konta maszyny — bez włączonych zmian
    ustawiony okres nie ma żadnego znaczenia.
  en: |
    The compliant value is zero, meaning changes are on; one switches them off.
    The item ties to the machine account password term - with changes off, the
    term set means nothing at all.
