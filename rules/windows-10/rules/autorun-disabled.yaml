id: win10-autorun-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Autoodtwarzanie wyłączone dla wszystkich napędów
    en: The playing of itself switched off for every drive
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza autoodtwarzanie dla wszystkich rodzajów napędów,
    łącznie z sieciowymi i nierozpoznanymi.

    Autoodtwarzanie jest tym, co dzieje się samo po podłączeniu nośnika:
    otwarcie okna, uruchomienie odtwarzacza, pokazanie zawartości.
    Wygoda polega na tym, że użytkownik nie musi nic robić — i dokładnie
    w tym leży problem.

    Nośnik podłączony do maszyny jest urządzeniem obcym. Zanim człowiek
    zdąży się zastanowić, czy chce go otwierać, system już go odczytał,
    rozpoznał i zaczął pokazywać. Znika moment decyzji, a to jedyny
    moment, w którym można było nie podłączać.

    Ustawienie obejmuje wszystkie rodzaje napędów świadomie. Ograniczenie
    go do nośników wymiennych zostawia otwartą drogę przez napęd sieciowy
    i przez urządzenie, którego system nie umiał zaklasyfikować — a to
    drugie jest właśnie tym, co przynosi napastnik.

    Odnotowuję, że punkt nie utrudnia korzystania z nośnika. Odbiera
    wyłącznie samoczynność: użytkownik otwiera nośnik, kiedy chce, przez
    okno plików.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    i otwarcie nośnika bez decyzji człowieka.
  en: |
    The setting switches off the playing of itself for every kind of drive, those of the network and the unknown
    ones among them.

    The playing of itself is what comes to pass on its own once a carrier is put in: a window opens, a player is
    set going, the content is shown. The ease lies in the user's having to do nothing - and just there lies the
    trouble.

    A carrier put into a machine is a strange device. Before a person has time to weigh whether they would open
    it, the system has already read it, known it and begun to show it. The moment of decision goes, and that is
    the one moment at which it might have been left unconnected.

    The setting takes in every kind of drive by design. The bounding of it to carriers to be taken out leaves open
    the road through a drive of the network and through a device the system could not set in a class - and the
    latter is the very thing an attacker brings.

    I set down that the item makes the use of a carrier no harder. It takes solely the self-acting: the user opens
    the carrier when they will, through the window of files.

    What an attacker gains while the item goes unmet: the reading and the opening of a carrier with no person's
    decision.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    na stanowisku ktoś pracuje z nośnikami stale.

    Miejscem wartym uwagi są stanowiska przyjmujące materiał na nośnikach:
    poligrafia, fotografia, obsługa urządzeń pomiarowych, kancelarie
    przyjmujące dokumenty na pamięciach przenośnych. Tam okno otwierające
    się samo oszczędza kilka sekund przy każdym nośniku, a w ciągu dnia
    sumuje się to w odczuwalną zmianę tempa.

    Odnotowuję, że nie znika nic poza otwieraniem samoczynnym. Nośnik
    widać w oknie plików tak jak dotąd i otwiera się dwoma kliknięciami.

    Miejscem drugim są stanowiska z oprogramowaniem, które liczy na okno
    wyboru przy podłączeniu aparatu albo telefonu. Tam trzeba będzie
    uruchamiać program pierwszy, a nie po podłączeniu urządzenia.

    Skutek jest widoczny dla użytkownika i pojawia się natychmiast, bez
    restartu.

    Czego to nie psuje: dostępu do nośników, kopiowania plików,
    napędów sieciowych, uruchamiania programów, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody at the station works with
    carriers without cease.

    The place worth notice is stations taking in matter upon carriers: printing, picture-making, the keeping of
    instruments of measuring, offices taking in papers upon memories to be carried. There a window that opens of
    itself spares some seconds at every carrier, and over a day that comes together into a change in pace to be
    felt.

    I set down that nothing goes but the opening of itself. The carrier is seen in the window of files as
    hitherto, and opens at two presses.

    The second place is stations with software that counts upon the window of choosing at the putting in of a
    camera or a telephone. There the program will have to be set going first and not upon the device's being put
    in.

    The consequence is plain to the user and shows at once, with no restart.

    What this does not break: the reach of carriers, the copying of files, drives of the network, the setting
    going of programs, logging on, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Stanowiska przyjmujące materiał na nośnikach stracą kilka sekund przy każdym nośniku, co w ciągu dnia daje odczuwalną zmianę tempa
      - Program liczący na okno wyboru przy podłączeniu aparatu albo telefonu trzeba będzie uruchamiać jako pierwszy
      - Nośnik widać w oknie plików tak jak dotąd i otwiera się dwoma kliknięciami
      - Ustawienie obejmuje także napędy sieciowe i urządzenia nierozpoznane, bo tamtędy droga również prowadzi
      - Dostęp do nośników, kopiowanie plików, uruchamianie programów, logowanie i drukowanie pozostają bez zmian
    en:
      - Stations taking in matter upon carriers will lose some seconds at every carrier, which over a day gives a change in pace to be felt
      - A program counting upon the window of choosing at the putting in of a camera or a telephone will have to be set going first
      - The carrier is seen in the window of files as hitherto and opens at two presses
      - The setting takes in drives of the network and unknown devices too, the road leading that way as well
      - The reach of carriers, the copying of files, the setting going of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko przyjmuje materiał na nośnikach seriami i okno otwierające się samo jest częścią przyjętego trybu pracy
    en:
      - The station takes in matter upon carriers in runs and a window that opens of itself is part of the settled manner of work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoDriveTypeAutoRun'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '255'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoDriveTypeAutoRun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is a set of bits, one to a kind of drive. All of them set means
    # every kind, the network and unknown ones among them.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoDriveTypeAutoRun' -Value 255 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-autoplay

notes:
  pl: |
    Reguła idzie w parze z punktem o poleceniach z pliku startowego
    i warto, żeby aplikacja pokazała je razem. Ten odbiera samoczynność,
    tamten odbiera wykonanie polecenia także przy kliknięciu ręcznym.
    Wdrożenie jednego bez drugiego zostawia połowę drogi otwartą.

    Argument wart postawienia wprost dotyczy zakresu. Wartość obejmuje
    wszystkie rodzaje napędów, w tym sieciowe i nierozpoznane. Ograniczenie
    do nośników wymiennych wygląda na rozsądny kompromis, a w praktyce
    zostawia otwartą drogę przez urządzenie, którego system nie umiał
    zaklasyfikować — czyli przez to, co przynosi napastnik.

    Odnotowuję, że koszt jest rzeczywisty na stanowiskach pracujących
    z nośnikami seriami. Warto to wymienić uczciwie, bo punkt bywa
    przedstawiany jako bezkosztowy, a kilka sekund przy każdym nośniku
    sumuje się w ciągu dnia.
  en: |
    The rule goes in a pair with the item about commands out of the file of starting, and it is well that the
    application show them together. This one takes the self-acting, that one takes the setting going of a command
    even at a press by hand. The rolling out of one without the other leaves half the road open.

    The argument worth putting outright touches the reach. The value takes in every kind of drive, those of the
    network and the unknown among them. A bounding to carriers to be taken out looks a sound middle way, and in
    practice leaves open the road through a device the system could not set in a class - which is to say through
    the very thing an attacker brings.

    I set down that the cost is true upon stations working with carriers in runs. It is worth naming honestly, the
    item being at times put forward as costless, while some seconds at every carrier come together over a day.
