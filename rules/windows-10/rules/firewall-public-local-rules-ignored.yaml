id: win10-firewall-public-local-rules-ignored

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Lokalne reguły zapory pomijane w profilu publicznym
    en: Local firewall rules passed over in the public profile
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że w profilu publicznym obowiązują wyłącznie
    reguły zapory pochodzące z zasad, a reguły utworzone na samej maszynie
    są pomijane.

    Reguły lokalne powstają w codziennej pracy: przy instalacji programu,
    w odpowiedzi na pytanie zapory, przy rozwiązywaniu problemu
    z połączeniem. Jest ich z czasem wiele i nikt nie prowadzi ich
    wykazu.

    Punkt nie każe ich usuwać. Każe zawiesić ich działanie w tej jednej
    sieci, w której maszyna jest wśród urządzeń obcych. Reguła otwarta
    kiedyś dla wygody w biurze przestaje otwierać maszynę w hotelu.

    Jest to rozwiązanie celniejsze niż kasowanie reguł, bo nie wymaga
    przeglądania ich po kolei ani rozstrzygania, która jest jeszcze
    potrzebna. W sieciach zaufanych wszystkie działają jak dotąd,
    w publicznej żadna.

    Odnotowuję, że reguły pochodzące z zasad obowiązują w profilu
    publicznym dalej. Punkt nie zostawia maszyny bez zapory — zostawia ją
    z zaporą opisaną wyłącznie przez zasady.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    przez porty otwarte kiedyś lokalnie, także w sieci obcej.
  en: |
    The setting brings it about that in the public profile only the firewall rules coming from policy hold good,
    while the rules made upon the machine itself are passed over.

    Local rules come about in daily work: at the installing of a program, in answer to the firewall's question, at
    the untangling of a trouble with a joining. In time they are many and nobody keeps a roll of them.

    The item does not bid them be deleted. It bids their working be suspended in that one network in which the
    machine stands among strange devices. A rule opened once for ease in an office ceases to open the machine in a
    hotel.

    It is an answer truer than the deleting of rules, calling for no going through them one by one and no settling
    of which is still needed. In trusted networks they all work as hitherto, in the public one none.

    I set down that rules coming from policy hold good in the public profile still. The item leaves the machine
    not without a firewall - it leaves it with a firewall set out by policy alone.

    What an attacker gains while the item goes unmet: a way in through ports opened once locally, in a strange
    network too.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    maszyna potrzebuje w sieci publicznej czegokolwiek, co jest opisane
    regułą lokalną.

    Miejscem najczęstszym jest udostępnianie treści między urządzeniami
    tej samej osoby: przesyłanie plików z telefonu, odtwarzanie na
    telewizorze, połączenie z drukarką stojącą w tym samym pokoju.
    W hotelu albo w wynajętym mieszkaniu sieć jest publiczna, a reguła
    otwierająca ten ruch jest lokalna — więc przestanie obowiązywać.

    Miejscem drugim jest praca zdalna w miejscu, w którym sieć nie została
    oznaczona jako prywatna. Zdarza się to często, bo oznaczenia
    dokonuje się raz, przy pierwszym podłączeniu, i łatwo kliknąć
    niewłaściwie.

    Skutek jest widoczny dla użytkownika: połączenie przychodzące po
    prostu nie dochodzi, bez komunikatu. Warto wymienić, że rozwiązaniem
    jest oznaczenie sieci jako prywatnej tam, gdzie to uzasadnione, a nie
    zniesienie tej zasady.

    Skutek pojawia się natychmiast i wyłącznie w profilu publicznym.

    Czego to nie psuje: reguł w sieci domenowej i prywatnej, połączeń
    wychodzących, pracy lokalnej, logowania, drukowania na drukarkach
    sieciowych w sieciach zaufanych.
  en: |
    The class is "needs review", and the object of the review is whether the machine needs in a public network
    anything set out by a local rule.

    The commonest place is the sharing of content between one person's own devices: the sending of files from a
    telephone, the playing upon a television, a joining to a printer standing in the same room. In a hotel or a
    hired lodging the network is public, and the rule opening that traffic is local - so it will cease to hold.

    The second place is work from afar in a place where the network was not marked as private. That happens often,
    the marking being done once, at the first joining, and the wrong press being easily made.

    The consequence is plain to the user: an inbound joining simply does not come through, with no message. It is
    worth naming that the answer is the marking of the network as private where there is ground for it and no
    lifting of this policy.

    The consequence shows at once and in the public profile alone.

    What this does not break: rules in the domain and the private network, outbound joinings, work upon the
    machine itself, logging on, or printing upon printers of the network in trusted networks.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Udostępnianie treści między urządzeniami tej samej osoby przestanie działać w sieci publicznej
      - Dotyczy to przesyłania plików z telefonu, odtwarzania na telewizorze i drukowania na drukarce w tym samym pokoju
      - Praca zdalna w sieci błędnie oznaczonej jako publiczna straci połączenia przychodzące
      - Połączenie po prostu nie dochodzi, bez komunikatu, więc przyczyna nie jest oczywista dla użytkownika
      - Reguły w sieci domenowej i prywatnej, połączenia wychodzące, praca lokalna i logowanie pozostają bez zmian
    en:
      - The sharing of content between one person s own devices will cease to work in a public network
      - That holds of the sending of files from a telephone, the playing upon a television and printing upon a printer in the same room
      - Work from afar in a network wrongly marked as public will lose its inbound joinings
      - The joining simply does not come through, with no message, so the cause is not plain to the user
      - Rules in the domain and the private network, outbound joinings, work upon the machine itself and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje na stałe w sieci oznaczonej jako publiczna i przyjmuje w niej połączenia przychodzące
      - Osoba korzystająca z maszyny udostępnia treści innym swoim urządzeniom poza siecią domową
    en:
      - The machine works for good in a network marked as public and takes inbound joinings in it
      - Whoever uses the machine shares content with other devices of their own outside a home network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' }
      elseif ($public.AllowLocalFirewallRules -eq 'False') { 'IGNORED' }
      else { 'MERGED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'IGNORED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalFirewallRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules $b.AllowLocalFirewallRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest wyjątkowa w bloku zapory tym, że dotyczy jednego profilu,
    a nie trzech. Warto, żeby aplikacja to podkreśliła, bo wygląda przez
    to na punkt wąski, a jest przeciwnie: dotyczy jedynej sieci, w której
    maszyna stoi obok urządzeń nieznanych.

    Argument wart postawienia wprost dotyczy tego, czemu nie kasuje się
    reguł. Reguły lokalne narastają latami i nikt nie wie, które są
    jeszcze potrzebne. Przeglądanie ich po kolei to praca, której nikt
    nie wykona; zawieszenie ich w jednej sieci daje ten sam skutek bez
    tej pracy.

    Odnotowuję rozwiązanie po stronie użytkownika. Jeżeli coś przestaje
    działać w sieci, która jest faktycznie zaufana, odpowiedzią jest
    oznaczenie jej jako prywatnej, a nie zniesienie zasady. Aplikacja
    powinna to wymienić, bo inaczej pierwszym odruchem będzie wyłączenie
    punktu.
  en: |
    The rule is out of the common in the block of the firewall in that it touches one profile and not three. It is
    well that the application mark that, it looking thereby a narrow item while the opposite is true: it touches
    the one network in which the machine stands beside unknown devices.

    The argument worth putting outright touches why rules are not deleted. Local rules heap up over years and
    nobody knows which are still needed. A going through them one by one is work nobody will do; the suspending of
    them in one network gives the same upshot without that work.

    I set down the answer upon the user's side. If something ceases to work in a network that is truly trusted,
    the answer is the marking of it as private and no lifting of the policy. The application ought to name that,
    else the first reflex will be the switching off of the item.
