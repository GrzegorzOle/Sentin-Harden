id: win2025-profile-single-process-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Profilowanie pojedynczego procesu zastrzeżone dla administratorów
    en: Profiling a single process restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala obserwować pracę wskazanego procesu — również procesu
    należącego do kogoś innego.

    Obserwacja nie jest odczytem danych i właśnie dlatego bywa
    lekceważona. Rzecz w tym, że proces obserwowany zdradza o sobie
    więcej, niż wynikałoby z samego wykazu jego uprawnień: widać wykaz
    załadowanych bibliotek, rozmiar i przyrost pamięci roboczej,
    częstość wywołań i czas ich trwania. Z tych okruchów składa się
    obraz tego, co program robi.

    Zastosowanie napastnika jest rozpoznawcze. Obserwacja procesu
    usługi pozwala ustalić, jakiej wersji używa i które składniki
    załadowała — czyli którędy warto próbować. Pomiary czasu bywają
    ponadto drogą do wnioskowania o danych przetwarzanych, kiedy
    operacja na danych tajnych trwa mierzalnie dłużej niż na innych.

    Na serwerze punkt waży przez sąsiedztwo. Maszyna, na której pracują
    obok siebie procesy wielu aplikacji i wielu sesji, jest miejscem,
    gdzie obserwacja cudzego procesu jest krokiem w bok — do sąsiada
    o innych uprawnieniach. Na serwerze terminali sąsiadów bywają
    dziesiątki.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    rozpoznanie wersji i składników procesów cudzych, a przy operacjach
    kryptograficznych — przesłankę co do przetwarzanych danych.
  en: |
    The right allows a named process's working to be watched - including a process belonging to
    somebody else.

    A watching is no reading of data, and for just that reason it is at times made light of. The
    thing is that a process watched gives away more about itself than its list of rights would
    suggest: the list of loaded libraries shows, the size and growth of the working memory, the
    frequency of calls and how long they take. Of those crumbs a picture of what the program
    does is put together.

    An attacker's use is reconnaissance. Watching a service's process lets its version be
    settled and which parts it has loaded - that is, which way is worth trying. Measurings of
    time are besides at times a road to reasoning about the data being handled, where an
    operation upon secret data takes measurably longer than upon other.

    On a server the item weighs by neighbourhood. A machine where the processes of many
    applications and many sessions work side by side is a place where the watching of another's
    process is a step sideways - to a neighbour of other rights. On a terminal server the
    neighbours are at times dozens.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: reconnaissance of the version and parts of
    others' processes, and at cryptographic operations a ground for guessing at the data being
    handled.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    większości serwerów naprawa nie zmienia niczego.

    Najważniejsze rozróżnienie brzmi tak: prawo dotyczy obserwacji
    procesów cudzych. Obserwacja procesu własnego go nie wymaga
    i działa dalej dla każdego. Aplikacja mierząca własną wydajność —
    a robi to większość aplikacji serwerowych — po zmianie pracuje bez
    różnicy.

    Drugie rozróżnienie dotyczy odczytu liczników. Agent monitorujący
    zbierający liczniki wydajności procesów nie profiluje ich i tego
    prawa nie potrzebuje. Wykresy w menedżerze zadań, monitor zasobów
    i dane wysyłane do systemu monitorowania pozostają bez zmiany.

    Skutek dotyczy narzędzi, które faktycznie profilują proces cudzy:
    profilerów używanych przy dostrajaniu aplikacji i narzędzi
    diagnostycznych producenta. Uruchamia się je doraźnie i zwykle na
    koncie administratora, więc na serwerze skutek bywa zerowy.

    Objaw, gdyby wystąpił, jest natychmiastowy: narzędzie odmawia
    podłączenia się do procesu i zgłasza brak dostępu.
  en: |
    The change has no known side effects and takes no break.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    The weightiest distinction runs thus: the right bears on the watching of others' processes.
    The watching of one's own process does not take it and goes on working for everyone. An
    application measuring its own performance - and most server applications do - works after
    the change with no difference.

    A second distinction bears on the reading of counters. A monitoring agent gathering
    processes' performance counters does not profile them and does not take this right. The
    charts in the task manager, the resource monitor and the data sent to a monitoring system
    stay unchanged.

    The effect concerns tools that in fact profile another's process: the profilers used at the
    tuning of applications and a maker's diagnostic tools. They are started as the need arises
    and usually under an administrator's account, so on a server the effect is at times nil.

    The symptom, should it arise, is immediate: the tool refuses to attach to the process and
    reports a want of access.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
    - remote-desktop
  what_breaks:
    pl:
      - Profiler podłączający się do procesu cudzego z konta spoza wykazu zgłosi brak dostępu
      - Obserwacja procesu własnego nie wymaga tego prawa i działa dalej dla każdego
      - Agent monitorujący zbierający liczniki wydajności procesów nie potrzebuje tego prawa
      - W stanie domyślnym prawo mają wyłącznie administratorzy i zmiana nie robi nic
    en:
      - A profiler attaching to another's process from an account outside the list will report a want of access
      - The watching of one's own process does not take this right and goes on working for everyone
      - A monitoring agent gathering processes' performance counters does not take this right
      - In the default state only administrators hold the right and the change does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje stale narzędzie diagnostyczne podłączające się do procesów cudzych z konta spoza grupy administratorów
    en:
      - A diagnostic tool attaching steadily to others' processes from an account outside the administrators' group works on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeProfileSingleProcessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeProfileSingleProcessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeProfileSingleProcessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeProfileSingleProcessPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeProfileSingleProcessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/profile-single-process

notes:
  pl: |
    Punkt czyta się razem z profilowaniem wydajności systemu. Tamten
    zawęża obserwację jądra i całej maszyny, ten — obserwację procesów
    cudzych.

    Obserwacja procesu własnego nie wymaga tego prawa. Odczyt liczników
    wydajności również nie — i to jest najczęstsze nieporozumienie przy
    tej regule.

    Na serwerze terminali punkt waży więcej niż gdzie indziej, bo
    procesy wielu sesji pracują obok siebie na jednej maszynie.
  en: |
    The item is read together with the profiling of system performance. That one narrows the
    watching of the kernel and the whole machine; this one, the watching of others' processes.

    The watching of one's own process does not take this right. Neither does the reading of
    performance counters - and that is the commonest misunderstanding at this rule.

    On a terminal server the item weighs more than elsewhere, since the processes of many
    sessions work side by side on one machine.
