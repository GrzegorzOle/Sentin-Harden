id: win2016-removable-device-installation-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Instalowanie urządzeń wymiennych zablokowane
    en: The installing of removable devices blocked
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje instalowanie urządzeń opisujących się systemowi jako
    wymienne.

    Trzy poprzednie reguły mówiły, co system robi z nośnikiem już
    przyjętym. Ta mówi, czy wolno go przyjąć w ogóle — i jest to różnica
    rodzaju, nie stopnia.

    Nośnik wymienny jest drogą w obie strony i obie ważą. W stronę maszyny
    wnosi pliki, które nie przeszły przez żaden punkt kontroli: nie
    obejrzała ich brama pocztowa, nie zapisał ich serwer plików, nie
    zobaczył ich nikt poza osobą, która nośnik przyniosła. W stronę
    przeciwną wynosi wszystko, do czego ta osoba ma dostęp, bez śladu
    w jakimkolwiek dzienniku sieciowym.

    Na serwerze strona druga waży więcej. Serwer trzyma dane, dla których
    maszyny robocze są tylko oknem, a kopia wyniesiona na nośniku nie
    zostawia po sobie ruchu, który ktokolwiek mógłby zobaczyć.

    Kryterium blokady jest sposób, w jaki urządzenie się przedstawia, a nie
    rodzaj sprzętu. Jest to najważniejsza rzecz do zrozumienia przy tym
    punkcie, bo z niej biorą się wszystkie niespodzianki przy wdrożeniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wnoszenia i wynoszenia danych całkowicie poza siecią, a więc poza
    zasięgiem wszystkiego, co tę sieć obserwuje.
  en: |
    The setting blocks the installing of devices describing themselves to the system
    as removable.

    The three previous rules said what the system does with a medium already taken
    in. This one says whether it may be taken in at all - and that is a difference
    of kind rather than of degree.

    Removable media are a road both ways, and both ways weigh. Towards the machine
    they bring in files that have passed no point of control: no mail gateway looked
    at them, no file server wrote them, nobody saw them but whoever carried the
    medium in. The other way they carry out everything that person has access to,
    with no trace in any network log.

    On a server the second way weighs more. A server holds data for which working
    machines are only a window, and a copy carried out on a medium leaves behind no
    traffic anybody could see.

    The criterion for the block is the way a device presents itself, not the kind of
    hardware. That is the most important thing to grasp at this item, since from it
    come all the surprises at rollout.

    What an attacker gains while the item goes unmet: a road for bringing data in
    and carrying it out wholly outside the network, and so outside the reach of
    everything watching that network.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a przyczyna leży w kryterium
    blokady.

    Blokowane jest to, co przedstawia się jako wymienne — a przedstawia się
    tak znacznie więcej sprzętu, niż podpowiada nazwa. Drukarki podłączane
    przewodem, klucze sprzętowe, przejściówki serwisowe, urządzenia
    zarządzające podłączane na czas konfiguracji, część czytników kart
    inteligentnych: wszystkie one potrafią zgłosić się systemowi jako
    urządzenie wymienne i wszystkie zostaną zablokowane.

    Skutek jest przy tym cichy w sposób szczególnie kłopotliwy. Urządzenie
    podłączone po wdrożeniu punktu nie zgłasza błędu — ono po prostu nie
    pojawia się w systemie. Objaw brzmi „nie działa" i prowadzi ku
    sprawdzaniu przewodu, złącza i sprzętu, zanim ktokolwiek pomyśli
    o zasadzie.

    Rzecz druga dotyczy urządzeń już zainstalowanych. Punkt nie działa
    wstecznie: to, co jest w systemie, zostaje. Blokada dotyczy
    instalowania, czyli pierwszego podłączenia. Znaczy to, że skutek
    ujawnia się dopiero przy wymianie sprzętu — czasem wiele miesięcy po
    wdrożeniu, gdy nikt już zmiany nie kojarzy z przyczyną.

    Uwaga o przejrzeniu sprzętu przed wykonaniem siedzi w poleceniu
    naprawczym, bo jest warunkiem, a nie zaleceniem.

    Czego to nie psuje: urządzeń już zainstalowanych, dysków wewnętrznych,
    usług, logowania, sieci.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and the cause lies in the criterion for
    the block.

    What is blocked is whatever presents itself as removable - and far more hardware
    presents itself so than the name suggests. Printers attached by a cable,
    hardware keys, service adapters, management devices plugged in for the time of a
    configuration, some smart card readers: all of them can report themselves to the
    system as a removable device and all will be blocked.

    The consequence is besides quiet in a particularly troublesome way. A device
    plugged in after the item is rolled out reports no error - it simply fails to
    appear in the system. The symptom reads "it does not work" and leads towards
    checking the cable, the connector and the hardware before anybody thinks of a
    policy.

    The second thing concerns devices already installed. The item does not work
    backwards: what is in the system stays. The block concerns the installing, which
    is to say the first plugging in. That means the consequence shows only at a
    change of hardware - at times many months after the rollout, when nobody ties
    the change to its cause any longer.

    The remark about going over the hardware before execution sits in the remedial
    command, being a condition rather than a recommendation.

    What this does not break: devices already installed, internal disks, services,
    signing in, or the network.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Drukarki podłączane przewodem, klucze sprzętowe i przejściówki serwisowe potrafią zgłaszać się jako urządzenie wymienne i zostaną zablokowane
      - Urządzenie podłączone po wdrożeniu nie zgłasza błędu, tylko nie pojawia się w systemie, a objaw prowadzi ku sprawdzaniu przewodu i sprzętu
      - Skutek ujawnia się dopiero przy wymianie sprzętu, czasem wiele miesięcy po wdrożeniu
      - Urządzenia już zainstalowane, dyski wewnętrzne, usługi i sieć pozostają bez zmian
    en:
      - Printers attached by a cable, hardware keys and service adapters can report themselves as a removable device and will be blocked
      - A device plugged in after the rollout reports no error but simply fails to appear in the system, and the symptom leads towards checking the cable and the hardware
      - The consequence shows only at a change of hardware, at times many months after the rollout
      - Devices already installed, internal disks, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa tej maszyny opiera się na kluczu sprzętowym albo czytniku podłączanym doraźnie i nie sprawdzono, jak się on przedstawia
      - Do maszyny podłącza się drukarkę przewodem i nie przewidziano wyjątku dla jej identyfikatora
      - Procedura odtwarzania po awarii opiera się na nośniku wymiennym podłączanym dopiero w chwili odtwarzania
    en:
      - The handling of this machine rests on a hardware key or a reader plugged in as the need arises and it has not been checked how it presents itself
      - A printer is attached to the machine by a cable and no exception has been provided for its identifier
      - The recovery procedure after a breakdown rests on removable media plugged in only at the moment of recovery
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      $name = 'DenyRemovableDevices'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $name = 'DenyRemovableDevices'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Printers, tokens and service adapters often describe themselves as removable.
    # Go over what is plugged into this machine before this is applied - the block
    # takes by the way the device is described, not by the kind of hardware.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyRemovableDevices' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-restrictions

notes:
  pl: |
    Punkt jest pierwszym w tym bloku, który realnie coś odbiera, i warto
    postawić tę granicę wprost. Trzy poprzednie reguły zmieniają zachowanie
    samoczynne i nikt ich nie zauważy. Ta zmienia to, co wolno podłączyć.

    Poziom drugi jest tu uzasadniony i nie należy go czytać jako „mniej
    ważne". Oznacza, że punkt zakłada środowisko, w którym nośniki wymienne
    nie są drogą roboczą — a tam, gdzie są, właściwą odpowiedzią jest
    świadome odpuszczenie z zapisanym uzasadnieniem albo wdrożenie z listą
    wyjątków dla konkretnych identyfikatorów.

    Warto też powiedzieć, czego punkt nie daje: nie chroni przed
    wyniesieniem danych przez sieć, przez pocztę ani przez usługę chmurową.
    Zamyka jedną drogę, najstarszą i najtrudniejszą do zaobserwowania, i tylko
    tak należy go przedstawiać.
  en: |
    The item is the first in this block really to take something away, and that
    boundary is worth putting outright. The three previous rules change behaviour
    that happens by itself and nobody will notice them. This one changes what may be
    plugged in.

    Level two is warranted here and should not be read as "less important". It means
    the item assumes surroundings where removable media are not a working road - and
    where they are, the proper answer is to let it go deliberately with a written
    justification, or to roll it out with a list of exceptions for particular
    identifiers.

    Worth saying too what the item does not give: it does not guard against data
    being carried out over the network, by mail or through a cloud service. It shuts
    one road, the oldest and the hardest to observe, and only so should it be
    presented.
