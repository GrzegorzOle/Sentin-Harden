id: win2025-bitlocker-os-drive-recovery-options

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysku systemowego ustalony
    en: The way of recovering access to the system drive settled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, w jaki sposób odzyskuje się dostęp do zaszyfrowanego
    dysku systemowego: że hasło odzyskiwania istnieje, że trafia do
    katalogu usługi domenowej, że szyfrowanie nie ruszy, dopóki tamten
    zapis się nie powiedzie, i że nie da się obejść tej drogi kluczem
    zapisanym na nośniku.

    Zostawiam kategorię wysoką, ale chcę powiedzieć, czego ten punkt
    pilnuje, bo nie jest to ochrona przed napastnikiem. Ten punkt pilnuje
    tego, żeby szyfrowanie nie zamieniło się w utratę danych. Jest jedną
    z niewielu reguł w tej paczce, których wartość leży po stronie
    dostępności, a nie poufności — i właśnie dlatego jest tak ważna:
    reguła, która pozwala bezpiecznie wdrożyć sąsiednie reguły, jest warta
    więcej niż one same.

    Na serwerze rzecz sprowadza się do jednego pytania: kto i skąd wpisze
    hasło odzyskiwania, kiedy maszyna o nie poprosi. Nie poprosi na biurku.
    Poprosi na ekranie konsoli zarządzania, o godzinie, o której nikt nie
    planował się tym zajmować, na maszynie, która właśnie nie wstała po
    aktualizacji oprogramowania układowego. Hasło zapisane w katalogu
    domeny jest w tym momencie jedynym sensownym miejscem — pod warunkiem
    że katalog jest osiągalny, czyli że ta maszyna nie jest jedynym
    kontrolerem tej domeny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale organizacja traci pewność, że zaszyfrowany dysk da
    się kiedykolwiek odzyskać, co w praktyce kończy się rezygnacją
    z szyfrowania albo trzymaniem haseł odzyskiwania w miejscu gorszym niż
    katalog.
  en: |
    The item settles how access to an encrypted system drive is recovered:
    that a recovery password exists, that it goes into the directory
    service, that encryption will not start until that record succeeds, and
    that this route cannot be bypassed with a key saved on a medium.

    I keep the category high, but I want to say what this item guards,
    because it is not protection against an attacker. This item guards
    against encryption turning into data loss. It is one of the few rules
    in this pack whose value lies on the availability side rather than
    confidentiality - and that is precisely why it matters so much: a rule
    that makes it safe to roll out the neighbouring rules is worth more
    than they are.

    On a server the matter comes down to one question: who will type the
    recovery password, and from where, when the machine asks for it. It
    will not ask at a desk. It will ask on the management console screen,
    at an hour nobody planned to deal with this, on a machine that has just
    failed to come up after a firmware update. A password held in the
    domain directory is at that moment the only sensible place - provided
    the directory is reachable, that is, provided this machine is not the
    only controller of that domain.

    What an attacker gains while the item goes unmet: nothing directly -
    but the organisation loses any certainty that an encrypted disk can
    ever be recovered, which in practice ends either in giving up
    encryption or in keeping recovery passwords somewhere worse than the
    directory.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać konkretny
    sposób, w jaki ten punkt potrafi zatrzymać pracę, bo nie jest
    oczywisty i nie występuje na stacji roboczej.

    Wymaganie zapisu do katalogu jest twarde: dopóki zapis się nie
    powiedzie, szyfrowanie nie ruszy. Na stacji roboczej w domenie to
    działa. Na serwerze bywają trzy sytuacje, w których nie zadziała —
    i wszystkie trzy są zwyczajne, nie egzotyczne.

    Pierwsza: serwer stoi poza domeną, w grupie roboczej. Nie ma katalogu,
    więc nie ma gdzie zapisać, więc szyfrowanie nie wystartuje i nikt nie
    dowie się dlaczego, dopóki nie sprawdzi dziennika. Druga: serwer jest
    kontrolerem domeny, i to jedynym. Zapis do katalogu, który stoi na tej
    samej maszynie, przy pierwszym uruchomieniu jest sztuczką, a przy
    odzyskiwaniu — pułapką: hasło do dysku, którego nie da się odblokować,
    leży na dysku, którego nie da się odblokować. Trzecia: serwer
    w segmencie odciętym od kontrolerów, gdzie katalog jest osiągalny
    czasem.

    W każdej z tych sytuacji odpowiedzią nie jest wyłączenie wymagania,
    tylko wskazanie innego miejsca na hasła odzyskiwania i zapisanie tego
    jako wyjątku. Miejsce musi spełnić jeden warunek, który brzmi banalnie,
    a bywa pomijany: ma być osiągalne wtedy, gdy ta maszyna nie działa.

    Zmiana nie wymaga przerwy i cofa się natychmiast. Punkt jest jedną
    decyzją zapisaną w kilku wartościach, więc audyt czyta je wszystkie
    naraz — maszyna ustawiona w połowie nie ma przechodzić jako ustawiona.
  en: |
    I keep the class "needs a planned rollout" and want to name the
    specific way this item can bring work to a halt, because it is not
    obvious and does not occur on a workstation.

    The requirement to write to the directory is hard: until that write
    succeeds, encryption will not start. On a domain workstation that
    works. On a server there are three situations where it will not - and
    all three are ordinary, not exotic.

    First: the server sits outside the domain, in a workgroup. There is no
    directory, so there is nowhere to write, so encryption will not start
    and nobody will find out why until they look at the log. Second: the
    server is a domain controller, and the only one. Writing to a directory
    that runs on the same machine is a trick at first start and a trap at
    recovery: the password for a disk that cannot be unlocked lies on the
    disk that cannot be unlocked. Third: a server in a segment cut off from
    the controllers, where the directory is reachable some of the time.

    In each of these the answer is not to switch the requirement off but to
    name another place for recovery passwords and record that as an
    exception. That place must meet one condition which sounds trivial and
    is often skipped: it has to be reachable when this machine is not
    working.

    The change needs no outage and is undone immediately. The item is one
    decision recorded in several values, so the audit reads them all at
    once - a machine set halfway is not to pass as set.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Dopóki zapis hasła odzyskiwania do katalogu się nie powiedzie, szyfrowanie w ogóle nie ruszy
      - Na serwerze w grupie roboczej nie ma katalogu, więc szyfrowanie nie wystartuje bez czytelnego komunikatu
      - Na jedynym kontrolerze domeny hasło do dysku, którego nie da się odblokować, leży na tym samym dysku
      - W segmencie odciętym od kontrolerów katalog bywa osiągalny tylko czasem
      - Zapisanie klucza na nośniku przestaje być dopuszczalną drogą obejścia
    en:
      - Until the recovery password is written to the directory, encryption will not start at all
      - On a server in a workgroup there is no directory, so encryption will not start and no clear message says why
      - On the only domain controller the password for a disk that cannot be unlocked lies on that same disk
      - In a segment cut off from the controllers the directory is reachable only some of the time
      - Saving the key to a medium stops being an acceptable way around it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer stoi poza domeną i nie wskazano innego osiągalnego miejsca na hasła odzyskiwania
      - Serwer jest jedynym kontrolerem tej domeny, więc katalog nie będzie osiągalny w chwili odzyskiwania
      - Łączność z kontrolerami domeny bywa przerywana, a szyfrowanie ma ruszyć w oknie serwisowym
    en:
      - The server sits outside the domain and no other reachable place for recovery passwords has been named
      - The server is the only controller of that domain, so the directory will not be reachable at recovery time
      - Connectivity to the domain controllers is intermittent and encryption is meant to start in a service window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result. Reading them
      # apart would let a machine set halfway pass as set.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        OSRecovery                    = 1
        OSManageDRA                   = 0
        OSRecoveryPassword            = 1
        OSRecoveryKey                 = 0
        OSHideRecoveryPage            = 1
        OSActiveDirectoryBackup       = 1
        OSActiveDirectoryInfoToStore  = 1
        OSRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $names = @(
      'OSRecovery', 'OSManageDRA', 'OSRecoveryPassword', 'OSRecoveryKey',
      'OSHideRecoveryPage', 'OSActiveDirectoryBackup',
      'OSActiveDirectoryInfoToStore', 'OSRequireActiveDirectoryBackup'
    )
    $state = @()
    foreach ($name in $names) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # After this, encryption will not start until the recovery password is
    # written to the directory. On a workgroup server, on a sole domain
    # controller, or behind intermittent connectivity that is a stop, not a
    # delay - name another reachable place first and record the exception.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      OSRecovery                     = 1
      OSManageDRA                    = 0
      OSRecoveryPassword             = 1
      OSRecoveryKey                  = 0
      OSHideRecoveryPage             = 1
      OSActiveDirectoryBackup        = 1
      OSActiveDirectoryInfoToStore   = 1
      OSRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Jedna z niewielu reguł tej paczki, których wartość leży po stronie
    dostępności, a nie poufności. Pilnuje tego, żeby szyfrowanie nie
    zamieniło się w utratę danych — a reguła pozwalająca bezpiecznie
    wdrożyć sąsiednie jest warta więcej niż one same.

    Pytanie na serwerze brzmi: kto i skąd wpisze hasło odzyskiwania, kiedy
    maszyna o nie poprosi. Poprosi na konsoli zarządzania, o godzinie,
    o której nikt nie planował się tym zajmować.

    Trzy zwyczajne sytuacje, w których wymaganie zatrzyma szyfrowanie:
    serwer w grupie roboczej, jedyny kontroler domeny, segment odcięty od
    kontrolerów. Odpowiedzią jest inne osiągalne miejsce na hasła i zapisany
    wyjątek — miejsce ma być osiągalne wtedy, gdy ta maszyna nie działa.
  en: |
    One of the few rules in this pack whose value lies on the availability
    side rather than confidentiality. It guards against encryption turning
    into data loss - and a rule that makes it safe to roll out the
    neighbouring ones is worth more than they are.

    The question on a server is: who will type the recovery password, and
    from where, when the machine asks for it. It will ask on the management
    console, at an hour nobody planned to deal with this.

    Three ordinary situations where the requirement will stop encryption: a
    server in a workgroup, a sole domain controller, a segment cut off from
    the controllers. The answer is another reachable place for the
    passwords and a recorded exception - the place has to be reachable when
    this machine is not working.
