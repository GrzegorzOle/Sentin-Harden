id: win10-defender-asr-usb-untrusted-processes

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania niepodpisanych programów z nośników wymiennych
    en: Untrusted and unsigned processes from removable media blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania uruchamiania z nośników wymiennych programów, które
    nie mają wiarygodnego podpisu.

    Nośnik wymienny jest drogą wejścia, której nie widzi żaden mechanizm
    patrzący na sieć. Program uruchomiony wprost z pamięci przenośnej
    nigdy nie trafia na dysk maszyny, więc nie ma go w żadnym miejscu,
    do którego zagląda się później.

    Kryterium podpisu jest tu wyborem świadomym. Nie pyta się, czy plik
    jest znany, lecz czy ktoś wziął za niego odpowiedzialność. Program
    bez podpisu, przyniesiony na pamięci przenośnej i uruchamiany wprost
    stamtąd, nie spełnia żadnego z warunków, których zwykle się wymaga.

    Odnotowuję, czego reguła nie robi. Nie zabrania podłączania nośników,
    nie zabrania kopiowania z nich i nie zabrania uruchamiania programu
    po skopiowaniu go na dysk. Zamyka jedno powiązanie: nośnik wymienny
    jako miejsce uruchomienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    programu z nośnika, bez śladu na dysku maszyny.
  en: |
    The rule forbids the starting from removable drives of programs that bear no trustworthy signature.

    A removable drive is a road of entry no mechanism looking at the network sees. A program started straight from
    a portable memory never reaches the machine's disk, so it is in no place anybody looks into afterwards.

    The measure of the signature is here a knowing choice. What is asked is not whether the file is known but
    whether somebody has taken responsibility for it. A program without a signature, brought upon a portable
    memory and started straight from there, meets none of the conditions ordinarily called for.

    I set down what the rule does not do. It does not forbid the plugging in of drives, does not forbid the
    copying from them, and does not forbid the starting of a program once it has been copied to the disk. It
    closes one joining: a removable drive as a place of starting.

    What an attacker gains while the item goes unmet: the starting of a program from a drive, with no trace upon
    the machine's disk.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są narzędzia
    noszone na pamięci przenośnej.

    Praktyka uruchamiania narzędzi wprost z nośnika jest stara
    i rozpowszechniona wśród obsługi. Zestaw narzędzi diagnostycznych,
    program do odzyskiwania danych, narzędzie do obrazowania dysku —
    wszystkie bywają noszone właśnie tak i rzadko bywają podpisane.

    Skutek widzi ten, kto próbuje: program nie uruchamia się i pojawia
    się komunikat ochrony. Na stanowisku użytkownika jest to sytuacja
    rzadka; na nośniku obsługi jest to sytuacja codzienna.

    Odpowiedzią jest skopiowanie narzędzia na dysk przed uruchomieniem
    albo wskazanie wyjątku. Pierwsza droga jest prostsza i nie wymaga
    zmiany zasady.

    Odnotowuję, że reguła nie odróżnia nośnika obcego od służbowego.
    Pamięć przenośna wydana przez organizację podlega jej tak samo jak
    znaleziona na parkingu.

    Czego to nie psuje: podłączania nośników, kopiowania z nich i na nie,
    uruchamiania programów podpisanych, uruchamiania po skopiowaniu na
    dysk, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is tools carried upon a portable memory.

    The practice of starting tools straight from a drive is old and widespread among the support. A set of tools
    of diagnosis, a program for the winning back of data, a tool for the imaging of a disk - all are at times
    carried just so and are seldom signed.

    The one who tries sees the consequence: the program does not start and a message from the protection comes up.
    Upon a user's station that is a rare case; upon the support's drive it is a daily one.

    The answer is the copying of the tool to the disk before the starting, or the naming of an exception. The
    first road is the simpler and calls for no change of the policy.

    I set down that the rule does not tell a strange drive from a works one. A portable memory handed out by the
    body falls under it just as one found upon a car park does.

    What this does not break: the plugging in of drives, the copying from them and to them, the starting of signed
    programs, the starting after a copying to the disk, logging on, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
  what_breaks:
    pl:
      - Zestaw narzędzi diagnostycznych noszony na pamięci przenośnej przestaje się uruchamiać wprost z nośnika
      - Program do odzyskiwania danych i narzędzie do obrazowania dysku zatrzymują się tak samo, bo rzadko bywają podpisane
      - Reguła nie odróżnia nośnika obcego od służbowego, więc pamięć wydana przez organizację podlega jej tak samo
      - Skopiowanie narzędzia na dysk przed uruchomieniem rozwiązuje sprawę bez zmiany zasady
      - Podłączanie nośników, kopiowanie z nich i na nie, uruchamianie programów podpisanych i logowanie pozostają bez zmian
    en:
      - A set of tools of diagnosis carried upon a portable memory ceases to start straight from the drive
      - A program for the winning back of data and a tool for the imaging of a disk halt the same way, being seldom signed
      - The rule does not tell a strange drive from a works one, so a memory handed out by the body falls under it just the same
      - The copying of the tool to the disk before the starting settles the matter without a change of the policy
      - The plugging in of drives, the copying from them and to them, the starting of signed programs and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa pracuje z narzędziami uruchamianymi wprost z nośnika i nie ma jak skopiować ich na dysk maszyny uszkodzonej
    en:
      - The support works with tools started straight from a drive and there is no way of copying them to the disk of a broken machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną dotyczącą nośników. Warto,
    żeby aplikacja pokazała ją razem z punktem o skanowaniu nośników przy
    skanowaniu pełnym — tamten przegląda zawartość, ta zamyka
    uruchomienie.

    Argument wart zachowania dotyczy tego, czego po nośniku nie zostaje.
    Program uruchomiony wprost z pamięci przenośnej nie trafia na dysk,
    więc przeglądanie dysku po fakcie nie znajdzie niczego. Jest to
    jedyna droga wejścia, która potrafi nie zostawić pliku w ogóle.

    Odnotowuję ograniczenie praktyczne, bo przesądza o klasie. Obsługa
    nosi narzędzia właśnie w ten sposób i robi to z powodów, które są
    dobre — na maszynie, która się nie uruchamia, nie ma jak niczego
    skopiować na dysk. Wdrożenie tej reguły bez rozmowy z obsługą
    skończy się wyjątkiem ustawionym w pośpiechu.
  en: |
    The rule closes the block and is the only one in it touching drives. It is well that the application show it
    together with the item about the scanning of drives at a full scan - that one looks the contents over, this
    closes the starting.

    The argument worth keeping touches what a drive leaves behind. A program started straight from a portable
    memory does not reach the disk, so a looking over of the disk after the fact will find nothing. It is the one
    road of entry able to leave no file at all.

    I set down the practical bound, it settling the class. The support carries tools in just that way and does so
    for grounds that are good - upon a machine that will not start there is no way of copying anything to the
    disk. The rolling out of this rule without a conversation with the support will end in an exception set in
    haste.
