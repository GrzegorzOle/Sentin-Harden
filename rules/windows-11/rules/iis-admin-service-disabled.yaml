id: win11-iis-admin-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa administracyjna serwera sieciowego wyłączona
    en: The administrative service of the web server disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa utrzymuje konfigurację starszych składników serwera sieciowego
    i udostępnia ją pozostałym usługom: odczytuje ustawienia witryn, pilnuje
    ich spójności i przekazuje zmiany dalej.

    Jest to składnik pomocniczy i nie ma powodu przedstawiać go inaczej.
    Sam nie wystawia portu do sieci i nie przyjmuje żądań od nikogo z zewnątrz.
    Gdyby stał na maszynie sam, nie byłoby o czym mówić.

    Wartość punktu leży w tym, czego usługa jest warunkiem. Serwer przesyłania
    plików starszym protokołem nie wystartuje bez niej — konfigurację czyta
    właśnie przez nią. Wyłączenie tej usługi zamyka więc tamtą drogę nawet
    wtedy, gdy ktoś włączy tamtą usługę z powrotem.

    Drugi powód jest zwyczajny: usługa działa stale, z wysokimi uprawnieniami,
    i istnieje wyłącznie po to, żeby obsługiwać rolę, której na stanowisku
    świadomie nie ma. Jeżeli serwer sieciowy na maszynie nie jest potrzebny,
    nie jest potrzebna i ona.
  en: |
    The service keeps up the configuration of the web server's older components and makes
    it available to the other services: it reads sites' settings, watches over their
    consistency and passes changes on.

    It is a helper component and there is no reason to present it otherwise. It puts out
    no port to the network itself and takes requests from nobody outside. Were it to
    stand on the machine alone, there would be nothing to talk about.

    The item's worth lies in what the service is a condition of. The server for
    transferring files by the older protocol will not start without it - it reads its
    configuration through it. Disabling this service therefore closes that route even
    where somebody switches that service back on.

    The second reason is ordinary: the service runs all the time, with high rights, and
    exists solely to serve a role deliberately absent from the station. If a web server
    is not needed on the machine, neither is it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy pozostałych składnikach serwera
    sieciowego: czy cokolwiek na tej maszynie z niego korzysta.

    Na stacji roboczej składnik zwykle nie jest zainstalowany i audyt zwróci
    wynik „nie dotyczy".

    Tam, gdzie serwer sieciowy działa, wyłączenie tej usługi zatrzyma serwer
    przesyłania plików starszym protokołem — nawet jeżeli sam pozostał
    włączony. Jest to zależność, o której łatwo zapomnieć, bo nazwy obu usług
    nie wskazują na związek między nimi.

    Obsługa witryn nie zależy od tej usługi w obecnych wersjach systemu
    i działa dalej. Jeżeli celem było zatrzymanie witryn, właściwym narzędziem
    jest reguła dotycząca usługi publikowania, a nie ta.

    Konsola zarządzania serwerem uruchomiona na tej maszynie może zgłaszać
    błędy przy sięganiu po konfigurację starszych składników. Zarządzanie
    witrynami przez pliki konfiguracyjne i polecenia działa dalej.

    Zmiana wymaga zatrzymania usługi.
  en: |
    The same needs checking as with the web server's other components: whether anything
    on this machine uses it.

    At a workstation the component is usually not installed and the audit will return
    "not applicable".

    Where a web server is running, disabling this service will stop the server for
    transferring files by the older protocol - even if that one stayed switched on. It is
    a dependence easily forgotten, since the two services' names give no hint of a link
    between them.

    The serving of sites does not depend on this service in present-day versions of the
    system and carries on. If the aim was to stop sites, the right tool is the rule about
    the publishing service, not this one.

    The server management console run on this machine may report errors when reaching for
    the older components' configuration. Managing sites through configuration files and
    commands carries on working.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
  what_breaks:
    pl:
      - Serwer przesyłania plików starszym protokołem nie wystartuje mimo włączonej usługi
      - Konsola zarządzania serwerem zgłasza błędy przy konfiguracji starszych składników
      - Obsługa witryn przez usługę publikowania działa dalej bez zmiany
      - Na maszynie bez roli serwera sieciowego usługi nie ma i nie zmienia się nic
    en:
      - The server for transferring files by the older protocol will not start despite being enabled
      - The server management console reports errors over the older components' configuration
      - The serving of sites by the publishing service carries on unchanged
      - On a machine with no web server role the service is absent and nothing changes
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna obsługuje przesyłanie plików starszym protokołem i jest to zastosowanie przyjęte
      - Konfiguracja starszych składników serwera sieciowego jest na tej maszynie w użyciu
    en:
      - The machine serves file transfer by the older protocol and that use is an accepted one
      - The configuration of the web server's older components is in use on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping this service also stops the services depending on it, among them
    # the file transfer server for the older protocol.
    Stop-Service -Name 'IISADMIN' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'IISADMIN' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'IISADMIN' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

notes:
  pl: |
    Polecenie naprawcze zatrzymuje wraz z tą usługą wszystkie usługi od niej
    zależne. Na maszynie z serwerem przesyłania plików starszym protokołem
    oznacza to zatrzymanie także jego — świadomie, bo taki jest sens tego
    punktu, ale warto o tym wiedzieć przed uruchomieniem.

    Reguła wchodzi w skład grupy opisującej serwer sieciowy: obsługa witryn,
    przesyłanie plików starszym protokołem, zdalne zarządzanie konfiguracją
    i ta. Wyniki tych czterech reguł warto czytać razem, bo składniki
    instalują się wspólnie i pozostawienie jednego włączonego zwykle znaczy,
    że rola serwera na maszynie została.

    Wyłączenie usługi nie usuwa roli serwera sieciowego ani konfiguracji
    witryn. Trwałym rozwiązaniem jest odinstalowanie roli.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The remediation command stops, along with this service, every service depending on
    it. On a machine with a file transfer server for the older protocol that means
    stopping that too - deliberately, since that is the point of this item, but it is
    worth knowing before running it.

    The rule is part of the group describing the web server: serving sites, transferring
    files by the older protocol, remote management of the configuration and this one. The
    results of these four rules are worth reading together, since the components install
    jointly and leaving one running usually means the server role has stayed on the
    machine.

    Disabling the service removes neither the web server role nor the sites'
    configuration. The lasting solution is to uninstall the role.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
