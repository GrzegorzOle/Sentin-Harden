id: win2016-bitlocker-hardware-encryption-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Szyfrowanie realizowane przez dysk niedopuszczone
    en: Encryption performed by the drive itself inadmissible
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania powierzania szyfrowania samemu dyskowi i nakazuje
    wykonywać je w systemie.

    Część dysków potrafi szyfrować własną zawartość we własnym sterowniku.
    System, widząc taki dysk, może zrezygnować z szyfrowania po swojej
    stronie i poprzestać na przekazaniu dyskowi klucza. Jest to szybsze,
    bo procesor maszyny nie ma z tym nic wspólnego.

    Kłopot polega na tym, że nikt nie widzi, co ten dysk naprawdę robi.
    Szyfrowanie zachodzi w oprogramowaniu układowym, którego nie da się
    przeczytać, sprawdzić ani zaktualizować w sposób jawny. System przyjmuje
    na wiarę, że dysk szyfruje, i tak samo raportuje.

    Przypadki, w których ta wiara okazała się nieuzasadniona, są dobrze
    udokumentowane: dyski ignorujące podany klucz i szyfrujące kluczem
    stałym, dyski przechowujące klucz obok danych, dyski zwracające
    zawartość po przesłaniu polecenia serwisowego. W każdym z tych
    przypadków system raportował dysk jako zaszyfrowany.

    Wykonanie szyfrowania po stronie systemu zdejmuje tę niewiadomą.
    Mechanizm jest jeden, opisany i ten sam na każdym sprzęcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dyski, które
    uchodzą za zaszyfrowane, a o których faktycznej ochronie nikt nie ma
    sposobu się przekonać.
  en: |
    The setting forbids the encryption to be entrusted to the drive itself and orders it performed
    within the system.

    Some drives can encrypt their own contents in their own controller. The system, seeing such a
    drive, may forgo encrypting on its side and stop at handing the drive a key. That is faster, the
    machine's processor having nothing to do with it.

    The trouble is that nobody sees what that drive really does. The encryption happens in firmware
    that cannot be read, checked or updated in any open way. The system takes it on faith that the
    drive encrypts, and reports so.

    The cases in which that faith proved unwarranted are well documented: drives ignoring the key
    given and encrypting by a fixed one, drives keeping the key beside the data, drives giving their
    contents up once a service command is sent. In every one of those cases the system reported the
    drive as encrypted.

    Performing the encryption on the system's side takes that unknown away. The mechanism is one,
    described, and the same on every piece of hardware.

    What an attacker gains while the item goes unmet: drives that pass as encrypted and of whose real
    protection nobody has any means of convincing themselves.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie zabrania szyfrowania — przenosi je z dysku do systemu.
    Wszystko, co działało, działa dalej: te same polecenia, ten sam sposób
    odblokowania, ten sam klucz odzyskiwania.

    Skutek mierzalny dotyczy obciążenia procesora, i to wyłącznie na
    sprzęcie bez przyspieszenia sprzętowego dla operacji szyfrujących.
    Sprzęt serwerowy ostatnich kilkunastu lat takie przyspieszenie ma,
    więc różnica jest w praktyce nie do zauważenia.

    Zmiana nie dotyczy woluminów już zaszyfrowanych. Dysk, który szyfruje
    własnym sterownikiem, będzie to robił dalej; przeniesienie wymaga
    odszyfrowania i zaszyfrowania na nowo. Warto to wiedzieć, bo zgodny wpis
    przy takim dysku nie mówi o nim nic.

    Nie wiąże się z tym restart ani zatrzymanie usługi.

    Czego to nie psuje: dostępu do danych, pracy usług, sieci, odblokowywania,
    odzyskiwania. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    The change does not forbid encryption - it moves it from the drive into the system. Everything
    that worked works on: the same commands, the same manner of unlocking, the same recovery key.

    The measurable consequence concerns the processor's load, and that solely on hardware without
    acceleration for encrypting operations. Server hardware of the last dozen or more years has such
    acceleration, so the difference is in practice not to be noticed.

    The change does not concern volumes already encrypted. A drive that encrypts by its own controller
    will go on doing so; the carrying over calls for it to be decrypted and encrypted anew. That is
    worth knowing, a compliant entry at such a drive saying nothing about it.

    No restart or stopping of a service goes with it.

    What this does not break: access to data, the working of services, the network, unlocking, or
    recovering. There are no known regressions.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - drivers-and-devices
  what_breaks:
    pl:
      - Woluminy szyfrowane dotąd przez sam dysk będą tak szyfrowane dalej, a przeniesienie wymaga odszyfrowania i zaszyfrowania na nowo
      - Zgodny wpis przy dysku szyfrującym własnym sterownikiem nie mówi o tym dysku nic
      - Obciążenie procesora rośnie wyłącznie na sprzęcie bez przyspieszenia sprzętowego, którego serwery ostatnich kilkunastu lat nie mają
      - Dostęp do danych, odblokowywanie i odzyskiwanie pozostają bez zmian
    en:
      - Volumes encrypted until now by the drive itself will go on being so encrypted, and the carrying over calls for decrypting and encrypting anew
      - A compliant entry at a drive encrypting by its own controller says nothing about that drive
      - The processor's load rises solely on hardware without acceleration, which servers of the last dozen or more years do not lack
      - Access to data, unlocking and recovering stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje na sprzęcie bez przyspieszenia sprzętowego dla operacji szyfrujących i przepisuje strumienie danych bez przerwy
    en:
      - The machine works on hardware without acceleration for encrypting operations and copies streams of data through without a break
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to
      # be at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero does not forbid encryption - it moves the work back into the system,
    # away from the drive's own controller.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSHardwareEncryption', 'FDVHardwareEncryption', 'RDVHardwareEncryption')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest drugi w tej części i jedyny w całym zestawie o szyfrowaniu
    dysków, który należy do klasy bez uciążliwości przy kategorii wysokiej.
    Stawia go to w polu szybkich wygranych i tak warto go pokazywać.

    Argument wart zapamiętania brzmi: rzecz nie w tym, że szyfrowanie po
    stronie dysku jest słabe, tylko w tym, że jest niesprawdzalne. Są dyski,
    które robią to dobrze. Nie ma sposobu, żeby odróżnić je od tych, które
    robią to źle — a raport systemu wygląda w obu przypadkach tak samo.

    Jest to argument, który warto postawić wprost, bo kategoria wysoka przy
    zerowym koszcie wygląda podejrzanie i bywa odczytywana jako przesada.
    Nie jest przesadą: przedmiotem jest cała wartość szyfrowania na danym
    dysku, a podstawą oceny — udokumentowane przypadki, w których wartość ta
    okazała się zerowa przy zielonym raporcie.

    Odnotowuję, że stan pośredni zgłaszany przez audyt wymienia z nazwy
    klasę dysków, która odstaje. Ma to tu znaczenie praktyczne, bo
    ustawienie bywa wprowadzane wyłącznie dla dysku systemowego, a dyski
    z danymi zostawiane same sobie.
  en: |
    The item is the second in this part and the only one in the whole set about drive encryption that
    belongs to the class no disruption at a high category. That puts it in the field of quick wins and
    it is worth showing so.

    The argument worth keeping in mind runs: the matter is not that encryption on the drive's side is
    weak but that it is uncheckable. There are drives that do it well. There is no way of telling them
    from those that do it badly - and the system's report looks the same in both cases.

    It is an argument worth putting outright, a high category at nil cost looking suspect and being at
    times read as an overstatement. It is none: the subject is the whole value of the encryption on
    that drive, and the ground of the judgement is the documented cases in which that value proved nil
    at a green report.

    Worth noting that the middle state the audit reports names outright the class of drive that stands
    out. That matters in practice here, the setting being at times brought in solely for the system
    drive and the data drives left to themselves.
