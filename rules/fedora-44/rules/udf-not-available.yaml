id: fedora44-udf-not-available

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.1.7
  section: Initial Setup > Filesystem > Configure Filesystem Kernel Modules
  title:
    pl: Moduł jądra udf niedostępny
    en: Ensure udf kernel module is not available
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    UDF to system plików płyt DVD i Blu-ray, a także części obrazów ISO
    i pamięci wymiennych. Obrazy instalacyjne Windows są zapisane właśnie w UDF,
    a obok niego mają tylko szczątkowy ISO 9660 z jednym plikiem informacyjnym.

    Każdy sterownik systemu plików to kod jądra, który czyta strukturę zapisaną
    na nośniku. Jeśli nośnik przygotował napastnik, to on decyduje, co ten kod
    dostaje na wejście, a błąd w obsłudze uszkodzonej struktury wykonuje się
    z pełnymi uprawnieniami jądra. Jądro ładuje sterownik samo, gdy ktoś poprosi
    o zamontowanie danego typu, więc nikt nie musi świadomie tego sterownika
    uruchamiać.

    Na stacji roboczej ta droga jest krótka, bo środowisko graficzne montuje
    podłączony nośnik samo: wystarczy włożyć płytę albo podłączyć pamięć, na
    której ktoś zapisał spreparowany UDF. Punkt zamyka ją: moduł nie ładuje się
    ani na żądanie jądra, ani wywołany wprost.

    Kategoria jest średnia, bo nośnik z UDF łatwo podsunąć, a sterownik
    obsługuje złożony format z wieloma wersjami. Punkt należy do poziomu 2, bo
    zabiera odczyt płyt i obrazów, z którego część stacji korzysta.
  en: |
    UDF is the file system of DVD and Blu-ray discs, and of some ISO images and
    removable media. Windows installation images are written in UDF, and next to
    it they carry only a vestigial ISO 9660 with a single information file.

    Every file system driver is kernel code that reads a structure stored on a
    medium. If an attacker prepared the medium, the attacker decides what that
    code gets as input, and a bug in handling a damaged structure runs with full
    kernel privileges. The kernel loads the driver by itself when something asks
    to mount that type, so nobody has to start the driver on purpose.

    On a workstation that path is short, because the desktop mounts a connected
    medium by itself: it is enough to insert a disc or plug in a memory stick on
    which somebody wrote a crafted UDF. The item closes it: the module does not
    load, neither on the kernel's request nor when called directly.

    The category is medium because a medium with UDF is easy to slip in, and the
    driver handles a complex format with many revisions. The item belongs to
    level 2 because it takes away reading discs and images, which some
    workstations use.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo UDF jest nadal w użyciu na płytach i w obrazach.
    Po zmianie płyta DVD z danymi lub Blu-ray się nie otwiera, a obraz ISO
    Windows montuje się jako ISO 9660 i pokazuje tylko plik z informacją, że
    właściwa zawartość jest w UDF.

    Nie zmienia się nic dla płyt CD i obrazów zapisanych wyłącznie w ISO 9660,
    w tym obrazów Fedory. Nagranie obrazu na pendrive, np. programem Fedora
    Media Writer, też działa, bo kopiuje on bajty, a nie montuje obrazu.

    Zmiana nie wymaga restartu ani wylogowania; nośnik zamontowany wcześniej
    działa do odmontowania.
  en: |
    The class needs review because UDF is still in use on discs and in images.
    After the change a DVD or Blu-ray data disc does not open, and a Windows ISO
    image mounts as ISO 9660 and shows only a file saying that the real contents
    are in UDF.

    Nothing changes for CDs and for images written only in ISO 9660, Fedora's
    images included. Writing an image to a USB stick, for example with Fedora
    Media Writer, also still works, because it copies bytes rather than mounting
    the image.

    The change needs no restart and no sign-out; a medium mounted earlier keeps
    working until it is unmounted.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
  what_breaks:
    pl:
      - Płyta DVD lub Blu-ray z danymi nie otwiera się w menedżerze plików, a próba montowania kończy się błędem
      - Obraz ISO instalacji Windows otwarty dwuklikiem pokazuje tylko plik README zamiast plików instalacyjnych
      - Pamięć wymienna sformatowana w UDF, np. do wymiany plików między Windows, macOS i Linuksem, nie montuje się
    en:
      - A DVD or Blu-ray data disc does not open in the file manager, and an attempt to mount it fails
      - A Windows installation ISO opened with a double click shows only a README file instead of the setup files
      - A removable drive formatted as UDF, for example to exchange files between Windows, macOS and Linux, does not mount
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stacja służy do odczytu lub archiwizacji płyt DVD i Blu-ray albo do pracy z obrazami ISO systemu Windows
    en:
      - The workstation is used to read or archive DVD and Blu-ray discs, or to work with Windows ISO images
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    m=udf
    mods=/usr/lib/modules
    if [ ! -d "$mods" ] || [ ! -r /proc/modules ] || ! command -v modprobe >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if grep -q "^$m " /proc/modules; then echo LOADED; exit 0; fi
    for list in "$mods"/*/modules.builtin; do
      [ -e "$list" ] || continue
      [ -r "$list" ] || { echo CHECK_ERROR; exit 0; }
      if grep -Eq "/$m\.ko$" "$list"; then echo BUILTIN; exit 0; fi
    done
    if ! found=$(find "$mods" -name "$m.ko*" -print -quit 2>/dev/null); then
      echo CHECK_ERROR; exit 0
    fi
    if [ -z "$found" ]; then echo NOT_PRESENT; exit 0; fi
    if ! config=$(modprobe --showconfig 2>/dev/null); then echo CHECK_ERROR; exit 0; fi
    blocked=no; listed=no
    if printf '%s\n' "$config" | grep -Eq "^install $m (/usr)?/bin/(false|true)$"; then blocked=yes; fi
    if printf '%s\n' "$config" | grep -qx "blacklist $m"; then listed=yes; fi
    case "$blocked$listed" in
      yesyes) echo BLOCKED ;;
      yesno)  echo NOT_BLACKLISTED ;;
      noyes)  echo LOADABLE_ON_REQUEST ;;
      *)      echo AVAILABLE ;;
    esac
  expected: '^(BLOCKED|NOT_PRESENT)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      m=udf
      f=/etc/modprobe.d/sentin-harden-udf.conf
      mkdir -p "$(dirname '{{backup_file}}')"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        if grep -q "^$m " /proc/modules; then echo loaded=1; else echo loaded=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > '{{backup_file}}'
      echo "Saved previous state to {{backup_file}}"
    )

  change_command: |
    (
      set -e
      m=udf
      f=/etc/modprobe.d/sentin-harden-udf.conf
      printf '%s\n' \
        '# Sentin-Harden: fedora44-udf-not-available' \
        "install $m /bin/false" \
        "blacklist $m" > "$f"
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      if grep -q "^$m " /proc/modules; then
        if ! modprobe -r "$m"; then
          echo "Module $m is in use and stays loaded until the file system using it is unmounted" >&2
        fi
      fi
      echo "Wrote $f"
    )

  rollback_command: |
    (
      set -e
      m=udf
      f=/etc/modprobe.d/sentin-harden-udf.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      loaded=$(sed -n 's/^loaded=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      if [ "$loaded" = 1 ] && ! grep -q "^$m " /proc/modules; then modprobe "$m"; fi
      echo "Restored previous state of $f"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/modprobe.d.5.html
  - https://docs.kernel.org/filesystems/udf.html

notes:
  pl: |
    Sprawdzenie czyta wynikową konfigurację modprobe, a nie jeden wybrany
    plik. Blokada zapisana wcześniej gdzie indziej, np. w
    /etc/modprobe.d/udf.conf, także spełnia punkt, a naprawa jej nie
    dubluje, bo przy spełnionym punkcie nie jest uruchamiana.

    Potrzebne są obie linie. Wpis blacklist powstrzymuje tylko ładowanie po
    aliasie, czyli wtedy, gdy jądro samo prosi o sterownik przy montowaniu;
    modprobe wywołane z nazwą modułu go omija. Linia install zastępuje
    ładowanie uruchomieniem /bin/false, więc każda taka próba kończy się
    błędem. Obu mechanizmów nie zatrzymuje insmod z pełną ścieżką do pliku,
    ale to wymaga roota i świadomego działania.

    Punkt jest spełniony także wtedy, gdy żadne zainstalowane jądro nie
    zawiera modułu. Moduł załadowany w chwili sprawdzenia daje wynik
    niespełniony nawet przy obecnej blokadzie; naprawa próbuje go wyładować,
    a jeśli jest w użyciu, zostaje w pamięci do odmontowania systemu plików
    albo do restartu. Jeśli punkt pozostaje niespełniony po naprawie
    i restarcie, sterownik jest wkompilowany w jądro: plikiem konfiguracji
    nie da się go zablokować i zostaje zapisanie wyjątku.
  en: |
    The check reads the effective modprobe configuration rather than one
    chosen file. A block written earlier somewhere else, for example in
    /etc/modprobe.d/udf.conf, also meets the item, and the remediation does
    not duplicate it, because it is not run when the item is met.

    Both lines are needed. The blacklist entry only stops loading by alias,
    that is, when the kernel itself asks for the driver while mounting; running
    modprobe with the module name bypasses it. The install line replaces loading
    with running /bin/false, so every such attempt fails. Neither mechanism
    stops insmod with the full path to the file, but that needs root and a
    deliberate action.

    The item is also met when no installed kernel contains the module. A
    module that is loaded at the time of the check gives a non-compliant result
    even when the block is in place; the remediation tries to unload it, and if
    it is in use it stays in memory until the file system is unmounted or the
    machine restarts. If the item is still non-compliant after the remediation
    and a restart, the driver is compiled into the kernel: a configuration file
    cannot block it, and the remaining option is to record an exception.
