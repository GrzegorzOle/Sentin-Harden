id: fedora44-pam-pwquality-enabled

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.3.2.3
  section: Access Control > Pluggable Authentication Modules > Configure authselect
  title:
    pl: Moduł pam_pwquality jest włączony
    en: Ensure pam_pwquality module is enabled
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Wymagania co do długości i złożoności nowych haseł sprawdza w PAM moduł
    pam_pwquality. Bez niego passwd przyjmie każde hasło, także bardzo
    krótkie albo słownikowe.

    Punkt wymaga, żeby wiersz password z pam_pwquality był aktywny
    w /etc/pam.d/system-auth i password-auth.
  en: |
    In PAM, the pam_pwquality module checks the length and complexity of
    new passwords. Without it passwd accepts any password, even a very short
    or dictionary one.

    The item requires an active password line with pam_pwquality in
    /etc/pam.d/system-auth and password-auth.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta pliki PAM.
  en: |
    Nobody will notice: the check only reads the PAM files.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    pam_has() {
      [ -r "$1" ] || return 1
      awk -v t="$2" -v m="$3" -v a="$4" '
        /^[ \t]*#/ || NF == 0 { next }
        { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
        $1 == t && p[n] == m && (a == "" || index(" " $0 " ", " " a " ")) { f = 1 }
        END { exit !f }' "$1"
    }
    evaluate() {
      local miss="" f s ty mo ar
      for f in system-auth password-auth; do
        for s in password:pam_pwquality.so:; do
          ty=${s%%:*}; s=${s#*:}; mo=${s%%:*}; ar=${s#*:}
          pam_has "/etc/pam.d/$f" "$ty" "$mo" "$ar" || miss="$miss,$f:$ty:$mo${ar:+:$ar}"
        done
      done
      if [ -z "$miss" ]; then echo "OK:pam_pwquality"; else echo "NOT_OK:missing=${miss#,}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://github.com/libpwquality/libpwquality
  - https://github.com/authselect/authselect

notes:
  pl: |
    Na Fedorze plikami /etc/pam.d/system-auth i password-auth zarządza
    authselect: są to dowiązania do plików w /etc/authselect, tworzonych
    z szablonu wybranego profilu i włączonych funkcji. Fedora domyślnie
    używa profilu local.

    Profile local i sssd zawsze mają wiersz pam_pwquality; nie ma do niego
    osobnej funkcji authselect. Brak tego wiersza oznacza zwykle własny
    profil bez pam_pwquality albo ręcznie utrzymywane pliki PAM po
    authselect opt-out. Wtedy trzeba dodać wiersz
    password requisite pam_pwquality.so do szablonów system-auth
    i password-auth własnego profilu w /etc/authselect/custom i wykonać
    authselect apply-changes. Reguła tylko sprawdza stan.
  en: |
    On Fedora, authselect manages the /etc/pam.d/system-auth and
    password-auth files: they are links to files in /etc/authselect built
    from the template of the selected profile and its enabled features.
    Fedora uses the local profile by default.

    The local and sssd profiles always have the pam_pwquality line; there
    is no authselect feature for it. A missing line usually means a custom
    profile without pam_pwquality or PAM files kept by hand after authselect
    opt-out. Then add the line password requisite pam_pwquality.so to the
    system-auth and password-auth templates of the custom profile in
    /etc/authselect/custom and run authselect apply-changes. The rule only
    checks the state.
