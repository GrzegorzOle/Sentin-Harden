id: win10-bitlocker-advanced-startup-required

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Dodatkowe uwierzytelnienie przy starcie dysku systemowego wymagane
    en: Additional authentication at startup of the system drive required
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby odblokowanie dysku systemowego wymagało czegoś
    więcej niż samego włączenia maszyny.

    Szyfrowanie oparte wyłącznie na module sprzętowym odblokowuje dysk
    samo, bez pytania kogokolwiek. Jest to wygodne i w wielu układach
    wystarczające, ale opiera się na jednym założeniu: że sam start
    maszyny jest dowodem uprawnienia. Dla komputera przenośnego
    skradzionego wraz z zasilaczem założenie to jest fałszywe.

    Dodatkowe uwierzytelnienie przenosi dowód z maszyny na osobę. Złodziej
    ma sprzęt, ale nie ma kodu — a moduł sprzętowy nie odda klucza, dopóki
    kod nie zostanie wpisany.

    Odnotowuję drugą wartość wpisywaną razem z pierwszą. Bez niej zasada
    dopuszcza szyfrowanie bez modułu sprzętowego, a wtedy wymaganie staje
    się pozorne: dysk można zaszyfrować tak, że warunek nie obowiązuje.
    Sprawdzenie odróżnia ten stan i nazywa go osobno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zaszyfrowanego dysku przez samo włączenie skradzionej maszyny.
  en: |
    The setting calls for the unlocking of the system drive to take more than the mere switching on of the
    machine.

    Enciphering resting upon the hardware module alone unlocks the disk of itself, asking nobody. That is handy
    and in many arrangements enough, but it rests upon one assumption: that the machine's very start is a proof of
    right. For a portable computer stolen together with its charger that assumption is false.

    Additional authentication carries the proof over from the machine to the person. The thief has the gear but
    not the code - and the hardware module will not give the key up until the code is typed.

    I set down the second value written together with the first. Without it the policy admits enciphering without
    the hardware module, and the requirement becomes a seeming one: a disk may be enciphered so that the condition
    does not hold. The check tells that state apart and names it on its own.

    What an attacker gains while the item goes unmet: the way into an enciphered disk by the mere switching on of
    a stolen machine.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmienia sposób, w jaki ludzie
    uruchamiają maszynę.

    Od tej chwili każdy start wymaga wpisania kodu, zanim system ruszy.
    Dotyczy to również restartu po aktualizacji, restartu po zawieszeniu
    i wybudzenia z hibernacji. Dla użytkownika jest to nowy krok przed
    zalogowaniem, o którym trzeba uprzedzić.

    Skutek najpoważniejszy dotyczy pracy zdalnej. Maszyna zrestartowana
    zdalnie nie wróci do sieci, bo zatrzyma się na ekranie kodu i będzie
    czekać, aż ktoś stanie przy niej fizycznie. Wszystkie procedury
    oparte na zdalnym restarcie — aktualizacje nocne, naprawa przez
    wsparcie, ponowne uruchomienie po wdrożeniu — przestają działać
    w dotychczasowej postaci.

    Drugi skutek dotyczy zapomnianego kodu. Użytkownik, który go nie
    pamięta, nie dostanie się do maszyny bez klucza odzyskiwania — więc
    ten punkt ma sens wyłącznie tam, gdzie klucze są zabezpieczone
    i osiągalne dla obsługi.

    Odnotowuję, że zmiana zasady nie przestawia dysków już zaszyfrowanych.
    Obejmuje szyfrowanie zakładane po jej wprowadzeniu, a istniejące
    wymagają dodania zabezpieczenia osobno.

    Czego to nie psuje: pracy po zalogowaniu, dostępu do plików,
    wydajności, udziałów plikowych, drukowania.
  en: |
    The class is "needs a planned rollout", changing as it does the way people start a machine.

    From that hour every start calls for a code to be typed before the system moves. That touches likewise a
    restart after an update, a restart after a hang and a waking from hibernation. For the user it is a new step
    before the signing in, and one they have to be warned of.

    The weightiest consequence touches work from afar. A machine restarted from afar will not come back to the
    network, holding upon the screen of the code and waiting for somebody to stand physically beside it. Every
    procedure resting upon a restart from afar - updates by night, mending by the support, a starting again after a
    rollout - ceases to work in the shape it had.

    The second consequence touches a forgotten code. A user who does not call it to mind will not get into the
    machine without the key of recovery - so this item makes sense only where the keys are secured and within the
    support's reach.

    I set down that a change of the policy does not reset disks already enciphered. It takes in enciphering laid
    on after it was brought in, while those that are call for the guard to be added apart.

    What this does not break: work once signed in, the way to files, speed, file shares, or printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - remote-management
  what_breaks:
    pl:
      - Maszyna zrestartowana zdalnie nie wróci do sieci, bo zatrzyma się na ekranie kodu i będzie czekać na człowieka
      - Aktualizacje nocne, naprawa przez wsparcie i ponowne uruchomienie po wdrożeniu przestają działać w dotychczasowej postaci
      - Każdy start, restart po aktualizacji i wybudzenie z hibernacji wymagają wpisania kodu przed zalogowaniem
      - Użytkownik, który zapomni kodu, nie dostanie się do maszyny bez klucza odzyskiwania
      - Praca po zalogowaniu, dostęp do plików, wydajność, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A machine restarted from afar will not come back to the network, holding upon the screen of the code and waiting for a person
      - Updates by night, mending by the support and a starting again after a rollout cease to work in the shape they had
      - Every start, every restart after an update and every waking from hibernation call for a code before the signing in
      - A user who forgets the code will not get into the machine without the key of recovery
      - Work once signed in, the way to files, speed, file shares and printing stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna stoi w serwerowni i jest restartowana zdalnie, a nikt nie stanie przy niej, żeby wpisać kod
      - Klucze odzyskiwania nie są zabezpieczone i osiągalne dla obsługi, więc zapomniany kod odcina maszynę
    en:
      - The machine stands in a server room and is restarted from afar, and nobody will stand beside it to type the code
      - The keys of recovery are not secured and within the support s reach, so a forgotten code cuts the machine off
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first requires the additional
      # authentication; the second must stay at zero, otherwise encryption without
      # the hardware module is admitted and the requirement is hollow.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $advanced = $item.'UseAdvancedStartup'
        $noTpm = $item.'EnableBDEWithNoTPM'
        if ($null -eq $advanced) { 'MISSING' }
        elseif ([int]$advanced -ne 1) { 'NOT_REQUIRED' }
        elseif ($null -ne $noTpm -and [int]$noTpm -eq 1) { 'WITHOUT_MODULE_ALLOWED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      advanced          = $item.'UseAdvancedStartup'
      advanced_existed  = ($null -ne $item.'UseAdvancedStartup')
      no_tpm            = $item.'EnableBDEWithNoTPM'
      no_tpm_existed    = ($null -ne $item.'EnableBDEWithNoTPM')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both values are written together. The first alone would leave the second free
    # to admit encryption without the hardware module, and the requirement hollow.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseAdvancedStartup' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'EnableBDEWithNoTPM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.advanced_existed) {
      Set-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -Value $b.advanced -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -ErrorAction SilentlyContinue
    }
    if ($b.no_tpm_existed) {
      Set-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -Value $b.no_tpm -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tym bloku najbardziej odczuwalna i warto, żeby
    aplikacja pokazała ją obok punktu o samym szyfrowaniu. Tamten chroni
    dysk wyjęty z maszyny; ten chroni dysk skradziony razem z maszyną.

    Argument rozstrzygający dotyczy tego, co złodziej zabiera. Nie wyjmuje
    dysku — zabiera całość, razem z zasilaczem. Szyfrowanie oparte
    wyłącznie na module sprzętowym w tym układzie nie broni niczego, bo
    maszyna odblokuje się sama. Jest to różnica między ochroną przed
    wyjęciem dysku a ochroną przed kradzieżą sprzętu.

    Odnotowuję drugą wartość, bo bez niej punkt jest pozorny. Zasada
    wymagająca dodatkowego uwierzytelnienia, ale dopuszczająca szyfrowanie
    bez modułu sprzętowego, opisuje wymaganie, którego da się nie
    spełnić. Sprawdzenie nazywa ten stan osobno i słusznie, bo z zewnątrz
    wygląda on na stan zgodny.
  en: |
    The rule is the most felt in this block, and it is well that the application show it beside the item about the
    enciphering itself. That one guards a disk taken out of a machine; this guards a disk stolen together with
    the machine.

    The settling argument touches what a thief carries off. They do not take the disk out - they carry the whole
    away, the charger with it. Enciphering resting upon the hardware module alone guards nothing in that
    arrangement, the machine unlocking itself. It is the difference between a guarding against the taking out of a
    disk and a guarding against the theft of gear.

    I set down the second value, without which the item is a seeming one. A policy calling for additional
    authentication but admitting enciphering without the hardware module sets out a requirement that may be left
    unmet. The check names that state on its own, and rightly, from outside it looking like a compliant one.
