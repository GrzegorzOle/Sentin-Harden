id: win2016-feedback-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Prośby o opinię o systemie wyłączone
    en: Requests for an opinion about the system switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wyświetlanie próśb o opinię o systemie.

    Rzecz, o którą tu chodzi, nie leży w samym okienku, tylko w tym, co po
    nim następuje. Prośba o opinię jest zaproszeniem do napisania tekstu
    i wysłania go na zewnątrz, a tekst pisany w takiej chwili opisuje to,
    nad czym piszący akurat pracował.

    Na serwerze znaczy to, że treść opisująca konfigurację, usterkę albo
    sposób pracy może zostać wysłana przez kogoś, kto wcale nie zamierzał
    niczego wynosić — po prostu odpowiedział na pytanie, które się
    pojawiło. Prośba przychodzi sama i w chwili wybranej nie przez
    odpowiadającego.

    Punkt jest wąski i nie zamyka żadnej drogi wejścia. Zamyka drogę
    wyjścia, i to drogę, którą coś wychodzi wyłącznie wtedy, gdy człowiek
    świadomie coś napisze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele —
    kanał, którym ktoś obsługujący maszynę może w dobrej wierze opisać jej
    stan komuś na zewnątrz.
  en: |
    The setting switches off the showing of requests for an opinion about the system.

    The matter here lies not in the little window but in what follows it. A request for an opinion is an
    invitation to write a text and send it outward, and a text written at such a moment describes what the
    writer happened to be working on.

    On a server that means content describing a configuration, a defect or a way of working may be sent by
    somebody who meant to carry nothing out - they simply answered a question that appeared. The request
    comes of itself and at a moment chosen not by the one answering.

    The item is a narrow one and shuts no road in. It shuts a road out, and one by which something goes
    out solely where a person knowingly writes something.

    What an attacker gains while the item goes unmet: little - a channel by which somebody attending the
    machine may in good faith describe its state to somebody outside.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Prośby przestają się pojawiać. Zgłoszenie usterki na żądanie pozostaje
    możliwe i punkt go nie dotyczy.

    Na serwerze zmiana jest widoczna wyłącznie przy pracy na konsoli.

    Rzecz warta rozróżnienia: punkt nie dotyczy wysyłania danych
    diagnostycznych ani raportów o błędach. Te są osobnymi mechanizmami
    i mają własne ustawienia. Tutaj chodzi wyłącznie o pytanie zadawane
    człowiekowi.

    Nie ma znanych regresji.

    Czego to nie psuje: zgłaszania usterek na żądanie, raportów o błędach,
    danych diagnostycznych, aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The requests cease to appear. Reporting a fault on demand stays possible and the item does not concern
    it.

    On a server the change is visible solely when working at the console.

    A thing worth telling apart: the item does not concern the sending of diagnostic data or of error
    reports. Those are separate mechanisms with settings of their own. Here it is solely a matter of a
    question put to a person.

    There are no known regressions.

    What this does not break: the reporting of faults on demand, error reports, diagnostic data,
    applications, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Prośby o opinię przestają się pojawiać przy pracy na konsoli
      - Zgłoszenie usterki na żądanie pozostaje możliwe i punkt go nie dotyczy
      - Raporty o błędach i dane diagnostyczne mają własne ustawienia i pozostają bez zmian
      - Aplikacje, usługi i sieć pozostają bez zmian
    en:
      - Requests for an opinion cease to appear when working at the console
      - Reporting a fault on demand stays possible and the item does not concern it
      - Error reports and diagnostic data have settings of their own and stay unchanged
      - Applications, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna bierze udział w programie oceniania wydań przedpremierowych i opinie są stamtąd oczekiwane
    en:
      - The machine takes part in a programme of judging pre-release builds and opinions are expected from there
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      $name = 'DoNotShowFeedbackNotifications'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'DoNotShowFeedbackNotifications'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The requests stop appearing. Reporting a fault on demand stays possible
    # and is untouched by this.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DoNotShowFeedbackNotifications' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-feedback

notes:
  pl: |
    Punkt jest lekki, ale argument, który go broni, jest inny niż przy
    sąsiadach i warto go nie zgubić. Nie chodzi o to, że coś wychodzi samo —
    chodzi o to, że ktoś zostaje o to poproszony w chwili, której nie
    wybrał, i odpowiada w dobrej wierze.

    Jest to jedyna reguła w tym bloku, w której drogą wyprowadzenia jest
    człowiek, a nie mechanizm. Warto to w opisie nazwać, bo zmienia
    charakter zagrożenia: nie da się go ograniczyć ustawieniem sieciowym
    ani zaporą.

    Rozróżnienie wobec danych diagnostycznych i raportów o błędach jest
    drugą rzeczą wartą pokazania. Trzy mechanizmy o podobnym brzmieniu mają
    osobne ustawienia i wykonanie jednego nie domyka pozostałych.
  en: |
    The item is a light one, but the argument defending it is another than at its neighbours and worth not
    losing. It is not a matter of something going out of itself - it is a matter of somebody being asked
    for it at a moment they did not choose, and answering in good faith.

    It is the only rule in this block where the road of carrying out is a person and not a mechanism. That
    is worth naming in the description, changing as it does the threat's character: it cannot be limited
    by a network setting or a firewall.

    The distinction from diagnostic data and error reports is the second thing worth showing. Three
    mechanisms of like sound have separate settings, and carrying one out does not shut the rest.
