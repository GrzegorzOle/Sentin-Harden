id: win10-remote-registry-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego dostępu do rejestru wyłączona
    en: The service of reach of the register from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę pozwalającą odczytywać i zapisywać rejestr
    tej maszyny z innej maszyny w sieci.

    Rejestr jest miejscem, w którym leży konfiguracja systemu: ustawienia
    zabezpieczeń, wykaz usług, ścieżki uruchamiania programów, zasady.
    Dostęp do niego z sieci jest dostępem do wszystkiego naraz, o ile
    tylko poświadczenia wystarczą.

    Zagrożenie jest podwójne. Odczyt daje rozpoznanie: wersję systemu,
    zainstalowane programy, konfigurację zabezpieczeń, nazwy kont.
    Zapis daje trwałe umieszczenie się na maszynie — wpis uruchamiany
    przy starcie, zmieniona ścieżka usługi, zdjęte ograniczenie.

    Osobno warto zauważyć, że jest to dostęp bez śladu w miejscach,
    w które zwykle się patrzy. Nie powstaje sesja, nie uruchamia się
    powłoka, nie ma procesu do zobaczenia w wykazie.

    Odnotowuję, że usługa jest domyślnie zatrzymana i uruchamiana na
    żądanie. Punkt zamyka ją na stałe, a to jest różnica: usługa
    uruchamiana na żądanie startuje w chwili pierwszego zapytania z sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    i zapis konfiguracji maszyny przez sieć, bez uruchamiania powłoki.
  en: |
    The setting switches off the service letting the register of this machine be read and written from another
    machine in the network.

    The register is the place where the system's setting up lies: settings of guarding, the roll of services, the
    roads by which programs are set going, policy. A reach of it out of the network is a reach of everything at
    once, so far as the warrants suffice.

    The danger is twofold. The reading gives a searching out: the system's version, the laid-on programs, the
    setting up of guards, the names of reckonings. The writing gives a lasting seat upon the machine - an entry
    set going at the start, a changed road of a service, a bound taken off.

    It is worth marking apart that this is a reach leaving no trace in the places commonly looked at. No sitting
    comes about, no shell is set going, there is no working thing to be seen upon the roll.

    I set down that the service by default stands stopped and is set going upon demand. The item shuts it for
    good, and that is a difference: a service set going upon demand starts at the hour of the first asking out of
    the network.

    What an attacker gains while the item goes unmet: the reading and the writing of the machine's setting up
    across the network, with no shell set going.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    narzędzia obsługi sięgają do rejestru maszyny zdalnie.

    Miejscem wartym uwagi są systemy inwentaryzacji i nadzoru czytające
    konfigurację wprost z rejestru zamiast przez agenta. Po zmianie
    przestaną zbierać dane z tej maszyny, zwykle cicho, zgłaszając
    maszynę jako niedostępną.

    Miejscem drugim są własne skrypty administracyjne odczytujące
    ustawienia wielu maszyn naraz. Warto je przejrzeć przed wdrożeniem,
    bo przerwą się na pierwszej maszynie z zamkniętą usługą.

    Odnotowuję, że zdalne zarządzanie przez powłokę i przez mechanizm
    zarządzania działa dalej i sięga do tych samych ustawień. Traci się
    jedną drogę, a nie możliwość.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: zdalnego zarządzania przez powłokę, pulpitu
    zdalnego, dostępu do udziałów, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether the keepers' tools reach the machine's
    register from afar.

    The place worth notice is systems of setting down and of watching that read the setting up straight out of the
    register rather than through an agent. After the change they will cease to gather data from this machine,
    commonly quietly, giving the machine out as not to be reached.

    The second place is scripts of keeping of one's own that read the settings of many machines at once. They are
    worth looking over before the rollout, breaking off as they will at the first machine with the service shut.

    I set down that the governing from afar through the shell and through the mechanism of governing works on and
    reaches those same settings. What is lost is one road and not the power.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the governing from afar through the shell, the desk from afar, the reach of shares,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Systemy inwentaryzacji czytające konfigurację wprost z rejestru przestaną zbierać dane z tej maszyny
      - Zgłoszą ją zwykle jako niedostępną, bez wskazania przyczyny, więc brak danych bywa zauważony późno
      - Własne skrypty administracyjne odczytujące ustawienia wielu maszyn przerwą się na pierwszej z zamkniętą usługą
      - Zdalne zarządzanie przez powłokę sięga do tych samych ustawień, więc traci się jedną drogę, a nie możliwość
      - Pulpit zdalny, dostęp do udziałów, logowanie, drukowanie i praca programów pozostają bez zmian
    en:
      - Systems of setting down that read the setting up straight out of the register will cease to gather data from this machine
      - They will commonly give it out as not to be reached, with no cause named, so the want of data is marked late
      - Scripts of keeping of one s own that read the settings of many machines will break off at the first with the service shut
      - The governing from afar through the shell reaches those same settings, so one road is lost and not the power
      - The desk from afar, the reach of shares, logging on, printing and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - System inwentaryzacji czyta konfigurację maszyn wyłącznie przez zdalny dostęp do rejestru i nie ma agenta
    en:
      - A system of setting down reads the machines setting up solely through the reach of the register from afar and has no agent
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteRegistry'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RemoteRegistry' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteRegistry' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteRegistry' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/sysinfo/registry-functions

notes:
  pl: |
    Reguła bywa uznawana za załatwioną, bo usługa jest domyślnie
    zatrzymana. Warto, żeby aplikacja podważyła to wprost: usługa
    zatrzymana, ale uruchamiana na żądanie, startuje w chwili pierwszego
    zapytania z sieci. Dopiero zamknięcie na stałe zmienia stan faktyczny.

    Argument wart postawienia wprost dotyczy tego, czego ta droga nie
    zostawia. Nie powstaje sesja, nie uruchamia się powłoka, nie ma
    procesu w wykazie — a jednocześnie da się tędy zapisać wpis
    uruchamiany przy starcie. Dostęp jest pełny, a ślad minimalny.

    Odnotowuję, że zdalne zarządzanie przez powłokę sięga do tych samych
    ustawień. Warto to powiedzieć, bo punkt bywa odrzucany zdaniem
    „ale wtedy nie zarządzę maszyną zdalnie", a to nieprawda.
  en: |
    The rule is at times held settled, the service standing stopped by default. It is well that the application
    gainsay that outright: a service stopped but set going upon demand starts at the hour of the first asking out
    of the network. Only a shutting for good alters the true state.

    The argument worth putting outright touches what this road leaves not. No sitting comes about, no shell is set
    going, there is no working thing upon the roll - and at the same time an entry set going at the start may be
    written this way. The reach is whole and the trace the least.

    I set down that the governing from afar through the shell reaches those same settings. It is worth saying, the
    item being at times cast aside with the words "but then I shall not govern the machine from afar", and that is
    untrue.
