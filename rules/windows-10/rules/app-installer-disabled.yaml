id: win10-app-installer-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Wbudowany instalator pakietów wyłączony
    en: The built-in installer of packages switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wbudowany instalator pakietów, czyli narzędzie
    wiersza poleceń pobierające i instalujące oprogramowanie z repozytoriów.

    Narzędzie to jest wygodne i z tej samej przyczyny groźne. Jednym
    poleceniem pobiera pakiet spoza maszyny, rozpakowuje go i instaluje —
    a robi to prawami użytkownika, bez okna instalatora i bez pytania,
    które ktoś mógłby zauważyć.

    Zagrożeniem nie jest samo repozytorium producenta, tylko to, że
    źródła da się dopisać. Napastnik, który ma już zdalne wykonanie
    polecenia na maszynie, dostaje gotowy, podpisany przez system sposób
    na ściągnięcie i uruchomienie dowolnego oprogramowania — bez pisania
    własnego programu pobierającego, który wzbudziłby uwagę ochrony.

    Osobnym skutkiem jest obejście kontroli oprogramowania. Maszyna,
    na której wolno instalować tylko rzeczy zatwierdzone, przestaje mieć
    taką własność, jeżeli obok stoi narzędzie instalujące z sieci
    cokolwiek.

    Odnotowuję, że wyłączenie dotyczy narzędzia, a nie pakietów już
    zainstalowanych. Oprogramowanie wcześniej wprowadzone działa dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowe
    narzędzie do pobrania i zainstalowania oprogramowania z sieci.
  en: |
    The setting switches off the built-in installer of packages, which is to say the tool of the command line that
    draws and lays on software out of stores.

    That tool is handy and for the selfsame cause dangerous. With one command it draws a package from outside the
    machine, unpacks it and lays it on - and does so with the user's rights, with no window of an installer and no
    question anybody might mark.

    The danger lies not in the maker's own store but in this, that sources may be added to. An attacker who
    already has the running of a command upon the machine from afar is given a ready way, signed by the system, of
    pulling down and setting going any software at all - without the writing of a drawing program of their own,
    which would draw the notice of the guard.

    A consequence apart is the going about of the control of software. A machine upon which only approved things
    may be laid on ceases to have that property if beside it stands a tool that lays on anything at all out of the
    network.

    I set down that the switching off touches the tool and not packages already laid on. Software brought in
    earlier works on.

    What an attacker gains while the item goes unmet: a ready tool for the drawing and laying on of software out
    of the network.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia".

    Zmiana odbiera narzędzie, na którym potrafi stać cała obsługa
    oprogramowania na maszynie. Trzeba to sprawdzić, zanim punkt zostanie
    wdrożony, bo skutki bywają daleko od miejsca zmiany.

    Miejscem pierwszym są skrypty instalacyjne i konfiguracyjne. Zestawy
    przygotowujące nowe stanowisko często opierają się na tym narzędziu
    i po zmianie przerwą się w połowie, zwykle bez czytelnego komunikatu.

    Miejscem drugim są osoby pracujące z oprogramowaniem deweloperskim.
    Tam narzędzie bywa używane codziennie i jego zniknięcie jest zmianą
    sposobu pracy, a nie drobiazgiem.

    Miejscem trzecim jest aktualizowanie zainstalowanych programów.
    Część z nich aktualizuje się właśnie przez to narzędzie i po zmianie
    przestanie — cicho, bez ostrzeżenia, co jest gorsze niż widoczny błąd.

    Skutek pojawia się po wylogowaniu i jest widoczny dla użytkownika:
    polecenie przestaje być rozpoznawane.

    Czego to nie psuje: programów już zainstalowanych, sklepu systemowego,
    instalatorów uruchamianych ręcznie, logowania, drukowania.
  en: |
    The class is "needs a planned rollout".

    The change takes away a tool upon which the whole keeping of software upon a machine can stand. That has to be
    looked at before the item is rolled out, the consequences lying at times far from the place of the change.

    The first place is scripts of installing and setting up. Sets making ready a new station often rest upon this
    tool and after the change will break off halfway, commonly with no message to be read.

    The second place is people working with software of development. There the tool is at times used daily and its
    vanishing is a change in the manner of work and no trifle.

    The third place is the bringing up to date of laid-on programs. Some of them are brought up to date by this
    very tool and after the change will cease to be - quietly, with no warning, which is worse than a fault to be
    seen.

    The consequence shows after a logging off and is plain to the user: the command ceases to be known.

    What this does not break: programs already laid on, the system's store, installers set going by hand, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Skrypty przygotowujące nowe stanowisko oparte na tym narzędziu przerwą się w połowie, zwykle bez czytelnego komunikatu
      - Osoby pracujące z oprogramowaniem deweloperskim stracą narzędzie używane codziennie
      - Programy aktualizujące się przez to narzędzie przestaną to robić cicho, bez ostrzeżenia
      - Polecenie przestanie być rozpoznawane po wylogowaniu, co użytkownik zobaczy wprost
      - Programy już zainstalowane, sklep systemowy, instalatory uruchamiane ręcznie i drukowanie pozostają bez zmian
    en:
      - Scripts making ready a new station that rest upon this tool will break off halfway, commonly with no message to be read
      - People working with software of development will lose a tool used daily
      - Programs brought up to date by this tool will cease to be so, quietly and with no warning
      - The command will cease to be known after a logging off, which the user will see outright
      - Programs already laid on, the system s store, installers set going by hand and printing stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Przygotowanie nowych stanowisk opiera się na tym narzędziu i nie ma dla niego zamiennika
      - Maszyna służy do pracy deweloperskiej, w której narzędzie jest używane codziennie
    en:
      - The making ready of new stations rests upon this tool and there is no other in its place
      - The machine serves work of development in which the tool is used daily
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableAppInstaller'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableAppInstaller'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableAppInstaller' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/package-manager/winget/

notes:
  pl: |
    Reguła jest najostrzejsza w tym bloku i warto, żeby aplikacja
    pokazała ją jako pierwszą, a pozostałe jako łagodniejsze warianty
    tej samej myśli. Jeżeli narzędzie zostaje, obowiązują punkty
    o skrótach, archiwach i odnośnikach; jeżeli znika, tamte są bez
    znaczenia.

    Argument wart postawienia wprost dotyczy tego, czemu to punkt wysoki.
    Nie chodzi o repozytorium producenta, bo to jest źródłem
    wiarygodnym. Chodzi o to, że napastnik z wykonaniem polecenia dostaje
    podpisane przez system narzędzie pobierające — czyli oszczędza sobie
    dokładnie tego kroku, na którym ochrona najczęściej go zatrzymuje.

    Odnotowuję, że wyłączenie nie usuwa niczego, co już stoi na maszynie.
    Warto to powiedzieć, bo obawa przed utratą zainstalowanego
    oprogramowania jest częstym powodem odpuszczenia tego punktu, a jest
    nieuzasadniona.
  en: |
    The rule is the sharpest in this block and it is well that the application show it first, the rest being
    milder shapes of the same thought. If the tool stays, the items about digests, archives and links hold good;
    if it goes, those are without meaning.

    The argument worth putting outright touches why this is a high item. What is at stake is not the maker's
    store, that being a source to be trusted. It is that an attacker with the running of a command is given a
    drawing tool signed by the system - which is to say they are spared just that step at which the guard most
    often stops them.

    I set down that the switching off takes away nothing that already stands upon the machine. It is worth saying,
    the fear of losing laid-on software being a common ground for letting this item go, and a groundless one.
