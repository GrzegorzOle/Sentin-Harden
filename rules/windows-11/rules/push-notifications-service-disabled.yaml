id: win11-push-notifications-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa powiadomień wypychanych z sieci wyłączona
    en: The service for notifications pushed from the network disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa utrzymuje stałe połączenie z usługą powiadomień w sieci publicznej
    i odbiera przez nie komunikaty kierowane do programów zainstalowanych na
    maszynie. To ona wyświetla powiadomienia i przekazuje treść programom,
    których dotyczą.

    Mechanizm ma dwie cechy, które warto postawić obok siebie. Po pierwsze,
    połączenie jest trwałe, wychodzące i nawiązywane niezależnie od tego, czy
    ktokolwiek na maszynie pracuje. Po drugie, przez to połączenie przychodzą
    dane pochodzące z zewnątrz, kierowane do konkretnego programu i przez niego
    przetwarzane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał, który
    dostarcza dane na maszynę z inicjatywy strony zewnętrznej, obok zwykłych
    dróg ruchu sieciowego i bez związku z tym, co użytkownik robi. Wykorzystanie
    takiego kanału wymaga wprawdzie kontroli nad programem po stronie maszyny
    albo nad jego zapleczem, ale sam kanał jest gotowy i utrzymywany.

    Osobno liczy się to, że powiadomienia wyświetlają się na ekranie
    zablokowanym. Treść przychodząca z zewnątrz trafia wtedy przed oczy
    każdego, kto stoi obok maszyny, bez żadnego uwierzytelnienia.
  en: |
    The service keeps up a lasting connection with a notification service on the public
    network and receives through it messages addressed to programs installed on the
    machine. It is what shows notifications and passes their content to the programs they
    concern.

    The mechanism has two traits worth setting side by side. First, the connection is
    lasting, outgoing and made whether or not anybody is working on the machine. Second,
    through that connection come data from outside, addressed to a particular program and
    handled by it.

    What an attacker gains while the item goes unmet: a channel delivering data to the
    machine on an outside party's initiative, alongside the ordinary routes of network
    traffic and with no bearing on what the user is doing. Making use of such a channel
    does, true, take control over a program on the machine's side or over its back end,
    but the channel itself is ready and kept up.

    It counts separately that notifications appear on a locked screen. Content arriving
    from outside then comes before the eyes of anybody standing beside the machine, with
    no authentication at all.

disruption_description:
  pl: |
    To jest zmiana, którą trzeba uzgodnić z osobami pracującymi na maszynie,
    bo dotyka ich pracy codziennie i od pierwszej godziny.

    Po wyłączeniu usługi znikają powiadomienia. Wszystkie, nie tylko te
    uznawane za zbędne: wiadomość w komunikatorze, przypomnienie o spotkaniu,
    informacja o zakończonym zadaniu, ostrzeżenie programu ochronnego,
    monit o ponownym uruchomieniu maszyny.

    Ostatnie dwa przykłady zasługują na uwagę osobną. Powiadomienie
    o zagrożeniu wykrytym przez oprogramowanie ochronne oraz monit o zmianie
    wymagającej ponownego uruchomienia bywają jedynym sposobem, w jaki maszyna
    informuje użytkownika o rzeczach pilnych. Ich utrata nie jest uproszczeniem
    pulpitu, tylko utratą kanału ostrzegania — i tak trzeba to postawić.

    Sprawdzić warto także programy pracujące w zasobniku, które o zdarzeniach
    informują wyłącznie powiadomieniem. Część z nich nie ma innego sposobu
    zwrócenia uwagi użytkownika i po zmianie zdarzenia przejdą niezauważone.

    Kafelki i odznaki pokazujące liczbę nowych elementów przestaną się
    odświeżać. Sama poczta, komunikator i kalendarz działają dalej — zmienia
    się wyłącznie sposób, w jaki informują o nowościach.

    Zmiana wymaga zatrzymania usługi.
  en: |
    This is a change to be agreed with the people working on the machine, since it
    touches their work daily and from the first hour.

    Once the service is off, notifications vanish. All of them, not only those held to be
    needless: a message in a messenger, a reminder of a meeting, word of a finished task,
    a warning from protective software, a prompt to restart the machine.

    The last two examples deserve attention of their own. A notification about a threat
    found by protective software, and a prompt about a change calling for a restart, are
    sometimes the only way the machine tells the user about urgent matters. Losing them
    is not a simplification of the desktop but the loss of a warning channel - and that
    is how it has to be put.

    Programs working in the tray that report events by notification alone are also worth
    checking. Some of them have no other way of drawing the user's attention, and after
    the change their events will pass unnoticed.

    Tiles and badges showing the number of new items will stop refreshing. Mail, the
    messenger and the calendar themselves carry on working - only the way they report
    what is new changes.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Powiadomienia znikają w całości, razem z ostrzeżeniami oprogramowania ochronnego
      - Monit o zmianie wymagającej ponownego uruchomienia maszyny przestaje się pokazywać
      - Program pracujący w zasobniku traci jedyny sposób zwrócenia uwagi użytkownika
      - Poczta, komunikator i kalendarz działają dalej, zmienia się tylko sposób informowania
    en:
      - Notifications vanish entirely, along with warnings from protective software
      - The prompt about a change calling for a restart stops appearing
      - A program working in the tray loses its only way of drawing the user's attention
      - Mail, the messenger and the calendar carry on working, only the way they report changes
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Ostrzeżenia oprogramowania ochronnego docierają do użytkownika wyłącznie powiadomieniem
      - Program branżowy informuje o zdarzeniach pilnych wyłącznie powiadomieniem
      - Praca na stanowisku opiera się na przypomnieniach o spotkaniach i terminach
    en:
      - Warnings from protective software reach the user by notification alone
      - A line-of-business program reports urgent events by notification alone
      - Work at the station rests on reminders about meetings and deadlines
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service takes away every notification at once, warnings from
    # protective software among them.
    Stop-Service -Name 'WpnService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WpnService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WpnService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/design/shell/tiles-and-notifications/windows-push-notification-services--wns--overview

notes:
  pl: |
    Punkt jest w tej paczce jednym z nielicznych, przy których zysk
    bezpieczeństwa jest umiarkowany, a koszt eksploatacyjny wysoki i widoczny
    codziennie. Świadome odpuszczenie go z zapisanym uzasadnieniem jest tu
    wynikiem prawidłowym, nie porażką, i aplikacja ma to ułatwić.

    Przed wyłączeniem usługi warto rozważyć wariant węższy: powiadomienia da
    się ograniczyć zasadami — wyłączyć je na ekranie zablokowanym, zabronić
    ich wybranym programom, zdjąć z nich treść. Rozwiązuje to część problemu
    bez utraty kanału ostrzegania. Reguła tego nie robi i nie udaje, że robi.

    Wyłączenie usługi nie zrywa łączności sieciowej programów. Poczta,
    komunikator i kalendarz dalej sięgają po dane same, tylko nie dostają
    sygnału, że są nowe.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item is among the few in this pack where the gain in security is moderate while
    the cost in daily use is high and plainly visible. Deliberately accepting it with a
    written reason is a proper outcome here rather than a failure, and the application
    should make that easier.

    Before disabling the service a narrower course is worth weighing: notifications can
    be limited by policy - switched off on the locked screen, forbidden to chosen
    programs, stripped of their content. That solves part of the problem without losing
    the warning channel. The rule does not do this and does not pretend to.

    Disabling the service does not cut off programs' network connectivity. Mail, the
    messenger and the calendar go on fetching data themselves, they merely get no signal
    that there is something new.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
