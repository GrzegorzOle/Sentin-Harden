id: win2016-print-rpc-outgoing-protocol-tcp

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Połączenia wychodzące podsystemu druku tylko przez gniazda sieciowe
    en: Outgoing connections of the printing subsystem over network sockets only
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe podsystemowi druku łączyć się z cudzymi serwerami
    wydruku przez gniazdo sieciowe, a nie przez nazwany potok.

    Jest to druga strona tej samej relacji co punkt o połączeniach
    przychodzących. Tam chodziło o to, czym można dobić się do tej maszyny.
    Tutaj o to, czym ta maszyna dobija się do innych — i skutki są innego
    rodzaju, bo tym razem to ona jest stroną, która się przedstawia.

    Połączenie przez nazwany potok jest połączeniem do udostępnienia
    plikowego. Maszyna nawiązując je przedstawia się tak, jak przedstawia
    się przy sięganiu po pliki — a więc zostawia po drugiej stronie ślad
    uwierzytelnienia, którego przy zwykłym poleceniu druku zostawiać nie
    musi.

    Ma to znaczenie, gdy serwer po drugiej stronie nie jest tym, za kogo
    się podaje. Maszyna podstawiona pod nazwę serwera wydruku otrzymuje
    wtedy materiał uwierzytelniający konta, które właśnie drukuje. Jest to
    wzorzec znany i wykorzystywany, a jego szczególna wygoda polega na tym,
    że ofiara niczego nie robi poza wydrukiem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał
    uwierzytelniający konta drukującego, wydobyty przez podstawienie się
    pod serwer wydruku, bez żadnego działania po stronie ofiary poza
    wysłaniem zadania.
  en: |
    The setting has the printing subsystem connect to other print servers through a
    network socket rather than through a named pipe.

    It is the other side of the same relation as the item about incoming
    connections. There the matter was by what one can reach this machine. Here it is
    by what this machine reaches others - and the consequences are of another kind,
    this time it being the side that presents itself.

    A connection through a named pipe is a connection to a file share. Making it,
    the machine presents itself as it does when reaching for files - and so leaves
    at the other end a trace of authentication it need not leave at an ordinary
    print command.

    That matters where the server at the other end is not what it gives itself out
    to be. A machine standing in for a print server's name then receives
    authentication material of the account that is printing. It is a known and used
    pattern, and its particular convenience lies in the victim doing nothing beyond
    printing.

    What an attacker gains while the item goes unmet: authentication material of the
    printing account, drawn out by standing in for a print server, with no act on
    the victim's side beyond sending a job.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, z jakimi serwerami
    wydruku ta maszyna się łączy.

    Jeżeli z żadnym — a tak jest na większości serwerów — wdrożenie nie
    zmienia nic. Punkt dotyczy wyłącznie sytuacji, w której ta maszyna jest
    klientem cudzej kolejki.

    Gdy jest, sprawdzić trzeba drugą stronę. Starszy serwer wydruku albo
    urządzenie wielofunkcyjne z własną obsługą kolejki może nie przyjąć
    połączenia przez gniazdo sieciowe i wtedy wydruk na nim przestanie
    działać. Objaw jest natychmiastowy: zadanie zostaje w kolejce
    i zgłasza błąd.

    Rzecz druga dotyczy zapory po drugiej stronie. Połączenie idzie po
    wdrożeniu innym portem i zapora serwera wydruku może go nie dopuszczać,
    choć sam serwer połączenie by przyjął.

    Wymaga zatrzymania usługi wydruku, więc zadania stojące w kolejce
    zostaną przerwane.

    Czego to nie psuje: drukowania na drukarkach podłączonych lokalnie,
    kolejek udostępnianych z tej maszyny, dostępu do plików, usług.
  en: |
    The class is "needs review", and what has to be checked is which print servers
    this machine connects to.

    If none - and so it is on most servers - the rollout changes nothing. The item
    concerns only the case where this machine is a client of somebody else's queue.

    Where it is, the other end has to be checked. An older print server or a
    multifunction device handling its own queue may not accept a connection over a
    network socket, and then printing on it will stop working. The symptom is
    immediate: the job stays in the queue and reports an error.

    The second thing concerns the firewall at the other end. After the rollout the
    connection goes by another port, and the print server's firewall may not let it
    through, though the server itself would accept the connection.

    Calls for the print service to be stopped, so jobs standing in the queue will be
    broken off.

    What this does not break: printing on locally attached printers, queues shared
    from this machine, access to files, or services.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Starszy serwer wydruku albo urządzenie wielofunkcyjne z własną obsługą kolejki może nie przyjąć połączenia i wydruk na nim przestanie działać
      - Zadanie zostaje wtedy w kolejce i zgłasza błąd, więc objaw jest natychmiastowy
      - Zapora po stronie serwera wydruku może nie dopuszczać nowego portu, choć sam serwer połączenie by przyjął
      - Drukowanie na drukarkach podłączonych lokalnie i kolejki udostępniane z tej maszyny pozostają bez zmian
    en:
      - An older print server or a multifunction device handling its own queue may not accept the connection, and printing on it will stop working
      - The job then stays in the queue and reports an error, so the symptom is immediate
      - The firewall at the print server's end may not let the new port through, though the server itself would accept the connection
      - Printing on locally attached printers and queues shared from this machine stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna drukuje przez starszy serwer wydruku albo urządzenie wielofunkcyjne, które przyjmuje połączenia wyłącznie przez nazwany potok
      - Zapora po stronie serwera wydruku dopuszcza wyłącznie port udostępniania plików i nie da się tego zmienić
    en:
      - The machine prints through an older print server or a multifunction device accepting connections only through a named pipe
      - The firewall at the print server's end lets through only the file sharing port and it cannot be changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means connections over network sockets; one means named pipes.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcUseNamedPipeProtocol'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'RpcUseNamedPipeProtocol'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero means connections over network sockets, one over named pipes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcUseNamedPipeProtocol' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Punkt tworzy parę z regułą o połączeniach przychodzących i obie warto
    pokazywać razem, bo dopiero razem opisują całą relację. Wdrożenie
    jednej bez drugiej zostawia jeden kierunek otwarty.

    Uciążliwość tej pary jest jednak różna i warto to widzieć. Reguła
    o połączeniach przychodzących uderza w maszyny cudze i dlatego wymaga
    świadomego wdrożenia. Ta uderza w tę maszynę i dlatego wystarczy jej
    sprawdzenie — skutek jest widoczny od razu i tutaj, a nie u kogoś po
    drugiej stronie.

    Wydobycie materiału uwierzytelniającego przez podstawienie się pod
    serwer wydruku jest wzorcem, który warto nazwać wprost w opisie skutków.
    Użytkownik, który słyszał o tym, że drukowanie bywa drogą do
    poświadczeń, zobaczy wtedy, o którą dokładnie drogę chodzi.
  en: |
    The item makes a pair with the rule about incoming connections, and both are
    worth showing together, only together describing the whole relation. Rolling out
    one without the other leaves one direction open.

    The disruption of that pair differs all the same, and that is worth seeing. The
    rule about incoming connections strikes at other machines and so calls for a
    planned rollout. This one strikes at this machine and so a review is enough for
    it - the consequence is seen at once and here, not at somebody else's end.

    The drawing out of authentication material by standing in for a print server is
    a pattern worth naming outright in the description of consequences. A user who
    has heard that printing is at times a road to credentials will then see which
    road exactly is meant.
