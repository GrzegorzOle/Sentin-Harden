id: win10-shutdown-on-audit-failure-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Maszyna nie wyłącza się przy niepowodzeniu zapisu inspekcji
    en: The machine does not shut down at a failure to write an entry of audit
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna nie wyłącza się, gdy nie uda się
    zapisać wpisu do dziennika zabezpieczeń.

    Jest to punkt nietypowy, bo wymaga wyłączenia mechanizmu, a nie
    włączenia go. Warto powiedzieć wprost, na czym polega rachunek.

    Mechanizm ten powstał dla maszyn, na których kompletność zapisu
    inspekcji jest ważniejsza od ciągłości pracy. Gdy dziennik nie
    przyjmuje wpisu, system zatrzymuje się natychmiast, żeby nie działać
    bez zapisu. W założeniu jest to postawa najostrożniejsza.

    W praktyce na stanowisku roboczym daje to skutek odwrotny do
    zamierzonego. Zatrzymanie maszyny jest łatwe do wywołania: wystarczy
    zapełnić dziennik zabezpieczeń zdarzeniami, co nie wymaga żadnych
    uprawnień szczególnych. Mechanizm pomyślany jako ochrona staje się
    wygodnym sposobem na wyłączenie maszyny.

    Odnotowuję, że wyłączenie tego zachowania nie zmniejsza ilości
    zapisywanych zdarzeń. Dziennik działa tak samo — zmienia się tylko
    reakcja na sytuację, w której zapis się nie powiedzie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania maszyny przez zapełnienie dziennika zdarzeniami.
  en: |
    The setting brings it about that the machine does not shut down when an entry cannot be written into the
    journal of security.

    It is an item out of the common, calling for a mechanism to be switched off and not on. It is worth saying
    outright wherein the reckoning lies.

    That mechanism came about for machines upon which the wholeness of the record of audit weighs more than the
    unbrokenness of work. When the journal takes no entry, the system halts at once, so as not to work without a
    record. In its design it is the most cautious of stands.

    In practice upon a working station it gives the opposite of what was meant. The halting of the machine is
    easily brought about: it is enough to fill the journal of security with happenings, which calls for no rights
    out of the ordinary. A mechanism thought out as a guarding becomes a handy way of switching the machine off.

    I set down that the switching off of that behaviour lessens not the number of happenings written. The journal
    works the same - only the answer changes to the case in which a writing does not come through.

    What an attacker gains while the item goes unmet: the halting of the machine by a filling of the journal with
    happenings.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość domyślna na stanowisku roboczym odpowiada już wymaganiu, więc
    zmiana jest zwykle zapisem stanu. Wpis inny oznacza, że ktoś
    mechanizm włączył świadomie.

    Odnotowuję właśnie ten przypadek jako jedyny wart spojrzenia. Maszyna,
    na której kompletność zapisu inspekcji jest wymogiem — na przykład
    ze względu na obowiązek zewnętrzny — może mieć to ustawienie włączone
    celowo. Wyłączenie go jest wtedy decyzją do podjęcia świadomie, a nie
    poprawką porządkową.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, pracy
    programów, logowania, drukowania.
  en: |
    The class is "no disruption".

    The default value upon a working station already answers the requirement, so the change is commonly a setting
    down of a state. Another entry means somebody switched the mechanism on knowingly.

    I set down that very case as the one worth a look. A machine upon which the wholeness of the record of audit
    is a requirement - for the sake of some outward duty, say - may hold this setting on by design. The switching
    of it off is then a decision to be taken knowingly and no putting right of mere order.

    The consequence shows at once, with no restart.

    What this does not break: the writing of happenings, the reading of the journal, the work of programs, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Maszyna, na której mechanizm włączono celowo ze względu na obowiązek zewnętrzny, straci gwarancję kompletności zapisu
      - Wyłączenie jest wtedy decyzją do podjęcia świadomie, a nie poprawką porządkową
      - Wartość domyślna na stanowisku roboczym odpowiada już wymaganiu, więc zmiana jest tam zapisem stanu
      - Wyłączenie nie zmniejsza ilości zapisywanych zdarzeń, zmienia się tylko reakcja na niepowodzenie zapisu
      - Zapisywanie zdarzeń, odczyt dziennika, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - A machine upon which the mechanism was switched on by design for an outward duty will lose the warrant of a whole record
      - The switching off is then a decision to be taken knowingly and no putting right of mere order
      - The default value upon a working station already answers the requirement, so there the change is a setting down of a state
      - The switching off lessens not the number of happenings written, only the answer to a failed writing changes
      - The writing of happenings, the reading of the journal, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie obowiązuje wymóg zewnętrzny nakazujący zatrzymanie pracy przy niemożności zapisania inspekcji
    en:
      - Upon the machine holds an outward requirement bidding work be halted where an entry of audit cannot be written
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item calls for this setting off, so nought is what is looked for here -
      # unusually for a matter of security, the guarding is the want of a reaction.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'CrashOnAuditFail'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'CrashOnAuditFail'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nought is written outright rather than the value being taken away. A value
    # absent falls back to the default, and what is meant here is a settled state.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'CrashOnAuditFail' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/audit-shut-down-system-immediately-if-unable-to-log-security-audits

notes:
  pl: |
    Reguła jest w całym zbiorze jedną z nielicznych, które każą coś
    wyłączyć. Warto, żeby aplikacja pokazała rachunek wprost, bo bez niego
    wygląda to na osłabienie zabezpieczenia.

    Argument wart postawienia jest taki: mechanizm chroniący kompletność
    zapisu daje napastnikowi przycisk wyłączający maszynę, i to przycisk
    dostępny bez żadnych uprawnień szczególnych. Wystarczy zapełnić
    dziennik. Na stanowisku roboczym wymiana ciągłości pracy na
    kompletność zapisu jest wymianą niekorzystną.

    Odnotowuję, że na maszynie objętej obowiązkiem zewnętrznym rachunek
    może wyglądać inaczej i decyzja należy wtedy do właściciela systemu.
    Jest to dokładnie ten przypadek, dla którego aplikacja pozwala zapisać
    świadome odpuszczenie punktu wraz z uzasadnieniem.
  en: |
    The rule is one of the few in the whole set that bid something be switched off. It is well that the
    application show the reckoning outright, without which it looks like a weakening of a guarding.

    The argument worth putting is this: a mechanism guarding the wholeness of a record gives an attacker a button
    that switches the machine off, and a button open to them without any rights out of the ordinary. It is enough
    to fill the journal. Upon a working station the trading of the unbrokenness of work for the wholeness of a
    record is a trade at a loss.

    I set down that upon a machine held by an outward duty the reckoning may look otherwise, and the decision then
    belongs to the system's owner. It is just that case for which the application lets a knowing letting go of an
    item be written down together with its ground.
