id: win2016-bitlocker-standard-user-pin-change-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Zmiana kodu startowego zastrzeżona dla administratorów
    en: Changing the startup code reserved to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania użytkownikom bez uprawnień administracyjnych
    zmieniać kod startowy odblokowujący dysk systemowy.

    Domyślnie zmiana kodu jest czynnością dostępną każdemu zalogowanemu
    użytkownikowi maszyny. Zamysł był praktyczny: kod ma się dać zmienić bez
    wzywania administratora.

    Skutkiem jest jednak przesunięcie granicy, którego nikt nie zamierzał.
    Kod startowy chroni dysk przed kimś, kto ma maszynę w rękach —
    a więc przed sytuacją, w której napastnik nie ma jeszcze dostępu do
    systemu. Użytkownik, który może ten kod zmienić, może go też ustawić na
    własny i zabrać maszynę ze sobą; ochrona przestaje wtedy działać
    przeciwko niemu.

    Punkt przywraca właściwą granicę. Kod odblokowujący nośnik należy do
    tego, kto odpowiada za maszynę, nie do tego, kto na niej pracuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    ustawienia własnego kodu startowego z poziomu konta zwykłego użytkownika,
    a więc uczynienia zaszyfrowanego dysku czytelnym dla siebie poza tą
    maszyną.
  en: |
    The setting forbids users without administrative rights to change the startup code unlocking
    the system drive.

    By default changing the code is an act open to every user signed in on the machine. The
    intent was a practical one: the code should be changeable without calling an administrator.

    The upshot, though, is a shift of a boundary nobody meant. The startup code guards the drive
    against somebody who has the machine in their hands - which is to say against a situation in
    which the attacker has no access to the system yet. A user who can change that code can also
    set it to one of their own and take the machine with them; the guard then ceases to work
    against them.

    The item restores the right boundary. The code unlocking a medium belongs to whoever answers
    for the machine, not to whoever works on it.

    What an attacker gains while the item goes unmet: the chance to set a startup code of their
    own from an ordinary user's account, and so to make the encrypted drive readable to
    themselves away from this machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, kto dziś ten kod
    zmienia.

    Na serwerze uciążliwość jest zwykle żadna. Kont zwykłych użytkowników
    logujących się lokalnie nie ma albo jest ich niewiele, a kod startowy
    i tak ustawia ten, kto maszynę stawiał.

    Rzecz do sprawdzenia dotyczy maszyn obsługiwanych przez konta o mniejszych
    uprawnieniach — na przykład operatorów kopii zapasowych albo obsługi
    pierwszego poziomu. Jeżeli ktoś taki zmieniał kod dotąd, po zmianie
    zobaczy odmowę i będzie musiał zgłosić sprawę wyżej.

    Skutek ten jest odczuwalny wyłącznie wtedy, gdy trzeba kod zmienić —
    a więc rzadko, zwykle po odejściu kogoś, kto go znał. Warto wtedy mieć
    ustaloną drogę zgłoszenia, bo inaczej kod pozostaje ten sam mimo powodu
    do zmiany.

    Czego to nie psuje: odblokowywania dysku, logowania, pracy systemu,
    usług, sieci. Zmiana dotyczy wyłącznie czynności zmiany kodu.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns who changes that code today.

    On a server the disruption is as a rule none. Accounts of ordinary users signing in locally
    are not there or are few, and the startup code is set anyway by whoever set the machine up.

    The thing to be reviewed concerns machines attended by accounts of lesser rights - backup
    operators, say, or first-level attendance. If somebody such changed the code until now, after
    the change they will see a refusal and will have to carry the matter higher.

    That consequence is felt only where the code has to be changed - which is to say seldom, as a
    rule after the departure of somebody who knew it. It is worth having then a settled road of
    reporting, else the code stays the same despite a reason to change it.

    What this does not break: the unlocking of the drive, signing in, the system's working,
    services, or the network. The change concerns solely the act of changing the code.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - boot-and-firmware
  what_breaks:
    pl:
      - Konto bez uprawnień administracyjnych, które zmieniało dotąd kod startowy, zobaczy odmowę i musi zgłosić sprawę wyżej
      - Skutek jest odczuwalny wyłącznie w chwili, gdy kod trzeba zmienić, a więc rzadko i zwykle po odejściu kogoś, kto go znał
      - Bez ustalonej drogi zgłoszenia kod pozostaje ten sam mimo powodu do zmiany
      - Odblokowywanie dysku, logowanie, praca systemu i usługi pozostają bez zmian
    en:
      - An account without administrative rights that changed the startup code until now will see a refusal and must carry the matter higher
      - The consequence is felt only at the moment the code has to be changed, which is to say seldom and as a rule after the departure of somebody who knew it
      - Without a settled road of reporting the code stays the same despite a reason to change it
      - The unlocking of the drive, signing in, the system's working and services stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Kod startowy zmienia dziś obsługa pierwszego poziomu bez uprawnień administracyjnych i nie ustalono drogi zastępczej
      - Maszyna jest obsługiwana wyłącznie przez konto operatora kopii zapasowych, które odpowiada także za dostęp przy starcie
    en:
      - The startup code is today changed by first-level attendance without administrative rights and no road in its stead has been settled
      - The machine is attended solely by a backup operator's account, which answers also for access at the start
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'DisallowStandardUserPINReset'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'DisallowStandardUserPINReset'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisallowStandardUserPINReset' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest w bloku czwarty i przenosi rozmowę z siły kodu na to, do kogo
    ten kod należy. Trzy poprzednie pytały, jak trudno go odgadnąć; ten pyta,
    kto może go podmienić — a podmiana jest drogą tańszą niż odgadywanie
    i bywa pomijana.

    Warto pokazać ten punkt w parze z regułą o dodatkowym uwierzytelnieniu,
    bo bez niego ta reguła traci sens. Wymóg kodu startowego, którego każdy
    użytkownik maszyny może sobie ustawić, chroni przed kimś z zewnątrz
    i przed nikim więcej.

    Kategoria średnia jest tu postawiona świadomie mimo poważnej treści.
    Wykorzystanie wymaga konta na maszynie oraz dostępu fizycznego do niej —
    dwóch warunków naraz, z których każdy sam w sobie jest już zdarzeniem.
    Punkt ogranicza rozwinięcie sytuacji, a nie otwiera pierwszą drogę
    wejścia, i to jest treść kryterium tej kategorii.
  en: |
    The item is the fourth in the block and carries the conversation over from the code's
    strength to whom that code belongs. The three before it asked how hard it is to guess; this
    one asks who can exchange it - and an exchange is a cheaper road than guessing and is at
    times passed over.

    The item is worth showing paired with the rule about additional authentication, without it
    that rule losing its sense. A requirement of a startup code that every user of the machine
    can set for themselves guards against somebody from outside and against nobody else.

    The medium category is set here knowingly despite the grave substance. Its use calls for an
    account on the machine and physical access to it - two conditions at once, each of which is
    by itself already an event. The item narrows a situation's unfolding rather than opening a
    first road in, and that is the substance of this category's criterion.
