id: win11-rpc-locator-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa odnajdywania punktów zdalnego wywołania procedur wyłączona
    en: The locator service for remote procedure call endpoints disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa prowadzi spis nazw usług sieciowych zgłaszanych przez programy
    i pozwala innym maszynom odnaleźć po nazwie punkt, pod którym taka usługa
    odpowiada. Jest to mechanizm z czasów, gdy katalog sieciowy jeszcze nie
    istniał, a maszyny musiały odnajdywać się same.

    Dzisiejsze wersje systemu nie korzystają z niego wcale: odnajdywanie usług
    sieciowych opiera się na katalogu, a wywołania zdalne trafiają wprost pod
    adres maszyny. Usługa pozostaje w systemie dla zgodności wstecz
    i standardowo nie jest uruchamiana.

    Kategoria ryzyka jest z tego powodu niska i podnoszenie jej byłoby
    nieuczciwe. Usługa zwykle nie działa, a gdy działa, przyjmuje zapytania
    o nazwy, a nie polecenia.

    Wartość punktu polega na czymś innym. Usługa uruchomiona na maszynie,
    na której nic jej nie potrzebuje, jest sygnałem: albo ktoś włączył ją
    ręcznie, albo zrobił to program instalujący starsze składniki. Jedno
    i drugie warto wiedzieć, a reguła jest tanim sposobem, żeby się o tym
    dowiedzieć.
  en: |
    The service keeps a register of the names of network services reported by programs
    and lets other machines find by name the endpoint at which such a service answers. It
    is a mechanism from the days before a network directory existed, when machines had to
    find one another themselves.

    Present-day versions of the system do not use it at all: finding network services
    rests on the directory, and remote calls go straight to a machine's address. The
    service remains in the system for backward compatibility and is not started as a
    matter of course.

    The risk category is low for that reason and raising it would be dishonest. The
    service usually does not run, and when it does it takes questions about names, not
    commands.

    The item's worth lies elsewhere. A service running on a machine where nothing needs
    it is a signal: either somebody switched it on by hand, or a program installing older
    components did. Both are worth knowing, and the rule is a cheap way of finding out.

disruption_description:
  pl: |
    Sprawdzenia wymaga niewiele, bo zastosowań na stacji roboczej praktycznie
    nie ma.

    Standardowo usługa nie jest uruchamiana i zmiana niczego nie dotyka.
    Wynik zgodny jest tu regułą, a nie wyjątkiem.

    Skutek pojawia się wyłącznie tam, gdzie działa program starszego rodzaju
    korzystający z tego spisu do odnajdywania swoich składników na innych
    maszynach. Są to rozwiązania sprzed wielu lat, spotykane w systemach
    branżowych, które nigdy nie zostały przepisane. Objawem będzie niemożność
    odnalezienia składnika po nazwie — zwykle zgłaszana jako błąd połączenia,
    a nie jako brak nazwy, co utrudnia rozpoznanie przyczyny.

    Zwykłe wywołania zdalne między maszynami nie korzystają z tej usługi
    i działają dalej bez żadnej zmiany. Dotyczy to także narzędzi zarządzania
    i konsol administracyjnych.

    Zmiana wymaga zatrzymania usługi.
  en: |
    Little needs checking, since at a workstation uses are practically nonexistent.

    As a matter of course the service is not started and the change touches nothing. A
    compliant result is the rule here rather than the exception.

    An effect appears only where a program of an older kind runs that uses this register
    to find its components on other machines. These are solutions from many years back,
    met with in line-of-business systems never rewritten. The symptom will be an
    inability to find a component by name - usually reported as a connection error rather
    than a missing name, which makes the cause harder to recognise.

    Ordinary remote calls between machines do not use this service and carry on with no
    change at all. That covers management tools and administrative consoles too.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Program starszego rodzaju nie odnajdzie swojego składnika po nazwie na innej maszynie
      - Błąd zgłaszany jest jako brak połączenia, a nie jako brak nazwy w spisie
      - Zwykłe wywołania zdalne między maszynami działają dalej bez żadnej zmiany
      - Narzędzia zarządzania i konsole administracyjne nie zauważają zmiany
    en:
      - A program of an older kind will not find its component by name on another machine
      - The error is reported as a missing connection rather than a missing name in the register
      - Ordinary remote calls between machines carry on with no change at all
      - Management tools and administrative consoles notice no change
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - System branżowy sprzed lat odnajduje swoje składniki przez ten spis nazw
      - Maszyna pełni rolę spisu nazw dla starszego rozwiązania w sieci
    en:
      - A line-of-business system from years back finds its components through this register
      - The machine acts as the register of names for an older solution on the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RpcLocator' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RpcLocator' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RpcLocator' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/the-rpc-name-service-database

notes:
  pl: |
    Punktu nie należy mylić z podstawową usługą zdalnego wywoływania procedur,
    od której zależy działanie systemu. Tamtej nie wolno wyłączać i nie ma
    w tej paczce reguły, która by to proponowała. Ta dotyczy wyłącznie spisu
    nazw, czyli składnika pomocniczego.

    Różnica w nazwach obu usług jest niewielka, a skutki ich wyłączenia
    nieporównywalne. Jest to najczęstsze nieporozumienie przy tym punkcie
    i dlatego reguła mówi o tym wprost.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item should not be confused with the basic service for calling procedures
    remotely, on which the system's working depends. That one must not be disabled and no
    rule in this pack proposes it. This one concerns the register of names alone, that is
    a helper component.

    The difference between the two services' names is slight, while the effects of
    disabling them are beyond comparison. That is the commonest misunderstanding about
    this item, and so the rule says it outright.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
