id: win2025-safe-dll-search-mode

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Bezpieczna kolejność wyszukiwania bibliotek włączona
    en: Safe DLL search order enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zmienia kolejność, w jakiej system szuka biblioteki
    żądanej przez program, tak aby katalogi systemowe przeszukiwane były
    przed katalogiem bieżącym.

    Program, który prosi o bibliotekę po nazwie, a nie po pełnej
    ścieżce, zdaje się na tę kolejność. Bez bezpiecznego trybu katalog
    bieżący jest przeszukiwany wcześnie — a katalogiem bieżącym bywa
    miejsce, w którym leżą cudze pliki.

    Stąd bierze się podstawienie biblioteki. Napastnik umieszcza plik
    o nazwie, której program będzie szukał, w katalogu, z którego ten
    program zostanie uruchomiony. Program ładuje bibliotekę napastnika,
    sądząc, że ładuje systemową, i wykonuje jego kod z własnymi
    uprawnieniami. Nie ma tu łamania zabezpieczeń — jest wyścig
    o kolejność.

    Na serwerze rzecz waży więcej z powodu tego, czym są katalogi
    dostępne do zapisu. Serwer plików ma katalogi, do których zapisuje
    wiele osób. Serwer aplikacyjny ma katalogi wymiany, katalogi
    przetwarzania i miejsca, w których lądują pliki wgrywane przez
    użytkowników. Uruchomienie czegokolwiek z takiego katalogu — choćby
    narzędzia diagnostycznego przez administratora — odbywa się wtedy
    w sąsiedztwie plików podłożonych przez kogoś innego.

    Punkt jest tani i trzeba to powiedzieć: zmienia kolejność
    przeszukiwania, a nie zbiór dostępnych bibliotek. Program, który
    wskazuje bibliotekę pełną ścieżką, nie zauważy niczego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podstawienia własnej biblioteki programowi uruchamianemu
    z katalogu, do którego wolno mu zapisywać, i wykonania swojego kodu
    z uprawnieniami tego programu.
  en: |
    The setting changes the order in which the system seeks a library a program asks for, so that
    the system's catalogues are searched before the present catalogue.

    A program asking for a library by name and not by a full path rests upon that order. Without
    the safe mode the present catalogue is searched early - and the present catalogue is at times
    a place where another's files lie.

    Thence comes the putting of a library in the way. An attacker sets a file bearing the name
    the program will seek in the catalogue that program will be started from. The program loads
    the attacker's library, holding that it loads the system's, and runs their code with its own
    rights. There is here no breaking of a guard - there is a race for order.

    On a server the matter weighs more by reason of what the catalogues open to writing are. A
    file server holds catalogues many people write into. An application server holds catalogues
    of exchange, catalogues of working and places where files sent up by users land. The starting
    of anything from such a catalogue - a tool of diagnosis run by an administrator, even - then
    happens in the neighbourhood of files laid by somebody else.

    The item is cheap and that must be said: it changes the order of the search and not the set
    of libraries to be had. A program naming its library by a full path will mark nothing.

    What an attacker gains while the item goes unmet: the means of putting a library of their own
    in the way of a program started from a catalogue they may write into, and of running their
    code with that program's rights.

disruption_description:
  pl: |
    Sprawdzenia wymaga tu jedna rzecz i nie jest nią sam skutek zmiany:
    wartość czyta menedżer sesji przy starcie, więc zmiana zaczyna
    działać dopiero po ponownym uruchomieniu maszyny.

    Podniosłem klasę względem paczki stanowiska roboczego wyłącznie
    z tego powodu. Stanowisko restartuje się samo co kilka dni. Serwer
    pracuje miesiącami, a jego restart jest zdarzeniem planowanym.
    Między zapisaniem wartości a jej zadziałaniem raport pokazywałby
    stan zgodny, którego system jeszcze nie egzekwuje — i to wystarcza,
    żeby ta zmiana nie szła hurtem.

    Skutek samej zmiany jest natomiast znikomy. Bezpieczna kolejność
    jest stanem domyślnym od wielu wersji systemu, a programy pisane
    zgodnie z zasadami tego systemu wskazują biblioteki pełną ścieżką.

    Przypadkiem, który wolno rozważyć, jest bardzo stare oprogramowanie
    zakładające, że biblioteka leżąca obok pliku wykonywalnego zostanie
    znaleziona przed systemową — zwykle po to, żeby dołożyć własną
    wersję wspólnej biblioteki. Wdrożenie takie jest błędne samo
    w sobie, ale spotyka się je w oprogramowaniu przemysłowym.

    Objawem byłby wtedy program, który przestaje się uruchamiać albo
    zgłasza niezgodną wersję biblioteki — i to od razu po restarcie,
    a nie z opóźnieniem.

    Zmiana nie dotyczy tego, jakie biblioteki są dostępne, ani
    uprawnień do katalogów. Dotyczy wyłącznie kolejności szukania.
  en: |
    One thing needs checking here and it is not the effect of the change itself: the session
    manager reads the value at its starting, so the change begins working only after a fresh
    start of the machine.

    I raised the class against the working station's pack for that reason alone. A station
    restarts of itself every few days. A server works for months and its restart is a planned
    happening. Between the writing of the value and its working, a report would show a compliant
    state the system does not yet enforce - and that suffices for this change not to go in bulk.

    The effect of the change itself is slight. The safe order has been the default state for many
    versions of the system, and programs written by this system's rules name their libraries by a
    full path.

    A case that may be weighed is very old software holding that a library lying beside the
    executable file will be found before the system's - usually so as to add a version of its own
    of a shared library. Such a rollout is faulty in itself, but it is met with in industrial
    software.

    The symptom would then be a program that stops starting or reports a library of an unfitting
    version - and that at once after the restart rather than with a delay.

    The change does not bear on which libraries are to be had, or on the rights to catalogues. It
    bears on the order of seeking alone.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Bardzo stare oprogramowanie dokładające własną wersję wspólnej biblioteki obok pliku wykonywalnego może przestać startować
      - Zmiana zaczyna działać dopiero po ponownym uruchomieniu maszyny
      - Zbiór dostępnych bibliotek i uprawnienia do katalogów pozostają bez zmiany
      - Program wskazujący bibliotekę pełną ścieżką nie zauważy niczego
    en:
      - Very old software adding a version of its own of a shared library beside the executable may stop starting
      - The change begins working only after a fresh start of the machine
      - The set of libraries to be had and the rights to catalogues stay unchanged
      - A program naming its library by a full path will mark nothing
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje oprogramowanie zakładające, że biblioteka obok pliku wykonywalnego zostanie znaleziona przed systemową
    en:
      - Software holding that a library beside the executable will be found before the system's works on the server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
      $name = 'SafeDllSearchMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    $name = 'SafeDllSearchMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    Set-ItemProperty -Path $path -Name 'SafeDllSearchMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/dlls/dynamic-link-library-search-order

notes:
  pl: |
    Punkt zmienia kolejność przeszukiwania, a nie zbiór dostępnych
    bibliotek. Program wskazujący bibliotekę pełną ścieżką nie zauważy
    niczego.

    Klasę podniosłem względem paczki stanowiska roboczego z powodu
    restartu, a nie skutku. Na serwerze zmiana wchodząca w życie dopiero
    po ponownym uruchomieniu nie należy do trybu zbiorczego.

    Na serwerze waży sąsiedztwo katalogów zapisywalnych: katalogi
    wymiany, katalogi przetwarzania i miejsca, w których lądują pliki
    wgrywane przez użytkowników.
  en: |
    The item changes the order of the search and not the set of libraries to be had. A program
    naming its library by a full path will mark nothing.

    I raised the class against the working station's pack by reason of the restart and not of the
    effect. On a server a change coming into force only after a fresh start does not belong in
    the bulk mode.

    On a server what weighs is the neighbourhood of catalogues open to writing: catalogues of
    exchange, catalogues of working and the places where files sent up by users land.
