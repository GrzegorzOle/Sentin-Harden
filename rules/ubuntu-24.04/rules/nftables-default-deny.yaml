id: ubuntu2404-nftables-default-deny

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 4.3.8
  section: Host Based Firewall > Configure nftables
  title:
    pl: Domyślna polityka nftables odrzuca ruch
    en: Ensure nftables default deny firewall policy
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Polityka łańcucha bazowego decyduje o pakiecie, do którego nie pasuje
    żadna reguła. Standardowy /etc/nftables.conf w Ubuntu ma politykę accept
    we wszystkich łańcuchach, więc przepuszcza cały ruch, na który nikt nie
    napisał reguły.

    Punkt wymaga polityki drop w łańcuchach bazowych input, forward
    i output.
  en: |
    The policy of a base chain decides about a packet that matches no rule.
    The standard /etc/nftables.conf in Ubuntu has the accept policy in all
    chains, so it lets through all traffic nobody wrote a rule for.

    The item requires the drop policy in the input, forward and output base
    chains.

disruption_description:
  pl: |
    Polityka drop bez reguł zezwalających przerywa ruch, na który nie ma
    reguły: w input także SSH, a w output DNS, aktualizacje apt
    i synchronizację czasu. Przed zmianą trzeba dodać reguły dla
    potrzebnego ruchu i dla nawiązanych połączeń (punkt 4.3.7) i sprawdzić
    je na serwerze z dostępem lokalnym.
  en: |
    The drop policy without allow rules interrupts traffic there is no rule
    for: in input also SSH, and in output DNS, apt updates and time
    synchronisation. Before the change, rules for the needed traffic and for
    established connections (item 4.3.7) have to be added and tested on a
    server with local access.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Połączenia SSH i inne usługi sieciowe serwera bez reguły accept w łańcuchu input
      - Rozwiązywanie nazw DNS, aktualizacje apt i synchronizacja czasu bez reguły accept w łańcuchu output
      - Kontenery i maszyny wirtualne za mostkiem sieciowym bez reguł w łańcuchu forward
    en:
      - SSH connections and other network services of the server with no accept rule in the input chain
      - DNS name resolution, apt updates and time synchronisation with no accept rule in the output chain
      - Containers and virtual machines behind a network bridge with no rules in the forward chain
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zmiana przez połączenie zdalne bez przetestowanych reguł accept i bez dostępu awaryjnego
    en:
      - A change over a remote connection without tested accept rules and without emergency access
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then echo CHECK_ERROR; exit 0; fi
    fw_st() {
      e=$(systemctl is-enabled "$1" 2>/dev/null) || true
      a=$(systemctl is-active "$1" 2>/dev/null) || true
      echo "${e:-none}/${a:-unknown}"
    }
    fw_used() { case "$1" in enabled/*|enabled-runtime/*|*/active|*/activating|*/reloading) return 0 ;; esac; return 1; }
    ufw_on() { [ -x /usr/sbin/ufw ] && grep -qsx 'ENABLED=yes' /etc/ufw/ufw.conf; }
    fwmode() {
      m=""
      if ufw_on; then m="$m,ufw"; fi
      if fw_used "$(fw_st nftables.service)"; then m="$m,nftables"; fi
      if fw_used "$(fw_st netfilter-persistent.service)"; then m="$m,iptables"; fi
      m=${m#,}
      case "$m" in "") echo none ;; *,*) echo "multiple:$m" ;; *) echo "$m" ;; esac
    }
    case "$(fwmode)" in nftables|multiple:*nftables*) ;; *) echo NOT_APPLICABLE; exit 0 ;; esac
    command -v nft >/dev/null 2>&1 || { echo NOT_INSTALLED; exit 0; }
    rs=$(nft list ruleset 2>/dev/null) || { echo CHECK_ERROR; exit 0; }
    hp=$(printf '%s\n' "$rs" | sed -nE 's/.*type filter hook (input|forward|output) .*policy (accept|drop);.*/\1 \2/p')
    # One drop policy per hook is enough: accept in one base chain does not end the others.
    ok=""; bad=""
    for h in input forward output; do
      if printf '%s\n' "$hp" | grep -qx "$h drop"; then ok="$ok,$h=drop"
      elif printf '%s\n' "$hp" | grep -q "^$h "; then bad="$bad,$h=accept"
      else bad="$bad,$h=missing"; fi
    done
    if [ -z "$bad" ]; then echo "OK:${ok#,}"; else echo "NOT_OK:${bad#,}"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
  - https://www.netfilter.org/projects/nftables/manpage.html
  - https://manpages.ubuntu.com/manpages/noble/man8/nft.8.html
  - https://documentation.ubuntu.com/server/how-to/security/firewalls/

notes:
  pl: |
    Punkty 4.3 dotyczą serwera, na którym w użyciu jest nftables, czyli
    nftables.service jest włączona lub uruchomiona. W pozostałych
    przypadkach, także gdy nie działa żadne narzędzie zapory, sprawdzenie
    zwraca NOT_APPLICABLE, a naprawa odmawia. Wybór narzędzia ocenia punkt
    4.1.1, który przy braku zapory włącza ufw.

    Reguła tylko sprawdza stan: zestaw reguł zapory projektuje
    administrator, a jego automatyczna zmiana na zdalnym serwerze grozi
    odcięciem dostępu. Reguły zapisuje się w /etc/nftables.conf, który
    nftables.service wczytuje przy starcie, i wczytuje poleceniem systemctl
    reload nftables. Sprawdzenie odczytuje bieżący zestaw reguł poleceniem
    nft list ruleset, które wymaga uprawnień roota. Politykę ustawia się w definicji łańcucha, np.
    type filter hook input priority 0; policy drop;.

    Sprawdzenie wymaga, żeby dla każdego z haków input, forward i output
    istniał co najmniej jeden łańcuch bazowy typu filter z polityką drop.
    Jeden wystarczy, bo accept w jednym łańcuchu bazowym nie kończy
    sprawdzania w pozostałych łańcuchach tego samego haka, a drop kończy.
    Wynik podaje politykę każdego haka albo missing, gdy go brakuje.
    Sprawdzenie bierze pod uwagę każdą tabelę, także tabele tworzone przez
    iptables-nft dla ufw albo Dockera, więc warto sprawdzić, czy to własne
    reguły organizacji. Włączony obok nftables ufw wyłącza punkt 4.3.2.
  en: |
    The items in 4.3 concern a server where nftables is in use, that is
    nftables.service is enabled or running. In the other cases, also when no
    firewall tool runs, the check returns NOT_APPLICABLE and the remediation
    refuses. The choice of the tool is assessed by item 4.1.1, which turns
    on ufw when there is no firewall.

    The rule only checks the state: the firewall ruleset is designed by
    the administrator, and changing it automatically on a remote server
    risks cutting off access. The rules are written to /etc/nftables.conf,
    which nftables.service loads at start, and loaded with systemctl reload
    nftables. The check reads the current ruleset with nft list ruleset,
    which needs root privileges. The policy is set in the chain definition, for
    example type filter hook input priority 0; policy drop;.

    The check requires at least one filter base chain with the drop policy
    for each of the input, forward and output hooks. One is enough, because
    accept in one base chain does not end the evaluation in the other chains
    of the same hook, while drop does. The result gives the policy of each
    hook, or missing when there is none. The check takes every table into account, also the tables that
    iptables-nft creates for ufw or Docker, so it is worth checking that
    these are the organization's own rules. Item 4.3.2 turns off ufw
    enabled next to nftables.
