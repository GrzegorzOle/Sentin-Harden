id: win2025-driver-not-found-report-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zgłaszanie braku sterownika do producenta wyłączone
    en: Reporting a missing driver to the maker switched off
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza wysyłanie zgłoszenia, gdy do podłączonego urządzenia nie
    znalazł się sterownik. Zgłoszenie takie niesie identyfikator sprzętu
    i trafia do mechanizmu raportowania błędów.

    Kategoria niska. Zgłoszenie jest wąskie — opisuje jedno urządzenie i
    jedno niepowodzenie — więc sama jego treść nie jest tu problemem.

    Rzeczą wartą uwagi jest natomiast chwila, w której powstaje. Serwer
    zgłaszający brak sterownika to serwer, do którego właśnie podłączono
    coś, czego on nie zna. Na maszynie produkcyjnej jest to zdarzenie
    rzadkie i mówiące: albo trwa wymiana sprzętu, albo ktoś wpiął nośnik,
    albo podłączono urządzenie, którego w tym miejscu być nie powinno.
    Każda z tych możliwości jest sprawą wewnętrzną organizacji i żadna
    z nich nie zyskuje na tym, że przy okazji wychodzi zapytanie na
    zewnątrz.

    Nie nazwę tego obroną przed atakiem, bo nią nie jest. Jest to spójność:
    skoro serwer ma nie rozmawiać z internetem poza ustalonymi drogami, to
    także wtedy, gdy zdarzy mu się coś nietypowego. Wyjątki robione „bo to
    drobiazg" są dokładnie tym, przez co lista wyjątków przestaje być
    znana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Zapisuję to jako porządek, nie jako obronę.
  en: |
    The item switches off the sending of a report when no driver was found
    for a connected device. Such a report carries the hardware's identifier
    and goes to the error-reporting mechanism.

    The category is low. The report is narrow - it describes one device and
    one failure - so its content is not the problem here.

    What is worth attention is the moment at which it comes into being. A
    server reporting a missing driver is a server to which something it does
    not know has just been connected. On a production machine that is a rare
    and telling event: either hardware is being replaced, or somebody has
    plugged in a medium, or a device has been attached that should not be in
    this place. Each of these possibilities is the organisation's internal
    business, and none of them gains from a query going outwards alongside.

    I will not call this a defence against an attack, because it is not. It
    is consistency: if a server is not to talk to the internet outside
    settled routes, then that holds also when something unusual happens to
    it. Exceptions made "because it is a trifle" are exactly what makes a
    list of exceptions stop being known.

    What an attacker gains while the item goes unmet: nothing directly. I
    record this as good order rather than as a defence.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i uzasadnienie jest tu proste, bo ten
    mechanizm nie bierze udziału w niczym, co działa.

    Wyłączamy zgłoszenie o niepowodzeniu, a nie próbę znalezienia
    sterownika. Maszyna nadal szuka sterownika wszystkimi drogami, którymi
    szukała: w zasobach wbudowanych, w mechanizmie aktualizacji, w tym, co
    administrator wskaże ręcznie. Zmienia się wyłącznie to, że po
    niepowodzeniu nie powstaje zgłoszenie.

    Urządzenie, do którego nie ma sterownika, nie zadziała po tej zmianie
    ani lepiej, ani gorzej. Nie zadziała tak samo — a administrator dowie
    się o tym z tego samego miejsca co dotąd, czyli z listy urządzeń
    i z dziennika zdarzeń.

    Strata, jaką potrafię wskazać, jest po stronie producenta, nie
    użytkownika: to zgłoszenia pomagają mu zauważyć, że jakiegoś sterownika
    brakuje wielu ludziom. Jest to argument prawdziwy i wolę go zapisać,
    niż udawać, że koszt jest zerowy. Na pojedynczym serwerze produkcyjnym
    nie równoważy on jednak zasady o niewysyłaniu niczego poza ustalonymi
    drogami.

    Bez restartu, niewidoczne w codziennej pracy, natychmiast odwracalne,
    wolno zastosować hurtem.
  en: |
    The class is "no disruption", and the justification here is simple,
    because this mechanism takes part in nothing that works.

    What is switched off is the report of a failure, not the attempt to find
    a driver. The machine goes on looking for a driver by every road it used
    before: in built-in resources, in the update mechanism, in whatever an
    administrator points to by hand. All that changes is that after a
    failure no report comes into being.

    A device with no driver will work neither better nor worse after this
    change. It will fail to work in exactly the same way - and the
    administrator will learn of it from the same place as before, that is,
    from the device list and the event log.

    The loss I can point to is on the maker's side, not the user's: it is
    reports that help them notice a driver is missing for many people. That
    argument is true and I would rather record it than pretend the cost is
    zero. On a single production server it does not, however, outweigh the
    principle of sending nothing outside settled routes.

    No restart, invisible in daily work, undone immediately, may be applied
    in bulk.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wyłączone zostaje zgłoszenie o niepowodzeniu, a nie próba znalezienia sterownika
      - Maszyna nadal szuka sterownika w zasobach wbudowanych, w mechanizmie aktualizacji i tam, gdzie wskaże administrator
      - Urządzenie bez sterownika nie zadziała tak samo jak przedtem, a administrator dowie się z listy urządzeń i dziennika zdarzeń
      - Strata jest po stronie producenta — to zgłoszenia pomagają mu zauważyć, że sterownika brakuje wielu ludziom
    en:
      - What is switched off is the report of a failure, not the attempt to find a driver
      - The machine goes on looking for a driver in built-in resources, in the update mechanism, and wherever an administrator points
      - A device with no driver fails to work exactly as before, and the administrator learns of it from the device list and the event log
      - The loss is on the maker's side - it is reports that help them notice a driver is missing for many people
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Organizacja świadomie uczestniczy w zgłaszaniu braków sterowników jako droga pozyskiwania wsparcia dla swojego sprzętu
    en:
      - The organisation deliberately takes part in reporting missing drivers as a way of obtaining support for its hardware
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'DisableSendGenericDriverNotFoundToWER'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'DisableSendGenericDriverNotFoundToWER'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches off the report of a failure, not the search for a driver.
    # The machine goes on looking by every road it used before; a device with no
    # driver fails in exactly the same way as it does today.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSendGenericDriverNotFoundToWER' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

