id: win10-defender-asr-office-code-injection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wstrzykiwania kodu do innych procesów przez aplikacje pakietu biurowego
    en: Office applications blocked from injecting code into other processes
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacjom pakietu biurowego umieszczania własnego
    kodu w pamięci innych działających procesów.

    Czynność ta nie ma w pracy z dokumentami żadnego zastosowania. Nie
    robi tego żaden arkusz, żaden szablon i żadne makro pisane w dobrej
    wierze. Jest to technika, po którą sięga się wyłącznie po to, żeby
    działać pod cudzym imieniem.

    Zysk napastnika jest tu podwójny. Kod działa w procesie, który ma
    uprawnienia i zaufanie — na przykład w procesie odpowiadającym za
    połączenia sieciowe — więc jego ruch wygląda na ruch tamtego programu.
    Zarazem proces pakietu biurowego może się zamknąć, a kod zostaje.

    Odnotowuję, że reguła nie zabrania niczego pakietowi biurowemu
    w zakresie jego własnej pracy. Dotyczy jednej konkretnej czynności,
    wykonywanej wobec procesu cudzego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działanie
    pod imieniem programu zaufanego, przeżywające zamknięcie dokumentu.
  en: |
    The rule forbids the office suite's applications to lay their own code in the memory of other running
    processes.

    That act has in work with documents no use whatever. No sheet does it, no template, and no macro written in
    good faith. It is a technique reached for only so that one may act under somebody else's name.

    The attacker's gain is here twofold. The code runs within a process that holds rights and trust - for instance
    the process answering for network links - so its traffic looks like that program's traffic. At the same time
    the office suite's process may close, and the code stays.

    I set down that the rule forbids the office suite nothing within its own work. It touches one certain act,
    carried out upon somebody else's process.

    What an attacker gains while the item goes unmet: an acting under a trusted program's name, outlasting the
    closing of the document.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Czynność objęta regułą nie występuje w pracy prawidłowej. Nie robi
    tego żadne makro, żaden dodatek do pakietu biurowego ani żadne
    narzędzie do raportowania.

    Odnotowuję jedyne miejsce, w którym bywa spotykana: starsze dodatki
    sięgające po okna innych programów, żeby coś w nich podmienić.
    Spotyka się je rzadko i zwykle są to narzędzia porzucone przez
    producenta.

    Reguła jest w całej trójce o pakiecie biurowym jedyną, którą można
    włączyć bez pytania kogokolwiek o zgodę. Pozostałe uderzają
    w czynności, które w pracy występują; ta — w czynność, której nie ma
    powodu wykonywać.

    Odnotowuję też, że użytkownik niczego nie zobaczy. Nie ma komunikatu,
    bo nie ma czego zatrzymać w pracy prawidłowej.

    Czego to nie psuje: pracy pakietu biurowego, makr, dodatków
    korzystających z udokumentowanych sposobów, drukowania, logowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The act the rule takes in does not come up in proper work. No macro does it, no add-in to the office suite,
    and no reporting tool.

    I set down the one place at which it is at times met with: older add-ins reaching for other programs' windows
    so as to change something in them. They are met with seldom and are as a rule tools their maker has left.

    The rule is in the whole three about the office suite the only one that may be switched on without asking
    anybody's leave. The rest strike at acts that do come up in work; this - at an act there is no ground for
    carrying out.

    I set down as well that the user will see nothing. There is no message, there being nothing to stop in proper
    work.

    What this does not break: the office suite's working, macros, add-ins using the documented ways, printing, or
    logging on.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - macros-and-documents
  what_breaks:
    pl:
      - Starsze dodatki sięgające po okna innych programów, żeby coś w nich podmienić, przestają działać
      - Dodatki takie spotyka się rzadko i zwykle są to narzędzia porzucone przez producenta
      - Użytkownik niczego nie zobaczy, bo w pracy prawidłowej nie ma czego zatrzymać
      - Reguła dotyczy jednej czynności wykonywanej wobec procesu cudzego, a nie pracy własnej pakietu biurowego
      - Praca pakietu biurowego, makra, dodatki korzystające z udokumentowanych sposobów, drukowanie i logowanie pozostają bez zmian
    en:
      - Older add-ins reaching for other programs windows so as to change something in them cease to work
      - Such add-ins are met with seldom and are as a rule tools their maker has left
      - The user will see nothing, there being nothing to stop in proper work
      - The rule touches one act carried out upon somebody else s process, and not the office suite s own work
      - The office suite s working, macros, add-ins using the documented ways, printing and logging on stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W pracy używany jest stary dodatek podmieniający zawartość okien innych programów i nie ma dla niego zastępstwa
    en:
      - An old add-in changing the contents of other programs windows is used at work and there is no stand-in for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła jest w trójce o pakiecie biurowym jedyną bez uciążliwości
    i warto, żeby aplikacja umieściła ją wysoko w liście domyślnej.
    Kategoria wysoka przy klasie bez uciążliwości to zestawienie, które
    powinno trafiać do trybu zbiorczego.

    Argument rozstrzygający jest prosty: tej czynności nie wykonuje
    w pracy nikt. Nie chodzi o to, że wykonuje ją rzadko, lecz o to, że
    nie ma po co. Dlatego jest to jedyna reguła z tej trójki, przy której
    nie trzeba pytać ludzi, co używają.

    Odnotowuję, dlaczego wstrzykiwanie kodu jest dla napastnika warte
    zachodu. Nie chodzi o ukrycie przed ochroną, lecz o zmianę imienia.
    Ruch sieciowy wykonany z procesu przeglądarki wygląda na ruch
    przeglądarki, a to jest różnica rozstrzygająca przy przeglądaniu
    zdarzeń po fakcie.
  en: |
    The rule is in the three about the office suite the only one without disruption, and it is well that the
    application set it high in the default list. A high category beside the class "no disruption" is a pairing
    that ought to reach the bulk mode.

    The settling argument is plain: nobody carries that act out at work. It is not that they do it seldom, but
    that there is no end in it. For that it is the one rule of the three at which people need not be asked what
    they use.

    I set down why the shooting in of code is worth an attacker's trouble. It is not about hiding from the
    protection but about a change of name. Network traffic made from the browser's process looks like the
    browser's traffic, and that is a settling difference at a looking over of happenings after the fact.
