id: win2025-cloud-optimized-content-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Treści dobierane w chmurze pod użytkownika wyłączone
    en: Content selected in the cloud to suit the user turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza dobieranie wyświetlanych treści po stronie chmury na
    podstawie tego, jak z maszyny się korzysta.

    Kategoria średnia i chcę oddzielić ten punkt od sąsiedniego, bo łatwo
    je zlepić w jedno. Tamten dotyczy tego, co przychodzi — aplikacji
    i pozycji dokładających się do systemu. Ten dotyczy tego, co idzie
    w drugą stronę, żeby przychodzące mogło zostać dobrane.

    Dobranie treści pod użytkownika wymaga wiedzy o użytkowniku. Nie jest
    to wybór wykonywany na maszynie na podstawie tego, co maszyna wie
    o sobie — jest to wybór wykonywany po drugiej stronie, na podstawie
    tego, co zostało tam przekazane. Nazwa punktu mówi o treściach,
    a rzeczywistym przedmiotem jest sygnał wysyłany po to, żeby te treści
    dało się dobrać.

    Na serwerze rzecz sprowadza się do pytania, które w tym wątku wraca:
    czy ta maszyna ma prowadzić z internetem rozmowę, której nikt nie
    zamawiał i której zawartości nikt nie widzi. Odpowiedź dla serwera jest
    ta sama co zwykle, tylko tutaj nie ma po drugiej stronie żadnej
    korzyści, którą można by przeciwstawić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — ale z maszyny wychodzi strumień, którego nie widać
    w żadnym wykazie, i to on utrzymuje połączenie, obok którego można
    stanąć.
  en: |
    The item switches off the selection of displayed content on the cloud
    side, based on how the machine is used.

    The category is medium, and I want to separate this item from the
    neighbouring one, because they are easily run together. That one
    concerns what comes in - applications and items adding themselves to the
    system. This one concerns what goes the other way, so that what comes in
    can be chosen.

    Choosing content to suit a user requires knowledge of the user. It is
    not a choice made on the machine out of what the machine knows about
    itself - it is a choice made on the far side, out of what has been
    passed there. The item's name speaks of content, while its real subject
    is the signal sent so that the content can be chosen.

    On a server the matter comes down to the question that keeps returning
    in this vein: is this machine to hold a conversation with the internet
    that nobody ordered and whose contents nobody sees. The answer for a
    server is the usual one, except that here there is no benefit on the
    other side to set against it.

    What an attacker gains while the item goes unmet: nothing directly - but
    a stream leaves the machine that appears in no inventory, and it is that
    stream which keeps up a connection somebody can stand beside.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Ta zmiana nie odbiera niczego, co ktokolwiek
    na serwerze robi.

    Jedyny skutek widoczny dla człowieka jest taki, że miejsca, w których
    system dotąd pokazywał dobraną treść, pokażą treść domyślną albo nie
    pokażą nic. Na serwerze są to miejsca, w które i tak nikt nie zagląda —
    ekran startowy, panel powiadomień — więc odnotowuję ten skutek jako
    widoczny raczej z ostrożności niż z przekonania.

    Rzecz, którą warto rozumieć, dotyczy czytania sprawozdania, nie
    eksploatacji. Ten punkt i punkt o funkcjach konsumenckich leżą w tej
    samej gałęzi rejestru i mają podobne nazwy. Nie zastępują się
    wzajemnie: jeden wyłącza dobieranie treści, drugi samo doinstalowywanie
    aplikacji. Zastosowanie jednego z nich nie zamyka drugiego i warto
    sprawdzić oba, zamiast poznać znajomą ścieżkę i uznać rzecz za
    załatwioną.

    Czego to nie psuje: niczego w rolach serwera, usługach,
    uwierzytelnianiu ani pracy ludzi korzystających z tej maszyny zdalnie.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption". This change takes away nothing anybody
    does on a server.

    The only effect visible to a person is that the places where the system
    used to show chosen content will show default content or nothing. On a
    server these are places nobody looks at anyway - the start screen, the
    notification panel - so I record the effect as visible out of caution
    rather than conviction.

    What is worth understanding concerns reading the report, not operation.
    This item and the item on consumer features lie in the same registry
    branch and have similar names. They do not replace each other: one
    switches off the choosing of content, the other the self-installation of
    applications. Applying one does not close the other, and it is worth
    checking both rather than recognising the familiar path and considering
    the matter settled.

    What this does not break: anything in server roles, services,
    authentication or the work of people using this machine remotely.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Miejsca, w których system pokazywał dobraną treść, pokażą treść domyślną albo nie pokażą nic
      - Na serwerze są to miejsca, w które i tak nikt nie zagląda — ekran startowy, panel powiadomień
      - Punkt ten i punkt o funkcjach konsumenckich nie zastępują się wzajemnie mimo podobnych nazw i tej samej gałęzi rejestru
      - Nie zmienia się nic w rolach serwera, usługach ani pracy ludzi korzystających z maszyny zdalnie
    en:
      - The places where the system showed chosen content will show default content or nothing
      - On a server these are places nobody looks at anyway - the start screen, the notification panel
      - This item and the item on consumer features do not replace each other, despite similar names and the same registry branch
      - Nothing changes in server roles, services, or the work of people using the machine remotely
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym dobierane treści są częścią przyjętego wyglądu stanowiska pracy
    en:
      - The machine is a terminal server where chosen content is part of the accepted look of the workplace
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableCloudOptimizedContent'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableCloudOptimizedContent'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The item's name speaks of content; its real subject is the signal sent so
    # that content can be chosen on the far side. This does not replace the
    # consumer features item in the same branch - both are worth checking.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableCloudOptimizedContent' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Oddziel ten punkt od sąsiedniego: tamten dotyczy tego, co przychodzi,
    ten tego, co idzie w drugą stronę, żeby przychodzące mogło zostać
    dobrane.

    Dobranie treści pod użytkownika wymaga wiedzy o użytkowniku, a wybór
    wykonywany jest po drugiej stronie, na podstawie tego, co tam
    przekazano. Nazwa mówi o treściach, przedmiotem jest sygnał.

    Na serwerze wraca to samo pytanie co w całym wątku — z tą różnicą, że
    tutaj po drugiej stronie nie ma żadnej korzyści, którą można by
    przeciwstawić.
  en: |
    Separate this item from the neighbouring one: that one concerns what
    comes in, this one what goes the other way so that what comes in can be
    chosen.

    Choosing content to suit a user requires knowledge of the user, and the
    choice is made on the far side out of what has been passed there. The
    name speaks of content; the subject is the signal.

    On a server the same question returns as throughout this vein - with the
    difference that here there is no benefit on the other side to set
    against it.
