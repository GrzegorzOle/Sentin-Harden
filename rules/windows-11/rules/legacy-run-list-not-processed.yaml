id: win11-legacy-run-list-not-processed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Starsza lista programów uruchamianych przy logowaniu pomijana
    en: The older list of programs started at logon passed over
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Poza zwykłymi miejscami automatycznego startu — kluczem uruchamiania, folderem
    autostartu i zadaniami — system czyta jeszcze jedną listę: tę zbudowaną przez
    zasadę każącą uruchomić wskazane programy przy logowaniu. Lista mieszka
    w gałęzi zasad i pochodzi z czasów, gdy skrypt logowania rozdawało się
    właśnie tak.

    Z punktu widzenia napastnika jest to miejsce wyjątkowo wygodne. Wpis w tej
    liście uruchamia się przy każdym logowaniu, w sesji tego, kto się właśnie
    loguje — a więc również administratora domeny, który usiądzie przy maszynie
    następny. Napastnik, który zdobył uprawnienia na jednej maszynie, zostawia
    tam wpis i czeka, aż przyjdzie do niego ktoś cenniejszy. Jest to zarazem
    trwałość i droga do przejścia na wyższe konto, w jednym wpisie.

    Druga zaleta tej listy dla napastnika to jej niepozorność. Narzędzia
    przeglądające automatyczny start zaglądają przede wszystkim w miejsca
    oczywiste, a lista w gałęzi zasad wygląda jak element zarządzania i bywa
    pomijana także przez człowieka, który wie, czego szuka.

    Punkt każe systemowi tę listę pomijać. Wpis może tam zostać, ale nie zostanie
    uruchomiony.
  en: |
    Besides the usual places of automatic start - the run key, the startup folder and
    scheduled tasks - the system reads one more list: the one built by the policy
    ordering the named programs to be started at logon. The list lives in the policy
    branch and comes from the days when a logon script was handed out exactly this
    way.

    From an attacker's point of view it is an uncommonly convenient place. An entry in
    this list starts at every logon, in the session of whoever is signing in - so a
    domain administrator sitting down at the machine next as well. An attacker who has
    won privileges on one machine leaves an entry there and waits for someone more
    valuable to come to them. It is persistence and a route up to a higher account at
    once, in a single entry.

    The list's second merit for an attacker is how unremarkable it looks. Tools going
    through automatic start look at the obvious places above all, and a list in the
    policy branch looks like a piece of management and gets passed over even by a
    person who knows what they are after.

    The item has the system pass the list over. An entry may stay there, but it will
    not be started.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy organizacja sama z tej listy nie korzysta.

    Jest to sposób rozdawania programów startowych spotykany tam, gdzie
    zarządzanie stanowiskami rosło latami: agent monitorujący, narzędzie
    inwentaryzacyjne, skrypt mapujący dyski albo program branżowy, który ma
    wstać sam przy każdym logowaniu. Wszystko to po wdrożeniu przestanie
    startować — cicho, bez komunikatu i bez śladu, bo pominięcie listy nie jest
    błędem.

    Objaw jest mylący. Użytkownik nie zobaczy nic poza tym, że czegoś brakuje:
    dysk sieciowy nie jest podłączony, program branżowy trzeba uruchomić ręcznie,
    agent nie melduje się w konsoli. Powiązanie tego z wdrożoną zasadą wymaga
    wiedzy, że taka lista w ogóle istnieje.

    Sprawdzenie jest proste i warto je wykonać przed zmianą: wystarczy zajrzeć,
    czy w gałęzi zasad po stronie maszyny są wpisy uruchamiania. Jeżeli jest
    pusto — zmiana nie zmienia nic.

    Zwykłe miejsca automatycznego startu działają bez zmian. Punkt nie dotyczy
    klucza uruchamiania, folderu autostartu ani zadań.

    Nie ma restartu, ale skutek widać dopiero przy następnym logowaniu.
  en: |
    What needs checking is whether the organisation does not use this list itself.

    It is a way of handing out startup programs met where station management has grown
    over years: a monitoring agent, an inventory tool, a script mapping drives or a
    trade program meant to come up by itself at every logon. All of it stops starting
    after the rollout - quietly, with no message and no trace, because passing the
    list over is not an error.

    The symptom is misleading. The user sees nothing but something missing: the
    network drive is not attached, the trade program has to be started by hand, the
    agent does not report to its console. Tying that to the applied policy takes
    knowing such a list exists at all.

    The check is simple and worth doing before the change: look at whether the policy
    branch on the machine's side holds any run entries. If it is empty, the change
    changes nothing.

    The usual places of automatic start work unchanged. The item does not concern the
    run key, the startup folder or scheduled tasks.

    There is no restart, but the effect shows only at the next logon.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - remote-management
  what_breaks:
    pl:
      - Programy rozdawane zasadą uruchamiania przy logowaniu przestaną startować
      - Skrypt mapujący dyski sieciowe wywoływany tą drogą przestanie się wykonywać
      - Agent monitorujący albo inwentaryzacyjny wstający z tej listy przestanie się zgłaszać
      - Klucz uruchamiania, folder autostartu i zadania działają bez zmian
    en:
      - Programs handed out by the run-at-logon policy stop starting
      - A script mapping network drives called this way stops running
      - A monitoring or inventory agent coming up from this list stops reporting
      - The run key, the startup folder and scheduled tasks work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Organizacja rozdaje programy startowe zasadą uruchamiania przy logowaniu
      - Skrypt logowania jest wywoływany z listy w gałęzi zasad, a nie zadaniem
    en:
      - The organisation hands out startup programs by the run-at-logon policy
      - The logon script is called from the list in the policy branch rather than by a task
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'DisableLocalMachineRun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'DisableLocalMachineRun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalMachineRun' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/setupapi/run-and-runonce-registry-keys

notes:
  pl: |
    Punkt ma parę: pominięcie listy jednorazowej, opisane osobną regułą. Obie
    zamykają ten sam rodzaj drogi i obie warto wdrażać razem — zamknięcie jednej
    zostawia drugą otwartą, a napastnik wybiera tę, która działa.

    Nazwa ustawienia mówi o liście „starszej" i jest to dosłowne tłumaczenie
    zaszłości: lista pochodzi z systemów sprzed dwóch dekad i została
    w systemie wyłącznie dla zgodności. Wciąż jest jednak czytana, więc wciąż
    jest drogą.

    Reguła czyta wyłącznie stan po stronie maszyny. Odpowiednik po stronie
    użytkownika istnieje i podlega tej samej zasadzie, ale należy do
    nierozstrzygniętego zakresu ustawień w gałęzi użytkownika.

    Wycofanie nie usuwa gałęzi — jest wspólna z ustawieniami nośników wymiennych
    i powłoki.
  en: |
    The item has a pair: the passing over of the one-time list, described by a rule of
    its own. Both close the same kind of route and both are worth applying together -
    closing one leaves the other open, and an attacker picks the one that works.

    The setting's name speaks of an "older" list and that is a literal rendering of a
    legacy: the list comes from systems two decades old and was left in place for
    compatibility alone. It is still read, though, so it is still a route.

    The rule reads the state on the machine's side only. A counterpart on the user's
    side exists and falls under the same principle, but belongs to the unsettled scope
    of settings in the user branch.

    Rollback does not remove the key - it is shared with the removable media and shell
    settings.
