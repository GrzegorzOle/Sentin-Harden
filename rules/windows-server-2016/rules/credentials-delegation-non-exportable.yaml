id: win2016-credentials-delegation-non-exportable

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Credentials Delegation
  title:
    pl: Delegowanie poświadczeń w postaci uniemożliwiającej ich wyniesienie
    en: Credentials delegated in a form that cannot be carried away
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala przekazywać poświadczenia do maszyny zdalnej
    w postaci, z której nie da się ich wyjąć i użyć gdzie indziej.

    Rzecz dotyczy sytuacji codziennej: ktoś łączy się pulpitem zdalnym do
    serwera i musi się na nim uwierzytelnić. Zwykle oznacza to przekazanie
    poświadczenia na tamtą maszynę, gdzie zostaje ono w pamięci na czas
    sesji. Jeżeli maszyna docelowa jest już przejęta, napastnik zbiera to
    poświadczenie i używa go dalej — a że łączą się w ten sposób głównie
    osoby zarządzające, zbiera poświadczenia najcenniejsze w sieci.

    Postać chroniona zmienia ten układ. Poświadczenie nie trafia na maszynę
    docelową; zostaje na maszynie, z której nastąpiło połączenie, a tamta
    pyta o potwierdzenie tożsamości za każdym razem, gdy jest potrzebne.
    Napastnik siedzący na maszynie docelowej może korzystać z sesji, dopóki
    ona trwa, ale nie ma czego wynieść.

    Ustawienie to nie wymusza takiego trybu — ono go dopuszcza. Bez niego
    połączenie w postaci chronionej po prostu nie dojdzie do skutku,
    więc punkt jest warunkiem, żeby zabezpieczenie w ogóle dało się
    zastosować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    każde połączenie zdalne do przejętej przez niego maszyny zostawi na niej
    poświadczenie nadające się do użycia gdzie indziej.
  en: |
    The setting allows credentials to be passed to a remote machine in a form they
    cannot be taken out of and used elsewhere.

    The matter concerns an everyday situation: somebody connects by remote desktop
    to a server and must authenticate on it. As a rule that means passing a
    credential to that machine, where it stays in memory for the length of the
    session. If the target machine is already taken over, the attacker gathers that
    credential and uses it onward - and since those connecting this way are chiefly
    the people managing things, they gather the most valuable credentials in the
    network.

    The protected form changes that arrangement. The credential does not reach the
    target machine; it stays on the machine the connection came from, and the target
    asks for the identity to be confirmed each time it is needed. An attacker
    sitting on the target machine can use the session for as long as it lasts, but
    has nothing to carry off.

    This setting does not force that mode - it permits it. Without it a connection
    in the protected form simply will not come about, so the item is the condition
    of the safeguard being usable at all.

    What an attacker gains while the item goes unmet: the certainty that every
    remote connection to a machine they have taken over will leave a credential on
    it fit for use elsewhere.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i wynika to wprost z tego, co ustawienie robi.
    Ono niczego nie zabrania — dopuszcza dodatkowy tryb połączenia obok
    dotychczasowych.

    Nie znaleziono scenariusza, w którym ta zmiana cokolwiek psuje.
    Połączenia dotychczasowe działają dalej tak samo; dochodzi wyłącznie
    możliwość zestawienia połączenia w postaci chronionej, jeżeli strona
    łącząca się o to poprosi.

    Warto przy tym wiedzieć, czego to ustawienie nie daje, bo nazwa sugeruje
    więcej. Samo włączenie nie sprawia, że połączenia zaczynają korzystać
    z postaci chronionej — o tym decyduje strona łącząca się, przy
    zestawianiu sesji. Punkt otwiera drogę; przejście nią jest osobną
    decyzją i osobną konfiguracją.

    Druga rzecz: postać chroniona wymaga, by obie strony ją obsługiwały,
    i nie działa przy uwierzytelnianiu kontem lokalnym maszyny docelowej.
    Tam, gdzie warunki nie są spełnione, połączenie po prostu zestawia się
    po staremu.

    Czego to nie psuje: niczego z dotychczasowych sposobów łączenia, sesji
    już otwartych, uwierzytelniania domenowego, kont lokalnych.

    Bez restartu, natychmiast odwracalne, niewidoczne w codziennej pracy.
  en: |
    The class is "none", and that follows straight from what the setting does. It
    forbids nothing - it permits one more mode of connection alongside the existing
    ones.

    No scenario has been found in which this change breaks anything. The existing
    connections work on just as before; what is added is only the possibility of
    setting up a connection in the protected form, if the connecting side asks for
    it.

    It is worth knowing what the setting does not give, since its name suggests
    more. Switching it on does not by itself make connections use the protected
    form - that is settled by the connecting side, while the session is being set
    up. The item opens the road; walking it is a separate decision and a separate
    configuration.

    The second thing: the protected form calls for both sides to support it, and
    does not work where authentication is with the target machine's local account.
    Where the conditions are not met, the connection is simply set up in the old
    way.

    What this does not break: nothing among the existing ways of connecting,
    sessions already open, domain authentication, or local accounts.

    No restart, undone immediately, invisible in daily work.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-desktop
  what_breaks:
    pl:
      - Nie znaleziono scenariusza, w którym ta zmiana psuje cokolwiek - dotychczasowe sposoby łączenia działają bez zmian
      - Samo włączenie nie sprawia, że połączenia zaczynają korzystać z postaci chronionej - decyduje o tym strona łącząca się
      - Postać chroniona nie działa przy uwierzytelnianiu kontem lokalnym maszyny docelowej i wtedy sesja zestawia się po staremu
      - Sesje już otwarte, uwierzytelnianie domenowe i konta lokalne pozostają bez zmian
    en:
      - No scenario has been found in which this change breaks anything - the existing ways of connecting work unchanged
      - Switching it on does not by itself make connections use the protected form - the connecting side settles that
      - The protected form does not work where authentication is with the target machine's local account, and the session is then set up in the old way
      - Sessions already open, domain authentication and local accounts stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie znaleziono roli ani konfiguracji, na której to ustawienie byłoby błędem
      - Jedyny powód wstrzymania się to brak przeglądu tego, czym maszyna łączy się dalej, jeśli zmiana miałaby być pierwszym krokiem do wymuszenia postaci chronionej
    en:
      - No role or configuration has been found on which this setting would be a mistake
      - The one reason to hold back is the lack of a review of what the machine connects onward with, if the change were to be the first step towards forcing the protected form
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
      $name = 'AllowProtectedCreds'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    $name = 'AllowProtectedCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredentialsDelegation'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowProtectedCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/remote-credential-guard

notes:
  pl: |
    Punkt trafia w macierzy w pole szybkich wygranych i nadaje się do trybu
    zbiorczego. Warto go jednak pokazywać razem z informacją, że jest
    warunkiem, a nie wynikiem: otwiera drogę do połączeń chronionych, ale
    sam ich nie wymusza.

    Reguła dopełnia grupę chroniącą poświadczenia w pamięci z zupełnie innej
    strony niż pozostałe. Tamte chronią poświadczenia leżące na tej maszynie.
    Ta chroni poświadczenia, które z tej maszyny wychodzą — czyli materiał
    zostawiany przez osoby zarządzające na maszynach, do których się łączą.

    Zdanie o kontach lokalnych warto pokazać w interfejsie, bo bywa źródłem
    mylnej diagnozy. Gdy połączenie chronione nie dochodzi do skutku,
    przyczyną najczęściej nie jest to ustawienie, tylko sposób
    uwierzytelnienia po drugiej stronie.
  en: |
    In the matrix the item falls in the square of quick wins and is fit for the bulk
    mode. It is worth showing, though, along with the information that it is a
    condition rather than a result: it opens the road to protected connections but
    does not itself force them.

    The rule completes the group guarding credentials in memory from quite another
    side than the rest. Those guard the credentials lying on this machine. This one
    guards the credentials leaving it - which is to say the material that the people
    managing things leave on the machines they connect to.

    The sentence about local accounts is worth showing in the interface, since it is
    a source of mistaken diagnosis. When a protected connection does not come about,
    the cause is most often not this setting but the way of authenticating on the
    other side.
