id: win2016-bitlocker-fixed-drives-recovery-options

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Sposób odzyskiwania dostępu do dysków stałych ustalony
    en: The way of recovering access to fixed drives settled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, skąd bierze się dostęp do zaszyfrowanego dysku stałego,
    gdy zwykła droga zawiedzie, i gdzie ten dostęp jest przechowywany.

    Klucz odzyskiwania jest jedyną rzeczą stojącą między awarią a utratą
    danych. Wszystko, co opisują pozostałe reguły bloku, dotyczy codziennego
    odblokowywania; ta jedna dotyczy chwili, w której codzienne
    odblokowywanie przestało działać.

    Decyzja rozpada się na kilka wartości i dlatego punkt czyta je razem.
    Pierwsza rzecz: hasło odzyskiwania i klucz na nośniku mają być
    wymagane, a nie pozostawione do wyboru. Druga: zapis do katalogu ma być
    włączony i obowiązkowy, bo klucz przechowywany wyłącznie na maszynie
    ginie razem z maszyną. Trzecia: agent odzyskiwania danych ma być
    wyłączony, bo jest to osobna droga wejścia do każdego woluminu
    w organizacji.

    Wymaganie obowiązkowego zapisu do katalogu jest tu najważniejsze i to
    ono niesie skutek operacyjny. Sprawia, że zaszyfrowanie woluminu bez
    udanego zapisania klucza jest niemożliwe — a więc że nie da się
    zaszyfrować dysku i nie mieć do niego klucza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę wejścia
    przez agenta odzyskiwania albo klucze przechowywane tam, gdzie nikt ich
    nie pilnuje. Co traci właściciel danych: możliwość odzyskania dostępu,
    gdy klucza nigdzie nie zapisano.
  en: |
    The item settles where access to an encrypted fixed drive comes from when the ordinary road
    fails, and where that access is kept.

    The recovery key is the one thing standing between a fault and the loss of data. Everything
    the other rules of the block describe concerns everyday unlocking; this one concerns the
    moment everyday unlocking has ceased to work.

    The decision falls into several values and the item therefore reads them together. The first
    matter: the recovery password and the key on a medium are to be required, not left to choice.
    The second: writing to the directory is to be switched on and obligatory, a key kept solely on
    the machine perishing along with the machine. The third: the data recovery agent is to be
    switched off, being a road of its own into every volume in the organisation.

    The requirement that writing to the directory be obligatory is here the weightiest and it is
    that which carries the operational consequence. It makes encrypting a volume without a
    successful writing of the key impossible - which is to say that a drive cannot be encrypted
    and be without a key.

    What an attacker gains while the item goes unmet: a road in through the recovery agent, or
    keys kept where nobody watches them. What the data's owner loses: the possibility of
    recovering access where the key was written down nowhere.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest jeden i trzeba go
    znać przed, nie po.

    Obowiązkowy zapis do katalogu znaczy, że bez łączności z katalogiem
    szyfrowanie nowego woluminu nie zadziała. Na maszynie w domenie
    z działającą siecią jest to warunek spełniony zawsze i niewidoczny.
    Przestaje być spełniony dokładnie tam, gdzie zwykle się szyfruje —
    przy stawianiu maszyny, w oknie serwisowym, w sieci wydzielonej, na
    maszynie tymczasowo odciętej.

    Objaw jest przy tym mylący. Polecenie szyfrowania kończy się błędem,
    który mówi o zasadzie, a nie o katalogu, i łatwo go wziąć za kłopot
    z uprawnieniami.

    Drugi skutek dotyczy maszyn poza domeną. Na serwerze w grupie roboczej
    zapisu do katalogu nie ma dokąd wykonać, więc wymóg jest niespełnialny,
    a nie po prostu uciążliwy. Dla takiej maszyny właściwym wynikiem jest
    zapisany wyjątek wraz ze wskazaniem, gdzie klucze są przechowywane
    zamiast tego.

    Trzeci skutek dotyczy agenta odzyskiwania danych. Jeżeli organizacja
    korzysta z niego jako drogi ratunku, wyłączenie go tę drogę zamyka —
    i trzeba mieć wtedy pewność, że klucze w katalogu rzeczywiście są.

    Wdrożenie nie dotyka woluminów już zaszyfrowanych. Ich klucze pozostają
    tam, gdzie trafiły przy szyfrowaniu, a zgodny wpis niczego o nich nie
    mówi. Przeniesienie ich do katalogu jest osobną czynnością.

    Czego to nie psuje: dostępu do danych, pracy usług, sieci, odblokowywania
    woluminów już zaszyfrowanych.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs a planned rollout", and the reason is a single one and has to be known
    beforehand, not after.

    Obligatory writing to the directory means that without connectivity to the directory the
    encryption of a new volume will not work. On a machine in a domain with a working network that
    condition is always met and unseen. It ceases to be met exactly where encrypting is usually
    done - when a machine is being set up, in a service window, in a separated network, on a
    machine cut off for a time.

    The symptom is for all that a misleading one. The encryption command ends in an error that
    speaks of a policy and not of the directory, and it is easily taken for a trouble with rights.

    The second consequence concerns machines outside a domain. On a server in a workgroup there is
    nowhere to write to the directory, so the requirement is unmeetable rather than merely
    burdensome. For such a machine the right outcome is a recorded exception along with a note of
    where the keys are kept instead.

    The third consequence concerns the data recovery agent. If the organisation uses it as a road
    of rescue, switching it off shuts that road - and there has then to be certainty that the keys
    are really in the directory.

    The rollout does not touch volumes already encrypted. Their keys stay where they landed at
    encryption, and a compliant entry says nothing about them. Moving them to the directory is an
    act of its own.

    What this does not break: access to data, the working of services, the network, or the
    unlocking of volumes already encrypted.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Bez łączności z katalogiem szyfrowanie nowego woluminu nie zadziała, a błąd mówi o zasadzie, nie o katalogu
      - Na serwerze w grupie roboczej wymóg jest niespełnialny, bo zapisu do katalogu nie ma dokąd wykonać
      - Wyłączenie agenta odzyskiwania danych zamyka drogę ratunku, z której część organizacji korzysta
      - Klucze woluminów zaszyfrowanych przed zmianą zostają tam, gdzie trafiły, a zgodny wpis niczego o nich nie mówi
      - Dostęp do danych, praca usług i odblokowywanie woluminów już zaszyfrowanych pozostają bez zmian
    en:
      - Without connectivity to the directory the encryption of a new volume will not work, and the error speaks of a policy, not of the directory
      - On a server in a workgroup the requirement is unmeetable, there being nowhere to write to the directory
      - Switching the data recovery agent off shuts a road of rescue that some organisations use
      - The keys of volumes encrypted before the change stay where they landed, and a compliant entry says nothing about them
      - Access to data, the working of services and the unlocking of volumes already encrypted stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje w grupie roboczej i zapisu klucza do katalogu nie ma dokąd wykonać
      - Woluminy bywają szyfrowane w oknie serwisowym przy odciętej sieci, a błąd wygląda wtedy na kłopot z uprawnieniami
      - Agent odzyskiwania danych jest w tej organizacji jedyną sprawdzoną drogą ratunku
    en:
      - The machine works in a workgroup and there is nowhere to write the key to a directory
      - Volumes are at times encrypted in a service window with the network cut off, and the error then looks like a trouble with rights
      - The data recovery agent is in this organisation the one tried road of rescue
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item is one decision written in several values, so all of them are
      # read at once and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        FDVRecovery                     = 1
        FDVManageDRA                    = 0
        FDVRecoveryPassword             = 2
        FDVRecoveryKey                  = 2
        FDVHideRecoveryPage             = 1
        FDVActiveDirectoryBackup        = 1
        FDVActiveDirectoryInfoToStore   = 1
        FDVRequireActiveDirectoryBackup = 1
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @(
      'FDVRecovery', 'FDVManageDRA', 'FDVRecoveryPassword', 'FDVRecoveryKey',
      'FDVHideRecoveryPage', 'FDVActiveDirectoryBackup',
      'FDVActiveDirectoryInfoToStore', 'FDVRequireActiveDirectoryBackup'
    )) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This applies at every new volume too. A volume added in a service window
    # without directory connectivity simply will not be encrypted, and the
    # operation looks successful - check afterwards rather than assuming.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $values = @{
      FDVRecovery                     = 1
      FDVManageDRA                    = 0
      FDVRecoveryPassword             = 2
      FDVRecoveryKey                  = 2
      FDVHideRecoveryPage             = 1
      FDVActiveDirectoryBackup        = 1
      FDVActiveDirectoryInfoToStore   = 1
      FDVRequireActiveDirectoryBackup = 1
    }
    foreach ($name in $values.Keys) {
      Set-ItemProperty -Path $path -Name $name -Value $values[$name] -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest czwarty w bloku i jedyny, którego przedmiotem jest dostępność
    danych dla właściciela, a nie ich niedostępność dla obcego. Warto to
    powiedzieć wprost, bo reguła wygląda na ustawienie zgodnościowe, a jest
    zabezpieczeniem przed utratą wszystkiego.

    Jest to również punkt, w którym jedna decyzja rozpada się na osiem
    wartości. Zgłaszanie ich osobno dałoby osiem pozycji w raporcie,
    z których żadna nie mówi niczego samodzielnie — dlatego audyt czyta je
    razem i nazywa w wyniku tę, która odstaje. Stan pośredni jest tu
    niezbędny: maszyna z siedmioma wartościami ustawionymi i jedną brakującą
    jest w innej sytuacji niż maszyna, na której nikt niczego nie ustawił.

    Warunek obowiązkowego zapisu do katalogu zasługuje na osobne
    ostrzeżenie w podglądzie, bo jest jedyną rzeczą w tej regule, która
    potrafi zatrzymać pracę — i robi to w miejscu nieoczekiwanym, przy
    stawianiu maszyny, a nie przy jej codziennym używaniu.

    Dla maszyn poza domeną zapisany wyjątek jest tu wynikiem poprawnym.
    Wymóg niespełnialny zgłaszany w raporcie jako czerwony rok po roku uczy
    ludzi, że czerwień nic nie znaczy, i to jest szkoda większa niż sam
    punkt.
  en: |
    The item is the fourth in the block and the only one whose subject is the availability of data
    to their owner rather than their unavailability to a stranger. That is worth saying outright,
    the rule looking like a compliance setting and being a guard against losing everything.

    It is also an item where one decision falls into eight values. Reporting them apart would give
    eight entries in the report, none of which says anything by itself - so the audit reads them
    together and names in the outcome the one that stands out. A middle state is here needful: a
    machine with seven values set and one wanting is in a different situation than a machine on
    which nobody set anything.

    The condition of obligatory writing to the directory deserves a warning of its own in the
    preview, being the one thing in this rule that can stop work - and doing it at an unlooked-for
    place, at a machine's setting up rather than at its everyday use.

    For machines outside a domain a recorded exception is here a right outcome. An unmeetable
    requirement reported as red year after year teaches people that red means nothing, and that is
    a greater harm than the item itself.
