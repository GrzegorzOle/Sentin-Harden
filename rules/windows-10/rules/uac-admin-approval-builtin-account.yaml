id: win10-uac-admin-approval-builtin-account

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Tryb zatwierdzania dla wbudowanego konta administratora
    en: Approval mode for the built-in administrator account
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie obejmuje kontrolą konta użytkownika również wbudowane konto
    administratora — to o stałym identyfikatorze, kończącym się na 500.

    Bez tego ustawienia wbudowane konto jest wyjątkiem od reguły poprzedniej.
    Kontrola konta działa dla wszystkich administratorów utworzonych ręcznie,
    ale konto wbudowane omija ją w całości i pracuje z pełnymi uprawnieniami
    od pierwszej chwili po zalogowaniu.

    Znaczenie tego wyjątku bierze się stąd, że właśnie tego konta szuka się
    najczęściej. Jego identyfikator jest stały i znany z góry, więc nie
    trzeba zgadywać nazwy — zmiana nazwy konta go nie zmienia. Konto to bywa
    też włączane doraźnie przy naprawie maszyny i zostaje włączone.

    Zestawienie obu rzeczy daje sytuację, w której najbardziej szukane konto
    na maszynie jest jedynym, które nie podlega żadnemu potwierdzeniu.
    Punkt to zamyka: po zmianie wbudowane konto podlega monitom tak samo jak
    każde inne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto o znanym
    z góry identyfikatorze, które po zalogowaniu daje pełne prawa bez
    jednego potwierdzenia.
  en: |
    The setting brings the built-in administrator account - the one with the fixed identifier ending in 500 -
    under User Account Control as well.

    Without this setting the built-in account is an exception to the foregoing rule. The control works for every
    administrator made by hand, but the built-in account goes round it wholly and works with full rights from
    the first moment after logging on.

    The weight of that exception comes of this, that it is just this account that gets looked for most often.
    Its identifier is fixed and known beforehand, so no name has to be guessed - renaming the account does not
    change it. The account also gets switched on for the occasion while a machine is being mended, and stays
    switched on.

    Putting the two together gives a state in which the most sought-after account on the machine is the only one
    subject to no confirmation at all. The item closes that: after the change the built-in account is subject to
    the prompts like any other.

    What an attacker gains while the item goes unmet: an account of an identifier known beforehand that after a
    logon gives full rights without a single confirmation.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy jednego pytania: czy
    ktoś na tej maszynie pracuje kontem wbudowanym.

    Na stanowisku roboczym włączonym do domeny odpowiedź zwykle brzmi „nie" —
    konto jest wyłączone i zmiana nie robi nic. Wtedy jest to punkt bez
    kosztu.

    Tam, gdzie konto jest używane, zmiana jest odczuwalna od razu. Pojawiają
    się monity przy czynnościach administracyjnych, a to konto służy zwykle
    wyłącznie do nich, więc pojawią się przy niemal każdej czynności.

    Osobno stoi przypadek gorszy: skrypty i zadania napisane pod to konto
    i liczące na to, że nie ma monitów. Te przestaną działać cicho, tak jak
    przy regule poprzedniej.

    Zmiana wchodzi bez restartu, ale dotyczy dopiero kolejnego zalogowania
    tego konta. Sesja już otwarta zachowuje uprawnienia dotychczasowe.

    Czego to nie psuje: pozostałych kont administracyjnych, kont zwykłych,
    logowania domenowego, usług, sieci, aplikacji.
  en: |
    The class is "needs review", and the review touches a single question: whether anybody works on this machine
    by the built-in account.

    At a workplace joined to a domain the answer is as a rule "no" - the account is switched off and the change
    does nothing. It is then an item without cost.

    Where the account is in use, the change makes itself felt at once. Prompts appear at administrative acts,
    and that account as a rule serves for nothing else, so they will appear at nearly every act.

    A worse case stands apart: scripts and tasks written for that account and counting on there being no
    prompts. Those will cease working quietly, as at the foregoing rule.

    The change takes hold without a restart, but touches only the next logon of that account. A session already
    open keeps the rights it has.

    What this does not break: the other administrative accounts, ordinary accounts, domain logon, services, the
    network, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Praca na koncie wbudowanym zaczyna wymagać potwierdzenia monitem przy niemal każdej czynności
      - Skrypty i zadania napisane pod konto wbudowane i liczące na brak monitów przestają działać po cichu
      - Zmiana dotyczy dopiero kolejnego zalogowania tego konta, więc sesja już otwarta zachowuje dotychczasowe uprawnienia
      - Na maszynie z wyłączonym kontem wbudowanym zmiana nie robi nic i pozostaje zabezpieczeniem na przyszłość
      - Pozostałe konta administracyjne, konta zwykłe, logowanie domenowe oraz usługi systemowe pozostają bez zmian
    en:
      - Work on the built-in account begins calling for a confirmation by prompt at nearly every act
      - Scripts and tasks written for the built-in account and counting on there being no prompts cease working quietly
      - The change touches only the next logon of that account, so a session already open keeps the rights it has
      - On a machine with the built-in account switched off the change does nothing and stays a safeguard for later
      - The other administrative accounts, ordinary accounts, domain logon and system services stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konto wbudowane jest jedyną drogą naprawy tej maszyny, a przy monitach nie ma przy niej człowieka
      - Pod konto wbudowane napisano zadania bez nadzoru, których nie da się na razie przepisać
    en:
      - The built-in account is the only road to mending this machine and at the prompts there is no person by it
      - Unattended tasks were written for the built-in account which cannot for now be rewritten
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'FilterAdministratorToken'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'FilterAdministratorToken'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change touches the next logon of the built-in account. Where tasks
    # without a person by them run on that account, rewrite them first - they
    # will begin ending in an access-denied error without saying so.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FilterAdministratorToken' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-admin-approval-mode-for-the-built-in-administrator-account

notes:
  pl: |
    Punkt jest drugi w bloku i domyka wyjątek, który reguła pierwsza
    zostawia. Warto, żeby aplikacja pokazywała je razem, bo sama pierwsza
    daje obraz niepełny — kontrola konta może być włączona, a konto
    najczęściej szukane nadal jej nie podlegać.

    Na stanowisku roboczym w domenie jest to zwykle punkt bez kosztu,
    bo konto wbudowane jest wyłączone. Nie zmienia to jego wagi: wartość
    reguły ujawnia się dokładnie wtedy, gdy ktoś to konto włączy, czyli
    w chwili awarii, gdy nikt nie będzie o niej myślał.

    Odnotowuję, że reguła nie wyłącza konta wbudowanego ani nie zmienia
    jego nazwy. Są to dwie osobne czynności i aplikacja nie powinna
    sugerować, że ta jedna zmiana je zastępuje.
  en: |
    The item is the second in the block and closes the exception the first rule leaves. It is well that the
    application show them together, the first alone giving an incomplete picture - the control may be switched
    on while the most sought-after account is still not subject to it.

    At a workplace in a domain it is as a rule an item without cost, the built-in account being switched off.
    That does not lessen its weight: the rule's value shows itself exactly when somebody switches that account
    on, which is at the moment of a fault, when nobody will be thinking of it.

    Worth noting that the rule neither switches the built-in account off nor changes its name. Those are two
    separate acts and the application ought not suggest that this one change stands for them.
