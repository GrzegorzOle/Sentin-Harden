id: win2016-game-recording-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Game Recording and Broadcasting
  title:
    pl: Nagrywanie i przesyłanie obrazu ekranu wyłączone
    en: The recording and broadcasting of the screen switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm nagrywający obraz ekranu i przesyłający go
    dalej.

    Nazwa tego mechanizmu prowadzi na manowce i warto zacząć od
    sprostowania. Należy on do warstwy rozrywkowej systemu, ale to, co
    potrafi, nie ma z nią nic wspólnego: nagrywa zawartość ekranu, zapisuje
    ją do pliku i potrafi wysłać obraz na bieżąco na zewnątrz.

    Na maszynie, na której ktokolwiek pracuje z danymi, jest to mechanizm
    zdejmujący te dane z ekranu. Nie trzeba przy tym żadnego włamania:
    wystarczy skrót klawiszowy albo polecenie wydane w sesji, do której
    napastnik już wszedł. Obraz wychodzi wtedy drogą, której nikt nie
    obserwuje, bo nikt nie traktuje nagrywania ekranu jako kanału
    wyprowadzania danych.

    Rzecz druga dotyczy śladu. Nagranie jest plikiem wideo w profilu
    użytkownika, a przesyłanie na żywo nie zostawia pliku w ogóle.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wbudowany
    sposób zdjęcia z ekranu wszystkiego, co na nim widać, bez wnoszenia
    narzędzia i bez wyraźnego śladu.
  en: |
    The setting switches off the mechanism recording the screen's picture and passing it onward.

    That mechanism's name leads astray and it is well to begin with a correction. It belongs to the
    system's entertainment layer, but what it can do has nothing to do with it: it records the screen's
    contents, writes them to a file and can send the picture onward as it goes.

    On a machine where anybody works with data, it is a mechanism taking those data off the screen. No
    breaking in is needed for that: a keyboard shortcut is enough, or a command issued within a session
    the attacker has already entered. The picture goes out then by a road nobody watches, nobody
    treating the recording of a screen as a channel for carrying data out.

    The second matter concerns the trace. A recording is a video file in the user's profile, and a live
    broadcast leaves no file at all.

    What an attacker gains while the item goes unmet: a built-in way of taking off the screen everything
    that shows on it, bringing no tool and leaving no plain trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze mechanizm ten nie jest przez nic używany. Wyłączenie go nie
    zmienia zachowania żadnej aplikacji, żadnej usługi ani żadnego
    narzędzia administracyjnego.

    Rozróżnienie warte zrobienia dotyczy innych sposobów nagrywania ekranu.
    Punkt dotyczy wyłącznie mechanizmu wbudowanego w warstwę rozrywkową.
    Narzędzia nagrywające ekran zainstalowane osobno — używane na przykład
    do szkoleń albo do dokumentowania usterek — działają dalej i ten punkt
    ich nie dotyczy.

    Podobnie nie dotyczy zrzutów ekranu wykonywanych klawiszem, ani
    przechwytywania obrazu przez rozwiązania pomocy zdalnej.

    Nie wymaga restartu ani zatrzymania usługi.

    Czego to nie psuje: pracy aplikacji, narzędzi nagrywających
    zainstalowanych osobno, zrzutów ekranu, pomocy zdalnej, sieci, usług.
    Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    On a server that mechanism is used by nothing. Switching it off changes the behaviour of no
    application, no service and no administrative tool.

    A distinction worth making concerns other ways of recording a screen. The item concerns solely the
    mechanism built into the entertainment layer. Screen-recording tools installed separately - used for
    instance for training or for documenting defects - work on, and this item does not concern them.

    Likewise it does not concern screenshots taken by a key, nor the capturing of a picture by
    remote-help solutions.

    Calls for no restart and no stopping of a service.

    What this does not break: the working of applications, separately installed recording tools,
    screenshots, remote help, the network, or services. There are no known regressions.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wbudowany mechanizm nagrywania obrazu ekranu przestaje działać wraz ze skrótem klawiszowym, który go uruchamiał
      - Narzędzia nagrywające ekran zainstalowane osobno działają dalej i punkt ich nie dotyczy
      - Zrzuty ekranu wykonywane klawiszem oraz przechwytywanie obrazu przez pomoc zdalną pozostają bez zmian
      - Praca aplikacji, usługi i sieć pozostają bez zmian
    en:
      - The built-in mechanism for recording the screen ceases to work along with the keyboard shortcut that started it
      - Screen-recording tools installed separately work on and the item does not concern them
      - Screenshots taken by a key and the capturing of a picture by remote help stay unchanged
      - The working of applications, services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wbudowany mechanizm nagrywania ekranu jest na tej maszynie używany do dokumentowania usterek albo do szkoleń
    en:
      - The built-in mechanism for recording the screen is used on this machine for documenting defects or for training
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
      $name = 'AllowGameDVR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    $name = 'AllowGameDVR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The mechanism sits in the entertainment layer by name, but what it can do
    # is record the screen and send the picture onward. That is worth shutting
    # wherever anybody works with data on the screen.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowGameDVR' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-gamedvr

notes:
  pl: |
    Punkt leży w bloku o warstwie rozrywkowej, ale wart jest wyjęcia z niego
    przy pokazywaniu, bo jego kategoria jest wyższa od sąsiadów i nie przez
    przypadek. Trzy poprzednie reguły dotyczą kodu bez zadania; ta dotyczy
    mechanizmu, który zadanie ma, i to zadanie polega na zdjęciu obrazu
    z ekranu i wysłaniu go dalej.

    Nazwa jest tu przeszkodą, którą aplikacja powinna usunąć. Punkt
    umieszczony w gałęzi o nazwie odsyłającej do rozrywki bywa czytany jako
    kosmetyczny, a jest jedynym w tym bloku, który zamyka drogę
    wyprowadzania danych.

    Rozróżnienie wobec narzędzi zainstalowanych osobno jest drugą rzeczą
    wartą pokazania. Obawa, że punkt odetnie dokumentowanie usterek albo
    nagrywanie szkoleń, prowadzi do odpuszczania go bez powodu.

    Kategoria średnia, a nie wysoka, odzwierciedla warunek dodatkowy:
    napastnik musi mieć już sesję na maszynie. Wtedy jednak zyskuje kanał
    działający bez wnoszenia czegokolwiek.
  en: |
    The item lies in the block about the entertainment layer, but is worth taking out of it in the
    showing, its category being higher than its neighbours' and not by chance. The three rules before
    concern code without a task; this one concerns a mechanism that has a task, and that task is the
    taking of a picture off the screen and the sending of it onward.

    The name is here an obstacle the application ought to remove. An item set in a branch whose name
    points at entertainment is at times read as cosmetic, and it is the only one in this block that shuts
    a road for carrying data out.

    The distinction from separately installed tools is the second thing worth showing. The fear that the
    item will cut off the documenting of defects or the recording of training leads to its being let go
    without cause.

    The medium category rather than a high one reflects a further condition: the attacker must already
    have a session on the machine. Then, though, they gain a channel working without anything being
    brought in.
