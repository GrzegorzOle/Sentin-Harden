id: win10-bitlocker-fixed-drives-write-protected

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Zapis na niezaszyfrowanych dyskach stałych zabroniony
    en: Writing to unencrypted fixed drives forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zapisu na dyskach stałych, które nie są
    zaszyfrowane.

    Reguła zamyka lukę, którą zostawiają wszystkie pozostałe punkty tej
    rodziny. Tamte opisują, jak ma wyglądać szyfrowanie dysku — ale nie
    przeszkadzają nikomu podłączyć drugiego dysku, nie zaszyfrować go
    i zapisywać na nim tego samego, co na dysku chronionym.

    W praktyce wygląda to zwyczajnie: ktoś dokłada dysk, przenosi na niego
    katalog z dokumentami, bo na systemowym zabrakło miejsca, i od tej
    chwili połowa danych leży poza ochroną. Nikt niczego nie obchodzi,
    nikt nie łamie zasady — zasada po prostu nie obejmowała tego nośnika.

    Zabronienie zapisu odwraca układ. Dysk niezaszyfrowany daje się
    odczytać, więc stare dane pozostają dostępne, ale nic nowego na nim nie
    osiądzie. Użytkownik, który chce na nim pisać, musi go najpierw
    zaszyfrować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośniki
    w tej samej maszynie, na które dane trafiają z pominięciem całej
    ochrony.
  en: |
    The setting forbids the writing to fixed drives that are not enciphered.

    The rule closes the gap every other item of this family leaves. Those set out how a drive's enciphering is to
    look - but hinder nobody from plugging a second drive in, leaving it unenciphered and writing upon it the same
    things as upon the guarded one.

    In practice it looks ordinary: somebody adds a drive, moves a folder of documents onto it, room having run
    short upon the system one, and from that hour half the data lies outside the guarding. Nobody goes round
    anything, nobody breaks the policy - the policy simply did not take that drive in.

    The forbidding of writing turns the arrangement about. An unenciphered drive may still be read, so old data
    stay within reach, but nothing new will settle upon it. A user who would write upon it has first to encipher
    it.

    What an attacker gains while the item goes unmet: drives in that same machine onto which data go past the
    whole of the guarding.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo skutek jest natychmiastowy
    i widoczny dla każdego, kto ma drugi dysk.

    Od chwili zapisania wartości każdy dysk stały bez szyfrowania staje się
    tylko do odczytu. Program, który na nim zapisuje, zgłosi błąd —
    i będzie to błąd zapisu, a nie komunikat o zasadzie, więc
    rozpoznanie przyczyny bywa trudne.

    Miejscami najbardziej narażonymi są dyski przeznaczone na dane
    robocze: udziały plikowe wystawiane z tej maszyny, katalogi kopii
    zapasowych, obszary na obrazy maszyn wirtualnych i pliki baz danych.
    Wszystkie one zwykle stoją na osobnym dysku i wszystkie przestaną
    przyjmować zapis.

    Odnotowuję, że sam odczyt pozostaje dostępny. Nie jest to więc utrata
    danych, tylko zatrzymanie zapisu — i to jest różnica warta
    zakomunikowania użytkownikom przed zmianą, a nie po.

    Kolejność wdrożenia jest tu jedyną sensowną: najpierw zaszyfrować
    dyski z danymi, dopiero potem wprowadzić ten zakaz.

    Czego to nie psuje: odczytu z dysków niezaszyfrowanych, pracy na dysku
    systemowym, logowania, drukowania.
  en: |
    The class is "needs a planned rollout", the consequence being at once and plain to anybody who has a second
    drive.

    From the hour the value is written every fixed drive without enciphering becomes readable only. A program
    writing upon it will report a fault - and it will be a fault of writing and not a word about a policy, so the
    telling of the cause is at times hard.

    The places most open to this are drives set aside for working data: file shares put out from this machine,
    folders of backups, room for images of virtual machines and files of bases. All of those commonly stand upon a
    drive apart, and all will cease to take writing.

    I set down that reading alone stays within reach. It is therefore no loss of data but a holding of writing -
    and that is a difference worth telling the users of before the change and not after.

    The order of the rollout is here the only sensible one: encipher the drives of data first, bring the forbidding
    in afterwards.

    What this does not break: reading from unenciphered drives, work upon the system drive, logging on, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Każdy dysk stały bez szyfrowania staje się tylko do odczytu od chwili zapisania wartości
      - Udziały plikowe, katalogi kopii zapasowych i obszary na obrazy maszyn wirtualnych przestają przyjmować zapis
      - Program zgłosi błąd zapisu, a nie komunikat o zasadzie, więc rozpoznanie przyczyny bywa trudne
      - Odczyt z dysków niezaszyfrowanych pozostaje dostępny, więc nie jest to utrata danych
      - Praca na dysku systemowym, logowanie, wydajność i drukowanie pozostają bez zmian
    en:
      - Every fixed drive without enciphering becomes readable only from the hour the value is written
      - File shares, folders of backups and room for images of virtual machines cease to take writing
      - A program will report a fault of writing and not a word about a policy, so the telling of the cause is at times hard
      - Reading from unenciphered drives stays within reach, so it is no loss of data
      - Work upon the system drive, logging on, speed and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dyski z danymi nie są jeszcze zaszyfrowane, a zakaz zatrzymałby zapis do udziałów i kopii zapasowych
      - Na maszynie stoją obrazy maszyn wirtualnych na osobnym nośniku, którego nie da się zaszyfrować przed zmianą
    en:
      - The drives of data are not yet enciphered and the forbidding would hold the writing to shares and backups
      - Upon the machine stand images of virtual machines on a drive apart that cannot be enciphered before the change
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'FDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'FDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value sits under the system hive, not under the policy hive where the
    # rest of this family lives - a difference easy to pass over when checking.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tej rodzinie jedyną, która wymusza szyfrowanie zamiast je
    opisywać. Wszystkie pozostałe mówią, jak ma wyglądać szyfrowanie już
    założone; ta sprawia, że nośnik bez szyfrowania przestaje być
    użyteczny do zapisu.

    Argument wart postawienia wprost dotyczy tego, jak powstaje luka.
    Nie powstaje przez obejście ani przez złą wolę — powstaje przez dołożenie
    dysku, czyli czynność zwyczajną, której nikt nie uznaje za zmianę
    w bezpieczeństwie. Zasada obejmująca tylko nośniki istniejące w chwili
    wdrożenia starzeje się z każdym takim dołożeniem.

    Odnotowuję położenie wartości w rejestrze, bo odbiega od reszty
    rodziny. Leży pod gałęzią systemową, nie pod gałęzią zasad, i sprawdzenie
    szukające jej w tym drugim miejscu nie znajdzie nic. Warto o tym
    pamiętać przy porównywaniu raportu z innym narzędziem.
  en: |
    The rule is the only one of this family that enforces enciphering rather than setting it out. All the rest say
    how enciphering already laid on is to look; this makes a drive without enciphering cease to be of use for
    writing.

    The argument worth putting outright touches how the gap comes about. It comes about by no going round and no
    ill will - it comes about by the adding of a drive, an ordinary doing nobody holds to be a change in safety. A
    policy taking in only the drives that were there at the hour of the rollout grows old with every such adding.

    I set down where the value lies in the registry, it standing apart from the rest of the family. It lies under
    the system hive and not under the hive of policies, and a check looking for it in the latter place will find
    nothing. It is worth holding in mind when a report is set against another tool.
