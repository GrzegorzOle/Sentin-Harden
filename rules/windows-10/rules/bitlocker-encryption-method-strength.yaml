id: win10-bitlocker-encryption-method-strength

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Metoda i siła szyfrowania dysków ustalona wprost
    en: The drive encryption method and strength settled explicitly
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa wprost, jakim sposobem i jak długim kluczem mają
    być szyfrowane dyski.

    Bez tego wpisu decyduje wartość domyślna systemu, a wartość domyślna
    zmienia się między wydaniami. Oznacza to, że dwie maszyny postawione
    w odstępie roku mogą szyfrować inaczej, choć obie pokażą się jako
    zaszyfrowane. Ustalenie wprost odbiera tę zmienność.

    Dla dysku systemowego i dysków stałych wybieram tryb blokowy
    z kluczem dłuższym. Jest to wariant mocniejszy i zarazem nowszy,
    a jego jedyne ograniczenie — nieczytelność na starszych systemach —
    nie dotyczy nośników, które z maszyny nie wychodzą.

    Dla nośników wymiennych zostaje tryb klasyczny. Tryb blokowy nie jest
    przez starsze systemy odczytywany wcale, a nośnik wymienny ma
    otwierać się w miejscach, nad którymi nikt nie panuje. Jest to jedyne
    miejsce w całej rodzinie, w którym świadomie wybieram wariant słabszy,
    i robię to dlatego, że mocniejszy oznaczałby nieczytelność.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szyfrowanie
    o sile ustalonej przez wartość domyślną, nieznaną osobie decydującej.
  en: |
    The setting names outright by what manner and with how long a key drives are to be enciphered.

    Without that entry the system's default value decides, and a default value changes between editions. That
    means two machines set up a year apart may encipher differently, though both will show as enciphered. A
    settling outright takes that changeableness away.

    For the system drive and for fixed drives I choose the block mode with the longer key. It is the stronger
    variant and withal the newer, and its one bound - being unreadable upon older systems - does not touch drives
    that never leave the machine.

    For removable media the classic mode remains. The block mode is not read by older systems at all, and a
    removable medium is to open in places nobody has a hand upon. It is the one place in the whole family where I
    knowingly choose the weaker variant, and I do so because the stronger would mean unreadability.

    What an attacker gains while the item goes unmet: an enciphering whose strength was settled by a default value
    unknown to whoever decided.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    nośniki wymienne mają wędrować do starszych systemów.

    Zmiana nie dotyka dysków już zaszyfrowanych. Te zachowują sposób,
    jakim je zaszyfrowano, a wpis obowiązuje przy zakładaniu ochrony.
    Skutek pojawia się więc dopiero przy następnym szyfrowaniu.

    Miejscem wartym uwagi jest wybrana dla nośników wymiennych wartość
    słabsza. Osoba czytająca raport może uznać ją za niedopatrzenie —
    i warto wyprzedzić to pytanie, bo wygląda dokładnie tak samo jak
    błąd. Wybór jest świadomy i wynika z tego, że nośnik nieczytelny nie
    chroni niczego, tylko przeszkadza.

    Odnotowuję, że tryb blokowy na dysku systemowym nie jest odczytywany
    przez starsze systemy. Ma to znaczenie przy odzyskiwaniu danych:
    podłączenie takiego dysku do starszej maszyny w celu ratowania plików
    nie zadziała, nawet z kluczem odzyskiwania w ręku.

    Czego to nie psuje: pracy z dyskami już zaszyfrowanymi, wydajności,
    odblokowywania, dostępu do plików, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether removable media are to travel to older
    systems.

    The change does not touch drives already enciphered. Those keep the manner they were enciphered by, the entry
    holding at the laying on of the guarding. The consequence therefore shows only at the next enciphering.

    The place worth marking is the weaker value chosen for removable media. Whoever reads the report may take it
    for an oversight - and it is worth getting ahead of that question, it looking exactly like a fault. The choice
    is a knowing one and follows from this, that an unreadable medium guards nothing and merely gets in the way.

    I set down that the block mode upon a system drive is not read by older systems. That counts at the winning
    back of data: the plugging of such a drive into an older machine to save files will not work, even with a key
    of recovery in hand.

    What this does not break: work with drives already enciphered, speed, unlocking, the way to files, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Dysk systemowy w trybie blokowym nie zostanie odczytany po podłączeniu do starszej maszyny
      - Ratowanie plików tą drogą nie zadziała nawet z kluczem odzyskiwania w ręku
      - Dla nośników wymiennych wybrana jest wartość słabsza i w raporcie wygląda to jak niedopatrzenie
      - Dyski już zaszyfrowane zachowują dotychczasowy sposób, bo wpis obowiązuje przy zakładaniu ochrony
      - Praca z dyskami już zaszyfrowanymi, wydajność, odblokowywanie i drukowanie pozostają bez zmian
    en:
      - A system drive in the block mode will not be read upon being plugged into an older machine
      - The saving of files by that road will not work even with a key of recovery in hand
      - For removable media the weaker value is chosen and in the report that looks like an oversight
      - Drives already enciphered keep the manner they had, the entry holding at the laying on of the guarding
      - Work with drives already enciphered, speed, unlocking and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Procedura ratowania danych opiera się na podłączaniu dysków do maszyny ze starszym systemem
    en:
      - The procedure for saving data rests upon the plugging of drives into a machine with an older system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. The system drive and
      # fixed drives take the block mode with a long key; removable media take the
      # classic mode, the block mode not being read by older systems. Whichever
      # value differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        EncryptionMethodWithXtsOs  = 7
        EncryptionMethodWithXtsFdv = 7
        EncryptionMethodWithXtsRdv = 4
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('EncryptionMethodWithXtsOs', 'EncryptionMethodWithXtsFdv', 'EncryptionMethodWithXtsRdv')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The three classes of drive do not take the same value. Removable media stay
    # upon the classic mode, that being the one older systems can read at all.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsOs' -Value 7 -Type DWord
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsFdv' -Value 7 -Type DWord
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsRdv' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest jedyną w tej rodzinie, w której trzy klasy nośników
    dostają różne wartości, i warto, żeby aplikacja wyjaśniła to przy
    samym punkcie. Bez wyjaśnienia wygląda to na niekonsekwencję.

    Argument wart zachowania dotyczy tego, po co ustalać coś, co i tak ma
    wartość domyślną. Wartość domyślna nie jest decyzją — jest tym, co
    zastano. Zmienia się przy wydaniach systemu i nie jest widoczna
    w raporcie, więc maszyna zgodna dzisiaj może być zgodna inaczej za rok,
    bez niczyjego udziału. Wpis wprost zamienia zastany stan w decyzję.

    Odnotowuję świadome osłabienie dla nośników wymiennych, bo jest tu
    wyjątkiem od całego kierunku tej paczki. Nośnik zaszyfrowany trybem,
    którego odbiorca nie odczyta, nie jest bezpieczniejszy — jest
    bezużyteczny, a bezużyteczny nośnik kończy jako plik przesłany inną,
    gorszą drogą.
  en: |
    The rule is the only one of this family in which the three classes of drive take different values, and it is
    well that the application set that out at the item itself. Unexplained it looks like an inconsistency.

    The argument worth keeping touches why anything should be settled that has a default value anyway. A default
    value is no decision - it is what was found in place. It changes with editions of the system and does not show
    in the report, so a machine compliant today may be compliant otherwise a year hence, with nobody's doing. An
    outright entry turns what was found into a decision.

    I set down the knowing weakening for removable media, it being here an exception to this pack's whole
    direction. A medium enciphered by a mode its receiver cannot read is no safer - it is of no use, and a medium
    of no use ends as a file sent by another and worse road.
