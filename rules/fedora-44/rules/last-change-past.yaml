id: fedora44-last-change-past

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.1.6
  section: Access Control > User Accounts and Environment > Configure shadow password suite parameters
  title:
    pl: Data ostatniej zmiany hasła nie leży w przyszłości
    en: Ensure all users last password change date is in the past
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Wiek hasła liczy się od daty ostatniej zmiany w /etc/shadow. Data
    w przyszłości sprawia, że hasło nie wygasa wtedy, kiedy powinno, a zasady
    minimalnego i maksymalnego wieku hasła przestają działać. Taka data
    bierze się zwykle ze złego zegara przy zmianie hasła albo z ręcznej
    edycji.

    Punkt wymaga, żeby żadne konto z hasłem nie miało daty ostatniej zmiany
    późniejszej niż dziś.
  en: |
    The age of a password counts from the date of the last change in
    /etc/shadow. A date in the future means the password does not expire
    when it should, and the minimum and maximum password age rules stop
    working. Such a date usually comes from a wrong clock during a password
    change or from editing by hand.

    The item requires that no account with a password has a last change
    date later than today.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/shadow.
  en: |
    Nobody will notice: the check only reads /etc/shadow.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/shadow ] || { echo "NOT_OK:shadow-unreadable"; exit 0; }
    today=$(( $(date +%s) / 86400 ))
    u=$(awk -F: -v t=$today '$2 !~ /^[!*]/ && $3 ~ /^[0-9]+$/ && $3 + 0 > t { printf "%s%s=%s", s, $1, $3; s = "," }' /etc/shadow)
    if [ -z "$u" ]; then echo "OK:no-future-dates"; else echo "NOT_OK:future=$u,today=$today"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man1/chage.1.html

notes:
  pl: |
    Sprawdzenie obejmuje konta, których pole hasła nie zaczyna się od ! ani
    *, tak jak CIS. Wynik NOT_OK podaje konta i datę jako liczbę dni od
    1 stycznia 1970 oraz dzisiejszy dzień w tej samej skali. Poprawia się to
    ręcznie: najlepiej nadać kontu nowe hasło albo ustawić datę poleceniem
    chage -d RRRR-MM-DD. Sprawdzenie wymaga odczytu /etc/shadow, więc bez
    uprawnień roota daje wynik NOT_OK z dopiskiem shadow-unreadable. Reguła
    tylko sprawdza stan.
  en: |
    The check covers accounts whose password field does not start with ! or
    *, as CIS does. The NOT_OK result gives the accounts and the date as a
    number of days since 1 January 1970, and today in the same scale. It is
    fixed by hand: best by giving the account a new password, or by setting
    the date with chage -d YYYY-MM-DD. The check needs to read /etc/shadow,
    so without root privileges it gives the NOT_OK result with a
    shadow-unreadable note. The rule only checks the state.
