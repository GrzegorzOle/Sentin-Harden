id: win11-diagnostic-log-collection-limited

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Zbieranie dzienników diagnostycznych ograniczone
    en: Collection of diagnostic logs limited
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza to, jakie dzienniki maszyny mogą zostać zebrane
    i wysłane w ramach diagnostyki.

    Warto rozróżnić dwie rzeczy, które łatwo pomylić. Dane diagnostyczne
    w wąskim sensie to zestaw liczników i zdarzeń o ustalonym kształcie:
    wersja składnika, kod błędu, czas. Zbieranie dzienników to co innego —
    to pobranie całych plików dziennika z maszyny, takich, jakie są, razem
    z tym, co akurat w nich stoi.

    A stoi w nich dużo. Dzienniki systemowe i aplikacyjne notują nazwy
    użytkowników, nazwy maszyn, ścieżki plików, adresy sieciowe, nazwy
    udziałów, identyfikatory sesji, czasem fragmenty zapytań i parametry
    wywołań. Nic z tego nie jest tajemnicą z osobna. Razem jest to opis tego,
    jak organizacja jest zbudowana i kto co robi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał, którym
    całe pliki dziennika opuszczają maszynę mechanizmem systemowym, bez
    czyjejkolwiek decyzji i bez widocznego zdarzenia. Ruch wygląda jak
    zwykła diagnostyka, bo nią jest.

    Ograniczenie zbierania nie wyłącza diagnostyki. Zawęża ją do danych
    o ustalonym kształcie zamiast plików o zawartości nieprzewidywalnej.
  en: |
    The setting limits which of the machine's logs may be collected and sent as part of
    diagnosis.

    Two things easily confused are worth telling apart. Diagnostic data in the narrow
    sense are a set of counters and events of a settled shape: a component's version, an
    error code, a time. Collecting logs is another matter - it is the taking of whole log
    files from the machine, as they are, along with whatever happens to stand in them.

    And much stands in them. System and application logs note user names, machine names,
    file paths, network addresses, share names, session identifiers, sometimes pieces of
    queries and parameters of calls. None of it is a secret on its own. Together it is a
    description of how an organisation is built and who does what.

    What an attacker gains while the item goes unmet: a channel by which whole log files
    leave the machine through a system mechanism, with nobody's decision and with no
    visible event. The traffic looks like ordinary diagnosis, because it is.

    Limiting the collection does not switch diagnosis off. It narrows it to data of a
    settled shape instead of files of unforeseeable content.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy obsługa zgłoszeń w organizacji opiera się na
    zbieraniu dzienników tą drogą — bo jeżeli tak, zmiana odbiera konkretną
    procedurę.

    Na stanowisku zwykłym zmiana jest niewidoczna. Dzienniki są prowadzone
    dalej i dostępne lokalnie bez żadnej zmiany; ograniczeniu podlega
    wyłącznie ich zbieranie mechanizmem diagnostycznym.

    Skutek pojawia się w kontakcie ze wsparciem producenta systemu. Procedura
    rozpoznania problemu bywa oparta właśnie na zebraniu dzienników
    i przesłaniu ich do analizy. Po zmianie trzeba będzie zebrać je ręcznie
    i przekazać osobno — czyli zrobić świadomie to, co dotąd działo się samo.

    Warto zauważyć, że z punktu widzenia tej reguły jest to skutek pożądany,
    a nie koszt uboczny. Cała jej treść polega na tym, żeby wyniesienie
    dzienników było decyzją, a nie procedurą w tle.

    Zmiana nie wymaga restartu. Praca użytkownika nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is whether the handling of cases in the organisation rests on
    collecting logs by this route - because if so, the change takes away a particular
    procedure.

    At an ordinary station the change is invisible. The logs go on being kept and are
    available locally with no change at all; what is limited is their collection by the
    diagnostic mechanism alone.

    The effect appears in dealings with the system maker's support. The procedure for
    recognising a problem sometimes rests on collecting the logs and sending them for
    analysis. After the change they will have to be gathered by hand and passed on apart -
    that is, done knowingly, where until now it happened of itself.

    It is worth noting that from this rule's point of view that is the desired effect
    rather than a side cost. Its whole content lies in making the carrying out of logs a
    decision rather than a background procedure.

    The change takes no restart. The user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
  what_breaks:
    pl:
      - Zbieranie całych plików dziennika mechanizmem diagnostycznym przestaje być możliwe
      - Zgłoszenie do wsparcia producenta wymaga zebrania dzienników ręcznie
      - Dzienniki są prowadzone dalej i dostępne lokalnie bez żadnej zmiany
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Collecting whole log files by the diagnostic mechanism stops being possible
      - A case with the maker's support takes gathering the logs by hand
      - The logs go on being kept and are available locally with no change at all
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Obsługa zgłoszeń opiera się na zbieraniu dzienników mechanizmem diagnostycznym
    en:
      - The handling of cases rests on collecting logs by the diagnostic mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LimitDiagnosticLogCollection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'LimitDiagnosticLogCollection' -ErrorAction SilentlyContinue).'LimitDiagnosticLogCollection'
    [pscustomobject]@{
      path        = $path
      name        = 'LimitDiagnosticLogCollection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitDiagnosticLogCollection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Reguła tworzy parę z tą, która ogranicza zbieranie zrzutów pamięci. Obie
    dotyczą tego samego: nie samych danych diagnostycznych, lecz wynoszenia
    z maszyny całych plików o zawartości, której nikt wcześniej nie oglądał.

    Ustawienie działa dopiero wtedy, gdy dane diagnostyczne są w ogóle
    wysyłane. Na maszynie z wyłączoną diagnostyką reguła nie ma czego
    ograniczać, ale warto ją wdrożyć — jeżeli zakres zostanie kiedyś
    poszerzony, ograniczenie będzie już na miejscu.

    Brak wartości nie jest stanem zgodnym, bo domyślnie zbieranie bywa
    dozwolone.
  en: |
    The rule forms a pair with the one limiting the collection of memory dumps. Both
    concern the same thing: not the diagnostic data themselves but the carrying out of the
    machine of whole files whose content nobody has looked at beforehand.

    The setting works only where diagnostic data are sent at all. On a machine with
    diagnosis switched off the rule has nothing to limit, but it is worth applying - if
    the range is ever widened, the limit will already be in place.

    A missing value is not a compliant state, since by default the collection is sometimes
    allowed.
