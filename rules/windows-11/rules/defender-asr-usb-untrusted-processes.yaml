id: win11-defender-asr-usb-untrusted-processes

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania niepodpisanych programów z nośników wymiennych
    en: Untrusted and unsigned processes from removable media blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Nośnik wymienny jest jedyną drogą wejścia, której nie widzi ani zapora, ani
    brama pocztowa, ani żaden filtr sieciowy. Plik przyniesiony na pamięci USB
    trafia na maszynę z pominięciem wszystkiego, co zbudowano na obrzeżu sieci.

    Reguła nie blokuje nośników ani odczytu z nich — blokuje uruchomienie
    programu, który z takiego nośnika pochodzi i nie ma ważnego podpisu.
    Kryterium podpisu jest tu istotne: oprogramowanie rozprowadzane oficjalnie
    jest podpisane, a to, co ktoś skądś skopiował, zwykle nie. Odczyt dokumentów,
    zdjęć i kopii z nośnika pozostaje bez zmian.
  en: |
    Removable media are the one entry route invisible to the firewall, the mail
    gateway and every network filter. A file carried in on a USB stick reaches the
    machine bypassing everything built at the edge of the network.

    The rule blocks neither the media nor reading from them - it blocks running a
    program that comes from such media and lacks a valid signature. The signature
    criterion matters here: officially distributed software is signed, while what
    somebody copied from somewhere usually is not. Reading documents, photos and
    backups from the medium is unaffected.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno pytanie: czy ktokolwiek uruchamia programy wprost
    z pamięci USB albo z dysku zewnętrznego.

    Odpowiedź częściej bywa twierdząca, niż się zakłada. Narzędzia przenośne
    trzymane na pendrivie przez osoby z działu wsparcia. Programy serwisowe
    dostarczane przez dostawcę na nośniku. Starsze oprogramowanie do urządzeń
    pomiarowych i laboratoryjnych, które w ogóle nie jest podpisane, bo powstało,
    zanim podpisywanie się przyjęło. Dysk zewnętrzny z własnym narzędziem do
    odtwarzania kopii — akurat to boli najbardziej, bo potrzebne jest wtedy, gdy
    już jest źle.

    Kopiowanie plików z nośnika i uruchamianie ich z dysku lokalnego działa bez
    zmian, więc obejście zwykle jest, tylko trzeba o nim wiedzieć wcześniej.
  en: |
    One question needs checking: whether anybody runs programs straight from a USB
    stick or an external drive.

    The answer is more often yes than assumed. Portable tools kept on a stick by
    support staff. Service programs delivered by a supplier on media. Older
    software for measuring and laboratory equipment that is not signed at all,
    because it predates signing becoming usual. An external drive with its own
    restore tool - that one hurts most, because it is needed exactly when things
    are already bad.

    Copying files off the medium and running them from the local disk works
    unchanged, so there usually is a way round, one just has to know about it in
    advance.

implementation_consequences:
  impact_areas:
    - removable-media
  what_breaks:
    pl:
      - Niepodpisane programy uruchamiane wprost z pamięci USB albo dysku zewnętrznego nie wystartują
      - Narzędzia przenośne trzymane na nośniku przez dział wsparcia przestaną działać w tej postaci
      - Narzędzie do odtwarzania kopii z dysku zewnętrznego może nie uruchomić się wtedy, gdy jest potrzebne
    en:
      - Unsigned programs run straight from a USB stick or external drive do not start
      - Portable tools kept on media by support staff stop working in that form
      - A restore tool on an external drive may fail to start exactly when it is needed
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dział wsparcia pracuje na narzędziach przenośnych uruchamianych z nośnika
      - Do maszyny podłączane są urządzenia pomiarowe z niepodpisanym oprogramowaniem na nośniku
      - Odtwarzanie kopii zapasowych opiera się na narzędziu uruchamianym z dysku zewnętrznego
    en:
      - Support staff work with portable tools run from media
      - Measuring equipment with unsigned software on media is attached to the machine
      - Backup restore relies on a tool run from an external drive
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Ten punkt nakłada się zakresem na zasady blokowania nośników wymiennych
    i na wyłączanie automatycznego uruchamiania, ale żadnego z nich nie zastępuje.
    Blokada nośnika odcina odczyt w ogóle; ta reguła zostawia odczyt i odbiera
    tylko uruchamianie. Dla stanowisk, na których dane przynosi się na pendrivie,
    to jedyny z tych trzech punktów, który w ogóle da się wdrożyć.
  en: |
    This item overlaps in scope with policies that block removable media and with
    turning off automatic running, but replaces neither. Blocking the medium cuts
    off reading altogether; this rule leaves reading and takes away only running.
    For workstations where data arrives on a stick it is the only one of the three
    that can be applied at all.
