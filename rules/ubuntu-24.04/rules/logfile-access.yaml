        function oct(s,  n, i) { n = 0; for (i = 1; i <= length(s); i++) n = n * 8 + substr(s, i, 1); return n }
        function clr(m, k,  r, b) { r = 0; for (b = 2048; b >= 1; b = int(b / 2)) if (int(m / b) % 2 && !(int(k / b) % 2)) r += b; return r }
        NF != 6 { next }
        {
          m = oct($1); u = $2 + 0; g = $3 + 0; un = $4; gn = $5; p = $6
          b = p; sub(/.*\//, "", b)
          if (b ~ /^(lastlog|wtmp|btmp)([.-].*)?$/ || b == "README") {
            mask = oct("7113"); ou = (u == 0); og = (g == 0 || gn == "utmp")
          } else if (b ~ /^(cloud-init\.log|localmessages|waagent\.log)/) {
            mask = oct("7133"); ou = (u == 0 || un == "syslog"); og = (g == 0 || gn == "adm")
          } else if (b ~ /^(secure|auth\.log|syslog|messages)([.-].*)?$/) {
            mask = oct("7137"); ou = (u == 0 || un == "syslog"); og = (g == 0 || gn == "adm")
          } else if (p ~ /^\/var\/log\/sssd\//) {
            mask = oct("7117"); ou = (u == 0 || un == "sssd"); og = (g == 0 || gn == "sssd")
          } else if (p ~ /^\/var\/log\/gdm3?\//) {
            mask = oct("7117"); ou = (u == 0); og = (g == 0 || gn ~ /^gdm3?$/)
          } else if (b ~ /\.journal~?$/) {
            mask = oct("7137"); ou = (u == 0); og = (g == 0 || gn == "systemd-journal")
          } else {
            mask = oct("7137"); ou = (u == 0 || un == "syslog" || (u < um && u != 65534))
            og = (g == 0 || gn == "adm" || (g < gm && g != 65534))
          }
          nm = clr(m, mask)
          if (nm == m && ou && og) next
          printf "%o %d %d %o %d %d\t%s\n", m, u, g, nm, (ou ? u : 0), (og ? g : 0), p
        }'
    }
    odd_name() { find /var/log -xdev -type f -name "*[$(printf '\t\n')]*" -print -quit 2>/dev/null; }
    denied() { find /var/log -xdev -type d \( ! -readable -o ! -executable \) -print -quit 2>/dev/null; }
    evaluate() {
      local bad n list r
      [ -d /var/log ] || { echo "NOT_OK:no-var-log"; return; }
      if [ -n "$(odd_name)" ]; then echo "NOT_OK:file-name-with-tab-or-newline"; return; fi
      bad=$(scan)
      if [ -n "$bad" ]; then
        n=$(printf '%s\n' "$bad" | wc -l)
        list=$(printf '%s\n' "$bad" | head -n 5 | awk -F'\t' '{ split($1, a, " "); printf "%s%s=%s:%s:%s", (NR > 1 ? "," : ""), $2, a[1], a[2], a[3] }')
        r="NOT_OK:files=$n:$list"
        [ "$n" -le 5 ] || r="$r,..."
      fi
      if [ -n "$(denied)" ]; then echo "${r:-NOT_OK:}${r:+,}needs-root"
      elif [ -n "$r" ]; then echo "$r"
      else echo "OK:$(find /var/log -xdev -type f 2>/dev/null | wc -l)-files"; fi
    }
      if [ -n "$(odd_name)" ]; then echo "A file under /var/log has a tab or newline in its name; fix it by hand" >&2; exit 1; fi
      s=$(scan)
      { echo format=logaccess-1; if [ -n "$s" ]; then printf '%s\n' "$s"; fi; } > "$b"
      chmod 600 "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=logaccess-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      lines=$(tail -n +2 "$b")
      if [ -n "$lines" ] && printf '%s\n' "$lines" | grep -vqE '^[0-7]+ [0-9]+ [0-9]+ [0-7]+ [0-9]+ [0-9]+	/var/log/'; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      if printf '%s\n' "$lines" | grep -q '/\.\./'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
    export LC_ALL=C
    # scan: files under /var/log with a wider mode, owner or group than allowed, as
    # "MODE UID GID NEWMODE NEWUID NEWGID<TAB>PATH"
    scan() {
      local um gm
      um=$(awk '$1 == "UID_MIN" { v = $2 } END { print (v ~ /^[0-9]+$/) ? v : 1000 }' /etc/login.defs 2>/dev/null)
      gm=$(awk '$1 == "GID_MIN" { v = $2 } END { print (v ~ /^[0-9]+$/) ? v : 1000 }' /etc/login.defs 2>/dev/null)
      find /var/log -xdev -type f -printf '%m\t%U\t%G\t%u\t%g\t%p\n' 2>/dev/null | awk -F'\t' -v um="${um:-1000}" -v gm="${gm:-1000}" '
        function oct(s,  n, i) { n = 0; for (i = 1; i <= length(s); i++) n = n * 8 + substr(s, i, 1); return n }
        function clr(m, k,  r, b) { r = 0; for (b = 2048; b >= 1; b = int(b / 2)) if (int(m / b) % 2 && !(int(k / b) % 2)) r += b; return r }
        NF != 6 { next }
        {
          m = oct($1); u = $2 + 0; g = $3 + 0; un = $4; gn = $5; p = $6
          b = p; sub(/.*\//, "", b)
          if (b ~ /^(lastlog|wtmp|btmp)([.-].*)?$/ || b == "README") {
            mask = oct("7113"); ou = (u == 0); og = (g == 0 || gn == "utmp")
          } else if (b ~ /^(cloud-init\.log|localmessages|waagent\.log)/) {
            mask = oct("7133"); ou = (u == 0 || un == "syslog"); og = (g == 0 || gn == "adm")
          } else if (b ~ /^(secure|auth\.log|syslog|messages)([.-].*)?$/) {
            mask = oct("7137"); ou = (u == 0 || un == "syslog"); og = (g == 0 || gn == "adm")
          } else if (p ~ /^\/var\/log\/sssd\//) {
            mask = oct("7117"); ou = (u == 0 || un == "sssd"); og = (g == 0 || gn == "sssd")
          } else if (p ~ /^\/var\/log\/gdm3?\//) {
            mask = oct("7117"); ou = (u == 0); og = (g == 0 || gn ~ /^gdm3?$/)
          } else if (b ~ /\.journal~?$/) {
            mask = oct("7137"); ou = (u == 0); og = (g == 0 || gn == "systemd-journal")
          } else {
            mask = oct("7137"); ou = (u == 0 || un == "syslog" || (u < um && u != 65534))
            og = (g == 0 || gn == "adm" || (g < gm && g != 65534))
          }
          nm = clr(m, mask)
          if (nm == m && ou && og) next
          printf "%o %d %d %o %d %d\t%s\n", m, u, g, nm, (ou ? u : 0), (og ? g : 0), p
        }'
    }
    odd_name() { find /var/log -xdev -type f -name "*[$(printf '\t\n')]*" -print -quit 2>/dev/null; }
    denied() { find /var/log -xdev -type d \( ! -readable -o ! -executable \) -print -quit 2>/dev/null; }
    evaluate() {
      local bad n list r
      [ -d /var/log ] || { echo "NOT_OK:no-var-log"; return; }
      if [ -n "$(odd_name)" ]; then echo "NOT_OK:file-name-with-tab-or-newline"; return; fi
      bad=$(scan)
      if [ -n "$bad" ]; then
        n=$(printf '%s\n' "$bad" | wc -l)
        list=$(printf '%s\n' "$bad" | head -n 5 | awk -F'\t' '{ split($1, a, " "); printf "%s%s=%s:%s:%s", (NR > 1 ? "," : ""), $2, a[1], a[2], a[3] }')
        r="NOT_OK:files=$n:$list"
        [ "$n" -le 5 ] || r="$r,..."
      fi
      if [ -n "$(denied)" ]; then echo "${r:-NOT_OK:}${r:+,}needs-root"
      elif [ -n "$r" ]; then echo "$r"
      else echo "OK:$(find /var/log -xdev -type f 2>/dev/null | wc -l)-files"; fi
    }
    restore() {
      local s p om ou og nm nu ng cur n=0 k=0
      while IFS=$'\t' read -r s p; do
        [ -n "$p" ] || continue
        read -r om ou og nm nu ng <<< "$s"
        [ -f "$p" ] && [ ! -L "$p" ] || continue
        cur=$(stat -c '%a %u %g' -- "$p")
        if [ "$cur" = "$nm $nu $ng" ]; then
          chown -- "$ou:$og" "$p"; chmod -- "$om" "$p"; n=$((n + 1))
        elif [ "$cur" != "$om $ou $og" ]; then
          echo "Kept $p: changed since the remediation ($cur)"; k=$((k + 1))
        fi
      done <<< "$1"
      echo "Restored the mode and owner of $n files"
    }
      if [ -n "$(odd_name)" ]; then echo "A file under /var/log has a tab or newline in its name; fix it by hand" >&2; exit 1; fi
      s=$(scan)
      if [ -z "$s" ]; then echo "Already meets the item, nothing to change"; exit 0; fi
      while IFS= read -r l; do
        printf '%s\n' "$lines" | grep -qxF -- "$l" || { echo "Not in the backup, run the backup again: ${l#*	}" >&2; exit 1; }
      done <<< "$s"
      n=0
      while IFS=$'\t' read -r st p; do
        read -r om ou og nm nu ng <<< "$st"
        if [ "$ou $og" != "$nu $ng" ]; then chown -- "$nu:$ng" "$p"; fi
        chmod -- "$nm" "$p"
        n=$((n + 1))
      done <<< "$s"
      echo "Corrected the mode or owner of $n files under /var/log"
      s=$(scan)
      if [ -n "$s" ]; then
        restore "$lines" >/dev/null
        echo "Files are still too open after the change; restored the previous state:" >&2
        printf '%s\n' "$s" | head -n 5 >&2; exit 1
      fi
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=logaccess-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      lines=$(tail -n +2 "$b")
      if [ -n "$lines" ] && printf '%s\n' "$lines" | grep -vqE '^[0-7]+ [0-9]+ [0-9]+ [0-7]+ [0-9]+ [0-9]+	/var/log/'; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      if printf '%s\n' "$lines" | grep -q '/\.\./'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
    restore() {
      local s p om ou og nm nu ng cur n=0 k=0
      while IFS=$'\t' read -r s p; do
        [ -n "$p" ] || continue
        read -r om ou og nm nu ng <<< "$s"
        [ -f "$p" ] && [ ! -L "$p" ] || continue
        cur=$(stat -c '%a %u %g' -- "$p")
        if [ "$cur" = "$nm $nu $ng" ]; then
          chown -- "$ou:$og" "$p"; chmod -- "$om" "$p"; n=$((n + 1))
        elif [ "$cur" != "$om $ou $og" ]; then
          echo "Kept $p: changed since the remediation ($cur)"; k=$((k + 1))
        fi
      done <<< "$1"
      echo "Restored the mode and owner of $n files"
    }
      restore "$lines"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man1/chmod.1.html
  - https://refspecs.linuxfoundation.org/FHS_3.0/fhs/ch05s10.html

notes:
  pl: |
    Sprawdzenie przegląda wszystkie zwykłe pliki pod /var/log na tym samym
    systemie plików. Za konto i grupę systemową uznaje identyfikatory poniżej
    UID_MIN i GID_MIN z /etc/login.defs, z wyjątkiem nobody. Wynik NOT_OK
    podaje liczbę plików i do pięciu przykładów z prawami, UID i GID. Bez
    uprawnień roota części katalogów, na przykład /var/log/private, nie da
    się przejrzeć, więc wynik kończy się dopiskiem needs-root.

    Na świeżo zainstalowanym Ubuntu test zgłasza pliki z trybem 0644, między
    innymi dpkg.log, alternatives.log i apt/history.log. logrotate tworzy
    nowe dpkg.log i alternatives.log z trybem 0644 (dyrektywa create 644
    root root w /etc/logrotate.d/dpkg i alternatives), więc po rotacji test
    może je zgłosić ponownie. Reguła nie zmienia konfiguracji logrotate, bo
    należy ona do punktu 6.1.3.8, sprawdzanego ręcznie.

    Naprawa odejmuje nadmiarowe prawa (chmod) i ustawia roota jako
    właściciela albo grupę tylko tam, gdzie obecne są niedozwolone. Kopia
    zapasowa zapisuje poprzednie prawa, UID i GID zmienianych plików.
    Wycofanie przywraca je tylko plikom, które nadal mają stan ustawiony przez
    naprawę; pliki zmienione od tego czasu wymienia i zostawia. Nazwy plików
    z tabulatorem albo znakiem nowego wiersza powodują odmowę.
  en: |
    The check goes through all regular files under /var/log on the same file
    system. It treats IDs below UID_MIN and GID_MIN from /etc/login.defs as
    system accounts and groups, except nobody. The NOT_OK result gives the
    number of files and up to five examples with the mode, UID and GID.
    Without root privileges some directories, for example /var/log/private,
    cannot be read, so the result ends with a needs-root note.

    On a freshly installed Ubuntu the test reports files with mode 0644,
    among them dpkg.log, alternatives.log and apt/history.log. logrotate
    creates new dpkg.log and alternatives.log files with mode 0644 (the
    create 644 root root directive in /etc/logrotate.d/dpkg and
    alternatives), so after a rotation the test may report them again. The
    rule does not change the logrotate configuration, because it belongs to
    item 6.1.3.8, which is checked by hand.

    The remediation removes the excess permissions (chmod) and sets root as
    the owner or group only where the current one is not allowed. The backup
    saves the previous mode, UID and GID of the changed files. Rollback
    restores them only for files that still have the state set by the
    remediation; it names and leaves files changed since then. File names
    with a tab or newline cause a refusal.
