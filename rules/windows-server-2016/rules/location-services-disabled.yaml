id: win2016-location-services-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Location and Sensors
  title:
    pl: Ustalanie położenia maszyny wyłączone
    en: Establishing the machine's position switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza udostępnianie aplikacjom informacji o położeniu
    maszyny.

    Wartość tej reguły na serwerze jest niewielka i nie ma powodu udawać
    inaczej. Serwer stoi tam, gdzie stoi, przez lata, a jego położenie nie
    jest tajemnicą dla nikogo, kto zna organizację.

    Argument, który zostaje, jest węższy i dotyczy zestawiania. Położenie
    jest kolejnym trwałym faktem o maszynie, obok identyfikatora w profilu
    i spisu zainstalowanego oprogramowania. Żaden z tych faktów osobno nic
    nie znaczy; razem pozwalają powiązać maszynę z miejscem, a miejsce
    z ludźmi i z porami ich pracy.

    Rzecz druga dotyczy tego, czym położenie jest ustalane. Nie jest to
    zwykle odbiornik nawigacji, tylko widziane sieci bezprzewodowe
    i adresy. Znaczy to, że ustalanie położenia jest po cichu
    rozpoznaniem otoczenia sieciowego maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kolejny
    trwały fakt o maszynie, przydatny wyłącznie w zestawieniu z innymi.
  en: |
    The setting switches off the making available to applications of the machine's position.

    This rule's value on a server is a small one and there is no cause to pretend otherwise. A server stands
    where it stands for years, and its position is no secret to anybody who knows the organisation.

    The argument that remains is narrower and concerns the joining together. A position is one more lasting
    fact about the machine, beside the identifier in the profile and the inventory of installed software. None
    of those facts means anything apart; together they let the machine be tied to a place, and the place to
    people and to the hours of their work.

    The second matter concerns what the position is established by. It is as a rule no navigation receiver but
    the wireless networks in sight and the addresses. That means the establishing of a position is quietly a
    survey of the machine's network surroundings.

    What an attacker gains while the item goes unmet: one more lasting fact about the machine, of use solely in
    a joining with others.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Aplikacje pytające o położenie dostają odmowę. Na serwerze takich
    aplikacji zwykle nie ma, a jeśli są, to położenie służy im do
    dobierania strefy czasowej albo treści — i obie te rzeczy da się
    ustawić wprost.

    Nie ma znanych regresji.

    Czego to nie psuje: strefy czasowej ustawionej ręcznie, synchronizacji
    czasu, sieci bezprzewodowej, ról serwera, usług systemowych, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    Applications asking for a position get a refusal. On a server there are as a rule no such applications, and
    if there are, the position serves them for choosing a time zone or content - and both those things can be
    set outright.

    There are no known regressions.

    What this does not break: a time zone set by hand, the synchronising of time, the wireless network, the
    server's roles, system services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Aplikacje pytające o położenie dostają odmowę zamiast współrzędnych
      - Automatyczne dobieranie strefy czasowej po położeniu przestaje działać i strefę trzeba ustawić wprost
      - Strefa czasowa ustawiona ręcznie i synchronizacja czasu pozostają bez zmian
      - Sieć bezprzewodowa, role serwera i usługi systemowe pozostają bez zmian
    en:
      - Applications asking for a position get a refusal instead of coordinates
      - The choosing of a time zone by position ceases to work and the zone has to be set outright
      - A time zone set by hand and the synchronising of time stay unchanged
      - The wireless network, the server roles and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja, która bez położenia nie dobierze wymaganej strefy albo regionu
    en:
      - An application works on the machine that without a position will not choose the required zone or region
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
      $name = 'DisableLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    $name = 'DisableLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This records the decision. The companion item stops the service that does
    # the work; a vendor installer or an added role can put a startup type
    # back, but it will not undo this entry.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Punkt jest trzeci w bloku i najwęższy. Opis powinien to przyznać,
    zamiast dorabiać mu wagę.

    Argument, który go broni, jest ten sam co przy identyfikatorze
    w profilu i przy spisie oprogramowania: pojedynczy trwały fakt nic
    nie znaczy, zestawienie faktów znaczy. Warto, żeby aplikacja
    pokazywała te reguły jako rodzinę, bo osobno każda wygląda na
    drobiazg, a wspólne rozumowanie je tłumaczy.

    Rzecz warta odnotowania dotyczy sposobu ustalania położenia. Serwer
    nie ma odbiornika nawigacji, więc położenie bierze się z widzianych
    sieci bezprzewodowych. Ustalanie położenia jest więc przy okazji
    rozpoznaniem otoczenia sieciowego, i to jest mocniejszy argument niż
    sama mapa.

    Reguła zapisuje decyzję; osobny punkt zatrzymuje usługę, która to
    wykonuje. Wyglądają na powtórzenie i kusi, żeby jeden pominąć —
    niesłusznie, bo instalator albo dodana rola potrafi przywrócić typ
    uruchomienia usługi, a tego wpisu nie cofnie.
  en: |
    The item is the third in the block and the narrowest. The description ought to own that rather than get up a
    weight for it.

    The argument defending it is the same as at the identifier in the profile and at the inventory of software:
    a single lasting fact means nothing, a joining of facts means much. It is well that the application show
    those rules as a family, apart each looking a trifle while the shared reasoning explains them.

    Worth noting a matter touching the way a position is established. A server has no navigation receiver, so
    the position is taken from the wireless networks in sight. The establishing of a position is therefore in
    passing a survey of the network surroundings, and that is a stronger argument than the map itself.

    The rule records the decision; a separate item stops the service that does the work. They look a repetition
    and it is tempting to leave one out - wrongly, an installer or an added role being able to put back the
    service's startup type, while this entry it will not undo.
