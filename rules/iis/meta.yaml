id: iis
nazwa: IIS
rodzina: windows
powloka: powershell
profil: aplikacja

# NAKŁADKA, nie samodzielny cel.
# IIS audytuje się ZAWSZE razem z systemem, na którym stoi. Paczka hosta
# (windows-server-2016 albo windows-server-2025) obowiązuje w całości, a ta
# dokłada punkty aplikacyjne. Raport ma pokazywać oba zestawy łącznie.
typ: nakladka
wymaga_hosta:
  - windows-server-2016
  - windows-server-2025

benchmark:
  nazwa: CIS Microsoft IIS Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    if (Get-Service -Name W3SVC -ErrorAction SilentlyContinue) {
      $v = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\InetStp' -ErrorAction SilentlyContinue).VersionString
      'OBECNY|{0}' -f $v
    } else {
      'BRAK'
    }
  dopasowanie: '^OBECNY'

uwagi: |
  Zakres zmian bywa szerszy niż sam serwer: część ustawień działa na poziomie
  całego serwera, część na poziomie pojedynczej witryny lub puli aplikacji.
  Reguła musi jasno mówić, który poziom modyfikuje — inaczej kopia zapasowa
  obejmie niewłaściwy zakres, a wycofanie nie przywróci stanu.

  Kopia konfiguracji IIS to nie plik do skopiowania ręcznie — służy do tego
  mechanizm backupu konfiguracji serwera. Reguły mają z niego korzystać zamiast
  kopiować applicationHost.config na boku.
