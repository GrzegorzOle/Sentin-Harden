id: win2016-application-log-size

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Application
  title:
    pl: Maksymalny rozmiar dziennika aplikacji
    en: Maximum size of the application log
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę pojemności dziennika aplikacji.

    Dziennik ten zbiera zdarzenia zgłaszane przez oprogramowanie, a nie przez
    podsystem zabezpieczeń. Jego wartość dla bezpieczeństwa jest pośrednia
    i trzeba to powiedzieć uczciwie: nie znajdzie się w nim zapisu logowania
    ani zmiany uprawnień.

    Znajdzie się natomiast kontekst. Awaria usługi tuż przed podejrzanym
    logowaniem, błąd aplikacji sieciowej powtarzający się w regularnych
    odstępach, nieudane uruchomienie składnika — to są rzeczy, które
    w dochodzeniu tłumaczą, jak doszło do tego, co widać w dzienniku
    zabezpieczeń. Ślad wykorzystania luki w aplikacji bywa właśnie tutaj,
    w postaci błędu, którego nikt nie czytał.

    Kategoria niska, bo punkt nie zdejmuje żadnego konkretnego ryzyka.
    Wartość leży w spójności: dziennik, który obraca się w godziny, nie da się
    zestawić z dziennikiem zabezpieczeń obejmującym tydzień.

    Wartość wymagana jest skromna i taka ma być. Dziennik aplikacji nie musi
    być duży — musi sięgać tak daleko wstecz, żeby dało się go zestawić z
    dziennikiem zabezpieczeń.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: utratę kontekstu
    technicznego, który tłumaczyłby, jak doszło do zdarzeń widocznych gdzie
    indziej.
  en: |
    The item sets a lower bound on the application log's capacity.

    That log gathers events reported by software rather than by the security
    subsystem. Its worth for security is indirect and that has to be said honestly:
    no record of a sign-in or of a change of rights will be found in it.

    What will be found is context. A service failing just before a suspect sign-in,
    an error in a network application recurring at regular intervals, a component
    failing to start - these are things that in an inquiry explain how what shows in
    the security log came about. The trace of a vulnerability in an application
    being exploited is often exactly here, as an error nobody read.

    The category is low, because the item lifts no particular risk. Its worth lies
    in consistency: a log turning over within hours cannot be set beside a security
    log covering a week.

    The required value is modest and so it should be. The application log need not
    be large - it needs to reach far enough back to be set beside the security log.

    What an attacker gains while the item goes unmet: the loss of the technical
    context that would explain how the events visible elsewhere came about.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zwiększenie pojemności dziennika aplikacji zajmuje
    miejsce na dysku i nic poza tym; miejsce rezerwowane jest stopniowo.

    Wartość wymagana jest na tyle niska, że nawet na ciasno wymierzonym
    woluminie systemowym nie stanowi problemu. Jest to jeden z najtańszych
    punktów w całej paczce.

    Nic przy tym nie przestaje działać. Aplikacje zgłaszają zdarzenia tak samo,
    narzędzia czytają dziennik tak samo, zbieracz dostaje to samo.

    Czego to nie psuje: zgłaszania zdarzeń przez aplikacje, odczytu dziennika,
    przekazywania zdarzeń poza maszynę ani wydajności.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Enlarging the application log's capacity takes
    room on a disk and nothing besides; the room is claimed gradually.

    The required value is low enough to pose no problem even on a tightly measured
    system volume. It is one of the cheapest items in the whole pack.

    Nothing stops working while this goes on. Applications report events as before,
    tools read the log as before, the collector receives the same.

    What this does not break: the reporting of events by applications, the reading
    of the log, the forwarding of events off the machine, or performance.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zwiększenie pojemności jest zajęciem miejsca na dysku i niczym poza tym
      - Wartość wymagana jest na tyle niska, że nie stanowi problemu nawet na ciasno wymierzonym woluminie
      - Aplikacje zgłaszają zdarzenia tak samo, a narzędzia czytają dziennik bez zmian
      - Przekazywanie zdarzeń poza maszynę i wydajność pozostają nietknięte
    en:
      - No regression in the working - enlarging the capacity is the taking of disk room and nothing besides
      - The required value is low enough to pose no problem even on a tightly measured volume
      - Applications report events as before and tools read the log unchanged
      - The forwarding of events off the machine and performance stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — wymagana pojemność jest niewielka i mieści się nawet przy małym zapasie miejsca
    en:
      - No known contraindication - the required capacity is small and fits even with little spare room
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog Application -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The point is not size but reach: the log has to go back far enough to be set
    # beside the security log covering the same span.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/eventlog/event-logging

notes:
  pl: |
    Punkt należy do klasy „zrób przy okazji" i tak powinien być pokazany.
    Nie zdejmuje ryzyka i nie należy go przedstawiać, jakby zdejmował.

    Jego sens ujawnia się dopiero w zestawieniu. Dochodzenie prowadzi się na
    kilku dziennikach naraz, a dziennik o krótszym zasięgu niż pozostałe
    urywa wszystkie wątki w tym samym miejscu.

    Porównanie jest typu „nie mniej niż", więc maszyna z dziennikiem większym
    niż wymagany jest zgodna.
  en: |
    The item belongs to the "do it in passing" class and should be shown as such. It
    lifts no risk and should not be presented as though it did.

    Its sense comes out only in the pairing. An inquiry is carried out across
    several logs at once, and a log of shorter reach than the others cuts every
    thread off at the same place.

    The comparison is of the "not less than" kind, so a machine with a log larger
    than required is compliant.
