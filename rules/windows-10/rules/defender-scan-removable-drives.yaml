id: win10-defender-scan-removable-drives

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Scan
  title:
    pl: Skanowanie nośników wymiennych przy skanowaniu pełnym
    en: Removable drives scanned during a full scan
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza nośniki wymienne do zakresu skanowania pełnego.

    Nośnik wymienny jest jedyną drogą wejścia, która nie przechodzi przez
    sieć. Nie widzi jej zapora, nie widzi filtr poczty i nie widzi żaden
    mechanizm patrzący na ruch. Jest to również droga, w której nośnik
    wraca z zewnątrz i zostaje podłączony przez kogoś, kto działa w dobrej
    wierze.

    Plik złośliwy leżący na pamięci przenośnej bywa tam od dawna
    i przez wszystkie te miesiące nie był sprawdzany nigdzie. Skanowanie
    pełne obejmujące nośniki jest jedynym momentem, w którym ktokolwiek
    w niego zagląda.

    Odnotowuję, czego ta reguła nie robi. Nie sprawdza nośnika w chwili
    podłączenia — tym zajmuje się ochrona w czasie rzeczywistym. Ta
    obejmuje przegląd okresowy, czyli to, co leży na nośniku podłączonym
    w chwili skanowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośnik
    przenoszony między maszynami i nieobjęty żadnym przeglądem.
  en: |
    The setting brings removable drives into the reach of a full scan.

    A removable drive is the one road of entry that does not go through the network. The firewall does not see
    it, the post's filter does not see it, and no mechanism looking at traffic sees it. It is likewise the road
    upon which a drive comes back from outside and is plugged in by somebody acting in good faith.

    A malicious file lying upon a portable memory has at times been there long, and through all those months was
    checked nowhere. A full scan taking in removable drives is the one moment at which anybody looks into it at
    all.

    I set down what this rule does not do. It does not check a drive at the hour of plugging in - that is real-time
    protection's business. This takes in the periodic review, which is to say what lies upon a drive plugged in
    at the hour of the scan.

    What an attacker gains while the item goes unmet: a drive carried between machines and taken in by no review.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Skanowanie pełne idzie w tle i nie zatrzymuje pracy. Objęcie nim
    nośników wydłuża je o czas potrzebny na przejście ich zawartości.

    Odnotowuję miejsce, w którym bywa widoczne: dysk zewnętrzny
    z kopiami zapasowymi, podłączony na stałe. Skanowanie pełne przechodzi
    wtedy terabajty, a czas jego trwania rośnie z godzin do kilkunastu
    godzin. Na maszynie wyłączanej na noc skanowanie bywa przez to
    przerywane i nigdy nie kończy się w całości.

    Odpowiedzią jest wyłączenie wskazanego dysku ze skanowania albo
    odłączanie go poza godzinami pracy — nie wyłączenie mechanizmu dla
    wszystkich nośników.

    Druga rzecz warta odnotowania: nośnik podłączony po rozpoczęciu
    skanowania nie zostanie nim objęty. Przegląd dotyczy stanu z chwili
    startu.

    Czego to nie psuje: podłączania nośników, kopiowania z nich i na nie,
    logowania, udziałów plikowych, drukowania.
  en: |
    The class is "no disruption".

    A full scan goes on in the background and stops no work. The bringing of drives into it draws it out by the
    time needed to go through their contents.

    I set down the place at which it shows at times: an outside disk with backups, plugged in for good. The full
    scan goes then through terabytes, and the time it takes grows from hours to a dozen hours. Upon a machine
    switched off for the night the scan is by that at times broken off and never ends whole.

    The answer is the leaving of the named disk out of the scan, or the unplugging of it outside working hours -
    not the switching off of the mechanism for every drive.

    A second thing worth setting down: a drive plugged in after the scan has begun will not be taken into it. The
    review touches the state at the hour of starting.

    What this does not break: the plugging in of drives, the copying from them and to them, logging on, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
  what_breaks:
    pl:
      - Dysk zewnętrzny z kopiami zapasowymi podłączony na stałe wydłuża skanowanie pełne z godzin do kilkunastu godzin
      - Na maszynie wyłączanej na noc skanowanie bywa przez to przerywane i nigdy nie kończy się w całości
      - Nośnik podłączony po rozpoczęciu skanowania nie zostanie nim objęty, bo przegląd dotyczy stanu z chwili startu
      - Reguła nie sprawdza nośnika w chwili podłączenia, bo tym zajmuje się ochrona w czasie rzeczywistym
      - Podłączanie nośników, kopiowanie z nich i na nie, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - An outside disk with backups plugged in for good draws a full scan out from hours to a dozen hours
      - Upon a machine switched off for the night the scan is by that at times broken off and never ends whole
      - A drive plugged in after the scan has begun will not be taken into it, the review touching the state at the starting
      - The rule does not check a drive at the hour of plugging in, that being real-time protection s business
      - The plugging in of drives, the copying from them and to them, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny jest podłączony na stałe dysk z kopiami liczony w terabajtach i skanowanie pełne nie zdąży się skończyć
    en:
      - A disk with backups counted in terabytes is plugged into the machine for good and a full scan will not have time to end
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableRemovableDriveScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableRemovableDriveScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is a negative one, so the compliant value is a nought: the scanning
    # of removable drives is not switched off.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRemovableDriveScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Reguła domyka trójkę opisującą zasięg skanowania. Archiwa, skrzynki
    pocztowe i nośniki wymienne to trzy miejsca, w które ochrona domyślnie
    nie zagląda albo zagląda niepełnie.

    Argument wart postawienia wprost dotyczy tego, czego nie widzi nic
    innego. Nośnik wymienny nie przechodzi przez sieć, więc żaden
    mechanizm patrzący na ruch go nie opisze. Jest to jedyna droga wejścia,
    wobec której skanowanie na maszynie jest nie uzupełnieniem, lecz
    jedynym sprawdzeniem.

    Odnotowuję podział pracy z ochroną w czasie rzeczywistym, bo bez tego
    punkt wygląda na jej powtórzenie. Tamta sprawdza plik w chwili
    otwarcia, czyli wtedy, gdy ktoś po niego sięgnie. Ta obejmuje
    przegląd tego, po co nikt nie sięgnął — a właśnie tam plik leży
    najdłużej.
  en: |
    The rule closes the three that describe the scan's reach. Archives, mailboxes and removable drives are the
    three places the protection by default either does not look into or looks into but in part.

    The argument worth putting outright touches what nothing else sees. A removable drive does not go through the
    network, so no mechanism looking at traffic will describe it. It is the one road of entry against which the
    scan upon the machine is not a rounding out but the only check.

    I set down the parting of work with real-time protection, without which the item looks like a repeating of
    it. That one checks a file at the hour of opening, which is to say when somebody reaches for it. This takes
    in the review of what nobody reached for - and it is just there that a file lies the longest.
