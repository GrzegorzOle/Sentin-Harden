id: win10-rdp-com-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów szeregowych w sesji pulpitu zdalnego wyłączone
    en: The turning of doors in series into the session of the desk from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania udostępniania sesji zdalnej portów szeregowych
    maszyny, z której użytkownik się łączy.

    Port szeregowy jest dziś rzadkością, ale nie zniknął. Obsługuje
    urządzenia pomiarowe, kasy, wagi, sterowniki przemysłowe i sprzęt
    serwisowy, a na maszynach nowych bywa dostępny przez przejściówkę.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Nie jest to
    droga wynoszenia dokumentów ani wnoszenia programów; przepustowość
    i sposób działania na to nie pozwalają.

    Znaczenie ma to, że przekierowanie ładuje w sesji zdalnej warstwę
    obsługi portu, a warstwa ta jest niesprawdzana, bo używana rzadko.
    Dochodzi do tego ta sama zasada co przy urządzeniach: obcy sprzęt
    powoduje działanie kodu na maszynie, do której został tylko
    wskazany.

    Odnotowuję, że na stanowisku roboczym punkt jest zwykle bezkosztowy,
    bo nikt portu szeregowego nie przekierowuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    — rzadko sprawdzaną warstwę obsługi portu w sesji zdalnej.
  en: |
    The setting forbids the giving out to the session from afar of the doors in series of the machine the user
    joins themselves from.

    A door in series is today a rare thing, but it has not gone. It serves gear of measure, tills, scales,
    steerers of works and gear of service, and upon new machines is at times to be had through a piece of passage.

    The grading is low and the item is to be put forward as such. It is no road for the carrying out of papers nor
    the carrying in of programs; the breadth of the passage and the manner of its working allow it not.

    What has weight is that the turning loads within the session from afar a layer backing the door, and that
    layer is unlooked-over, being seldom used. There comes to it the same rule as at things: strange gear brings
    about the working of code upon a machine to which it was only pointed.

    I set down that upon a station of work the item is commonly without cost, nobody turning a door in series in.

    What an attacker gains while the item goes unmet: little - a seldom looked-over layer backing a door within
    the session from afar.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na większości stanowisk sprawdzenie
    kończy się stwierdzeniem, że nikt tego nie używa.

    Miejscem wartym uwagi są programy branżowe obsługujące urządzenie
    przyłączone do maszyny użytkownika, a uruchamiane w sesji zdalnej.
    Kasy fiskalne, wagi i sterowniki bywają obsługiwane właśnie tak,
    a przekierowanie portu jest wtedy jedyną drogą.

    Miejscem drugim jest sprzęt serwisowy, w którym konfiguracja idzie
    łączem szeregowym przez przejściówkę. Technik pracujący w sesji
    zdalnej straci dostęp do urządzenia leżącego przed nim.

    Odnotowuję, że jest to zwykle przypadek pojedynczy, dotyczący kilku
    stanowisk, a nie całej organizacji. Właściwym rozwiązaniem jest
    wyjątek dla tych stanowisk, a nie odpuszczenie punktu wszędzie.

    Skutek jest widoczny natychmiast, w postaci braku portu w sesji.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: portów maszyny zdalnej, sesji jako takich, pracy
    programów, logowania, drukowania.
  en: |
    The class is "needs review", though upon most stations the review ends in the finding that nobody uses it.

    The place worth notice is programs of a trade serving a thing joined to the user's machine and set going
    within the session from afar. Tills, scales and steerers are at times served just so, and the turning of the
    door is then the one road.

    The second place is gear of service whose setting goes by a link in series through a piece of passage. A
    craftsman working in a session from afar will lose the reach of a thing lying before them.

    I set down that it is commonly a single case, touching a few stations and not the whole body. The right answer
    is an exception for those stations and not the letting go of the item everywhere.

    The consequence is seen at once, in the shape of the door's absence within the session.

    The consequence shows at once, with no restart.

    What this does not break: the doors of the far machine, the sessions themselves, the work of programs, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - legacy-applications
  what_breaks:
    pl:
      - Programy branżowe obsługujące kasę, wagę albo sterownik przez port użytkownika przestaną widzieć urządzenie
      - Technik pracujący w sesji zdalnej straci dostęp do sprzętu serwisowego leżącego przed nim
      - Jest to zwykle przypadek pojedynczy, dotyczący kilku stanowisk, a nie całej organizacji
      - Właściwym rozwiązaniem jest wyjątek dla tych stanowisk, a nie odpuszczenie punktu wszędzie
      - Porty maszyny zdalnej, sesje jako takie, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - Programs of a trade serving a till, a scale or a steerer through the user s door will cease to see the thing
      - A craftsman working in a session from afar will lose the reach of gear of service lying before them
      - It is commonly a single case, touching a few stations and not the whole body
      - The right answer is an exception for those stations and not the letting go of the item everywhere
      - The doors of the far machine, the sessions themselves, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Program uruchamiany w sesji zdalnej obsługuje urządzenie przyłączone łączem szeregowym do maszyny użytkownika
    en:
      - A program set going in the session from afar serves a thing joined by a link in series to the user s machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fDisableCcm'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCcm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCcm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła ma niską ocenę i warto ją tak właśnie przedstawić, zamiast
    dopisywać jej wagi. Nie jest to droga wynoszenia dokumentów ani
    wnoszenia programów — przepustowość na to nie pozwala.

    Argument wart zachowania dotyczy warstwy obsługi. Przekierowanie
    ładuje w sesji zdalnej kod obsługujący port, a kod ten jest
    niesprawdzany właśnie dlatego, że używany rzadko.

    Odnotowuję rozwiązanie właściwe przy wyjątkach: wyjątek dla kilku
    stanowisk, a nie odpuszczenie punktu w całej organizacji. Aplikacja
    powinna wskazać taką drogę, bo tu jest ona wyjątkowo oczywista.
  en: |
    The rule bears a low grading, and it is well to put it forward just so rather than write weight into it. It is
    no road for the carrying out of papers nor the carrying in of programs - the breadth of the passage allows it
    not.

    The argument worth keeping touches the layer of backing. The turning loads within the session from afar the
    code that serves the door, and that code is unlooked-over for the very reason that it is seldom used.

    I set down the right answer at exceptions: an exception for a few stations and not the letting go of the item
    across the whole body. The application ought to point out such a road, it being here uncommonly plain.
