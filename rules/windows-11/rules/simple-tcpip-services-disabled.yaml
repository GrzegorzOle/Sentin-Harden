id: win11-simple-tcpip-services-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Proste usługi diagnostyczne protokołu sieciowego wyłączone
    en: The simple diagnostic services of the network protocol disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia zestaw prostych punktów nasłuchu pochodzących z początków
    sieci: odsyłanie otrzymanych danych z powrotem, generowanie strumienia
    znaków, odrzucanie wszystkiego, co przyjdzie, podawanie czasu i cytatu.
    Powstały jako narzędzia do sprawdzenia, czy połączenie w ogóle działa.

    Żadna z nich nie uwierzytelnia niczego i żadna nie sprawdza, kto pyta.
    Odpowiadają każdemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, jest konkretne
    i dobrze znane. Punkt odsyłający dane z powrotem pozwala zmusić maszynę do
    wysłania ruchu pod dowolny adres podany jako nadawca — maszyna staje się
    wtedy narzędziem kierowania ruchu w cudzą stronę, a ruch ten wychodzi
    z jej adresu. Punkt generujący strumień znaków robi to samo, tylko
    obficiej: jedno zapytanie wywołuje odpowiedź płynącą bez końca. Połączenie
    dwóch takich punktów ze sobą zajmuje maszyny na stałe.

    Są to mechanizmy wykorzystywane od dawna i właśnie dlatego niewymagające
    od napastnika żadnej wiedzy: wystarczy wysłać jeden pakiet.

    Punkt jest jednym z najprostszych w całej paczce. Usługi tej nie potrzebuje
    dziś nic, a udostępnia ona funkcje, których nie da się używać bezpiecznie.
  en: |
    The service offers a set of simple listening points dating from the early days of
    networking: sending received data back, generating a stream of characters, discarding
    everything that arrives, giving the time and a quotation. They came into being as
    tools for checking whether a connection works at all.

    None of them authenticates anything and none checks who is asking. They answer
    everybody.

    What an attacker gains while the item goes unmet is concrete and well known. The
    point sending data back allows the machine to be made to send traffic to any address
    given as the sender - the machine then becomes a tool for directing traffic at
    somebody else, and that traffic leaves from its address. The point generating a
    stream of characters does the same, only more abundantly: one query calls forth an
    answer flowing without end. Joining two such points to one another occupies the
    machines for good.

    These are mechanisms used for a long time and for that very reason demanding no
    knowledge of an attacker: one packet is enough to send.

    The item is among the simplest in the whole pack. Nothing needs this service today,
    and it offers functions that cannot be used safely.

disruption_description:
  pl: |
    Sprawdzenia wymaga niewiele, bo zastosowań praktycznie nie ma.

    Na stacji roboczej składnik ten nie jest instalowany domyślnie i audyt
    zwróci wynik „nie dotyczy". Jeżeli usługa jednak istnieje, znaczy to, że
    ktoś ją kiedyś włączył — i warto ustalić po co, zanim zostanie wyłączona.

    Jedyne spotykane zastosowanie to diagnostyka: sprawdzenie, czy łączność
    między dwoma punktami sieci w ogóle działa, przez odesłanie danych z tej
    maszyny. Bywa to wpisane w starsze procedury utrzymaniowe i w konfigurację
    starszych systemów monitorowania, które w ten sposób potwierdzają, że
    maszyna odpowiada.

    Zamiennik istnieje i jest lepszy: te same systemy monitorowania potrafią
    sprawdzać dostępność maszyny mechanizmami, które niczego nie odsyłają
    i nikomu nie odpowiadają bez warunku. Zmiana konfiguracji monitorowania
    jest tu właściwym krokiem, a nie powodem do odpuszczenia punktu.

    Poza tym jednym przypadkiem zmiana nie niesie skutków.

    Zmiana wymaga zatrzymania usługi.
  en: |
    Little needs checking, since uses are practically nonexistent.

    At a workstation this component is not installed by default and the audit will return
    "not applicable". If the service does exist, it means somebody switched it on at some
    point - and it is worth establishing what for before it is switched off.

    The only use met with is diagnostic: checking whether connectivity between two points
    on the network works at all, by having data sent back from this machine. That is
    sometimes written into older maintenance procedures and into the configuration of
    older monitoring systems, which confirm in this way that a machine answers.

    A replacement exists and is better: the same monitoring systems can check a machine's
    availability by mechanisms that send nothing back and answer nobody
    unconditionally. Changing the monitoring configuration is the right step here rather
    than a reason to let the item go.

    Apart from that single case the change carries no effects.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Sprawdzanie łączności przez odesłanie danych z tej maszyny przestaje działać
      - Starszy system monitorowania potwierdzający odpowiedź maszyny tą drogą zgłasza jej niedostępność
      - Procedura utrzymaniowa oparta na tych punktach nasłuchu wymaga zmiany
      - Poza diagnostyką nie zmienia się nic, bo usługi tej nic innego nie używa
    en:
      - Checking connectivity by having data sent back from this machine stops working
      - An older monitoring system confirming the machine's answer this way reports it unavailable
      - A maintenance procedure resting on these listening points needs changing
      - Beyond diagnostics nothing changes, since nothing else uses this service
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Starszy system monitorowania potwierdza dostępność maszyny wyłącznie tą drogą
      - Procedura utrzymaniowa wymaga odsyłania danych z tej maszyny i nie została zmieniona
    en:
      - An older monitoring system confirms the machine's availability by this route alone
      - A maintenance procedure requires data to be sent back from this machine and has not been changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'simptcp' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'simptcp' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'simptcp' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/simple-tcpip-services

notes:
  pl: |
    Składnik jest funkcją opcjonalną systemu i na maszynie, na której nikt go
    nie włączył, usługi nie ma. Audyt zwróci wtedy wynik „nie dotyczy" i jest
    to wynik prawidłowy — maszyna jest zabezpieczona lepiej, niż wymaga punkt.

    Wynik inny niż „nie dotyczy" zasługuje na osobną uwagę przy przeglądzie.
    Oznacza, że ktoś składnik zainstalował świadomie, a dziś nie ma powodu,
    żeby to robić. Warto wtedy sprawdzić, co jeszcze na tej maszynie zostało
    włączone przy tej samej okazji.

    Wyłączenie usługi zamyka wszystkie jej punkty nasłuchu naraz — nie da się
    zostawić jednego, a zdjąć pozostałych, i nie ma potrzeby tego robić.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The component is an optional feature of the system and on a machine where nobody has
    switched it on the service is absent. The audit will then return "not applicable",
    and that is a proper result - the machine is guarded better than the item requires.

    A result other than "not applicable" deserves attention of its own in a review. It
    means somebody installed the component deliberately, and today there is no reason to
    do so. It is then worth checking what else was switched on at the same time on that
    machine.

    Disabling the service closes all its listening points at once - one cannot be left
    and the rest taken away, and there is no need to do so.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
