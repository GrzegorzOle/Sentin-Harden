id: win2025-nbt-ns-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Network > NetBIOS over TCP/IP
  title:
    pl: Rozpoznawanie nazw NetBIOS wyłączone na wszystkich kartach
    en: NetBIOS name resolution disabled on all adapters
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza starszy mechanizm nazw sieciowych osobno na każdej
    karcie maszyny, w ustawieniach samego stosu sieciowego.

    Różnica wobec punktu z zasad klienta nazw jest istotna i warto ją
    nazwać, bo oba wyglądają na to samo. Tamten działa przez zasadę
    i dotyczy tego, jak system rozwiązuje nazwy. Ten działa na poziomie
    karty i dotyczy tego, czy mechanizm w ogóle na niej pracuje.
    W praktyce jest to ta sama rodzina ataków zamykana dwoma zamkami,
    a benchmark wymaga obu.

    Dla serwera ma to jednak skutek, którego nie ma na stanowisku.
    Ustawienie na poziomie karty pozwala rozdzielić maszynę: wyłączyć
    mechanizm tam, gdzie nie jest potrzebny, a zostawić tam, gdzie
    jeszcze musi działać. Serwer z kartą produkcyjną i kartą
    zarządzania ma z czego wybierać, a stanowisko z jedną kartą nie ma.

    Jest tu przy tym pułapka, o której trzeba wiedzieć. Ustawienie żyje
    przy każdej karcie z osobna. Karta dodana później — nowy interfejs
    wirtualny, karta dołożona przy rozbudowie, interfejs zestawiony
    przez oprogramowanie — dostaje wartość domyślną, czyli mechanizm
    włączony. Punkt raz spełniony potrafi więc przestać być spełniony
    bez niczyjej decyzji, a audyt wykryje to dopiero przy następnym
    przebiegu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość odpowiadania na zapytania o nazwę w segmencie każdej
    karty, na której mechanizm nadal pracuje.
  en: |
    The item switches off the older mechanism of names in the net apart on every card of the
    machine, in the settings of the net stack itself.

    The difference from the item out of the rules of the client of names matters and is worth
    naming, both looking like the same thing. That one works by a rule and bears on how the system
    resolves names. This one works at the card's level and bears on whether the mechanism works
    upon it at all. In practice it is the same kin of attacks shut with two locks, and the
    benchmark takes both.

    For a server it has withal an effect that at a station it has not. The setting at the card's
    level lets the machine be parted - the mechanism switched off where it is not needed and left
    where it must yet work. A server with a card for production and a card for management has
    something to choose from; a station with one card has not.

    There is here besides a trap one must know of. The setting lives by each card apart. A card
    added later - a new made-up interface, a card put in at a building out, an interface set up by
    software - gets the value by default, that is the mechanism switched on. An item once met can
    therefore stop being met with nobody deciding so, and the audit will find it only at the next
    running.

    What an attacker gains while the item goes unmet: the means of answering askings after names in
    the length of every card whereon the mechanism yet works.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia i sprawdzenia tych samych rzeczy
    co punkt z zasad klienta nazw — bo skutek jest w praktyce ten sam.
    Ścieżki do udziałów po nazwie krótkiej, starsze aplikacje, sprzęt
    znający wyłącznie nazwę krótką, przeglądanie otoczenia sieciowego.

    Jedna rzecz jest tu jednak inna i decyduje o kolejności. Ten punkt
    obejmuje wszystkie karty naraz, łącznie z tymi, o których nikt nie
    pamięta: kartą zarządzania, interfejsem wirtualnym, kartą po
    stronie hipernadzorcy. Zanim go zastosujesz, wypisz karty tej
    maszyny i powiedz o każdej, co przez nią chodzi. Jeżeli nie da się
    tego powiedzieć o którejś, to jest właśnie ta, która zaboli.

    Drugą rzeczą jest droga zapasowa. Punkt dotyczy stosu sieciowego,
    a pomyłka w stosie sieciowym serwera potrafi odciąć drogę do
    maszyny. Znaj swoje dojście poza siecią produkcyjną — kartę
    zarządzania albo konsolę hipernadzorcy — zanim zaczniesz.

    Wycofanie działa natychmiast i przywraca poprzednią wartość karta po
    karcie, ale wymaga dostępu do maszyny. To jest powód, dla którego
    kolejność wdrożenia ma znaczenie: najpierw karta, przez którą nie
    zarządzasz, potem pozostałe.

    Karta dodana po zmianie nie będzie nią objęta i wróci do wartości
    domyślnej. Punkt trzeba więc sprawdzić ponownie po każdej rozbudowie
    sieciowej maszyny, a nie tylko raz.
  en: |
    The change takes a knowing rollout and the checking of the same things as the item out of the
    rules of the client of names - the effect being in practice the same. Paths to shares by a
    short name, older applications, gear knowing a short name alone, the looking through of the
    net's surroundings.

    One thing is here otherwise, though, and it settles the order. This item takes in all the cards
    at once, those nobody remembers among them - the card of management, a made-up interface, a
    card on the hypervisor's side. Before applying it, write out this machine's cards and say of
    each what goes through it. If that cannot be said of one of them, it is just the one that will
    hurt.

    The second thing is the road in reserve. The item bears on the net stack, and a slip in a
    server's net stack can cut the road to the machine. Know your way in outside the net of
    production - the card of management or the hypervisor's console - before beginning.

    The undoing works at once and brings back the former value card by card, but it takes access to
    the machine. That is why the order of the rollout matters - first the card you do not manage
    by, then the rest.

    A card added after the change will not be taken in by it and will come back to the value by
    default. The item must therefore be checked anew after every building out of the machine's net
    side, and not once alone.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Ścieżki do udziałów po nazwie krótkiej przestaną się rozwiązywać z wszystkich kart naraz
      - Starsze aplikacje i sprzęt znające wyłącznie nazwę krótką stracą dostęp do tego serwera
      - Pomyłka dotyczy stosu sieciowego i potrafi odciąć drogę zarządzania do maszyny
      - Karta dodana po zmianie wróci do wartości domyślnej, więc punkt przestanie być spełniony
      - Przeglądanie otoczenia sieciowego przestanie pokazywać tę maszynę innym klientom
    en:
      - Paths to shares by a short name will stop being resolved from all the cards at once
      - Older applications and gear knowing a short name alone will lose access to this server
      - A slip bears on the net stack and can cut the road of management to the machine
      - A card added after the change will come back to the value by default, so the item will stop being met
      - The looking through of the net's surroundings will stop showing this machine to other clients
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie wiadomo, co chodzi przez którąś z kart tej maszyny i czego na niej używa
      - Nie ma drogi zapasowej do maszyny poza siecią produkcyjną na wypadek pomyłki
    en:
      - It is not known what goes through one of this machine's cards and what uses it
      - There is no road in reserve to the machine outside the net of production against a slip
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
      $interfaces = @(Get-ChildItem -Path $root -ErrorAction Stop)
      if ($interfaces.Count -eq 0) { 'CHECK_ERROR' }
      else {
        $enabled = @($interfaces | Where-Object {
          $value = (Get-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -ErrorAction SilentlyContinue).NetbiosOptions
          $null -eq $value -or [int]$value -ne 2
        })
        if ($enabled.Count -eq 0) { 'ALL_DISABLED' }
        else { 'ENABLED_ON_' + $enabled.Count + '_OF_' + $interfaces.Count }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_DISABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
    Get-ChildItem -Path $root | ForEach-Object {
      [pscustomobject]@{
        path    = $_.PSPath
        value   = (Get-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -ErrorAction SilentlyContinue).NetbiosOptions
        existed = ($null -ne (Get-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -ErrorAction SilentlyContinue).NetbiosOptions)
      }
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting lives by each card apart, so a card added later comes back to
    # the value by default and this item stops being met.
    $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
    Get-ChildItem -Path $root | ForEach-Object {
      Set-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -Value 2 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $entry.path -Name 'NetbiosOptions' -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $entry.path -Name 'NetbiosOptions' -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Punkt pokrywa się w skutkach z wyłączeniem starszego mechanizmu
    z poziomu zasad klienta nazw, ale działa w innym miejscu: przy
    karcie, a nie przy zasadzie. Benchmark wymaga obu i jest to ta sama
    rodzina ataków zamykana dwoma zamkami.

    Właściwość, o której trzeba wiedzieć: ustawienie żyje przy każdej
    karcie z osobna, więc karta dodana później dostaje wartość domyślną
    i punkt przestaje być spełniony bez niczyjej decyzji. Sprawdzaj go
    po każdej rozbudowie sieciowej maszyny.

    Podniosłem klasę uciążliwości względem paczki stanowiska roboczego,
    bo zmiana dotyczy stosu sieciowego serwera i obejmuje wszystkie
    karty naraz, łącznie z kartą zarządzania. Droga zapasowa do maszyny
    ma być znana przed zmianą.
  en: |
    The item overlaps in its effects with the switching off of the older mechanism at the level of
    the rules of the client of names, but works in another place - at the card and not at the rule.
    The benchmark takes both, and it is the same kin of attacks shut with two locks.

    A mark one must know of - the setting lives by each card apart, so a card added later gets the
    value by default and the item stops being met with nobody deciding so. Check it after every
    building out of the machine's net side.

    I raised the class of disruption against the working station's pack, the change bearing on a
    server's net stack and taking in all the cards at once, the card of management among them. The
    road in reserve to the machine is to be known before the change.
