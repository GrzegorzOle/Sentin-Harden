id: win10-audit-process-creation

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Detailed Tracking
  title:
    pl: Inspekcja tworzenia procesów
    en: The audit of the making of processes
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje uruchomienie każdego procesu na tej maszynie wraz ze
    ścieżką programu i wskazaniem procesu, który go uruchomił.

    Jest to zapis, po który przy badaniu zdarzenia sięga się najczęściej
    i który najczęściej okazuje się wyłączony. Powód jego wartości jest
    prosty: napastnik nie działa na maszynie w sposób abstrakcyjny — coś
    uruchamia. Każda czynność, od rozpoznania po wyprowadzenie danych, jest
    w tym zapisie widoczna jako uruchomiony program.

    Wskazanie procesu nadrzędnego jest tu równie ważne jak sam program.
    Powłoka uruchomiona przez przeglądarkę, przez program pocztowy albo
    przez arkusz kalkulacyjny jest zdarzeniem samym w sobie, niezależnie od
    tego, co ta powłoka zrobiła dalej. Pojedynczy wpis nie mówi nic;
    zestawienie rodzic-dziecko mówi wszystko.

    Odnotowuję zakres. Podkategoria zapisuje sam fakt uruchomienia i ścieżkę.
    Wiersz poleceń, czyli to, z jakimi argumentami program ruszył, jest
    osobnym ustawieniem — a bez niego zapis o uruchomieniu powłoki nie mówi,
    co ta powłoka miała wykonać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    całego łańcucha czynności na maszynie bez śladu wskazującego choćby
    jeden uruchomiony program.
  en: |
    The setting writes down the starting of every process upon this machine, together with the program's path
    and a naming of the process that started it.

    It is the record reached for oftenest at the looking into a happening, and the one oftenest found switched
    off. The reason for its worth is a plain one: an attacker does not work upon a machine in the abstract -
    they start something. Every act, from the making out of the ground to the leading away of data, shows in this
    record as a program started.

    The naming of the parent process is here as weighty as the program itself. A shell started by a browser, by
    a mail program or by a spreadsheet is an event in itself, whatever that shell did after. A single entry says
    nothing; the parent-and-child pairing says everything.

    I set down the reach. The subcategory writes down the bare fact of a starting, and the path. The command
    line - with what arguments the program moved - is a setting apart, and without it a record of a shell's
    starting does not say what that shell was to carry out.

    What an attacker gains while the item goes unmet: the carrying out of a whole chain of acts upon the machine
    with no trace naming even one program started.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest pojemność
    dziennika i to, czy ktokolwiek ten zapis czyta.

    Ustawienie niczego nie zabrania. Żaden program nie uruchomi się inaczej
    niż dotąd i nikt niczego nie zauważy.

    Sprawdzić trzeba objętość, bo jest to zapis najgłośniejszy w całej
    paczce. Maszyna robocza uruchamia kilka tysięcy procesów dziennie —
    w większości krótkich, wywoływanych przez system i przez zadania.
    Dziennik zabezpieczeń o rozmiarze domyślnym mieści taki ruch przez
    kilkanaście godzin, nie przez tydzień.

    Skutek jest ten sam co przy każdym przepełnieniu, tylko szybszy:
    wypadają wpisy najstarsze, czyli początek zdarzenia. Zapis tak
    obszerny bez zbierania zdarzeń poza maszynę daje obraz ostatniego dnia,
    nie ostatniego miesiąca.

    Zapisywany jest wyłącznie wynik udany. Połowa nieudana zawiera odmowy
    uruchomienia, których w normalnej pracy jest wiele i które nic nie
    wnoszą.

    Czego to nie psuje: uruchamiania programów, wydajności, logowania,
    kont domenowych, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is the log's room and whether anybody reads that
    record at all.

    The setting forbids nothing. No program will start otherwise than before, and nobody will notice a thing.

    What has to be reviewed is the bulk, this being the loudest record in the whole pack. A working machine
    starts some thousands of processes in a day - most of them short, called by the system and by tasks. A
    security log of its default size holds such traffic for a dozen hours or so, not for a week.

    The consequence is the same as at every overflow, only swifter: the oldest entries fall out, which is to say
    the beginning of the happening. A record so ample, without the gathering of events away from the machine,
    gives a picture of the last day and not of the last month.

    Only the successful outcome is written. The failed half holds the refusals to start, of which in ordinary
    work there are many and which bring nothing.

    What this does not break: the starting of programs, the speed of work, logging on, domain accounts, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Jest to zapis najgłośniejszy w całej paczce, bo maszyna robocza uruchamia kilka tysięcy procesów dziennie
      - Dziennik zabezpieczeń o rozmiarze domyślnym mieści taki ruch przez kilkanaście godzin, nie przez tydzień
      - Bez zbierania zdarzeń poza maszynę zapis daje obraz ostatniego dnia, nie ostatniego miesiąca
      - Podkategoria zapisuje ścieżkę programu, a wiersz poleceń jest osobnym ustawieniem i bez niego zapis mówi mniej
      - Uruchamianie programów, wydajność, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - It is the loudest record in the whole pack, a working machine starting some thousands of processes in a day
      - A security log of its default size holds such traffic for a dozen hours or so, not for a week
      - Without the gathering of events away from the machine the record gives a picture of the last day, not the last month
      - The subcategory writes the program s path, while the command line is a setting apart and without it the record says less
      - The starting of programs, the speed of work, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma rozmiar domyślny, a zdarzenia nie są zbierane poza maszynę
      - Nie ma kto czytać tego zapisu ani narzędzia, które zestawiałoby proces nadrzędny z uruchomionym
    en:
      - The security log is of its default size and the events are not gathered away from the machine
      - There is nobody to read that record, nor a tool to set the parent process beside the one started
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE922B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE922B-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE922B-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. A process that did not come about is
    # not what is sought here, and the failed half is loud out of all proportion.
    auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE922B-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-process-creation

notes:
  pl: |
    Reguła otwiera blok i jest w całej paczce inspekcyjnej tą o najwyższym
    stosunku wartości do kosztu — przy czym koszt jest tu realny i mierzy
    się w pojemności dziennika, nie w skutkach dla ludzi.

    Warto, żeby aplikacja pokazała ją razem z ustawieniem zapisującym wiersz
    poleceń. Sam fakt uruchomienia powłoki mówi mało; uruchomienie powłoki
    z konkretnymi argumentami mówi, co miała zrobić. Jedno bez drugiego jest
    połową odpowiedzi.

    Odnotowuję warunek, który tę regułę czyni albo najważniejszą w bloku,
    albo najdroższą bez zysku. Zapis o tej objętości nieczytany przez
    nikogo i niezbierany poza maszynę zapełnia dziennik i wypiera z niego
    zapisy rzadsze, a przez to cenniejsze. Aplikacja powinna postawić to
    pytanie przed wykonaniem, nie po.
  en: |
    The rule opens the block and is, in the whole audit pack, the one of the highest ratio of worth to cost -
    the cost here being real and measured in the log's room, not in consequences to people.

    It is well that the application show it beside the setting that writes the command line. The bare fact of a
    shell's starting says little; the starting of a shell with given arguments says what it was to do. The one
    without the other is half an answer.

    I set down the condition that makes this rule either the weightiest in the block or the dearest without a
    gain. A record of this bulk, read by nobody and not gathered away from the machine, fills the log and
    crowds out of it the rarer records, which are for that the more valuable. The application ought to put that
    question before the carrying out, not after.
