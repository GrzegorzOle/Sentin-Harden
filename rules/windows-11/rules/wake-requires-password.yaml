id: win11-wake-requires-password

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Wybudzenie ze snu wymaga podania hasła
    en: Waking from sleep requires a password
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Uśpiona maszyna ma sesję użytkownika w pamięci razem ze wszystkim, co w niej
    odblokowane. Ustawienie rozstrzyga, czy po wybudzeniu system pyta o hasło,
    czy oddaje tę sesję temu, kto otworzył pokrywę.

    Bez pytania o hasło uśpienie przestaje być zabezpieczeniem i staje się
    wyłącznie oszczędzaniem prądu. Laptop zamknięty na czas wyjścia z sali,
    zostawiony w hotelu albo w samochodzie jest wtedy otwarty dla każdego, kto
    go podniesie — razem z pocztą, otwartymi dokumentami, zalogowanymi
    aplikacjami i poświadczeniami zapisanymi w magazynie.

    Jest to jedna z niewielu zmian, która przy zerowej uciążliwości zamyka drogę
    wykorzystywaną w praktyce najczęściej ze wszystkich — bo nie wymaga od
    napastnika żadnej wiedzy technicznej, tylko dostępu do sprzętu na minutę.
  en: |
    A sleeping machine holds the user's session in memory along with everything
    unlocked inside it. The setting decides whether, on waking, the system asks
    for a password or hands that session to whoever opened the lid.

    Without the password prompt, sleep stops being a safeguard and becomes purely
    a way of saving power. A laptop closed while stepping out of a room, left in a
    hotel or in a car is then open to anybody who picks it up - along with the
    mail, open documents, signed-in applications and credentials kept in the
    store.

    This is one of the few changes that, at no disruption at all, closes the route
    used most often in practice of any - because it demands no technical knowledge
    of an attacker, only a minute's access to the hardware.

disruption_description:
  pl: |
    Nic nie przestaje działać. Po wybudzeniu pojawia się ekran logowania.

    Dla osoby pracującej przy maszynie jest to jedno wpisanie hasła przy każdym
    wybudzeniu — albo przyłożenie palca czy spojrzenie w kamerę, jeśli
    stanowisko ma logowanie biometryczne, bo ono działa tu tak samo.

    Otwarte dokumenty, połączenia sieciowe i uruchomione programy przeżywają
    uśpienie bez zmian — punkt dotyczy wyłącznie tego, kto dostaje sesję po
    wybudzeniu, a nie tego, co się z nią dzieje w międzyczasie.

    Nie ma restartu ani wylogowania. Zmiana obowiązuje od najbliższego
    wybudzenia.
  en: |
    Nothing stops working. A sign-in screen appears on waking.

    For the person at the machine it is one typing of a password at each wake - or
    a finger on the reader or a look at the camera, if the station has biometric
    sign-in, because that works here just the same.

    Open documents, network connections and running programs survive the sleep
    unchanged - the item concerns only who gets the session on waking, not what
    happens to it meanwhile.

    There is no restart and no sign-out. The change applies from the next wake.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Po każdym wybudzeniu ze snu trzeba podać hasło albo zalogować się biometrycznie
    en:
      - Every wake from sleep requires a password or a biometric sign-in
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because the machine is protected only as far as the worse variant
      # protects it - a laptop moves between the two by itself anyway.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 1 -and [int]$dc -eq 1) { 'REQUIRED' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      ac          = $item.ACSettingIndex
      dc          = $item.DCSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc_existed  = ($null -ne $item.DCSettingIndex)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.key_existed) {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    } else {
      if ($b.ac_existed) {
        Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
      }
      if ($b.dc_existed) {
        Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/customize/power-settings/sleep-settings

notes:
  pl: |
    Benchmark rozdziela ten punkt na zasilanie sieciowe i bateryjne. Paczka
    trzyma go jako jedną regułę i podaje w raporcie słabszy z dwóch wariantów,
    tak samo jak przy profilach zapory.

    Powód jest praktyczny: to jedno ustawienie, o którym zapada jedna decyzja,
    a maszyna przenośna przechodzi między wariantami sama, bez udziału
    użytkownika. Wynik „spełnione na zasilaniu sieciowym" nie znaczyłby nic —
    laptop stoi uśpiony na baterii właśnie wtedy, gdy ten punkt ma znaczenie.

    Naprawa ustawia oba warianty naraz i cofnięcie przywraca oba.
  en: |
    The benchmark splits this item into mains and battery power. The pack keeps it
    as one rule and reports the weaker of the two, just as it does with firewall
    profiles.

    The reason is practical: it is one setting about which one decision is taken,
    and a portable machine moves between the variants by itself, with no
    involvement from the user. A result of "satisfied on mains power" would mean
    nothing - a laptop sits asleep on battery precisely when this item matters.

    Remediation sets both variants at once and reverting restores both.
