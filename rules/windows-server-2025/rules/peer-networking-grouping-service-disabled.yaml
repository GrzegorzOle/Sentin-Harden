id: win2025-peer-networking-grouping-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa grupowania dla sieci równorzędnej wyłączona
    en: The grouping service for peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę grupowania dla sieci równorzędnej. Usługa ta
    tworzy i utrzymuje grupy węzłów, które wymieniają się między sobą
    danymi bez serwera pośrodku.

    Rzecz wspólna dla czterech reguł tej platformy zapisana jest przy
    rozpoznawaniu nazw. Tutaj mówię tylko o tym, co własne dla tej
    usługi.

    Zostawiam kategorię średnią. Grupowanie jest w tej czwórce warstwą,
    która faktycznie przenosi dane. Pozostałe trzy odnajdują, ogłaszają
    i poświadczają — ta łączy węzły w zbiór i pozwala im przekazywać
    sobie zawartość. Jest to więc kanał wymiany plików, który nie
    przechodzi przez żaden udział sieciowy, żaden serwer i żadne miejsce,
    w którym ktokolwiek zwykle patrzy. Na stacji roboczej takich kanałów
    jest wiele. Na serwerze każdy z nich jest rzeczą wartą uwagi,
    bo serwer nie ma zwyczaju wymieniać się plikami z kimkolwiek poza
    tym, co wynika z jego roli.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    przekazywania danych między maszynami, omijający udziały sieciowe
    i miejsca, w których wymiana plików jest obserwowana.
  en: |
    The item switches off the service of grouping for the net of equals. That service makes and keeps
    groups of knots that trade data among themselves with no server in the midst.

    The thing common to the four rules of that platform is set down at the knowing of names. Here I
    speak only of what is that service's own.

    I leave the category middling. The grouping is in that four the layer that truly bears data. The
    other three find, call abroad and vouch - this one binds knots into a set and lets them hand
    matter to one another. It is therefore a channel of the trading of files that goes through no
    share of the net, no server and no stead whereat anybody commonly looks. Upon a workstation there
    are many such channels. Upon a server each of them is a thing worth heed, a server not being wont
    to trade files with anybody beyond what follows from its role.

    What an attacker gains while the item goes unmet - a channel of the handing of data between
    machines, going beside the shares of the net and the steads whereat the trading of files is
    watched.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", zgodnie z ustaleniem wspólnym
    dla całej czwórki, zapisanym przy rozpoznawaniu nazw. Scenariuszem,
    który trzeba wykluczyć, jest własna aplikacja zbudowana na tej
    platformie.

    Dodaję tutaj jeden scenariusz własny, bo do tej usługi przywiązany
    jest starszy sposób nawiązywania pomocy zdalnej — ten, w którym dwie
    maszyny łączą się bezpośrednio, bez pośrednictwa serwera. Nie jest to
    typowe na serwerze, ale bywa używane w mniejszych lokalizacjach,
    gdzie żadnego pośrednika nie postawiono.

    Warto też pamiętać o kierunku zależności. Usługa ta opiera się na
    rozpoznawaniu nazw z sąsiedniego punktu, więc jeżeli tamto zostało
    zatrzymane wcześniej, ta usługa już nie działa i punkt bywa spełniony
    bez żadnej dodatkowej czynności.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking", after the settling common to all four set down at the
    knowing of names. The happening to be ruled out is an application of one's own built upon that
    platform.

    I set down here one happening of its own, there being bound to that service an older way of the
    setting up of help from afar - the one wherein two machines bind straight to one another with no
    go-between. It is not common upon a server, but it is at times used in lesser steads whereat no
    go-between was set up.

    It is worth keeping in mind too which way the hanging runs. That service rests upon the knowing of
    names of the neighbouring item, so if that was stopped beforehand this service works no more and
    the item is at times met without any further doing.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Własna aplikacja zbudowana na platformie sieci równorzędnej traci warstwę przenoszącą dane
      - Starszy sposób nawiązywania pomocy zdalnej bez pośrednictwa serwera przestaje działać
      - Usługa opiera się na rozpoznawaniu nazw, więc bywa już zatrzymana po zmianie sąsiedniego punktu
      - Wymiana plików wynikająca z roli serwera działa dalej bez zmiany
    en:
      - An application of one's own built upon the platform of the net of equals loses the layer that bears data
      - The older way of the setting up of help from afar with no go-between stops working
      - The service rests upon the knowing of names, so it is at times stopped already after the change of the neighbouring item
      - The trading of files that follows from the server's role works on unaltered
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja zbudowana na platformie sieci równorzędnej
      - W lokalizacji używa się pomocy zdalnej nawiązywanej bezpośrednio, bez pośrednictwa serwera
    en:
      - Upon the machine there stands an application built upon the platform of the net of equals
      - In that stead help from afar is used that is set up straight, with no go-between
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2psvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the layer of the peer platform that actually moves data between
    # machines. The older direct remote assistance route rides on it, which in
    # a small site may be the only one set up.
    Stop-Service -Name 'p2psvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2psvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'p2psvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-to-peer

