id: win2016-internet-connection-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania połączenia sieciowego wyłączona
    en: The network connection sharing service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala udostępnić połączenie sieciowe tej maszyny innym
    maszynom — z zamianą adresów i z własnym przydzielaniem adresów po
    stronie udostępnianej.

    Mechanizm pomyślany był dla jednego komputera dzielącego się łączem
    z kilkoma innymi w mieszkaniu. Na serwerze jego uruchomienie znaczy to
    samo, co przy usłudze poprzedniej — powstaje przejście między sieciami
    — ale z dwoma dodatkami, które czynią je gorszym.

    Pierwszy to własne przydzielanie adresów. Usługa zaczyna rozdawać
    adresy w segmencie, do którego jest podłączona, i robi to bez pytania
    kogokolwiek. W sieci zarządzanej oznacza to dwa źródła adresów naraz
    i awarie, których przyczyny szuka się długo, bo zależą od tego, kto
    odpowiedział pierwszy.

    Drugi to zamiana adresów. Ruch wychodzący przez tę maszynę wygląda na
    pochodzący od niej, więc w dziennikach zapory i nadzoru znika
    informacja, kto go naprawdę wysłał. Jest to przejście, które przy
    okazji zaciera ślady.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    podłączenia własnych maszyn do sieci organizacji za pośrednictwem tej
    maszyny, z adresacją spoza kontroli i z ruchem podpisanym jej adresem.
  en: |
    The service lets this machine's network connection be shared with other machines -
    with address translation and with its own handing out of addresses on the shared
    side.

    The mechanism was thought up for one computer sharing a link with a few others in a
    flat. On a server its starting means the same as at the previous service - a passage
    between networks comes about - but with two additions that make it the worse.

    The first is its own handing out of addresses. The service begins dealing out
    addresses in the segment it is joined to, and does so asking nobody. On a managed
    network that means two sources of addresses at once, and failures whose cause is
    long sought, depending as they do on who answered first.

    The second is the translation of addresses. Traffic leaving through this machine
    looks as though it came from it, and so in the logs of the firewall and the
    monitoring the knowledge of who really sent it vanishes. It is a passage that blurs
    traces along the way.

    What an attacker gains while the item goes unmet: a road of joining their own
    machines to the organisation's network through this one, with addressing outside its
    control and with traffic signed by its address.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a powód jest inny niż przy usłudze
    poprzedniej i mniej oczywisty.

    Ta sama usługa niesie zamianę adresów używaną przez przełączniki
    wirtualne pracujące w trybie z translacją oraz przez sieć udostępnianą
    bezprzewodowo. Jeżeli na maszynie działa wirtualizacja, a maszyny
    wirtualne wychodzą do sieci przez taki przełącznik, wyłączenie usługi
    odetnie je wszystkie naraz.

    Rzecz jest o tyle trudna, że związek nie wynika z nazwy. Reguła mówi
    o udostępnianiu połączenia sieciowego, a skutek dotyka maszyn
    wirtualnych, o których w tej nazwie nie ma ani słowa. Administrator,
    który wirtualizację na tej maszynie ma, nie ma powodu spodziewać się
    tego skutku i zwykle się go nie spodziewa.

    Objaw jest przy tym jednoznaczny: maszyny wirtualne tracą łączność
    z siecią zewnętrzną, zachowując łączność między sobą i z hostem.
    Ten układ objawów wskazuje przyczynę dość dobrze — pod warunkiem że
    ktoś skojarzy go z tą zmianą.

    Poza wirtualizacją skutek jest żaden. Serwer nie udostępnia połączenia
    nikomu i usługa stoi bezczynnie.

    Czego to nie psuje: zwykłego ruchu sieciowego maszyny, przełączników
    wirtualnych działających w trybie zewnętrznym, udziałów, zarządzania
    zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and the reason is other than at the previous
    service and less obvious.

    The same service carries the address translation used by virtual switches working in
    the translating mode and by the network shared over the air. Should virtualisation
    run on the machine, with the virtual machines going out to the network through such a
    switch, switching the service off will cut them all off at once.

    The matter is hard in that the connection does not follow from the name. The rule
    speaks of sharing a network connection, and the consequence touches virtual machines,
    of which that name says not a word. An administrator who has virtualisation on this
    machine has no reason to expect that consequence and as a rule does not.

    The symptom is for all that an unambiguous one: the virtual machines lose their link
    to the outer network while keeping their link to one another and to the host. That
    arrangement of symptoms points at the cause well enough - provided somebody ties it
    to this change.

    Beyond virtualisation the consequence is none. A server shares its connection with
    nobody and the service stands idle.

    What this does not break: the machine's ordinary network traffic, virtual switches
    working in the external mode, shares, or remote management.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Maszyny wirtualne wychodzące do sieci przez przełącznik z translacją adresów tracą łączność zewnętrzną wszystkie naraz
      - Łączność między maszynami wirtualnymi i z hostem zostaje zachowana, więc układ objawów wskazuje przyczynę dość dobrze
      - Związek skutku z nazwą reguły nie jest widoczny - nazwa mówi o udostępnianiu połączenia, a skutek dotyka wirtualizacji
      - Zwykły ruch sieciowy maszyny, przełączniki w trybie zewnętrznym i udziały pozostają bez zmian
    en:
      - Virtual machines going out to the network through a translating switch lose their outer link all at once
      - The link among the virtual machines and to the host is kept, so the arrangement of symptoms points at the cause well enough
      - The tie between the consequence and the rule's name is not visible - the name speaks of sharing a connection and the consequence touches virtualisation
      - The machine's ordinary network traffic, switches in the external mode and shares stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje wirtualizacja, a maszyny wirtualne wychodzą do sieci przez przełącznik z translacją adresów
      - Maszyna udostępnia połączenie sieciowe innym urządzeniom i nie wskazano dla nich innej drogi
    en:
      - Virtualisation runs on the machine and the virtual machines go out to the network through a translating switch
      - The machine shares its network connection with other devices and no other road has been named for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'SharedAccess' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The same service carries the address translation used by virtual switches
    # and by the hosted network. Check for those before running.
    Stop-Service -Name 'SharedAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SharedAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'SharedAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/network-subsystem/net-sub-interface-metric

notes:
  pl: |
    Punkt tworzy parę z regułą o routingu i dostępie zdalnym, bo obie
    tworzą przejście między sieciami. Różnica leży w tym, po co powstały:
    tamta z zamysłem, ta przypadkiem — i dlatego ta jest gorsza, mimo
    niższego poziomu.

    Najważniejsza rzecz do pokazania w interfejsie jest jednak inna niż
    samo ryzyko. Jest nią ukryty związek z wirtualizacją. Reguła nazwana
    po tym, co robi z nazwy, uderza w coś zupełnie innego, a wykaz obszarów
    wpływu powinien to wychwycić wcześniej niż opis — dlatego wirtualizacja
    i kontenery są tu wymienione obok sieci.

    Zacieranie śladów w dziennikach warto odnotować osobno, bo jest to
    argument innego rodzaju niż otwarcie drogi. Przejście z zamianą adresów
    nie tylko przepuszcza ruch, ale też odbiera nadzorowi możliwość
    wskazania, kto go wysłał — i ta strata utrzymuje się długo po tym, jak
    sam ruch ustanie.
  en: |
    The item makes a pair with the rule on routing and remote access, both making a
    passage between networks. The difference lies in why they came about: that one by
    design, this one by accident - and so this one is the worse, despite the lower level.

    The most important thing to show in the interface is for all that other than the risk
    itself. It is the hidden tie to virtualisation. A rule named after what its name says
    it does strikes at something wholly other, and the list of impact areas should catch
    that sooner than the description - which is why virtualisation and containers are
    named here beside the network.

    The blurring of traces in the logs is worth noting apart, being an argument of a
    different kind than the opening of a road. A translating passage not only lets
    traffic through but takes from the monitoring the power to say who sent it - and that
    loss holds long after the traffic itself has ceased.
