id: win2016-legacy-run-list-not-processed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Starsza lista programów uruchamianych przy logowaniu pomijana
    en: The older list of programs started at signing in passed over
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe pomijać listę programów uruchamianych przy logowaniu,
    zapisaną w gałęzi rejestru wspólnej dla całej maszyny.

    Lista ta jest najstarszym i najbardziej znanym miejscem, w którym
    program zapewnia sobie ponowne uruchomienie po restarcie. Jest zarazem
    pierwszym miejscem, do którego sięga napastnik, gdy chce, żeby jego kod
    przetrwał wyłączenie maszyny.

    Powód jest prosty: wpis na tę listę jest zwykłym wpisem w rejestrze,
    a nie usługą ani zadaniem. Nie wymaga instalacji, nie zostawia pliku
    poza wskazanym i nie wygląda podejrzanie, dopóki ktoś nie przeczyta
    ścieżki.

    Wartość reguły polega na tym, że lista przestaje być wykonywana, mimo
    że wpisy na niej zostają. Napastnik może dopisać się do niej nadal
    i nadal nic się nie stanie. Jest to obrona przez zerwanie ostatniego
    ogniwa, a nie przez zamknięcie dostępu.

    Zastrzeżenie o uczciwości: dróg zapewniania sobie trwałości jest wiele,
    a ta reguła zamyka jedną. Zadania zaplanowane, usługi, wpisy dla
    konkretnego użytkownika i kilkanaście miejsc rzadziej używanych
    pozostają otwarte.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość
    kodu po restarcie maszyny, uzyskaną jednym wpisem w rejestrze, bez
    instalowania czegokolwiek.
  en: |
    The setting has the list of programs started at signing in, written in the
    registry branch common to the whole machine, passed over.

    That list is the oldest and best known place where a program secures its own
    restarting after a reboot. It is at the same time the first place an attacker
    reaches for when they want their code to outlive the machine being switched off.

    The reason is simple: an entry on that list is an ordinary registry entry and
    not a service nor a task. It calls for no installation, leaves no file beyond
    the one it names, and looks in no way suspect until somebody reads the path.

    The rule's value is that the list stops being carried out although the entries
    on it remain. An attacker can still add themselves to it and still nothing will
    happen. It is a defence by the breaking of the last link rather than by the
    shutting of access.

    A reservation about honesty: there are many roads to securing one's own
    persistence, and this rule shuts one. Scheduled tasks, services, entries for a
    particular user, and a dozen or so places used more seldom all stay open.

    What an attacker gains while the item goes unmet: the persistence of code across
    a restart of the machine, had by one registry entry, with nothing installed at
    all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, co na tej liście już
    leży.

    Jest to reguła, przy której przegląd przed wykonaniem ma sens
    dosłowny: wystarczy przeczytać listę. Leżą na niej zwykle programy
    zgodne z prawem i potrzebne — narzędzie agenta nadzoru, program
    obsługujący sprzęt, składnik starszej aplikacji, który innej drogi nie
    zna.

    Skutek jest cichy i to jest tu główny kłopot. Program pominięty przy
    starcie nie zgłasza niczego, bo nigdy nie zostaje uruchomiony. Nie ma
    błędu, nie ma wpisu w dzienniku, nie ma okna. Jest tylko brak czegoś,
    co dotąd było — i rozpoznanie tego zajmuje tyle, ile zajmuje zauważenie
    nieobecności.

    Rzecz druga dotyczy serwerów, na których lista bywa pusta. Tam punkt
    nie zmienia nic i jest wyłącznie zapisem decyzji, co czyni go wtedy
    kandydatem do wykonania bez wahania.

    Czego to nie psuje: usług, zadań zaplanowanych, skryptów logowania
    z zasad grupy, programów uruchamianych przez inne mechanizmy.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is what already lies on
    that list.

    It is a rule where going over things before execution has a literal sense: it is
    enough to read the list. What lies on it is as a rule lawful and needed - a
    monitoring agent's tool, a program handling hardware, a part of an older
    application that knows no other road.

    The consequence is quiet, and that is the chief trouble here. A program passed
    over at the start reports nothing, never being started at all. There is no
    error, no entry in a log, no window. There is only the absence of something that
    was there before - and noticing it takes as long as noticing an absence takes.

    The second thing concerns servers where the list is at times empty. There the
    item changes nothing and is nothing but a record of a decision, which makes it a
    candidate for execution without hesitation.

    What this does not break: services, scheduled tasks, sign-in scripts from group
    policy, or programs started by other mechanisms.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - remote-management
  what_breaks:
    pl:
      - Program leżący na tej liście przestaje wstawać przy logowaniu i nie zgłasza tego niczym, bo nigdy nie zostaje uruchomiony
      - Narzędzie agenta nadzoru albo składnik starszej aplikacji, które innej drogi nie znają, przestają działać po cichu
      - Rozpoznanie przyczyny zajmuje tyle, ile zajmuje zauważenie nieobecności, bo nie ma błędu ani wpisu w dzienniku
      - Usługi, zadania zaplanowane i skrypty logowania z zasad grupy pozostają bez zmian
    en:
      - A program lying on that list stops rising at signing in and reports it by nothing at all, never being started
      - A monitoring agent's tool or a part of an older application that knows no other road stops working quietly
      - Establishing the cause takes as long as noticing an absence takes, there being no error and no entry in a log
      - Services, scheduled tasks and sign-in scripts from group policy stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na liście leży narzędzie potrzebne do pracy maszyny i nie przeniesiono go do usługi ani do zadania zaplanowanego
      - Starsza aplikacja na tej maszynie uruchamia swój składnik wyłącznie tą drogą
    en:
      - A tool needed for the machine's work lies on the list and has not been moved to a service nor to a scheduled task
      - An older application on this machine starts its own component only by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'DisableLocalMachineRun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'DisableLocalMachineRun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocalMachineRun' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/setupapi/run-and-runonce-registry-keys

notes:
  pl: |
    Punkt jest jednym z niewielu, przy których zalecenie brzmi „przeczytaj,
    zanim wykonasz", i można to zalecenie wypełnić dosłownie. Aplikacja
    mogłaby przy tej regule pokazywać zawartość listy w podglądzie skutków
    — byłby to dokładnie ten rodzaj symulacji, o który chodzi w zasadzie
    o podglądzie przed wykonaniem.

    Reguła tworzy parę z regułą o liście jednorazowej. Obie zamykają ten
    sam wzorzec w dwóch odmianach: trwałej i jednorazowej. Wdrożona sama
    zostawia drugą otwartą, a ponieważ lista jednorazowa jest wykorzystywana
    przy instalacjach, bywa przy tym mniej widoczna.

    Uczciwość opisu wymaga powiedzenia, że reguła nie zamyka trwałości jako
    takiej. Zamyka jedno miejsce z wielu — najstarsze i najczęściej
    używane, ale jedno. Zgodność w tym punkcie nie jest podstawą do
    przyjęcia, że maszyna jest wolna od kodu przeżywającego restart.
  en: |
    The item is one of the few where the recommendation reads "read before you
    carry it out", and that recommendation can be met literally. The application
    could, at this rule, show the list's contents in the preview of consequences -
    that would be exactly the kind of simulation the principle about a preview
    before execution is about.

    The rule makes a pair with the rule about the one-time list. Both shut the same
    pattern in two forms: the lasting and the one-time. Rolled out alone it leaves
    the other open, and since the one-time list is used at installations it is
    besides less visible.

    Honesty of description calls for saying that the rule does not shut persistence
    as such. It shuts one place of many - the oldest and the most used, but one.
    Compliance at this item is no ground for taking the machine to be free of code
    outliving a restart.
