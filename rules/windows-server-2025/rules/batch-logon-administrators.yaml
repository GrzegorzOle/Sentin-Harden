id: win2025-batch-logon-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie w trybie wsadowym zastrzeżone dla administratorów
    en: Batch job sign-in restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo rozstrzyga, na jakim koncie może zostać uruchomione zadanie
    wsadowe — czyli zadanie z harmonogramu, wykonywane bez udziału
    człowieka i bez otwartej sesji.

    Jest to droga wejścia różniąca się od pozostałych jedną cechą:
    nikt przy niej nie siedzi. Sesja interaktywna kończy się, gdy
    użytkownik się wyloguje, a połączenie sieciowe — gdy zostanie
    zerwane. Zadanie wsadowe wykonuje się o ustalonej porze, samo,
    i wykonuje się dalej długo po tym, jak ten, kto je założył,
    przestał mieć dostęp do maszyny.

    Stąd bierze się wartość tego prawa dla napastnika. Zadanie
    uruchamiane co dobę na koncie o odpowiednich uprawnieniach jest
    trwałością, która nie wygląda na trwałość — nie ma procesu
    działającego stale, nie ma otwartego połączenia, jest tylko wpis
    w harmonogramie wśród dziesiątek innych.

    Na serwerze wpisów tych jest znacznie więcej niż na stanowisku
    roboczym i to jest główna różnica między paczkami. Kopie zapasowe,
    porządkowanie dzienników, przeliczenia nocne i zadania aplikacyjne
    pracują właśnie tędy.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość
    wykonywaną cyklicznie na koncie wybranym przez siebie, ukrytą wśród
    zadań zwyczajnych i niewidoczną jako proces stale działający.
  en: |
    The right settles what account a batch job may be started under - that is, a job from the
    scheduler, done with no person taking part and with no session open.

    It is a road in differing from the others in one trait: nobody sits at it. An interactive
    session ends when the user logs out, and a network connection when it is broken. A batch job
    runs at a set hour, of itself, and goes on running long after whoever set it up has lost
    access to the machine.

    Thence the right's worth to an attacker. A job started every day under an account of fitting
    rights is a persistence that does not look like one - there is no process working steadily,
    no connection open, only an entry in the scheduler among dozens of others.

    On a server those entries are far more numerous than at a working station, and that is the
    chief difference between the packs. Backups, the tidying of logs, nightly reckonings and
    application jobs work by just this road.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: a persistence run in cycle under an
    account of their choosing, hidden among ordinary jobs and unseen as a steadily working
    process.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, na jakich kontach pracują zadania
    harmonogramu na tym serwerze, bo po zawężeniu zadania spoza wykazu
    przestaną się uruchamiać.

    Jest to punkt, przy którym serwer różni się od stanowiska roboczego
    najbardziej. Na serwerze zadania harmonogramu są normą, a nie
    wyjątkiem, i zwykle pracują na kontach usługowych utworzonych
    celowo poza grupą administratorów — po to właśnie, żeby ich
    uprawnienia trzymać nisko.

    Objaw jest cichy i to jest tu rzecz najważniejsza. Zadanie nie
    uruchamia się, ale harmonogram nie zgłasza awarii w sposób rzucający
    się w oczy: w wykazie widnieje kod zakończenia mówiący o odmowie
    logowania, a nie komunikat o błędzie. Kopia zapasowa, która
    przestała się wykonywać, bywa zauważona dopiero wtedy, gdy jest
    potrzebna.

    Warto znać jedną właściwość harmonogramu: zakładając zadanie
    z zapamiętanymi poświadczeniami, nadaje on wskazanemu kontu to
    prawo samoczynnie. Znaczy to dwie rzeczy. Pierwsza — zadania
    założone wcześniej po zawężeniu przestaną działać. Druga — wykaz
    zawężony rozejdzie się ponownie przy zakładaniu kolejnego zadania,
    więc punkt wymaga sprawdzenia okresowego, a nie jednorazowego.

    Zmiana nie dotyka zadań uruchomionych w chwili jej wprowadzenia
    i nie wymaga przerwy.
  en: |
    What needs checking is what accounts the scheduler's jobs work under on this server, since
    after the narrowing jobs outside the list will stop starting.

    It is the item where a server differs most from a working station. On a server the
    scheduler's jobs are the rule rather than the exception, and they usually work under service
    accounts made on purpose outside the administrators' group - just so as to hold their rights
    low.

    The symptom is quiet, and that is here the weightiest matter. The job does not start, but
    the scheduler does not report a breakdown in any way that catches the eye: the list shows an
    ending code speaking of a refused logging in rather than a message of error. A backup that
    has stopped being made is at times noticed only when it is wanted.

    One property of the scheduler is worth knowing: in setting up a job with remembered
    credentials, it grants the named account this right of itself. That means two things. First
    - jobs set up earlier will stop working after the narrowing. Second - a narrowed list will
    widen again at the setting up of the next job, so the item takes a periodic check rather
    than a single one.

    The change does not touch jobs running at the moment it is brought in and takes no break.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Zadania harmonogramu na kontach usługowych spoza wykazu przestaną się uruchamiać
      - Objaw jest cichy — w wykazie widnieje kod odmowy logowania, a nie komunikat o błędzie
      - Kopia zapasowa, która przestała się wykonywać, bywa zauważona dopiero wtedy, gdy jest potrzebna
      - Harmonogram nadaje to prawo samoczynnie przy zakładaniu zadania, więc wykaz rozejdzie się ponownie
    en:
      - The scheduler's jobs under service accounts outside the list will stop starting
      - The symptom is quiet - the list shows a refused sign-in code rather than a message of error
      - A backup that has stopped being made is at times noticed only when it is wanted
      - The scheduler grants this right of itself at the setting up of a job, so the list will widen again
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracują zadania harmonogramu na kontach usługowych celowo umieszczonych poza administratorami
      - Nie ustalono, na jakich kontach pracują zadania kopii zapasowej i porządkowania dzienników
    en:
      - The scheduler's jobs work on the server under service accounts purposely placed outside the administrators
      - It has not been settled what accounts the backup and log tidying jobs work under
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeBatchLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeBatchLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeBatchLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeBatchLogonRight = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeBatchLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/log-on-as-a-batch-job

notes:
  pl: |
    Punkt zamyka grupę praw logowania. Pozostałe trzy rządzą konsolą,
    pulpitem zdalnym i dostępem z sieci; ten rządzi drogą, przy której
    nikt nie siedzi.

    Harmonogram nadaje to prawo samoczynnie przy zakładaniu zadania
    z zapamiętanymi poświadczeniami. Wykaz zawężony rozejdzie się więc
    ponownie i punkt wymaga sprawdzenia okresowego.

    Czytaj go razem z odmową logowania wsadowego dla gości. Tamten
    wyklucza wskazane konta, ten wylicza dopuszczone — i wykluczenie
    ma pierwszeństwo.
  en: |
    The item closes the group of sign-in rights. The other three govern the console, remote
    desktop and access from the network; this one governs the road nobody sits at.

    The scheduler grants this right of itself at the setting up of a job with remembered
    credentials. A narrowed list will therefore widen again, and the item takes a periodic
    check.

    Read it together with the denial of batch sign-in to guests. That one shuts named accounts
    out, this one counts the allowed in - and the shutting out comes first.
