id: win2016-powershell-script-block-logging

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows PowerShell
  title:
    pl: Rejestrowanie bloków skryptu powłoki włączone
    en: The recording of the shell's script blocks switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe powłoce zapisywać do dziennika treść wykonywanego kodu
    — nie nazwę pliku i nie polecenie, którym ją wywołano, lecz to, co
    faktycznie zostało uruchomione.

    Różnica jest tu całą treścią punktu. Napastnik posługujący się powłoką
    rzadko uruchamia plik skryptu. Uruchamia polecenie, które pobiera kod
    z sieci i wykonuje go w pamięci, albo przekazuje kod zakodowany jako
    ciąg znaków w wierszu polecenia. W obu przypadkach na dysku nie
    powstaje nic, a w dzienniku zostaje wiersz mówiący, że uruchomiono
    powłokę.

    Zapis bloków skryptu sięga o poziom głębiej: rejestruje kod w postaci,
    w jakiej powłoka go widzi, czyli po rozkodowaniu i po pobraniu.
    Warstwy maskujące przestają mieć znaczenie, bo zapis następuje po nich,
    a nie przed.

    Warto powiedzieć, czego punkt nie robi. Nie blokuje niczego i nie
    zatrzymuje żadnego wykonania. Daje materiał do rozpoznania tego, co się
    stało — a więc wartość pojawia się dopiero wtedy, gdy ktoś ten dziennik
    czyta albo zbiera.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pracę
    w powłoce niewidoczną w żadnym dzienniku, bo żaden plik nie powstaje,
    a wykonany kod nie zostawia treści.
  en: |
    The setting has the shell write to a log the substance of the code it runs - not
    the name of a file and not the command it was called by, but what was actually
    run.

    The difference is the item's whole substance. An attacker working in the shell
    seldom runs a script file. They run a command that fetches code from the network
    and runs it in memory, or they pass code encoded as a string on the command
    line. In either case nothing comes about on disk, and what is left in the log is
    a line saying the shell was started.

    Recording script blocks reaches a level deeper: it records the code in the form
    the shell sees it, which is to say after the decoding and after the fetching.
    The masking layers cease to matter, the recording happening after them rather
    than before.

    Worth saying what the item does not do. It blocks nothing and stops no running
    at all. It gives material for establishing what happened - so the value appears
    only once somebody reads or gathers that log.

    What an attacker gains while the item goes unmet: work in the shell invisible in
    any log, no file coming about and the code run leaving no substance behind.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba miejsce w dzienniku
    i to, co przez powłokę przepływa.

    Objętość jest tu głównym kosztem. Zapisywana jest treść kodu, więc
    maszyna, na której powłoka pracuje dużo — wdrożenia, monitorowanie,
    zadania cykliczne — zapełni dziennik szybciej, niż zakładał ten, kto
    ustalał jego wielkość. Skutkiem bywa nadpisywanie zdarzeń starszych,
    czyli utrata tego, po co dziennik istnieje.

    Rzecz druga jest poważniejsza i rzadziej wymieniana. Zapisywana jest
    treść, a treść bywa wrażliwa. Skrypt przekazujący hasło w wierszu
    polecenia zapisze to hasło w dzienniku — czytelnie, w miejscu
    dostępnym szerzej niż sam skrypt. Punkt potrafi więc rozszerzyć krąg
    osób mających wgląd w poświadczenia, jeżeli skrypty na tej maszynie są
    napisane niedbale.

    Rzecz trzecia dotyczy wydajności. Zapis kosztuje przy każdym wykonaniu,
    a przy skryptach generujących kod w pętli koszt bywa zauważalny.

    Czego to nie psuje: działania skryptów, usług, logowania, zarządzania
    zdalnego, wykonywania poleceń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is room in the log and
    what flows through the shell.

    Volume is the chief cost here. What is recorded is the substance of the code, so
    a machine where the shell works much - rollouts, monitoring, recurring tasks -
    will fill its log faster than whoever settled its size assumed. The upshot is at
    times the overwriting of older events, which is to say the loss of what the log
    exists for.

    The second thing is graver and more seldom named. What is recorded is substance,
    and substance is at times sensitive. A script passing a password on the command
    line will write that password into the log - readably, in a place open more
    widely than the script itself. The item can therefore widen the circle of people
    with sight of credentials, where the scripts on this machine are carelessly
    written.

    The third thing concerns performance. The recording costs at every running, and
    with scripts generating code in a loop the cost is at times noticeable.

    What this does not break: the working of scripts, services, signing in, remote
    management, or the running of commands.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Dziennik zapełnia się szybciej, niż zakładał ten, kto ustalał jego wielkość, a zdarzenia starsze zaczynają być nadpisywane
      - Skrypt przekazujący hasło w wierszu polecenia zapisze to hasło w dzienniku, czyli w miejscu dostępnym szerzej niż sam skrypt
      - Skrypty generujące kod w pętli działają wolniej, bo zapis kosztuje przy każdym wykonaniu
      - Działanie skryptów, usługi, zarządzanie zdalne i wykonywanie poleceń pozostają bez zmian
    en:
      - The log fills faster than whoever settled its size assumed, and older events begin to be overwritten
      - A script passing a password on the command line will write that password into the log, a place open more widely than the script itself
      - Scripts generating code in a loop work more slowly, the recording costing at every running
      - The working of scripts, services, remote management and the running of commands stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Skrypty pracujące na tej maszynie przekazują poświadczenia w wierszu polecenia i nie da się ich poprawić przed wdrożeniem
      - Dziennik ma rozmiar dobrany bez uwzględnienia tego zapisu i nie ma miejsca na jego powiększenie
    en:
      - Scripts working on this machine pass credentials on the command line and cannot be mended before the rollout
      - The log has a size chosen without this recording in mind and there is no room to enlarge it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
      $name = 'EnableScriptBlockLogging'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
    $name = 'EnableScriptBlockLogging'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableScriptBlockLogging' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_logging_windows

notes:
  pl: |
    Punkt otwiera blok o tym, co po pracy zostaje zapisane. Wszystkie
    reguły w nim mają wspólną cechę, którą warto postawić wprost: żadna
    niczego nie blokuje. Dają materiał, a nie obronę — i dlatego ich wartość
    zależy od tego, czy ktoś ten materiał zbiera.

    Aplikacja powinna to mówić, bo zgodność w blokach dziennikowych bywa
    czytana jako zabezpieczenie. Dziennik zapisany na maszynie, której nikt
    nie obserwuje, i dziennik zbierany do systemu nadzoru to dwie różne
    rzeczy przy identycznym wyniku audytu.

    Skutek uboczny w postaci haseł trafiających do dziennika jest tu warty
    osobnej wzmianki, bo jest jedynym przypadkiem w całym zestawie, w którym
    punkt utwardzający potrafi rozszerzyć dostęp do poświadczeń. Nie
    unieważnia to reguły, ale wymaga przeglądu skryptów przed wdrożeniem —
    i lepiej to powiedzieć, niż zostawić do odkrycia.
  en: |
    The item opens the block about what is written down once work is done. Every
    rule in it shares a trait worth putting outright: none of them blocks anything.
    They give material rather than defence - and so their value turns on whether
    somebody gathers that material.

    The application should say so, compliance in logging blocks being at times read
    as a safeguard. A log written on a machine nobody watches and a log gathered
    into a monitoring system are two different things at an identical audit result.

    The side effect of passwords reaching the log deserves a mention of its own
    here, being the only case in the whole set where a hardening item can widen
    access to credentials. That does not undo the rule, but it calls for the scripts
    to be gone over before the rollout - and that had better be said than left to be
    found out.
