id: win2025-rpc-locator-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa lokalizatora punktów końcowych zdalnego wywołania procedur wyłączona
    en: The locator service for remote procedure call endpoints disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę prowadzącą spis nazwanych punktów końcowych
    zdalnego wywołania procedur, żeby program mógł odnaleźć usługę po
    nazwie zamiast po adresie.

    Zostawiam kategorię niską. Usługa ta pochodzi z bardzo starej
    warstwy systemu i od dawna nie jest sposobem, w jaki programy
    odnajdują się nawzajem — dzisiejsze wywołania idą inną drogą. Nie
    nasłuchuje na nic z zewnątrz w sposób, który dawałby wejście, i nie
    trzyma niczego, co byłoby warte zabrania.

    Zostaje więc wartość porządkowa i jest to jeden z tych punktów,
    przy których trzeba to powiedzieć wprost, zamiast dorabiać
    uzasadnienie. Wyłączamy składnik, który nie ma zastosowania, bo
    składnik bez zastosowania jest kodem, którego nikt nie ogląda,
    a który przy następnej podatności w tej warstwie okaże się
    uruchomiony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    uruchomiony składnik starej warstwy systemu, nieużywany i przez to
    nieobserwowany.
  en: |
    The item switches off the service that keeps a register of named ends of the far-off calling of
    workings, that a program might find a service by a name in the stead of a whereabouts.

    I leave the category low. That service comes of a very old layer of the system and has long not
    been the way whereby programs find one another - the callings of today go another road. It listens
    for nothing from without in a way that would give a way in, and it keeps nothing worth the taking.

    What is left is therefore a worth of order, and it is one of those items whereat that must be said
    outright in the stead of a standing being made up after the fact. We switch off a piece with no
    use, a piece with no use being code nobody looks upon, which at the next weakness in that layer
    will be found running.

    What an attacker gains while the item goes unmet - a running piece of an old layer of the system,
    unused and thereby unwatched.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i jest to jeden z nielicznych
    przypadków w tej paczce, w których nie obniżam klasy wobec oceny dla
    stacji roboczej mimo niskiej kategorii — a powód jest odwrotnością
    tego, do czego przywykłem w tej pracy.

    Przy większości punktów schodzę niżej, bo na serwerze nie ma
    człowieka, którego zmiana mogłaby zaboleć. Tutaj jest odwrotnie.
    Na stacji roboczej oprogramowanie sprzed dwudziestu lat jest
    rzadkością. Na serwerze jest normą — to właśnie serwery dźwigają
    aplikacje, których nikt nie przepisał, bo działają. Jeżeli gdziekolwiek
    w organizacji żyje jeszcze program odnajdujący usługi po nazwie tą
    drogą, to stoi on na serwerze, a nie na czyimś biurku.

    Sprawdzenie sprowadza się do pytania o wiek i pochodzenie aplikacji
    stojących na maszynie. Inwentaryzacja z etapu audytu jest tu
    przesłanką, nie dowodem: aplikacja napisana wewnętrznie nie ma
    producenta, po którym dałoby się ją rozpoznać, a bywa dokładnie tym
    jednym przypadkiem, który ta reguła zatrzyma.

    Skutek, gdyby wystąpił, jest natychmiastowy i dotyczy uruchomienia
    programu, nie jego działania w tle — co akurat ułatwia powiązanie
    przyczyny ze skutkiem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking", and it is one of the few cases in this pack wherein I lower
    not the class against the reckoning for a workstation for all the low category - and the ground is
    the other way about from what I have grown used to in this work.

    At most items I go lower, there being upon a server no person whom the change might hurt. Here it
    is the other way about. Upon a workstation software of twenty years ago is a rarity. Upon a server
    it is the wont - it is servers that bear the applications nobody wrote over again, they working.
    If anywhere in a house there yet live a program that finds services by a name by that road, it
    stands upon a server and not upon somebody's desk.

    The checking comes to an asking after the age and the springing of the applications standing upon
    the machine. The taking of stock from the stage of the looking over is here a ground and not a
    proof - an application written within the house has no maker whereby it might be known, and it is
    at times just that one case this rule will stop.

    The outcome, should it come about, is at once and bears upon the starting of a program and not
    upon its working in the background - which makes the binding of the ground to the outcome the
    easier.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Bardzo stary program odnajdujący usługi po nazwie tą drogą nie uruchomi się albo nie znajdzie swojego serwera
      - Aplikacja napisana wewnętrznie nie ma producenta, po którym dałoby się ją rozpoznać w inwentaryzacji
      - To serwery dźwigają aplikacje, których nikt nie przepisał, więc tu ten przypadek jest bardziej prawdopodobny niż na stacji
      - Skutek dotyczy uruchomienia programu, a nie jego działania w tle, więc łatwiej powiązać przyczynę ze skutkiem
    en:
      - A very old program that finds services by a name by that road will not start or will not find its server
      - An application written within the house has no maker whereby it might be known in the taking of stock
      - It is servers that bear the applications nobody wrote over again, so here that case is likelier than upon a workstation
      - The outcome bears upon the starting of a program and not upon its working in the background, so ground and outcome are the easier bound together
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi starsza aplikacja odnajdująca swoje usługi po nazwie przez tę warstwę systemu
    en:
      - Upon the machine there stands an older application that finds its services by a name through that layer of the system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Ask after the age of the applications on this machine, not after their
    # vendor. The one case this rule can stop is usually something written
    # in-house, which no inventory will recognise.
    Stop-Service -Name 'RpcLocator' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RpcLocator' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RpcLocator' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/the-rpc-name-service-database

