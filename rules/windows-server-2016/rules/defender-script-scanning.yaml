id: win2016-defender-script-scanning

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Real-time Protection
  title:
    pl: Skanowanie skryptów włączone
    en: Script scanning switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza sprawdzanie skryptów w chwili ich uruchamiania,
    a nie tylko plików zapisanych na dysku.

    Rozdział ten jest istotny, bo skrypt nie musi być plikiem. Może
    przyjechać w wierszu polecenia, zostać pobrany i wykonany bez zapisu,
    albo być zakodowany tak, że na dysku wygląda na ciąg przypadkowych
    znaków. Sprawdzanie plików nie ma wtedy czego obejrzeć — a sprawdzanie
    skryptów dostaje treść w chwili, gdy ta staje się zrozumiała dla
    maszyny.

    Ma to znaczenie, bo skrypty są dziś podstawowym narzędziem ataku na
    systemy tej rodziny. Powód jest praktyczny: powłoka jest na każdej
    maszynie, jest podpisana, jest zaufana i nie wzbudza podejrzeń. Napastnik,
    który posługuje się nią zamiast własnym programem, nie wnosi na maszynę
    niczego, co dałoby się rozpoznać jako obce.

    Sprawdzanie skryptów zamyka tę drogę w jedynym miejscu, w którym da się
    ją zamknąć: przy przekazaniu treści do wykonania. Wtedy zaciemnienie
    przestaje działać, bo treść musi być już czytelna.

    Na serwerze punkt waży więcej niż na stanowisku, bo administrowanie
    serwerami opiera się na skryptach i mechanizm ich uruchamiania jest tam
    zawsze dostępny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wykonania dowolnej treści przez zaufaną powłokę systemu, bez zapisywania
    czegokolwiek na dysku i bez żadnego sprawdzenia.
  en: |
    The setting switches on the checking of scripts at the moment they are run, and
    not of files saved to disk alone.

    That division matters, since a script need not be a file. It can arrive in a
    command line, be fetched and run without being saved, or be encoded so that on
    disk it looks like a string of chance characters. File checking then has nothing
    to look at - while script checking gets the content at the moment it becomes
    intelligible to the machine.

    This matters, since scripts are today the chief instrument of attack on systems
    of this family. The reason is practical: the shell is on every machine, it is
    signed, it is trusted and it raises no suspicion. An attacker wielding it
    instead of a program of their own brings onto the machine nothing that could be
    recognised as foreign.

    Script checking shuts that road at the one place it can be shut: at the handing
    of content over to be run. Obfuscation then stops working, since the content
    must by then be legible.

    On a server the item weighs more than on a workstation, administration of
    servers resting on scripts and the means of running them being always at hand
    there.

    What an attacker gains while the item goes unmet: the means of running any
    content at all through the system's trusted shell, with nothing written to disk
    and no check at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba skrypty własne
    organizacji.

    Skrypty administracyjne pisane na miejscu zawierają dokładnie te
    czynności, po których rozpoznaje się nadużycie: pobieranie plików
    z sieci, zmiany w rejestrze, uruchamianie procesów, praca na
    poświadczeniach. Nie ma sposobu, żeby odróżnić je po treści od skryptu
    napastnika, bo robią to samo.

    Skutkiem bywa więc zatrzymanie skryptu prawowitego. Zdarza się to rzadko
    i dotyczy zwykle skryptów pobranych z sieci albo takich, które zostały
    celowo skrócone i zaciemnione, żeby zmieściły się w jednym wierszu — a to
    akurat jest wzorzec kojarzony z atakiem najsilniej.

    Druga rzecz to skrypty starsze, uruchamiane przez mechanizmy sprzed
    powłoki dzisiejszej. Bywają zgłaszane częściej, bo sposób ich działania
    jest rzadziej spotykany.

    Postać pomyłki jest podobna jak przy monitorowaniu zachowania: zadanie
    po prostu się nie wykonuje, a przyczyna leży w dzienniku ochrony.
    Różnica polega na tym, że tutaj zwykle widać nazwę pliku skryptu i można
    ją odszukać.

    Obciążenie jest pomijalne — sprawdzanie dotyczy tylko chwili
    uruchomienia.

    Czego to nie psuje: usług, logowania, łączności, skryptów podpisanych
    i uruchamianych w zwykły sposób.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked are the organisation's
    own scripts.

    Administrative scripts written on the spot contain exactly those acts by which
    abuse is recognised: fetching files from the network, changes in the registry,
    starting processes, work on credentials. There is no way of telling them from an
    attacker's script by content, since they do the same thing.

    The upshot is therefore at times the halting of a lawful script. That happens
    seldom and concerns as a rule scripts fetched from the network or ones
    deliberately shortened and obscured so as to fit into one line - and that is
    precisely the pattern most strongly associated with attack.

    The second thing is older scripts, run by mechanisms predating today's shell.
    They are reported more often, their way of working being less often met with.

    The shape of a mistake is much as at behaviour monitoring: the task simply does
    not run and the cause lies in the protection's log. The difference is that here
    the script file's name is as a rule visible and can be looked up.

    The load is negligible - the checking concerns the moment of running alone.

    What this does not break: services, signing in, connectivity, or scripts signed
    and run in the ordinary way.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - macros-and-documents
  what_breaks:
    pl:
      - Skrypty administracyjne pobierane z sieci albo celowo skrócone i zaciemnione bywają zatrzymywane, bo wyglądają dokładnie tak jak skrypt napastnika
      - Skrypty starsze, uruchamiane mechanizmami sprzed dzisiejszej powłoki, są zgłaszane częściej
      - Zadanie po prostu się nie wykonuje, a przyczyna leży w dzienniku ochrony, choć zwykle widać tam nazwę pliku skryptu
      - Usługi, logowanie, łączność i skrypty uruchamiane w zwykły sposób pozostają bez zmian
    en:
      - Administrative scripts fetched from the network or deliberately shortened and obscured are at times halted, looking exactly like an attacker's script
      - Older scripts, run by mechanisms predating today's shell, are reported more often
      - The task simply does not run and the cause lies in the protection's log, though the script file's name is as a rule visible there
      - Services, signing in, connectivity and scripts run in the ordinary way stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Praca na maszynie opiera się na skryptach pobieranych z sieci i uruchamianych bez zapisu na dysku
      - Nie przejrzano skryptów administracyjnych organizacji pod kątem wzorców kojarzonych z nadużyciem
    en:
      - Work on the machine rests on scripts fetched from the network and run without being saved to disk
      - The organisation's administrative scripts have not been reviewed for patterns associated with abuse
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableScriptScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableScriptScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableScriptScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Punkt jest tanią odpowiedzią na drogę ataku, która na serwerach jest
    dziś najczęstsza. Warto to powiedzieć wprost, bo sama nazwa reguły
    brzmi technicznie i nie mówi, o co naprawdę chodzi: chodzi o to, że
    napastnik nie musi niczego wnosić, bo narzędzie już tu stoi.

    Zależność z monitorowaniem zachowania jest tu realna. Obie reguły
    pilnują tego samego rodzaju ataku z dwóch stron: jedna patrzy na treść
    wykonywaną, druga na ciąg czynności. Wdrażane razem zamykają drogę,
    którą osobno tylko utrudniają.

    Warto odnotować ograniczenie: sprawdzanie skryptów obejmuje mechanizmy,
    które je zgłaszają, a nie każdy sposób wykonania kodu. Program
    wykonujący własny interpreter nie przechodzi przez tę warstwę wcale.
    Reguła jest mocna w obszarze, który obejmuje, i nic nie mówi o reszcie.
  en: |
    The item is a cheap answer to the road of attack commonest on servers today.
    That is worth saying outright, since the rule's name sounds technical and does
    not say what is really at stake: that an attacker need bring nothing in, the
    instrument standing here already.

    The relation to behaviour monitoring is real here. Both rules watch over the
    same kind of attack from two sides: one looks at the content run, the other at
    the string of acts. Rolled out together they shut a road that apart they only
    make harder.

    A limit is worth noting: script checking takes in the mechanisms that report
    scripts, and not every way of running code. A program running an interpreter of
    its own does not pass through this layer at all. The rule is strong in the area
    it covers and says nothing about the rest.
