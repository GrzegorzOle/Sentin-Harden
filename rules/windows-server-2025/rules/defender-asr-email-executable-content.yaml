id: win2025-defender-asr-email-executable-content

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania plików wykonywalnych z poczty
    en: Executable content from email blocked from running
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła blokuje uruchomienie pliku wykonywalnego pochodzącego
    z załącznika albo z wiadomości otwartej w kliencie poczty na tej
    maszynie.

    Zanim o ocenie, jedno sprostowanie, bez którego reguła bywa czytana
    zupełnie opacznie. Punkt dotyczy klienta poczty na tej maszynie,
    a nie poczty, którą maszyna obsługuje. Serwer pocztowy nie jest
    przez tę regułę chroniony ani o włos, a wiadomości przechodzące
    przez niego do skrzynek użytkowników nie są przez nią w żaden sposób
    dotykane.

    Jest to najczęstsze nieporozumienie związane z tym punktem i chcę,
    żeby padło tutaj wprost, a nie w przypisie. Ochroną poczty
    obsługiwanej przez serwer zajmują się mechanizmy serwera
    pocztowego, a nie reguła ograniczania powierzchni ataku na maszynie.

    Obniżam kategorię do niskiej, bo na serwerze klienta poczty zwykle
    nie ma, a bez klienta poczty reguła nie ma czego dotyczyć.

    Wartość wraca na serwerze terminalowym, gdzie ludzie czytają pocztę
    — i tam wraca mocno, bo czytają ją na maszynie mającej dostęp do
    zasobów całej organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z klientem poczty — możliwość doprowadzenia do uruchomienia
    załącznika przez osobę, która go otwiera.
  en: |
    The rule blocks the running of a file to be carried out that comes of an attachment, or of a
    message opened in a client of post on this machine.

    Before the reckoning, one setting right, without which the rule is at times read quite awry.
    The item bears on the client of post on this machine and not on the post the machine serves. A
    server of post is by this rule not guarded a hair, and the messages passing through it to
    users' boxes are by it in no way touched.

    It is the commonest misunderstanding about this item and I mean it to be said here outright and
    not in a note at the foot. The guarding of the post a server serves is the business of the
    workings of the server of post and not of a rule of the narrowing of the surface of attack on
    the machine.

    I lower the category to low, a server mostly having no client of post, and without a client of
    post the rule has nothing to bear upon.

    The worth comes back on a terminal server, where people read post - and there it comes back
    strongly, they reading it on a machine that reaches the goods of the whole body.

    What an attacker gains while the item goes unmet: on a machine with a client of post - the
    means of bringing about the running of an attachment by the person who opens it.

disruption_description:
  pl: |
    Na serwerze bez klienta poczty zmiana nie robi nic. Zostaje mimo to
    poza trybem zbiorczym, bo na serwerze terminalowym robi sporo
    i jest to zmiana widoczna dla ludzi.

    Sprawdzenia wymaga to, czy w organizacji rozsyła się pocztą
    narzędzia. Bywa to praktyka stara i nadal spotykana: instalator
    w załączniku, skrypt aktualizujący, plik wsadowy od dostawcy
    systemu dziedziczonego. Po zmianie uruchomienie takiego pliku wprost
    z załącznika przestanie być możliwe.

    Obejście jest proste i warto je podać razem ze zmianą, bo inaczej
    obsługa znajdzie własne: zapisanie pliku na dysk i uruchomienie
    stamtąd nie jest przez tę regułę blokowane. Reguła dotyczy
    uruchomienia z kontekstu poczty, a nie samego pliku.

    Ma to dwie konsekwencje, które trzeba powiedzieć uczciwie. Pierwsza
    jest dobra: praca daje się dokończyć bez wyłączania zabezpieczenia.
    Druga jest gorsza: napastnik dysponuje tym samym obejściem, bo
    wystarczy poprosić odbiorcę, żeby zapisał plik przed otwarciem.
    Reguła podnosi więc koszt ataku i nie zamyka go — i tak ją oceniam.

    Objaw dla użytkownika jest natychmiastowy i niezrozumiały:
    załącznik nie uruchamia się, a komunikat nie tłumaczy powodu.
    Warto uprzedzić obsługę przed zmianą, bo pierwsze zgłoszenia
    przyjdą w ciągu godziny.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    On a server with no client of post the change does nothing. It stays outside the bulk mode for
    all that, on a terminal server doing a good deal, and being a change seen by people.

    What needs checking is whether tools are sent about by post within the body. It is an old
    practice and still met with - an installer in an attachment, a script that freshens something,
    a file of batches from the seller of an inherited system. After the change the running of such
    a file straight out of an attachment will stop being possible.

    The way round is simple and worth giving along with the change, else the staff will find their
    own - the writing of the file onto the disk and its running thence is by this rule not blocked.
    The rule bears on the running out of the stead of the post and not on the file itself.

    That has two outcomes that must be honestly said. The first is good - the work can be finished
    without switching a guard off. The second is worse - the attacker has that same way round,
    it being enough to ask the receiver to write the file down before opening it. The rule raises
    therefore an attack's cost and shuts it not - and so I reckon it.

    The symptom for the user is at once and not to be understood - the attachment does not run, and
    the word given sets forth no ground. It is worth warning the staff before the change, the first
    reports coming within the hour.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - legacy-applications
  what_breaks:
    pl:
      - Uruchomienie instalatora albo skryptu wprost z załącznika przestanie być możliwe
      - Zapisanie pliku na dysk i uruchomienie stamtąd nie jest blokowane, więc praca daje się dokończyć
      - Napastnik dysponuje tym samym obejściem, bo wystarczy poprosić odbiorcę o zapisanie pliku
      - Poczta obsługiwana przez serwer pocztowy nie jest przez tę regułę w żaden sposób dotykana
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - The running of an installer or a script straight out of an attachment will stop being possible
      - The writing of the file onto the disk and its running thence is not blocked, so the work can be finished
      - The attacker has that same way round, it being enough to ask the receiver to write the file down
      - The post a server of post serves is by this rule in no way touched
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W organizacji rozsyła się pocztą instalatory albo skrypty uruchamiane wprost z załącznika
      - Nie uprzedzono obsługi serwera terminalowego, na którym ludzie czytają pocztę
    en:
      - Installers or scripts run straight out of an attachment are sent about by post within the body
      - The staff of the terminal server whereon people read post were not warned
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This bears on the client of post on this machine, not on the post a server
    # of post serves. Its messages are in no way touched by it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'be9ba2d9-53ea-4cdc-84e5-9b1eeee46550' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

