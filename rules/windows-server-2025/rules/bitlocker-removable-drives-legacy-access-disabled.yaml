id: win2025-bitlocker-removable-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Odczyt chronionego nośnika wymiennego w starszych wersjach systemu wyłączony
    en: Reading a protected removable medium on earlier system versions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza zapisywanie na chronionym nośniku wymiennym dodatkowego,
    niezaszyfrowanego obszaru, z którego starsze systemy uruchamiają
    program do odczytu zawartości.

    Zostawiam kategorię średnią i chcę od razu powiedzieć, że tutaj rachunek
    wygląda inaczej niż przy bliźniaczej regule dla dysków stałych, bo
    byłoby nieuczciwie przepisać tamten wniosek.

    Przy dysku stałym pisałem, że druga strona tego mechanizmu jest na
    serwerze warta zero, bo program do odczytu istnieje po to, żeby ktoś
    podłączył nośnik do obcej maszyny i kliknął — a do serwera nikt nie
    podchodzi. Przy nośniku wymiennym ten scenariusz nie jest teoretyczny.
    On jest dokładnie tym, do czego nośnik wymienny służy. To jest realny
    wybór między dwiema rzeczami, a nie łatwa wygrana.

    Zostaje jednak druga strona rachunku i ona przeważa. Niezaszyfrowany
    obszar z plikiem wykonywalnym podróżuje razem z nośnikiem do każdej
    maszyny, do której ktoś ten nośnik podłączy. Plik nie pochodzi z żadnej
    instalacji, więc nie ma go w inwentaryzacji oprogramowania ani na
    listach dozwolonych aplikacji budowanych na ścieżkach. Nośnik, który
    miał być zaszyfrowany w całości, wnosi wykonywalny kod do każdego
    miejsca, w którym się pojawi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: program
    wykonywalny wędrujący razem z nośnikiem, w obszarze niezaszyfrowanym
    z założenia, w którym obecność takiego pliku nikogo nie dziwi.
  en: |
    The item switches off writing an additional, unencrypted area onto a
    protected removable medium, from which earlier systems run a program
    for reading the contents.

    I keep the category medium, and I want to say at once that the
    reckoning looks different here than at the twin rule for fixed drives,
    because copying that conclusion over would be dishonest.

    At the fixed drive I wrote that the other side of this mechanism is
    worth nothing on a server, because the reader program exists so that
    somebody can attach the medium to an unfamiliar machine and click - and
    nobody walks up to a server. With a removable medium that scenario is
    not theoretical. It is exactly what a removable medium is for. This is
    a real choice between two things, not an easy win.

    The other side of the reckoning remains, though, and it outweighs. The
    unencrypted area with an executable travels along with the medium to
    every machine somebody attaches it to. The file comes from no
    installation, so it is absent from the software inventory and from
    application allow-lists built on paths. A medium that was meant to be
    encrypted in full carries executable code into every place it appears.

    What an attacker gains while the item goes unmet: an executable
    travelling along with the medium, in an area unencrypted by design
    where such a file surprises nobody.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i tutaj, inaczej niż przy dyskach
    stałych, skutek nie jest bliski zeru. Warto to powiedzieć wprost.

    Nośnik przygotowany po tej zmianie nie otworzy się na systemie starszym
    niż ten. Na serwerze dotyczy to przypadków, które zdarzają się
    regularnie: przekazania materiału podmiotowi pracującemu na starszym
    sprzęcie, odtworzenia archiwum na maszynie przygotowanej lata temu,
    dochodzenia prowadzonego cudzymi narzędziami i wydania danych
    kontrolującemu, który przychodzi z własnym laptopem. W żadnym z tych
    przypadków dane nie giną — po prostu tamta maszyna ich nie otworzy.

    Rozstrzygnięcie nie należy więc do administratora tej maszyny w tym
    sensie, że nie wystarczy tu spojrzeć na serwer. Trzeba wiedzieć, komu
    i na czym te nośniki bywają wydawane. Jeżeli odpowiedź brzmi „zawsze
    w obrębie własnego sprzętu", zmiana jest bezbolesna. Jeżeli nie —
    potrzebna jest inna droga przekazywania danych, uzgodniona przed
    wdrożeniem, a nie po pierwszym nieudanym wydaniu.

    Szczegół techniczny, żeby nie szukać błędu tam, gdzie go nie ma:
    wartość tej reguły jest tekstem, a nie liczbą. Wyłączenie zapisuje
    słowo, nie zero, więc wpis wygląda inaczej niż sąsiednie i nie należy
    go „poprawiać".

    Zmiana dotyczy nośników szyfrowanych po niej i cofa się natychmiast.
  en: |
    I keep the class "needs review", and here, unlike at fixed drives, the
    effect is not close to zero. That is worth saying plainly.

    A medium prepared after this change will not open on a system older
    than this one. On a server this touches cases that happen regularly:
    handing material to a party working on older hardware, restoring an
    archive on a machine prepared years ago, an investigation conducted
    with somebody else's tools, and releasing data to an inspector who
    arrives with their own laptop. In none of those cases is data lost -
    that machine simply will not open it.

    So the decision does not belong to this machine's administrator in the
    sense that looking at the server is not enough. One has to know to whom
    and onto what these media are released. If the answer is "always within
    our own hardware", the change is painless. If not, another route for
    handing data over is needed, agreed before the rollout rather than
    after the first failed release.

    A technical detail, so that nobody looks for a fault where there is
    none: this rule's value is text, not a number. Switching it off writes
    a word, not a zero, so the entry looks unlike its neighbours and should
    not be "corrected".

    The change concerns media encrypted after it and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nośnik przygotowany po tej zmianie nie otworzy się na systemie starszym niż ten
      - Dotyczy przekazania materiału na starszy sprzęt, odtworzenia archiwum i wydania danych kontrolującemu z własnym laptopem
      - Rozstrzygnięcie wymaga wiedzy spoza tej maszyny — komu i na czym te nośniki bywają wydawane
      - Dane nie giną, ale potrzebna jest inna droga przekazania, uzgodniona przed wdrożeniem
    en:
      - A medium prepared after this change will not open on a system older than this one
      - This covers handing material to older hardware, restoring an archive, and releasing data to an inspector with their own laptop
      - Deciding this needs knowledge from outside the machine - to whom and onto what these media are released
      - No data is lost, but another route for handing it over is needed, agreed before the rollout
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki z tej maszyny bywają wydawane na zewnątrz i odczytywane na systemach starszych niż ten
      - Nie uzgodniono innej drogi przekazywania danych podmiotom pracującym na starszym sprzęcie
      - Procedura odtworzeniowa przewiduje podłączenie nośnika do maszyny przygotowanej lata temu
    en:
      - Media from this machine are released outside and read on systems older than this one
      - No other route for handing data to parties on older hardware has been agreed
      - The restore procedure involves attaching the medium to a machine prepared years ago
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the
      # word <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '<none>'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'RDVDiscoveryVolumeType' -ErrorAction SilentlyContinue).'RDVDiscoveryVolumeType'
    [pscustomobject]@{
      path        = $path
      name        = 'RDVDiscoveryVolumeType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle first to whom and onto what these media are released. A medium
    # prepared after this will not open on an older system, and the value here
    # is a word rather than a number - do not "correct" it to a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Rachunek wygląda tu inaczej niż przy bliźniaczej regule dla dysków
    stałych i nie należy przepisywać tamtego wniosku. Tam program do
    odczytu był wart zero, bo do serwera nikt nie podchodzi. Tu scenariusz
    „podłącz nośnik do obcej maszyny" jest dokładnie tym, do czego nośnik
    wymienny służy.

    Przeważa druga strona: niezaszyfrowany obszar z plikiem wykonywalnym
    podróżuje razem z nośnikiem do każdej maszyny, w której się pojawi,
    a pliku nie ma w inwentaryzacji, bo nikt go nie instalował.

    Rozstrzygnięcie wymaga wiedzy spoza maszyny — komu i na czym te nośniki
    bywają wydawane.
  en: |
    The reckoning looks different here than at the twin rule for fixed
    drives, and that conclusion should not be copied over. There the reader
    program was worth nothing because nobody walks up to a server. Here the
    scenario "attach the medium to an unfamiliar machine" is exactly what a
    removable medium is for.

    The other side outweighs: the unencrypted area with an executable
    travels along with the medium to every machine it appears in, and the
    file is absent from the inventory because nobody installed it.

    Deciding this needs knowledge from outside the machine - to whom and
    onto what these media are released.
