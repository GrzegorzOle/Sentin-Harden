id: win2025-defender-asr-office-child-processes

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania programów przez aplikacje pakietu biurowego
    en: Office applications blocked from launching programs
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacjom pakietu biurowego uruchamiania innych
    programów. Dokument, który po otwarciu startuje powłokę albo
    interpreter skryptów, jest najstarszym i wciąż najskuteczniejszym
    sposobem wniesienia kodu na maszynę.

    Obniżam tu kategorię względem paczki stanowiska roboczego i powód
    jest ten sam dla całej tej części grupy: na serwerze pakietu
    biurowego zwykle po prostu nie ma. Reguła, której nie ma czego
    dotyczyć, nie zdejmuje żadnego ryzyka — i lepiej to napisać, niż
    przenieść ocenę ze stanowiska i sugerować wagę, której tu nie ma.

    Wartość wraca w dwóch miejscach i oba trzeba nazwać, bo są to
    maszyny istniejące, nie przypadki teoretyczne.

    Pierwsze to serwer terminalowy. Tam pakiet biurowy jest i tam
    dokumenty otwierają ludzie — a otwierają je w kontekście maszyny,
    z której mają dostęp do udziałów całej organizacji. Ocena wraca tam
    nie do poziomu stanowiska, lecz wyżej.

    Drugie to serwer aplikacyjny generujący dokumenty. Pakiet biurowy
    uruchamiany po stronie serwera do składania raportów jest
    rozwiązaniem spotykanym mimo tego, że producent go nie zaleca.
    Na takiej maszynie reguła ma treść, bo dokument przychodzący
    z zewnątrz bywa otwierany bez udziału człowieka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z pakietem biurowym — możliwość uruchomienia własnego
    programu przez sam fakt otwarcia dokumentu.
  en: |
    The rule forbids the applications of the office bundle to run other programs. A document that
    on being opened starts a shell or a reader of scripts is the oldest and still the surest way of
    bringing code onto a machine.

    I lower the category here against the working station's pack, and the ground is the same for
    this whole part of the group - on a server there is mostly simply no office bundle. A rule with
    nothing to bear upon takes no risk away - and it is better written than carried over from the
    station, hinting at a weight which here is not.

    The worth comes back in two places and both must be named, they being machines that exist and
    no cases in theory.

    The first is a terminal server. There the office bundle is, and there documents are opened by
    people - and they open them in the stead of a machine from which they reach the shares of the
    whole body. The reckoning comes back there not to a station's level but higher.

    The second is a server of applications that makes documents. An office bundle run on the
    server's side for the setting of reports is a way of doing things that is met with, for all
    that the maker does not counsel it. On such a machine the rule has substance, a document coming
    from outside being at times opened with no person's part in it.

    What an attacker gains while the item goes unmet: on a machine with an office bundle - the
    means of running their own program by the mere opening of a document.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno pytanie: czy na tej maszynie pakiet biurowy
    w ogóle jest. Bez tego cała reszta oceny stoi w próżni, a tryb
    zbiorczy tego pytania nie zadaje — dlatego reguła zostaje poza nim
    nawet tam, gdzie odpowiedź brzmi nie.

    Jeżeli nie ma, zmiana nie robi nic.

    Jeżeli jest, do sprawdzenia są dwa przypadki.

    Pierwszy dotyczy serwera aplikacyjnego składającego dokumenty.
    Generowanie raportu potrafi uruchamiać rzeczy poboczne: konwerter
    do formatu docelowego, sterownik druku do pliku, narzędzie
    podpisujące. Każde z nich jest dla tej reguły programem
    uruchomionym przez aplikację biurową i zostanie zablokowane.

    Objaw jest cichy i to jest tutaj najgorsze. Zadanie generujące
    raporty nie zgłosi, że zostało zablokowane — zgłosi błąd albo
    zwróci dokument niepełny. Na serwerze nikt tego nie zobaczy przez
    tyle czasu, ile mija do chwili, gdy ktoś zajrzy do raportu.

    Drugi to serwer terminalowy. Tam skutek jest odwrotny — widoczny
    natychmiast i dla użytkownika. Dokumenty, które uruchamiają coś
    przy otwarciu, przestaną to robić, a komunikat nie wyjaśni powodu.
    Arkusze z wbudowaną integracją, szablony wołające zewnętrzne
    narzędzie, formularze łączące się z systemem dziedziczonym.

    Przed zmianą warto przejrzeć dziennik mechanizmu w trybie
    obserwacji przez pełen cykl raportowania, jeśli maszyna raporty
    składa, albo przez tydzień pracy, jeśli pracują na niej ludzie.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    One question needs asking - whether an office bundle is on this machine at all. Without that
    the whole rest of the reckoning stands in a void, and the bulk mode asks no such question -
    wherefore the rule stays outside it even where the answer is no.

    If there is none, the change does nothing.

    If there is, two cases are to be checked.

    The first bears on a server of applications that sets documents. The making of a report can run
    things beside it - a turner into the aimed-at shape, a driver of printing to a file, a tool
    that signs. Each of them is to this rule a program run by an office application and will be
    blocked.

    The symptom is quiet and that is here the worst of it. A task that makes reports will not
    report being blocked - it will report a fault, or give back an unfinished document. On a server
    nobody will see it for as long as it takes until somebody looks into the report.

    The second is a terminal server. There the effect is the reverse - seen at once and by the
    user. Documents that run something at their opening will stop doing so, and the word given will
    not set forth the ground. Sheets with a built-in joining, patterns that call an outward tool,
    forms that reach an inherited system.

    Before the change it is worth looking through the mechanism's log in the mode of watching over
    a full round of reporting, if the machine sets reports, or over a week of work, if people work
    upon it.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Generowanie raportów po stronie serwera przestanie uruchamiać konwertery i narzędzia poboczne
      - Zadanie raportujące zgłosi błąd albo zwróci dokument niepełny, nie podając powodu
      - Na serwerze terminalowym dokumenty uruchamiające coś przy otwarciu przestaną to robić
      - Na maszynie bez pakietu biurowego zmiana nie robi zupełnie nic
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - The making of reports on the server's side will stop running turners and tools beside them
      - A reporting task will report a fault or give back an unfinished document, naming no ground
      - On a terminal server documents that run something at their opening will stop doing so
      - On a machine with no office bundle the change does nothing at all
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer składa dokumenty pakietem biurowym i uruchamia przy tym konwertery albo narzędzia podpisujące
      - Na serwerze terminalowym ludzie pracują na dokumentach wołających zewnętrzne narzędzia
    en:
      - The server sets documents by an office bundle and runs turners or signing tools at it
      - On a terminal server people work on documents that call outward tools
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'd4f940ab-401b-4efc-aadc-ad5f3c50688a'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'd4f940ab-401b-4efc-aadc-ad5f3c50688a'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'd4f940ab-401b-4efc-aadc-ad5f3c50688a' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Obniżyłem kategorię, bo na serwerze pakietu biurowego zwykle nie ma,
    a reguła, której nie ma czego dotyczyć, nie zdejmuje ryzyka.

    Wartość wraca w dwóch miejscach: na serwerze terminalowym, gdzie
    dokumenty otwierają ludzie mający dostęp do udziałów całej
    organizacji, oraz na serwerze aplikacyjnym składającym raporty
    pakietem biurowym.

    Ten drugi przypadek jest jednocześnie źródłem uciążliwości:
    generowanie raportu uruchamia konwertery i narzędzia poboczne, a to
    dla tej reguły jest programem uruchomionym przez aplikację biurową.
    Objaw jest cichy — dokument niepełny zamiast komunikatu.
  en: |
    I lowered the category, a server mostly having no office bundle, and a rule with nothing to
    bear upon taking no risk away.

    The worth comes back in two places - on a terminal server, where documents are opened by people
    who reach the shares of the whole body, and on a server of applications that sets reports by an
    office bundle.

    That second case is at once the wellspring of the disruption - the making of a report runs
    turners and tools beside them, and that is to this rule a program run by an office
    application. The symptom is quiet - an unfinished document instead of a word given.
