id: win11-steps-recorder-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Application Compatibility
  title:
    pl: Rejestrator czynności użytkownika wyłączony
    en: The recorder of user actions switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Rejestrator czynności zapisuje, co użytkownik robi: każde kliknięcie,
    nazwę klikniętego elementu, tekst opisu okna, a do tego zrzut ekranu przy
    każdym kroku. Powstaje z tego jeden plik, który wysyła się do działu
    wsparcia, żeby pokazać, jak odtworzyć awarię.

    Narzędzie jest pomyślane jako pomoc i jako pomoc działa. Kłopot bierze się
    z tego, co ląduje w pliku obok właściwej awarii. Zrzut ekranu przy każdym
    kliknięciu łapie wszystko, co akurat było na ekranie: otwartą pocztę, dane
    klienta, nazwę zasobu sieciowego, czasem pole hasła w chwili, gdy jest
    jeszcze widoczne. Plik jest potem wysyłany pocztą, zwykle bez zabezpieczenia,
    bo jest traktowany jak zwykły załącznik.

    Napastnik z dostępem do maszyny ma w tym narzędziu gotowy rejestrator
    działań użytkownika, podpisany przez system i niewzbudzający podejrzeń
    narzędzi zabezpieczających. Nie musi niczego wnosić — uruchamia to, co
    zastał.

    Punkt wyłącza możliwość nagrywania. Program pozostaje na dysku i nie
    zostaje odinstalowany.
  en: |
    The steps recorder writes down what the user does: every click, the name of the
    element clicked, the text of the window's description, and on top of that a
    screenshot at every step. Out of this comes a single file, sent to the support
    desk to show how to reproduce a failure.

    The tool is meant as a help and works as one. The trouble comes from what lands
    in the file alongside the failure itself. A screenshot at every click catches
    whatever happened to be on screen: open mail, a client's details, the name of a
    network resource, sometimes a password field at the moment it is still visible.
    The file is then sent by mail, usually unprotected, because it is treated as an
    ordinary attachment.

    An attacker with access to the machine has in this tool a ready-made recorder of
    the user's actions, signed by the system and raising no suspicion in security
    tools. They need bring nothing in - they run what they found.

    The item switches the ability to record off. The program stays on the disk and is
    not uninstalled.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy dział wsparcia nie opiera na tym narzędziu
    swojego sposobu przyjmowania zgłoszeń.

    Tam, gdzie tak jest, zmiana boli od pierwszego dnia. Instrukcja „proszę
    nagrać kroki i przysłać plik" przestaje działać, a zastąpienie jej opisem
    słownym wydłuża każde zgłoszenie. Jest to jedyny scenariusz, w którym punkt
    jest odczuwalny, ale w niektórych organizacjach dotyczy wszystkich zgłoszeń
    naraz.

    Poza tym przypadkiem nie przestaje działać nic. Narzędzie jest używane
    rzadko i przez wąską grupę, więc na większości stanowisk wyłączenie
    przechodzi niezauważone.

    Program pozostaje zainstalowany i daje się uruchomić — odmawia dopiero
    rozpoczęcia nagrywania. Objawem jest komunikat o zablokowaniu przez
    zasady, a nie brakujący program, co ułatwia rozpoznanie przyczyny.

    Nie ma restartu.
  en: |
    What needs checking is whether the support desk does not rest its way of taking
    reports on this tool.

    Where it does, the change hurts from the first day. The instruction "please
    record the steps and send the file" stops working, and replacing it with a
    written description lengthens every report. That is the only scenario in which
    the item is felt, but in some organisations it concerns every report at once.

    Outside that case nothing stops working. The tool is used rarely and by a narrow
    group, so at most stations switching it off passes unnoticed.

    The program stays installed and will start - it refuses only to begin recording.
    The symptom is a message about being blocked by policy rather than a missing
    program, which makes the cause easier to recognise.

    There is no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Nagranie kroków odtwarzających awarię przestanie być możliwe na stanowisku użytkownika
      - Dział wsparcia opierający zgłoszenia na tym narzędziu musi zastąpić je opisem słownym
      - Wcześniej nagrane pliki otwierają się dalej; punkt dotyczy nagrywania nowych
    en:
      - Recording the steps that reproduce a failure stops being possible at the user's station
      - A support desk resting its reports on this tool has to replace it with a written description
      - Files recorded earlier still open; the item concerns recording new ones
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dział wsparcia przyjmuje zgłoszenia w postaci nagrania kroków i nie ma zamiennika
      - Stanowisko służy do przygotowywania materiałów szkoleniowych z użyciem tego narzędzia
    en:
      - The support desk takes reports in the form of recorded steps and has no replacement
      - The station is used to prepare training material with this tool
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
      $name = 'DisableUAR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    $name = 'DisableUAR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppCompat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUAR' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/planning/compatibility-administrator-users-guide

notes:
  pl: |
    Nazwa wpisu odwołuje się do wewnętrznej nazwy składnika, innej niż nazwa
    widoczna w interfejsie i inna niż nazwa ustawienia w edytorze zasad.
    Rozstrzygająca jest nazwa wpisu.

    Punkt zamyka gałąź zgodności aplikacji jako trzeci z trzech. Wdrożenie
    wszystkich trzech naraz jest właściwą kolejnością, bo dopiero razem
    zamykają zbieranie materiału o pracy na tej maszynie.

    Poziom drugi bierze się z tego, że narzędzie wymaga od napastnika dostępu
    do maszyny i sesji użytkownika. Nie jest to droga wejścia, tylko wygodne
    narzędzie dla kogoś, kto już wszedł — i właśnie dlatego jest w benchmarku.
  en: |
    The entry's name refers to the component's internal name, different from the one
    shown in the interface and different again from the setting's name in the policy
    editor. The entry's name is what settles it.

    The item closes the application compatibility key as the third of three. Rolling
    all three out at once is the right order, because only together do they close off
    the gathering of material about the work done on this machine.

    The second level comes from the tool requiring an attacker to have access to the
    machine and to a user's session. It is not a way in but a convenient tool for
    someone already inside - and that is exactly why it is in the benchmark.
