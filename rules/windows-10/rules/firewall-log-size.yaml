id: win10-firewall-log-size

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Maksymalny rozmiar dziennika zapory we wszystkich profilach
    en: The greatest size of the firewall record in all profiles
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby plik dziennika zapory w każdym profilu mieścił
    co najmniej szesnaście tysięcy kilobajtów.

    Dziennik zapory jest plikiem tekstowym o ustalonym rozmiarze. Po jego
    zapełnieniu zapora zaczyna pisać od nowa, nadpisując zapisy
    najstarsze. Rozmiar domyślny wystarcza na kilkadziesiąt minut na
    maszynie w zwykłym ruchu sieciowym.

    Skutek jest taki, że sam zapis nie daje nic. Włączenie rejestrowania
    odrzuconych pakietów i nawiązanych połączeń przy pliku zbyt małym
    kończy się dziennikiem, który sięga wstecz na tyle krótko, że
    praktycznie nie da się z niego niczego odczytać.

    Wartością nie jest więc rozmiar sam w sobie, tylko okres. Przy
    wymaganej wartości historia liczy się w dniach, a nie w minutach —
    i dopiero od tej chwili zapis nadaje się do czegokolwiek.

    Odnotowuję, że sprawdzenie podaje wartość najmniejszą z trzech
    profilów. Maszyna z dużym plikiem w profilu domenowym i domyślnym
    w publicznym jest oceniana według tego drugiego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: krótki
    okres, z którego da się odtworzyć ruch sieciowy maszyny.
  en: |
    The setting calls for the firewall's file of record in each profile to hold at least sixteen thousand
    kilobytes.

    The firewall's record is a file of text of a settled size. Once it is full the firewall begins to write from
    the start, writing over the oldest records. The default size suffices for some tens of minutes upon a machine
    in ordinary traffic.

    The upshot is that the record itself gives nothing. The turning on of the recording of cast-aside packets and
    of joinings that came through, at a file too small, ends in a record reaching back so short a way that in
    practice nothing may be read from it.

    The worth lies therefore not in the size itself but in the span. At the called-for value the history is
    reckoned in days and not in minutes - and only from that hour is the record good for anything at all.

    I set down that the check gives the smallest value of the three profiles. A machine with a great file in the
    domain profile and a default one in the public is graded by the latter.

    What an attacker gains while the item goes unmet: a short span over which the machine's traffic may be put
    back together.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana zwiększa plik na dysku systemowym do szesnastu megabajtów na
    profil, czyli do czterdziestu ośmiu megabajtów łącznie. Miejsce jest
    zajmowane w miarę zapisywania, a nie z góry.

    Odnotowuję, że przy włączonym rejestrowaniu nawiązanych połączeń
    nawet ta wartość bywa za mała. Na maszynie wykonującej dużo połączeń
    warto ją przyjąć jako dolną granicę i policzyć rzeczywiste tempo
    przyrostu.

    Miejscem wartym uwagi są maszyny z bardzo małym dyskiem systemowym.

    Skutek pojawia się natychmiast, bez restartu. Plik istniejący nie
    jest przycinany ani kasowany.

    Czego to nie psuje: przepuszczania ruchu, reguł zapory, zapisów już
    istniejących, pracy programów, drukowania.
  en: |
    The class is "no disruption".

    The change makes the file upon the system's disk greater, to sixteen megabytes to a profile, which is to say
    eight and forty together. The room is taken as the writing goes on and not beforehand.

    I set down that at the recording of joinings that came through even that value is at times too small. Upon a
    machine making many joinings it is best taken for a lower bound and the true pace of growth reckoned.

    The place worth notice is machines with a very small system disk.

    The consequence shows at once, with no restart. A standing file is neither cut back nor deleted.

    What this does not break: the letting through of traffic, the firewall's rules, records already standing, the
    work of programs, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Pliki dziennika zapory zajmą do czterdziestu ośmiu megabajtów na dysku systemowym, licząc trzy profile
      - Przy włączonym rejestrowaniu nawiązanych połączeń nawet ta wartość bywa za mała i warto policzyć tempo przyrostu
      - Miejsce jest zajmowane w miarę zapisywania, a nie z góry, więc zmiana nie zajmuje dysku natychmiast
      - Plik istniejący nie jest przycinany ani kasowany, a skutek dotyczy dalszego zapisu
      - Przepuszczanie ruchu, reguły zapory, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - The firewall s files of record will take up to eight and forty megabytes upon the system s disk, counting three profiles
      - At the recording of joinings that came through even that value is at times too small and the pace of growth is worth reckoning
      - The room is taken as the writing goes on and not beforehand, so the change takes no disk at once
      - A standing file is neither cut back nor deleted, and the consequence touches the writing that follows
      - The letting through of traffic, the firewall s rules, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk systemowy jest przycięty do minimum i nie ma na nim zapasu na powiększenie plików dziennika zapory
    en:
      - The system disk is pared to the least and holds no room to spare for the enlarging of the firewall s files of record
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The smallest of the three is reported, the weakest profile deciding how
        # far back the record truly reaches.
        $sizes = @($profiles | ForEach-Object { [int]$_.LogMaxSizeKilobytes })
        [string](($sizes | Measure-Object -Minimum).Minimum)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '16384'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogMaxSizeKilobytes |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogMaxSizeKilobytes 16384

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogMaxSizeKilobytes $p.LogMaxSizeKilobytes
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest warunkiem sensu dwóch punktów o rejestrowaniu i warto,
    żeby aplikacja pokazała całą trójkę razem. Zapis włączony przy pliku
    domyślnym jest zmianą pozorną: formalnie punkt spełniony, praktycznie
    historia liczona w minutach.

    Argument wart postawienia wprost dotyczy tego, co rozstrzyga ocenę.
    Nie rozmiar pliku, tylko okres, na jaki starcza. Ten sam plik na
    maszynie cichej wystarcza na tydzień, a na maszynie w głośnej sieci
    na godzinę — więc wartość wymagana jest punktem wyjścia, a nie
    odpowiedzią.

    Odnotowuję, że sprawdzenie podaje wartość najmniejszą z trzech
    profilów. Jest to celowe: dziennik sięga wstecz tak daleko, jak
    pozwala profil najsłabszy, a maszyna przenośna spędza w profilu
    publicznym więcej czasu, niż się zwykle zakłada.
  en: |
    The rule is the condition of the sense of two items about recording, and it is well that the application show
    all three together. A record turned on at a default file is a change in seeming: in form the item is met, in
    practice the history is reckoned in minutes.

    The argument worth putting outright touches what settles the grading. Not the file's size but the span it
    suffices for. The same file upon a quiet machine serves a week, and upon a machine in a loud network an hour -
    so the called-for value is a starting place and no answer.

    I set down that the check gives the smallest value of the three profiles. That is by design: the record
    reaches back as far as the weakest profile allows, and a machine to be carried spends in the public profile
    more time than is commonly taken for granted.
