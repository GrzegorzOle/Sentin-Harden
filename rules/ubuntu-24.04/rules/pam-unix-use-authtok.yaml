id: ubuntu2404-pam-unix-use-authtok

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.3.4.4
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_unix module
  title:
    pl: Moduł pam_unix zapisuje hasło sprawdzone wcześniej w stosie
    en: Ensure pam_unix includes use_authtok
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Z opcją use_authtok pam_unix zapisuje hasło, które przeszło już przez
    pam_pwquality i pam_pwhistory, i nie pyta o nie drugi raz. Bez niej
    pam_unix może zapisać hasło, którego te moduły nie sprawdziły.

    Punkt wymaga, żeby wiersz password z pam_unix
    w /etc/pam.d/common-password miał argument use_authtok.
  en: |
    With the use_authtok option pam_unix stores the password that already
    went through pam_pwquality and pam_pwhistory and does not ask for it
    again. Without it pam_unix may store a password these modules did not
    check.

    The item requires the password line with pam_unix in
    /etc/pam.d/common-password to have the use_authtok argument.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta pliki PAM.
  en: |
    Nobody will notice: the check only reads the PAM files.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    pam_has() {
      [ -r "$1" ] || return 1
      awk -v t="$2" -v m="$3" -v a="$4" '
        /^[ \t]*#/ || NF == 0 { next }
        { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
        $1 == t && p[n] == m && (a == "" || index(" " $0 " ", " " a " ")) { f = 1 }
        END { exit !f }' "$1"
    }
    evaluate() {
      local miss="" s f ty mo ar
      for s in common-password:password:pam_unix.so:use_authtok; do
        f=${s%%:*}; s=${s#*:}; ty=${s%%:*}; s=${s#*:}; mo=${s%%:*}; ar=${s#*:}
        pam_has "/etc/pam.d/$f" "$ty" "$mo" "$ar" || miss="$miss,$f:$ty:$mo${ar:+:$ar}"
      done
      if [ -z "$miss" ]; then echo "OK:pam_unix"; else echo "NOT_OK:missing=${miss#,}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man8/pam_unix.8.html

notes:
  pl: |
    Sprawdzenie czyta aktywne wiersze pam_unix w /etc/pam.d/common-auth,
    common-account, common-password i common-session; inne pliki
    w /etc/pam.d dołączają te cztery. Wiersze pam_unix dodaje profil unix
    z pakietu libpam-runtime, z którego pam-auth-update buduje pliki common-*
    (punkt 5.3.2.1).

    Profil unix ma dwa warianty wiersza password. Gdy przed pam_unix działa
    inny moduł haseł, na przykład pam_pwquality (punkt 5.3.2.3),
    pam-auth-update bierze wariant z use_authtok. Gdy pam_unix jest pierwszym
    modułem w stosie, bierze wariant bez tej opcji, bo pam_unix sam pyta
    wtedy o nowe hasło, i wynik jest NOT_OK. Wynik NOT_OK oznacza więc
    zwykle, że pam_pwquality nie jest włączony. Reguła tylko sprawdza stan.
  en: |
    The check reads the active pam_unix lines in /etc/pam.d/common-auth,
    common-account, common-password and common-session; other files in
    /etc/pam.d include these four. The pam_unix lines come from the unix
    profile of the libpam-runtime package, from which pam-auth-update builds
    the common-* files (item 5.3.2.1).

    The unix profile has two variants of the password line. When another
    password module runs before pam_unix, for example pam_pwquality (item
    5.3.2.3), pam-auth-update takes the variant with use_authtok. When
    pam_unix is the first module in the stack, it takes the variant without
    this option, because pam_unix then asks for the new password itself,
    and the result is NOT_OK. The NOT_OK result therefore usually means that
    pam_pwquality is not enabled. The rule only checks the state.
