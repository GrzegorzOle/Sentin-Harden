id: win11-removable-device-installation-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Instalowanie urządzeń wymiennych zablokowane
    en: Installing removable devices blocked
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Urządzenie podłączone do portu nie jest biernym nośnikiem — jest sprzętem,
    który przedstawia się systemowi i prosi o sterownik. System sterownik
    uruchamia, w jądrze, z najwyższymi uprawnieniami, zanim ktokolwiek zdąży
    zobaczyć okno.

    Stąd bierze się cała waga tego punktu. Zagrożenie nie polega na tym, co
    leży na pamięci przenośnej, bo od tego jest kontrola zawartości. Polega na
    tym, że urządzenie może podać się za coś innego, niż jest: pamięć, która
    zgłasza się jako klawiatura i zaczyna pisać polecenia; przejściówka, która
    zgłasza się jako karta sieciowa i przekierowuje ruch; kabel, w którym
    mieści się mały komputer.

    Przed takim urządzeniem nie broni ani blokada zapisu, ani szyfrowanie, ani
    program antywirusowy — bo nie ma pliku, który dałoby się sprawdzić.
    Jedyne miejsce, w którym da się to zatrzymać, jest przed uruchomieniem
    sterownika.

    Punkt zatrzymuje to właśnie tam. Urządzenie wymienne podłączone do maszyny
    nie zostanie zainstalowane, więc nie ma czego uruchomić.
  en: |
    A device plugged into a port is not a passive medium - it is hardware that
    introduces itself to the system and asks for a driver. The system starts that
    driver, in the kernel, with the highest privileges, before anyone can see a
    window.

    That is where this item's whole weight comes from. The threat is not what lies on
    a portable drive - content inspection is there for that. It is that a device can
    claim to be something other than it is: a drive that reports itself as a keyboard
    and starts typing commands; an adapter that reports itself as a network card and
    redirects traffic; a cable with a small computer inside it.

    Against such a device neither a write block, nor encryption, nor an antivirus
    program protects - because there is no file to examine. The only place it can be
    stopped is before the driver is started.

    The item stops it exactly there. A removable device plugged into the machine will
    not be installed, so there is nothing to start.

disruption_description:
  pl: |
    Jest to zmiana, którą użytkownicy zauważą natychmiast i która wymaga
    przygotowania, bo jej zakres jest szerszy, niż sugeruje nazwa.

    Zablokowane zostaje instalowanie wszystkiego, co system uznaje za wymienne —
    a jest to kategoria obejmująca znacznie więcej niż pamięci przenośne.
    Trafiają do niej także urządzenia podłączane przez porty szeregowe,
    niektóre drukarki, czytniki, telefony podłączane kablem, stacje dokujące
    i część urządzeń audio. Zakres zależy od tego, jak konkretny sprzęt
    przedstawia się systemowi, a nie od tego, czy ktoś uważa go za wymienny.

    Urządzenia zainstalowane wcześniej działają dalej — punkt dotyczy
    instalowania nowych. Skutek jest więc odroczony: maszyna działa normalnie
    do dnia, w którym ktoś podłącza coś po raz pierwszy.

    Objawem jest brak reakcji na podłączenie albo komunikat o zablokowaniu
    przez zasady. Użytkownik zgłosi to jako niedziałający port, bo tak to
    wygląda.

    Wdrożenie wymaga ustalenia listy dopuszczonego sprzętu albo świadomej
    zgody na to, że nowe urządzenia podłącza wyłącznie dział wsparcia.

    Nie ma restartu.
  en: |
    This is a change users notice at once and one that needs preparation, because its
    scope is wider than the name suggests.

    What gets blocked is the installation of everything the system counts as
    removable - a category taking in far more than portable drives. Into it also go
    devices attached through serial ports, some printers, readers, telephones
    attached by cable, docking stations and part of the audio hardware. The scope
    depends on how a given piece of hardware introduces itself to the system, not on
    whether anyone thinks of it as removable.

    Devices installed earlier keep working - the item concerns installing new ones.
    So the effect is deferred: the machine works normally until the day somebody
    plugs something in for the first time.

    The symptom is no response to the connection, or a message about being blocked by
    policy. The user will report it as a port that does not work, because that is
    what it looks like.

    The rollout calls for settling a list of admitted hardware, or a deliberate
    acceptance that new devices are attached by the support desk alone.

    There is no restart.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Nowa pamięć przenośna podłączona do maszyny nie zostanie zainstalowana i nie pojawi się w systemie
      - Telefony, czytniki i stacje dokujące podłączane po raz pierwszy przestaną się instalować
      - Drukarki i urządzenia audio zgłaszające się jako wymienne trafiają pod tę samą blokadę
      - Urządzenia zainstalowane przed wdrożeniem działają dalej bez zmian
    en:
      - A new portable drive plugged into the machine will not be installed and will not appear in the system
      - Telephones, readers and docking stations attached for the first time stop installing
      - Printers and audio devices reporting themselves as removable fall under the same block
      - Devices installed before the rollout carry on working unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownicy podłączają nowy sprzęt samodzielnie i nie ma kto zakładać wyjątków
      - Stanowisko obsługuje zmienny zestaw urządzeń zewnętrznych, na przykład w laboratorium albo w serwisie
    en:
      - Users attach new hardware themselves and there is nobody to set exceptions
      - The station handles a changing set of external devices, for instance in a laboratory or a repair shop
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      $name = 'DenyRemovableDevices'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $name = 'DenyRemovableDevices'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyRemovableDevices' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-restrictions

notes:
  pl: |
    O tym, co jest urządzeniem wymiennym, rozstrzyga system na podstawie tego,
    jak sprzęt się przedstawia — a nie kształt obudowy ani sposób podłączenia.
    Dlatego lista zablokowanego sprzętu bywa zaskakująca w obie strony:
    zawiera rzeczy, których nikt nie uważał za wymienne, i nie zawiera takich,
    które za wymienne uchodzą.

    Blokada nie odłącza urządzeń zainstalowanych wcześniej. Maszyna z gotowym
    zestawem sprzętu przechodzi wdrożenie niezauważona, a różnica pojawia się
    przy pierwszym nowym urządzeniu — często tygodnie później, gdy nikt już nie
    wiąże tego ze zmianą.

    Wyjątki zakłada się osobnymi wpisami wskazującymi identyfikatory albo klasy
    dopuszczonego sprzętu. Benchmark ich nie narzuca, bo zależą od konkretnej
    organizacji, ale bez nich ten punkt jest w wielu miejscach nie do wdrożenia.

    Punkt jest bliski regułom o zapisie na nośnikach i o szyfrowaniu nośników
    wymiennych, ale działa o poziom niżej. Tamte rozstrzygają, co wolno zrobić
    z zainstalowanym urządzeniem; ten rozstrzyga, czy w ogóle zostanie
    zainstalowane.
  en: |
    What counts as a removable device is settled by the system from how the hardware
    introduces itself - not from the shape of its casing or the way it is attached.
    So the list of blocked hardware can surprise in both directions: it holds things
    nobody thought of as removable, and leaves out things that pass for removable.

    The block does not detach devices installed earlier. A machine with its set of
    hardware already in place goes through the rollout unnoticed, and the difference
    appears with the first new device - often weeks later, when nobody connects it
    with the change any more.

    Exceptions are set by separate entries naming the identifiers or classes of
    admitted hardware. The benchmark does not impose them, as they depend on the
    particular organisation, but without them this item cannot be applied in many
    places.

    The item is close to the rules about writing to media and about encrypting
    removable media, but works a level below. Those settle what may be done with an
    installed device; this one settles whether it will be installed at all.
