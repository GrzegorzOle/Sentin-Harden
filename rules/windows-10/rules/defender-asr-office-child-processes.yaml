id: win10-defender-asr-office-child-processes

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada uruchamiania programów przez aplikacje pakietu biurowego
    en: Office applications blocked from launching programs
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania aplikacjom pakietu biurowego uruchamiania innych
    programów.

    Jest to przerwanie drogi, na której opiera się większość ataków
    zaczynających się od dokumentu. Makro w arkuszu nie zawiera kodu
    złośliwego — zawiera jedno polecenie uruchamiające powłokę, a dalej
    robotę wykonuje już narzędzie systemowe. Dokument jest tylko
    przekazem.

    Zablokowanie tego powiązania odcina drogę niezależnie od tego, co
    w makrze napisano. Nie ma znaczenia, czy polecenie jest zaciemnione,
    czy pobrane z sieci w chwili otwarcia — pakiet biurowy po prostu nie
    może uruchomić niczego.

    Odnotowuję, czego reguła nie obejmuje. Makro, które nie uruchamia
    programu, lecz działa samo w obrębie dokumentu, nie jest przez nią
    zatrzymywane. Punkt zamyka najczęstszą drogę, a nie wszystkie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    dowolnego narzędzia systemowego przez otwarcie dokumentu przez
    użytkownika.
  en: |
    The rule forbids the office suite's applications to start other programs.

    It is the breaking of the road upon which most attacks beginning with a document rest. A macro in a sheet
    holds no malicious code - it holds one command starting a shell, and from there the work is done by a system
    tool. The document is but a carrier.

    The blocking of that joining cuts the road off whatever was written in the macro. It does not matter whether
    the command is darkened or fetched from the network at the hour of opening - the office suite simply cannot
    start anything.

    I set down what the rule does not take in. A macro that starts no program but works of itself within the
    document is not stopped by it. The item closes the commonest road, not every road.

    What an attacker gains while the item goes unmet: the starting of any system tool by a user's opening of a
    document.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    w organizacji pracują arkusze uruchamiające coś na zewnątrz.

    Takie arkusze bywają. Makro pobierające dane z bazy przez zewnętrzne
    narzędzie, makro drukujące przez własny program, makro wywołujące
    skrypt do przeliczeń — wszystkie przestaną działać w chwili włączenia
    reguły.

    Skutek jest widoczny od razu i po stronie użytkownika wygląda na
    awarię dokumentu: arkusz otwiera się, makro rusza i zatrzymuje się
    bez wyjaśnienia. Zgłoszenie brzmi wtedy „przestał działać raport",
    a nie „ochrona coś zablokowała".

    Sprawdzić trzeba, czy takie arkusze są, i tu pomaga inwentaryzacja:
    obecność pakietu biurowego z makrami oraz narzędzi, które te makra
    wywołują. Odpowiedź „nie mamy takich" bywa przedwczesna, bo arkusze
    tego rodzaju rzadko są komukolwiek zgłaszane.

    Odnotowuję, że mechanizm pozwala wskazać wyjątki po ścieżce pliku.
    Nie jest to wybór między włączeniem a wyłączeniem reguły.

    Czego to nie psuje: otwierania dokumentów, makr działających w obrębie
    dokumentu, drukowania z pakietu biurowego, logowania, udziałów
    plikowych.
  en: |
    The class is "needs review", and the object of the review is whether sheets starting something outside work
    within the body.

    Such sheets there are. A macro fetching data from a database by an outside tool, a macro printing through a
    program of its own, a macro calling a script for reckonings - all will cease to work at the hour the rule is
    switched on.

    The consequence shows at once and upon the user's side looks like a fault of the document: the sheet opens,
    the macro starts and halts without a word. The report then reads "the summary stopped working", and not "the
    protection blocked something".

    What has to be reviewed is whether such sheets are, and here the taking of stock helps: the standing of an
    office suite with macros and of the tools those macros call. The answer "we have none such" is at times
    early, sheets of that kind being seldom reported to anybody.

    I set down that the mechanism allows exceptions to be named by a file's path. It is no choice between the
    switching of the rule on and off.

    What this does not break: the opening of documents, macros working within a document, printing from the
    office suite, logging on, or file shares.

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - scripting-and-automation
  what_breaks:
    pl:
      - Makro pobierające dane z bazy przez zewnętrzne narzędzie przestaje działać w chwili włączenia reguły
      - Makro drukujące przez własny program i makro wywołujące skrypt do przeliczeń zatrzymują się tak samo
      - Użytkownik widzi zatrzymanie bez wyjaśnienia i zgłasza awarię raportu, a nie zadziałanie ochrony
      - Mechanizm pozwala wskazać wyjątki po ścieżce pliku, więc nie jest to wybór zerojedynkowy
      - Otwieranie dokumentów, makra działające w obrębie dokumentu, drukowanie z pakietu biurowego i logowanie pozostają bez zmian
    en:
      - A macro fetching data from a database by an outside tool ceases to work at the hour the rule is switched on
      - A macro printing through a program of its own and a macro calling a script for reckonings halt the same way
      - The user sees a halt without a word and reports a fault of the summary, not a working of the protection
      - The mechanism allows exceptions to be named by a file s path, so it is no naught-or-one choice
      - The opening of documents, macros working within a document, printing from the office suite and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W organizacji pracują arkusze uruchamiające zewnętrzne narzędzia, a ich ścieżek nie zebrano jako wyjątków
    en:
      - Sheets starting outside tools work within the body and their paths have not been gathered as exceptions
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'd4f940ab-401b-4efc-aadc-ad5f3c50688a'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'd4f940ab-401b-4efc-aadc-ad5f3c50688a'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'd4f940ab-401b-4efc-aadc-ad5f3c50688a' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła jest w tym bloku najważniejsza i warto, żeby aplikacja
    stawiała ją pierwszą wśród szczegółowych. Zamyka drogę, od której
    zaczyna się większość ataków opartych na dokumencie.

    Argument wart postawienia wprost dotyczy tego, czym jest dokument
    w tym układzie. Nie jest nośnikiem kodu złośliwego — jest nośnikiem
    jednego polecenia, po którym robotę przejmuje narzędzie systemowe.
    Dlatego sprawdzanie zawartości dokumentu jest tu mniej skuteczne niż
    zamknięcie samego powiązania.

    Odnotowuję, że zgłoszenie po stronie użytkownika nie będzie brzmiało
    jak zgłoszenie o ochronie. Zabrzmi jak awaria raportu. Aplikacja
    opisująca ten punkt powinna to powiedzieć, bo od tego zależy, czy
    obsługa skojarzy przyczynę ze skutkiem.
  en: |
    The rule is the weightiest in this block, and it is well that the application set it first among the detailed
    ones. It closes the road most attacks resting upon a document begin at.

    The argument worth putting outright touches what a document is in that arrangement. It is no bearer of
    malicious code - it is the bearer of one command, after which a system tool takes the work over. For that the
    checking of a document's contents is here less telling than the closing of the joining itself.

    I set down that the report upon the user's side will not sound like a report about the protection. It will
    sound like a fault of the summary. An application setting this item out ought to say so, upon that hanging
    whether the support will tie the cause to the consequence.
