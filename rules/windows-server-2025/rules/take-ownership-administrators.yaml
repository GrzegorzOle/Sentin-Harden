id: win2025-take-ownership-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Przejmowanie na własność tylko dla administratorów
    en: Taking ownership restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala przejąć na własność dowolny obiekt w systemie: plik,
    katalog, gałąź rejestru, usługę, udział.

    Właściciel obiektu zajmuje pozycję szczególną, bo zawsze może zmienić
    uprawnienia do swojej własności — niezależnie od tego, co te
    uprawnienia obecnie mówią. Przejęcie własności nie daje więc dostępu
    wprost; daje możliwość nadania go sobie w kroku następnym.

    Praktycznie jest to jedno i to samo, ale rozdział na dwa kroki ma
    znaczenie przy wykrywaniu. Zmiana właściciela bywa niezauważona, bo
    uwagę przykuwa zmiana uprawnień, a nie ta, która ją umożliwiła.

    Na serwerze prawo to obejmuje zasoby, których nie ma na stanowisku
    roboczym: udziały z danymi całej organizacji, gałęzie rejestru
    z konfiguracją usług, a na kontrolerze domeny również obiekty
    katalogu. Przejęcie własności obiektu usługi pozwala zmienić
    polecenie, którym usługa jest uruchamiana — co jest drogą do
    wykonania własnego kodu na koncie systemu.

    Punkt nie każe prawa usunąć, tylko zawęzić do administratorów.
    Przejmowanie własności jest na serwerze czynnością potrzebną,
    zwłaszcza przy porządkowaniu uprawnień po odejściu właściciela
    danych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    każdego zasobu na maszynie w dwóch krokach, z których pierwszy jest
    mało widoczny.
  en: |
    The right allows ownership to be taken of any object in the system: a file, a directory, a
    registry branch, a service, a share.

    An object's owner holds a place apart, since they may always change the rights to their own
    property - whatever those rights now say. Taking ownership thus does not give access
    outright; it gives the means of granting it to oneself at the next step.

    In practice it is one and the same thing, but the parting into two steps weighs at the
    catching of it. A change of owner goes at times unnoticed, since attention is caught by the
    change of rights rather than by the one that made it possible.

    On a server the right takes in resources a working station does not have: shares with a
    whole organisation's data, registry branches with services' configuration, and on a domain
    controller the directory's objects as well. Taking ownership of a service's object allows
    the command the service is started by to be changed - which is a road to running one's own
    code under the system's account.

    The item does not bid the right be removed but narrowed to administrators. Taking ownership
    is a needed doing on a server, the more so at the putting of rights in order after a data
    owner has left.

    What an attacker gains while the item goes unmet: a road to every resource on the machine
    in two steps, of which the first is little seen.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    większości serwerów naprawa nie zmienia niczego.

    Administratorzy zachowują prawo, więc porządkowanie uprawnień
    i odzyskiwanie dostępu do zasobów po odejściu właściciela działa
    dalej bez zmiany.

    Skutek dotyczy wyłącznie kont spoza grupy administratorów, którym
    prawo nadano dodatkowo. Na serwerze bywają to konta operatorów
    odpowiadających za udziały plików i konta narzędzi do migracji
    danych, którym nadano je przy wdrożeniu i nikt nie odebrał po nim.

    Zmiana nie dotyka własności już ustalonej. Obiekty przejęte
    wcześniej pozostają przy swoich obecnych właścicielach, więc naprawa
    nie porządkuje stanu zastanego — zamyka tylko możliwość przejmowania
    kolejnych.

    Objaw, gdyby wystąpił, jest natychmiastowy i czytelny: odmowa przy
    próbie zmiany właściciela w oknie uprawnień.
  en: |
    The change has no known side effects and takes no break.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    Administrators keep the right, so the putting of rights in order and the winning back of
    access to resources after an owner has left go on working unchanged.

    The effect concerns only accounts outside the administrators' group that were granted the
    right besides. On a server those are at times the accounts of operators answering for file
    shares and the accounts of data migration tools, granted at a rollout and taken away by
    nobody after it.

    The change does not touch ownership already settled. Objects taken over earlier stay with
    their present owners, so the mending does not put the found state in order - it only shuts
    the means of taking over further ones.

    The symptom, should it arise, is immediate and plain: a refusal at a try to change the
    owner in the rights window.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Konto operatora udziałów spoza grupy administratorów nie przejmie już własności
      - Narzędzie do migracji danych z nadanym tym prawem zgłosi odmowę przy zmianie właściciela
      - Obiekty przejęte wcześniej pozostają przy swoich właścicielach i naprawa ich nie porządkuje
      - W stanie domyślnym prawo mają wyłącznie administratorzy i zmiana nie robi nic
    en:
      - A share operator's account outside the administrators' group will no longer take ownership
      - A data migration tool granted this right will report a refusal at a change of owner
      - Objects taken over earlier stay with their owners and the mending does not put them in order
      - In the default state only administrators hold the right and the change does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Operator udziałów plików pracuje na koncie spoza grupy administratorów i przejmuje własność w toku obowiązków
    en:
      - A file share operator works under an account outside the administrators' group and takes ownership in the course of their duties
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTakeOwnershipPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTakeOwnershipPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTakeOwnershipPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTakeOwnershipPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTakeOwnershipPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/take-ownership-of-files-or-other-objects

notes:
  pl: |
    Przejęcie własności nie daje dostępu wprost. Daje możliwość nadania
    go sobie w kroku następnym, bo właściciel zawsze może zmienić
    uprawnienia do swojej własności.

    Rozdział na dwa kroki ma znaczenie przy wykrywaniu: zmiana
    właściciela bywa niezauważona, bo uwagę przykuwa zmiana uprawnień,
    a nie ta, która ją umożliwiła. Punkt inspekcji obejmujący zmianę
    zasad dostępu warto czytać razem z tym.

    Naprawa nie porządkuje własności już ustalonej. Zamyka wyłącznie
    możliwość przejmowania kolejnych obiektów.
  en: |
    Taking ownership does not give access outright. It gives the means of granting it to
    oneself at the next step, since an owner may always change the rights to their own
    property.

    The parting into two steps weighs at the catching of it: a change of owner goes at times
    unnoticed, since attention is caught by the change of rights rather than by the one that
    made it possible. The auditing item taking in changes of access policy is worth reading
    together with this.

    The mending does not put ownership already settled in order. It shuts only the means of
    taking over further objects.
