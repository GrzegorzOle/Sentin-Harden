id: win2016-winrm-service-auto-config-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service
  title:
    pl: Samoczynne wystawienie usługi zarządzania zdalnego wyłączone
    en: The self-made exposure of the remote management service switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm, który sam z siebie tworzy nasłuch usługi
    zarządzania zdalnego na adresach maszyny i sam otwiera dla niego przejście
    w zaporze.

    Mechanizm ten powstał dla wygody: zamiast konfigurować zarządzanie
    zdalne na każdej maszynie z osobna, wystarczy włączyć zasadę i nasłuch
    pojawia się wszędzie. Wygoda ta ma jednak cenę, którą warto nazwać.

    Po pierwsze, nasłuch powstaje na adresach pasujących do wskazanego
    zakresu, a zakres bywa szeroki. Maszyna z kilkoma kartami sieciowymi
    zaczyna słuchać również tam, gdzie nikt jej słuchać nie kazał — na
    interfejsie do kopii zapasowych, na sieci zarządzania sprzętem, na
    segmencie testowym.

    Po drugie, mechanizm otwiera przejście w zaporze bez pytania, więc
    decyzja o wystawieniu usługi zapada poza tym, kto zaporą zarządza.

    Po trzecie, nasłuch powstaje na nowo po każdej zmianie adresacji. To, co
    zamknięto ręcznie, wraca przy następnym odświeżeniu zasad.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    usługi zarządzania zdalnego z segmentów, w których nikt się jej nie
    spodziewa, a więc i nikt jej tam nie obserwuje.
  en: |
    The setting switches off the mechanism that of itself makes a listener for the
    remote management service on the machine's addresses and of itself opens a way
    through for it in the firewall.

    That mechanism came about for convenience: instead of setting remote management
    up on every machine apart, it is enough to switch a policy on and the listener
    appears everywhere. That convenience has a price, though, and it is worth
    naming.

    First, the listener comes up on addresses matching a named range, and the range
    is at times wide. A machine with several network cards begins listening also
    where nobody told it to listen - on the interface for backups, on the network
    for managing hardware, on a test segment.

    Second, the mechanism opens a way through in the firewall without asking, so the
    decision to expose the service is taken outside whoever manages the firewall.

    Third, the listener comes up anew after every change of addressing. What was
    shut by hand returns at the next refreshing of the policies.

    What an attacker gains while the item goes unmet: access to the remote
    management service from segments where nobody expects it, and so where nobody
    watches it either.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba rzecz prostą i łatwą do
    przeoczenia: czy zarządzanie zdalną tą maszyną opiera się właśnie na
    tym mechanizmie.

    Jeżeli tak, wyłączenie odbiera nasłuch i maszyna przestaje być
    osiągalna dla narzędzi, które się z nią łączą. Jest to skutek
    natychmiastowy i dotyczy również narzędzia, którym ktoś właśnie tę
    zmianę wykonuje.

    Jest to jedyny realnie niebezpieczny scenariusz tej reguły i warto go
    postawić wprost: zmiana wykonana zdalnie przez zarządzanie zdalne
    potrafi odciąć wykonującego od maszyny. Odzyskanie dostępu wymaga wtedy
    konsoli, karty zarządzającej albo wizyty przy sprzęcie.

    Nasłuch utworzony wcześniej przez ten mechanizm nie znika sam po
    wyłączeniu zasady. Znaczy to, że skutek bywa opóźniony do pierwszego
    restartu usługi albo do ręcznego usunięcia nasłuchu — i że raport
    zgodny nie dowodzi jeszcze, iż nasłuchu nie ma.

    Czego to nie psuje: nasłuchów utworzonych ręcznie, połączeń już
    zestawionych, pulpitu zdalnego, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is a simple thing easy
    to overlook: whether the remote management of this machine rests on that very
    mechanism.

    If it does, switching it off takes the listener away and the machine ceases to
    be reachable for the tools that connect to it. That consequence is immediate and
    touches the very tool with which somebody is making this change.

    That is the only genuinely dangerous scenario of this rule, and it is worth
    putting outright: a change made remotely through remote management can cut the
    maker off from the machine. Getting access back then calls for a console, a
    management card, or a visit to the hardware.

    A listener made earlier by that mechanism does not vanish of itself once the
    policy is off. That means the consequence is at times put off until the
    service's first restart or until the listener is removed by hand - and that a
    compliant report does not yet prove there is no listener.

    What this does not break: listeners made by hand, connections already
    established, the remote desktop, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna zarządzana wyłącznie przez nasłuch utworzony tym mechanizmem przestaje być osiągalna dla narzędzi, które się z nią łączą
      - Zmiana wykonana zdalnie przez zarządzanie zdalne potrafi odciąć wykonującego od maszyny, a odzyskanie dostępu wymaga konsoli albo karty zarządzającej
      - Nasłuch utworzony wcześniej nie znika sam, więc raport zgodny nie dowodzi jeszcze, że nasłuchu nie ma
      - Nasłuchy utworzone ręcznie, połączenia już zestawione i pulpit zdalny pozostają bez zmian
    en:
      - A machine managed only through a listener made by that mechanism ceases to be reachable for the tools that connect to it
      - A change made remotely through remote management can cut the maker off from the machine, and getting access back calls for a console or a management card
      - A listener made earlier does not vanish of itself, so a compliant report does not yet prove there is no listener
      - Listeners made by hand, connections already established and the remote desktop stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zarządzanie tą maszyną opiera się na nasłuchu tworzonym samoczynnie i nie przygotowano nasłuchu ustawionego ręcznie
      - Maszyna nie ma konsoli ani karty zarządzającej, a zmiana byłaby wykonywana zdalnie przez zarządzanie zdalne
    en:
      - The management of this machine rests on the listener made of itself and no listener set by hand has been prepared
      - The machine has neither a console nor a management card, and the change would be made remotely through remote management
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'AllowAutoConfig'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowAutoConfig'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAutoConfig' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    Punkt jest jedyny w tym bloku, którego wykonanie może odciąć
    wykonującego od maszyny, i aplikacja powinna o tym mówić głośniej niż
    o samej zgodności. Jest to dokładnie ten przypadek, w którym podgląd
    skutków przed wykonaniem ma sens ratunkowy, a nie informacyjny.

    Rozróżnienie między wyłączeniem mechanizmu a usunięciem nasłuchu jest
    tu treścią. Zasada mówi, że nasłuch nie ma powstawać. Nie mówi, że
    nasłuch istniejący ma zniknąć. Raport zgodny na maszynie z nasłuchem
    utworzonym wcześniej jest zgodny i niepełny zarazem — i warto to
    napisać, zamiast pozwolić czytelnikowi domyślić się inaczej.

    Kategoria średnia jest świadoma. Punkt nie zamyka drogi uwierzytelnienia
    ani nie chroni treści; ogranicza miejsca, w których usługa jest
    osiągalna. Wartość leży w zawężeniu pola, nie w odparciu ataku.
  en: |
    The item is the only one in this block whose execution can cut its maker off
    from the machine, and the application should say so more loudly than it says
    anything about compliance. It is exactly the case where a preview of
    consequences before execution has a rescuing sense rather than an informative
    one.

    The distinction between switching the mechanism off and removing the listener is
    the substance here. The policy says a listener is not to come up. It does not
    say an existing listener is to vanish. A compliant report on a machine with a
    listener made earlier is compliant and incomplete at once - and that had better
    be written down than left for the reader to guess otherwise.

    The medium category is deliberate. The item shuts no road of authentication and
    guards no contents; it limits the places where the service is reachable. The
    value lies in the narrowing of a field rather than in the turning back of an
    attack.
