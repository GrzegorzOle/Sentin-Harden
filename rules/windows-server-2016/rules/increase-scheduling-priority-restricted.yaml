id: win2016-increase-scheduling-priority-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Podnoszenie priorytetu planowania tylko dla administratorów
    en: Raising scheduling priority restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do podnoszenia priorytetu planowania procesu do
    grupy administratorów lokalnych.

    Priorytet rozstrzyga, który proces dostaje czas procesora wcześniej.
    Zwykle rozdziela to system i robi to tak, żeby nic nie zostało całkiem
    pominięte. Uprawnienie opisane tym punktem pozwala tę kolejność narzucić —
    również cudzemu procesowi.

    Proces podniesiony do priorytetu czasu rzeczywistego wypiera praktycznie
    wszystko inne, łącznie z obsługą wejścia i z usługami systemu. Maszyna
    przestaje odpowiadać, a przyczyna nie jest widoczna w żadnym dzienniku:
    nic się nie zawiesiło, nic nie zgłosiło błędu, po prostu nie dostaje czasu.

    Nadużycie idzie też w drugą stronę — obniżenie priorytetu cudzemu procesowi
    spowalnia wybrany program, na przykład mechanizm zabezpieczający albo agenta
    zbierającego dzienniki, nie zatrzymując go i nie wywołując alarmu.

    Kategoria średnia: to nie jest droga wejścia, tylko sposób na odebranie
    maszynie zdolności reagowania i na wyciszenie tego, co obserwuje.

    Na serwerze 2016 uprawnienie domyślnie należy do administratorów, a na
    maszynie z rolą pulpitu — także do grupy menedżera okien.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyciszenia mechanizmów obserwujących maszynę albo pozbawienia jej zdolności
    odpowiadania, bez wywoływania błędu.
  en: |
    The item limits the right to raise a process's scheduling priority to the local
    administrators group.

    Priority settles which process gets processor time sooner. The system normally
    apportions that, and does so in a way that leaves nothing wholly passed over.
    The right this item describes allows that order to be imposed - on somebody
    else's process too.

    A process raised to real-time priority crowds out practically everything else,
    the handling of input and the system's services included. The machine stops
    answering, and the cause is visible in no log: nothing hung, nothing reported an
    error, it simply gets no time.

    Abuse runs the other way as well - lowering another process's priority slows a
    chosen program, a protective mechanism or a log-collecting agent, say, without
    stopping it and without raising an alarm.

    The category is medium: this is no way in, only a means of taking from the
    machine its ability to respond and of quieting what watches.

    On Server 2016 the right belongs by default to the administrators, and on a
    machine with the desktop role, to the window manager group as well.

    What an attacker gains while the item goes unmet: the ability to quiet the
    mechanisms watching the machine, or to deprive it of the ability to answer,
    without raising an error.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zwykła praca priorytetów nie zmienia, a jedyny
    domyślny wpis poza administratorami — grupa menedżera okien — zostaje
    zachowany przez polecenie naprawcze, jeżeli już tam jest.

    Wpisy dodane ręcznie biorą się zwykle z oprogramowania do przetwarzania
    dźwięku, obrazu albo akwizycji danych, czyli z programów, dla których
    opóźnienie jest błędem. Na serwerze takie oprogramowanie występuje rzadko,
    ale występuje — sterownie i systemy pomiarowe bywają uruchamiane właśnie
    tak.

    Objaw odebrania uprawnienia jest łagodny: program działa, tylko gorzej
    znosi obciążenie. Nie zgłasza błędu, więc trzeba wiedzieć, czego szukać.

    Czego to nie psuje: uruchamiania programów, pracy usług, obniżania
    priorytetu własnego procesu ani planowania zadań.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Ordinary work does not change priorities, and the
    one default entry beyond the administrators - the window manager group - is kept
    by the remediation command where it is already there.

    Entries added by hand usually come of software for processing sound or images,
    or for acquiring data - programs for which delay is an error. On a server such
    software is rare, but it occurs: control and measurement systems are sometimes
    started just so.

    The symptom of taking the right away is mild: the program runs, only it bears
    load less well. It reports no error, so one has to know what to look for.

    What this does not break: starting programs, the work of services, lowering
    one's own process's priority, or task scheduling.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - Oprogramowanie pomiarowe albo sterujące uruchamiane na koncie spoza grupy administratorów przestaje podnosić swój priorytet
      - Program działa dalej, tylko gorzej znosi obciążenie, i nie zgłasza przy tym żadnego błędu
      - Grupa menedżera okien zostaje na liście, jeżeli już tam była, więc rola pulpitu działa bez zmian
      - Uruchamianie programów, planowanie zadań i obniżanie priorytetu własnego procesu pozostają nietknięte
    en:
      - Measurement or control software started under an account outside the administrators group stops raising its priority
      - The program goes on running, only it bears load less well, and reports no error while doing so
      - The window manager group stays on the list where it already was, so the desktop role works unchanged
      - Starting programs, task scheduling and lowering one's own process's priority stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie pomiarowe albo sterujące, dla którego opóźnienie jest błędem, uruchamiane na koncie spoza grupy administratorów
    en:
      - Measurement or control software for which delay is an error runs on the machine under an account outside the administrators group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-90-0)?|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeIncreaseBasePriorityPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The window manager group stays in the list where it is already there, since
    # removing it disturbs the desktop role. A real-time process crowds out even the
    # handling of input.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = '*S-1-5-32-544'
    if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') {
      if ($Matches[1] -match 'S-1-5-90-0') { $value = '*S-1-5-32-544,*S-1-5-90-0' }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeIncreaseBasePriorityPrivilege = ' + $value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeIncreaseBasePriorityPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/increase-scheduling-priority

notes:
  pl: |
    Polecenie naprawcze odczytuje stan bieżący i zachowuje grupę menedżera
    okien, jeżeli już tam jest. Oczekiwanie dopuszcza zatem dwa poprawne stany:
    samych administratorów albo administratorów wraz z tą grupą.

    Punkt jest jedynym w tej grupie, którego nadużycie potrafi unieruchomić
    maszynę bez jednego wpisu w dzienniku. Warto to zapamiętać przy diagnozie
    serwera, który przestał odpowiadać bez widocznej przyczyny.

    Obniżanie priorytetu własnego procesu nie wymaga tego uprawnienia i
    pozostaje możliwe dla każdego. Reguła dotyczy podnoszenia i dotykania
    procesów cudzych.
  en: |
    The remediation command reads the present state and keeps the window manager
    group where it is already there. The expectation therefore admits two correct
    states: the administrators alone, or the administrators together with that
    group.

    The item is the only one in the group whose abuse can bring the machine to a
    standstill without a single entry in a log. That is worth remembering when
    diagnosing a server that stopped answering for no visible cause.

    Lowering one's own process's priority needs no such right and stays open to
    anybody. The rule bears on raising it and on touching other processes.
