id: win2025-setup-log-size

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Setup
  title:
    pl: Maksymalny rozmiar dziennika instalacji
    en: Maximum size of the setup log
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę rozmiaru dziennika instalacji.

    Zostawiam kategorię niską i chcę odnotować rzecz, która odróżnia ten
    punkt od trzech pozostałych rozmiarów: jest to jedyny z nich, przy
    którym liczba z benchmarku naprawdę wystarcza.

    Przy dzienniku zabezpieczeń i systemowym pisałem, że wymagany rozmiar
    jest dolną granicą i na serwerze obejmuje często godziny. Tutaj jest
    odwrotnie. Zapisy trafiają do tego dziennika tylko wtedy, gdy ktoś
    zmienia skład maszyny — dodaje rolę, instaluje poprawkę, podnosi
    wersję systemu. Na serwerze, który po postawieniu zmienia się kilka
    razy w roku, taki rozmiar obejmuje całe życie maszyny, od pierwszej
    instalacji do dziś.

    Jest to więc punkt, który za bardzo małą cenę daje jedyną w systemie
    ciągłą historię tego, co na maszynie zainstalowano. Rzadko się zdarza,
    żeby zgodność z benchmarkiem wychodziła aż tak tanio, i warto to
    zauważyć, bo przy większości punktów tej paczki jest inaczej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio; przy dzienniku wymierzonym zbyt ciasno — nadpisanie
    zapisów o tym, co i kiedy zostało na maszynie zainstalowane.
  en: |
    The item sets the lower bound of the size of the setup log.

    I leave the category low and would note a thing that sets that item apart from the three other
    sizes - it is the one of them whereat the number from the benchmark is truly enough.

    At the security log and at the system log I wrote that the asked-for size is a lower bound and upon
    a server often holds hours. Here it is the other way about. Writings come into that log only when
    somebody alters the make-up of the machine - adds a role, sets on a mending, raises the make of the
    system. Upon a server that after its setting up alters a few times a year, such a size holds the
    whole life of the machine, from the first installing until today.

    It is therefore an item that for a very small price gives the one unbroken tale in the system of
    what was installed upon the machine. It seldom befalls that a following of the benchmark comes out
    so cheap, and it is worth the marking, at most items of this pack it being otherwise.

    What an attacker gains while the item goes unmet - little straightway; at a log meted out too
    tightly, the writing over of the writings upon what was installed upon the machine and when.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce, niczego nie zatrzymuje i nie wymaga restartu, a miejsce
    na dysku zajmuje w rozmiarze, który na serwerze jest nieodczuwalny.

    W odróżnieniu od dziennika zabezpieczeń nie mam tu nawet zastrzeżenia
    o dobieraniu rozmiaru ponad minimum, bo dobierać nie ma czego.
    Dziennik instalacji rośnie o kilka zapisów przy każdej zmianie
    w maszynie i wymagana wartość starcza na lata.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule, stops nothing and takes no
    starting anew, and the room upon the disk it takes is of a bigness that upon a server is not to be
    felt.

    Unlike at the security log I have here not even a saving upon the choosing of a size above the
    least, there being nothing to choose. The setup log grows by a few writings at every change within
    the machine, and the asked-for worth suffices for years.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Zajęte zostaje dodatkowe miejsce na woluminie systemowym, w rozmiarze na serwerze nieodczuwalnym
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Nie ma tu czego dobierać ponad minimum, bo wymagana wartość starcza na lata zapisów
      - Cofnięcie zmiany nie odzyskuje zapisów nadpisanych w międzyczasie, choć zebranych nie kasuje
    en:
      - Further room upon the roll of the system is taken, of a bigness upon a server not to be felt
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - There is here nothing to choose above the least, the asked-for worth sufficing for years of writings
      - The undoing of the change wins not back the writings written over in the meanwhile, though it wipes not those gathered
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumin systemowy jest wymierzony bardzo ciasno i nie ma na nim zapasu na dziennik tej wielkości
    en:
      - The roll of the system is meted out very tightly and there is upon it no store for a log of that bigness
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
      $name = 'MaxSize'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The one log size item where the benchmark number is genuinely enough:
    # entries arrive only when the make-up of the machine changes, so this
    # covers the whole life of a server.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Jedyny z czterech punktów o rozmiarze, przy którym liczba
    z benchmarku naprawdę wystarcza. Zapisy trafiają tu tylko przy
    zmianie składu maszyny, więc na serwerze zmieniającym się kilka razy
    w roku taki rozmiar obejmuje całe życie maszyny.

    Za bardzo małą cenę daje jedyną w systemie ciągłą historię tego, co
    na maszynie zainstalowano.

    Rzadko zdarza się, żeby zgodność wychodziła tak tanio — przy
    większości punktów tej paczki jest inaczej i warto to zauważyć.
  en: |
    The one of the four items upon size whereat the number from the benchmark is truly enough. Writings
    come here only at a change in the make-up of the machine, so upon a server altering a few times a
    year such a size holds the whole life of the machine.

    For a very small price it gives the one unbroken tale in the system of what was installed upon the
    machine.

    It seldom befalls that a following comes out so cheap - at most items of this pack it is otherwise,
    and it is worth the marking.
