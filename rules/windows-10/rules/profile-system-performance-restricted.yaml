id: win10-profile-system-performance-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Profilowanie wydajności systemu ograniczone do administratorów i usługi diagnostycznej
    en: The measuring of the system performance bounded to administrators and the service of diagnosis
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo profilowania wydajności systemu do
    administratorów i konta usługi diagnostycznej.

    Profilowanie systemowe jest pomiarem obejmującym całą maszynę:
    pokazuje, które procesy działają, ile czasu procesora zużywają
    i w jakich chwilach. Służy do szukania przyczyn spowolnień.

    Wartość dla napastnika polega na rozpoznaniu. Pomiar taki pozwala
    wypisać wszystkie procesy działające na maszynie, łącznie z tymi,
    których zwykły użytkownik nie widzi na liście zadań. Widać z niego,
    jakie oprogramowanie ochronne jest uruchomione, jak często skanuje
    i kiedy maszyna jest najmniej obciążona.

    Odnotowuję, że nie jest to dostęp do danych ani do pamięci procesów.
    Jest to wgląd w to, co na maszynie pracuje — czyli materiał do
    zaplanowania dalszych kroków, a nie sam krok.

    Konto usługi diagnostycznej pozostaje w wykazie. Bez niego przestaje
    działać wbudowane zbieranie pomiarów wydajności.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny obraz
    procesów działających na maszynie, łącznie z oprogramowaniem ochronnym.
  en: |
    The setting bounds the right of measuring the system's performance to the administrators and to the account of
    the service of diagnosis.

    The system's measuring reaches the whole machine: it shows which processes work, how much of the processor's
    time they spend and at what hours. It serves for the seeking of the grounds of slownesses.

    The worth to an attacker lies in the looking over. Such a measuring lets every process working upon the
    machine be written out, those among them an ordinary user does not see in the list of tasks. From it is seen
    what guarding software is running, how often it scans and when the machine stands least under load.

    I set down that it is no way into data nor into processes' memory. It is a sight of what works upon the
    machine - which is to say matter for the laying of further steps and not a step itself.

    The account of the service of diagnosis stays in the list. Without it the built-in gathering of measurements
    of performance ceases to work.

    What an attacker gains while the item goes unmet: a full picture of the processes working upon the machine,
    the guarding software among them.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz odpowiada już wymaganiu i na maszynie utrzymywanej
    normalnie zmiana jest zapisem stanu.

    Odnotowuję jedyne miejsce warte spojrzenia: systemy monitorujące
    zbierające pomiary wydajności z konta usługowego. Część z nich używa
    do tego liczników wydajności, które przez ten mechanizm nie
    przechodzą, część sięga po pomiar systemowy. Po zmianie te drugie
    przestaną zbierać dane i maszyna zniknie z wykresów zamiast zgłosić
    błąd.

    Usunięcie z wykazu konta usługi diagnostycznej zatrzymałoby wbudowane
    zbieranie pomiarów.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy programów użytkowych, wydajności maszyny,
    logowania, dostępu do plików, drukowania.
  en: |
    The class is "no disruption".

    The default list already answers the requirement, and upon a machine kept in the ordinary way the change is a
    setting down of a state.

    I set down the one place worth a look: systems that watch and gather measurements of performance from a
    service account. Some of them use for that the counters of performance, which do not pass through this
    mechanism; some reach for the system's measuring. After the change the latter will cease to gather data and
    the machine will vanish from the charts rather than report a fault.

    The taking of the account of the service of diagnosis out of the list would hold the built-in gathering of
    measurements.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the work of programs of use, the machine's speed, logging on, the way to files, or
    printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Systemy monitorujące sięgające po pomiar systemowy przestaną zbierać dane z tej maszyny
      - Maszyna zniknie z wykresów zamiast zgłosić błąd, więc brak danych bywa zauważony późno
      - Usunięcie z wykazu konta usługi diagnostycznej zatrzymałoby wbudowane zbieranie pomiarów
      - Domyślny wykaz odpowiada już wymaganiu, więc na większości maszyn zmiana jest zapisem stanu
      - Praca programów użytkowych, wydajność maszyny, logowanie, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - Systems that watch and reach for the system s measuring will cease to gather data from this machine
      - The machine will vanish from the charts rather than report a fault, so the want of data is at times marked late
      - The taking of the account of the service of diagnosis out of the list would hold the built-in gathering of measurements
      - The default list already answers the requirement, so upon most machines the change is a setting down of a state
      - The work of programs of use, the machine s speed, logging on, the way to files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje system monitorujący zbierający pomiar systemowy z własnego konta usługowego
    en:
      - Upon the machine works a system that watches and gathers the system s measuring from a service account of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420)?|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemProfilePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemProfilePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the account of the service of
    # diagnosis. Without the second the built-in gathering of measurements stops.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemProfilePrivilege = *S-1-5-32-544,*S-1-5-80-3139157870-2983391045-3678747466-658725712-1809340420',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemProfilePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/profile-system-performance

notes:
  pl: |
    Reguła jest parą do punktu o profilowaniu pojedynczego procesu i warto,
    żeby aplikacja pokazała je razem oraz wyjaśniła różnicę zasięgu.
    Tamten dotyczy jednego procesu, ten całej maszyny — a rozpoznanie
    opiera się właśnie na obrazie całości.

    Argument wart zachowania dotyczy tego, że nie jest to dostęp do
    danych. Napastnik nie odczyta z pomiaru zawartości pamięci ani plików.
    Odczyta natomiast, co działa, jak często i kiedy — czyli dokładnie to,
    czego potrzebuje, żeby wybrać moment i sposób działania.

    Odnotowuję konto usługi diagnostycznej w wykazie dopuszczalnym.
    Ma ono postać długiego identyfikatora usługi i bywa brane za wpis
    przypadkowy. Nie jest — wykaz zawężony do samych administratorów
    zatrzyma wbudowane zbieranie pomiarów wydajności.
  en: |
    The rule is the pair of the item about the measuring of a single process, and it is well that the application
    show them together and set out the difference of reach. That one touches one process, this the whole machine -
    and the looking over rests upon just the picture of the whole.

    The argument worth keeping touches this, that it is no way into data. The attacker will read from the
    measuring neither the content of memory nor of files. They will read however what works, how often and when -
    which is to say just what they need for the choosing of the hour and the manner of their doing.

    I set down the account of the service of diagnosis in the list that is let in. It bears the shape of a long
    name of a service and is at times taken for an entry come by chance. It is not - a list narrowed to the
    administrators alone will hold the built-in gathering of measurements of performance.
