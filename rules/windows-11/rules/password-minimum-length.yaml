id: win11-password-minimum-length

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Minimalna długość hasła
    en: Minimum password length
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Długość hasła jest jedyną jego cechą, która realnie przekłada się na koszt
    złamania. Wymagania co do znaków specjalnych dają w praktyce niewiele, bo
    ludzie spełniają je w przewidywalny sposób, a narzędzia do łamania znają te
    wzorce lepiej niż autorzy polityk.

    Krótkie hasło do konta lokalnego jest groźne nie samo w sobie, tylko dlatego,
    że jego skrót wycieka razem z maszyną i łamie się poza nią, bez limitu prób
    i bez śladu w dziennikach. Wydłużenie minimum przesuwa ten koszt z minut na
    czas, w którym hasło zdąży się zmienić.
  en: |
    Length is the only property of a password that translates into a real cost
    of cracking it. Requirements about special characters achieve little in
    practice, because people satisfy them in predictable ways, and cracking
    tools know those patterns better than policy authors do.

    A short password on a local account is dangerous not in itself but because
    its hash leaks together with the machine and is cracked off it, with no
    attempt limit and no trace in any log. Raising the minimum pushes that cost
    from minutes into a span in which the password will have changed anyway.

disruption_description:
  pl: |
    Zmiana nie unieważnia haseł już ustawionych — zadziała przy najbliższej
    zmianie. Właśnie dlatego wymaga zaplanowania: samo podniesienie minimum bez
    wymuszenia zmiany poprawia raport, a nie bezpieczeństwo.

    Odczuwalny skutek pojawia się przy kontach używanych przez oprogramowanie,
    a nie przez ludzi: usługi, zadania harmonogramu i integracje mają hasła
    wpisane w konfiguracji. Zmiana hasła takiego konta bez jednoczesnej
    aktualizacji tej konfiguracji zatrzymuje usługę, zwykle przy następnym
    uruchomieniu, czyli z opóźnieniem.
  en: |
    The change does not invalidate passwords already set - it takes effect at
    the next change. That is exactly why it needs planning: raising the minimum
    without forcing a change improves the report, not the security.

    The noticeable effect appears on accounts used by software rather than
    people: services, scheduled tasks and integrations have passwords written
    into their configuration. Changing such an account's password without
    updating that configuration at the same time stops the service, usually at
    its next start, that is, with a delay.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Konta usług i zadań harmonogramu z hasłem w konfiguracji przestaną startować po jego zmianie
      - Użytkownicy z krótkimi hasłami nie zmienią ich na dotychczasowe i zgłoszą to jako usterkę
      - Skrypty automatyzacji przechowujące hasło w pliku wymagają aktualizacji w tym samym oknie serwisowym
    en:
      - Service and scheduled-task accounts with a password in their configuration stop starting once it changes
      - Users with short passwords cannot keep their current one and will report it as a fault
      - Automation scripts holding a password in a file need updating within the same maintenance window
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa usługa z hasłem wpisanym w konfiguracji, której nie da się teraz zaktualizować
      - Stacja jest zarządzana polityką domeny, która i tak nadpisze ustawienie lokalne przy odświeżeniu
    en:
      - The machine runs a service with a password written into its configuration that cannot be updated now
      - The workstation is managed by a domain policy that overwrites the local setting at the next refresh
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '14'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MinimumPasswordLength'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordLength = 14',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordLength = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-length

notes:
  pl: |
    Kopia zapasowa zapisuje wyłącznie tę jedną wartość, a nie całą politykę
    zabezpieczeń lokalnych. Pełny eksport byłby wygodniejszy, ale wycofanie
    cofałoby wtedy także wszystko, co zmieniło się w międzyczasie — zakres kopii
    ma odpowiadać zakresowi zmiany.

    To jedyny punkt w tej paczce, którego sprawdzenie tworzy plik tymczasowy:
    ustawienia polityki lokalnej nie leżą w rejestrze i odczytuje się je przez
    eksport. Plik jest kasowany zaraz po odczycie, a konfiguracja systemu nie
    jest przy tym zmieniana.
  en: |
    The backup records this one value only, not the whole local security policy.
    A full export would be more convenient, but a rollback would then also undo
    everything changed in the meantime - the scope of the backup has to match
    the scope of the change.

    This is the only item in this pack whose check creates a temporary file:
    local policy settings do not live in the registry and are read through an
    export. The file is deleted straight after reading, and the system
    configuration is not altered in the process.
