id: win2016-firewall-log-size

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Firewall with Advanced Security > Logging
  title:
    pl: Maksymalny rozmiar dziennika zapory dla wszystkich profili
    en: Maximum size of the firewall log for every profile
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę pojemności dziennika zapory — osobno dla profilu
    domenowego, prywatnego i publicznego.

    Dziennik zapory jest czymś innym niż dzienniki zdarzeń. Nie trafia do
    podglądu zdarzeń, tylko do zwykłego pliku tekstowego, i nie zapisuje tego,
    co system zrobił z uprawnieniami, tylko to, co przeszło przez interfejs
    sieciowy albo zostało na nim zatrzymane. Jest to jedyne miejsce na maszynie,
    w którym widać ruch odrzucony.

    Wartość tego zapisu ujawnia się w dwóch sytuacjach. Pierwsza to rozpoznanie:
    seria połączeń odrzuconych na kolejnych portach z jednego adresu wygląda
    w tym pliku dokładnie tak, jak wygląda skanowanie, i nigdzie indziej jej nie
    widać. Druga to ruch wychodzący: próba wyjścia na zewnątrz z procesu, który
    nie powinien nigdzie dzwonić, zostawia tu ślad nawet wtedy, gdy zapora ją
    zatrzymała.

    Domyślna pojemność wynosi cztery megabajty na profil i na maszynie
    z jakimkolwiek ruchem sieciowym wystarcza na godziny. Zapisu przy tym nie
    gubi się po cichu — plik jest przenoszony do kopii z rozszerzeniem `.old`,
    a nowy zaczyna się od zera. Oznacza to, że sięgnięcie wstecz dalej niż o dwa
    pliki jest niemożliwe, a przy domyślnym rozmiarze te dwa pliki obejmują
    zwykle jeden dzień.

    Kategoria średnia: punkt nie blokuje ataku ani nie utrudnia go napastnikowi.
    Zwiększa wykrywalność — i robi to w obszarze, w którym żaden inny zapis na
    maszynie go nie zastąpi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpoznanie sieci
    przeprowadzone poza zasięgiem jakiegokolwiek zapisu, który przetrwałby do
    momentu, w którym ktokolwiek zacznie go szukać.
  en: |
    The item sets a lower bound on the firewall log's capacity - separately for
    the domain, private and public profile.

    The firewall log is a different thing from the event logs. It does not go to
    the event viewer but to a plain text file, and it records not what the system
    did about permissions but what passed through the network interface or was
    stopped at it. It is the one place on the machine where rejected traffic can
    be seen.

    The worth of that record shows itself in two situations. The first is
    reconnaissance: a run of rejected connections on successive ports from one
    address looks in this file exactly as scanning looks, and is visible nowhere
    else. The second is outbound traffic: an attempt to reach outside from a
    process that ought to call nowhere leaves a trace here even when the firewall
    stopped it.

    The default capacity is four megabytes per profile, and on a machine with any
    network traffic at all that suffices for hours. The record is not lost
    quietly in the process - the file is moved to a copy with an `.old` suffix
    and a new one starts from nothing. This means reaching further back than two
    files is impossible, and at the default size those two files usually cover a
    single day.

    The category is medium: the item blocks no attack and makes none harder for
    the attacker. It raises detectability - and it does so in an area where no
    other record on the machine can stand in for it.

    What an attacker gains while the item goes unmet: reconnaissance of the
    network carried out beyond the reach of any record that would survive to the
    moment somebody starts looking for it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana dotyczy wyłącznie wielkości pliku, do
    którego zapora pisze. Nie dotyka ani jednej reguły, ani jednego portu, ani
    tego, co jest przepuszczane i co zatrzymywane.

    Koszt jest dyskowy i daje się policzyć z góry: szesnaście megabajtów na
    profil, trzy profile, plus tyle samo na pliki `.old` — łącznie poniżej stu
    megabajtów w najgorszym przypadku. Na serwerze jest to wielkość, której nie
    warto rozważać.

    Jedyny scenariusz do odnotowania dotyczy maszyn, na których dysk systemowy
    jest już ciasny, a zapora ma włączone rejestrowanie połączeń przepuszczonych,
    nie tylko odrzuconych. Tam pliki faktycznie urosną do pełnego rozmiaru.
    Uwaga dotyczy miejsca na dysku, nie działania czegokolwiek.

    Czego to nie psuje: reguł zapory, połączeń przychodzących i wychodzących,
    pracy użytkowników ani usług sieciowych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The change concerns only the size of the file
    the firewall writes to. It touches not one rule, not one port, and not what
    is let through and what is stopped.

    The cost is in disk room and can be reckoned in advance: sixteen megabytes
    per profile, three profiles, plus as much again for the `.old` files - under
    a hundred megabytes in the worst case altogether. On a server that is a size
    not worth weighing.

    The one scenario worth noting concerns machines whose system disk is already
    tight and whose firewall has the logging of allowed connections on, not only
    of rejected ones. There the files will indeed grow to their full size. The
    caution concerns disk room, not the working of anything.

    What this does not break: firewall rules, inbound and outbound connections,
    users' work, or network services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Brak regresji w działaniu — zmiana dotyczy wielkości pliku, a nie tego, co zapora przepuszcza i co zatrzymuje
      - Na dysku systemowym przybywa do stu megabajtów, licząc trzy profile wraz z plikami poprzednimi
      - Na maszynie z rejestrowaniem połączeń przepuszczonych pliki faktycznie urosną do pełnego rozmiaru
      - Reguły zapory, połączenia i usługi sieciowe pozostają nietknięte
    en:
      - No regression in the working - the change concerns the file's size, not what the firewall lets through and what it stops
      - Up to a hundred megabytes is added on the system disk, counting three profiles together with the previous files
      - On a machine that logs allowed connections the files will indeed grow to their full size
      - Firewall rules, connections and network services stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na dysku systemowym brakuje miejsca, a zapora rejestruje także połączenia przepuszczone
    en:
      - The system disk is short of room and the firewall logs allowed connections as well
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The report carries the smallest of the three, because the weakest
        # profile decides how far back the record actually reaches.
        $sizes = @($profiles | ForEach-Object { [int]$_.LogMaxSizeKilobytes })
        [string](($sizes | Measure-Object -Minimum).Minimum)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '16384'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogMaxSizeKilobytes |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # All three profiles at once - a machine moves between them, and the record
    # is worth only as much as the weakest of the three.
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogMaxSizeKilobytes 16384

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogMaxSizeKilobytes $p.LogMaxSizeKilobytes
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt sam w sobie niczego nie włącza. Powiększenie dziennika ma sens
    wyłącznie wtedy, gdy zapora cokolwiek do niego pisze — a rejestrowanie
    połączeń odrzuconych jest osobnym ustawieniem i osobną regułą. Kolejność
    wdrożenia jest tu taka jak przy dziennikach zdarzeń: najpierw pojemność,
    potem zapis.

    W raporcie warto pokazywać ten punkt obok reguł rejestrowania, a nie obok
    reguł samej zapory. Należy do bloku „czy zostanie ślad", nie do bloku „co
    jest przepuszczane".

    Audyt zgłasza najmniejszą z trzech wartości. Jest to celowe: maszyna
    przechodzi między profilami i zasięg zapisu wyznacza ten profil, w którym
    dziennik jest najkrótszy. Porównanie jest typu „nie mniej niż", więc większy
    dziennik jest zgodny.
  en: |
    The item by itself switches nothing on. Enlarging the log makes sense only
    where the firewall writes anything into it - and the logging of rejected
    connections is a separate setting and a separate rule. The order of rollout
    here is as with the event logs: capacity first, then the writing.

    In the report this item is worth showing beside the logging rules rather than
    beside the firewall's own rules. It belongs to the block of "will a trace
    remain", not to the block of "what is let through".

    The audit reports the smallest of the three values. That is deliberate: a
    machine moves between profiles, and the reach of the record is set by
    whichever profile has the shortest log. The comparison is of the "not less
    than" kind, so a larger log is compliant.
