id: win10-file-sharing-server-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera udostępniania plików wyłączona
    en: The service serving out files switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę, dzięki której inne maszyny sięgają po pliki
    i drukarki udostępnione na tej maszynie.

    Stanowisko robocze zwykle nie ma niczego do udostępnienia. Mimo to
    usługa działa na nim domyślnie i otwiera port, przez który da się
    zapytać o wykaz udziałów, o nazwy kont i o wersję protokołu.

    Zagrożenie nie kończy się na udziałach utworzonych świadomie. System
    udostępnia sam z siebie udziały administracyjne obejmujące całe dyski.
    Kto ma poświadczenia administratora, sięga przez nie po każdy plik na
    maszynie, nie uruchamiając przy tym żadnego programu.

    Właśnie tą drogą przenosi się narzędzia między maszynami po zdobyciu
    pierwszych poświadczeń. Plik zapisany na udziale administracyjnym
    uruchamia się potem innym mechanizmem, a sam zapis nie wygląda na nic
    szczególnego.

    Odnotowuję, że wyłączenie usługi nie odbiera maszynie dostępu do
    cudzych udziałów. Punkt dotyczy wyłącznie udostępniania przez tę
    maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    całych dysków przez udziały administracyjne i drogę przenoszenia
    plików.
  en: |
    The setting switches off the service by which other machines reach for the files and printers served out upon
    this machine.

    A working station commonly has nothing to serve out. For all that the service works upon it by default and
    opens a port through which the roll of shares, the names of reckonings and the version of the way of speaking
    may be asked after.

    The danger ends not at the shares made knowingly. The system serves out of its own accord shares for keepers
    taking in whole disks. Whoever has the warrants of an administrator reaches through them for every file upon
    the machine, setting no program going in the doing.

    By that very road tools are carried between machines once the first warrants are got. A file written onto a
    share for keepers is afterwards set going by another mechanism, and the writing itself looks like nothing out
    of the way.

    I set down that the switching off of the service takes not from the machine its reach of others' shares. The
    item touches solely the serving out by this machine.

    What an attacker gains while the item goes unmet: a reach of whole disks through the shares for keepers, and a
    road for the carrying of files.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to punkt, po którym
    narzędzia obsługi potrafią zamilknąć w sposób niełatwy do powiązania
    z przyczyną.

    Miejscem pierwszym są udziały administracyjne. Korzystają z nich
    narzędzia wdrożeniowe, systemy inwentaryzacji, kopie zapasowe
    i skrypty kopiujące pliki na wiele maszyn naraz. Po zmianie wszystkie
    przestaną sięgać po tę maszynę.

    Miejscem drugim jest drukarka podłączona do tego stanowiska
    i udostępniona innym. Zdarza się to w małych biurach i po zmianie
    przestanie działać dla wszystkich poza osobą siedzącą przy maszynie.

    Miejscem trzecim są foldery udostępnione świadomie: wymiana plików
    w zespole, folder dla urządzenia skanującego, miejsce na dane
    z maszyny pomiarowej.

    Odnotowuję, że zatrzymanie usługi zrywa połączenia otwarte w tej
    chwili, łącznie z tymi, z których korzysta właśnie narzędzie
    zarządzania.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: dostępu tej maszyny do cudzych udziałów, pracy
    przy maszynie, internetu, pulpitu zdalnego, logowania.
  en: |
    The class is "needs a planned rollout", and it is an item after which the keepers' tools can fall silent in a
    manner not easily bound to its cause.

    The first place is the shares for keepers. Tools of rollout, systems of setting down, keepings of copies and
    scripts copying files onto many machines at once all use them. After the change all will cease to reach this
    machine.

    The second place is a printer put into this station and served out to others. That happens in small offices,
    and after the change it will cease to work for everybody but the person sitting at the machine.

    The third place is folders served out knowingly: the trading of files in a team, a folder for a device that
    scans, a place for data off a machine of measuring.

    I set down that the stopping of the service breaks off the joinings open at this hour, those among them a tool
    of governing is using at this very moment.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: this machine's reach of others' shares, work at the machine, the internet, the desk
    from afar, or logging on.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - printing
  what_breaks:
    pl:
      - Narzędzia wdrożeniowe, systemy inwentaryzacji i kopie zapasowe korzystające z udziałów administracyjnych przestaną sięgać po tę maszynę
      - Drukarka podłączona do tego stanowiska i udostępniona innym przestanie działać dla wszystkich poza osobą przy maszynie
      - Foldery udostępnione świadomie, w tym miejsce na dane ze skanera albo maszyny pomiarowej, staną się niedostępne
      - Zatrzymanie usługi zrywa połączenia otwarte w tej chwili, także te używane właśnie przez narzędzie zarządzania
      - Dostęp tej maszyny do cudzych udziałów, praca przy maszynie, internet, pulpit zdalny i logowanie pozostają bez zmian
    en:
      - Tools of rollout, systems of setting down and keepings of copies that use the shares for keepers will cease to reach this machine
      - A printer put into this station and served out to others will cease to work for everybody but the person at the machine
      - Folders served out knowingly, a place for data off a scanner or a machine of measuring among them, will be out of reach
      - The stopping of the service breaks off the joinings open at this hour, those used at this very moment by a tool of governing too
      - This machine s reach of others shares, work at the machine, the internet, the desk from afar and logging on stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzia wdrożeniowe i kopie zapasowe sięgają po tę maszynę przez udziały administracyjne
      - Do stanowiska podłączona jest drukarka udostępniona innym osobom w biurze
      - Zespół wymienia pliki przez folder udostępniony na tej maszynie
    en:
      - Tools of rollout and keepings of copies reach this machine through the shares for keepers
      - A printer served out to other people in the office is put into this station
      - A team trades files through a folder served out upon this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off the joinings open to this machine's shares,
    # the shares for keepers a tool of governing may be using at this moment among
    # them.
    Stop-Service -Name 'LanmanServer' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'LanmanServer' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'LanmanServer' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/file-server-smb-overview

notes:
  pl: |
    Reguła jest na poziomie drugim, choć ryzyko jest wysokie, i warto,
    żeby aplikacja wyjaśniła czemu. Punkt bywa tani na stanowisku, które
    niczego nie udostępnia, i bardzo drogi tam, gdzie obsługa opiera się
    na udziałach administracyjnych. Rozstrzyga to, jak zarządza się tymi
    maszynami, a nie jak duże jest zagrożenie.

    Argument wart postawienia wprost dotyczy udziałów administracyjnych.
    Użytkownik pytany, co udostępnia, zwykle odpowie „nic" — a system
    udostępnia całe dyski sam z siebie. To właśnie ta część punktu jest
    nieoczywista i to ona decyduje o ocenie.

    Odnotowuję, że droga ta służy do przenoszenia narzędzi między
    maszynami. Zapis pliku na udziale administracyjnym nie wygląda na nic
    szczególnego, a jest zwykle krokiem poprzedzającym uruchomienie.
  en: |
    The rule stands at the second level though the risk is high, and it is well that the application set out why.
    The item is cheap upon a station that serves nothing out, and very dear where the keeping rests upon the
    shares for keepers. What settles it is how these machines are governed and not how great the danger is.

    The argument worth putting outright touches the shares for keepers. A user asked what they serve out will
    commonly answer "nothing" - while the system serves out whole disks of its own accord. That part of the item
    is the one not plain, and it is the one that settles the grading.

    I set down that this road serves for the carrying of tools between machines. The writing of a file onto a
    share for keepers looks like nothing out of the way, and is commonly the step before a setting going.
