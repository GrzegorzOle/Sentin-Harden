id: win11-smb-client-plaintext-password-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wysyłanie hasła otwartym tekstem do obcych serwerów plików zabronione
    en: Sending a password in clear text to third-party file servers forbidden
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Przy łączeniu się z serwerem plików maszyna uzgadnia z nim sposób podania
    hasła. Obca implementacja protokołu może zgłosić, że żadnego zabezpieczenia
    nie obsługuje, i poprosić o hasło otwartym tekstem.

    Bez tego punktu maszyna taką prośbę spełnia. Hasło użytkownika — najczęściej
    to samo, którym loguje się do stanowiska i do domeny — idzie wtedy przez sieć
    w postaci czytelnej dla każdego, kto ją podsłuchuje. Wystarczy jedno takie
    połączenie, żeby poświadczenie trafiło w obce ręce w całości, bez łamania
    i bez zgadywania.

    Groźniejsze jest to, że decyzję podejmuje strona przeciwna. Napastnik
    podstawiający własny serwer plików pod spodziewaną nazwą nie musi niczego
    łamać — wystarczy, że zgłosi brak obsługi zabezpieczeń, a maszyna sama poda
    mu hasło.
  en: |
    When connecting to a file server the machine agrees with it on how the password
    is to be supplied. A third-party implementation of the protocol may declare
    that it supports no protection and ask for the password in clear text.

    Without this item the machine grants that request. The user's password - most
    often the same one they sign in to the station and the domain with - then
    travels the network in a form readable by anybody listening. One such
    connection is enough for the credential to pass into somebody else's hands
    whole, without breaking and without guessing.

    What makes it worse is that the decision rests with the other side. An attacker
    standing up their own file server under an expected name need break nothing -
    it is enough to declare no support for protection, and the machine hands over
    the password itself.

disruption_description:
  pl: |
    Nic nie przestaje działać w typowym środowisku. Ustawienie jest domyślnie
    właściwe, a wszystkie używane dziś implementacje protokołu obsługują podanie
    hasła w postaci zabezpieczonej.

    Ryzyko dotyczy urządzeń, których oprogramowania nikt nie aktualizował od
    kilkunastu lat i które udostępniają pliki własną implementacją protokołu:
    macierzy dyskowych wycofanych ze wsparcia, urządzeń pomiarowych i sprzętu
    przemysłowego. Jeżeli takie urządzenie prosi o hasło otwartym tekstem,
    połączenie z nim przestanie dochodzić do skutku.

    Objawem jest odmowa przy podłączaniu udziału z takiego urządzenia, zwykle
    z komunikatem o błędzie uwierzytelnienia, a nie o zasadzie — co bywa mylące
    przy diagnozowaniu.

    Należy podkreślić, że urządzenie to i tak wysyłało hasło jawnie, więc
    wdrożenie punktu nie tyle coś psuje, ile ujawnia problem istniejący od dawna.

    Nie ma restartu. Zmiana obowiązuje przy następnym połączeniu.
  en: |
    Nothing stops working in a typical environment. The setting is right by
    default, and every implementation of the protocol in use today supports
    supplying the password in a protected form.

    The risk concerns devices whose software nobody has updated for over a decade
    and which share files through an implementation of their own: disk arrays out
    of support, measuring instruments and industrial hardware. If such a device
    asks for a password in clear text, connections to it will stop coming about.

    The symptom is a refusal when attaching a share from such a device, usually
    with a message about an authentication error rather than about a policy - which
    can mislead during diagnosis.

    It should be stressed that the device was sending the password in the clear
    anyway, so applying the item does not so much break something as reveal a
    problem that has existed for a long time.

    There is no restart. The change takes effect at the next connection.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - encryption-and-tls
  what_breaks:
    pl:
      - Połączenia z urządzeniami żądającymi hasła otwartym tekstem przestaną dochodzić do skutku
      - Udziały z macierzy dyskowych i sprzętu przemysłowego sprzed kilkunastu lat mogą przestać się podłączać
    en:
      - Connections to devices demanding a password in clear text stop coming about
      - Shares from disk arrays and industrial hardware over a decade old may stop attaching
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko korzysta z udziału na urządzeniu obsługującym wyłącznie podanie hasła otwartym tekstem
    en:
      - The station uses a share on a device that supports only supplying the password in clear text
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'EnablePlainTextPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $name = 'EnablePlainTextPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnablePlainTextPassword' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-client-send-unencrypted-password-to-third-party-smb-servers

notes:
  pl: |
    Punkt dotyczy maszyny jako klienta, czyli tego, co ona sama wysyła. Nie
    obejmuje tego, czego wymaga od innych, gdy sama udostępnia pliki — to inne
    ustawienie i osobna rodzina reguł.

    Warto odróżnić ten punkt od reguł o podpisywaniu ruchu plikowego. Tamte
    bronią przed zmianą przesyłanych danych i przed podszyciem się pod serwer,
    ten — przed oddaniem hasła. Wdrożenie jednego nie zastępuje drugiego.
  en: |
    The item concerns the machine as a client, that is, what it sends itself. It
    does not cover what it demands of others when it shares files - that is a
    different setting and a separate family of rules.

    It is worth distinguishing this item from the rules about signing file traffic.
    Those defend against alteration of the data sent and against a server being
    impersonated; this one against handing over the password. Applying one does not
    replace the other.
