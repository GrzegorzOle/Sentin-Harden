id: win11-browser-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Synchronizowanie ustawień przeglądarki wyłączone
    en: Synchronising the browser's settings switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt dotyczy węższego strumienia niż synchronizacja ustawień w całości
    i istnieje osobno, bo to, co przenosi przeglądarka, waży więcej niż reszta
    konfiguracji.

    Przenoszone są zakładki, historia, otwarte karty, wpisy formularzy i —
    zależnie od wariantu — zapisane hasła do stron. Jest to zestaw opisujący
    pracę dokładniej niż większość dokumentów na dysku: adresy systemów
    wewnętrznych, nazwy klientów w adresach, ślady spraw prowadzonych
    w aplikacjach sieciowych.

    Zapisane hasła są tu sprawą osobną. Hasło do systemu firmowego,
    przeniesione na maszynę domową przez konto osobiste, przestaje podlegać
    jakiejkolwiek zasadzie organizacji. Nie da się go ani unieważnić, ani
    policzyć, ani nawet stwierdzić, że wyszło.

    Historia przeglądania działa dodatkowo w drugą stronę: opisuje, czym dana
    osoba się zajmuje, a to jest materiał do przygotowania wiadomości, która
    ma wyglądać na wewnętrzną.

    Punkt zamyka ten strumień i odbiera użytkownikowi możliwość włączenia go
    z powrotem.
  en: |
    The item concerns a narrower stream than settings synchronisation as a whole and
    exists separately, because what a browser carries weighs more than the rest of
    the configuration.

    Carried over are bookmarks, history, open tabs, form entries and - depending on
    the variant - saved passwords to sites. It is a set describing work more
    precisely than most documents on the disk: the addresses of internal systems,
    clients' names inside addresses, traces of matters handled in web applications.

    Saved passwords are a matter apart here. A password to a company system, carried
    over to a home machine through a personal account, stops falling under any policy
    of the organisation's. It can neither be revoked, nor counted, nor even
    established to have left.

    Browsing history works in the other direction as well: it describes what a given
    person deals with, and that is material for preparing a message meant to look
    internal.

    The item closes that stream and takes away the user's ability to switch it back
    on.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ludzie nie opierają pracy na tym, że zakładki
    i hasła są te same na każdej maszynie.

    Po wdrożeniu przestają być. Zakładki, historia i zapisane hasła zostają
    na maszynie, na której powstały. Użytkownik logujący się na drugim
    stanowisku zobaczy przeglądarkę bez swoich zakładek i zgłosi to jako
    utratę danych — choć dane są na miejscu, tylko na innej maszynie.

    Warto uprzedzić o tym zawczasu, bo pierwsza reakcja bywa gwałtowna
    i prowadzi do prób odzyskiwania czegoś, co nie zginęło.

    Zakładki przeniesione przed wdrożeniem zostają tam, gdzie trafiły. Punkt
    zatrzymuje przenoszenie i nie czyści niczego wstecz.

    Ustawienie dotyczy mechanizmu systemowego. Przeglądarka z własnym,
    niezależnym mechanizmem synchronizacji konta nie jest nim objęta i trzeba
    ją ograniczyć osobno — jest to najczęstsza pomyłka przy tym punkcie.

    Nie ma restartu.
  en: |
    What needs checking is whether people rest their work on bookmarks and passwords
    being the same on every machine.

    After the rollout they stop being. Bookmarks, history and saved passwords stay on
    the machine where they were made. A user signing in at a second station sees a
    browser without their bookmarks and reports it as lost data - though the data is
    in place, just on another machine.

    Worth warning about beforehand, because the first reaction can be sharp and leads
    to attempts at recovering something that was never lost.

    Bookmarks carried over before the rollout stay where they went. The item stops
    the carrying and clears nothing retrospectively.

    The setting concerns the system's mechanism. A browser with its own, independent
    account synchronisation is not covered by it and has to be limited separately -
    that is the commonest mistake with this item.

    There is no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Zakładki, historia i otwarte karty przestaną przenosić się między maszynami
      - Hasła zapisane w przeglądarce trzeba będzie wprowadzić na każdej maszynie osobno
      - Użytkownik na drugim stanowisku zobaczy przeglądarkę bez swoich zakładek i zgłosi to jako utratę danych
      - Przeglądarka z własnym mechanizmem synchronizacji konta nie jest tym punktem objęta
    en:
      - Bookmarks, history and open tabs stop carrying over between machines
      - Passwords saved in the browser will have to be entered on each machine separately
      - A user at a second station sees a browser without their bookmarks and reports it as lost data
      - A browser with its own account synchronisation is not covered by this item
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ludzie pracują naprzemiennie na kilku maszynach i opierają pracę na wspólnych zakładkach
    en:
      - People work alternately on several machines and rest their work on shared bookmarks
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableWebBrowserSettingSync'
        $override = $item.'DisableWebBrowserSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      switch           = $item.'DisableWebBrowserSettingSync'
      switch_existed   = ($null -ne $item.'DisableWebBrowserSettingSync')
      override         = $item.'DisableWebBrowserSettingSyncUserOverride'
      override_existed = ($null -ne $item.'DisableWebBrowserSettingSyncUserOverride')
      key_existed      = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSync' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSync' -ErrorAction SilentlyContinue
    }
    if ($b.override_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value $b.override -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSyncUserOverride' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Reguła powtarza kształt reguły o synchronizacji ustawień w całości, bo
    mechanizm i wartości są te same. Punkty są w benchmarku osobne i wdrożenie
    szerszego czyni ten bezprzedmiotowym — ale nie odwrotnie, więc obie reguły
    są potrzebne.

    Wartości przyjmują dwójkę jako wyłączenie i zero jako dopuszczenie, tak
    samo jak w regule szerszej. Wpis odbierający wybór użytkownikowi zapisuje
    jedynkę przy polu odznaczonym.

    Zakres przenoszonych danych zmieniał się w kolejnych wydaniach systemu.
    Reguła sprawdza ustawienie, a nie to, co akurat jest przenoszone, więc
    pozostaje aktualna niezależnie od tego, jak ten zakres wygląda dziś.
  en: |
    The rule repeats the shape of the rule about settings synchronisation as a whole,
    because the mechanism and the values are the same. The items are separate in the
    benchmark, and applying the wider one makes this one moot - but not the other way
    round, so both rules are needed.

    The values take a two as off and a zero as admitted, exactly as in the wider
    rule. The entry taking the choice away from the user writes a one when the box is
    unticked.

    The range of data carried over has changed from one release of the system to the
    next. The rule checks the setting rather than what happens to be carried, so it
    stays current whatever that range looks like today.
