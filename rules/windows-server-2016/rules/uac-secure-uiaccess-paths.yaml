id: win2016-uac-secure-uiaccess-paths

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Programy dostępności wyłącznie z katalogów chronionych
    en: Accessibility programs only from protected directories
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby uprawnienie do sięgania po okna innych programów
    dostawały wyłącznie programy zainstalowane w katalogach chronionych.

    Rzecz dotyczy szczególnego uprawnienia, którego potrzebują narzędzia
    dostępności: czytniki ekranu, klawiatury ekranowe, lupy. Żeby wykonywać
    swoją pracę, muszą czytać okna cudzych programów i wysyłać do nich
    zdarzenia — czyli robić dokładnie to, co w innym kontekście nazywa się
    przejęciem sesji.

    Uprawnienie to jest więc bardzo mocne i jedynym zabezpieczeniem, jakie
    przy nim istnieje, jest miejsce, z którego program się uruchamia.
    Katalog chroniony to taki, do którego zapis wymaga uprawnień
    administracyjnych. Program leżący tam został tam umieszczony świadomie.
    Program leżący w katalogu użytkownika mógł się tam znaleźć sam.

    Bez tego wymagania wystarczy umieścić plik z odpowiednią deklaracją
    w katalogu zapisywalnym, żeby dostał uprawnienie do pracy na cudzych
    oknach — łącznie z oknem potwierdzenia uprawnień.

    Na serwerze 2016 warto to ustawić mimo tego, że narzędzi dostępności na
    serwerze zwykle nie ma. Znaczenie punktu nie leży w tym, co on umożliwia,
    tylko w tym, czego zabrania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    uzyskania uprawnienia do cudzych okien z pliku umieszczonego w katalogu,
    do którego zapis nie wymaga uprawnień.
  en: |
    The item requires that the privilege of reaching into other programs'
    windows go only to programs installed in protected directories.

    The matter concerns a particular privilege that accessibility tools need:
    screen readers, on-screen keyboards, magnifiers. To do their work they must
    read other programs' windows and send events to them - that is, do exactly
    what in another context is called taking over a session.

    The privilege is therefore very strong, and the only safeguard that exists
    around it is the place the program starts from. A protected directory is one
    that needs administrative rights to write to. A program sitting there was put
    there deliberately. A program sitting in a user's directory could have got
    there by itself.

    Without this requirement it is enough to place a file carrying the right
    declaration in a writable directory for it to receive the privilege of
    working on other windows - including the window confirming elevation.

    On Server 2016 it is worth setting despite there usually being no
    accessibility tools on a server. The item's weight lies not in what it
    permits but in what it forbids.

    What an attacker gains while the item goes unmet: a route to the privilege of
    reaching other windows from a file placed in a directory that needs no rights
    to write to.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Programy dostępności dostarczane z systemem
    leżą w katalogach chronionych i spełniają ten warunek z definicji.

    Jedyny przypadek, w którym zmiana byłaby widoczna, to narzędzie
    dostępności zainstalowane w katalogu użytkownika albo uruchamiane
    z udziału sieciowego. Na serwerze jest to sytuacja wyjątkowa, a tam,
    gdzie wystąpi, rozwiązaniem jest przeniesienie narzędzia do katalogu
    programów, a nie cofnięcie zmiany.

    Warto wiedzieć, czego punkt nie robi. Nie blokuje uruchamiania programów
    dostępności i nie odbiera im żadnej funkcji poza tą jedną. Program
    z katalogu użytkownika nadal się uruchomi — po prostu nie dostanie
    uprawnienia do pracy na cudzych oknach.

    Czego to nie psuje: narzędzi dostępności systemu, pracy przez pulpit
    zdalny ani niczego, co uprawnienia do cudzych okien nie potrzebuje.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The accessibility programs shipped with the
    system sit in protected directories and meet this condition by definition.

    The only case in which the change would show is an accessibility tool
    installed in a user's directory or started from a network share. On a server
    that is exceptional, and where it does happen the answer is to move the tool
    into the programs directory rather than to undo the change.

    It is worth knowing what the item does not do. It does not block
    accessibility programs from running and takes no function from them but this
    one. A program in a user's directory will still start - it simply will not
    receive the privilege of working on other windows.

    What this does not break: the system's accessibility tools, work through
    remote desktop, or anything that does not need the privilege of reaching
    other windows.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - legacy-applications
    - remote-desktop
  what_breaks:
    pl:
      - Narzędzie dostępności zainstalowane w katalogu użytkownika traci uprawnienie do pracy na cudzych oknach
      - Program dostępności uruchamiany z udziału sieciowego przestaje dostawać to uprawnienie
      - Narzędzia dostępności dostarczane z systemem spełniają warunek i działają bez zmian
      - Uruchamianie samych programów nie jest blokowane, odbierane jest wyłącznie to jedno uprawnienie
    en:
      - An accessibility tool installed in a user's directory loses the privilege of working on other windows
      - An accessibility program started from a network share stops receiving that privilege
      - Accessibility tools shipped with the system meet the condition and work unchanged
      - Running the programs themselves is not blocked, only this one privilege is taken away
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje narzędzie dostępności zainstalowane poza katalogiem chronionym i nie da się go przenieść
    en:
      - An accessibility tool installed outside a protected directory runs on the machine and cannot be moved
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableSecureUIAPaths'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableSecureUIAPaths'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The place a program starts from is the only safeguard around the privilege
    # of reaching other windows. A protected directory needs administrative
    # rights to write to, so what sits there was put there deliberately.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableSecureUIAPaths' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-only-elevate-uiaccess-applications-that-are-installed-in-secure-locations

notes:
  pl: |
    Sam podpis pliku nie wystarcza tu za zabezpieczenie, bo deklaracja
    uprawnienia jest częścią programu, a nie czymś nadawanym przez system.
    Miejsce uruchomienia jest jedynym warunkiem, którego program o sobie nie
    rozstrzyga.

    Punkt ma sens wyłącznie razem z włączoną kontrolą uprawnień. Przy
    mechanizmie wyłączonym uprawnienie do cudzych okien traci znaczenie, bo
    wszystko i tak działa z pełnymi prawami.

    Wartość leży w kluczu wspólnym dla całej grupy kontroli uprawnień.
    Przy cofaniu usuwana jest wyłącznie ta jedna wartość.
  en: |
    A file's signature is no safeguard here, because the declaration of the
    privilege is part of the program rather than something the system grants. The
    place it starts from is the one condition the program does not settle about
    itself.

    The item makes sense only alongside the control of rights being on. With the
    mechanism off, the privilege of reaching other windows loses its meaning,
    because everything runs with full rights anyway.

    The value lies in a key shared by the whole rights-control group. Undoing
    removes this one value alone.
