id: win2025-search-assistant-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Asystent w wyszukiwaniu systemowym wyłączony
    en: The assistant in system search turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza asystenta w wyszukiwaniu systemowym — nie samo
    wyszukiwanie, tylko nadbudowę, która wysyła zapytania poza maszynę.

    Kategoria średnia i rozróżnienie jest tu kluczowe, bo bez niego reguła
    wygląda na odbieranie wyszukiwania. Wyszukiwanie plików na dysku zostaje
    nietknięte. Odbierana jest ta część, która to, co ktoś wpisał w oknie
    wyszukiwania, traktuje jako pytanie do wysłania na zewnątrz.

    To jest właściwa treść punktu. W oknie wyszukiwania człowiek wpisuje to,
    czego szuka na swojej maszynie — nazwę pliku, nazwę serwera, fragment
    ścieżki, czasem nazwę konta. Dopóki to pozostaje lokalne, jest zwykłym
    użyciem systemu. Kiedy wychodzi na zewnątrz, staje się strumieniem
    nazw własnych z wnętrza organizacji, wysyłanym stale i bez świadomości
    piszącego.

    Na serwerze waży dodatkowo to, kto pisze. W oknie wyszukiwania serwera
    pisze administrator, a nazwy, których szuka, są nazwami zasobów
    infrastruktury.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pośrednio
    niewiele, ale organizacja traci kontrolę nad tym, gdzie trafiają nazwy
    jej zasobów, wpisywane przez osoby o najszerszym oglądzie.
  en: |
    The item turns off the assistant in system search - not search itself,
    but the layer on top which sends queries outside the machine.

    The category is medium, and the distinction is crucial here, because
    without it the rule looks like taking search away. Searching for files on
    disk is left untouched. What is taken away is the part which treats what
    somebody typed into the search box as a question to be sent outwards.

    That is the real substance of the item. Into the search box a person
    types what they are looking for on their own machine - a file name, a
    server name, part of a path, sometimes an account name. As long as that
    stays local, it is ordinary use of the system. Once it goes outwards, it
    becomes a stream of proper names from inside the organisation, sent
    continuously and without the typist's awareness.

    On a server it weighs additionally who is doing the typing. Into a
    server's search box types an administrator, and the names they look for
    are the names of infrastructure resources.

    What an attacker gains while the item goes unmet: indirectly little, but
    the organisation loses control over where the names of its resources go,
    typed by the people with the widest view of it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze sprawdzenie jest krótkie:
    ten składnik na wydaniu serwerowym zwykle nie działa, a okno wyszukiwania
    i tak przeszukuje wyłącznie maszynę.

    Skutek, gdzie składnik jest obecny: okno wyszukiwania przestaje
    podpowiadać wyniki spoza maszyny i przestaje odpowiadać na pytania.
    Wyszukiwanie plików, ustawień i aplikacji zostaje. Dla kogoś, kto
    przywykł zadawać pytania w tym oknie, jest to zmiana widoczna i warta
    uprzedzenia — stąd klasa wyższa niż przy punkcie o ekranie blokady.

    Czego to nie psuje: wyszukiwania plików na dysku, indeksu, wyszukiwania
    w aplikacjach, wyszukiwania w przeglądarce ani menu systemowego.

    Rzecz do zapamiętania: pod tym samym kluczem rejestru leży już kilka
    reguł o różnym przedmiocie — wyszukiwanie w chmurze, dostęp do
    położenia, indeksowanie plików zaszyfrowanych, wyróżnienia i asystent
    nad ekranem blokady. Zrobienie jednej nie zamyka pozostałych
    i w sprawozdaniu stoją osobno.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server the review is short:
    this component usually does not run on the server edition, and the search
    box searches only the machine anyway.

    The effect, where the component is present: the search box stops
    suggesting results from outside the machine and stops answering
    questions. Searching for files, settings and applications remains. For
    somebody used to asking questions in that box it is a visible change and
    worth warning about - hence a higher class than for the item about the
    lock screen.

    What this does not break: searching for files on disk, the index, search
    within applications, search in a browser, or the system menu.

    Something to remember: several rules of differing subject already lie
    under this registry key - cloud search, access to location, indexing of
    encrypted files, highlights, and the assistant above the lock screen.
    Doing one does not close the others, and in the report they stand
    separately.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Okno wyszukiwania przestaje podpowiadać wyniki spoza maszyny i przestaje odpowiadać na pytania
      - Dla kogoś, kto przywykł zadawać pytania w tym oknie, jest to zmiana widoczna i warta uprzedzenia
      - Wyszukiwanie plików na dysku, indeks i wyszukiwanie w aplikacjach działają bez zmian
      - Pod tym samym kluczem leży kilka reguł o różnym przedmiocie — zrobienie jednej nie zamyka pozostałych
    en:
      - The search box stops suggesting results from outside the machine and stops answering questions
      - For somebody used to asking questions in that box it is a visible change and worth warning about
      - Searching for files on disk, the index and search within applications work unchanged
      - Several rules of differing subject lie under the same key - doing one does not close the others
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym okno wyszukiwania jest używane jako sposób zadawania pytań, a nie szukania plików
    en:
      - The machine is a workstation where the search box is used as a way of asking questions rather than of finding files
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCortana'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCortana'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Searching for files on disk is untouched. What goes is the layer that
    # treats what was typed as a question to be sent outwards - and into a
    # server's search box types an administrator, looking for the names of
    # infrastructure resources.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCortana' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Rozróżnienie jest tu kluczowe: wyszukiwanie plików na dysku zostaje
    nietknięte, odbierana jest nadbudowa traktująca wpisany tekst jako
    pytanie do wysłania na zewnątrz.

    Człowiek wpisuje w tym oknie nazwę pliku, nazwę serwera, fragment
    ścieżki, czasem nazwę konta. Dopóki to lokalne, jest zwykłym użyciem
    systemu; kiedy wychodzi na zewnątrz, staje się strumieniem nazw własnych
    z wnętrza organizacji.

    Na serwerze waży to, kto pisze: administrator, a nazwy, których szuka,
    są nazwami zasobów infrastruktury.
  en: |
    The distinction is crucial here: searching for files on disk is left
    untouched, what goes is the layer treating typed text as a question to be
    sent outwards.

    A person types into that box a file name, a server name, part of a path,
    sometimes an account name. As long as it stays local it is ordinary use
    of the system; once it goes outwards it becomes a stream of proper names
    from inside the organisation.

    On a server what weighs is who types: an administrator, and the names
    they look for are the names of infrastructure resources.
