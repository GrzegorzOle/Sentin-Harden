id: win10-rdp-always-prompt-password

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Pytanie o hasło przy każdym połączeniu pulpitem zdalnym
    en: The asking for a password at every joining by the desk from afar
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby maszyna pytała o hasło przy każdym połączeniu
    pulpitem zdalnym, nawet gdy klient przesłał je z góry.

    Jest to punkt dopełniający zablokowanie zapisywania haseł, ale
    działający z drugiej strony. Tamten nie pozwala zapisać hasła
    u siebie; ten nie pozwala go użyć wobec tej maszyny.

    Zagrożeniem jest przekazywanie poświadczeń bez udziału człowieka.
    Klient wysyłający zapisane hasło robi to także wtedy, gdy uruchomił
    go program, skrypt albo skrót umieszczony na pulpicie przez kogoś
    innego.

    Drugim zastrzeżeniem jest kolejność. Bez tego ustawienia maszyna
    przyjmuje poświadczenia przesłane wcześniej, a z nim wymaga
    wpisania ich w oknie, którego program nie wypełni za użytkownika.

    Odnotowuję, że reguła ma sens szczególnie razem z blokadą
    zapisywania. Osobno zamykają dwa końce tej samej drogi: jedna
    u klienta, druga u maszyny, do której się łączy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    otwartą hasłem przesłanym przez program, bez udziału użytkownika.
  en: |
    The setting calls for the machine to ask for a password at every joining by the desk from afar, even where the
    client has sent it beforehand.

    It is an item filling out the shutting of the writing of passwords, but working from the other side. That one
    allows not a password to be written at home; this one allows it not to be used against this machine.

    The danger is the handing over of warrants with no part taken by a person. A client sending a written password
    does so also where it was set going by a program, a script or a short way laid upon the desk by somebody else.

    The second reservation is the order of things. Without this setting the machine takes in warrants sent
    beforehand; with it, it calls for them to be written into a window no program will fill for the user.

    I set down that the rule has its sense above all together with the shutting of the writing. Apart they close
    two ends of one road: the one at the client, the other at the machine they join themselves to.

    What an attacker gains while the item goes unmet: a session opened by a password sent by a program, with no
    part taken by the user.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    automatyzacja korzystająca z pulpitu zdalnego.

    Miejscem pierwszym są narzędzia wsparcia łączące się z maszyną
    w imieniu technika. Po zmianie zażądają hasła w osobnym oknie, co
    bywa niemożliwe do obsłużenia w środowisku bez człowieka.

    Miejscem drugim są zadania uruchamiane harmonogramem, które
    otwierają sesję pulpitu zdalnego, żeby uruchomić w niej program.
    Przestaną działać w całości.

    Miejscem trzecim jest praca codzienna osoby łączącej się z jedną
    maszyną wielokrotnie w ciągu dnia. Utrudnienie jest odczuwalne i to
    ono decyduje o odbiorze punktu.

    Odnotowuję, że skutek jest widoczny natychmiast, w postaci okna
    z pytaniem o hasło tam, gdzie wcześniej połączenie otwierało się
    samo.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: połączeń nawiązywanych ręcznie, pracy programów,
    sieci, logowania przy maszynie, drukowania.
  en: |
    The class is "needs review", and the object of the review is the working of itself that leans upon the desk
    from afar.

    The first place is tools of help joining themselves to the machine on a craftsman's behalf. After the change
    they will call for a password in a window apart, which is at times not to be served in a setting with no
    person.

    The second place is tasks set going by a reckoning of hours that open a session of the desk from afar to set a
    program going within it. They will cease to work whole.

    The third place is the day's work of somebody joining themselves to one machine many times over. The hindrance
    is keenly felt and it is that which settles how the item is taken.

    I set down that the consequence is seen at once, in the shape of a window asking for a password where before
    the joining opened of itself.

    The consequence shows at once, with no restart.

    What this does not break: joinings made by hand, the work of programs, the network, logging on at the machine,
    or printing.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Narzędzia wsparcia łączące się w imieniu technika zażądają hasła w osobnym oknie
      - W środowisku bez człowieka obsłużenie takiego okna bywa niemożliwe
      - Zadania uruchamiane harmonogramem otwierające sesję pulpitu zdalnego przestaną działać w całości
      - Osoba łącząca się z jedną maszyną wielokrotnie w ciągu dnia odczuje to jako utrudnienie
      - Połączenia nawiązywane ręcznie, praca programów, sieć, logowanie i drukowanie pozostają bez zmian
    en:
      - Tools of help joining themselves on a craftsman s behalf will call for a password in a window apart
      - In a setting with no person such a window is at times not to be served
      - Tasks set going by a reckoning of hours that open a session of the desk from afar will cease to work whole
      - Somebody joining themselves to one machine many times over will feel it as a hindrance
      - Joinings made by hand, the work of programs, the network, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zadanie uruchamiane harmonogramem otwiera na tej maszynie sesję pulpitu zdalnego bez udziału człowieka
      - Narzędzie wsparcia łączy się z maszyną, przekazując poświadczenia z góry
    en:
      - A task set going by a reckoning of hours opens upon this machine a session of the desk from afar with no person taking part
      - A tool of help joins itself to the machine, handing over warrants beforehand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fPromptForPassword'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fPromptForPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fPromptForPassword' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-security

notes:
  pl: |
    Reguła jest drugim końcem tej samej drogi co blokada zapisywania
    haseł i warto, żeby aplikacja pokazała je razem. Tamta działa
    u klienta, ta u maszyny, do której się łączy.

    Argument wart postawienia dotyczy udziału człowieka. Klient
    wysyłający zapisane hasło robi to także wtedy, gdy uruchomił go
    program albo skrót umieszczony na pulpicie przez kogoś innego.

    Odnotowuję, że to ten punkt najczęściej z całej rodziny bywa
    zgłaszany jako utrudnienie. Warto pokazać go wraz z kosztem, a nie
    wyłącznie z zyskiem, bo decyzja o nim zapada na tej podstawie.
  en: |
    The rule is the other end of the same road as the shutting of the writing of passwords, and it is well that
    the application show them together. That one works at the client, this one at the machine they join themselves
    to.

    The argument worth putting touches the part taken by a person. A client sending a written password does so
    also where it was set going by a program or by a short way laid upon the desk by somebody else.

    I set down that this item, of the whole kindred, is the one oftenest reported as a hindrance. It is worth
    showing with its cost and not with its gain alone, the decision about it being taken upon that ground.
