id: win2016-smartscreen-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Filtr reputacyjny dla aplikacji i plików włączony
    en: The reputation filter for applications and files switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza filtr sprawdzający pochodzenie uruchamianych
    aplikacji i otwieranych plików.

    Filtr reputacyjny pyta o coś innego niż program antywirusowy. Nie pyta,
    co plik zawiera, tylko skąd pochodzi: czy jest w ogóle znany, kto go
    podpisał, czy widziano go wcześniej i u ilu osób.

    Różnica ta ma znaczenie praktyczne. Program zbudowany na jedną
    kampanię jest z definicji nowy, więc żadna sygnatura go nie zna — i to
    jest właśnie ten przypadek, w którym pytanie o pochodzenie działa,
    a pytanie o zawartość nie.

    Na serwerze waga punktu jest większa niż na stanowisku roboczym, bo
    to, co się tam uruchamia, uruchamia się zwykle z uprawnieniami
    administratora. Plik pobrany na serwer i uruchomiony przez osobę
    zalogowaną do zarządzania startuje od razu na górze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    pliku nowego i nieznanego bez żadnego pytania o jego pochodzenie.
  en: |
    The setting switches on the filter that checks the provenance of the applications started and the files opened.

    A reputation filter asks something other than an antivirus program. It asks not what the file holds but whence
    it comes: whether it is known at all, who signed it, whether it has been seen before and by how many.

    That difference has a practical weight. A program built for a single campaign is by definition new, so no
    signature knows it - and that is just the case in which the question of provenance works and the question of
    content does not.

    On a server the item's weight is greater than at a workplace, what is started there being started as a rule with
    an administrator's rights. A file fetched onto a server and started by a person logged in to manage it begins at
    once at the top.

    What an attacker gains while the item goes unmet: the starting of a new and unknown file without any question
    about its provenance.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy łączności.

    Filtr pyta o pochodzenie, a pytanie idzie przez sieć. Na maszynie
    w sieci zamkniętej odpowiedzi nie będzie, a wtedy filtr zachowuje się
    tak, jak ustawiono go na wypadek braku odpowiedzi. Trzeba wiedzieć,
    czy ta maszyna ma tę drogę otwartą — inaczej punkt zostaje spełniony
    na papierze i nie robi nic.

    Rzecz druga dotyczy narzędzi własnych. Program napisany w organizacji
    i niepodpisany jest dla filtra plikiem nieznanym, bo nieznany
    i niebezpieczny to dla niego to samo pytanie. Skutkiem jest
    ostrzeżenie przy każdym uruchomieniu narzędzia, które działa od lat.

    Rzecz trzecia dotyczy opóźnienia. Przy pierwszym uruchomieniu pliku
    filtr czeka na odpowiedź, więc start bywa wolniejszy. Przy zadaniu
    uruchamianym z harmonogramu i liczonym w sekundach potrafi to mieć
    znaczenie.

    Czego to nie psuje: plików już zaufanych, programów podpisanych,
    uruchamiania aplikacji systemowych, usług, ról serwera.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established concerns connectivity.

    The filter asks about provenance, and the question goes over the network. On a machine on a closed network there
    will be no answer, and the filter then behaves as it was set to behave for want of one. One has to know whether
    this machine has that road open - else the item is met on paper and does nothing.

    The second matter concerns one's own tools. A program written in the organisation and unsigned is to the filter
    an unknown file, unknown and dangerous being to it one and the same question. The consequence is a warning at
    every starting of a tool that has worked for years.

    The third matter concerns delay. At a file's first starting the filter waits for an answer, so the start is at
    times slower. At a task started from the scheduler and reckoned in seconds that may matter.

    What this does not break: files already trusted, signed programs, the starting of system applications, services,
    or the server's roles.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzie własne, napisane w organizacji i niepodpisane, wywołuje ostrzeżenie przy każdym uruchomieniu
      - Pierwsze uruchomienie pliku bywa wolniejsze, bo filtr czeka na odpowiedź z sieci
      - Na maszynie bez drogi wyjścia do sieci punkt zostaje spełniony na papierze i nie robi nic
      - Pliki już zaufane, programy podpisane i aplikacje systemowe pozostają bez zmian
      - Role serwera, usługi systemowe i praca sieci pozostają bez zmian
    en:
      - An own tool, written in the organisation and unsigned, raises a warning at every starting
      - A file's first starting is at times slower, the filter waiting for an answer from the network
      - On a machine without a road out to the network the item is met on paper and does nothing
      - Files already trusted, signed programs and system applications stay unchanged
      - The server roles, system services and the working of the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zadania na tej maszynie uruchamiają narzędzia własne niepodpisane i ostrzeżenie zatrzyma ich pracę
      - Maszyna stoi w sieci zamkniętej, więc filtr nie dostanie odpowiedzi i nie rozstrzygnie niczego
    en:
      - Tasks on this machine start unsigned tools of their own and a warning will stop their work
      - The machine stands on a closed network, so the filter will get no answer and will settle nothing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'EnableSmartScreen'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'EnableSmartScreen'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The filter asks about provenance, not contents. It calls for a connection
    # outward - on a closed network it will not give an answer and the item
    # loses its point.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableSmartScreen' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/

notes:
  pl: |
    Punkt jest piąty w bloku i pierwszy z pary o filtrze reputacyjnym.
    Warto pokazywać oba razem, bo sam filtr bez drugiego punktu jest
    sugestią, a nie zabezpieczeniem.

    Rozróżnienie warte postawienia wprost: filtr pyta o pochodzenie, nie
    o zawartość. Bez tego zdania reguła wygląda na powtórzenie ochrony
    antywirusowej i zostanie odpuszczona jako nadmiarowa, a jej wartość
    leży właśnie tam, gdzie sygnatury nie sięgają.

    Warunek do sprawdzenia jest nietypowy, bo dotyczy nie skutków zmiany,
    lecz jej skuteczności. Na maszynie bez drogi wyjścia do sieci punkt
    zostaje spełniony i nie robi nic. Warto, żeby raport potrafił to
    rozróżnić, bo zgodność bez skutku jest gorsza od jawnej niezgodności.

    Odnotowuję koszt, o którym łatwo zapomnieć: narzędzia własne
    niepodpisane wywołują ostrzeżenie przy każdym uruchomieniu. Jest to
    najczęstszy powód cofnięcia tej reguły i warto zapowiedzieć go przed
    wykonaniem, a nie po.
  en: |
    The item is the fifth in the block and the first of the pair about the reputation filter. They are worth showing
    together, the filter alone without the second item being a suggestion rather than a safeguard.

    A distinction worth setting down outright: the filter asks about provenance, not about content. Without that
    sentence the rule looks a repetition of antivirus protection and will be let go as needless, while its value lies
    just where signatures do not reach.

    The condition to be checked is an unusual one, concerning not the change's consequences but its effectiveness. On
    a machine without a road out to the network the item is met and does nothing. It is well that the report be able
    to tell that apart, a compliance without consequence being worse than an open non-compliance.

    Worth noting a cost easily forgotten: unsigned tools of one's own raise a warning at every starting. It is the
    commonest reason for this rule being undone, and worth announcing before the carrying out rather than after.
