id: win2025-security-log-retention

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Security
  title:
    pl: Zachowanie dziennika zabezpieczeń po zapełnieniu
    en: Behaviour of the security log once it fills up
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala, co dzieje się z dziennikiem zabezpieczeń po jego
    zapełnieniu: najstarsze zapisy mają być nadpisywane nowymi.

    Zostawiam kategorię średnią, ale chcę wyłożyć, czego ten punkt
    naprawdę dotyczy, bo nazwa sugeruje coś przeciwnego niż jego treść.

    Punkt nie służy zachowaniu zapisów. Służy temu, żeby zapełniony
    dziennik nie zatrzymał maszyny. Ustawienie przeciwne — zakaz
    nadpisywania — jest mechanizmem, który przy pełnym dzienniku
    zabezpieczeń potrafi wstrzymać rejestrowanie, a w wariancie
    surowszym zatrzymać system. Jest to jedno z nielicznych ustawień
    zgodności, którego nieostrożne włączenie unieruchamia serwer w sposób
    wyglądający na awarię sprzętu.

    Skoro zgadzamy się na nadpisywanie, to obrona przed utratą zapisów
    musi stać gdzie indziej i warto wiedzieć gdzie: opiera się na
    rozmiarze dziennika i na wynoszeniu zapisów poza maszynę. Te dwie
    rzeczy są opisane osobnymi punktami i dopiero razem z nimi ten punkt
    ma sens. Sam z siebie mówi tylko tyle, że wolimy stracić najstarsze
    zapisy niż stracić maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przy
    ustawieniu zakazującym nadpisywania — sposób na zatrzymanie
    rejestrowania albo i maszyny przez samo wypełnienie dziennika
    hałasem, bez żadnego dostępu do jej wnętrza.
  en: |
    The item sets what befalls the security log once it is full - the oldest writings are to be written
    over by new ones.

    I leave the category middling, but would set out what that item truly bears upon, the name
    betokening the other thing than its substance.

    The item is not for the keeping of writings. It is for this, that a full log stop not the machine.
    The setting the other way - a forbidding of the writing over - is a working that, at a full security
    log, can hold up the writing down, and in its sterner shape stop the system. It is one of the few
    settings of following whereof the unheedful switching on stills a server in a way that looks like a
    fault of the gear.

    Since we say yea to the writing over, the warding against the loss of writings must stand
    elsewhere, and it is worth knowing where - it rests upon the size of the log and upon the bearing of
    writings off the machine. Those two things are told of in items of their own, and only together with
    them does this item have sense. Of itself it says only this much, that we would rather lose the
    oldest writings than lose the machine.

    What an attacker gains while the item goes unmet - at a setting forbidding the writing over, a way
    to stop the writing down, or the machine itself, by the mere filling of the log with noise, with no
    reach at all into its innards.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce, nie zatrzymuje usługi, nie wymaga restartu i nie zmienia
    niczego w tym, co widzą użytkownicy.

    Odnotowuję jedną rzecz na wypadek maszyny, na której ustawiono
    wcześniej zakaz nadpisywania: po tej zmianie dziennik zacznie się
    nadpisywać i najstarsze zapisy zaczną znikać. Jeżeli ktoś liczył na
    to, że pełny dziennik czeka nietknięty na ręczne opróżnienie,
    powinien wcześniej zrobić kopię. Nie zmienia to jednak klasy, bo
    poleganie na tym mechanizmie jest właśnie tym, czego ten punkt każe
    zaniechać.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem — z zastrzeżeniem powyżej, które warto
    przeczytać przed hurtem na maszynie z zakazem nadpisywania.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule, stops no service, takes no
    starting anew and alters nothing in what the users see.

    I note one thing for the case of a machine whereon a forbidding of the writing over was set before -
    after that change the log will begin to write itself over and the oldest writings will begin to go
    away. If somebody reckoned that a full log waits untouched for a handmade emptying, they ought to
    make a copy beforehand. It alters not the class for all that, the leaning upon that working being
    just what this item bids one leave off.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk - with the saving above,
    which is worth the reading before a bulk laying-on upon a machine with a forbidding of the writing
    over.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie z zakazem nadpisywania dziennik zacznie się nadpisywać i najstarsze zapisy zaczną znikać
      - Przestaje działać oczekiwanie, że pełny dziennik czeka nietknięty na ręczne opróżnienie
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Obrona przed utratą zapisów przenosi się na rozmiar dziennika i na wynoszenie zapisów poza maszynę
    en:
      - Upon a machine with a forbidding of the writing over the log will begin to write itself over and the oldest writings will go away
      - The looking for a full log to wait untouched for a handmade emptying stops holding
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - The warding against the loss of writings shifts onto the size of the log and the bearing of writings off the machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie ustawiono zakaz nadpisywania świadomie i nie zrobiono jeszcze kopii zebranych zapisów
    en:
      - Upon the machine a forbidding of the writing over was set wittingly and no copy of the gathered writings has yet been made
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text.
      # Reading it numerically would turn an absent value into a zero and
      # report a machine with no policy at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
      $name = 'Retention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is not about keeping records: it is about a full log not stopping
    # the machine. Where overwriting was forbidden, take a copy of the log
    # first - after this change the oldest records start to go.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Nazwa sugeruje coś przeciwnego niż treść: punkt nie służy zachowaniu
    zapisów, tylko temu, żeby zapełniony dziennik nie zatrzymał maszyny.
    Ustawienie przeciwne potrafi wstrzymać rejestrowanie, a w wariancie
    surowszym zatrzymać system — nieostrożnie włączone unieruchamia
    serwer w sposób wyglądający na awarię sprzętu.

    Skoro zgadzamy się na nadpisywanie, obrona przed utratą zapisów
    stoi gdzie indziej: na rozmiarze dziennika i na wynoszeniu zapisów
    poza maszynę. Dopiero razem z tamtymi punktami ten ma sens.

    Sam z siebie mówi tylko tyle, że wolimy stracić najstarsze zapisy
    niż stracić maszynę.
  en: |
    The name betokens the other thing than the substance - the item is not for the keeping of writings
    but for this, that a full log stop not the machine. The setting the other way can hold up the
    writing down, and in its sterner shape stop the system - switched on unheedfully it stills a server
    in a way that looks like a fault of the gear.

    Since we say yea to the writing over, the warding against the loss of writings stands elsewhere -
    upon the size of the log and upon the bearing of writings off the machine. Only together with those
    items does this one have sense.

    Of itself it says only this much, that we would rather lose the oldest writings than lose the
    machine.
