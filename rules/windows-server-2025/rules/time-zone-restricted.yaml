id: win2025-time-zone-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana strefy czasowej ograniczona do administratorów, usługi lokalnej i użytkowników
    en: Changing the time zone restricted to administrators, the local service and users
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala zmienić strefę czasową maszyny — czyli przesunięcie
    między czasem wewnętrznym a czasem pokazywanym.

    Różnica wobec punktu o zmianie czasu systemowego jest tu całą
    treścią sprawy. Zegar wewnętrzny liczy czas powszechny i zmiana
    strefy go nie dotyka. Przesuwa się wyłącznie to, co widzi człowiek
    patrzący na ekran. Uwierzytelnianie, ważność certyfikatów i
    porównywanie znaczników w dzienniku opierają się na czasie
    wewnętrznym, więc pozostają nietknięte.

    Dlatego punkt ten jest oceniony nisko, choć wygląda podobnie do
    poprzedniego. Wartość ma porządkowa: strefa ustawiona źle sprawia,
    że godziny w raportach i w widokach dziennika nie zgadzają się
    z godzinami, o których mówią ludzie. Na serwerze bywa to mylące
    podczas analizy zdarzenia, kiedy wykaz z jednej maszyny zestawia
    się z wykazem z drugiej, a ktoś zapomniał, że strefy są różne.

    Punkt zawęża wykaz do administratorów, konta usługi lokalnej
    i użytkowników.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    — najwyżej zamieszanie przy odczycie godzin podczas analizy
    zdarzenia. Punkt należy do porządkowych, nie do broniących.
  en: |
    The right allows the machine's time zone to be changed - that is, the shift between the
    inner time and the time shown.

    The difference from the item on changing the system time is here the whole of the matter.
    The inner clock reckons universal time and a change of zone does not touch it. What shifts
    is only what a person looking at the screen sees. Authentication, certificates' validity and
    the comparing of stamps in the log rest on the inner time, and so stay untouched.

    Hence this item is rated low, though it looks like the one before. Its worth is in order: a
    zone set wrongly makes the hours in reports and in the log's views disagree with the hours
    people speak of. On a server that is at times misleading during the study of an incident,
    where a list from one machine is set beside a list from another and somebody forgot the
    zones differ.

    The item narrows the list to administrators, the local service account and users.

    What an attacker gains while the item goes unmet: little - at most a confusion in the
    reading of hours during the study of an incident. The item belongs among the orderly ones
    rather than among the defending.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz obejmuje dokładnie te konta, których
    wymaga punkt, więc na większości serwerów naprawa nie zmienia
    niczego.

    Strefa bieżąca pozostaje taka, jaka jest. Naprawa dotyczy tego, kto
    może ją zmienić, a nie wartości ustawionej.

    Zegar wewnętrzny nie jest tu w ogóle w grze. Godziny zapisane
    w dzienniku, ważność biletów i porównania czasu między maszynami
    pozostają bez zmiany, bo opierają się na czasie powszechnym.

    Na serwerze skutek jest zwykle zerowy z powodu prozaicznego: strefę
    ustawia się raz, przy wdrożeniu maszyny, i nikt do tego nie wraca.
    Wyjątkiem jest serwer terminali, na którym użytkownicy pracują
    w sesjach — ci prawo zachowują, bo znajdują się w wykazie zgodnym.

    Objaw, gdyby wystąpił, jest natychmiastowy i czytelny: okno
    ustawień daty i godziny odmawia zapisania zmiany strefy.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list takes in exactly the accounts the item asks for, so on most
    servers the mending changes nothing.

    The present zone stays as it is. The mending bears on who may change it rather than on the
    value set.

    The inner clock is not in play here at all. The hours written in the log, tickets' validity
    and comparings of time between machines stay unchanged, since they rest on universal time.

    On a server the effect is usually nil for a humdrum reason: the zone is set once, at the
    machine's rollout, and nobody returns to it. The exception is a terminal server, where users
    work in sessions - they keep the right, being within the compliant list.

    The symptom, should it arise, is immediate and plain: the date and time settings window
    refuses to save a change of zone.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
  what_breaks:
    pl:
      - Konto spoza wykazu nie zapisze zmiany strefy w ustawieniach daty i godziny
      - Strefa bieżąca pozostaje bez zmiany, bo naprawa nie dotyka wartości ustawionej
      - Zegar wewnętrzny, ważność biletów i znaczniki w dzienniku pozostają nietknięte
      - Użytkownicy sesji na serwerze terminali zachowują prawo, bo są w wykazie zgodnym
    en:
      - An account outside the list will not save a change of zone in the date and time settings
      - The present zone stays unchanged, since the mending does not touch the value set
      - The inner clock, tickets' validity and the log's stamps stay untouched
      - Session users on a terminal server keep the right, being within the compliant list
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Strefę czasową ustawia narzędzie wdrożeniowe pracujące na koncie spoza wykazu
    en:
      - The time zone is set by a rollout tool working under an account outside the list
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTimeZonePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-32-544,S-1-5-32-545|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTimeZonePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTimeZonePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTimeZonePrivilege = *S-1-5-32-544,*S-1-5-32-545,*S-1-5-19',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTimeZonePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/change-the-time-zone

notes:
  pl: |
    Punkt czyta się razem ze zmianą czasu systemowego i różnica między
    nimi jest całą treścią sprawy. Tamten przestawia zegar wewnętrzny,
    od którego zależy uwierzytelnianie; ten przesuwa wyłącznie czas
    pokazywany.

    Z tego bierze się różnica ocen: tamten jest wysokiego ryzyka,
    ten niskiego. Wykaz zgodny jest tu również szerszy, bo dopuszcza
    użytkowników — a na serwerze terminali ma to znaczenie praktyczne.

    Na serwerze strefę ustawia się zwykle raz, przy wdrożeniu maszyny.
  en: |
    The item is read together with the changing of the system time, and the difference between
    them is the whole of the matter. That one sets the inner clock authentication hangs on; this
    one shifts only the time shown.

    Thence the difference of ratings: that one is of high risk, this one of low. The compliant
    list is wider here too, since it allows users - and on a terminal server that weighs in
    practice.

    On a server the zone is usually set once, at the machine's rollout.
