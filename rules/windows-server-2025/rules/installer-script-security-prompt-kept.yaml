id: win2025-installer-script-security-prompt-kept

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Ostrzeżenie przed instalatorem wywołanym ze skryptu zachowane
    en: The warning before an installer called from a script kept
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt pilnuje, żeby instalator wywołany ze skryptu nie mógł działać
    bez ostrzeżenia. Nazwa wpisu opisuje zniesienie tego ostrzeżenia,
    więc wartością wymaganą jest zero — ostrzeżenie zachowane.

    Znaczenie tego punktu na serwerze jest inne niż na stacji roboczej
    i chcę je nazwać wprost, bo wynika z rzeczy, którą powtarzam w całej
    tej paczce. Na serwerze nikt nie siedzi, więc pytanie zadane na
    ekranie jest pytaniem bez odpowiedzi, a pytanie bez odpowiedzi jest
    odmową.

    I właśnie dlatego ten punkt jest na serwerze zagrożony bardziej niż
    gdziekolwiek indziej. Człowiek piszący skrypt wdrożeniowy natrafia
    na instalator, który się zatrzymuje, nie rozumie dlaczego, znajduje
    w sieci wpis znoszący ostrzeżenie i zapisuje go, bo wtedy skrypt
    przechodzi. Zmiana zostaje na zawsze, bo nic po niej nie boli.

    Od tej chwili każdy skrypt na tej maszynie — nie tylko ten jeden —
    może wywołać instalator działający z pełnymi prawami i bez pytania.
    Napastnik, który umie doprowadzić do uruchomienia własnego skryptu,
    dostaje gotową drogę w górę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    z pełnymi prawami wywołaną ze skryptu, bez żadnej bramki po drodze.
  en: |
    The item sees to it that an installer called from a script cannot work without a warning. The
    entry's name speaks of the doing away with that warning, so the worth taken is nought - the
    warning kept.

    The weight of this item on a server is other than on a workstation, and I mean to name it
    outright, it following from a thing I say again throughout this pack. Nobody sits at a server, so
    a question asked upon a screen is a question without an answer, and a question without an answer
    is a refusal.

    And for that very reason this item is on a server more at hazard than anywhere else. The person
    writing a script of rolling out comes upon an installer that stops, understands not why, finds in
    the net an entry doing away with the warning and writes it down, the script then passing. The
    change stays for good, nothing after it biting.

    From that hour every script upon that machine - and not that one alone - may call an installer
    working with full rights and asking nothing. An attacker able to bring about the running of a
    script of their own gets a ready road upward.

    What an attacker gains while the item goes unmet - an installing with full rights called from a
    script, with no gate along the way.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" i uzasadnienie jest tu dwojakie,
    zależnie od tego, co na maszynie zastaniemy.

    Na serwerze, na którym wpisu nie ma, zmiana zapisuje jawne zero
    w miejsce braku i nie zmienia zachowania niczego. Zero jest tym, co
    system robi domyślnie.

    Na serwerze, na którym wpis jest i znosi ostrzeżenie, zmiana je
    przywraca — i wtedy przestanie działać dokładnie to, dla czego ten
    wpis kiedyś powstał. Zwykle jest to jeden skrypt wdrożeniowy albo
    jedno zadanie zaplanowane instalujące pakiet bez udziału człowieka.

    Mimo to nie podnoszę klasy i chcę powiedzieć dlaczego. Zatrzymany
    instalator nie psuje niczego, co już działa. Usługa stoi dalej,
    połączenia idą dalej, nie ma przerwy. Zatrzymuje się tylko kolejne
    wdrożenie, i to w sposób widoczny natychmiast — zadanie kończy się
    niepowodzeniem, a nie po cichu.

    Właściwym rozwiązaniem nie jest przywrócenie wpisu, tylko uruchamianie
    instalacji przez mechanizm, który ma do tego prawo z założenia:
    zadanie działające na koncie z uprawnieniami albo agent zarządzania.
    Wpis znoszący ostrzeżenie jest obejściem, a nie sposobem.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption", and the standing by it is here twofold, after what we find
    upon the machine.

    On a server where the entry is not, the change writes an outright nought in the place of a want
    and alters the bearing of nothing. A nought is what the system does by default.

    On a server where the entry is and does away with the warning, the change brings it back - and
    then that will stop working for whose sake that entry once came to be. It is mostly one script of
    rolling out or one task set for a time that installs a package with no person by.

    For all that I raise not the class, and I mean to say why. A stopped installer mars nothing that
    works already. The service stands on, the bindings go on, there is no break. What stops is only
    the next rolling out, and that in a way seen at once - the task ends in a failing and not in
    silence.

    The right mending is not the bringing back of the entry but the running of the installing by a
    working that has the right to it by its making - a task working on an account with rights, or an
    agent of ruling. The entry doing away with the warning is a going round and no way.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - updates-and-servicing
  what_breaks:
    pl:
      - Skrypt wdrożeniowy instalujący pakiet bez udziału człowieka zatrzyma się na ostrzeżeniu
      - Zadanie zaplanowane wywołujące instalator kończy się niepowodzeniem, ale widocznie, a nie po cichu
      - Zatrzymany instalator nie psuje niczego, co już działa, i nie powoduje przerwy w usłudze
      - Na serwerze bez tego wpisu zmiana nie zmienia zachowania niczego
      - Właściwym rozwiązaniem jest zadanie na koncie z uprawnieniami, a nie przywrócenie wpisu
    en:
      - A script of rolling out that installs a package with no person by will stop at the warning
      - A task set for a time that calls an installer ends in a failing, but seen and not in silence
      - A stopped installer mars nothing that works already and brings about no break in the service
      - On a server without that entry the change alters the bearing of nothing
      - The right mending is a task on an account with rights and not the bringing back of the entry
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name describes doing away with the warning, so the required
      # value is zero - the warning kept.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'SafeForScripting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'SafeForScripting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where a deployment script relied on the warning being gone, run the
    # install from a task under an account with rights instead of putting the
    # entry back.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SafeForScripting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/windows-installer-portal

notes:
  pl: |
    Punkt zagrożony na serwerze bardziej niż gdziekolwiek indziej i to
    z powodu, który wygląda na argument za wpisem, a jest argumentem
    przeciw: na serwerze nikt nie siedzi, więc pytanie zadane na ekranie
    jest odmową — i ktoś kiedyś znosi ostrzeżenie, żeby skrypt przeszedł.

    Zmiana zostaje na zawsze, bo nic po niej nie boli. Od tej chwili
    każdy skrypt na tej maszynie może wywołać instalator z pełnymi
    prawami.

    Wpis znoszący ostrzeżenie jest obejściem, a nie sposobem. Sposobem
    jest zadanie działające na koncie z uprawnieniami albo agent
    zarządzania.
  en: |
    An item more at hazard on a server than anywhere else, and of a ground that looks like a reason
    for the entry and is a reason against it - nobody sits at a server, so a question asked upon a
    screen is a refusal, and somebody one day does away with the warning that the script may pass.

    The change stays for good, nothing after it biting. From that hour every script upon that machine
    may call an installer with full rights.

    The entry doing away with the warning is a going round and no way. The way is a task working on
    an account with rights, or an agent of ruling.
