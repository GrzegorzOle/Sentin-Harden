id: win2025-wireless-connect-now-registrars-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connect Now
  title:
    pl: Konfigurowanie ustawień sieci bezprzewodowej przez uproszczone parowanie wyłączone
    en: Configuring wireless settings by simplified pairing switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza uproszczone parowanie, którym urządzenie bezprzewodowe
    może przekazać maszynie ustawienia sieci albo je od niej pobrać.

    Kategoria wysoka i chcę nazwać, co tu przechodzi, bo nazwa mówi
    o wygodzie konfigurowania. Przechodzi konfiguracja sieci wraz z kluczem.
    Mechanizm powstał po to, żeby nie trzeba było wpisywać hasła do sieci
    bezprzewodowej: urządzenie, które umie o nie poprosić w przewidziany
    sposób, dostaje je gotowe.

    To jest właściwa treść punktu i ona działa w obie strony. Maszyna może
    wydać ustawienia sieci urządzeniu, które o nie poprosi, i może przyjąć
    ustawienia narzucone przez urządzenie, które się ogłosi. Warunkiem jest
    bliskość i chwila, w której trwa parowanie — nie hasło administratora.

    Na serwerze dochodzi rzecz, która przesądza kategorię: serwer zna hasła
    do sieci, w których pracuje, i nie ma żadnego powodu, żeby rozdawać je
    urządzeniom w swoim otoczeniu. Drukarka, wyświetlacz, urządzenie
    pomiarowe wniesione do serwerowni na godzinę — każde z nich jest w tym
    mechanizmie stroną uprawnioną do pytania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    uzyskania konfiguracji sieci wraz z kluczem od maszyny, która tej sieci
    strzeże, bez podania żadnych poświadczeń.
  en: |
    The item switches off the simplified pairing by which a wireless device
    can pass network settings to the machine or take them from it.

    The category is high, and I want to name what passes here, because the
    name speaks of convenience in configuring. What passes is the network's
    configuration together with its key. The mechanism was made so that a
    wireless network's password need not be typed: a device that knows how to
    ask for it in the foreseen way is given it ready-made.

    That is the real substance of the item, and it works both ways. The
    machine can give out network settings to a device that asks for them, and
    it can accept settings imposed by a device that announces itself. The
    condition is nearness and the moment in which pairing is under way - not
    an administrator's password.

    On a server there is one thing more that settles the category: a server
    knows the passwords of the networks it works in, and has no reason at all
    to hand them out to devices in its surroundings. A printer, a display, a
    measuring device carried into the server room for an hour - in this
    mechanism each of them is a party entitled to ask.

    What an attacker gains while the item goes unmet: a way of obtaining the
    network configuration together with its key from the machine that guards
    that network, without giving any credentials.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i uczciwie mówię, czego to sprawdzenie
    dotyczy: na większości serwerów niczego, bo serwer nie ma karty
    bezprzewodowej i mechanizm nie ma czym działać.

    Sprawdzić trzeba maszyny, na których karta bezprzewodowa jednak jest —
    a bywa, bo serwery w małych firmach stoją czasem na sprzęcie
    stanowiskowym. Tam po zmianie nie da się dołączyć do sieci ani
    skonfigurować urządzenia przyciskiem na routerze. Zostaje droga zwykła:
    wybranie sieci i wpisanie hasła. To działa dalej i jest właściwym
    sposobem, a nie obejściem.

    Drugi przypadek dotyczy urządzeń: drukarki i wyświetlacze konfigurowane
    tym mechanizmem trzeba będzie skonfigurować ręcznie, podając im hasło
    do sieci. Warto to sprawdzić, zanim ktoś stanie przed nowym urządzeniem
    z instrukcją opisującą wyłącznie tę drogę.

    Czego to nie psuje: istniejących połączeń bezprzewodowych, zapisanych
    profili sieci, sieci przewodowej ani żadnej usługi. Punkt dotyczy
    wyłącznie uproszczonego parowania.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and I say honestly what the review concerns:
    on most servers nothing, because a server has no wireless card and the
    mechanism has nothing to work with.

    What needs checking are the machines that do have a wireless card - and
    some do, because servers in small firms sometimes stand on workstation
    hardware. There, after the change, a network cannot be joined nor a
    device configured by a button on the router. The ordinary route remains:
    choosing the network and typing the password. That still works and is the
    proper way, not a workaround.

    The second case concerns devices: printers and displays configured by
    this mechanism will have to be configured by hand, by giving them the
    network password. It is worth checking before somebody stands in front of
    a new device with instructions describing only this route.

    What this does not break: existing wireless connections, saved network
    profiles, the wired network, or any service. The item concerns simplified
    pairing alone.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Na maszynie z kartą bezprzewodową nie da się dołączyć do sieci ani skonfigurować urządzenia przyciskiem na routerze
      - Zostaje droga zwykła — wybranie sieci i wpisanie hasła — i to jest właściwy sposób, a nie obejście
      - Drukarki i wyświetlacze konfigurowane tym mechanizmem trzeba będzie skonfigurować ręcznie, podając im hasło do sieci
      - Istniejące połączenia bezprzewodowe, zapisane profile sieci i sieć przewodowa działają bez zmian
    en:
      - On a machine with a wireless card, a network cannot be joined nor a device configured by a button on the router
      - The ordinary route remains - choosing the network and typing the password - and that is the proper way, not a workaround
      - Printers and displays configured by this mechanism will have to be configured by hand, by giving them the network password
      - Existing wireless connections, saved network profiles and the wired network work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie z kartą bezprzewodową urządzenia są przyłączane do sieci wyłącznie tą drogą i nie ma innego sposobu podania im hasła
    en:
      - On a machine with a wireless card, devices are joined to the network by this route alone and there is no other way of giving them the password
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
      $name = 'EnableRegistrars'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
    $name = 'EnableRegistrars'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # What passes here is the network's configuration together with its key, and
    # it passes both ways: the machine can give settings out to a device that
    # asks, and accept settings from one that announces itself. The condition is
    # nearness, not an administrator's password.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\Registrars'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableRegistrars' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/mobilebroadband/

notes:
  pl: |
    Nazwa mówi o wygodzie konfigurowania, a przechodzi tu konfiguracja sieci
    wraz z kluczem. Mechanizm powstał po to, żeby nie trzeba było wpisywać
    hasła: urządzenie, które umie o nie poprosić w przewidziany sposób,
    dostaje je gotowe.

    Działa w obie strony — maszyna może wydać ustawienia urządzeniu, które
    poprosi, i przyjąć ustawienia od urządzenia, które się ogłosi. Warunkiem
    jest bliskość i chwila parowania, nie hasło administratora.

    Na serwerze przesądza to, że serwer zna hasła do sieci, w których
    pracuje. Drukarka albo urządzenie pomiarowe wniesione do serwerowni na
    godzinę jest w tym mechanizmie stroną uprawnioną do pytania.
  en: |
    The name speaks of convenience in configuring, yet what passes is the
    network's configuration together with its key. The mechanism was made so
    that a password need not be typed: a device that knows how to ask in the
    foreseen way is given it ready-made.

    It works both ways - the machine can give settings out to a device that
    asks, and accept settings from one that announces itself. The condition
    is nearness and the moment of pairing, not an administrator's password.

    On a server what settles it is that a server knows the passwords of the
    networks it works in. A printer or a measuring device carried into the
    server room for an hour is, in this mechanism, a party entitled to ask.
