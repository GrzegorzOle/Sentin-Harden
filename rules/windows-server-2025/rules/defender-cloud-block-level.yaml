id: win2025-defender-cloud-block-level

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Podwyższony poziom blokowania przez usługę chmurową
    en: Raised cloud blocking level
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt przesuwa próg, przy którym usługa zewnętrzna uznaje plik za
    zły. Nie dokłada nowego mechanizmu — zmienia rozstrzygnięcie
    w przypadkach niepewnych, czyli tych, w których wcześniej plik
    przechodził przy braku pewności.

    Zostawiam kategorię średnią. Jest to utwardzenie ograniczające pole
    manewru, a nie zamknięcie drogi: napastnik, którego narzędzie już
    wygląda podejrzanie, i tak liczy się z blokadą. Zyskiem jest ten
    wąski pas przypadków, w których narzędzie było na tyle nowe albo na
    tyle przerobione, że nie starczało na rozstrzygnięcie.

    Punkt jest trzecim z rzędu, który nic nie robi bez dwóch
    wcześniejszych. Bez ochrony z chmury nie ma odpytania, a bez
    odpytania nie ma czego próg dotyczyć. Zielony wiersz osobno nie
    znaczy tu nic.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: korzyść
    z wątpliwości — narzędzie niepewne przechodzi zamiast zostać
    zatrzymane.
  en: |
    The item shifts the bound whereat the outward service holds a file to be ill. It adds no new
    working - it alters the settling in unsure cases, that is in those wherein the file went through
    before for want of sureness.

    I leave the category middling. It is a hardening that narrows the room to move and no shutting of
    a road - an attacker whose tool already looks suspect reckons with a block anyway. The gain is
    that narrow band of cases wherein the tool was so new or so worked over that there was not
    enough for a settling.

    The item is the third in a row that does nothing without the two before it. Without the guard
    from the cloud there is no asking, and without an asking there is nothing for the bound to bear
    upon. A green line by itself means here nothing.

    What an attacker gains while the item goes unmet - the good of the doubt, an unsure tool going
    through instead of being stopped.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia, choć dla stacji roboczej
    wystarcza sprawdzenie. Powód jest jeden i jest po stronie tego, co
    na serwerze stoi.

    Podniesienie progu podnosi liczbę pomyłek w drugą stronę. Plikiem,
    który przy podniesionym progu zostaje zatrzymany, jest najczęściej
    program napisany na miejscu: niepodpisany, o małym rozpowszechnieniu,
    spakowany narzędziem, które pakuje też złe rzeczy. Dokładnie tak
    wygląda oprogramowanie własne organizacji — i jest ono na serwerze,
    a nie na stacji.

    Objaw jest tu wyjątkowo nieprzyjemny i to on przesądza o klasie.
    Plik nie zostaje odrzucony przy kopiowaniu z ostrzeżeniem, tylko
    zabrany do kwarantanny. Z punktu widzenia obsługi usługa przestaje
    się uruchamiać po wdrożeniu, a plik, który miała uruchomić, zniknął
    z dysku. Dochodzenie zaczyna się od podejrzenia, że wdrożenie się
    nie udało, i dopiero po jakimś czasie ktoś zagląda do dziennika
    mechanizmu ochronnego.

    Dlatego kolejność jest tu obowiązkowa. Przed zmianą trzeba mieć
    ustalone wyłączenia dla katalogów wdrożeniowych i dla własnych
    programów, a wdrożenie przeprowadzić na maszynie testowej przez
    pełny cykl wydania, nie przez jeden przebieg.

    Zmiana cofa się natychmiast, ale plik z kwarantanny trzeba
    przywrócić osobno i nie dzieje się to samo.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    I raise the class to a witting rolling out, though for a workstation a checking is enough. The
    ground is one and it lies on the side of what stands on a server.

    The raising of the bound raises the number of mistakes the other way. The file that at a raised
    bound is stopped is most often a program written on the spot - unsigned, of small spread, packed
    by a tool that packs ill things too. Just so looks a body's own software - and it is on the
    server and not on the workstation.

    The symptom is here uncommonly unpleasant and it is that which settles the class. The file is
    not cast off at its copying with a warning but taken into holding. To the staff's eye the
    service stops running after the rolling out, and the file it was to run has vanished off the
    disk. The seeking begins from a doubt that the rolling out went amiss, and only after some time
    does somebody look into the day-book of the guarding working.

    Therefore the order is here binding. Before the change the leavings-out for the folders of
    rolling out and for one's own programs must be settled, and the rolling out must go on a machine
    for trials through a full round of a loosing and not through a single running.

    The change is undone at once, but a file in holding must be brought back apart and that does not
    happen of itself.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Niepodpisany program napisany na miejscu może zostać zabrany do kwarantanny przy wdrożeniu
      - Usługa przestaje się uruchamiać, a plik, który miała uruchomić, zniknął z dysku bez ostrzeżenia
      - Dochodzenie zaczyna się od podejrzenia nieudanego wdrożenia, a nie od dziennika mechanizmu ochronnego
      - Cofnięcie ustawienia nie przywraca plików z kwarantanny, to trzeba zrobić osobno
      - Bez ochrony z chmury i bez odpytania próg nie dotyczy niczego, a zielony wiersz nic nie znaczy
    en:
      - An unsigned program written on the spot can be taken into holding at a rolling out
      - The service stops running and the file it was to run has vanished off the disk with no warning
      - The seeking begins from a doubt of a rolling out gone amiss and not from the guarding working's day-book
      - The undoing of the setting brings no files back out of holding, that must be done apart
      - Without the guard from the cloud and without an asking the bound bears on nothing and the green line means nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono wyłączeń dla katalogów wdrożeniowych i dla własnych niepodpisanych programów
      - Nie przeprowadzono wdrożenia na maszynie testowej przez pełny cykl wydania oprogramowania
    en:
      - The leavings-out for the folders of rolling out and for one's own unsigned programs are not settled
      - The rolling out was not run on a machine for trials through a full round of a loosing of software
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).CloudBlockLevel }
    } catch {
      'CHECK_ERROR'
    }
  expected: ^(2|4|6)$
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $name = 'MpCloudBlockLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the exclusions for deployment folders and in-house binaries first;
    # undoing this setting does not bring quarantined files back by itself.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MpCloudBlockLevel' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/specify-cloud-protection-level-microsoft-defender-antivirus

notes:
  pl: |
    Trzeci z rzędu punkt, który nic nie robi bez dwóch wcześniejszych:
    bez ochrony z chmury nie ma odpytania, a bez odpytania próg nie
    dotyczy niczego.

    Klasa podniesiona wobec stacji roboczej, bo plikiem zatrzymanym
    przy podniesionym progu jest najczęściej program napisany na
    miejscu: niepodpisany, o małym rozpowszechnieniu, spakowany. Tak
    wygląda oprogramowanie własne organizacji i stoi ono na serwerze.

    Objaw przesądza o klasie: plik nie zostaje odrzucony z ostrzeżeniem,
    tylko zabrany do kwarantanny, więc dochodzenie zaczyna się od
    podejrzenia nieudanego wdrożenia.
  en: |
    The third item in a row that does nothing without the two before it - without the guard from the
    cloud there is no asking, and without an asking the bound bears on nothing.

    The class is raised against the workstation, the file stopped at a raised bound being most often
    a program written on the spot - unsigned, of small spread, packed. So looks a body's own
    software, and it stands on the server.

    The symptom settles the class - the file is not cast off with a warning but taken into holding,
    so the seeking begins from a doubt of a rolling out gone amiss.
