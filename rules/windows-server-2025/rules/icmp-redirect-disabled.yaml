id: win2025-icmp-redirect-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Przyjmowanie przekierowań ICMP wyłączone
    en: Acceptance of ICMP redirects disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania systemowi zmieniać własne trasy na podstawie
    komunikatu przekierowania przysłanego przez inne urządzenie w sieci.

    Przekierowanie jest wiadomością, którą brama wysyła, gdy uzna, że
    do celu prowadzi lepsza droga niż ta, którą maszyna wybrała.
    Pomyślano to w czasach, gdy w jednym segmencie stało kilka bram
    i warto było, żeby same się dogadywały.

    Wady tej wiadomości nie da się naprawić w jej granicach: nikt jej
    nie podpisuje i nikt nie sprawdza, czy przysłało ją rzeczywiście
    urządzenie uprawnione. Maszyna, która ją przyjmuje, zmienia własną
    tablicę tras na życzenie kogokolwiek, kto potrafi odezwać się z tej
    samej sieci.

    Skutek jest taki, jakim jest każde przejęcie drogi: ruch zaczyna
    biec przez maszynę napastnika. Ten nie musi niczego łamać — wystarczy,
    że zobaczy, a jeżeli ruch nie jest szyfrowany, to zobaczy wszystko.

    Na serwerze rzecz waży więcej, bo trasy serwera obsługują ruch
    zbiorczy, a nie ruch jednej osoby. Przez maszynę napastnika mogłaby
    pójść replikacja, kopia zapasowa albo ruch do kontrolera domeny.
    Drugą różnicą jest czas: zmiana trasy na stanowisku roboczym żyje do
    wieczora, bo maszyna się wyłącza. Na serwerze, który pracuje
    miesiącami, podłożona trasa trwa tyle, ile sam serwer.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość przeprowadzenia ruchu wychodzącego serwera przez własną
    maszynę, bez uwierzytelnienia i bez śladu poza samą zmianą trasy.
  en: |
    The setting forbids the system to change its own routes upon a message of redirection sent by
    another device on the network.

    A redirect is a message a gateway sends when it holds that a better road to the aim leads
    than the one the machine chose. It was thought out in a time when several gateways stood in
    one segment and it was worth their settling matters between themselves.

    The flaw of that message cannot be mended within its bounds: nobody signs it and nobody
    checks whether it truly came from a device entitled to send it. A machine that takes it
    changes its own table of routes at the wish of anyone able to speak from the same network.

    The effect is that of any taking of a road: the traffic begins to run through the attacker's
    machine. They need break nothing - it is enough that they see, and where the traffic is not
    encrypted they will see everything.

    On a server the matter weighs more, a server's routes serving the traffic of many and not of
    one person. Replication could go through the attacker's machine, a backup, or the traffic to
    a domain controller. The second difference is time: a changed route at a working station
    lives until evening, the machine switching off. On a server working for months, a laid route
    lasts as long as the server does.

    What an attacker gains while the item goes unmet: the means of leading the server's outgoing
    traffic through a machine of their own, with no authentication and no trace beyond the
    changed route itself.

disruption_description:
  pl: |
    Sprawdzenia wymaga tu jedna rzecz i nie jest nią skutek zmiany:
    wartość czyta stos sieciowy przy starcie, więc zmiana zaczyna
    działać dopiero po ponownym uruchomieniu maszyny.

    Podniosłem klasę względem paczki stanowiska roboczego z tego
    powodu. Serwer pracuje miesiącami, a jego restart jest zdarzeniem
    planowanym. Między zapisaniem wartości a jej zadziałaniem raport
    pokazywałby stan zgodny, którego system jeszcze nie egzekwuje.

    Skutek samej zmiany jest natomiast znikomy. Sieci budowane dziś
    prowadzą ruch przez jedną bramę w segmencie i przekierowań nie
    używają. Serwer ma zwykle trasę domyślną ustawioną na stałe, więc
    nie ma czego zmieniać.

    Przypadkiem, który wolno rozważyć, jest starsza sieć z kilkoma
    bramami w jednym segmencie, w której przekierowania są częścią
    projektu. Tam po zmianie ruch nadal dojdzie — pójdzie przez bramę
    domyślną, a nie przez tę wskazaną jako lepsza — ale droga będzie
    dłuższa, a w skrajnym przypadku odbije się od bramy i wróci tym
    samym łączem.

    Objawem byłoby wtedy pogorszenie czasu odpowiedzi do wybranych
    sieci, a nie brak łączności. Jest to jedyny przypadek, w którym
    warto spojrzeć, zanim się zmianę wprowadzi na maszynach
    granicznych.

    Zmiana nie dotyczy tras wpisanych ręcznie ani trasy domyślnej
    otrzymanej od usługi przydzielania adresów.
  en: |
    One thing needs checking here and it is not the effect of the change: the network stack reads
    the value at its starting, so the change begins working only after a fresh start of the
    machine.

    I raised the class against the working station's pack for that reason. A server works for
    months and its restart is a planned happening. Between the writing of the value and its
    working, a report would show a compliant state the system does not yet enforce.

    The effect of the change itself is slight. Networks built today lead their traffic through
    one gateway in a segment and use no redirects. A server usually holds a default route set
    fast, so there is nothing to change.

    A case that may be weighed is an older network with several gateways in one segment, where
    redirects are part of the design. There, after the change, the traffic will still arrive - it
    will go by the default gateway rather than by the one named better - but the road will be
    longer, and in the worst case it will bounce off the gateway and come back by the same link.

    The symptom would then be a worsening of the time of answer to some networks and not a want
    of connection. It is the one case worth a look before the change is brought in on machines at
    a boundary.

    The change does not bear on routes written by hand or on a default route had from the service
    that hands out addresses.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - W starszej sieci z kilkoma bramami w segmencie droga do wybranych sieci może się wydłużyć
      - Objawem jest pogorszenie czasu odpowiedzi, a nie brak łączności
      - Trasy wpisane ręcznie i trasa domyślna pozostają bez zmiany
      - Zmiana zaczyna działać dopiero po ponownym uruchomieniu maszyny
    en:
      - In an older network with several gateways in a segment the road to some networks may lengthen
      - The symptom is a worsening of the time of answer and not a want of connection
      - Routes written by hand and the default route stay unchanged
      - The change begins working only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer stoi w sieci z kilkoma bramami w jednym segmencie, w której przekierowania są częścią projektu
    en:
      - The server stands in a network with several gateways in one segment where redirects are part of the design
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'EnableICMPRedirect'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'EnableICMPRedirect'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'EnableICMPRedirect' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Komunikatu przekierowania nikt nie podpisuje i nikt nie sprawdza,
    czy przysłało go urządzenie uprawnione. Na tym polega cała wada
    i dlatego nie da się jej naprawić w granicach tego mechanizmu.

    Na serwerze waży zasięg i czas: trasy obsługują ruch zbiorczy,
    a podłożona trasa trwa tyle, ile sam serwer — który pracuje
    miesiącami.

    Klasę podniosłem względem paczki stanowiska roboczego z powodu
    restartu, a nie skutku.
  en: |
    Nobody signs a message of redirection and nobody checks whether a device entitled to send it
    did. Therein lies the whole flaw, and hence it cannot be mended within that mechanism's
    bounds.

    On a server what weighs is reach and time: the routes serve the traffic of many, and a laid
    route lasts as long as the server does - and that works for months.

    I raised the class against the working station's pack by reason of the restart and not of the
    effect.
