id: win2025-deny-rdp-logon-guests-local

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa logowania przez pulpit zdalny dla gości i kont lokalnych
    en: Deny Remote Desktop sign-in for guests and local accounts
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zamyka drogę pulpitu zdalnego dwóm zbiorom naraz: grupie
    Goście oraz wszystkim kontom lokalnym tej maszyny.

    Druga połowa jest tą istotną i ona przesądza o wadze tego punktu.
    Konto lokalne istnieje wyłącznie na tej maszynie, więc jego hasło
    nie podlega zasadom domeny, nie jest zmieniane przy odejściu
    pracownika i nie widać go w żadnym wykazie prowadzonym centralnie.
    Bywa to konto utworzone przy instalacji, konto serwisowe dostawcy
    albo konto administratora wbudowanego z hasłem takim samym na
    kilkudziesięciu maszynach.

    Konta lokalne są przy tym podstawowym narzędziem ruchu bocznego.
    Napastnik, który wydobędzie skrót hasła administratora lokalnego
    z jednej maszyny, próbuje go na następnych — i jeżeli hasło jest
    wspólne, wchodzi wszędzie. Pulpit zdalny jest do tego drogą
    najwygodniejszą, bo daje sesję pełną, a nie tylko dostęp do pliku.

    Na serwerze punkt ten jest ważniejszy niż na stanowisku roboczym,
    bo serwer jest celem tego ruchu, a nie jego punktem wyjścia.
    Zamknięcie tej drogi na serwerach zatrzymuje rozejście się ataku
    w chwili, w której napastnik ma już poświadczenia lokalne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełną
    sesję na serwerze przy użyciu hasła konta lokalnego zdobytego gdzie
    indziej, bez potrzeby zdobywania poświadczeń domenowych.
  en: |
    The item shuts the road of remote desktop to two sets at once: the Guests group and every
    local account of this machine.

    The second half is the weighty one and it settles this item's importance. A local account
    exists on this machine alone, so its password does not fall under the domain's rules, is
    not changed when an employee leaves and shows in no centrally kept list. It is at times an
    account made at the installation, a supplier's service account, or the built-in
    administrator's account with the same password on dozens of machines.

    Local accounts are at that the chief tool of lateral movement. An attacker who draws the
    local administrator's password digest out of one machine tries it on the next - and where
    the password is shared, they come in everywhere. Remote desktop is the handiest road for
    that, since it gives a full session rather than mere access to a file.

    On a server this item matters more than at a working station, since the server is that
    movement's target rather than its starting point. Shutting this road on servers halts an
    attack's spreading at the moment the attacker already holds local credentials.

    What an attacker gains while the item goes unmet: a full session on the server using a
    local account's password won elsewhere, with no need of winning domain credentials.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia, bo odcina drogę dostępu, która
    na serwerze bywa jedyną pozostałą w sytuacji awaryjnej.

    Skutek jest jednoznaczny i natychmiastowy. Po zastosowaniu nikt nie
    zaloguje się przez pulpit zdalny na konto istniejące wyłącznie na
    tej maszynie. Dotyczy to również konta administratora lokalnego
    i również sesji już nawiązanej po jej zakończeniu.

    Na serwerze rodzi to problem, którego na stanowisku roboczym nie ma.
    Konto lokalne jest zwykle drogą zapasową na wypadek, gdy
    uwierzytelnianie domenowe zawiedzie: przy zerwaniu łączności
    z kontrolerem, po awarii replikacji, po zmianie konfiguracji sieci.
    Zamknięcie tej drogi znaczy, że w takiej sytuacji zostaje wyłącznie
    konsola — karta zarządzająca albo konsola hosta wirtualizacji.

    Warunkiem wdrożenia jest więc sprawdzenie, czy konsola ta działa
    i czy ktoś ma do niej dostęp. Nie jest to formalność: serwer,
    na którym zamknięto konta lokalne, a karta zarządzająca jest
    nieskonfigurowana, bywa nie do odzyskania bez wizyty w serwerowni.

    Osobno trzeba sprawdzić dostawców. Umowy serwisowe bywają oparte na
    koncie lokalnym udostępnionym przez pulpit zdalny i zmiana tę drogę
    zamknie.

    Sesje aktywne w chwili zmiany nie są zrywane. Kolejne logowanie już
    się nie powiedzie, więc objaw pojawia się z opóźnieniem — zwykle
    wtedy, gdy ktoś potrzebuje dostępu najbardziej.
  en: |
    The change takes a knowing rollout, since it cuts off a road of access that on a server is
    at times the only one left in an emergency.

    The effect is unmistakable and immediate. Once applied, nobody will sign in by remote
    desktop to an account existing on this machine alone. That holds for the local
    administrator's account too, and for a session already made once it ends.

    On a server that raises a trouble a working station does not have. A local account is
    usually the spare road in case domain authentication fails: at a break of touch with the
    controller, after a failure of replication, after a change of network configuration.
    Shutting that road means that in such a case only the console is left - the management card
    or the virtualisation host's console.

    A condition of the rollout is therefore checking that that console works and that somebody
    has access to it. That is no formality: a server on which local accounts have been shut
    while the management card is unconfigured is at times past recovering without a visit to
    the server room.

    Suppliers have to be checked apart. Service agreements at times rest on a local account
    given out over remote desktop, and the change will shut that road.

    Sessions active at the moment of the change are not broken. The next sign-in will fail, so
    the symptom appears late - usually when somebody needs the access most.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Nikt nie zaloguje się przez pulpit zdalny na konto istniejące wyłącznie na tej maszynie
      - Konto administratora lokalnego przestaje być drogą zapasową przy awarii uwierzytelniania domenowego
      - Dostawca korzystający z konta lokalnego przez pulpit zdalny straci dostęp
      - Sesje aktywne nie są zrywane, więc objaw pojawia się dopiero przy kolejnym logowaniu
      - W sytuacji awaryjnej zostaje wyłącznie konsola zarządzająca albo konsola hosta
    en:
      - Nobody will sign in by remote desktop to an account existing on this machine alone
      - The local administrator's account stops being the spare road at a failure of domain authentication
      - A supplier using a local account over remote desktop will lose access
      - Active sessions are not broken, so the symptom appears only at the next sign-in
      - In an emergency only the management console or the host's console is left
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Karta zarządzająca serwera jest nieskonfigurowana i nie ma innej drogi dostępu poza pulpitem zdalnym
      - Umowa serwisowa dostawcy opiera się na koncie lokalnym udostępnionym przez pulpit zdalny
      - Serwer pracuje poza domeną i konta lokalne są jedynymi, jakie na nim istnieją
    en:
      - The server's management card is unconfigured and there is no road of access but remote desktop
      - A supplier's service agreement rests on a local account given out over remote desktop
      - The server works outside a domain and local accounts are the only ones it has
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '(?=.*S-1-5-32-546)(?=.*S-1-5-113)'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyRemoteInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    foreach ($sid in @('*S-1-5-32-546', '*S-1-5-113')) {
      if (-not ($members -contains $sid)) { $members += $sid }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyRemoteInteractiveLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyRemoteInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-log-on-through-remote-desktop-services

notes:
  pl: |
    Wykaz obejmuje dwie pozycje: grupę Goście oraz zbiorczy
    identyfikator wszystkich kont lokalnych. Ten drugi nie jest grupą,
    do której da się kogoś dopisać — system przypisuje go każdemu
    logowaniu konta istniejącego wyłącznie na tej maszynie.

    Sprawdzenie wymaga obecności obu pozycji, ale nie wymaga, żeby były
    jedyne. Odmowa dla dodatkowych kont jest zapisem sensownym i punkt
    jej nie kwestionuje.

    Ocena uciążliwości jest tu wyższa niż w paczce stanowiska roboczego.
    Powodem jest to, że na serwerze konto lokalne bywa drogą zapasową
    przy awarii uwierzytelniania domenowego, a serwer stoi zdalnie.
    Warunkiem wdrożenia jest sprawna karta zarządzająca.
  en: |
    The list takes in two entries: the Guests group and the collective identifier of all local
    accounts. The second is no group anybody can be added to - the system sets it on every
    sign-in of an account existing on this machine alone.

    The check takes both entries' presence but does not take them to be the only ones. A denial
    for further accounts is a sensible record and the item does not question it.

    The judgement of disruption is higher here than in the working station's pack. The reason
    is that on a server a local account is at times the spare road at a failure of domain
    authentication, while the server stands remote. A working management card is a condition of
    the rollout.
