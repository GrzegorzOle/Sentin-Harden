id: win2016-installer-user-control-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Wpływ użytkownika na przebieg instalacji wyłączony
    en: A user's sway over the course of an installation switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera użytkownikowi bez uprawnień administratora wpływ na
    to, jakie wartości instalator przyjmie w trakcie pracy.

    Instalator pakietu ma własny zestaw właściwości sterujących przebiegiem
    instalacji: gdzie położyć pliki, które składniki zainstalować, jakie
    konto ma zostać użyte. Część z nich instalator pobiera od tego, kto go
    uruchomił.

    Ma to znaczenie dlatego, że instalacja pakietu przebiega w znacznej
    części z uprawnieniami podniesionymi — mechanizm instalacyjny robi
    w imieniu użytkownika rzeczy, których użytkownik sam nie może zrobić.
    Jeżeli ten sam użytkownik wskazuje przy tym ścieżkę docelową, wskazuje
    w praktyce miejsce, w którym proces o wysokich uprawnieniach zapisze
    plik.

    Droga stąd do podniesienia uprawnień jest krótka i dobrze opisana.
    Wystarczy wskazać katalog, z którego coś jest uruchamiane
    z uprawnieniami wyższymi, albo podmienić właściwość sterującą tak, by
    instalacja zapisała plik poza miejscem, które jej wyznaczono.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    kierowania zapisem wykonywanym z uprawnieniami wyższymi niż własne,
    przy użyciu narzędzia, które w systemie jest obecne zawsze.
  en: |
    The setting takes from a user without administrator rights the sway over what
    values an installer takes up in the course of its work.

    A package's installer has a set of properties of its own steering the course of
    the installation: where to put the files, which components to install, what
    account is to be used. Some of them the installer takes from whoever started it.

    That matters because the installing of a package runs in good part with raised
    rights - the installing mechanism does, on the user's behalf, things the user
    cannot do themselves. If that same user names the target path meanwhile, they
    name in practice the place where a process of high rights will write a file.

    The road from there to a raising of rights is short and well described. It is
    enough to name a directory from which something is started with higher rights,
    or to substitute a steering property so that the installation writes a file
    outside the place set for it.

    What an attacker gains while the item goes unmet: the means of steering a write
    carried out with rights higher than their own, using a tool that is always
    present in the system.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest wąska
    i konkretna.

    Na serwerze instalacji dokonuje zwykle administrator, a punkt jego nie
    dotyczy — ograniczenie działa wobec użytkowników bez uprawnień. Na
    maszynie, na której instaluje wyłącznie administrator, zmiana nie
    zmienia nic.

    Rzecz do sprawdzenia dotyczy instalacji uruchamianych przez narzędzia
    wdrożeniowe w kontekście użytkownika. Zdarza się, że pakiet przyjmuje
    ścieżkę albo inną właściwość od konta wywołującego, a konto to nie jest
    administratorem. Wtedy instalacja może zakończyć się niepowodzeniem albo
    położyć pliki gdzie indziej niż dotąd.

    Objaw jest przy tym mylący. Instalator zgłasza błąd właściwości, a nie
    braku uprawnień, więc szukanie przyczyny prowadzi ku pakietowi, nie ku
    zasadzie.

    Rzecz druga dotyczy starszych pakietów przygotowanych tak, żeby pytać
    użytkownika o katalog. Te przestaną pytać i użyją wartości domyślnej.

    Czego to nie psuje: instalacji wykonywanych przez administratora,
    odinstalowywania, napraw pakietów, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check is narrow and particular.

    On a server it is as a rule an administrator who installs, and the item does not
    touch them - the limit works against users without rights. On a machine where
    only an administrator installs, the change alters nothing.

    The thing to check concerns installations started by deployment tools in a
    user's context. It happens that a package takes a path or another property from
    the calling account, and that account is no administrator. The installation may
    then fail or put the files somewhere other than before.

    The symptom is misleading besides. The installer reports an error of a property
    rather than a want of rights, so the search for a cause leads towards the
    package and not towards a policy.

    The second thing concerns older packages made so as to ask the user for a
    directory. Those will stop asking and use the default value.

    What this does not break: installations carried out by an administrator, the
    uninstalling or repairing of packages, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja uruchamiana przez narzędzie wdrożeniowe w kontekście konta bez uprawnień administratora kończy się niepowodzeniem albo kładzie pliki gdzie indziej
      - Instalator zgłasza błąd właściwości, a nie braku uprawnień, więc szukanie przyczyny prowadzi ku pakietowi, nie ku zasadzie
      - Starsze pakiety pytające użytkownika o katalog docelowy przestają pytać i używają wartości domyślnej
      - Instalacje wykonywane przez administratora, odinstalowywanie i naprawa pakietów pozostają bez zmian
    en:
      - An installation started by a deployment tool in the context of an account without administrator rights fails or puts the files elsewhere
      - The installer reports an error of a property rather than a want of rights, so the search for a cause leads towards the package and not towards a policy
      - Older packages asking the user for a target directory stop asking and use the default value
      - Installations carried out by an administrator, and the uninstalling and repairing of packages, stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożenia na tej maszynie uruchamia się w kontekście konta bez uprawnień administratora, a pakiety przyjmują od niego ścieżkę docelową
    en:
      - Rollouts on this machine are started in the context of an account without administrator rights, and the packages take their target path from it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'EnableUserControl'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'EnableUserControl'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableUserControl' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/enableusercontrol

notes:
  pl: |
    Punkt otwiera trójkę reguł o mechanizmie instalacyjnym. Wszystkie trzy
    dotyczą tego samego narzędzia i tego samego problemu: mechanizm ten
    pracuje z uprawnieniami wyższymi niż ten, kto go wywołał, więc każde
    miejsce, w którym przyjmuje coś z zewnątrz, jest miejscem do
    sprawdzenia.

    Warto zwrócić uwagę, że reguła nie zabrania instalowania niczego.
    Zabrania wpływania na to, jak instalacja przebiega — a to jest
    rozróżnienie, które w interfejsie łatwo zgubić, bo tytuł czyta się
    podobnie do blokady instalacji.

    Wpis nosi nazwę opisującą włączenie wpływu, więc wartością wymaganą jest
    zero. Jest to jeden z kilku punktów w zestawie, w których wartość zero
    oznacza stan pożądany, i w raporcie warto to nazwać, zamiast liczyć na
    intuicję czytelnika.
  en: |
    The item opens a set of three rules about the installing mechanism. All three
    concern the same tool and the same trouble: that mechanism works with rights
    higher than those of whoever called it, so every place where it takes something
    from outside is a place to check.

    Worth noticing that the rule forbids nothing to be installed. It forbids sway
    over how an installation runs - and that is a distinction easily lost in the
    interface, the title reading much like a block on installing.

    The entry bears a name describing the granting of sway, so the required value is
    zero. It is one of several items in the set where the value zero means the
    wanted state, and in the report that is worth naming rather than left to the
    reader's intuition.
