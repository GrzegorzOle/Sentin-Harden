id: win2025-rdp-lpt-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów równoległych w sesji pulpitu zdalnego wyłączone
    en: Parallel port redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie portów równoległych maszyny łączącej
    się do sesji zdalnej.

    Jest to najsłabszy punkt w całej tej grupie i trzymam dla niego
    kategorię najniższą świadomie. Napastnik nie zyskuje tu praktycznie
    nic, a nazwanie tego inaczej byłoby nadmuchiwaniem listy.

    Port równoległy jest złączem, którego współczesne stanowiska nie
    mają. Przekierowanie, o którym mowa, dotyczy czegoś, co po drugiej
    stronie połączenia zwykle nie istnieje.

    Wartość punktu leży w porządku, a nie w odpieraniu zagrożenia.
    Podsystem przekierowania działa w sesji niezależnie od tego, czy
    ktokolwiek go używa. Zamknięcie ścieżki martwej jest czynnością
    tanią i dokładnie tyle warto o niej powiedzieć.

    Warto natomiast wiedzieć, czemu punkt w ogóle jest na liście.
    Serwery terminali żyją długo, a razem z nimi żyje oprogramowanie
    drukujące wprost do portu, z pominięciem podsystemu druku. Tam,
    gdzie taki układ przetrwał, ten punkt przestaje być martwy — ale
    jest to wtedy kwestia zgodności wstecznej, a nie bezpieczeństwa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    dającego się wskazać. Zostaje w sesji podsystem, którego nikt nie
    potrzebuje.
  en: |
    The setting cuts off the joining of the connecting machine's parallel ports to the remote
    session.

    It is the weakest item in this whole group and I keep the lowest category for it knowingly. The
    attacker wins here next to nothing, and to name it otherwise would be a blowing up of the list.

    A parallel port is a fitting which present-day stations do not have. The redirection spoken of
    bears on something which on the other side of the connection usually is not there.

    The item's worth lies in good order and not in the fending off of a danger. The subsystem of
    redirection runs in the session whether anybody uses it or not. The shutting of a dead path is
    a cheap act and exactly that much is worth saying of it.

    It is worth knowing, though, why the item is on the list at all. Terminal servers live long,
    and along with them lives software printing straight to a port, passing the printing subsystem
    by. Where such an arrangement has lasted, this item stops being dead - but it is then a matter
    of backward fitting and not of security.

    What an attacker gains while the item goes unmet: nothing that can be named. There is left in
    the session a subsystem nobody needs.

disruption_description:
  pl: |
    Sprawdzenia wymaga jeden przypadek i jest on rzadki, ale realny.

    Oprogramowanie dziedzinowe pracujące na serwerze terminali bywa
    napisane tak, że drukuje wprost do portu równoległego — do drukarki
    igłowej wypisującej dokument na papierze samokopiującym albo do
    drukarki etykiet. Układ taki spotyka się w magazynach, w produkcji
    i wszędzie tam, gdzie dokument musi powstać w trzech egzemplarzach
    za jednym przebiegiem.

    W takich miejscach drukarka jest wpięta u człowieka na stanowisku,
    a aplikacja widzi ją przez przekierowanie. Po zmianie wydruk po
    prostu nie wychodzi.

    Objaw jest tu wyjątkowo trudny do powiązania z przyczyną i warto to
    zapisać: aplikacja zwykle nie zgłasza żadnego błędu. Uznaje, że
    wysłała dokument do portu, i kończy pracę poprawnie. Nie wychodzi
    natomiast papier. Zgłoszenie brzmi wtedy „drukarka nie drukuje",
    a szukanie zaczyna się od drukarki i od kabla, nie od ustawienia na
    serwerze sprzed kilku dni.

    Poza tym jednym przypadkiem zmiana jest niewidoczna. Na serwerze bez
    oprogramowania drukującego wprost do portu nikt jej nie zauważy.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane zachowują przekierowanie do końca.
  en: |
    One case needs checking and it is rare but real.

    Trade software working on a terminal server is at times written so as to print straight to a
    parallel port - to a needle printer setting out a document on self-copying paper, or to a
    printer of labels. Such an arrangement is met with in stores, in making, and wherever a
    document must arise in three copies at one pass.

    In such places the printer is plugged in at a person's station and the application sees it
    through the redirection. After the change the printing simply does not come out.

    The symptom here is uncommonly hard to tie to its cause and that is worth writing down: the
    application usually reports no fault. It holds that it has sent the document to the port and
    finishes its work rightly. The paper, on the other hand, does not come out. The report then
    runs "the printer does not print", and the looking starts from the printer and the cable and
    not from a setting made on the server some days ago.

    Outside that one case the change is unseen. On a server without software printing straight to a
    port nobody will notice it.

    The change comes into force straight away and is undone at once. Sessions already opened keep
    the redirection to their end.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - printing
    - legacy-applications
  what_breaks:
    pl:
      - Oprogramowanie drukujące wprost do portu równoległego przestanie wypuszczać wydruk
      - Aplikacja nie zgłasza przy tym błędu, uznaje, że wysłała dokument, i kończy pracę poprawnie
      - Zgłoszenie brzmi, że drukarka nie drukuje, więc szukanie zaczyna się od kabla, a nie od serwera
      - Poza oprogramowaniem drukującym wprost do portu zmiana jest niewidoczna
      - Sesje już nawiązane zachowują przekierowanie do końca
    en:
      - Software printing straight to a parallel port will stop letting the printing out
      - The application reports no fault with it, holds that it has sent the document, and finishes rightly
      - The report runs that the printer does not print, so the looking starts from the cable and not from the server
      - Outside software printing straight to a port the change is unseen
      - Sessions already opened keep the redirection to their end
  do_not_apply_when:
    pl:
      - Oprogramowanie na serwerze terminali drukuje wprost do portu równoległego u człowieka na stanowisku
      - Dokument w trzech egzemplarzach powstaje na drukarce igłowej wpiętej do portu równoległego
    en:
      - Software on a terminal server prints straight to a parallel port at a person's station
      - A document in three copies arises on a needle printer plugged into a parallel port
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableLPT'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableLPT'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableLPT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Najsłabszy punkt w całej grupie i kategoria najniższa jest tu
    świadoma. Napastnik nie zyskuje praktycznie nic, a port równoległy
    jest złączem, którego współczesne stanowiska nie mają.

    Wartość leży w porządku, nie w odpieraniu zagrożenia: zamknięcie
    ścieżki martwej jest czynnością tanią.

    Przypadek, w którym punkt przestaje być martwy, to oprogramowanie
    dziedzinowe drukujące wprost do portu — i wtedy objaw jest wyjątkowo
    mylący, bo aplikacja nie zgłasza błędu, tylko papier nie wychodzi.
  en: |
    The weakest item in the whole group, and the lowest category is here a knowing one. The
    attacker wins next to nothing, and a parallel port is a fitting present-day stations do not
    have.

    The worth lies in good order and not in the fending off of a danger: the shutting of a dead
    path is a cheap act.

    The case where the item stops being dead is trade software printing straight to a port - and
    then the symptom is uncommonly misleading, the application reporting no fault and only the
    paper not coming out.
