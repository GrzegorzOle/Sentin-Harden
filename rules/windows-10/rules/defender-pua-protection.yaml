id: win10-defender-pua-protection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Blokowanie oprogramowania potencjalnie niepożądanego
    en: Blocking of potentially unwanted applications
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje programy, które nie są złośliwe w rozumieniu
    sygnatur, ale robią rzeczy, których nikt świadomie nie zamawia:
    dokładają paski narzędzi, zmieniają stronę startową, instalują inne
    programy w tle, wyświetlają reklamy i utrudniają własne usunięcie.

    Kategoria ta jest w praktyce przedsionkiem. Program, który instaluje
    inne programy bez pytania, jest mechanizmem dostarczania dowolnej
    zawartości — a to, co dostarczy jutro, nie zależy od tego, co dostarczył
    dziś. Zablokowanie go zamyka kanał, a nie pojedynczą próbkę.

    Trafia to przede wszystkim w oprogramowanie pobierane ze stron
    zbierających instalatory. Program właściwy jest tam prawdziwy,
    a dokładany do niego instalator — nie.

    Odnotowuję, dlaczego wartością zgodną jest blokowanie, a nie samo
    zgłaszanie. Ustawienie zgłaszające zostawia decyzję użytkownikowi
    dokładnie w tej chwili, w której punkt ma mu ją zdjąć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    dostarczania oprogramowania na maszynę, otwarty i obsługiwany przez
    samego użytkownika.
  en: |
    The setting blocks programs that are not malicious in the signatures' sense but do things nobody knowingly
    asks for: they add bars of tools, change the starting page, install other programs in the background, show
    advertisements and make their own removal hard.

    That kind is in practice a forecourt. A program that installs other programs without asking is a mechanism
    for the delivering of whatever contents - and what it delivers tomorrow does not hang upon what it delivered
    today. The blocking of it closes a channel, not a single sample.

    This strikes above all at software downloaded from pages that gather installers. The program proper is there
    a true one; the installer added to it is not.

    I set down why the compliant value is the blocking and not the mere reporting. The reporting setting leaves
    the decision with the user at just the hour the item means to take it from them.

    What an attacker gains while the item goes unmet: a channel for the delivering of software onto the machine,
    open and served by the user themselves.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczą odczuwalną jest zablokowany
    instalator.

    Kategoria ta jest z natury nieostra. Granica między programem
    niepożądanym a narzędziem o agresywnej instalacji bywa przesunięta
    i zdarza się, że blokowane jest oprogramowanie używane w pracy —
    zwłaszcza narzędzia do zdalnej pomocy, menedżery pobierania
    i starsze programy narzędziowe dołączające do instalatora dodatki.

    Skutek jest widoczny od razu: instalator zostaje zatrzymany,
    użytkownik dostaje komunikat ochrony i zgłasza się po pomoc.
    Odblokowanie wymaga decyzji i wskazania programu jako dozwolonego.

    Sprawdzić trzeba wobec tego jedno: czy na tej maszynie pracuje
    narzędzie, które pod tę kategorię podpada. Inwentaryzacja z etapu
    audytu daje na to odpowiedź trafniejszą niż ogólne ostrzeżenie.

    Czego to nie psuje: instalowania oprogramowania jako takiego,
    aktualizacji, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the thing that is felt is a blocked installer.

    That kind is by nature unsharp. The bound between an unwanted program and a tool with a pushy way of
    installing is at times shifted, and it happens that software used at work is blocked - above all tools for
    help from afar, handlers of downloads and older tool programs that add extras to their installer.

    The consequence shows at once: the installer is stopped, the user gets a message from the protection and
    comes for help. The unblocking calls for a decision and for the naming of the program as allowed.

    One thing therefore has to be reviewed: whether a tool falling under that kind works upon this machine. The
    taking of stock from the audit stage gives a truer answer to that than a general warning does.

    What this does not break: the installing of software as such, updates, logging on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Narzędzia do zdalnej pomocy i menedżery pobierania bywają zablokowane, bo podpadają pod tę kategorię
      - Starsze programy narzędziowe dołączające dodatki do instalatora zostają zatrzymane razem z nimi
      - Użytkownik widzi komunikat ochrony i zgłasza się po pomoc, bo instalator przerywa pracę
      - Odblokowanie wymaga decyzji i wskazania programu jako dozwolonego, nie samego ponowienia
      - Instalowanie oprogramowania jako takie, aktualizacje, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Tools for help from afar and handlers of downloads are at times blocked, falling under that kind
      - Older tool programs adding extras to their installer are stopped together with them
      - The user sees a message from the protection and comes for help, the installer breaking off
      - The unblocking calls for a decision and for the naming of the program as allowed, not for a mere retry
      - The installing of software as such, updates, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje narzędzie do zdalnej pomocy podpadające pod tę kategorię i jego zablokowanie odcina obsługę
    en:
      - A tool for help from afar falling under that kind works upon the machine and the blocking of it cuts the support off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        [string][int](Get-MpPreference -ErrorAction Stop).PUAProtection
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'PUAProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # One, not two: the higher setting only reports and does not block, so it leaves
    # the decision with the user at the very moment the item means to take it away.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PUAProtection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/detect-block-potentially-unwanted-apps-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest w tym bloku jedyną odczuwalną w codziennej pracy i jedyną,
    przy której użytkownik zobaczy komunikat. Warto, żeby aplikacja
    powiedziała to wprost, bo pozostałe cztery punkty są niewidoczne
    i użytkownik przeniesie to oczekiwanie także tutaj.

    Argument wart zachowania dotyczy tego, czym ta kategoria jest
    naprawdę. Nie chodzi o niewygodę ani o porządek na pulpicie. Program
    instalujący inne programy bez pytania jest kanałem dostarczania —
    i to, że dziś dostarcza reklamy, nie mówi nic o tym, co dostarczy
    jutro.

    Odnotowuję nieostrość kategorii, bo przesądza o klasie uciążliwości.
    Blokowane bywa oprogramowanie używane legalnie, a decyzja o wyjątku
    należy wtedy do człowieka. Aplikacja korzystająca z inwentaryzacji
    może wskazać kandydatów przed wykonaniem, zamiast zostawiać
    użytkownika z zaskoczeniem.
  en: |
    The rule is in this block the only one felt in daily work and the only one at which the user will see a
    message. It is well that the application say so outright, the other four items being unseen and the user
    carrying that expectation over here as well.

    The argument worth keeping touches what that kind truly is. It is not about discomfort nor about tidiness
    upon the desktop. A program installing other programs without asking is a channel of delivery - and that it
    delivers advertisements today says nothing of what it will deliver tomorrow.

    I set down the kind's unsharpness, it settling the class of disruption. Software used lawfully is at times
    blocked, and the decision about an exception belongs then to a person. An application drawing upon the taking
    of stock can name the candidates before the carrying out, rather than leaving the user with a surprise.
