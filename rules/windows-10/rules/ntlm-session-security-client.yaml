id: win10-ntlm-session-security-client

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Minimalne zabezpieczenie sesji po stronie klienta NTLM
    en: The least session guard on the NTLM client side
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, na co najmniej maszyna zgadza się, nawiązując sesję
    uwierzytelnianą starszym mechanizmem. Wymagana wartość żąda dwóch rzeczy
    naraz: nowszej odmiany tego mechanizmu oraz szyfrowania kluczem pełnej
    długości.

    Starszy mechanizm uwierzytelniania jest wciąż w użyciu wszędzie tam,
    gdzie mechanizm nowszy zawiedzie — przy połączeniu po adresie zamiast po
    nazwie, przy maszynie spoza domeny, przy urządzeniu. Nie da się go
    wyłączyć bez konsekwencji, można natomiast żądać, żeby był używany
    w odmianie najmocniejszej z dostępnych.

    Różnica między odmianami jest praktyczna. Odmiana starsza pozwala na
    odtworzenie hasła z przechwyconej wymiany nakładem, który dziś jest
    niewielki. Odmiana nowsza to utrudnia, a wymaganie klucza pełnej
    długości odbiera jeszcze jedną drogę skrótu.

    Wartość jest sumą znaczników, nie przełącznikiem — dlatego sprawdzenie
    czyta ją jako liczbę i porównuje dokładnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesje
    nawiązywane odmianą, z której przechwyconą wymianę da się rozłożyć
    i odtworzyć z niej hasło.
  en: |
    The setting says what the machine agrees to at the least when setting up a session authenticated by the
    older mechanism. The value called for asks two things at once: the newer kind of that mechanism and
    encryption by a key of full length.

    The older mechanism of authentication is still in use wherever the newer fails - at a connection by address
    rather than by name, at a machine outside a domain, at a device. It cannot be switched off without
    consequence; it can, though, be asked for in the strongest kind to be had.

    The difference between the kinds is a practical one. The older kind allows a password to be recovered from a
    caught exchange at a cost that is today a small one. The newer makes that harder, and the calling for a key
    of full length takes away one more short road.

    The value is a sum of flags and not a switch - for which the check reads it as a number and matches it
    exactly.

    What an attacker gains while the item goes unmet: sessions set up in a kind whose caught exchange can be
    taken apart and a password recovered from it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest sprzęt
    i oprogramowanie starsze.

    Serwery i stanowiska wspierane obsługują odmianę nowszą i klucz pełnej
    długości od lat. Zmiany nie zauważą.

    Kłopot dotyczy urządzeń: magazynów sieciowych sprzed lat, urządzeń
    wielofunkcyjnych, sterowników przemysłowych i oprogramowania branżowego
    z własną implementacją uwierzytelniania. Te bywają zatrzymane na
    odmianie starszej i po zmianie maszyna odmówi im sesji.

    Objaw jest widoczny dla użytkownika i mylący: przy próbie dostępu
    pojawia się pytanie o poświadczenia, które wraca mimo podania hasła
    poprawnego. Wygląda to na złe hasło, a przyczyną jest odmowa uzgodnienia
    zabezpieczenia sesji.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: połączeń uwierzytelnianych mechanizmem nowszym,
    logowania, kont domenowych, uprawnień do zasobów, aplikacji lokalnych.
  en: |
    The class is "needs review", and the object of the review is older gear and software.

    Supported servers and workplaces have served the newer kind and the full-length key for years. They will not
    notice the change.

    The trouble touches devices: network stores of years ago, multifunction devices, industrial controllers and
    trade software with an authentication of its own making. Those are at times stopped at the older kind, and
    after the change the machine will refuse them a session.

    The symptom is plain to the user and misleading: at an attempt to reach the resource a question about
    credentials comes up, and it comes back though the right password be given. It looks like a wrong password,
    while the cause is a refusal to agree upon the session's guard.

    The change takes hold at once and undoes itself at once.

    What this does not break: connections authenticated by the newer mechanism, logging on, domain accounts, the
    rights upon resources, or local applications.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Magazyny sieciowe i urządzenia wielofunkcyjne zatrzymane na odmianie starszej przestają przyjmować sesję z tej maszyny
      - Oprogramowanie branżowe z własną implementacją uwierzytelniania może stracić połączenie z zasobem sieciowym
      - Objaw wygląda na złe hasło, bo pytanie o poświadczenia wraca mimo podania hasła poprawnego
      - Połączenia uwierzytelniane mechanizmem nowszym działają dalej bez żadnej zmiany
      - Logowanie, konta domenowe, uprawnienia do zasobów i aplikacje lokalne pozostają bez zmian
    en:
      - Network stores and multifunction devices stopped at the older kind cease taking a session from this machine
      - Trade software with an authentication of its own making may lose its connection to a network resource
      - The symptom looks like a wrong password, the question about credentials coming back though the right one be given
      - Connections authenticated by the newer mechanism work on without any change
      - Logging on, domain accounts, the rights upon resources and local applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna łączy się z urządzeniem albo magazynem obsługującym wyłącznie odmianę starszą tego mechanizmu
      - Nie ustalono, jakie zasoby sieciowe ta maszyna uwierzytelnia starszym mechanizmem
    en:
      - The machine joins a device or a store serving only the older kind of that mechanism
      - It has not been established what network resources this machine authenticates by the older mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key is part of the authentication package and is always there, so its
      # absence is a fault rather than a state. The value is read as a number, the
      # setting being a sum of flags and not a plain switch.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'NTLMMinClientSec'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '537395200'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'NTLMMinClientSec'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A side unable to agree upon the newer kind will be refused. The symptom the
    # user sees is a question about credentials that keeps coming back, not a
    # message about a protocol.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NTLMMinClientSec' -Value 537395200 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-minimum-session-security-for-ntlm-ssp-based-including-secure-rpc-clients

notes:
  pl: |
    Reguła otwiera parę o zabezpieczeniu sesji starszego mechanizmu
    i dotyczy strony nawiązującej. Warto, żeby aplikacja pokazywała ją razem
    z regułą o stronie przyjmującej, bo wartość i uzasadnienie mają wspólne,
    a zakres skutków rozłączny.

    Odnotowuję postać wartości. Jest to suma znaczników, nie przełącznik,
    więc porównanie musi być dokładne, a wynik częściowy — na przykład
    odmiana nowsza bez klucza pełnej długości — jest niezgodnością, choć
    wygląda na połowiczne spełnienie. Aplikacja powinna pokazać wartość
    odczytaną, a nie samo słowo o niezgodności.

    Odnotowuję też objaw mylący, bo to on kosztuje najwięcej czasu. Pytanie
    o poświadczenia wracające mimo hasła poprawnego kieruje na konto,
    a przyczyna leży w uzgodnieniu sesji.
  en: |
    The rule opens the pair about the older mechanism's session guard and touches the side that sets up. It is
    well that the application show it together with the rule about the side that takes in, their value and their
    grounds being shared while the reach of their consequences is not.

    I set down the value's shape. It is a sum of flags and not a switch, so the matching has to be exact, and a
    partial outcome - the newer kind, say, without a full-length key - is a mismatch, though it looks like a
    half-meeting. The application ought to show the value read rather than the word "mismatch" alone.

    I set down, too, the misleading symptom, that costing the most time. A question about credentials coming
    back though the password be right turns attention to the account, while the cause lies in the agreeing upon
    the session.
