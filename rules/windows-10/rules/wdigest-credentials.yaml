id: win10-wdigest-credentials

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie hasła w pamięci przez starszy dostawca wyłączone
    en: The keeping of a password in memory by the older provider switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że jeden ze starszych dostawców uwierzytelniania
    przestaje trzymać w pamięci hasło zalogowanej osoby w postaci
    nieprzetworzonej.

    Dostawca ten powstał dla mechanizmu, który wymagał hasła jako takiego,
    a nie jego skrótu — musiał je więc mieć pod ręką przez cały czas trwania
    sesji. Mechanizm wyszedł z użycia; nawyk trzymania hasła zostawał
    w niektórych konfiguracjach dłużej.

    Skutek jest tak prosty, że aż niewygodny do opisania. Ktoś, kto zdobędzie
    na maszynie uprawnienia pozwalające czytać pamięć procesu
    uwierzytelniania, dostaje hasła wszystkich zalogowanych osób —
    w postaci gotowej, bez odtwarzania, bez czekania i bez pracy
    obliczeniowej.

    Reguła należy do tych, przy których jedna wartość w rejestrze oddziela
    maszynę, z której da się zebrać komplet haseł, od maszyny, z której się
    nie da.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    wszystkich osób zalogowanych na tej maszynie, gotowe do użycia
    gdziekolwiek indziej.
  en: |
    The setting makes one of the older authentication providers cease keeping in memory the password of the
    person logged on, in unworked form.

    That provider came about for a mechanism which called for a password as such and not for its hash - it had
    therefore to keep it at hand throughout the session. The mechanism has gone out of use; the habit of keeping
    the password lingered in some configurations longer.

    The consequence is so plain as to be awkward to set down. Whoever gains upon the machine the rights to read
    the authenticating process's memory gets the passwords of everybody logged on - in ready form, without a
    recovering, without a waiting and without reckoning work.

    The rule belongs among those at which one registry value parts a machine from which a full set of passwords
    can be gathered from a machine from which it cannot.

    What an attacker gains while the item goes unmet: the passwords of everybody logged on to this machine,
    ready for use anywhere else.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm, dla którego dostawca powstał, nie jest dziś używany przez nic,
    co działa na maszynie wspieranej. Wyłączenie przechowywania nie odbiera
    więc żadnej czynnej drodze uwierzytelniania.

    Sprawdzenie traktuje brak wpisu jako zgodność, bo wartością domyślną na
    tej platformie jest właśnie nieprzechowywanie. Wpis obecny i ustawiony
    przeciwnie oznacza zmianę wprowadzoną świadomie — zwykle dawno i po to,
    żeby coś zadziałało.

    Skutek mógłby dotknąć bardzo starej aplikacji korzystającej
    z uwierzytelniania opartego na tym dostawcy. Takie oprogramowanie na
    maszynie wspieranej jest rzadkością.

    Odnotowuję przerwę: zmiana wchodzi po restarcie maszyny, bo dostawca
    czyta ustawienie przy starcie. Do tego czasu hasła pozostają w pamięci.

    Czego to nie psuje: logowania, kont domenowych, udziałów plikowych,
    drukowania, aplikacji, sieci, usług systemowych.
  en: |
    The class is "no disruption".

    The mechanism for which the provider came about is used today by nothing that works upon a supported
    machine. Switching the keeping off takes therefore no live road of authentication away.

    The check holds an absent entry compliant, the default value upon this platform being precisely the not
    keeping. An entry present and set the other way means a change brought in knowingly - as a rule long ago,
    and so that something should work.

    A consequence could touch a very old application using an authentication grounded upon that provider. Such
    software upon a supported machine is a rarity.

    I set down the break: the change takes hold after a restart of the machine, the provider reading the setting
    at its start. Until then the passwords stay in memory.

    What this does not break: logging on, domain accounts, file shares, printing, applications, the network, or
    system services.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
  what_breaks:
    pl:
      - Bardzo stara aplikacja opierająca uwierzytelnianie na tym dostawcy przestaje uwierzytelniać użytkownika
      - Zmiana wchodzi po restarcie maszyny, bo dostawca czyta ustawienie przy starcie
      - Do czasu restartu hasła osób już zalogowanych pozostają w pamięci mimo wykonania reguły
      - Brak wpisu jest zgodnością, bo wartością domyślną na tej platformie jest nieprzechowywanie
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A very old application grounding its authentication upon that provider ceases authenticating the user
      - The change takes hold after a restart of the machine, the provider reading the setting at its start
      - Until the restart the passwords of those already logged on stay in memory though the rule be carried out
      - An absent entry is compliance, the default value upon this platform being the not keeping
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa aplikacja uwierzytelniająca użytkownika przez tego dostawcę i nie ma dla niej zamiennika
    en:
      - An application authenticating the user through that provider works upon the machine and has no substitute
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      $name = 'UseLogonCredential'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|MISSING)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    $name = 'UseLogonCredential'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The provider reads this at its start, so the passwords of those already
    # logged on stay in memory until the machine is restarted.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseLogonCredential' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/kerberos/credentials-protection-and-management

notes:
  pl: |
    Reguła jest w tej paczce jedną z nielicznych o kategorii krytycznej przy
    klasie bez uciążliwości i należy do najszybszych wygranych. Aplikacja
    powinna stawiać ją wysoko w liście domyślnej, bo koszt jest żaden,
    a różnica realna.

    Argument wart zachowania jest jeden i powinien wystarczyć: napastnik
    nie odtwarza tu hasła, tylko je odczytuje. Wszystkie pozostałe reguły
    tego bloku utrudniają pracę; ta usuwa pracę z rachunku w całości.

    Odnotowuję, że sprawdzenie uznaje brak wpisu za zgodność. Jest to
    odwrotność sytuacji z reguł o kanale do kontrolera, gdzie cisza
    w rejestrze znaczyła stan zły. Aplikacja pokazująca oba te przypadki
    obok siebie powinna mówić, co znaczy brak wartości, zamiast zostawiać
    to domysłowi.
  en: |
    The rule is one of the few in this pack of a critical category beside the class "no disruption", and belongs
    among the quickest wins. The application ought to set it high in the default list, the cost being none and
    the difference real.

    One argument is worth keeping and ought to suffice: an attacker here does not recover the password, they
    read it. Every other rule in this block makes work harder; this takes the work out of the reckoning
    altogether.

    I set down that the check holds an absent entry compliant. It is the reverse of the case at the rules about
    the channel to the controller, where silence in the registry meant a bad state. An application showing both
    cases side by side ought to say what an absent value means rather than leave it to a guess.
