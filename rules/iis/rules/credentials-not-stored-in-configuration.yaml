id: iis-credentials-not-stored-in-configuration

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Configure Authentication and Authorization
  title:
    pl: Konta użytkowników nie leżą w pliku konfiguracyjnym
    en: User accounts do not lie in a configuration file

  level: 1
  profile: application

platform:
  system: iis

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Uwierzytelnianie formularzem pozwala wpisać listę użytkowników wprost do
    pliku konfiguracyjnego aplikacji: nazwa i hasło, jedna linia na osobę.
    Mechanizm powstał po to, żeby dało się postawić prosty serwis bez bazy
    danych i bez katalogu użytkowników.

    Co to odbiera atakującemu: hasła leżące w pliku tekstowym wewnątrz katalogu
    serwisu. Ten plik jest kopiowany razem z zawartością serwisu przy każdym
    wdrożeniu, trafia do kopii zapasowych, do systemu kontroli wersji i na
    stanowiska osób, które wgrywają zmiany. Każde z tych miejsc jest chronione
    słabiej niż baza danych, a niektóre nie są chronione wcale. Dowolna
    podatność pozwalająca odczytać plik z katalogu aplikacji oddaje wtedy od
    razu wszystkie konta, a nie jedno.

    Po zmianie uwierzytelnianie opiera się o źródło, które da się zabezpieczyć
    osobno i w którym da się komuś odebrać dostęp bez wdrażania aplikacji od
    nowa.
  en: |
    Forms authentication allows a list of users to be written straight into an
    application's configuration file - a name and a password, one line per person.
    The mechanism came about so that a simple site could be stood up without a
    database and without a user directory.

    What it takes away from an attacker - passwords lying in a text file inside the
    site directory. That file is copied along with the site contents at every
    deployment, reaches the backups, the version control system and the machines of
    the people who upload changes. Each of those places is protected less well than
    a database, and some are not protected at all. Any vulnerability allowing a
    file in the application directory to be read then hands over every account at
    once rather than one.

    After the change authentication rests on a source that can be secured
    separately and in which somebody's access can be withdrawn without deploying
    the application anew.

disruption_description:
  pl: |
    To nie jest zmiana ustawienia, tylko zmiana sposobu logowania do aplikacji,
    więc wymaga świadomego wdrożenia i pracy po stronie kodu. Usunięcie wpisów
    bez przygotowania innego źródła oznacza, że nikt się nie zaloguje.

    Kolejność jest jedyna sensowna: najpierw postawić źródło użytkowników —
    bazę, katalog domenowy albo zewnętrznego dostawcę tożsamości — potem
    przenieść konta i ustalić hasła, potem przestawić aplikację, sprawdzić
    logowanie na koncie testowym, i dopiero na końcu usunąć wpisy z pliku.

    Trzeba się liczyć z tym, że haseł nie da się przenieść. Wpisy w pliku
    konfiguracyjnym są albo jawne, albo zapisane skrótem, którego nie da się
    odwrócić, a i tak inne źródło użyje innego sposobu zapisu. Każdemu
    użytkownikowi trzeba więc ustalić hasło od nowa i to do niego zgłosić —
    czyli zmiana jest widoczna dla wszystkich, którzy z aplikacji korzystają.

    Dlatego reguła niczego nie zmienia sama. Aplikacja nie wie, jakie źródło
    użytkowników jest w tej organizacji właściwe, ani czy w ogóle istnieje.
  en: |
    This is not a change of setting but a change of how people sign in to the
    application, so it calls for a planned rollout and work on the code side.
    Removing the entries without preparing another source means nobody signs in.

    There is only one sensible order - first stand up a source of users, a
    database, a domain directory or an outside identity provider, then move the
    accounts across and settle their passwords, then switch the application over,
    check signing in with a test account, and only at the end remove the entries
    from the file.

    It has to be reckoned with that the passwords cannot be carried over. The
    entries in the configuration file are either in the clear or recorded as a
    digest that cannot be reversed, and another source would use a different way of
    recording them anyway. A password therefore has to be settled anew for every
    user and communicated to them - which is to say the change is visible to
    everybody who uses the application.

    This is why the rule changes nothing by itself. The application does not know
    which source of users is the right one in this organisation, or whether one
    exists at all.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - web-server-services
    - legacy-applications
  what_breaks:
    pl:
      - Usunięcie wpisów bez przygotowania innego źródła użytkowników odcina logowanie wszystkim naraz
      - Haseł nie da się przenieść, więc każdy użytkownik dostaje nowe i musi zostać o tym powiadomiony
      - Aplikacja wymaga zmiany w kodzie albo w konfiguracji, żeby sięgnąć do nowego źródła
      - Konta techniczne używane przez integracje przestają działać razem z kontami ludzi
      - Kopie zapasowe i historia w systemie kontroli wersji nadal zawierają stare hasła, więc trzeba je uznać za ujawnione
    en:
      - Removing the entries without preparing another source of users cuts off sign-in for everybody at once
      - Passwords cannot be carried over, so every user gets a new one and has to be told
      - The application calls for a change in code or configuration to reach the new source
      - Technical accounts used by integrations stop working along with people's accounts
      - Backups and version control history still hold the old passwords, so those must be treated as disclosed
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Aplikacje bez dostępu do żadnego innego źródła użytkowników, dopóki takie nie powstanie
      - Środowiska laboratoryjne i pokazowe, w których konta są celowo jednorazowe i nie chronią niczego
    en:
      - Applications with no access to any other source of users, until one exists
      - Laboratory and demonstration environments where the accounts are deliberately throwaway and protect nothing
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $found = @()
          # The root configuration is judged, and each site after it. An entry
          # in one application's own file is invisible from the root, and that
          # is exactly where such lists usually sit.
          $scopes = @([pscustomobject]@{ label = 'framework-root'; path = 'MACHINE/WEBROOT' })
          foreach ($site in @(Get-ChildItem -Path 'IIS:\Sites' -ErrorAction SilentlyContinue)) {
            $scopes += [pscustomobject]@{ label = $site.Name; path = ('MACHINE/WEBROOT/APPHOST/' + $site.Name) }
          }
          foreach ($scope in $scopes) {
            $users = Get-WebConfiguration -PSPath $scope.path `
              -Filter 'system.web/authentication/forms/credentials/user' -ErrorAction SilentlyContinue
            $count = @($users).Count
            if ($count -gt 0) {
              # The names are deliberately not reported. Saying how many there
              # are is enough to act on, and an audit report is not a place to
              # widen the list of who holds an account here.
              $found += ($scope.label + ':' + $count)
            }
          }
          if ($found.Count -eq 0) { 'AS_REQUIRED' }
          else { 'STORED ' + ($found -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  change_command: |
    # Prepared for copying, not for running. Removing these entries is the last
    # step of the move, not the first - run it once another source of users is
    # in place and signing in through it has been checked.
    Import-Module WebAdministration -ErrorAction Stop

    $site = 'Default Web Site'

    # What is about to disappear is listed first. These accounts exist nowhere
    # else, so a list taken now is the only record of whom they have to be
    # created for.
    Get-WebConfiguration -PSPath ('MACHINE/WEBROOT/APPHOST/' + $site) `
      -Filter 'system.web/authentication/forms/credentials/user' |
      Select-Object name

    Clear-WebConfiguration -PSPath ('MACHINE/WEBROOT/APPHOST/' + $site) `
      -Filter 'system.web/authentication/forms/credentials'

    # The passwords stay in the backups and in the version control history.
    # Treat them as disclosed and do not reuse them in the new source.

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.formsauthenticationcredentials
  - https://learn.microsoft.com/aspnet/core/security/authentication/

notes:
  pl: |
    Reguła jest wyłącznie do skopiowania. Usunięcie wpisów jest ostatnim
    krokiem przeprowadzki, nie pierwszym — wykonane wcześniej odcina logowanie
    wszystkim, a aplikacja nie wie, czy inne źródło użytkowników w ogóle
    istnieje.

    Sprawdzenie ocenia konfigurację główną oraz każdy serwis osobno, bo taka
    lista zwykle leży w pliku pojedynczej aplikacji, a stamtąd nie widać jej
    z poziomu głównego. Zgłaszana jest liczba kont, nigdy nazwy — raport
    z audytu nie jest miejscem na poszerzanie listy osób, które mają tu dostęp.

    Punkt zachodzi na regułę o sposobie zapisu haseł w tym samym miejscu, ale
    nie zastępuje jej. Tamta pyta, czy hasła leżą jawnie; ta pyta, czy w ogóle
    powinny tam leżeć. Hasło zapisane skrótem wciąż jest hasłem wyniesionym
    razem z kopią katalogu.
  en: |
    The rule is for copying only. Removing the entries is the last step of the
    move, not the first - done earlier it cuts off sign-in for everybody, and the
    application does not know whether another source of users exists at all.

    The check judges the root configuration and each site separately, because such
    a list usually lies in a single application's file, and from there it is
    invisible at the root level. The number of accounts is reported, never the
    names - an audit report is not a place to widen the list of who has access
    here.

    The item overlaps the rule about how passwords are recorded in that same place,
    but does not replace it. That one asks whether the passwords lie in the clear;
    this one asks whether they should lie there at all. A password recorded as a
    digest is still a password carried off along with a copy of the directory.
