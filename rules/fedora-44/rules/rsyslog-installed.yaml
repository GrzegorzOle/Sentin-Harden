id: fedora44-rsyslog-installed

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 6.2.3.1
  section: Logging and Auditing > System Logging > Configure rsyslog
  title:
    pl: rsyslog jest zainstalowany
    en: Ensure rsyslog is installed
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    rsyslog zapisuje komunikaty systemu w zwykłych plikach tekstowych
    w /var/log i umie wysyłać je na serwer dzienników. Gdy wybranym systemem
    dzienników jest rsyslog, pakiet musi być zainstalowany.

    Punkt wymaga pakietu rsyslog na komputerach, które go używają.
  en: |
    rsyslog writes system messages to plain text files in /var/log and can
    send them to a log server. When rsyslog is the chosen logging system,
    the package has to be installed.

    The item requires the rsyslog package on computers that use it.

disruption_description:
  pl: |
    Nikt tego nie zauważy: reguła tylko sprawdza, czy pakiet jest
    zainstalowany.
  en: |
    Nobody will notice: the rule only checks whether the package is
    installed.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v rpm >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    if rpm -q --quiet rsyslog; then echo "INSTALLED:$(rpm -q rsyslog | head -n 1)"; else echo NOT_APPLICABLE; fi
  expected: '^INSTALLED:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://www.rsyslog.com/doc/

notes:
  pl: |
    Brak pakietu oznacza, że dzienniki prowadzi sam journald, więc wynik to
    NOT_APPLICABLE i obowiązują punkty 6.2.2. Kto chce przejść na rsyslog,
    instaluje go ręcznie (dnf install rsyslog) i włącza usługę; wybór
    systemu dzienników należy do administratora, więc reguła niczego nie
    instaluje.
  en: |
    A missing package means that journald alone keeps the logs, so the
    result is NOT_APPLICABLE and items 6.2.2 apply. Whoever wants to switch
    to rsyslog installs it by hand (dnf install rsyslog) and enables the
    service; the choice of the logging system belongs to the administrator,
    so the rule installs nothing.
