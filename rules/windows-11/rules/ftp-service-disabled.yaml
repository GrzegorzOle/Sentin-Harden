id: win11-ftp-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera przesyłania plików starszym protokołem wyłączona
    en: The server service for transferring files by the older protocol disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje z sieci połączenia do przesyłania plików starszym
    protokołem: uwierzytelnia je i udostępnia katalog na tej maszynie do
    pobierania oraz — zależnie od konfiguracji — do wysyłania.

    Protokół ten w postaci podstawowej przesyła nazwę konta i hasło otwartym
    tekstem. Nie jest to wada konfiguracji ani zaniedbanie administratora,
    tylko sposób, w jaki protokół został zaprojektowany. Każdy, kto widzi
    ruch między klientem a serwerem, widzi też poświadczenia — a poświadczenia
    używane do przesyłania plików bywają tymi samymi, którymi loguje się do
    systemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, ma dwie postaci.
    Pierwsza to poświadczenia zbierane biernie, bez żadnego działania poza
    obserwowaniem sieci. Druga to katalog przyjmujący pliki: serwer
    z włączonym wysyłaniem pozwala złożyć na maszynie dowolny plik,
    a w połączeniu z serwerem sieciowym na tej samej maszynie prowadzi to
    wprost do uruchomienia kodu.

    Osobno liczy się dostęp bez konta. Konfiguracja pozwalająca łączyć się bez
    poświadczeń jest w tym protokole zastosowaniem typowym, nie wyjątkiem,
    i bywa włączona domyślnie przy pierwszym ustawieniu serwera.
  en: |
    The service takes connections from the network for transferring files by the older
    protocol: it authenticates them and offers a folder on this machine for downloading
    and - depending on the configuration - for uploading.

    In its basic form that protocol sends the account name and password in plain text.
    That is neither a flaw in the configuration nor an administrator's neglect, but the
    way the protocol was designed. Anybody who sees the traffic between client and server
    sees the credentials too - and credentials used for transferring files are sometimes
    the same ones used to sign in to the system.

    What an attacker gains while the item goes unmet takes two forms. The first is
    credentials gathered passively, with no action beyond watching the network. The
    second is a folder taking files: a server with uploading switched on allows any file
    at all to be placed on the machine, and together with a web server on the same
    machine that leads straight to code being run.

    Access without an account counts separately. A configuration allowing connection with
    no credentials is a typical use of this protocol rather than an exception, and is
    sometimes on by default when a server is first set up.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktokolwiek pobiera z tej maszyny albo wysyła na
    nią pliki tym protokołem.

    Na stacji roboczej składnik ten zwykle nie jest zainstalowany i audyt
    zwróci wynik „nie dotyczy". Jest to przypadek zdecydowanie najczęstszy.

    Tam, gdzie serwer działa, skutek dotyczy zwykle wymiany plików
    z urządzeniami, które innego sposobu nie znają. Są to przede wszystkim
    urządzenia starszego rodzaju: skanery i urządzenia wielofunkcyjne
    odkładające zeskanowane dokumenty, sterowniki maszyn zapisujące wyniki
    pomiarów, systemy sprzed lat wysyłające pliki wymiany.

    Ten przypadek zasługuje na uczciwe postawienie sprawy. Wyłączenie usługi
    przerwie taką wymianę, a zamiennika po stronie urządzenia zwykle nie ma —
    stary skaner nie nauczy się nowego protokołu. Właściwym rozwiązaniem jest
    przeniesienie wymiany na wydzielony serwer w osobnym segmencie sieci,
    a nie utrzymywanie jej na stanowisku. Jest to projekt, a nie kliknięcie,
    i do czasu jego wykonania świadome odpuszczenie punktu z zapisanym
    uzasadnieniem jest wynikiem prawidłowym.

    Zmiana wymaga zatrzymania usługi; przesyłania w toku zostaną przerwane.
  en: |
    What needs checking is whether anybody downloads files from this machine or sends
    them to it by this protocol.

    At a workstation this component is usually not installed and the audit will return
    "not applicable". That is by far the commonest case.

    Where a server is running, the effect usually concerns exchanging files with devices
    that know no other way. These are above all devices of an older kind: scanners and
    multifunction devices depositing scanned documents, machine controllers writing
    measurement results, systems from years back sending exchange files.

    That case deserves to be put honestly. Disabling the service will break off such an
    exchange, and there is usually no replacement on the device's side - an old scanner
    will not learn a new protocol. The right solution is to move the exchange to a
    dedicated server in a separate network segment rather than keep it at a station. That
    is a project rather than a click, and until it is carried out, deliberately accepting
    the item with a written reason is a proper outcome.

    The change takes stopping the service; transfers under way will be broken off.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Pobieranie plików z tej maszyny tym protokołem przestaje być możliwe
      - Urządzenie wielofunkcyjne odkładające zeskanowane dokumenty na tę maszynę zgłasza błąd
      - Sterownik maszyny zapisujący wyniki pomiarów tą drogą przestaje je zapisywać
      - Przesyłania w toku w chwili zmiany zostają przerwane
    en:
      - Downloading files from this machine by this protocol stops being possible
      - A multifunction device depositing scanned documents on this machine reports an error
      - A machine controller writing measurement results by this route stops writing them
      - Transfers under way at the moment of the change are broken off
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenia starszego rodzaju odkładają pliki na tę maszynę wyłącznie tym protokołem
      - Wymiana plików z systemem sprzed lat nie ma zamiennika po stronie drugiej strony
    en:
      - Devices of an older kind deposit files on this machine by this protocol alone
      - Exchanging files with a system from years back has no replacement on the other side
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\FTPSVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'FTPSVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'FTPSVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'FTPSVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/whats-new-in-iis-8/iis-80-ftp-logon-attempt-restrictions

notes:
  pl: |
    Punkt dotyczy serwera, czyli strony przyjmującej połączenia. Klient tego
    protokołu na tej maszynie działa dalej i dalej łączy się z serwerami
    innych maszyn — to osobna sprawa i osobna decyzja.

    Wyłączenie usługi nie usuwa definicji witryn przesyłania plików ani
    uprawnień do katalogów, które im przypisano. Po ponownym włączeniu usługi
    wszystko wraca w tym samym kształcie, razem z ewentualnym dostępem bez
    konta. Trwałym rozwiązaniem jest odinstalowanie składnika.

    Reguła wchodzi w skład grupy opisującej serwer sieciowy: obsługa witryn,
    usługa administracyjna, zdalne zarządzanie konfiguracją i ta. Wszystkie
    instalują się razem z rolą serwera sieciowego i warto czytać ich wyniki
    razem.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item concerns the server, that is the side taking connections. This protocol's
    client on this machine carries on working and carries on connecting to servers on
    other machines - that is a separate matter and a separate decision.

    Disabling the service removes neither the definitions of file transfer sites nor the
    folder permissions assigned to them. Once the service is switched on again everything
    comes back in the same shape, along with any access without an account. The lasting
    solution is to uninstall the component.

    The rule is part of the group describing the web server: serving sites, the
    administrative service, remote management of the configuration and this one. All of
    them install together with the web server role and their results are worth reading
    together.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
