id: win2025-elevation-command-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components
  title:
    pl: Polecenie podnoszenia uprawnień w konsoli wyłączone
    en: Privilege elevation command in the console disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza polecenie, które pozwala uruchomić z okna konsoli inne
    polecenie z podniesionymi uprawnieniami, bez otwierania osobnej sesji.

    Kategoria wysoka i chcę uzasadnić, dlaczego tak wysoko przy narzędziu,
    które samo z siebie niczego nie otwiera osobie bez uprawnień.

    Rzecz nie w tym, że polecenie daje uprawnienia komuś, kto ich nie ma —
    nie daje. Rzecz w tym, w jaki sposób je przenosi. Wariant domyślny
    uruchamia proces podniesiony tak, że pozostaje on powiązany z sesją
    nieuprzywilejowaną, z której wyszedł. Proces działający w tej samej
    sesji co przeglądarka, klient poczty albo cokolwiek innego, co ktoś
    właśnie otworzył, jest procesem, do którego to coś może sięgnąć.
    Granica, która normalnie oddziela pracę zwykłą od administracyjnej,
    przestaje w tym układzie istnieć.

    Na serwerze rzecz waży więcej niż na stacji roboczej, i to z powodu,
    który wygląda niepozornie: na serwerze pracuje się w konsoli.
    Polecenie, którego na stacji ktoś używa raz w tygodniu, na serwerze
    bywa w każdym drugim wierszu procedury. Jeżeli trafi do skryptów
    obsługi, granica znika nie w jednej sesji, tylko w całej rutynie pracy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    procesu o pełnych uprawnieniach z poziomu sesji, do której dostał się
    zwyczajnie, bez podnoszenia czegokolwiek samemu.
  en: |
    The item switches off the command that allows another command to be run
    from a console window with elevated privileges, without opening a
    separate session.

    The category is high, and I want to justify why so high for a tool
    that by itself opens nothing to somebody without privileges.

    The matter is not that the command grants privileges to somebody who
    does not have them - it does not. The matter is how it carries them.
    The default variant starts the elevated process in such a way that it
    remains bound to the unprivileged session it came from. A process
    running in the same session as a browser, a mail client or anything
    else somebody has just opened is a process that those things can reach
    into. The boundary that normally separates ordinary work from
    administrative work ceases to exist in that arrangement.

    On a server this weighs more than on a workstation, for a reason that
    looks unremarkable: on a server people work in a console. A command
    somebody uses once a week on a workstation is, on a server, in every
    other line of a procedure. If it finds its way into the operating
    scripts, the boundary disappears not in one session but across the
    whole routine of the work.

    What an attacker gains while the item goes unmet: access to a
    fully privileged process from a session they reached in the ordinary
    way, without elevating anything themselves.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i podaję, czego sprawdzić, bo to
    jedyna reguła w tej paczce, która potrafi zatrzymać skrypt napisany
    niedawno.

    Polecenie jest nowe, wygodne i przypomina odpowiednik znany z systemów
    uniksowych, więc trafia do procedur naturalnie — zwłaszcza tam, gdzie
    tę samą robotę wykonuje się na serwerach obu rodzin. Po tej zmianie
    każde jego wywołanie kończy się odmową. Objawem jest skrypt, który
    działał w zeszłym tygodniu i nie działa dzisiaj, przy niezmienionym
    kodzie.

    Sprawdzić trzeba dwie rzeczy: czy polecenie występuje w skryptach
    obsługi tej maszyny i czy używa go którekolwiek z narzędzi dostawcy.
    Zamiennik istnieje i jest starszy niż samo polecenie — uruchomienie
    procesu w osobnej, podniesionej sesji. Jest odrobinę mniej wygodny
    i właśnie ta niewygoda jest tutaj zabezpieczeniem, a nie wadą.

    Warto wiedzieć, że wyłączenie to nie jedyny dopuszczalny stan
    w świecie rzeczywistym: polecenie ma wariant uruchamiający proces
    w osobnej sesji, który nie ma opisanej wyżej wady. Punkt każe jednak
    wyłączyć całość i tego się trzymam — wariant bezpieczny wymagałby
    pilnowania, że nikt nie przestawi go z powrotem, a to jest słabsza
    gwarancja niż brak narzędzia.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and say what to check, because this is
    the one rule in this pack that can stop a script written recently.

    The command is new, convenient and resembles the counterpart known from
    unix-like systems, so it finds its way into procedures naturally -
    especially where the same work is done on servers of both families.
    After this change every invocation of it ends in a refusal. The symptom
    is a script that worked last week and does not work today, with the
    code unchanged.

    Two things have to be checked: whether the command appears in this
    machine's operating scripts, and whether any of the vendor's tools uses
    it. A replacement exists and is older than the command itself - running
    the process in a separate, elevated session. It is slightly less
    convenient, and that inconvenience is the protection here rather than a
    defect.

    It is worth knowing that switching it off is not the only defensible
    state in the real world: the command has a variant that starts the
    process in a separate session and does not carry the flaw described
    above. The item calls for the whole thing to be off, though, and I
    stand by that - the safe variant would require making sure nobody sets
    it back, and that is a weaker guarantee than the tool not being there.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Każde wywołanie tego polecenia kończy się odmową, także w skryptach obsługi maszyny
      - Objawem jest skrypt, który działał w zeszłym tygodniu i nie działa dzisiaj, przy niezmienionym kodzie
      - Polecenie trafia do procedur naturalnie tam, gdzie tę samą robotę wykonuje się na serwerach obu rodzin
      - Zamiennik istnieje — uruchomienie procesu w osobnej, podniesionej sesji — i jest odrobinę mniej wygodny
    en:
      - Every invocation of this command ends in a refusal, including inside the machine's operating scripts
      - The symptom is a script that worked last week and does not work today, with the code unchanged
      - The command finds its way into procedures naturally where the same work is done on servers of both families
      - A replacement exists - running the process in a separate, elevated session - and is slightly less convenient
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Skrypty obsługi tej maszyny albo narzędzia dostawcy wywołują to polecenie i nie przygotowano dla nich zamiennika
    en:
      - This machine's operating scripts or the vendor's tools call this command and no replacement has been prepared for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sudo'
      $name = 'Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sudo'
    $name = 'Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Search the machine's operating scripts and the vendor's tools for this
    # command first. After this every invocation is refused, and the symptom is
    # a script that worked last week and does not work today.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sudo'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Enabled' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/sudo/

notes:
  pl: |
    Rzecz nie w tym, że polecenie daje uprawnienia komuś, kto ich nie ma —
    nie daje. Rzecz w tym, jak je przenosi: wariant domyślny zostawia
    proces podniesiony powiązany z sesją nieuprzywilejowaną, w której
    działa przeglądarka i wszystko inne, co ktoś właśnie otworzył.

    Wymiar serwerowy wygląda niepozornie, a waży: na serwerze pracuje się
    w konsoli, więc polecenie używane na stacji raz w tygodniu bywa tu
    w każdym drugim wierszu procedury.

    Istnieje wariant bezpieczny, uruchamiający proces w osobnej sesji.
    Punkt każe wyłączyć całość i tego się trzymam — pilnowanie, że nikt nie
    przestawi wariantu z powrotem, jest słabszą gwarancją niż brak
    narzędzia.
  en: |
    The matter is not that the command grants privileges to somebody who
    lacks them - it does not. The matter is how it carries them: the
    default variant leaves the elevated process bound to the unprivileged
    session where the browser and everything else somebody has just opened
    is running.

    The server dimension looks unremarkable and weighs a good deal: on a
    server people work in a console, so a command used once a week on a
    workstation is here in every other line of a procedure.

    A safe variant exists, starting the process in a separate session. The
    item calls for the whole thing to be off and I stand by that - making
    sure nobody sets the variant back is a weaker guarantee than the tool
    not being there.
