id: win2016-bitlocker-fixed-drives-legacy-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Odczyt chronionego dysku stałego w starszych wersjach systemu wyłączony
    en: Reading a protected fixed data drive on earlier system versions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza dokładanie do zaszyfrowanego dysku stałego obszaru
    pozwalającego odczytać go w starszych wersjach systemu.

    Mechanizm ten dokłada do woluminu niewielką część zapisaną starszym
    formatem zapisu, a na niej program odczytujący. Dysk podłączony do
    maszyny, która nie zna bieżącego szyfrowania, pokazuje wtedy ten
    program, a ten po podaniu hasła udostępnia zawartość.

    Zamysł był zgodny z tym, do czego dyski przenoszone służą: mają dać się
    odczytać wszędzie. Cena jest jednak wysoka i dwojaka.

    Pierwsza część ceny dotyczy formatu. Wspomniany obszar zapisany jest
    formatem, który nie potrafi tego, co potrafi format bieżący — nie ma
    dziennika, nie ma uprawnień, nie ma niczego poza plikami. Obszar taki
    jest na zaszyfrowanym dysku częścią niechronioną.

    Druga dotyczy hasła. Odczyt tą drogą opiera się na haśle, a więc na
    najsłabszym z możliwych sposobów odblokowania — i omija wszystko, co
    o odblokowywaniu ustalono w pozostałych regułach.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    zawartości dysku omijającą wymagania odblokowania ustalone dla tej
    maszyny, opartą wyłącznie na haśle.
  en: |
    The setting switches off the adding to an encrypted fixed data drive of an area letting it be
    read on earlier system versions.

    That mechanism adds to the volume a small part written in an older recording format, and on
    it a reading program. A drive plugged into a machine that does not know the current
    encryption then shows that program, and it gives the contents up once a password is given.

    The intent was in keeping with what carried drives are for: they should be readable
    everywhere. The price, though, is high and twofold.

    The first part of the price concerns the format. The area spoken of is written in a format
    that cannot do what the current one can - it has no journal, no rights, nothing but files.
    Such an area is on an encrypted drive an unguarded part.

    The second concerns the password. Reading by that road rests on a password, which is to say on
    the weakest of the possible ways of unlocking - and goes round everything settled about
    unlocking in the other rules.

    What an attacker gains while the item goes unmet: a road to the drive's contents going round
    the requirements of unlocking settled for this machine, resting on a password alone.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, dokąd te dyski
    jeżdżą.

    Na serwerze dysk stały z definicji nie jeździ nigdzie i uciążliwość jest
    wtedy żadna. Nazwa „dysk stały" obejmuje jednak także woluminy na
    nośnikach wymiennych podłączonych na stałe oraz dyski w kieszeniach,
    a te bywają przenoszone.

    Rzecz do sprawdzenia brzmi więc: czy któryś z tych woluminów bywa
    podłączany do maszyny ze starszym systemem. Jeżeli tak, po zmianie
    przestanie być tam czytelny — i nie będzie to objaw subtelny, tylko dysk
    zgłaszany jako niesformatowany.

    Zmiana dotyczy woluminów szyfrowanych po jej wprowadzeniu. Dysk, który
    dostał ten obszar wcześniej, nosi go dalej i nadal daje się odczytać
    starszą drogą. Usunięcie tego obszaru wymaga odszyfrowania woluminu
    i zaszyfrowania go na nowo.

    Czego to nie psuje: odczytu dysków na maszynach z systemem bieżącym,
    pracy usług, sieci, aplikacji, dostępu do danych na tej maszynie.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns where those drives travel.

    On a server a fixed drive by definition travels nowhere and the disruption is then none. The
    name "fixed drive" takes in, however, volumes on removable media plugged in permanently as
    well, and drives in caddies, and those are at times carried about.

    The thing to be reviewed therefore runs: is any of those volumes at times plugged into a
    machine with an older system. If it is, after the change it will cease to be readable there -
    and the symptom will not be a subtle one but a drive reported as unformatted.

    The change concerns volumes encrypted after it is brought in. A drive that got that area
    earlier carries it on and can still be read by the older road. Removing that area calls for
    the volume to be decrypted and encrypted anew.

    What this does not break: the reading of drives on machines with a current system, the working
    of services, the network, applications, or access to data on this machine.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Wolumin podłączany do maszyny ze starszym systemem przestanie być tam czytelny i zgłosi się jako niesformatowany
      - Dysk, który dostał ten obszar przed zmianą, nosi go dalej i nadal daje się odczytać starszą drogą
      - Usunięcie obszaru z woluminu istniejącego wymaga odszyfrowania go i zaszyfrowania na nowo
      - Odczyt na maszynach z systemem bieżącym, praca usług i dostęp do danych pozostają bez zmian
    en:
      - A volume plugged into a machine with an older system will cease to be readable there and will report itself as unformatted
      - A drive that got that area before the change carries it on and can still be read by the older road
      - Removing the area from an existing volume calls for it to be decrypted and encrypted anew
      - Reading on machines with a current system, the working of services and access to data stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumin w kieszeni bywa podłączany do maszyny ze starszym systemem i jest to jedyna droga odczytu tych danych
      - Nie ustalono, które z woluminów zgłaszanych jako stałe faktycznie stoją w tej maszynie na stałe
    en:
      - A volume in a caddy is at times plugged into a machine with an older system and that is the one road to reading those data
      - It has not been established which of the volumes reported as fixed in fact stand in this machine permanently
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is text, not a number: the policy switched off writes the
      # word <none>, switched on writes the name of the old recording format.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'FDVDiscoveryVolumeType'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '<none>'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'FDVDiscoveryVolumeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVDiscoveryVolumeType' -Value '<none>' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt jest drugi w bloku i pierwszy, który dotyczy drogi obok, a nie
    samego szyfrowania. Wartość tej reguły polega na zauważeniu, że
    zaszyfrowany dysk potrafi nieść na sobie własną furtkę.

    Wartość zapisywana przez to ustawienie jest tekstem, nie liczbą, i warto
    o tym pamiętać przy czytaniu wyniku. Zgodny stan zapisuje się jako słowo
    oznaczające brak, co wygląda w raporcie na pustkę, a pustką nie jest.
    Audyt rozróżnia tu brak wpisu od wpisu mówiącego „brak" i to
    rozróżnienie jest rzeczywiste: pierwsze znaczy, że nikt o tym nie
    zdecydował, drugie że zdecydowano.

    Odnotowuję też, że nazwa „dysk stały" myli w tym punkcie bardziej niż
    gdzie indziej. Obejmuje ona woluminy, które w praktyce bywają
    przenoszone, a cała uciążliwość tej reguły dotyczy właśnie ich. Jeżeli
    aplikacja ma listę woluminów z etapu audytu, to jest miejsce, gdzie
    warto ją pokazać obok reguły.
  en: |
    The item is the second in the block and the first that concerns a road beside rather than the
    encryption itself. This rule's value lies in noticing that an encrypted drive can carry a
    wicket of its own.

    The value this setting writes is text and not a number, and that is worth keeping in mind when
    reading the outcome. The compliant state is written as a word meaning absence, which looks in
    the report like emptiness and is not. The audit tells apart here a want of an entry from an
    entry saying "none", and that distinction is a real one: the first means nobody decided about
    it, the second that it was decided.

    Worth noting too that the name "fixed drive" misleads at this item more than elsewhere. It
    takes in volumes that in practice are at times carried about, and the whole of this rule's
    disruption concerns just those. If the application has a list of volumes from the audit stage,
    this is the place where it is worth showing beside the rule.
