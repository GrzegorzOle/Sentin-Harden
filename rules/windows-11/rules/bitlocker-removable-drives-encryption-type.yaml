id: win11-bitlocker-removable-drives-encryption-type

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Szyfrowanie całego nośnika wymiennego wymuszone
    en: Full encryption of removable media enforced
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile nośnika wymiennego zostanie zaszyfrowane przy
    zakładaniu ochrony: cały nośnik czy wyłącznie miejsce zajęte w danej
    chwili.

    Przy nośnikach wymiennych argument za pełnym szyfrowaniem jest najmocniejszy
    z całej trójki, bo to właśnie te nośniki się gubi. Dysk stały ginie razem
    z komputerem, co jest zdarzeniem rzadkim i natychmiast zauważanym. Pamięć
    przenośna ginie w taksówce, zostaje u klienta, wypada z kieszeni — i bywa,
    że nikt tego nie odnotuje.

    Nośnik wymienny ma też przeszłość dłuższą niż się pamięta. Trafia na niego
    plik, potem inny, potem ktoś go formatuje szybko przed przekazaniem dalej.
    Zawartość wcześniejsza zostaje w obszarze, który przy szyfrowaniu samego
    miejsca zajętego pozostanie jawny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zawartość
    obszaru wolnego znalezionego nośnika, bez hasła i bez klucza. Przy
    nośnikach krążących między biurem, domem i klientem jest to najbardziej
    prawdopodobna droga wycieku w całej tej paczce — nie wymaga bowiem ani
    dostępu do sieci, ani obecności przy maszynie.
  en: |
    The setting settles how much of a removable medium is encrypted when protection is
    set up: the whole medium, or only the space used at the moment.

    With removable media the case for full encryption is the strongest of the three,
    since these are the media that get lost. A fixed disk is lost together with the
    computer, which is a rare event and noticed at once. A portable memory is lost in a
    taxi, left at a customer's, falls out of a pocket - and sometimes nobody records it.

    A removable medium also has a longer past than is remembered. One file lands on it,
    then another, then somebody formats it quickly before passing it on. The earlier
    contents stay in an area that, where only the used space is encrypted, will remain in
    the clear.

    What an attacker gains while the item goes unmet: the contents of the free area of a
    medium they have found, with no password and no key. With media circulating between
    the office, home and customers this is the likeliest route of a leak in this whole
    pack - it takes neither access to a network nor presence at a machine.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak nośniki wymienne są na co dzień używane —
    bo to od tego zależy, czy zmiana będzie niezauważalna, czy uciążliwa.

    Skutek podstawowy jest prosty: zaszyfrowanie nośnika potrwa dłużej,
    proporcjonalnie do jego pojemności, a nie do ilości danych. Nośnik
    o dużej pojemności z jednym plikiem będzie szyfrowany tak długo, jak nośnik
    pełny.

    To jest właśnie miejsce, w którym zmiana bywa odczuwalna. Tam, gdzie
    nośnik podłącza się na chwilę, żeby przenieść jeden dokument, oczekiwanie
    na zaszyfrowanie całości zamienia czynność minutową w kilkunastominutową.
    Użytkownicy reagują na to przewidywalnie: szukają nośnika, którego nie
    trzeba szyfrować.

    Warto to przewidzieć i odpowiedzieć na to organizacyjnie — na przykład
    przygotowując zaszyfrowane nośniki z wyprzedzeniem, zamiast zostawiać
    szyfrowanie na moment, w którym ktoś się spieszy.

    Nośniki zaszyfrowane wcześniej w trybie oszczędnym pozostają w tym trybie.
    Odczyt i zapis w trakcie szyfrowania działa normalnie, choć wolniej.
  en: |
    What needs checking is how removable media are used day to day - since it is that
    which decides whether the change will be unnoticeable or a nuisance.

    The basic effect is simple: encrypting a medium will take longer, in proportion to
    its capacity rather than to the amount of data. A medium of great capacity holding
    one file will be encrypted as long as a full one.

    That is exactly where the change is sometimes felt. Where a medium is plugged in for
    a moment to carry one document across, waiting for the whole thing to be encrypted
    turns a one-minute act into a quarter of an hour. Users react to that predictably:
    they look for a medium that need not be encrypted.

    It is worth foreseeing this and answering it by organisation - for instance by
    preparing encrypted media in advance rather than leaving the encrypting for the
    moment when somebody is in a hurry.

    Media encrypted earlier in the sparing mode stay in that mode. Reading and writing
    during encryption works normally, though more slowly.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Zaszyfrowanie nośnika wymiennego trwa proporcjonalnie do pojemności, a nie do ilości danych
      - Przeniesienie jednego pliku na duży nośnik wymaga oczekiwania na zaszyfrowanie całości
      - Nośniki zaszyfrowane wcześniej w trybie oszczędnym pozostają w tym trybie
      - Odczyt i zapis w trakcie szyfrowania działa normalnie, choć wolniej
    en:
      - Encrypting a removable medium takes time in proportion to capacity, not to the amount of data
      - Moving a single file onto a large medium takes waiting for the whole thing to be encrypted
      - Media encrypted earlier in the sparing mode stay in that mode
      - Reading and writing during encryption works normally, though more slowly
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki wymienne podłącza się na chwilę i nie przewidziano na szyfrowanie czasu
      - W obiegu są nośniki o dużej pojemności używane do przenoszenia pojedynczych plików
    en:
      - Removable media are plugged in briefly and no time has been allowed for encryption
      - Media of great capacity used for carrying single files are in circulation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RDVEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: FULL
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'RDVEncryptionType' -ErrorAction SilentlyContinue).'RDVEncryptionType'
    [pscustomobject]@{
      path        = $path
      name        = 'RDVEncryptionType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła domyka trójkę ustawień trybu szyfrowania: dysk systemowy, dysk
    stały z danymi, nośnik wymienny. Wyniki tych trzech warto czytać razem,
    bo różny tryb na różnych nośnikach tej samej maszyny jest stanem
    niespójnym, a nie kompromisem.

    Punkt nie wymusza szyfrowania nośników wymiennych. Rozstrzyga wyłącznie,
    jak będą szyfrowane te, które ktoś zaszyfruje. Wymuszenie ochrony jest
    przedmiotem osobnej reguły w tej paczce i te dwie należy czytać wspólnie —
    ta bez tamtej opisuje sposób, w jaki nie stanie się nic.

    Ustawienie działa wyłącznie przy zakładaniu ochrony i nie przeszyfruje
    nośnika już chronionego.
  en: |
    The rule closes the trio of settings for the encryption mode: the operating system
    drive, the fixed data disk, the removable medium. The results of these three are
    worth reading together, since a different mode on different media of the same machine
    is an inconsistent state rather than a compromise.

    The item does not force removable media to be encrypted. It settles only how those
    that somebody does encrypt will be encrypted. Forcing protection is the subject of a
    separate rule in this pack, and the two should be read together - this one without
    that one describes the way in which nothing will happen.

    The setting works only when protection is being set up and will not re-encrypt a
    medium already protected.
