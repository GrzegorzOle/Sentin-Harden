id: win11-internet-connection-sharing-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Udostępnianie połączenia internetowego wyłączone
    en: Sharing an internet connection switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System pozwala jednym kliknięciem zamienić stanowisko w bramę do sieci:
    maszyna zaczyna rozdawać adresy, tłumaczyć ruch i przepuszczać go między
    swoimi kartami sieciowymi. Zwykle robi się to, żeby podłączyć drugie
    urządzenie przez połączenie komórkowe albo przez sieć bezprzewodową.

    Skutkiem jest droga do sieci firmowej, która omija wszystko, czym się tę
    sieć chroni. Urządzenie podłączone za pośrednictwem stanowiska nie przechodzi
    przez żadną kontrolę dostępu, nie jest widziane przez mechanizmy rozdzielające
    sieć na segmenty i nie pojawia się w żadnym wykazie. Z punktu widzenia sieci
    ruch pochodzi ze stanowiska, które ma prawo tam być.

    Nie trzeba do tego złej woli. Wystarczy chęć podłączenia prywatnego telefonu
    albo urządzenia, którego nikt nie chciał wpuścić do sieci firmowej — i taka
    właśnie jest najczęstsza droga, którą sprzęt niekontrolowany trafia do
    środka.
  en: |
    The system allows a station to be turned into a gateway with one click: the
    machine starts handing out addresses, translating traffic and passing it
    between its network cards. It is usually done to connect a second device
    through a mobile connection or a wireless network.

    The result is a road into the company network that bypasses everything the
    network is protected with. A device connected through the station passes no
    access control, is not seen by the mechanisms dividing the network into
    segments, and appears in no register. From the network's point of view the
    traffic comes from a station entitled to be there.

    No ill will is needed. A wish to connect a private phone or a device nobody
    wanted to let onto the company network is enough - and that is exactly the most
    common road by which uncontrolled hardware gets inside.

disruption_description:
  pl: |
    Nic nie przestaje działać w pracy biurowej. Udostępnianie połączenia nie jest
    funkcją używaną przy zwykłych zadaniach i większość osób nigdy o niej nie
    słyszała.

    Zmiana odetnie osoby, które z tej funkcji korzystają świadomie: pracujące
    w terenie i podłączające przez laptopa urządzenie pomiarowe, drukarkę albo
    sprzęt diagnostyczny bez własnego połączenia. Objawem jest brak pozycji
    udostępniania we właściwościach połączenia.

    Korzystanie z cudzego udostępnionego połączenia — na przykład z punktu
    dostępowego udostępnionego przez telefon — działa bez zmian. Punkt dotyczy
    udostępniania przez tę maszynę, a nie łączenia się z czyimś.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    Nothing stops working in office use. Sharing a connection is not a function
    used in ordinary tasks and most people have never heard of it.

    The change will cut off those who use it deliberately: people working in the
    field who connect a measuring instrument, a printer or diagnostic hardware
    without a connection of its own through their laptop. The symptom is a missing
    sharing item in the connection's properties.

    Using somebody else's shared connection - a hotspot shared by a phone, say -
    works unchanged. The item concerns sharing by this machine, not connecting to
    somebody else's.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Podłączenie urządzenia bez własnego połączenia przez laptopa przestanie być możliwe
      - Pozycja udostępniania zniknie z właściwości połączenia sieciowego
    en:
      - Connecting a device with no connection of its own through the laptop stops being possible
      - The sharing item disappears from the network connection's properties
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko pracuje w terenie i udostępnia połączenie urządzeniu pomiarowemu albo diagnostycznemu bez własnej łączności
    en:
      - The station works in the field and shares its connection with a measuring or diagnostic device that has no connectivity of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_ShowSharedAccessUI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_ShowSharedAccessUI'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_ShowSharedAccessUI' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-networkisolation

notes:
  pl: |
    Nazwa wartości w rejestrze mówi o pokazywaniu okna, a nie o zablokowaniu
    funkcji. Zasada działa jednak szerzej niż nazwa sugeruje i wyłącza samo
    udostępnianie, nie tylko sposób dotarcia do niego przez interfejs.

    Punkt nie obejmuje wszystkich sposobów zamiany stanowiska w bramę. Punkt
    dostępowy udostępniony narzędziem spoza systemu oraz udostępnianie zestawione
    poleceniami są poza jego zasięgiem. Zapisuję to wprost, żeby zieleń w tym
    punkcie nie została odczytana jako pewność, że przez tę maszynę nic do sieci
    nie wejdzie.
  en: |
    The value's name in the registry speaks of showing a window rather than of
    blocking the function. The policy works more broadly than the name suggests,
    though, and switches off the sharing itself, not merely the way to reach it
    through the interface.

    The item does not cover every way of turning a station into a gateway. A
    hotspot shared by a tool outside the system, and sharing set up by commands,
    are beyond its reach. This is recorded plainly so that green here is not read
    as certainty that nothing will get onto the network through this machine.
