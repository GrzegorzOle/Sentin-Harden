id: win2025-search-location-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Dostęp wyszukiwania do położenia maszyny wyłączony
    en: Search access to the machine's location turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera wyszukiwaniu dostęp do informacji o położeniu maszyny.

    Kategoria średnia i chcę tu od razu rozwiać wyobrażenie, które ta nazwa
    wywołuje, bo prowadzi w złą stronę. Serwer nie ma odbiornika
    nawigacyjnego. Jego położenie ustala się z tego, co widzi w sieci:
    z adresu, z jakiego wychodzi, i z otoczenia sieciowego, w którym
    pracuje.

    I to jest właściwa treść tego punktu. Żeby położenie ustalić, trzeba
    opis tego otoczenia komuś przekazać. Wychodzi więc nie „gdzie stoi
    serwer", tylko materiał, z którego da się to wyliczyć — a ten materiał
    opisuje sieć organizacji, nie geografię.

    Na serwerze waży to z powodu, który wykracza poza samą informację.
    Położenie maszyny produkcyjnej bywa danymi wrażliwymi w sensie
    dosłownym: mówi, w którym ośrodku stoi zapasowa kopia i gdzie
    fizycznie trzeba się udać, żeby dotrzeć do sprzętu. Organizacje płacą
    za to, żeby tego nie ogłaszać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przesłankę
    co do tego, gdzie ten serwer stoi i jak wygląda sieć, w której pracuje.
  en: |
    The item takes from search its access to information about the machine's
    location.

    The category is medium, and I want to dispel at once the picture this
    name conjures, because it leads the wrong way. A server has no
    navigation receiver. Its location is worked out from what it sees on the
    network: from the address it goes out by, and from the network
    surroundings it works in.

    And that is the real substance of the item. To work the location out, a
    description of those surroundings has to be passed to somebody. So what
    goes out is not "where the server stands" but the material from which
    that can be computed - and that material describes the organisation's
    network, not geography.

    On a server this weighs for a reason that goes beyond the information
    itself. The location of a production machine is sometimes sensitive in
    the literal sense: it says in which site the backup copy stands and
    where one physically has to go to reach the hardware. Organisations pay
    for that not to be announced.

    What an attacker gains while the item goes unmet: a lead on where this
    server stands and what the network it works in looks like.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i jest to jedna z niewielu reguł w tym wątku,
    przy której nie mam do postawienia nawet zastrzeżenia.

    Na serwerze nie istnieje funkcja, która z tego korzysta. Wyszukiwanie
    plików, programów i ustawień nie używa położenia w żaden sposób —
    korzystały z niego wyniki pogodowe i lokalne, czyli rzeczy, których na
    serwerze nie ma. Nikt nie zauważy tej zmiany, bo nie ma czego
    zauważyć.

    Nie odbiera to również położenia całemu systemowi. Usługa położenia
    jest osobnym mechanizmem i jeśli jakieś oprogramowanie na tej maszynie
    z niej korzysta, będzie korzystać dalej. Ten punkt dotyczy wyłącznie
    wyszukiwania. Gdyby dotyczył całej usługi, klasa byłaby wyższa, bo
    część oprogramowania inwentaryzacyjnego rzeczywiście z niej czyta.

    Warto to rozróżnienie zapisać, bo kto szuka powodu, dla którego jakiś
    program przestał widzieć położenie, nie znajdzie go tutaj.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption", and this is one of the few rules in this
    vein about which I do not even have a caveat to state.

    On a server there is no feature that uses this. Searching for files,
    programs and settings uses location in no way at all - what used it were
    weather and local results, that is, things a server does not have.
    Nobody will notice this change, because there is nothing to notice.

    Nor does it take location away from the whole system. The location
    service is a separate mechanism, and if some software on this machine
    uses it, it will go on doing so. This item concerns search alone. Were
    it about the whole service the class would be higher, because some
    stock-taking software genuinely reads from it.

    The distinction is worth recording, because anybody looking for the
    reason a program stopped seeing the location will not find it here.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Nic nie przestaje działać — wyszukiwanie plików, programów i ustawień nie używa położenia w żaden sposób
      - Korzystały z niego wyniki pogodowe i lokalne, czyli rzeczy, których na serwerze nie ma
      - Punkt nie odbiera położenia całemu systemowi — usługa położenia jest osobnym mechanizmem i działa dalej
      - Kto szuka powodu, dla którego jakiś program przestał widzieć położenie, nie znajdzie go tutaj
    en:
      - Nothing stops working - searching for files, programs and settings uses location in no way at all
      - What used it were weather and local results, that is, things a server does not have
      - The item does not take location from the whole system - the location service is a separate mechanism and goes on working
      - Anybody looking for the reason a program stopped seeing the location will not find it here
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym użytkownicy korzystają z wyników wyszukiwania zależnych od położenia
    en:
      - The machine is a terminal server where users rely on location-dependent search results
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowSearchToUseLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowSearchToUseLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A server has no navigation receiver: its location is worked out from the
    # address it goes out by and its network surroundings, so what leaves is
    # material describing the organisation's network. This covers search only,
    # not the location service used by other software.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSearchToUseLocation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Nazwa prowadzi w złą stronę: serwer nie ma odbiornika nawigacyjnego.
    Jego położenie ustala się z adresu, z jakiego wychodzi, i z otoczenia
    sieciowego. Żeby je ustalić, trzeba opis tego otoczenia komuś
    przekazać — wychodzi więc materiał opisujący sieć organizacji, nie
    geografię.

    Położenie maszyny produkcyjnej bywa danymi wrażliwymi dosłownie: mówi,
    w którym ośrodku stoi zapasowa kopia i gdzie trzeba się udać, żeby
    dotrzeć do sprzętu.

    Rozróżnienie warte zapisania: punkt dotyczy wyszukiwania, nie całej
    usługi położenia. Kto szuka powodu, dla którego jakiś program przestał
    widzieć położenie, nie znajdzie go tutaj.
  en: |
    The name leads the wrong way: a server has no navigation receiver. Its
    location is worked out from the address it goes out by and its network
    surroundings. To work it out, a description of those surroundings has to
    be passed to somebody - so what goes out is material describing the
    organisation's network, not geography.

    The location of a production machine is sometimes sensitive in the
    literal sense: it says in which site the backup copy stands and where
    one has to go to reach the hardware.

    A distinction worth recording: the item concerns search, not the whole
    location service. Anybody looking for the reason a program stopped
    seeing the location will not find it here.
