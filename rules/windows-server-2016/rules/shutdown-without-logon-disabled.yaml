id: win2016-shutdown-without-logon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wyłączenie maszyny bez zalogowania zabronione
    en: Shutting the machine down without signing in forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z ekranu logowania możliwość wyłączenia maszyny, czyli
    żąda zalogowania się przed jej zatrzymaniem.

    Punkt dotyczy dostępności, a nie poufności, i to jest w nim
    charakterystyczne. Nic nie wycieka i nic nie zostaje przejęte — po prostu
    maszyna przestaje działać. Na stacji roboczej byłby to drobiazg. Na
    serwerze wyłączenie jest zdarzeniem, które zauważa cała organizacja,
    i zwykle nie da się go cofnąć zdalnie.

    Wartość zabezpieczenia jest wprost proporcjonalna do tego, kto dochodzi do
    konsoli. W serwerowni z kontrolą dostępu — niewielka. W szafie w pokoju
    socjalnym, w gabinecie lekarskim, w oddziale bez osobnego pomieszczenia
    serwerowego — realna, bo przycisk na ekranie logowania jest wtedy dostępny
    dla każdego, kto przechodzi obok.

    Jest też drugi, cichszy powód. Wyłączenie maszyny bywa pierwszym krokiem
    ataku fizycznego, a nie jego celem: zatrzymanie systemu pozwala uruchomić
    maszynę z nośnika zewnętrznego i sięgnąć do dysku poza kontrolą systemu.
    Przycisk na ekranie logowania jest wtedy najwygodniejszym sposobem
    rozpoczęcia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    zatrzymanie usługi jednym kliknięciem bez żadnego uwierzytelnienia oraz
    wygodne wejście do ataku prowadzonego z nośnika zewnętrznego.
  en: |
    The setting takes from the sign-in screen the means of shutting the machine
    down, which is to say it demands signing in before the machine is stopped.

    The item concerns availability rather than confidentiality, and that is what
    marks it out. Nothing leaks and nothing is taken over - the machine simply stops
    working. On a workstation that would be a trifle. On a server a shutdown is an
    event the whole organisation notices, and one that usually cannot be undone
    remotely.

    The safeguard's worth is in direct proportion to who reaches the console. In a
    server room with access control - slight. In a cabinet in the break room, in a
    consulting room, in a branch with no separate server space - real, because the
    button on the sign-in screen is then within reach of anybody walking past.

    There is a second, quieter reason too. Shutting a machine down is at times the
    first step of a physical attack rather than its aim: stopping the system allows
    the machine to be started from external media and the disk to be reached outside
    the system's control. The button on the sign-in screen is then the handiest way
    of beginning.

    What an attacker gains while the item goes unmet: a way to stop the service with
    one click and no authentication at all, and a convenient entry into an attack
    carried on from external media.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", i sprawdzenie dotyczy czegoś, o czym łatwo
    zapomnieć: sposobu, w jaki ta maszyna gasnie przy zaniku zasilania.

    Zasilacz awaryjny zwykle nie korzysta z ekranu logowania — jego
    oprogramowanie działa jako usługa i wyłącza system własną drogą, więc
    zmiana go nie dotyczy. Warto jednak potwierdzić, że tak jest akurat w tym
    wdrożeniu, zanim okaże się to przy najbliższej awarii zasilania.

    Drugi scenariusz jest praktyczny. Osoba, która fizycznie obsługuje maszynę,
    ale nie ma na niej konta — technik, elektryk, ktoś z obsługi budynku —
    traci możliwość wyłączenia jej w sposób kontrolowany. Zostaje przytrzymanie
    przycisku zasilania, a to jest wyłączenie twarde, z ryzykiem dla danych.
    Jeżeli takie sytuacje się zdarzają, trzeba dać tym osobom inną drogę,
    a nie zostawiać im tej najgorszej.

    Trzeci dotyczy maszyn w oddziałach, gdzie wyłączenie serwera na noc bywa
    elementem codziennej procedury wykonywanej przez osobę bez konta.

    Czego to nie psuje: wyłączania po zalogowaniu, restartu zdalnego,
    zatrzymania maszyny wirtualnej z poziomu hipernadzorcy ani pracy usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns something easily forgotten:
    the way this machine goes down when power fails.

    An uninterruptible power supply usually makes no use of the sign-in screen - its
    software runs as a service and shuts the system down by its own road, so the
    change does not touch it. It is worth confirming that this is so in this
    particular deployment, though, before it becomes apparent at the next power
    failure.

    The second scenario is a practical one. A person who handles the machine
    physically but has no account on it - a technician, an electrician, somebody
    from the building's staff - loses the means of shutting it down in a controlled
    way. What remains is holding the power button, and that is a hard shutdown, with
    risk to the data. If such situations arise, those people must be given another
    road rather than left with the worst one.

    The third concerns machines in branches, where shutting the server down for the
    night is at times part of a daily procedure carried out by somebody without an
    account.

    What this does not break: shutting down after signing in, a remote restart,
    stopping a virtual machine from the hypervisor, or the working of services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoba obsługująca maszynę fizycznie, ale bez konta na niej, nie wyłączy jej inaczej niż przyciskiem zasilania
      - Procedura wyłączania serwera na noc, wykonywana w oddziale przez osobę bez konta, przestaje działać
      - Przycisk wyłączenia znika z ekranu logowania, co bywa zgłaszane jako awaria, a nie jako zmiana
      - Wyłączanie po zalogowaniu, restart zdalny i zatrzymanie maszyny z poziomu hipernadzorcy działają bez zmian
    en:
      - A person handling the machine physically but without an account on it will shut it down only with the power button
      - A procedure of shutting the server down for the night, carried out in a branch by somebody without an account, stops working
      - The shutdown button vanishes from the sign-in screen, which is at times reported as a fault rather than a change
      - Shutting down after signing in, a remote restart and stopping the machine from the hypervisor work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszynę wyłącza fizycznie osoba bez konta na niej i nie ma dla niej innej drogi niż przycisk na ekranie
      - Nie potwierdzono, że oprogramowanie zasilacza awaryjnego wyłącza system własną drogą, a nie przez ekran logowania
    en:
      - The machine is shut down physically by somebody without an account on it and has no road for them but the button on the screen
      - It has not been confirmed that the power supply software shuts the system down by its own road rather than through the sign-in screen
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ShutdownWithoutLogon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'ShutdownWithoutLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero is the compliant value: the setting is named for allowing the shutdown,
    # so forbidding it means leaving that permission at nought.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ShutdownWithoutLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/shutdown-allow-system-to-be-shut-down-without-having-to-log-on

notes:
  pl: |
    Jest to druga reguła w tym bloku, w której wartością zgodną jest zero,
    bo nazwa ustawienia opisuje pozwolenie, a nie zakaz. Warto o tym pamiętać
    przy czytaniu wyniku, żeby nie odwrócić go w drugą stronę.

    Punkt ma sens wyłącznie w zestawieniu z tym, gdzie maszyna fizycznie stoi.
    Serwer w szafie z zamkiem, w pomieszczeniu z kontrolą dostępu, praktycznie
    nie korzysta z tego zabezpieczenia. Serwer w oddziale, pod biurkiem albo
    w pokoju socjalnym — korzysta z niego najbardziej ze wszystkich reguł
    w tym zestawie.

    Aplikacja powinna pokazywać ten punkt razem z regułami o uruchamianiu
    z nośnika zewnętrznego i o zabezpieczeniu rozruchu. Wszystkie trzy dotyczą
    jednego przeciwnika: kogoś, kto stoi przy maszynie.
  en: |
    This is the second rule in this block where the compliant value is nought,
    because the setting's name describes a permission and not a prohibition. Worth
    keeping in mind when reading the result, so as not to turn it the other way
    round.

    The item makes sense only set against where the machine physically stands. A
    server in a locked cabinet, in a room with access control, makes practically no
    use of this safeguard. A server in a branch, under a desk or in a break room -
    makes more use of it than of any other rule in this set.

    The application should show this item together with the rules on starting from
    external media and on securing the boot. All three concern one adversary:
    somebody standing at the machine.
