id: win11-diagnostic-data-authenticated-proxy-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Uwierzytelnianie usługi diagnostycznej na pośredniku zablokowane
    en: Authentication of the diagnostic service at a proxy blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy usługa wysyłająca dane diagnostyczne może
    uwierzytelnić się na pośredniku sieciowym poświadczeniami zalogowanego
    użytkownika.

    Mechanizm ma wyglądać niewinnie i dlatego wart jest rozpisania. Pośrednik
    wymagający uwierzytelnienia przepuszcza ruch dopiero po przedstawieniu
    poświadczeń. Usługa diagnostyczna, chcąc wysłać dane, sięga po
    poświadczenia użytkownika, który akurat pracuje, i przedstawia je
    w jego imieniu.

    Rzecz jest w tym, że usługa nie jest programem, który użytkownik
    uruchomił. Działa w tle, nieprzerwanie, niezależnie od tego, co
    użytkownik robi — a mimo to występuje w jego imieniu na zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    wywołanie uwierzytelnienia poświadczeniami użytkownika wobec serwera,
    który sam wskaże. Jeżeli zdoła podstawić się jako pośrednik — a droga do
    tego jest opisana w innej regule tej paczki — dostaje materiał
    uwierzytelniający przesłany przez zaufaną usługę systemową, bez udziału
    użytkownika i bez jego wiedzy.

    Zablokowanie uwierzytelnienia sprawia, że usługa wychodzi na zewnątrz
    anonimowo albo nie wychodzi wcale. W obu przypadkach nie ma czego
    przechwycić.
  en: |
    The setting settles whether the service sending diagnostic data may authenticate at a
    network proxy with the credentials of the logged-on user.

    The mechanism is meant to look innocent and so is worth setting out. A proxy demanding
    authentication lets traffic through only once credentials have been presented. The
    diagnostic service, wishing to send data, reaches for the credentials of whichever
    user happens to be working and presents them in their name.

    The thing is that the service is not a program the user started. It works in the
    background, without a break, whatever the user is doing - and yet it appears outward
    in their name.

    What an attacker gains while the item goes unmet: a way of calling forth an
    authentication with the user's credentials against a server of their own naming. If
    they manage to pass themselves off as the proxy - and the route to that is described
    in another rule of this pack - they get authentication material sent by a trusted
    system service, with no part taken by the user and without their knowledge.

    Blocking the authentication makes the service go outward anonymously or not go at all.
    In either case there is nothing to intercept.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy wyjście na zewnątrz z tej maszyny prowadzi
    przez pośrednika wymagającego uwierzytelnienia.

    W sieci bez pośrednika albo z pośrednikiem przepuszczającym ruch bez
    poświadczeń zmiana nie zmienia niczego.

    Tam, gdzie pośrednik uwierzytelnienia wymaga, dane diagnostyczne
    przestaną z maszyny wychodzić. Jest to skutek zamierzony w dwie strony
    naraz: maszyna przestaje wystawiać poświadczenia, ale też przestaje
    wysyłać dane, na których mogą opierać się zestawienia po stronie
    organizacji.

    Warto rozstrzygnąć to świadomie. Jeżeli dane diagnostyczne są w
    organizacji faktycznie używane, właściwą drogą jest przepuszczenie tego
    ruchu na pośredniku bez uwierzytelnienia, a nie zostawienie usługi
    z prawem do sięgania po poświadczenia.

    Nie pojawi się przy tym żaden komunikat. Brak danych zobaczy tylko ten,
    kto ich po drugiej stronie szuka.

    Zmiana nie wymaga restartu. Praca użytkownika nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is whether the way out of this machine leads through a proxy
    demanding authentication.

    On a network with no proxy, or with a proxy letting traffic through without
    credentials, the change changes nothing.

    Where the proxy does demand authentication, the diagnostic data will stop going out of
    the machine. That is an effect intended in two directions at once: the machine stops
    presenting credentials, but also stops sending data on which lists on the
    organisation's side may rest.

    It is worth settling knowingly. If the diagnostic data are actually used in the
    organisation, the right course is to let that traffic through the proxy without
    authentication rather than to leave the service with leave to reach for credentials.

    No message will appear at that. The absence of data will be seen only by whoever looks
    for them on the other side.

    The change takes no restart. The user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - network-and-firewall
    - accounts-and-passwords
  what_breaks:
    pl:
      - Za pośrednikiem wymagającym uwierzytelnienia dane diagnostyczne przestają wychodzić
      - Zestawienia po stronie organizacji przestają otrzymywać dane z tej maszyny
      - Brak danych nie daje żadnego komunikatu i widać go tylko po drugiej stronie
      - W sieci bez pośrednika albo z pośrednikiem otwartym nic się nie zmienia
    en:
      - Behind a proxy demanding authentication the diagnostic data stop going out
      - Lists on the organisation's side stop receiving data from this machine
      - The absence of data gives no message and is seen only on the other side
      - On a network with no proxy, or with an open one, nothing changes
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dane diagnostyczne są w organizacji używane, a pośrednik wymaga uwierzytelnienia
      - Ruch usługi diagnostycznej nie został przepuszczony na pośredniku bez poświadczeń
    en:
      - The diagnostic data are used in the organisation and the proxy demands authentication
      - The diagnostic service's traffic has not been let through the proxy without credentials
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One here means the service may not authenticate at the proxy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableEnterpriseAuthProxy'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'DisableEnterpriseAuthProxy' -ErrorAction SilentlyContinue).'DisableEnterpriseAuthProxy'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableEnterpriseAuthProxy'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEnterpriseAuthProxy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Reguła domyka to, co opisuje reguła dotycząca samoczynnego wyszukiwania
    pośrednika sieciowego. Tamta zamyka drogę podstawienia się jako pośrednik,
    ta odbiera materiał, po który ktoś podstawiony by sięgnął. Wyniki obu
    warto czytać razem, bo osobno każda zostawia drugą połowę problemu.

    Punkt dotyczy wyłącznie usługi wysyłającej dane diagnostyczne. Pozostałe
    składniki systemu uwierzytelniają się na pośredniku tak jak wcześniej i ta
    reguła ich nie dotyczy.

    Brak wartości nie jest stanem zgodnym, bo domyślnie uwierzytelnienie bywa
    dozwolone.
  en: |
    The rule closes what the rule about the automatic search for a network proxy
    describes. That one shuts the route to passing oneself off as the proxy, this one
    takes away the material somebody so passed off would reach for. The results of both
    are worth reading together, since apart each leaves the other half of the problem.

    The item concerns the service sending diagnostic data alone. The system's other
    components authenticate at the proxy as before and this rule does not concern them.

    A missing value is not a compliant state, since by default the authentication is
    sometimes allowed.
