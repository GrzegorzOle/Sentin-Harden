id: win2016-ip-source-routing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Trasowanie źródłowe protokołu czwartej wersji wyłączone
    en: Source routing of the fourth version protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe odrzucać pakiety, w których nadawca sam wyznaczył drogę,
    jaką mają przejść przez sieć.

    Zwykle o drodze pakietu decydują routery po kolei, każdy na swoim
    odcinku. Trasowanie źródłowe odwraca ten układ: nadawca wpisuje trasę
    do samego pakietu, a urządzenia po drodze mają się do niej zastosować.
    Pomyślano to jako narzędzie diagnostyczne i w tej roli zostało
    zastąpione dawno.

    Zostało natomiast jako narzędzie omijania. Napastnik, który wyznacza
    trasę sam, prowadzi pakiet drogą, której projektant sieci nie
    przewidział — na przykład przez urządzenie ufające ruchowi z innego
    odcinka albo z pominięciem punktu, w którym ruch jest kontrolowany.
    Odpowiedź wraca tą samą drogą, więc rozmowa odbywa się poza
    przewidzianymi ścieżkami.

    Druga rzecz to podszycie. Skoro droga powrotna jest wpisana w pakiet,
    adres nadawcy przestaje ją wyznaczać — a to znaczy, że można podać cudzy
    adres i mimo to otrzymać odpowiedź. Zabezpieczenia oparte na zaufaniu do
    adresu przestają wtedy cokolwiek znaczyć.

    Wartość wymagana odrzuca pakiety z wyznaczoną trasą całkowicie, zamiast
    odrzucać tylko ich część.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    poprowadzenia ruchu drogą omijającą punkty kontroli oraz podszycia się
    pod cudzy adres z zachowaniem odpowiedzi.
  en: |
    The setting has packets rejected in which the sender has themselves marked out
    the road they are to take across the network.

    As a rule a packet's road is settled by routers in turn, each on its own
    stretch. Source routing reverses that arrangement: the sender writes the route
    into the packet itself, and the devices along the way are to abide by it. It was
    thought up as a diagnostic instrument and in that role was replaced long ago.

    What it remains is an instrument of going round. An attacker marking out the
    route themselves leads a packet by a road the network's designer did not foresee
    - through a device that trusts traffic from another stretch, say, or passing by
    the point at which traffic is controlled. The answer comes back the same road,
    so the conversation happens outside the paths foreseen.

    The second thing is impersonation. Since the return road is written into the
    packet, the sender's address ceases to mark it out - and that means somebody
    else's address can be given and an answer had all the same. Safeguards resting
    on trust in an address then cease to mean anything.

    The required value rejects packets with a marked-out route altogether, rather
    than rejecting some of them.

    What an attacker gains while the item goes unmet: the means of leading traffic
    by a road going round the points of control, and of impersonating somebody
    else's address while still getting the answer.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć skutek odczuwalny jest tu rzadkością.

    Trasowanie źródłowe nie jest używane w sieciach produkcyjnych od bardzo
    dawna. Większość urządzeń pośredniczących odrzuca takie pakiety sama
    z siebie, więc na maszynie ta zmiana zwykle potwierdza tylko to, co
    i tak się dzieje po drodze.

    Sprawdzić trzeba narzędzia diagnostyczne. Część starszych programów do
    badania trasy potrafi korzystać z tego mechanizmu, żeby wymusić przejście
    przez wskazane urządzenie. Jeżeli ktoś w organizacji tak diagnozuje sieć,
    straci tę możliwość — ale narzędzia dzisiejsze robią to inaczej i nie
    wymagają tego mechanizmu.

    Druga rzecz dotyczy sieci nietypowych. W układach z wieloma ścieżkami
    i własnym sposobem wyznaczania trasy mechanizm ten bywa wykorzystywany
    celowo. Są to przypadki rzadkie i zawsze świadome — nikt nie stosuje
    trasowania źródłowego przypadkiem.

    Czego to nie psuje: normalnej łączności sieciowej, trasowania
    wyznaczanego przez routery, protokołu szóstej wersji, usług, połączeń
    przychodzących i wychodzących.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though an effect anybody feels is rare here.

    Source routing has not been used in production networks for a very long time.
    Most intermediate devices reject such packets of their own accord, so on a
    machine this change as a rule only confirms what happens along the way anyway.

    What has to be checked are diagnostic tools. Some older route-tracing programs
    can use this mechanism to force a passage through a named device. If somebody in
    the organisation diagnoses the network that way, they will lose that means - but
    present-day tools do it otherwise and call for no such mechanism.

    The second thing concerns unusual networks. In arrangements with many paths and
    a way of marking out routes of their own, the mechanism is at times used
    deliberately. Such cases are rare and always deliberate - nobody uses source
    routing by accident.

    What this does not break: ordinary network connectivity, routing marked out by
    routers, the sixth version protocol, services, or incoming and outgoing
    connections.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Starsze narzędzia badania trasy wymuszające przejście przez wskazane urządzenie tracą tę możliwość
      - W sieciach z wieloma ścieżkami i własnym sposobem wyznaczania trasy mechanizm ten bywa wykorzystywany celowo i przestanie działać
      - Większość urządzeń pośredniczących odrzuca takie pakiety sama, więc na maszynie zmiana zwykle potwierdza stan istniejący
      - Normalna łączność sieciowa, trasowanie wyznaczane przez routery i protokół szóstej wersji pozostają bez zmian
    en:
      - Older route-tracing tools forcing a passage through a named device lose that means
      - In networks with many paths and a way of marking out routes of their own the mechanism is at times used deliberately and will stop working
      - Most intermediate devices reject such packets themselves, so on the machine the change as a rule confirms the existing state
      - Ordinary network connectivity, routing marked out by routers and the sixth version protocol stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Sieć, w której stoi maszyna, wykorzystuje trasowanie źródłowe celowo do wyznaczania ścieżek
      - Diagnostyka sieci w tej organizacji opiera się na starszych narzędziach wymuszających przejście przez wskazane urządzenie
    en:
      - The network the machine stands in uses source routing deliberately to mark out paths
      - Network diagnosis in this organisation rests on older tools forcing a passage through a named device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'DisableIPSourceRouting'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'DisableIPSourceRouting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableIPSourceRouting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt otwiera blok ustawień stosu sieciowego, dziedziczonych z czasów,
    gdy protokół projektowano pod inne zagrożenia niż dzisiejsze. Wszystkie
    mają wspólną cechę: są tanie, niewidoczne i pojedynczo niewiele znaczą,
    a razem zdejmują całą klasę dawnych zachowań.

    Wartość wymagana odrzuca pakiety z wyznaczoną trasą całkowicie. Wpis
    przyjmuje też wartość pośrednią, odrzucającą tylko część przypadków,
    ale połowiczne rozwiązanie zostawia drogę, którą punkt ma zamykać —
    dlatego audyt wymaga wartości pełnej, a nie „nie mniej niż".

    Reguła dotyczy wyłącznie protokołu czwartej wersji. W protokole szóstej
    wersji odpowiadający mechanizm został wycofany z samego standardu, więc
    osobnej reguły nie ma i nie powinno być.
  en: |
    The item opens the block of network stack settings inherited from the days when
    the protocol was designed against other threats than today's. All share one
    trait: they are cheap, invisible, and singly mean little, while together they
    take a whole class of former behaviours away.

    The required value rejects packets with a marked-out route altogether. The entry
    also takes a middle value rejecting some cases only, but a half answer leaves
    open the road the item is to shut - hence the audit demands the full value
    rather than "not less than".

    The rule concerns the fourth version protocol alone. In the sixth version
    protocol the answering mechanism was withdrawn from the standard itself, so
    there is no separate rule and there should be none.
