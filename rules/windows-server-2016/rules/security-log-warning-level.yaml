id: win2016-security-log-warning-level

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Ostrzeżenie o zapełnieniu dziennika zabezpieczeń przy dziewięćdziesięciu procentach
    en: A warning about the security log filling up at ninety per cent
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zapisać zdarzenie ostrzegawcze w chwili, gdy dziennik
    zabezpieczeń zapełni się w dziewięćdziesięciu procentach.

    Punkt domyka blok w sposób, który warto nazwać. Wszystkie poprzednie
    reguły dokładają zapisy. Ta pilnuje, żeby miejsce na nie się nie
    skończyło — bo dziennik pełny nie przestaje działać, tylko zaczyna
    nadpisywać zdarzenia najstarsze.

    Nadpisywanie jest tu rzeczą groźniejszą, niż wygląda, i z dwóch
    powodów. Pierwszy: traci się zapisy najstarsze, a w rozpoznaniu po
    incydencie najcenniejsze bywa właśnie to, co wydarzyło się najwcześniej
    — pierwsze wejście, a nie ostatnie. Drugi: nadpisywanie dzieje się
    w ciszy. Nikt nie dostaje komunikatu, nic nie przestaje działać,
    a dziennik wygląda normalnie, bo zdarzenia w nim są.

    Napastnik, który chce zatrzeć ślady, nie musi więc niczego kasować.
    Wystarczy, że wygeneruje dość zdarzeń, żeby dziennik obrócił się
    o pełną długość — a przy dzienniku małym nie jest to trudne.

    Ostrzeżenie zamienia to zjawisko ciche w zdarzenie widoczne, które da
    się zauważyć i na które da się zareagować przed utratą zapisów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyparcia zapisów o swoim wejściu przez samo wytworzenie ruchu, bez
    kasowania czegokolwiek i bez żadnego sygnału.
  en: |
    The setting has a warning event written the moment the security log is ninety
    per cent full.

    The item shuts the block in a way worth naming. Every previous rule adds
    records. This one sees to it that the room for them does not run out - a full
    log does not stop working but begins overwriting the oldest events.

    The overwriting is a graver thing here than it looks, and for two reasons.
    First: the oldest records are lost, and in establishing things after an incident
    the most valuable is often what happened earliest - the first entry rather than
    the last. Second: the overwriting happens in silence. Nobody gets a message,
    nothing stops working, and the log looks normal, there being events in it.

    An attacker wanting to efface traces therefore need delete nothing. It is enough
    that they make events enough for the log to turn over its full length - and with
    a small log that is not hard.

    The warning turns that quiet happening into a visible event, one that can be
    noticed and answered before the records are lost.

    What an attacker gains while the item goes unmet: the means of pushing out the
    records of their entry by merely making traffic, with nothing deleted and no
    signal at all.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rozstrzygają dwie rzeczy:
    restart i to, co się z ostrzeżeniem stanie.

    Restart jest warunkiem. Usługa dziennika czyta tę wartość przy starcie,
    więc do restartu maszyny zmiana leży w rejestrze i nie działa. Raport
    przed restartem pokaże zgodność, której w działaniu jeszcze nie ma —
    i warto to powiedzieć, zamiast pozwolić czytelnikowi przyjąć inaczej.

    Rzecz druga jest ważniejsza. Ostrzeżenie zapisane w dzienniku, którego
    nikt nie czyta, nie zmienia nic. Punkt ma sens wyłącznie wtedy, gdy
    dziennik jest zbierany albo obserwowany, a na zdarzenie ktoś reaguje.
    Wdrożony bez tego jest zapisem dobrej intencji.

    Rzecz trzecia dotyczy maszyn z dziennikiem małym i ruchem dużym. Tam
    ostrzeżenie będzie się pojawiać regularnie i szybko zostanie uznane za
    szum. Właściwą odpowiedzią jest powiększenie dziennika albo zbieranie
    go na zewnątrz, nie podniesienie progu.

    Czego to nie psuje: zapisywania zdarzeń, działania usług, logowania,
    dostępu do dziennika.

    Wymaga restartu; cofnięcie również działa dopiero po restarcie.
  en: |
    The class is "needs a planned rollout", and two things settle it: the restart and
    what becomes of the warning.

    The restart is a condition. The log service reads this value at its start, so
    until the machine restarts the change lies in the registry and does not work. A
    report before the restart will show a compliance that is not yet there in
    operation - and that had better be said than left for the reader to assume
    otherwise.

    The second thing matters more. A warning written into a log nobody reads changes
    nothing. The item makes sense only where the log is gathered or watched and
    somebody answers the event. Rolled out without that, it is a record of good
    intent.

    The third thing concerns machines with a small log and much traffic. There the
    warning will appear regularly and will soon be reckoned noise. The proper answer
    is to enlarge the log or to gather it outside, not to raise the threshold.

    What this does not break: the writing of events, the working of services,
    signing in, or access to the log.

    Calls for a restart; undoing it likewise works only after a restart.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Do restartu maszyny zmiana leży w rejestrze i nie działa, więc raport przed restartem pokazuje zgodność, której w działaniu jeszcze nie ma
      - Na maszynie z dziennikiem małym i ruchem dużym ostrzeżenie pojawia się regularnie i szybko zostaje uznane za szum
      - Ostrzeżenie zapisane w dzienniku, którego nikt nie czyta, nie zmienia nic
      - Zapisywanie zdarzeń, działanie usług i dostęp do dziennika pozostają bez zmian
    en:
      - Until the machine restarts the change lies in the registry and does not work, so a report before the restart shows a compliance not yet there in operation
      - On a machine with a small log and much traffic the warning appears regularly and is soon reckoned noise
      - A warning written into a log nobody reads changes nothing
      - The writing of events, the working of services and access to the log stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń tej maszyny nie jest zbierany ani obserwowany, więc na ostrzeżenie nie ma kto zareagować
      - Dziennik jest mały, a ruch duży, i zamiast progu należy najpierw poprawić rozmiar albo zbieranie
      - Okna serwisowego z restartem nie da się uzyskać, a punkt bez restartu nie zadziała
    en:
      - This machine's security log is neither gathered nor watched, so there is nobody to answer the warning
      - The log is small and the traffic great, and instead of the threshold the size or the gathering ought to be mended first
      - A service window with a restart cannot be had, and without a restart the item will not take effect
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value is a percentage of fill; ninety is required and anything lower
      # warns earlier, so it is compliant as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
      $name = 'WarningLevel'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch [System.Security.SecurityException] {
      # The key of this log is closed to a user without administrative rights. Its
      # own message goes to the error stream, so the report can tell a missing
      # privilege from a real fault.
      [Console]::Error.WriteLine($_.Exception.Message)
      'CHECK_ERROR'
    } catch {
      'CHECK_ERROR'
    }
  expected: '90'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
    $name = 'WarningLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'WarningLevel' -Value 90 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-1104

notes:
  pl: |
    Punkt zamyka blok i jest w nim jedynym, który nie dokłada zapisów,
    tylko broni tych już istniejących. Warto to pokazać, bo w zestawieniu
    z resztą wygląda na drobiazg administracyjny, a jest zabezpieczeniem
    przed najtańszym sposobem zacierania śladów.

    Audyt przyjmuje tu wartość nie większą niż wymagana, a nie równą.
    Próg niższy ostrzega wcześniej, więc jest stanem lepszym i zgłaszanie
    go jako niezgodności byłoby błędem. Jest to ta sama zasada, którą
    stosuję przy opóźnieniu aktualizacji funkcji.

    Audyt rozróżnia też brak uprawnień od usterki. Gałąź tego dziennika
    jest zamknięta dla użytkownika bez praw administratora, a komunikat
    systemu trafia wtedy do strumienia błędów — dzięki temu raport potrafi
    powiedzieć, że nie sprawdzono, zamiast twierdzić, że nie spełnia.

    Trzy reguły o restarcie w tym zestawie mają wspólną cechę wartą
    powtórzenia: zgodność w raporcie wyprzedza zgodność w działaniu.
    Aplikacja powinna to rozróżniać, bo różnica bywa kilkudniowa.
  en: |
    The item shuts the block and is the only one in it that adds no records but
    guards those already there. That is worth showing, since set beside the rest it
    looks an administrative trifle while being a safeguard against the cheapest way
    of effacing traces.

    The audit here takes a value not greater than the one required rather than equal
    to it. A lower threshold warns earlier, so it is a better state and reporting it
    as a non-compliance would be a mistake. It is the same principle I apply at the
    putting off of feature updates.

    The audit also tells a want of rights from a fault. This log's key is closed to a
    user without administrator rights, and the system's own message then goes to the
    error stream - so the report can say it did not check, instead of claiming it
    does not meet.

    The three rules about a restart in this set share a trait worth repeating:
    compliance in the report runs ahead of compliance in operation. The application
    should tell those apart, the difference being at times one of several days.
