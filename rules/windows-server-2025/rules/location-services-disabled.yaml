    jedną pominąć. Tamta wyłącza mechanizm — zatrzymuje usługę. Ta
    zapisuje decyzję — odmawia dostępu niezależnie od tego, czy mechanizm
    działa.

    Różnica jest praktyczna: typ uruchomienia usługi potrafi przestawić
    z powrotem instalator producenta albo dodanie roli, i zrobi to bez
    pytania. Wpis polityki taką zmianę przeżywa. Stosuje się je razem,
    a nie zamiennie.

    Jedyny punkt w tej grupie bez przerwy — zapisywana jest wartość,
    nie zatrzymywana usługa.
  en: |
    Two rules of the same name look like a saying twice and tempt one to pass over the one of them.
    That one switches off the working - it stops the service. This one writes down the deciding - it
    denies the reach whether or not the working run.

    The unlikeness is of practice - the kind of the starting of a service can be set back by a maker's
    installer or by the adding of a role, and it will be done without asking. The entry of the rule
    outlives such an altering. They are laid on together and not the one in the stead of the other.

    The one item in this band with no break - a worth is written, no service is stopped.
