id: win2025-group-policy-registry-background-processing

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Group Policy
  title:
    pl: Okresowe odświeżanie ustawień rejestru z zasad grupy włączone
    en: Periodic background refresh of registry policy enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt utrzymuje okresowe odświeżanie ustawień rejestru pochodzących
    z zasad grupy, czyli pobieranie ich w tle, bez czekania na restart czy
    ponowne logowanie.

    Kategoria średnia i chcę nazwać, czym ten punkt naprawdę jest, bo brzmi
    jak ustawienie wydajnościowe. Jest ustawieniem, od którego zależy, jak
    szybko zmiana zasad dociera do maszyny. Przy wyłączonym odświeżaniu
    maszyna pracuje z ustawieniami takimi, jakie zastała przy starcie,
    a wszystko, co zdecydowano później, czeka.

    To jest właściwa treść punktu. Zasady grupy są narzędziem reagowania.
    Gdy trzeba coś domknąć na wszystkich maszynach naraz — odebrać
    uprawnienie, wyłączyć mechanizm, zaostrzyć ustawienie — robi się to
    zasadami i zakłada, że zadziała w ciągu godziny. Serwer, który nie
    odświeża zasad w tle, z tego założenia wypada po cichu.

    Osobno waży to, że taka maszyna jest niewidoczna dla nadzoru. Raport
    z serwera zarządzania pokaże, że zasada została wydana; na maszynie
    nie zostanie zastosowana, a nic tego nie zgłosi.

    Uwaga na wartość: wpis jest nazwany przecząco, więc zero oznacza „nie
    wyłączaj odświeżania". Stan pożądany jest zapisany zerem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę,
    która nie przyjmuje zaostrzeń zasad do czasu restartu — czyli okno,
    w którym reakcja organizacji jej nie obejmuje.
  en: |
    The item keeps the periodic refresh of registry settings coming from
    group policy - that is, their fetching in the background, without waiting
    for a restart or a fresh sign-in.

    The category is medium, and I want to name what this item really is,
    because it sounds like a performance setting. It is the setting on which
    it depends how quickly a change of policy reaches the machine. With the
    refresh switched off, the machine works with the settings it found at
    startup, and everything decided afterwards waits.

    That is the real substance of the item. Group policy is a tool of
    response. When something has to be closed on every machine at once - a
    right taken away, a mechanism switched off, a setting tightened - it is
    done by policy on the assumption that it will take effect within the
    hour. A server that does not refresh policy in the background drops out
    of that assumption quietly.

    It weighs separately that such a machine is invisible to oversight. A
    report from the management server will show the policy was issued; on the
    machine it will not have been applied, and nothing will say so.

    Mind the value: the entry is named in the negative, so a zero means "do
    not switch the refresh off". The desired state is written with a zero.

    What an attacker gains while the item goes unmet: a machine that does not
    take tightened policy until a restart - that is, a window in which the
    organisation's response does not cover it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Odświeżanie w tle jest zachowaniem domyślnym,
    więc reguła najczęściej potwierdza stan istniejący, a nie wprowadza
    zmianę. Na maszynie, która nigdy tego nie wyłączała, po zastosowaniu nie
    zmienia się nic.

    Gdzie to cokolwiek zmieni, zmiana jest w kierunku zgodnym z zamysłem
    zarządzania: ustawienia zaczną docierać w ciągu zwykłego okresu
    odświeżania zamiast czekać na restart. Dla serwera, który bywa
    uruchomiony miesiącami, jest to różnica między „obowiązuje" a „będzie
    obowiązywać kiedyś".

    Uczciwe zastrzeżenie: jeżeli ktoś wyłączył odświeżanie celowo, zwykle
    zrobił to po to, żeby zasady nie przychodziły w środku pracy aplikacji.
    Cofnięcie tego nie psuje aplikacji, ale przywraca zachowanie, którego
    ktoś świadomie nie chciał — i to jest pytanie warte zadania, jeżeli
    audyt pokaże tu wartość niezgodną.

    Czego to nie psuje: zasad już zastosowanych, skryptów logowania,
    ustawień użytkownika ani pracy aplikacji.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption". Refreshing in the background is the default
    behaviour, so the rule most often confirms an existing state rather than
    introducing a change. On a machine that never switched it off, nothing
    changes when it is applied.

    Where it does change anything, the change goes in the direction
    management intends: settings begin arriving within the ordinary refresh
    period instead of waiting for a restart. For a server which is sometimes
    up for months, that is the difference between "is in force" and "will be
    in force sometime".

    An honest reservation: if somebody switched the refresh off on purpose,
    they usually did so to stop policy arriving in the middle of an
    application's work. Undoing that does not break the application, but it
    restores behaviour somebody deliberately did not want - and that is a
    question worth asking if the audit shows a non-compliant value here.

    What this does not break: policy already applied, logon scripts, user
    settings, or the work of applications.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - remote-management
  what_breaks:
    pl:
      - Na większości maszyn nic, bo odświeżanie w tle jest zachowaniem domyślnym i reguła je tylko potwierdza
      - Tam, gdzie ktoś wyłączył je celowo, zasady zaczną docierać w trakcie pracy zamiast czekać na restart
      - Jeżeli audyt pokaże wartość niezgodną, zapytaj kto i po co ją ustawił — zwykle chodziło o spokój aplikacji
      - Zasady już zastosowane, skrypty logowania i ustawienia użytkownika działają bez zmian
    en:
      - On most machines nothing, because the background refresh is the default behaviour and the rule only confirms it
      - Where somebody switched it off on purpose, policy will begin arriving during work instead of waiting for a restart
      - If the audit shows a non-compliant value, ask who set it and why - usually it was about leaving an application alone
      - Policy already applied, logon scripts and user settings work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Odświeżanie w tle zostało wyłączone świadomie, a decyzja ta nie została jeszcze przejrzana przez właściciela usługi
    en:
      - The background refresh was switched off deliberately and that decision has not yet been reviewed by the service owner
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is named in the negative: zero means "do not switch the
      # refresh off", so the desired state is written with a zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
      $name = 'NoBackgroundPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    $name = 'NoBackgroundPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Group policy is a tool of response: a tightened setting is expected to
    # reach every machine within the hour. A server that refreshes policy only
    # at startup drops out of that assumption quietly, and nothing reports it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoBackgroundPolicy' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc978526(v=technet.10)

notes:
  pl: |
    Brzmi jak ustawienie wydajnościowe, a decyduje o tym, jak szybko zmiana
    zasad dociera do maszyny. Bez odświeżania maszyna pracuje z tym, co
    zastała przy starcie, a wszystko zdecydowane później czeka na restart.

    Zasady grupy są narzędziem reagowania. Serwer uruchomiony miesiącami
    i nieodświeżający zasad wypada z tego założenia po cichu, a raport
    z serwera zarządzania pokaże, że zasada została wydana.

    Uwaga na wartość: wpis jest nazwany przecząco, więc stan pożądany jest
    zapisany zerem.
  en: |
    It sounds like a performance setting, yet it decides how quickly a change
    of policy reaches the machine. Without the refresh the machine works with
    what it found at startup, and everything decided afterwards waits for a
    restart.

    Group policy is a tool of response. A server up for months and not
    refreshing policy drops out of that assumption quietly, while the report
    from the management server will show the policy was issued.

    Mind the value: the entry is named in the negative, so the desired state
    is written with a zero.
