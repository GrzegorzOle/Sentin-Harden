id: win10-defender-asr-office-win32-api

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wywołań funkcji systemowych z makr w dokumentach
    en: System function calls from document macros blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zabrania makrom w dokumentach sięgania wprost po funkcje
    systemowe.

    Jest to domknięcie dwóch poprzednich punktów. Makro, które nie może
    uruchomić programu ani zapisać pliku wykonywalnego, wciąż może
    wykonać robotę samo — wywołując funkcje systemowe bezpośrednio,
    bez pośrednictwa jakiegokolwiek programu. Cała droga mieści się wtedy
    wewnątrz procesu pakietu biurowego i nie zostawia śladu w postaci
    nowego procesu.

    Jest to droga trudniejsza do zauważenia niż obie poprzednie, bo nie
    powstaje nic, na co można spojrzeć. Nie ma nowego procesu, nie ma
    nowego pliku, nie ma wpisu w autostarcie. Jest jeden otwarty dokument
    i czynność wykonywana z jego wnętrza.

    Odnotowuję, że reguła dotyczy makr, a nie samego pakietu biurowego.
    Program działa dalej i wywołuje funkcje systemowe tak jak zawsze —
    zakaz dotyczy wyłącznie kodu uruchamianego z dokumentu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    czynności systemowych wprost z otwartego dokumentu, bez tworzenia
    niczego, co dałoby się zauważyć.
  en: |
    The rule forbids macros in documents to reach straight for system functions.

    It is the closing of the two items before. A macro that can neither start a program nor write an executable
    file may still do the work itself - calling system functions outright, with no program between. The whole road
    then lies within the office suite's own process and leaves no trace in the shape of a new process.

    It is a road harder to notice than either of the two before, nothing coming about to be looked at. There is no
    new process, no new file, no entry in the self-starting list. There is one open document and an act carried
    out from within it.

    I set down that the rule touches macros and not the office suite itself. The program goes on working and calls
    system functions as it always did - the forbidding touches the code started from a document alone.

    What an attacker gains while the item goes unmet: the carrying out of system acts straight from an open
    document, with nothing made that could be noticed.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są makra
    własnej roboty.

    Sięganie po funkcje systemowe z makra nie jest w organizacjach
    rzadkością. Robią to makra wyświetlające własne okna, makra
    sprawdzające, czy plik jest otwarty przez kogoś innego, makra
    mierzące czas i makra odczytujące ustawienia maszyny. Wszystkie
    przestaną działać.

    Jest to punkt, który uderza w arkusze najstarsze i najbardziej
    zakorzenione — te pisane lata temu, których autor bywa już poza
    organizacją. Skutkiem jest dokument, który otwiera się, ale nie robi
    tego, po co powstał.

    Sprawdzić trzeba wprost: czy w obiegu są arkusze z makrami pisanymi
    u siebie. Inwentaryzacja odpowie na pytanie o pakiet biurowy, ale nie
    o zawartość arkuszy — tu potrzebna jest odpowiedź od ludzi.

    Odnotowuję, że wyjątki wskazuje się po ścieżce, więc arkusz kluczowy
    da się zachować bez rezygnacji z reguły.

    Czego to nie psuje: pracy samego pakietu biurowego, otwierania
    dokumentów, makr nieużywających funkcji systemowych, drukowania,
    logowania.
  en: |
    The class is "needs review", and the object of the review is macros of one's own making.

    The reaching for system functions from a macro is within bodies no rare thing. It is done by macros showing
    windows of their own, macros seeing whether a file is open by somebody else, macros measuring time and macros
    reading the machine's settings. All will cease to work.

    It is an item that strikes at the oldest and the most rooted sheets - those written years ago, whose author is
    at times outside the body by now. The consequence is a document that opens but does not do what it came about
    for.

    What has to be reviewed is plain: whether sheets with macros written at home are in circulation. The taking of
    stock will answer the question about the office suite but not about the sheets' contents - here an answer from
    people is needed.

    I set down that exceptions are named by a path, so a key sheet may be kept without giving the rule up.

    What this does not break: the office suite's own working, the opening of documents, macros not using system
    functions, printing, or logging on.

implementation_consequences:
  impact_areas:
    - macros-and-documents
  what_breaks:
    pl:
      - Makra wyświetlające własne okna i makra sprawdzające, czy plik jest otwarty przez kogoś innego, przestają działać
      - Makra mierzące czas i odczytujące ustawienia maszyny zatrzymują się tak samo
      - Uderza to w arkusze najstarsze, pisane lata temu, których autor bywa już poza organizacją
      - Wyjątki wskazuje się po ścieżce, więc arkusz kluczowy da się zachować bez rezygnacji z reguły
      - Praca samego pakietu biurowego, otwieranie dokumentów, drukowanie, logowanie i udziały plikowe pozostają bez zmian
    en:
      - Macros showing windows of their own and macros seeing whether a file is open by somebody else cease to work
      - Macros measuring time and reading the machine s settings halt the same way
      - It strikes at the oldest sheets, written years ago, whose author is at times outside the body by now
      - Exceptions are named by a path, so a key sheet may be kept without giving the rule up
      - The office suite s own working, the opening of documents, printing, logging on and file shares stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W obiegu są arkusze z makrami pisanymi u siebie i nikt nie wie, które z nich sięgają po funkcje systemowe
    en:
      - Sheets with macros written at home are in circulation and nobody knows which of them reach for system functions
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła domyka trójkę o pakiecie biurowym. Pierwsza zabrania uruchomić,
    druga zapisać, ta — zrobić to samemu. Warto, żeby aplikacja pokazała
    je jako komplet, bo każda z osobna zostawia drogę.

    Argument wart postawienia wprost dotyczy tego, czego tu nie widać.
    Przy dwóch poprzednich powstaje nowy proces albo nowy plik, czyli coś,
    na co ochrona może spojrzeć. Tutaj nie powstaje nic — cała czynność
    mieści się w procesie, który już działa i który jest programem
    prawidłowym.

    Odnotowuję, że to właśnie ta reguła ma w tej trójce największy
    potencjał zaskoczenia. Nie dlatego, że jest ostrzejsza, lecz dlatego,
    że trafia w arkusze pisane dawno, o których nikt nie pamięta, dopóki
    nie przestaną działać.
  en: |
    The rule closes the three about the office suite. The first forbids the starting, the second the writing, this
    - the doing of it oneself. It is well that the application show them as a set, each apart leaving a road.

    The argument worth putting outright touches what is not to be seen here. At the two before, a new process or a
    new file comes about, which is to say something the protection may look at. Here nothing comes about - the
    whole act lies within a process that already runs and that is a proper program.

    I set down that it is just this rule which in the three holds the greatest scope for surprise. Not for its
    being the sharper, but for its striking at sheets written long ago, which nobody calls to mind until they
    cease to work.
