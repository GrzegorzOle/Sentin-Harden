id: win2016-smb1-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Obsługa protokołu SMB w wersji 1 wyłączona
    en: SMB version 1 support switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa z maszyny obsługę pierwszej wersji protokołu udostępniania
    plików, wyłączając składnik systemu, który ją wnosi.

    Kategoria krytyczna i na tym wydaniu systemu ten punkt jest
    najważniejszym z całej paczki. Powód jest prosty: na serwerze 2016
    składnik ten jest obecny i włączony domyślnie. W wydaniach późniejszych
    został z instalacji domyślnej usunięty, więc tam reguła zwykle tylko
    potwierdza stan zastany. Tutaj ona naprawdę coś zmienia.

    Protokół w wersji pierwszej pochodzi z czasów, w których sieć lokalna
    uchodziła za obszar zaufany. Nie potrafi sprawdzić, czy rozmówca jest
    tym, za kogo się podaje, nie zabezpiecza treści przed podmianą w drodze
    i nie ma mechanizmu, którym dałoby się to naprawić. To nie jest wersja
    słabsza — to jest wersja zaprojektowana pod inne założenia.

    Praktyczny skutek jest dwojaki. Po pierwsze, przechwycona sesja daje się
    zmodyfikować w locie, więc plik pobrany z udziału nie musi być tym, który
    tam leży. Po drugie, to właśnie tą drogą rozchodziły się najgłośniejsze
    epidemie ostatnich lat — maszyna zarażała następną bez udziału
    kogokolwiek, po otwartym porcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    rozejścia się po sieci bez udziału użytkownika i bez znajomości
    jakiegokolwiek hasła, a do tego możliwość podmiany treści przesyłanej
    między maszynami.
  en: |
    The item removes support for the first version of the file-sharing
    protocol from the machine by switching off the system component that
    provides it.

    The category is critical, and on this release of the system this is the
    single most important item in the whole pack. The reason is simple: on
    Server 2016 the component is present and enabled by default. In later
    releases it was taken out of the default installation, so there the rule
    usually only confirms what it finds. Here it genuinely changes something.

    The first version of the protocol comes from a time when the local network
    counted as trusted ground. It cannot check that the other side is who it
    claims to be, it does not protect content against substitution in transit,
    and it has no mechanism by which that could be fixed. This is not a weaker
    version - it is a version designed for different assumptions.

    The practical effect is twofold. First, an intercepted session can be
    altered in flight, so a file fetched from a share need not be the file that
    lies there. Second, this is the road down which the loudest epidemics of
    recent years travelled - one machine infecting the next with nobody
    involved, through an open port.

    What an attacker gains while the item goes unmet: a way of spreading across
    the network with no user involved and no password known, and on top of that
    the ability to alter content passing between machines.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i na tym roczniku jest to klasa
    zasłużona, a nie ostrożnościowa. Wersja pierwsza bywa tu jedyną, którą
    rozumie druga strona.

    Do sprawdzenia przed zmianą: urządzenia wielofunkcyjne skanujące do
    udziału, sterowniki maszyn produkcyjnych i aparatury pomiarowej, systemy
    wbudowane z własnym systemem operacyjnym, starsze rozwiązania kopii
    zapasowych oraz stacje z systemami sprzed wielu lat. Każda z tych rzeczy
    potrafi mówić wyłącznie pierwszą wersją i po zmianie po prostu przestanie
    się łączyć.

    Objaw jest tu szczególnie mylący. Połączenie nie zgłasza, że protokół
    został odrzucony — zgłasza, że nie znaleziono ścieżki sieciowej albo że
    odmówiono dostępu. Wygląda to na awarię sieci albo na problem
    z uprawnieniami i tak bywa diagnozowane przez pierwsze pół dnia.

    Sposób sprawdzenia jest dostępny i warto go użyć przed wyłączeniem. System
    potrafi odnotowywać w dzienniku klientów łączących się pierwszą wersją,
    więc listę urządzeń da się zebrać z maszyny, a nie z pamięci zespołu.

    Zmiana wymaga ponownego uruchomienia maszyny i dopiero wtedy działa.
    Odwrócenie również wymaga restartu.
  en: |
    The class is "needs planned rollout", and on this vintage that class is
    earned rather than cautious. The first version is sometimes the only one
    the other side understands.

    To check before the change: multifunction devices scanning to a share,
    controllers of production machinery and measuring equipment, embedded
    systems with an operating system of their own, older backup arrangements,
    and workstations running systems many years old. Each of those may speak
    the first version alone and will simply stop connecting after the change.

    The symptom here is particularly misleading. The connection does not report
    that the protocol was refused - it reports that the network path was not
    found or that access was denied. That looks like a network fault or a
    permissions problem, and tends to be diagnosed as one for the first half
    day.

    There is a way to check, and it is worth using before switching anything
    off. The system can record in the log the clients connecting with the first
    version, so the list of devices can be gathered from the machine rather
    than from the team's memory.

    The change needs the machine restarted and works only then. Undoing it
    needs a restart as well.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenia wielofunkcyjne skanujące do udziału pierwszą wersją protokołu przestają się łączyć
      - Sterowniki maszyn, aparatura pomiarowa i systemy wbudowane tracą dostęp do udziałów na tej maszynie
      - Objaw jest mylący — połączenie zgłasza brak ścieżki sieciowej albo odmowę dostępu, a nie odrzucenie protokołu
      - Na tym wydaniu składnik jest obecny i włączony domyślnie, więc reguła zmienia stan, a nie tylko go potwierdza
    en:
      - Multifunction devices scanning to a share with the first version of the protocol stop connecting
      - Machine controllers, measuring equipment and embedded systems lose access to shares on this machine
      - The symptom is misleading - the connection reports a missing network path or access denied rather than a refused protocol
      - On this release the component is present and enabled by default, so the rule changes the state rather than merely confirming it
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z udziałów na tej maszynie korzystają urządzenia lub systemy mówiące wyłącznie pierwszą wersją protokołu
      - Nie zebrano jeszcze listy klientów łączących się pierwszą wersją, a maszyna udostępnia pliki szerokiemu gronu
    en:
      - Devices or systems that speak only the first version of the protocol use the shares on this machine
      - The list of clients connecting with the first version has not yet been gathered and the machine shares files widely
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    # Get-WindowsOptionalFeature requires elevation. Without try/catch a denied
    # call returns $null, which would look exactly like "feature not present"
    # and report a false PASS.
    try {
      $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction Stop
      if ($null -eq $f) { 'ABSENT' } else { $f.State }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(Disabled|ABSENT)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue
    [pscustomobject]@{
      feature = 'SMB1Protocol'
      state   = if ($null -eq $f) { 'ABSENT' } else { $f.State.ToString() }
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On this release the component is on by default, so this genuinely changes
    # the machine. Gather the list of clients still speaking the first version
    # before running it - afterwards they report a missing path, not a refused
    # protocol.
    Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.state -eq 'Enabled') {
      Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Ten punkt i dwa kolejne — serwer pierwszej wersji oraz sterownik jej
    klienta — dotyczą tej samej rzeczy widzianej z trzech stron. Składnik
    systemu wnosi obsługę, wpis serwera decyduje o stronie przyjmującej,
    sterownik klienta o stronie łączącej się na zewnątrz. Wyłączenie
    składnika jest z nich najszersze.

    Brak składnika i składnik wyłączony to dwa różne stany maszyny, ale dla
    tego punktu oba są poprawne — dlatego porównanie jest wyrażeniem, a nie
    równością.

    Polecenie audytu odróżnia brak uprawnień od braku składnika. Bez tego
    rozróżnienia odmowa dostępu wyglądałaby jak nieobecność składnika, czyli
    jak zgodność — i byłby to najgorszy możliwy błąd w tej regule.
  en: |
    This item and the two that follow - the first-version server and its client
    driver - concern the same thing seen from three sides. The system component
    provides the support, the server entry decides the receiving side, the
    client driver the side that connects outwards. Switching off the component
    is the broadest of the three.

    A component absent and a component disabled are two different states of the
    machine, but for this item both are correct - which is why the comparison
    is an expression rather than an equality.

    The audit command tells a missing privilege from a missing component.
    Without that distinction, access denied would look like the component being
    absent, that is, like compliance - and that would be the worst possible
    error in this rule.
