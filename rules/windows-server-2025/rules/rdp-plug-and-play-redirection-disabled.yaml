id: win2025-rdp-plug-and-play-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie urządzeń rozpoznawanych samoczynnie w sesji zdalnej wyłączone
    en: Redirection of automatically recognised devices in remote sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie do sesji zdalnej urządzeń, które
    system rozpoznaje samoczynnie po wpięciu — aparatów, skanerów,
    odtwarzaczy, urządzeń przenośnych.

    Punkt ten różni się od pozostałych w tej grupie jedną rzeczą:
    podłączenie urządzenia pociąga za sobą wczytanie sterownika. Nie
    chodzi więc o strumień danych, tylko o kod wykonywany w jądrze
    serwera, wprowadzony tam przez to, co ktoś wpiął u siebie na
    stanowisku.

    Na serwerze waży to wyraźnie więcej niż na stanowisku roboczym.
    Błąd w sterowniku urządzenia przenośnego na czyimś laptopie kończy
    się na tym laptopie. Ten sam błąd wykorzystany na serwerze terminali
    dotyczy maszyny, na której pracuje jednocześnie kilkadziesiąt osób,
    a podniesienie uprawnień w jądrze daje władzę nad wszystkimi ich
    sesjami naraz.

    Droga jest przy tym wygodna dla napastnika z innego powodu:
    urządzenie wpina się po swojej stronie, a skutek powstaje po
    stronie serwera. Nie trzeba mieć dostępu do serwerowni ani nawet
    znajdować się w tym samym budynku.

    Trzeba natomiast powiedzieć, czego ten punkt nie obejmuje, żeby
    raport nie sugerował więcej, niż wnosi. Karty inteligentne, drukarki
    i dyski mają własne ustawienia i nie są tym punktem wyłączane.
    Wyłączenie przekierowania urządzeń rozpoznawanych samoczynnie nie
    jest zamknięciem całej drogi urządzeń do sesji — jest zamknięciem
    jednej z nich.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość doprowadzenia do wczytania sterownika w jądrze serwera
    przez wpięcie urządzenia u siebie na stanowisku.
  en: |
    The setting cuts off the joining to the remote session of devices the system recognises of
    itself at the plugging in - cameras, scanners, players, carried devices.

    This item differs from the rest of the group in one thing: the joining of a device draws after
    it the loading of a driver. It is therefore not about a stream of data but about code carried
    out in the server's kernel, brought there by what somebody plugged in at their own station.

    On a server that weighs plainly more than at a working station. A fault in the driver of a
    carried device on somebody's laptop ends upon that laptop. The same fault used on a terminal
    server bears on a machine whereon dozens of people work at once, and a raising of rights in the
    kernel gives power over all their sessions together.

    The road is withal handy for the attacker for another reason: the device is plugged in at their
    own side and the effect arises at the server's side. One need hold no access to the server room
    nor even be in the same building.

    It must be said, though, what this item does not take in, lest the report suggest more than it
    brings. Smart cards, printers and drives have settings of their own and are not switched off by
    this item. The switching off of the redirection of devices recognised of themselves is not the
    shutting of the whole road of devices into the session - it is the shutting of one of them.

    What an attacker gains while the item goes unmet: the means of bringing about the loading of a
    driver in the server's kernel by plugging a device in at their own station.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy praca w sesji na tym serwerze polega
    na sięganiu po urządzenie wpięte u człowieka na stanowisku.

    Na serwerze, do którego łączą się wyłącznie administratorzy, tak nie
    jest i zmiana przejdzie niezauważona.

    Na serwerze terminali obsługującym pracę merytoryczną bywa inaczej
    i przypadki są konkretne. Skanowanie dokumentów w aplikacji
    uruchomionej w sesji — obieg dokumentów, kancelaria, archiwum
    zakładowe — opiera się dokładnie na tym przekierowaniu. Tak samo
    wgrywanie zdjęć z aparatu albo pobranie danych z urządzenia
    pomiarowego rozpoznawanego jako urządzenie przenośne.

    Objaw jest ten sam we wszystkich tych przypadkach i łatwy do
    powiązania ze zmianą: urządzenia po prostu nie ma na liście
    w aplikacji. Aplikacja nie zgłasza problemu z przekierowaniem, tylko
    nie znajduje skanera.

    Rzecz warta sprawdzenia przed zmianą, a często pomijana: czy ktoś na
    tym serwerze skanuje. Skanowanie bywa czynnością wykonywaną przez
    kilka osób w sekretariacie i przez nikogo więcej, więc łatwo o nim
    zapomnieć przy przeglądzie, a zgłoszenie przychodzi dopiero wtedy,
    gdy trzeba zeskanować coś pilnego.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane zachowują podłączone urządzenia do końca.
  en: |
    One thing needs checking: whether work in a session on this server rests on the reaching for a
    device plugged in at a person's station.

    On a server that administrators alone connect to it is not so, and the change will go by
    unnoticed.

    On a terminal server serving work of substance it is at times otherwise, and the cases are
    definite. The scanning of documents in an application run in the session - a flow of documents,
    a chancery, a works archive - rests on just this redirection. So too does the loading up of
    pictures from a camera or the taking of readings off a device of measuring recognised as a
    carried device.

    The symptom is the same in all those cases and easy to tie to the change: the device is simply
    not on the list in the application. The application reports no trouble with redirection, it
    merely does not find the scanner.

    A thing worth checking before the change and often passed over: whether anybody on this server
    scans. Scanning is at times an act done by a few people in the office and by nobody else, so it
    is easy to forget at the review, and the report comes only when something urgent must be
    scanned.

    The change comes into force straight away and is undone at once. Sessions already opened keep
    their joined devices to their end.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Skanowanie dokumentów w aplikacji uruchomionej w sesji przestanie być możliwe
      - Wgranie zdjęć z aparatu albo danych z urządzenia pomiarowego wpiętego u człowieka nie zadziała
      - Urządzenia po prostu nie ma na liście w aplikacji, bez komunikatu o przekierowaniu
      - Karty inteligentne, drukarki i dyski mają własne ustawienia i nie są tym punktem wyłączane
      - Sesje już nawiązane zachowują podłączone urządzenia do końca
    en:
      - The scanning of documents in an application run in the session stops being possible
      - The loading up of pictures from a camera or readings off a device of measuring plugged in at a person's end will not work
      - The device is simply not on the list in the application, with no message about redirection
      - Smart cards, printers and drives have settings of their own and are not switched off by this item
      - Sessions already opened keep their joined devices to their end
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze terminali skanuje się dokumenty urządzeniem wpiętym u człowieka na stanowisku
      - Aplikacja w sesji pobiera dane z urządzenia pomiarowego rozpoznawanego jako urządzenie przenośne
    en:
      - On a terminal server documents are scanned with a device plugged in at a person's station
      - An application in the session takes readings off a device of measuring recognised as a carried device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisablePNPRedir'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisablePNPRedir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisablePNPRedir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Punkt różni się od reszty grupy tym, że podłączenie urządzenia
    pociąga wczytanie sterownika. Nie chodzi o strumień danych, tylko
    o kod w jądrze serwera, wprowadzony przez to, co ktoś wpiął u siebie.

    Napastnik wpina urządzenie po swojej stronie, a skutek powstaje po
    stronie serwera — bez dostępu do serwerowni i bez obecności
    w budynku.

    Czego punkt nie obejmuje: kart inteligentnych, drukarek i dysków.
    Te mają własne ustawienia, więc raport nie powinien sugerować
    zamknięcia całej drogi urządzeń do sesji.
  en: |
    The item differs from the rest of the group in that the joining of a device draws after it the
    loading of a driver. It is not about a stream of data but about code in the server's kernel,
    brought in by what somebody plugged in at their own end.

    The attacker plugs the device in at their own side and the effect arises at the server's side -
    with no access to the server room and no presence in the building.

    What the item does not take in: smart cards, printers and drives. Those have settings of their
    own, so the report should not suggest the shutting of the whole road of devices into the
    session.
