id: win11-rdp-password-saving-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Connection Client
  title:
    pl: Zapisywanie haseł w kliencie pulpitu zdalnego zablokowane
    en: Saving passwords in the remote desktop client blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Klient pulpitu zdalnego proponuje zapamiętanie hasła do maszyny, z którą się
    łączy. Zapisane poświadczenie trafia do magazynu poświadczeń użytkownika
    i przy kolejnych połączeniach jest podawane automatycznie.

    Znaczy to, że każdy, kto ma dostęp do sesji tego użytkownika, ma zarazem
    dostęp do wszystkich maszyn, do których ten użytkownik kiedykolwiek zapisał
    hasło — bez znajomości któregokolwiek z tych haseł. Wystarczy uruchomić
    klienta i się połączyć.

    Skutek jest poważniejszy, niż wygląda, bo pulpitu zdalnego używa się przede
    wszystkim do serwerów i maszyn zarządzających. Przejęta stacja robocza
    przestaje być wtedy jedną maszyną, a staje się kluczem do listy maszyn
    najważniejszych w organizacji — i to jest zwykle ta droga, którą atak
    przechodzi ze stanowiska na serwerownię.
  en: |
    The remote desktop client offers to remember the password for the machine it
    connects to. The saved credential goes into the user's credential store and is
    supplied automatically on later connections.

    This means anybody with access to that user's session also has access to every
    machine the user ever saved a password for - without knowing any of those
    passwords. Starting the client and connecting is enough.

    The consequence is graver than it looks, because remote desktop is used above
    all for servers and management machines. A compromised workstation then stops
    being one machine and becomes a key to the list of the organisation's most
    important ones - and that is usually the road by which an attack passes from a
    desk to the server room.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, ilu osobom zapisane hasła zastępują dziś pamiętanie
    ich, bo dla nich zmiana jest natychmiastowa i dotkliwa.

    Po wdrożeniu klient przestaje proponować zapamiętanie hasła, a pole wyboru
    znika. Każde połączenie wymaga podania poświadczeń od nowa. Osoba, która
    w ciągu dnia łączy się z kilkunastoma maszynami, odczuje to bardzo wyraźnie.

    Typowa reakcja jest przewidywalna i warto ją wyprzedzić: hasła zaczynają
    trafiać do pliku tekstowego albo notatki obok klawiatury. Wdrożenie tego
    punktu bez wskazania ludziom menedżera haseł zwykle pogarsza sytuację,
    zamiast ją poprawiać, i to jest właściwy powód, dla którego punkt nie idzie
    hurtem.

    Poświadczenia zapisane wcześniej pozostają w magazynie i nadal działają.
    Ustawienie blokuje zapisywanie nowych, a nie kasuje stare — istniejące
    trzeba usunąć osobno, jeśli taka jest decyzja.
  en: |
    What needs checking is how many people rely on saved passwords instead of
    remembering them, because for them the change is immediate and keenly felt.

    Once applied, the client stops offering to remember a password and the
    checkbox disappears. Every connection requires the credentials again. Somebody
    connecting to a dozen or so machines during the day will feel it very plainly.

    The typical response is predictable and worth getting ahead of: passwords start
    going into a text file or a note beside the keyboard. Applying this item
    without pointing people at a password manager usually makes things worse
    rather than better, and that is the real reason it does not go in bulk.

    Credentials saved earlier stay in the store and keep working. The setting
    blocks saving new ones rather than deleting old ones - existing entries have
    to be removed separately if that is the decision.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Klient przestanie proponować zapamiętanie hasła i każde połączenie wymaga podania go od nowa
      - Osoby łączące się z wieloma maszynami dziennie będą wpisywać poświadczenia wielokrotnie
      - Poświadczenia zapisane wcześniej pozostaną w magazynie i trzeba je usunąć osobno
    en:
      - The client stops offering to remember a password and every connection requires it afresh
      - People connecting to many machines a day will type credentials repeatedly
      - Credentials saved earlier stay in the store and have to be removed separately
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zespół nie ma menedżera haseł i wdrożenie skończy się zapisywaniem haseł w plikach
      - Stanowisko łączy się z wieloma maszynami w sposób zautomatyzowany, opierając się na zapisanych poświadczeniach
    en:
      - The team has no password manager and applying this will end in passwords kept in files
      - The station connects to many machines in an automated way, relying on saved credentials
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'DisablePasswordSaving'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'DisablePasswordSaving'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordSaving' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-client-access

notes:
  pl: |
    Reguła dotyczy klienta, a nie serwera, i przez to obowiązuje na maszynie,
    z której się łączymy, a nie na tej, do której. W raporcie stoi w sekcji
    pulpitu zdalnego obok reguł serwerowych i łatwo pomylić kierunek — stanowisko
    bez usługi pulpitu zdalnego również podlega temu punktowi i również powinno
    go spełniać.

    Punkt sam w sobie nie kasuje zapisanych poświadczeń i nie udaje, że to robi.
    Decyzja o ich usunięciu jest osobna i świadoma, bo bywa kosztowna.
  en: |
    The rule concerns the client, not the server, and so it applies on the machine
    we connect from rather than the one we connect to. In the report it stands in
    the remote desktop section next to server-side rules and the direction is
    easily mixed up - a station with no remote desktop service is also subject to
    this item and should also satisfy it.

    The item does not delete saved credentials by itself and does not pretend to.
    Deciding to remove them is separate and deliberate, because it can be costly.
