id: win10-winrm-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania poleceniami wyłączona
    en: The service of ordering the machine from afar by commands switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą polecenia wykonywane na maszynie
    zdalnie, czyli podstawę zdalnego zarządzania powłoką.

    Zakres tej usługi jest pełny. Kto potrafi się uwierzytelnić, wykonuje
    polecenia z uprawnieniami konta, z którym się połączył, i nie ma tu
    podziału na czynności bezpieczne i pozostałe.

    Zagrożenie pierwsze to ruch boczny. Poświadczenia zdobyte na jednej
    maszynie pozwalają wykonać polecenia na każdej innej, która tę usługę
    ma uruchomioną, bez potrzeby zdobywania czegokolwiek więcej.

    Zagrożenie drugie to niewidoczność. Polecenie wykonane tą drogą nie
    tworzy sesji interaktywnej i nie pokazuje się nikomu przy maszynie,
    więc działanie napastnika przebiega bez świadka.

    Zagrożenie trzecie to uruchamianie kodu bez pliku. Powłoka pozwala
    wykonać kod przekazany wprost w poleceniu, więc na dysku nie zostaje
    nic, po czym dałoby się poznać atak.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    poleceń na maszynie za same poświadczenia, bez śladu na dysku.
  en: |
    The setting switches off the service taking in orders worked upon the machine from afar - the ground of the
    ordering of the shell from afar.

    The reach of that service is a full one. Whoever can warrant themselves works orders with the rights of the
    reckoning they joined with, and there is here no parting of safe doings from the rest.

    The first danger is movement sideways. Warrants won upon one machine let orders be worked upon every other
    that has this service set going, with no need of winning anything further.

    The second danger is unseenness. An order worked by that road makes no session to be spoken with and shows
    itself to nobody at the machine, so an attacker's doing goes on with no witness.

    The third danger is the setting going of code with no file. The shell lets code handed over in the order
    itself be worked, so there stays upon the disk nothing by which the assault might be known.

    What an attacker gains while the item goes unmet: the working of orders upon the machine for warrants alone,
    with no trace upon the disk.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo tam, gdzie usługa ta jest
    używana, stanowi podstawę zarządzania.

    Miejscem pierwszym są narzędzia zarządzania wykonujące polecenia na
    maszynach: inwentaryzacja, wdrożenia, zbieranie stanu, naprawy
    zdalne. Po zmianie przestaną działać wobec tej maszyny, a zgłoszą to
    jako brak łączności.

    Miejscem drugim są sesje otwarte w chwili zmiany. Zatrzymanie usługi
    zrywa je natychmiast, łącznie z tą, z której polecenie jest
    wykonywane.

    Miejscem trzecim jest zdalne zbieranie dzienników i danych
    diagnostycznych. Bywa to jedyna droga dostępu do maszyny, która
    przestała odpowiadać na zwykłe połączenia.

    Odnotowuję, że w środowisku domenowym usługa ta bywa włączana zasadą
    i wyłączenie jej miejscowo zostanie cofnięte przy najbliższym
    odświeżeniu zasad. Trzeba zmienić zasadę, a nie maszynę.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy programów, sieci, udostępniania plików,
    drukowania, logowania przy maszynie.
  en: |
    The class is "needs a planned rollout", for where that service is used it is the ground of the ordering.

    The first place is tools of ordering that work orders upon machines: the telling of holdings, rollouts, the
    gathering of state, mendings from afar. After the change they will cease to work against this machine and will
    give it out as a want of joining.

    The second place is sessions open at the hour of the change. The stopping of the service breaks them at once,
    that one among them this order is worked from.

    The third place is the gathering from afar of records and matter for the telling of faults. It is at times the
    one road to a machine that has ceased to answer common joinings.

    I set down that in a domain's keeping that service is at times turned on by policy, and its switching off upon
    the spot will be undone at the next making new of the policy. The policy is to be changed and not the machine.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the work of programs, the network, the giving out of files, printing, or logging on
    at the machine.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Narzędzia zarządzania wykonujące polecenia na maszynach przestaną działać wobec tego stanowiska
      - Zgłoszą to jako brak łączności, więc przyczyna nie będzie oczywista
      - Sesje otwarte w chwili zmiany zostaną zerwane, łącznie z tą, z której polecenie jest wykonywane
      - Zdalne zbieranie dzienników i danych diagnostycznych straci drogę dostępu
      - W środowisku domenowym zasada może włączyć usługę z powrotem i wtedy trzeba zmienić zasadę, a nie maszynę
    en:
      - Tools of ordering that work orders upon machines will cease to work against this station
      - They will give it out as a want of joining, so the cause will not be plain
      - Sessions open at the hour of the change will be broken, that one among them this order is worked from
      - The gathering from afar of records and matter for the telling of faults will lose its road
      - In a domain s keeping a policy may turn the service back on, and then the policy is to be changed and not the machine
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest zarządzana zdalnie tą drogą i nie ma innego narzędzia wykonującego na niej polecenia
      - Zdalne zbieranie dzienników z tej maszyny idzie tą drogą
    en:
      - The machine is ordered from afar by that road and there is no other tool working orders upon it
      - The gathering from afar of records from this machine goes by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WinRM'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off a session from afar this order may itself be
    # running within.
    Stop-Service -Name 'WinRM' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WinRM' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WinRM' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/portal

notes:
  pl: |
    Reguła wymaga tego samego ostrzeżenia co punkt o powłoce zdalnej:
    polecenie zrywa sesję, z której jest wykonywane. Aplikacja musi
    pokazać to przed uruchomieniem, bo skutek jest pewny.

    Argument wart postawienia wprost dotyczy ruchu bocznego. Poświadczenia
    zdobyte na jednej maszynie wystarczają do wykonania poleceń na
    każdej innej z tą usługą, więc punkt ten ogranicza nie pierwsze
    wejście, tylko to, co po nim następuje.

    Odnotowuję środowisko domenowe. Usługa bywa włączana zasadą,
    a wyłączenie miejscowe zostanie cofnięte przy najbliższym odświeżeniu.
    Aplikacja powinna to powiedzieć, zamiast pokazywać punkt jako
    spełniony przez chwilę.
  en: |
    The rule calls for the same warning as the item about the shell from afar: the order breaks the session it is
    worked from. The application must show it before the setting going, the upshot being a sure one.

    The argument worth putting outright touches movement sideways. Warrants won upon one machine suffice for the
    working of orders upon every other with that service, so this item bounds not the first coming in but what
    follows it.

    I set down a domain's keeping. The service is at times turned on by policy, and a switching off upon the spot
    will be undone at the next making new. The application ought to say so rather than show the item as met for a
    while.
