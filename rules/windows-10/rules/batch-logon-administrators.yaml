id: win10-batch-logon-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie w trybie wsadowym zastrzeżone dla administratorów
    en: Signing in as a batch job reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo logowania w trybie wsadowym dla
    administratorów lokalnych.

    Logowanie wsadowe jest sposobem, w jaki harmonogram zadań uruchamia
    pracę w czyimś imieniu. Konto nie loguje się wtedy do pulpitu ani
    przez sieć — system tworzy dla niego sesję bez interfejsu, wyłącznie
    po to, żeby wykonać zaplanowane zadanie.

    Prawo to jest warunkiem trwałości napastnika na maszynie. Zadanie
    zaplanowane przeżywa restart, uruchamia się samo i nie wymaga niczyjej
    obecności. Konto, które nie może się zalogować wsadowo, nie może
    zostawić po sobie takiego zadania działającego pod własną tożsamością.

    Odnotowuję, że zawężenie wykazu nie zamyka harmonogramu zadań jako
    takiego. Zadania uruchamiane pod kontem systemowym działają dalej, bo
    konto systemowe nie przechodzi przez ten mechanizm.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany, z pustym włącznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób na
    pozostawienie zadania, które wykona jego kod po każdym restarcie.
  en: |
    The setting reserves the right of signing in as a batch job to the local administrators.

    The batch signing in is the manner in which the timetable of tasks runs work in somebody's name. The account
    does not then sign in to a desktop nor over the network - the system makes for it a session without a face,
    solely that a task laid down may be carried out.

    That right is the condition of an attacker's lasting upon a machine. A task laid down outlives a restart, runs
    of itself and calls for nobody's presence. An account that cannot sign in as a batch job cannot leave behind
    it such a task working under a name of its own.

    I set down that the narrowing of the list does not shut the timetable of tasks as such. Tasks run under the
    system's own account work on, that account not passing through this mechanism.

    The check takes a list narrower than the one called for, an empty one included.

    What an attacker gains while the item goes unmet: a way of leaving a task that will carry out their code after
    every restart.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są zadania
    zaplanowane uruchamiane pod kontami innymi niż systemowe.

    Miejscem najczęstszym są zadania administracyjne dopisane ręcznie:
    porządkowanie katalogów, wysyłanie raportów, synchronizacja danych.
    Osoba, która je zakładała, wskazała własne konto albo konto
    serwisowe i prawo zostało nadane przy pierwszym zapisaniu zadania.
    Po zmianie takie zadanie przestanie się uruchamiać.

    Objaw jest charakterystyczny: harmonogram pokazuje zadanie jako
    zakończone niepowodzeniem z kodem mówiącym o braku prawa do
    logowania, a nie o błędzie samego skryptu. Warto to wymienić, bo
    diagnoza prowadzi wtedy najpierw w stronę skryptu.

    Sprawdzenie polega na przejrzeniu zadań zaplanowanych przed zmianą
    i wypisaniu kont, pod którymi działają.

    Skutek pojawia się przy następnym uruchomieniu zadania.

    Czego to nie psuje: zadań pod kontem systemowym, logowania, usług,
    dostępu do plików, drukowania.
  en: |
    The class is "needs review", and the object of the review is the tasks laid down that run under accounts other
    than the system's.

    The commonest place is tasks of administration added by hand: the tidying of folders, the sending of reports,
    the keeping of data in step. Whoever laid them down named an account of their own or a service account, and
    the right was granted at the first writing down of the task. After the change such a task will cease to run.

    The mark of it is telling: the timetable shows the task as ended in failure with a code speaking of a right of
    signing in that is wanting and not of a fault in the script itself. That is worth naming, the looking into it
    leading first toward the script.

    The review comes down to a going through of the tasks laid down before the change and a writing out of the
    accounts they work under.

    The consequence shows at the next running of the task.

    What this does not break: tasks under the system's own account, logging on, services, the way to files, or
    printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zadania zaplanowane pod kontem osobowym albo serwisowym przestaną się uruchamiać
      - Harmonogram pokaże je jako zakończone niepowodzeniem z kodem o braku prawa do logowania, nie o błędzie skryptu
      - Diagnoza prowadzi wtedy najpierw w stronę skryptu, co wydłuża szukanie przyczyny
      - Zadania uruchamiane pod kontem systemowym działają dalej, bo nie przechodzą przez ten mechanizm
      - Logowanie, usługi, dostęp do plików, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Tasks laid down under a personal or a service account will cease to run
      - The timetable will show them as ended in failure with a code about a right of signing in, not about a fault in the script
      - The looking into it leads first toward the script, which draws out the search for the cause
      - Tasks run under the system s own account work on, not passing through this mechanism
      - Logging on, services, the way to files, file shares and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działają zadania zaplanowane pod kontem serwisowym, którego nie da się zamienić na systemowe
      - Użytkownicy zakładają własne zadania zaplanowane w ramach normalnej pracy
    en:
      - Upon the machine work tasks laid down under a service account that cannot be swapped for the system s
      - The users lay down tasks of their own in the ordinary course of work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeBatchLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeBatchLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeBatchLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeBatchLogonRight = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeBatchLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/log-on-as-a-batch-job

notes:
  pl: |
    Reguła jest parą do punktu o odmowie logowania wsadowego i warto,
    żeby aplikacja pokazała je obok siebie. Tamten wskazuje, komu na pewno
    nie wolno; ten ustala, komu w ogóle wolno. Drugi jest mocniejszy,
    bo działa także na konta, o których nikt nie pomyślał.

    Argument wart zachowania dotyczy trwałości. Napastnik, który wszedł na
    maszynę, potrzebuje sposobu na przeżycie restartu. Zadanie zaplanowane
    jest do tego narzędziem najwygodniejszym, bo wygląda zwyczajnie
    i nikogo nie dziwi. Zamknięcie logowania wsadowego dla kont zwykłych
    odbiera mu tę drogę, nie ruszając przy tym harmonogramu jako takiego.

    Odnotowuję objaw, bo jest tu istotny praktycznie. Zadanie, które
    przestało działać przez brak prawa do logowania, wygląda dokładnie
    tak samo jak zadanie z błędem w skrypcie. Aplikacja powinna wymienić
    to wprost, bo oszczędza to godzinę szukania w złym miejscu.
  en: |
    The rule is the pair of the item about the refusal of the batch signing in, and it is well that the
    application show them beside each other. That one names who surely may not; this settles who may at all. The
    second is the stronger, working also upon accounts nobody thought of.

    The argument worth keeping touches lasting. An attacker who has entered a machine needs a way of outliving a
    restart. A task laid down is for that the handiest tool, looking as it does ordinary and startling nobody. The
    shutting of the batch signing in to ordinary accounts takes that road from them without touching the timetable
    as such.

    I set down the mark of it, that being here of practical weight. A task that has ceased to work for want of a
    right of signing in looks exactly like a task with a fault in its script. The application ought to name that
    outright, it sparing an hour of searching in the wrong place.
