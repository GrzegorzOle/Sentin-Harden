id: win2025-lan-manager-auth-level

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Poziom uwierzytelniania menedżera sieci ustawiony najwyżej
    en: Network manager authentication level set at its highest
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, jakie mechanizmy uwierzytelniania sieciowego ta
    maszyna wysyła i jakie przyjmuje, i wymaga wartości odpowiadającej
    wyłącznie mechanizmowi najnowszemu.

    Za tym jednym ustawieniem stoi trzydzieści lat zgodności wstecz.
    Wartości niższe pozwalają maszynie posługiwać się mechanizmami
    powstałymi w czasach, gdy sieci lokalne uważano za środowisko zaufane.
    Skróty tworzone przez te mechanizmy łamie się dziś w czasie liczonym
    w minutach, niezależnie od długości hasła — konstrukcja skrótu, nie
    hasło, jest tu słabym ogniwem.

    Na serwerze waga jest największa z możliwych. Serwer przyjmuje
    uwierzytelnienia stale i od wszystkich. Przy wartości niskiej wystarczy
    skłonić dowolne konto do połączenia się z maszyną kontrolowaną przez
    napastnika — a do tego wystarcza odnośnik w dokumencie — żeby
    przechwycony materiał dało się rozłożyć na hasło.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła kont,
    które łączą się z tym serwerem, bez łamania czegokolwiek trudnego.
    Jest to jedna z najkrótszych dróg od dostępu do sieci lokalnej do
    poświadczeń administracyjnych i dlatego kategoria jest krytyczna.
  en: |
    The setting settles which mechanisms of network authentication this machine sends and
    which it takes, and takes a value answering to the newest mechanism alone.

    Behind that one setting stand thirty years of backward compatibility. Lower values let
    the machine make use of mechanisms born in days when local networks were held a trusted
    setting. The digests made by those mechanisms are broken today in a time counted in
    minutes, whatever the password's length - the digest's make, not the password, is the
    weak link here.

    On a server the weight is the greatest possible. A server takes authentications
    constantly and from everyone. At a low value it is enough to get any account to connect
    to a machine the attacker controls - and a link in a document is enough for that - for
    the caught material to be taken apart into a password.

    What an attacker gains while the item goes unmet: the passwords of the accounts that
    connect to this server, without breaking anything hard. It is one of the shortest roads
    from access to the local network to administrative credentials, and hence the category
    is critical.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że ustawienie rozstrzyga o zgodności
    z każdą maszyną, z którą ta rozmawia — w obie strony naraz.

    Po zmianie serwer przestaje przyjmować uwierzytelnienia mechanizmami
    starszymi i przestaje ich używać sam. Klient, który innych nie zna,
    traci dostęp natychmiast. Nie ma tu stanu pośredniego ani ostrzeżenia:
    jest połączenie albo go nie ma.

    Klienci, których to dotyczy, dzielą się na dwie grupy. Pierwsza to
    urządzenia: rejestratory, sterowniki, kopiarki, oprogramowanie
    przemysłowe. Druga to systemy spoza rodziny Windows łączące się
    z udziałami — starsze implementacje protokołu plikowego bywają
    skonfigurowane na mechanizm, którego to ustawienie nie dopuszcza,
    i zmiana wymaga tam edycji konfiguracji po tamtej stronie.

    Objawem jest odmowa dostępu bez wskazania przyczyny, zwykle opisywana
    po stronie klienta jako błędne hasło. Jest to mylące i bywa powodem,
    dla którego zmiany haseł szuka się przez godziny.

    Przed wdrożeniem warto włączyć rejestrowanie uwierzytelnień starszym
    mechanizmem i przez kilka dni zobaczyć, kto go używa. Jest to jedyny
    sposób na ustalenie tego bez zgadywania.

    Zmiana wymaga restartu systemu.
  en: |
    A knowing rollout is needed because the setting settles compatibility with every machine
    this one talks to - in both directions at once.

    After the change the server stops taking authentications by older mechanisms and stops
    using them itself. A client that knows no others loses access at once. There is no
    middle state here and no warning: there is a connection or there is not.

    The clients this concerns fall into two groups. The first is devices: recorders,
    controllers, copiers, industrial software. The second is systems outside the Windows
    family connecting to shares - older implementations of the file protocol are at times
    configured for a mechanism this setting does not admit, and changing that takes an edit
    of the configuration on that side.

    The symptom is access being denied with no cause shown, usually described on the
    client's side as a wrong password. That misleads and is at times the reason a password
    change is looked for over hours.

    Before the rollout it is worth switching on the recording of authentications by the
    older mechanism and seeing over a few days who uses it. It is the one way of
    establishing that without guessing.

    The change takes a restart of the system.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - legacy-applications
    - remote-management
  what_breaks:
    pl:
      - Urządzenia i oprogramowanie znające wyłącznie starszy mechanizm tracą dostęp
      - Systemy spoza rodziny Windows wymagają zmiany konfiguracji po swojej stronie
      - Odmowa dostępu jest po stronie klienta opisywana jako błędne hasło
      - Zmiana działa w obie strony — serwer przestaje też używać starszych mechanizmów sam
    en:
      - Devices and software knowing the older mechanism alone lose access
      - Systems outside the Windows family take a change of configuration on their side
      - The denied access is described on the client's side as a wrong password
      - The change works both ways - the server also stops using older mechanisms itself
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z serwerem łączą się urządzenia znające wyłącznie starszy mechanizm uwierzytelniania
      - Nie sprawdzono w dzienniku, kto uwierzytelnia się starszym mechanizmem
    en:
      - Devices knowing the older authentication mechanism alone connect to the server
      - It has not been checked in the log who authenticates by the older mechanism
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LmCompatibilityLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'LmCompatibilityLevel' -ErrorAction SilentlyContinue).'LmCompatibilityLevel'
    [pscustomobject]@{
      path        = $path
      name        = 'LmCompatibilityLevel'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LmCompatibilityLevel' -Value 5 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level

notes:
  pl: |
    Wartość pięć oznacza zarazem wysyłanie wyłącznie mechanizmem najnowszym
    i odrzucanie wszystkiego innego po stronie przyjmującej. Wartości niższe
    rozdzielają te dwie rzeczy i pozwalają przyjmować więcej, niż się wysyła
    — co bywa źródłem złudzenia, że maszyna jest już zabezpieczona.

    Punkt czyta się razem z minimalnym poziomem zabezpieczenia sesji, który
    opisuje nie to, którego mechanizmu się używa, tylko jak mocno ten
    mechanizm ma chronić sesję. Oba są potrzebne i żaden nie zastępuje
    drugiego.

    Zmiana jest odwracalna dopiero po restarcie, więc wycofanie w razie
    kłopotu nie jest natychmiastowe. Na serwerze bez drugiej drogi wejścia
    jest to argument za wykonaniem zmiany w oknie serwisowym, a nie
    w trakcie pracy.
  en: |
    The value five means at once sending by the newest mechanism alone and refusing
    everything else on the receiving side. Lower values split those two things and let more
    be taken than is sent - which is at times the source of an illusion that the machine is
    already safe.

    The item is read together with the minimum session security level, which describes not
    which mechanism is used but how strongly that mechanism is to guard the session. Both
    are needed and neither stands in for the other.

    The change is reversible only after a restart, so a rollback in case of trouble is not
    immediate. On a server with no second road in that is an argument for making the change
    in a service window rather than during work.
