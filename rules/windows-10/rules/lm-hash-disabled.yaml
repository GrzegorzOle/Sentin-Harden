id: win10-lm-hash-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie skrótu LAN Manager wyłączone
    en: The storing of the LAN Manager hash switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że maszyna przestaje odkładać przy każdym koncie
    skrót hasła liczony mechanizmem najstarszym.

    Reguła poprzednia dotyczyła tego, czym maszyna się przedstawia
    w rozmowie. Ta dotyczy tego, co leży na dysku. Są to dwie różne rzeczy
    i wykonanie jednej nie załatwia drugiej — maszyna może rozmawiać
    wyłącznie pokoleniem ostatnim i nadal trzymać przy koncie skrót
    z pokolenia pierwszego.

    Skrót ten jest słaby w sposób, który nie wynika z długości hasła.
    Mechanizm dzieli hasło na części, gubi wielkość liter i nie dodaje
    żadnej wartości losowej, więc hasło długie i złożone daje się z niego
    odtworzyć w czasie porównywalnym z krótkim. Kto zdobędzie zawartość
    bazy kont, dostaje hasła, a nie skróty.

    Odnotowuję rzecz istotną dla planowania: skróty już zapisane nie znikają
    w chwili zmiany ustawienia. Znikają przy następnej zmianie hasła danego
    konta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: postać hasła
    odtwarzalną niezależnie od jego długości, leżącą przy każdym koncie
    lokalnym.
  en: |
    The setting makes the machine cease laying down at every account a hash of the password reckoned by the
    oldest mechanism.

    The foregoing rule touched what the machine presents itself by in a conversation. This touches what lies
    upon the disk. They are two different things, and carrying out the one does not settle the other - a machine
    may speak in the last generation alone and still keep beside an account a hash of the first.

    That hash is weak in a way that does not follow from the password's length. The mechanism parts the password
    into pieces, loses the letters' case and adds no random value at all, so a long and involved password is
    recovered from it in a time like a short one's. Whoever gets the accounts store's contents gets passwords,
    not hashes.

    I set down a thing that matters to the planning: the hashes already written do not go at the moment the
    setting is changed. They go at the next change of the account's password.

    What an attacker gains while the item goes unmet: a form of the password recoverable whatever its length,
    lying beside every local account.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć skutków bieżących praktycznie nie ma.

    Samo ustawienie niczego nie psuje: maszyna przestaje zapisywać skrót,
    z którego i tak nikt na sprzęcie wspieranym nie korzysta. Sprawdzenia
    wymaga natomiast układ rzadki — oprogramowanie branżowe albo urządzenie,
    które uwierzytelnia się wobec kont lokalnych tej maszyny mechanizmem
    najstarszym. Takie rozwiązanie przestanie działać przy następnej zmianie
    hasła konta, którym się posługuje.

    Opóźnienie skutku jest tu rzeczą wartą uwagi. Awaria nie wystąpi
    w chwili wykonania, tylko tygodnie później, przy zmianie hasła — i nikt
    nie powiąże jej z tą zmianą.

    Skróty już zapisane pozostają na dysku do czasu zmiany hasła. Reguła
    wykonana bez zmiany haseł nie usuwa zagrożenia, tylko przestaje je
    powiększać.

    Czego to nie psuje: logowania, uwierzytelniania mechanizmem nowszym,
    udziałów plikowych, kont domenowych, drukowania, aplikacji.
  en: |
    The class is "needs review", though there are in practice no consequences at the moment of the change.

    The setting itself breaks nothing: the machine ceases writing a hash that nobody upon supported gear uses
    anyway. What calls for a review is a rare arrangement - trade software, or a device, authenticating itself
    against this machine's local accounts by the oldest mechanism. Such a thing will cease working at the next
    change of the password of the account it uses.

    The lateness of the consequence is here worth attention. The fault will not come up at the carrying out but
    weeks later, at a change of a password - and nobody will bind it to this change.

    The hashes already written stay upon the disk until a password is changed. The rule carried out without the
    passwords being changed does not take the hazard away, it only ceases adding to it.

    What this does not break: logging on, authentication by the newer mechanism, file shares, domain accounts,
    printing, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Oprogramowanie uwierzytelniające się wobec kont lokalnych mechanizmem najstarszym przestanie działać przy następnej zmianie hasła
      - Awaria wystąpi tygodnie po wykonaniu, przy zmianie hasła, i nikt nie powiąże jej z tą zmianą
      - Skróty już zapisane pozostają na dysku do czasu zmiany hasła danego konta
      - Reguła wykonana bez zmiany haseł nie usuwa zagrożenia, tylko przestaje je powiększać
      - Logowanie, uwierzytelnianie mechanizmem nowszym, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Software authenticating itself against local accounts by the oldest mechanism will cease working at the next change of a password
      - The fault will come up weeks after the carrying out, at a change of a password, and nobody will bind it to this change
      - The hashes already written stay upon the disk until the account's password is changed
      - The rule carried out without the passwords being changed does not take the hazard away, it only ceases adding to it
      - Logging on, authentication by the newer mechanism, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wobec kont lokalnych tej maszyny uwierzytelnia się oprogramowanie posługujące się mechanizmem najstarszym
      - Nie ustalono, czy jakiekolwiek urządzenie korzysta z kont lokalnych tej maszyny
    en:
      - Software using the oldest mechanism authenticates itself against this machine's local accounts
      - It has not been established whether any device uses this machine's local accounts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'NoLMHash'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'NoLMHash'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The hashes already written stay until each account's password is next
    # changed. Carrying this out alone stops the store growing; it does not empty
    # it.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLMHash' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-do-not-store-lan-manager-hash-value-on-next-password-change

notes:
  pl: |
    Reguła jest naturalną towarzyszką poprzedniej i warto pokazywać je
    razem, ale nie jako to samo. Tamta dotyczy rozmowy, ta dysku. Maszyna
    zgodna z tamtą może nadal trzymać przy kontach postać hasła, z której
    odtworzenie jest trywialne.

    Argument wart zachowania dotyczy niezależności od długości hasła.
    Polityka wymuszająca hasła długie nie chroni przed tym skrótem, bo
    mechanizm i tak dzieli hasło na części. Jest to jeden z niewielu
    przypadków, w których „mamy silne hasła" nie jest odpowiedzią.

    Odnotowuję opóźnienie skutku, bo to ono jest tu prawdziwą pułapką.
    Reguła wykonana dziś zadziała przy następnej zmianie hasła, i tak samo
    ewentualna awaria. Aplikacja powinna to powiedzieć wprost, bo inaczej
    punkt zostanie uznany za wykonany, a bazy skrótów nikt nie wyczyści.
  en: |
    The rule is a natural companion to the foregoing one, and it is well to show them together but not as one
    thing. That one touches a conversation, this the disk. A machine compliant with that one may still keep
    beside its accounts a form of the password from which a recovery is trivial.

    The argument worth keeping touches the independence from a password's length. A policy enforcing long
    passwords does not guard against that hash, the mechanism parting the password into pieces anyway. It is one
    of the few cases in which "we have strong passwords" is not an answer.

    I set down the lateness of the consequence, that being here the true trap. The rule carried out today will
    work at the next change of a password, and so will any fault. The application ought to say so outright, or
    else the item will be held carried out while nobody empties the store of hashes.
