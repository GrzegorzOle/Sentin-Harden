id: win2016-remote-registry-paths-and-subpaths

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista gałęzi rejestru dostępnych zdalnie wraz z zawartością
    en: The list of registry keys reachable remotely together with their contents
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wylicza gałęzie rejestru, które wolno odczytać zdalnie wraz
    z całą zawartością leżącą pod nimi.

    Różnica wobec listy sąsiedniej jest w zasięgu i właśnie ona decyduje
    o tym, że ta lista wymaga większej uwagi. Tam pozycja udostępnia jeden
    węzeł. Tu pozycja udostępnia poddrzewo — wszystko, co ktoś pod nią
    kiedykolwiek zapisze, także w przyszłości. Wpis dodany dziś pod jedną
    konkretną potrzebę obejmuje też gałęzie, których wtedy jeszcze nie było.

    Pozycje, do których lista ma się sprowadzać, odpowiadają usługom
    odpytywanym zdalnie w normalnej pracy: kolejkom wydruku, dziennikom
    zdarzeń, licznikom wydajności, konfiguracji usług terminalowych. Są to
    rzeczy, o które pyta nadzór i narzędzia zarządzania, i dlatego lista
    jest tu dłuższa niż sąsiednia.

    Każda pozycja ponad tę listę oddaje poddrzewo konfiguracji do odczytu
    z sieci bez logowania. Ponieważ zasięg obejmuje zawartość, skutek bywa
    szerszy, niż zakładał ten, kto wpis dodawał — i szerszy, niż wynika
    z samej nazwy gałęzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt całych
    poddrzew konfiguracji, dopisanych kiedyś pod konkretną potrzebę
    i obejmujących także to, co zapisano pod nimi później.
  en: |
    The setting enumerates the registry keys that may be read remotely together with
    all the contents lying beneath them.

    The difference from the neighbouring list is one of reach, and it is exactly
    what makes this list call for greater care. There an entry offers up one node.
    Here an entry offers up a subtree - everything anybody ever writes beneath it,
    in future too. An entry added today for one particular need takes in keys that
    did not yet exist at the time.

    The entries the list is to come down to answer to services queried remotely in
    ordinary work: print queues, event logs, performance counters, terminal service
    configuration. These are the things monitoring and management tools ask about,
    and that is why the list here is longer than the neighbouring one.

    Every entry beyond that list offers up a subtree of configuration to be read
    from the network without signing in. Since the reach takes in the contents, the
    effect is at times wider than whoever added the entry assumed - and wider than
    the key's name suggests.

    What an attacker gains while the item goes unmet: the reading of whole subtrees
    of configuration, added once for a particular need and taking in what was
    written beneath them later as well.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tak jak przy liście sąsiedniej sprawdzenie
    polega na przeczytaniu tego, co maszyna ma dziś.

    Reguła ustala listę na konkretny zestaw, więc pozycje dopisane wcześniej
    zostaną usunięte. Skutek dotyczy zatem wyłącznie tego, co ktoś dopisał —
    i tylko tam trzeba szukać ryzyka.

    Na serwerze pozycje dopisuje się częściej niż na stanowisku, bo więcej
    rzeczy odpytuje serwer zdalnie. Typowe znaleziska: gałęzie serwera baz
    danych czytane przez narzędzie nadzoru, konfiguracja oprogramowania
    kopii zapasowych, ścieżki dopisane pod system monitorujący, którego już
    nie ma. To ostatnie jest najczęstsze i zarazem najbezpieczniejsze do
    usunięcia.

    Osobno warto spojrzeć na pozycje dotyczące dzienników zdarzeń
    i liczników wydajności. Te są na liście docelowej, więc nadzór czytający
    dzienniki zdalnie działa dalej — to pytanie pada przy tym punkcie
    najczęściej i odpowiedź warto podać od razu.

    Objaw w razie usunięcia potrzebnej pozycji jest jednoznaczny: narzędzie
    zgłasza brak dostępu do ścieżki.

    Czego to nie psuje: odczytu dzienników zdarzeń i liczników wydajności
    zdalnie, odczytu rejestru lokalnie, dostępu kont uprzywilejowanych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and as at the neighbouring list the checking
    consists in reading what the machine has today.

    The rule fixes the list at a particular set, so entries added earlier will be
    removed. The effect therefore concerns what somebody added, and nothing else -
    and only there need the risk be looked for.

    On a server entries are added more often than on a workstation, since more
    things query a server remotely. Typical finds: database server keys read by a
    monitoring tool, the configuration of backup software, paths added for a
    monitoring system that is no longer there. The last is the commonest and at the
    same time the safest to remove.

    The entries touching event logs and performance counters are worth a separate
    look. These are on the target list, so monitoring that reads logs remotely works
    on - that is the question raised most often at this item and the answer is worth
    giving at once.

    The symptom, where a needed entry is removed, is unambiguous: the tool reports
    no access to the path.

    What this does not break: reading event logs and performance counters remotely,
    reading the registry locally, or the access of privileged accounts.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - diagnostics-and-reporting
    - logging-and-audit
    - printing
  what_breaks:
    pl:
      - Gałęzie serwera baz danych albo oprogramowania kopii zapasowych dopisane do listy przestają być czytelne zdalnie
      - Ścieżki dopisane pod system monitorujący, którego już nie ma, zostają usunięte razem z tymi, które nadal działają
      - Narzędzie zgłasza brak dostępu do konkretnej ścieżki, więc przyczyna jest widoczna, a przywrócenie proste
      - Odczyt dzienników zdarzeń i liczników wydajności zdalnie pozostaje bez zmian, bo te gałęzie są na liście docelowej
    en:
      - Database server or backup software keys added to the list cease to be readable remotely
      - Paths added for a monitoring system that is no longer there are removed along with those still working
      - The tool reports no access to a particular path, so the cause is visible and restoring it is simple
      - Reading event logs and performance counters remotely stays unchanged, since those keys are on the target list
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przeczytano listy, którą maszyna ma dziś, więc nie wiadomo, jakie poddrzewa zostaną odcięte
      - Na liście są gałęzie dopisane pod narzędzie nadzoru albo kopii zapasowych, którego nie da się przestawić na inny sposób odczytu
    en:
      - The list the machine has today has not been read, so it is not known what subtrees will be cut off
      - The list holds keys added for a monitoring or backup tool that cannot be moved to another way of reading
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The list is compared as a set, without regard to order or letter case,
      # because neither carries meaning here. A list that differs is reported
      # together with its contents rather than as a bare failure.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedPaths'
      $name = 'Machine'
      $expected = @(
        'System\CurrentControlSet\Control\Print\Printers',
        'System\CurrentControlSet\Services\Eventlog',
        'Software\Microsoft\OLAP Server',
        'Software\Microsoft\Windows NT\CurrentVersion\Print',
        'Software\Microsoft\Windows NT\CurrentVersion\Windows',
        'System\CurrentControlSet\Control\ContentIndex',
        'System\CurrentControlSet\Control\Terminal Server',
        'System\CurrentControlSet\Control\Terminal Server\UserConfig',
        'System\CurrentControlSet\Control\Terminal Server\DefaultUserConfiguration',
        'Software\Microsoft\Windows NT\CurrentVersion\Perflib',
        'System\CurrentControlSet\Services\SysmonLog'
      )
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = @($item.$name | Where-Object { $null -ne $_ -and $_ -ne '' })
        $left = ($value | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        $right = ($expected | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        if ($left -eq $right) { 'EXACT_MATCH' }
        elseif ($value.Count -eq 0) { 'EMPTY' }
        else { 'OTHER ' + ($value -join ',') }
      }
    } catch {
      # Reading this key calls for administrative rights. The system's own
      # message goes to the error stream, so the report can tell a missing
      # privilege from a real fault instead of showing a bare error.
      [Console]::Error.WriteLine($_.Exception.Message)
      'CHECK_ERROR'
    }
  expected: 'EXACT_MATCH'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedPaths'
    $name = 'Machine'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedPaths'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $value = @(
      'System\CurrentControlSet\Control\Print\Printers',
      'System\CurrentControlSet\Services\Eventlog',
      'Software\Microsoft\OLAP Server',
      'Software\Microsoft\Windows NT\CurrentVersion\Print',
      'Software\Microsoft\Windows NT\CurrentVersion\Windows',
      'System\CurrentControlSet\Control\ContentIndex',
      'System\CurrentControlSet\Control\Terminal Server',
      'System\CurrentControlSet\Control\Terminal Server\UserConfig',
      'System\CurrentControlSet\Control\Terminal Server\DefaultUserConfiguration',
      'Software\Microsoft\Windows NT\CurrentVersion\Perflib',
      'System\CurrentControlSet\Services\SysmonLog'
    )
    Set-ItemProperty -Path $path -Name 'Machine' -Value $value -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type MultiString
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-remotely-accessible-registry-paths-and-subpaths

notes:
  pl: |
    Zasięg obejmujący zawartość jest tą właściwością, która odróżnia ten
    punkt od sąsiedniego, i powinna być widoczna w interfejsie. Bez niej obie
    reguły wyglądają na duplikat, a różnią się tym, co w ocenie ryzyka waży
    najwięcej.

    Tak jak przy liście sąsiedniej, audyt porównuje zbiór bez względu na
    kolejność i wielkość liter, a listę zastaną podaje wprost. Decyzja
    o wdrożeniu wymaga wykazu, nie werdyktu.

    Pytanie o dzienniki zdarzeń pada przy tym punkcie niemal zawsze, bo
    nadzór czytający je zdalnie jest rozpowszechniony. Odpowiedź — że gałąź
    dzienników jest na liście docelowej i odczyt działa dalej — warto
    pokazać przy regule, a nie dopiero w opisie uciążliwości.
  en: |
    The reach that takes in the contents is the property setting this item apart
    from its neighbour, and it should be visible in the interface. Without it the
    two rules look like a duplicate, while they differ in what weighs most in the
    assessment of risk.

    As at the neighbouring list, the audit compares the set without regard to order
    or letter case, and gives the list it found outright. A rollout decision calls
    for the entries, not for a verdict.

    The question about event logs is raised at this item almost always, since
    monitoring that reads them remotely is widespread. The answer - that the logs
    key is on the target list and the reading works on - is worth showing at the
    rule rather than only in the description of disruption.
