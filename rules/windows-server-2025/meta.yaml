id: windows-server-2025
nazwa: Windows Server 2025
rodzina: windows
powloka: powershell
profil: server

benchmark:
  nazwa: CIS Microsoft Windows Server 2025 Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 2 = kontroler domeny, 3 = serwer członkowski. Kompilacja 26100.
  dopasowanie: '^Microsoft Windows Server 2025.*\|26[0-9]{3}\|[23]$'

role:
  # Rola maszyny zmienia zarówno zestaw reguł, jak i ich uciążliwość.
  # Tę samą zmianę na kontrolerze domeny i na serwerze plików ocenia się inaczej.
  polecenie: |
    (Get-WindowsFeature | Where-Object InstallState -eq 'Installed').Name -join ','

uwagi: |
  Benchmark rozróżnia kontroler domeny i serwer członkowski — to dwa różne
  zestawy punktów, nie warianty jednego. Reguła dotycząca wyłącznie jednej roli
  musi to deklarować w polu platforma.dotyczy_rol, inaczej na drugiej roli
  zwróci mylący wynik.
