id: win10-smb-client-plaintext-password-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wysyłanie hasła otwartym tekstem do obcych serwerów plików zabronione
    en: The sending of a password in clear to strange file servers forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie wysłania hasła w postaci nieprzetworzonej
    do serwera plików, który o to poprosi.

    Mechanizm istnieje dlatego, że niektóre implementacje udostępniania
    plików spoza systemu nie umiały przyjąć hasła w postaci innej niż
    jawna. Żeby takie serwery obsłużyć, dopuszczono zachowanie, w którym
    serwer mówi „nie potrafię inaczej", a maszyna hasło wysyła.

    Kłopot polega na tym, że to serwer decyduje. Napastnik, który podstawi
    się pod ścieżkę sieciową, odpowiada „nie potrafię inaczej" i dostaje
    hasło użytkownika w postaci, w której nie trzeba niczego odtwarzać.
    Jest to najkrótsza droga do poświadczeń, jaka w tym obszarze istnieje.

    Reguła wygląda na oczywistą i taka jest. Jej wartość bierze się z tego,
    że wartość domyślna bywa zmieniana ręcznie, gdy trzeba podłączyć
    magazyn nietypowy — i zostaje zmieniona na stałe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    użytkownika w postaci jawnej, wydane dobrowolnie przez maszynę na
    życzenie strony drugiej.
  en: |
    The setting forbids the machine to send a password in unworked form to a file server that asks for it.

    The mechanism is there because certain file-sharing implementations from outside the system could not take a
    password in any form but the plain one. To serve such servers a behaviour was allowed in which the server
    says "I can do no other" and the machine sends the password.

    The trouble is that the server decides. An attacker putting themselves under a network path answers "I can
    do no other" and gets the user's password in a form from which nothing has to be recovered. It is the
    shortest road to credentials that exists in this field.

    The rule looks obvious and is. Its value comes of the default value being at times changed by hand, where an
    unusual store has to be joined - and being left changed for good.

    What an attacker gains while the item goes unmet: the user's password in plain form, given up willingly by
    the machine at the other side's asking.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślna i na maszynie nietykanej reguła
    potwierdza stan zastany.

    Skutek, gdy wartość była zmieniona, dotyczy wyłącznie magazynu, dla
    którego ją zmieniono. Takie magazyny są dziś rzadkie, bo implementacje
    udostępniania plików spoza systemu obsługują uwierzytelnianie
    przetworzone od lat.

    Nie ma znanych regresji dla pracy codziennej. Serwery plików wspierane
    nigdy hasła jawnego nie żądają, więc nie ma czego odmawiać.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: udziałów na serwerach wspieranych, logowania,
    kont domenowych, uprawnień do plików, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default, and upon an untouched machine the rule confirms the state found.

    The consequence, where the value had been changed, touches only the store for which it was changed. Such
    stores are today rare, file-sharing implementations from outside the system having served worked
    authentication for years.

    There are no known regressions for everyday work. Supported file servers never ask for a plain password, so
    there is nothing to refuse.

    The change takes hold at once and undoes itself at once.

    What this does not break: shares on supported servers, logging on, domain accounts, the rights upon files,
    printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - encryption-and-tls
  what_breaks:
    pl:
      - Magazyn, dla którego wartość zmieniono ręcznie, przestaje przyjmować uwierzytelnienie z tej maszyny
      - Serwery plików wspierane hasła jawnego nigdy nie żądają, więc nie ma czego odmawiać
      - Na maszynie nietykanej reguła potwierdza stan zastany i nie zmienia niczego
      - Udziały na serwerach wspieranych, logowanie i konta domenowe pozostają bez zmian
      - Uprawnienia do plików, drukowanie, aplikacje i usługi systemowe pozostają bez zmian
    en:
      - A store for which the value had been changed by hand ceases taking an authentication from this machine
      - Supported file servers never ask for a plain password, so there is nothing to refuse
      - Upon an untouched machine the rule confirms the state found and changes nothing
      - Shares on supported servers, logging on and domain accounts stay unchanged
      - The rights upon files, printing, applications and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna łączy się z magazynem plików, którego implementacja nie przyjmuje hasła w postaci przetworzonej
    en:
      - The machine joins a file store whose implementation does not take a password in worked form
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'EnablePlainTextPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $name = 'EnablePlainTextPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Supported file servers never ask for a plain password. Where one does, the
    # answer is to replace it, not to leave this value open.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnablePlainTextPassword' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-client-send-unencrypted-password-to-third-party-smb-servers

notes:
  pl: |
    Reguła jest w tym bloku najprostsza i najtańsza, a jej opis nie powinien
    tego ukrywać. Wartość bierze się nie z tego, że zagrożenie jest
    wyrafinowane, tylko z tego, że skutek jest natychmiastowy i całkowity —
    hasło wydane jawnie nie wymaga od napastnika żadnej pracy.

    Odnotowuję, kto decyduje. Maszyna wysyła hasło jawnie dlatego, że
    poprosił o to serwer, a serwerem może być każdy, kto odpowie pod
    właściwą ścieżką. Jest to ten sam wzorzec co przy logowaniu gościa
    i warto, żeby aplikacja pokazywała obie reguły w sąsiedztwie.

    Kategoria wysoka przy klasie „bez uciążliwości" jest tu zestawieniem
    rzadkim i pożądanym. Reguła należy do tych, które robi się hurtem
    i bez namysłu.
  en: |
    The rule is the plainest and cheapest in this block, and its description ought not to hide it. Its value
    comes not of the threat being subtle but of the consequence being at once and entire - a password given in
    plain asks no work at all of an attacker.

    I set down who decides. The machine sends the password in plain because a server asked for it, and the
    server may be anybody who answers under the right path. It is the same pattern as at a guest logon, and it
    is well that the application show both rules near each other.

    A high category beside the class "no disruption" is here a rare and welcome pairing. The rule is among those
    done in bulk and without deliberation.
