id: win2016-defender-antivirus-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus
  title:
    pl: Wyłączenie wbudowanej ochrony przed złośliwym oprogramowaniem zablokowane
    en: Switching the built-in malware protection off blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje wprost, że wbudowana ochrona przed złośliwym
    oprogramowaniem ma być włączona, i odbiera możliwość wyłączenia jej
    wpisem w rejestrze.

    Różnica między „ochrona działa" a „ochrony nie wolno wyłączyć" jest tu
    sednem sprawy. Ochrona działająca bez tego wpisu jest włączona dlatego,
    że nikt jej nie wyłączył. Ochrona z wpisem jest włączona dlatego, że
    zapisano taką decyzję — i wyłączenie jej wymaga najpierw zmiany tej
    decyzji.

    Ma to znaczenie, bo wyłączenie ochrony jest jedną z pierwszych czynności
    napastnika, który zdobył prawa administratora. Nie jest to czynność
    trudna ani rzucająca się w oczy: jedna wartość w rejestrze, żadnego
    okna, żadnego komunikatu. Po niej wszystko, co przyniesie dalej,
    przestaje być sprawdzane.

    Zapisanie zakazu nie czyni tego niemożliwym — napastnik z prawami
    administratora może zmienić i ten wpis. Zmienia natomiast koszt
    i widoczność: czynność przestaje być jednym krokiem, a zmiana zasady
    jest tym, co narzędzia nadzoru potrafią zauważyć.

    Warto wiedzieć, że wartość ta bywa ustawiana na jedynkę przez
    instalatory innych programów ochronnych i zostaje po ich usunięciu. Jest
    to najczęstsza przyczyna maszyny bez żadnej ochrony, na której nikt tego
    nie zamierzał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zdjęcia całej ochrony przed złośliwym oprogramowaniem jednym wpisem,
    bez zmiany zasady i bez śladu wyglądającego na zmianę konfiguracji.
  en: |
    The setting writes down outright that the built-in malware protection is to be
    switched on, and takes away the means of switching it off by a registry entry.

    The difference between "the protection is working" and "the protection may not
    be switched off" is the heart of the matter here. Protection working without
    this entry is on because nobody switched it off. Protection with the entry is on
    because such a decision was written down - and switching it off calls first for
    that decision to be changed.

    This matters, since switching the protection off is among the first acts of an
    attacker who has gained administrative rights. It is neither hard nor
    conspicuous: one value in the registry, no window, no message. After it,
    everything they bring in later goes unchecked.

    Writing down the ban does not make this impossible - an attacker with
    administrative rights can change this entry too. What it changes is the cost and
    the visibility: the act ceases to be a single step, and a change of policy is
    something monitoring tools can notice.

    Worth knowing that this value is at times set to one by the installers of other
    protection programs and stays behind after they are removed. It is the commonest
    cause of a machine with no protection at all where nobody intended that.

    What an attacker gains while the item goes unmet: the means of taking the whole
    malware protection off with one entry, with no change of policy and no trace
    that looks like a change of configuration.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba jedno: czy na maszynie
    pracuje inny program ochronny.

    Jest to pytanie rozstrzygające, bo dwa programy ochronne działające
    jednocześnie w czasie rzeczywistym przeszkadzają sobie nawzajem —
    skanują te same pliki, blokują sobie dostęp i potrafią wprowadzić
    maszynę w stan, w którym działa wolno i nieprzewidywalnie.

    Sytuacja normalna wygląda tak, że po zainstalowaniu innego programu
    ochronnego wbudowana ochrona usuwa się w cień sama. Wpis, o który tu
    chodzi, nie zmienia tego zachowania — przekazanie roli dzieje się
    niezależnie od niego. Zmiana jest więc bezpieczna także na maszynie
    z innym programem.

    Kłopot pojawia się w przypadku odwrotnym: gdy inny program został
    usunięty, a wpis blokujący po nim został. Wtedy maszyna nie ma żadnej
    ochrony, a ta reguła przywraca ją natychmiast — i właśnie wtedy trzeba
    liczyć się z pierwszym pełnym skanowaniem oraz z obciążeniem, którego
    nikt nie planował.

    Drugą rzeczą wartą przygotowania są wyłączenia dla roli. Serwer bazy
    danych, serwer plików albo host wirtualizacji pracujący bez wyłączeń
    potrafi zwolnić w sposób zauważalny.

    Czego to nie psuje: pracy innego programu ochronnego, usług, logowania,
    łączności.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and one thing has to be checked: whether another
    protection program works on the machine.

    That is the deciding question, since two protection programs working at once in
    real time get in each other's way - they scan the same files, block each other's
    access, and can bring a machine into a state where it works slowly and
    unforeseeably.

    The normal situation is that once another protection program is installed, the
    built-in protection steps aside of its own accord. The entry at stake here does
    not alter that behaviour - the handing over of the role happens independently of
    it. The change is therefore safe on a machine with another program too.

    The trouble appears in the reverse case: where the other program has been
    removed and the blocking entry it left behind remains. The machine then has no
    protection at all, and this rule restores it at once - and it is just then that
    a first full scan and a load nobody planned for have to be reckoned with.

    The second thing worth preparing are the exclusions for the role. A database
    server, a file server or a virtualisation host working without exclusions can
    slow down noticeably.

    What this does not break: the working of another protection program, services,
    signing in, or connectivity.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - updates-and-servicing
  what_breaks:
    pl:
      - Na maszynie, z której usunięto inny program ochronny, ochrona wbudowana wraca natychmiast i uruchamia pierwsze pełne skanowanie
      - Serwer bazy danych, serwer plików albo host wirtualizacji pracujący bez wyłączeń dla roli potrafi zwolnić w sposób zauważalny
      - Praca innego programu ochronnego pozostaje bez zmian, bo przekazanie roli dzieje się niezależnie od tego wpisu
      - Usługi, logowanie i łączność pozostają bez zmian
    en:
      - On a machine another protection program was removed from, the built-in protection returns at once and starts a first full scan
      - A database server, a file server or a virtualisation host working without exclusions for its role can slow down noticeably
      - The working of another protection program stays unchanged, since the handing over of the role happens independently of this entry
      - Services, signing in and connectivity stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przygotowano wyłączeń odpowiadających roli maszyny, a rola jest wrażliwa na skanowanie plików
      - Trwa okres, w którym maszyna nie może przyjąć obciążenia pierwszym pełnym skanowaniem
    en:
      - No exclusions answering to the machine's role have been prepared, and the role is sensitive to files being scanned
      - A spell is under way in which the machine cannot take the load of a first full scan
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The compliant state is an explicit zero, not an absent value - without the
      # entry the decision stays with whoever can write to the registry.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableAntiSpyware'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $name = 'DisableAntiSpyware'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableAntiSpyware' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-windows

notes:
  pl: |
    Punkt otwiera blok ochrony przed złośliwym oprogramowaniem i jest w nim
    jedynym, który mówi o samym istnieniu ochrony, a nie o jej ustawieniach.
    Pozostałe reguły bloku zakładają, że ochrona działa — bez tego punktu
    opisują ustawienia czegoś, czego może nie być.

    Stan „nie dotyczy" ma tu znaczenie szczególne. Maszyna z innym programem
    ochronnym nie jest maszyną niezgodną i raport nie powinien jej tak
    pokazywać. Rozróżnienie to wymaga jednak sprawdzenia, czy program
    naprawdę jest, a nie tylko czy ochrona wbudowana stoi z boku —
    i dlatego pozostałe reguły bloku pytają najpierw o to.

    Najczęstszy przypadek niezgodności nie jest złośliwy: wpis pozostały po
    usuniętym programie ochronnym. Warto to napisać przy punkcie, bo
    zmienia to sposób czytania wyniku — z podejrzenia w porządkowanie.
  en: |
    The item opens the block on malware protection and is the only one in it
    speaking of the protection's existence rather than of its settings. The other
    rules of the block assume the protection is working - without this item they
    describe the settings of something that may not be there.

    The state "not applicable" has a particular meaning here. A machine with another
    protection program is not a machine out of compliance and the report should not
    show it as one. Telling that apart calls, though, for a check that the program
    is really there and not merely that the built-in protection stands aside - and
    that is why the other rules of the block ask about it first.

    The commonest case of non-compliance is not malicious: an entry left behind by a
    removed protection program. That is worth writing at the item, since it changes
    how the result is read - from suspicion into tidying up.
