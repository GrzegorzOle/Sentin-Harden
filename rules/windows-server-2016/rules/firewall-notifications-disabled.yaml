id: win2016-firewall-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Settings
  title:
    pl: Powiadomienia zapory wyłączone we wszystkich profilach
    en: Firewall notifications switched off in all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa okno, które zapora pokazuje zalogowanemu użytkownikowi,
    gdy program po raz pierwszy zaczyna nasłuchiwać na porcie.

    Okno to zadaje pytanie i przyjmuje odpowiedź. Odpowiedź twierdząca
    tworzy regułę dopuszczającą — czyli otwiera port. Jest to jedyne miejsce
    w systemie, w którym reguła zapory powstaje bez przechodzenia przez
    konfigurację zapory.

    Na serwerze jest to zachowanie niewłaściwe z dwóch powodów. Pierwszy:
    decyzja o otwarciu portu zapada wtedy przy oknie, w pośpiechu i bez
    przeglądu, przez osobę, która akurat była zalogowana. Drugi: pytanie
    pojawia się w chwili, gdy ktoś instaluje albo uruchamia program, czyli
    dokładnie wtedy, gdy najłatwiej odpowiedzieć twierdząco bez
    zastanowienia.

    Wyłączenie powiadomień nie zmienia tego, co zapora robi z połączeniem —
    jest ono nadal blokowane, jeśli nie ma reguły. Zmienia natomiast to, kto
    i gdzie decyduje o regułach: wyłącznie w konfiguracji, a nie w oknie.

    Warto wiedzieć, że przy wyłączonych powiadomieniach blokada staje się
    cicha. Program, któremu zapora odcięła nasłuch, po prostu nie działa
    i nie mówi dlaczego. Jest to koszt tej zmiany i należy go podać wprost.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno, w którym
    zalogowany użytkownik może otworzyć port jednym kliknięciem, w chwili
    sprzyjającej odpowiedzi twierdzącej.
  en: |
    The setting removes the window the firewall shows a signed-in user when a
    program first begins listening on a port.

    That window asks a question and takes an answer. An affirmative answer makes an
    admitting rule - which is to say it opens a port. It is the one place in the
    system where a firewall rule comes into being without going through the
    firewall's configuration.

    On a server this behaviour is improper for two reasons. First: the decision to
    open a port is then made at a window, in haste and without review, by whoever
    happened to be signed in. Second: the question appears at the moment somebody
    installs or starts a program, which is to say exactly when it is easiest to
    answer yes without thinking.

    Switching notifications off does not change what the firewall does with a
    connection - it is still blocked if there is no rule. What it changes is who
    decides about rules and where: in the configuration alone, and not at a window.

    Worth knowing that with notifications off the blocking becomes quiet. A program
    whose listening the firewall has cut off simply does not work and does not say
    why. That is the cost of this change and should be given outright.

    What an attacker gains while the item goes unmet: a window in which a signed-in
    user can open a port with one click, at a moment favouring an affirmative
    answer.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", bo na serwerze okno to prawie nigdy nie ma
    komu się pokazać.

    Powiadomienie trafia do użytkownika zalogowanego interaktywnie. Serwer
    zwykle takiego nie ma poza chwilami pracy administracyjnej, więc
    w praktyce okno pojawia się rzadko, a znika razem z sesją.

    Skutek, który trzeba nazwać mimo tej klasy, dotyczy pracy
    administracyjnej. Administrator uruchamiający nowe oprogramowanie na
    serwerze przestaje dostawać sygnał, że zapora coś odcięła. Program się
    nie łączy, a przyczyna jest niewidoczna — trzeba jej szukać w dzienniku
    zapory albo w regułach. Nie jest to awaria, tylko utrudnienie
    diagnostyczne, ale bywa mylące przy pierwszym uruchomieniu nowej usługi.

    Jest to zarazem argument za tym, żeby wdrażać tę regułę razem
    z rejestrowaniem pakietów odrzuconych. Cicha blokada bez dziennika to
    jedyna kombinacja, która naprawdę utrudnia pracę.

    Czego to nie psuje: działania zapory, reguł istniejących, usług
    dopuszczonych, połączeń wychodzących.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", since on a server that window almost never has
    anybody to show itself to.

    The notification goes to a user signed in interactively. A server as a rule has
    none, but for spells of administrative work, so in practice the window appears
    seldom and vanishes with the session.

    The consequence that has to be named despite that class concerns administrative
    work. An administrator starting new software on a server stops getting the
    signal that the firewall has cut something off. The program does not connect and
    the cause is invisible - it has to be looked for in the firewall's log or in the
    rules. That is no breakdown but a hindrance to diagnosis, misleading at times at
    the first run of a new service.

    It is at the same time an argument for rolling this rule out together with the
    logging of dropped packets. A quiet blocking with no log is the one combination
    that really does make work harder.

    What this does not break: the firewall's working, existing rules, admitted
    services, or outbound connections.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Administrator uruchamiający nowe oprogramowanie przestaje dostawać sygnał, że zapora odcięła nasłuch, i musi szukać przyczyny w dzienniku albo w regułach
      - Blokada staje się cicha, więc program po prostu nie działa i nie mówi dlaczego
      - Nikt nie otworzy już portu jednym kliknięciem w oknie, bo reguły powstają wyłącznie w konfiguracji
      - Działanie zapory, reguły istniejące i usługi dopuszczone pozostają bez zmian
    en:
      - An administrator starting new software stops getting the signal that the firewall has cut off a listening, and must look for the cause in the log or in the rules
      - The blocking becomes quiet, so a program simply does not work and does not say why
      - Nobody will open a port with one click at a window any longer, since rules come into being in the configuration alone
      - The firewall's working, existing rules and admitted services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Rejestrowanie pakietów odrzuconych nie jest włączone, więc cicha blokada zostanie bez żadnego śladu do odczytania
      - Na maszynie prowadzi się prace wdrożeniowe wymagające szybkiego rozpoznania, co zapora odcina
    en:
      - The logging of dropped packets is not switched on, so a quiet blocking will leave no trace to read
      - Deployment work calling for a quick reading of what the firewall cuts off is under way on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $noisy = @($profiles | Where-Object { $_.NotifyOnListen -ne 'False' })
        if ($noisy.Count -eq 0) { 'ALL_SILENT' } else { 'NOTIFIES_IN_' + ($noisy.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_SILENT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, NotifyOnListen |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -NotifyOnListen False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -NotifyOnListen $p.NotifyOnListen
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt zamyka jedyną w systemie drogę, którą reguła zapory powstaje poza
    konfiguracją zapory. Tak warto go przedstawiać — jako sprowadzenie
    decyzji do jednego miejsca, a nie jako wyciszenie komunikatów.
    Wyciszenie jest skutkiem ubocznym, nie celem.

    Zależność z rejestrowaniem pakietów odrzuconych jest tu realna i warto
    ją pokazać w interfejsie. Reguły wdrożone razem znoszą swoje wady:
    powiadomienia dawały sygnał głośny i w złym miejscu, dziennik daje ten
    sam sygnał cicho i we właściwym.

    Kategoria niska odpowiada temu, co ta zmiana daje na serwerze. Na
    stanowisku roboczym punkt ten waży więcej, bo tam okno pojawia się
    naprawdę i naprawdę ktoś na nie odpowiada. Jest to jedna z różnic, przez
    które zestawu serwerowego nie należy czytać jak stanowiskowego.
  en: |
    The item shuts the one road in the system by which a firewall rule comes into
    being outside the firewall's configuration. That is how it is worth presenting -
    as a bringing of decisions to one place rather than as a silencing of messages.
    The silencing is a side effect, not the aim.

    The relation to the logging of dropped packets is real here and worth showing in
    the interface. Rolled out together the rules cancel each other's faults:
    notifications gave a loud signal in the wrong place, the log gives the same
    signal quietly and in the right one.

    The low category answers to what this change gives on a server. On a
    workstation the item weighs more, since there the window really does appear and
    somebody really does answer it. It is one of the differences on account of which
    the server set is not to be read as the workstation one.
