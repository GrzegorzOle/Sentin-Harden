id: win2025-appx-non-admin-install-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji przez użytkowników bez uprawnień zablokowane
    en: Installing application packages by users without rights blocked
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania kontu bez uprawnień instalować pakiety aplikacji na
    własny użytek. Wartością jest to, że wykaz oprogramowania na maszynie
    pozostaje wykazem — nie rozrasta się o rzeczy, o których nikt nie
    wie.

    Obniżam kategorię do niskiej i powód jest ten sam, dla którego
    obniżyłem punkty ekranu logowania: na zwykłym serwerze nie ma
    interaktywnych użytkowników bez uprawnień. Konta bez uprawnień
    owszem są — konta usług — ale one się nie logują i niczego sobie nie
    instalują. Punkt broni przed czynnością, która na takiej maszynie
    nie zachodzi.

    Wartość wraca w jednym miejscu i jest to to samo miejsce, co
    poprzednio: serwer terminali. Tam użytkownicy bez uprawnień logują
    się naprawdę, jest ich wielu i każdy z nich może wnieść na wspólną
    maszynę własne oprogramowanie. Wykaz przestaje być wykazem, a maszyna
    wspólna zaczyna się różnić od tego, co o niej zapisano.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na serwerze
    terminali możliwość wniesienia własnego programu przez konto
    zwykłego użytkownika. Na serwerze bez sesji użytkowników — nic.
  en: |
    The item forbids an account without rights to install packages of applications for its own use.
    The worth is that the roll of the software upon the machine stays a roll - it grows not by things
    nobody knows of.

    I lower the category to low, and the ground is the same whereof I lowered the items of the
    sign-in screen - upon an ordinary server there are no between-speaking users without rights.
    Accounts without rights there are indeed - the accounts of services - but they sign not in and
    install themselves nothing. The item wards against a doing that upon such a machine comes not
    about.

    The worth comes back in one place and it is the same place as before - a server of terminals.
    There the users without rights sign in truly, they are many, and every one of them may bring
    software of their own onto a shared machine. The roll stops being a roll, and the shared machine
    begins to differ from what has been written of it.

    What an attacker gains while the item goes unmet - upon a server of terminals, the leave to bring
    a program of their own by the account of an everyday user. Upon a server with no sittings of
    users - nothing.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" mimo obniżonej kategorii i chcę
    powiedzieć, dlaczego te dwie rzeczy rozchodzą się tu w przeciwne
    strony. To jest dokładnie ten przypadek, dla którego trzymam ryzyko
    i uciążliwość na osobnych osiach.

    Na zwykłym serwerze zmiana jest bez skutku, bo nie ma komu
    przeszkodzić. Ale dokładnie tam, gdzie punkt zaczyna mieć wartość —
    na serwerze terminali — zaczyna też przeszkadzać, i to od razu wielu
    osobom naraz. Jedna zmiana, dwa różne serwery, dwa przeciwne
    wnioski.

    Na serwerze terminali skutek jest odczuwalny i widoczny: użytkownik
    próbuje zainstalować pakiet i dostaje odmowę. Zwykle jest to coś
    drobnego — narzędzie do odczytu formatu, klient jakiejś usługi,
    dodatek ułatwiający pracę. Drobne, ale używane, więc pytanie trafi
    do obsługi tego samego dnia.

    Tryb zbiorczy jest tu wykluczony nie dlatego, że zmiana jest groźna,
    tylko dlatego, że jej znaczenie zależy od roli maszyny — a rola
    maszyny nie wynika z żadnego wpisu, który dałoby się sprawdzić
    automatycznie.

    Zmiana cofa się natychmiast i nie wymaga restartu. Pakiety już
    zainstalowane przez użytkowników pozostają na miejscu.
  en: |
    I leave the class "needs a checking" for all the lowered category, and I mean to say why those
    two things here go apart in opposite ways. It is just the case whereof I hold hazard and
    disruption upon sundered axes.

    Upon an ordinary server the change is without outcome, there being nobody to hinder. Yet just
    there where the item begins to have worth - upon a server of terminals - it begins also to
    hinder, and that at once and to many at a time. One change, two sundry servers, two opposite
    endings.

    Upon a server of terminals the outcome is marked and seen - a user tries to install a package and
    gets a refusal. It is mostly something small - a tool for the reading of a shape, a client of
    some service, an eking that makes the work lighter. Small, but used, so the question will reach
    the handlers the same day.

    The bulk mode is here shut out not for the change's being fearsome but for its weight hanging
    upon the machine's role - and the machine's role follows from no entry that could be looked to of
    itself.

    The change is undone at once and takes no restart. Packages already installed by users stay where
    they are.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na serwerze terminali użytkownik próbujący zainstalować pakiet dostaje odmowę
      - Jest to zwykle narzędzie do odczytu formatu, klient usługi albo dodatek ułatwiający pracę
      - Drobne, ale używane, więc pytanie trafi do obsługi tego samego dnia
      - Na serwerze bez sesji użytkowników zmiana nie ma komu przeszkodzić i jest bez skutku
      - Pakiety już zainstalowane przez użytkowników pozostają na miejscu
    en:
      - Upon a server of terminals a user trying to install a package gets a refusal
      - It is mostly a tool for the reading of a shape, a client of a service or an eking that makes the work lighter
      - Small, but used, so the question will reach the handlers the same day
      - Upon a server with no sittings of users the change has nobody to hinder and is without outcome
      - Packages already installed by users stay where they are
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, a użytkownicy instalują sobie drobne narzędzia do własnej pracy
    en:
      - The machine is a server of terminals and the users install themselves small tools for their own work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BlockNonAdminUserInstall'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'BlockNonAdminUserInstall'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Weight depends on the machine's role and no registry value states that
    # role: on a terminal server this refuses many users at once, elsewhere it
    # has nobody to refuse.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockNonAdminUserInstall' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/apps-in-windows-10

notes:
  pl: |
    Punkt, w którym ryzyko i uciążliwość rozchodzą się w przeciwne
    strony, i dlatego warto go czytać jako przykład, po co te dwie osie
    są trzymane osobno.

    Na zwykłym serwerze zmiana jest bez skutku, bo nie ma komu
    przeszkodzić. Dokładnie tam, gdzie zaczyna mieć wartość — na serwerze
    terminali — zaczyna też przeszkadzać, i od razu wielu osobom naraz.

    Tryb zbiorczy wykluczony nie dlatego, że zmiana jest groźna, tylko
    dlatego, że jej znaczenie zależy od roli maszyny, a rola nie wynika
    z żadnego wpisu dającego się sprawdzić automatycznie.
  en: |
    An item wherein hazard and disruption go apart in opposite ways, and therefore worth reading as a
    showing of what those two axes are held sundered for.

    Upon an ordinary server the change is without outcome, there being nobody to hinder. Just there
    where it begins to have worth - upon a server of terminals - it begins also to hinder, and at
    once to many at a time.

    The bulk mode is shut out not for the change's being fearsome but for its weight hanging upon the
    machine's role, and the role follows from no entry that could be looked to of itself.
