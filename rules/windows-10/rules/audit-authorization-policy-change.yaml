id: win10-audit-authorization-policy-change

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmian zasad autoryzacji
    en: The audit of changes to the rules of authorisation
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zmiany w przypisaniu uprawnień — czyli w tym, komu
    wolno na tej maszynie zrobić rzeczy, których zwykłemu użytkownikowi
    zrobić nie wolno.

    Uprawnienia takie jak przejęcie własności pliku, ładowanie sterownika,
    działanie jako część systemu operacyjnego albo debugowanie programów
    nie są ustawieniami kosmetycznymi. Nadanie któregokolwiek z nich kontu
    zwykłemu jest drogą do pełnej władzy nad maszyną, otwartą po cichu
    i działającą także po zamknięciu sesji, w której ją otwarto.

    Jest to sposób na trwałość odporniejszy niż większość znanych, bo nie
    wymaga żadnego pliku, żadnej usługi i żadnego wpisu, który wyglądałby
    podejrzanie. Konto pozostaje zwykłym kontem i różni się od reszty
    wyłącznie jednym wierszem w zasadach.

    Podkategoria ta jest jedynym miejscem, w którym taka zmiana zostaje
    odnotowana w chwili, w której nastąpiła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałe
    uprawnienia na koncie zwykłym, nadane bez śladu i niewidoczne
    w niczym poza samymi zasadami.
  en: |
    The setting writes down changes in the granting of rights - which is to say in who upon this machine may do
    the things an ordinary user may not.

    Rights such as the taking of ownership of a file, the loading of a driver, the acting as part of the
    operating system or the debugging of programs are no cosmetic settings. The granting of any one of them to
    an ordinary account is a road to full sway over the machine, opened quietly and working on after the session
    in which it was opened has closed.

    It is a means of lastingness hardier than most known, calling for no file, no service and no entry that
    would look suspect. The account stays an ordinary account and parts from the rest by one line in the rules
    alone.

    This subcategory is the one place in which such a change is set down at the moment it happened.

    What an attacker gains while the item goes unmet: lasting rights upon an ordinary account, granted without a
    trace and seen in nothing but the rules themselves.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnego uprawnienia i nie wpływa na to, kto może
    je nadawać. Zapisuje wyłącznie fakt nadania albo odebrania.

    Liczba wpisów jest bliska zeru. Przypisanie uprawnień zmienia się przy
    wdrożeniach i przy zmianach zasad, czyli rzadko i w sposób planowany.

    Na maszynie w domenie wpisy pojawiają się przy odświeżaniu zasad
    przychodzących z zewnątrz. Są powtarzalne i łatwe do odróżnienia od
    zmiany wykonanej ręcznie.

    Odnotowuję, że zapisywany jest wyłącznie wynik udany. Próba nadania
    uprawnienia odrzucona z braku praw nie jest zmianą zasad i jej ślad leży
    gdzie indziej.

    Czego to nie psuje: nadawania uprawnień, zmieniania zasad, logowania,
    kont domenowych, udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no right and bears not upon who may grant them. It writes down the fact of a granting or
    a taking away alone.

    The number of entries is near nought. The granting of rights changes at rollings out and at changes of the
    rules - which is to say seldom and by plan.

    Upon a machine in a domain entries come up at the refreshing of rules arriving from without. They repeat and
    are easy to part from a change made by hand.

    I set down that only the successful outcome is written. An attempt at granting a right refused for want of
    rights is no change of the rules, and its trace lies elsewhere.

    What this does not break: the granting of rights, the changing of the rules, logging on, domain accounts,
    file shares, printing, or applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na maszynie w domenie wpisy pojawiają się przy odświeżaniu zasad przychodzących z zewnątrz
      - Są powtarzalne i trzeba umieć odróżnić je od zmiany wykonanej ręcznie
      - Zapisywany jest wyłącznie wynik udany, bo próba odrzucona nie jest zmianą zasad
      - Ustawienie nie zmienia żadnego uprawnienia i nie wpływa na to, kto może je nadawać
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Upon a machine in a domain entries come up at the refreshing of rules arriving from without
      - They repeat, and have to be told apart from a change made by hand
      - Only the successful outcome is written, a refused attempt being no change of the rules
      - The setting changes no right and bears not upon who may grant them
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zapis nie jest zbierany poza maszynę i nie ma kto porównywać go ze stanem przypisania uprawnień
    en:
      - The record is not gathered away from the machine and there is nobody to set it against the state of the granted rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9231-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9231-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9231-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the successful outcome is recorded. An attempt at granting a right that
    # was refused is not a change of the rules, and its trace lies elsewhere.
    auditpol /set /subcategory:"{0CCE9231-69AE-11D9-BED3-505054503030}" /success:enable /failure:disable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9231-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-authorization-policy-change

notes:
  pl: |
    Reguła jest w tym bloku tą, która najlepiej pokazuje, po co inspekcja
    zmian w ogóle istnieje. Przypisanie uprawnień jest stanem, a nie
    zdarzeniem — audyt stanu powie, jak jest dzisiaj, i nigdy nie powie,
    od kiedy i za czyją sprawą.

    Warto, żeby aplikacja pokazała tę regułę razem z regułami sprawdzającymi
    samo przypisanie uprawnień. Jedne mówią, co jest; ta mówi, skąd się
    wzięło. Dopiero razem odpowiadają na pytanie, które zadaje audyt.

    Odnotowuję powód, dla którego kategoria jest wysoka mimo braku
    uciążliwości. Nadanie uprawnienia kontu zwykłemu jest najcichszą znaną
    drogą do trwałości: nie zostawia pliku, usługi ani wpisu, który
    wyglądałby podejrzanie. Bez tej podkategorii nie zostawia też chwili,
    w której nastąpiło.
  en: |
    The rule is the one in this block that best shows what an audit of changes is for at all. The granting of
    rights is a state and not an event - an audit of a state will say how things stand today, and will never say
    since when and by whose doing.

    It is well that the application show this rule beside the rules that check the granting of rights itself.
    Those say what is; this says where it came from. Only together do they answer the question an audit puts.

    I set down the reason the category is high though there is no disruption. The granting of a right to an
    ordinary account is the quietest known road to lastingness: it leaves no file, no service and no entry that
    would look suspect. Without this subcategory it leaves no moment at which it happened either.
