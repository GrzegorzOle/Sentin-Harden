id: win11-cloud-optimized-content-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Treści dobierane w chmurze pod użytkownika wyłączone
    en: Content selected in the cloud to suit the user turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Część elementów interfejsu nie jest zapisana w systemie, tylko dobierana
    zdalnie i pobierana w trakcie pracy: podpowiedzi w menu, kafelki, propozycje
    aplikacji, elementy powitania po aktualizacji. Dobór odbywa się na podstawie
    tego, jak maszyna jest używana.

    Dla organizacji oznacza to dwie rzeczy. Po pierwsze, wygląd i zawartość
    interfejsu przestają być przewidywalne — dwie maszyny z tą samą polityką
    mogą pokazywać co innego, a to, co pokazują, zmienia się bez żadnej zmiany
    po naszej stronie. Po drugie, jest to kolejny kanał, którym treść z sieci
    trafia do interfejsu systemu, omijając wszystko, czym filtruje się ruch
    przeglądarki.

    Wyłączenie zostawia interfejs taki, jakim został wydany i skonfigurowany.
  en: |
    Some interface elements are not stored in the system but chosen remotely and
    fetched during work: hints in menus, tiles, application suggestions, welcome
    elements after an update. The choosing is based on how the machine is used.

    For an organisation this means two things. First, the look and contents of the
    interface stop being predictable - two machines under the same policy can show
    different things, and what they show changes with no change on our side.
    Second, it is one more channel by which content from the network reaches the
    system interface, going round everything used to filter browser traffic.

    Turning it off leaves the interface as it was shipped and configured.

disruption_description:
  pl: |
    Nic nie przestaje działać. Interfejs staje się uboższy o rzeczy, których
    nikt nie zamawiał.

    Znikają podpowiedzi dobierane pod użytkownika, propozycje aplikacji
    i elementy powitalne pojawiające się po większych aktualizacjach. Menu,
    wyszukiwanie i wszystko, co jest częścią samego systemu, działa bez zmian.

    Osoba przyzwyczajona do podpowiedzi zauważy ich brak przez kilka dni.
    Nie ma tu jednak funkcji, która przestaje działać — jest tylko treść, która
    przestaje się pojawiać.

    Nie ma restartu ani wylogowania, a zmiana wchodzi po ponownym zalogowaniu.
  en: |
    Nothing stops working. The interface grows poorer by things nobody ordered.

    What disappears are hints chosen to suit the user, application suggestions and
    welcome elements showing up after larger updates. Menus, search and everything
    that is part of the system itself work unchanged.

    Somebody used to the hints will notice their absence for a few days. There is
    no function here that stops working, though - only content that stops
    appearing.

    There is no restart and no sign-out, and the change takes effect at the next
    sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Podpowiedzi i propozycje aplikacji dobierane pod użytkownika przestaną się pojawiać
      - Elementy powitalne po większych aktualizacjach systemu znikną
    en:
      - Hints and application suggestions chosen to suit the user stop appearing
      - Welcome elements shown after larger system updates disappear
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableCloudOptimizedContent'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableCloudOptimizedContent'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableCloudOptimizedContent' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Reguła jest przykładem punktu, którego wartość polega na przewidywalności,
    a nie na odparciu konkretnego ataku. Interfejs, który wygląda tak samo na
    każdej maszynie, pozwala obsłudze rozpoznać element, którego tam być nie
    powinno. Interfejs zmienny nie pozwala na to nikomu.

    Trzy reguły paczki dotyczą treści przychodzącej z sieci do interfejsu
    i warto je czytać jako jedną decyzję. Osobno odpowiadają za różne źródła,
    razem dają interfejs bez treści spoza organizacji.
  en: |
    The rule is an example of an item whose value lies in predictability rather
    than in repelling a particular attack. An interface that looks the same on
    every machine lets support recognise an element that should not be there. A
    changing interface lets nobody do that.

    Three rules in the pack concern content arriving from the network into the
    interface and are worth reading as one decision. Separately they answer for
    different sources; together they give an interface with no content from
    outside the organisation.
