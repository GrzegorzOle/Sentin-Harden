id: win2025-printer-driver-install-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Instalowanie sterowników drukarek zastrzeżone dla administratorów
    en: Installing printer drivers reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania użytkownikom bez uprawnień administratora wgrywać
    sterowniki drukarek do tej maszyny jako do serwera wydruku.

    Punkt jest bliźniaczy wobec ograniczenia instalacji przy połączeniu
    z drukarką sieciową i warto od razu powiedzieć, czym się od niego
    różni, bo mylenie tych dwóch rzeczy jest łatwe.

    Tamten mówi, czy ta maszyna wolno pobrać i zainstalować u siebie
    sterownik przysłany przez serwer wydruku — czyli zabezpiecza ją jako
    klienta. Ten mówi, kto wolno umieścić sterownik na tej maszynie,
    żeby rozdawała go dalej — czyli zabezpiecza ją jako serwer.

    Na serwerze druga strona tej relacji jest tą właściwą. Sterownik
    umieszczony na serwerze wydruku jest wykonywany w buforze wydruku
    z uprawnieniami systemu, i to dwukrotnie: raz na samym serwerze,
    a potem na każdej maszynie, która ten sterownik od niego pobierze.

    Napastnik, który umieści własny sterownik na serwerze wydruku, nie
    przejmuje więc jednej maszyny. Przejmuje serwer i dostaje drogę do
    każdego klienta, który się do niego podłączy — a klientów serwer
    wydruku ma z definicji wielu i łączą się same, bez udziału ludzi.

    Ustawienie domyślne systemu wymaga uprawnień administratora, więc
    niezgodność oznacza zwykle wpis wprowadzony kiedyś ręcznie, żeby
    komuś ułatwić pracę. Warto ustalić komu, zanim się go cofnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    umieszczenia własnego kodu na serwerze wydruku i rozesłania go stamtąd
    na wszystkie maszyny, które z tego serwera korzystają.
  en: |
    The setting forbids users without administrative rights to lay printer drivers into this
    machine as into a print server.

    The item is a twin of the bounding of installation at the connecting to a network printer, and
    it is worth saying at once how it differs, those two being easy to confuse.

    That one says whether this machine may fetch and install a driver sent by a print server -
    that is, it shields it as a client. This one says who may lay a driver onto this machine so
    that it deals it out further - that is, it shields it as a server.

    On a server the second side of that relation is the right one. A driver laid onto a print
    server is run in the print spooler with the system's rights, and that twice over: once on the
    server itself, and then on every machine that fetches the driver from it.

    An attacker who lays a driver of their own onto a print server therefore takes no single
    machine. They take the server and get a road to every client that connects to it - and a print
    server has clients many by definition, and they connect of themselves, with no person's part.

    The system's default setting calls for administrative rights, so non-compliance usually means
    an entry made by hand at some time, to ease somebody's work. It is worth settling whose before
    it is undone.

    What an attacker gains while the item goes unmet: the means of laying their own code onto a
    print server and sending it out thence to every machine that uses that server.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz: czy na tej maszynie ktoś bez
    uprawnień administratora wgrywa sterowniki drukarek.

    Na większości serwerów nikt tego nie robi, bo nikt bez uprawnień
    administratora nie ma tam w ogóle czego szukać. Tam zmiana nie
    zepsuje niczego, a jeżeli maszyna jest w stanie domyślnym, reguła
    jest już spełniona.

    Przypadek, który trzeba wskazać, jest jeden i dotyczy serwera
    wydruku obsługiwanego przez osoby z uprawnieniami operatora wydruku,
    a nie administratora. Bywa tak w organizacjach, w których obsługa
    drukarek została oddana zespołowi pomocy technicznej bez dawania mu
    pełnych uprawnień na serwerze. Po zmianie osoby te nie wgrają nowego
    sterownika.

    Nie jest to argument za cofnięciem zmiany. Jest to argument za tym,
    żeby uzgodnić, kto sterowniki wgrywa, zanim się przestanie im na to
    pozwalać — bo objawem będzie odmowa w chwili, gdy ktoś podłącza nową
    drukarkę, czyli zwykle wtedy, gdy się spieszy.

    Zmiana wymaga ponownego uruchomienia bufora wydruku. Na serwerze
    wydruku oznacza to przerwanie zadań w toku i utratę tego, co stoi
    w kolejce — skutek odczuwalny przez ludzi, którzy o zmianie nie
    wiedzą. Restart planuje się poza godzinami pracy.

    Drukowanie, kolejki i sterowniki już wgrane pozostają po zmianie bez
    różnicy. Punkt dotyczy wyłącznie wgrywania nowych.
  en: |
    One thing needs checking: whether anyone without administrative rights lays printer drivers
    onto this machine.

    On most servers nobody does, nobody without administrative rights having anything to seek
    there at all. There the change will break nothing, and where the machine is in its default
    state the rule is met already.

    The case that must be named is one and bears on a print server served by people with the
    rights of a print operator and not of an administrator. So it is in organisations where the
    tending of printers was given over to a team of technical help without giving it full rights
    on the server. After the change those people will not lay in a new driver.

    It is no argument for undoing the change. It is an argument for agreeing who lays drivers in
    before they stop being allowed to - the symptom being a refusal at the moment somebody
    connects a new printer, that is usually when they are in haste.

    The change takes a fresh start of the print spooler. On a print server that means the breaking
    of jobs under way and the loss of what stands in the queue - an effect felt by people who know
    nothing of the change. The restart is planned outside working hours.

    Printing, queues and drivers already laid in stay after the change with no difference. The
    item bears on the laying in of new ones alone.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Osoba z uprawnieniami operatora wydruku, ale bez uprawnień administratora, nie wgra nowego sterownika
      - Objawem jest odmowa w chwili podłączania nowej drukarki, zwykle pod presją czasu
      - Ponowne uruchomienie bufora przerywa zadania w toku i kasuje to, co stoi w kolejce
      - Drukowanie, kolejki i sterowniki już wgrane pozostają bez różnicy
    en:
      - A person with the rights of a print operator but without administrative rights will not lay in a new driver
      - The symptom is a refusal at the moment a new printer is connected, usually under the press of time
      - A fresh start of the spooler breaks jobs under way and clears what stands in the queue
      - Printing, queues and drivers already laid in stay with no difference
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa drukarek na tym serwerze została oddana zespołowi bez uprawnień administratora
      - Nie ustalono, kto na tej maszynie wgrywa sterowniki drukarek
    en:
      - The tending of printers on this server was given over to a team without administrative rights
      - It was not settled who lays printer drivers onto this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
      $name = 'AddPrinterDrivers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
    $name = 'AddPrinterDrivers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Print\Providers\LanMan Print Services\Servers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AddPrinterDrivers' -Value 1 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/devices-prevent-users-from-installing-printer-drivers

notes:
  pl: |
    Punkt jest bliźniaczy wobec ograniczenia instalacji przy połączeniu
    z drukarką sieciową, ale opisuje drugą stronę relacji. Tamten
    zabezpiecza maszynę jako klienta, ten jako serwer wydruku.

    Sterownik umieszczony na serwerze wydruku jest wykonywany
    z uprawnieniami systemu dwukrotnie: na samym serwerze i na każdej
    maszynie, która go stamtąd pobierze.

    Kategorię podniosłem względem paczki stanowiska roboczego, bo na
    serwerze przejęcie dotyczy nie jednej maszyny, tylko wszystkich jego
    klientów.
  en: |
    The item is a twin of the bounding of installation at the connecting to a network printer, but
    sets down the other side of the relation. That one shields the machine as a client, this one
    as a print server.

    A driver laid onto a print server is run with the system's rights twice over: on the server
    itself and on every machine that fetches it thence.

    I raised the category against the working station's pack, the taking bearing on a server not
    upon one machine but upon all its clients.
