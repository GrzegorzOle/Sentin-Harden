id: win2016-device-install-deny-sbp2-class

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Zakaz instalowania pamięci masowej na starszym złączu szeregowym
    en: Mass storage on the older serial connector forbidden to install
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania instalowania sterowników dla klasy urządzeń pamięci
    masowej podłączanych starszym złączem szeregowym, i robi to wstecznie.

    Punkt należy do tej samej rodziny co poprzedni i broni przed tym samym:
    przed odczytem pamięci maszyny przez urządzenie podłączone z zewnątrz.
    Złącze, o które tu chodzi, powstało w latach, gdy dostęp wprost do
    pamięci uważano za zaletę bez zastrzeżeń — i daje go dokładnie tak samo.

    Kategoria jest jednak niższa i chcę powiedzieć dlaczego, zamiast
    zostawiać to bez wyjaśnienia. Złącze to zniknęło z serwerów ponad dekadę
    temu i na maszynie kupionej niedawno najczęściej nie ma go wcale.
    Napastnik potrzebowałby dostępu fizycznego do maszyny wyposażonej
    w sprzęt, którego już się nie montuje.

    Nie znaczy to jednak, że punkt jest pusty. Serwery pracują długo,
    a maszyna z rocznika, w którym złącze jeszcze montowano, nadal stoi
    w niejednej serwerowni. Tam punkt broni przed czymś realnym i kosztuje
    tyle co nic.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na maszynie
    wyposażonej w to złącze — odczyt pamięci po podłączeniu urządzenia;
    na maszynie bez niego — nic.
  en: |
    The setting forbids drivers to be installed for a class of mass storage devices
    attached by the older serial connector, and does so backwards.

    The item belongs to the same family as the previous one and guards against the
    same thing: a read of the machine's memory by a device attached from outside.
    The connector in question came about in years when access straight into memory
    was reckoned an unqualified merit - and it gives that access just the same.

    The category is lower, though, and I shall say why rather than leave it
    unexplained. That connector vanished from servers over a decade ago and on a
    machine bought recently is most often not there at all. An attacker would need
    physical access to a machine fitted with hardware nobody installs any more.

    That does not make the item empty, however. Servers work for a long time, and a
    machine of a vintage where the connector was still fitted stands in many a
    server room yet. There the item guards against something real and costs next to
    nothing.

    What an attacker gains while the item goes unmet: on a machine fitted with that
    connector - a read of memory once a device is attached; on a machine without it
    - nothing.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba jedną rzecz: czy maszyna
    to złącze w ogóle ma.

    Na maszynie bez tego złącza skutków nie ma żadnych i wpis jest wyłącznie
    zapisem decyzji. Na maszynie ze złączem skutek zależy od tego, czy coś
    z niego korzysta.

    Przypadek wart wymienienia dotyczy sprzętu starszego, ale wciąż
    pracującego. Macierz dyskowa podłączona tym złączem, urządzenie
    przechwytujące obraz, sprzęt pomiarowy albo studyjny — wszystkie one
    w tym rodzaju sprzętu jeszcze występują i wszystkie przestaną działać.

    Wsteczność jest tu łagodniejsza niż przy regule poprzedniej i to
    właśnie różni obie w skutkach. Tamta dotyczyła kontrolerów, więc
    wyłączała całe złącze i wymagała restartu. Ta dotyczy klasy pamięci
    masowej, więc odbiera urządzeniu sterownik bez ruszania samego
    kontrolera — i cofa się natychmiast.

    Czego to nie psuje: dysków wewnętrznych, sieci, usług, logowania,
    urządzeń na złączach nowszych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and one thing has to be checked: whether the
    machine has that connector at all.

    On a machine without it there are no consequences whatever and the entry is
    nothing but a record of a decision. On a machine with it the consequence turns
    on whether anything uses it.

    A case worth naming concerns hardware that is older but still at work. A disk
    array attached by that connector, a device capturing video, measuring or studio
    hardware - all of them still occur in that kind of equipment and all will stop
    working.

    The working backwards is gentler here than at the previous rule, and that is
    what parts the two in their consequences. That one concerned controllers, so it
    switched off the whole connector and called for a restart. This one concerns the
    mass storage class, so it takes a device's driver away without touching the
    controller itself - and is undone at once.

    What this does not break: internal disks, the network, services, signing in, or
    devices on newer connectors.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Macierz dyskowa podłączona tym złączem przestaje być widoczna dla systemu i pozostaje bez sterownika
      - Urządzenie przechwytujące obraz, sprzęt pomiarowy albo studyjny na tym złączu przestaje działać
      - Na maszynie bez tego złącza nie dzieje się nic, a wpis jest wyłącznie zapisem decyzji
      - Dyski wewnętrzne, sieć, usługi i urządzenia na złączach nowszych pozostają bez zmian
    en:
      - A disk array attached by that connector stops being visible to the system and is left without a driver
      - A device capturing video, or measuring or studio hardware on that connector, stops working
      - On a machine without that connector nothing happens and the entry is nothing but a record of a decision
      - Internal disks, the network, services and devices on newer connectors stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Do maszyny podłączona jest tym złączem macierz dyskowa albo inne urządzenie pamięci masowej wciąż używane
      - Sprzęt pomiarowy albo przechwytujący obraz na tym złączu jest częścią roli tej maszyny
    en:
      - A disk array or other mass storage device still in use is attached to the machine by that connector
      - Measuring or video-capturing hardware on that connector is part of this machine's role
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $deny = $item.DenyDeviceClasses
        $retroactive = $item.DenyDeviceClassesRetroactive
        $listKey = Join-Path $path 'DenyDeviceClasses'
        $listed = @()
        if (Test-Path -Path $listKey) {
          $listed = @(
            (Get-ItemProperty -Path $listKey -ErrorAction Stop).PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { ([string]$_.Value).Trim().ToLowerInvariant() }
          )
        }
        $absent = @(@('{d48179be-ec20-11d1-b6b8-00c04fa372a7}') | Where-Object { $listed -notcontains $_ })
        if ($null -eq $deny -or $null -eq $retroactive) { 'MISSING' }
        elseif ([int]$deny -eq 1 -and [int]$retroactive -eq 1 -and $absent.Count -eq 0) { 'DENIED_RETROACTIVELY' }
        else { 'DENY=' + $deny + ' RETROACTIVE=' + $retroactive + ' ABSENT=' + ($absent -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DENIED_RETROACTIVELY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $listKey = Join-Path $path 'DenyDeviceClasses'
    $entries = @()
    if (Test-Path -Path $listKey) {
      $entries = @(
        (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties |
          Where-Object { $_.Name -notlike 'PS*' } |
          ForEach-Object { [pscustomobject]@{ name = $_.Name; value = [string]$_.Value } }
      )
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = (Test-Path -Path $path)
      deny          = $item.DenyDeviceClasses
      deny_existed  = ($null -ne $item.DenyDeviceClasses)
      retro         = $item.DenyDeviceClassesRetroactive
      retro_existed = ($null -ne $item.DenyDeviceClassesRetroactive)
      list_key      = $listKey
      list_existed  = (Test-Path -Path $listKey)
      entries       = $entries
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyDeviceClasses' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DenyDeviceClassesRetroactive' -Value 1 -Type DWord
    $listKey = Join-Path $path 'DenyDeviceClasses'
    if (-not (Test-Path -Path $listKey)) { New-Item -Path $listKey -Force | Out-Null }
    # Entries put here by somebody else guard against something this rule knows
    # nothing about, so the list is added to and never replaced.
    $taken = @{}
    $present = @()
    foreach ($property in (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties) {
      if ($property.Name -notlike 'PS*') {
        $taken[$property.Name] = $true
        $present += ([string]$property.Value).Trim().ToLowerInvariant()
      }
    }
    $index = 1
    foreach ($id in @('{d48179be-ec20-11d1-b6b8-00c04fa372a7}')) {
      if ($present -notcontains $id) {
        while ($taken.ContainsKey([string]$index)) { $index++ }
        New-ItemProperty -Path $listKey -Name ([string]$index) -Value $id -PropertyType String -Force | Out-Null
        $taken[[string]$index] = $true
      }
    }

  rollback_command: |
    # The list is restored wholesale, so this also undoes what a neighbouring device
    # installation rule appended afterwards. Roll these back in the reverse order
    # they were applied.
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.deny_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceClasses' -Value $b.deny -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceClasses' -ErrorAction SilentlyContinue
    }
    if ($b.retro_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceClassesRetroactive' -Value $b.retro -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceClassesRetroactive' -ErrorAction SilentlyContinue
    }
    Remove-Item -Path $b.list_key -Recurse -Force -ErrorAction SilentlyContinue
    if ($b.list_existed) {
      New-Item -Path $b.list_key -Force | Out-Null
      foreach ($entry in @($b.entries)) {
        New-ItemProperty -Path $b.list_key -Name $entry.name -Value $entry.value -PropertyType String -Force | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-device-installation-with-group-policy

notes:
  pl: |
    Punkt jest dobrym przykładem reguły, której wartość zależy od rocznika
    maszyny, a nie od jej roli. Aplikacja ma tu wyraźną robotę do
    wykonania: inwentaryzacja i tak czyta sprzęt, więc potrafi powiedzieć,
    czy to złącze na tej maszynie istnieje — a wtedy ostrzeżenie brzmi
    „masz to u siebie" zamiast „może komuś przeszkadzać".

    Zastrzeżenie zwykłe: brak wykrycia nie jest dowodem nieobecności.
    Kontroler wyłączony w oprogramowaniu układowym nie pokaże się w spisie,
    a po jego włączeniu złącze wróci.

    Reguła współdzieli listę z regułą sąsiednią i wycofanie odtwarza tę
    listę w całości. Wycofywać należy w kolejności odwrotnej do stosowania,
    inaczej cofnięcie jednej zabierze wpisy drugiej.

    Warto przedstawiać ten punkt razem z poprzednim jako jedną decyzję
    o kanałach sięgających do pamięci — bo rozdzielone wyglądają na dwie
    drobne reguły o starym sprzęcie, a razem opisują konkretną drogę ataku.
  en: |
    The item is a good example of a rule whose value turns on the machine's vintage
    rather than on its role. The application has plain work to do here: the
    inventory reads the hardware anyway, so it can say whether that connector exists
    on this machine - and then the warning reads "you have this here" instead of "it
    may get in somebody's way".

    The usual reservation: a failure to detect is no proof of absence. A controller
    switched off in the firmware will not show in the inventory, and once switched
    on the connector returns.

    The rule shares its list with the neighbouring one, and the rollback restores
    that list wholesale. They must be rolled back in the reverse order of their
    application, else undoing one will take away the other's entries.

    The item is worth presenting together with the previous one as a single decision
    about channels reaching into memory - since apart they look like two small rules
    about old hardware, and together they describe a particular road of attack.
