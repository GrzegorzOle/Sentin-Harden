id: win2016-local-logon-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie lokalne zastrzeżone dla administratorów
    en: Local sign-in restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zawęża listę kont uprawnionych do logowania przy konsoli maszyny do
    grupy administratorów lokalnych.

    Serwer nie jest stanowiskiem pracy i to jest cała myśl tego punktu. Sesja
    przy konsoli serwera to sesja obsługi — jedyny powód, dla którego ktoś ją
    otwiera, to zrobienie czegoś z maszyną. Konto, które nie ma na tej maszynie
    nic do zrobienia, nie potrzebuje więc możliwości jej otwarcia.

    Znaczenie punktu leży w tym, czego sesja przy konsoli nie ma. Nie przechodzi
    przez zaporę, nie widać jej w połączeniach sieciowych i nie zostawia śladu
    na kontrolerze domeny w takiej postaci jak logowanie zdalne. Jest to
    najcichsze wejście, jakie maszyna oferuje.

    Kategoria wysoka, bo zawężenie tej listy odbiera napastnikowi z dostępem do
    konsoli — czyli do panelu wirtualizacji albo karty zarządzającej — możliwość
    użycia dowolnego zdobytego konta.

    Na serwerze 2016 warto pamiętać, że lista ta bywa szeroka nie z zaniedbania,
    tylko z historii: maszyna postawiona jako serwer aplikacyjny z interfejsem
    użytkownika ma na niej grupy, które kiedyś były potrzebne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję przy
    konsoli z dowolnego zdobytego konta, w kanale, którego nie widać ani
    w zaporze, ani w ruchu sieciowym.
  en: |
    The item narrows the list of accounts permitted to sign in at the machine's
    console to the local administrators group.

    A server is not a workplace, and that is the whole thought of this item. A
    session at a server's console is an administration session - the only reason
    anybody opens one is to do something with the machine. An account with nothing
    to do on this machine therefore needs no means of opening one.

    The item's weight lies in what a console session lacks. It does not pass
    through the firewall, it does not show among network connections, and it leaves
    no trace on the domain controller of the kind a remote sign-in does. It is the
    quietest entrance the machine offers.

    The category is high, because narrowing this list takes from an attacker with
    console access - that is, with the virtualisation panel or a management card -
    the ability to use any account they have obtained.

    On Server 2016 it is worth remembering that this list is sometimes wide not
    from neglect but from history: a machine set up as an application server with a
    user interface carries groups on it that were once needed.

    What an attacker gains while the item goes unmet: a session at the console from
    any account they have obtained, through a channel visible neither in the
    firewall nor in network traffic.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana potrafi odciąć od maszyny
    ludzi, którzy na niej pracują.

    Sprawdzić trzeba dwie rzeczy. Pierwsza: czy maszyna pełni rolę sesji
    zdalnych albo udostępnia aplikację przez interfejs użytkownika — wtedy lista
    zawiera grupy użytkowników i zawężenie jej zatrzyma im pracę. Druga: czy na
    liście nie ma grup potrzebnych obsłudze zewnętrznej albo operatorom kopii
    zapasowych.

    Na kontrolerze domeny stan domyślny jest szerszy i obejmuje między innymi
    operatorów konta, operatorów serwera i operatorów wydruku. Wynik niezgodny
    na takiej maszynie jest wynikiem prawdziwym, a nie błędem reguły — ale
    zawężenie listy tam wymaga osobnego namysłu.

    Skutek zawężenia jest natychmiastowy: próba zalogowania kończy się
    komunikatem o braku uprawnienia do logowania lokalnego. Wyjdzie więc od razu,
    przy pierwszej próbie, i to jest zarazem dobra i zła wiadomość.

    Czego to nie psuje: logowania przez pulpit zdalny, usług, zadań
    harmonogramu ani dostępu do udziałów sieciowych.

    Bez restartu, natychmiast odwracalne — o ile jest czym się zalogować.
  en: |
    The class is "needs planned rollout", because the change can cut off from the
    machine the people who work on it.

    Two things have to be checked. First: whether the machine serves the remote
    sessions role or presents an application through a user interface - the list
    then holds user groups and narrowing it will stop their work. Second: whether
    the list holds groups needed by outside administrators or by backup operators.

    On a domain controller the default state is wider and covers, among others,
    account operators, server operators and print operators. A non-compliant result
    on such a machine is a true result rather than an error in the rule - but
    narrowing the list there calls for separate thought.

    The effect of narrowing is immediate: an attempt to sign in ends in a message
    about lacking the right to sign in locally. It will therefore come out at once,
    at the first attempt, and that is both good news and bad.

    What this does not break: signing in through remote desktop, services,
    scheduled tasks, or access to network shares.

    No restart, undone immediately - provided there is something to sign in with.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Użytkownicy pracujący na maszynie z rolą sesji zdalnych albo z aplikacją w interfejsie tracą możliwość zalogowania
      - Obsługa zewnętrzna i operatorzy kopii zapasowych logujący się przy konsoli dostają komunikat o braku uprawnienia
      - Na kontrolerze domeny zmiana odbiera logowanie operatorom konta, serwera i wydruku
      - Pulpit zdalny, usługi, zadania harmonogramu i dostęp do udziałów działają bez zmian
    en:
      - Users working on a machine with the remote sessions role or an application in the interface lose the ability to sign in
      - Outside administrators and backup operators signing in at the console get a message about lacking the right
      - On a domain controller the change takes sign-in from account, server and print operators
      - Remote desktop, services, scheduled tasks and access to shares work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę sesji zdalnych albo udostępnia aplikację przez interfejs użytkownika i na liście są grupy użytkowników
      - Maszyna jest kontrolerem domeny, a na liście są operatorzy zgodnie ze stanem domyślnym
    en:
      - The machine serves the remote sessions role or presents an application through a user interface and the list holds user groups
      - The machine is a domain controller and the list holds operators in accordance with the default state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is replaced wholesale. On a machine with the remote sessions role,
    # or on a domain controller, review it first - the refusal shows at the first
    # sign-in attempt.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeInteractiveLogonRight = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/allow-log-on-locally

notes:
  pl: |
    Logowanie przez pulpit zdalny jest osobnym uprawnieniem i opisuje je osobna
    reguła. Zawężenie tej listy nie odbiera dostępu zdalnego i odwrotnie —
    te dwie drogi trzeba ustawiać niezależnie.

    Lista pusta również uchodzi tu za zgodną, choć w praktyce oznacza maszynę,
    do której nie da się zalogować przy konsoli. Bywa to stan zamierzony na
    serwerze zarządzanym wyłącznie zdalnie, ale wymaga świadomej decyzji.

    Stan domyślny zależy od roli maszyny i na kontrolerze domeny jest wyraźnie
    szerszy. To jest ten przypadek, w którym numer punktu z benchmarku warto
    zestawić z rolą, zanim zapadnie decyzja.
  en: |
    Signing in through remote desktop is a separate right and a separate rule
    describes it. Narrowing this list takes no remote access away, and the reverse
    holds too - the two roads have to be set independently.

    An empty list also counts as compliant here, though in practice it means a
    machine that cannot be signed in to at the console. That is sometimes intended
    on a server managed remotely alone, but it calls for a deliberate decision.

    The default state depends on the machine's role and on a domain controller is
    markedly wider. This is the case where the benchmark's item number is worth
    setting beside the role before a decision is taken.
