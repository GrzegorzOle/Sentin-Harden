id: win2025-input-personalization-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Regional and Language Options
  title:
    pl: Zbieranie danych o wprowadzaniu tekstu wyłączone
    en: Collection of data about text input turned off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza zbieranie danych o tym, jak i co użytkownik wprowadza —
    z klawiatury, pisma odręcznego i mowy.

    Kategoria średnia i chcę nazwać przedmiot dokładnie, bo nazwa punktu
    brzmi jak ustawienie wygody. Przedmiotem nie jest układ klawiatury ani
    język interfejsu. Przedmiotem jest treść: wpisywane słowa, nazwy
    własne, poprawki i to, co system z nich wywnioskował, żeby następnym
    razem podpowiadać trafniej.

    To jest właściwa treść punktu. Słownik zbudowany z tego, co ktoś pisze,
    jest wycinkiem jego pracy. Na serwerze pisze się polecenia, nazwy
    serwerów, nazwy udziałów, nazwy kont — zdarza się, że i poświadczenie
    wpisane omyłkowo w niewłaściwym oknie. Zbiór takich słów, przechowywany
    w profilu, jest materiałem, którego nikt świadomie nie zgromadził, ale
    który da się przeczytać.

    Osobno waży to, że dane są trwałe. Sesja się kończy, a zebrany materiał
    zostaje — i wędruje razem z profilem, jeżeli profil jest przenoszony.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowy zbiór
    słów wpisywanych na tej maszynie, w tym nazw własnych z infrastruktury,
    leżący w profilu użytkownika.
  en: |
    The item turns off the collection of data about how and what a user types
    - from the keyboard, from handwriting and from speech.

    The category is medium, and I want to name the subject exactly, because
    the item's name sounds like a convenience setting. The subject is not the
    keyboard layout nor the interface language. The subject is the content:
    the words typed, the proper names, the corrections, and what the system
    inferred from them in order to suggest more accurately next time.

    That is the real substance of the item. A dictionary built from what
    somebody writes is a slice of their work. On a server what is typed are
    commands, server names, share names, account names - and it happens that
    a credential is typed by mistake into the wrong window. A collection of
    such words, kept in the profile, is material nobody deliberately
    gathered, but which can be read.

    It weighs separately that the data is lasting. A session ends, the
    gathered material stays - and it travels with the profile, if the profile
    is a roaming one.

    What an attacker gains while the item goes unmet: a ready collection of
    words typed on this machine, including proper names from the
    infrastructure, lying in the user's profile.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy ludzi, nie maszyny —
    dlatego na serwerze jest zwykle krótkie, a na stanowisku nie.

    Skutek jest odczuwalny dla kogoś, kto pisze dużo i korzysta
    z podpowiedzi: przestaną się uczyć. Słownik zbudowany wcześniej
    przestanie rosnąć, a nazwy własne używane w organizacji trzeba będzie
    wpisywać w całości. Przy pisaniu odręcznym i przy dyktowaniu skuteczność
    rozpoznawania spadnie zauważalnie, bo to właśnie te mechanizmy najwięcej
    zyskują na dopasowaniu.

    Na serwerze nie ma tego problemu: nikt tu nie pisze prozy, a polecenia
    i tak uzupełnia powłoka, a nie słownik systemowy.

    Czego to nie psuje: układów klawiatury, języka interfejsu, przełączania
    języków, sprawdzania pisowni w aplikacjach, które mają własne, ani
    niczego, co jest ustawieniem regionalnym.

    Zastrzeżenie warte zapisania: reguła zatrzymuje zbieranie, a nie usuwa
    tego, co już zebrano. Materiał zgromadzony wcześniej trzeba usunąć
    osobno, a decyzja o tym należy do właściciela maszyny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns people rather than
    the machine - which is why on a server it is short and on a workstation
    it is not.

    The effect is felt by somebody who writes a great deal and uses
    suggestions: they will stop learning. A dictionary built up earlier stops
    growing, and the proper names used in the organisation will have to be
    typed in full. With handwriting and with dictation the accuracy of
    recognition falls noticeably, because those are the mechanisms that gain
    most from being fitted to a person.

    On a server that problem does not arise: nobody writes prose here, and
    commands are completed by the shell rather than by the system's
    dictionary.

    What this does not break: keyboard layouts, the interface language,
    switching between languages, spell checking in applications that have
    their own, or anything that is a regional setting.

    A reservation worth writing down: the rule stops the collecting, it does
    not remove what has already been collected. Material gathered earlier has
    to be removed separately, and that decision belongs to the machine's
    owner.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Podpowiedzi przestaną się uczyć, a nazwy własne używane w organizacji trzeba będzie wpisywać w całości
      - Przy pisaniu odręcznym i przy dyktowaniu skuteczność rozpoznawania spadnie zauważalnie
      - Reguła zatrzymuje zbieranie, ale nie usuwa tego, co już zebrano — materiał trzeba usunąć osobno
      - Układy klawiatury, język interfejsu, przełączanie języków i sprawdzanie pisowni w aplikacjach działają bez zmian
    en:
      - Suggestions stop learning, and proper names used in the organisation have to be typed in full
      - With handwriting and with dictation the accuracy of recognition falls noticeably
      - The rule stops the collecting but does not remove what was collected - that material has to be removed separately
      - Keyboard layouts, the interface language, switching between languages and spell checking in applications work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym ktoś pracuje pismem odręcznym albo dyktowaniem i skuteczność rozpoznawania ma znaczenie
    en:
      - The machine is a workstation where somebody works by handwriting or dictation and the accuracy of recognition matters
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
      $name = 'AllowInputPersonalization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    $name = 'AllowInputPersonalization'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The subject is not the keyboard layout but the content: the words typed,
    # the proper names, the corrections. On a server those are commands, server
    # names, share names and account names. The change stops the collecting; it
    # does not remove what was collected earlier.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInputPersonalization' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

notes:
  pl: |
    Nazwa brzmi jak ustawienie wygody, a przedmiotem jest treść: wpisywane
    słowa, nazwy własne, poprawki i to, co system z nich wywnioskował.

    Słownik zbudowany z tego, co ktoś pisze, jest wycinkiem jego pracy. Na
    serwerze pisze się polecenia, nazwy serwerów, udziałów i kont, a czasem
    poświadczenie wpisane omyłkowo w niewłaściwym oknie.

    Dane są trwałe: sesja się kończy, materiał zostaje i wędruje razem
    z profilem. Reguła zatrzymuje zbieranie, ale nie usuwa tego, co już
    zebrano.
  en: |
    The name sounds like a convenience setting, yet the subject is content:
    the words typed, the proper names, the corrections, and what the system
    inferred from them.

    A dictionary built from what somebody writes is a slice of their work. On
    a server what is typed are commands, server names, share names and
    account names, and sometimes a credential typed by mistake into the wrong
    window.

    The data is lasting: a session ends, the material stays and travels with
    the profile. The rule stops the collecting but does not remove what has
    already been collected.
