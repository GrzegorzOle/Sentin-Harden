id: fedora44-crypto-policy-no-sha1

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.6.3
  section: Initial Setup > Configure system wide crypto policy
  title:
    pl: Systemowa polityka kryptograficzna nie dopuszcza SHA-1 w skrótach i podpisach
    en: Ensure system wide crypto policy disables sha1 hash and signature support
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Dla SHA-1 znane są praktyczne kolizje: da się przygotować dwa różne
    dokumenty lub certyfikaty z tym samym skrótem. Podpis złożony na jednym
    jest wtedy ważny także dla drugiego. Dlatego podpisy i skróty SHA-1 nie
    powinny potwierdzać tożsamości serwerów, pakietów ani wiadomości.

    Punkt sprawdza stan zastosowanej polityki w pliku
    /etc/crypto-policies/state/CURRENT.pol: ogólne listy skrótów (hash)
    i podpisów (sign) nie mogą zawierać SHA-1, a certyfikaty podpisane z użyciem
    SHA-1 nie mogą być akceptowane (sha1_in_certs = 0). Polityka DEFAULT
    w Fedorze to spełnia.
  en: |
    Practical collisions are known for SHA-1: two different documents or
    certificates with the same hash can be prepared. A signature made on one is
    then valid for the other as well. That is why SHA-1 signatures and hashes
    should not confirm the identity of servers, packages or messages.

    The item checks the state of the applied policy in the
    /etc/crypto-policies/state/CURRENT.pol file: the general lists of hashes
    (hash) and signatures (sign) must not contain SHA-1, and certificates
    signed with SHA-1 must not be accepted (sha1_in_certs = 0). The Fedora
    DEFAULT policy meets this.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo naprawa dodaje podpolitykę NO-SHA1, która
    usuwa SHA-1 także z wyjątków, jakie DEFAULT zostawia dla RPM, serwera DNS
    BIND i poczty S/MIME. Dotyczy to głównie starych repozytoriów firm
    trzecich i starej korespondencji podpisanej cyfrowo. Programy przejmują
    nową politykę po restarcie systemu.
  en: |
    The class needs review because the remediation adds the NO-SHA1
    sub-policy, which also removes SHA-1 from the exceptions DEFAULT keeps for
    RPM, the BIND DNS server and S/MIME email. This mostly affects old
    third-party repositories and old digitally signed correspondence. Programs
    pick up the new policy after a system restart.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - updates-and-servicing
    - email-and-attachments
  what_breaks:
    pl:
      - Instalacja lub aktualizacja pakietów z repozytorium firmy trzeciej, którego klucz lub podpisy pakietów używają SHA-1, kończy się błędem weryfikacji podpisu
      - Klient poczty nie potwierdza ważności starszych wiadomości S/MIME podpisanych z użyciem SHA-1
      - Połączenia z serwerami, które przedstawiają certyfikat podpisany z użyciem SHA-1, kończą się błędem weryfikacji certyfikatu
    en:
      - Installing or updating packages from a third-party repository whose key or package signatures use SHA-1 fails with a signature verification error
      - The email client does not confirm the validity of older S/MIME messages signed with SHA-1
      - Connections to servers presenting a certificate signed with SHA-1 fail with a certificate verification error
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stacja instaluje oprogramowanie z repozytorium firmy trzeciej, które nadal podpisuje pakiety z użyciem SHA-1
    en:
      - The workstation installs software from a third-party repository that still signs packages with SHA-1
  reversibility: after-restart

audit:
  shell: bash
  test_command: |
    f=/etc/crypto-policies/state/CURRENT.pol
    if [ ! -r "$f" ]; then echo CHECK_ERROR; exit 0; fi
    awk '
      { l = $0; sub(/#.*/, "", l) }
      l ~ /^[ \t]*(hash|sign)[ \t]*=/ {
        n = l; sub(/[ \t]*=.*/, "", n); gsub(/[ \t]/, "", n)
        v = l; sub(/^[^=]*=/, "", v); k = split(v, t, /[ \t]+/)
        for (i = 1; i <= k; i++) if (t[i] == "SHA1" || t[i] ~ /-SHA1$/) bad[n] = 1 }
      l ~ /^[ \t]*sha1_in_certs[ \t]*=/ { v = l; sub(/^[^=]*=/, "", v); gsub(/[ \t]/, "", v); certs = v }
      END {
        r = ""
        if ("hash" in bad) r = r ",hash"
        if ("sign" in bad) r = r ",sign"
        if (certs != "0") r = r ",sha1_in_certs=" (certs == "" ? "unset" : certs)
        if (r == "") print "SHA1_DISABLED"; else print "SHA1_ALLOWED:" substr(r, 2) }' "$f"
  expected: '^SHA1_DISABLED$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      p=$(update-crypto-policies --show)
      [ -n "$p" ] || { echo "Cannot read the system crypto policy" >&2; exit 1; }
      {
        echo "policy=$p"
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      cur=$(update-crypto-policies --show)
      [ -n "$cur" ] || { echo "Cannot read the system crypto policy" >&2; exit 1; }
      mod=0
      new="${cur%%:*}"
      subs=""
      case "$cur" in *:*) subs=$(printf '%s' "${cur#*:}" | tr ':' ' ') ;; esac
      for s in $subs; do
        case " SHA1 NO-SHA1 " in *" $s "*) ;; *) new="$new:$s" ;; esac
      done
      new="$new:NO-SHA1"
      if [ "$new" = "$cur" ] && [ "$mod" = 0 ]; then echo "The system crypto policy is already $cur"; exit 0; fi
      update-crypto-policies --set "$new" >/dev/null
      echo "Set the system crypto policy to $new; restart the system so that all programs use it"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      p=$(sed -n 's/^policy=//p' "$b" | head -n 1)
      [ -n "$p" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      update-crypto-policies --set "$p" >/dev/null
      echo "Restored the system crypto policy $p; restart the system so that all programs use it"
    )

privileges: root
runnable: true

sources:
  - https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/security_hardening/using-the-system-wide-cryptographic-policies_security-hardening
  - https://gitlab.com/redhat-crypto/fedora-crypto-policies

notes:
  pl: |
    Sprawdzenie patrzy tylko na ogólne wpisy hash i sign, a nie na wpisy
    z zakresem, takie jak hash@rpm, więc na polityce DEFAULT daje wynik
    SHA1_DISABLED. Wynik SHA1_ALLOWED podaje, który warunek nie jest spełniony.

    Naprawa usuwa podpolitykę SHA1, jeśli jest ustawiona, i dodaje dostarczaną
    z Fedorą podpolitykę NO-SHA1, np. DEFAULT zmienia na DEFAULT:NO-SHA1.

    Naprawa zmienia politykę poleceniem update-crypto-policies --set, które
    generuje na nowo pliki w /etc/crypto-policies/back-ends. Programy czytają
    je przy starcie, więc działające usługi i otwarte programy używają starych
    ustawień do czasu ich ponownego uruchomienia; dlatego po naprawie i po
    wycofaniu trzeba zrestartować system. Kopia zapisuje wynik
    update-crypto-policies --show, a wycofanie ustawia go z powrotem.
  en: |
    The check looks only at the general hash and sign entries, not at scoped
    entries such as hash@rpm, so on the DEFAULT policy it gives the
    SHA1_DISABLED result. The SHA1_ALLOWED result tells which condition is not
    met.

    The remediation removes the SHA1 sub-policy if it is set and adds the
    NO-SHA1 sub-policy shipped with Fedora, for example it changes DEFAULT to
    DEFAULT:NO-SHA1.

    The remediation changes the policy with the update-crypto-policies --set
    command, which regenerates the files in /etc/crypto-policies/back-ends.
    Programs read them at start, so running services and open programs use the
    old settings until they are started again; that is why the system has to be
    restarted after the remediation and after rollback. The backup records the
    output of update-crypto-policies --show, and rollback sets it back.
