id: win2025-application-log-size

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Application
  title:
    pl: Maksymalny rozmiar dziennika aplikacji
    en: Maximum size of the application log
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę rozmiaru dziennika aplikacji. Dziennik ten
    zbiera zapisy wytwarzane przez zainstalowane oprogramowanie.

    Zostawiam kategorię niską, choć przy dwóch pozostałych dziennikach ją
    podniosłem, i chcę wyłożyć, dlaczego akurat tu nie.

    Zawartość tego dziennika nie zależy od systemu, tylko od tego, co na
    maszynie postawiono. Serwer bazy danych zapisuje tu inaczej niż
    serwer plików, a aplikacja biznesowa potrafi wytwarzać więcej zapisów
    niż cały system razem wzięty. Znaczy to, że liczba z benchmarku nie
    ma tutaj żadnego dającego się obronić związku z rzeczywistością tej
    maszyny — jest progiem umownym, nie odpowiedzią.

    Wartość tej reguły na serwerze leży więc nie w liczbie, którą
    wpisuje, ale w pomiarze, do którego zmusza. Jeżeli po zastosowaniu
    punkt jest spełniony, a dziennik i tak obejmuje pół dnia, to znaczy,
    że wynik zielony niczego tu nie załatwił. Pisząc to wprost, wolę
    powiedzieć, że reguła jest słaba, niż udawać, że jest mocna.

    Zostaje jedna rzecz konkretna: to jest dziennik, o który prosi
    producent oprogramowania przy zgłoszeniu awarii, a zapisów z okresu
    awarii nie da się odtworzyć po fakcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio; dziennik aplikacji rzadko bywa miejscem, w którym widać
    atak, choć bywa miejscem, w którym widać jego skutki uboczne.
  en: |
    The item sets the lower bound of the size of the application log. That log gathers the writings
    made by the installed software.

    I leave the category low, though at the two other logs I raised it, and would set out why not here
    of all places.

    What is in that log hangs not upon the system but upon what was set up on the machine. A server of
    a hoard of data writes here otherwise than a server of files, and a business application can make
    more writings than the whole system put together. That means the number from the benchmark has
    here no ground-worthy bond with what is true of that machine - it is a bound by agreement and no
    answer.

    The worth of that rule upon a server lies therefore not in the number it writes but in the
    measuring it forces. If after the laying on the item be met and the log hold half a day all the
    same, that means the green outcome settled here nothing. Writing it outright, I would rather say
    the rule is weak than make as though it were strong.

    There is left one set thing - it is the log the maker of the software asks after at the telling of a
    fault, and the writings from the span of the fault may not be made again after the fact.

    What an attacker gains while the item goes unmet - little straightway; the application log is
    seldom the stead wherein an onset is seen, though it is at times the stead wherein its side-outcomes
    are seen.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zmiana zapisuje wartość
    w polityce, niczego nie zatrzymuje i nie wymaga restartu, a koszt
    w miejscu na dysku przy tej wartości jest nieistotny.

    Jedna uwaga praktyczna, wynikająca z tego, co napisałem wyżej: to
    jest dziennik, przy którym dobranie rozmiaru ponad wymagane minimum
    ma największy sens, i zarazem ten, przy którym najłatwiej przesadzić.
    Aplikacja, która zapisuje tysiąc zdarzeń na minutę, wypełni każdy
    rozmiar; odpowiedzią jest wtedy naprawienie aplikacji albo wyniesienie
    jej zapisów poza maszynę, a nie powiększanie dziennika w nieskończoność.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease". The change writes a worth into the rule, stops nothing and takes no
    starting anew, and the cost in room upon the disk at that worth is of no weight.

    One note of practice, following from what I wrote above - it is the log whereat the choosing of a
    size above the asked-for least has the most sense, and at the same time the one whereat it is
    easiest to overshoot. An application writing a thousand happenings a minute will fill any size
    whatever; the answer is then the mending of the application or the bearing of its writings off the
    machine, and not the swelling of the log without end.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Zajęte zostaje dodatkowe miejsce na woluminie systemowym, przy wartości z benchmarku rzędu kilkudziesięciu megabajtów
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Wynik zielony nie znaczy tu, że dziennik obejmuje sensowny okres, bo zawartość zależy od zainstalowanego oprogramowania
      - Aplikacja zapisująca tysiąc zdarzeń na minutę wypełni każdy rozmiar i wymaga innej odpowiedzi niż powiększanie dziennika
    en:
      - Further room upon the roll of the system is taken, at the worth from the benchmark of the order of tens of megabytes
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - A green outcome means not here that the log holds a span of sense, what is in it hanging upon the installed software
      - An application writing a thousand happenings a minute will fill any size and takes another answer than the swelling of the log
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumin systemowy jest wymierzony bardzo ciasno i nie ma na nim zapasu na dziennik tej wielkości
    en:
      - The roll of the system is meted out very tightly and there is upon it no store for a log of that bigness
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog Application -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # What fills this log depends on what was installed, so the number has no
    # defensible relation to this machine. The value of the item is the
    # measurement it forces: check what span the log actually covers.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

