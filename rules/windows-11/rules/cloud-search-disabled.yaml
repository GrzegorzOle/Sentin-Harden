id: win11-cloud-search-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Wyszukiwanie w zasobach chmurowych wyłączone
    en: Searching cloud resources switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Wyszukiwanie w systemie potrafi sięgać poza maszynę: obok plików lokalnych
    pokazuje wyniki z zasobów chmurowych powiązanych z kontem — dokumentów
    w usłudze plikowej, wiadomości, kalendarza. Żeby to zrobić, wpisywana fraza
    musi opuścić maszynę.

    Stąd bierze się właściwe ryzyko i nie jest nim treść wyników. Jest nim
    treść zapytań. W polu wyszukiwania ludzie wpisują to, czego akurat szukają:
    nazwy klientów, numery spraw, nazwy plików z ofertami, nazwiska, czasem
    hasło wklejone przez pomyłkę w niewłaściwe pole. Każda z tych fraz wychodzi
    na zewnątrz jako zapytanie.

    Druga strona to powiązanie maszyny z kontem chmurowym. Wyszukiwanie
    chmurowe wymaga zalogowanego konta i utrzymuje z nim stałą łączność, więc
    przejęcie sesji na maszynie daje wgląd w zasoby, których na tej maszynie
    nigdy nie było.

    Punkt zostawia wyszukiwanie lokalne nietknięte. Znika wyłącznie część
    sięgająca poza maszynę.
  en: |
    Search in the system can reach beyond the machine: alongside local files it shows
    results from cloud resources tied to the account - documents in a file service,
    messages, a calendar. To do that, the phrase being typed has to leave the
    machine.

    That is where the real risk comes from, and it is not the content of the results.
    It is the content of the queries. Into a search box people type whatever they are
    looking for at that moment: clients' names, case numbers, names of files with
    tenders, surnames, sometimes a password pasted by mistake into the wrong field.
    Every one of those phrases goes out as a query.

    The other side is the machine's tie to a cloud account. Cloud search needs a
    signed-in account and keeps a standing connection to it, so taking over a session
    on the machine gives sight of resources that were never on this machine at all.

    The item leaves local search untouched. Only the part reaching beyond the machine
    disappears.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w organizacji szuka się dokumentów przez pole
    wyszukiwania systemu, czy przez aplikacje usług chmurowych.

    Tam, gdzie przez pole wyszukiwania, zmiana jest widoczna od pierwszego
    dnia: wyniki z usługi plikowej, poczty i kalendarza przestają się
    pojawiać. Użytkownik nie dostanie komunikatu o zablokowaniu — zobaczy
    krótszą listę wyników i uzna, że dokument zniknął. Jest to najgorszy
    możliwy objaw, bo prowadzi do szukania problemu w niewłaściwym miejscu.

    Tam, gdzie dokumentów szuka się w aplikacjach usług chmurowych albo przez
    przeglądarkę, nie zmienia się nic — a jest to przypadek częstszy.

    Wyszukiwanie plików na maszynie, w tym w katalogach synchronizowanych
    lokalnie, działa bez zmian. Punkt dotyczy zapytań wychodzących, a nie
    indeksu lokalnego.

    Nie ma restartu.
  en: |
    What needs checking is whether the organisation looks for documents through the
    system's search box or through the cloud services' own applications.

    Where it is through the search box, the change is visible from the first day:
    results from the file service, the mail and the calendar stop appearing. The user
    gets no message about a block - they see a shorter list of results and conclude
    the document has vanished. That is the worst possible symptom, because it leads
    to looking for the problem in the wrong place.

    Where documents are looked for in the cloud services' applications or through a
    browser, nothing changes - and that is the commoner case.

    Searching for files on the machine, including in locally synchronised
    directories, works unchanged. The item concerns outgoing queries, not the local
    index.

    There is no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - file-sharing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wyniki z usługi plikowej, poczty i kalendarza przestaną pojawiać się w polu wyszukiwania systemu
      - Użytkownik nie dostanie komunikatu o zablokowaniu, tylko krótszą listę wyników
      - Wyszukiwanie plików na maszynie, w tym w katalogach synchronizowanych, działa bez zmian
    en:
      - Results from the file service, the mail and the calendar stop appearing in the system's search box
      - The user gets no message about a block, only a shorter list of results
      - Searching for files on the machine, including in synchronised directories, works unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dokumentów w usłudze plikowej szuka się w organizacji przez pole wyszukiwania systemu
    en:
      - Documents in the file service are looked for through the system's search box
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCloudSearch'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCloudSearch'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCloudSearch' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Wpis przyjmuje wartości ze zbioru, a nie przełącznik. Zero oznacza
    wyłączenie, jedynka włączenie, a kolejne pozycje zawężają wyszukiwanie do
    wybranych rodzajów zasobów. Wymagane jest zero, więc każda inna wartość —
    także zawężająca — jest niezgodnością.

    Gałąź jest wspólna z pozostałymi ustawieniami wyszukiwania, więc wycofanie
    obejmuje wyłącznie tę jedną wartość.

    Punkt bywa mylony z ustawieniem wyłączającym wyniki z sieci w wyszukiwaniu.
    Tamto dotyczy wyszukiwarki internetowej, to — zasobów powiązanych z kontem.
    Są to dwa różne strumienie i dwa różne punkty benchmarku.
  en: |
    The entry takes values from a set rather than acting as a switch. Zero means off,
    one means on, and the further positions narrow the search to chosen kinds of
    resource. Zero is required, so any other value - a narrowing one included - is a
    deviation.

    The key is shared with the remaining search settings, so the rollback covers this
    one value only.

    The item is sometimes confused with the setting that switches off results from
    the web in search. That one concerns an internet search engine; this one concerns
    resources tied to an account. They are two different streams and two different
    items of the benchmark.
