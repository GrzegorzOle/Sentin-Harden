id: win2025-hosted-app-winrt-access-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App runtime
  title:
    pl: Uruchamianie aplikacji z dostępem do systemu z treści zdalnej zablokowane
    en: Launching applications with system access from remote content blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje sytuację, w której treść pobrana z sieci uruchamia
    aplikację mającą dostęp do interfejsów systemowych.

    Kategoria wysoka i chcę nazwać, na czym polega tu problem, bo nazwa jest
    techniczna. Aplikacja zainstalowana na maszynie może dostać prawo
    korzystania z interfejsów systemu: plików, urządzeń, poświadczeń.
    Osobno istnieje mechanizm pozwalający, żeby zawartość strony
    internetowej wskazała taką aplikację i poprosiła o jej uruchomienie.
    Połączenie obu daje drogę od treści pobranej z sieci do interfejsu
    systemowego.

    To jest właściwa treść punktu. Granica między tym, co przyszło z sieci,
    a tym, co działa na maszynie, jest granicą podstawową — i tutaj jest
    ona przekraczana w sposób przewidziany, a nie przez błąd. Strona nie
    musi niczego łamać; wystarczy, że poprosi.

    Na serwerze rzecz sprowadza się do jednego zdania: jeżeli ktoś otwiera
    na serwerze stronę internetową, to robi to z prawami administratora,
    a wtedy każda droga prowadząca od treści strony do systemu jest drogą
    o najwyższej stawce.

    Uwaga na ścieżkę: wpis leży w gałęzi powłoki, nie w gałęzi zasad, i stoi
    tam obok reguł o zupełnie innym przedmiocie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przewidzianą
    drogę od treści pobranej z sieci do interfejsu systemowego, bez
    wykorzystania żadnego błędu.
  en: |
    The item blocks the case in which content fetched from the network starts
    an application that has access to the system's interfaces.

    The category is high, and I want to name where the problem lies, because
    the name is technical. An application installed on the machine can be
    granted the right to use the system's interfaces: files, devices,
    credentials. Separately there is a mechanism allowing the contents of a
    web page to point at such an application and ask for it to be started.
    Putting the two together gives a road from content fetched off the
    network to a system interface.

    That is the real substance of the item. The boundary between what came
    from the network and what runs on the machine is a fundamental one - and
    here it is crossed by design rather than through a fault. The page has to
    break nothing; it is enough that it asks.

    On a server the matter comes down to one sentence: if somebody opens a
    web page on a server, they do it with an administrator's rights, and then
    every road leading from a page's content into the system is a road with
    the highest stake.

    Mind the path: the entry lies in the shell branch, not the policy branch,
    and stands there beside rules of an entirely different subject.

    What an attacker gains while the item goes unmet: a designed road from
    content fetched off the network to a system interface, without exploiting
    any fault.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy jednego wzorca, za to
    takiego, który bywa używany świadomie.

    Chodzi o rozwiązania, w których strona wewnętrzna organizacji
    uruchamia zainstalowaną aplikację: portal wywołujący narzędzie
    diagnostyczne, panel otwierający klienta zarządzania, strona firmowa
    uruchamiająca czytnik kart albo podpis. Po zastosowaniu reguły takie
    wywołanie nie zadziała, a strona zwykle nie powie dlaczego — po prostu
    nic się nie stanie.

    To jest właśnie ten objaw, przez który diagnoza bywa długa. Dlatego
    warto zapytać o to przed zastosowaniem, a nie po zgłoszeniu.

    Na serwerze taki wzorzec jest rzadkością, bo na serwerze rzadko otwiera
    się strony. Jeżeli jednak maszyna pełni rolę stanowiska zarządzania —
    a bywa tak — pytanie ma sens.

    Czego to nie psuje: przeglądania stron, aplikacji uruchamianych
    normalnie, powiązań typów plików, usług ani ról serwera.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns one pattern, but one
    that is sometimes used deliberately.

    It is about arrangements where an internal page of the organisation
    starts an installed application: a portal calling a diagnostic tool, a
    panel opening a management client, a company page starting a card reader
    or a signing tool. After the rule is applied such a call will not work,
    and the page usually will not say why - simply nothing will happen.

    That is exactly the symptom that makes diagnosis long. So it is worth
    asking about this before applying rather than after a support report.

    On a server the pattern is rare, because pages are rarely opened on a
    server. If, however, the machine serves as a management workstation - and
    that happens - the question has a point.

    What this does not break: browsing pages, applications started normally,
    file type associations, services, or server roles.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - network-and-firewall
  what_breaks:
    pl:
      - Strona wewnętrzna uruchamiająca zainstalowaną aplikację przestanie ją uruchamiać
      - Strona zwykle nie powie dlaczego — po prostu nic się nie stanie, i przez to diagnoza bywa długa
      - Dotyczy to portali wywołujących narzędzia diagnostyczne, paneli otwierających klienta zarządzania i stron uruchamiających podpis
      - Przeglądanie stron, aplikacje uruchamiane normalnie, powiązania typów plików i role serwera działają bez zmian
    en:
      - An internal page that starts an installed application stops starting it
      - The page usually will not say why - simply nothing happens, which makes diagnosis long
      - This concerns portals calling diagnostic tools, panels opening a management client and pages starting a signing tool
      - Browsing pages, applications started normally, file type associations and server roles work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie strona wewnętrzna organizacji uruchamia zainstalowaną aplikację i jest to uzgodniony sposób pracy
    en:
      - On this machine an internal page of the organisation starts an installed application and that is an agreed way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry lies in the shell branch, not the policy branch, beside rules
      # of an entirely different subject.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'BlockHostedAppAccessWinRT'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'BlockHostedAppAccessWinRT'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The boundary between what came from the network and what runs on the
    # machine is crossed here by design rather than through a fault: the page has
    # to break nothing, it is enough that it asks. On a server a page is opened
    # with an administrator's rights.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockHostedAppAccessWinRT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/uwp/xaml-platform/

notes:
  pl: |
    Nazwa jest techniczna, rzecz prosta: aplikacja może mieć prawo
    korzystania z interfejsów systemu, a osobny mechanizm pozwala treści
    strony wskazać taką aplikację i poprosić o jej uruchomienie. Połączenie
    obu daje drogę od treści z sieci do interfejsu systemowego.

    Granica jest przekraczana w sposób przewidziany, a nie przez błąd —
    strona nie musi niczego łamać, wystarczy, że poprosi.

    Na serwerze stawka jest najwyższa, bo kto otwiera tu stronę, robi to
    z prawami administratora. Uwaga na ścieżkę: wpis leży w gałęzi powłoki,
    nie w gałęzi zasad.
  en: |
    The name is technical, the matter simple: an application may hold the
    right to use the system's interfaces, and a separate mechanism lets a
    page's contents point at such an application and ask for it to start.
    Putting the two together gives a road from network content to a system
    interface.

    The boundary is crossed by design rather than through a fault - the page
    has to break nothing, it is enough that it asks.

    On a server the stake is highest, because whoever opens a page here does
    so with an administrator's rights. Mind the path: the entry lies in the
    shell branch, not the policy branch.
