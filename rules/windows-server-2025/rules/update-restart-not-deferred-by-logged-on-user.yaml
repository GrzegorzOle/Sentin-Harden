id: win2025-update-restart-not-deferred-by-logged-on-user

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Zalogowany użytkownik nie wstrzymuje restartu po aktualizacji
    en: A signed-in user does not hold back the post-update restart
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera zalogowanemu użytkownikowi możliwość wstrzymywania
    restartu, który kończy instalację aktualizacji. Przy wartości innej niż
    zero maszyna, na której ktokolwiek jest zalogowany, nie zrestartuje się
    sama — będzie czekała.

    Kategoria średnia, a zastrzeżenie warto postawić w pierwszym zdaniu,
    bo na serwerze ten punkt znaczy coś zupełnie innego niż na stacji
    roboczej. Na stacji chroni on pracę człowieka, który siedzi przy
    komputerze. Na serwerze prawie nigdy nie ma takiego człowieka, a i tak
    prawie zawsze ktoś jest „zalogowany": porzucona sesja pulpitu zdalnego
    sprzed trzech tygodni, konsola otwarta przy okazji awarii, sesja
    narzędzia administracyjnego, którego nikt nie zamknął.

    Skutek jest taki, że restart nie następuje nigdy, a wstrzymuje go
    użytkownik, którego nie ma. Powstaje maszyna, która pobrała poprawkę
    pół roku temu, zainstalowała ją, raportuje się jako załatana — i ani
    razu nie uruchomiła się w stan, w którym ta poprawka faktycznie
    obowiązuje. To jest gorsze niż brak aktualizacji, bo brak widać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: luki
    zamknięte wyłącznie na papierze, na maszynie, której nikt nie podejrzewa,
    bo wykaz poprawek ma pełny.
  en: |
    The item takes from a signed-in user the ability to hold back the
    restart that completes an update installation. With a value other than
    zero, a machine on which anybody is signed in will not restart itself -
    it will wait.

    The category is medium, and the caveat is worth putting in the first
    sentence, because on a server this item means something quite different
    than on a workstation. On a workstation it protects the work of a person
    sitting at the computer. On a server there is almost never such a
    person, and yet almost always somebody is "signed in": an abandoned
    remote desktop session from three weeks ago, a console opened during a
    failure, a session of an administrative tool nobody closed.

    The effect is that the restart never happens, and it is being held back
    by a user who is not there. What results is a machine that fetched a fix
    six months ago, installed it, reports itself patched - and has not once
    started into the state in which that fix actually holds. This is worse
    than a missing update, because a missing one can be seen.

    What an attacker gains while the item goes unmet: flaws closed on paper
    only, on a machine nobody suspects, because its list of fixes is
    complete.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i nie zamierzam jej łagodzić,
    mimo że w poprzednim akapicie sesje nazwałem widmowymi. Sesje widmowe
    są częstsze, ale nie są jedyne.

    Po tej zmianie restart kończący instalację przyjdzie także wtedy, gdy
    ktoś rzeczywiście pracuje w sesji zdalnej. Kolega z działu, który wszedł
    na serwer poprawić coś w narzędziu, straci to, czego nie zapisał,
    i zobaczy odliczanie, którego nie może zatrzymać. To jest realna szkoda,
    nie hipotetyczna, i trzeba ją położyć na drugiej szali, a nie
    zbagatelizować.

    Dlatego ta reguła nie idzie hurtem i nie idzie bez uprzedzenia. Przed
    zmianą trzeba wiedzieć dwie rzeczy: kto naprawdę bywa zalogowany na tej
    maszynie i o której godzinie przypada harmonogram instalacji. Sama ta
    wartość nie wyznacza pory restartu — wyznacza ją harmonogram z sąsiednich
    punktów — więc zmiana tutaj przy nieprzemyślanej godzinie przenosi
    problem, zamiast go rozwiązać.

    Osobny przypadek: maszyna, do której ludzie łączą się pulpitem zdalnym
    jako do stanowiska pracy, czyli serwer terminali. Tam ta zmiana dotyka
    nie administratora, tylko wszystkich użytkowników naraz i wymaga okna
    ogłoszonego z wyprzedzeniem, dokładnie jak każda przerwa w usłudze.

    Sam zapis wartości nie powoduje restartu i cofa się natychmiast.
    Świadomego wdrożenia wymaga nie ta operacja, tylko jej skutek przy
    najbliższej aktualizacji.
  en: |
    The class is "needs planned rollout", and I do not intend to soften it,
    even though in the previous paragraph I called those sessions phantom
    ones. Phantom sessions are more common, but they are not the only kind.

    After this change the restart completing an installation will also come
    when somebody really is working in a remote session. A colleague who
    logged on to the server to fix something in a tool will lose whatever
    was unsaved and will see a countdown they cannot stop. That is real
    harm, not hypothetical, and it belongs on the other side of the scale
    rather than being waved away.

    So this rule does not go in bulk and does not go without warning. Two
    things have to be known before the change: who really does sign in to
    this machine, and at what hour the installation schedule falls. This
    value by itself does not set the time of the restart - the schedule in
    the neighbouring items does - so changing it with an ill-considered hour
    moves the problem rather than solving it.

    A separate case: a machine people connect to by remote desktop as their
    workplace, that is, a terminal server. There this change touches not an
    administrator but all the users at once, and it needs a window announced
    in advance, exactly like any other service interruption.

    Writing the value itself causes no restart and is undone immediately.
    What needs the planned rollout is not this operation but its effect at
    the next update.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
    - remote-desktop
  what_breaks:
    pl:
      - Restart kończący instalację przyjdzie także wtedy, gdy ktoś rzeczywiście pracuje w sesji zdalnej
      - Osoba pracująca zdalnie straci to, czego nie zapisała, i zobaczy odliczanie, którego nie może zatrzymać
      - Na serwerze terminali zmiana dotyka nie administratora, tylko wszystkich użytkowników naraz
      - Ta wartość nie wyznacza pory restartu — robi to harmonogram z sąsiednich punktów, więc zła godzina przenosi problem
    en:
      - The restart completing an installation will also come when somebody really is working in a remote session
      - A person working remotely loses whatever was unsaved and sees a countdown they cannot stop
      - On a terminal server the change touches not an administrator but all the users at once
      - This value does not set the time of the restart - the neighbouring schedule does, so a bad hour moves the problem
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym ludzie pracują przez pulpit zdalny, i przerwa wymaga ogłoszonego okna
      - Nie sprawdzono, o której godzinie przypada harmonogram instalacji na tej maszynie
      - Do maszyny łączą się osoby prowadzące długie zadania, których przerwanie oznacza powtórzenie pracy od początku
    en:
      - The machine is a terminal server where people work over remote desktop and the interruption needs an announced window
      - It has not been checked at what hour the installation schedule falls on this machine
      - People run long jobs on this machine whose interruption means repeating the work from the start
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'NoAutoRebootWithLoggedOnUsers'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'NoAutoRebootWithLoggedOnUsers'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a server the user holding the restart back is usually a session
    # abandoned weeks ago, so the restart never comes and the machine reports
    # itself patched without ever starting into the fix. Check who really signs
    # in here and at what hour the schedule falls before running this.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoRebootWithLoggedOnUsers' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-restart

notes:
  pl: |
    Na serwerze prawie nigdy nie ma człowieka przy ekranie, a i tak prawie
    zawsze ktoś jest zalogowany: porzucona sesja pulpitu zdalnego, konsola
    otwarta przy awarii, sesja narzędzia, którego nikt nie zamknął. Restart
    wstrzymuje użytkownik, którego nie ma.

    Powstaje maszyna, która zainstalowała poprawkę pół roku temu, raportuje
    się jako załatana i ani razu nie uruchomiła się w stan, w którym ta
    poprawka obowiązuje. To gorsze niż brak aktualizacji, bo brak widać.

    Druga szala jest realna: po zmianie odliczanie zobaczy także osoba,
    która naprawdę pracuje w sesji zdalnej. Sam zapis wartości nie powoduje
    restartu — świadomego wdrożenia wymaga skutek przy najbliższej
    aktualizacji.
  en: |
    On a server there is almost never a person at the screen, and yet almost
    always somebody is signed in: an abandoned remote desktop session, a
    console opened during a failure, a tool session nobody closed. The
    restart is held back by a user who is not there.

    What results is a machine that installed a fix six months ago, reports
    itself patched, and has not once started into the state in which that
    fix holds. Worse than a missing update, because a missing one can be
    seen.

    The other side of the scale is real: after the change the countdown will
    also be seen by somebody genuinely working in a remote session. Writing
    the value causes no restart - what needs the planned rollout is its
    effect at the next update.
