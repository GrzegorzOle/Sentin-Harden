id: win2025-peer-name-resolution-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa rozpoznawania nazw dla sieci równorzędnej wyłączona
    en: The name resolution service for peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę rozpoznawania nazw dla sieci równorzędnej.
    Usługa ta tłumaczy nazwy na adresy, pytając o nie inne maszyny
    zamiast serwera nazw.

    Jest to pierwsza z czterech reguł dotyczących tej samej platformy
    i tu zapisuję rzecz wspólną dla całej czwórki, żeby nie powtarzać jej
    przy każdej z osobna. Platforma sieci równorzędnej powstała dla
    współpracy między stacjami roboczymi bez serwera pośrodku. Serwer
    jest w niej z założenia niepotrzebny — to jest cała idea tej
    platformy. Na maszynie, która serwerem jest, cztery jej usługi stoją
    więc uruchomione nie dlatego, że coś ich potrzebuje, tylko dlatego,
    że zostały włączone razem z systemem.

    Zostawiam kategorię średnią, a powód jest jeden i dotyczy tylko tej
    jednej usługi z czwórki. Serwer ma swój sposób rozpoznawania nazw,
    wskazany konfiguracją i podlegający kontroli. Ta usługa jest drugą,
    równoległą drogą do tej samej odpowiedzi — tyle że odpowiedź
    przychodzi od maszyn, a nie od serwera nazw. Droga, po której nazwa
    zamienia się w adres, jest drogą, na której warto stać, jeżeli chce
    się, żeby ktoś poszedł nie tam, gdzie zamierzał.

    Różnica wobec wykrywania urządzeń w sieci lokalnej, opisanego osobnym
    punktem, jest istotna: tamto pyta i słucha w obrębie segmentu, ta
    platforma buduje rozproszoną chmurę węzłów i sięga dalej niż jeden
    segment.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drugą,
    równoległą drogę zamiany nazwy na adres, w której odpowiedź pochodzi
    od maszyny, a nie od serwera nazw.
  en: |
    The item switches off the service of the knowing of names for the net of equals. That service
    turns names into whereabouts by asking other machines after them in the stead of a server of
    names.

    It is the first of four rules bearing on the same platform, and here I set down the thing common
    to all four, that it be not said over at each of them. The platform of the net of equals came
    about for the working together of workstations with no server in the midst. A server is in it by
    its very design needless - that is the whole thought of that platform. Upon a machine that is a
    server its four services stand running therefore not because anything needs them but because they
    were switched on along with the system.

    I leave the category middling, and the ground is one and bears upon this one service of the four
    alone. A server has its own way of the knowing of names, pointed out by the settings and standing
    under warding. That service is a second, side-by-side road to the same answer - only the answer
    comes off machines and not off a server of names. The road whereon a name turns into a whereabouts
    is a road worth standing upon, if one would have somebody go elsewhere than they meant.

    The difference from the finding of devices in the near net, set forth in an item of its own,
    weighs - that one asks and hearkens within the reach, this platform builds a spread-out cloud of
    knots and reaches further than one reach.

    What an attacker gains while the item goes unmet - a second, side-by-side road of the turning of a
    name into a whereabouts, wherein the answer comes off a machine and not off a server of names.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i to jest drugie ustalenie
    wspólne dla całej czwórki, więc także je zapisuję tutaj.

    Na zdecydowanej większości serwerów żadna z tych czterech usług nie
    ma odbiorcy i ich zatrzymanie nie zmienia niczego. Nie wystarcza to
    jednak do klasy „bez uciążliwości", bo istnieje scenariusz, który
    umiem wskazać, a to jest dokładnie kryterium rozstrzygające.
    Scenariuszem tym jest własna aplikacja zbudowana na tej platformie —
    rzadka, ale wtedy zależna od całej czwórki naraz.

    Do tego dochodzi zależność wewnętrzna. Usługi grupowania i tożsamości
    z sąsiednich punktów opierają się na tej. Zatrzymanie tej zatrzyma
    tamte, a sąsiednie punkty zrobią się przez to zielone same. Jest to
    ten sam przypadek, co przy wykrywaniu urządzeń w sieci lokalnej: ruch
    wywołany zależnością idzie w tę samą stronę, co zmiana, więc nie jest
    powodem do ostrożności — jest powodem, żeby nie zdziwić się raportem.

    Sprawdzenie sprowadza się do jednego pytania, zadanego raz dla całej
    czwórki: czy na tej maszynie stoi cokolwiek zbudowanego na platformie
    sieci równorzędnej. Inwentaryzacja z etapu audytu jest tu przesłanką
    wystarczającą, żeby zacząć, i niewystarczającą, żeby zakończyć.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking", and it is the second settling common to all four, so I set
    it down here as well.

    Upon the greater part of servers by far none of those four services has anybody to take it and
    their stopping alters nothing. That is not enough for the class "no unease" for all that, there
    being a happening I can name, and that is just the settling mark. That happening is an application
    of one's own built upon that platform - a seldom thing, but then hanging upon all four at once.

    To that there comes a hanging within. The services of grouping and of standing of the neighbouring
    items rest upon this one. The stopping of this will stop those, and the neighbouring items will
    thereby turn green of themselves. It is the same case as at the finding of devices in the near net
    - the stirring brought on by the hanging goes the same way as the change, so it is no ground for
    heed; it is a ground not to wonder at the report.

    The checking comes to one question, asked once for all four - whether upon that machine there
    stands anything built upon the platform of the net of equals. The taking of stock from the stage
    of the looking over is here a ground enough to begin with and not enough to end with.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Własna aplikacja zbudowana na platformie sieci równorzędnej przestaje rozpoznawać nazwy węzłów
      - Zatrzymują się również usługi grupowania i tożsamości, które opierają się na tej
      - Sąsiednie punkty zrobią się przez to zielone same i nie jest to pomyłka w raporcie
      - Rozpoznawanie nazw wskazane konfiguracją serwera działa dalej bez zmiany
      - Na zdecydowanej większości serwerów zmiana nie ma żadnego odbiorcy
    en:
      - An application of one's own built upon the platform of the net of equals stops knowing the names of knots
      - The services of grouping and of standing, which rest upon this one, stop as well
      - The neighbouring items will thereby turn green of themselves, and that is no mistake in the report
      - The knowing of names pointed out by the server's settings works on unaltered
      - Upon the greater part of servers by far the change has nobody at all to take it
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja zbudowana na platformie sieci równorzędnej
      - Nie zadano pytania o to raz dla całej czwórki usług tej platformy
    en:
      - Upon the machine there stands an application built upon the platform of the net of equals
      - The question was not asked once for all four services of that platform
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The grouping and identity services of this platform rest on this one and
    # stop with it, so their items turn green on their own. Ask once for all
    # four whether anything here is built on the peer platform.
    Stop-Service -Name 'PNRPsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PNRPsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

