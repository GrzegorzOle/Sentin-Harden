id: win11-file-sharing-server-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa serwera udostępniania plików wyłączona
    en: The file sharing server service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia w sieci pliki, drukarki i nazwane potoki tej maszyny.
    To ona przyjmuje połączenia do udziałów, uwierzytelnia je i obsługuje
    dostęp do zasobów.

    Na serwerze plików jest to sedno jego zadania. Na stacji roboczej rzecz
    wygląda inaczej i warto powiedzieć jak. Stacja robocza zwykle niczego nie
    udostępnia świadomie, a mimo to usługa działa i wystawia udziały
    administracyjne — dostęp do całych dysków dla kont z uprawnieniami
    administratora. Nikt ich nie tworzy i nie widać ich na liście udziałów,
    ale istnieją.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę, która
    zamienia zdobyte poświadczenia administracyjne na dostęp do plików
    i na uruchomienie kodu. Skopiowanie pliku na udział administracyjny
    i utworzenie z niego usługi jest podstawowym sposobem przechodzenia
    z maszyny na maszynę, znanym od lat i wciąż skutecznym właśnie dlatego,
    że korzysta z mechanizmu, który wszędzie działa.

    Drugi zysk jest bierny: usługa obsługuje ruch sieciowy w kodzie jądra
    i jest jednym z najczęstszych celów przy szukaniu podatności zdalnych.
    Błąd w tym miejscu oznacza przejęcie maszyny bez żadnych poświadczeń.
  en: |
    The service makes this machine's files, printers and named pipes available on the
    network. It is what takes connections to shares, authenticates them and handles
    access to resources.

    On a file server that is the heart of its work. On a workstation matters look
    different, and it is worth saying how. A workstation usually shares nothing
    knowingly, and yet the service runs and puts out administrative shares - access to
    whole disks for accounts with administrator rights. Nobody creates them and they do
    not show in the list of shares, but they exist.

    What an attacker gains while the item goes unmet: a route turning captured
    administrative credentials into access to files and into code being run. Copying a
    file to an administrative share and making a service of it is the basic way of moving
    from machine to machine, known for years and still effective precisely because it
    uses a mechanism that works everywhere.

    The second gain is passive: the service handles network traffic in kernel code and is
    among the commonest targets when remote weaknesses are looked for. A flaw in that
    place means the machine is taken over with no credentials at all.

disruption_description:
  pl: |
    To jest zmiana, którą trzeba uzgodnić z działem informatycznym, i jedna
    z najszerszych w całej paczce. Wyłączenie tej usługi dotyka rzeczy, które
    z udostępnianiem plików nie kojarzą się wcale.

    Pierwsze: udziały administracyjne. Znikają, a razem z nimi możliwość
    sięgnięcia do dysku tej maszyny z konsoli administratora. Narzędzia
    wdrażające oprogramowanie, zbierające dzienniki albo kopiujące pliki na
    maszyny robią to zwykle właśnie tą drogą i zaczną zgłaszać błędy dostępu.

    Drugie: zdalne zarządzanie przez nazwane potoki. Zdalny rejestr, część
    narzędzi zarządzania i starsze konsole administracyjne łączą się przez
    potoki obsługiwane przez tę usługę. Przestaną działać razem z nią.

    Trzecie: udostępnianie drukarki podłączonej do tej maszyny. Jeżeli ktoś
    drukuje przez nią, przestanie.

    Czwarte, najłatwiejsze do przeoczenia: udziały tworzone przez programy.
    Część oprogramowania branżowego zakłada udział na stanowisku i wymienia
    przez niego dane z innymi stanowiskami albo z serwerem.

    Praca w drugą stronę — czyli sięganie z tej maszyny do udziałów na innych
    maszynach — działa dalej bez żadnej zmiany. Obsługuje ją inny składnik.

    Zmiana wymaga zatrzymania usługi; połączenia otwarte do udziałów tej
    maszyny zostaną zerwane.
  en: |
    This is a change to be agreed with the computing department, and one of the widest in
    the whole pack. Disabling this service touches things that bring file sharing not at
    all to mind.

    First: administrative shares. They vanish, and with them the means of reaching this
    machine's disk from an administrator's console. Tools deploying software, gathering
    logs or copying files onto machines usually do so by exactly this route and will
    start reporting access errors.

    Second: remote management through named pipes. The remote registry, some management
    tools and older administrative consoles connect through pipes this service handles.
    They will stop working along with it.

    Third: sharing a printer attached to this machine. If anybody prints through it, they
    will stop.

    Fourth, the easiest to overlook: shares created by programs. Some line-of-business
    software sets up a share on a station and exchanges data through it with other
    stations or with a server.

    Work in the other direction - that is, reaching from this machine to shares on other
    machines - carries on with no change at all. A different component handles it.

    The change takes stopping the service; connections open to this machine's shares will
    be broken off.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - printing
  what_breaks:
    pl:
      - Udziały administracyjne znikają, a narzędzia sięgające po dysk maszyny zgłaszają błąd dostępu
      - Zdalny rejestr i narzędzia łączące się przez nazwane potoki przestają działać
      - Drukarka udostępniona z tej maszyny przestaje być dostępna dla innych
      - Sięganie z tej maszyny do udziałów na innych maszynach działa dalej bez zmiany
    en:
      - Administrative shares vanish and tools reaching the machine's disk report access errors
      - The remote registry and tools connecting through named pipes stop working
      - A printer shared from this machine stops being available to others
      - Reaching from this machine to shares on other machines carries on unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzia wdrożeniowe sięgają do maszyny przez udziały administracyjne
      - Maszyna udostępnia drukarkę albo katalog innym stanowiskom
      - Program branżowy wymienia dane przez udział założony na tym stanowisku
    en:
      - Deployment tools reach the machine through administrative shares
      - The machine shares a printer or a folder with other stations
      - A line-of-business program exchanges data through a share set up on this station
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off connections open to this machine's shares,
    # including administrative shares a management tool may be using right now.
    Stop-Service -Name 'LanmanServer' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'LanmanServer' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'LanmanServer' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/file-server-smb-overview

notes:
  pl: |
    Punkt jest znacznie szerszy niż reguły utwardzające udostępnianie plików,
    których w tej paczce jest kilka: podpisywanie ruchu, wyłączenie starszej
    wersji protokołu, ograniczenie dostępu bez uwierzytelnienia. Tamte
    zostawiają usługę działającą i porządkują sposób, w jaki przyjmuje
    połączenia. Ta zdejmuje ją z maszyny.

    Wdrożenie tego punktu nie zwalnia z tamtych reguł i odwrotnie. Tamte bronią
    maszyny, na której usługa zostanie kiedykolwiek włączona z powrotem —
    a przy tej usłudze zdarza się to samoczynnie, bo część ról i programów
    włącza ją przy instalacji.

    Przed wdrożeniem warto wypisać udziały istniejące na maszynie. Lista mówi
    wprost, co przestanie być dostępne, i obejmuje także udziały założone przez
    programy, o których użytkownik nie wie.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The item reaches much further than the rules hardening file sharing, of which this
    pack holds several: signing traffic, disabling the older version of the protocol,
    limiting access without authentication. Those leave the service running and put in
    order the way it takes connections. This one takes it off the machine.

    Applying this item does not excuse leaving those rules unset, nor the other way
    about. Those guard a machine on which the service is ever switched back on - and with
    this service that happens of its own accord, since some roles and programs switch it
    on when installed.

    Listing the shares existing on the machine is worth doing before a rollout. The list
    says outright what will stop being available, and it covers shares set up by programs
    the user knows nothing about as well.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
