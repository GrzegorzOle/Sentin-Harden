id: win11-rdp-single-session-per-user

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Connections
  title:
    pl: Jedna sesja pulpitu zdalnego na użytkownika
    en: One Remote Desktop session per user
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Domyślnie to samo konto może mieć na jednej maszynie kilka sesji zdalnych
    naraz. Każde kolejne połączenie otwiera nową sesję zamiast wrócić do już
    istniejącej.

    Skutek jest dwojaki. Pierwszy dotyczy tego, co po maszynie zostaje: sesja
    porzucona zamiast zamkniętej trwa dalej, trzyma otwarte programy, otwarte
    połączenia i poświadczenia w pamięci. Im łatwiej takich sesji przybywa, tym
    więcej ich stoi bezczynnie, a każda z nich jest gotowym punktem wejścia dla
    kogoś, kto uzyska dostęp do maszyny.

    Drugi dotyczy rozpoznania. Kiedy konto ma jedną sesję, drugie logowanie tym
    samym kontem odbiera pierwszą — i osoba, która pracowała, natychmiast to
    widzi. Kiedy sesji może być wiele, napastnik posługujący się skradzionymi
    poświadczeniami pracuje obok prawowitego użytkownika, w osobnej sesji,
    niczego mu nie przerywając. Znika w ten sposób najprostszy sygnał
    ostrzegawczy, jaki w ogóle istnieje: zauważenie przez człowieka, że ktoś
    korzysta z jego konta.

    Punkt przywraca ten sygnał i przy okazji porządkuje sesje porzucone.
  en: |
    By default the same account can hold several remote sessions at once on one
    machine. Every further connection opens a new session instead of returning to the
    one already there.

    The effect is twofold. The first concerns what is left on the machine: a session
    abandoned rather than closed carries on, holding open programs, open connections and
    credentials in memory. The easier such sessions accrue, the more of them stand idle,
    and each is a ready way in for somebody who gains access to the machine.

    The second concerns noticing. When an account holds one session, a second sign-in
    on the same account takes the first away - and the person who was working sees it at
    once. When there may be many sessions, an attacker using stolen credentials works
    alongside the rightful user, in a session of their own, interrupting nothing. The
    simplest warning sign there is disappears that way: a person noticing that somebody
    is using their account.

    The item brings that sign back and tidies abandoned sessions along the way.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś świadomie prowadzi na tej maszynie kilka
    sesji z jednego konta.

    Na stacji, która nie przyjmuje połączeń pulpitem zdalnym, zmiana nie robi
    nic. Tam, gdzie połączenia są przyjmowane i każdy pracuje w jednej sesji,
    także nie robi nic — a nawet pomaga, bo powrót do porzuconej sesji przestaje
    wymagać ręcznego jej odszukania.

    Skutek pojawia się tam, gdzie kilka sesji z jednego konta jest zamierzone.
    Spotyka się to przy pracy z kilku miejsc naraz — sesja zostawiona otwarta
    w biurze i druga otwierana z domu — oraz przy zadaniach długotrwałych, które
    ktoś zostawia w osobnej sesji i zagląda do nich z drugiej. Po wdrożeniu
    drugie połączenie przejmie pierwszą sesję zamiast otworzyć nową, a osoba
    pracująca w tamtej zostanie z niej rozłączona.

    Rozłączenie nie niszczy pracy: sesja trwa dalej i wraca w całości po
    ponownym połączeniu. Jest to jednak przerwanie w środku zadania i tak będzie
    odebrane, jeśli nikt o tym wcześniej nie uprzedzi.

    Osobno warto rozważyć konta współdzielone. Jeżeli z jednego konta korzysta
    kilka osób — a na maszynach serwisowych zdarza się to wciąż — będą one
    nawzajem odbierać sobie sesję. Właściwym rozwiązaniem jest wtedy rozdzielenie
    kont, nie odpuszczenie tego punktu.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody deliberately runs several sessions from one
    account on this machine.

    On a workstation taking no Remote Desktop connections the change does nothing. Where
    connections are taken and everybody works in one session, it likewise does nothing -
    it even helps, since returning to an abandoned session stops taking a hunt for it by
    hand.

    The effect appears where several sessions from one account are meant. This is met
    with work from several places at once - a session left open at the office and a
    second opened from home - and with long-running tasks somebody leaves in a session
    of their own and looks in on from another. After the rollout a second connection
    takes over the first session instead of opening a new one, and the person working in
    that one is disconnected from it.

    Being disconnected destroys no work: the session carries on and comes back whole on
    connecting again. It is, though, a break in the middle of a task and will be taken
    as one if nobody gives warning beforehand.

    Shared accounts are worth weighing separately. If several people use one account -
    and on service machines that still happens - they will take the session from one
    another. The right answer there is separating the accounts rather than letting this
    item go.

    There is no restart.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
  what_breaks:
    pl:
      - Drugie połączenie tym samym kontem przejmuje istniejącą sesję zamiast otworzyć nową
      - Osoba pracująca w przejętej sesji zostaje z niej rozłączona bez ostrzeżenia
      - Zadanie długotrwałe zostawione w osobnej sesji trzeba prowadzić w tej samej co reszta pracy
      - Konta współdzielone przez kilka osób będą nawzajem odbierać sobie sesję
    en:
      - A second connection on the same account takes over the existing session instead of opening a new one
      - The person working in the session taken over is disconnected from it without warning
      - A long-running task left in a session of its own has to be run in the same one as the rest of the work
      - Accounts shared by several people will take the session from one another
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z jednego konta korzysta kilka osób naraz i rozdzielenie kont nie jest w tej chwili możliwe
      - Praca z kilku miejsc jednocześnie w osobnych sesjach jest ustalonym tokiem pracy
    en:
      - Several people use one account at once and separating the accounts is not possible for now
      - Working from several places at once in separate sessions is the established way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fSingleSessionPerUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fSingleSessionPerUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fSingleSessionPerUser' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Ograniczenie działa po stronie maszyny przyjmującej połączenie i dotyczy
    tylko jej. Ta sama osoba może mieć jednocześnie sesje na kilku różnych
    maszynach — punkt tego nie zmienia i nie ma takiego zamiaru.

    Systemy klienckie i tak dopuszczają zwykle jedną sesję interakcyjną naraz,
    więc na stacji roboczej wdrożenie bywa zgodnością bez skutku. Wartość punktu
    rośnie tam, gdzie maszyna przyjmuje połączenia od wielu osób, i to z myślą
    o takich maszynach warto go czytać.

    Punkt uzupełnia się z regułami kończącymi sesje bezczynne i rozłączone.
    Tamte zamykają sesje po czasie, ten ogranicza ich powstawanie. Wdrożone
    razem porządkują listę sesji na maszynie; wdrożone osobno rozwiązują tylko
    część problemu.

    Wpis jest częścią gałęzi wspólnej dla wszystkich ustawień pulpitu zdalnego,
    więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The limit works on the side of the machine taking the connection and concerns only
    it. The same person may hold sessions on several different machines at once - the
    item does not change that and does not mean to.

    Client systems usually admit one interactive session at a time anyway, so on a
    workstation the rollout can be compliance with no effect. The item's worth grows
    where a machine takes connections from many people, and it is with such machines in
    mind that it is worth reading.

    The item completes the rules ending idle and disconnected sessions. Those close
    sessions after a time; this one limits their coming into being. Applied together
    they tidy the list of sessions on a machine; applied separately they settle only
    part of the problem.

    The entry belongs to a key shared by every Remote Desktop setting, so rollback
    removes the entry alone.
