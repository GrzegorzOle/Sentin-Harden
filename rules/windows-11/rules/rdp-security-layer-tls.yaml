id: win11-rdp-security-layer-tls

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Warstwa zabezpieczeń pulpitu zdalnego ustalona na protokół szyfrujący
    en: The remote desktop security layer fixed to the encrypting protocol
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Sesja pulpitu zdalnego może być zabezpieczona na dwa różne sposoby.
    Starszy pochodzi z samego protokołu zdalnego pulpitu i robi jedną rzecz:
    szyfruje ruch. Nowszy opiera się o warstwę zabezpieczeń transportu, czyli
    o ten sam mechanizm, którym posługują się strony szyfrowane — szyfruje ruch
    i dodatkowo pozwala klientowi sprawdzić, do jakiej maszyny się łączy.

    Różnica jest w tym drugim. Starszy sposób nie daje klientowi żadnej
    możliwości upewnienia się, że po drugiej stronie stoi serwer, o który mu
    chodziło. Ktoś, kto siądzie w środku połączenia, przedstawi się jako serwer,
    przyjmie sesję i przekaże ją dalej — a użytkownik wpisze hasło do maszyny
    napastnika, nie widząc niczego niepokojącego. Szyfrowanie nie pomaga, bo
    szyfrowany jest odcinek do napastnika.

    Domyślne ustawienie nie rozstrzyga sprawy: każe klientowi i serwerowi
    uzgodnić sposób między sobą. Uzgodnienie schodzi do wspólnego mianownika,
    więc wystarczy klient obsługujący wyłącznie starszy sposób — albo klient
    podstawiony, który udaje taki — żeby sesja poszła bez sprawdzenia
    tożsamości.

    Punkt zamyka uzgadnianie i wymusza sposób nowszy. Połączenie, którego nie da
    się nim zestawić, nie dochodzi do skutku.
  en: |
    A remote desktop session can be secured in two different ways. The older one
    comes from the remote desktop protocol itself and does one thing: it encrypts the
    traffic. The newer one rests on the transport security layer - the same mechanism
    encrypted pages use - and encrypts the traffic while letting the client check
    which machine it is connecting to.

    The difference lies in that second part. The older way gives the client no means
    of making sure the server it meant to reach is the one on the other side. Somebody
    sitting in the middle of the connection presents themselves as the server, takes
    the session and passes it on - and the user types their password into the
    attacker's machine, seeing nothing untoward. Encryption does not help, because
    what is encrypted is the leg to the attacker.

    The default setting does not settle the matter: it has the client and the server
    agree the way between themselves. Agreement falls to the common denominator, so a
    client supporting only the older way - or a planted client pretending to be one -
    is enough for a session to go through with no identity check.

    The item closes the negotiation off and forces the newer way. A connection that
    cannot be made that way does not come about.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czym ludzie łączą się z maszyną.

    Klient pulpitu zdalnego z systemów Windows obsługuje nowszy sposób od
    kilkunastu lat, więc po tej stronie zmiana przechodzi niezauważona. Problem
    zaczyna się poza nim: terminale cienkiego klienta z wbudowanym systemem,
    starsze klienty z innych systemów, narzędzia wbudowane w oprogramowanie
    branżowe i biblioteki zdalnego pulpitu w skryptach. Część z nich zna
    wyłącznie sposób starszy i po wdrożeniu przestanie się łączyć w ogóle —
    objaw to zerwanie połączenia w chwili zestawiania sesji, bez sensownego
    komunikatu.

    Drugi skutek dotyczy certyfikatu. Nowszy sposób wymaga certyfikatu serwera,
    a maszyna domyślnie posługuje się certyfikatem wystawionym samej sobie.
    Klient nie ma jak go zweryfikować i pokaże ostrzeżenie przy każdym
    połączeniu. Sesja dojdzie do skutku po potwierdzeniu, ale przyzwyczajenie
    ludzi do klikania w takie ostrzeżenie odbiera zmianie połowę sensu. Właściwym
    dopełnieniem punktu jest wystawienie certyfikatów z własnego urzędu
    certyfikacji — i to jest praca do wykonania obok wdrożenia, nie po nim.

    Sesje już nawiązane działają dalej. Zmiana dotyczy połączeń zestawianych po
    wdrożeniu.

    Nie ma restartu.
  en: |
    What needs checking is what people connect to the machine with.

    The remote desktop client from Windows systems has supported the newer way for
    well over a decade, so on that side the change passes unnoticed. The trouble
    starts outside it: thin client terminals with an embedded system, older clients
    from other systems, tools built into trade software and remote desktop libraries
    in scripts. Some of them know the older way alone and stop connecting at all after
    the rollout - the symptom being the connection dropping at the moment the session
    is set up, with no sensible message.

    The second effect concerns the certificate. The newer way requires a server
    certificate, and the machine uses one issued to itself by default. The client has
    no way of verifying it and will show a warning at every connection. The session
    goes through once confirmed, but getting people used to clicking through such a
    warning takes half the point out of the change. The item's proper completion is
    issuing certificates from one's own certification authority - and that is work to
    be done alongside the rollout, not after it.

    Sessions already established carry on. The change concerns connections set up
    after the rollout.

    There is no restart.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Terminale cienkiego klienta znające wyłącznie starszy sposób przestaną się łączyć
      - Starsze klienty pulpitu zdalnego z innych systemów zrywają połączenie w chwili zestawiania sesji
      - Przy domyślnym certyfikacie wystawionym samemu sobie klient pokazuje ostrzeżenie przy każdym połączeniu
      - Narzędzia zdalnego pulpitu wbudowane w oprogramowanie branżowe mogą wymagać aktualizacji
    en:
      - Thin client terminals knowing only the older way stop connecting
      - Older remote desktop clients from other systems drop the connection as the session is set up
      - With the default self-issued certificate the client shows a warning at every connection
      - Remote desktop tools built into trade software may need updating
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z maszyną łączą się terminale cienkiego klienta obsługujące wyłącznie starszy sposób
      - Oprogramowanie branżowe zestawia sesje zdalne własną biblioteką sprzed lat
    en:
      - Thin client terminals supporting only the older way connect to the machine
      - Trade software sets up remote sessions with a library of its own made years ago
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero is the protocol's own way, one
      # leaves the choice to negotiation, two forces the transport layer.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'SecurityLayer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'SecurityLayer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SecurityLayer' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt bywa mylony z wymuszeniem uwierzytelnienia na poziomie sieci, które ma
    osobną regułę. Tamto rozstrzyga, kiedy użytkownik podaje poświadczenia —
    przed zestawieniem sesji czy po nim. To rozstrzyga, czym sesja jest
    zabezpieczona i czy klient może sprawdzić tożsamość serwera. Oba są potrzebne
    i żadne nie zastępuje drugiego; co więcej, uwierzytelnienie na poziomie sieci
    działa poprawnie dopiero wtedy, gdy warstwa zabezpieczeń jest ustalona.

    Wpis przyjmuje wartości ze zbioru. Jedynka, czyli uzgadnianie, jest
    ustawieniem domyślnym i nie jest zgodnością — uzgadnianie może zejść do
    sposobu starszego, a to jest dokładnie ta sytuacja, którą punkt zamyka.

    Wycofanie nie usuwa gałęzi — jest wspólna z pozostałymi punktami pulpitu
    zdalnego.
  en: |
    The item is sometimes confused with forcing network level authentication, which
    has a rule of its own. That one settles when the user supplies credentials -
    before the session is set up or after. This one settles what the session is
    secured with and whether the client can check the server's identity. Both are
    needed and neither replaces the other; what is more, network level authentication
    only works properly once the security layer is fixed.

    The entry takes values from a set. One, meaning negotiation, is the default and is
    not compliance - negotiation may fall to the older way, and that is exactly the
    situation the item closes.

    Rollback does not remove the key - it is shared with the remaining remote desktop
    items.
