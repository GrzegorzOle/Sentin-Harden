id: win11-consumer-account-state-content-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Cloud Content
  title:
    pl: Zachęty dotyczące stanu konta w chmurze wyłączone
    en: Prompts about the state of a cloud account turned off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    System pokazuje w interfejsie komunikaty odnoszące się do konta w chmurze
    producenta: że warto je założyć, że subskrypcja wygasa, że miejsce w usłudze
    dyskowej się kończy, że wypada dokończyć konfigurację. Treść tych komunikatów
    przychodzi z sieci i zmienia się bez udziału organizacji.

    Znaczenie dla bezpieczeństwa nie leży w samych komunikatach, lecz w nawyku,
    który budują. Użytkownik uczy się, że system z siebie wyświetla okna
    o koncie, płatności i kończącym się miejscu, i że są to okna prawdziwe.
    Dokładnie tak wyglądają komunikaty podszywające się pod system — i po tym
    nawyku zostaje po nich jedyna obrona, czyli zdziwienie, że system w ogóle
    o czymś takim pisze.

    Drugi, mniejszy skutek jest taki, że komunikaty zachęcają do powiązania
    stanowiska z prywatnym kontem w chmurze, co na maszynie służbowej jest
    krokiem w złą stronę.
  en: |
    The system shows messages in the interface relating to an account in the
    vendor's cloud: that one is worth creating, that a subscription is expiring,
    that space in the storage service is running out, that the setup is worth
    finishing. The text of these messages comes from the network and changes with
    no involvement from the organisation.

    What matters for security is not the messages but the habit they build. The
    user learns that the system displays windows about accounts, payments and
    space running out of its own accord, and that these windows are genuine.
    Messages impersonating the system look exactly like that - and that habit
    removes the only defence left against them, namely surprise that the system
    should write about such a thing at all.

    The second, smaller effect is that the messages encourage tying the station to
    a private cloud account, which on a work machine is a step in the wrong
    direction.

disruption_description:
  pl: |
    Nic nie przestaje działać. Znikają komunikaty, które i tak zamyka się
    krzyżykiem.

    Konto w chmurze producenta, jeśli jest używane, działa bez zmian. Usługa
    dyskowa synchronizuje dalej, subskrypcje pozostają w mocy, a powiadomienia
    o nich przychodzą tam, gdzie przychodziły dotąd — pocztą i w samej aplikacji
    usługi. Punkt wycisza wyłącznie zachęty wplatane w interfejs systemu.

    Użytkownik, który polegał na przypomnieniu o kończącym się miejscu, może
    tego przypomnienia nie zobaczyć w systemie. Jest to jedyny realny koszt
    i dotyczy kont prywatnych, nie służbowych.

    Nie ma restartu ani wylogowania.
  en: |
    Nothing stops working. What disappears are messages people close with the
    cross anyway.

    An account in the vendor's cloud, if one is used, works unchanged. The storage
    service keeps syncing, subscriptions stay in force, and notices about them
    arrive where they arrived before - by mail and in the service's own
    application. The item quietens only the prompts woven into the system
    interface.

    A user who relied on a reminder about space running out may not see that
    reminder in the system. That is the only real cost and it concerns private
    accounts, not work ones.

    There is no restart and no sign-out.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Przypomnienia o kończącym się miejscu i wygasającej subskrypcji znikną z interfejsu systemu
    en:
      - Reminders about space running out and an expiring subscription disappear from the system interface
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
      $name = 'DisableConsumerAccountStateContent'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    $name = 'DisableConsumerAccountStateContent'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableConsumerAccountStateContent' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Kategoria średnia przy punkcie, który wycisza okienka, wymaga uzasadnienia.
    Nie chodzi o same treści — chodzi o to, że system przyzwyczaja użytkownika
    do komunikatów o koncie i płatnościach pojawiających się bez powodu. Przy
    takim nawyku okno podszywające się pod system nie wyróżnia się niczym.

    Punkt czyta się razem z wyłączeniem zachęt konsumenckich, bo oba zdejmują
    treści przychodzące z sieci do interfejsu. Dotyczą jednak innych źródeł
    i żaden nie wycisza wszystkiego, co robi drugi.
  en: |
    A medium category on an item that quietens some pop-ups calls for
    justification. It is not about the content - it is that the system accustoms
    the user to messages about accounts and payments appearing for no reason. With
    that habit in place, a window impersonating the system stands out in no way at
    all.

    The item is read together with turning consumer prompts off, because both
    remove content arriving from the network into the interface. They concern
    different sources, though, and neither quietens everything the other does.
