id: win11-network-credential-storage-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie poświadczeń do uwierzytelniania sieciowego wyłączone
    en: Storage of credentials for network authentication disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Zapisane poświadczenia do zasobów sieciowych leżą na maszynie w postaci,
    którą da się odtworzyć, mając uprawnienia administratora albo dostęp do
    profilu użytkownika. Napastnik, który wszedł na stację, dostaje z nimi
    gotowy zestaw haseł do wszystkiego, do czego użytkownik kiedykolwiek się
    łączył i zaznaczył „zapamiętaj".

    Wyłączenie tej pamięci sprawia, że przejęcie stacji kończy się na tej stacji.
    Dostęp do serwerów plików, urządzeń i usług wymaga wtedy podania hasła,
    którego na maszynie po prostu nie ma.
  en: |
    Saved credentials for network resources sit on the machine in a form that
    can be recovered with administrator rights or access to the user's profile.
    An attacker who has got onto the workstation receives with them a ready-made
    set of passwords to everything the user has ever connected to and ticked
    "remember".

    Disabling that store means compromising the workstation ends at that
    workstation. Access to file servers, devices and services then requires a
    password that simply is not present on the machine.

disruption_description:
  pl: |
    To zmiana odczuwalna codziennie i przez to często odkręcana. Wszystko, co
    użytkownik miał zapamiętane — udziały sieciowe, serwery plików, urządzenia
    wielofunkcyjne — zacznie pytać o hasło przy każdym połączeniu, także po
    każdym ponownym uruchomieniu.

    Drugi, mniej oczywisty skutek dotyczy automatyzacji: zadania harmonogramu
    i skrypty korzystające z zapisanych poświadczeń przestaną mieć czym się
    uwierzytelnić i zaczną kończyć się błędem — zwykle cicho, dopiero przy
    najbliższym uruchomieniu.
  en: |
    This change is felt daily and is therefore often undone. Everything the user
    had remembered - network shares, file servers, multifunction devices -
    starts asking for a password at every connection, including after every
    restart.

    The second, less obvious consequence concerns automation: scheduled tasks
    and scripts relying on saved credentials lose what they authenticate with
    and start failing - usually quietly, only at the next run.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - scripting-and-automation
    - printing
  what_breaks:
    pl:
      - Zapamiętane hasła do udziałów sieciowych przestaną być podstawiane i połączenie zażąda ich ręcznie
      - Zadania harmonogramu korzystające z zapisanych poświadczeń zakończą się błędem uwierzytelnienia
      - Urządzenia wielofunkcyjne i serwery plików będą pytać o hasło przy każdym ponownym uruchomieniu stacji
    en:
      - Remembered passwords for network shares stop being supplied and the connection asks for them by hand
      - Scheduled tasks relying on saved credentials fail with an authentication error
      - Multifunction devices and file servers ask for a password after every restart of the workstation
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na stacji działa automatyzacja uwierzytelniająca się zapisanymi poświadczeniami bez innego rozwiązania
      - Użytkownik łączy się na co dzień do wielu zasobów sieciowych, dla których nie ma logowania jednokrotnego
    en:
      - The workstation runs automation authenticating with saved credentials and has no other arrangement
      - The user connects daily to many network resources with no single sign-on available
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'DisableDomainCreds'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'DisableDomainCreds'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'DisableDomainCreds' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-storage-of-passwords-and-credentials-for-network-authentication

notes:
  pl: |
    Ustawienie blokuje zapisywanie nowych poświadczeń i podstawianie
    zapisanych — nie kasuje jednak tego, co już leży w magazynie poświadczeń.
    Jeśli zmiana ma zamknąć realne ryzyko, a nie tylko poprawić wynik audytu,
    trzeba dodatkowo wyczyścić istniejące wpisy.

    To punkt poziomu drugiego i widać dlaczego: zysk jest realny, ale koszt
    w codziennej pracy wysoki. Świadome odpuszczenie go z uzasadnieniem bywa
    tu decyzją rozsądniejszą niż wdrożenie i odkręcenie po tygodniu.
  en: |
    The setting blocks saving new credentials and supplying saved ones - but it
    does not delete what already sits in the credential store. If the change is
    meant to close real risk rather than just improve the audit score, the
    existing entries have to be cleared as well.

    This is a level two item and it shows why: the gain is real, but the cost in
    daily work is high. A deliberate, justified exception is sometimes a wiser
    decision here than rolling it out and undoing it a week later.
