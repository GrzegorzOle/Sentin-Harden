id: win2025-create-permanent-shared-objects-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie trwałych obiektów współdzielonych nieprzyznane nikomu
    en: Creating permanent shared objects granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala utworzyć obiekt w przestrzeni nazw jądra, który
    przetrwa zakończenie procesu, który go stworzył. Obiekty zwykłe
    znikają wraz ze swoim twórcą; te zostają, dopóki system pracuje.

    Znaczenie praktyczne bierze się z kolejności. Wiele mechanizmów
    systemu odwołuje się do obiektów jądra po nazwie i przyjmuje ten,
    który zastanie. Kto utworzy obiekt o nazwie oczekiwanej, zanim
    zrobi to właściciel prawowity, zostaje w tej roli — a ponieważ
    obiekt jest trwały, zostaje w niej do restartu.

    Skutkiem bywa przechwycenie komunikacji między składnikami systemu
    albo doprowadzenie do tego, że usługa nie wystartuje, bo nazwa,
    której potrzebuje, jest już zajęta przez coś obcego.

    Na serwerze waży to więcej niż na stanowisku roboczym z dwóch
    powodów. Po pierwsze, serwer pracuje miesiącami bez restartu, więc
    „do restartu" znaczy tu bardzo długo. Po drugie, na serwerze
    z rolą terminalową obiekt utworzony przez jednego użytkownika
    znajduje się w zasięgu sesji pozostałych.

    Prawo nie jest potrzebne żadnemu oprogramowaniu współczesnemu.
    W systemie domyślnym wykaz jest pusty.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zajęcia nazwy w przestrzeni jądra przed składnikiem systemu
    i utrzymania jej do najbliższego restartu maszyny.
  en: |
    The right allows an object to be made in the kernel's namespace that outlives the process
    which made it. Ordinary objects vanish along with their maker; these stay as long as the
    system works.

    The practical weight comes of the order. Many of the system's mechanisms refer to kernel
    objects by name and take the one they find. Whoever makes an object of the awaited name
    before the rightful owner does stays in that part - and since the object is lasting, stays
    in it until a restart.

    The effect is at times the catching of talk between the system's parts, or the bringing
    about of a service not starting because the name it takes is held already by something
    foreign.

    On a server that weighs more than at a working station for two reasons. First, a server
    works for months without a restart, so "until a restart" here means very long. Second, on
    a server with a terminal role an object made by one user lies within reach of the others'
    sessions.

    The right is needed by no present-day software. In the default system the list is empty.

    What an attacker gains while the item goes unmet: the means of taking a name in the
    kernel's space ahead of a system part and holding it until the machine's next restart.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz jest pusty, więc naprawa nie ma czego
    usunąć i nie zmienia niczego.

    Prawo to jest w praktyce martwe. Nie korzysta z niego oprogramowanie
    współczesne ani żadna usługa dostarczona z systemem — składniki
    jądra tworzą takie obiekty z innego tytułu, nie przez ten wykaz.

    Jeżeli wykaz nie jest pusty, wpis niemal na pewno pochodzi
    z oprogramowania sprzed lat albo z zasady skopiowanej z maszyny
    starszej. Warto ustalić źródło, ale rzadko oznacza to zależność
    faktyczną.

    Zmiana obowiązuje od następnej próby utworzenia obiektu. Obiekty
    utworzone wcześniej nie są usuwane i pozostają do restartu maszyny —
    warto o tym wiedzieć przy porządkowaniu po incydencie, bo sama
    naprawa uprawnień nie usuwa tego, co już powstało.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list is empty, so the mending has nothing to remove and changes
    nothing.

    The right is in practice dead. No present-day software uses it, nor any service delivered
    with the system - kernel parts make such objects on another title, not through this list.

    Where the list is not empty, the entry almost surely comes of software from years back or
    of a policy copied from an older machine. It is worth settling the source, but that seldom
    means a real dependence.

    The change holds from the next try at making an object. Objects made earlier are not
    removed and stay until the machine's restart - worth knowing at a putting in order after
    an incident, since the mending of rights alone does not remove what has come about
    already.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć
      - Żadne oprogramowanie współczesne nie korzysta z tego prawa
      - Zmiana obowiązuje od następnej próby utworzenia obiektu, nie wstecz
      - Obiekty utworzone wcześniej pozostają w systemie do restartu maszyny
    en:
      - In the default state the list is empty and the mending has nothing to remove
      - No present-day software uses this right, nor any service delivered with the system
      - The change holds from the next try at making an object, not backwards
      - Objects made earlier stay in the system until the machine's restart
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Potwierdzono, że prawa używa oprogramowanie krytyczne sprzed lat, którego nie da się wymienić
    en:
      - It is confirmed that critical software from years back uses the right and cannot be replaced
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreatePermanentPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreatePermanentPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreatePermanentPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreatePermanentPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreatePermanentPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-permanent-shared-objects

notes:
  pl: |
    Prawo dotyczy obiektów w przestrzeni nazw jądra, a nie udziałów
    sieciowych. Nazwa bywa myląca — „współdzielony" znaczy tu dostępny
    dla wielu procesów na tej maszynie, a nie udostępniony w sieci.

    Kategoria ryzyka jest niższa niż przy dwóch pozostałych prawach
    z tej grupy, bo samo prawo nie daje uprawnień. Daje trwałość i
    pierwszeństwo w zajęciu nazwy, co jest drogą okrężną, a nie prostą.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.
  en: |
    The right bears on objects in the kernel's namespace rather than on network shares. The
    name is at times misleading - "shared" here means reachable by many processes on this
    machine, not given out on the network.

    The category of risk is lower than at the other two rights of this group, since the right
    alone grants no rights. It grants lastingness and precedence in taking a name, which is a
    roundabout road rather than a straight one.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.
