id: win2016-smb-server-name-hardening

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Weryfikacja nazwy, pod którą klient łączy się z zasobami maszyny
    en: Verification of the name a client connects to the machine by
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie sprawdzać, czy nazwa, pod którą klient się z nią
    łączy, jest rzeczywiście jej nazwą.

    Domyślnie serwer udziałów nie zadaje tego pytania. Przyjmuje połączenie
    i uwierzytelnia klienta bez względu na to, pod jaką nazwą ten myśli, że
    się łączy. Jest to konsekwencja czasów, gdy maszyna miała jeden adres,
    jedną nazwę i jedną sieć.

    Ta obojętność jest fundamentem odbicia poświadczeń. Napastnik, który
    skłonił maszynę ofiary do połączenia się ze sobą — na przykład fałszywą
    odpowiedzią w segmencie — przekazuje to połączenie dalej, do prawdziwego
    serwera, i uwierzytelnia się cudzymi poświadczeniami. Serwer nie
    zauważa niczego, bo nie pytał, do kogo klient sądził, że się łączy.

    Sprawdzenie nazwy przerywa ten łańcuch w jedynym miejscu, w którym da się
    go przerwać po stronie serwera. Poświadczenie niesie nazwę zasobu,
    z którym klient chciał rozmawiać; jeśli nie zgadza się ona z nazwą
    serwera, połączenie jest odrzucane. Poświadczenie odebrane gdzie indziej
    przestaje być przydatne tutaj.

    Warto zauważyć, czego ta reguła nie robi. Nie zapobiega przechwyceniu
    poświadczeń ani nie naprawia mechanizmu, który do tego doprowadził —
    odbiera jedynie możliwość użycia ich wobec tej maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przedstawienia tej maszynie poświadczeń przechwyconych w rozmowie
    prowadzonej pod zupełnie inną nazwą.
  en: |
    The setting has the machine check whether the name a client connects to it by is
    really its own name.

    By default the share server does not ask that question. It takes the connection
    and authenticates the client whatever name the client supposes it is connecting
    by. That is a consequence of the days when a machine had one address, one name
    and one network.

    This indifference is the foundation of credential reflection. An attacker who
    has got a victim's machine to connect to them - by a false answer in the
    segment, say - passes that connection on to the true server and authenticates
    with somebody else's credentials. The server notices nothing, since it did not
    ask who the client supposed it was connecting to.

    Checking the name breaks that chain at the one place it can be broken on the
    server's side. The credential carries the name of the resource the client meant
    to talk to; if that does not agree with the server's name, the connection is
    rejected. A credential taken elsewhere ceases to be of use here.

    Worth noting what this rule does not do. It does not prevent credentials being
    intercepted, nor does it mend the mechanism that led to it - it takes away only
    the means of using them against this machine.

    What an attacker gains while the item goes unmet: the means of presenting this
    machine with credentials intercepted in a conversation held under an entirely
    different name.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana dotyka tego, jak klienty
    nazywają tę maszynę — a nazw jest zwykle więcej niż jedna.

    Sprawdzeniem, od którego wszystko zależy, jest wyliczenie nazw, pod
    którymi ta maszyna jest osiągana. Nazwa własna działa zawsze. Kłopot
    sprawiają nazwy dodatkowe: wpisy wskazujące na tę maszynę pod inną nazwą,
    nazwy klastra, nazwy przejęte po serwerze wycofanym, nazwy krótkie używane
    w skryptach. Każda z nich wymaga, żeby maszyna wiedziała, że jest także
    tak nazywana.

    Bez tego objaw jest ostry i natychmiastowy: połączenie do udziału pod
    nazwą dodatkową zostaje odrzucone z błędem uwierzytelnienia, choć hasło
    jest poprawne. Komunikat myli, bo mówi o poświadczeniach, a przyczyna
    leży w nazwie.

    Stopień łagodniejszy, który ta reguła ustawia, sprawdza nazwę tylko
    wtedy, gdy klient ją poda. Klienty starsze jej nie podają i są
    przepuszczane — dzięki temu zmiana nie odcina ich od razu. Stopień
    ostrzejszy, wymagający nazwy zawsze, jest decyzją wdrożeniową i zostaje
    po stronie operatora.

    Czego to nie psuje: połączeń pod nazwą własną maszyny, połączeń po
    adresie, logowania do domeny, klientów starszych nieprzedstawiających
    nazwy.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", since the change touches on how clients
    name this machine - and the names are as a rule more than one.

    The check everything hangs on is an enumeration of the names by which this
    machine is reached. Its own name always works. The trouble comes of the
    additional names: entries pointing at this machine under another name, cluster
    names, names taken over from a withdrawn server, short names used in scripts.
    Each of them calls for the machine to know that it is called that too.

    Without that the symptom is sharp and immediate: a connection to a share under
    an additional name is rejected with an authentication error, though the password
    is right. The message misleads, since it speaks of credentials while the cause
    lies in the name.

    The milder degree, which this rule sets, checks the name only where the client
    gives one. Older clients do not give it and are let through - so the change does
    not cut them off at once. The stricter degree, demanding the name always, is a
    deployment decision and is left to the operator.

    What this does not break: connections under the machine's own name, connections
    by address, signing in to the domain, or older clients that present no name.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Połączenia do udziału pod nazwą dodatkową zostają odrzucone z błędem uwierzytelnienia, choć hasło jest poprawne, a komunikat wskazuje na poświadczenia zamiast na nazwę
      - Nazwy klastra i nazwy przejęte po serwerze wycofanym przestają działać, dopóki maszyna nie zostanie o nich poinformowana
      - Skrypty i zadania odwołujące się do maszyny nazwą krótką mogą przestać się łączyć, jeśli nazwa nie jest jej przypisana
      - Połączenia pod nazwą własną, połączenia po adresie i klienty starsze nieprzedstawiające nazwy pozostają bez zmian
    en:
      - Connections to a share under an additional name are rejected with an authentication error though the password is right, and the message points at credentials instead of at the name
      - Cluster names and names taken over from a withdrawn server cease to work until the machine is told of them
      - Scripts and scheduled tasks referring to the machine by a short name may cease to connect, if the name is not assigned to it
      - Connections under its own name, connections by address and older clients presenting no name stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest osiągana pod nazwami dodatkowymi, a nie wyliczono ich i nie przypisano maszynie
      - Maszyna pracuje w klastrze albo przejęła nazwę po serwerze wycofanym i nazwy te nie zostały jej przypisane
    en:
      - The machine is reached under additional names and these have not been enumerated and assigned to it
      - The machine works in a cluster or has taken over a name from a withdrawn server, and those names have not been assigned to it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two settings satisfy the item - accepting the name when the client gives one,
      # and demanding it always. They are reported under one token, because either
      # meets the item and the stricter one is a deployment choice.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'SmbServerNameHardeningLevel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -ge 1) { 'VERIFIED' }
        else { 'NOT_VERIFIED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'VERIFIED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'SmbServerNameHardeningLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The milder degree is set - the name is checked where the client gives one.
    # Demanding it always is a deployment decision and is left to the operator.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SmbServerNameHardeningLevel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-server-server-spn-target-name-validation-level

notes:
  pl: |
    Punkt zamyka blok rozwiązywania nazw od drugiej strony i warto go tak
    przedstawiać. Reguły wcześniejsze pilnują, żeby maszyna nie dała się
    oszukać, gdy pyta o cudzą nazwę. Ta pilnuje, żeby nie dała się użyć, gdy
    ktoś przychodzi z poświadczeniem zebranym pod nazwą cudzą. Jest to ta
    sama rodzina ataku widziana od strony ofiary i od strony celu.

    Audyt sprowadza dwie dopuszczalne wartości do jednego wyniku, bo punkt
    spełnia każda z nich. Stopień ostrzejszy odcina klienty nieprzedstawiające
    nazwy i dlatego nie jest ustawiany automatycznie — jest decyzją, a nie
    domyślnym ulepszeniem.

    Wyliczenie nazw dodatkowych powinno być częścią symulacji przed
    wykonaniem. Jest to jedyny warunek, którego pominięcie zamienia zmianę
    cichą w odmowę dostępu, a komunikat błędu prowadzi wtedy diagnozę
    w stronę haseł, czyli dokładnie w złą.
  en: |
    The item shuts the name-resolution block from the other side and is worth
    presenting so. The earlier rules see to it that the machine is not deceived when
    it asks after somebody else's name. This one sees to it that it is not used when
    somebody comes with a credential gathered under somebody else's name. It is the
    same family of attack seen from the victim's side and from the target's.

    The audit brings the two admissible values down to one result, since either
    meets the item. The stricter degree cuts off clients presenting no name and is
    for that reason not set automatically - it is a decision rather than a default
    improvement.

    Enumerating the additional names should be part of the simulation before
    execution. It is the one condition whose omission turns a quiet change into a
    refusal of access, and the error message then leads the diagnosis towards
    passwords, which is to say exactly the wrong way.
