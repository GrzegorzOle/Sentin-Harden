id: win11-remote-access-auto-connection-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Samoczynne zestawianie połączenia zdalnego wyłączone
    en: Automatic setting up of a remote connection disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obserwuje próby sięgnięcia po zasób, który jest nieosiągalny
    w bieżącej sieci, i w odpowiedzi sama zestawia połączenie zdalne — takie,
    jakie zostało wcześniej na maszynie zdefiniowane.

    Mechanizm pochodzi z czasów połączeń wdzwanianych i jego założenie brzmi:
    skoro użytkownik czegoś szuka, zestawmy za niego połączenie. Założenie to
    jest wygodne i jednocześnie niebezpieczne, bo decyzję o zestawieniu
    połączenia podejmuje nie człowiek, tylko nieudany dostęp do zasobu.

    Skutek widać najlepiej na przykładzie. Dokument z odwołaniem do udziału
    sieciowego, skrót w wiadomości, obrazek osadzony w dokumencie ze ścieżką
    sieciową — każda z tych rzeczy powoduje próbę sięgnięcia po zasób.
    Przy włączonej usłudze taka próba potrafi zestawić połączenie zdalne,
    w tym połączenie wychodzące poza sieć organizacji, bez pytania i bez
    świadomej decyzji użytkownika.

    Wyłączenie usługi nie odbiera nikomu możliwości połączenia się — odbiera
    wyłącznie możliwość zrobienia tego bez decyzji.
  en: |
    The service watches for attempts to reach a resource unreachable on the current
    network and, in answer, sets up a remote connection of its own accord - the kind
    defined on the machine earlier.

    The mechanism comes from the days of dial-up connections and its assumption runs: if
    the user is looking for something, let us set up a connection for them. That
    assumption is convenient and dangerous at once, because the decision to set up a
    connection is taken not by a person but by a failed attempt to reach a resource.

    The effect shows best by example. A document referring to a network share, a
    shortcut in a message, a picture embedded in a document with a network path - each of
    these causes an attempt to reach a resource. With the service running, such an
    attempt can set up a remote connection, including one going outside the
    organisation's network, without asking and without a conscious decision by the user.

    Disabling the service takes from nobody the means of connecting - it takes away only
    the means of doing so without a decision.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie zdefiniowano połączenia zdalne
    i czy ktoś liczy na ich samoczynne zestawianie.

    Na maszynie bez zdefiniowanych połączeń zdalnych — a tak jest na
    większości stanowisk — zmiana nie robi nic. Usługa nie ma czego zestawiać.

    Tam, gdzie połączenia są zdefiniowane, skutek jest wąski: trzeba będzie
    zestawić je ręcznie, zanim sięgnie się po zasób. Połączenia zestawione
    ręcznie działają dalej bez żadnej zmiany, a programy z nich korzystające
    nie zauważą różnicy.

    Wyjątkiem wartym sprawdzenia są zadania uruchamiane bez udziału człowieka:
    kopia zapasowa na zasób zdalny, synchronizacja uruchamiana harmonogramem,
    skrypt sięgający po udział poza siecią lokalną. Jeżeli któreś z nich
    liczyło na samoczynne zestawienie połączenia, zakończy się błędem dostępu
    do zasobu — a nie komunikatem o braku połączenia, co utrudnia rozpoznanie
    przyczyny.

    Naprawą jest wtedy dodanie do zadania jawnego zestawienia połączenia na
    początku. Jest to poprawka w zadaniu, nie powód do cofania zmiany.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether remote connections are defined on the machine and
    whether anybody counts on their being set up automatically.

    On a machine with no remote connections defined - and that is so at most stations -
    the change does nothing. The service has nothing to set up.

    Where connections are defined, the effect is narrow: they will have to be set up by
    hand before a resource is reached for. Connections set up by hand carry on working
    with no change at all, and programs using them will notice no difference.

    The exception worth checking is tasks run with no person involved: a backup to a
    remote resource, a synchronisation started by a schedule, a script reaching for a
    share outside the local network. If any of them counted on a connection being set up
    automatically, it will end in an error reaching the resource - rather than a message
    about a missing connection, which makes the cause harder to recognise.

    The fix there is adding an explicit setting up of the connection at the start of the
    task. That is a correction in the task, not a reason to undo the change.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Połączenie zdalne nie zostanie zestawione samoczynnie przy sięgnięciu po zasób
      - Zadanie uruchamiane harmonogramem zakończy się błędem dostępu do zasobu zdalnego
      - Połączenia zestawiane ręcznie działają dalej bez żadnej zmiany
      - Na maszynie bez zdefiniowanych połączeń zdalnych nie zmienia się nic
    en:
      - A remote connection is not set up automatically when a resource is reached for
      - A task run by a schedule ends in an error reaching the remote resource
      - Connections set up by hand carry on working with no change at all
      - On a machine with no remote connections defined nothing changes at all
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Zadania bez udziału człowieka liczą na samoczynne zestawienie połączenia zdalnego
      - Praca w terenie opiera się na połączeniu zestawianym w tle przy sięgnięciu po zasób
    en:
      - Tasks with no person involved count on a remote connection being set up automatically
      - Work in the field rests on a connection set up in the background when a resource is reached for
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RasAuto' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RasAuto' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RasAuto' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/ras/manage-remote-access

notes:
  pl: |
    Usługa nie zestawia połączeń sama z siebie na maszynie, na której żadnego
    połączenia zdalnego nie zdefiniowano. Ryzyko opisane w tej regule dotyczy
    maszyn, na których takie połączenia istnieją — zwykle dodane kiedyś ręcznie
    i zapomniane. Przegląd listy połączeń zdalnych jest dobrym uzupełnieniem
    tego punktu.

    Punkt nie dotyczy klienta połączeń szyfrowanych innej firmy, jeżeli
    zestawia on połączenie własnym mechanizmem. Część takich programów jednak
    korzysta z mechanizmu systemowego i wtedy ich samoczynne łączenie
    przestanie działać.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The service sets up no connections of its own accord on a machine where no remote
    connection has been defined. The risk described in this rule concerns machines where
    such connections exist - usually added by hand at some point and forgotten. A review
    of the list of remote connections is a good completion of this item.

    The item does not concern a third party client for encrypted connections where it
    sets up the connection by a mechanism of its own. Some such programs, though, use the
    system's mechanism, and then their connecting automatically will stop working.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment.
