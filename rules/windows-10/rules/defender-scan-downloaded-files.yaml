id: win10-defender-scan-downloaded-files

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Sprawdzanie plików pobranych i załączników włączone
    en: Checking of downloaded files and attachments switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawdza plik w chwili, w której trafia na maszynę
    z zewnątrz: pobrany przeglądarką, zapisany z załącznika, przeniesiony
    z udziału sieciowego.

    Punkt ten opisuje moment, w którym plik złośliwy przekracza granicę
    maszyny. Jest to moment jedyny w swoim rodzaju, bo wcześniej pliku tu
    nie było, a później jest już tylko pytanie, kiedy zostanie uruchomiony.
    Sprawdzenie w tej właśnie chwili zdejmuje ryzyko w całości, zamiast
    przesuwać je na chwilę uruchomienia.

    Droga, w którą to trafia, jest drogą wejścia najczęstszą ze
    wszystkich. Użytkownik, który otwiera załącznik albo pobiera program
    ze strony podszywającej się pod producenta, nie obchodzi żadnego
    zabezpieczenia — wykonuje czynność, którą wykonuje codziennie
    kilkanaście razy.

    Odnotowuję odwrotność nazwy wartości, bo prowadzi do pomyłki przy
    ręcznej zmianie. Zasada zapisuje zero tam, gdzie sprawdzanie jest
    włączone; wartością zgodną jest więc zero, nie jedynka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: plik
    złośliwy trafiający na dysk bez jednego sprawdzenia, z całym ryzykiem
    odsuniętym do chwili uruchomienia.
  en: |
    The setting checks a file at the hour it reaches the machine from outside: downloaded by the browser, saved
    out of an attachment, carried over from a network share.

    This item describes the moment at which a malicious file crosses the machine's bound. It is a moment of its
    own kind, the file having before that not been here, and after it there being only the question of when it
    will be started. A checking at just that hour takes the risk away whole, rather than shifting it to the hour
    of starting.

    The road this strikes at is the road of entry commonest of all. A user who opens an attachment or downloads a
    program from a page feigning a maker's own goes round no guard whatever - they carry out an act they carry
    out a dozen times a day.

    I set down the backwardness of the value's name, it leading to a mistake at a change made by hand. The policy
    writes a nought where the checking is switched on; the compliant value is therefore a nought and not a one.

    What an attacker gains while the item goes unmet: a malicious file reaching the disk without one checking,
    with the whole risk pushed off to the hour of starting.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co na
    tej maszynie pobiera pliki masowo.

    Sprawdzanie kosztuje czas przy każdym pliku przychodzącym z zewnątrz.
    W pracy biurowej jest niezauważalne. Widać je przy pobieraniu paczek
    z zależnościami, przy synchronizacji dużych katalogów z udziału
    i przy odtwarzaniu kopii zapasowej — czyli tam, gdzie plików jest
    naraz tysiące.

    Odnotowuję drugie miejsce, w którym bywa odczuwalne: praca
    z udziałem sieciowym, na którym leżą pliki robocze. Każde otwarcie
    pliku z udziału przechodzi przez to sprawdzenie, więc katalog
    z setkami plików otwiera się wolniej.

    Właściwą odpowiedzią jest wskazanie wąskiego katalogu wyłączonego ze
    sprawdzania, a nie wyłączenie mechanizmu. Każde takie wyłączenie
    warto zapisać wraz z powodem, bo jest to miejsce, w którym ochrona
    nie patrzy.

    Czego to nie psuje: pobierania plików jako takiego, otwierania
    dokumentów lokalnych, logowania, drukowania, kont domenowych.
  en: |
    The class is "needs review", and the object of the review is what upon this machine downloads files in bulk.

    The checking costs time at every file coming from outside. In office work it goes unnoticed. It shows at the
    downloading of packs of dependencies, at the syncing of great folders from a share and at the restoring of a
    backup - which is to say where the files run to thousands at once.

    I set down a second place at which it is at times felt: work with a network share upon which the working
    files lie. Every opening of a file from the share goes through that checking, so a folder with hundreds of
    files opens the slower.

    The proper answer is the naming of a narrow folder left out of the checking, and not the switching off of the
    mechanism. Every such leaving out is worth writing down together with its ground, it being a place at which
    the protection does not look.

    What this does not break: the downloading of files as such, the opening of local documents, logging on,
    printing, or domain accounts.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - email-and-attachments
    - file-sharing
  what_breaks:
    pl:
      - Pobieranie paczek z zależnościami i synchronizacja dużych katalogów z udziału trwają dłużej
      - Odtwarzanie kopii zapasowej przechodzi przez sprawdzanie każdego pliku i zwalnia
      - Katalog z setkami plików na udziale sieciowym otwiera się wolniej, bo każdy plik przechodzi przez sprawdzenie
      - Wartość zapisywana jest odwrotna do nazwy punktu, więc ręczna zmiana łatwo trafia w jedynkę zamiast zera
      - Pobieranie plików jako takie, otwieranie dokumentów lokalnych, logowanie, drukowanie i konta domenowe pozostają bez zmian
    en:
      - The downloading of packs of dependencies and the syncing of great folders from a share take longer
      - The restoring of a backup goes through the checking of every file and slows
      - A folder with hundreds of files upon a network share opens the slower, every file going through the checking
      - The written value is the reverse of the item s title, so a change by hand easily strikes a one instead of a nought
      - The downloading of files as such, the opening of local documents, logging on, printing and domain accounts stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna służy do odtwarzania kopii zapasowych i sprawdzanie każdego pliku wydłuża operację ponad okno serwisowe
    en:
      - The machine serves for the restoring of backups and the checking of every file draws the operation past the service window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value name reads the other way round: the policy writes 0 where the
      # checking is switched on. The expected entry is therefore zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableIOAVProtection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableIOAVProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A zero switches the checking on. The entry is a negative one and the value
    # reads the other way round than the item's title does.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableIOAVProtection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła otwiera blok i jest w nim jedyną ocenioną jako krytyczna.
    Pozostałe opisują, gdzie ochrona zagląda; ta opisuje moment, w którym
    plik w ogóle przekracza granicę maszyny.

    Argument wart zachowania dotyczy przesunięcia ryzyka. Bez tego
    ustawienia plik nie zostaje bez sprawdzenia — zostaje sprawdzony
    później, przy uruchomieniu, przez ochronę w czasie rzeczywistym.
    Różnicą jest to, że w międzyczasie leży na dysku, bywa skopiowany
    dalej i bywa uruchomiony z miejsca, do którego ochrona nie sięga.

    Odnotowuję odwrotność nazwy wartości, bo jest to jedyna pułapka
    techniczna w całym bloku. Ktoś, kto wpisze jedynkę, sądząc, że włącza
    sprawdzanie, wyłączy je — a raport pokaże niezgodność, której powód
    będzie trudny do odgadnięcia bez tej uwagi.
  en: |
    The rule opens the block and is the only one in it weighed as critical. The rest describe where the
    protection looks; this describes the moment at which a file crosses the machine's bound at all.

    The argument worth keeping touches the shifting of risk. Without this setting a file is not left unchecked -
    it is checked later, at the starting, by real-time protection. The difference is that meanwhile it lies upon
    the disk, is at times copied onward and is at times started from a place the protection does not reach.

    I set down the backwardness of the value's name, it being the one technical trap in the whole block. Somebody
    who writes a one, thinking they switch the checking on, will switch it off - and the report will show a
    shortfall whose ground will be hard to guess without this note.
