id: win2016-block-microsoft-accounts

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zakładanie i dodawanie kont z usługi sieciowej dostawcy zablokowane
    en: Making and adding accounts from the maker's online service blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zakładać na tej maszynie nowe konta z usługi
    sieciowej producenta oraz wiązać istniejące konto lokalne z taką
    usługą.

    Jest to druga strona reguły poprzedniej. Tamta dotyczy uwierzytelniania
    — czy konto takie w ogóle może się przedstawić. Ta dotyczy powstawania
    — czy takie konto może się na maszynie pojawić.

    Rozdzielenie ma znaczenie praktyczne. Powiązanie konta lokalnego
    z usługą sieciową jest czynnością, którą wykonuje użytkownik sam, bez
    pytania nikogo, i która zmienia charakter konta: hasło przestaje
    pochodzić z tej maszyny, a zaczyna z usługi zewnętrznej. Konto
    wygląda po tym tak samo, a podlega zupełnie innym regułom.

    Dla organizacji znaczy to utratę kontroli nad poświadczeniem bez żadnego
    śladu, że coś się zmieniło. Zmiana hasła, odzyskanie konta,
    uwierzytelnianie dwuskładnikowe — wszystko to przechodzi na zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przeniesienia poświadczenia konta z tej maszyny do usługi zewnętrznej,
    a wraz z nim — drogi odzyskania tego konta poza zasięgiem organizacji.
  en: |
    The setting forbids new accounts from the maker's online service to be made on this
    machine, and an existing local account to be bound to such a service.

    It is the other side of the previous rule. That one concerns authentication -
    whether such an account may present itself at all. This one concerns coming into
    being - whether such an account may appear on the machine.

    Parting them matters in practice. Binding a local account to an online service is
    an act a user performs themselves, asking nobody, and it changes the account's
    character: its password stops coming from this machine and starts coming from an
    outside service. The account looks the same afterwards and falls under wholly
    different rules.

    For the organisation that means losing control of a credential with no trace that
    anything has changed. Changing the password, recovering the account,
    two-factor authentication - all of it moves outside.

    What an attacker gains while the item goes unmet: the chance to move an account's
    credential from this machine to an outside service, and with it the road of
    recovering that account beyond the organisation's reach.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie jest
    już konto powiązane z usługą sieciową.

    Wdrożenie nie rozwiązuje takiego powiązania. Konto, które już jest
    powiązane, pozostaje powiązane i działa dalej — reguła zamyka tylko
    drogę do tworzenia nowych powiązań. Jest to rozróżnienie, które warto
    postawić wprost, bo raport pokaże zgodność, a konto powiązane wcześniej
    zostanie nietknięte.

    Skutki bezpośrednie są drobne i dotyczą wyłącznie czynności
    wykonywanych ręcznie na maszynie. Użytkownik próbujący dodać konto
    z usługi sieciowej albo powiązać z nią swoje konto lokalne dostanie
    odmowę z komunikatem o zasadzie organizacji.

    Na serwerze skutek jest zwykle żaden, bo nikt takich czynności tam nie
    wykonuje.

    Wartość trzy blokuje obie czynności; wartość jeden tylko powiązanie
    istniejącego konta. Nazwa ustawienia nie mówi, że stopnie są dwa.

    Czego to nie psuje: kont już istniejących, logowania kontami domenowymi
    i lokalnymi, usług, sieci.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether an account bound
    to the online service is on the machine already.

    The rollout does not unbind such an account. An account already bound stays bound
    and works on - the rule shuts only the road to making new bindings. It is a
    distinction worth putting outright, the report showing compliance while an account
    bound earlier is left untouched.

    The direct consequences are small and touch only acts performed by hand on the
    machine. A user trying to add an account from the online service, or to bind their
    local account to it, will get a refusal with a message about an organisation's
    policy.

    On a server the consequence is as a rule none, nobody performing such acts there.

    The value three blocks both acts; the value one only the binding of an existing
    account. The setting's name does not say there are two degrees.

    What this does not break: accounts already there, signing in with domain and local
    accounts, services, or the network.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Użytkownik nie doda konta z usługi sieciowej ani nie powiąże z nią swojego konta lokalnego - odmowa wskaże zasadę organizacji
      - Konto już powiązane pozostaje powiązane i działa dalej, bo reguła zamyka tylko drogę do tworzenia nowych powiązań
      - Wartość jeden zamiast trzech blokuje samo powiązanie istniejącego konta i zostawia dodawanie nowych otwarte
      - Logowanie kontami domenowymi i lokalnymi, usługi i sieć pozostają bez zmian
    en:
      - A user will not add an account from the online service nor bind their local account to it - the refusal will name an organisation policy
      - An account already bound stays bound and works on, the rule shutting only the road to making new bindings
      - The value one instead of three blocks only the binding of an existing account and leaves the adding of new ones open
      - Signing in with domain and local accounts, services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Konfiguracja maszyny przewiduje dodanie konta z usługi sieciowej i nie wskazano dla niego zamiennika
      - Na maszynie jest już konto powiązane z usługą sieciową i nie ustalono, co z nim zrobić
    en:
      - The machine's setup foresees an account from the online service being added and no replacement has been named for it
      - An account bound to the online service is on the machine already and it has not been settled what to do with it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'NoConnectedUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'NoConnectedUser'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Three blocks both adding a new account and binding an existing local
    # account to the online service. One blocks only the second of those.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoConnectedUser' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-block-microsoft-accounts

notes:
  pl: |
    Punkt tworzy parę z regułą poprzednią i dopiero obie razem zamykają
    sprawę. Tamta zabrania się uwierzytelniać, ta zabrania powstawać.
    Wdrożona sama zostawia konta już powiązane przy pełnej sprawności;
    wdrożona razem z tamtą domyka i jedno, i drugie.

    Rzecz do pokazania w raporcie: zgodność w tym punkcie nie znaczy, że
    na maszynie nie ma kont powiązanych z usługą sieciową. Znaczy, że
    nowych nie przybędzie. Sprawdzenie stanu zastanego jest osobną
    czynnością i tej reguła nie wykonuje.

    Rozróżnienie wartości jeden i trzy warto pokazywać w podglądzie przed
    wykonaniem, podobnie jak przy regule o klientach nieuwierzytelnionych.
    Jest to kolejne ustawienie, którego nazwa nie zdradza, że ma stopnie.
  en: |
    The item makes a pair with the previous rule and only both together shut the
    matter. That one forbids authenticating, this one forbids coming into being. Rolled
    out alone it leaves accounts already bound in full working order; rolled out with
    that one it shuts both.

    A thing to show in the report: compliance at this item does not mean there are no
    accounts bound to the online service on the machine. It means no new ones will
    appear. Checking the state found in place is a separate act and this rule does not
    perform it.

    Telling the values one and three apart is worth showing in the preview before
    execution, as at the rule about unauthenticated clients. It is another setting whose
    name does not betray that it has degrees.
