id: win2025-audit-policy-subcategory-override

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Szczegółowe zasady inspekcji nadrzędne wobec starszych kategorii
    en: Detailed audit policy takes precedence over the legacy categories
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, który z dwóch mechanizmów konfiguracji
    inspekcji obowiązuje: starszy, oparty na dziewięciu szerokich
    kategoriach, czy nowszy, oparty na kilkudziesięciu podkategoriach.

    Bez tego ustawienia konfiguracja szczegółowa bywa nadpisywana przez
    starszą przy każdym zastosowaniu zasad. Objawia się to w sposób
    szczególnie kłopotliwy: inspekcja jest ustawiona poprawnie, raport
    to potwierdza, a po odświeżeniu zasad wraca do stanu, którego nikt
    nie zamawiał. Ustawienia te potrafią się w ten sposób przełączać
    tygodniami.

    Wszystkie punkty inspekcji opisane w tej paczce używają mechanizmu
    nowszego. Ten punkt jest więc warunkiem ich trwałości — bez niego
    reszta grupy jest konfiguracją, która może przestać obowiązywać bez
    niczyjej ingerencji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szansę,
    że zapis, na którym opiera się wykrywanie, zniknie sam z siebie
    przy najbliższym odświeżeniu zasad. Nie trzeba go wyłączać — wystarczy
    poczekać.
  en: |
    The setting settles which of two mechanisms for configuring auditing holds: the older,
    resting on nine broad categories, or the newer, resting on a few dozen subcategories.

    Without this setting the detailed configuration is at times overwritten by the older one
    at every application of policies. It shows itself in a particularly troublesome way: the
    auditing is set rightly, the report confirms it, and after a refreshing of policies it
    returns to a state nobody ordered. Those settings can switch back and forth in this way
    for weeks.

    Every auditing item described in this pack uses the newer mechanism. This item is thus
    the condition of their lasting - without it the rest of the group is a configuration
    that may stop holding with nobody's hand in it.

    What an attacker gains while the item goes unmet: the chance that the record detection
    rests on will vanish of itself at the next refreshing of policies. It need not be
    switched off - it is enough to wait.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak inspekcja jest na tym serwerze
    skonfigurowana dzisiaj, bo zmiana przesądza, który zestaw ustawień
    zacznie obowiązywać.

    Nic nie przestaje działać i nikt niczego nie zauważy. Skutek dotyczy
    wyłącznie zakresu zapisu.

    Na serwerze skonfigurowanym podkategoriami zmiana utrwala stan
    istniejący i nie zmienia niczego w treści dziennika.

    Na serwerze skonfigurowanym po staremu — a takich jest sporo, bo
    środowiska serwerowe bywają starsze niż stanowiska — zmiana przełącza
    system na zestaw podkategorii, który może być pusty. Zapis zawęzi się
    wtedy do wartości domyślnych i część zdarzeń przestanie powstawać.

    Skutek praktyczny dotyczy systemów zbierających zdarzenia. Reguły
    wykrywania oparte na zdarzeniach z konfiguracji starszego typu mogą
    przestać się uruchamiać — nie dlatego, że coś się zepsuło, tylko
    dlatego, że przestały przychodzić zdarzenia, na których stały.

    Kolejność wdrożenia jest tu istotna: najpierw ustawić podkategorie,
    potem włączyć ich nadrzędność. Odwrotna kolejność zostawia lukę
    w zapisie.
  en: |
    What needs checking is how auditing is configured on this server today, since the change
    settles which set of settings starts to hold.

    Nothing stops working and nobody notices anything. The effect concerns the reach of the
    record alone.

    On a server configured by subcategories the change fixes the existing state and changes
    nothing in the log's content.

    On a server configured in the old way - and there are a good many, since server settings
    are at times older than stations - the change switches the system to a set of
    subcategories that may be empty. The record will then narrow to default values and some
    events will stop arising.

    The practical effect concerns event-gathering systems. Detection rules resting on events
    from the older style of configuration may stop firing - not because something broke, but
    because the events they stood on have stopped coming.

    The order of the rollout matters here: first set the subcategories, then switch on their
    precedence. The reverse order leaves a gap in the record.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na serwerze bez ustawionych podkategorii zapis zawęzi się do wartości domyślnych
      - Objętość dziennika zmieni się w górę lub w dół, zależnie od wcześniejszej konfiguracji
      - Reguły wykrywania oparte na zdarzeniach starszego typu mogą przestać się uruchamiać
      - Na serwerze już skonfigurowanym podkategoriami zmiana nie zmienia niczego
    en:
      - On a server with no subcategories set the record will narrow to default values
      - The log's volume changes up or down, depending on the earlier configuration
      - Detection rules resting on events of the older kind may stop firing
      - On a server already configured by subcategories the change changes nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Inspekcja na tym serwerze jest skonfigurowana wyłącznie starymi kategoriami i nikt nie ustawił podkategorii
      - System zbierający zdarzenia opiera swoje reguły na zdarzeniach z konfiguracji starszego typu
    en:
      - Auditing on this server is configured through the old categories alone and nobody has set subcategories
      - An event-gathering system rests its rules on events from the older style of configuration
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'SCENoApplyLegacyAuditPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'SCENoApplyLegacyAuditPolicy' -ErrorAction SilentlyContinue).'SCENoApplyLegacyAuditPolicy'
    [pscustomobject]@{
      path        = $path
      name        = 'SCENoApplyLegacyAuditPolicy'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SCENoApplyLegacyAuditPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/audit-force-audit-policy-subcategory-settings-to-override-audit-policy-category-settings

notes:
  pl: |
    Punkt jest warunkiem trwałości całej grupy inspekcji z tej paczki.
    Wszystkie tamte reguły ustawiają podkategorie, a bez tego ustawienia
    podkategorie bywają nadpisywane przy odświeżaniu zasad.

    Kolejność wdrożenia jest odwrotna niż mogłoby się wydawać. Najpierw
    ustawia się podkategorie, potem włącza ich nadrzędność — inaczej
    system przełącza się na zestaw jeszcze niewypełniony i zapis
    na chwilę zanika.

    Punkt nie zmienia tego, co jest rejestrowane. Przesądza wyłącznie,
    który z dwóch mechanizmów konfiguracji ma pierwszeństwo.
  en: |
    The item is the condition of the whole auditing group in this pack lasting. All those
    rules set subcategories, and without this setting subcategories are at times overwritten
    at the refreshing of policies.

    The order of the rollout is the reverse of what might seem. First the subcategories are
    set, then their precedence is switched on - otherwise the system switches to a set not
    yet filled and the record vanishes for a while.

    The item does not change what is recorded. It settles only which of the two
    configuration mechanisms takes precedence.
