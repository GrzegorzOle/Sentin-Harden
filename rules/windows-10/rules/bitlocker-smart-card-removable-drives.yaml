id: win10-bitlocker-smart-card-removable-drives

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Karta wymagana do odblokowania nośników wymiennych
    en: A card required to unlock removable media
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga karty z certyfikatem do odblokowania zaszyfrowanego
    nośnika wymiennego.

    Powiązanie nośnika z kartą zamyka scenariusz, którego nie zamyka samo
    szyfrowanie: nośnik zgubiony razem z komputerem albo nośnik zostawiony
    w maszynie, przy której ktoś obcy usiadł. Sam fakt zalogowania nie
    otwiera wtedy danych, bo do otwarcia potrzeba jeszcze przedmiotu.

    Drugi skutek jest mniej oczywisty i dotyczy zasięgu. Nośnik powiązany
    z kartą przestaje być otwieralny gdziekolwiek — otwiera się tylko tam,
    gdzie jest czytnik i uprawniona karta. Jest to poważne ograniczenie
    i zarazem cały sens tego punktu: nośnik przestaje być samodzielny.

    Odnotowuję, że punkt składa się z dwóch wartości. Pierwsza dopuszcza
    kartę, druga czyni ją wymaganą; sama pierwsza zostawia wybór
    użytkownikowi, czyli nie ustala niczego. Sprawdzenie nazywa ten stan
    osobno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    nośnika przez samo przejęcie sesji, bez żadnego przedmiotu w ręku.
  en: |
    The setting calls for a card bearing a certificate to unlock an enciphered removable medium.

    The binding of a medium to a card shuts a case that enciphering alone does not: a medium lost together with
    its computer, or a medium left in a machine at which a stranger has sat down. The mere fact of a signing in
    does not then open the data, an object being needed besides.

    The second consequence is the less plain and touches reach. A medium bound to a card ceases to be openable
    anywhere at all - it opens only where there is a reader and a card with the right. It is a heavy bound and at
    the same time the whole sense of this item: the medium ceases to stand on its own.

    I set down that the item is made of two values. The first admits the card, the second makes it required; the
    first alone leaves the choice to the user, which is to say it settles nothing. The check names that state
    apart.

    What an attacker gains while the item goes unmet: the way into a medium by the taking of a session alone, with
    no object in hand.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to w tym bloku punkt
    o najwęższym zastosowaniu.

    Wymaga czytników, kart i urzędu wydającego certyfikaty — tak samo jak
    odpowiednik dla dysków stałych. Różnica polega na tym, że nośnik
    wymienny z założenia podróżuje, a czytnik zostaje na biurku.

    Skutek jest więc taki, że nośnik przestaje być użyteczny poza
    stanowiskami wyposażonymi w czytnik. Przekazanie danych komukolwiek
    z zewnątrz staje się niemożliwe tą drogą, a odbiorca nie otworzy
    nośnika nawet wtedy, gdy ma dobre intencje i klucz odzyskiwania.

    Odnotowuję, że zmiana dotyczy nośników szyfrowanych po jej
    wprowadzeniu. Nośniki zaszyfrowane wcześniej otwierają się
    dotychczasowymi sposobami.

    Punkt ten ma sens tam, gdzie nośniki wymienne krążą wyłącznie
    wewnątrz organizacji i nie są narzędziem wymiany z otoczeniem. Poza
    tym układem jest to zakaz wyniesienia danych, przebrany za wymóg
    uwierzytelnienia — i warto to powiedzieć wprost, zamiast pozwolić
    komuś odkryć to później.

    Czego to nie psuje: pracy na dyskach stałych, logowania, drukowania,
    udziałów plikowych, odczytu nośników niezaszyfrowanych.
  en: |
    The class is "needs a planned rollout", and it is of this block the item of the narrowest use.

    It calls for readers, cards and an office issuing the certificates - as with its counterpart for fixed drives.
    The difference is that a removable medium travels by design while the reader stays upon the desk.

    The consequence is therefore that the medium ceases to be of use away from stations fitted with a reader. The
    handing of data to anybody outside becomes impossible by that road, and the receiver will not open the medium
    even where they mean well and hold a key of recovery.

    I set down that the change touches media enciphered after it was brought in. Media enciphered earlier open by
    the ways they had.

    This item makes sense where removable media go about within the body alone and are no tool of exchange with
    the world around. Outside that arrangement it is a forbidding of the carrying out of data dressed as a calling
    for authentication - and it is worth saying outright rather than letting somebody find it out later.

    What this does not break: work upon fixed drives, logging on, printing, file shares, or the reading of
    unenciphered media.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Nośnik przestaje być użyteczny poza stanowiskami wyposażonymi w czytnik kart
      - Przekazanie danych komukolwiek z zewnątrz tą drogą staje się niemożliwe
      - Odbiorca nie otworzy nośnika nawet wtedy, gdy ma dobre intencje i klucz odzyskiwania
      - Nośniki zaszyfrowane wcześniej otwierają się dotychczasowymi sposobami, bo zasada nie działa wstecz
      - Praca na dyskach stałych, logowanie, drukowanie i odczyt nośników niezaszyfrowanych pozostają bez zmian
    en:
      - The medium ceases to be of use away from stations fitted with a reader of cards
      - The handing of data to anybody outside becomes impossible by that road
      - The receiver will not open the medium even where they mean well and hold a key of recovery
      - Media enciphered earlier open by the ways they had, the policy not working backwards
      - Work upon fixed drives, logging on, printing and the reading of unenciphered media stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki wymienne służą do wymiany danych z otoczeniem, gdzie nie ma ani czytników, ani uprawnionych kart
      - Nie ma czytników kart ani urzędu wydającego certyfikaty, więc nośnik stałby się nieotwieralny
    en:
      - Removable media serve for the exchange of data with the world around, where there are neither readers nor cards with the right
      - There are no readers of cards nor an office issuing certificates, so the medium would become unopenable
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes it
      # required - admitted without required leaves the choice open and is reported
      # apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'RDVAllowUserCert'
        $enforce = $item.'RDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'RDVAllowUserCert'
      allow_existed   = ($null -ne $item.'RDVAllowUserCert')
      enforce         = $item.'RDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'RDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both values go in together. The first alone admits the card without calling
    # for it, and the item would then rest upon each user s own choice.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w całym bloku o nośnikach wymiennych najbardziej
    ograniczająca i warto, żeby aplikacja postawiła to na początku opisu,
    zamiast chować wśród wymagań sprzętowych.

    Argument wart postawienia wprost dotyczy tego, co ten punkt naprawdę
    robi. Nominalnie wymaga uwierzytelnienia; praktycznie uniemożliwia
    wyniesienie danych do kogokolwiek spoza organizacji. Oba opisy są
    prawdziwe, ale decyzję podejmuje się na podstawie drugiego, a nie
    pierwszego.

    Odnotowuję, że punkt jest sensowny w układzie, w którym nośniki krążą
    wyłącznie wewnątrz. Tam nie odbiera niczego, a zamyka scenariusz
    przejętej sesji i zgubionego sprzętu. Poza tym układem jego koszt jest
    nieproporcjonalny do zysku i aplikacja powinna pozwolić świadomie go
    odpuścić.
  en: |
    The rule is of the whole block about removable media the most binding, and it is well that the application set
    that at the head of the description rather than hide it among the requirements of gear.

    The argument worth putting outright touches what this item truly does. In name it calls for authentication;
    in practice it makes the carrying of data out to anybody beyond the body impossible. Both descriptions are
    true, but the decision is taken upon the second and not the first.

    I set down that the item is sensible in an arrangement where the media go about within alone. There it takes
    nothing away, and it shuts the case of a taken session and of lost gear. Outside that arrangement its cost
    stands out of all proportion to the gain, and the application ought to let it be knowingly set aside.
