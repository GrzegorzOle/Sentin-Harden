id: win2016-defender-sample-submission

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > MAPS
  title:
    pl: Wysyłanie próbek ograniczone do plików niezawierających danych osobowych
    en: Sample submission limited to files holding no personal data
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy i które pliki napotkane na maszynie mogą
    zostać wysłane do producenta ochrony w celu głębszego zbadania.

    Jest to punkt innego rodzaju niż pozostałe w bloku i warto to powiedzieć
    od razu. Nie zamyka żadnej drogi ataku na tę maszynę. Podnosi
    skuteczność ochrony — również na innych maszynach — bo plik zbadany
    staje się plikiem rozpoznawalnym dla wszystkich.

    Wartość dla tej maszyny jest pośrednia: szybsze orzeczenie w przypadkach
    niejednoznacznych, czyli mniej plików wstrzymanych na darmo i mniej
    przepuszczonych przez pomyłkę.

    Wartość, która waży naprawdę, jest zbiorowa. Ochrona oparta na wiedzy
    o plikach działa tym lepiej, im więcej plików ktoś zbadał — i właśnie
    o udział w tym chodzi.

    Rzecz, której nie wolno przemilczeć: wysyłany jest plik, a nie
    informacja o nim. Wartość wymagana ogranicza to do plików, które
    z dużym prawdopodobieństwem nie zawierają danych osobowych, ale
    ograniczenie to jest oceną automatyczną, a nie gwarancją.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio na tej maszynie. Punkt należy do skuteczności ochrony jako
    całości, a nie do odporności pojedynczego systemu.
  en: |
    The setting settles whether, and which, files met with on the machine may be
    sent to the protection's maker to be examined more deeply.

    This is an item of another kind than the rest of the block, and that is worth
    saying at once. It shuts no road of attack on this machine. It raises the
    protection's effect - on other machines too - since a file examined becomes a
    file recognisable to everybody.

    The value to this machine is indirect: a quicker verdict in doubtful cases,
    which is to say fewer files held back for nothing and fewer let through by
    mistake.

    The value that really weighs is collective. Protection resting on knowledge of
    files works the better the more files somebody has examined - and it is a share
    in that which is at stake.

    A thing that must not be passed over in silence: what is sent is a file, not
    information about it. The required value limits this to files that with high
    likelihood hold no personal data, but that limit is an automatic judgement
    rather than a guarantee.

    What an attacker gains while the item goes unmet: nothing directly on this
    machine. The item belongs to the effect of the protection as a whole rather than
    to the resilience of a single system.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to jedyny punkt w bloku,
    przy którym decyzja nie jest techniczna.

    Wysyłanie plików poza organizację dotyka zasad o danych, a nie
    konfiguracji maszyny. Rozstrzyga o tym osoba odpowiadająca za dane, a nie
    administrator ani ten, kto prowadzi audyt. Uwaga o tym siedzi wprost
    w poleceniu naprawczym, bo jest warunkiem wykonania, a nie zaleceniem.

    Wartość wymagana jest wariantem ostrożnym: wysyłane są wyłącznie pliki
    ocenione jako niezawierające danych osobowych. Ocena ta jest
    automatyczna. Plik roboczy aplikacji, dokument w nietypowym formacie
    albo archiwum konfiguracji mogą zostać zakwalifikowane jako bezpieczne
    do wysłania, a zawierać treść, której nikt wysyłać nie zamierzał.

    Skutków eksploatacyjnych nie ma żadnych — poza ruchem wychodzącym przy
    napotkaniu pliku nieznanego, drobnym i rzadkim.

    W segmencie bez dostępu do usługi zewnętrznej punkt jest bezczynny, tak
    samo jak pozostałe reguły oparte na tej usłudze.

    Czego to nie psuje: usług, logowania, pracy aplikacji, sprawdzania
    plików lokalnie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and it is the only item in the block
    where the decision is not a technical one.

    Sending files outside the organisation touches the rules about data rather than
    the machine's configuration. It is settled by whoever answers for data, and not
    by the administrator nor by whoever runs the audit. The remark about that sits
    in the remedial command outright, being a condition of execution rather than a
    recommendation.

    The required value is the careful variant: only files judged to hold no personal
    data are sent. That judgement is automatic. An application's working file, a
    document in an unusual format, or an archive of configuration can be classed as
    safe to send while holding content nobody meant to send.

    There are no operational consequences whatever - beyond outgoing traffic at the
    meeting with an unknown file, small and sparse.

    In a segment with no access to the outside service the item is idle, just as the
    other rules resting on that service are.

    What this does not break: services, signing in, the working of applications, or
    the checking of files locally.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Plik roboczy aplikacji albo archiwum konfiguracji może zostać zakwalifikowane jako bezpieczne do wysłania, choć zawiera treść, której nikt wysyłać nie zamierzał
      - Ocena, czy plik zawiera dane osobowe, jest automatyczna i nie jest gwarancją
      - W segmencie bez dostępu do usługi zewnętrznej punkt jest bezczynny, mimo zgodności w raporcie
      - Usługi, logowanie, praca aplikacji i sprawdzanie plików lokalnie pozostają bez zmian
    en:
      - An application's working file or an archive of configuration can be classed as safe to send while holding content nobody meant to send
      - The judgement whether a file holds personal data is automatic and is no guarantee
      - In a segment with no access to the outside service the item is idle, despite compliance in the report
      - Services, signing in, the working of applications and the checking of files locally stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zasady organizacji zabraniają wysyłania plików poza jej infrastrukturę i nie uzyskano zgody osoby odpowiadającej za dane
      - Na maszynie leżą pliki robocze mogące zawierać treść chronioną, a ocena automatyczna nie daje tu wystarczającej pewności
    en:
      - The organisation's rules forbid files to be sent outside its own infrastructure and no consent has been had from whoever answers for data
      - Working files that may hold protected content lie on the machine, and the automatic judgement gives no sufficient certainty here
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).SubmitSamplesConsent }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'SubmitSamplesConsent'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This sends files off the machine, not merely data about them. The agreement
    # belongs to whoever answers for data, not to whoever runs the audit.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SubmitSamplesConsent' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-antivirus-sample-submission

notes:
  pl: |
    Punkt zamyka blok ochrony i jest w nim jedynym, który daje więcej innym
    niż tej maszynie. Warto to powiedzieć wprost, bo inaczej niska kategoria
    wygląda na niedbałość oceny, a nie na rzetelny opis.

    Odpuszczenie tego punktu jest wynikiem prawidłowym i częstym. Decyzja
    zapada poza maszyną i powinna zostać zapisana wraz z uzasadnieniem —
    dokładnie tak, jak przewiduje obsługa wyjątków. Jest to jeden
    z najlepszych przykładów punktu, przy którym aplikacja ma pomóc
    zdecydować, a nie naciskać.

    Wariant ostrożniejszy, czyli całkowite wyłączenie wysyłania, nie jest tu
    zgodny z zasadą i warto wiedzieć dlaczego. Reguła oczekuje wartości
    opisującej ograniczenie, a nie zakaz — bo zakaz odbiera także te
    przypadki, w których wysłanie pliku przyspiesza orzeczenie dotyczące tej
    właśnie maszyny.
  en: |
    The item shuts the protection block and is the only one in it giving more to
    others than to this machine. That is worth saying outright, since otherwise the
    low category looks like carelessness of judgement rather than an honest
    description.

    Letting this item go is a proper outcome and a common one. The decision is taken
    outside the machine and should be written down with its justification - exactly
    as the handling of exceptions provides for. It is among the best examples of an
    item where the application is to help decide rather than to press.

    The more careful variant, namely switching sending off altogether, does not
    agree with the principle here, and it is worth knowing why. The rule expects a
    value describing a limit rather than a ban - since a ban also takes away those
    cases in which sending a file quickens a verdict concerning this very machine.
