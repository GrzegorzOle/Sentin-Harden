id: win2025-diagnostic-data-device-name-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Wysyłanie nazwy maszyny w danych diagnostycznych wyłączone
    en: Sending of the machine name in diagnostic data disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza dołączanie nazwy maszyny do danych diagnostycznych
    wysyłanych producentowi.

    Kategoria średnia i chcę uzasadnić ją inaczej niż przez samą nazwę, bo
    „nazwa komputera" brzmi błaho. Reszta danych diagnostycznych opisuje
    maszynę: jakie ma oprogramowanie, w jakich wersjach, co się na niej
    zawiesza. Bez nazwy jest to opis maszyny anonimowej. Z nazwą staje się
    opisem konkretnej maszyny konkretnej organizacji.

    To jest różnica między zbiorem, w którym trudno cokolwiek odszukać,
    a zbiorem, w którym da się zapytać o maszynę po nazwie. A nazwy
    serwerów w organizacjach bywają mówiące — potrafią zdradzać rolę,
    lokalizację, dział i numer w szeregu, i często wystarczą, żeby
    odgadnąć nazwy pozostałych.

    Na serwerze waży to więcej niż na stacji roboczej właśnie dlatego, że
    stacje nazywa się seriami, a serwery nazywa się od tego, co robią.
    Nazwa serwera jest informacją, nawet gdy stoi sama.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: powiązanie
    opisu technicznego z konkretną maszyną i konkretną organizacją — czyli
    to, co zamienia ogólny zbiór danych w wskazówkę.
  en: |
    The item switches off attaching the machine's name to diagnostic data
    sent to the maker.

    The category is medium, and I want to justify it by something other than
    the name itself, because "computer name" sounds trivial. The rest of the
    diagnostic data describes the machine: what software it has, in what
    versions, what crashes on it. Without a name that is a description of an
    anonymous machine. With a name it becomes a description of a particular
    machine of a particular organisation.

    That is the difference between a collection in which it is hard to find
    anything and a collection that can be asked about a machine by name. And
    server names in organisations tend to speak - they can give away the
    role, the site, the department and the number in a row, and are often
    enough to guess the names of the rest.

    On a server this weighs more than on a workstation precisely because
    workstations are named in series while servers are named after what they
    do. A server's name is information even when it stands alone.

    What an attacker gains while the item goes unmet: the tie between a
    technical description and a particular machine of a particular
    organisation - that is, what turns a general body of data into a hint.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i sprawdzenie jest tu tego samego
    rodzaju co przy zakresie danych, tylko węższe.

    Rzecz do ustalenia: czy jakiekolwiek narzędzie zarządzania z chmury
    producenta rozpoznaje tę maszynę po nazwie. Jeżeli tak, to po zmianie
    maszyna nie zniknie z takiego narzędzia, ale zacznie w nim wyglądać jak
    wpis bez nazwy — i wtedy z wykazu dwustu serwerów nie da się powiedzieć,
    który to który. Sprawozdanie nadal będzie prawdziwe i nadal nieczytelne,
    a to jest ten rodzaj szkody, którego nie widać w chwili wprowadzania
    zmiany, tylko pół roku później, przy pierwszym poważnym pytaniu.

    Sprawdzić warto też, czy nie stoi to w sprzeczności z wewnętrznym
    wymaganiem sprawozdawczym: część organizacji wymaga, żeby każda maszyna
    dała się jednoznacznie wskazać w każdym zestawieniu, także tym po
    stronie producenta.

    Czego to nie psuje: nazwa maszyny nie zmienia się i nie znika. W sieci,
    w katalogu, w dziennikach, w dokumentacji i w każdym narzędziu
    wewnętrznym pozostaje dokładnie ta sama. Zmienia się wyłącznie to, czy
    towarzyszy danym wychodzącym na zewnątrz.

    Zmiana nie wymaga przerwy, jest niewidoczna w codziennej pracy i cofa
    się natychmiast.
  en: |
    I keep the class "needs review", and the review here is of the same kind
    as with the scope of the data, only narrower.

    What has to be settled: whether any management tool in the maker's cloud
    recognises this machine by name. If it does, then after the change the
    machine will not vanish from such a tool but will start looking there
    like an entry without a name - and then out of a list of two hundred
    servers nobody can say which is which. The report will still be true and
    still unreadable, and that is the kind of harm invisible at the moment
    of the change and visible six months later, at the first serious
    question.

    It is also worth checking whether this conflicts with an internal
    reporting requirement: some organisations require every machine to be
    identifiable beyond doubt in every listing, including the one on the
    maker's side.

    What this does not break: the machine's name does not change and does
    not disappear. On the network, in the directory, in the logs, in the
    documentation and in every internal tool it stays exactly the same. All
    that changes is whether it accompanies the data going outwards.

    The change needs no outage, is invisible in daily work, and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - updates-and-servicing
  what_breaks:
    pl:
      - W narzędziach zarządzania po stronie producenta maszyna zacznie wyglądać jak wpis bez nazwy
      - Z wykazu dwustu serwerów nie da się wtedy powiedzieć, który to który — sprawozdanie zostaje prawdziwe i nieczytelne
      - Może to kłócić się z wymaganiem, żeby każda maszyna dała się jednoznacznie wskazać w każdym zestawieniu
      - Nazwa maszyny nie zmienia się i nie znika — w sieci, katalogu, dziennikach i narzędziach wewnętrznych pozostaje ta sama
    en:
      - In management tools on the maker's side the machine starts looking like an entry without a name
      - Out of a list of two hundred servers nobody can then say which is which - the report stays true and unreadable
      - This may conflict with a requirement that every machine be identifiable beyond doubt in every listing
      - The machine's name does not change and does not disappear - on the network, in the directory, in the logs and in internal tools it stays the same
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie zarządzania po stronie producenta rozpoznaje tę maszynę po nazwie i na tym opiera się sprawozdawczość
      - Wewnętrzne wymaganie każe wskazywać każdą maszynę jednoznacznie także w zestawieniach po stronie producenta
    en:
      - A management tool on the maker's side recognises this machine by name and the reporting rests on that
      - An internal requirement calls for every machine to be identified beyond doubt, including in listings on the maker's side
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value carries an older name than the policy does.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDeviceNameInTelemetry'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'AllowDeviceNameInTelemetry' -ErrorAction SilentlyContinue).'AllowDeviceNameInTelemetry'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowDeviceNameInTelemetry'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine's name stays the same everywhere else - on the network, in
    # the directory, in the logs. Only its company with the data going outwards
    # ends. Check first whether a tool on the maker's side identifies this
    # machine by name.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDeviceNameInTelemetry' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    „Nazwa komputera" brzmi błaho, a jest różnicą między opisem maszyny
    anonimowej a opisem konkretnej maszyny konkretnej organizacji — czyli
    między zbiorem, w którym trudno cokolwiek odszukać, a takim, w którym
    da się zapytać o maszynę po nazwie.

    Na serwerze waży to więcej niż na stacji, bo stacje nazywa się seriami,
    a serwery od tego, co robią. Nazwa serwera potrafi zdradzać rolę,
    lokalizację i dział, i często wystarczy, żeby odgadnąć nazwy
    pozostałych.

    Szkoda po drugiej stronie jest opóźniona: w narzędziu producenta
    maszyna zacznie wyglądać jak wpis bez nazwy, sprawozdanie zostanie
    prawdziwe i nieczytelne, a zobaczy się to dopiero przy pierwszym
    poważnym pytaniu.
  en: |
    "Computer name" sounds trivial, and it is the difference between a
    description of an anonymous machine and a description of a particular
    machine of a particular organisation - that is, between a collection in
    which it is hard to find anything and one that can be asked about a
    machine by name.

    On a server this weighs more than on a workstation, because
    workstations are named in series and servers after what they do. A
    server's name can give away the role, the site and the department, and
    is often enough to guess the names of the rest.

    The harm on the other side is delayed: in the maker's tool the machine
    starts looking like an entry without a name, the report stays true and
    unreadable, and this is seen only at the first serious question.
