id: win10-ssdp-discovery-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa wykrywania urządzeń w sieci lokalnej wyłączona
    en: The service finding gear in the near network switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę odnajdującą w sieci lokalnej urządzenia
    zgłaszające się same: drukarki, telewizory, odtwarzacze, routery.

    Mechanizm ten działa przez rozgłaszanie. Maszyna wysyła pytanie do
    całej sieci i przyjmuje odpowiedzi od każdego, kto się odezwie.
    Nie ma tu uwierzytelniania — urządzeniem jest to, co twierdzi, że
    nim jest.

    Zagrożenie pierwsze to podszywanie się. Urządzenie w tej samej sieci
    może zgłosić się jako drukarka albo odtwarzacz i zostanie przyjęte,
    a użytkownik zobaczy je na liście obok urządzeń prawdziwych.

    Zagrożenie drugie to rozgłaszanie własnej obecności. Maszyna sama
    mówi sieci, że jest, i opisuje, czego szuka.

    Zagrożenie trzecie to warstwa obsługi. Odpowiedzi są parsowane przez
    kod działający w tle, a kod przyjmujący dane od dowolnego urządzenia
    w sieci jest kodem wartym uwagi napastnika.

    Odnotowuję, że usługa ta jest podstawą dla udostępniania maszyny jako
    urządzenia sieciowego, więc oba punkty wdraża się razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zgłoszenia się maszynie jako urządzenie, bez żadnego potwierdzania.
  en: |
    The setting switches off the service finding in the near network the gear that reports itself: printers,
    seeing screens, players, routers.

    That mechanism works by calling out. The machine sends a question to the whole network and takes in answers
    from whoever speaks up. There is no warranting here - a thing is what it says it is.

    The first danger is the feigning. A thing in that same network may report itself as a printer or a player and
    will be taken in, and the user will see it in the roll beside the true gear.

    The second danger is the calling out of one's own being there. The machine tells the network itself that it
    is, and sets out what it seeks.

    The third danger is the layer of backing. The answers are parsed by code working behind the scene, and code
    taking in data from any thing in the network is code worth an attacker's notice.

    I set down that this service is the ground of the giving out of the machine as gear of the network, so both
    items are rolled out together.

    What an attacker gains while the item goes unmet: the power of reporting themselves to the machine as gear,
    with no warranting at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś odnajduje urządzenia tą drogą.

    Miejscem pierwszym są drukarki sieciowe dodawane przez wyszukanie
    w sieci. Po zmianie trzeba będzie podać adres drukarki wprost,
    a użytkownik zobaczy pustą listę i uzna, że drukarki nie ma.

    Miejscem drugim jest przesyłanie obrazu na telewizor albo na
    odtwarzacz w sali. Osoba prowadząca prezentację zauważy to w chwili,
    gdy będzie potrzebne.

    Miejscem trzecim są programy odnajdujące sprzęt sieciowy: narzędzia
    do konfiguracji routerów, kamer i sprzętu domowego.

    Odnotowuję, że dostęp do urządzenia o znanym adresie działa dalej.
    Traci się odnajdywanie, a nie samo połączenie.

    Skutek jest widoczny dla użytkownika w postaci pustych list wyboru.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: drukowania na drukarce już dodanej, sieci,
    logowania, pracy programów, udostępniania plików.
  en: |
    The class is "needs review", and the object of the review is whether anybody finds gear by that road.

    The first place is printers upon the network added by a seeking in the network. After the change the
    printer's address will have to be given outright, and the user will see an empty roll and will hold that there
    is no printer.

    The second place is the sending of a picture to a seeing screen or to a player in a room. Whoever holds a
    showing will mark it at the hour it is needed.

    The third place is programs finding gear of the network: tools for the setting of routers, seeing glasses and
    gear of the home.

    I set down that the reach of a thing of known address works on. What is lost is the finding and not the
    joining.

    The consequence is plain to the user in the shape of empty rolls of choice.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: printing upon a printer already added, the network, logging on, the work of
    programs, or the giving out of files.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - printing
    - user-interface
  what_breaks:
    pl:
      - Drukarki sieciowe przestaną pojawiać się na liście i trzeba będzie podać ich adres wprost
      - Użytkownik zobaczy pustą listę wyboru i uzna, że urządzenia nie ma
      - Przesyłanie obrazu na telewizor albo odtwarzacz w sali przestanie działać
      - Narzędzia do konfiguracji routerów, kamer i sprzętu domowego przestaną odnajdywać urządzenia
      - Dostęp do urządzenia o znanym adresie, drukowanie na już dodanej drukarce, sieć i logowanie pozostają bez zmian
    en:
      - Printers upon the network will cease to show in the roll and their address will have to be given outright
      - The user will see an empty roll of choice and will hold that the thing is not there
      - The sending of a picture to a seeing screen or a player in a room will cease to work
      - Tools for the setting of routers, seeing glasses and gear of the home will cease to find them
      - The reach of a thing of known address, printing upon a printer already added, the network and logging on stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Drukarki dodaje się na tym stanowisku przez wyszukanie w sieci
      - Praca obejmuje przesyłanie obrazu na telewizor albo odtwarzacz w sali
    en:
      - Printers are added upon this station by a seeking in the network
      - The work takes in the sending of a picture to a seeing screen or a player in a room
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'SSDPSRV' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SSDPSRV' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SSDPSRV' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Reguła daje skutek widoczny w postaci pustych list wyboru i warto,
    żeby aplikacja uprzedziła o tym wprost. Pusta lista jest odczytywana
    jako awaria, a nie jako działanie zasady, i zgłoszenie trafi do
    wsparcia jako usterka.

    Argument wart postawienia dotyczy braku uwierzytelniania. Urządzeniem
    jest to, co twierdzi, że nim jest, więc cokolwiek w tej samej sieci
    może zgłosić się jako drukarka i stanąć na liście obok prawdziwych.

    Odnotowuję parę z punktem o udostępnianiu maszyny jako urządzenia
    sieciowego. Ta usługa jest dla tamtej podstawą i wdraża się je razem.
  en: |
    The rule gives an upshot to be seen in the shape of empty rolls of choice, and it is well that the application
    forestall it outright. An empty roll is read as a breakdown and not as the working of a policy, and the report
    will reach the board of help as a fault.

    The argument worth putting touches the want of warranting. A thing is what it says it is, so whatever stands
    in that same network may report itself as a printer and take its place in the roll beside the true ones.

    I set down the pair with the item about the giving out of the machine as gear of the network. This service is
    the ground of that one and they are rolled out together.
