id: win2016-simultaneous-connections-minimized

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connection Manager
  title:
    pl: Liczba jednoczesnych połączeń z sieciami ograniczona
    en: The number of simultaneous connections to networks limited
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza liczbę sieci, z którymi maszyna jest połączona
    jednocześnie.

    Rzecz, przed którą to broni, nazywa się mostkowaniem. Maszyna
    podłączona jednocześnie do dwóch sieci jest drogą między nimi — i to
    drogą, której nie widzi żadne urządzenie brzegowe, bo ruch nie
    przechodzi przez brzeg, tylko przez tę maszynę.

    Przypadek typowy wygląda niewinnie. Maszyna stoi w sieci wewnętrznej
    na kablu i jednocześnie ma połączenie bezprzewodowe albo przez modem.
    Nikt tego nie planował; po prostu obie karty były włączone. Od tej
    chwili sieć wewnętrzna ma wyjście, którego nikt nie zaprojektował.

    Ustawienie każe systemowi utrzymywać jedno połączenie naraz i zrywać
    pozostałe. Na tym wydaniu systemu jest to przełącznik, a nie wybór
    z kilku wariantów — wariant zrywający połączenie bezprzewodowe przy
    podłączonym kablu pojawił się w wydaniach późniejszych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    mogącą stać się przejściem między siecią wewnętrzną a dowolną inną,
    bez wiedzy kogokolwiek.
  en: |
    The setting limits the number of networks the machine is joined to at one time.

    The thing this guards against is called bridging. A machine joined at once to two networks is a road
    between them - and a road no edge device sees, the traffic going not through the edge but through that
    machine.

    The typical case looks innocent. The machine stands in the internal network on a cable and at the same
    time has a wireless connection or one through a modem. Nobody planned it; both cards were simply switched
    on. From that moment the internal network has an exit nobody designed.

    The setting bids the system keep one connection at a time and drop the rest. On this release it is a
    switch rather than a choice of several variants - the variant dropping the wireless connection while the
    cable is in came in later releases.

    What an attacker gains while the item goes unmet: a machine able to become a passage between the internal
    network and any other, without anybody's knowledge.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy maszyn, które mają
    dwie drogi celowo.

    Przypadek pierwszy: maszyna z siecią zarządzającą i siecią danych,
    rozdzielonymi świadomie. Jest to rozwiązanie częste i prawidłowe,
    a punkt ten w nie uderza wprost — system zerwie jedno z połączeń
    i zrobi to bez ostrzeżenia.

    Przypadek drugi: maszyna z łączem zapasowym utrzymywanym stale, żeby
    przejęcie było natychmiastowe. Po zmianie łącze zapasowe będzie
    zestawiane dopiero po utracie podstawowego, a więc z opóźnieniem.

    Przypadek trzeci: klastry i rozwiązania nadmiarowe, w których kilka
    kart pracuje równolegle z założenia.

    Objaw jest natychmiastowy i dotkliwy — połączenie znika. Warto
    zaplanować to na okno serwisowe mimo klasy, która tego nie wymaga,
    bo sprawdzenie zajmuje mniej czasu niż wyjaśnianie, czemu maszyna
    straciła jedną ze ścieżek.

    Czego to nie psuje: pojedynczego połączenia, nazw, tras statycznych,
    zapory, usług, aplikacji.

    Wymaga zatrzymania usługi zarządcy połączeń; cofnięcie natychmiastowe.
  en: |
    The class is "needs review", and the review concerns machines that have two roads on purpose.

    The first case: a machine with a management network and a data network, parted knowingly. It is a common
    and proper arrangement, and this item strikes at it outright - the system will drop one of the connections
    and will do so without a warning.

    The second case: a machine with a reserve link kept up ceaselessly so that the taking over should be
    immediate. After the change the reserve link will be set up only after the main one is lost, and so with a
    delay.

    The third case: clusters and redundant arrangements in which several cards work side by side by design.

    The symptom is immediate and keenly felt - a connection vanishes. It is worth planning this for a service
    window despite a class that does not call for one, the checking taking less time than the explaining of
    why the machine lost one of its paths.

    What this does not break: a single connection, names, static routes, the firewall, services, or
    applications.

    Calls for the connection manager service to be stopped; the undoing is immediate.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Maszyna z siecią zarządzającą i siecią danych rozdzielonymi świadomie traci jedno z połączeń bez ostrzeżenia
      - Łącze zapasowe utrzymywane stale będzie zestawiane dopiero po utracie podstawowego, a więc z opóźnieniem
      - Klastry i rozwiązania nadmiarowe z kilkoma kartami pracującymi równolegle przestają działać jak zaprojektowano
      - Objaw jest natychmiastowy i dotkliwy, bo połączenie po prostu znika
      - Pojedyncze połączenie, nazwy, trasy statyczne i zapora pozostają bez zmian
    en:
      - A machine with a management network and a data network parted knowingly loses one of the connections without a warning
      - A reserve link kept up ceaselessly will be set up only after the main one is lost, and so with a delay
      - Clusters and redundant arrangements with several cards working side by side cease to work as designed
      - The symptom is immediate and keenly felt, the connection simply vanishing
      - A single connection, names, static routes and the firewall stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna ma sieć zarządzającą i sieć danych rozdzielone świadomie i obie muszą działać jednocześnie
      - Łącze zapasowe jest utrzymywane stale, żeby przejęcie przy awarii było natychmiastowe
      - Maszyna jest węzłem klastra, w którym kilka kart pracuje równolegle z założenia
    en:
      - The machine has a management network and a data network parted knowingly and both must work at once
      - A reserve link is kept up ceaselessly so that the taking over at a failure should be immediate
      - The machine is a cluster node in which several cards work side by side by design
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
      $name = 'fMinimizeConnections'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    $name = 'fMinimizeConnections'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On this release the setting is a switch rather than a choice of four - the
    # variant dropping wireless while the cable is in came later. Enabled means
    # the machine keeps one connection at a time.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fMinimizeConnections' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/

notes:
  pl: |
    Punkt zamyka blok i jest w nim jedyny, w którym kategoria ryzyka jest
    niska, a koszt wdrożenia realny. Jest to dokładnie ten wiersz macierzy,
    w którym świadome odpuszczenie bywa decyzją prawidłową — i warto,
    żeby aplikacja przedstawiła go właśnie tak.

    Kategoria niska wynika z kryterium: żeby mostkowanie dało napastnikowi
    cokolwiek, musi on być w tej drugiej sieci i musi maszyna mieć obie
    karty czynne. Są to dwa warunki dodatkowe, więc mimo poważnego
    brzmienia skutku sama kategoria pozostaje niska.

    Na serwerze przypadków z dwiema drogami celowymi jest sporo, więc
    warto, żeby aplikacja zapytała o rozdzielenie sieci zarządzającej
    przed pokazaniem tej reguły jako niespełnionej. Ostrzeżenie trafione
    w konkretną maszynę jest tu wielokrotnie więcej warte niż ogólne.

    Odnotowuję różnicę wobec wydań późniejszych. Tam ustawienie ma cztery
    warianty, w tym jeden zrywający połączenie bezprzewodowe przy
    podłączonym kablu. Na tym wydaniu jest to przełącznik i audyt
    sprawdza wartość włączoną, a nie wariant.
  en: |
    The item shuts the block and is the only one in it whose risk category is low while the rollout's cost is
    real. It is exactly that row of the matrix in which a knowing letting go is at times the proper decision -
    and it is well that the application present it just so.

    The low category follows from the criterion: for bridging to give an attacker anything, they must be in
    that other network and the machine must have both cards live. Those are two further conditions, so
    despite the grave sound of the consequence the category itself stays low.

    On a server cases with two roads on purpose are plenty, so it is well that the application ask about the
    parting of a management network before showing this rule as unmet. A warning aimed at a particular machine
    is here worth many times a general one.

    Worth noting the difference from later releases. There the setting has four variants, among them one
    dropping the wireless connection while the cable is in. On this release it is a switch, and the audit
    checks for the switched-on value rather than a variant.
