id: win10-downloaded-maps-manager-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania pobranymi mapami wyłączona
    en: The service ordering the maps brought down switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę pobierającą i utrzymującą mapy zapisane na
    maszynie do użytku bez połączenia z siecią.

    Jest to usługa działająca w tle, niezależnie od tego, czy ktokolwiek
    kiedykolwiek otworzył mapy. Sprawdza, czy zapisane mapy są aktualne,
    i pobiera nowe wersje, gdy trzeba.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Nie zamyka
    drogi wejścia ani nie broni przed konkretnym atakiem. Zdejmuje jedną
    usługę z zestawu uruchamianych i zamyka jedno połączenie wychodzące
    nawiązywane bez udziału użytkownika.

    Znaczenie ma to drugie. Usługa pobiera dane z sieci samoczynnie,
    więc jest kanałem wychodzącym działającym w tle, na maszynie, która
    zwykle map nie używa w ogóle.

    Odnotowuję, że pobrane mapy zajmują miejsce na dysku i bywają
    utrzymywane latami, choć nikt do nich nie zagląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    — ruch wychodzący w tle i jedną usługę więcej w działającym zestawie.
  en: |
    The setting switches off the service bringing down and keeping the maps written upon the machine for use with
    no joining to the network.

    It is a service working behind the scene, whether anybody has ever opened the maps or not. It looks at whether
    the written maps are current and brings down new ones where need be.

    The grading is low and the item is to be put forward as such. It shuts no road in and guards against no
    particular assault. It takes one service out of the set that is set going and shuts one joining going out,
    made with no part taken by the user.

    The second of these has weight. The service brings down data from the network of itself, so it is a channel
    going out working behind the scene, upon a machine that commonly uses maps not at all.

    I set down that the maps brought down take up room upon the disk and are at times kept for years, though
    nobody looks into them.

    What an attacker gains while the item goes unmet: little - traffic going out behind the scene and one service
    more in the working set.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć sprawdzenie jest tu najkrótsze
    w całym bloku.

    Miejscem wartym uwagi jest praca z mapami bez połączenia z siecią.
    Na stanowisku wyjeżdżającym w teren zapisane mapy bywają jedyną
    drogą sprawdzenia miejsca, gdy sieci nie ma. Po zmianie przestaną
    być aktualizowane, a z czasem przestaną działać w ogóle.

    Odnotowuję, że mapy otwierane w przeglądarce działają dalej. Ta
    usługa odpowiada wyłącznie za mapy zapisane na dysku, a nie za dostęp
    do map w sieci.

    Zastrzegam, że na stanowisku, na którym nikt map nie otwiera,
    zmiana nie robi nic widocznego — a zwalnia miejsce na dysku
    i zamyka ruch wychodzący nawiązywany w tle.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: map otwieranych w przeglądarce, sieci, logowania,
    drukowania, pracy programów.
  en: |
    The class is "needs review", though the review is here the shortest in the whole block.

    The place worth notice is work with maps with no joining to the network. Upon a station going out into the
    field the written maps are at times the one road to the looking up of a place where there is no network. After
    the change they will cease to be brought up to date and in time will cease to work at all.

    I set down that maps opened in a browser work on. That service answers for the maps written upon the disk
    alone and not for the reach of maps in the network.

    I set down that upon a station where nobody opens maps the change does nothing to be seen - and frees room
    upon the disk and shuts traffic going out made behind the scene.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: maps opened in a browser, the network, logging on, printing, or the work of
    programs.

implementation_consequences:
  impact_areas:
    - user-interface
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Mapy zapisane na dysku przestaną być aktualizowane, a z czasem przestaną działać w ogóle
      - Stanowisko wyjeżdżające w teren straci drogę sprawdzenia miejsca tam, gdzie sieci nie ma
      - Mapy otwierane w przeglądarce działają dalej, bo usługa odpowiada wyłącznie za zapisane na dysku
      - Na stanowisku, na którym nikt map nie otwiera, zmiana nie robi nic widocznego
      - Sieć, logowanie, drukowanie, praca programów i dostęp do map w sieci pozostają bez zmian
    en:
      - Maps written upon the disk will cease to be brought up to date and in time will cease to work at all
      - A station going out into the field will lose its road to the looking up of a place where there is no network
      - Maps opened in a browser work on, the service answering for those written upon the disk alone
      - Upon a station where nobody opens maps the change does nothing to be seen
      - The network, logging on, printing, the work of programs and the reach of maps in the network stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko wyjeżdża w teren i korzysta z map zapisanych na dysku tam, gdzie nie ma sieci
    en:
      - The station goes out into the field and uses maps written upon the disk where there is no network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MapsBroker'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MapsBroker'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'MapsBroker' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MapsBroker' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'MapsBroker' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    Reguła jest z najtańszych w całym zestawie i warto, żeby aplikacja
    powiedziała to wprost zamiast udawać, że chodzi o bezpieczeństwo.
    Ocena jest niska, bo droga wejścia tu nie powstaje.

    Argument wart zachowania dotyczy ruchu w tle. Usługa pobiera dane
    z sieci samoczynnie, bez udziału użytkownika, na maszynie, która
    zwykle map nie używa w ogóle. Zamknięcie takiego ruchu jest
    porządkiem, nie obroną, i tak trzeba to nazwać.

    Odnotowuję wyjątek: stanowiska wyjeżdżające w teren, na których mapy
    zapisane na dysku bywają jedyną drogą sprawdzenia miejsca bez sieci.
    Tam punkt trzeba odpuścić świadomie.
  en: |
    The rule is among the cheapest in the whole set, and it is well that the application say it outright rather
    than feign that safety is at stake. The grading is low, no road in arising here.

    The argument worth keeping touches traffic behind the scene. The service brings down data from the network of
    itself, with no part taken by the user, upon a machine that commonly uses maps not at all. The shutting of
    such traffic is good order and no guard, and so it is to be named.

    I set down the exception: stations going out into the field, upon which maps written to the disk are at times
    the one road to the looking up of a place with no network. There the item is to be let go knowingly.
