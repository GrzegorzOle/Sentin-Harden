id: win2025-bitlocker-removable-drives-write-protected

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na niezaszyfrowanych nośnikach wymiennych zabroniony
    en: Writing to unencrypted removable media forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że nośnik wymienny, który nie jest zaszyfrowany, daje
    się tylko czytać. Zapis na niego zostaje odmówiony.

    Zostawiam kategorię wysoką. To jest ten sam rodzaj reguły co zakaz
    zapisu na niezaszyfrowanych dyskach stałych: wymusza, żeby szyfrowanie
    w ogóle nastąpiło, zamiast opisywać, jak ma wyglądać. Bez niego cała
    grupa nośników wymiennych jest zbiorem ustawień czekających na to, że
    ktoś pamiętał.

    Różnica wobec tamtej reguły jest jednak istotna i nie chcę jej zatrzeć.
    Wolumen stały zakłada się raz i zostaje. Nośnik wymienny podłącza się
    ciągle, a w dodatku bywa nim nośnik, którego ta maszyna nie
    przygotowywała: dysk przyniesiony przez inżyniera dostawcy, nośnik
    z materiałem od kontrahenta, pamięć wyjęta z innego serwera. Ta reguła
    działa na nie wszystkie, bez wyjątku i bez pytania.

    Dlatego jest tu więcej niż wymuszenie szyfrowania. To jest zarazem
    jedyna reguła w tej grupie, która ogranicza wynoszenie danych: po jej
    włączeniu nikt nie skopiuje niczego na przypadkowy dysk podłączony do
    serwera, bo zapis po prostu nie przejdzie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyniesienia danych z serwera na dowolnym nośniku podłączonym na chwilę,
    bez śladu w konfiguracji i bez żadnego kroku, który trzeba obejść.
  en: |
    The item makes a removable medium that is not encrypted readable only.
    Writing to it is refused.

    I keep the category high. This is the same kind of rule as the ban on
    writing to unencrypted fixed drives: it forces encryption to happen at
    all rather than describing what it should look like. Without it the
    whole removable media group is a set of settings waiting for somebody
    to remember.

    The difference from that rule matters, though, and I do not want to
    blur it. A fixed volume is set up once and stays. A removable medium is
    attached constantly, and on top of that it is often a medium this
    machine never prepared: a disk brought by a vendor engineer, a medium
    carrying material from a contractor, storage taken out of another
    server. This rule applies to all of them, without exception and without
    asking.

    So there is more here than enforcing encryption. This is at the same
    time the only rule in this group that limits carrying data out: once it
    is on, nobody will copy anything onto a stray disk attached to the
    server, because the write simply will not go through.

    What an attacker gains while the item goes unmet: the ability to carry
    data off the server on any medium attached for a moment, leaving no
    trace in the configuration and with no step to be worked around.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać objaw,
    bo przy nośnikach wymiennych jest on gorszy niż przy dyskach stałych
    z jednego powodu: prawie zawsze pojawia się bez świadka.

    Na serwerze nośnik wymienny to najczęściej cel kopii zapasowej.
    Zadanie kopii nie zapyta o politykę szyfrowania — dostanie odmowę
    zapisu i zgłosi ją tak, jak umie: jako brak miejsca, błąd nośnika albo
    po prostu niepowodzenie zadania. Dzieje się to w nocy, do nikogo nie
    mówi, a pierwszą osobą, która to zauważy, bywa ta, która potrzebuje
    odtworzenia. To jest najgorszy możliwy moment na dowiedzenie się
    o zmianie polityki.

    Drugi przypadek jest mniej groźny, za to pewny: dysk inżyniera dostawcy
    podłączony po to, żeby zebrać dane diagnostyczne, przestaje przyjmować
    zapis. Zdarza się to zwykle w trakcie awarii, czyli wtedy, gdy nikt nie
    ma czasu na szukanie przyczyny.

    Dlatego kolejność jest tu równie ważna jak przy dyskach stałych:
    najpierw wykaz nośników, które ta maszyna zapisuje cyklicznie, potem
    ich zaszyfrowanie, i dopiero na końcu ta reguła. Do wykazu należą także
    nośniki rotowane — dysk kopii wynoszony poza budynek zwykle nie jest
    jeden, tylko jest ich kilka na zmianę, i każdy musi być zaszyfrowany
    osobno.

    Na koniec rzecz praktyczna, którą warto umieć rozpoznać: po tej zmianie
    wszystkie nośniki niezaszyfrowane, także te przyniesione z zewnątrz
    i przeznaczone wyłącznie do odczytu, zachowują się jak zabezpieczone
    przed zapisem od strony sprzętu. To jest oczekiwany skutek, nie usterka.

    Zmiana nie wymaga przerwy i cofa się natychmiast — i tu ma to znaczenie,
    bo daje wyjście, gdy wykaz okaże się niepełny.
  en: |
    I keep the class "needs a planned rollout", and I want to name the
    symptom, because with removable media it is worse than at fixed drives
    for one reason: it nearly always appears with no witness.

    On a server a removable medium is most often the target of a backup. A
    backup job will not ask about an encryption policy - it will get a
    write refusal and report it the way it knows how: as a lack of space, a
    medium error, or simply a failed job. This happens at night, it speaks
    to nobody, and the first person to notice it is often the one who needs
    a restore. That is the worst possible moment to learn about a change of
    policy.

    The second case is less dangerous but certain: a vendor engineer's disk
    attached to collect diagnostic data stops accepting writes. That
    usually happens during a failure, which is when nobody has time to look
    for a cause.

    So order matters here as much as at fixed drives: first an inventory of
    the media this machine writes to cyclically, then encrypting them, and
    only at the end this rule. The inventory has to include rotated media -
    the backup disk carried out of the building is usually not one disk but
    several in turn, and each has to be encrypted separately.

    Finally, something practical worth being able to recognise: after this
    change all unencrypted media, including those brought from outside and
    meant only for reading, behave as though write-protected in hardware.
    That is the expected effect, not a fault.

    The change needs no outage and is undone immediately - and that matters
    here, because it provides a way out when the inventory turns out to be
    incomplete.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
    - file-sharing
  what_breaks:
    pl:
      - Zadanie kopii zapasowej piszące na niezaszyfrowany nośnik kończy się niepowodzeniem w nocy, bez świadka
      - Zgłasza to jako brak miejsca, błąd nośnika albo niepowodzenie zadania, więc nic nie prowadzi w stronę przyczyny
      - Pierwszą osobą, która to zauważy, bywa ta, która potrzebuje odtworzenia
      - Dysk inżyniera dostawcy podłączony na czas diagnostyki przestaje przyjmować zapis, zwykle w trakcie awarii
      - Wszystkie nośniki rotowane trzeba zaszyfrować osobno, bo dysk kopii wynoszony poza budynek rzadko jest jeden
    en:
      - A backup job writing to an unencrypted medium fails at night, with no witness
      - It reports this as a lack of space, a medium error or a failed job, so nothing leads towards the cause
      - The first person to notice is often the one who needs a restore
      - A vendor engineer's disk attached for a diagnosis stops accepting writes, usually during a failure
      - Every rotated medium has to be encrypted separately, because the backup disk carried out is rarely just one
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sporządzono wykazu nośników, na które ta maszyna zapisuje cyklicznie, wraz ze stanem szyfrowania każdego z nich
      - Nośniki kopii zapasowych są rotowane, a zaszyfrowano tylko część z nich
      - Do maszyny podłącza się nośniki przynoszone z zewnątrz, na które trzeba zapisywać dane diagnostyczne
    en:
      - No inventory of the media this machine writes to cyclically, with each one's encryption state, has been made
      - Backup media are rotated and only some of them have been encrypted
      - Media brought from outside are attached to the machine and diagnostic data has to be written onto them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
      $name = 'RDVDenyWriteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    $name = 'RDVDenyWriteAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Run this last, after the media have been inventoried and encrypted -
    # including every disk in a rotation. A backup job writing to an
    # unencrypted medium will fail at night and report a lack of space or a
    # medium error, so the first person to notice is whoever needs a restore.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyWriteAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Ten sam rodzaj reguły co zakaz zapisu na niezaszyfrowanych dyskach
    stałych, ale działa też na nośniki, których ta maszyna nie
    przygotowywała: dysk inżyniera dostawcy, nośnik od kontrahenta, pamięć
    z innego serwera.

    Przy okazji jest to jedyna reguła w tej grupie ograniczająca wynoszenie
    danych — po włączeniu nikt nie skopiuje niczego na przypadkowy dysk
    podłączony do serwera.

    Objaw jest gorszy niż przy dyskach stałych, bo prawie zawsze pojawia
    się bez świadka: zadanie kopii pada w nocy i zgłasza brak miejsca albo
    błąd nośnika. Do wykazu przed wdrożeniem należą wszystkie nośniki
    rotowane, nie tylko ten podłączony dzisiaj.
  en: |
    The same kind of rule as the ban on writing to unencrypted fixed
    drives, but it also applies to media this machine never prepared: a
    vendor engineer's disk, a contractor's medium, storage from another
    server.

    It is at the same time the only rule in this group that limits carrying
    data out - once it is on, nobody will copy anything onto a stray disk
    attached to the server.

    The symptom is worse than at fixed drives because it nearly always
    appears with no witness: the backup job fails at night and reports a
    lack of space or a medium error. The pre-rollout inventory has to cover
    every medium in a rotation, not just the one attached today.
