id: win2025-smb-client-plaintext-password-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wysyłanie hasła otwartym tekstem do obcych serwerów plików zabronione
    en: Sending a password in clear text to third-party file servers forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi udziałów sieciowych na tej maszynie
    wysyłać hasło otwartym tekstem, gdy serwer, z którym rozmawia,
    zażąda właśnie takiego sposobu.

    Rzecz dotyczy zachowania, które wygląda na niemożliwe, a mimo to
    jest przewidziane: serwer po drugiej stronie oświadcza, że nie umie
    szyfrować, a klient — jeżeli mu wolno — ulega i podaje hasło wprost.
    Hasło idzie wtedy przez sieć w postaci czytelnej dla każdego, kto
    patrzy.

    Niebezpieczeństwo nie polega na tym, że takie serwery istnieją,
    tylko na tym, że stroną decydującą jest serwer. Napastnik prowadzący
    ruch przez własną maszynę podaje się za serwer plików, oświadcza,
    że szyfrowania nie obsługuje, i odbiera hasło podane dobrowolnie.
    Nie łamie niczego — prosi, a klient daje.

    Na serwerze przedmiotem są jego własne połączenia wychodzące, nie
    udziały, które udostępnia. Serwer sięga po udziały częściej, niż się
    o nim myśli: po zasoby kopii zapasowych, po udziały urządzeń
    sieciowych, po katalogi z danymi na macierzach. Konto używane do
    takich połączeń bywa przy tym kontem o szerokich uprawnieniach,
    więc wartość przechwyconego hasła jest tu wyższa niż przy
    stanowisku roboczym.

    Warto wiedzieć, że stan domyślny jest zgodny, a niezgodność oznacza
    wpis wprowadzony ręcznie — zwykle po to, żeby połączyć się
    z urządzeniem, które inaczej nie chciało współpracować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    konta używanego do połączeń wychodzących, podane dobrowolnie,
    czytelnie, po wystawieniu podstawionego serwera plików.
  en: |
    The setting forbids the network-share client on this machine to send a password in clear text
    where the server it is speaking with demands just that way.

    The matter bears on a behaviour that looks impossible and is nonetheless foreseen: the server
    on the other side declares it cannot encrypt, and the client - where it may - gives way and
    hands the password over plainly. The password then goes over the network readable by anyone
    watching.

    The danger lies not in such servers existing but in the server being the deciding side. An
    attacker leading traffic through a machine of their own gives themselves out for a file
    server, declares they bear no encryption, and takes a password handed over willingly. They
    break nothing - they ask, and the client gives.

    On a server the subject is its own outgoing connections, not the shares it holds out. A
    server reaches for shares oftener than is thought: for backup resources, for the shares of
    network devices, for catalogues of data on storage arrays. The account used for such
    connections is withal at times an account of wide rights, so the worth of a caught password
    is higher here than at a working station.

    It is worth knowing that the default state is compliant, and non-compliance means an entry
    made by hand - usually to connect with a device that otherwise would not work along.

    What an attacker gains while the item goes unmet: the password of the account used for
    outgoing connections, handed over willingly and readably, once a false file server is put up.

disruption_description:
  pl: |
    Nikt tego nie zauważy. Stan domyślny jest już zgodny, a zmiana
    przywraca go tam, gdzie ktoś go kiedyś odwrócił.

    Połączenia do udziałów systemów Windows i do urządzeń sieciowych
    współczesnych działają po zmianie bez różnicy, bo hasła otwartym
    tekstem nie używają i nigdy o nie nie proszą.

    Przypadek, w którym zmiana coś zmienia, jest jeden i łatwy do
    rozpoznania: urządzenie na tyle stare, że innego sposobu
    uwierzytelnienia nie zna. Bywa to macierz z oprogramowaniem sprzed
    lat albo sterownik maszyny udostępniający katalog. Objaw jest
    natychmiastowy i jednoznaczny — połączenie zostaje odrzucone przy
    próbie, a nie w sposób trudny do prześledzenia.

    Jeżeli taki przypadek na serwerze występuje, właściwą odpowiedzią
    nie jest pozostawienie hasła otwartego, tylko zdjęcie urządzenia
    z drogi uwierzytelnianej — dostęp bez poświadczeń do wydzielonego
    zasobu jest tu wyborem lepszym niż hasło konta wysyłane czytelnie.

    Zmiana nie dotyczy udziałów udostępnianych przez ten serwer. Mowa
    wyłącznie o jego połączeniach wychodzących.

    Zmiana nie wymaga przerwy, wchodzi w życie natychmiast i cofa się
    natychmiast.
  en: |
    Nobody will mark it. The default state is compliant already, and the change restores it where
    somebody once turned it about.

    Connections to the shares of Windows systems and to present-day network devices work after
    the change with no difference, using no clear-text passwords and never asking for them.

    The case where the change does change something is one and easy to know: a device old enough
    to know no other way of authenticating. It is at times a storage array with software years
    old, or a machine controller holding out a catalogue. The symptom is immediate and plain -
    the connection is turned away at the try rather than in a way hard to follow.

    Where such a case is on the server, the right answer is not the leaving of the open password
    but the taking of the device off the authenticated road - access without credentials to a set
    apart resource is here a better choice than an account's password sent readably.

    The change does not bear on the shares this server holds out. What is spoken of are its
    outgoing connections alone.

    The change takes no break, comes into force at once and is undone at once.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - drivers-and-devices
  what_breaks:
    pl:
      - Połączenie do urządzenia znającego wyłącznie hasło otwartym tekstem zostanie odrzucone
      - Połączenia do udziałów systemów Windows i urządzeń współczesnych działają bez różnicy
      - Udziały udostępniane przez ten serwer nie są tym punktem dotknięte
      - Objaw jest natychmiastowy i jednoznaczny, a nie trudny do prześledzenia
    en:
      - A connection to a device knowing none but the clear-text password will be turned away
      - Connections to the shares of Windows systems and present-day devices work with no difference
      - The shares this server holds out are untouched by this item
      - The symptom is immediate and plain rather than hard to follow
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer łączy się z urządzeniem, które nie zna innego sposobu uwierzytelnienia, i nie ma dla niego drogi zastępczej
    en:
      - The server connects to a device knowing no other way of authenticating and there is no spare road for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      $name = 'EnablePlainTextPassword'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    $name = 'EnablePlainTextPassword'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnablePlainTextPassword' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-client-send-unencrypted-password-to-third-party-smb-servers

notes:
  pl: |
    Punkt dotyczy połączeń wychodzących tego serwera, a nie udziałów,
    które udostępnia. Serwer sięga po udziały częściej, niż się o nim
    myśli — po zasoby kopii zapasowych i po katalogi na macierzach.

    Stroną decydującą o sposobie uwierzytelnienia jest serwer po drugiej
    stronie, i na tym polega niebezpieczeństwo: podstawiony serwer prosi
    o hasło wprost, a klient je podaje.

    Stan domyślny jest zgodny. Niezgodność oznacza wpis wprowadzony
    ręcznie — warto ustalić, dla którego urządzenia, zanim się go cofnie.
  en: |
    The item bears on this server's outgoing connections and not on the shares it holds out. A
    server reaches for shares oftener than is thought - for backup resources and for catalogues
    on storage arrays.

    The side deciding the way of authenticating is the server on the other end, and therein lies
    the danger: a false server asks for the password plainly, and the client gives it.

    The default state is compliant. Non-compliance means an entry made by hand - it is worth
    settling for which device before undoing it.
