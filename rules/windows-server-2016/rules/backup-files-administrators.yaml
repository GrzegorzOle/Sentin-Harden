id: win2016-backup-files-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie kopii zapasowych plików tylko dla administratorów
    en: Backing up files restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do tworzenia kopii zapasowych plików
    i katalogów do grupy administratorów lokalnych.

    Nazwa uprawnienia opisuje jego przeznaczenie, a nie jego działanie.
    Działanie polega na tym, że posiadacz czyta dowolny plik na maszynie
    z pominięciem uprawnień plikowych. Nie omija ich przez lukę — system
    celowo je tu pomija, bo program wykonujący kopię musi przeczytać
    wszystko, również to, do czego jego konto dostępu nie ma.

    Napastnik nie musi więc tego uprawnienia obchodzić ani niczego
    podnosić. Wystarczy, że go użyje zgodnie z przeznaczeniem: wykona kopię
    zapasową katalogów, których normalnie nie zobaczy, i odczyta ją gdzie
    indziej.

    Kategoria wysoka. Uprawnienie nie pozwala niczego zmienić i zostawia
    dane nietknięte, ale zdejmuje z maszyny całą ochronę dostępu do odczytu
    — włącznie z gałęziami rejestru i plikami bazy kont.

    Na serwerze 2016 punkt ten wymaga szczególnej uwagi, bo maszyny tego
    rocznika bywają obsługiwane przez oprogramowanie kopii zapasowych
    starsze niż one same.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    każdego pliku na maszynie, bez zmiany uprawnień i bez zmiany właściciela,
    czyli bez śladu, którego szukałby przegląd uprawnień.
  en: |
    The item limits the right to back up files and directories to the local
    administrators group.

    The right's name describes its purpose rather than what it does. What it does
    is let its holder read any file on the machine bypassing file permissions. It
    does not evade them through a flaw - the system deliberately sets them aside
    here, because a program making a backup must read everything, including what
    its account has no access to.

    An attacker therefore need not get round this right or elevate anything. It
    is enough to use it as intended: make a backup of directories they would
    normally not see, and read it elsewhere.

    The category is high. The right permits nothing to be changed and leaves the
    data untouched, but it strips the machine of its whole protection against
    reading - including registry hives and the files of the accounts database.

    On Server 2016 this item calls for particular attention, because machines of
    this vintage are sometimes served by backup software older than they are.

    What an attacker gains while the item goes unmet: the reading of every file
    on the machine, with no change of permissions and no change of owner - that
    is, with none of the traces a review of permissions would look for.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy jednej rzeczy: na jakim
    koncie działa oprogramowanie kopii zapasowych.

    Jeżeli działa na koncie systemowym albo na koncie należącym do grupy
    administratorów, zmiana nie zrobi nic. Jeżeli działa na osobnym koncie
    usługowym — a tak zalecają instrukcje większości producentów — odebranie
    uprawnienia zatrzyma kopie.

    Skutek jest przy tym opóźniony i mylący. Usługa nadal wstaje, zadanie
    nadal się uruchamia, a błąd pojawia się dopiero przy pierwszym pliku,
    do którego konto nie ma dostępu. Kopia bywa wtedy raportowana jako
    wykonana z ostrzeżeniami, a brakujących katalogów nikt nie zauważa aż do
    próby odtworzenia.

    Dlatego to nie jest punkt do naprawiania hurtem. Przed zmianą warto
    ustalić konto, sprawdzić, czy należy do grupy administratorów, a jeśli
    nie — rozstrzygnąć, czy przenieść je do tej grupy, czy zostawić
    uprawnienie i zapisać wyjątek.

    Na kontrolerze domeny stan domyślny obejmuje także operatorów kopii
    zapasowych i operatorów serwera, więc wynik niezgodny na takiej maszynie
    warto obejrzeć, zanim zostanie naprawiony.

    Czego to nie psuje: odczytu plików wynikającego ze zwykłych uprawnień,
    udostępniania ani kopii wykonywanych na koncie systemowym.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about one thing: what account
    the backup software runs under.

    If it runs under the system account or under an account belonging to the
    administrators group, the change does nothing. If it runs under a separate
    service account - as most vendors' instructions recommend - taking the right
    away will stop the backups.

    The effect is both delayed and misleading. The service still starts, the job
    still runs, and the error appears only at the first file the account has no
    access to. The backup is then sometimes reported as completed with warnings,
    and nobody notices the missing directories until a restore is attempted.

    This is therefore not an item to remedy in bulk. Before the change it is
    worth establishing the account, checking whether it belongs to the
    administrators group, and if not - deciding whether to move it into that
    group or to leave the right and record an exception.

    On a domain controller the default state also covers backup operators and
    server operators, so a non-compliant result on such a machine is worth
    looking at before it is remedied.

    What this does not break: reading files by way of ordinary permissions,
    sharing, or backups made under the system account.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Oprogramowanie kopii zapasowych działające na osobnym koncie usługowym przestaje czytać pliki, do których konto nie ma dostępu
      - Kopia bywa raportowana jako wykonana z ostrzeżeniami, a braki wychodzą dopiero przy próbie odtworzenia
      - Na kontrolerze domeny zmiana odbiera uprawnienie operatorom kopii zapasowych i operatorom serwera
      - Kopie wykonywane na koncie systemowym i odczyt wynikający ze zwykłych uprawnień działają bez zmian
    en:
      - Backup software running under a separate service account stops reading files its account has no access to
      - The backup is sometimes reported as completed with warnings, and the gaps show only when a restore is attempted
      - On a domain controller the change takes the right from backup operators and server operators
      - Backups made under the system account and reading by way of ordinary permissions work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie kopii zapasowych działa na koncie usługowym spoza grupy administratorów i nie ustalono, czy uprawnienie jest mu potrzebne
      - Maszyna jest kontrolerem domeny, a uprawnienie mają operatorzy kopii zapasowych zgodnie ze stanem domyślnym
    en:
      - The backup software runs under a service account outside the administrators group and it has not been established whether it needs the right
      - The machine is a domain controller and backup operators hold the right in accordance with the default state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeBackupPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeBackupPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeBackupPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish the backup software's account first. Taken off this list it keeps
    # starting and fails only at the first file it cannot read - and the job is
    # then reported as completed with warnings.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeBackupPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeBackupPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/back-up-files-and-directories

notes:
  pl: |
    Uprawnienie to działa wyłącznie wtedy, gdy program wprost o nie poprosi
    przy otwieraniu pliku. Nie jest więc tak, że posiadacz czyta wszystko
    przez przypadek — czyta wszystko wtedy, kiedy chce. Dla oceny ryzyka nie
    ma to znaczenia, bo warunek ten spełnia każde narzędzie napisane w tym
    celu.

    Stan domyślny różni się między rolami maszyny. Serwer członkowski ma tu
    administratorów i operatorów kopii zapasowych, kontroler domeny dodatkowo
    operatorów serwera. Reguła oczekuje samych administratorów, więc na
    maszynie nietkniętej wynik bywa niezgodny — i jest to wynik prawdziwy,
    a nie błąd reguły.

    Punkt warto czytać razem z regułą o odtwarzaniu plików, która daje
    uprawnienie odwrotne: zapis z pominięciem uprawnień. Tamto jest groźniejsze,
    bo pozwala zmieniać, a nie tylko czytać.
  en: |
    The right takes effect only where a program explicitly asks for it when
    opening a file. It is not that the holder reads everything by accident - they
    read everything when they choose to. For the assessment of risk that makes no
    difference, because any tool written for the purpose meets the condition.

    The default state differs between the machine's roles. A member server has
    administrators and backup operators here; a domain controller has server
    operators as well. The rule expects administrators alone, so on an untouched
    machine the result is sometimes non-compliant - and that is a true result
    rather than an error in the rule.

    The item is worth reading together with the rule on restoring files, which
    grants the reverse right: writing while bypassing permissions. That one is
    the more dangerous, because it allows change rather than mere reading.
