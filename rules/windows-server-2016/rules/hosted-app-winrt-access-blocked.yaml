id: win2016-hosted-app-winrt-access-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App runtime
  title:
    pl: Uruchamianie aplikacji z dostępem do systemu z treści zdalnej zablokowane
    en: The starting of applications with access to the system from remote content blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania aplikacjom uruchamianym z treści pobranej z sieci
    sięgać do składników systemu.

    Punkt dotyczy granicy, która w tym miejscu zostaje przekroczona
    z założenia, a nie przez błąd. Strona wyświetlana w oprawie aplikacji
    może poprosić o dostęp do składników systemu i go dostać. Nie musi
    niczego łamać — wystarczy, że poprosi.

    Znaczy to, że to, co przyszło z sieci, i to, co działa na maszynie,
    przestaje być rozdzielone. Strona może zmienić się między jednym
    otwarciem a drugim, a zmiana leży po stronie serwera, nie maszyny.
    Kontrola nad tym, co się wykona, przechodzi więc poza organizację.

    Na serwerze waży to więcej niż gdzie indziej, bo stronę otwiera się
    zwykle na koncie z uprawnieniami administratora, a nie na koncie
    zwykłego użytkownika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę od
    zmiany treści na własnym serwerze do sięgnięcia po składniki systemu
    na cudzej maszynie.
  en: |
    The setting forbids applications started from content fetched from the network to reach the system's
    components.

    The item concerns a boundary that is here crossed by design and not through a fault. A page shown in an
    application's frame may ask for access to the system's components and get it. It need break nothing - it is
    enough that it asks.

    That means that what came from the network and what works on the machine cease to be parted. The page may
    change between one opening and the next, and the change lies on the server's side, not the machine's. The
    hold over what will be carried out passes therefore outside the organisation.

    On a server that weighs more than elsewhere, a page being opened as a rule on an account with an
    administrator's rights and not on an ordinary user's.

    What an attacker gains while the item goes unmet: a road from a change of content on their own server to a
    reaching for the system's components on somebody else's machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy narzędzi
    zbudowanych jako strona w oprawie.

    Zdarza się to częściej, niż wynikałoby z nazwy punktu. Panel
    zarządzania dostarczony przez producenta sprzętu, konsola
    monitorowania, narzędzie do konfiguracji macierzy — wiele z nich to
    strona z ramką wokół, a nie program napisany od zera.

    Jeżeli takie narzędzie sięga do składników systemu, po zmianie
    przestanie. Objaw wygląda jak brak uprawnień: narzędzie się uruchomi,
    pokaże się, a jedna z jego funkcji odmówi. Nie będzie komunikatu
    o zasadzie, więc przyczyna bywa szukana w uprawnieniach konta.

    Sprawdzenie jest proste, jeśli wiadomo, czego szukać: czy któreś
    z narzędzi zarządzania na tej maszynie jest w istocie stroną
    wyświetlaną w oprawie.

    Czego to nie psuje: przeglądarki, stron otwieranych w przeglądarce,
    aplikacji napisanych jako aplikacje, zdalnego zarządzania, usług.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established concerns tools built as a page in a frame.

    That happens oftener than the item's name would suggest. A management panel delivered by a maker of hardware,
    a console for watching, a tool for setting up an array - many of them are a page with a frame about it and
    not a program written from the ground up.

    If such a tool reaches the system's components, after the change it will cease to. The symptom looks like a
    want of permissions: the tool will start, will show itself, and one of its functions will refuse. There will
    be no message about a policy, so the cause is at times looked for in an account's rights.

    The check is a simple one if one knows what to look for: whether any of the management tools on this machine
    is in truth a page shown in a frame.

    What this does not break: the browser, pages opened in the browser, applications written as applications,
    remote management, or services.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzie zarządzania zbudowane jako strona w oprawie przestaje sięgać do składników systemu
      - Objaw wygląda jak brak uprawnień konta, a nie jak ograniczenie zasadą, więc przyczyna bywa szukana nie tam
      - Panel producenta sprzętu i konsola monitorowania bywają zbudowane właśnie tak, mimo wyglądu zwykłego programu
      - Przeglądarka, strony otwierane w przeglądarce i aplikacje napisane jako aplikacje pozostają bez zmian
      - Zdalne zarządzanie, role serwera i usługi systemowe pozostają bez zmian
    en:
      - A management tool built as a page in a frame ceases to reach the system's components
      - The symptom looks like a want of an account's rights rather than a limiting by a policy, so the cause is at times looked for elsewhere
      - A hardware maker's panel and a console for watching are at times built just so, despite looking an ordinary program
      - The browser, pages opened in the browser and applications written as applications stay unchanged
      - Remote management, the server roles and system services stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Narzędzie zarządzania używane na tej maszynie jest stroną w oprawie i sięga do składników systemu
      - Nie ustalono, które z narzędzi zarządzania na tej maszynie są zbudowane jako strona w oprawie
    en:
      - A management tool used on this machine is a page in a frame and reaches the system's components
      - It has not been established which of the management tools on this machine are built as a page in a frame
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry lies in the shell branch, not the policy branch, beside rules
      # of an entirely different subject.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'BlockHostedAppAccessWinRT'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'BlockHostedAppAccessWinRT'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish first whether any tool on this machine works as a page with a
    # frame around it. Such a tool will stop reaching the system and will say
    # so as a want of permissions.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockHostedAppAccessWinRT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/uwp/xaml-platform/

notes:
  pl: |
    Punkt otwiera blok o programach wnoszonych na maszynę: jak wchodzą,
    czego mogą sięgnąć i co je sprawdza po drodze.

    Argument wart postawienia wprost dotyczy tego, gdzie leży kontrola.
    Strona może zmienić się między jednym otwarciem a drugim, a zmiana
    następuje po stronie serwera. Nie jest to więc pytanie o to, czy
    narzędzie jest godne zaufania dzisiaj, tylko o to, czy zaufanie do
    niego ma się odnawiać samo przy każdym otwarciu.

    Rzecz warta zapowiedzenia w interfejsie: objaw wygląda jak brak
    uprawnień konta. Osoba szukająca przyczyny sprawdzi członkostwo
    w grupach, potem zasady lokalne, a zasadę odpowiedzialną znajdzie
    na końcu. Zdanie o tym w opisie oszczędza pół dnia.

    Odnotowuję położenie wpisu. Wartość siedzi w gałęzi powłoki, a nie
    w gałęzi zasad producenta, i sąsiaduje z ustawieniami o zupełnie
    innym przeznaczeniu. Przy ręcznym szukaniu prowadzi to do wniosku,
    że ustawienia nie ma.
  en: |
    The item opens the block about programs brought onto the machine: how they get in, what they may reach and
    what checks them along the way.

    The argument worth setting down outright concerns where the hold lies. The page may change between one opening
    and the next, and the change happens on the server's side. It is therefore no question of whether the tool is
    worthy of trust today, but of whether trust in it is to renew itself at every opening.

    A thing worth announcing in the interface: the symptom looks like a want of an account's rights. A person
    looking for the cause will check membership in groups, then the local policies, and will find the policy
    answerable last. A sentence about that in the description spares half a day.

    Worth noting the entry's place. The value sits in the shell branch and not in the maker's policy branch, and
    neighbours settings of a wholly different purpose. At a searching by hand that leads to the conclusion that
    the setting is not there.
