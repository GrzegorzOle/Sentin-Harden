id: win2016-rdp-rpc-traffic-encrypted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Security
  title:
    pl: Kanał zarządzania pulpitem zdalnym zawsze szyfrowany
    en: The remote desktop management channel always encrypted
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe szyfrować i uwierzytelniać wywołania zdalne kierowane do
    usługi pulpitu zdalnego. Chodzi nie o samą sesję z obrazem ekranu, tylko
    o kanał, którym się tą usługą steruje.

    Rozróżnienie jest tu istotne, bo łatwo ten punkt pomylić z regułami
    o szyfrowaniu sesji. Tamte chronią to, co widzi i wpisuje osoba
    pracująca. Ten chroni polecenia administracyjne: wylistowanie otwartych
    sesji, odłączenie kogoś, przejęcie cudzej sesji, wysłanie komunikatu,
    zamknięcie procesu w sesji. Są to czynności o uprawnieniach wyższych niż
    praca w samej sesji.

    Bez tego wymagania usługa przyjmuje takie wywołania kanałem
    nieszyfrowanym i bez potwierdzenia tożsamości wywołującego. Skutek jest
    dwojaki. Kto obserwuje ruch, widzi, kto na serwerze pracuje i pod jakimi
    sesjami. Kto potrafi ten ruch podmienić, wydaje usłudze polecenia
    zarządzające — a przejęcie cudzej sesji jest poleceniem zarządzającym,
    nie włamaniem do niej.

    Warto powiedzieć wprost, że jest to droga omijająca ekran logowania.
    Napastnik nie uwierzytelnia się do sesji, tylko poleca usłudze zrobić
    coś z sesją już otwartą przez kogoś innego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wgląd w to,
    kto pracuje na serwerze, oraz kanał wydawania usłudze poleceń
    zarządzających sesjami z pominięciem logowania.
  en: |
    The setting has remote calls directed at the remote desktop service encrypted
    and authenticated. What is meant is not the session with the screen picture but
    the channel by which that service is steered.

    The distinction matters here, since this item is easily confused with the rules
    on session encryption. Those guard what the person working sees and types. This
    one guards administrative commands: listing the open sessions, disconnecting
    somebody, taking over another's session, sending a message, closing a process in
    a session. These are acts of higher privilege than work in the session itself.

    Without this demand the service takes such calls over an unencrypted channel and
    with no confirmation of the caller's identity. The upshot is twofold. Whoever
    watches the traffic sees who works on the server and under which sessions.
    Whoever can substitute that traffic issues management commands to the service -
    and taking over another's session is a management command rather than a breaking
    into it.

    Worth saying outright that this is a road going round the sign-in screen. The
    attacker does not authenticate to a session; they instruct the service to do
    something with a session already opened by somebody else.

    What an attacker gains while the item goes unmet: a view of who works on the
    server, and a channel for issuing the service session management commands while
    passing sign-in by.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynach zarządzanych współczesnymi
    narzędziami zmiana przechodzi niezauważona.

    Sprawdzić trzeba, czym ta usługa jest sterowana z zewnątrz. Systemowe
    narzędzia zarządzania sesjami obsługują kanał szyfrowany od wielu wydań
    i nie wymagają niczego. Kłopot dotyczy narzędzi napisanych samodzielnie
    albo dostarczonych z oprogramowaniem starszym niż serwer: skryptów
    wylistowujących sesje własną biblioteką, pulpitów nadzoru pokazujących
    obłożenie maszyn, systemów rozliczających czas pracy w sesjach.

    Objaw jest jednoznaczny i pojawia się od razu: wywołanie zostaje
    odrzucone, a narzędzie zgłasza błąd dostępu. Trudność bywa gdzie indziej
    — w rozpoznaniu, że przyczyną jest ta zmiana, a nie uprawnienia konta,
    bo komunikat wygląda tak samo.

    Czego to nie psuje: samej sesji pulpitu zdalnego, logowania, obrazu
    ekranu, przekierowań, zarządzania maszyną przez powłokę zdalną.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on machines managed with present-day tools
    the change passes unnoticed.

    What has to be checked is what steers this service from outside. The system's
    own session management tools have supported an encrypted channel for many
    releases and call for nothing. The trouble concerns tools written in house or
    supplied with software older than the server: scripts listing sessions with a
    library of their own, monitoring dashboards showing how loaded the machines are,
    systems accounting for time worked in sessions.

    The symptom is unambiguous and appears at once: the call is refused and the tool
    reports an access error. The difficulty is at times elsewhere - in recognising
    that the cause is this change rather than the account's privileges, since the
    message looks the same.

    What this does not break: the remote desktop session itself, signing in, the
    screen picture, the redirections, or managing the machine through a remote
    shell.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Skrypt wylistowujący sesje na tej maszynie własną biblioteką dostaje odmowę dostępu przy wywołaniu
      - Pulpit nadzoru pokazujący obłożenie maszyn przestaje odczytywać liczbę otwartych sesji
      - System rozliczający czas pracy w sesjach traci dostęp do danych, a komunikat wygląda jak brak uprawnień konta
      - Sama sesja pulpitu zdalnego, logowanie, obraz ekranu i przekierowania pozostają bez zmian
    en:
      - A script listing sessions on this machine with a library of its own gets an access refusal on the call
      - A monitoring dashboard showing how loaded the machines are stops reading the number of open sessions
      - A system accounting for time worked in sessions loses access to the data, and the message looks like a lack of account privileges
      - The remote desktop session itself, signing in, the screen picture and the redirections stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Sesjami na tej maszynie steruje narzędzie napisane samodzielnie albo starsze niż serwer i nie sprawdzono, czy obsługuje kanał szyfrowany
      - Rozliczanie czasu pracy albo nadzór nad obłożeniem opiera się na odczycie sesji z zewnątrz i nie ma drogi zastępczej
    en:
      - Sessions on this machine are steered by a tool written in house or older than the server and it has not been checked whether it supports an encrypted channel
      - The accounting of time worked or the watching of load rests on reading sessions from outside and there is no substitute road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fEncryptRPCTraffic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fEncryptRPCTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fEncryptRPCTraffic' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt bywa pomijany, bo jego nazwa mówi o kanale zarządzania, a nie
    o sesji, więc przy czytaniu listy wygląda na rzecz techniczną i drugorzędną.
    Jest odwrotnie: to droga do cudzej sesji z pominięciem ekranu logowania,
    czyli dokładnie to, czego reszta reguł pulpitu zdalnego broni od strony
    frontowej.

    Reguła dopełnia punkty o warstwie zabezpieczeń i poziomie szyfrowania.
    Tamte opisują sesję; ta opisuje sterowanie sesjami. Zamknięcie tamtych
    bez tej zostawia otwarte tylne wejście do tego samego pomieszczenia.

    Objaw w razie kłopotu bywa mylnie przypisywany uprawnieniom konta i to
    jest tu jedyna realna pułapka wdrożeniowa. Aplikacja powinna tę uwagę
    pokazać przy punkcie, bo oszczędza ona godziny szukania przyczyny
    w niewłaściwym miejscu.
  en: |
    The item is at times passed over, since its name speaks of a management channel
    rather than a session, so on reading the list it looks technical and secondary.
    The truth is the reverse: this is a road to another's session passing the
    sign-in screen by, which is exactly what the rest of the remote desktop rules
    guard from the front.

    The rule completes the items on the security layer and the encryption level.
    Those describe the session; this one describes the steering of sessions. Closing
    those without this leaves a back way into the same room open.

    The symptom in case of trouble is at times wrongly ascribed to the account's
    privileges, and that is the one real trap in the rollout here. The application
    should show that remark at the item, since it saves hours of looking for the
    cause in the wrong place.
