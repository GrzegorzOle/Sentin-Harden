id: win10-defender-realtime-protection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Ochrona w czasie rzeczywistym Microsoft Defender włączona
    en: Microsoft Defender real-time protection enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza skanowanie plików i procesów w chwili, w której są
    otwierane, uruchamiane i zapisywane.

    Bez niego ochrona zostaje przy skanowaniu zaplanowanym, czyli przy
    sprawdzaniu tego, co na dysku już leży. Różnica jest różnicą w czasie:
    skanowanie zaplanowane znajduje plik złośliwy po fakcie, a ochrona
    w czasie rzeczywistym — zanim zostanie uruchomiony. Dla
    oprogramowania, które szyfruje pliki albo kradnie poświadczenia, cały
    skutek mieści się między tymi dwoma momentami.

    Jest to również jedyny mechanizm patrzący na to, co nigdy nie trafia
    na dysk. Kod uruchamiany wprost w pamięci nie zostawia pliku do
    zeskanowania, więc skanowanie zaplanowane nie ma czego szukać.

    Sprawdzenie odróżnia trzy stany. Ochrona działa; ochronę przejął inny
    produkt — wtedy punkt nie ma zastosowania; ochrona nie działa i nie
    przejął jej nikt. Ostatni z nich jest odpowiedzią najważniejszą i nie
    wolno go sklejać z żadnym z pozostałych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    własnego kodu bez sprawdzenia, z ryzykiem wykrycia odsuniętym do
    najbliższego skanowania zaplanowanego.
  en: |
    The setting switches on the scanning of files and processes at the hour they are opened, started and
    written.

    Without it the protection is left with the scheduled scan, which is to say with the checking of what already
    lies upon the disk. The difference is a difference in time: a scheduled scan finds a malicious file after the
    fact, and real-time protection - before it is started. For software that enciphers files or steals
    credentials, the whole consequence lies between those two moments.

    It is likewise the one mechanism looking at what never reaches the disk at all. Code started straight in
    memory leaves no file to scan, so a scheduled scan has nothing to seek.

    The check tells three states apart. The protection works; another product took the protection over - then the
    item does not apply; the protection does not work and nobody took it over. The last of them is the weightiest
    answer and must not be glued to either of the rest.

    What an attacker gains while the item goes unmet: the starting of their own code unchecked, with the risk of
    being found pushed off to the nearest scheduled scan.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co na
    tej maszynie pracuje z plikami masowo.

    Skanowanie w chwili dostępu kosztuje czas przy każdym otwarciu pliku.
    W pracy biurowej jest to niezauważalne. Widać je dopiero tam, gdzie
    plików jest dużo i są małe: kompilacja, rozpakowywanie archiwów,
    praca z repozytorium kodu, maszyny wirtualne i kontenery. Różnica sięga
    wtedy kilkudziesięciu procent czasu operacji.

    Właściwą odpowiedzią jest wyłączenie wybranych katalogów ze
    skanowania, a nie wyłączenie ochrony. Odnotowuję jednak, że każde
    wyłączenie katalogu jest miejscem, w którym ochrona nie patrzy — więc
    warto je wskazać wąsko i zapisać, po co powstało.

    Druga rzecz do sprawdzenia to fałszywe trafienia. Oprogramowanie
    narzędziowe własnej roboty bywa przez ochronę zatrzymywane i wtedy
    skutkiem jest program, który przestaje się uruchamiać.

    Czego to nie psuje: otwierania dokumentów, pracy sieciowej, logowania,
    udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is what upon this machine works with files in
    bulk.

    Scanning at the hour of access costs time at every opening of a file. In office work it is unnoticed. It
    shows only where the files are many and small: compiling, the unpacking of archives, work with a code
    repository, virtual machines and containers. The difference reaches then some tens of a hundred of the time
    of the operation.

    The proper answer is the leaving of chosen folders out of the scan, and not the switching off of the
    protection. I set down nonetheless that every left-out folder is a place at which the protection does not
    look - so it is well to name them narrowly and to write down what they came about for.

    The second thing to review is false hits. Tool software of one's own making is at times held back by the
    protection, and the consequence is then a program that ceases to start.

    What this does not break: the opening of documents, work upon the network, logging on, file shares, or
    printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - virtualization-and-containers
    - scripting-and-automation
  what_breaks:
    pl:
      - Kompilacja, rozpakowywanie archiwów i praca z repozytorium kodu zwalniają o kilkadziesiąt procent czasu operacji
      - Maszyny wirtualne i kontenery pracujące z wieloma małymi plikami odczuwają to samo spowolnienie
      - Oprogramowanie narzędziowe własnej roboty bywa zatrzymywane jako fałszywe trafienie i przestaje się uruchamiać
      - Właściwą odpowiedzią jest wyłączenie wąsko wskazanych katalogów, a nie wyłączenie ochrony
      - Otwieranie dokumentów, praca sieciowa, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Compiling, the unpacking of archives and work with a code repository slow by some tens of a hundred of the operation s time
      - Virtual machines and containers working with many small files feel the same slowing
      - Tool software of one s own making is at times held back as a false hit and ceases to start
      - The proper answer is the leaving out of narrowly named folders, and not the switching off of the protection
      - The opening of documents, work upon the network, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ochronę na tej maszynie przejął produkt innego producenta i wtedy punkt nie ma zastosowania
      - Maszyna służy wyłącznie do budowania oprogramowania i skanowanie katalogów roboczych jest wyłączone świadomie
    en:
      - Another maker s product took the protection over upon this machine, and then the item does not apply
      - The machine serves for the building of software alone and the scanning of the working folders is left out knowingly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction Stop
      if ($status.AMRunningMode -eq 'Normal') {
        $preference = Get-MpPreference -ErrorAction Stop
        if ($preference.DisableRealtimeMonitoring) { 'DISABLED' } else { 'ENABLED' }
      } else {
        # Defender stands aside either because another product took over or because
        # somebody switched it off. Those are opposite situations and must not share
        # an answer: only the first one is "not applicable".
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction Stop |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
        if ($others.Count -gt 0) { 'NOT_APPLICABLE' } else { 'NO_PROTECTION' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $preference = Get-MpPreference
    [pscustomobject]@{
      setting = 'DisableRealtimeMonitoring'
      value   = [bool]$preference.DisableRealtimeMonitoring
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change works upon the live preference, not upon a policy value, so it
    # takes effect at once and without a restart.
    Set-MpPreference -DisableRealtimeMonitoring $false

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-MpPreference -DisableRealtimeMonitoring ([bool]$b.value)

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest w tym bloku jedyną zmieniającą ustawienie bieżące zamiast
    wartości zasady. Skutkiem praktycznym jest to, że działa od razu
    i tak samo od razu daje się cofnąć — ale też, że zasada domenowa
    ustawiona inaczej nadpisze ją przy najbliższym odświeżeniu.

    Argument wart postawienia wprost dotyczy odróżnienia trzech stanów
    w sprawdzeniu. Maszyna, na której ochronę przejął inny produkt, i
    maszyna, na której ochrony nie ma wcale, dają w systemie ten sam obraz:
    Defender stoi z boku. Sklejenie ich w jedną odpowiedź pokazywałoby
    maszynę bez żadnej ochrony jako punkt niemający zastosowania — czyli
    jako zieloną.

    Odnotowuję relację z regułą o zakazie wyłączania ochrony wbudowanej.
    Tamta zamyka drogę najkrótszą, ta opisuje mechanizm, który przy tej
    drodze pada pierwszy.
  en: |
    The rule is in this block the only one changing the current preference rather than a policy value. The
    practical consequence is that it works at once and just as at once may be undone - but likewise that a domain
    policy set otherwise will write over it at the nearest refreshing.

    The argument worth putting outright touches the telling apart of three states in the check. A machine upon
    which another product took the protection over, and a machine upon which there is no protection at all, give
    in the system the same picture: Defender stands aside. The gluing of them into one answer would show a
    machine with no protection whatever as an item that does not apply - which is to say as a green one.

    I set down the tie to the rule forbidding the switching off of the built-in protection. That one closes the
    shortest road; this describes the mechanism that falls first upon that road.
