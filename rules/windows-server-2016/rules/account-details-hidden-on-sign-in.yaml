id: win2016-account-details-hidden-on-sign-in

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Dane konta ukryte na ekranie logowania
    en: Account details hidden on the sign-in screen
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania ekranowi logowania pokazywać dane konta — nazwę
    wyświetlaną i adres powiązany z kontem — obok pola na hasło.

    Jest to trzecia i ostatnia zasłona na tym ekranie. Dwie poprzednie
    dotyczyły list kont; ta dotyczy szczegółów konta, które akurat jest
    wskazane, zwykle tego, które logowało się ostatnio.

    Różnica jest istotna. Lista mówi, jakie konta istnieją. Dane konta
    mówią, kto ostatnio był przy tej maszynie i jak dokładnie brzmi jego
    tożsamość — łącznie z postacią używaną poza tą maszyną.

    Na serwerze ma to jedno konkretne zastosowanie. Ekran konsoli bywa
    dostępny przez zarządzanie sprzętem, a to zarządzanie bywa osiągalne
    z sieci i bywa chronione słabiej niż sam system. Spojrzenie na ten
    ekran mówi wtedy, jakim kontem administruje się tę maszynę.

    Waga jest niewielka i kategoria niska opisuje to uczciwie. Punkt nie
    zamyka drogi, tylko odbiera rozpoznanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwę
    i tożsamość konta ostatnio używanego do zalogowania się na tę maszynę,
    odczytane z samego ekranu.
  en: |
    The setting forbids the sign-in screen to show an account's details - the displayed
    name and the address bound to the account - beside the field for the password.

    It is the third and last curtain on that screen. The two before it concerned lists
    of accounts; this one concerns the details of the account currently named, as a
    rule the one that last signed in.

    The difference matters. A list says what accounts exist. An account's details say
    who was last at this machine and how exactly their identity reads - the form used
    beyond this machine included.

    On a server that has one particular use. The console screen is at times reachable
    through hardware management, and that management is at times reachable from the
    network and guarded more weakly than the system itself. A glance at that screen then
    says by what account this machine is administered.

    The weight is slight and the low category states it honestly. The item shuts no
    road, it takes away a recognition.

    What an attacker gains while the item goes unmet: the name and identity of the
    account last used to sign in to this machine, read from the screen alone.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Punkt dotyczy wyłącznie wyglądu ekranu logowania. Logowanie działa tak
    jak dotąd, z tą różnicą, że nazwę konta trzeba wpisać, a nie zastać
    wpisaną.

    Jest to jedyny skutek i w praktyce sprowadza się do kilku sekund przy
    każdym logowaniu na konsoli. Na serwerze bez sesji interaktywnych nie
    widać go wcale.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.

    Czego to nie psuje: logowania, usług, sieci, pracy użytkowników,
    sesji zdalnych. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    The item concerns only the sign-in screen's look. Signing in works as before, save
    that the account's name has to be typed rather than found already typed.

    That is the one consequence and in practice it comes down to a few seconds at each
    sign-in at the console. On a server with no interactive sessions it is not seen at
    all.

    No restart, sign-out or stopping of a service goes with it.

    What this does not break: signing in, services, the network, users' work, or remote
    sessions. There are no known regressions.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Nazwę konta trzeba przy logowaniu wpisać, a nie zastać wpisaną, co kosztuje kilka sekund
      - Na serwerze bez sesji interaktywnych skutku nie widać wcale
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
      - Logowanie, usługi, sesje zdalne i praca użytkowników pozostają bez zmian
    en:
      - The account name has to be typed at signing in rather than found already typed, which costs a few seconds
      - On a server with no interactive sessions the consequence is not seen at all
      - No restart, no sign-out, no stopping of a service
      - Signing in, services, remote sessions and users' work stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana z konsoli przez osoby, które nie znają pełnej postaci nazwy swojego konta
    en:
      - The machine is attended at the console by people who do not know the full form of their account's name
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'BlockUserFromShowingAccountDetailsOnSignin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'BlockUserFromShowingAccountDetailsOnSignin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockUserFromShowingAccountDetailsOnSignin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Punkt domyka trójkę o ekranie logowania. Warto pokazywać je jako jedno
    zadanie, a nie trzy — koszt każdej z nich jest zerowy, a wartość leży
    w tym, że działają razem.

    Zastosowanie na serwerze warto nazwać konkretnie, bo inaczej punkt
    wygląda na przeniesiony ze stanowiska roboczego. Konkretem jest ekran
    konsoli dostępny przez zarządzanie sprzętem: jest to jedyne miejsce,
    w którym ktoś niepowołany realnie ogląda ekran logowania serwera.

    Kategoria niska jest tu szczera i zgodna z sąsiadem. Punkt odbiera
    rozpoznanie, nie zamyka drogi. Wdraża się go dlatego, że nic nie
    kosztuje, a nie dlatego, że coś odpiera.
  en: |
    The item shuts the three about the sign-in screen. They are worth showing as one
    task rather than three - the cost of each is nil, and the worth lies in their
    working together.

    The use on a server is worth naming particularly, since otherwise the item looks
    carried over from a workstation. The particular is the console screen reachable
    through hardware management: it is the one place where somebody unentitled really
    looks at a server's sign-in screen.

    The low category is honest here and of a piece with its neighbour. The item takes
    away a recognition, it shuts no road. It is rolled out because it costs nothing,
    not because it turns something away.
