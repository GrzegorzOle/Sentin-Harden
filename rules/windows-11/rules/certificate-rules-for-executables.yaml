id: win11-certificate-rules-for-executables

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Reguły oparte o certyfikat stosowane do plików wykonywalnych
    en: Rules resting on a certificate applied to executable files
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm ograniczania uruchamianego oprogramowania rozpoznaje
    programy na kilka sposobów: po ścieżce, po skrócie treści pliku, po strefie
    pochodzenia i po certyfikacie, którym plik jest podpisany. Ten ostatni
    sposób jest domyślnie wyłączony.

    Wyłączenie ma poważne następstwo. Reguła napisana tak, by dopuszczać
    programy określonego wydawcy, nie zostaje odrzucona ani zgłoszona jako
    błąd — zostaje po prostu pominięta. Administrator widzi regułę na liście,
    uważa, że działa, a mechanizm rozstrzyga o pliku wyłącznie po ścieżce.
    Zabezpieczenie, o którym wiadomo, że go nie ma, jest mniej groźne niż takie,
    o którym się myśli, że jest.

    Różnica między jednym a drugim sposobem rozpoznania jest zasadnicza.
    Ścieżkę da się podrobić: wystarczy umieścić plik tam, gdzie reguła go
    przepuszcza. Certyfikatu nie — plik podpisany przez wskazanego wydawcę
    pochodzi od niego, a każda zmiana treści unieważnia podpis.

    Punkt włącza rozpoznawanie po certyfikacie. Reguły pisane po wydawcy
    zaczynają obowiązywać tak, jak zostały pomyślane.
  en: |
    The older mechanism for limiting which software runs recognises programs in
    several ways: by path, by a digest of the file's content, by the zone it came from
    and by the certificate the file is signed with. That last way is off by default.

    Being off has a grave consequence. A rule written to admit a given vendor's
    programs is neither refused nor reported as an error - it is simply passed over.
    The administrator sees the rule in the list, believes it works, and the mechanism
    settles the file's fate by path alone. A safeguard known to be absent is less
    dangerous than one believed to be present.

    The difference between the two ways of recognising is fundamental. A path can be
    forged: placing the file where the rule lets it through is enough. A certificate
    cannot - a file signed by the named vendor comes from them, and any change to the
    content voids the signature.

    The item switches recognition by certificate on. Rules written by vendor start
    holding as they were meant to.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy mechanizm ograniczania oprogramowania jest na tej
    maszynie w ogóle używany.

    Jeżeli nie jest — a na większości stanowisk nie jest — zmiana nie robi nic.
    Punkt włącza sposób rozpoznawania dla reguł, których nie ma. Jest to
    zgodność bez skutku i tak należy ją czytać.

    Jeżeli mechanizm jest używany, skutki są dwa. Pierwszy: reguły pisane po
    wydawcy zaczynają obowiązywać. Brzmi to niegroźnie, ale znaczy, że
    dotychczasowe zachowanie maszyny się zmienia — reguła zakazująca czegoś po
    wydawcy zacznie blokować, a nie była brana pod uwagę.

    Drugi to koszt czasu. Sprawdzenie podpisu przy uruchomieniu wymaga
    odczytania pliku i sprawdzenia łańcucha certyfikatów, czasem z odpytaniem
    listy unieważnień przez sieć. Na maszynie bez dostępu do sieci albo
    z wolnym połączeniem uruchamianie programów bywa wtedy wyraźnie wolniejsze,
    a przy niedostępnym sprawdzeniu unieważnień — opóźnione o czas oczekiwania.

    Nie ma restartu, ale skutek dotyczy programów uruchamianych po zmianie.
  en: |
    What needs checking is whether the software restriction mechanism is used on this
    machine at all.

    If it is not - and at most stations it is not - the change does nothing. The item
    switches on a way of recognising for rules that do not exist. It is compliance
    with no effect, and that is how it should be read.

    If the mechanism is used, there are two effects. The first: rules written by
    vendor start holding. That sounds harmless, but it means the machine's behaviour
    changes - a rule forbidding something by vendor will start blocking where it was
    not taken into account.

    The second is a cost in time. Checking a signature at start takes reading the file
    and checking the chain of certificates, sometimes with a query for the revocation
    list over the network. On a machine with no network access or a slow connection,
    starting programs can then be noticeably slower, and where the revocation check is
    unreachable, delayed by the waiting time.

    There is no restart, but the effect concerns programs started after the change.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - encryption-and-tls
  what_breaks:
    pl:
      - Reguły ograniczania oprogramowania pisane po wydawcy zaczynają obowiązywać i mogą blokować
      - Uruchamianie programów bywa wolniejsze, bo podpis jest sprawdzany za każdym razem
      - Na maszynie bez dostępu do sieci sprawdzanie listy unieważnień wydłuża start programu
      - Tam, gdzie mechanizm ograniczania nie jest używany, nie zmienia się nic
    en:
      - Software restriction rules written by vendor start holding and may block
      - Starting programs can be slower, because the signature is checked every time
      - On a machine with no network access the revocation list check lengthens a program's start
      - Where the restriction mechanism is not used, nothing changes
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Mechanizm ograniczania oprogramowania jest używany, a reguł po wydawcy nikt nie przejrzał
      - Maszyna pracuje bez dostępu do sieci i sprawdzenie unieważnień kończy się oczekiwaniem
    en:
      - The software restriction mechanism is in use and nobody has reviewed the rules by vendor
      - The machine works with no network access and the revocation check ends in waiting
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
      $name = 'AuthenticodeEnabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
    $name = 'AuthenticodeEnabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Safer\CodeIdentifiers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AuthenticodeEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-settings-use-certificate-rules-on-windows-executables-for-software-restriction-policies

notes:
  pl: |
    Punkt dotyczy starszego mechanizmu ograniczania oprogramowania, a nie
    nowszych rozwiązań tego rodzaju. Te ostatnie mają własne sposoby
    rozpoznawania po wydawcy, włączone niezależnie, i ten wpis ich nie dotyczy.
    Maszyna korzystająca wyłącznie z nowszego mechanizmu spełnia ten punkt
    formalnie, bez żadnej zmiany w zachowaniu.

    Wycofanie nie usuwa gałęzi, choć należy ona do samego mechanizmu
    ograniczania. Gałąź ta przechowuje także reguły — jej usunięcie
    skasowałoby konfigurację, której punkt nie dotyczy, i byłoby skutkiem
    znacznie poważniejszym niż cofnięcie tej jednej zmiany.

    Sprawdzanie podpisu przy każdym uruchomieniu jest kosztem trwałym, a nie
    jednorazowym. Na maszynach, na których mechanizm ograniczania faktycznie
    pracuje, warto to zmierzyć, zanim punkt zostanie wdrożony szeroko.
  en: |
    The item concerns the older software restriction mechanism, not the newer
    solutions of that kind. Those have ways of their own of recognising by vendor,
    switched on independently, and this entry does not touch them. A machine using the
    newer mechanism alone meets this item in form, with no change in behaviour at all.

    Rollback does not remove the key, even though it belongs to the restriction
    mechanism itself. The key also holds the rules - removing it would wipe a
    configuration the item does not concern, and would be a far graver effect than
    undoing this one change.

    Checking a signature at every start is a lasting cost rather than a one-off. On
    machines where the restriction mechanism really works it is worth measuring before
    the item is applied widely.
