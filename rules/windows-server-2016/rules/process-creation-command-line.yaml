id: win2016-process-creation-command-line

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Audit Process Creation
  title:
    pl: Wiersz polecenia zapisywany w zdarzeniach utworzenia procesu
    en: The command line written into events of a process being made
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie dopisuje do zdarzenia o utworzeniu procesu pełny wiersz
    polecenia, którym ten proces został uruchomiony.

    Bez tego dopisku zdarzenie mówi, że uruchomiono plik wykonywalny
    o wskazanej ścieżce — i nic ponadto. Przy plikach jednoznacznych
    wystarcza to w zupełności. Przy interpreterach nie wystarcza wcale.

    Uruchomienie powłoki wygląda w dzienniku zawsze tak samo, niezależnie
    od tego, czy ktoś sprawdził wersję systemu, czy pobrał i wykonał kod
    z sieci. Cała treść działania siedzi w parametrach, a parametrów
    w zdarzeniu nie ma.

    To samo dotyczy interpretera poleceń, narzędzi uruchamiających zadania
    i wszystkiego, co przyjmuje polecenie jako argument. Dziennik bez
    wiersza polecenia mówi, że coś się uruchomiło, ale nie mówi, co zrobiło.

    Punkt jest przy tym szerszy niż reguły o powłoce, bo obejmuje każdy
    proces, a nie jedno środowisko. Zapis bloków skryptu widzi to, co
    wykonała powłoka; ten punkt widzi, co zostało uruchomione w ogóle.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    dowolnej czynności przez interpreter przy zdarzeniu w dzienniku
    nieodróżnialnym od zwykłej pracy administratora.
  en: |
    The setting adds to the event about a process being made the full command line
    that process was started by.

    Without that addition the event says an executable of a named path was started -
    and nothing beyond. With unambiguous files that is quite enough. With
    interpreters it is not enough at all.

    The starting of the shell looks the same in the log every time, whether somebody
    checked the system's version or fetched code from the network and ran it. The
    whole substance of the act sits in the parameters, and the parameters are not in
    the event.

    The same holds for the command interpreter, for tools starting tasks, and for
    everything taking a command as an argument. A log without the command line says
    something was started but does not say what it did.

    The item is besides wider than the rules about the shell, covering every process
    rather than one environment. The recording of script blocks sees what the shell
    ran; this item sees what was started at all.

    What an attacker gains while the item goes unmet: the carrying out of any act at
    all through an interpreter, at an event in the log indistinguishable from an
    administrator's ordinary work.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a przyczyna jest ta sama co przy
    zapisie bloków skryptu, tylko o rząd większa.

    Wiersz polecenia trafia do dziennika w postaci, w jakiej został podany.
    Jeżeli cokolwiek na tej maszynie uruchamia się z hasłem w parametrze —
    stare narzędzie kopii zapasowych, skrypt łączący się z bazą, zadanie
    cykliczne z podanym kontem — hasło to wyląduje w dzienniku zabezpieczeń
    czytelnie.

    Dziennik zabezpieczeń bywa przy tym zbierany do systemu nadzoru,
    przechowywany dłużej niż cokolwiek innego i dostępny osobom, które do
    skryptu dostępu nie mają. Punkt potrafi więc rozesłać hasło szerzej,
    niż istniało dotąd. Uwaga o przejrzeniu tego przed wykonaniem siedzi
    w poleceniu naprawczym.

    Rzecz druga to objętość. Zdarzeń utworzenia procesu jest na serwerze
    bardzo wiele, a dopisanie wiersza polecenia powiększa każde z nich.
    Dziennik o rozmiarze dobranym wcześniej zacznie się nadpisywać
    szybciej.

    Rzecz trzecia: punkt działa tylko wtedy, gdy samo rejestrowanie
    utworzenia procesu jest włączone w zasadach audytu. Bez tego wpis nie
    robi nic, a raport pokazuje zgodność.

    Czego to nie psuje: działania procesów, usług, logowania, skryptów.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and the cause is the same as at the
    recording of script blocks, only an order larger.

    The command line reaches the log in the form it was given. If anything on this
    machine starts with a password in a parameter - an old backup tool, a script
    connecting to a database, a recurring task with an account named - that password
    will land readably in the security log.

    The security log is besides at times gathered into a monitoring system, kept
    longer than anything else, and open to people with no access to the script. The
    item can therefore spread a password more widely than it existed before. The
    remark about going over this before execution sits in the remedial command.

    The second thing is volume. Events of a process being made are very many on a
    server, and adding the command line enlarges every one of them. A log of a size
    chosen beforehand will begin overwriting itself sooner.

    The third thing: the item works only where the recording of process creation is
    itself switched on in the audit policy. Without that the entry does nothing
    while the report shows compliance.

    What this does not break: the working of processes, services, signing in, or
    scripts.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Hasło podane w parametrze przy uruchomieniu procesu ląduje w dzienniku zabezpieczeń czytelnie i trafia tam, gdzie dziennik jest zbierany
      - Dziennik zabezpieczeń bywa dostępny osobom, które do skryptu dostępu nie mają, więc punkt rozsyła hasło szerzej niż istniało dotąd
      - Zdarzeń utworzenia procesu jest bardzo wiele, a każde rośnie, więc dziennik zacznie nadpisywać się szybciej
      - Punkt nie robi nic, gdy samo rejestrowanie utworzenia procesu nie jest włączone w zasadach audytu
    en:
      - A password given in a parameter at a process being started lands readably in the security log and goes wherever that log is gathered
      - The security log is at times open to people with no access to the script, so the item spreads a password more widely than it existed before
      - Events of a process being made are very many and each grows, so the log will begin overwriting itself sooner
      - The item does nothing where the recording of process creation is not itself switched on in the audit policy
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie uruchamiają się zadania z hasłem podanym w parametrze i nie da się ich poprawić przed wdrożeniem
      - Dziennik zabezpieczeń ma rozmiar dobrany bez uwzględnienia tego zapisu i nie ma miejsca na jego powiększenie
      - Dziennik zabezpieczeń tej maszyny jest dostępny szerszemu gronu niż osoby uprawnione do poświadczeń, które by w nim wylądowały
    en:
      - Tasks with a password given in a parameter start on the machine and cannot be mended before the rollout
      - The security log has a size chosen without this recording in mind and there is no room to enlarge it
      - This machine's security log is open to a wider circle than those entitled to the credentials that would land in it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
      $name = 'ProcessCreationIncludeCmdLine_Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
    $name = 'ProcessCreationIncludeCmdLine_Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The line goes into the log as it was given, passwords passed as parameters
    # included. Go over what starts on this machine with a password on the line
    # before this is applied.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ProcessCreationIncludeCmdLine_Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688

notes:
  pl: |
    Punkt jest w bloku najszerszy, bo obejmuje każdy proces, a nie jedno
    środowisko. Warto to pokazać, bo w zestawieniu z regułami o powłoce
    wygląda na powtórzenie, a nie jest — powłoka jest jednym z wielu
    interpreterów.

    Zależność od zasad audytu jest tu treścią, nie szczegółem. Wpis sam
    w sobie nie włącza rejestrowania utworzenia procesu, tylko rozszerza
    zdarzenie, które i tak ma powstać. Zgodność przy wyłączonym
    rejestrowaniu jest zgodnością pustą i aplikacja powinna to wychwytywać.

    Ryzyko wycieku poświadczeń przez dziennik pojawia się w tym bloku po
    raz drugi i warto, żeby aplikacja pokazała oba punkty razem. Są to
    jedyne dwa miejsca w całym zestawie, w których utwardzenie potrafi
    rozszerzyć dostęp do haseł, i wspólna dla nich odpowiedź jest ta sama:
    przejrzeć, co się uruchamia z hasłem w wierszu, zanim zapis zostanie
    włączony.
  en: |
    The item is the widest in the block, covering every process rather than one
    environment. That is worth showing, since set beside the rules about the shell
    it looks like a repetition and is not - the shell is one interpreter among many.

    The bearing of the audit policy is substance here rather than a detail. The
    entry does not by itself switch on the recording of process creation but widens
    an event that is to come about anyway. Compliance with the recording switched
    off is an empty compliance, and the application should catch that.

    The risk of credentials leaking through the log appears in this block a second
    time, and the application had better show both items together. They are the only
    two places in the whole set where hardening can widen access to passwords, and
    the answer common to them is the same: go over what starts with a password on
    the line before the recording is switched on.
