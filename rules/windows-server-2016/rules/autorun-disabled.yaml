id: win2016-autorun-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Autoodtwarzanie wyłączone dla wszystkich rodzajów napędów
    en: Automatic playing switched off for every kind of drive
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza autoodtwarzanie dla wszystkich rodzajów napędów.

    Autoodtwarzanie jest mechanizmem, w którym samo pojawienie się nośnika
    wystarcza, żeby system zaczął coś robić z jego zawartością. Czyta
    nośnik, rozpoznaje, co na nim leży, i proponuje — albo wykonuje —
    działanie.

    Trzy rzeczy dzieją się tu bez decyzji człowieka i każda jest osobnym
    problemem. Po pierwsze, nośnik zostaje odczytany, więc jego zawartość
    trafia do systemu zanim ktokolwiek się nad nią zastanowił. Po drugie,
    system próbuje rozpoznać typ zawartości, a rozpoznawanie typu
    historycznie bywało miejscem, w którym plik spreparowany doprowadzał
    do wykonania kodu. Po trzecie, powstaje propozycja działania, którą
    łatwo zatwierdzić odruchowo.

    Na serwerze nie ma nikogo, kto siedziałby przed ekranem i tę propozycję
    zobaczył — i właśnie dlatego punkt jest tu łatwy. Mechanizm nie wnosi
    niczego, czego ktokolwiek by tu używał, a zostawia otwartą drogę
    uruchamianą samym podłączeniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sytuację,
    w której podłączenie nośnika wystarcza, by system sam sięgnął po jego
    zawartość, bez żadnej decyzji po drugiej stronie.
  en: |
    The setting switches automatic playing off for every kind of drive.

    Automatic playing is a mechanism where the mere appearance of a medium is enough
    for the system to begin doing something with its contents. It reads the medium,
    recognises what lies on it, and proposes - or carries out - an action.

    Three things happen here without a person deciding, and each is a separate
    trouble. First, the medium is read, so its contents reach the system before
    anybody has thought about them. Second, the system tries to recognise the type
    of the contents, and the recognising of a type has historically been a place
    where a contrived file led to code being run. Third, a proposed action appears,
    easy to approve out of habit.

    On a server there is nobody sitting before a screen to see that proposal - and
    just for that reason the item is easy here. The mechanism brings nothing anybody
    here would use, and leaves open a road set going by the plugging in alone.

    What an attacker gains while the item goes unmet: a state of affairs where
    plugging a medium in suffices for the system to reach for its contents by
    itself, with no decision on the other side.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze jest to ocena pewna.

    Autoodtwarzanie ma sens tam, gdzie ktoś wkłada płytę albo podłącza
    aparat i chce, żeby system sam zaproponował, co z tym zrobić. Na
    serwerze nikt tego nie robi, a jeśli już podłącza nośnik, to po to, żeby
    sięgnąć po konkretny plik — i sięga po niego sam.

    Warto powiedzieć wprost, czego ten punkt nie odbiera, bo bywa mylony
    z blokadą nośników. Nośnik nadal się podłącza, nadal dostaje literę
    napędu, nadal daje się otworzyć i skopiować z niego pliki. Zmienia się
    tylko to, że system sam z siebie nic z nim nie robi.

    Jedyny scenariusz wart odnotowania dotyczy instalowania
    oprogramowania z nośnika. Wcześniej instalator uruchamiał się sam po
    włożeniu płyty; teraz trzeba uruchomić go z katalogu. Jest to różnica
    jednego kliknięcia i nie stanowi przeszkody.

    Czego to nie psuje: dostępu do nośników, kopiowania plików, liter
    napędów, montowania obrazów, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", and on a server that judgement is a sure one.

    Automatic playing makes sense where somebody puts in a disc or plugs in a camera
    and wants the system to propose by itself what to do with it. On a server nobody
    does that, and if a medium is plugged in at all it is to reach for a particular
    file - and they reach for it themselves.

    It is worth saying outright what the item does not take away, being at times
    confused with a block on media. The medium still attaches, still gets a drive
    letter, can still be opened and files copied off it. All that changes is that
    the system does nothing with it of its own accord.

    The one scenario worth noting concerns installing software from a medium.
    Before, the installer started by itself on the disc being put in; now it has to
    be started from the directory. That is a difference of one click and stands in
    nobody's way.

    What this does not break: access to media, the copying of files, drive letters,
    the mounting of images, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - removable-media
    - user-interface
    - drivers-and-devices
  what_breaks:
    pl:
      - Instalator nie uruchamia się sam po włożeniu płyty i trzeba uruchomić go z katalogu nośnika
      - Okno z propozycją działania przestaje pojawiać się po podłączeniu nośnika
      - Nośnik nadal się podłącza, dostaje literę napędu i daje się z niego kopiować pliki
      - Montowanie obrazów, usługi i logowanie pozostają bez zmian
    en:
      - An installer no longer starts by itself on a disc being put in and has to be started from the medium's directory
      - The window proposing an action stops appearing once a medium is plugged in
      - The medium still attaches, gets a drive letter and files can still be copied off it
      - The mounting of images, services and signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje stanowisko obsługiwane ręcznie, na którym obsługa opiera się na oknie propozycji po włożeniu nośnika
    en:
      - A position worked by hand runs on the machine, where the handling rests on the proposal window after a medium is put in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'NoDriveTypeAutoRun'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '255'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoDriveTypeAutoRun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoDriveTypeAutoRun' -Value 255 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-autoplay

notes:
  pl: |
    Punkt otwiera blok o tym, co maszyna robi sama, gdy coś zostaje do niej
    podłączone. Trzy pierwsze reguły bloku dotyczą zachowania systemu wobec
    nośnika już przyjętego; trzy kolejne — tego, czy w ogóle wolno go przyjąć.

    Reguła ta bywa uznawana za wystarczającą i nie jest. Zamyka drogę
    widoczną, czyli okno propozycji, a zostawia otwartą drogę cichą, czyli
    polecenie zapisane w pliku startowym nośnika. Zamyka ją dopiero reguła
    następna i obie trzeba wdrożyć razem, żeby mówić o zamknięciu tematu.

    Wartość wymagana obejmuje wszystkie rodzaje napędów, łącznie z sieciowymi
    i nieznanymi. Wariant częściowy, ograniczony do nośników wymiennych,
    zostawia drogę przez zamontowany udział sieciowy — a to jest droga
    dostępna zdalnie, więc groźniejsza od tej przez nośnik wymienny.
  en: |
    The item opens a block about what the machine does by itself once something is
    plugged into it. The block's first three rules concern the system's behaviour
    towards a medium already taken in; the next three concern whether it may be
    taken in at all.

    The rule is at times reckoned sufficient and is not. It shuts the visible road,
    namely the proposal window, and leaves open the quiet one, namely the command
    written in the medium's startup file. Only the next rule shuts that, and both
    have to be rolled out together to speak of the matter as closed.

    The required value covers every kind of drive, network and unknown ones among
    them. The partial variant, held to removable media, leaves the road through a
    mounted network share - and that road is reachable remotely, so more dangerous
    than the one through removable media.
