id: win2025-simple-tcpip-services-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Proste usługi diagnostyczne protokołu sieciowego wyłączone
    en: The simple diagnostic services of the network protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza zestaw prostych usług diagnostycznych protokołu
    sieciowego: odsyłanie otrzymanych danych, wysyłanie strumienia
    znaków, podawanie czasu i kilku innych rzeczy pochodzących z czasów,
    gdy sieci dopiero się sprawdzało.

    Zostawiam kategorię wysoką, choć usługi te niczego nie udostępniają
    i nie dają dostępu do maszyny. Wartość dla napastnika leży w czymś
    innym i jest konkretna: odpowiadają one na pytanie każdemu, kto je
    zada, a odpowiedź bywa znacznie większa od pytania. Strumień znaków
    odpowiada bez końca, odsyłanie danych odpowiada dokładnie tym, co
    dostało, i żadna z tych usług nie sprawdza, czy pytający jest tym,
    za kogo się podaje.

    Na serwerze waży to bardziej niż na stacji roboczej z powodu
    zupełnie przyziemnego: serwer stoi na grubszym łączu. Maszyna, która
    odpowiada bez ograniczeń i ma czym odpowiadać, jest wzmacniaczem
    lepszym niż maszyna, która ma cienkie łącze.

    Rzecz warto powiedzieć wprost także dlatego, że to jeden z nielicznych
    punktów, przy których szkoda nie dotyczy właściciela maszyny. Serwer
    użyty w ten sposób działa dalej bez zarzutu; kłopot ma ten, do kogo
    idą odpowiedzi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę
    na grubym łączu, która odpowie każdemu i odpowie więcej, niż została
    zapytana.
  en: |
    The item switches off a set of simple services of the looking over of the reckoning of the net -
    the sending back of data taken in, the sending of a stream of marks, the giving of the time and
    some other things coming of days when nets were but being tried out.

    I leave the category high, though those services deal nothing out and give no reach to the
    machine. The worth to an attacker lies elsewhere and is a set thing - they answer an asking to
    whoever puts it, and the answer is at times far greater than the asking. A stream of marks answers
    without end, the sending back of data answers with just what it was given, and none of those
    services looks to whether the asker be who they give themselves out to be.

    Upon a server that weighs more than upon a workstation of a wholly earthly ground - a server
    stands upon a thicker link. A machine that answers without bound and has wherewith to answer is a
    better strengthener than a machine upon a thin link.

    The thing is worth saying plainly also because it is one of the few items whereat the harm falls
    not upon the machine's owner. A server used in that way works on without fault; the trouble is had
    by the one the answers go to.

    What an attacker gains while the item goes unmet - a machine upon a thick link that will answer
    everyone and will answer more than it was asked.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i chcę pokazać, że nie jest to
    obniżenie na skróty, bo w tej samej paczce trzymałem klasę wyżej
    przy usługach, które robiły mniej.

    Kryterium jest to samo, co wszędzie: czy umiem wskazać scenariusz,
    w którym ktoś na tym ucierpi. Jedyny, jaki umiem wskazać, to bardzo
    stary skrypt sprawdzający dostępność maszyny przez odesłanie danych
    zamiast przez zwykłe zapytanie. I tu właśnie różnica: taki skrypt
    zgłasza niepowodzenie natychmiast, głośno i wskazuje maszynę, której
    dotyczy. Jest to ten sam argument, którym uzasadniłem niższą klasę
    przy zarządzaniu siecią starszym protokołem — skutek głośny jest
    skutkiem bezpiecznym, bo widać go od razu i wiadomo, skąd się wziął.

    Poza tym jednym przypadkiem nic z tych usług nie korzysta. Nie ma
    aplikacji zbudowanej na strumieniu znaków ani roli serwera opartej
    na podawaniu czasu tym protokołem. Składnik ten jest opcjonalny
    i na większości maszyn nie został nawet dodany — wtedy punkt wypada
    jako niedotyczący.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease" and would show that it is no lowering by a short road, in this
    same pack I having held the class higher at services that did less.

    The settling mark is the same as everywhere - whether I can name a happening wherein somebody will
    suffer thereby. The only one I can name is a very old writ that looks to a machine's being there
    by a sending back of data in the stead of a common asking. And here is the difference - such a
    writ gives word of its failure at once, loudly, and points at the machine it bears on. It is the
    same standing whereby I stood by the lower class at the ruling of the net by an older reckoning -
    a loud outcome is a safe outcome, it being seen straightway and its ground being known.

    Beyond that one case nothing draws upon those services. There is no application built upon a
    stream of marks, nor a role of a server resting upon the giving of the time by that reckoning.
    That piece is an optional one and upon most machines was never even added - and then the item
    falls out as one that bears not.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Bardzo stary skrypt sprawdzający dostępność maszyny przez odesłanie danych przestaje działać
      - Skrypt taki zgłasza niepowodzenie natychmiast i wskazuje maszynę, której dotyczy
      - Poza tym jednym przypadkiem nic z tych usług nie korzysta
      - Składnik jest opcjonalny i na większości maszyn nie został dodany, więc punkt bywa niedotyczący
    en:
      - A very old writ that looks to a machine's being there by a sending back of data stops working
      - Such a writ gives word of its failure at once and points at the machine it bears on
      - Beyond that one case nothing draws upon those services
      - The piece is optional and upon most machines was never added, so the item at times bears not
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Dostępność maszyny sprawdzana jest skryptem korzystającym z odsyłania danych tym protokołem
    en:
      - The machine's being there is looked to by a writ that draws upon the sending back of data by that reckoning
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # This service comes from an optional component. Where the component was
        # never added, a bare key without a startup value is left behind - that
        # is an absent service, not an unreadable one.
        if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Nothing on a server is built on these. The harm they do falls on whoever
    # the answers are aimed at, not on the owner of this machine - which is why
    # it keeps working perfectly while being used.
    Stop-Service -Name 'simptcp' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'simptcp' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'simptcp' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/simple-tcpip-services

notes:
  pl: |
    Kategoria wysoka, choć usługi te nie dają dostępu do maszyny.
    Odpowiadają każdemu, kto zapyta, a odpowiedź bywa znacznie większa
    od pytania — strumień znaków odpowiada bez końca.

    Na serwerze waży to bardziej z powodu przyziemnego: serwer stoi na
    grubszym łączu, więc jest lepszym wzmacniaczem.

    Jeden z nielicznych punktów, przy których szkoda nie dotyczy
    właściciela maszyny. Serwer użyty w ten sposób działa dalej bez
    zarzutu; kłopot ma ten, do kogo idą odpowiedzi.

    Klasa obniżona tym samym argumentem, co przy zarządzaniu siecią
    starszym protokołem: skutek głośny jest skutkiem bezpiecznym.
  en: |
    The category is high, though those services give no reach to the machine. They answer everyone who
    asks, and the answer is at times far greater than the asking - a stream of marks answers without
    end.

    Upon a server that weighs the more of an earthly ground - a server stands upon a thicker link, so
    it is the better strengthener.

    One of the few items whereat the harm falls not upon the machine's owner. A server used in that
    way works on without fault; the trouble is had by the one the answers go to.

    The class is lowered by the same standing as at the ruling of the net by an older reckoning - a
    loud outcome is a safe outcome.
