id: iis-pct-1-0-disabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Transport Encryption
  title:
    pl: Protokół PCT 1.0 wyłączony
    en: The PCT 1.0 protocol switched off

  level: 1
  profile: application

platform:
  system: iis

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    PCT był konkurencyjną propozycją wobec SSL, opracowaną w czasach, gdy nie
    było jeszcze jasne, który sposób szyfrowania ruchu przyjmie się jako
    standard. Przyjął się SSL, a po nim TLS. PCT nie doczekał się drugiej
    wersji i nie był rozwijany od lat dziewięćdziesiątych.

    Co to odbiera atakującemu: jedną z dróg zejścia do protokołu, którego
    nikt nie analizuje. Sam fakt, że serwer ogłasza obsługę takiego protokołu,
    daje osobie na trasie połączenia okazję do wymuszenia go zamiast tego,
    który obie strony potrafią zestawić poprawnie. Protokół, w którym od
    trzydziestu lat nikt nie szuka błędów, nie jest bezpieczny dlatego, że
    o żadnym nie słychać — jest po prostu niezbadany.

    Po zmianie serwer odmawia rozmowy w tym protokole niezależnie od tego, co
    zaproponuje klient. Praktycznie nic nie traci, bo od dawna nie ma klientów,
    które by go używały.
  en: |
    PCT was a competing proposal to SSL, worked out at a time when it was not yet
    clear which way of encrypting traffic would settle in as the standard. SSL did,
    and TLS after it. PCT never saw a second version and has not been developed
    since the nineteen-nineties.

    What it takes away from an attacker - one of the roads down to a protocol
    nobody analyses. The mere fact that the server announces support for such a
    protocol gives somebody on the route of a connection an opening to force it
    instead of the one both sides can establish properly. A protocol in which
    nobody has looked for faults for thirty years is not safe because none are
    heard of - it is simply unexamined.

    After the change the server refuses to talk in this protocol regardless of what
    the client proposes. It loses practically nothing by it, since there have long
    been no clients that use it.

disruption_description:
  pl: |
    To jedna z niewielu zmian w tej okolicy, którą można wykonać bez zastanowienia.
    Protokół nie jest obsługiwany przez żadną używaną dziś przeglądarkę ani przez
    biblioteki sieciowe współczesnych środowisk programistycznych. Systemy Windows
    nie włączają go domyślnie od wielu wydań, a nowsze nie mają już nawet jego
    implementacji — wpis w rejestrze jest wtedy deklaracją bez skutku.

    Jedyny scenariusz, w którym cokolwiek się zmieni, to obecność klienta
    napisanego w latach dziewięćdziesiątych i od tego czasu nietkniętego. Jeśli
    taki istnieje w sieci, nie łączy się dziś z niczym innym i wiadomo o nim.

    Zapis wymaga ponownego uruchomienia maszyny, żeby zaczął obowiązywać. Do tego
    czasu stan zgłaszany przez sprawdzenie i stan faktyczny się różnią — to jedyna
    rzecz, o której trzeba pamiętać przy tym punkcie.
  en: |
    This is one of the few changes in this area that can be made without
    deliberation. The protocol is supported by no browser in use today, nor by the
    networking libraries of modern programming environments. Windows systems have
    not switched it on by default for many releases, and newer ones no longer even
    carry an implementation of it - the registry entry is then a declaration with
    no effect.

    The only scenario in which anything changes is the presence of a client written
    in the nineteen-nineties and untouched since. If such a thing exists on the
    network, it connects to nothing else today and is known about.

    The write calls for the machine to be restarted before it applies. Until then
    the state the check reports and the real state differ - the one thing to keep
    in mind with this item.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - legacy-applications
    - web-server-services
  what_breaks:
    pl:
      - Zmiana zaczyna obowiązywać dopiero po ponownym uruchomieniu maszyny, więc do tego czasu stan zgłaszany i rzeczywisty się różnią
      - Klient z lat dziewięćdziesiątych, gdyby taki był w sieci, straci jedyny znany sobie sposób nawiązania połączenia szyfrowanego
      - Zmiana obejmuje całą maszynę, nie tylko serwer sieciowy, więc dotyczy też połączeń wychodzących
      - Na nowszych wydaniach systemu wpis nie zmienia niczego, bo implementacji tego protokołu już tam nie ma
      - Połączenia po TLS, uwierzytelnianie, uprawnienia i zawartość stron pozostają bez zmian
    en:
      - The change takes effect only after the machine is restarted, so until then the reported state and the real one differ
      - A client from the nineteen-nineties, were one on the network, loses the only way it knows of establishing an encrypted connection
      - The change covers the whole machine and not the web server alone, so it reaches outgoing connections too
      - On newer releases of the system the entry changes nothing, because an implementation of this protocol is no longer there
      - Connections over TLS, authentication, permissions and page contents are all unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny obsługujące klienta sprzed dwóch dekad, o którym wiadomo, że zestawia połączenie właśnie w tym protokole
    en:
      - Machines serving a client from two decades ago known to establish connections in this very protocol
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $wrong = @()
        foreach ($role in @('Server', 'Client')) {
          # The two roles are separate keys and a machine may well have one set
          # and the other left alone. Reporting them together would hide exactly
          # the half that is still open.
          $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT 1.0\' + $role
          $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
          if ($null -eq $item) {
            # An absent key means the protocol follows the system default rather
            # than nothing at all, so it counts as unset and not as compliant.
            $wrong += ($role + ':not-set')
          }
          elseif ($item.Enabled -ne 0 -or $item.DisabledByDefault -ne 1) {
            $wrong += ($role + ':other')
          }
        }
        if ($wrong.Count -eq 0) { 'AS_REQUIRED' }
        else { 'OTHER ' + ($wrong -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $saved = @()
    foreach ($role in @('Server', 'Client')) {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT 1.0\' + $role
      $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
      $saved += [pscustomobject]@{
        role            = $role
        path            = $path
        key_existed     = (Test-Path $path)
        enabled         = if ($null -ne $item) { $item.Enabled } else { $null }
        enabled_existed = ($null -ne $item -and $null -ne $item.Enabled)
        default         = if ($null -ne $item) { $item.DisabledByDefault } else { $null }
        default_existed = ($null -ne $item -and $null -ne $item.DisabledByDefault)
      }
    }
    [pscustomobject]@{
      protocol = 'PCT 1.0'
      roles    = $saved
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    foreach ($role in @('Server', 'Client')) {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\PCT 1.0\' + $role
      # The whole branch is usually absent, so it is created rather than assumed.
      if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
      New-ItemProperty -Path $path -Name 'Enabled' -Value 0 -PropertyType DWord -Force | Out-Null
      New-ItemProperty -Path $path -Name 'DisabledByDefault' -Value 1 -PropertyType DWord -Force | Out-Null
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($r in $b.roles) {
      if (-not $r.key_existed) {
        # The branch did not exist before the change, so it goes away whole
        # instead of being left behind holding values nobody wrote.
        Remove-Item -Path $r.path -Recurse -Force -ErrorAction SilentlyContinue
        continue
      }
      if (-not (Test-Path $r.path)) { New-Item -Path $r.path -Force | Out-Null }
      if ($r.enabled_existed) {
        New-ItemProperty -Path $r.path -Name 'Enabled' -Value $r.enabled -PropertyType DWord -Force | Out-Null
      } else {
        Remove-ItemProperty -Path $r.path -Name 'Enabled' -ErrorAction SilentlyContinue
      }
      if ($r.default_existed) {
        New-ItemProperty -Path $r.path -Name 'DisabledByDefault' -Value $r.default -PropertyType DWord -Force | Out-Null
      } else {
        Remove-ItemProperty -Path $r.path -Name 'DisabledByDefault' -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/tls/tls-registry-settings
  - https://learn.microsoft.com/security/engineering/solving-tls1-problem

notes:
  pl: |
    Na nowszych wydaniach Windows ten protokół nie jest już zaimplementowany,
    więc wpis w rejestrze nie zmienia zachowania maszyny. Reguła zostaje mimo to,
    bo kosztuje zero, a rozstrzyga sprawę na maszynach starszych i zostawia ślad
    w raporcie, że punkt został rozpatrzony.

    Odczyt ocenia rolę serwera i klienta osobno, a brak gałęzi liczy jako stan
    nieustawiony — nie jako spełnienie. Zejście do starszego protokołu jest
    możliwe dopóty, dopóki jest on dostępny, więc poleganie na domyślnym
    zachowaniu systemu nie jest tym samym co jego wyłączenie.
  en: |
    On newer releases of Windows this protocol is no longer implemented, so the
    registry entry does not change the machine's behaviour. The rule stays all the
    same, because it costs nothing, settles the matter on older machines and leaves
    a trace in the report that the item was considered.

    The reading judges the server and client roles separately and counts an absent
    branch as unset rather than as met. Falling back to an older protocol is
    possible as long as it is available, so relying on the system's default
    behaviour is not the same as switching it off.
