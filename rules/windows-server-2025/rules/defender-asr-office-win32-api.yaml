id: win2025-defender-asr-office-win32-api

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wywołań funkcji systemowych z makr w dokumentach
    en: System function calls from document macros blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Makro w dokumencie może sięgnąć bezpośrednio do funkcji systemu,
    z pominięciem tego, co aplikacja biurowa udostępnia własnym
    językiem. Reguła tego zabrania.

    Różnica wobec sąsiednich reguł jest istotna. Tamte dotyczą skutków
    widocznych: uruchomionego programu, zapisanego pliku. Ta dotyczy
    drogi, którą makro w ogóle wychodzi poza dokument. Makro sięgające
    wprost do funkcji systemowych potrafi zrobić rzeczy, dla których
    aplikacja biurowa nie ma żadnego polecenia — czytać pamięć, wołać
    biblioteki, otwierać połączenia.

    Kategorię obniżam z tego samego powodu, co przy pozostałych regułach
    dotyczących dokumentów: na serwerze pakietu biurowego zwykle nie
    ma. Tam gdzie jest, ocena wraca wyżej, a szczególnie wysoko na
    serwerze otwierającym dokumenty przychodzące z zewnątrz bez udziału
    człowieka — bo ostrzeżenie o makrach nie ma komu się wyświetlić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z pakietem biurowym — możliwość wykonania z makra rzeczy,
    których sam pakiet biurowy zrobić nie potrafi.
  en: |
    A macro in a document may reach straight for the system's workings, going round what the office
    application gives out by its own tongue. The rule forbids it.

    The difference from the neighbouring rules matters. Those bear on seen outcomes - a program
    run, a file written. This one bears on the road by which a macro comes out of a document at
    all. A macro that reaches straight for the system's workings can do things the office
    application has no order for - read memory, call libraries, open connections.

    I lower the category for the same ground as at the other rules bearing on documents - a server
    mostly has no office bundle. Where it has, the reckoning comes back higher, and highest of all
    on a server that opens documents coming from outside with no person's part in it - a warning
    about macros having nobody to show itself to.

    What an attacker gains while the item goes unmet: on a machine with an office bundle - the
    means of doing from a macro things the office bundle itself cannot do.

disruption_description:
  pl: |
    Podnoszę tu klasę do świadomego wdrożenia i jest to jedyna reguła
    z czwórki biurowej, przy której to robię. Powód jest konkretny.

    Sięganie makra wprost do funkcji systemowych jest techniką starą
    i w rozwiązaniach zbudowanych wewnątrz organizacji używaną
    powszechnie — właśnie dlatego, że pozwala zrobić to, czego sam
    pakiet biurowy nie potrafi. Odczyt z urządzenia, wywołanie
    biblioteki systemu dziedziczonego, sterowanie oknem innej
    aplikacji, obsługa portu szeregowego. Rozwiązania te mają po
    kilkanaście lat, działają i nikt ich nie przepisze na potrzeby tej
    zmiany.

    Na serwerze rzecz jest trudniejsza niż na stanowisku z dwóch
    powodów.

    Po pierwsze, jeżeli serwer składa dokumenty automatycznie, makro
    wykonuje się w zadaniu. Zablokowane makro nie pokazuje błędu —
    zadanie kończy się niepowodzeniem albo, co gorsza, powodzeniem
    z niepełnym wynikiem. Raport wychodzi, tylko bez jednej sekcji.

    Po drugie, cofnięcie samej reguły jest natychmiastowe, ale to, co
    przez ten czas nie zostało policzone albo nie trafiło do odbiorcy,
    nie wraca. Skutek zmiany bywa więc trwalszy niż sama zmiana.

    Wdrożenie ma sens wyłącznie w kolejności: tryb obserwacji, pełen
    cykl składania dokumentów, przegląd dziennika trafień, rozmowa
    z właścicielem rozwiązania o tym, co znaleziono — i dopiero potem
    blokada. Jeżeli rozwiązania nie da się poprawić, prawidłowym
    wynikiem jest zapisany wyjątek z uzasadnieniem i datą przeglądu,
    a nie wdrożenie na siłę.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I raise the class here to a knowing rollout and it is the one rule of the office four whereat I
    do so. The ground is a set one.

    A macro's reaching straight for the system's workings is an old craft and in ways of doing
    things built within a body a common one - for the very reason that it lets be done what the
    office bundle itself cannot. A reading off a device, a calling of an inherited system's
    library, the steering of another application's window, the serving of a serial port. Such ways
    of doing things are a dozen years old and more, they work, and nobody will write them anew for
    the sake of this change.

    On a server the matter is harder than at a station for two grounds.

    First, if the server sets documents of itself, the macro is carried out in a task. A blocked
    macro shows no fault - the task ends in failure or, worse, in success with an unfinished
    outcome. The report comes out, only without one section.

    Second, the undoing of the rule itself is at once, but what in that while was not reckoned up
    or did not reach its receiver does not come back. The effect of the change is therefore at
    times longer-lived than the change.

    The rollout has sense in this order alone - the mode of watching, a full round of the setting
    of documents, a looking through of the log of strikings, a speaking with the owner of the way
    of doing things about what was found - and only then the blocking. If that way cannot be
    mended, the right outcome is a written exception with its grounds and a date of review, and not
    a rolling out by force.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - macros-and-documents
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Makra sięgające do bibliotek systemu dziedziczonego przestaną działać i nikt ich nie przepisze
      - Zadanie składające dokumenty może zakończyć się powodzeniem z niepełnym wynikiem
      - Raport wyjdzie bez jednej sekcji, więc trafienie zostanie zauważone dopiero przez odbiorcę
      - To, co przez czas blokady nie zostało policzone, nie wraca po cofnięciu ustawienia
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - Macros reaching for an inherited system's libraries will stop working and nobody will write them anew
      - A task that sets documents may end in success with an unfinished outcome
      - The report will come out without one section, so the striking will be marked only by its receiver
      - What in the while of the blocking was not reckoned up does not come back at the undoing
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze działają rozwiązania biurowe wołające biblioteki systemowe albo systemy dziedziczone
      - Nie przeszedł pełen cykl składania dokumentów w trybie obserwacji z przeglądem dziennika
    en:
      - Office ways of doing things calling system libraries or inherited systems work on this server
      - No full round of the setting of documents passed in the mode of watching with a looking through of the log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two is the mode of watching. Run a full round of document setting at two,
    # look through the log, and only then set one here.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Jedyna reguła z czwórki biurowej, którą podnoszę do świadomego
    wdrożenia. Sięganie makra wprost do funkcji systemowych jest w
    rozwiązaniach budowanych wewnątrz organizacji używane powszechnie,
    bo pozwala zrobić to, czego pakiet biurowy nie potrafi.

    Najgorszy objaw na serwerze: zadanie kończy się powodzeniem
    z niepełnym wynikiem. Raport wychodzi, tylko bez jednej sekcji,
    a zauważa to dopiero odbiorca.

    Cofnięcie reguły jest natychmiastowe, ale to, co przez ten czas nie
    zostało policzone, nie wraca. Skutek bywa trwalszy niż sama zmiana.

    Jeżeli rozwiązania nie da się poprawić, prawidłowym wynikiem jest
    zapisany wyjątek, a nie wdrożenie na siłę.
  en: |
    The one rule of the office four I raise to a knowing rollout. A macro's reaching straight for
    the system's workings is in ways of doing things built within a body a common one, letting as
    it does be done what the office bundle cannot.

    The worst symptom on a server - the task ends in success with an unfinished outcome. The report
    comes out, only without one section, and its receiver alone marks it.

    The undoing of the rule is at once, but what in that while was not reckoned up does not come
    back. The effect is at times longer-lived than the change.

    If the way of doing things cannot be mended, the right outcome is a written exception and not a
    rolling out by force.
