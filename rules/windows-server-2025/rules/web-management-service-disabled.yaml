id: win2025-web-management-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania serwerem sieciowym wyłączona
    en: The service for remote management of the web server disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę pozwalającą zarządzać serwerem sieciowym
    zdalnie. Usługa ta nasłuchuje na własnym porcie i przyjmuje
    logowania osób administrujących witrynami.

    Chcę ustawić ten punkt względem dwóch poprzednich, bo cała trójka
    dotyczy serwera sieciowego, a odpowiadają na trzy różne pytania.
    Usługa publikowania obsługuje odwiedzających witrynę. Usługa
    administracyjna obsługuje starszą warstwę konfiguracji. Ta obsługuje
    ludzi, którzy witrynami zarządzają — i jest jedyną z trójki, która
    wystawia na sieć osobne wejście z osobnym logowaniem.

    Zostawiam kategorię średnią. Wejście to jest wąskie i zwykle
    ograniczone do wskazanych adresów, ale prowadzi wprost do zmiany
    konfiguracji serwera sieciowego — czyli do tego, jaki kod ta maszyna
    wykonuje w odpowiedzi na żądania z sieci. Droga jest krótka, tylko
    trudniejsza do przejścia niż przez samą witrynę.

    Warto też zauważyć, skąd ta usługa najczęściej się bierze. Nie z
    projektu, tylko z jednej sytuacji, w której ktoś potrzebował
    zarządzać witryną nie wchodząc na serwer, włączył zdalne zarządzanie
    i nie wyłączył go potem. Jest to ten sam rodzaj pozostałości, co tryb
    programisty opisany przy pakietach aplikacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: osobne
    wejście z sieci prowadzące do konfiguracji serwera sieciowego, zwykle
    włączone przy okazji i zapomniane.
  en: |
    The item switches off the service letting the server of the net be ruled from afar. That service
    listens upon a port of its own and takes the signings in of those who rule the sites.

    I would set this item against the two before, all three bearing on the server of the net, yet
    they answer three sundry questions. The service of publishing serves those who come to the site.
    The service of ruling serves the older layer of settings. This one serves the people who rule the
    sites - and it is the only one of the three that sets forth onto the net a sundered way in with a
    sundered signing in.

    I leave the category middling. That way in is narrow and mostly bounded to named whereabouts, but
    it leads straight to the altering of the settings of the server of the net - that is, to what
    code that machine carries out in answer to askings off the net. The road is short, only harder to
    go than through the site itself.

    It is worth marking also whence that service most often comes. Not out of a design, but out of
    one case wherein somebody needed to rule a site without a coming onto the server, switched the
    ruling from afar on and switched it not off after. It is the same kind of leaving as the mode of
    the maker of programs set forth at the packages of applications.

    What an attacker gains while the item goes unmet - a sundered way in off the net leading to the
    settings of the server of the net, mostly switched on at a hap and forgotten.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" — niżej niż przy dwóch
    poprzednich usługach serwera sieciowego — i różnica jest tu wyraźna,
    więc powiem, na czym polega.

    Ta usługa nigdy nie obsługuje ruchu. Zatrzymanie jej nie przerywa
    żadnego połączenia odwiedzającego, nie zatrzymuje żadnej witryny
    i nie zrywa niczyjej sesji pracy. Aplikacje działają dalej bez
    najmniejszej zmiany, bo nie mają z tą usługą nic wspólnego.

    Skutek dotyczy wyłącznie osób zarządzających i sprowadza się do
    zmiany sposobu pracy, nie do jej zatrzymania. Ktoś, kto dotąd otwierał
    konfigurację witryny ze swojej stacji roboczej, musi po zmianie
    wejść na serwer i zrobić to na miejscu. Jest to niewygoda realna
    i warto ją komuś zapowiedzieć, ale nie jest to przerwa w działaniu.

    Sprawdzenie polega więc na ustaleniu, czy ktokolwiek faktycznie
    korzysta z tej drogi. Jeżeli tak, decyzja jest kompromisem między
    wygodą zespołu a jednym wejściem mniej — i należy do właściciela
    maszyny, a nie do reguły.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I leave the class "needs a checking" - lower than at the two services of the server of the net
    before - and the difference is here plain, so I shall say wherein it lies.

    That service never bears traffic. Its stopping breaks off no binding of one who comes to a site,
    stops no site and breaks nobody's sitting of work. The applications work on without the least
    altering, having with that service nothing in common.

    The outcome touches those who rule alone, and comes to an altering of the way of working and not
    to its stopping. One who hitherto opened the settings of a site off their own workstation must
    after the change come onto the server and do it there. It is a true unease and worth foretelling
    to somebody, but it is no break in the working.

    The checking comes therefore to the settling whether anybody truly uses that road. If so, the
    deciding is a middle way between a band's ease and one way in the less - and it belongs to the
    machine's owner and not to a rule.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Zarządzanie konfiguracją witryn ze stacji roboczej przestaje być możliwe
      - Po zmianie trzeba wejść na serwer i zrobić to na miejscu
      - Zatrzymanie usługi nie przerywa żadnego połączenia odwiedzającego i nie zatrzymuje witryn
      - Aplikacje działają dalej bez zmiany, bo nie mają z tą usługą nic wspólnego
      - Decyzja jest kompromisem między wygodą zespołu a jednym wejściem mniej
    en:
      - The ruling of the settings of sites off a workstation stops being open to anybody
      - After the change one must come onto the server and do it there
      - The stopping of the service breaks off no binding of one who comes to a site and stops no sites
      - The applications work on unaltered, having with that service nothing in common
      - The deciding is a middle way between a band's ease and one way in the less
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Zespół zarządzający witrynami korzysta z tej drogi i nie ma innego sposobu pracy z konfiguracją
    en:
      - The band that rules the sites uses that road and has no other way of working with the settings
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This carries no visitor traffic: sites and applications are untouched.
    # Only the people who administer them lose a way of working from their own
    # desk.
    Stop-Service -Name 'WMSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WMSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/manage/remote-administration/remote-administration-for-iis-manager

notes:
  pl: |
    Trzy usługi serwera sieciowego odpowiadają na trzy różne pytania:
    publikowanie obsługuje odwiedzających witrynę, usługa administracyjna
    obsługuje starszą warstwę konfiguracji, ta obsługuje ludzi
    zarządzających witrynami. Jest jedyną z trójki wystawiającą na sieć
    osobne wejście z osobnym logowaniem.

    Skąd ta usługa najczęściej się bierze: nie z projektu, tylko z jednej
    sytuacji, w której ktoś potrzebował zarządzać witryną nie wchodząc na
    serwer, włączył zdalne zarządzanie i nie wyłączył go potem. Ten sam
    rodzaj pozostałości, co tryb programisty przy pakietach aplikacji.

    Klasa najniższa z całej trójki, bo usługa nigdy nie obsługuje ruchu —
    skutek dotyczy sposobu pracy zespołu, nie działania maszyny.
  en: |
    Three services of the server of the net answer three sundry questions - the publishing serves
    those who come to the site, the service of ruling serves the older layer of settings, this one
    serves the people who rule the sites. It is the only one of the three setting forth onto the net
    a sundered way in with a sundered signing in.

    Whence that service most often comes - not out of a design, but out of one case wherein somebody
    needed to rule a site without a coming onto the server, switched the ruling from afar on and
    switched it not off after. The same kind of leaving as the mode of the maker of programs at the
    packages of applications.

    The lowest class of the three, the service never bearing traffic - the outcome touches a band's
    way of working and not the machine's working.
