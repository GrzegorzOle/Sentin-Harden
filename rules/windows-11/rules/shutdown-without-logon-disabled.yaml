id: win11-shutdown-without-logon-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zamykanie systemu bez logowania wyłączone
    en: Shutting down the system without signing in disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Przycisk zamykania na ekranie logowania pozwala wyłączyć maszynę komuś, kto
    nie ma na niej konta. To nie jest droga do danych, ale jest to droga do
    przerwania pracy — i do wymuszenia ponownego uruchomienia w chwili
    wybranej przez osobę stojącą przy maszynie.

    Wartość tego punktu jest największa tam, gdzie maszyna coś obsługuje w tle:
    rejestruje, mierzy, przetwarza. Wymuszony restart bywa też pierwszym krokiem
    przy próbie uruchomienia systemu z nośnika zewnętrznego — sam w sobie
    niegroźny, ale potrzebny do czegoś dalszego.
  en: |
    The shutdown button on the sign-in screen lets somebody without an account
    switch the machine off. That is not a route to the data, but it is a route
    to interrupting work - and to forcing a restart at a moment chosen by
    whoever is standing at the machine.

    The item is worth most where the machine handles something in the
    background: recording, measuring, processing. A forced restart is also the
    first step in an attempt to boot the system from external media - harmless
    in itself, but needed for something further.

disruption_description:
  pl: |
    Przycisk zamykania znika z ekranu logowania. Dla użytkownika, który i tak
    się loguje, nie zmienia się nic — zamykanie z poziomu zalogowanej sesji
    działa bez zmian.

    Kłopot pojawia się tam, gdzie maszyna bywa wyłączana przez osobę bez konta:
    przy stanowisku wspólnym, w serwerowni, na hali. Wtedy jedyną drogą zostaje
    przytrzymanie przycisku zasilania, czyli wyłączenie bez zamknięcia systemu —
    gorsze dla maszyny niż to, czego punkt zabrania.
  en: |
    The shutdown button disappears from the sign-in screen. For a user who signs
    in anyway nothing changes - shutting down from within a signed-in session
    works as before.

    The trouble appears where the machine is switched off by somebody without an
    account: at a shared station, in a server room, on a shop floor. The only
    route left is then holding the power button, that is, switching off without
    shutting down - worse for the machine than what the item forbids.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Przycisk zamykania zniknie z ekranu logowania i maszyny nie wyłączy osoba bez konta
      - Wyłączanie stanowiska na koniec dnia przez osobę bez konta wymaga innego rozwiązania
    en:
      - The shutdown button disappears from the sign-in screen and nobody without an account can switch the machine off
      - Switching a station off at the end of the day by somebody without an account needs another arrangement
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszynę wyłącza na koniec dnia osoba, która nie ma na niej konta
      - Stanowisko stoi w miejscu, w którym wyłączenie przyciskiem zasilania jest realnym ryzykiem dla danych
    en:
      - The machine is switched off at the end of the day by somebody with no account on it
      - The station stands where switching off with the power button is a real risk to the data
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ShutdownWithoutLogon'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'ShutdownWithoutLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'ShutdownWithoutLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/shutdown-allow-system-to-be-shut-down-without-having-to-log-on

notes:
  pl: |
    To punkt o niskiej kategorii ryzyka i mimo to warty osobnej decyzji, bo
    zakaz bywa gorszy od tego, czemu zapobiega: użytkownik pozbawiony przycisku
    sięga po zasilanie. Tam, gdzie tak się skończy, lepszym wynikiem pracy
    z aplikacją jest zapisany wyjątek z uzasadnieniem niż wdrożenie.

    Na stacji domowej i jednoosobowej zmiana nie boli zupełnie — użytkownik
    zamyka system z własnej sesji i przycisku na ekranie logowania nigdy nie
    używa.
  en: |
    The item is rated low and still deserves a decision of its own, because the
    prohibition can be worse than what it prevents: a user deprived of the
    button reaches for the power. Where it will end that way, a recorded
    exception with a justification is a better outcome of working with the
    application than a rollout.

    On a home or single-person workstation the change does not hurt at all - the
    user shuts down from their own session and never uses the button on the
    sign-in screen.
