id: win2016-standby-states-disabled-when-sleeping

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Stany uśpienia z zachowaniem zasilania wyłączone
    en: Sleep states keeping the power on switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza stany uśpienia, w których maszyna zachowuje
    zasilanie pamięci, i zostawia wyłącznie hibernację.

    Różnica między tymi stanami jest całą treścią tego punktu. W uśpieniu
    z zachowaniem zasilania pamięć pozostaje pod napięciem, a w niej
    wszystko, co system i aplikacje w niej trzymały: klucze szyfrujące,
    żetony uwierzytelniające, zawartość otwartych dokumentów. W hibernacji
    pamięć zostaje zapisana na dysk i pozbawiona zasilania.

    Zagrożenie płynące z pierwszego stanu jest fizyczne i dobrze opisane.
    Zawartość pamięci pod napięciem da się odczytać przy dostępie do
    maszyny, a klucz szyfrujący dysk leży w pamięci właśnie po to, żeby
    dysk był czytelny. Maszyna uśpiona jest więc maszyną, której
    zabezpieczenie dyskowe jest w tej chwili rozwiązane.

    Hibernacja tego problemu nie ma, bo pamięć po zapisaniu na dysk
    przestaje być zasilana. Zapis trafia na dysk, który — jeśli jest
    zaszyfrowany — chroni go tak samo jak resztę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zawartości pamięci maszyny, w tym do klucza rozszyfrowującego jej dysk.
  en: |
    The setting switches off the sleep states in which the machine keeps the memory powered, and leaves
    hibernation alone.

    The difference between those states is this item's whole substance. In a sleep keeping the power the
    memory stays under voltage, and in it everything the system and the applications held there: encryption
    keys, authenticating tokens, the contents of open documents. In hibernation the memory is written to
    disk and left without power.

    The threat flowing from the first state is a physical one and well described. The contents of powered
    memory can be read given access to the machine, and the key encrypting the disk lies in memory for just
    that reason - so that the disk should be legible. A sleeping machine is therefore a machine whose disk
    safeguard is at that moment undone.

    Hibernation has not that trouble, the memory ceasing to be powered once written to disk. The writing
    lands on the disk, which - if encrypted - guards it the same as the rest.

    What an attacker gains while the item goes unmet: access to the contents of the machine's memory,
    including the key decrypting its disk.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzeczy do sprawdzenia są trzy.

    Pierwsza dotyczy czasu powrotu. Hibernacja wymaga odczytania z dysku
    tylu danych, ile było w pamięci, więc powrót trwa dłużej — na maszynie
    z dużą pamięcią zauważalnie dłużej. Nie jest to awaria, ale jest to
    zmiana odczuwalna i bywa zgłaszana jako spowolnienie.

    Druga dotyczy miejsca na dysku. Plik hibernacji zajmuje wielkość
    odpowiadającą pamięci maszyny. Na dysku systemowym bez zapasu może to
    być warunek nie do spełnienia, i to warunek, który ujawni się dopiero
    przy pierwszej próbie.

    Trzecia dotyczy osiągalności. Maszyna w uśpieniu z zachowaniem
    zasilania bywa nadal osiągalna przez sieć i daje się wybudzić zdalnie.
    Maszyna zahibernowana zwykle nie — zależy to od karty sieciowej
    i ustawień oprogramowania układowego. Na maszynie podnoszonej zdalnie
    warto to sprawdzić przed zmianą, a nie po.

    Czego to nie psuje: pracy maszyny czuwającej, wyłączania, restartu,
    usług, aplikacji, sieci przy maszynie czynnej.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and there are three things to be established.

    The first concerns the time of the return. Hibernation calls for as much data to be read from disk as was
    in memory, so the return takes longer - on a machine with much memory noticeably longer. It is no fault,
    but it is a change that is felt and is at times reported as a slowing.

    The second concerns room on the disk. The hibernation file takes a size answering to the machine's
    memory. On a system disk without a reserve that may be a condition not to be met, and a condition that
    shows itself only at the first attempt.

    The third concerns reachability. A machine in a sleep keeping the power is at times still reachable over
    the network and can be woken remotely. A hibernated machine as a rule not - that hangs on the network
    card and on the firmware's settings. On a machine brought up remotely it is worth establishing before the
    change rather than after.

    What this does not break: the working of a machine that is awake, switching off, a restart, services,
    applications, or the network while the machine is live.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - boot-and-firmware
    - network-and-firewall
  what_breaks:
    pl:
      - Powrót z hibernacji trwa dłużej niż powrót z uśpienia i na maszynie z dużą pamięcią bywa zgłaszany jako spowolnienie
      - Plik hibernacji zajmuje na dysku systemowym wielkość odpowiadającą pamięci maszyny
      - Brak miejsca ujawni się dopiero przy pierwszej próbie hibernacji, a nie przy zmianie ustawienia
      - Maszyna zahibernowana zwykle nie daje się wybudzić zdalnie, w przeciwieństwie do uśpionej
      - Praca maszyny czuwającej, wyłączanie, restart, usługi i aplikacje pozostają bez zmian
    en:
      - The return from hibernation takes longer than the return from sleep and on a machine with much memory is at times reported as a slowing
      - The hibernation file takes on the system disk a size answering to the machine's memory
      - A want of room will show only at the first attempt at hibernation and not at the setting's change
      - A hibernated machine as a rule cannot be woken remotely, unlike a sleeping one
      - The working of a machine that is awake, switching off, a restart, services and applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest wybudzana zdalnie i hibernacja odetnie tę drogę, bo karta sieciowa z niej nie wybudza
      - Na dysku systemowym nie ma miejsca na plik hibernacji odpowiadający wielkości pamięci
      - Czas powrotu ma znaczenie, bo maszyna ma wracać do pracy natychmiast
    en:
      - The machine is woken remotely and hibernation will cut that road off, the network card not waking from it
      - There is no room on the system disk for a hibernation file answering to the memory's size
      - The time of the return matters, the machine being meant to come back to work at once
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because the machine is protected only as far as the worse variant
      # protects it - an uninterruptible supply can switch it over by itself.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 0 -and [int]$dc -eq 0) { 'HIBERNATE_ONLY' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'HIBERNATE_ONLY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      ac          = $item.ACSettingIndex
      dc          = $item.DCSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc_existed  = ($null -ne $item.DCSettingIndex)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both variants are set, for the same reason as at the item before. After
    # this the machine hibernates instead of sleeping, and the return from
    # hibernation is slower.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\abfc2519-3608-4c2a-94ea-171b0ed546ab'
    if (-not (Test-Path -Path $path)) { $null = New-Item -Path $path -Force }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 0 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.ac_existed) {
      Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
    }
    if ($b.dc_existed) {
      Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    Punkt jest drugi w bloku i dotyczy tego samego stanu co pierwszy, ale
    z innej strony. Tamten pilnuje, żeby powrót z uśpienia wymagał hasła;
    ten pilnuje, żeby w uśpieniu nie zostawało nic do odczytania.

    Warto pokazywać oba razem, bo bez drugiego pierwszy broni tylko drogi
    przez klawiaturę. Napastnik z dostępem fizycznym, który sięga po
    zawartość pamięci, hasła nie potrzebuje.

    Poziom drugi jest uzasadniony kosztem. Trzy warunki wymienione w opisie
    skutków — czas powrotu, miejsce na dysku i osiągalność zdalna — są
    realne i żaden z nich nie jest teoretyczny. Jest to reguła, którą
    świadomie odpuszcza się często i słusznie.

    Odnotowuję, że na serwerze, który nie sypia w ogóle, obie reguły tego
    bloku są porządkowe. Ich wartość ujawnia się na maszynach, które
    sypiają — a takie bywają wśród maszyn zarządzanych razem z serwerami
    częściej, niż wynikałoby z nazwy zestawu.
  en: |
    The item is the second in the block and concerns the same state as the first, but from another side. That
    one sees to it that the return from sleep calls for a password; this one sees to it that nothing worth
    reading stays in the sleep.

    They are worth showing together, for without the second the first defends only the road through the
    keyboard. An attacker with physical access who reaches for the memory's contents needs no password.

    Level two is warranted by the cost. The three conditions named in the account of consequences - the time
    of the return, room on the disk and remote reachability - are real and none of them theoretical. It is a
    rule knowingly let go often and rightly.

    Worth noting that on a server that does not sleep at all both rules of this block are ones of order.
    Their value shows on machines that do sleep - and such are among the machines managed along with servers
    oftener than the set's name would suggest.
