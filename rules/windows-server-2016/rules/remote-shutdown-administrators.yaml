id: win2016-remote-shutdown-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Wymuszanie zamknięcia z systemu zdalnego zastrzeżone dla administratorów
    en: Forcing a shutdown from a remote system restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zawęża listę kont uprawnionych do wymuszenia zamknięcia maszyny
    poleceniem przychodzącym z sieci do grupy administratorów lokalnych.

    Różnica wobec zwykłego zamknięcia jest tu istotna i warto ją nazwać.
    Zamknięcie wywołane z sesji na maszynie wymaga tej sesji — czyli zalogowania,
    które zostawia ślad i zabiera czas. Polecenie przychodzące z sieci nie
    wymaga niczego poza uprawnieniem i drogą sieciową, a jego skutek jest
    natychmiastowy.

    Dlatego to uprawnienie warto trzymać wąsko nawet tam, gdzie zwykłe
    zamykanie jest nadane szerzej. Napastnik z poświadczeniem konta o takim
    uprawnieniu może wyłączyć maszynę bez jednej sesji, z dowolnego miejsca
    w sieci.

    Kategoria średnia, bo punkt chroni dostępność, a nie dane. Wyłączona maszyna
    nie ujawnia niczego — tyle że nie ujawnia też tego, co powinna: przestaje
    odpowiadać, przestaje zbierać dzienniki i przestaje być widoczna dla
    monitoringu.

    Na serwerze 2016 warto sprawdzić tę listę osobno, bo narzędzia zarządzania
    z tamtych lat bywały instalowane z kontem, któremu nadawano to uprawnienie
    razem z resztą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyłączenia maszyny z dowolnego miejsca w sieci, bez logowania się na nią.
  en: |
    The item narrows the list of accounts permitted to force a shutdown by a
    command arriving over the network to the local administrators group.

    The difference from an ordinary shutdown matters here and is worth naming. A
    shutdown raised from a session on the machine requires that session - that is,
    a sign-in, which leaves a trace and takes time. A command arriving over the
    network requires nothing but the right and a network route, and its effect is
    immediate.

    This right is therefore worth keeping narrow even where ordinary shutdown is
    granted more widely. An attacker with a credential for an account holding it
    can switch the machine off without a single session, from anywhere on the
    network.

    The category is medium, because the item protects availability rather than
    data. A machine switched off reveals nothing - except that it also stops
    revealing what it should: it stops answering, stops collecting logs and stops
    being visible to monitoring.

    On Server 2016 this list is worth checking separately, because management tools
    from those years were sometimes installed with an account granted this right
    along with the rest.

    What an attacker gains while the item goes unmet: the ability to switch the
    machine off from anywhere on the network, without signing in to it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo zdalne ponowne uruchamianie bywa częścią
    procedury obsługi.

    Typowy przypadek to narzędzie zarządzania wdrażające aktualizacje, które po
    instalacji uruchamia maszynę ponownie zdalnie. Konto takiego narzędzia bywa
    na liście i po zawężeniu jej aktualizacje zainstalują się, ale maszyna nie
    wstanie ponownie — a to jest stan gorszy niż brak aktualizacji, bo część
    zmian czeka na restart i nie obowiązuje.

    Drugi przypadek to skrypty obsługi uruchamiające maszyny w kolejności przy
    planowym oknie serwisowym. Działają zwykle na koncie usługowym i to samo
    ich dotyczy.

    Objaw jest widoczny, ale nie od razu: polecenie kończy się odmową, którą
    zobaczy ten, kto je wysłał, a nie ten, kto potem sprawdza maszynę.

    Czego to nie psuje: zamykania systemu z sesji na maszynie, aktualizacji,
    usług ani zadań harmonogramu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", because restarting remotely is sometimes part of
    an administration procedure.

    The typical case is a management tool deploying updates that restarts the
    machine remotely after installing them. Such a tool's account is sometimes on
    the list, and after the list is narrowed the updates will install but the
    machine will not come back up - and that is a worse state than having no
    updates, because some changes wait on a restart and do not take effect.

    The second case is administration scripts starting machines in order during a
    planned maintenance window. They usually run under a service account and the
    same applies.

    The symptom is visible but not at once: the command ends in a refusal, seen by
    whoever sent it rather than by whoever checks the machine afterwards.

    What this does not break: shutting the system down from a session on the
    machine, updates, services, or scheduled tasks.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzie zarządzania uruchamiające maszynę ponownie po aktualizacjach dostaje odmowę i maszyna nie wstaje
      - Aktualizacje instalują się, ale zmiany czekające na restart nie wchodzą w życie
      - Skrypty obsługi uruchamiające maszyny w kolejności przy oknie serwisowym przestają działać
      - Zamykanie z sesji na maszynie, usługi i zadania harmonogramu działają bez zmian
    en:
      - A management tool restarting the machine after updates gets a refusal and the machine does not come back up
      - Updates install, but changes waiting on a restart do not take effect
      - Administration scripts starting machines in order during a maintenance window stop working
      - Shutting down from a session on the machine, services and scheduled tasks work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszynę uruchamia ponownie zdalnie narzędzie zarządzania albo skrypt obsługi na koncie spoza grupy administratorów
    en:
      - The machine is restarted remotely by a management tool or an administration script under an account outside the administrators group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRemoteShutdownPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRemoteShutdownPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRemoteShutdownPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check what restarts this machine remotely after updates. Updates that install
    # without the restart that follows leave changes waiting and not in force.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRemoteShutdownPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRemoteShutdownPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/force-shutdown-from-a-remote-system

notes:
  pl: |
    Zamykanie systemu z sesji na maszynie jest osobnym uprawnieniem i opisuje je
    osobna reguła. Te dwa punkty warto czytać razem, bo opisują tę samą
    czynność wywołaną z dwóch różnych miejsc.

    Uprawnienie to działa wyłącznie dla polecenia przychodzącego z sieci.
    Zamknięcie wywołane z sesji pulpitu zdalnego korzysta z tego drugiego
    uprawnienia, mimo że sesja przyszła z sieci — to jest rozróżnienie, które
    bywa mylone.

    Kategoria średnia oddaje zakres punktu: chroni dostępność, nie dane.
  en: |
    Shutting the system down from a session on the machine is a separate right and
    a separate rule describes it. The two items are worth reading together, because
    they describe the same action raised from two different places.

    This right applies only to a command arriving over the network. A shutdown
    raised from a remote desktop session uses the other right, even though the
    session came over the network - a distinction that gets confused.

    The medium category states the item's scope: it protects availability, not
    data.
