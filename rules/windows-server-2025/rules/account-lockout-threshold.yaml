id: win2025-account-lockout-threshold

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Próg blokady konta po nieudanych próbach logowania
    en: Account lockout threshold after failed sign-in attempts
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, po ilu nieudanych próbach logowania konto zostaje
    zablokowane, i wymaga progu nie większego niż pięć.

    Bez progu hasło można zgadywać bez końca. Automat sprawdza tysiące
    kombinacji na godzinę, a jedynym ograniczeniem jest przepustowość sieci.
    Na serwerze ma to wagę większą niż na stanowisku roboczym, bo serwer
    zwykle słucha, a stanowisko zwykle nie: usługa pliku, zarządzanie zdalne
    i pulpit zdalny są dostępne z sieci przez całą dobę i każde z nich
    przyjmuje próby logowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: czas bez
    ograniczeń. Nie musi znać hasła — wystarczy, że zna nazwę konta i ma
    połączenie. Zgadywanie prowadzone powoli, kilka prób na godzinę,
    nie zostawia przy tym niczego, co rzucałoby się w oczy w dzienniku.

    Blokada nie jest zabezpieczeniem doskonałym i warto o tym wiedzieć:
    napastnik, który zna próg, może zgadywać poniżej niego w nieskończoność.
    Odcina jednak wariant najtańszy i najczęstszy, a to jest tu całą
    wartością.
  en: |
    The setting settles after how many failed sign-in attempts an account is locked, and
    takes a threshold no greater than five.

    Without a threshold a password can be guessed without end. A machine tries thousands of
    combinations an hour and the one limit is the network's throughput. On a server that
    weighs more than at a working station, since a server usually listens and a station
    usually does not: the file service, remote management and the remote desktop are
    reachable from the network round the clock and each of them takes sign-in attempts.

    What an attacker gains while the item goes unmet: time without limit. They need not know
    the password - it is enough that they know the account's name and have a connection.
    Guessing carried on slowly, a few tries an hour, leaves besides nothing that would catch
    the eye in the log.

    Lockout is no perfect safeguard and that is worth knowing: an attacker who knows the
    threshold can guess below it without end. It does cut off the cheapest and commonest
    variant, though, and that is the whole value here.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że blokada konta jest na serwerze
    narzędziem obosiecznym: tym samym mechanizmem, którym odcina się
    zgadywanie, można odciąć działającą usługę.

    Konto usługowe blokuje się samo. Dzieje się tak, gdy jego hasło zostało
    zmienione w jednym miejscu, a pozostało stare w drugim — w definicji
    usługi, w zadaniu harmonogramu, w pliku konfiguracyjnym aplikacji.
    Miejsce z hasłem starym próbuje logować się cyklicznie, więc próg
    wyczerpuje się w kilka minut i konto blokuje się natychmiast po każdym
    odblokowaniu. Usługa staje, a przyczyna wygląda na awarię, nie
    na konfigurację.

    Skutek drugi to podatność na zablokowanie kont z zewnątrz. Kto zna nazwy
    kont, ten może je blokować, wysyłając błędne hasła. Na serwerze
    dostępnym z sieci jest to realna możliwość zatrzymania pracy bez
    włamywania się do czegokolwiek.

    Przed wdrożeniem trzeba mieć spis kont usługowych i miejsc, w których
    żyją ich hasła. Bez niego wdrożenie tego punktu kończy się zwykle
    zgłoszeniem o zatrzymanej usłudze.

    Zmiana nie wymaga restartu.
  en: |
    A knowing rollout is needed because on a server account lockout is a double-edged tool:
    by the same mechanism that cuts off guessing one can cut off a working service.

    A service account locks itself. That happens when its password has been changed in one
    place and stayed old in another - in the service's definition, in a scheduler task, in
    an application's configuration file. The place with the old password tries to sign in
    over and over, so the threshold is used up in a few minutes and the account locks again
    right after every unlocking. The service halts and the cause looks like a fault rather
    than configuration.

    The second effect is being open to having accounts locked from outside. Whoever knows
    the accounts' names can lock them by sending wrong passwords. On a server reachable from
    the network that is a real means of halting work without breaking into anything.

    Before the rollout one has to have a list of service accounts and of the places their
    passwords live in. Without it, rolling out this item usually ends in a case raised about
    a halted service.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Konto usługowe ze starym hasłem w jednym z miejsc blokuje się samo w kilka minut
      - Usługa pracująca na takim koncie staje, a przyczyna wygląda na awarię
      - Konta dają się blokować z zewnątrz przez wysyłanie błędnych haseł
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
    en:
      - A service account with an old password in one of the places locks itself in a few minutes
      - A service working on such an account halts and the cause looks like a fault
      - Accounts can be locked from outside by sending wrong passwords
      - On a domain controller the change takes in every account in the domain at once
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma spisu kont usługowych ani miejsc, w których zapisane są ich hasła
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - There is no list of service accounts nor of the places their passwords are recorded in
      - The server is a domain controller and a change of the domain's policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LockoutBadCount\s*=\s*(\d+)') {
          # Zero means "never lock out" - it must not pass a comparison against
          # an upper bound as if it were a very low threshold.
          if ([int]$Matches[1] -eq 0) { 'NEVER' } else { $Matches[1] }
        } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^LockoutBadCount\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'LockoutBadCount'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LockoutBadCount = 5',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LockoutBadCount = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/account-lockout-threshold

notes:
  pl: |
    Wynik „NEVER" oznacza próg zerowy, czyli brak blokady, i celowo nie jest
    liczbą. Zero przeszłoby porównanie „nie więcej niż pięć" jako wartość
    najlepsza z możliwych, a opisuje stan najgorszy.

    Punkt ma sens dopiero razem z czasem blokady i okresem zerowania
    licznika. Sam próg mówi, kiedy zamknąć konto; pozostałe dwa mówią,
    na jak długo i kiedy zapomnieć o nieudanych próbach.

    Zakres zasady zależy od roli serwera: na członkowskim obejmuje konta
    lokalne, na kontrolerze domeny — całą domenę.
  en: |
    The result "NEVER" means a zero threshold, that is no lockout at all, and is
    deliberately not a number. Zero would pass a "not greater than five" comparison as the
    best possible value while describing the worst state.

    The item makes sense only along with the lockout duration and the counter reset term.
    The threshold alone says when to close an account; the other two say for how long and
    when to forget the failed attempts.

    The policy's reach depends on the server's role: on a member server it takes in local
    accounts, on a domain controller the whole domain.
