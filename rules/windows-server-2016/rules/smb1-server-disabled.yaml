id: win2016-smb1-server-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Serwer SMB w wersji pierwszej wyłączony
    en: The first-version SMB server switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza przyjmowanie połączeń w pierwszej wersji protokołu
    udostępniania plików przez usługę serwera.

    Kategoria krytyczna, bo to jest właśnie ta strona, po której maszyna
    przyjmuje ruch z zewnątrz. Sterownik klienta decyduje o tym, dokąd
    maszyna sama się łączy; ten wpis decyduje o tym, co wolno przysłać jej.
    Na serwerze, którego zadaniem jest udostępnianie plików, waży to
    najwięcej z całej trójki.

    Pierwsza wersja protokołu nie potrafi potwierdzić, z kim rozmawia, ani
    zabezpieczyć przesyłanej treści przed podmianą w drodze. Po stronie
    przyjmującej znaczy to, że sesja nawiązana z maszyną da się przejąć
    i poprowadzić dalej cudzymi rękami, a plik zapisany na udziale nie musi
    pochodzić od tego, kto się podłączył.

    Na serwerze 2016 rzecz jest realna, a nie teoretyczna: ta strona
    protokołu jest tu domyślnie włączona. Maszyna przyjmuje takie połączenia
    od pierwszego dnia po instalacji i przyjmuje je nadal, jeżeli nikt tego
    nie zmienił.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    nawiązania z tą maszyną sesji w protokole, którego nie da się
    zabezpieczyć, oraz drogę, którą oprogramowanie rozsiewające się samo
    wchodzi na serwer bez udziału człowieka.
  en: |
    The item stops the server service accepting connections in the first
    version of the file-sharing protocol.

    The category is critical, because this is the side on which the machine
    takes traffic from outside. The client driver decides where the machine
    connects to itself; this entry decides what may be sent to it. On a server
    whose job is sharing files, it weighs the most of the three.

    The first version of the protocol cannot confirm who it is talking to, nor
    protect the content sent against substitution in transit. On the receiving
    side that means a session established with the machine can be taken over
    and carried on by somebody else's hands, and a file written to a share need
    not come from whoever connected.

    On Server 2016 the matter is real rather than theoretical: this side of the
    protocol is on by default here. The machine has accepted such connections
    from the first day after installation and accepts them still, unless
    somebody changed it.

    What an attacker gains while the item goes unmet: the ability to establish a
    session with this machine over a protocol that cannot be secured, and a road
    by which self-spreading software gets onto the server with no person
    involved.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo to ustawienie odcina konkretnych
    klientów, a nie abstrakcyjne ryzyko.

    Odetnie każdego, kto łączy się z udziałami tej maszyny wyłącznie pierwszą
    wersją protokołu. Typowo są to urządzenia wielofunkcyjne, sterowniki
    urządzeń przemysłowych, systemy wbudowane oraz stacje z systemami sprzed
    wielu lat. Połączenie z nowszych systemów nie jest tym dotknięte, bo one
    wybierają wersję wyższą samoczynnie.

    Różnica wobec dwóch pozostałych punktów tej grupy jest praktyczna
    i warto ją znać. Ten wpis dotyczy wyłącznie strony przyjmującej — maszyna
    nadal może łączyć się pierwszą wersją do innych, jeśli sterownik klienta
    pozostał włączony. Jeżeli celem jest zamknięcie sprawy, trzeba zrobić
    wszystkie trzy.

    Przed zmianą warto zebrać listę klientów łączących się starą wersją
    z dziennika maszyny. Na serwerze 2016 ta lista bywa dłuższa, niż spodziewa
    się zespół, i to jest jedyny sposób, żeby dowiedzieć się tego przed
    przerwą, a nie w jej trakcie.

    Zmiana działa po ponownym uruchomieniu maszyny. Odwrócenie również.
  en: |
    The class is "needs planned rollout", because this setting cuts off
    particular clients rather than an abstract risk.

    It will cut off anybody who connects to this machine's shares with the
    first version of the protocol alone. Typically those are multifunction
    devices, controllers of industrial equipment, embedded systems and
    workstations running systems many years old. Connections from newer systems
    are untouched, since they pick a higher version by themselves.

    The difference from the other two items in this group is practical and
    worth knowing. This entry concerns the receiving side alone - the machine
    can still connect outwards with the first version if the client driver is
    left on. If the aim is to close the matter, all three have to be done.

    Before the change it is worth gathering the list of clients connecting with
    the old version from the machine's log. On Server 2016 that list is often
    longer than the team expects, and it is the only way to learn this before
    the outage rather than during it.

    The change takes effect after the machine is restarted. So does undoing it.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
    - legacy-authentication
  what_breaks:
    pl:
      - Klienci łączący się z udziałami tej maszyny wyłącznie pierwszą wersją protokołu tracą dostęp
      - Urządzenia wielofunkcyjne, sterowniki przemysłowe i systemy wbudowane przestają zapisywać pliki na udziale
      - Połączenia z nowszych systemów działają bez zmian, bo wybierają wersję wyższą samoczynnie
      - Punkt dotyczy tylko strony przyjmującej, więc maszyna nadal łączy się starą wersją na zewnątrz
    en:
      - Clients connecting to this machine's shares with the first version alone lose access
      - Multifunction devices, industrial controllers and embedded systems stop writing files to the share
      - Connections from newer systems work unchanged, since they pick a higher version by themselves
      - The item covers the receiving side only, so the machine still connects outwards with the old version
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z udziałów tej maszyny korzystają urządzenia mówiące wyłącznie pierwszą wersją protokołu, a zamiennik nie został przygotowany
    en:
      - Devices that speak only the first version of the protocol use this machine's shares and no replacement has been prepared
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Zero switches the server side of the first protocol version off. An
      # absent value means the default, and the default leaves that side on, so
      # it is reported as a missing setting rather than as a good state.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'SMB1'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'SMB1'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the receiving side: what the machine accepts, not where it
    # connects. On this release it is on by default. The change takes effect
    # after a restart.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SMB1' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Pułapka odczytu: brak wpisu nie znaczy tu „wyłączone". Domyślnie ta strona
    protokołu jest włączona, więc brak wartości audyt zgłasza jako ustawienie
    brakujące, a nie jako stan dobry. To jest ta sama zasada co przy innych
    wpisach, których domyślna wartość idzie w stronę wygody.

    Klucz leży w gałęzi usługi, a nie w gałęzi zasad — przy cofaniu zmiany
    usuwana jest sama wartość, nigdy klucz, bo mieszkają w nim ustawienia
    niezwiązane z tą regułą.

    Punkt jest jednym z trzech opisujących tę samą wersję protokołu.
    Wyłączenie składnika systemu obejmuje wszystkie trzy strony naraz; ten
    wpis i sterownik klienta pozwalają rozdzielić stronę przyjmującą od
    łączącej się, gdy zamknięcie całości nie jest jeszcze możliwe.
  en: |
    A reading trap: a missing entry does not mean "off" here. By default this
    side of the protocol is on, so the audit reports a missing value as a
    missing setting rather than as a good state. That is the same principle as
    with other entries whose default leans towards convenience.

    The key lies in the service branch rather than the policy branch - undoing
    the change removes the value alone, never the key, because settings
    unrelated to this rule live in it.

    The item is one of three describing the same version of the protocol.
    Switching off the system component covers all three sides at once; this
    entry and the client driver make it possible to separate the receiving side
    from the connecting one, where closing the whole thing is not yet possible.
