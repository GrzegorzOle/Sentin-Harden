id: win10-bluetooth-support-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa obsługi łączności bezprzewodowej bliskiego zasięgu wyłączona
    en: The service backing wireless joining of short reach switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę obsługującą łączność bezprzewodową bliskiego
    zasięgu — tę, przez którą przyłącza się myszy, klawiatury, słuchawki
    i telefony.

    Zastrzeżenie wobec tej łączności nie dotyczy pojedynczej podatności,
    tylko samej jej natury. Jest to kanał bezprzewodowy przyjmujący
    połączenia z odległości kilku metrów, więc obejmuje wszystko, co
    znajduje się za ścianą, w sąsiednim pokoju albo na korytarzu.

    Zagrożenie pierwsze to urządzenia udające klawiaturę. Przyłączona tą
    drogą klawiatura wpisuje, co zechce, a system nie ma jak odróżnić
    naciśnięć ludzkich od wysłanych przez program.

    Zagrożenie drugie to parowanie. Procedura przyłączania bywa
    uproszczona do potwierdzenia albo krótkiego kodu, a kod bywa
    domyślny. Napastnik w zasięgu ma więc do pokonania barierę słabszą
    niż hasło.

    Zagrożenie trzecie to przenoszenie plików między maszyną a telefonem
    z pominięciem sieci, a więc i tego, co sieć kontroluje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    wchodzący działający z sąsiedniego pokoju, bez kabla i bez sieci.
  en: |
    The setting switches off the service backing the wireless joining of short reach - that by which mice,
    keyboards, listening pieces and telephones are attached.

    The reservation against that joining touches no single weakness but its very nature. It is a channel without
    wires taking joinings from a few paces off, so it takes in whatever stands behind a wall, in the next room or
    along the passage.

    The first danger is things feigning a keyboard. A keyboard attached by that road writes what it will, and the
    system has no means of telling the presses of a hand from those sent by a program.

    The second danger is the pairing. The manner of attaching is at times cut down to an assent or a short token,
    and the token is at times the one set by default. An attacker within reach has therefore a barrier weaker than
    a password to pass.

    The third danger is the carrying of files between the machine and a telephone with the network passed by, and
    so with whatever the network keeps watch over.

    What an attacker gains while the item goes unmet: a channel coming in that works from the next room, with no
    cable and no network.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest prosty: na części
    stanowisk tą drogą przyłączona jest mysz albo klawiatura.

    Miejscem pierwszym jest sprzęt wejściowy bez kabla. Zatrzymanie
    usługi odcina go natychmiast, więc osoba przy maszynie traci mysz
    i klawiaturę w tej samej chwili. Na stanowisku zdalnym oznacza to
    wezwanie kogoś z kablem.

    Miejscem drugim są słuchawki i zestawy do rozmów. Osoba prowadząca
    spotkania zauważy zmianę na pierwszym z nich.

    Miejscem trzecim są laptopy, w których łączność ta obsługuje także
    przyłączanie telefonu, przenoszenie plików i udostępnianie połączenia.

    Przed wdrożeniem trzeba sprawdzić, co jest przyłączone tą drogą.
    Jest to sprawdzenie krótkie, ale pominięcie go kończy się odcięciem
    użytkownika od własnego stanowiska.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: sieci przewodowej, sieci bezprzewodowej dalekiego
    zasięgu, drukowania, logowania, pracy programów.
  en: |
    The class is "needs a planned rollout", and the ground is plain: upon some stations a mouse or a keyboard is
    attached by that road.

    The first place is gear of entry without a cable. The stopping of the service cuts it off at once, so whoever
    is at the machine loses mouse and keyboard in that same hour. Upon a station reached from afar that means the
    calling of somebody with a cable.

    The second place is listening pieces and sets for speech. Whoever holds meetings will mark the change at the
    first of them.

    The third place is laptops in which that joining backs also the attaching of a telephone, the carrying of
    files and the sharing of a joining.

    Before the rollout it must be looked at what is attached by that road. It is a short looking, but its passing
    by ends in the cutting off of a user from their own station.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the network by cable, the wireless network of long reach, printing, logging on, or
    the work of programs.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Mysz i klawiatura przyłączone bez kabla przestaną działać w chwili zatrzymania usługi
      - Na stanowisku zdalnym oznacza to wezwanie kogoś ze sprzętem przewodowym na miejsce
      - Słuchawki i zestawy do rozmów przestaną się przyłączać, co widać na pierwszym spotkaniu
      - Na laptopach zniknie przyłączanie telefonu, przenoszenie plików tą drogą i udostępnianie połączenia
      - Sieć przewodowa, sieć bezprzewodowa dalekiego zasięgu, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - A mouse and a keyboard attached with no cable will cease to work the hour the service is stopped
      - Upon a station reached from afar that means the calling of somebody with corded gear to the place
      - Listening pieces and sets for speech will cease to attach, which is seen at the first meeting
      - Upon laptops there will go the attaching of a telephone, the carrying of files by that road and the sharing of a joining
      - The network by cable, the wireless network of long reach, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko obsługiwane jest myszą albo klawiaturą przyłączoną bez kabla
      - Praca opiera się na słuchawkach przyłączanych tą drogą albo na przenoszeniu plików z telefonu
    en:
      - The station is worked with a mouse or a keyboard attached with no cable
      - The work rests upon listening pieces attached by that road or upon the carrying of files from a telephone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\bthserv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A mouse or a keyboard attached without wires this way ceases to work the
    # moment the service stops.
    Stop-Service -Name 'bthserv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'bthserv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'bthserv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Reguła wymaga sprawdzenia przed wdrożeniem, i to sprawdzenia bardzo
    konkretnego: czy myszą i klawiaturą tego stanowiska nie jest sprzęt
    przyłączony właśnie tą drogą. Aplikacja powinna zapytać o to wprost,
    bo pomyłka odcina użytkownika od maszyny.

    Argument wart postawienia dotyczy natury kanału. Nie jest to
    podatność jednego urządzenia, tylko kanał wchodzący działający
    z sąsiedniego pokoju — bez kabla, bez sieci i bez niczego, co sieć
    kontroluje.

    Odnotowuję urządzenia udające klawiaturę jako zagrożenie warte
    osobnego zdania. Przyłączona tą drogą klawiatura wpisuje, co zechce,
    a system nie ma jak odróżnić naciśnięć ludzkich od wysłanych przez
    program.
  en: |
    The rule calls for a looking before the rollout, and a very particular one: whether the mouse and keyboard of
    this station are not gear attached by that very road. The application ought to ask it outright, a mistake
    cutting the user off from the machine.

    The argument worth putting touches the nature of the channel. It is no weakness of one thing but a channel
    coming in that works from the next room - with no cable, no network and nothing the network keeps watch over.

    I set down things feigning a keyboard as a danger worth a sentence apart. A keyboard attached by that road
    writes what it will, and the system has no means of telling the presses of a hand from those sent by a
    program.
