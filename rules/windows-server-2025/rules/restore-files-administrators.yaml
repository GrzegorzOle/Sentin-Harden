id: win2025-restore-files-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odtwarzanie plików tylko dla administratorów
    en: Restoring files restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo jest odpowiednikiem prawa do kopiowania, ale działa w drugą
    stronę: pozwala zapisać dowolny plik i dowolną gałąź rejestru
    z pominięciem uprawnień.

    Kierunek przesądza o wadze. Odczyt z pominięciem uprawnień oznacza
    ujawnienie danych; zapis oznacza zmianę stanu maszyny. Konto, które
    je ma, może nadpisać plik wykonywalny usługi systemowej, podmienić
    zawartość gałęzi rejestru przechowującej konfigurację uruchamiania
    i zapisać się do każdego katalogu, łącznie z katalogiem systemowym.

    Prawo niesie przy tym uprawnienie dodatkowe, mniej znane: pozwala
    przypisać plikowi właściciela dowolnego. Odtworzony plik może więc
    należeć do kogokolwiek, co zamyka drogę powrotną — po podmianie nie
    da się z samego pliku odczytać, kto tę podmianę wykonał.

    Na serwerze skutek jest natychmiastowy i rozciąga się dalej.
    Podmiana pliku usługi na serwerze zarządzającym innymi maszynami
    daje dostęp do wszystkich, a na kontrolerze domeny — do całego
    środowiska.

    Punkt nie każe prawa usunąć, tylko zawęzić do administratorów.
    Odtwarzanie z kopii musi na serwerze działać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis
    w dowolne miejsce na maszynie z pominięciem uprawnień, wraz
    z możliwością wskazania dowolnego właściciela zapisanego pliku.
  en: |
    The right is the counterpart of the right of copying but works the other way: it allows any
    file and any registry branch to be written while rights are passed over.

    The direction settles the weight. A reading that passes over rights means data laid open; a
    writing means the machine's state changed. An account holding it may overwrite a system
    service's executable file, swap the contents of a registry branch holding the configuration
    of starting, and write itself into every directory, the system's among them.

    The right carries at that a further power, less known: it allows any owner whatever to be
    set on a file. A restored file may thus belong to anybody, which shuts the road back -
    after a swap there is no reading from the file itself who made it.

    On a server the effect is immediate and stretches further. Swapping a service's file on a
    server that manages other machines gives access to them all, and on a domain controller -
    to a whole environment.

    The item does not bid the right be removed but narrowed to administrators. Restoring from a
    backup must work on a server.

    What an attacker gains while the item goes unmet: writing into any place on the machine
    while rights are passed over, together with the means of naming any owner whatever for the
    written file.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, na jakim koncie wykonuje się odtwarzanie
    z kopii zapasowej, bo zawężenie prawa przesądza, czy odtwarzanie
    będzie w ogóle możliwe.

    Na serwerze pytanie to jest realne. Oprogramowanie kopii zapasowych
    pracuje zwykle na koncie własnym, a konto to bywa umieszczone poza
    grupą administratorów.

    Skutek zawężenia jest jednak zupełnie inny niż przy prawie do
    kopiowania i to jest najważniejsze rozróżnienie w tej parze. Kopia
    wykonana bez uprawnień kończy się powodzeniem i po cichu pomija
    dane. Odtwarzanie wykonane bez uprawnień kończy się błędem
    i zatrzymuje.

    Objaw jest więc głośny, a nie cichy, i nie prowadzi do utraty
    danych. Prowadzi natomiast do przestoju w chwili, w której
    odtwarzanie jest potrzebne — czyli zwykle po awarii, pod presją
    czasu i bez możliwości spokojnego rozwiązywania problemu.

    Z tego powodu sprawdzenie konta agenta jest tu równie istotne jak
    przy kopiowaniu, choć z powodu odwrotnego: nie chodzi o wykrycie
    cichego braku, tylko o uniknięcie przestoju w najgorszym momencie.

    Odtwarzanie ręczne wykonywane przez administratora działa dalej bez
    zmiany.
  en: |
    What needs checking is what account restoring from a backup is done under, since narrowing
    the right settles whether restoring will be possible at all.

    On a server that question is real. Backup software usually works under an account of its
    own, and that account is at times placed outside the administrators' group.

    The effect of the narrowing is, though, altogether other than at the right of copying, and
    that is the weightiest distinction in this pair. A backup made without rights ends in
    success and quietly passes data over. A restoring done without rights ends in an error and
    halts.

    The symptom is thus loud rather than quiet, and leads to no loss of data. It leads instead
    to a standstill at the moment restoring is taken - that is, usually after a breakdown,
    under the press of time and with no room for solving a trouble calmly.

    For that reason checking the agent's account matters here as much as at the copying, though
    for the opposite reason: it is not about catching a quiet want but about avoiding a
    standstill at the worst moment.

    Restoring done by hand by an administrator goes on working unchanged.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - updates-and-servicing
  what_breaks:
    pl:
      - Odtwarzanie z kopii na koncie spoza grupy administratorów zakończy się błędem
      - Objaw jest głośny i nie prowadzi do utraty danych, tylko do przestoju
      - Przestój pojawia się po awarii, czyli w chwili najmniej dogodnej
      - Odtwarzanie ręczne wykonywane przez administratora działa dalej bez zmiany
    en:
      - Restoring from a backup under an account outside the administrators' group will end in an error
      - The symptom is loud and leads to no loss of data but to a standstill
      - The standstill comes after a breakdown, that is, at the least convenient moment
      - Restoring done by hand by an administrator goes on working unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Odtwarzanie z kopii wykonuje agent pracujący na koncie spoza grupy administratorów
      - Nie ustalono, na jakim koncie wykonuje się odtwarzanie na tym serwerze
    en:
      - Restoring from a backup is done by an agent working under an account outside the administrators' group
      - It has not been settled what account restoring is done under on this server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRestorePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRestorePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRestorePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/restore-files-and-directories

notes:
  pl: |
    Prawo daje zapis z pominięciem uprawnień, a przy okazji możliwość
    przypisania plikowi dowolnego właściciela. Ta druga własność jest
    mniej znana i to ona zamyka drogę powrotną przy dochodzeniu, kto
    plik podmienił.

    Objaw braku uprawnień jest tu odwrotny niż przy kopiowaniu:
    odtwarzanie zatrzymuje się z błędem, zamiast po cichu pomijać dane.
    Głośny objaw jest lepszy, ale wypada w chwili najgorszej z możliwych.

    Punkt czyta się razem z prawem kopiowania i z prawem przejmowania
    na własność. Wszystkie trzy bywają nadane temu samemu kontu
    usługowemu.
  en: |
    The right gives writing while rights are passed over, and along with it the means of
    setting any owner whatever on a file. That second property is less known, and it is what
    shuts the road back at an inquiry into who swapped a file.

    The symptom of a want of rights is here the reverse of the copying's: restoring halts with
    an error instead of quietly passing data over. A loud symptom is the better one, but it
    falls at the worst possible moment.

    The item is read together with the right of copying and the right of taking ownership. All
    three are at times granted to the same service account.
