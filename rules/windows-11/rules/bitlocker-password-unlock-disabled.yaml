id: win11-bitlocker-password-unlock-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Odblokowywanie dysków hasłem niedopuszczone
    en: Unlocking drives with a password inadmissible
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Zaszyfrowany dysk można odblokować kilkoma rodzajami zabezpieczenia: modułem
    sprzętowym, kodem podawanym przy starcie, kartą, kluczem na nośniku albo
    zwykłym hasłem. Rodzaje te nie są równoważne, mimo że w oknie kreatora
    stoją obok siebie.

    Hasło jest z tej listy najsłabsze i to z powodu, którego nie da się naprawić
    ustawieniem: jest jedyną rzeczą, jakiej napastnik z dyskiem w ręku
    potrzebuje, i jedyną, którą może zgadywać bez ograniczeń. Moduł sprzętowy
    opóźnia kolejne próby, karta wymaga przedmiotu, klucz na nośniku wymaga
    nośnika. Hasło wymaga wyłącznie czasu — a dysk wyjęty z komputera daje
    napastnikowi tyle czasu, ile zechce, i tyle maszyn do liczenia, ile ma.

    Odebranie tej możliwości sprawia, że każdy zaszyfrowany dysk na maszynie
    jest zabezpieczony czymś, czego nie da się odgadnąć na boku.
  en: |
    An encrypted drive can be unlocked by several kinds of protector: the hardware
    module, a code entered at startup, a card, a key on a medium, or a plain
    password. These kinds are not equivalent, although they stand side by side in
    the wizard's window.

    A password is the weakest on that list, for a reason no setting can fix: it is
    the only thing an attacker with the drive in hand needs, and the only one they
    can guess without limit. The hardware module delays successive attempts, a card
    calls for an object, a key on a medium calls for the medium. A password calls
    only for time - and a drive taken out of a computer gives the attacker as much
    time as they like and as many machines to compute with as they have.

    Taking that possibility away means every encrypted drive on the machine is
    guarded by something that cannot be guessed off to one side.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czym odblokowuje się dyski na stanowiskach — zwłaszcza
    nośniki wymienne.

    Na dysku systemowym i dyskach stałych hasło bywa rzadkie, bo naturalnym
    zabezpieczeniem jest moduł sprzętowy z kodem. Przy nośnikach wymiennych jest
    odwrotnie: hasło jest tam zabezpieczeniem najczęstszym, bo jedynym, które
    działa na cudzym komputerze.

    Po wdrożeniu punktu zaszyfrowanie nośnika wymiennego wymaga karty albo
    klucza, a więc czegoś, czego druga strona musi mieć i umieć użyć. Przekazanie
    zaszyfrowanego nośnika komuś spoza firmy przestaje być proste i trzeba to
    rozstrzygnąć przed wdrożeniem, a nie przy pierwszym zgłoszeniu.

    Nośniki zaszyfrowane wcześniej hasłem dalej otwierają się tym hasłem.
    Punkt dotyczy zakładania nowego zabezpieczenia, nie odbierania istniejących.

    Nie ma restartu. Zmiana obowiązuje przy następnym włączeniu szyfrowania.
  en: |
    What needs checking is what unlocks the drives at the stations - removable media
    above all.

    On the system drive and fixed drives a password tends to be rare, because the
    natural protector is the hardware module with a code. With removable media it is
    the other way round: a password is the commonest protector there, being the only
    one that works on somebody else's computer.

    After the item is applied, encrypting a removable medium calls for a card or a
    key, and so for something the other side has to hold and know how to use.
    Handing an encrypted medium to somebody outside the company stops being simple
    and has to be settled before the rollout, not at the first report.

    Media encrypted earlier with a password still open with that password. The item
    concerns setting up a new protector, not taking existing ones away.

    There is no restart. The change takes effect the next time encryption is
    switched on.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zaszyfrowanie nośnika wymiennego hasłem przestanie być możliwe i będzie wymagało karty albo klucza
      - Przekazanie zaszyfrowanego nośnika komuś spoza firmy wymaga uzgodnienia innego zabezpieczenia
      - Użytkownik przyzwyczajony do hasła na nośniku zobaczy kreator bez tej możliwości i zgłosi to jako usterkę
    en:
      - Encrypting a removable medium with a password stops being possible and will need a card or a key
      - Handing an encrypted medium to somebody outside the company needs another protector agreed
      - A user used to a password on a medium will see a wizard without that option and report it as a fault
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Przekazywanie zaszyfrowanych nośników poza firmę opiera się na haśle i nie uzgodniono zamiennika
      - Na stanowiskach nie wdrożono kart ani kodów startowych, więc odebranie hasła zostawia dyski bez możliwego zabezpieczenia
    en:
      - Handing encrypted media outside the company rests on a password and no replacement has been agreed
      - Cards and startup codes have not been rolled out at the stations, so taking the password away leaves the drives with no usable protector
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. All three have to
      # be at zero, and whichever differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $names = @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $names) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne 0) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'ALL_DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_DISABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    foreach ($name in @('OSPassphrase', 'FDVPassphrase', 'RDVPassphrase')) {
      Set-ItemProperty -Path $path -Name $name -Value 0 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Hasło odblokowujące dysk to nie to samo co kod podawany przy starcie, mimo
    podobnej roli. Kod chroni moduł sprzętowy i dziedziczy jego opóźnienia przy
    kolejnych próbach; hasło jest zabezpieczeniem samodzielnym, bez żadnego
    układu ograniczającego zgadywanie. Punkt odbiera to drugie i nie dotyczy
    pierwszego.

    Dysk systemowy na maszynie bez modułu sprzętowego nie da się po wdrożeniu
    zaszyfrować bez klucza na nośniku. Jest to skutek zamierzony i spójny
    z punktem wymagającym modułu, ale warto o nim wiedzieć, jeśli w parku
    maszyn są egzemplarze bez modułu.
  en: |
    A password unlocking a drive is not the same as a code entered at startup,
    despite the similar role. The code guards the hardware module and inherits its
    delays between attempts; a password is a protector on its own, with no circuit
    limiting guessing. The item takes the latter away and does not concern the
    former.

    After the rollout, the system drive on a machine without the hardware module
    cannot be encrypted without a key on a medium. That is an intended consequence,
    consistent with the item requiring the module, but worth knowing if there are
    units without one in the fleet.
