id: win2025-blank-password-console-only

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta z pustym hasłem wyłącznie przy konsoli
    en: Accounts with a blank password at the console alone
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje logowania z sieci na konta lokalne, które nie mają
    ustawionego hasła. Takie konto pozostaje użyteczne przy klawiaturze
    serwera, ale przestaje być użyteczne z zewnątrz.

    Rozdzielenie tych dwóch dróg jest tu całym sensem punktu. Konto bez
    hasła przy konsoli wymaga dostępu fizycznego do maszyny, a więc
    wejścia do pomieszczenia, w którym ona stoi. To samo konto dostępne
    z sieci nie wymaga niczego.

    Na serwerze konta bez hasła nie powinno być w ogóle, i zwykle nie ma.
    Powstaje jednak w sposób, którego nikt nie planuje: przy zakładaniu
    konta testowego, przy tworzeniu konta przez skrypt, który hasła nie
    ustawił, albo przy koncie usługowym założonym „na chwilę". Żadne z nich
    nie jest wpisane w dokumentację i żadne nie zostanie odnalezione
    przeglądem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: logowanie
    z sieci na dowolne takie konto, jeżeli istnieje. Wartość tego punktu
    polega właśnie na tym, że chroni przed kontem, o którego istnieniu nikt
    nie wie.
  en: |
    The setting bans signing in from the network to local accounts that have no password
    set. Such an account stays of use at the server's keyboard but stops being of use from
    outside.

    Telling those two roads apart is the item's whole sense. An account with no password at
    the console takes physical access to the machine, and so entry into the room it stands
    in. That same account reachable from the network takes nothing.

    On a server an account with no password ought not to be there at all, and usually is
    not. It arises, though, in a way nobody plans: at the setting up of a test account, at
    the making of an account by a script that set no password, or at a service account set
    up "for a moment". None of them is written into the documentation and none will be found
    by a review.

    What an attacker gains while the item goes unmet: signing in from the network to any
    such account, if one exists. This item's worth lies exactly in that it guards against an
    account nobody knows exists.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy jakiekolwiek konto lokalne na tym serwerze
    nie ma hasła — bo tylko wtedy zmiana cokolwiek zmienia.

    W większości instalacji takiego konta nie ma i wdrożenie przechodzi
    niezauważone. Ustawienie jest w nowych systemach włączone domyślnie,
    więc wynik niespełniony oznacza zwykle wyłączenie ręczne, wykonane
    kiedyś w konkretnym celu. Warto ten cel ustalić przed zmianą, bo jest
    duża szansa, że nadal obowiązuje.

    Gdy konto bez hasła istnieje i jest używane z sieci, zmiana odetnie je
    natychmiast. Objawem jest odmowa dostępu przy połączeniu do udziału,
    przy zarządzaniu zdalnym albo przy pulpicie zdalnym. Logowanie przy
    klawiaturze serwera działa dalej bez zmiany.

    Właściwym domknięciem tej reguły nie jest samo ustawienie, tylko
    odszukanie kont bez hasła i ustawienie im haseł albo ich usunięcie.
    Reguła zamyka drogę, ale konta zostawia — i tego drugiego kroku
    nie wykonuje za nikogo.

    Zmiana wymaga restartu, żeby objęła wszystkie drogi logowania.
  en: |
    What needs checking is whether any local account on this server has no password - since
    only then does the change change anything.

    In most installations there is no such account and the rollout passes unnoticed. The
    setting is switched on by default in new systems, so an unmet result usually means a
    switching off by hand, done once for a definite purpose. It is worth establishing that
    purpose before the change, since there is a fair chance it still holds.

    Where an account with no password exists and is used from the network, the change will
    cut it off at once. The symptom is access being denied at a connection to a share, at
    remote management or at the remote desktop. Signing in at the server's keyboard goes on
    working unchanged.

    The right completion of this rule is not the setting itself but the tracking down of
    accounts with no password and the setting of passwords for them or their removal. The
    rule closes the road but leaves the accounts - and that second step it takes for nobody.

    The change takes a restart so that it reaches every road of signing in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - remote-management
    - remote-desktop
  what_breaks:
    pl:
      - Konta lokalne bez hasła przestają się logować z sieci
      - Połączenie do udziału na takie konto kończy się odmową dostępu
      - Logowanie przy klawiaturze serwera działa bez zmiany
      - Konta bez hasła nie znikają — reguła zamyka drogę, nie usuwa konta
    en:
      - Local accounts with no password stop signing in from the network
      - A connection to a share on such an account ends in denied access
      - Signing in at the server's keyboard works unchanged
      - Accounts with no password do not vanish - the rule closes the road, it does not remove the account
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze działa celowo konto lokalne bez hasła używane z sieci
    en:
      - A local account with no password used from the network works deliberately on the server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LimitBlankPasswordUse'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'LimitBlankPasswordUse' -ErrorAction SilentlyContinue).'LimitBlankPasswordUse'
    [pscustomobject]@{
      path        = $path
      name        = 'LimitBlankPasswordUse'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitBlankPasswordUse' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-limit-local-account-use-of-blank-passwords-to-console-logon-only

notes:
  pl: |
    Ustawienie obejmuje wyłącznie konta lokalne. Konta domenowe podlegają
    zasadom domeny i ten punkt ich nie dotyczy, niezależnie od roli serwera.

    Klucz rejestru istnieje na każdej instalacji, więc wynik „MISSING"
    oznacza usunięcie wartości, a nie system bez tego mechanizmu. Stan
    domyślny po usunięciu wartości jest taki jak przy jedynce, ale opieranie
    się na domyśle zamiast na zapisie jest dokładnie tym, czemu audyt
    zgodności ma zapobiegać.

    Reguła nie szuka kont bez hasła i nie potrafi powiedzieć, czy takie
    na serwerze są. Odpowiedź na to pytanie wymaga przeglądu kont, który
    jest osobnym krokiem — i to on rozstrzyga, czy ten punkt jest
    formalnością, czy realną zmianą.
  en: |
    The setting takes in local accounts alone. Domain accounts fall under the domain's
    policies and this item does not concern them, whatever the server's role.

    The registry key exists on every installation, so a "MISSING" result means the value was
    removed rather than a system without this mechanism. The default state after the value
    is removed is as with one, but resting on a default rather than on a record is exactly
    what a compliance audit is to prevent.

    The rule does not look for accounts with no password and cannot say whether there are
    any on the server. Answering that takes a review of the accounts, which is a separate
    step - and it is that step which settles whether this item is a formality or a real
    change.
