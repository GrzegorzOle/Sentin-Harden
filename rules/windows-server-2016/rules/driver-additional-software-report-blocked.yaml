id: win2016-driver-additional-software-report-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zgłaszanie prośby sterownika o dodatkowe oprogramowanie wyłączone
    en: The reporting of a driver's request for additional software switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania wysyłać do producenta systemu zgłoszenie o tym, że
    zainstalowany sterownik prosi o doinstalowanie dodatkowego
    oprogramowania.

    Sytuacja, której to dotyczy, jest częstsza, niż wygląda. Sterownik
    urządzenia bywa tylko częścią tego, co wytwórca przewidział — resztą
    jest panel sterowania urządzeniem, narzędzie kalibracyjne albo usługa
    towarzysząca. Sterownik zgłasza wtedy, że sam nie wystarczy, a system
    odnotowuje to zgłoszenie i wysyła je dalej.

    Treść zgłoszenia mówi o sprzęcie i o oprogramowaniu, które wytwórca
    przypisał do niego. Jest to, tak jak przy regule sąsiedniej, wykaz
    tego, co przy maszynie stoi — tyle że dokładniejszy, bo obejmuje także
    warstwę oprogramowania.

    Wartość punktu leży w tym samym, co tam: w powstrzymaniu maszyny od
    relacjonowania na zewnątrz tego, co dzieje się przy niej fizycznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: praktycznie
    nic bezpośrednio; poza organizację wychodzi natomiast wykaz sprzętu
    i przypisanego mu oprogramowania.
  en: |
    The setting forbids a report to be sent to the system's maker saying that an installed
    driver asks for additional software to be installed.

    The situation it concerns is commoner than it looks. A device's driver is at times only
    part of what the maker foresaw - the rest being a control panel for the device, a
    calibration tool or an attendant service. The driver then reports that it does not suffice
    by itself, and the system records that report and sends it on.

    The report's contents speak of hardware and of the software the maker assigned to it. It
    is, as at the neighbouring rule, a register of what stands by the machine - only a more
    exact one, taking in the software layer as well.

    The item's worth lies in the same as there: in keeping the machine from relating outward
    what happens at it physically.

    What an attacker gains while the item goes unmet: practically nothing directly; what leaves
    the organisation, however, is a register of hardware and of the software assigned to it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zgłoszenie nie bierze udziału w instalowaniu czegokolwiek. Sterownik
    prosi o dodatkowe oprogramowanie i ta prośba jest widoczna na maszynie
    tak samo jak przedtem — blokowane jest wyłącznie jej wysłanie na
    zewnątrz.

    Rozróżnienie to jest tu ważniejsze niż przy regule sąsiedniej, bo nazwa
    brzmi tak, jakby reguła blokowała samo doinstalowanie. Nie blokuje.
    Kto chce doinstalować panel urządzenia, robi to tak jak przedtem.

    Skutek dla użytkownika jest żaden.

    Bez restartu, natychmiast odwracalne. Nie ma znanych regresji.

    Czego to nie psuje: instalowania sterowników i oprogramowania
    towarzyszącego, działania urządzeń, usług, sieci, uwierzytelniania.
  en: |
    The class is "no disruption".

    The report takes no part in the installing of anything. The driver asks for additional
    software and that request is as visible on the machine as before - what is blocked is
    solely its sending outward.

    That distinction matters more here than at the neighbouring rule, the name sounding as
    though the rule blocked the installing itself. It does not. Whoever would install a
    device's panel does so as before.

    The consequence for the user is none.

    No restart, undone immediately. There are no known regressions.

    What this does not break: the installing of drivers and attendant software, the working of
    devices, services, the network, or authentication.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Prośba sterownika o dodatkowe oprogramowanie pozostaje widoczna na maszynie - blokowane jest wyłącznie jej wysłanie na zewnątrz
      - Doinstalowanie panelu urządzenia albo narzędzia kalibracyjnego działa tak jak przedtem, mimo że nazwa ustawienia sugeruje inaczej
      - Działanie urządzeń już zainstalowanych nie zmienia się w żaden sposób
      - Instalowanie sterowników, usługi, sieć i uwierzytelnianie pozostają bez zmian
    en:
      - A driver's request for additional software stays visible on the machine - what is blocked is solely its sending outward
      - Installing a device's panel or a calibration tool works as before, though the setting's name suggests otherwise
      - The working of devices already installed does not change in any way
      - The installing of drivers, services, the network and authentication stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Producent systemu prowadzi dla tej organizacji dochodzenie w sprawie sprzętu wymagającego dodatkowego oprogramowania
    en:
      - The system's maker is tracing hardware calling for additional software for this organisation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'DisableSendRequestAdditionalSoftwareToWER'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'DisableSendRequestAdditionalSoftwareToWER'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSendRequestAdditionalSoftwareToWER' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

notes:
  pl: |
    Punkt jest bliźniaczy wobec reguły o braku sterownika i oba warto
    pokazywać razem — także dlatego, że oba niosą to samo nieporozumienie
    językowe. Nazwy mówią o sterownikach i o oprogramowaniu, a reguły
    dotyczą wyłącznie zgłoszeń.

    Warto przy tej parze odnotować rzecz ogólniejszą o nazewnictwie
    ustawień. Wpisy te noszą nazwy opisujące czynność zakazywaną, a nie
    stan pożądany, i do tego czynność opisaną z punktu widzenia systemu,
    nie użytkownika. Aplikacja, która przepisuje takie nazwy wprost,
    przenosi nieporozumienie razem z nimi — dlatego tytuły obu reguł mówią
    o zgłaszaniu, a nie o sterowniku.

    Wdrożenie obu naraz jest oczywiste i warto je podpowiedzieć wprost
    w trybie zbiorczym. Osobno nie mają sensu: wykaz sprzętu wychodzący
    jedną z dwóch dróg jest tym samym wykazem.
  en: |
    The item is a twin of the rule about a missing driver and both are worth showing together -
    also because both carry the same misunderstanding of language. The names speak of drivers
    and of software, and the rules concern reports alone.

    At this pair it is worth noting something more general about the naming of settings. Those
    entries bear names describing the act forbidden rather than the state wanted, and describing
    it besides from the system's point of view, not the user's. An application transcribing such
    names outright carries the misunderstanding along with them - which is why both rules'
    titles speak of reporting and not of a driver.

    Rolling both out at once is obvious and worth suggesting outright in bulk mode. Apart they
    make no sense: a register of hardware leaving by one of two roads is the same register.
