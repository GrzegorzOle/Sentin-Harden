id: win2016-appx-trusted-apps-sideload-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie aplikacji pakowanych poza sklepem zablokowane
    en: Installing packaged applications outside the store blocked
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje instalowanie aplikacji pakowanych z pominięciem
    sklepu, czyli wprost z pliku pakietu.

    Rzecz, o którą tu chodzi, sprowadza się do tego, kto ręczy za
    instalowany kod. Pakiet pobrany ze sklepu przeszedł przez sprawdzenie
    po stronie prowadzącego sklep. Pakiet zainstalowany wprost z pliku nie
    przeszedł przez nic poza sprawdzeniem podpisu — a podpis mówi tylko,
    że pakiet nie zmienił się po podpisaniu, nie zaś że podpisujący jest
    godny zaufania.

    Droga ta jest przy tym wygodna dla kogoś, kto już ma dostęp do maszyny.
    Instalacja pakietu wygląda jak czynność zwykła, tworzy trwałą obecność
    w systemie i nie wymaga praw administratora w każdej konfiguracji.

    Na serwerze droga ta zwykle nie ma zastosowania, bo aplikacje pakowane
    nie są tam sposobem dostarczania oprogramowania. Tam, gdzie jednak są,
    punkt wymaga rozważenia, a nie odruchowego wykonania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wbudowaną
    drogę zainstalowania własnego kodu jako zwykłej aplikacji, bez pytania
    kogokolwiek o zgodę.
  en: |
    The setting blocks the installing of packaged applications with the store passed over, which is to
    say straight from a package file.

    The matter here comes down to who vouches for the installed code. A package fetched from the store
    has passed a checking on the side of whoever keeps the store. A package installed straight from a
    file has passed nothing beyond a check of its signature - and a signature says only that the package
    has not changed since the signing, not that the signer is worthy of trust.

    That road is besides a convenient one for somebody who already has access to the machine. Installing
    a package looks like an ordinary act, makes a lasting presence within the system, and does not call
    for administrative rights in every arrangement.

    On a server that road is as a rule of no use, packaged applications not being there a way of
    delivering software. Where they are, though, the item calls for weighing rather than for a reflexive
    carrying out.

    What an attacker gains while the item goes unmet: a built-in road for installing their own code as an
    ordinary application, asking nobody's leave.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy sposobu dostarczania
    oprogramowania na tę maszynę.

    Pytanie zasadnicze brzmi: czy cokolwiek, co tu stoi, przychodzi jako
    pakiet instalowany poza sklepem. Dotyczy to aplikacji pisanych na
    zamówienie, narzędzi wewnętrznych i rozwiązań dostarczanych przez
    producenta sprzętu.

    Objaw nieudanego wdrożenia jest mylący i warto go zapowiedzieć.
    Instalacja kończy się niepowodzeniem, ale komunikat mówi o certyfikacie
    albo o zaufaniu do wydawcy, a nie o zasadzie, która instalację
    zablokowała. Prowadzi to do szukania przyczyny po stronie podpisu
    i do prób podpisania pakietu na nowo, co niczego nie zmienia.

    Rzecz druga: zmiana nie dotyczy aplikacji już zainstalowanych. Te
    działają dalej i dają się uruchamiać. Zablokowana jest instalacja
    nowych i ponowna instalacja istniejących, a więc również aktualizacja
    dostarczana w ten sposób.

    Czego to nie psuje: aplikacji już zainstalowanych, instalatorów
    klasycznych, aplikacji pobieranych ze sklepu, ról, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the way software is delivered to this machine.

    The cardinal question runs: does anything standing here come as a package installed outside the
    store. That touches applications written to order, tools of one's own making and solutions delivered
    by the hardware's maker.

    The symptom of a failed rollout is misleading and worth announcing. The installation ends in failure,
    but the message speaks of a certificate or of trust in the publisher rather than of the policy that
    blocked it. That leads to the cause being looked for on the side of the signature and to attempts at
    signing the package anew, which changes nothing.

    The second matter: the change does not concern applications already installed. Those work on and can
    be started. What is blocked is the installing of new ones and the reinstalling of existing ones, and
    so also an update delivered that way.

    What this does not break: applications already installed, classic installers, applications fetched
    from the store, roles, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja aplikacji dostarczanej jako pakiet poza sklepem kończy się niepowodzeniem
      - Komunikat mówi o certyfikacie albo o zaufaniu do wydawcy, a nie o zasadzie, która instalację zablokowała
      - Aktualizacja dostarczana tą drogą przestaje dochodzić, bo jest ponowną instalacją pakietu
      - Aplikacje już zainstalowane działają dalej i dają się uruchamiać
      - Instalatory klasyczne, aplikacje ze sklepu, role i usługi pozostają bez zmian
    en:
      - The installing of an application delivered as a package outside the store ends in failure
      - The message speaks of a certificate or of trust in the publisher rather than of the policy that blocked it
      - An update delivered by that road ceases to arrive, being a reinstalling of the package
      - Applications already installed work on and can be started
      - Classic installers, applications from the store, roles and services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie pisane na zamówienie albo narzędzie wewnętrzne przychodzi na tę maszynę jako pakiet instalowany poza sklepem
      - Producent sprzętu dostarcza tą drogą narzędzia obsługujące urządzenia tej maszyny
      - Nie ustalono, czym są dostarczane aktualizacje aplikacji pakowanych używanych na tej maszynie
    en:
      - Software written to order or a tool of one's own making comes to this machine as a package installed outside the store
      - The hardware's maker delivers by that road the tools attending this machine's devices
      - It has not been established what delivers the updates of the packaged applications used on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      $name = 'AllowAllTrustedApps'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowAllTrustedApps'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish first whether anything on this machine is delivered as a package
    # installed outside the store. If so, the next delivery will fail and the
    # message will speak of a certificate rather than of a policy.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowAllTrustedApps' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/sideload-apps-in-windows-10

notes:
  pl: |
    Punkt jest w tym bloku pierwszym o realnej wadze i warto go pokazywać
    osobno od trójki o platformie rozrywkowej, mimo że leży obok niej
    w benchmarku. Tamte dotyczą kodu bez zadania; ten dotyczy tego, jak kod
    w ogóle trafia na maszynę.

    Ostrzeżenie o mylącym komunikacie jest przy tej regule treścią. Zasada
    blokująca instalację zgłasza się jako kłopot z certyfikatem, więc
    pierwsza hipoteza prowadzi w złą stronę i bywa drążona długo. Jedno
    zdanie w opisie oszczędza tu godziny.

    Rozróżnienie między instalacją nową a już zainstalowaną aplikacją jest
    drugą rzeczą wartą pokazania. Obawa, że punkt zatrzyma działające
    aplikacje, jest bezpodstawna, ale obawa, że zatrzyma ich aktualizacje,
    jest zasadna — i to właśnie ta druga bywa przeoczona.

    Poziom drugi odzwierciedla to, że w środowiskach dostarczających
    oprogramowanie pakietami punkt jest niewykonalny. Odpuszczenie go
    z zapisanym uzasadnieniem jest wtedy wynikiem prawidłowym.
  en: |
    The item is in this block the first of real weight and is worth showing apart from the three about the
    entertainment platform, though it lies beside them in the benchmark. Those concern code without a
    task; this one concerns how code reaches the machine at all.

    The warning about the misleading message is at this rule the substance. A policy blocking the
    installation reports itself as trouble with a certificate, so the first hypothesis leads the wrong way
    and is at times worked at long. One sentence in the description spares hours here.

    The distinction between a new installation and an application already installed is the second thing
    worth showing. The fear that the item will stop working applications is groundless, but the fear that
    it will stop their updates is well founded - and it is that second which is at times overlooked.

    Level two reflects that in surroundings delivering software by packages the item is not feasible.
    Letting it go with a written justification is then a proper outcome.
