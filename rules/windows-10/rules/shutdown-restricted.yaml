id: win10-shutdown-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zamykanie systemu ograniczone do administratorów i użytkowników
    en: The shutting down of the system bounded to administrators and users
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo zamykania systemu przy maszynie do
    administratorów i grupy użytkowników.

    Prawo to obejmuje wyłączenie i ponowne uruchomienie maszyny wykonane
    przez osobę przy niej siedzącą. Wymaga obecności, więc zakres jego
    nadużycia jest z natury wąski.

    Wartość punktu jest porządkowa i warto to powiedzieć wprost.
    Ograniczenie wykazu nie zamyka żadnej drogi ataku, bo osoba stojąca
    przy maszynie i tak może ją wyłączyć przyciskiem albo odciąć zasilanie.
    Sensem jest to, żeby konta usługowe i konta gości nie miały tego prawa
    przypadkiem — a nie to, żeby powstrzymać kogoś przed wyłączeniem
    maszyny.

    Odnotowuję jedno zastosowanie mniej oczywiste. Konto usługowe, które
    może zamknąć maszynę, może to zrobić zdalnie przez uruchomione przez
    siebie zadanie — i wtedy obecność przy maszynie przestaje być
    warunkiem. Wykaz zamknięty odbiera tę możliwość.

    Sprawdzenie przyjmuje wykaz zawężony do samych administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyłączenia maszyny kontem, które do pracy przy niej nie służy.
  en: |
    The setting bounds the right of shutting down the system at the machine to the administrators and to the group
    of the users.

    That right holds the switching off and the starting anew of the machine done by the person sitting at it. It
    calls for a being present, so the reach of its misuse is by nature narrow.

    The item's worth is one of order and that is worth saying outright. The bounding of the list shuts no road of
    attack, a person standing at the machine being able in any case to switch it off by the button or cut the
    power. The sense of it is that service accounts and accounts of guests should not hold this right by chance -
    and not that somebody should be held back from switching the machine off.

    I set down one use the less plain. A service account that may shut the machine down may do so from afar
    through a task it has itself started - and then the being present at the machine ceases to be the condition. A
    shut list takes that chance away.

    The check takes a list narrowed to the administrators alone.

    What an attacker gains while the item goes unmet: the switching off of the machine by an account that serves
    no work at it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Domyślny wykaz odpowiada już wymaganiu i na stanowisku roboczym zmiana
    jest zapisem stanu.

    Odnotowuję jedyne miejsce warte spojrzenia: konta wbudowane stanowisk
    współdzielonych umieszczone poza grupą użytkowników. Osoba przy takim
    stanowisku straci pozycję zamykania w menu i będzie musiała wyłączyć
    maszynę przyciskiem, co przy wyłączeniu nieuporządkowanym bywa
    kłopotliwe.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: pracy z programami, logowania, dostępu do plików,
    dostępu do zasobów sieciowych, drukowania.
  en: |
    The class is "no disruption".

    The default list already answers the requirement, and upon a working station the change is a setting down of a
    state.

    I set down the one place worth a look: built-in accounts of shared stations set outside the group of the
    users. The person at such a station will lose the entry for shutting down in the menu and will have to switch
    the machine off by the button, which at an unordered switching off is at times troublesome.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: work with programs, logging on, the way to files, the way to resources upon the
    network, or printing.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Konta wbudowane stanowisk współdzielonych spoza grupy użytkowników stracą pozycję zamykania w menu
      - Osoba przy takim stanowisku będzie wyłączać maszynę przyciskiem, co daje wyłączenie nieuporządkowane
      - Domyślny wykaz odpowiada już wymaganiu, więc na stanowisku roboczym zmiana jest zapisem stanu
      - Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo
      - Praca z programami, logowanie, dostęp do plików, dostęp do zasobów sieciowych i drukowanie pozostają bez zmian
    en:
      - Built-in accounts of shared stations from outside the group of the users will lose the entry for shutting down in the menu
      - The person at such a station will switch the machine off by the button, which gives an unordered switching off
      - The default list already answers the requirement, so upon a working station the change is a setting down of a state
      - The consequence shows at the next signing in of an account that loses the right
      - Work with programs, logging on, the way to files, the way to resources and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko współdzielone działa na koncie wbudowanym spoza grupy użytkowników i bywa wyłączane przez obsługę
    en:
      - A shared station works upon a built-in account from outside the group of the users and is at times switched off by its keepers
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeShutdownPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544,S-1-5-32-545|S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeShutdownPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeShutdownPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the administrators and to the users. A list narrower than
    # that meets the item too.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeShutdownPrivilege = *S-1-5-32-544,*S-1-5-32-545',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeShutdownPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/shut-down-the-system

notes:
  pl: |
    Reguła jest oceniona najniżej w całym bloku przywilejów i warto, żeby
    aplikacja powiedziała to wprost, zamiast podnosić jej wagę do
    poziomu sąsiadów w wykazie. Wartość jest porządkowa: chodzi o to, żeby
    konta, które nie służą do pracy przy maszynie, nie miały praw pracy
    przy maszynie.

    Argument wart zachowania dotyczy granicy skuteczności. Osoba stojąca
    przy maszynie wyłączy ją przyciskiem albo odetnie zasilanie,
    niezależnie od zasady. Punkt ten nie powstrzyma nikogo obecnego
    fizycznie i aplikacja nie powinna sugerować, że powstrzymuje.

    Odnotowuję zastosowanie mniej oczywiste, bo to ono nadaje punktowi
    sens. Konto usługowe z tym prawem może zamknąć maszynę przez zadanie
    uruchomione zdalnie — obecność przy maszynie przestaje być wtedy
    warunkiem. Jest to jedyna droga, którą ten punkt faktycznie zamyka.
  en: |
    The rule is graded the lowest of the whole block of privileges, and it is well that the application say so
    outright rather than raise its weight to the level of its neighbours in the list. The worth is one of order:
    what is meant is that accounts which serve no work at the machine should not hold the rights of work at the
    machine.

    The argument worth keeping touches the bound of its working. A person standing at the machine will switch it
    off by the button or cut the power, whatever the policy. This item will hold back nobody bodily present and
    the application ought not to hint that it does.

    I set down the use the less plain, that being what gives the item its sense. A service account with this right
    may shut the machine down through a task started from afar - the being present at the machine ceasing then to
    be the condition. It is the one road this item truly shuts.
