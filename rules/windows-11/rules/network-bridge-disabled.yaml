id: win11-network-bridge-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Tworzenie mostka sieciowego zabronione
    en: Creating a network bridge forbidden
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Mostek sieciowy łączy dwie karty sieciowe maszyny w jedną sieć na poziomie
    niższym niż adresowanie. Maszyna przestaje być wtedy punktem końcowym
    i zaczyna być odcinkiem kabla: ruch przechodzi przez nią w obie strony,
    bez tłumaczenia adresów i bez żadnego rozdzielenia.

    Skutek jest poważniejszy niż przy udostępnianiu połączenia. Mostek zestawiony
    między siecią firmową a siecią po drugiej stronie — domową, gościnną,
    komórkową, laboratoryjną — scala je w jedno. Wszystko, co po tamtej stronie,
    znajduje się w sieci firmowej tak samo, jakby wpięto je do gniazdka
    w ścianie. Rozdzielenie sieci na strefy, o które ktoś się starał, przestaje
    istnieć w jednym punkcie i nikt tego nie widzi.

    Jest to najkrótsza znana droga z sieci niezaufanej do zaufanej i nie wymaga
    żadnego narzędzia — mostek zestawia się z menu kontekstowego dwóch
    zaznaczonych połączeń.
  en: |
    A network bridge joins two of the machine's network cards into one network at a
    level below addressing. The machine then stops being an endpoint and becomes a
    length of cable: traffic passes through it both ways, with no address
    translation and no separation at all.

    The effect is graver than with connection sharing. A bridge set up between the
    company network and the network on the other side - home, guest, mobile,
    laboratory - merges them into one. Everything on that side is on the company
    network exactly as if it had been plugged into a socket in the wall. The
    division of the network into zones somebody worked for ceases to exist at one
    point, and nobody sees it.

    It is the shortest known road from an untrusted network to a trusted one and
    needs no tooling at all - a bridge is set up from the context menu of two
    selected connections.

disruption_description:
  pl: |
    Nic nie przestaje działać w pracy biurowej. Mostek sieciowy nie jest funkcją
    używaną przy zwykłych zadaniach i na stanowisku z jedną kartą sieciową nie
    da się go nawet zestawić.

    Zmiana odetnie zastosowania, w których mostek zestawiano świadomie: stanowiska
    laboratoryjne łączące segment testowy z firmowym, maszyny z uruchomionymi
    maszynami wirtualnymi w konfiguracji wymagającej mostka po stronie systemu
    oraz stanowiska serwisowe podpinające sprzęt klienta. Objawem jest brak
    pozycji tworzenia mostka w menu połączeń sieciowych.

    Mostek już istniejący przestaje dać się utworzyć na nowo, ale wdrożenie
    punktu nie usuwa go automatycznie — usunięcie istniejącego mostka jest
    osobną czynnością i reguła jej nie wykonuje.

    Wirtualizacja w typowej postaci tego nie dotyczy: przełączniki wirtualne
    zestawiane przez oprogramowanie do wirtualizacji nie są mostkiem w rozumieniu
    tego punktu.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    Nothing stops working in office use. A network bridge is not a function used in
    ordinary tasks, and on a station with one network card it cannot even be set
    up.

    The change will cut off the uses where a bridge was set up deliberately:
    laboratory stations joining a test segment to the company one, machines running
    virtual machines in a configuration needing a bridge on the system's side, and
    service stations hooking up a client's hardware. The symptom is a missing
    bridge-creation item in the network connections menu.

    A bridge that already exists can no longer be created anew, but applying the
    item does not remove it automatically - removing an existing bridge is a
    separate task and the rule does not perform it.

    Virtualization in its usual form is not affected: the virtual switches set up
    by virtualization software are not a bridge in the sense of this item.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - virtualization-and-containers
  what_breaks:
    pl:
      - Tworzenie mostka sieciowego przestanie być możliwe i pozycja zniknie z menu połączeń
      - Stanowiska laboratoryjne i serwisowe łączące dwa segmenty przez mostek stracą tę możliwość
    en:
      - Creating a network bridge stops being possible and the item disappears from the connections menu
      - Laboratory and service stations joining two segments through a bridge lose that ability
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko laboratoryjne albo serwisowe zestawia mostek między segmentem testowym a siecią, a rozdzielenie jest zapewnione inaczej
    en:
      - A laboratory or service station sets up a bridge between a test segment and the network, and separation is provided by other means
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_AllowNetBridge_NLA'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_AllowNetBridge_NLA'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_AllowNetBridge_NLA' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-networkisolation

notes:
  pl: |
    Reguła sprawdza zakaz tworzenia, nie obecność mostka. Wynik „spełniony" nie
    znaczy, że mostka na maszynie nie ma — znaczy, że nie da się utworzyć
    nowego. Sprawdzenie, czy jakiś istnieje, jest osobną czynnością i nie należy
    zieleni w tym punkcie czytać jako potwierdzenia, że sieci nie są połączone.

    Punkt tworzy parę z zakazem udostępniania połączenia. Oba zamykają drogę
    z sieci niezaufanej do firmowej, ale na różnych poziomach: tamten przepuszcza
    ruch z tłumaczeniem adresów, ten scala sieci bez żadnego rozdzielenia. Mostek
    jest groźniejszy i dlatego wart osobnego opisu, mimo że oba wdraża się razem.
  en: |
    The rule checks the ban on creating, not the presence of a bridge. A result of
    "met" does not mean there is no bridge on the machine - it means no new one can
    be created. Checking whether one exists is a separate task, and green here
    should not be read as confirmation that the networks are not joined.

    The item pairs with the ban on connection sharing. Both close a road from an
    untrusted network to the company one, but at different levels: that one passes
    traffic with address translation, this one merges the networks with no
    separation at all. A bridge is the graver of the two and so deserves a separate
    description, although both are applied together.
