id: win2016-builtin-guest-renamed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto gościa przemianowane
    en: The built-in guest account renamed
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby wbudowane konto gościa nosiło nazwę inną niż domyślna.

    Kategoria niska i mówię to wprost, bo ten punkt jest wyraźnie słabszy od
    swojego sąsiada. Konto gościa powinno być przede wszystkim wyłączone —
    i to tamta reguła zamyka drogę. Przemianowanie samo w sobie nie odbiera
    nikomu dostępu.

    Wartość jest jednak konkretna i warto ją nazwać. Konto gościa jest
    wpisywane w próbach logowania automatycznie, obok administratora, bo
    działa bez hasła i występuje wszędzie. Jeżeli jest wyłączone, próba
    kończy się niepowodzeniem niezależnie od nazwy. Jeżeli ktoś je kiedyś
    włączy — na chwilę, do jednego zadania, z zamiarem wyłączenia zaraz
    potem — to nazwa nieoczywista sprawia, że włączone konto nie zostaje
    znalezione od razu.

    Tak właśnie warto ten punkt czytać: jako zabezpieczenie na wypadek
    cofnięcia zabezpieczenia głównego. Na serwerze 2016 nie jest to przypadek
    teoretyczny — to jest wydanie, na którym gościa włączano dla zgodności ze
    starszymi urządzeniami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele,
    dopóki konto jest wyłączone. Po jego włączeniu — gotową nazwę konta
    działającego bez hasła.
  en: |
    The item requires the built-in guest account to carry a name other than the
    default one.

    The category is low, and I say so plainly, because this item is markedly
    weaker than its neighbour. The guest account should above all be switched
    off - and it is that rule which closes the road. Renaming takes access away
    from nobody by itself.

    The value is concrete nonetheless and worth naming. The guest account is
    typed into sign-in attempts automatically, alongside the administrator,
    because it works without a password and exists everywhere. If it is off, the
    attempt fails whatever the name. If somebody switches it on one day - for a
    moment, for a single job, meaning to switch it off straight after - then a
    non-obvious name means the enabled account is not found at once.

    That is how the item is worth reading: as a safeguard against the main
    safeguard being undone. On Server 2016 that is no theoretical case - this is
    the release where guest was enabled for compatibility with older devices.

    What an attacker gains while the item goes unmet: little, as long as the
    account is off. Once it is on - a ready name for an account that works
    without a password.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż w praktyce nie psuje to niczego przy
    koncie wyłączonym.

    Sprawdzenie ma sens tylko wtedy, gdy konto gościa jest w tej chwili
    włączone i coś z niego korzysta — urządzenie wielofunkcyjne, starsza
    aplikacja, udział otwarty dla wszystkich. Wtedy przemianowanie zerwie
    połączenia podające nazwę konta, choć te podające samo połączenie bez
    poświadczeń będą działać dalej.

    Jeżeli konto jest wyłączone, a tak być powinno, zmiana nie ma żadnego
    skutku widocznego w pracy. Zostaje sama nazwa w konsoli zarządzania
    kontami.

    Rzecz do zapamiętania: ten punkt nie zastępuje wyłączenia konta i nie
    należy go tak traktować. Raport pokazujący przemianowanego, ale włączonego
    gościa opisuje maszynę otwartą, a nie zabezpieczoną.

    Czego to nie psuje: uprawnień konta, jego stanu włączenia, udziałów ani
    niczego, co odwołuje się do identyfikatora zamiast do nazwy.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", although in practice it breaks nothing while
    the account is off.

    The review is worth doing only where the guest account is currently on and
    something uses it - a multifunction device, older software, a share open to
    everyone. Renaming will then cut the connections that supply the account
    name, though those that simply connect without credentials will go on
    working.

    If the account is off, as it should be, the change has no effect visible in
    work at all. What remains is the name in the account management console.

    Something to remember: this item does not replace switching the account off
    and should not be treated as if it did. A report showing a renamed but
    enabled guest describes an open machine, not a protected one.

    What this does not break: the account's rights, whether it is enabled,
    shares, or anything that refers to the identifier instead of the name.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Przy koncie włączonym połączenia podające nazwę gościa przestają pasować
      - Przy koncie wyłączonym zmiana nie ma żadnego skutku widocznego w pracy
      - Punkt nie zastępuje wyłączenia konta i przemianowany gość włączony wciąż jest otwartą drogą
      - Uprawnienia, stan włączenia i udziały pozostają bez zmian
    en:
      - With the account on, connections supplying the guest name stop matching
      - With the account off, the change has no effect visible in work
      - The item does not replace switching the account off, and a renamed but enabled guest is still an open road
      - Rights, the enabled state and shares stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Konto gościa jest włączone i korzysta z niego urządzenie podające jego nazwę, a zamiennik nie został przygotowany
    en:
      - The guest account is on and a device supplying its name uses it, and no replacement has been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
      if ($os.ProductType -eq 2) {
        # A domain controller keeps no local accounts. The built-in guest is a
        # domain account there and falls under a separate item.
        'NOT_APPLICABLE'
      }
      else {
        # The built-in account is found by the ending of its identifier, not by
        # name. The default names below stand for the commonest language
        # versions; a dot takes the place of a letter outside the basic alphabet,
        # so that the check does not depend on the encoding in which the command
        # reaches the shell.
        $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
        if ($null -eq $account) { 'CHECK_ERROR' }
        elseif ($account.Name -match '^(guest|gast|go.{1,2}|invit.|invitado|convidado|ospite)$') { 'DEFAULT_NAME' }
        else { 'RENAMED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'RENAMED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
    [pscustomobject]@{
      sid     = $account.SID.Value
      name    = $account.Name
      existed = ($null -ne $account)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The rename is a safeguard against the main safeguard being undone: if
    # somebody enables the account one day, a non-obvious name means it is not
    # found at once. It is not a substitute for switching the account off.
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
    $new = 'legacyacct-' + (Get-Random -Minimum 1000 -Maximum 9999)
    Rename-LocalUser -SID $account.SID -NewName $new
    "Renamed to $new"

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous name - refusing to guess one.' }
    Rename-LocalUser -SID $b.sid -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-guest-account

notes:
  pl: |
    Kategoria niska powiedziana wprost: przy koncie wyłączonym punkt niczego
    nie zamyka, bo nie ma czego zamykać. Wartość ujawnia się dopiero wtedy,
    gdy ktoś konto włączy.

    Audyt rozpoznaje konto po końcówce identyfikatora i porównuje nazwę
    z listą wersji językowych. W miejscu litery spoza alfabetu podstawowego
    stoi kropka, żeby wynik nie zależał od kodowania, w jakim polecenie
    dociera do powłoki.

    Reguła tworzy parę z wyłączeniem konta gościa i jest w tej parze słabszą
    stroną. Kolejność wdrażania powinna być taka sama jak kolejność wagi:
    najpierw wyłączenie, potem nazwa.
  en: |
    The low category said plainly: with the account off the item closes
    nothing, because there is nothing to close. Its value shows only once
    somebody enables the account.

    The audit recognises the account by the ending of its identifier and
    compares the name against a list of language versions. A dot stands in place
    of a letter outside the basic alphabet, so that the result does not depend
    on the encoding in which the command reaches the shell.

    The rule forms a pair with switching the guest account off and is the weaker
    side of that pair. The order of rollout should follow the order of weight:
    switching off first, the name after.
