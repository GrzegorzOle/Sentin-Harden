id: win11-kms-online-validation-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Software Protection Platform
  title:
    pl: Sprawdzanie licencji w sieci przez klienta serwera aktywacji wyłączone
    en: Online licence validation by the activation server's client switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza połączenie, którym maszyna aktywowana przez serwer
    aktywacji w sieci lokalnej sprawdza swoją licencję u producenta systemu.

    Sens punktu bierze się z tego, że połączenie to jest zbędne. Maszyna
    aktywowana lokalnie ma przy sobie wszystko, co do aktywacji potrzebne;
    odpytanie producenta niczego do tego nie dodaje, a jest kolejnym
    połączeniem wychodzącym z maszyny do sieci publicznej.

    Wartość punktu leży w spójności, nie w odparciu konkretnego zagrożenia,
    i warto to powiedzieć wprost zamiast dorabiać mu wagę. Każde połączenie
    wychodzące, którego nie potrzebujemy, jest jednym ruchem więcej do
    odróżnienia od ruchu podejrzanego, jedną regułą zapory więcej
    do utrzymania i jednym wpisem więcej w dzienniku, który ktoś musi
    zrozumieć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio. Pośrednio — tło. Ruch, którego nikt nie kwestionuje, bo
    wygląda jak systemowy, jest tłem, w którym łatwiej ukryć ruch własny.

    W sieciach odciętych od Internetu punkt ma dodatkowe znaczenie
    praktyczne: eliminuje próby połączeń, które i tak się nie powiodą,
    a zaśmiecają dziennik zapory.
  en: |
    The setting switches off the connection by which a machine activated by an activation
    server on the local network checks its licence with the system's maker.

    The item's sense comes from that connection being needless. A machine activated locally
    has by it everything the activation takes; questioning the maker adds nothing to that
    and is one more connection going out from the machine to the public network.

    The item's value lies in consistency rather than in warding off a particular threat,
    and it is worth saying so outright rather than inventing weight for it. Every outgoing
    connection we do not need is one more piece of traffic to tell apart from suspect
    traffic, one more firewall rule to keep, and one more entry in a log somebody has to
    understand.

    What an attacker gains while the item goes unmet: little directly. Indirectly - a
    background. Traffic nobody questions, because it looks like the system's own, is a
    background in which one's own traffic is easier to hide.

    On networks cut off from the internet the item has a further practical meaning: it does
    away with connection attempts that will fail anyway and clutter the firewall's log.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji, z której ktoś korzysta.

    Aktywacja systemu działa bez zmiany. Maszyna aktywowana przez serwer
    w sieci lokalnej pozostaje aktywowana, odnawia aktywację tak jak dotąd
    i nie zgłasza żadnego ostrzeżenia. Wyłączone zostaje wyłącznie osobne
    odpytanie producenta, które do aktywacji nie było potrzebne.

    Na maszynie aktywowanej inaczej — kluczem detalicznym albo aktywacją
    powiązaną ze sprzętem — ustawienie nie ma nic do zrobienia i nie zmienia
    niczego.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away no function anyone uses.

    The system's activation works unchanged. A machine activated by a server on the local
    network stays activated, renews the activation as until now and raises no warning. What
    is switched off is the separate questioning of the maker alone, which the activation
    did not take.

    On a machine activated otherwise - by a retail key or by an activation bound to the
    hardware - the setting has nothing to do and changes nothing.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
  what_breaks:
    pl:
      - Odpytanie producenta systemu o licencję przestaje być wykonywane
      - Aktywacja przez serwer w sieci lokalnej działa i odnawia się bez zmiany
      - Maszyna aktywowana kluczem detalicznym nie odczuwa zmiany
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - The questioning of the system's maker about the licence stops being performed
      - Activation by a server on the local network works and renews itself unchanged
      - A machine activated by a retail key does not feel the change
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key name holds a space - quoting the whole path is required.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoGenTicket'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
    $current = (Get-ItemProperty -Path $path -Name 'NoGenTicket' -ErrorAction SilentlyContinue).'NoGenTicket'
    [pscustomobject]@{
      path        = $path
      name        = 'NoGenTicket'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\CurrentVersion\Software Protection Platform'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoGenTicket' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/get-started/kms-activation-planning

notes:
  pl: |
    Nazwa wartości nie przypomina nazwy zasady i to jest częsta przyczyna
    nieodnalezienia jej przy sprawdzaniu ręcznym. Dodatkowo nazwa klucza
    zawiera spację, więc ścieżkę trzeba ująć w cudzysłów.

    Reguła należy do klasy bez uciążliwości i nadaje się do trybu zbiorczego.
    Kategoria ryzyka jest niska i taka ma pozostać — wartość leży
    w ograniczaniu ruchu wychodzącego do tego, co potrzebne, a nie
    w odparciu ataku.

    Punkt dotyczy wyłącznie maszyn aktywowanych przez serwer aktywacji
    w sieci lokalnej. Na pozostałych ustawienie jest nieszkodliwe i bez
    znaczenia, więc wdrożenie hurtem nie wymaga rozróżniania maszyn.

    Brak wartości nie jest stanem zgodnym, bo domyślnie odpytanie jest
    wykonywane.
  en: |
    The value's name does not resemble the policy's name and that is a common reason for
    failing to find it when checking by hand. Besides that the key's name holds a space, so
    the path has to be enclosed in quotes.

    The rule belongs to the class without disruption and suits the bulk mode. The risk
    category is low and is to stay so - the value lies in limiting outgoing traffic to what
    is needed rather than in warding off an attack.

    The item concerns machines activated by an activation server on the local network
    alone. On the rest the setting is harmless and of no consequence, so a bulk rollout
    takes no telling of machines apart.

    A missing value is not a compliant state, since by default the questioning is
    performed.
