id: win2025-machine-account-password-changes-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Zmiany hasła konta maszyny nie są wyłączone
    en: Machine account password changes not switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy maszyna odnawia hasło swojego konta
    w domenie. Punkt wymaga, żeby odnawiała — czyli żeby wyłączenie
    tego mechanizmu pozostało wyłączone.

    Konto maszyny jest kontem pełnoprawnym i ma hasło, tak jak konto
    człowieka. Różnica polega na tym, że nikt go nie zna i nikt go nie
    wpisuje: system ustala je sam i sam odnawia co pewien czas.
    Właśnie dlatego hasło to bywa bardzo mocne — i właśnie dlatego jego
    odnawianie jest jedynym, co je chroni przed zestarzeniem się.

    Hasło konta maszyny jest materiałem, z którego wyprowadza się
    klucze kanału bezpiecznego. Kto je zdobędzie, ten może podszyć się
    pod maszynę wobec domeny i odszyfrować ruch kanału zapisany
    wcześniej. Zdobycie go wymaga dostępu do maszyny — ale dostęp taki
    bywa krótki, a hasło niezmieniane zostaje ważne bez końca.

    Na tym polega wartość odnawiania: zamienia zdobycz trwałą
    w zdobycz terminową. Napastnik, który zdobył hasło i stracił dostęp
    do maszyny, traci je ponownie przy następnym odnowieniu.

    Na serwerze rzecz waży bardziej niż na stanowisku roboczym, bo
    serwer bywa maszyną odtwarzaną z obrazu i rozmnażaną z szablonu —
    a przy takim wdrożeniu odnawianie bywa wyłączane celowo, żeby
    obraz dało się odtwarzać wielokrotnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    konta maszyny ważne bez końca, a więc trwałą możliwość podszycia
    się pod tę maszynę wobec domeny.
  en: |
    The setting settles whether the machine renews its domain account's password. The item
    requires that it do so - that is, that the switching off of the mechanism stay off.

    A machine account is a full account and has a password, as a person's account does. The
    difference is that nobody knows it and nobody types it: the system sets it itself and renews
    it itself now and again. For just that reason the password is at times very strong - and for
    just that reason its renewing is the one thing guarding it from growing old.

    A machine account's password is the material the secure channel's keys are drawn from.
    Whoever wins it may give themselves out for the machine towards the domain and unriddle
    channel traffic recorded earlier. The winning of it takes access to the machine - but such
    access is at times short, while an unchanged password stays valid without end.

    Therein lies the worth of renewing: it turns a lasting prize into a timed one. An attacker
    who won the password and lost access to the machine loses it again at the next renewal.

    On a server the matter weighs more than at a working station, a server being at times a
    machine restored from an image and multiplied from a template - and at such a rollout the
    renewing is at times switched off on purpose, so that the image may be restored again and
    again.

    What an attacker gains while the item goes unmet: a machine account password valid without
    end, and so a lasting means of giving themselves out for this machine towards the domain.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym odnawianie jest włączone, więc na większości
    serwerów naprawa nie zmienia niczego. Niezgodność bierze się
    z decyzji podjętej wcześniej, a nie ze stanu zastanego — ktoś
    mechanizm wyłączył i zwykle wiadomo po co.

    Powodem jest najczęściej wdrażanie z obrazu. Maszyna odtwarzana
    do stanu z chwili wykonania obrazu wraca z hasłem sprzed
    odtworzenia, a domena zna hasło nowsze — i wtedy kanał bezpieczny
    się nie nawiązuje. Wyłączenie odnawiania jest sposobem na obejście
    tego, ale sposobem złym: znosi ochronę na stałe, żeby rozwiązać
    kłopot występujący przy odtworzeniu.

    Właściwym rozwiązaniem jest odbudowa relacji zaufania po
    odtworzeniu maszyny albo wdrażanie z szablonu przygotowanego
    narzędziem czyszczącym tożsamość maszyny. Oba pozostawiają
    odnawianie włączone.

    Samo włączenie odnawiania nie powoduje natychmiastowej zmiany
    hasła. Maszyna odnowi je zgodnie z przyjętym okresem, więc skutek
    jest odroczony, a nie natychmiastowy — i nie ma momentu, w którym
    maszyna byłaby bez ważnego hasła.
  en: |
    The change has no known side effects and takes no break.

    In the default state the renewing is on, so on most servers the mending changes nothing.
    Non-compliance comes of a decision taken earlier rather than of an inherited state -
    somebody switched the mechanism off, and it is usually known what for.

    The reason is most often a rollout from an image. A machine restored to its state at the
    hour the image was made comes back with the password from before the restoring while the
    domain knows a newer one - and then the secure channel does not come about. Switching the
    renewing off is a way round that, but a poor one: it undoes the guard for good so as to
    settle a bother arising at a restoring.

    The right answer is a rebuilding of the trust relation after the machine is restored, or a
    rollout from a template prepared with the tool that clears a machine's identity. Both leave
    the renewing on.

    The turning on of the renewing does not of itself cause an immediate change of password. The
    machine will renew it by the accepted period, so the effect is put off rather than immediate
    - and there is no moment at which the machine would be without a valid password.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - virtualization-and-containers
  what_breaks:
    pl:
      - Maszyna odtwarzana z obrazu do stanu sprzed odnowienia hasła nie nawiąże kanału bezpiecznego
      - Włączenie odnawiania nie zmienia hasła natychmiast, więc skutek jest odroczony
      - Nie ma momentu, w którym maszyna byłaby bez ważnego hasła konta
      - W stanie domyślnym odnawianie jest włączone, więc zmiana zwykle nie robi nic
    en:
      - A machine restored from an image to a state before the password's renewal will not set up the secure channel
      - Turning the renewing on does not change the password at once, so the effect is put off
      - There is no moment at which the machine would be without a valid account password
      - In the default state the renewing is on, so the change usually does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer jest wdrażany przez odtwarzanie obrazu do stanu sprzed odnowienia hasła konta maszyny
      - Nie przygotowano procedury odbudowy relacji zaufania po odtworzeniu maszyny
    en:
      - The server is rolled out by restoring an image to a state before the machine account password's renewal
      - No procedure for rebuilding the trust relation after a machine is restored was ever prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The policy names the switching *off* of password changes, so a value of
      # zero is the requirement here and one means the safeguard is absent.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'DisablePasswordChange'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'DisablePasswordChange'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordChange' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-disable-machine-account-password-changes

notes:
  pl: |
    Wartość zapisana w rejestrze nazywa wyłączenie, więc stanem
    zgodnym jest zero. Jedynka znaczy, że ochrona została zdjęta.
    Warto o tym pamiętać przy czytaniu raportu, bo przy większości
    punktów jest odwrotnie.

    Hasło konta maszyny jest materiałem, z którego wyprowadza się
    klucze kanału bezpiecznego. Punkt czyta się więc razem z czwórką
    dotyczącą tego kanału.

    Najczęstszym powodem wyłączenia jest wdrażanie z obrazu. Właściwym
    rozwiązaniem jest odbudowa relacji zaufania po odtworzeniu albo
    szablon przygotowany narzędziem czyszczącym tożsamość maszyny.
  en: |
    The value written in the registry names the switching off, so the compliant state is zero. A
    one means the guard was taken away. That is worth keeping in mind at the reading of the
    report, most items running the other way about.

    A machine account's password is the material the secure channel's keys are drawn from. The
    item is thus read together with the four bearing on that channel.

    The commonest reason for the switching off is a rollout from an image. The right answer is a
    rebuilding of the trust relation after the restoring, or a template prepared with the tool
    that clears a machine's identity.
