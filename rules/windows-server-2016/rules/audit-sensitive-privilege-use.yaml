id: win2016-audit-sensitive-privilege-use

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Privilege Use
  title:
    pl: Inspekcja użycia uprawnień wrażliwych
    en: Audit sensitive privilege use
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje faktyczne użycie uprawnień uznanych za wrażliwe —
    tych samych, które opisuje cały blok reguł o przypisaniu uprawnień
    użytkownika.

    Różnica między posiadaniem a użyciem jest tu całą treścią punktu. Reguły
    uprawnień odpowiadają na pytanie, kto może przejąć własność pliku, wczytać
    sterownik albo debugować cudzy proces. Ta podkategoria odpowiada na pytanie,
    kto to zrobił i kiedy.

    Bez niej lista uprawnień jest deklaracją możliwości. Z nią staje się
    historią użycia — a to jest ta rzecz, po którą sięga się w dochodzeniu.
    Konto administratora ma uprawnienie do debugowania procesów zawsze; pytanie
    brzmi, czy z niego kiedykolwiek skorzystało i o której godzinie.

    Zdarzenie powstaje w chwili, gdy uprawnienie jest faktycznie wykorzystywane
    do wykonania operacji, a nie w chwili logowania. To odróżnia tę podkategorię
    od logowania specjalnego: tamto mówi, że sesja dostała uprawnienia, ta mówi,
    że ich użyła.

    Rejestruje się powodzenia i niepowodzenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: korzystanie
    z uprawnień omijających uprawnienia plikowe i izolację procesów bez śladu
    odróżniającego faktyczne użycie od zwykłego posiadania.
  en: |
    The subcategory records the actual use of rights held to be sensitive - the very
    ones the whole block of rules on the assignment of user rights describes.

    The difference between holding and using is the item's whole substance. The
    rules on rights answer the question who may take a file's ownership, load a
    driver or debug somebody else's process. This subcategory answers the question
    who did so and when.

    Without it the list of rights is a declaration of possibility. With it, it
    becomes a history of use - and that is the thing one reaches for in an inquiry.
    An administrator's account always holds the right to debug processes; the
    question is whether it ever used it, and at what hour.

    The event arises at the moment the right is actually turned to account in
    carrying out an operation, not at the moment of signing in. That is what
    separates this subcategory from special logon: that one says a session received
    rights, this one says it used them.

    Successes and failures are both recorded.

    What an attacker gains while the item goes unmet: the use of rights that go
    round file permissions and process isolation, with no trace separating actual
    use from mere possession.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i jest to drugi — obok inspekcji dostępu do
    udziałów — najdroższy punkt w całym bloku.

    Powód jest taki, że niektóre uprawnienia wrażliwe są używane przez system
    nieustannie, a nie od święta. Uprawnienie do podszywania się pod klienta
    jest wykorzystywane przez każdą usługę obsługującą połączenia w imieniu
    użytkownika, więc serwer aplikacyjny albo serwer bazy danych potrafi
    generować zdarzenia w tempie setek na minutę.

    Na maszynie z rolą serwera plików albo usługi sieciowej oszacowanie jest
    warunkiem sensownego wdrożenia. Na serwerze, który nie obsługuje ruchu
    w imieniu użytkowników, koszt jest znacznie niższy.

    Trzeba też liczyć się ze zjawiskiem drugiego rodzaju: dziennik zapełniony
    zdarzeniami rutynowymi ukrywa te nierutynowe równie skutecznie jak brak
    inspekcji. Punkt ma sens wtedy, gdy jest dokąd te zdarzenia wysyłać i czym
    je przeglądać.

    Nic przy tym nie przestaje działać i wydajność nie zmienia się w sposób
    mierzalny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and this is the second - beside the auditing of
    share access - dearest item in the whole block.

    The reason is that some sensitive rights are used by the system continually, not
    on rare occasions. The right to impersonate a client is turned to account by
    every service handling connections on a user's behalf, so an application server
    or a database server can generate events at hundreds a minute.

    On a machine with the file server or a network service role an estimate is the
    condition of a sensible rollout. On a server not handling traffic on users'
    behalf the cost is far lower.

    A second kind of phenomenon has to be reckoned with too: a log filled with
    routine events hides the unroutine ones as surely as no auditing at all. The
    item makes sense where there is somewhere to send these events and something to
    review them with.

    Nothing stops working while this goes on and performance does not alter
    measurably.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Serwer aplikacyjny albo bazodanowy podszywający się pod klienta generuje zdarzenia w tempie setek na minutę
      - Dziennik zapełniony zdarzeniami rutynowymi ukrywa te nierutynowe równie skutecznie jak brak inspekcji
      - Wydajność maszyny nie zmienia się w sposób mierzalny
    en:
      - No regression in the working - only the security log's volume grows
      - An application or database server impersonating a client generates events at hundreds a minute
      - A log filled with routine events hides the unroutine ones as surely as no auditing at all
      - The machine's performance does not alter measurably
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna obsługuje połączenia w imieniu użytkowników i objętości zdarzeń nie oszacowano
      - Nie ma dokąd wysyłać zdarzeń ani czym ich przeglądać, więc rutynowy strumień ukryje to, co nierutynowe
    en:
      - The machine handles connections on users' behalf and the volume of events has not been estimated
      - There is nowhere to send the events and nothing to review them with, so the routine stream will hide the unroutine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9228-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9228-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9228-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9228-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9228-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-sensitive-privilege-use

notes:
  pl: |
    Punkt domyka blok uprawnień użytkownika od trzeciej strony. Reguły
    uprawnień sprawdzają stan, inspekcja zmiany zasad autoryzacji zapisuje
    zmianę stanu, a ta podkategoria zapisuje korzystanie. Dopiero trzy razem
    odpowiadają na pełne pytanie.

    Koszt jest tu realny i zależy od roli maszyny w sposób, którego nie da się
    przewidzieć bez spojrzenia. Aplikacja ma podać oszacowanie, a nie zalecenie
    — to jest dokładnie ten przypadek, dla którego istnieje klasa „wymaga
    sprawdzenia".

    Definicja uprawnień wrażliwych należy do systemu i obejmuje między innymi
    przejmowanie własności, wczytywanie sterowników, debugowanie procesów
    i podszywanie się pod klienta.
  en: |
    The item closes the block on user rights from a third side. The rules on rights
    check the state, the auditing of authorisation policy change records the change
    of state, and this subcategory records the using. Only the three together answer
    the full question.

    The cost here is real and hangs on the machine's role in a way not foreseeable
    without a look. The application is to give an estimate, not a recommendation -
    this is exactly the case the "needs review" class exists for.

    The definition of sensitive rights belongs to the system and covers, among
    others, taking ownership, loading drivers, debugging processes and impersonating
    a client.
