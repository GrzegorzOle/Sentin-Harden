id: windows-server-2025
name:
  pl: Windows Server 2025
  en: Windows Server 2025
family: windows
shell: powershell
profile: server

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD

detection:
  command: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 2 = domain controller, 3 = member server. Build 26100.
  match: '^Microsoft Windows Server 2025.*\|26[0-9]{3}\|[23]$'

roles:
  # The machine role changes both the applicable rule set and the disruption
  # rating. The same change is judged differently on a domain controller and
  # on a file server.
  command: |
    (Get-WindowsFeature | Where-Object InstallState -eq 'Installed').Name -join ','

notes:
  pl: |
    Benchmark rozróżnia kontroler domeny i serwer członkowski — to dwa różne
    zestawy punktów, nie warianty jednego. Reguła dotycząca wyłącznie jednej
    roli musi to deklarować w polu platform.applies_to_roles, inaczej na
    drugiej roli zwróci mylący wynik.
  en: |
    The benchmark distinguishes domain controllers from member servers - two
    separate item sets, not variants of one. A rule that applies to only one
    role must declare it in platform.applies_to_roles, otherwise it returns
    a misleading result on the other role.
