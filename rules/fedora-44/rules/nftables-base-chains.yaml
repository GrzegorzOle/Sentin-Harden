id: fedora44-nftables-base-chains

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 4.3.1
  section: Host Based Firewall > Configure nftables
  title:
    pl: Łańcuchy bazowe nftables istnieją
    en: Ensure nftables base chains exist
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    W nftables pakiety trafiają do reguł tylko przez łańcuchy bazowe, czyli
    łańcuchy podpięte do punktów jądra: input dla ruchu do komputera,
    forward dla ruchu przez niego i output dla ruchu z niego. Reguła
    w tabeli bez takiego łańcucha niczego nie filtruje.

    Punkt wymaga, żeby istniały łańcuchy bazowe typu filter dla input,
    forward i output.
  en: |
    In nftables, packets reach rules only through base chains, the chains
    attached to kernel hooks: input for traffic to the computer, forward for
    traffic through it and output for traffic from it. A rule in a table
    without such a chain filters nothing.

    The item requires filter base chains for input, forward and output to
    exist.

disruption_description:
  pl: |
    Nikt tego nie zauważy: łańcuch bazowy z polityką accept i bez reguł
    przepuszcza cały ruch.
  en: |
    Nobody will notice: a base chain with the accept policy and no rules
    lets all traffic through.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then echo CHECK_ERROR; exit 0; fi
    # With firewalld as the firewall its rules are assessed by the firewalld items.
    if [ "$(systemctl is-active firewalld.service 2>/dev/null)" = active ]; then echo NOT_APPLICABLE; exit 0; fi
    if ! command -v nft >/dev/null 2>&1; then echo NOT_INSTALLED; exit 0; fi
    rs=$(nft list ruleset 2>/dev/null) || { echo CHECK_ERROR; exit 0; }
    hp=$(printf '%s\n' "$rs" | sed -nE 's/.*type filter hook (input|forward|output) .*policy (accept|drop);.*/\1 \2/p')
    miss=""
    for h in input forward output; do
      printf '%s\n' "$hp" | grep -q "^$h " || miss="$miss,$h"
    done
    if [ -z "$miss" ]; then echo "OK:input,forward,output"; else echo "NOT_OK:missing=${miss#,}"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://wiki.nftables.org/wiki-nftables/index.php/Configuring_chains
  - https://www.netfilter.org/projects/nftables/manpage.html
  - https://wiki.nftables.org/wiki-nftables/index.php/Main_Page

notes:
  pl: |
    Punkty o nftables dotyczą komputera, na którym zaporę tworzy sama usługa
    nftables z regułami w /etc/sysconfig/nftables.conf. Gdy działa firewalld,
    sprawdzenie zwraca NOT_APPLICABLE, bo jego reguły ocenia punkt o firewalld.
    Sprawdzenie odczytuje bieżący zestaw reguł poleceniem nft list ruleset,
    które wymaga uprawnień roota.

    Reguła tylko sprawdza stan: zestaw reguł zapory projektuje administrator,
    a jego automatyczna zmiana na zdalnym komputerze grozi odcięciem dostępu.
    Reguły zapisuje się w pliku ładowanym przez usługę nftables i wczytuje
    poleceniem systemctl reload nftables.

    Sprawdzenie szuka łańcuchów typu filter z hakami input, forward i output
    w dowolnej tabeli, także w tabelach tworzonych przez inne programy, np.
    Dockera przez iptables-nft, więc warto sprawdzić, czy to własne reguły
    organizacji. Przykład łańcucha: nft add chain inet filter input
    '{ type filter hook input priority 0; policy accept; }'.
  en: |
    The nftables items concern a computer whose firewall is built by the
    nftables service itself, with rules in /etc/sysconfig/nftables.conf.
    When firewalld runs, the check returns NOT_APPLICABLE, because its rules
    are assessed by the firewalld item. The check reads the current ruleset
    with nft list ruleset, which needs root privileges.

    The rule only checks the state: the firewall ruleset is designed by the
    administrator, and changing it automatically on a remote computer risks
    cutting off access. The rules are written to the file loaded by the
    nftables service and loaded with systemctl reload nftables.

    The check looks for filter chains with the input, forward and output
    hooks in any table, including tables created by other programs, for
    example Docker through iptables-nft, so it is worth checking that they
    are the organization's own rules. An example chain: nft add chain inet
    filter input '{ type filter hook input priority 0; policy accept; }'.
