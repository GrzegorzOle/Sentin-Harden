id: win2025-search-highlights-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Treść pobierana do okna wyszukiwania wyłączona
    en: Content fetched into the search window switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza pobieranie treści wyświetlanych w oknie wyszukiwania —
    ilustracji, odsyłaczy i propozycji pojawiających się, zanim ktokolwiek
    cokolwiek wpisze.

    Kategoria średnia i chcę powiedzieć, dlaczego nie niska, skoro chodzi
    o obrazki. Powodem jest chwila. Ta treść pobiera się przy samym
    otwarciu okna wyszukiwania, czyli przy czynności wykonywanej przez
    administratora dziesiątki razy dziennie. Oznacza to stały, regularny
    ruch wychodzący z serwera do zasobu treściowego, wywoływany rytmem
    pracy człowieka.

    Osobno waży to, czym ten ruch jest z punktu widzenia analizy: serwer
    pobierający obrazy i odsyłacze z zasobu treściowego wygląda dokładnie
    tak, jak wygląda maszyna sterowana z zewnątrz. Nie twierdzę, że to jest
    to samo. Twierdzę, że stały strumień tego rodzaju odbiera analitykowi
    możliwość odróżnienia jednego od drugiego bez dodatkowej pracy.

    Chcę też oddzielić ten punkt od wyszukiwania w chmurze, bo leżą obok
    siebie. Tamten dotyczy tego, co wychodzi po wpisaniu frazy. Ten
    dotyczy tego, co przychodzi, zanim ktokolwiek cokolwiek wpisze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tło,
    w którym serwer regularnie pobiera treści z zewnątrz — a więc tło,
    w którym jego własne pobranie nie wygląda dziwnie.
  en: |
    The item switches off the fetching of content displayed in the search
    window - pictures, links and suggestions appearing before anybody types
    anything.

    The category is medium, and I want to say why not low, given that this
    is about pictures. The reason is the moment. This content is fetched on
    the very opening of the search window, that is, at an action an
    administrator performs dozens of times a day. It means steady, regular
    outbound traffic from the server to a content service, triggered by the
    rhythm of a person's work.

    Something else weighs separately - what this traffic is from the point
    of view of analysis: a server fetching images and links from a content
    service looks exactly like a machine being steered from outside. I am
    not claiming it is the same thing. I claim that a steady stream of this
    kind takes from an analyst the ability to tell one from the other
    without extra work.

    I also want to separate this item from cloud search, because they lie
    side by side. That one concerns what goes out once a phrase is typed.
    This one concerns what comes in before anybody types anything.

    What an attacker gains while the item goes unmet: a background in which
    the server regularly fetches content from outside - and so a background
    in which their own fetch does not look strange.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i nie mam do niej zastrzeżeń, ale chcę
    dokładnie oddzielić, co znika, a co zostaje, bo nazwa punktu tego nie
    oddaje.

    Wyszukiwanie działa. Wpisanie nazwy pliku znajduje plik, wpisanie
    nazwy programu uruchamia program, wpisanie nazwy ustawienia otwiera
    ustawienie. Znika wyłącznie to, co widać w oknie przed wpisaniem
    czegokolwiek: obrazek dnia, odsyłacze, propozycje. Okno będzie po
    prostu puste, dopóki ktoś nie zacznie pisać.

    To jest cała lista skutków. Na serwerze nie ma nawet z czym jej
    zestawić, bo nikt nie otwiera okna wyszukiwania po to, żeby obejrzeć
    ilustrację.

    Warto natomiast zapamiętać nazwę wpisu w rejestrze, bo nie przypomina
    nazwy ustawienia i przy ręcznym sprawdzaniu łatwo jej nie skojarzyć.
    Odnosi się do wewnętrznej nazwy okna, nie do tego, co ustawienie
    robi — to jeden z tych przypadków, w których czytanie rejestru bez
    ściągi prowadzi donikąd.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption" and I have no caveat about it, but I want
    to separate precisely what disappears and what stays, because the item's
    name does not convey it.

    Search works. Typing a file's name finds the file, typing a program's
    name starts the program, typing a setting's name opens the setting. All
    that disappears is what is visible in the window before anything is
    typed: the picture of the day, the links, the suggestions. The window
    will simply be empty until somebody starts typing.

    That is the whole list of effects. On a server there is not even
    anything to set it against, because nobody opens the search window in
    order to look at an illustration.

    What is worth remembering is the entry's name in the registry, because
    it does not resemble the setting's name and is easy to miss when
    checking by hand. It refers to the window's internal name rather than to
    what the setting does - one of those cases where reading the registry
    without a crib leads nowhere.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Znika to, co widać w oknie wyszukiwania przed wpisaniem czegokolwiek — obrazek, odsyłacze, propozycje
      - Okno będzie puste, dopóki ktoś nie zacznie pisać, i to jest cała lista skutków
      - Samo wyszukiwanie działa bez zmian — plik, program i ustawienie znajdują się tak samo
      - Nazwa wpisu w rejestrze odnosi się do wewnętrznej nazwy okna i przy ręcznym sprawdzaniu łatwo jej nie skojarzyć
    en:
      - What is visible in the search window before anything is typed disappears - the picture, the links, the suggestions
      - The window will be empty until somebody starts typing, and that is the whole list of effects
      - Search itself works unchanged - a file, a program and a setting are found the same way
      - The registry entry's name refers to the window's internal name and is easy to miss when checking by hand
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest serwerem terminali, na którym treści w oknie wyszukiwania są częścią przyjętego wyglądu stanowiska pracy
    en:
      - The machine is a terminal server where content in the search window is part of the accepted look of the workplace
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry's name refers to the window's internal name and does not
      # resemble the setting's name in the editor.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'EnableDynamicContentInWSB'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'EnableDynamicContentInWSB'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The content is fetched on the very opening of the search window, so it
    # makes steady outbound traffic paced by an administrator's work. Search
    # itself is untouched - only what shows before anything is typed goes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableDynamicContentInWSB' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search

notes:
  pl: |
    Nie niska, choć chodzi o obrazki, bo liczy się chwila: treść pobiera
    się przy samym otwarciu okna wyszukiwania, czyli przy czynności
    wykonywanej przez administratora dziesiątki razy dziennie. Stały ruch
    wychodzący wywoływany rytmem pracy człowieka.

    Waży też to, czym ten ruch jest dla analizy. Serwer pobierający obrazy
    i odsyłacze z zasobu treściowego wygląda tak, jak wygląda maszyna
    sterowana z zewnątrz. Nie twierdzę, że to to samo — twierdzę, że stały
    strumień odbiera możliwość odróżnienia bez dodatkowej pracy.

    Oddziel od wyszukiwania w chmurze: tamten punkt dotyczy tego, co
    wychodzi po wpisaniu frazy, ten tego, co przychodzi, zanim ktokolwiek
    cokolwiek wpisze.
  en: |
    Not low, though this is about pictures, because the moment is what
    counts: the content is fetched on the very opening of the search window,
    at an action an administrator performs dozens of times a day. Steady
    outbound traffic paced by a person's work.

    What this traffic is for analysis weighs too. A server fetching images
    and links from a content service looks like a machine being steered from
    outside. I am not claiming it is the same - I claim a steady stream
    takes away the ability to tell them apart without extra work.

    Separate this from cloud search: that item concerns what goes out once a
    phrase is typed, this one what comes in before anybody types anything.
