id: win2025-automatic-updates-scheduled-day

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Dzień instalacji aktualizacji ustawiony na codziennie
    en: Update installation day set to every day
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustawia dzień instalacji aktualizacji na „codziennie". Wartości
    od jednego wzwyż wskazują konkretny dzień tygodnia.

    Zostawiam kategorię średnią i chcę od razu rozwiać nieporozumienie,
    które ta nazwa wywołuje, bo brzmi jak zapowiedź codziennego restartu,
    a nią nie jest.

    „Codziennie" nie znaczy, że coś dzieje się każdego dnia. Znaczy, że gdy
    aktualizacja jest gotowa do zainstalowania, maszyna zrobi to
    najbliższego dnia, a nie poczeka do wyznaczonego. Jeżeli nic nie czeka,
    nie dzieje się nic. Różnica polega wyłącznie na tym, jak długo gotowa
    poprawka leży niezainstalowana.

    I właśnie ta różnica jest treścią punktu. Wskazanie konkretnego dnia
    tygodnia dokłada do każdej poprawki do sześciu dni zwłoki, licząc od
    chwili, w której była gotowa. Przy poprawce zamykającej lukę
    wykorzystywaną w praktyce te sześć dni jest całym oknem, którego
    napastnik potrzebuje — bo narzędzie pojawia się zwykle w ciągu dni od
    ogłoszenia, nie tygodni.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: do sześciu
    dodatkowych dni na maszynie, dla której poprawka jest już gotowa
    i tylko czeka na wyznaczony dzień tygodnia.
  en: |
    The item sets the update installation day to "every day". Values of one
    and above name a particular day of the week.

    I keep the category medium, and I want to clear up straight away the
    misunderstanding this name invites, because it sounds like an
    announcement of a daily restart and is nothing of the sort.

    "Every day" does not mean something happens each day. It means that
    when an update is ready to be installed, the machine will do it on the
    nearest day rather than wait for a named one. If nothing is waiting,
    nothing happens. The difference lies solely in how long a ready fix
    sits uninstalled.

    And that difference is the substance of the item. Naming a particular
    day of the week adds up to six days of delay to every fix, counted from
    the moment it was ready. For a fix closing a flaw exploited in practice
    those six days are the whole window an attacker needs - because the
    tool usually appears within days of the announcement, not weeks.

    What an attacker gains while the item goes unmet: up to six extra days
    on a machine whose fix is already prepared and merely waiting for a
    named day of the week.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę nazwać sprzeczność, bo
    ona jest tu rzeczywista, a nie wymyślona na potrzeby ostrożności.

    Serwerownie prowadzone porządnie mają kalendarz prac. Poprawki idą
    w oknie, o którym wiedzą właściciele usług, a nie w dowolnym dniu.
    Ten punkt chce czegoś odwrotnego: żeby poprawka szła wtedy, gdy jest
    gotowa. Obie postawy są sensowne i wykluczają się.

    Rozstrzygnięcie zależy od roli maszyny i wypada różnie w obrębie jednej
    serwerowni. Tam, gdzie przerwa jest kosztowna i uzgodniona z góry —
    baza produkcyjna, węzeł klastra, maszyna obsługująca kontrahentów —
    kalendarz wygrywa i zapisany wyjątek jest właściwym wynikiem pracy
    z tą regułą. Tam, gdzie restart nikogo nie zaboli, a maszyna wystawia
    cokolwiek na zewnątrz, wygrywa ten punkt.

    Warto zapisać powód tej decyzji przy maszynie, a nie tylko samą
    decyzję. Za rok nikt nie odróżni serwera, na którym świadomie wybrano
    środę, od serwera, na którym dzień został ustawiony przypadkiem
    i nigdy nie wrócono do tematu.

    Rzecz techniczna: ten punkt nie działa sam. Bez trybu instalowania
    bez pytania dzień instalacji nie ma znaczenia, bo maszyna i tak czeka
    na zgodę, która nie nadejdzie.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review", and I want to name the contradiction,
    because here it is real rather than invented for the sake of caution.

    Properly run server estates have a calendar of works. Fixes go in a
    window the service owners know about, not on an arbitrary day. This
    item wants the opposite: that a fix should go when it is ready. Both
    stances make sense and they exclude each other.

    The decision depends on the machine's role and comes out differently
    within a single server room. Where an interruption is costly and agreed
    in advance - a production database, a cluster node, a machine serving
    contractors - the calendar wins, and a recorded exception is the right
    result of working with this rule. Where a restart will hurt nobody and
    the machine exposes anything outwards, this item wins.

    It is worth recording the reason for that decision at the machine, not
    just the decision itself. A year from now nobody will tell a server on
    which Wednesday was deliberately chosen from one on which the day was
    set by accident and never revisited.

    A technical point: this item does not work alone. Without the mode that
    installs without asking, the installation day means nothing, because
    the machine waits anyway for a consent that will not come.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Poprawki przestają czekać na wyznaczony dzień tygodnia i idą wtedy, gdy są gotowe
      - Kłóci się to z kalendarzem prac, w którym przerwa jest uzgadniana z właścicielami usług z góry
      - „Codziennie" nie oznacza codziennego restartu — gdy nic nie czeka, nie dzieje się nic
      - Bez trybu instalowania bez pytania dzień instalacji nie ma znaczenia, bo maszyna i tak czeka na zgodę
    en:
      - Fixes stop waiting for a named day of the week and go when they are ready
      - This clashes with a calendar of works in which the interruption is agreed with service owners in advance
      - The phrase "every day" does not mean a daily restart - when nothing is waiting, nothing happens
      - Without the mode that installs without asking, the installation day means nothing, because the machine waits for consent anyway
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest objęta kalendarzem prac, w którym okno przerwy jest uzgadniane z właścicielami usług z góry
      - Jest to baza produkcyjna, węzeł klastra albo maszyna obsługująca kontrahentów, gdzie przerwa jest kosztowna
      - Nie wdrożono trybu instalowania bez pytania, bez którego ten punkt nie robi nic
    en:
      - The machine falls under a calendar of works in which the outage window is agreed with service owners in advance
      - It is a production database, a cluster node or a machine serving contractors, where an interruption is costly
      - The mode that installs without asking is not in place, and without it this item does nothing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'ScheduledInstallDay'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'ScheduledInstallDay'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero means "on the nearest day a fix is ready", not "restart daily".
    # Where the machine falls under an agreed calendar of works, a recorded
    # exception is the right answer instead of this change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ScheduledInstallDay' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-wu-settings

notes:
  pl: |
    Nazwa wywołuje nieporozumienie: „codziennie" nie znaczy codziennego
    restartu, tylko „najbliższego dnia, gdy poprawka jest gotowa". Gdy nic
    nie czeka, nie dzieje się nic.

    Wskazanie konkretnego dnia tygodnia dokłada do każdej poprawki do
    sześciu dni zwłoki — a narzędzie do nowo ogłoszonej luki pojawia się
    zwykle w ciągu dni, nie tygodni.

    Sprzeczność rzeczywista: serwerownie prowadzone porządnie mają
    kalendarz prac, a ten punkt chce, żeby poprawka szła wtedy, gdy jest
    gotowa. Rozstrzygnięcie zależy od roli maszyny i wypada różnie w obrębie
    jednej serwerowni. Powód decyzji warto zapisać przy maszynie, bo za rok
    nikt nie odróżni środy wybranej świadomie od ustawionej przypadkiem.
  en: |
    The name invites a misunderstanding: "every day" does not mean a daily
    restart but "on the nearest day a fix is ready". When nothing is
    waiting, nothing happens.

    Naming a particular day of the week adds up to six days of delay to
    every fix - and the tool for a newly announced flaw usually appears
    within days, not weeks.

    A real contradiction: properly run server estates have a calendar of
    works, and this item wants the fix to go when it is ready. The decision
    depends on the machine's role and comes out differently within a single
    server room. The reason is worth recording at the machine, because a
    year from now nobody will tell a deliberately chosen Wednesday from an
    accidental one.
