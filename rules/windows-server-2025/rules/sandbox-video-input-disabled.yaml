id: win2025-sandbox-video-input-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Dostęp do kamery z piaskownicy wyłączony
    en: Access to the camera from the sandbox disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt odbiera piaskownicy dostęp do wejścia obrazu gospodarza.

    Kategoria średnia i przedmiot jest ten sam co przy wejściu dźwięku:
    nie kamera, tylko dostęp programu, któremu nie ufamy, do fizycznego
    urządzenia gospodarza. Wejście obrazu daje temu programowi sterownik do
    rozmowy — kod gospodarza po drugiej stronie granicy, dla której
    piaskownicę uruchomiono — oraz treść, jeżeli urządzenie w ogóle
    istnieje.

    Piszę to osobno od wejścia dźwięku z dwóch powodów. Pierwszy jest
    praktyczny: to dwie różne wartości w rejestrze i zrobienie jednej nie
    zamyka drugiej. Punkt, który wyglądałby na połowę już zrobionej pracy,
    jest dokładnie tym rodzajem punktu, który zostaje pominięty.

    Drugi jest merytoryczny: obraz i dźwięk niosą co innego. Kamera
    w serwerowni pokazuje, kto wchodzi i kiedy, a kamera przekierowana
    z sesji zdalnej pokazuje administratora przy pracy — w tym to, co ma na
    biurku i co wpisuje na klawiaturze. Zastrzeżenie zostaje to samo:
    na serwerze kamery zwykle nie ma, ale maszyna wirtualna dostaje
    urządzenia od gospodarza, a sesja zdalna potrafi przekierować kamerę
    z drugiej strony połączenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozmowę
    z kolejnym sterownikiem gospodarza, a przy istniejącym wejściu obrazu —
    podgląd pomieszczenia albo osoby obsługującej maszynę.
  en: |
    The item takes the sandbox's access to the host's video input away.

    The category is medium and the subject is the same as with audio input:
    not the camera, but access by a program we do not trust to a physical
    device of the host. A video input gives that program a driver to talk to
    - the host's code on the far side of the boundary the sandbox was started
    for - and content, if the device exists at all.

    I write this separately from audio input for two reasons. The first is
    practical: they are two different registry values and doing one does not
    close the other. An item that would look like half of a job already done
    is exactly the kind of item that gets passed over.

    The second is substantive: picture and sound carry different things. A
    camera in a server room shows who comes in and when, while a camera
    redirected from a remote session shows an administrator at work -
    including what is on their desk and what they type on the keyboard. The
    caveat stays the same: a server usually has no camera, but a virtual
    machine receives devices from its host, and a remote session can redirect
    a camera from the far end of the connection.

    What an attacker gains while the item goes unmet: a conversation with one
    more of the host's drivers and, where a video input exists, a view of the
    room or of the person operating the machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze zwykle nie ma tu nic do
    stracenia, a sama piaskownica bywa niezainstalowana — to funkcja
    opcjonalna.

    Skutek: program uruchomiony w piaskownicy nie zobaczy obrazu z kamery.
    Jeżeli ktoś sprawdza w piaskownicy program, który kamery używa —
    komunikator, narzędzie do wideokonferencji, oprogramowanie
    rozpoznające obraz — sprawdzenie przestaje mieć sens. To jedyny
    przypadek, w którym ta reguła przeszkadza, i przeszkadza wtedy
    całkowicie.

    Czego to nie psuje: kamery w systemie gospodarza, kamery w sesjach
    zdalnych, przekierowania kamery w tych sesjach ani żadnego sterownika.
    Nie dotyczy też obrazu wyświetlanego — punkt dotyczy wejścia, nie
    wyjścia.

    Rzecz do zapamiętania: to szósty i ostatni punkt tej grupy pod tą samą
    ścieżką rejestru. Sieć, schowek, karta graficzna, drukarki, wejście
    dźwięku i wejście obrazu to sześć osobnych wartości; dopiero komplet
    przywraca piaskownicy to, czym miała być.

    Zmiana obowiązuje od następnego uruchomienia piaskownicy. Bez przerwy,
    natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server there is usually
    nothing to lose here, and the sandbox itself is often not installed - it
    is an optional feature.

    The effect: a program run in the sandbox will see no picture from a
    camera. If somebody checks in the sandbox a program that uses one - a
    messenger, a video conferencing tool, image recognition software - the
    check stops making sense. That is the only case in which this rule gets
    in the way, and there it gets in the way entirely.

    What this does not break: the camera in the host system, cameras in
    remote sessions, camera redirection in those sessions, or any driver. Nor
    does it concern the picture displayed - the item concerns input, not
    output.

    Something to remember: this is the sixth and last item of the group under
    the same registry path. Network, clipboard, graphics card, printers,
    audio input and video input are six separate values; only the full set
    gives the sandbox back what it was meant to be.

    The change holds from the next start of the sandbox. No outage, undone
    immediately.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - drivers-and-devices
  what_breaks:
    pl:
      - Program uruchomiony w piaskownicy nie zobaczy obrazu z kamery
      - Sprawdzanie w piaskownicy komunikatora, narzędzia do wideokonferencji albo programu rozpoznającego obraz przestaje mieć sens
      - Kamera w systemie gospodarza, kamera w sesjach zdalnych i jej przekierowanie w tych sesjach działają bez zmian
      - To szósta z sześciu osobnych wartości tej grupy — dopiero komplet przywraca piaskownicy to, czym miała być
    en:
      - A program run in the sandbox will see no picture from a camera
      - Checking a messenger, a video conferencing tool or image recognition software in the sandbox stops making sense
      - The camera in the host system, cameras in remote sessions and their redirection in those sessions work unchanged
      - This is the sixth of six separate values in the group - only the full set gives the sandbox back what it was meant to be
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica na tej maszynie służy do sprawdzania programów korzystających z kamery
    en:
      - The sandbox on this machine is used to check programs that use a camera
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      $name = 'AllowVideoInput'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $name = 'AllowVideoInput'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A separate value from the audio input: doing one does not close the other.
    # A camera in a server room shows who comes in and when, and one redirected
    # from a remote session shows the administrator at work, including what they
    # type. The displayed picture is untouched - this concerns input.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowVideoInput' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

