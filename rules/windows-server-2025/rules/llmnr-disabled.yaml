id: win2025-llmnr-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > DNS Client
  title:
    pl: Rozpoznawanie nazw przez LLMNR wyłączone
    en: LLMNR name resolution disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy maszyna nie potrafi rozwiązać nazwy przez serwer nazw, domyślnie
    rozgłasza pytanie do całej sieci lokalnej: „kto nazywa się tak?".
    Odpowiedzieć może dowolny komputer w tym samym segmencie. Napastnik
    odpowiada „to ja", a maszyna sama wysyła mu poświadczenia, żeby się
    uwierzytelnić.

    Jest to najtańszy znany sposób zebrania poświadczeń w sieci. Nie
    wymaga ani luki, ani błędu użytkownika — wystarczy podłączony
    komputer i literówka w nazwie udziału albo serwer, który pyta
    o nazwę, której już nie ma.

    Podnoszę tu kategorię do krytycznej względem paczki stanowiska
    roboczego i podaję powód, bo podniesienie ma być osądem, a nie
    ostrożnością.

    Powód pierwszy dotyczy tego, czyje poświadczenie zostaje złapane.
    Na stanowisku jest to poświadczenie jednej osoby. Na serwerze
    zapytania o nazwy wysyłają usługi i zadania — kopia zapasowa
    sięgająca po udział, zadanie kopiujące pliki, monitorowanie
    odpytujące inne maszyny. Idą one z kontem usługowym, a konto usługowe
    ma zwykle prawa na wielu maszynach naraz. Jedno złapane poświadczenie
    nie jest tu jednym stanowiskiem.

    Powód drugi dotyczy tego, kto to zobaczy. Zapytania serwera idą
    w nocy, w trakcie zadań, kiedy przy maszynie nie ma nikogo. Kryterium
    kategorii krytycznej mówi wprost o ataku bez udziału użytkownika —
    tutaj nie ma użytkownika w ogóle.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odpowiedzenia na dowolne nieudane zapytanie o nazwę i przejęcia
    poświadczenia, którym serwer próbował się uwierzytelnić.
  en: |
    Where a machine cannot resolve a name through a server of names, it by default calls the
    question out to the whole local net - who is named thus? Any computer in the same length may
    answer. The attacker answers "it is I", and the machine itself sends them the credential to
    authenticate with.

    It is the cheapest known way of gathering credentials in a net. It takes neither a hole nor a
    user's slip - an attached computer is enough, and a slip of the letter in a share's name, or a
    server asking after a name that is there no more.

    I raise the category here to critical against the working station's pack and give the reason,
    a raising being meant for a reckoning and not for caution.

    The first reason bears on whose credential is caught. At a station it is one person's. On a
    server the asking after names is done by services and by tasks - a backup reaching for a share,
    a task copying files, a watching that asks other machines. They go with a service account, and
    a service account mostly holds rights on many machines at once. One credential caught is here
    not one station.

    The second reason bears on who will see it. A server's askings go at night, in the course of
    tasks, when there is nobody at the machine. The mark of the critical category speaks outright
    of an attack with no user's part in it - here there is no user at all.

    What an attacker gains while the item goes unmet: the means of answering any failed asking
    after a name and of taking the credential the server made to authenticate itself with.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy cokolwiek na tej maszynie polega na
    znajdowaniu innych po nazwie bez serwera nazw.

    Na serwerze w domenie odpowiedź brzmi zwykle nie i zmiana przechodzi
    niezauważona. Wszystko, co maszyna odpytuje, ma wpis w serwerze nazw,
    bo po to on stoi.

    Poza domeną albo w sieciach urządzanych doraźnie bywa inaczej.
    Maszyny w grupie roboczej, segment laboratoryjny, sieć serwisowa
    urządzeń — tam nazwy krótkie rozwiązuje właśnie ten mechanizm i po
    zmianie przestaną się rozwiązywać.

    Objaw jest mylący i to jest tutaj główny koszt. Zapytanie nie kończy
    się komunikatem o wyłączonym mechanizmie — kończy się tym, że nazwy
    nie da się rozwiązać. Wygląda to na awarię serwera nazw albo na
    zerwane połączenie, a nie na skutek zmiany.

    Rzecz do zrobienia przed zmianą jest jedna i jest tania: sprawdzić,
    czy nazwy, których ta maszyna używa w zadaniach i skryptach, mają
    wpis w serwerze nazw. Jeżeli nie mają — dopisać je tam, zamiast
    zostawiać mechanizm rozgłoszeniowy jako podkładkę. To i tak jest
    właściwa kolejność, niezależnie od tego punktu.

    Zmiana cofa się natychmiast i nie wymaga restartu. Zapytania idące
    już w tej chwili dokończą się, a warunek zadziała przy następnym.
  en: |
    What needs checking is whether anything on this machine leans upon the finding of others by
    name without a server of names.

    On a server in a domain the answer is mostly no, and the change goes unmarked. Everything the
    machine asks after has an entry in the server of names, that being what it stands for.

    Outside a domain, or in nets set up for the while, it is at times otherwise. Machines in a
    working group, a length for trials, a net for the service of devices - there short names are
    resolved by this very mechanism, and after the change will stop being resolved.

    The symptom misleads and that is here the chief cost. The asking does not end in a word about a
    mechanism switched off - it ends in the name not being resolvable. It looks like a fault of the
    server of names, or like a broken link, and not like the effect of a change.

    The thing to do before the change is one and is cheap - to check whether the names this machine
    uses in tasks and scripts have an entry in the server of names. If they have not, to write them
    in there, rather than leave the calling-out mechanism as a prop. That is the right order
    anyway, whatever this item says.

    The change is undone at once and takes no restart. Askings going at this very moment will
    finish, and the condition will take at the next.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Nazwy krótkie bez wpisu w serwerze nazw przestaną się rozwiązywać z tej maszyny
      - Zadania i skrypty sięgające po nazwę, której nie ma w serwerze nazw, zaczną kończyć się błędem
      - W sieci urządzanej doraźnie albo w grupie roboczej maszyny przestaną znajdować się nawzajem
      - Objaw wygląda na awarię serwera nazw, a nie na skutek zmiany ustawienia
      - Zapytania idące w tej chwili dokończą się, a warunek zadziała dopiero przy następnym
    en:
      - Short names with no entry in the server of names will stop being resolved from this machine
      - Tasks and scripts reaching for a name not in the server of names will begin ending in a fault
      - In a net set up for the while, or in a working group, machines will stop finding one another
      - The symptom looks like a fault of the server of names and not like the effect of a setting
      - Askings going at this moment will finish, and the condition will take only at the next
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje poza domeną i znajduje inne komputery wyłącznie przez rozgłoszenie
      - Zadania na tym serwerze sięgają po nazwy, których nie ma w żadnym serwerze nazw
    en:
      - The machine works outside a domain and finds other computers by calling out alone
      - Tasks on this server reach for names that are in no server of names at all
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
      $name = 'EnableMulticast'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    $name = 'EnableMulticast'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMulticast' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/dns/dns-top

notes:
  pl: |
    Kategoria krytyczna jest tu podniesieniem względem paczki stanowiska
    roboczego i opieram ją na dwóch rzeczach. Pierwsza: zapytania
    serwera idą z kont usługowych, a konto usługowe ma prawa na wielu
    maszynach, więc jedno złapane poświadczenie nie jest jednym
    stanowiskiem. Druga: idą w nocy, w trakcie zadań, bez udziału
    użytkownika, co jest wprost kryterium tej kategorii.

    Punkt czyta się razem z rozwiązywaniem nazw przez rozgłoszenie
    grupowe i przez starszy mechanizm sieciowy. Wyłączenie samego LLMNR
    zostawia dwie pozostałe drogi otwarte i napastnik po prostu z nich
    skorzysta. Te trzy punkty mają sens wyłącznie razem.
  en: |
    The critical category is here a raising against the working station's pack and I rest it upon
    two things. The first - a server's askings go with service accounts, and a service account
    holds rights on many machines, so one credential caught is not one station. The second - they
    go at night, in the course of tasks, with no user's part in it, which is outright the mark of
    this category.

    The item is read together with the resolving of names by group calling-out and by the older
    net mechanism. The switching off of LLMNR alone leaves the two other roads open and the
    attacker will simply take them. These three items have sense together alone.
