# Słownik obszarów wpływu — wspólny dla wszystkich systemów.
#
# To jest najważniejszy słownik w projekcie. Dzięki niemu da się:
#   1. zsumować skutki przed wykonaniem zmian zbiorczych,
#   2. zadać pytanie odwrotne: "korzystam z X — które reguły mnie zabolą?",
#   3. powiązać ostrzeżenie z tym, co faktycznie wykryto na maszynie.
#
# Obszary są CELOWO wspólne dla Windows i Linuksa. "Udostępnianie plików
# w sieci" znaczy to samo po obu stronach, więc pytanie odwrotne działa
# niezależnie od systemu.
#
# Dodanie nowego obszaru to decyzja projektowa, nie drobiazg. Zanim dodasz —
# sprawdź, czy istniejący nie opisuje tego samego innymi słowami.

obszary:
  - id: udostepnianie-plikow
    nazwa: Udostępnianie plików w sieci
    opis: Dostęp do udziałów sieciowych, protokoły plikowe, mapowane dyski.
    typowe_ofiary: Skanery i urządzenia wielofunkcyjne, starsze systemy NAS, stacje z przestarzałym klientem.

  - id: uwierzytelnianie-starsze
    nazwa: Starsze mechanizmy uwierzytelniania
    opis: Wycofywane protokoły i metody logowania, uwierzytelnianie między systemami.
    typowe_ofiary: Aplikacje dziedziczone, integracje bez wsparcia producenta.

  - id: konta-i-hasla
    nazwa: Konta i polityka haseł
    opis: Złożoność, rotacja i blokady haseł, konta lokalne, konta serwisowe.
    typowe_ofiary: Konta techniczne z hasłem zapisanym w konfiguracji, wspólne konta zespołowe.

  - id: makra-i-dokumenty
    nazwa: Makra i treść aktywna w dokumentach
    opis: Wykonywanie kodu osadzonego w plikach biurowych i podobnych formatach.
    typowe_ofiary: Arkusze z makrami, formularze wewnętrzne, raporty automatyczne.

  - id: skrypty-i-automatyzacja
    nazwa: Skrypty i automatyzacja
    opis: Uruchamianie skryptów, polityki wykonywania, zadania harmonogramu.
    typowe_ofiary: Skrypty logowania, zadania nocne, własne narzędzia administracyjne.

  - id: zarzadzanie-zdalne
    nazwa: Zdalne zarządzanie
    opis: Zdalne wykonywanie poleceń, konsole zarządzania, agenci monitorujący.
    typowe_ofiary: Systemy monitoringu, narzędzia pomocy technicznej, orkiestracja.

  - id: pulpit-zdalny
    nazwa: Pulpit zdalny
    opis: Graficzny dostęp zdalny do systemu.
    typowe_ofiary: Praca zdalna, dostęp serwisowy dostawcy, stacje w oddziałach.

  - id: drukowanie
    nazwa: Drukowanie
    opis: Kolejki wydruku, serwery druku, instalacja sterowników drukarek.
    typowe_ofiary: Drukarki sieciowe bez podpisanych sterowników, druk współdzielony.

  - id: sterowniki-i-urzadzenia
    nazwa: Sterowniki i urządzenia
    opis: Instalacja i ładowanie sterowników, urządzenia peryferyjne.
    typowe_ofiary: Sprzęt pomiarowy, czytniki, starsze urządzenia bez podpisu.

  - id: nosniki-wymienne
    nazwa: Nośniki wymienne
    opis: Pamięci USB, dyski zewnętrzne, nagrywarki.
    typowe_ofiary: Przenoszenie danych między strefami, kopie wykonywane ręcznie.

  - id: siec-i-zapora
    nazwa: Sieć i zapora
    opis: Reguły zapory, wykrywanie w sieci, protokoły pomocnicze.
    typowe_ofiary: Aplikacje nasłuchujące na nietypowych portach, wykrywanie urządzeń.

  - id: szyfrowanie-i-tls
    nazwa: Szyfrowanie i TLS
    opis: Wersje protokołów, zestawy szyfrów, wymagania wobec certyfikatów.
    typowe_ofiary: Starsi klienci, urządzenia wbudowane, integracje bez aktualizacji.

  - id: wirtualizacja-i-kontenery
    nazwa: Wirtualizacja i kontenery
    opis: Funkcje hipernadzorcy, izolacja, środowiska kontenerowe.
    typowe_ofiary: Maszyny wirtualne zagnieżdżone, środowiska deweloperskie.

  - id: aktualizacje-i-serwis
    nazwa: Aktualizacje i serwisowanie
    opis: Pobieranie i instalacja poprawek, okna serwisowe, wymuszony restart.
    typowe_ofiary: Maszyny pracujące ciągle, stacje bez stałego połączenia.

  - id: rejestrowanie-i-audyt
    nazwa: Rejestrowanie i audyt
    opis: Zakres zdarzeń, rozmiar i retencja dzienników, przekazywanie zdarzeń.
    typowe_ofiary: Maszyny z małym dyskiem, systemy zbierania logów o limitowanej przepustowości.

  - id: rozruch-i-firmware
    nazwa: Rozruch i oprogramowanie układowe
    opis: Bezpieczny rozruch, szyfrowanie dysku, ustawienia sprzętowe.
    typowe_ofiary: Starszy sprzęt, systemy uruchamiane z nośnika, podwójny rozruch.

  - id: uslugi-serwera-www
    nazwa: Usługi serwera WWW
    opis: Konfiguracja serwera aplikacyjnego, moduły, nagłówki, obsługa żądań.
    typowe_ofiary: Aplikacje dziedziczone, integracje oparte na nietypowych nagłówkach.

  - id: interfejs-uzytkownika
    nazwa: Wygląd i zachowanie systemu
    opis: Ekran blokady, komunikaty, personalizacja, dostępne elementy interfejsu.
    typowe_ofiary: Przyzwyczajenia użytkowników, stanowiska współdzielone, kioski.
