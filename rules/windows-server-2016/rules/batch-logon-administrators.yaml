id: win2016-batch-logon-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Logowanie w trybie wsadowym zastrzeżone dla administratorów
    en: Batch job sign-in restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zawęża listę kont uprawnionych do logowania w trybie wsadowym do grupy
    administratorów lokalnych.

    Tryb wsadowy jest tym, w którym loguje się zadanie harmonogramu. Uprawnienie
    to rozstrzyga więc, na jakich kontach w ogóle da się zadanie uruchomić —
    a na serwerze z długą historią lista zadań bywa najstarszą i najmniej
    przeglądaną częścią konfiguracji.

    Wartość zawężenia polega na tym, co się przy okazji ujawnia. Zadanie
    ustawione na koncie, które po zmianie traci to uprawnienie, przestaje
    działać i zgłasza się — a razem z nim zgłasza się fakt, że takie zadanie
    w ogóle istniało. Bywa to jedyny sposób, żeby dowiedzieć się o zadaniach
    założonych lata temu przez ludzi, których dawno nie ma.

    Kategoria średnia. Punkt nie zamyka drogi wejścia, tylko ogranicza pole, na
    którym daje się trwale zagnieździć, i porządkuje to, co na maszynie już jest.

    Na serwerze 2016 warto to ustawić razem z odmową dla gości. Te dwie reguły
    opisują ten sam tryb z dwóch stron i obie mają sens dopiero razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchamiania zadań na kontach, których nikt nie wiąże z pracą maszyny.
  en: |
    The item narrows the list of accounts permitted to sign in as a batch job to
    the local administrators group.

    The batch mode is the one a scheduled task signs in by. This right therefore
    settles what accounts a task can be run under at all - and on a server with a
    long history the list of tasks is sometimes the oldest and least reviewed part
    of the configuration.

    The value of narrowing lies in what comes to light along the way. A task set
    under an account that loses this right after the change stops working and
    reports itself - and with it reports the fact that such a task existed at all.
    That is sometimes the only way to learn of tasks set up years ago by people
    long gone.

    The category is medium. The item closes no way in; it limits the ground on
    which one can settle permanently, and tidies what is already on the machine.

    On Server 2016 it is worth setting together with the refusal for guests. The
    two rules describe the same mode from two sides and both make sense only
    together.

    What an attacker gains while the item goes unmet: the means of running tasks
    under accounts nobody connects with the machine's work.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy listy zadań harmonogramu.

    Na maszynie nietkniętej lista uprawnionych zawiera zwykle administratorów
    i operatorów kopii zapasowych, a zawężenie jej dotknie zadań ustawionych na
    kontach usługowych. Typowe przypadki to zadania kopii zapasowej, zadania
    raportowe aplikacji branżowej i skrypty porządkowe z czasów wdrożenia.

    Objaw jest jednoznaczny: zadanie kończy się błędem logowania i nie wykonuje
    się wcale. Nie ma tu cichego niepowodzenia, ale też nie ma ostrzeżenia
    z wyprzedzeniem — dowiemy się w porze, na którą zadanie było ustawione.

    Dlatego kolejność jest taka: najpierw przegląd zadań, potem zmiana. Zadanie
    faktycznie potrzebne warto przenieść na konto systemowe, które tego
    uprawnienia nie wymaga, a nie zostawiać wpisu na liście.

    Czego to nie psuje: zadań działających na koncie systemowym, usług,
    logowania ani pracy przez pulpit zdalny.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about the list of scheduled
    tasks.

    On an untouched machine the permitted list usually holds the administrators and
    the backup operators, and narrowing it will touch tasks set under service
    accounts. The usual cases are backup jobs, reporting jobs of a
    line-of-business application, and housekeeping scripts from the time of
    deployment.

    The symptom is unambiguous: the task ends in a sign-in error and does not run
    at all. There is no silent failure here, but no advance warning either - we
    learn of it at the hour the task was set for.

    The order is therefore this: the review of tasks first, the change after. A
    task genuinely needed is worth moving onto the system account, which does not
    require this right, rather than leaving an entry on the list.

    What this does not break: tasks running under the system account, services,
    signing in, or work through remote desktop.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Zadanie harmonogramu ustawione na koncie usługowym spoza grupy administratorów przestaje się uruchamiać
      - Błąd wychodzi dopiero w porze, na którą zadanie było ustawione, a nie w chwili zmiany
      - Zadania kopii zapasowej i skrypty porządkowe z czasów wdrożenia bywają pierwszymi, które zamilkną
      - Zadania działające na koncie systemowym, usługi i pulpit zdalny działają bez zmian
    en:
      - A scheduled task set under a service account outside the administrators group stops starting
      - The error comes out at the hour the task was set for, not at the moment of the change
      - Backup jobs and housekeeping scripts from the time of deployment tend to be the first to fall silent
      - Tasks running under the system account, services and remote desktop work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie przejrzano listy zadań harmonogramu pod kątem kont, na których są ustawione
    en:
      - The list of scheduled tasks has not been reviewed for the accounts they are set under
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeBatchLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeBatchLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeBatchLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Review the scheduled tasks first. A task under an account taken off this list
    # fails at the hour it was set for, not at the moment of the change.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeBatchLogonRight = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeBatchLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/log-on-as-a-batch-job

notes:
  pl: |
    Tryb wsadowy jest osobny od trybu usługi. Zadanie harmonogramu loguje się
    wsadowo, usługa systemowa — jako usługa, i uprawnienia te nie pokrywają się
    wcale.

    Zadanie ustawione na koncie systemowym nie korzysta z tego uprawnienia
    i zmiana go nie dotyczy. To jest zwykle właściwa odpowiedź na zadanie, które
    naprawdę musi działać.

    Punkt warto czytać razem z regułą odmawiającą logowania wsadowego grupie
    Goście. Ta mówi, komu wolno; tamta, komu odmawia się niezależnie od
    członkostwa.
  en: |
    The batch mode is separate from the service mode. A scheduled task signs in as
    a batch job, a system service as a service, and the two rights do not overlap
    at all.

    A task set under the system account does not use this right and the change does
    not touch it. That is usually the right answer for a task that genuinely has to
    run.

    The item is worth reading together with the rule refusing batch sign-in to the
    Guests group. This one says who is permitted; that one, who is refused
    regardless of membership.
