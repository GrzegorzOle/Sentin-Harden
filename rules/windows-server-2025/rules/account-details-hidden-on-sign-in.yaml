id: win2025-account-details-hidden-on-sign-in

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Dane konta ukryte na ekranie logowania
    en: Account details hidden on the sign-in screen
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ukrywa dane konta — adres pocztowy albo nazwę użytkownika — na
    ekranie logowania maszyny zablokowanej. Jest regułą symetryczną wobec
    zakazu wyliczania kont połączonych z usługą sieciową i te dwie rzeczy
    wypada stosować razem, bo zamykają dwa końce tej samej szpary.

    Różnica jest taka, że tamten punkt dotyczy ekranu przed zalogowaniem
    kogokolwiek, a ten — ekranu maszyny, na której ktoś już jest
    zalogowany i która została zablokowana. Ukrywa się wtedy dane osoby,
    której sesja trwa.

    Obniżam kategorię do niskiej z tego samego powodu, dla którego
    obniżyłem tamtą: ekran zablokowanego serwera nie jest przez nikogo
    oglądany. Co więcej, na serwerze sesja z konsoli zwykle w ogóle nie
    zostaje zablokowana — zostaje zamknięta, bo administrator kończy
    pracę i się wylogowuje. Blokada, której ten punkt dotyczy, częściej
    nie zachodzi wcale.

    Wartość pozostaje ta sama co przy tamtej regule i wraca w tych samych
    dwóch przypadkach: na serwerze terminali i tam, gdzie konsola jest
    dostępna przez kartę zarządzającą albo hipernadzorcę. Wtedy ekran
    zablokowanej sesji administratora ogląda każdy, kto ma dostęp do tej
    konsoli — a jest to zwykle więcej osób, niż wynika ze spisu
    administratorów serwera.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwę albo
    adres osoby, której sesja właśnie trwa na tej maszynie.
  en: |
    The item hides the details of an account - a postal address or a user's name - upon the sign-in
    screen of a locked machine. It is a rule symmetrical to the forbidding of the enumerating of
    accounts bound to a network service, and those two things are fitly laid on together, shutting as
    they do the two ends of the same chink.

    The difference is that the other item bears on the screen before anybody has signed in, and this
    one on the screen of a machine whereon somebody is signed in already and which has been locked.
    What is hidden then are the details of the person whose sitting lasts.

    I lower the category to low of the same ground whereof I lowered the other - the screen of a
    locked server is looked upon by nobody. What is more, on a server a sitting at the board is
    mostly not locked at all - it is shut, the administrator ending their work and signing out. The
    locking this item bears on more often comes not about.

    The worth stays the same as at the other rule and comes back in the same two cases - on a server
    of terminals and where the board is come at through a card of ruling or an overseer. Then the
    screen of an administrator's locked sitting is looked upon by everyone with a reach to that
    board - and that is mostly more people than follows from the roll of the server's
    administrators.

    What an attacker gains while the item goes unmet - the name or the address of the person whose
    sitting lasts upon that machine just then.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" tak samo jak przy regule
    siostrzanej i z tych samych powodów.

    Zmiana nie dotyka logowania. Konta, hasła, sesje zdalne i zadania
    działają bez zmian. Zmienia się wyłącznie to, co widać na ekranie
    maszyny zablokowanej.

    Skutek praktyczny jest jeden: odblokowując sesję trzeba wpisać nazwę
    konta, zamiast znaleźć ją już wpisaną. Na serwerze robi to
    administrator, który tę nazwę zna.

    Jest jedna sytuacja, w której zmiana bywa odczuwalna, i wolę ją
    wskazać niż pominąć. Na maszynie wspólnej, do której konsoli podchodzi
    po kolei kilka osób, widoczna nazwa mówi, czyja sesja jest otwarta —
    i bywa używana jako sposób sprawdzenia, czy można tę sesję zamknąć.
    Po zmianie trzeba to ustalić inaczej, poleceniem wypisującym sesje.
    Nie jest to strata ochrony, tylko strata wygody opartej na tym, co
    właśnie zdejmujemy.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    I leave the class "no disruption" even as at the sister rule and of the same grounds.

    The change touches not the signing in. The accounts, the passwords, the far-off sittings and the
    tasks work unaltered. What alters is only what is seen upon the screen of a locked machine.

    The outcome in practice is one - at the unlocking of a sitting the account's name must be typed
    in place of being found already typed. On a server that is done by an administrator who knows
    that name.

    There is one case wherein the change can be marked, and I would rather name it than pass it over.
    On a shared machine, to whose board several people come one after another, the name seen says
    whose sitting is open - and it is at times used as a way of looking into whether that sitting may
    be shut. After the change that must be settled otherwise, by a command writing the sittings out.
    It is no loss of guarding but a loss of an ease resting upon the very thing we take away.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Odblokowując sesję trzeba wpisać nazwę konta, zamiast znaleźć ją już wpisaną
      - Na maszynie wspólnej widoczna nazwa bywała sposobem sprawdzenia, czyja sesja jest otwarta
      - Po zmianie otwartą sesję trzeba ustalić poleceniem wypisującym sesje
      - Zmiana nie dotyka logowania, kont, haseł ani sesji zdalnych
      - Na serwerze sesja z konsoli częściej jest zamykana niż blokowana, więc zmiana bywa bez skutku
    en:
      - At the unlocking of a sitting the account's name must be typed in place of being found already typed
      - On a shared machine the name seen was at times a way of looking into whose sitting is open
      - After the change an open sitting must be settled by a command writing the sittings out
      - The change touches not the signing in, the accounts, the passwords nor the far-off sittings
      - On a server a sitting at the board is more often shut than locked, so the change is at times without outcome
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'BlockUserFromShowingAccountDetailsOnSignin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'BlockUserFromShowingAccountDetailsOnSignin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sister setting to DontEnumerateConnectedUsers: the two shut the two ends
    # of the same chink and are fitly applied together.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockUserFromShowingAccountDetailsOnSignin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Reguła symetryczna wobec zakazu wyliczania kont połączonych z usługą
    sieciową: tamta dotyczy ekranu przed zalogowaniem kogokolwiek, ta —
    ekranu maszyny zablokowanej z trwającą sesją. Wypada stosować je
    razem, bo zamykają dwa końce tej samej szpary.

    Kategoria obniżona z tego samego powodu: ekranu zablokowanego serwera
    nikt nie ogląda, a sesja z konsoli częściej bywa zamykana niż
    blokowana.

    Wartość wraca na serwerze terminali i tam, gdzie konsola jest
    dostępna przez kartę zarządzającą albo hipernadzorcę — a dostęp do
    niej ma zwykle więcej osób, niż wynika ze spisu administratorów.
  en: |
    A rule symmetrical to the forbidding of the enumerating of accounts bound to a network service -
    the other bears on the screen before anybody has signed in, this one on the screen of a locked
    machine with a lasting sitting. They are fitly laid on together, shutting as they do the two ends
    of the same chink.

    The category is lowered of the same ground - the screen of a locked server is looked upon by
    nobody, and a sitting at the board is more often shut than locked.

    The worth comes back on a server of terminals and where the board is come at through a card of
    ruling or an overseer - and a reach to it is mostly held by more people than follows from the
    roll of administrators.
