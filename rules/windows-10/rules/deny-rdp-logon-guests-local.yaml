id: win10-deny-rdp-logon-guests-local

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odmowa logowania przez pulpit zdalny dla gości i kont lokalnych
    en: Denial of Remote Desktop sign-in for guests and local accounts
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odmawia logowania przez pulpit zdalny grupie Goście oraz
    całej klasie kont lokalnych.

    Druga część jest tu istotniejsza i warto zacząć od niej. Konta lokalne
    istnieją osobno na każdej maszynie, a hasła administratorów lokalnych
    bywają wszędzie takie same — bo tak wygodniej je pamiętać, bo tak
    postawił je obraz instalacyjny, bo nikt nigdy ich nie zmieniał.

    Skutkiem jest to, że hasło odczytane z jednej maszyny otwiera wszystkie
    pozostałe. Napastnik nie musi zdobywać niczego nowego: wystarczy, że
    połączy się pulpitem zdalnym do kolejnej maszyny tym samym
    poświadczeniem. Jest to podstawowa droga ruchu bocznego w sieci
    z jednolitym obrazem.

    Odmowa dla klasy kont lokalnych zamyka tę drogę na poziomie prawa,
    a nie hasła. Nie trzeba zmieniać haseł ani ich różnicować — konto
    lokalne po prostu nie zaloguje się zdalnie, niezależnie od tego, czy
    hasło się zgadza.

    Zdalny dostęp pozostaje dla kont domenowych, które są jedne dla całej
    sieci i podlegają jednej kontroli.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przejście
    z maszyny na maszynę jednym hasłem administratora lokalnego.
  en: |
    The setting denies a signing in by remote desktop to the Guests group and to the whole class of local
    accounts.

    The second part weighs the more here, and is worth beginning with. Local accounts stand apart upon every
    machine, and the passwords of local administrators are at times the same everywhere - because it is handier to
    call them to mind so, because an image of installing set them so, because nobody ever changed them.

    The upshot is that a password read off one machine opens all the rest. The attacker need win nothing new: it
    is enough to reach the next machine by remote desktop with that same credential. It is the chief road of
    sideways movement in a network built from one image.

    The denial to the class of local accounts shuts that road at the level of a right and not of a password. There
    is no need to change passwords nor to make them differ - a local account simply will not sign in from afar,
    whether the password agrees or not.

    The way in from afar remains for domain accounts, which are one for the whole network and stand under one
    watching.

    What an attacker gains while the item goes unmet: a passage from machine to machine by one local
    administrator's password.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, kto
    łączy się dzisiaj pulpitem zdalnym kontem lokalnym.

    Przypadek pierwszy to maszyny poza domeną. Tam konto lokalne jest
    jedynym, jakie istnieje, więc odmowa odcina zdalny dostęp całkowicie.
    Jest to skutek poważny i trzeba go rozstrzygnąć przed zmianą, a nie po.

    Przypadek drugi to obsługa techniczna. Wsparcie często łączy się
    kontem lokalnym właśnie dlatego, że działa ono także wtedy, gdy
    maszyna straciła łączność z domeną. Po zmianie ta droga ratunkowa
    przestaje istnieć i trzeba mieć inną.

    Przypadek trzeci to serwery i stanowiska zarządzane zdalnie przez
    oprogramowanie łączące się kontem lokalnym. Warto przejrzeć, czym takie
    narzędzia się uwierzytelniają.

    Odnotowuję, że odmowa dotyczy wyłącznie pulpitu zdalnego. Logowanie
    lokalne kontem lokalnym działa dalej, więc dostęp przy maszynie
    pozostaje.

    Skutek pojawia się natychmiast. Sesja zdalna już otwarta trwa do
    rozłączenia.

    Czego to nie psuje: logowania lokalnego, zdalnego dostępu kontem
    domenowym, udziałów plikowych, drukowania, pracy z plikami.
  en: |
    The class is "needs review", and the object of the review is who signs in by remote desktop with a local
    account today.

    The first case is machines outside a domain. There a local account is the only one there is, so the denial
    cuts off the way in from afar wholly. It is a grave consequence and has to be settled before the change and
    not after.

    The second case is the technical support. Support often comes in by a local account for the very reason that
    it works when a machine has lost its way to the domain as well. After the change that road of rescue ceases to
    be, and another has to be at hand.

    The third case is servers and stations managed from afar by software that comes in by a local account. It is
    worth looking through what such tools prove themselves by.

    I set down that the denial touches remote desktop alone. A signing in locally with a local account works on,
    so the way in at the machine remains.

    The consequence shows at once. A session from afar already open lasts until it is broken off.

    What this does not break: logging on locally, the way in from afar by a domain account, file shares, printing,
    or work with files.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Na maszynie poza domeną odmowa odcina zdalny dostęp całkowicie, bo konto lokalne jest tam jedynym
      - Wsparcie techniczne straci drogę ratunkową, z której korzysta, gdy maszyna traci łączność z domeną
      - Oprogramowanie zarządzające zdalnie, uwierzytelniające się kontem lokalnym, przestanie się łączyć
      - Logowanie lokalne kontem lokalnym działa dalej, więc dostęp przy maszynie pozostaje
      - Zdalny dostęp kontem domenowym, udziały plikowe, drukowanie i praca z plikami pozostają bez zmian
    en:
      - Upon a machine outside a domain the denial cuts off the way in from afar wholly, a local account being the only one there
      - The technical support will lose the road of rescue it uses when a machine loses its way to the domain
      - Software managing from afar and proving itself by a local account will cease to come in
      - A signing in locally with a local account works on, so the way in at the machine remains
      - The way in from afar by a domain account, file shares, printing and work with files stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny nie należą do domeny i konto lokalne jest jedynym sposobem połączenia się z nimi zdalnie
      - Procedura wsparcia opiera się na koncie lokalnym używanym wtedy, gdy maszyna straci łączność z domeną
    en:
      - The machines do not belong to a domain and a local account is the only way of reaching them from afar
      - The procedure of the support rests upon a local account used when a machine loses its way to the domain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '(?=.*S-1-5-32-546)(?=.*S-1-5-113)'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeDenyRemoteInteractiveLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two sets are denied at once: the guests and the whole class of local accounts.
    # The second is what closes the road that a password reused across machines opens.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $members = @()
    if ($text -match '(?m)^SeDenyRemoteInteractiveLogonRight\s*=\s*(.*)$') {
      $members = @($Matches[1].Trim() -split ',' | Where-Object { $_.Trim() -ne '' } | ForEach-Object { $_.Trim() })
    }
    # The right is replaced wholesale, so whoever is already denied has to be
    # carried over - otherwise the change would quietly grant somebody access.
    foreach ($sid in @('*S-1-5-32-546', '*S-1-5-113')) {
      if (-not ($members -contains $sid)) { $members += $sid }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyRemoteInteractiveLogonRight = ' + ($members -join ',')),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeDenyRemoteInteractiveLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/deny-log-on-through-remote-desktop-services

notes:
  pl: |
    Reguła jest w grupie odmów jedyną, która odmawia czegoś klasie kont,
    a nie jednej grupie. Warto, żeby aplikacja to podkreśliła, bo stąd
    bierze się zarówno jej wartość, jak i koszt.

    Argument wart zachowania dotyczy ruchu bocznego. Napastnik, który
    zdobył jedną maszynę, prawie nigdy na niej nie poprzestaje — a hasło
    administratora lokalnego jest najtańszą walutą do kupienia kolejnych.
    Punkt ten unieważnia tę walutę bez dotykania samych haseł, i na tym
    polega jego wartość: działa niezależnie od tego, czy hasła są
    jednakowe.

    Odnotowuję, że reguła nie zastępuje różnicowania haseł lokalnych, tylko
    je uzupełnia. Zamyka drogę zdalną, ale hasło odczytane z maszyny nadal
    otwiera konto przy tej maszynie. Aplikacja powinna powiedzieć to
    wprost, żeby punkt zielony w raporcie nie został odczytany jako
    rozwiązanie całego problemu.
  en: |
    The rule is the only one of the group of denials that denies something to a class of accounts and not to one
    group. It is well that the application stress it, both its worth and its cost springing from that.

    The argument worth keeping touches sideways movement. An attacker who has won one machine almost never stops
    there - and a local administrator's password is the cheapest coin for buying the next. This item makes that
    coin worthless without touching the passwords at all, and therein lies its worth: it works whether the
    passwords are alike or not.

    I set down that the rule does not take the place of making local passwords differ but stands beside it. It
    shuts the road from afar, while a password read off a machine still opens the account at that machine. The
    application ought to say so outright, that a green item in the report be not read as the whole trouble
    settled.
