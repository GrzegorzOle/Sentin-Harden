id: win2016-system-log-size

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > System
  title:
    pl: Maksymalny rozmiar dziennika systemu
    en: Maximum size of the system log
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę pojemności dziennika systemu.

    Dziennik ten zbiera zdarzenia jądra, sterowników i usług. Dla
    bezpieczeństwa najważniejsze są dwie rzeczy, które trafiają wyłącznie tutaj:
    instalacja nowej usługi oraz wczytanie sterownika.

    Nowa usługa jest — obok nowego konta i zadania w harmonogramie — trzecią
    klasyczną drogą utrwalenia dostępu, a zarazem najtrwalszą, bo usługa
    uruchamia się przy każdym starcie maszyny, niezależnie od tego, czy ktoś
    się zalogował. Zapis o jej zainstalowaniu powstaje w dzienniku systemu
    i nigdzie indziej.

    Wczytanie sterownika jest drugą taką rzeczą i ma wagę jeszcze wyższą, bo
    sterownik działa w jądrze. Zdarzenie mówi, co zostało wczytane i kiedy —
    a to jest pierwsza rzecz, jakiej się szuka przy podejrzeniu, że coś działa
    poniżej systemu.

    Kategoria średnia: dziennik systemu nie zawiera zapisu logowań ani zmian
    uprawnień, ale zawiera te dwa rodzaje zdarzeń, których nie da się odtworzyć
    z żadnego innego źródła.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nadpisanie
    zapisu o zainstalowaniu usługi albo wczytaniu sterownika przez zwykły ruch
    systemowy, zanim ktokolwiek zajrzy.
  en: |
    The item sets a lower bound on the system log's capacity.

    That log gathers events of the kernel, of drivers and of services. For security
    two things matter most, and they go here alone: the installation of a new
    service and the loading of a driver.

    A new service is - beside a new account and a scheduled task - the third classic
    road to making access last, and at the same time the most lasting, since a
    service starts with every start of the machine, whether anybody signed in or
    not. The record of its installation arises in the system log and nowhere else.

    The loading of a driver is the second such thing and weighs higher still, a
    driver running in the kernel. The event says what was loaded and when - and that
    is the first thing looked for when something is suspected of running below the
    system.

    The category is medium: the system log holds no record of sign-ins or of changes
    of rights, but it holds those two kinds of event, reconstructible from no other
    source.

    What an attacker gains while the item goes unmet: the overwriting of the record
    of a service installed or a driver loaded by ordinary system traffic, before
    anybody looks.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zwiększenie pojemności jest zajęciem miejsca na
    dysku i niczym poza tym, a miejsce rezerwowane jest stopniowo.

    Wartość wymagana jest skromna i na typowym serwerze wystarcza na tygodnie
    historii, bo dziennik systemu rośnie wolno. Wyjątkiem są maszyny
    z uszkodzonym sprzętem albo ze sterownikiem zgłaszającym błąd w pętli —
    tam dziennik potrafi zapełnić się w godziny, ale jest to usterka do
    naprawienia, a nie powód do rezygnacji z punktu.

    Nic przy tym nie przestaje działać. Usługi i sterowniki zgłaszają zdarzenia
    tak samo, narzędzia czytają dziennik tak samo.

    Czego to nie psuje: pracy usług, wczytywania sterowników, odczytu dziennika
    ani przekazywania zdarzeń poza maszynę.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Enlarging the capacity is the taking of room on a
    disk and nothing besides, and the room is claimed gradually.

    The required value is modest and on a typical server suffices for weeks of
    history, the system log growing slowly. The exception is machines with faulty
    hardware or a driver reporting an error in a loop - there the log can fill in
    hours, but that is a fault to be repaired rather than a reason to forgo the
    item.

    Nothing stops working while this goes on. Services and drivers report events as
    before, tools read the log as before.

    What this does not break: the work of services, the loading of drivers, the
    reading of the log, or the forwarding of events off the machine.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zwiększenie pojemności jest zajęciem miejsca na dysku i niczym poza tym
      - Na maszynie ze sterownikiem zgłaszającym błąd w pętli dziennik zapełnia się w godziny mimo większej pojemności
      - Taka pętla jest usterką do naprawienia, a nie powodem do rezygnacji z punktu
      - Praca usług, wczytywanie sterowników i odczyt dziennika działają bez zmian
    en:
      - No regression in the working - enlarging the capacity is the taking of disk room and nothing besides
      - On a machine with a driver reporting an error in a loop the log fills in hours despite the greater capacity
      - Such a loop is a fault to be repaired rather than a reason to forgo the item
      - The work of services, the loading of drivers and the reading of the log work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — wymagana pojemność jest niewielka i mieści się nawet przy małym zapasie miejsca
    en:
      - No known contraindication - the required capacity is small and fits even with little spare room
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog System -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Service installation and driver loading land here and nowhere else - those
    # two are what the capacity is for.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/eventlog/event-logging

notes:
  pl: |
    Punkt jest oceniony wyżej niż dziennik aplikacji i warto powiedzieć,
    dlaczego. Dziennik aplikacji daje kontekst; dziennik systemu daje zapis
    dwóch dróg utrwalenia dostępu, których nie widać nigdzie indziej.

    W raporcie warto czytać go razem z inspekcją innych zdarzeń dostępu do
    obiektów, która zapisuje zadania w harmonogramie. Trzy drogi utrwalenia
    dostępu leżą w trzech różnych miejscach i pokrycie wszystkich trzech jest
    warunkiem, żeby pytanie o powrót napastnika miało odpowiedź.

    Porównanie jest typu „nie mniej niż", więc większy dziennik jest zgodny.
  en: |
    The item is rated higher than the application log, and it is worth saying why.
    The application log gives context; the system log gives the record of two roads
    to making access last, visible nowhere else.

    In the report it is worth reading together with the auditing of other object
    access events, which records scheduled tasks. The three roads to persistence lie
    in three different places, and covering all three is the condition for the
    question of an attacker's return to have an answer.

    The comparison is of the "not less than" kind, so a larger log is compliant.
