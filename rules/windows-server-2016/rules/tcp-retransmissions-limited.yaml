id: win2016-tcp-retransmissions-limited

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Liczba powtórzeń wysyłki danych ograniczona do trzech
    en: The number of data send repeats limited to three
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza, ile razy maszyna powtórzy wysyłkę danych, na które
    druga strona nie odpowiedziała, zanim uzna połączenie za martwe.

    Powtarzanie jest właściwością pożądaną — pakiet ginie po drodze
    regularnie i bez powtórek sieć nie działałaby wcale. Rzecz dotyczy
    wyłącznie tego, kiedy przestać. Każde kolejne powtórzenie czeka dłużej
    niż poprzednie, więc czas od zamilknięcia drugiej strony do uznania
    połączenia za martwe rośnie szybko wraz z liczbą prób.

    Koszt tego czekania ponosi maszyna. Każde połączenie w stanie
    powtarzania trzyma miejsce w tablicy, bufor z danymi i zwykle wątek albo
    sesję po stronie aplikacji. Kto otwiera połączenia i milknie, doprowadza
    do tego, że maszyna zajmuje się wyłącznie czekaniem na odpowiedzi,
    które nie nadejdą.

    Ograniczenie liczby prób skraca ten czas o rząd wielkości. Maszyna
    szybciej rozpoznaje, że rozmówcy nie ma, i szybciej zwalnia to, co na
    niego trzymała.

    Zastrzeżenie, bez którego opis byłby nieuczciwy: zmiana zmniejsza także
    odporność na chwilowe zakłócenia w sieci. To jest jej prawdziwy koszt
    i o nim mówi ocena uciążliwości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dłuższe
    utrzymywanie zasobów maszyny przez połączenia, w których po prostu
    zamilkł — czyli tańsze doprowadzenie jej do wyczerpania.
  en: |
    The setting limits how many times the machine will repeat the sending of data
    the other side has not answered, before it takes the connection for dead.

    Repeating is a desirable property - a packet is lost along the way regularly,
    and without repeats a network would not work at all. The matter concerns only
    when to stop. Each further repeat waits longer than the last, so the time from
    the other side falling silent to the connection being taken for dead grows
    quickly with the number of attempts.

    The cost of that waiting is borne by the machine. Every connection in a state of
    repeating holds room in a table, a buffer with data, and as a rule a thread or a
    session on the application's side. Whoever opens connections and falls silent
    brings it about that the machine busies itself with nothing but waiting for
    answers that will not come.

    Limiting the number of attempts shortens that time by an order of magnitude. The
    machine recognises sooner that the other party is gone and sooner frees what it
    was holding for them.

    A reservation without which the description would be dishonest: the change also
    lessens resilience to passing disturbances in the network. That is its true
    cost, and it is what the assessment of disruption speaks of.

    What an attacker gains while the item goes unmet: a longer holding of the
    machine's resources by connections in which they simply fell silent - which is
    to say a cheaper way of exhausting it.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo zmiana dotyka odporności na
    zakłócenia, a nie funkcji.

    Rzecz, którą trzeba ocenić, brzmi: jak dobre jest łącze, przez które ta
    maszyna rozmawia. W sieci lokalnej o niskich stratach trzy powtórzenia
    wystarczają z zapasem i zmiana nie zmienia nic poza szybszym sprzątaniem.
    Im dalej od tego przypadku, tym ostrożniej.

    Gdzie bywa ciasno: połączenia przez łącza o zmiennej jakości, tunele
    przez sieć publiczną, połączenia z oddziałami przez sieć komórkową,
    łącza satelitarne. Tam chwilowe zakłócenie, które dotąd przechodziło
    niezauważone, zaczyna kończyć połączenie.

    Skutek po stronie aplikacji zależy od tego, czy umie nawiązać połączenie
    ponownie. Oprogramowanie dzisiejsze zwykle umie i objaw ogranicza się do
    opóźnienia. Starsze potrafi zgłosić błąd i zatrzymać pracę — i to jest
    ten przypadek, którego trzeba szukać przed zmianą, bo objaw pojawia się
    nieregularnie i trudno go powiązać z ustawieniem.

    Wielkie przesyłanie danych przez łącze o zmiennej jakości jest tu
    przypadkiem najgorszym: przerwanie w połowie kosztuje powtórzenie
    całości.

    Czego to nie psuje: połączeń w sieci lokalnej, usług, nowych połączeń,
    łączności jako takiej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", since the change touches resilience to
    disturbance rather than function.

    The thing to judge reads: how good is the link this machine talks over. On a
    local network with low losses three repeats are enough with room to spare and
    the change alters nothing but a quicker clearing up. The further from that case,
    the more carefully.

    Where it gets tight: connections over links of varying quality, tunnels across a
    public network, connections to branch offices over a mobile network, satellite
    links. There a passing disturbance that until now went unnoticed begins to end
    connections.

    The effect on the application's side depends on whether it can make its
    connection afresh. Present-day software as a rule can, and the symptom comes
    down to a delay. Older software can report an error and halt - and that is the
    case to look for before the change, since the symptom appears irregularly and is
    hard to tie to a setting.

    A large transfer of data over a link of varying quality is the worst case here:
    breaking off halfway costs the repeating of the whole.

    What this does not break: connections on a local network, services, new
    connections, or connectivity as such.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Połączenia przez łącza o zmiennej jakości, tunele przez sieć publiczną i łącza satelitarne zaczynają kończyć się przy chwilowym zakłóceniu
      - Starsze oprogramowanie nieumiejące nawiązać połączenia ponownie zgłasza błąd i zatrzymuje pracę, nieregularnie i trudno to powiązać z ustawieniem
      - Wielkie przesyłanie danych przez łącze o zmiennej jakości przerwane w połowie kosztuje powtórzenie całości
      - Połączenia w sieci lokalnej, usługi i nowe połączenia pozostają bez zmian
    en:
      - Connections over links of varying quality, tunnels across a public network and satellite links begin to end at a passing disturbance
      - Older software unable to make its connection afresh reports an error and halts, irregularly and hard to tie to the setting
      - A large transfer of data over a link of varying quality broken off halfway costs the repeating of the whole
      - Connections on a local network, services and new connections stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna rozmawia przez łącza o zmiennej jakości, tunele przez sieć publiczną albo łącza satelitarne
      - Na maszynie działa starsze oprogramowanie, o którym nie wiadomo, czy umie nawiązać przerwane połączenie ponownie
    en:
      - The machine talks over links of varying quality, tunnels across a public network, or satellite links
      - Older software runs on the machine and it is not known whether it can make a broken connection afresh
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'TcpMaxDataRetransmissions'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'TcpMaxDataRetransmissions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'TcpMaxDataRetransmissions' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Zastrzeżenie o odporności powinno być widoczne przy punkcie, a nie
    wyłącznie w opisie uciążliwości. Jest to jedna z niewielu reguł
    w zestawie, która wprost coś odbiera w zamian za to, co daje — i lepiej
    powiedzieć to wprost, niż pozwolić czytelnikowi odkryć to później.

    Porównanie jest „nie większe niż", bo wpis opisuje górną granicę liczby
    prób. Ustawienie ostrzejsze spełnia zasadę.

    Punkt ma bliźniaka dotyczącego protokołu szóstej wersji i oba trzeba
    wdrażać razem. Ustawienie jednego bez drugiego daje maszynę zachowującą
    się różnie w zależności od tego, którym protokołem nawiązano połączenie
    — a to jest gorsze niż jednolity wybór w którąkolwiek stronę.
  en: |
    The reservation about resilience should be visible at the item rather than in
    the description of disruption alone. It is one of the few rules in the set that
    outright takes something away in exchange for what it gives - and it is better
    said outright than left for the reader to discover later.

    The comparison is "not greater than", since the entry describes the upper bound
    of the number of attempts. A stricter setting satisfies the principle.

    The item has a twin concerning the sixth version protocol and the two must be
    rolled out together. Setting one without the other gives a machine behaving
    differently depending on which protocol the connection was made over - and that
    is worse than a uniform choice either way.
