id: win2016-credssp-encryption-oracle-remediation

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Credentials Delegation
  title:
    pl: Odmowa połączenia z serwerami bez poprawki mechanizmu delegowania poświadczeń
    en: Connections refused to servers without the credential delegation fix
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe odmawiać połączeń do maszyn, w których mechanizm
    delegowania poświadczeń nie został naprawiony.

    Naprawiony błąd polegał na tym, że mechanizm ten dawał się nakłonić do
    zdradzenia sesji, w której przekazywane jest poświadczenie. Napastnik
    siedzący na drodze ruchu mógł doprowadzić do tego, że poświadczenie
    przekazane z klienta do serwera stawało się dla niego czytelne — a wraz
    z nim uzyskiwał prawo wykonania poleceń na maszynie docelowej
    w imieniu tego konta.

    Poprawka zmieniła obie strony, klienta i serwer. Ustawienie rozstrzyga,
    jak ta maszyna ma się zachować, gdy trafi na stronę nienaprawioną:
    połączyć się mimo wszystko, czy odmówić. Wartość wymagana każe odmówić.

    Powód, dla którego odmowa jest tu właściwa, warto nazwać. Połączenie do
    maszyny nienaprawionej nie jest ryzykiem tamtej maszyny, tylko tej —
    to poświadczenie stąd zostanie przekazane i to ono może zostać odczytane.
    Zgoda na takie połączenie jest zgodą na oddanie własnego poświadczenia
    w warunkach, o których wiadomo, że są niebezpieczne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odczytania poświadczenia przekazywanego z tej maszyny przy połączeniu do
    maszyny nienaprawionej i wykonania poleceń w imieniu tego konta.
  en: |
    The setting has connections refused to machines whose credential delegation
    mechanism has not been fixed.

    The fault that was fixed lay in that mechanism being open to persuasion to give
    away the session in which a credential is passed. An attacker sitting on the
    road of the traffic could bring it about that a credential passed from client to
    server became readable to them - and with it they gained the right to run
    commands on the target machine in that account's name.

    The fix changed both sides, the client and the server. The setting settles how
    this machine is to behave when it meets an unfixed side: connect all the same,
    or refuse. The required value has it refuse.

    The reason why refusal is right here is worth naming. A connection to an unfixed
    machine is not that machine's risk but this one's - it is the credential from
    here that will be passed and it that may be read. Consenting to such a
    connection is consenting to give away one's own credential in conditions known
    to be dangerous.

    What an attacker gains while the item goes unmet: the means of reading a
    credential passed from this machine on connecting to an unfixed one, and of
    running commands in that account's name.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i cały ciężar leży w tym, czego
    maszyna nie wie o drugiej stronie.

    Skutek jest prosty do opisania i trudny do przewidzenia: połączenie do
    maszyny bez poprawki zostaje odrzucone. Kłopot w tym, że listy takich
    maszyn nikt nie ma. Poprawka jest starsza niż to wydanie systemu, więc
    maszyny aktualizowane ją mają — ale w każdej sieci znajdą się maszyny,
    których nie aktualizowano: wyłączone z obsługi, zapomniane, utrzymywane
    przez kogoś innego, dostarczone przez producenta urządzenia jako część
    rozwiązania.

    Szczególnie trzeba uważać na maszynę pełniącą rolę konsoli skoku. Z niej
    łączy się dalej do wielu miejsc, więc to ona najszybciej natrafi na
    stronę nienaprawioną — i natrafi na nią zwykle w najgorszym możliwym
    momencie, czyli podczas awarii, gdy ktoś próbuje się gdzieś dostać
    w pośpiechu.

    Objaw jest jednoznaczny, ale komunikat mówi o błędzie uwierzytelniania,
    a nie o poprawce, więc pierwsza diagnoza zwykle idzie w stronę hasła
    albo uprawnień. To kosztuje czas dokładnie wtedy, gdy go nie ma.

    Kolejność jest zatem ustalona: najpierw wykaz maszyn, do których ktokolwiek
    łączy się z tej, potem sprawdzenie ich stanu aktualizacji, potem zmiana.

    Czego to nie psuje: połączeń do maszyn naprawionych, połączeń
    przychodzących, logowania, usług lokalnych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and all the weight lies in what the
    machine does not know about the other side.

    The effect is easy to describe and hard to foresee: a connection to a machine
    without the fix is refused. The trouble is that nobody has a list of such
    machines. The fix is older than this release of the system, so machines that are
    updated have it - but in every network there are machines that were not:
    withdrawn from support, forgotten, kept by somebody else, supplied by a device
    maker as part of a solution.

    Particular care is due on a machine serving as a jump console. From it one
    connects onward to many places, so it is the one that will meet an unfixed side
    soonest - and it will as a rule meet it at the worst possible moment, that is
    during an outage, when somebody is trying to get somewhere in haste.

    The symptom is unambiguous, but the message speaks of an authentication error
    rather than of a fix, so the first diagnosis as a rule goes towards the password
    or the privileges. That costs time exactly when there is none.

    The order is therefore settled: first a list of the machines anybody connects to
    from this one, then a check of their update state, then the change.

    What this does not break: connections to fixed machines, incoming connections,
    signing in, or local services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - legacy-applications
  what_breaks:
    pl:
      - Połączenie do maszyny bez poprawki zostaje odrzucone, a komunikat mówi o błędzie uwierzytelniania, więc pierwsza diagnoza idzie w stronę hasła
      - Konsola skoku, z której łączy się dalej do wielu miejsc, natrafi na stronę nienaprawioną najszybciej i zwykle podczas awarii
      - Maszyny wyłączone z obsługi, zapomniane albo dostarczone przez producenta urządzenia jako część rozwiązania przestają być osiągalne
      - Połączenia do maszyn naprawionych, połączenia przychodzące, logowanie i usługi lokalne pozostają bez zmian
    en:
      - A connection to a machine without the fix is refused, and the message speaks of an authentication error, so the first diagnosis goes towards the password
      - A jump console connecting onward to many places will meet an unfixed side soonest, and as a rule during an outage
      - Machines withdrawn from support, forgotten, or supplied by a device maker as part of a solution cease to be reachable
      - Connections to fixed machines, incoming connections, signing in and local services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie sporządzono wykazu maszyn, do których ktokolwiek łączy się z tej, ani nie sprawdzono ich stanu aktualizacji
      - Maszyna pełni rolę konsoli skoku i odmowa połączenia ujawniłaby się przy pierwszej awarii, a nie przy planowanym teście
    en:
      - No list has been drawn up of the machines anybody connects to from this one, nor has their update state been checked
      - The machine serves as a jump console and a refused connection would show at the first outage rather than at a planned test
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
      $name = 'AllowEncryptionOracle'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
    $name = 'AllowEncryptionOracle'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a jump host gather first the list of machines anybody connects to from
    # here: the refusal shows up at connect time, usually during an outage.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowEncryptionOracle' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/credential-guard-considerations

notes:
  pl: |
    Wpis, na którym ta reguła stoi, pojawił się w systemie wraz z poprawką
    wydaną po ujawnieniu błędu. Na maszynie bez aktualizacji z tego okresu
    ustawienie zostanie zapisane, ale nie przyniesie skutku — warto to
    sprawdzić przed przypisaniem punktowi statusu spełnionego.

    Punkt jest przykładem reguły, której koszt ponosi się raz, a ryzyko
    odkłada na moment najgorszy z możliwych. Odmowa połączenia w czasie
    awarii bywa droższa niż sam błąd, przed którym reguła broni — i właśnie
    dlatego wykaz maszyn docelowych jest tu częścią wdrożenia, a nie
    zaleceniem.

    Aplikacja powinna pokazywać ten punkt razem z regułą o delegowaniu
    poświadczeń w postaci chronionej. Obie dotyczą tego samego: co dzieje
    się z poświadczeniem wysłanym z tej maszyny gdzie indziej. Tamta
    zmniejsza wartość tego, co zostaje po drugiej stronie; ta odmawia
    wysłania czegokolwiek tam, gdzie wiadomo, że jest niebezpiecznie.
  en: |
    The entry this rule rests on came into the system along with the fix released
    after the fault was disclosed. On a machine without updates from that period the
    setting will be written but will bring no effect - worth checking before the
    item is given the status of satisfied.

    The item is an example of a rule whose cost is borne once and whose risk is put
    off to the worst possible moment. A refused connection during an outage is at
    times dearer than the fault the rule guards against - and that is exactly why
    the list of target machines is here part of the rollout rather than a
    recommendation.

    The application should show this item together with the rule on credentials
    delegated in the protected form. Both concern the same thing: what becomes of a
    credential sent from this machine elsewhere. That one lessens the value of what
    is left on the other side; this one refuses to send anything where it is known
    to be dangerous.
