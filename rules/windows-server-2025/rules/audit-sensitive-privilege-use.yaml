id: win2025-audit-sensitive-privilege-use

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Privilege Use
  title:
    pl: Inspekcja użycia uprawnień wrażliwych
    en: Audit use of sensitive privileges
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje użycie uprawnień uznanych za wrażliwe —
    przejęcie własności pliku, podszycie się pod innego użytkownika,
    załadowanie sterownika, debugowanie cudzego procesu, działanie
    jako część systemu operacyjnego.

    Są to uprawnienia, którymi obchodzi się zwykłą kontrolę dostępu,
    a nie takie, które w jej ramach coś przyznają. Przejęcie własności
    pliku daje dostęp do danych, do których uprawnień nie ma.
    Debugowanie procesu daje dostęp do tego, co ten proces trzyma
    w pamięci — łącznie z poświadczeniami. Podszycie się pozwala działać
    jako ktoś inny.

    Na serwerze uprawnienia te ma kilka kont usługowych i zwykle
    naprawdę ich potrzebują. To jednak oznacza tyle, że użycie tych
    uprawnień przez konto spoza tej listy jest zdarzeniem wymagającym
    wyjaśnienia — a bez zapisu nie da się go nawet zauważyć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sięgnięcia po zawartość pamięci innych procesów i po pliki, do
    których nie ma uprawnień, bez zostawiania zapisu o tym, że to
    zrobił. Jest to zwykle krok pomiędzy wejściem na maszynę
    a wyniesieniem z niej czegokolwiek.
  en: |
    The subcategory records the use of privileges held to be sensitive - taking ownership of
    a file, impersonating another user, loading a driver, debugging somebody else's process,
    acting as part of the operating system.

    These are privileges by which ordinary access control is gone round rather than ones
    that grant something within it. Taking ownership of a file gives access to data one has
    no rights to. Debugging a process gives access to what that process holds in memory -
    credentials included. Impersonating allows acting as somebody else.

    On a server several service accounts have these privileges and usually really take them.
    That means, though, that the use of these privileges by an account outside that list is
    an event taking explanation - and without a record it cannot even be noticed.

    What an attacker gains while the item goes unmet: the means of reaching for the contents
    of other processes' memory and for files they have no rights to, leaving no record of
    having done it. It is usually the step between coming onto a machine and carrying
    anything off it.

disruption_description:
  pl: |
    Sprawdzenia wymaga objętość, bo jest to podkategoria o reputacji
    najbardziej hałaśliwej w całym zestawie — i reputacja ta jest
    zasłużona.

    Nic nie przestaje działać i nikt niczego nie zauważy. Koszt jest
    w całości kosztem miejsca.

    Źródłem szumu są kopie zapasowe. Program tworzący kopię używa
    uprawnienia do omijania kontroli dostępu przy każdym pliku, który
    czyta, i każde takie użycie może dać zdarzenie. Nocne zadanie kopii
    potrafi w ten sposób zapisać więcej zdarzeń niż cała reszta systemu
    w ciągu doby.

    To samo dotyczy programów antywirusowych skanujących całe dyski oraz
    narzędzi do indeksowania zawartości.

    Dlatego punkt wdraża się po policzeniu, co na tym serwerze pracuje
    nocą, i razem z powiększonym dziennikiem zabezpieczeń. Wdrożony bez
    tego potrafi wyprzeć z dziennika wszystkie pozostałe zdarzenia,
    w tym te, dla których dziennik w ogóle istnieje.

    Zmiana nie wymaga restartu i działa natychmiast.
  en: |
    What needs checking is the volume, since this is the subcategory with the reputation of
    the noisiest in the whole set - and that reputation is deserved.

    Nothing stops working and nobody notices anything. The cost is wholly one of space.

    The source of the noise is backups. A program making a backup uses the privilege of
    going round access control at every file it reads, and every such use may give an event.
    A nightly backup task can in this way record more events than the rest of the system in
    a whole day.

    The same holds for antivirus programs scanning whole disks and for tools indexing
    content.

    Hence the item is rolled out after counting what works nightly on this server, and
    together with an enlarged security log. Rolled out without that it can crowd every other
    event out of the log, including those the log exists for at all.

    The change takes no restart and works at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Brak regresji w działaniu — rośnie wyłącznie objętość dziennika zabezpieczeń
      - Nocne zadanie kopii zapasowej potrafi zapisać więcej zdarzeń niż cała reszta systemu
      - Program antywirusowy skanujący dyski daje podobny przyrost
      - Wdrożone bez powiększonego dziennika potrafi wyprzeć z niego wszystkie inne zdarzenia
    en:
      - No regression in the working - only the security log's volume grows
      - A nightly backup task can record more events than the rest of the system together
      - An antivirus program scanning disks gives a like rise
      - Rolled out without an enlarged log it can crowd every other event out of it
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
      - Na serwerze pracuje nocą kopia zapasowa obejmująca całe dyski, a strumień zdarzeń nie został policzony
      - Zdarzenia z tej maszyny są rozliczane objętościowo w systemie zbierającym
    en:
      - The security log is at its default size and there is no way of enlarging it
      - A backup covering whole disks works nightly on the server and the stream of events has not been counted
      - Events from this machine are billed by volume in the gathering system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9228-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9228-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9228-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE9228-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9228-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-sensitive-privilege-use

notes:
  pl: |
    Wymagane są oba rodzaje zapisu. Nieudana próba użycia uprawnienia
    wrażliwego jest zdarzeniem mówiącym wprost, że ktoś sięgnął po coś,
    czego nie ma — i bywa cenniejsza od użycia udanego.

    Jest to najhałaśliwsza podkategoria w całym zestawie i jedyna,
    przy której warto przed wdrożeniem sprawdzić, co pracuje na serwerze
    nocą. Kopia zapasowa obejmująca całe dyski potrafi zdominować cały
    dziennik.

    Wykaz kont używających tych uprawnień jest sam w sobie wartościowy.
    Powinien być krótki i powinien składać się z kont usługowych, które
    te uprawnienia faktycznie potrzebują. Każda inna pozycja wymaga
    wyjaśnienia.
  en: |
    Both kinds of record are taken. A failed attempt at using a sensitive privilege is an
    event saying outright that somebody reached for something they do not have - and is at
    times worth more than a successful use.

    It is the noisiest subcategory in the whole set and the one at which it is worth
    checking, before the rollout, what works on the server nightly. A backup covering whole
    disks can dominate the entire log.

    The list of accounts using these privileges is worth something in itself. It ought to be
    short and ought to consist of service accounts that really take those privileges. Every
    other entry takes explaining.
