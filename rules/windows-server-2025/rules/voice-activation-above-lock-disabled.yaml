id: win2025-voice-activation-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Privacy
  title:
    pl: Uruchamianie aplikacji głosem przy zablokowanym ekranie zabronione
    en: Activating applications by voice on a locked screen forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania aplikacjom uruchamiania się na polecenie głosowe, gdy
    ekran jest zablokowany.

    Kategoria wysoka i chcę nazwać, czym to jest naprawdę, bo brzmi jak
    udogodnienie. Jest drogą uruchomienia programu, która nie wymaga ani
    zalogowania, ani dotknięcia maszyny. Wystarczy być na tyle blisko, żeby
    mikrofon usłyszał — a jeżeli mechanizm ma nasłuchiwać, musi słuchać
    stale, także wtedy, gdy nikt nic nie mówi.

    To jest właściwa treść punktu i są w niej dwie rzeczy, nie jedna.
    Pierwsza to uruchomienie programu zza granicy uwierzytelnienia. Druga
    to sam nasłuch: włączony mikrofon w pomieszczeniu, w którym ludzie
    rozmawiają, nie wiedząc, że maszyna obok jest uszami.

    Na serwerze druga rzecz waży więcej niż pierwsza. Serwerownia bywa
    miejscem, gdzie mówi się głośno o rzeczach, o których nie mówi się
    nigdzie indziej — przy pracach, przy awarii, przy audycie. Maszyna
    nasłuchująca w takim pomieszczeniu jest urządzeniem podsłuchowym, nawet
    jeżeli nikt go tak nie planował.

    Ustawienie przyjmuje wartości ze zbioru: dwa oznacza rozstrzygnięcie
    odgórne i odmowę, zero zostawia decyzję użytkownikowi, jeden otwiera na
    stałe. Reguła oczekuje dwójki, bo tylko ona zamyka sprawę niezależnie od
    ustawień w sesji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uruchomienie
    programu bez uwierzytelnienia oraz włączony mikrofon w pomieszczeniu,
    w którym maszyna stoi.
  en: |
    The item forbids applications to start on a spoken instruction while the
    screen is locked.

    The category is high, and I want to name what this really is, because it
    sounds like a convenience. It is a way of starting a program that
    requires neither signing in nor touching the machine. It is enough to be
    near enough for the microphone to hear - and if the mechanism is to
    listen out, it must listen constantly, including when nobody is saying
    anything.

    That is the real substance of the item, and there are two things in it,
    not one. The first is the starting of a program from beyond the boundary
    of authentication. The second is the listening itself: a live microphone
    in a room where people talk without knowing the machine beside them is a
    pair of ears.

    On a server the second weighs more than the first. A server room is
    sometimes a place where things are said aloud that are said nowhere else
    - during work, during a failure, during an audit. A machine listening in
    such a room is a listening device, even if nobody planned it as one.

    The setting takes values from a set: two means the matter is settled from
    above and refused, zero leaves the decision to the user, one opens it
    permanently. The rule expects a two, because only that closes the matter
    regardless of settings inside a session.

    What an attacker gains while the item goes unmet: the starting of a
    program without authentication, and a live microphone in the room where
    the machine stands.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Na serwerze nie ma tu czego stracić: mikrofonu
    zwykle nie ma, a jeżeli jest, to dlatego że maszyna wirtualna dostała
    urządzenie od gospodarza albo sesja zdalna przekierowała własne — i to
    są dokładnie te dwa przypadki, w których reguła ma sens.

    Skutek, gdyby ktoś tego używał: program nie uruchomi się głosem przy
    zablokowanym ekranie. Po zalogowaniu wszystko działa jak wcześniej,
    o ile w sesji jest włączone.

    Czego to nie psuje: mikrofonu jako urządzenia, przekierowania dźwięku
    w sesji zdalnej, rozpoznawania mowy uruchamianego świadomie po
    zalogowaniu, ani niczego, co dzieje się po podaniu hasła.

    Rzecz do zapamiętania: ustawienie przyjmuje wartości ze zbioru, nie zero
    i jeden. Wartość zero nie oznacza tu odmowy, tylko pozostawienie decyzji
    użytkownikowi — to wpis, przy którym zero jest mylące.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption". On a server there is nothing to lose here:
    there is usually no microphone, and if there is one it is because the
    virtual machine was given a device by its host or a remote session
    redirected its own - and those are exactly the two cases in which the
    rule has a point.

    The effect, were anybody using it: a program will not start by voice
    while the screen is locked. After signing in everything works as before,
    provided it is switched on within the session.

    What this does not break: the microphone as a device, audio redirection
    in a remote session, speech recognition started deliberately after
    signing in, or anything that happens after a password is given.

    Something to remember: the setting takes values from a set, not zero and
    one. Zero does not mean refusal here but leaving the decision to the user
    - this is an entry where zero misleads.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Program nie uruchomi się poleceniem głosowym przy zablokowanym ekranie
      - Po zalogowaniu rozpoznawanie mowy działa jak wcześniej, o ile w sesji jest włączone
      - Mikrofon jako urządzenie i przekierowanie dźwięku w sesji zdalnej działają bez zmian
      - Wartość zero nie oznacza odmowy, tylko pozostawienie decyzji użytkownikowi — wymagana jest dwójka
    en:
      - A program will not start by spoken instruction while the screen is locked
      - After signing in, speech recognition works as before, provided it is switched on within the session
      - The microphone as a device and audio redirection in a remote session work unchanged
      - Zero does not mean refusal but leaving the decision to the user - a two is what is required
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem obsługiwanym głosem przez osobę, dla której jest to sposób dostępu, a nie udogodnienie
    en:
      - The machine is a workstation operated by voice by a person for whom this is a means of access rather than a convenience
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is a choice out of three. Two means the machine settles the
      # matter and refuses; zero leaves it to the user and one forces it open,
      # so both are reported with their own value.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
      $name = 'LetAppsActivateWithVoiceAboveLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
    $name = 'LetAppsActivateWithVoiceAboveLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two things, not one: a program started from beyond the boundary of
    # authentication, and a live microphone in the room. A server room is
    # sometimes where things are said aloud that are said nowhere else. Two
    # settles the matter from above; zero would only leave it to the user.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LetAppsActivateWithVoiceAboveLock' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

notes:
  pl: |
    Brzmi jak udogodnienie, a jest drogą uruchomienia programu bez
    zalogowania i bez dotknięcia maszyny. Żeby mechanizm nasłuchiwał, musi
    słuchać stale — także wtedy, gdy nikt nic nie mówi.

    Na serwerze drugie waży więcej niż pierwsze. Serwerownia bywa miejscem,
    gdzie mówi się głośno o rzeczach, o których nie mówi się nigdzie indziej.
    Maszyna nasłuchująca jest tam urządzeniem podsłuchowym, nawet jeżeli
    nikt tak tego nie planował.

    Uwaga na wartość: zero nie oznacza odmowy, tylko pozostawienie decyzji
    użytkownikowi. Sprawę zamyka dopiero dwójka.
  en: |
    It sounds like a convenience, yet it is a way of starting a program
    without signing in and without touching the machine. For the mechanism to
    listen out, it must listen constantly - including when nobody is saying
    anything.

    On a server the second weighs more than the first. A server room is
    sometimes a place where things are said aloud that are said nowhere else.
    A listening machine there is a listening device, even if nobody planned
    it as one.

    Mind the value: zero does not mean refusal but leaving the decision to
    the user. Only a two closes the matter.
