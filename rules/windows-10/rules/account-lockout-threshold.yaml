id: win10-account-lockout-threshold

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Liczba nieudanych prób przed zablokowaniem konta
    en: The count of failed tries before an account is locked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, po ilu nieudanych próbach podania hasła konto zostaje
    zablokowane.

    Blokada broni przed zgadywaniem hasła przy oknie logowania i przy usługach
    sieciowych maszyny. Napastnik próbujący haseł kolejno dostaje po piątej
    próbie konto zamknięte i musi czekać, co czyni zgadywanie bezużytecznym
    przy każdej skali.

    Ograniczenie tej ochrony trzeba znać, bo jest istotne. Blokada nie broni
    przed niczym, co dzieje się poza maszyną — odzyskiwanie hasła ze
    zdobytego skrótu odbywa się bez kontaktu z nią i licznika nie rusza.
    Broni też słabo przed zgadywaniem rozłożonym, w którym napastnik próbuje
    jednego popularnego hasła do wielu kont po kolei, bo licznik jest
    prowadzony osobno dla każdego konta.

    Wartość pięciu prób jest kompromisem między tymi dwiema rzeczami:
    ma zatrzymać zgadywanie, a nie zamykać kont ludziom, którzy po prostu
    się mylą. Wartość zero znaczy, że blokady nie ma wcale, i sprawdzenie
    rozpoznaje ją osobno, bo porównanie „nie więcej niż" przyjęłoby ją za
    wynik najlepszy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zgadywania hasła bez ograniczenia liczby prób, wprost przy maszynie albo
    przez jej usługi sieciowe.
  en: |
    The setting says after how many failed tries at a password an account gets locked.

    The lock guards against the guessing of a password at the logon window and at the machine's network
    services. An attacker trying password after password finds the account shut after the fifth try and has to
    wait, which makes guessing useless at any scale.

    The bound of that protection has to be known, being an important one. The lock guards against nothing that
    happens away from the machine - the winning back of a password from a hash taken proceeds without touching
    it and moves no counter. It guards weakly too against spread guessing, in which an attacker tries one
    popular password against many accounts in turn, the counter being kept separately for each account.

    The value of five tries is a compromise between those two things: it is to halt guessing without shutting
    accounts on people who simply make a slip. A value of nought means there is no lock at all, and the check
    recognises it apart, a "not greater than" comparison taking it for the best result.

    What an attacker gains while the item goes unmet: the means of guessing a password with no bound on the
    count of tries, straight at the machine or through its network services.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i to nie z powodu ludzi, tylko
    z powodu tego, co na maszynie loguje się samo.

    Człowiek, który pomyli hasło pięć razy, poczeka kwadrans. Jest to
    niewygodne, ale przewidywalne i da się o tym uprzedzić.

    Kłopot robią połączenia utrzymywane przez oprogramowanie. Program
    z zapisanym hasłem starym potrafi ponawiać próbę co kilka sekund
    i zamknąć konto natychmiast po każdym odblokowaniu, przez co konto
    wygląda na zablokowane na stałe, a przyczyna leży zupełnie gdzie indziej.
    Przypadek ten jest częsty i wart sprawdzenia przed wykonaniem — dotyczy
    udziałów sieciowych podłączonych ze starym hasłem, klientów poczty
    i zadań w harmonogramie.

    Osobno stoi możliwość zamknięcia kont z zewnątrz. Skoro licznik prowadzi
    się dla konta, a nie dla źródła, to ktoś znający nazwy kont może je
    zamykać celowo. Jest to koszt przyjmowany świadomie i warto, żeby opis
    go nazywał, zamiast udawać, że blokada ma same zalety.

    Czego to nie psuje: logowania przy haśle prawidłowym, kont domenowych,
    haseł, usług systemowych, sieci, aplikacji.
  en: |
    The class is "needs a planned rollout", and that not because of people but because of what on the machine
    logs in by itself.

    A person who mistakes their password five times will wait a quarter of an hour. That is inconvenient but
    foreseeable, and they can be forewarned of it.

    The trouble is made by connections kept up by software. A program holding an old password will try again
    every few seconds and shut the account at once after each unlocking, whereby the account looks locked for
    good while the cause lies somewhere else entirely. The case is a common one and worth reviewing before
    carrying out - it touches network shares joined with an old password, mail clients and scheduled tasks.

    The chance of shutting accounts from outside stands apart. The counter being kept for the account and not
    for the source, somebody who knows the accounts' names may shut them on purpose. It is a cost taken
    knowingly, and it is well that the description name it rather than pretend the lock has advantages alone.

    What this does not break: logging on with the right password, domain accounts, passwords, system services,
    the network, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - logging-and-audit
  what_breaks:
    pl:
      - Udział sieciowy podłączony ze starym hasłem zamyka konto zaraz po każdym odblokowaniu i wygląda to na blokadę trwałą
      - Klient poczty lub zadanie w harmonogramie z zapisanym hasłem starym daje ten sam objaw i tę samą trudność w rozpoznaniu
      - Człowiek, który pomyli hasło pięć razy, czeka kwadrans przed kolejną próbą
      - Ktoś znający nazwy kont może je zamykać celowo, bo licznik prowadzi się dla konta, nie dla źródła prób
      - Logowanie przy haśle prawidłowym, konta domenowe, praca usług systemowych i sieci pozostają bez zmian
    en:
      - A network share joined with an old password shuts the account right after each unlocking and it looks like a lasting lock
      - A mail client or a scheduled task holding an old password gives the same symptom and the same difficulty in recognising it
      - A person mistaking their password five times waits a quarter of an hour before the next try
      - Somebody knowing the accounts names may shut them on purpose, the counter being kept for the account and not the source
      - Logging on with the right password, domain accounts and the work of system services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie ponawiające logowanie ze starym hasłem i nie da się go na razie poprawić
      - Maszyna jest dostępna z sieci niezaufanej, a zamknięcie kont z zewnątrz byłoby dotkliwsze niż zgadywanie hasła
    en:
      - Software works on the machine retrying its logon with an old password and cannot for now be mended
      - The machine is reachable from an untrusted network and the shutting of accounts from outside would hurt more than the guessing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LockoutBadCount\s*=\s*(\d+)') {
          # Zero means "never lock out" - it must not pass a numeric comparison
          # against an upper bound as if it were a very low threshold.
          if ([int]$Matches[1] -eq 0) { 'NEVER' } else { $Matches[1] }
        } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    # All three settings are saved, the change writing all three - Windows keeps
    # the threshold, the duration and the counter's reset consistent with one
    # another and refuses a value that breaks that.
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    function Read-Setting($name) {
      if ($text -match ('(?m)^' + $name + '\s*=\s*(-?\d+)')) { $Matches[1] } else { '' }
    }
    $bad = Read-Setting 'LockoutBadCount'
    [pscustomobject]@{
      bad      = $bad
      reset    = (Read-Setting 'ResetLockoutCount')
      duration = (Read-Setting 'LockoutDuration')
      existed  = ($bad -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Three values go in together. Setting the threshold alone gets refused where
    # the duration and the counter's reset do not agree with it, so all three are
    # written at once.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LockoutBadCount = 5',
      'ResetLockoutCount = 15',
      'LockoutDuration = 15',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $lines = @('[Unicode]', 'Unicode=yes', '[System Access]', ('LockoutBadCount = ' + $b.bad))
    if ($b.reset -ne '') { $lines += ('ResetLockoutCount = ' + $b.reset) }
    if ($b.duration -ne '') { $lines += ('LockoutDuration = ' + $b.duration) }
    $lines += @('[Version]', 'signature="$CHICAGO$"', 'Revision=1')
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    Set-Content -Path $inf -Value ($lines -join "`r`n") -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/account-lockout-threshold

notes:
  pl: |
    Reguła otwiera blok blokady konta i jest z tych trzech jedyną niosącą
    ochronę samodzielnie. Dwie pozostałe opisują, jak długo blokada trwa
    i kiedy licznik się zeruje — są nastawą tej reguły, nie osobnym
    zabezpieczeniem.

    Warto, żeby aplikacja pokazała ograniczenie tej ochrony równie wyraźnie
    co samą ochronę. Blokada nie robi nic wobec łamania skrótu poza maszyną,
    a użytkownik, który tego nie wie, może uznać ją za zamiennik reguły
    o długości hasła. Jest odwrotnie — to długość broni tam, gdzie blokada
    nie sięga.

    Odnotowuję, że polecenie naprawcze zapisuje trzy wartości naraz.
    Windows utrzymuje próg, czas blokady i zerowanie licznika w zgodzie
    ze sobą i odrzuca wartość, która tę zgodę łamie, więc zapis samego progu
    zakończyłby się odmową. Kopia zapasowa obejmuje z tego powodu wszystkie
    trzy wartości.
  en: |
    The rule opens the block about the locking of accounts and is the only one of the three carrying protection
    on its own. The other two describe how long the lock lasts and when the counter clears - they are a setting
    of this rule, not a safeguard apart.

    It is well that the application show the bound of that protection as plainly as the protection itself. The
    lock does nothing against the breaking of a hash away from the machine, and a user who does not know that
    may take it for a substitute for the rule about a password's length. It is the other way about - it is
    length that guards where the lock does not reach.

    Worth noting that the remedy command writes three values at once. Windows keeps the threshold, the lock's
    span and the counter's clearing in agreement with one another and refuses a value that breaks it, so writing
    the threshold alone would end in a refusal. The backup covers all three values for that reason.
