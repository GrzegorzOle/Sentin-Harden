id: win10-backup-files-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie kopii zapasowych zastrzeżone dla administratorów
    en: The backing up of files reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo tworzenia kopii zapasowych dla
    administratorów lokalnych.

    Prawo to jest pomyślane dla programów archiwizujących i daje im coś
    bardzo szczególnego: możliwość odczytania każdego pliku na dysku
    z pominięciem jego uprawnień. Program tworzący kopię nie może przecież
    zatrzymać się na katalogu, do którego nie ma dostępu.

    Skutek jest taki, że konto z tym prawem czyta wszystko. Katalogi
    innych użytkowników, pliki zabezpieczone przed odczytem, gałęzie
    rejestru trzymające poświadczenia — wszystko, co da się przeczytać
    przez mechanizm kopii zapasowej, czyli praktycznie cały dysk.

    Nie jest to obejście uprawnień, tylko przewidziane ich wyłączenie
    i na tym polega niebezpieczeństwo. Uprawnienia pliku pozostają
    nietknięte, dziennik nie zgłasza odmowy, a odczyt odbywa się drogą
    w pełni legalną.

    Nadanie tego prawa kontu operatorskiemu albo usługowemu jest więc
    nadaniem dostępu do wszystkiego, choć wygląda na nadanie jednej
    technicznej możliwości.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    każdego pliku na maszynie z pominięciem uprawnień.
  en: |
    The setting reserves the right of backing up files to the local administrators.

    That right is thought out for programs of archiving and gives them something very particular: the reading of
    every file upon a disk with its rights passed over. A program making a copy cannot after all stop at a folder
    it has no way into.

    The upshot is that an account with this right reads everything. Other users' folders, files guarded against
    reading, hives of the registry holding credentials - all that may be read by the mechanism of backing up,
    which is to say practically the whole disk.

    It is no going round of rights but a foreseen setting of them aside, and therein lies the danger. A file's
    rights stay untouched, the log reports no refusal, and the reading is done by a wholly lawful road.

    The granting of this right to an operator's or a service's account is therefore the granting of a way to
    everything, though it looks like the granting of one technical chance.

    What an attacker gains while the item goes unmet: the reading of every file upon the machine with its rights
    passed over.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    oprogramowanie archiwizujące na maszynie.

    Miejscem najczęstszym jest agent kopii zapasowych działający pod
    własnym kontem usługowym. Takie konto bywa umieszczane w tym wykazie
    przy instalacji i nie jest to nadużycie — jest to dokładnie to, do
    czego prawo służy. Odebranie go zatrzyma tworzenie kopii.

    Sprawdzenie polega na przeczytaniu wykazu przed zmianą. Wpis inny niż
    administratorzy oznacza, że coś tego prawa używa, i warto ustalić co,
    zanim się je odbierze.

    Drugim miejscem jest grupa operatorów kopii zapasowych. Jest to grupa
    wbudowana, pomyślana właśnie do tego, i bywa w tym wykazie z założenia.
    Jej usunięcie jest sensem tej reguły, ale trzeba wiedzieć, czy ktoś
    w niej jest.

    Skutek pojawia się przy następnym zalogowaniu konta, które prawo
    traci. Sesja trwająca zachowuje uprawnienia do wylogowania, a zadanie
    kopii w toku dokończy się normalnie.

    Czego to nie psuje: pracy z plikami w ramach własnych uprawnień,
    logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is the software of archiving upon the machine.

    The commonest place is an agent of backing up working under a service account of its own. Such an account is
    at times set in this list at its installing, and it is no misuse - it is just what the right is for. The
    taking of it away will hold the making of copies.

    The review comes down to a reading of the list before the change. An entry other than the administrators means
    something uses this right, and it is worth settling what before it is taken away.

    The second place is the group of backup operators. It is a built-in group, thought out for just this, and is
    at times in this list by design. Its taking out is the sense of this rule, but one has to know whether anybody
    is in it.

    The consequence shows at the next signing in of an account that loses the right. A session at work keeps its
    rights until the signing out, and a task of copying under way will finish in the ordinary manner.

    What this does not break: work with files within one's own rights, logging on, file shares, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Agent kopii zapasowych działający pod własnym kontem usługowym przestanie tworzyć kopie
      - Konta w grupie operatorów kopii zapasowych stracą odczyt plików z pominięciem uprawnień
      - Wpis inny niż administratorzy oznacza, że coś na maszynie tego prawa używa
      - Skutek pojawia się przy następnym zalogowaniu, a zadanie kopii w toku dokończy się normalnie
      - Praca z plikami w ramach własnych uprawnień, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - An agent of backing up working under a service account of its own will cease to make copies
      - Accounts in the group of backup operators will lose the reading of files with their rights passed over
      - An entry other than the administrators means something upon the machine uses this right
      - The consequence shows at the next signing in, and a task of copying under way will finish in the ordinary manner
      - Work with files within one s own rights, logging on, file shares and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje agent kopii zapasowych, którego konto usługowe wymaga tego prawa do działania
      - W grupie operatorów kopii zapasowych są osoby wykonujące kopie w ramach swoich obowiązków
    en:
      - Upon the machine works an agent of backing up whose service account calls for this right
      - In the group of backup operators stand people who make copies as part of their duties
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeBackupPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeBackupPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeBackupPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeBackupPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeBackupPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/back-up-files-and-directories

notes:
  pl: |
    Reguła jest najczęstszym miejscem, w którym uprawnienia plików
    przestają mieć znaczenie, i warto, żeby aplikacja to powiedziała wprost.
    Organizacja, która starannie ustawiła dostępy do katalogów, potrafi
    jednym wpisem w tym wykazie unieważnić całą tę pracę.

    Argument wart zachowania dotyczy tego, że nie jest to obejście.
    Odczyt przez mechanizm kopii zapasowej jest drogą przewidzianą
    i legalną: uprawnienia pozostają nietknięte, dziennik nie zgłasza
    odmowy, a dane wychodzą. Kontrola dostępu nie została złamana —
    została wyłączona zgodnie z projektem.

    Odnotowuję grupę operatorów kopii zapasowych jako miejsce, w którym
    ten punkt najczęściej się rozstrzyga. Grupa istnieje właśnie po to
    i bywa uznawana za nieszkodliwą, bo nazwa brzmi technicznie.
    Członkostwo w niej jest w praktyce dostępem do odczytu całego dysku
    i aplikacja powinna nazwać to tak wprost.
  en: |
    The rule is the commonest place at which files' rights cease to count, and it is well that the application say
    so outright. A body that has set the ways into its folders with care can by one entry in this list undo that
    whole work.

    The argument worth keeping touches this, that it is no going round. The reading by the mechanism of backing up
    is a foreseen and lawful road: the rights stay untouched, the log reports no refusal, and the data come out.
    The watching of access was not broken - it was set aside as designed.

    I set down the group of backup operators as the place at which this item is most often settled. The group
    exists for just this and is at times held harmless, the name sounding technical. Membership in it is in
    practice a way to read the whole disk, and the application ought to name it so outright.
