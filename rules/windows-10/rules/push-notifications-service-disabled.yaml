id: win10-push-notifications-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa powiadomień wypychanych z sieci wyłączona
    en: The service of tidings pushed out of the network switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przyjmującą powiadomienia wysyłane do
    maszyny z sieci i pokazującą je użytkownikowi.

    Mechanizm ten utrzymuje stałe połączenie z siecią producenta
    i przyjmuje tą drogą komunikaty przeznaczone dla programów
    zainstalowanych na maszynie. Program nie musi działać — powiadomienie
    przychodzi i jest pokazywane.

    Zagrożenie polega na tym, że jest to kanał wchodzący, otwarty stale,
    prowadzący do wyświetlenia treści użytkownikowi. Treść przychodzi
    z zewnątrz i pojawia się w miejscu, któremu użytkownik ufa, bo jest
    to systemowe okno powiadomień.

    Drugim zastrzeżeniem jest to, że połączenie jest utrzymywane bez
    przerwy, także wtedy, gdy żaden program powiadomień nie oczekuje.
    Maszyna ma więc stały kanał wyjściowy niezależny od pracy
    użytkownika.

    Odnotowuję rzecz najważniejszą przy ocenie kosztu: tą samą drogą idą
    powiadomienia oprogramowania ochronnego. Wyłączenie usługi odbiera
    użytkownikowi ostrzeżenia, a nie tylko reklamy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    wchodzący z sieci prowadzący do treści pokazywanej jako systemowa.
  en: |
    The setting switches off the service taking in the tidings sent to the machine out of the network and showing
    them to the user.

    That mechanism keeps up a standing joining to the maker's network and takes by that road the messages meant
    for the programs laid on upon the machine. The program need not be working - the tiding comes and is shown.

    The danger lies in this, that it is a channel coming in, standing open, leading to the showing of content to
    the user. The content comes from without and appears in a place the user trusts, that being the system's own
    window of tidings.

    The second reservation is that the joining is kept up without break, even when no program looks for tidings.
    The machine has therefore a standing channel going out, hanging not upon the user's work.

    I set down the weightiest thing at the grading of the cost: by that same road go the tidings of guarding
    software. The switching off of the service takes from the user their warnings and not only their
    advertisements.

    What an attacker gains while the item goes unmet: a channel coming in out of the network, leading to content
    shown as the system's own.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest jeden: znikają
    wszystkie powiadomienia naraz.

    Miejscem pierwszym jest oprogramowanie ochronne. Ostrzeżenie
    o zablokowanym pliku, o wykrytym zagrożeniu albo o wygasającej
    ochronie idzie tą samą drogą co powiadomienie ze sklepu. Po zmianie
    użytkownik przestanie je widzieć, a to jest strata dotkliwa
    i przeciwna zamiarowi punktu.

    Miejscem drugim są przypomnienia kalendarza i komunikaty poczty.
    Osoba pracująca na terminach zauważy to natychmiast.

    Miejscem trzecim są programy branżowe zgłaszające zakończenie
    długiego zadania. Tam brak powiadomienia oznacza czekanie przy
    ekranie zamiast pracy.

    Odnotowuję, że przed wdrożeniem warto sprawdzić, którędy idą
    ostrzeżenia oprogramowania ochronnego na tej maszynie. Część
    rozwiązań pokazuje je własnym oknem, niezależnym od tej usługi,
    i wtedy koszt punktu jest znacznie niższy.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: pracy programów, dzienników zdarzeń, poczty jako
    takiej, logowania, drukowania, dostępu do sieci.
  en: |
    The class is "needs a planned rollout", and the ground is one: every tiding goes at once.

    The first place is guarding software. A warning of a file shut out, of a danger found or of a guard running
    out goes by that same road as a tiding out of the store. After the change the user will cease to see them, and
    that is a loss keenly felt and contrary to the item's own purpose.

    The second place is reminders of the calendar and messages of the post. Whoever works to set hours will mark
    it at once.

    The third place is programs of a trade giving out the ending of a long task. There the want of a tiding means
    a waiting at the screen instead of work.

    I set down that before the rollout it is worth looking at which road the warnings of guarding software take
    upon this machine. Some answers show them in a window of their own, hanging not upon this service, and then
    the item's cost is far lower.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the work of programs, the records of happenings, the post itself, logging on,
    printing, or the reach of the network.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Ostrzeżenia oprogramowania ochronnego przestaną być pokazywane, bo idą tą samą drogą co powiadomienia ze sklepu
      - Przypomnienia kalendarza i komunikaty poczty znikną, co osoba pracująca na terminach zauważy natychmiast
      - Programy branżowe zgłaszające zakończenie długiego zadania przestaną o tym mówić
      - Warto sprawdzić przed wdrożeniem, czy ochrona na tej maszynie pokazuje ostrzeżenia własnym oknem
      - Praca programów, dzienniki zdarzeń, poczta jako taka, logowanie i drukowanie pozostają bez zmian
    en:
      - Warnings of guarding software will cease to be shown, going as they do by the same road as tidings out of the store
      - Reminders of the calendar and messages of the post will go, which whoever works to set hours will mark at once
      - Programs of a trade giving out the ending of a long task will cease to say so
      - It is worth looking before the rollout at whether the guard upon this machine shows its warnings in a window of its own
      - The work of programs, the records of happenings, the post itself, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Ostrzeżenia oprogramowania ochronnego na tej maszynie idą przez powiadomienia systemowe
      - Praca opiera się na przypomnieniach kalendarza albo na powiadomieniach o zakończeniu długich zadań
    en:
      - The warnings of guarding software upon this machine go through the system s tidings
      - The work rests upon reminders of the calendar or upon tidings of the ending of long tasks
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WpnService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service takes away every notification at once, the warnings of
    # guarding software among them.
    Stop-Service -Name 'WpnService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WpnService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WpnService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/design/shell/tiles-and-notifications/windows-push-notification-services--wns--overview

notes:
  pl: |
    Reguła jest tą, przy której najłatwiej wyrządzić szkodę zamiast
    pożytku. Warto, żeby aplikacja postawiła to na początku: tą samą
    drogą idą ostrzeżenia oprogramowania ochronnego, więc wyłączenie
    usługi potrafi odebrać użytkownikowi jedyny sygnał o zagrożeniu.

    Argument wart zachowania dotyczy natury kanału. Jest to połączenie
    wchodzące, utrzymywane stale, prowadzące do treści pokazywanej
    w oknie systemowym — czyli w miejscu, któremu użytkownik ufa bardziej
    niż stronie internetowej.

    Odnotowuję sprawdzenie warte wykonania przed wdrożeniem: czy ochrona
    na tej maszynie pokazuje ostrzeżenia własnym oknem. Jeżeli tak, koszt
    punktu jest znacznie niższy, a decyzja wygląda zupełnie inaczej.
  en: |
    The rule is the one at which harm is most easily done in the place of good. It is well that the application
    put this at the head: by that same road go the warnings of guarding software, so the switching off of the
    service can take from the user their one sign of a danger.

    The argument worth keeping touches the nature of the channel. It is a joining coming in, kept up without
    break, leading to content shown in a window of the system - which is to say in a place the user trusts more
    than a page of the web.

    I set down the looking worth doing before the rollout: whether the guard upon this machine shows its warnings
    in a window of its own. If so, the item's cost is far lower and the decision looks wholly other.
