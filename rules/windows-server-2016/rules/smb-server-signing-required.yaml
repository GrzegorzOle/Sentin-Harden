id: win2016-smb-server-signing-required

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie pakietów wymagane po stronie serwera udostępniania plików
    en: Packet signing required on the file-sharing server side
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby maszyna udostępniająca pliki żądała podpisywania
    pakietów od każdego, kto się z nią łączy, i odrzucała połączenia bez
    podpisu.

    To jest ta sama właściwość co po stronie klienta, ale rozstrzygana na
    maszynie, która ma najwięcej do stracenia. Podpisywanie pilnuje, żeby
    treść nie została podmieniona w drodze i żeby sesja do końca należała do
    tego, kto ją zaczął. Bez niego plik pobrany z udziału nie musi być tym,
    który tam leży, a zapis nie musi pochodzić od tego, kto się podłączył.

    Kategoria wysoka, bo na serwerze plików jedna sesja obejmuje więcej niż
    jedno połączenie klienckie. Napastnik wstawiony w ścieżkę nie musi
    wybierać, kogo podsłuchać — wystarczy, że stoi przy maszynie, przez którą
    idą wszyscy.

    Warto od razu rozróżnić „wymagane" od „dozwolone". Ustawienie łagodniejsze
    podpisuje, gdy klient umie, i nie podpisuje, gdy klient twierdzi, że nie
    umie. Napastnik zawsze twierdzi, że nie umie — dlatego ten punkt ma sens
    wyłącznie w postaci wymagania.

    Na serwerze 2016 rzecz jest istotna również dlatego, że maszyna tego
    rocznika bywa serwerem plików dla urządzeń, których nikt nie liczy.
    Podniesienie wymagania trafi w nie wszystkie naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wstawienia się w połączenia prowadzone z tym serwerem i zmiany treści,
    która przez nie idzie — w obie strony.
  en: |
    The item requires a machine sharing files to demand packet signing from
    everybody connecting to it, and to refuse unsigned connections.

    This is the same property as on the client side, but settled on the machine
    with the most to lose. Signing makes sure content is not substituted in
    transit and that a session belongs to the end to whoever began it. Without
    it, a file fetched from a share need not be the file that lies there, and a
    write need not come from whoever connected.

    The category is high, because on a file server one intercepted position
    covers more than one client connection. An attacker placed in the path does
    not have to choose whom to listen to - it is enough to stand by the machine
    everybody goes through.

    It is worth telling "required" from "permitted" at once. The milder setting
    signs when the client can, and does not sign when the client claims it
    cannot. An attacker always claims it cannot - which is why this item makes
    sense only as a requirement.

    On Server 2016 the matter also weighs because a machine of this vintage is
    often a file server for devices nobody counts. Raising the requirement hits
    all of them at once.

    What an attacker gains while the item goes unmet: the ability to step into
    the connections held with this server and alter the content passing through
    them - in both directions.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", wyższa niż po stronie klienta,
    i chcę powiedzieć dlaczego. Tam maszyna decydowała o swoich połączeniach.
    Tutaj decyduje o cudzych — o wszystkich, które ktokolwiek z nią nawiązuje.

    Odrzucone zostaną połączenia od klientów nieobsługujących podpisywania.
    W praktyce są to urządzenia wielofunkcyjne, sterowniki maszyn, systemy
    wbudowane oraz implementacje protokołu pisane poza systemem. Klienci
    współcześni podpisują bez problemu i nie odczują zmiany.

    Objaw po stronie użytkownika i urządzenia jest mylący. Zamiast
    informacji o podpisie pojawia się odmowa dostępu albo brak ścieżki
    sieciowej. Na serwerze plików oznacza to zgłoszenia opisane jako „nie
    działa dysk sieciowy", a nie jako skutek zmiany ustawienia.

    Na maszynie tego rocznika warto ustalić listę klientów zawczasu. Serwer
    2016 bywa ostatnim miejscem, do którego pisze urządzenie kupione dawno
    i nieaktualizowane od tego czasu.

    Rzecz do rozważenia osobno: podpisywanie kosztuje trochę wydajności przy
    dużym ruchu plikowym. Przy starszym sprzęcie warto tę zmianę wprowadzić
    poza godzinami szczytu i popatrzeć, zamiast zakładać, że koszt jest
    pomijalny.

    Zmiana wymaga ponownego uruchomienia usługi serwera.
  en: |
    The class is "needs planned rollout", higher than on the client side, and I
    want to say why. There the machine decided about its own connections. Here
    it decides about other people's - about every connection anybody makes with
    it.

    Connections from clients that do not support signing will be refused. In
    practice those are multifunction devices, machine controllers, embedded
    systems and implementations of the protocol written outside the system.
    Present-day clients sign without difficulty and will not feel the change.

    The symptom at the user's and the device's end is misleading. Instead of
    anything about a signature there is access denied or a missing network path.
    On a file server that means tickets described as "the network drive is not
    working" rather than as the effect of a changed setting.

    On a machine of this vintage the list of clients is worth establishing in
    advance. Server 2016 is sometimes the last place written to by a device
    bought long ago and not updated since.

    A separate thing to weigh: signing costs a little performance under heavy
    file traffic. With older hardware it is worth making this change outside
    peak hours and watching, rather than assuming the cost is negligible.

    The change requires the server service to be restarted.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - legacy-applications
    - printing
  what_breaks:
    pl:
      - Klienci nieobsługujący podpisywania przestają się łączyć z udziałami tej maszyny
      - Urządzenia wielofunkcyjne, sterowniki maszyn i systemy wbudowane tracą dostęp do udziału
      - Zgłoszenia będą brzmiały jak awaria dysku sieciowego, a nie jak skutek zmiany ustawienia
      - Podpisywanie kosztuje trochę wydajności przy dużym ruchu plikowym, co przy starszym sprzęcie bywa odczuwalne
    en:
      - Clients that do not support signing stop connecting to this machine's shares
      - Multifunction devices, machine controllers and embedded systems lose access to the share
      - Tickets will sound like a network drive failure rather than the effect of a changed setting
      - Signing costs a little performance under heavy file traffic, which older hardware may feel
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Z udziałów tej maszyny korzystają urządzenia nieobsługujące podpisywania pakietów
      - Nie ustalono listy klientów łączących się z tą maszyną, a udziały są dostępne dla szerokiego grona
    en:
      - Devices that do not support packet signing use this machine's shares
      - The list of clients connecting to this machine has not been established and the shares are open widely
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'RequireSecuritySignature'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'RequireSecuritySignature'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This side decides about other people's connections, not the machine's own.
    # Every client that cannot sign is refused, and what it reports is access
    # denied rather than a word about a signature.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSecuritySignature' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-server-digitally-sign-communications-always

notes:
  pl: |
    Wartość nosi tę samą nazwę co po stronie klienta i leży w gałęzi innej
    usługi. Przy sprawdzaniu ręcznym łatwo pomylić te dwa miejsca i uznać
    stronę serwera za ustawioną, patrząc na stronę klienta.

    Ten wpis leży pod tym samym kluczem co wyłączenie pierwszej wersji
    protokołu po stronie serwera. To są dwa osobne ustawienia i obecność
    jednego nie mówi niczego o drugim.

    Klucz należy do usługi, nie do zasad — przy cofaniu usuwana jest sama
    wartość, nigdy klucz, bo mieszkają w nim ustawienia niezwiązane z tą
    regułą.
  en: |
    The value carries the same name as on the client side and lies in a
    different service's branch. Checking by hand, it is easy to confuse the two
    places and judge the server side set while looking at the client side.

    This entry lies under the same key as the switching off of the first
    protocol version on the server side. They are two separate settings and the
    presence of one says nothing about the other.

    The key belongs to the service rather than to policy - undoing removes the
    value alone, never the key, because settings unrelated to this rule live in
    it.
