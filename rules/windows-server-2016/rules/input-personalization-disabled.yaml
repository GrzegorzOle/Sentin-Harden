id: win2016-input-personalization-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Control Panel > Regional and Language Options
  title:
    pl: Zbieranie danych o wpisywanym tekście wyłączone
    en: The gathering of data about typed text switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza zbieranie danych o sposobie wprowadzania tekstu na
    tej maszynie.

    Nazwa mówi o dostosowaniu i brzmi jak ustawienie wygody. Przedmiotem
    jest jednak treść, a nie układ klawiatury: wpisywane słowa, nazwy
    własne, poprawki, rzeczy dopisywane do słownika użytkownika.

    Na stanowisku roboczym byłyby to zdania listów. Na serwerze są to
    polecenia, nazwy maszyn, nazwy udziałów, nazwy kont i identyfikatory
    systemów wewnętrznych — czyli dokładnie ten materiał, z którego składa
    się rozpoznanie sieci. Zbiór trafnych nazw własnych jest dla kogoś
    z zewnątrz wart więcej niż niejeden plik konfiguracyjny.

    Zbiór ten mieszka w profilu użytkownika, więc wędruje razem z profilem
    mobilnym i przeżywa ponowne zalogowanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór nazw
    własnych używanych na tej maszynie, gotowy do czytania w profilu.
  en: |
    The setting switches off the gathering of data about the way text is entered on this machine.

    The name speaks of a fitting to the person and sounds like a setting of convenience. The subject, though, is
    the content and not the keyboard's layout: the words typed, the proper names, the corrections, the things
    added to a user's dictionary.

    At a workplace those would be the sentences of letters. On a server they are commands, the names of
    machines, the names of shares, the names of accounts and the identifiers of internal systems - which is to
    say exactly the stuff a survey of a network is made of. A collection of apt proper names is worth to
    somebody outside more than many a configuration file.

    That collection dwells in the user's profile, so it travels along with a roaming profile and outlives a
    fresh logon.

    What an attacker gains while the item goes unmet: a collection of the proper names used on this machine,
    ready to be read in the profile.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na większości maszyn skutek jest
    niewielki.

    Rzecz pierwsza dotyczy podpowiedzi. Tam, gdzie ktoś pracuje przy
    maszynie i przywykł do uzupełniania długich nazw, po zmianie
    podpowiedzi przestaną się pojawiać. Nie jest to awaria, tylko
    spowolnienie pracy jednej osoby — i tak należy o tym mówić.

    Rzecz druga dotyczy pisma odręcznego i wprowadzania głosowego. Jeżeli
    którekolwiek z nich jest na tej maszynie używane, rozpoznawanie
    pogorszy się, bo przestanie uczyć się nazw stamtąd, gdzie się
    pojawiają. Na serwerze zdarza się to rzadko, ale warto sprawdzić.

    Rzecz trzecia dotyczy tego, co już zebrano. Zmiana zatrzymuje
    zbieranie i nie usuwa zbioru istniejącego. Zbiór zostaje w profilu
    i trzeba go wyczyścić osobno — inaczej reguła zamyka dopływ, a nie
    sprząta po nim.

    Czego to nie psuje: wpisywania tekstu, układu klawiatury, języków,
    sprawdzania pisowni ze słownika systemowego, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on most machines the consequence is a small one.

    The first matter concerns suggestions. Where somebody works at the machine and has grown used to long names
    being completed, after the change the suggestions will cease to appear. It is no fault but a slowing of one
    person's work - and so it ought to be spoken of.

    The second matter concerns handwriting and entry by voice. If either of them is used on this machine, the
    recognising will worsen, ceasing to learn names from where they appear. On a server that happens seldom, but
    it is worth checking.

    The third matter concerns what was gathered already. The change stops the gathering and does not remove the
    collection that exists. The collection stays in the profile and has to be cleared separately - otherwise the
    rule shuts the inflow and does not tidy after it.

    What this does not break: the typing of text, the keyboard's layout, the languages, the checking of spelling
    from the system dictionary, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Podpowiedzi uzupełniające długie nazwy przestają się pojawiać i praca jednej osoby idzie wolniej
      - Rozpoznawanie pisma odręcznego i wprowadzania głosowego pogarsza się, bo przestaje uczyć się nazw własnych
      - Zbiór zebrany wcześniej zostaje w profilu i trzeba go wyczyścić osobno
      - Wpisywanie tekstu, układ klawiatury i sprawdzanie pisowni ze słownika systemowego pozostają bez zmian
      - Usługi systemowe, aplikacje serwerowe i praca sieci pozostają bez zmian
    en:
      - Suggestions completing long names cease to appear and one person's work goes slower
      - The recognising of handwriting and of entry by voice worsens, ceasing to learn proper names
      - The collection gathered earlier stays in the profile and has to be cleared separately
      - The typing of text, the keyboard's layout and the checking of spelling from the system dictionary stay unchanged
      - System services, server applications and the working of the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś na tej maszynie wprowadza tekst pismem odręcznym albo głosem i rozpoznawanie ma być skuteczne
      - Praca przy tej maszynie opiera się na uzupełnianiu długich nazw własnych z podpowiedzi
    en:
      - Somebody on this machine enters text by handwriting or by voice and the recognising is to be effective
      - The work at this machine rests on long proper names being completed from suggestions
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
      $name = 'AllowInputPersonalization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    $name = 'AllowInputPersonalization'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change stops the gathering. It does not remove what was gathered
    # earlier - that stays in the profile until it is cleared separately.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\InputPersonalization'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowInputPersonalization' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

notes:
  pl: |
    Punkt jest czwarty w bloku i najciekawszy, bo nazwa prowadzi na
    manowce. Brzmi jak dostrojenie wygody, a dotyczy treści wpisywanej na
    maszynie.

    Zdanie warte postawienia wprost w interfejsie: na serwerze wpisywanym
    tekstem są polecenia i nazwy własne, nie zdania listów. Bez tego
    zdania reguła wygląda na pozycję o prywatności i zostanie odpuszczona
    odruchowo, bo „przecież na serwerze nikt nie pisze".

    Rzecz druga warta pokazania to granica działania reguły. Zmiana
    zamyka dopływ i nie sprząta po nim. Zbiór zebrany wcześniej zostaje
    w profilu, a przy profilu mobilnym wędruje dalej. Aplikacja powinna to
    mówić, bo inaczej użytkownik weźmie zgodny wynik audytu za dowód, że
    danych nie ma.

    Odnotowuję, że reguła stoi w sekcji o ustawieniach regionalnych, co
    wzmacnia mylne wrażenie, iż chodzi o język. Warto pokazać sekcję jako
    miejsce w benchmarku, a nie jako podpowiedź, czego punkt dotyczy.
  en: |
    The item is the fourth in the block and the most interesting, the name leading astray. It sounds like a
    tuning of convenience and concerns the content typed on the machine.

    A sentence worth setting down outright in the interface: on a server the text typed is commands and proper
    names, not the sentences of letters. Without that sentence the rule looks an entry about privacy and will be
    let go by reflex, on the ground that "nobody writes on a server anyway".

    The second thing worth showing is the bound of the rule's working. The change shuts the inflow and does not
    tidy after it. The collection gathered earlier stays in the profile, and with a roaming profile travels on.
    The application ought to say so, else a user will take a compliant outcome of the audit for a proof that the
    data are not there.

    Worth noting that the rule stands in the section about regional settings, which strengthens the mistaken
    impression that language is at stake. It is well to show the section as a place in the benchmark and not as
    a hint at what the item concerns.
