id: win2016-audit-policy-change

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Policy Change
  title:
    pl: Inspekcja zmiany zasad inspekcji
    en: Audit audit policy change
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Podkategoria zapisuje zmianę samej konfiguracji inspekcji: włączenie
    i wyłączenie podkategorii, zmianę ustawień dziennika oraz wyczyszczenie
    zasad.

    Jest to punkt o szczególnym charakterze, bo chroni cały pozostały blok.
    Wszystkie inne podkategorie opisują, co się na maszynie dzieje. Ta opisuje,
    co się dzieje z samym mechanizmem opisywania — a więc odpowiada na pytanie,
    czy temu, co widać w dzienniku, można ufać.

    Wyłączenie inspekcji jest standardowym krokiem po uzyskaniu uprawnień
    administracyjnych i wykonuje się je przed właściwym działaniem, a nie po.
    Bez tej podkategorii skutkiem jest cisza nie do odróżnienia od spokoju:
    dziennik nie ma luki, nie ma błędu, po prostu przestaje przybywać.

    Z tą podkategorią powstaje wpis, który tę ciszę tłumaczy. Jeden wiersz
    mówiący, że o danej godzinie ktoś wyłączył rejestrowanie, jest w dochodzeniu
    wart więcej niż setki zwykłych zdarzeń — bo wskazuje moment i sprawcę.

    Rejestruje się powodzenia. Zmiana faktycznie dokonana jest tym, co trzeba
    udokumentować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyłączenia obserwacji przed działaniem, tak że sam fakt wyłączenia nie
    zostawia śladu.
  en: |
    The subcategory records changes to the audit configuration itself: the switching
    on and off of subcategories, changes to the log's settings, and the clearing of
    policy.

    This item is of a particular character, because it guards the whole rest of the
    block. Every other subcategory describes what happens on the machine. This one
    describes what happens to the mechanism of describing - and so answers the
    question whether what the log shows can be trusted.

    Switching auditing off is a standard step once administrative rights are held,
    and it is carried out before the real business, not after. Without this
    subcategory the result is a silence indistinguishable from quiet: the log has no
    gap, no error, it simply stops growing.

    With this subcategory an entry arises that explains that silence. One line
    saying that at a given hour somebody switched recording off is worth more in an
    inquiry than hundreds of ordinary events - because it names the moment and the
    hand.

    Successes are recorded. A change actually made is what has to be documented.

    What an attacker gains while the item goes unmet: the means of switching off
    observation before acting, so that the switching off itself leaves no trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zasady inspekcji zmienia się rzadko — przy
    wdrożeniu, przy zmianie wymagań i przy aktualizacji zasad grupy. Zdarzeń
    jest na maszynie kilka miesięcznie, nie kilka dziennie.

    Jedno zastrzeżenie dotyczy maszyn, na których zasady grupy są odświeżane
    i nadpisują konfigurację inspekcji przy każdym cyklu. Tam zdarzenia potrafią
    powstawać co kilka godzin, mimo że nic się faktycznie nie zmienia. Jest to
    sygnał wart zauważenia sam w sobie: konfiguracja walczy sama ze sobą.

    Nic przy tym nie przestaje działać i nikt niczego nie zauważy.

    Czego to nie psuje: zmieniania zasad inspekcji, zasad grupy, pracy
    narzędzi administracyjnych ani zbierania dzienników.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Audit policy is changed seldom - at deployment, at
    a change of requirements and at an update of group policy. There are a few
    events a month on a machine, not a few a day.

    One reservation concerns machines where group policy is refreshed and overwrites
    the audit configuration at every cycle. There events can arise every few hours
    although nothing actually changes. That is a signal worth noticing in itself:
    the configuration is at odds with itself.

    Nothing stops working while this goes on and nobody notices anything.

    What this does not break: changing audit policy, group policy, the work of
    administrative tools, or the gathering of logs.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Brak regresji w działaniu — zasady inspekcji zmienia się rzadko i zdarzeń przybywa niewiele
      - Na maszynie, gdzie zasady grupy nadpisują konfigurację inspekcji przy każdym cyklu, zdarzenia powstają co kilka godzin
      - Zmienianie zasad inspekcji i zasad grupy działa bez zmian
      - Zbieranie dzienników i praca narzędzi administracyjnych pozostają nietknięte
    en:
      - No regression in the working - audit policy is changed seldom and few events accrue
      - On a machine where group policy overwrites the audit configuration at every cycle, events arise every few hours
      - Changing audit policy and group policy works unchanged
      - The gathering of logs and the work of administrative tools stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — punkt wdraża się przed pozostałymi regułami inspekcji, bo to on nadaje im wiarygodność
    en:
      - No known contraindication - the item goes in before the other audit rules, since it is what lends them credibility
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in the last column, which
      # the localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE922F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even when it refuses the backup, so the
        # missing row - not a missing file - is what tells the refusal apart.
        # Its own message goes to the error stream, so the report can tell a
        # missing privilege from a real fault instead of a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^[13]$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE922F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE922F-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE922F-69AE-11D9-BED3-505054503030}" /success:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE922F-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-audit-policy-change

notes:
  pl: |
    Punkt należy wdrażać wcześnie, a w raporcie stawiać wysoko, bo od niego
    zależy wiarygodność wszystkich pozostałych. Inspekcja, której wyłączenia
    nie widać, jest inspekcją warunkową.

    Nie chroni to przed usunięciem zdarzeń już zapisanych — tym zajmuje się
    osobny punkt o zarządzaniu dziennikiem zabezpieczeń. Ten mówi o przyszłości:
    czy dalej będzie cokolwiek zapisywane.

    Warto pamiętać, że wpis o wyłączeniu inspekcji powstaje, zanim wyłączenie
    zacznie obowiązywać. To jest cała jego wartość i zarazem powód, dla którego
    napastnik nie ma jak go uniknąć, mając wyłącznie uprawnienia administratora.
  en: |
    The item should go in early and stand high in the report, because the
    credibility of all the others hangs on it. Auditing whose switching off cannot
    be seen is conditional auditing.

    This does not guard against the removal of events already written - a separate
    item on managing the security log deals with that. This one speaks of the
    future: whether anything will go on being written.

    It is worth remembering that the entry about auditing being switched off arises
    before the switching off takes effect. That is its whole worth, and at the same
    time the reason an attacker holding administrator rights alone has no way of
    avoiding it.
