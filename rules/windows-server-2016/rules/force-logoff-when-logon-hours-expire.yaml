id: win2016-force-logoff-when-logon-hours-expire

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Sesje sieciowe rozłączane po upływie dozwolonych godzin pracy
    en: Network sessions disconnected once permitted working hours end
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe rozłączać sesje sieciowe użytkownika w chwili, gdy
    kończą się godziny, w których wolno mu pracować.

    Godziny pracy konta są ustawieniem katalogu i same z siebie nie robią
    wiele. Bez tego punktu pilnują wyłącznie momentu logowania: po
    godzinach nie da się zalogować nowo, ale sesja rozpoczęta wcześniej
    trwa dalej, bez ograniczeń i bez końca.

    Znaczy to, że ograniczenie, które wygląda na wdrożone, jest w praktyce
    ograniczeniem nowych sesji, a nie ograniczeniem dostępu. Konto
    przejęte w środku dnia pracuje przez noc tak samo jak w dzień.

    Punkt domyka tę lukę po stronie sesji plikowych: gdy godziny się
    kończą, sesja zostaje rozłączona, a dostęp do zasobów tej maszyny
    ustaje.

    Warto powiedzieć wprost, czego punkt nie robi. Nie rozłącza sesji
    interaktywnych ani zdalnego pulpitu — dotyczy sesji sieciowych do
    zasobów udostępnianych przez tę maszynę. Godziny pracy bez tego punktu
    są ustawieniem pozornym; z nim są ustawieniem działającym, ale tylko
    w tym jednym zakresie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zasobów tej maszyny poza godzinami pracy konta — czyli wtedy, gdy
    najmniej prawdopodobne jest, że ktokolwiek to zauważy.
  en: |
    The setting has a user's network sessions disconnected at the moment the hours in
    which they may work come to an end.

    An account's working hours are a directory setting and of themselves do not do
    much. Without this item they see only to the moment of signing in: after hours one
    cannot sign in anew, but a session begun earlier goes on, without limit and without
    end.

    That means a limit that looks rolled out is in practice a limit on new sessions
    rather than a limit on access. An account taken over in the middle of the day works
    through the night just as it does by day.

    The item shuts that gap on the side of file sessions: when the hours end, the
    session is disconnected and access to this machine's resources ceases.

    Worth saying outright what the item does not do. It does not disconnect interactive
    sessions or the remote desktop - it concerns network sessions to resources this
    machine shares. Working hours without this item are a setting in appearance; with
    it they are a setting that works, but only in that one range.

    What an attacker gains while the item goes unmet: access to this machine's
    resources outside an account's working hours - which is to say when it is least
    likely that anybody will notice.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo skutek dotyka pracy ludzi
    i procesów w chwili, której nikt nie wybiera.

    Rozłączenie sesji nie jest jej zawieszeniem i to jest różnica wobec
    reguły o sesjach bezczynnych. Tam klient nawiązywał połączenie
    ponownie, gdy czegoś zechciał. Tutaj nie nawiąże, bo godziny się
    skończyły.

    Skutek pierwszy dotyczy pracy nietypowej. Użytkownik, któremu
    przedłużył się dzień, traci dostęp do udziału w środku czynności.
    Plik otwarty do zapisu zostaje przerwany, a przy części aplikacji
    kończy się to uszkodzeniem dokumentu, a nie komunikatem.

    Skutek drugi dotyczy automatyzacji i jest poważniejszy, bo mniej
    widoczny. Zadania nocne uruchamiane na koncie użytkownika — kopie,
    przetwarzanie, wymiana plików — przestaną mieć dostęp, jeżeli konto ma
    ustawione godziny. Objawem jest zadanie, które kończy się błędem
    o odmowie dostępu, i to dopiero od pewnej godziny.

    Rzecz trzecia: punkt nie robi nic, jeżeli konta nie mają ustawionych
    godzin pracy. W takiej sytuacji wdrożenie jest zapisem na przyszłość
    i nie zmienia nic dziś — ale zacznie działać w dniu, w którym ktoś
    godziny ustawi.

    Czego to nie psuje: sesji interaktywnych, pulpitu zdalnego, usług
    systemowych, kont bez ustawionych godzin pracy.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", the consequence touching people's and
    processes' work at a moment nobody chooses.

    Disconnecting a session is not suspending it, and that is the difference from the
    rule about idle sessions. There the client made the connection anew when it wanted
    something. Here it will not, the hours having ended.

    The first consequence touches unusual work. A user whose day has run long loses
    access to a share in the middle of an act. A file open for writing is broken off,
    and with some applications that ends in a damaged document rather than a message.

    The second consequence touches automation and is the graver, being less visible.
    Nightly tasks run on a user's account - backups, processing, file exchange - will
    stop having access if the account has hours set. The symptom is a task ending in an
    access denial, and only from a certain hour.

    A third thing: the item does nothing if accounts have no working hours set. In that
    case the rollout is an entry for the future and changes nothing today - but it will
    begin to work on the day somebody sets the hours.

    What this does not break: interactive sessions, the remote desktop, system
    services, or accounts with no working hours set.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Użytkownik, któremu przedłużył się dzień, traci dostęp do udziału w środku czynności, a plik otwarty do zapisu zostaje przerwany
      - Przy części aplikacji kończy się to uszkodzeniem dokumentu, a nie komunikatem
      - Zadania nocne uruchamiane na koncie użytkownika z ustawionymi godzinami przestaną mieć dostęp, a objaw pojawi się dopiero od pewnej godziny
      - Sesje interaktywne, pulpit zdalny i konta bez ustawionych godzin pracy pozostają bez zmian
    en:
      - A user whose day has run long loses access to a share in the middle of an act, and a file open for writing is broken off
      - With some applications that ends in a damaged document rather than a message
      - Nightly tasks run on a user account with hours set will stop having access, and the symptom appears only from a certain hour
      - Interactive sessions, the remote desktop and accounts with no working hours set stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zadania nocne w tej organizacji pracują na kontach użytkowników z ustawionymi godzinami pracy
      - Na udziałach tej maszyny pracują aplikacje, które nie przeżywają przerwania zapisu
      - Godziny pracy kont są ustawione ciasno, a praca poza nimi zdarza się regularnie
    en:
      - Nightly tasks in this organisation run on user accounts with working hours set
      - Applications that do not survive a broken-off write work on this machine's shares
      - Accounts' working hours are set tightly and work outside them happens regularly
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'EnableForcedLogOff'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'EnableForcedLogOff'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableForcedLogOff' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-force-logoff-when-logon-hours-expire

notes:
  pl: |
    Punkt zamyka blok i odstaje od reszty, bo nie dotyczy przedstawiania
    się, tylko tego, jak długo raz przyjęte przedstawienie obowiązuje.
    Umieszczenie go tutaj ma sens: jest to ostatnie ogniwo tego samego
    łańcucha.

    Najważniejsza rzecz do powiedzenia jest taka, że bez tego punktu
    godziny pracy konta są ustawieniem pozornym. Administrator, który je
    ustawił i uznał sprawę za załatwioną, ma maszynę, na której sesja
    rozpoczęta w dzień trwa przez noc. Aplikacja powinna te dwie rzeczy
    łączyć, bo osobno żadna nie mówi całej prawdy.

    Zakres punktu warto ograniczać wprost w opisie. Dotyczy sesji
    sieciowych do zasobów tej maszyny, a nie sesji interaktywnych
    i zdalnego pulpitu. Reguła nazwana zbyt szeroko obiecuje więcej, niż
    robi, a to jest gorsze niż reguła słaba.

    Zapis na przyszłość jest tu wariantem częstym: punkt wdrożony na
    maszynie, na której żadne konto nie ma ustawionych godzin, nie robi
    nic dziś. Warto to powiedzieć, żeby nikt nie szukał skutków, których
    jeszcze nie ma.
  en: |
    The item shuts the block and stands apart from the rest, concerning not the
    presenting of oneself but how long a presenting once taken in holds. Putting it here
    makes sense: it is the last link of the same chain.

    The most important thing to say is that without this item an account's working
    hours are a setting in appearance. An administrator who set them and took the matter
    for settled has a machine on which a session begun by day goes on through the night.
    The application should tie those two things together, since apart neither tells the
    whole truth.

    The item's range is worth limiting outright in the description. It concerns network
    sessions to this machine's resources, not interactive sessions and the remote
    desktop. A rule named too widely promises more than it does, and that is worse than
    a weak rule.

    An entry for the future is here a frequent variant: the item rolled out on a machine
    where no account has hours set does nothing today. That is worth saying, so that
    nobody looks for consequences that are not there yet.
