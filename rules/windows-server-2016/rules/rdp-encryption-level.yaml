id: win2016-rdp-encryption-level

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services
  title:
    pl: Wysoki poziom szyfrowania połączeń pulpitu zdalnego
    en: High encryption level for Remote Desktop connections
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa najniższą siłę szyfrowania, na jaką serwer zgodzi się
    przy zestawianiu sesji pulpitu zdalnego.

    Wartość niższa od wymaganej oznacza zgodę na szyfrowanie słabsze albo na
    szyfrowanie tylko w jedną stronę — od klienta do serwera, z zawartością
    ekranu odsyłaną w postaci dającej się odczytać. Wybiera ją nie serwer,
    tylko klient, więc serwer ustawiony nisko godzi się z góry na to, co
    przyniesie najsłabszy z łączących się.

    Warto powiedzieć wprost, co widać w takiej sesji. Ekran serwera to
    w praktyce wszystko: otwarte dokumenty, konsola zarządzania, zawartość
    przeglądanych katalogów, treść poczty. Przy szyfrowaniu jednokierunkowym
    hasło wpisane przez łączącego się jest chronione, a obraz odsyłany
    z powrotem — nie. Jest to dokładnie ten rodzaj ochrony, który daje
    poczucie bezpieczeństwa i nie daje bezpieczeństwa.

    Punkt jest uzupełnieniem, a nie zamiennikiem reguły o warstwie
    zabezpieczeń. Tamta rozstrzyga, czy da się maszynę rozpoznać. Ta —
    jak silne jest szyfrowanie już wewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    zaszyfrowaną słabiej, niż maszyna potrafi, albo taką, w której odsyłany
    obraz serwera daje się odczytać wprost.
  en: |
    The setting marks the lowest strength of encryption the server will consent to
    while a remote desktop session is being set up.

    A value lower than the one demanded means consenting to weaker encryption, or to
    encryption in one direction alone - from the client to the server, with the
    screen's contents sent back in a readable form. It is picked not by the server
    but by the client, so a server set low consents in advance to whatever the
    weakest of those connecting brings.

    Worth saying outright what can be seen in such a session. The server's screen is
    in practice everything: open documents, the management console, the contents of
    directories being browsed, the text of mail. Under one-way encryption the
    password typed by whoever connects is guarded and the picture sent back is not.
    This is exactly the kind of protection that gives a sense of safety and gives no
    safety.

    The item completes rather than replaces the rule on the security layer. That one
    settles whether the machine can be recognised. This one how strong the
    encryption is once inside.

    What an attacker gains while the item goes unmet: a session encrypted more
    weakly than the machine is able to, or one in which the server's returning
    picture can be read outright.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", ale sprawdzenie jest tu krótsze niż przy
    sąsiednich punktach pulpitu zdalnego.

    Poziom wymagany obsługują systemowe klienty od bardzo dawna i nie ma
    powodu, by któryś współczesny go nie znał. Kłopot zostaje ten sam co
    zwykle: narzędzia, które klientem systemowym nie są. Terminale
    bezdyskowe z własną implementacją, konsole wbudowane w kontrolery
    sprzętowe, biblioteki w oprogramowaniu do zdalnej pomocy.

    Objaw jest jednoznaczny i pojawia się przy zestawianiu sesji: klient
    dostaje odmowę, bo nie potrafi zaproponować szyfrowania na żądanym
    poziomie. Nie ma cichego pogorszenia ani opóźnionego skutku.

    Trzeba też wiedzieć, czego ten punkt nie rozstrzyga. Nie mówi nic
    o rozpoznaniu maszyny — to robi reguła o warstwie zabezpieczeń. Sesja
    silnie zaszyfrowana do niewłaściwej maszyny jest nadal sesją do
    niewłaściwej maszyny, więc obu punktów nie wolno traktować wymiennie.

    Czego to nie psuje: sesji już otwartych, konsoli lokalnej, zarządzania
    przez powłokę zdalną.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though the checking here is shorter than at the
    neighbouring remote desktop items.

    The level demanded has been supported by the system's own clients for a very
    long time and there is no reason for any present-day one not to know it. The
    trouble stays the usual one: tools that are not the system's client. Diskless
    terminals with an implementation of their own, consoles built into hardware
    controllers, libraries in remote assistance software.

    The symptom is unambiguous and appears while the session is being set up: the
    client gets a refusal, since it cannot propose encryption at the level demanded.
    There is no quiet worsening and no delayed effect.

    What this item does not settle has to be known as well. It says nothing about
    recognising the machine - the rule on the security layer does that. A strongly
    encrypted session to the wrong machine is still a session to the wrong machine,
    so the two items must not be treated interchangeably.

    What this does not break: sessions already open, the local console, management
    through a remote shell.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - encryption-and-tls
    - legacy-authentication
  what_breaks:
    pl:
      - Terminal bezdyskowy z własną implementacją klienta dostaje odmowę przy zestawianiu sesji
      - Konsole wbudowane w kontrolery sprzętowe oraz biblioteki w oprogramowaniu do zdalnej pomocy tracą dostęp
      - Punkt nie rozstrzyga o rozpoznaniu maszyny, więc sam w sobie nie chroni przed sesją zestawioną do niewłaściwego serwera
      - Sesje już otwarte, konsola lokalna i zarządzanie przez powłokę zdalną pozostają bez zmian
    en:
      - A diskless terminal with a client implementation of its own gets a refusal while the session is being set up
      - Consoles built into hardware controllers and libraries in remote assistance software lose access
      - The item does not settle the recognising of the machine, so by itself it does not guard against a session set up to the wrong server
      - Sessions already open, the local console and management through a remote shell stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Do maszyny łączą się terminale albo konsole sprzętowe nieumiejące zaproponować szyfrowania na żądanym poziomie
      - Pulpit zdalny jest jedyną drogą zarządzania tą maszyną i nie ma innej na wypadek odcięcia
    en:
      - Terminals or hardware consoles unable to propose encryption at the level demanded connect to this machine
      - The remote desktop is the only way of managing this machine and there is no other should access be cut off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $ts = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server'
      $deny = (Get-ItemProperty -Path $ts -Name 'fDenyTSConnections' -ErrorAction Stop).fDenyTSConnections
      if ($deny -eq 1) {
        # Remote Desktop is switched off, so there is no session to encrypt.
        'NOT_APPLICABLE'
      } else {
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $name = 'MinEncryptionLevel'
        if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
        else {
          $item = Get-ItemProperty -Path $path -ErrorAction Stop
          if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    $name = 'MinEncryptionLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Sessions already opened are not broken. The condition is weighed at the next
    # connecting, so the session this is run from stays.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    Set-ItemProperty -Path $path -Name 'MinEncryptionLevel' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Porównanie jest tu „nie mniej niż", a nie „równe", i to jest celowe.
    Wpis opisuje najniższy dopuszczony poziom, więc ustawienie wyższe od
    żądanego spełnia zasadę z nawiązką i audyt nie ma powodu tego karać.

    Tak jak sąsiednie punkty pulpitu zdalnego, reguła zwraca stan
    „nie dotyczy", gdy usługa pulpitu jest wyłączona. Maszyna, która nie
    przyjmuje sesji, nie ma czego szyfrować.

    Kategoria ryzyka jest tu niższa niż przy warstwie zabezpieczeń celowo.
    Słabe szyfrowanie wymaga od napastnika obecności na drodze ruchu
    i pracy nad odczytem; brak rozpoznania maszyny pozwala mu tę sesję po
    prostu przyjąć na siebie. Obie rzeczy są warte zamknięcia, ale nie są
    równe co do wagi.
  en: |
    The comparison here is "not less than" rather than "equal", and that is
    deliberate. The entry describes the lowest level allowed, so a setting higher
    than the one demanded satisfies the principle and more, and the audit has no
    reason to punish it.

    Like the neighbouring remote desktop items, the rule returns the state "not
    applicable" where the desktop service is switched off. A machine that takes no
    sessions has nothing to encrypt.

    The risk category is here lower than at the security layer deliberately. Weak
    encryption calls for the attacker to be present on the road of the traffic and
    to work at reading it; the machine not being recognised lets them simply take
    the session upon themselves. Both things are worth closing, but they are not
    equal in weight.
