id: win11-geolocation-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa ustalania położenia wyłączona
    en: The service determining the machine's whereabouts disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa ustala, gdzie maszyna się znajduje, i udostępnia tę informację
    programom, które o nią poproszą. Robi to nie tylko z odbiornika
    nawigacyjnego, ale przede wszystkim z tego, co maszyna widzi wokół siebie:
    z listy sieci bezprzewodowych w zasięgu, z adresu w sieci, z urządzeń
    bliskiego zasięgu.

    Ostatnie zdanie jest ważniejsze, niż wygląda, i warto powiedzieć wprost
    dlaczego. Położenie ustalone z otaczających sieci bezprzewodowych bywa
    dokładne do pojedynczego budynku, a często do piętra. Nie potrzeba do tego
    żadnego sprzętu nawigacyjnego i działa to wewnątrz budynków, gdzie
    nawigacja satelitarna nie działa wcale.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: program
    działający na maszynie — również taki, który dostał się tam przez
    przeglądarkę albo załącznik — może ustalić, gdzie stoi maszyna, a przez to
    gdzie jest człowiek przy niej. Przy komputerze przenośnym oznacza to
    możliwość śledzenia przemieszczania się osoby, nie tylko sprzętu. Jest to
    informacja innej kategorii niż zawartość dysku i traktowanie jej jak
    szczegółu konfiguracyjnego jest błędem.

    Osobno liczy się to, że informacja ta wychodzi na zewnątrz. Ustalanie
    położenia z sieci bezprzewodowych wymaga zapytania usługi zewnętrznej,
    a więc wysłania listy widzianych sieci poza maszynę.
  en: |
    The service determines where the machine is and makes that information available to
    programs that ask for it. It does so not only from a navigation receiver but above
    all from what the machine sees around it: from the list of wireless networks within
    range, from its address on the network, from short range devices.

    The last sentence matters more than it looks, and it is worth saying outright why.
    Whereabouts determined from surrounding wireless networks are sometimes accurate to a
    single building, and often to a floor. No navigation hardware is needed for it, and
    it works inside buildings, where satellite navigation does not work at all.

    What an attacker gains while the item goes unmet: a program running on the machine -
    including one that got there through a browser or an attachment - can determine where
    the machine stands, and through that where the person at it is. With a portable
    computer that means being able to follow a person's movements, not just the
    hardware's. That is information of a different order than the contents of a disk, and
    treating it as a configuration detail is a mistake.

    It counts separately that this information goes outside. Determining whereabouts from
    wireless networks takes asking an external service, that is sending the list of
    networks seen off the machine.

disruption_description:
  pl: |
    Sprawdzenia wymagają trzy rzeczy, z czego jedna zaskakuje najczęściej.

    Pierwsza to programy jawnie korzystające z położenia: mapy, pogoda,
    nawigacja, odnajdywanie urządzenia. Ich zależność jest oczywista i użytkownik
    zwykle sam ją wskaże.

    Druga to samoczynne ustawianie strefy czasowej. Maszyna ustala strefę na
    podstawie położenia i po wyłączeniu usługi przestaje to robić. Na
    stanowisku stacjonarnym nie ma to znaczenia, bo strefa się nie zmienia.
    Na komputerze przenośnym wożonym między krajami oznacza, że po przyjeździe
    zegar zostaje przy poprzedniej strefie — z widocznym skutkiem w kalendarzu
    i godzinach spotkań. To jest właśnie ta zależność, o której nikt nie pamięta
    przed wdrożeniem.

    Trzecia to programy branżowe zapisujące miejsce wykonania czynności:
    protokoły odbioru, zdjęcia z lokalizacją, dokumentacja terenowa. Tam
    położenie bywa wymogiem, a nie udogodnieniem.

    Na stanowisku biurowym bez komputera przenośnego zmiana zwykle przechodzi
    niezauważona.

    Zmiana wymaga zatrzymania usługi.
  en: |
    Three things need checking, one of which surprises most often.

    The first is programs openly using whereabouts: maps, weather, navigation, finding
    the device. Their dependence is plain and the user will usually point it out
    themselves.

    The second is setting the time zone automatically. The machine determines the zone
    from its whereabouts and, once the service is off, stops doing so. At a stationary
    station that does not matter, since the zone does not change. On a portable computer
    carried between countries it means that on arrival the clock stays in the previous
    zone - with a visible effect in the calendar and the hours of meetings. That is the
    very dependence nobody remembers before a rollout.

    The third is line-of-business programs recording where an act was performed: receipt
    records, pictures with a location, field documentation. There whereabouts are
    sometimes a requirement rather than a convenience.

    At an office station with no portable computer the change usually passes unnoticed.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Mapy, pogoda i nawigacja przestają znać położenie maszyny
      - Samoczynne ustawianie strefy czasowej przestaje działać na komputerze przenośnym
      - Odnajdywanie urządzenia przestaje podawać miejsce, w którym maszyna się znajduje
      - Programy branżowe zapisujące miejsce wykonania czynności zgłaszają brak położenia
    en:
      - Maps, weather and navigation stop knowing where the machine is
      - Setting the time zone automatically stops working on a portable computer
      - Finding the device stops giving the place where the machine is
      - Line-of-business programs recording where an act was performed report no whereabouts
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Komputer przenośny jest wożony między strefami czasowymi i zegar ma się ustawiać sam
      - Program branżowy wymaga zapisania miejsca wykonania czynności
      - Odnalezienie skradzionego komputera przenośnego jest częścią przyjętej procedury
    en:
      - A portable computer is carried between time zones and the clock is to set itself
      - A line-of-business program requires recording where an act was performed
      - Finding a stolen portable computer is part of the accepted procedure
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'lfsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lfsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'lfsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    W tej paczce są dwie reguły dotyczące ustalania położenia i różnica między
    nimi jest praktyczna. Tamta ustawia zasadę, która zabrania programom
    korzystać z położenia — usługa pozostaje uruchomiona, a zasada da się
    zmienić jednym wpisem i wraca przy odtworzeniu zasad z innej maszyny.
    Ta zdejmuje z maszyny sam mechanizm ustalania położenia.

    Wdrożenie obu naraz jest sensowne i nie jest nadmiarowe. Zasada broni
    maszyny, na której usługa zostanie kiedykolwiek włączona z powrotem,
    a wyłączona usługa broni maszyny, na której zasada zostanie zdjęta.

    Wyłączenie usługi nie wyłącza odbiornika nawigacyjnego wbudowanego
    w sprzęt ani modemu sieci komórkowej. Znosi wyłącznie systemowy sposób
    udostępniania położenia programom.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    This pack holds two rules about determining whereabouts, and the difference between
    them is a practical one. That one sets a policy forbidding programs to use
    whereabouts - the service stays running, and the policy can be changed with one entry
    and comes back when policies are restored from another machine. This one takes the
    mechanism for determining whereabouts off the machine.

    Applying both at once makes sense and is not excessive. The policy guards a machine
    on which the service is ever switched back on, and a disabled service guards a
    machine from which the policy is ever taken away.

    Disabling the service does not disable a navigation receiver built into the hardware
    or a mobile network modem. It does away only with the system's way of making
    whereabouts available to programs.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
