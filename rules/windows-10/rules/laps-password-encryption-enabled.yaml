id: win10-laps-password-encryption-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Szyfrowanie hasła lokalnego administratora w katalogu włączone
    en: Encryption of the local administrator password in the directory switched on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Hasło odłożone do katalogu sieciowego leży tam jako atrybut obiektu maszyny.
    Bez szyfrowania jest czytelne dla każdego, kto ma prawo odczytu tego atrybutu,
    a krąg takich uprawnień bywa szerszy, niż ktokolwiek zakładał — zwłaszcza po
    latach dziedziczenia uprawnień i nadań historycznych.

    Szyfrowanie zawęża odczyt do wskazanej grupy, niezależnie od tego, kto ma
    prawa do samego atrybutu. Hasło przestaje być czytelne dla kont, które
    dostały dostęp do katalogu w zupełnie innym celu.

    Bez tego ustawienia mechanizm nadal chroni przed jednym wspólnym hasłem, ale
    tworzy nowe skupisko: jedno miejsce, w którym leżą hasła administratora ze
    wszystkich maszyn naraz.
  en: |
    A password filed into the network directory sits there as an attribute of the
    machine object. Without encryption it is readable to anybody holding read
    rights on that attribute, and the circle of such rights is often wider than
    anybody assumed, especially after years of inherited permissions and historic
    grants.

    Encryption narrows reading to a named group regardless of who holds rights on
    the attribute itself. The password stops being legible to accounts that were
    given directory access for an entirely different purpose.

    Without this setting the mechanism still guards against one shared password,
    but it creates a new concentration - a single place holding the administrator
    passwords of every machine at once.

disruption_description:
  pl: |
    Szyfrowanie wymaga katalogu na odpowiednim poziomie funkcjonalnym. Na starszym
    katalogu ustawienie zostaje zapisane, ale hasło trafia tam nieszyfrowane, więc
    zgodność punktu nie oznacza jeszcze ochrony — to jest różnica warta
    sprawdzenia po stronie katalogu, nie maszyny.

    Druga rzecz dotyczy odczytu. Po włączeniu hasło odczytają wyłącznie
    uprawnieni z wskazanej grupy; narzędzia obsługi korzystające z innych kont
    przestaną je widzieć i trzeba im nadać dostęp świadomie.
  en: |
    Encryption requires a directory at a sufficient functional level. On an older
    directory the setting is written down but the password is filed unencrypted,
    so meeting the item does not yet mean protection - a difference worth checking
    on the directory side, not on the machine.

    The second matter is reading. Once switched on, the password is readable only
    to those in the named group; support tools using other accounts stop seeing it
    and have to be granted access deliberately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - encryption-and-tls
    - scripting-and-automation
  what_breaks:
    pl:
      - Konta spoza wskazanej grupy przestaną odczytywać hasło, nawet jeśli mają prawa do atrybutu obiektu maszyny
      - Narzędzia obsługi i skrypty pobierające hasło pod własnym kontem stracą do niego dostęp, dopóki nie zostaną dopisane do grupy
      - Na katalogu o niższym poziomie funkcjonalnym hasło trafi tam nieszyfrowane mimo zapisanego ustawienia
      - Hasła odłożone przed zmianą pozostają w katalogu w dotychczasowej postaci aż do następnego losowania
      - Losowanie hasła, jego zmiana cykliczna i logowanie lokalne działają bez zmian
    en:
      - Accounts outside the named group stop reading the password, even where they hold rights on the machine object attribute
      - Support tools and scripts fetching the password under their own account lose access until they are added to the group
      - On a directory at a lower functional level the password is filed unencrypted despite the setting being written
      - Passwords filed before the change stay in the directory in their previous form until the next pick
      - Picking the password, its cyclical change and local sign-in all work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Środowiska z katalogiem na poziomie funkcjonalnym niższym niż wymagany, gdzie ustawienie daje zgodność bez ochrony
      - Maszyny obsługiwane przez narzędzia korzystające z kont spoza grupy uprawnionej do odczytu
      - Wdrożenia, w których grupa uprawniona nie została jeszcze ustalona — wtedy hasło szyfruje się dla nikogo
    en:
      - Environments with a directory below the required functional level, where the setting gives compliance without protection
      - Machines served by tools using accounts outside the group entitled to read
      - Rollouts where the entitled group has not yet been settled - the password is then encrypted for nobody
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ADPasswordEncryptionEnabled'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $name = 'ADPasswordEncryptionEnabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ADPasswordEncryptionEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-concepts-overview

notes:
  pl: |
    Ustawienie dotyczy wyłącznie katalogu sieciowego. Na maszynie związanej
    z katalogiem w chmurze hasło jest chronione mechanizmami tamtej strony i ten
    punkt nie ma zastosowania — sprawdzenie zwróci wtedy brak wartości, co warto
    czytać razem z miejscem przechowywania.
  en: |
    The setting concerns the network directory alone. On a machine joined to the
    cloud directory the password is protected by that side s own mechanisms and
    this item does not apply - the check then returns a missing value, which is
    worth reading together with the place of keeping.
