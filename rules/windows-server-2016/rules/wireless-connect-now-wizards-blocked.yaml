id: win2016-wireless-connect-now-wizards-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connect Now
  title:
    pl: Kreatory przekazywania ustawień sieci zablokowane
    en: The wizards for handing network settings over blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje kreatory, którymi uruchamia się przekazywanie
    ustawień sieci bezprzewodowej.

    Punkt domyka poprzedni i warto pokazywać oba razem. Tamten wyłącza
    sam mechanizm wymiany; ten zamyka okna, przez które człowiek tę wymianę
    uruchamia.

    Wartość osobna tej reguły leży w jednej ze ścieżek, które kreatory
    obsługują. Ustawienia sieci da się bowiem przekazać nie tylko
    bezprzewodowo, ale też przez nośnik wymienny: kreator zapisuje je na
    nośniku, a druga maszyna czyta je stamtąd. Powstaje w ten sposób plik
    zawierający klucz do sieci, leżący na nośniku, który ktoś potem
    gdzieś odłoży.

    Na serwerze żadna z tych dróg nie ma zastosowania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wyniesienia klucza do sieci na nośniku wymiennym, uruchamianą
    kreatorem dostępnym w systemie.
  en: |
    The setting blocks the wizards by which the handing over of wireless network settings is started.

    The item shuts the one before, and both are worth showing together. That one switches the exchange
    mechanism itself off; this one shuts the windows through which a person starts that exchange.

    This rule's own value lies in one of the paths the wizards serve. For network settings can be handed
    over not only wirelessly but also by removable media: the wizard writes them to the medium, and the
    other machine reads them from there. There comes into being in that way a file holding the key to the
    network, lying on a medium somebody will later put away somewhere.

    On a server none of those roads is of any use.

    What an attacker gains while the item goes unmet: a road for carrying the network's key out on removable
    media, started by a wizard to be had within the system.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze kreatory te nie są przez nikogo używane. Ich zablokowanie
    nie zmienia zachowania żadnej aplikacji, żadnej usługi i żadnej roli.

    Zmiana dotyczy wyłącznie okien uruchamianych ręcznie. Nic nie dzieje
    się samoczynnie ani w tle.

    Rzecz warta powiedzenia: punkt nie zamyka mechanizmu wymiany, tylko
    drogę uruchomienia go z interfejsu. Wykonanie samego tego punktu
    zostawia mechanizm działający dla wszystkiego, co okna nie potrzebuje.
    Domknięcie wymaga obu reguł.

    Nie ma znanych regresji.

    Czego to nie psuje: łączenia się z sieciami, zapamiętanych sieci,
    nośników wymiennych, drukowania, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    On a server those wizards are used by nobody. Blocking them changes the behaviour of no application, no
    service and no role.

    The change concerns solely windows started by hand. Nothing happens of itself or in the background.

    A thing worth saying: the item does not shut the exchange mechanism, only the road for starting it from
    the interface. Carrying out this item alone leaves the mechanism working for everything that needs no
    window. The shutting calls for both rules.

    There are no known regressions.

    What this does not break: the connecting to networks, remembered networks, removable media, printing,
    services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - removable-media
    - user-interface
  what_breaks:
    pl:
      - Kreatory przekazywania ustawień sieci przestają się otwierać i nie da się zapisać ustawień na nośniku
      - Sam mechanizm wymiany pozostaje działający, dopóki nie zostanie wyłączony osobną regułą
      - Łączenie się z sieciami, zapamiętane sieci i nośniki wymienne pozostają bez zmian
      - Drukowanie, usługi i aplikacje pozostają bez zmian
    en:
      - The wizards for handing network settings over cease to open and the settings cannot be written to a medium
      - The exchange mechanism itself stays working until it is switched off by a separate rule
      - The connecting to networks, remembered networks and removable media stay unchanged
      - Printing, services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny przekazuje się ustawienia sieci na nośniku wymiennym do urządzeń bez innego sposobu konfiguracji
    en:
      - Network settings are handed over from this machine on removable media to devices with no other way of being configured
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A neighbouring path to the one holding the settings exchange itself:
      # this entry concerns the interface, that one the mechanism.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
      $name = 'DisableWcnUi'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
    $name = 'DisableWcnUi'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This shuts the window, not the mechanism behind it. Worth carrying out
    # together with the item about the handing over itself - alone it leaves
    # the road open to anything that does not need the window.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WCN\UI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWcnUi' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/mobilebroadband/

notes:
  pl: |
    Punkt jest drugi w bloku i domyka pierwszy. Wykonany osobno daje
    poczucie domknięcia, którego nie ma — mechanizm zostaje, znika tylko
    okno.

    Argument osobny, wart zachowania, dotyczy nośnika wymiennego. Jest to
    jedyne miejsce w całym bloku, w którym klucz do sieci opuszcza maszynę
    jako plik, a nie jako transmisja. Plik zostaje na nośniku po
    zakończeniu pracy i nikt go stamtąd nie usuwa.

    Warto, żeby aplikacja pokazywała obie reguły z tej sekcji jako jedną
    decyzję. Leżą w sąsiednich gałęziach rejestru, mają różne wartości
    i różne nazwy, ale rozstrzyga się je razem i razem nic nie kosztują
    na serwerze.

    Kategoria średnia przy zerowym koszcie jest tu postawiona ze względu
    na drogę nośnikową. Bez niej punkt byłby czystym porządkiem.
  en: |
    The item is the second in the block and shuts the first. Carried out on its own it gives a sense of a
    shutting that is not there - the mechanism stays, only the window goes.

    Its own argument, worth keeping, concerns removable media. It is the one place in the whole block where
    the network's key leaves the machine as a file and not as a transmission. The file stays on the medium
    after the work is done and nobody removes it from there.

    It is well that the application show both rules from this section as one decision. They lie in
    neighbouring branches of the registry, have different values and different names, but are settled
    together and together cost nothing on a server.

    The medium category at nil cost is set here for the sake of the road by medium. Without it the item
    would be pure order.
