id: win10-security-log-management-administrators

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zarządzanie inspekcją i dziennikiem zabezpieczeń zastrzeżone dla administratorów
    en: The ruling of auditing and of the journal of security reserved to administrators
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega prawo zarządzania inspekcją i dziennikiem
    zabezpieczeń dla administratorów lokalnych.

    Prawo to obejmuje dwie rzeczy. Pierwszą jest ustalanie, co ma być
    zapisywane w dzienniku zabezpieczeń — czyli które zdarzenia w ogóle
    zostawiają ślad. Drugą jest odczyt i wyczyszczenie tego dziennika.

    Zagrożenie dotyczy zacierania śladów. Napastnik, który wykonał już
    swoją pracę, potrzebuje usunąć zapis o tym, co zrobił. Konto z tym
    prawem może wyczyścić dziennik zabezpieczeń w całości albo — co
    skuteczniejsze — wyłączyć zapisywanie wybranych zdarzeń zawczasu,
    żeby ślad w ogóle nie powstał.

    Drugi wariant jest groźniejszy i warto go wymienić osobno. Wyczyszczony
    dziennik jest sam w sobie zdarzeniem podejrzanym i zostaje zapisany.
    Dziennik, do którego nigdy nic nie trafiło, wygląda na spokojną
    maszynę.

    Odnotowuję, że prawo to daje także odczyt dziennika zabezpieczeń,
    a więc wgląd w to, kto i kiedy się logował — materiał do rozpoznania.

    Sprawdzenie przyjmuje wykaz węższy niż wymagany.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyłączenia zapisu zdarzeń, zanim jeszcze ślad powstanie.
  en: |
    The setting reserves the right of ruling auditing and the journal of security to the local administrators.

    That right holds two things. The first is the settling of what is to be written into the journal of security -
    which is to say which happenings leave a trace at all. The second is the reading and the clearing of that
    journal.

    The danger touches the wiping out of traces. An attacker who has done their work needs the record of what they
    did taken away. An account with this right may clear the journal of security whole or - what works better -
    switch off beforehand the writing of chosen happenings, that the trace should never come about.

    The second manner is the graver and worth naming apart. A cleared journal is itself a happening to be
    suspected and is written down. A journal into which nothing ever came looks like a quiet machine.

    I set down that the right gives also the reading of the journal of security, and so a sight of who signed in
    and when - matter for the looking over.

    The check takes a list narrower than the one called for.

    What an attacker gains while the item goes unmet: the switching off of the writing of happenings before ever a
    trace comes about.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są systemy
    zbierające dzienniki zdarzeń z tej maszyny.

    Miejscem najczęstszym jest konto usługowe agenta zbierającego
    dzienniki. Odczyt dziennika zabezpieczeń wymaga tego prawa, więc
    zostało mu nadane przy instalacji. Po zmianie agent przestanie czytać
    dziennik zabezpieczeń — i, co istotne, zwykle nie zgłosi tego jako
    błędu, tylko przestanie przysyłać zdarzenia tego jednego rodzaju.

    Objaw jest więc cichy i warto go wymienić. Pozostałe dzienniki idą
    dalej, wykres w systemie zbierającym nie spada do zera, a brakuje
    dokładnie tych zdarzeń, które są najważniejsze.

    Miejscem drugim są narzędzia do archiwizacji dzienników uruchamiane
    z konta operatorskiego.

    Sprawdzenie polega na wypisaniu kont, które czytają dziennik
    zabezpieczeń tej maszyny, i porównaniu ich z wykazem.

    Skutek pojawia się przy następnym zalogowaniu konta tracącego prawo.

    Czego to nie psuje: zapisywania zdarzeń, odczytu pozostałych
    dzienników, logowania, pracy z plikami, drukowania.
  en: |
    The class is "needs review", and the object of the review is the systems gathering the journals of events from
    this machine.

    The commonest place is the service account of an agent that gathers journals. The reading of the journal of
    security calls for this right, so it was granted at the installing. After the change the agent will cease to
    read the journal of security - and, what weighs, will commonly not report that as a fault but simply stop
    sending happenings of that one kind.

    The mark of it is therefore a quiet one and worth naming. The other journals go on, the chart in the gathering
    system does not fall to nought, and just those happenings are wanting that matter most.

    The second place is tools for the laying up of journals run from an operator's account.

    The review comes down to a writing out of the accounts that read this machine's journal of security and a
    setting of them beside the list.

    The consequence shows at the next signing in of an account that loses the right.

    What this does not break: the writing of happenings, the reading of the other journals, logging on, work with
    files, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - remote-management
  what_breaks:
    pl:
      - Agent zbierający dzienniki przestanie czytać dziennik zabezpieczeń tej maszyny
      - Zwykle nie zgłosi tego jako błędu, tylko przestanie przysyłać zdarzenia tego jednego rodzaju
      - Pozostałe dzienniki idą dalej, więc wykres nie spada do zera i brak bywa zauważony późno
      - Narzędzia archiwizujące dzienniki z konta operatorskiego stracą dostęp do dziennika zabezpieczeń
      - Zapisywanie zdarzeń, odczyt pozostałych dzienników, logowanie i drukowanie pozostają bez zmian
    en:
      - An agent gathering journals will cease to read this machine s journal of security
      - It will commonly not report that as a fault but simply stop sending happenings of that one kind
      - The other journals go on, so the chart does not fall to nought and the want is at times marked late
      - Tools laying up journals from an operator s account will lose the way to the journal of security
      - The writing of happenings, the reading of the other journals, logging on and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje agent zbierający dzienniki, którego konto usługowe wymaga odczytu dziennika zabezpieczeń
      - Dzienniki są archiwizowane narzędziem uruchamianym z konta operatorskiego
    en:
      - Upon the machine works an agent gathering journals whose service account needs the reading of the journal of security
      - The journals are laid up by a tool run from an operator s account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSecurityPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSecurityPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSecurityPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the local administrators alone. A list narrower than that
    # meets the item too, and the check takes an empty one as meeting it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSecurityPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSecurityPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/manage-auditing-and-security-log

notes:
  pl: |
    Reguła jest szczególna, bo broni nie danych, tylko możliwości
    stwierdzenia, co się z danymi stało. Warto, żeby aplikacja to
    powiedziała wprost: punkt ten nie powstrzyma ataku, ale bez niego
    nie będzie wiadomo, że atak miał miejsce.

    Argument wart postawienia wprost dotyczy różnicy między wyczyszczeniem
    dziennika a wyłączeniem zapisu. Pierwsze zostawia ślad po sobie
    i bywa wykrywane. Drugie nie zostawia niczego, bo nie ma czego
    zostawić — maszyna po prostu wygląda na spokojną. Napastnik
    doświadczony sięga po drugie.

    Odnotowuję objaw po stronie systemu zbierającego dzienniki, bo jest tu
    praktycznie ważny. Agent, który stracił to prawo, nie krzyczy —
    przestaje przysyłać jeden rodzaj zdarzeń, a reszta idzie dalej.
    Przy sprawdzaniu tego punktu warto spojrzeć nie na to, czy agent
    działa, tylko na to, czy zdarzenia zabezpieczeń nadal przychodzą.
  en: |
    The rule is a particular one, guarding not data but the power of settling what became of the data. It is well
    that the application say so outright: this item will hold no attack back, but without it there will be no
    knowing that an attack took place.

    The argument worth putting outright touches the difference between the clearing of a journal and the switching
    off of the writing. The first leaves a trace behind it and is at times found out. The second leaves nothing,
    there being nothing to leave - the machine simply looks quiet. A practised attacker reaches for the second.

    I set down the mark of it upon the side of the gathering system, that being here of practical weight. An agent
    that has lost this right does not cry out - it stops sending one kind of happening and the rest goes on. At
    the reviewing of this item it is worth looking not at whether the agent works but at whether the happenings of
    security still come in.
