id: fedora44-coredump-backtraces-disabled

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.5.3
  section: Initial Setup > Configure Additional Process Hardening
  title:
    pl: Generowanie śladu stosu ze zrzutów pamięci jest wyłączone
    en: Ensure core dump backtraces are disabled
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy program kończy się awarią, jądro przekazuje obraz jego pamięci do
    systemd-coredump. Ten analizuje obraz jako root i zapisuje w dzienniku
    systemowym ślad stosu każdego wątku: nazwy funkcji, bibliotek i adresy, pod
    którymi były załadowane. Analiza danych z procesu, który właśnie uległ
    awarii, np. po celowo przygotowanych danych wejściowych, to dodatkowa
    powierzchnia ataku, a adresy w dzienniku zdradzają rozmieszczenie pamięci,
    które ASLR ma ukrywać.

    Parametr ProcessSizeMax w [Coredump] określa, do jakiego rozmiaru zrzuty są
    analizowane; domyślnie to 32 GiB na systemach 64-bitowych. Punkt wymaga
    wartości 0, przy której ślad stosu nie powstaje. Sam zrzut może nadal
    zostać zapisany na dysku; o tym decyduje punkt 1.5.4.
  en: |
    When a program crashes, the kernel hands an image of its memory to
    systemd-coredump. It analyses the image as root and writes the stack trace
    of every thread to the system journal: the names of functions and
    libraries and the addresses they were loaded at. Analysing data from a
    process that has just crashed, for example on purposely crafted input, is
    extra attack surface, and the addresses in the journal reveal the memory
    layout that ASLR is meant to hide.

    The ProcessSizeMax setting in [Coredump] sets up to which size dumps are
    analysed; the default is 32 GiB on 64-bit systems. The item requires value
    0, at which no stack trace is produced. The dump itself may still be
    stored on disk; item 1.5.4 decides that.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo zmiana odbiera gotowy materiał do diagnozy
    awarii. Zwykły użytkownik tego nie zauważy; programista lub administrator
    nie znajdzie w dzienniku śladu stosu i musi otworzyć zapisany zrzut
    w debuggerze. Zmiana działa od następnej awarii, bez restartu.
  en: |
    The class needs review because the change removes ready material for
    crash diagnosis. A regular user will not notice; a developer or
    administrator finds no stack trace in the journal and has to open the
    stored dump in a debugger. The change takes effect from the next crash,
    without a restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Dziennik systemowy i polecenie coredumpctl info pokazują tylko informację o awarii programu, bez śladu stosu
      - Ustalenie przyczyny awarii wymaga otwarcia zapisanego zrzutu w debuggerze, np. poleceniem coredumpctl debug, o ile zrzut jest przechowywany
    en:
      - The system journal and the coredumpctl info command show only a note about the program crash, without a stack trace
      - Finding the cause of a crash requires opening the stored dump in a debugger, for example with the coredumpctl debug command, as long as the dump is kept
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stacja programisty lub testera, który diagnozuje awarie własnych programów na podstawie śladów stosu w dzienniku
    en:
      - A developer or tester workstation where crashes of one's own programs are diagnosed from stack traces in the journal
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! systemd-analyze cat-config systemd/coredump.conf >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    c=$(systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | awk -v s="[Coredump]" -v k="ProcessSizeMax" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
    if printf '%s\n' "$c" | grep -qxE '0'; then echo "OK:$c"; else echo "NOT_OK:${c:-default}"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      mkdir -p /etc/systemd/coredump.conf.d
      printf '%s\n' '# Sentin-Harden: fedora44-coredump-backtraces-disabled' '[Coredump]' 'ProcessSizeMax=0' > "$f"
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      c=$(systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | awk -v s="[Coredump]" -v k="ProcessSizeMax" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
      if [ "$c" != "0" ]; then
        echo "Another drop-in sets ProcessSizeMax after $f; the effective value is ${c:-default}" >&2; exit 1
      fi
      echo "Set ProcessSizeMax=0 in $f"
    )

  rollback_command: |
    (
      set -e
      f=/etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      echo "Restored the previous state of $f"
    )

privileges: root
runnable: true

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/coredump.conf.html
  - https://www.freedesktop.org/software/systemd/man/latest/coredumpctl.html

notes:
  pl: |
    Sprawdzenie odczytuje wartość, którą widzi systemd-coredump, z polecenia
    systemd-analyze cat-config systemd/coredump.conf. Wypisuje ono plik główny
    i pliki z katalogów coredump.conf.d w kolejności stosowania, więc liczy się
    ostatnie przypisanie w sekcji [Coredump]. Brak wpisu oznacza wartość
    domyślną i nie spełnia punktu.

    Naprawa zapisuje ustawienie w
    /etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf i
    kończy się błędem, jeśli inny plik je nadpisuje. systemd-coredump czyta
    konfigurację przy każdej awarii, więc nie trzeba niczego restartować.
    Wycofanie przywraca poprzedni stan pliku.

    Razem z Storage=none z punktu 1.5.4 ustawienie wyłącza całą obsługę
    zrzutów poza krótkim wpisem w dzienniku. Działa tylko wtedy, gdy parametr
    jądra kernel.core_pattern przekazuje zrzuty do systemd-coredump, co jest
    domyślne na Fedorze.
  en: |
    The check reads the value systemd-coredump sees from the systemd-analyze
    cat-config systemd/coredump.conf command. It prints the main file and the
    files from the coredump.conf.d directories in the order they are applied,
    so the last assignment in the [Coredump] section counts. No entry means the
    default value and does not meet the item.

    The remediation writes the setting to
    /etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf and ends
    with an error if another file overrides it. systemd-coredump reads its
    configuration on every crash, so nothing has to be restarted. Rollback
    restores the previous state of the file.

    Together with Storage=none from item 1.5.4 the setting turns off all
    dump handling except a short journal entry. It only works when the
    kernel.core_pattern kernel parameter hands dumps to systemd-coredump, which
    is the Fedora default.
