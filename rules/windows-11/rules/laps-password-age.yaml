id: win11-laps-password-age

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Okres ważności hasła lokalnego administratora najwyżej trzydzieści dni
    en: Term of the local administrator password's validity at most thirty days
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, jak długo może obowiązywać jedno wylosowane hasło
    lokalnego administratora, i wymaga okresu nie dłuższego niż trzydzieści
    dni.

    Sens punktu bierze się z tego, że mechanizm losujący chroni przed
    ponownym użyciem hasła, a nie przed jego wyciekiem. Hasło raz odczytane
    z katalogu — przez pracownika wsparcia, przez narzędzie, przez kogoś,
    kto miał uprawnienia i przestał mieć — jest hasłem znanym poza
    mechanizmem. Od tej chwili jedyne, co ogranicza jego przydatność, to
    termin następnej zmiany.

    Okres ważności jest więc miarą tego, jak długo wyciek pozostaje groźny.
    Hasło zmieniane raz do roku daje rok. Zmieniane co trzydzieści dni daje
    najwyżej trzydzieści dni — i ten czas jest krótszy niż typowy odstęp
    między przejęciem dostępu a jego wykorzystaniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość
    dostępu uzyskanego raz. Hasło zdobyte przy okazji zgłoszenia serwisowego
    zostaje ważne długo po tym, jak wszyscy o tym zgłoszeniu zapomnieli.

    Punkt bywa mylony z wymaganiem zmiany hasła przez użytkowników, które
    w dzisiejszych zaleceniach jest odradzane. Różnica polega na tym, że
    tam człowiek reaguje na przymus zmiany, tworząc hasła coraz słabsze;
    tutaj hasło losuje maszyna i częstsza zmiana nie ma żadnej ceny.
  en: |
    The setting settles how long one randomly chosen local administrator password may bind,
    and takes a term no longer than thirty days.

    The item's sense comes from the choosing mechanism guarding against a password's reuse
    rather than against its leaking. A password once read from the directory - by a support
    worker, by a tool, by somebody who had rights and stopped having them - is a password
    known outside the mechanism. From that moment the only thing limiting its usefulness is
    the term of the next change.

    The term of validity is thus a measure of how long a leak stays dangerous. A password
    changed once a year gives a year. Changed every thirty days it gives thirty days at
    most - and that time is shorter than the usual gap between access being taken and being
    used.

    What an attacker gains while the item goes unmet: the permanence of access gained once.
    A password taken on the occasion of a service case stays valid long after everybody has
    forgotten that case.

    The item is sometimes confused with demanding that users change their passwords, which
    today's advice discourages. The difference lies in a person there reacting to the
    compulsion by making ever weaker passwords; here the machine chooses the password and a
    more frequent change carries no price at all.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji i nie zmienia sposobu pracy.

    Hasło jest losowane i odkładane przez maszynę, więc częstsza zmiana nie
    obciąża nikogo. Odczyt hasła z katalogu działa bez zmiany.

    Sprawdzenia wymagają procedury, w których hasło lokalnego administratora
    jest gdzieś zapisywane poza katalogiem — w dokumentacji stanowiska,
    w narzędziu wsparcia, w skrypcie. Takie zapisy staną się nieaktualne
    szybciej, a pracująca na nich procedura zacznie zawodzić.

    Jest to skutek zamierzony. Zapisanie hasła poza katalogiem jest
    dokładnie tym, czemu mechanizm ma zapobiegać, więc wcześniejsze
    ujawnienie takiej praktyki jest korzyścią, a nie kosztem.

    Zmiana nie wymaga restartu i cofa się natychmiast.
  en: |
    The change takes away no function and alters no way of working.

    The password is chosen and laid by the machine, so a more frequent change burdens
    nobody. Reading the password from the directory works unchanged.

    What needs checking are procedures in which the local administrator's password is
    recorded somewhere outside the directory - in a station's documentation, in a support
    tool, in a script. Such records will go out of date faster, and the procedure working
    from them will start to fail.

    That is the intended effect. Recording the password outside the directory is exactly
    what the mechanism is to prevent, so bringing such a practice to light earlier is a
    benefit rather than a cost.

    The change takes no restart and reverses at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Hasła zapisane poza katalogiem tracą aktualność szybciej niż dotąd
      - Procedury wsparcia oparte na zapisanym haśle zaczynają zawodzić wcześniej
      - Odczyt hasła z katalogu działa bez zmiany
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - Passwords recorded outside the directory go out of date faster than until now
      - Support procedures resting on a recorded password start failing earlier
      - Reading the password from the directory works unchanged
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is counted in days.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordAgeDays'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '30'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordAgeDays' -ErrorAction SilentlyContinue).'PasswordAgeDays'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordAgeDays'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Thirty is the upper bound the item takes; a shorter term meets it too.
    Set-ItemProperty -Path $path -Name 'PasswordAgeDays' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Porównanie jest „nie więcej niż", więc okres krótszy niż trzydzieści dni
    spełnia punkt tak samo. Polecenie naprawcze zapisuje wartość progową
    jako najmniejszą zmianę prowadzącą do zgodności.

    Reguła zamyka podstawową szóstkę opisującą mechanizm losowania haseł
    lokalnego administratora. Razem odpowiadają na cztery pytania: gdzie
    hasło jest przechowywane, czy jest tam osłonięte, jak wygląda i jak
    długo obowiązuje. Pierwsza z nich jest warunkiem pozostałych — bez
    wskazania miejsca przechowywania reszta nie ma zastosowania.

    Wszystkie ustawienia tego mechanizmu leżą w jednym kluczu, więc
    wycofanie jednego nie rusza pozostałych.

    Brak wartości nie jest stanem zgodnym, bo domyślny okres jest dłuższy.
  en: |
    The comparison is "not greater than", so a term shorter than thirty days meets the item
    just as well. The remedy command writes the threshold value as the smallest change
    leading to compliance.

    The rule closes the basic six describing the mechanism choosing local administrator
    passwords at random. Together they answer four questions: where the password is kept,
    whether it is covered there, what it looks like and how long it binds. The first of
    them is the condition of the rest - without the place of keeping being named the others
    do not apply.

    All the settings of that mechanism lie in one key, so rolling one back does not disturb
    the rest.

    A missing value is not a compliant state, since the default term is longer.
