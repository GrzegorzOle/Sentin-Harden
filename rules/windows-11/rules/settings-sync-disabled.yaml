id: win11-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Synchronizowanie ustawień między maszynami wyłączone
    en: Synchronising settings between machines switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Synchronizacja ustawień przenosi konfigurację użytkownika między
    maszynami, na których zaloguje się tym samym kontem chmurowym: wygląd
    pulpitu, ustawienia programów, listę urządzeń, a w części wariantów również
    zapisane hasła sieci bezprzewodowych i poświadczenia.

    Ten ostatni element rozstrzyga o wadze punktu. Poświadczenia zapisane na
    stanowisku służbowym wychodzą do usługi chmurowej powiązanej z kontem
    użytkownika — a więc z kontem, nad którym organizacja zwykle nie ma
    kontroli, bo jest osobiste. Stamtąd trafiają na każdą inną maszynę, na
    której ten sam człowiek się zaloguje: na komputer domowy, na sprzęt
    rodziny, na maszynę w wypożyczalni.

    Droga działa też w drugą stronę. Ustawienie wniesione z maszyny prywatnej,
    o której nikt nic nie wie, zostaje zastosowane na stanowisku służbowym.

    Punkt zamyka mechanizm w całości i dodatkowo odbiera użytkownikowi
    możliwość włączenia go z powrotem w ustawieniach. Bez tego drugiego
    warunku wyłączenie jest sugestią, a nie zasadą.
  en: |
    Settings synchronisation carries a user's configuration between the machines
    where they sign in with the same cloud account: the desktop's appearance, program
    settings, the list of devices, and in some variants the saved wireless network
    passwords and credentials as well.

    That last element settles the item's weight. Credentials saved at a work station
    go out to a cloud service tied to the user's account - an account the
    organisation usually has no control over, because it is a personal one. From
    there they reach every other machine that same person signs in to: a home
    computer, the family's equipment, a machine in a rental shop.

    The route works the other way too. A setting brought in from a private machine
    nobody knows anything about is applied at the work station.

    The item closes the mechanism entirely and additionally takes away the user's
    ability to switch it back on in the settings. Without that second condition,
    switching off is a suggestion rather than a policy.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ludzie nie pracują naprzemiennie na dwóch
    maszynach, licząc na to, że ustawienia przenoszą się same.

    Po wdrożeniu przestają się przenosić. Wygląd pulpitu, ułożenie okien,
    zapisane hasła sieci bezprzewodowych i ustawienia części programów trzeba
    będzie odtworzyć na każdej maszynie osobno. Zauważy to każdy, kto loguje
    się na więcej niż jednym stanowisku — przy pierwszym logowaniu po zmianie.

    Ustawienia już przeniesione zostają tam, gdzie są. Punkt zatrzymuje
    przenoszenie, a nie cofa to, co się przeniosło wcześniej, więc poświadczenia
    wysłane przed wdrożeniem pozostają w usłudze chmurowej. Wyczyszczenie ich
    jest osobną czynnością, robioną po stronie konta.

    Przełącznik w ustawieniach systemu staje się nieaktywny. Użytkownik, który
    będzie próbował włączyć synchronizację z powrotem, zobaczy wyszarzoną
    opcję, a nie zniknięty ekran — przyczyna jest więc widoczna.

    Nie ma restartu.
  en: |
    What needs checking is whether people work alternately on two machines, counting
    on settings carrying over by themselves.

    After the rollout they stop carrying over. The desktop's appearance, the layout
    of windows, saved wireless network passwords and the settings of some programs
    will have to be recreated on each machine separately. Anyone who signs in at more
    than one station will notice - at the first sign-in after the change.

    Settings already carried over stay where they are. The item stops the carrying,
    not undoes what was carried earlier, so credentials sent before the rollout
    remain in the cloud service. Clearing them is a separate task, done on the
    account's side.

    The switch in the system's settings becomes inactive. A user trying to turn
    synchronisation back on sees a greyed-out option rather than a vanished screen -
    so the cause is visible.

    There is no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Ustawienia przestaną przenosić się między maszynami tego samego użytkownika
      - Zapisane hasła sieci bezprzewodowych trzeba będzie wprowadzić na każdej maszynie osobno
      - Przełącznik synchronizacji w ustawieniach systemu staje się nieaktywny
      - Ustawienia i poświadczenia wysłane przed wdrożeniem pozostają w usłudze chmurowej
    en:
      - Settings stop carrying over between the same user's machines
      - Saved wireless network passwords will have to be entered on each machine separately
      - The synchronisation switch in the system's settings becomes inactive
      - Settings and credentials sent before the rollout remain in the cloud service
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ludzie pracują naprzemiennie na kilku maszynach i liczą na przenoszenie ustawień
      - Stanowiska zastępcze są przygotowywane przez zalogowanie się kontem i pobranie konfiguracji
    en:
      - People work alternately on several machines and count on settings carrying over
      - Replacement stations are prepared by signing in with an account and pulling the configuration down
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user. Switched off but left to the user is reported
      # apart, because it is a suggestion rather than a policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableSettingSync'
        $override = $item.'DisableSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      switch           = $item.'DisableSettingSync'
      switch_existed   = ($null -ne $item.'DisableSettingSync')
      override         = $item.'DisableSettingSyncUserOverride'
      override_existed = ($null -ne $item.'DisableSettingSyncUserOverride')
      key_existed      = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableSettingSync' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableSettingSync' -ErrorAction SilentlyContinue
    }
    if ($b.override_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableSettingSyncUserOverride' -Value $b.override -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableSettingSyncUserOverride' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Wpis główny nie jest przełącznikiem: dwójka oznacza wyłączenie
    synchronizacji, zero jej dopuszczenie. Jedynka nie występuje w tym
    ustawieniu i jej obecność świadczy o wpisie zrobionym ręcznie, poza
    edytorem zasad.

    Wpis odbierający wybór użytkownikowi działa odwrotnie, niż sugeruje nazwa
    pola w edytorze: zaznaczone pole „pozwól użytkownikom włączyć" zapisuje
    zero, a odznaczone — jedynkę. Wymagana jest jedynka, czyli pole
    odznaczone.

    Reguła czyta obie wartości razem, bo wyłączenie bez odebrania wyboru jest
    sugestią. Użytkownik przestawia to jednym kliknięciem w ustawieniach
    i punkt przestaje mieć znaczenie, choć wpis pozostaje na miejscu.

    Ustawienia przeniesione przed wdrożeniem zostają w usłudze chmurowej.
    Punkt zatrzymuje przenoszenie i nie czyści tego, co już wyszło.
  en: |
    The main entry is not a switch: a two means synchronisation is off, a zero means
    it is admitted. A one does not occur in this setting and its presence points to
    an entry made by hand, outside the policy editor.

    The entry taking the choice away from the user works the reverse of what the
    field's name in the editor suggests: a ticked "allow users to turn this on" box
    writes a zero, and an unticked one a one. A one is required - the box unticked.

    The rule reads both values together, because switching off without taking the
    choice away is a suggestion. The user changes it back with one click in the
    settings and the item stops meaning anything, though the entry stays in place.

    Settings carried over before the rollout stay in the cloud service. The item
    stops the carrying and does not clear what has already gone out.
