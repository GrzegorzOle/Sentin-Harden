id: win2025-camera-use-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Camera
  title:
    pl: Korzystanie z kamery zablokowane
    en: Use of the camera blocked
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje korzystanie z kamery na poziomie systemu, niezależnie od
    ustawień poszczególnych aplikacji.

    Kategoria średnia i chcę nazwać rzecz od strony tego, czym kamera jest
    w pomieszczeniu, a nie w aplikacji. Kamera nie pokazuje tylko twarzy
    osoby przy maszynie. Pokazuje to, co za nią: tablicę, ekran sąsiedniego
    stanowiska, kartkę leżącą na biurku, wchodzących i wychodzących.
    Materiał, którego nikt świadomie nie udostępnia, bywa w kadrze
    przypadkiem.

    To jest właściwa treść punktu. Ustawienia w aplikacjach są deklaracją
    aplikacji; ten wpis jest ustawieniem systemu i obowiązuje niezależnie
    od tego, co aplikacja o sobie twierdzi. Różnica między tymi dwoma
    poziomami jest tu całą wartością reguły.

    Na serwerze sprawa wygląda inaczej niż na stanowisku i warto to
    powiedzieć uczciwie: kamery zwykle nie ma. Bywa jednak inaczej —
    maszyna wirtualna może dostać urządzenie od gospodarza, a sesja zdalna
    potrafi przekierować kamerę osoby, która się połączyła. To drugie jest
    przypadkiem najczęstszym i najmniej oczywistym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obraz
    z pomieszczenia, w którym stoi urządzenie widziane przez tę maszynę,
    wraz z tym, co przypadkiem znalazło się w kadrze.
  en: |
    The item blocks the use of the camera at the level of the system,
    regardless of the settings of individual applications.

    The category is medium, and I want to put the matter from the side of
    what a camera is in a room rather than in an application. A camera does
    not show only the face of the person at the machine. It shows what is
    behind them: a whiteboard, the screen of the next desk, a sheet of paper
    on the table, people coming and going. Material nobody deliberately
    shares is sometimes in the frame by accident.

    That is the real substance of the item. Settings within applications are
    an application's declaration; this entry is a setting of the system and
    holds regardless of what an application claims about itself. The
    difference between those two levels is the whole value of the rule here.

    On a server the matter looks different from on a workstation, and it is
    worth saying so honestly: there is usually no camera. It happens
    otherwise, though - a virtual machine may be given a device by its host,
    and a remote session can redirect the camera of whoever connected. The
    second is the commonest case and the least obvious.

    What an attacker gains while the item goes unmet: a picture of the room
    where the device seen by this machine stands, together with whatever
    happened to fall within the frame.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest jeden: jeżeli kamera
    jest na tej maszynie do czegokolwiek używana, reguła odbiera ją
    wszystkim naraz i bez wyjątków.

    Trzeba więc odpowiedzieć na trzy pytania, zanim się ją zastosuje. Czy
    ktoś prowadzi z tej maszyny rozmowy wideo. Czy działa tu logowanie
    rozpoznaniem twarzy — bo po zastosowaniu reguły przestanie, a osoba
    logująca się w ten sposób musi mieć czym wejść inaczej. Czy jakaś
    aplikacja nie czyta kodów kreskowych albo dokumentów kamerą, co zdarza
    się w rozwiązaniach obsługi magazynu i rejestracji.

    Drugie pytanie jest tym, przez które ta reguła bywa dotkliwa. Odebranie
    ludziom sposobu logowania bez przygotowania zamiennika jest awarią,
    a nie utwardzeniem.

    Czego to nie psuje: mikrofonu, dźwięku, sesji zdalnych jako takich,
    udostępniania ekranu ani niczego, co nie sięga po obraz z kamery.

    Bez przerwy i natychmiast odwracalne, ale decyzję podejmuj punkt po
    punkcie, nie w trybie zbiorczym.
  en: |
    The class is "needs planned rollout", and the reason is single: if the
    camera is used on this machine for anything at all, the rule takes it
    from everybody at once and without exception.

    Three questions therefore have to be answered before applying it. Does
    anybody hold video calls from this machine. Does signing in by face
    recognition work here - because after the rule is applied it will stop,
    and whoever signs in that way must have another way in. Does some
    application read barcodes or documents with the camera, which happens in
    warehouse and registration arrangements.

    The second question is the one that makes this rule bite. Taking from
    people their way of signing in without preparing a replacement is a
    failure, not hardening.

    What this does not break: the microphone, audio, remote sessions as such,
    screen sharing, or anything that does not reach for a camera's picture.

    No outage and undone immediately, but take the decision item by item, not
    in the bulk mode.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Rozmowy wideo prowadzone z tej maszyny przestaną działać, bez wyjątków dla poszczególnych aplikacji
      - Logowanie rozpoznaniem twarzy przestanie działać — osoba logująca się w ten sposób musi mieć czym wejść inaczej
      - Aplikacje czytające kamerą kody kreskowe albo dokumenty stracą tę możliwość
      - Mikrofon, dźwięk, sesje zdalne i udostępnianie ekranu działają bez zmian
    en:
      - Video calls held from this machine stop working, with no exception for individual applications
      - Signing in by face recognition stops working - whoever signs in that way must have another way in
      - Applications reading barcodes or documents with the camera lose that ability
      - The microphone, audio, remote sessions and screen sharing work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie kamera służy do logowania, do rozmów wideo albo do odczytu dokumentów przez aplikację
    en:
      - On this machine the camera serves for signing in, for video calls, or for an application to read documents
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
      $name = 'AllowCamera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    $name = 'AllowCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A camera shows not only a face but what is behind it: a whiteboard, the
    # next desk's screen, a sheet on the table. This is a setting of the system,
    # so it holds regardless of what an application claims. Check first whether
    # anybody signs in by face recognition - they must have another way in.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCamera' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-camera

notes:
  pl: |
    Kamera nie pokazuje tylko twarzy osoby przy maszynie. Pokazuje tablicę,
    ekran sąsiedniego stanowiska, kartkę na biurku, wchodzących
    i wychodzących. Materiał, którego nikt świadomie nie udostępnia, bywa
    w kadrze przypadkiem.

    Ustawienia w aplikacjach są deklaracją aplikacji; ten wpis jest
    ustawieniem systemu i obowiązuje niezależnie od tego, co aplikacja
    o sobie twierdzi.

    Na serwerze kamery zwykle nie ma, ale sesja zdalna potrafi przekierować
    kamerę osoby, która się połączyła — to przypadek najczęstszy i najmniej
    oczywisty. Przed zastosowaniem sprawdź, czy nie działa tu logowanie
    rozpoznaniem twarzy.
  en: |
    A camera does not show only the face of the person at the machine. It
    shows a whiteboard, the next desk's screen, a sheet on the table, people
    coming and going. Material nobody deliberately shares is sometimes in the
    frame by accident.

    Settings within applications are an application's declaration; this entry
    is a setting of the system and holds regardless of what an application
    claims about itself.

    On a server there is usually no camera, but a remote session can redirect
    the camera of whoever connected - the commonest case and the least
    obvious. Before applying, check whether signing in by face recognition
    works here.
