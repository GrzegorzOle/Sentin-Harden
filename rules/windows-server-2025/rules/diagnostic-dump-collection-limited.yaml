id: win2025-diagnostic-dump-collection-limited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Zbieranie zrzutów pamięci ograniczone
    en: Collection of memory dumps limited
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza zbieranie zrzutów pamięci wysyłanych wraz z danymi
    diagnostycznymi do zrzutów najmniejszych — takich, które opisują miejsce
    awarii, a nie zawartość pamięci procesu.

    Kategoria wysoka i to jest w całym tym wątku punkt, przy którym nie
    zamierzam łagodzić. Pozostałe reguły o danych diagnostycznych mówią
    o opisie maszyny. Ta mówi o zawartości jej pamięci, a to jest zupełnie
    inna rzecz.

    W pamięci procesu w chwili awarii leży to, czym ten proces się właśnie
    zajmował. Na serwerze bazodanowym są to rekordy, które akurat czytał.
    Na serwerze uwierzytelniania — bilety i skróty haseł. Na serwerze
    aplikacyjnym — treść żądań wraz z żetonami sesji i kluczami, którymi
    aplikacja podpisuje się do innych usług. Pełny zrzut pamięci serwera
    to najgorszy możliwy plik, jaki może opuścić organizację, i jest to
    prawda niezależnie od tego, dokąd ten plik idzie.

    Chcę też powiedzieć, że nie jest to zarzut wobec producenta. Zrzuty idą
    szyfrowanym połączeniem i służą naprawianiu usterek. Rzecz w tym, że
    poświadczenia, które wyszły poza organizację, przestają być tajemnicą
    organizacji, a tego nie da się cofnąć zmianą ustawienia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szansę, że
    poświadczenia z tego serwera istnieją w postaci pliku gdzieś poza
    zasięgiem jego zabezpieczeń — i że nikt nie będzie wiedział, kiedy
    dokładnie wyszły.
  en: |
    The item limits the memory dumps sent along with diagnostic data to the
    smallest ones - those that describe where the fault happened rather than
    the contents of the process's memory.

    The category is high, and in this whole vein it is the item where I do
    not intend to soften anything. The other diagnostic-data rules speak of
    a description of the machine. This one speaks of the contents of its
    memory, and that is an entirely different thing.

    A process's memory at the moment of a fault holds whatever that process
    was busy with. On a database server that is the records it was reading.
    On an authentication server - tickets and password hashes. On an
    application server - the content of requests together with session
    tokens and the keys the application signs itself to other services with.
    A full memory dump of a server is the worst possible file that can leave
    an organisation, and that is true regardless of where the file goes.

    I also want to say that this is no charge against the maker. Dumps
    travel over an encrypted connection and serve to repair faults. The
    point is that credentials which have left the organisation stop being
    the organisation's secret, and that cannot be undone by changing a
    setting.

    What an attacker gains while the item goes unmet: the chance that
    credentials from this server exist as a file somewhere beyond the reach
    of its protections - and that nobody will know exactly when they left.

disruption_description:
  pl: |
    Klasę stawiam na „wymaga sprawdzenia", chociaż kusi mnie, żeby nazwać
    tę zmianę niegroźną. Powstrzymuję się i chcę powiedzieć dlaczego, bo
    powód nie jest oczywisty.

    Ograniczenie dotyczy zrzutów wysyłanych producentowi. Zrzuty zapisywane
    lokalnie na tej maszynie — te, po które sięga administrator badający
    awarię — to osobny mechanizm i ta reguła ich nie dotyka. Gdyby dotykała,
    klasa byłaby wyższa, bo odebranie narzędzia do badania awarii serwerowi
    produkcyjnemu jest poważną stratą.

    Sprawdzić trzeba jedno: czy w tej organizacji zgłaszanie błędów
    producentowi jest częścią rzeczywistej procedury obsługi awarii.
    Tam, gdzie umowa wsparcia obejmuje analizę zrzutów przez producenta,
    ta zmiana wydłuży pierwszy obieg — zamiast danych wysłanych samoczynnie
    wsparcie poprosi o zrzut przekazany osobno. To jest różnica
    w godzinach, nie w dniach, i wolno ją ponieść świadomie.

    Warto przy tym wiedzieć, że przekazanie zrzutu ręcznie nadal jest
    możliwe. Ta reguła nie odbiera możliwości — ona odbiera samoczynność.
    Decyzja o wysłaniu pamięci serwera poza organizację staje się decyzją,
    którą ktoś podejmuje, zamiast zdarzeniem, które zachodzi.

    Zmiana nie wymaga przerwy, jest niewidoczna w codziennej pracy i cofa
    się natychmiast.
  en: |
    I put the class at "needs review", although I am tempted to call this
    change harmless. I hold back, and I want to say why, because the reason
    is not obvious.

    The limit concerns dumps sent to the maker. Dumps written locally on
    this machine - the ones an administrator investigating a fault reaches
    for - are a separate mechanism, and this rule does not touch them. If it
    did, the class would be higher, because taking the tool for
    investigating faults away from a production server is a serious loss.

    One thing has to be checked: whether reporting errors to the maker is
    part of the actual failure-handling procedure in this organisation.
    Where a support contract covers analysis of dumps by the maker, this
    change lengthens the first round - instead of data sent by itself,
    support will ask for a dump passed separately. That is a difference of
    hours, not days, and it may be borne knowingly.

    It is worth knowing alongside this that passing a dump by hand remains
    possible. This rule does not take away the ability - it takes away the
    automatism. The decision to send a server's memory out of the
    organisation becomes a decision somebody takes rather than an event that
    occurs.

    The change needs no outage, is invisible in daily work, and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zrzuty pamięci wysyłane producentem wraz z danymi diagnostycznymi zostają ograniczone do najmniejszych
      - Zrzuty zapisywane lokalnie, po które sięga administrator badający awarię, to osobny mechanizm i pozostają nietknięte
      - Gdy umowa wsparcia obejmuje analizę zrzutów, wsparcie poprosi o zrzut przekazany osobno i pierwszy obieg się wydłuży
      - Przekazanie zrzutu ręcznie nadal jest możliwe — znika samoczynność, nie możliwość
    en:
      - The memory dumps sent to the maker with diagnostic data are limited to the smallest ones
      - Dumps written locally, which an administrator investigating a fault reaches for, are a separate mechanism and stay untouched
      - Where a support contract covers dump analysis, support will ask for a dump passed separately and the first round lengthens
      - Passing a dump by hand remains possible - what goes is the automatism, not the ability
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zgłaszanie błędów producentowi wraz ze zrzutami jest częścią rzeczywistej procedury obsługi awarii w tej organizacji
    en:
      - Reporting errors to the maker together with dumps is part of the actual failure-handling procedure in this organisation
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LimitDumpCollection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $current = (Get-ItemProperty -Path $path -Name 'LimitDumpCollection' -ErrorAction SilentlyContinue).'LimitDumpCollection'
    [pscustomobject]@{
      path        = $path
      name        = 'LimitDumpCollection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This concerns dumps sent to the maker, not the ones written locally for an
    # administrator investigating a fault - those are a separate mechanism and
    # stay in place. Passing a dump by hand remains possible; what goes is the
    # automatism.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitDumpCollection' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Punkt, przy którym w całym tym wątku nie łagodzę. Pozostałe reguły
    o danych diagnostycznych mówią o opisie maszyny — ta mówi o zawartości
    jej pamięci.

    Na serwerze bazodanowym w pamięci leżą rekordy akurat czytane, na
    serwerze uwierzytelniania bilety i skróty haseł, na aplikacyjnym treść
    żądań z żetonami sesji. Poświadczenia, które wyszły poza organizację,
    przestają być tajemnicą organizacji, a tego nie cofa zmiana ustawienia.

    Klasy nie obniżam do „bez uciążliwości" mimo pokusy: tam, gdzie umowa
    wsparcia obejmuje analizę zrzutów przez producenta, pierwszy obieg się
    wydłuży. Zrzuty zapisywane lokalnie to osobny mechanizm i ta reguła ich
    nie dotyka.
  en: |
    The item in this whole vein where I do not soften anything. The other
    diagnostic-data rules speak of a description of the machine - this one
    speaks of the contents of its memory.

    On a database server that memory holds the records being read, on an
    authentication server tickets and password hashes, on an application
    server the content of requests with session tokens. Credentials that
    have left the organisation stop being the organisation's secret, and a
    setting change does not undo that.

    I do not drop the class to "no disruption" despite the temptation: where
    a support contract covers dump analysis by the maker, the first round
    lengthens. Dumps written locally are a separate mechanism and this rule
    does not touch them.
