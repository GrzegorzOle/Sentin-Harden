id: win11-rdp-port-redirector-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa przekierowania portów w sesji zdalnej wyłączona
    en: The port redirector service for remote sessions disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa wykonuje po stronie maszyny przyjmującej połączenie to, co
    ustawienia przekierowań opisują: zestawia dyski, drukarki, porty
    i urządzenia maszyny łączącej się tak, by były widoczne w sesji.

    Reguły ograniczające poszczególne przekierowania mówią, czego wolno
    używać. Ta mówi, że mechanizmu ma nie być wcale. Różnica jest praktyczna:
    ustawienie przekierowania to wpis w rejestrze, który da się zmienić jednym
    poleceniem i który wraca przy odtworzeniu zasad z innej maszyny. Wyłączona
    usługa wymaga zmiany innego rodzaju i nie zmienia się przy odświeżeniu
    zasad.

    Usługa pracuje z uprawnieniami systemowymi i przetwarza dane pochodzące
    z maszyny łączącej się — opisy urządzeń, nazwy, zawartość przekierowanych
    zasobów. Jest to więc kod uprzywilejowany karmiony danymi ze strony, nad
    którą maszyna nie ma kontroli. Zdjęcie go z drogi jest sensowne samo
    w sobie, niezależnie od ustawień przekierowań.

    Na maszynie, na której wyłączono pulpit zdalny, usługa nie ma czego
    obsługiwać i jej wyłączenie jest domknięciem tamtej decyzji.
  en: |
    The service does, on the side of the machine taking the connection, what the
    redirection settings describe: it attaches the connecting machine's drives,
    printers, ports and devices so that they appear in the session.

    The rules limiting particular redirections say what may be used. This one says the
    mechanism should not be there at all. The difference is a practical one: a
    redirection setting is a registry entry that can be changed with one command and
    that comes back when policies are restored from another machine. A disabled service
    takes a change of another kind and does not change when policies are refreshed.

    The service works with system rights and handles data coming from the connecting
    machine - descriptions of devices, names, the contents of redirected resources. So
    it is privileged code fed with data from a side the machine has no control over.
    Taking it out of the way makes sense in itself, whatever the redirection settings
    say.

    On a machine where Remote Desktop has been disabled, the service has nothing to
    handle and disabling it closes that decision.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna przyjmuje połączenia pulpitem zdalnym
    i czy w tych sesjach korzysta się z czegokolwiek ze strony łączącej się.

    Na maszynie, na której pulpit zdalny jest wyłączony, zmiana nie robi nic.
    Jest to wtedy domknięcie wcześniejszej decyzji, bez własnych skutków.

    Tam, gdzie połączenia są przyjmowane, skutek jest zbiorczy: przestają
    działać wszystkie przekierowania naraz — dyski, drukarki, schowek, porty,
    urządzenia. Reguły ograniczające pojedyncze przekierowania przestają mieć
    znaczenie, bo nie ma czego ograniczać.

    Najczęściej odczuwalne będzie zniknięcie drukarki maszyny łączącej się.
    Drukowanie z sesji zdalnej na drukarkę stojącą obok użytkownika jest
    zastosowaniem tak powszechnym, że bywa uznawane za część samej sesji,
    a nie za przekierowanie.

    Warto rozważyć kolejność. Jeżeli celem jest ograniczenie przekierowań,
    a nie ich zniesienie, właściwym narzędziem są reguły pojedyncze, a nie ta.
    Ta jest właściwa wtedy, gdy przekierowań ma nie być w ogóle.

    Zmiana wymaga zatrzymania usługi; sesje otwarte tracą przekierowane zasoby.
  en: |
    What needs checking is whether the machine takes Remote Desktop connections and
    whether anything from the connecting side is used in those sessions.

    On a machine where Remote Desktop is off, the change does nothing. It is then the
    closing of an earlier decision, with no effects of its own.

    Where connections are taken, the effect is wholesale: every redirection stops
    working at once - drives, printers, the clipboard, ports, devices. The rules
    limiting single redirections stop mattering, since there is nothing to limit.

    What will be felt most often is the disappearance of the connecting machine's
    printer. Printing from a remote session to a printer standing beside the user is a
    use so common that it is sometimes taken for part of the session itself rather than
    a redirection.

    The order is worth weighing. If the aim is to limit redirections rather than abolish
    them, the right tool is the single rules, not this one. This one is right where
    there are to be no redirections at all.

    The change takes stopping the service; open sessions lose their redirected
    resources.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Wszystkie przekierowania w sesji zdalnej przestają działać naraz
      - Drukowanie z sesji zdalnej na drukarkę maszyny łączącej się przestaje być możliwe
      - Sesje otwarte w chwili zmiany tracą przekierowane zasoby
      - Na maszynie bez pulpitu zdalnego nie zmienia się nic
    en:
      - Every redirection in a remote session stops working at once
      - Printing from a remote session to the connecting machine's printer stops being possible
      - Sessions open at the moment of the change lose their redirected resources
      - On a machine with no Remote Desktop nothing changes at all
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Drukowanie z sesji zdalnej na drukarkę przy użytkowniku jest ustalonym tokiem pracy
      - Przekierowania mają zostać ograniczone, a nie zniesione, i regułami pojedynczymi
    en:
      - Printing from a remote session to a printer beside the user is the established way of working
      - Redirections are to be limited rather than abolished, and by the single rules
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'UmRdpService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'UmRdpService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'UmRdpService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Reguła domyka trójkę usług pulpitu zdalnego i razem z nimi należy czytać
    jej wynik. Nie zastępuje reguł ograniczających pojedyncze przekierowania
    i ich nie unieważnia — tamte pozostają potrzebne na maszynie, na której
    usługa zostanie kiedykolwiek włączona z powrotem.

    Nazwa usługi w systemie nie wspomina o przekierowaniu i nie przypomina
    nazw pozostałych dwóch usług pulpitu zdalnego. Jest to najczęstsza
    przyczyna pominięcia jej przy przeglądzie ręcznym.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili. Usługa uruchamiana na żądanie bywa zatrzymana i mimo to
    niezgodna.
  en: |
    The rule closes the trio of Remote Desktop services and its result should be read
    together with theirs. It does not stand in for the rules limiting single
    redirections and does not void them - those stay needed on a machine where the
    service is ever switched back on.

    The service's name in the system mentions no redirection and does not resemble the
    names of the other two Remote Desktop services. That is the commonest reason for
    passing it over in a review by hand.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment. A service that starts on demand is sometimes stopped and
    deviating all the same.
