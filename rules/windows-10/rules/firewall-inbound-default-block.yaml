id: win10-firewall-inbound-default-block

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security
  title:
    pl: Domyślne blokowanie połączeń przychodzących we wszystkich profilach
    en: The blocking of inbound joinings by default in all profiles
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że zapora we wszystkich trzech profilach odrzuca
    połączenia przychodzące, dla których nie ma reguły zezwalającej.

    Jest to wybór między dwiema postawami. Pierwsza mówi: przepuszczaj
    wszystko poza tym, co wyraźnie zabroniono. Druga mówi: blokuj
    wszystko poza tym, na co wyraźnie zezwolono. Punkt wymaga drugiej.

    Różnica ujawnia się przy każdej rzeczy, o której nikt nie pomyślał.
    Przy postawie pierwszej nowa usługa, która zaczęła nasłuchiwać —
    bo ktoś zainstalował program, bo aktualizacja włączyła składnik, bo
    napastnik uruchomił własny nasłuch — jest od razu dostępna z sieci.
    Przy drugiej nie jest, dopóki ktoś świadomie jej nie otworzy.

    Wartość polega więc na tym, co dzieje się bez niczyjej decyzji.
    Zapora blokująca domyślnie zamyka drogi, o których nikt nie wie,
    a to jest jedyna postawa dająca się utrzymać na maszynie, która żyje
    latami i zmienia oprogramowanie.

    Odnotowuję, że reguły zezwalające działają tak samo w obu ustawieniach.
    Zmiana nie zamyka niczego, co zostało otwarte świadomie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    każdej usługi, która zacznie nasłuchiwać, bez potrzeby otwierania jej.
  en: |
    The setting brings it about that the firewall, in all three profiles, casts aside inbound joinings for which
    no rule of leave stands.

    It is a choice between two stands. The first says: let everything through but what is plainly forbidden. The
    second says: block everything but what is plainly allowed. The item calls for the second.

    The difference shows at every thing nobody thought of. At the first stand a new service that has begun to
    listen - because somebody installed a program, because the servicing turned a part on, because an attacker
    started a listening of their own - stands open from the network at once. At the second it does not, until
    somebody knowingly opens it.

    The worth lies therefore in what happens without anybody's decision. A firewall blocking by default shuts the
    roads nobody knows of, and that is the one stand that may be held upon a machine that lives for years and
    changes its software.

    I set down that rules of leave work the same at both settings. The change shuts nothing that was opened
    knowingly.

    What an attacker gains while the item goes unmet: a way to every service that begins to listen, with no need
    of opening it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, co na
    maszynie nasłuchuje bez własnej reguły zezwalającej.

    Objaw jest tu inny niż przy włączaniu zapory i warto to rozróżnić.
    Zapora już działa, więc reguły blokujące i zezwalające obowiązują.
    Zmienia się wyłącznie los ruchu, którego żadna reguła nie opisuje —
    i ten ruch przestaje przechodzić.

    Miejscem najczęstszym są programy dodające regułę przy pierwszym
    uruchomieniu, w odpowiedzi na pytanie zadane użytkownikowi. Jeżeli
    pytanie zostało kiedyś zamknięte bez odpowiedzi, reguła nie powstała,
    a ruch przechodził dotąd wyłącznie dzięki domyślnemu przepuszczaniu.

    Miejscem drugim są usługi uruchamiane na portach wybieranych losowo:
    część mechanizmów zdalnych i narzędzi pomiarowych. Reguła portowa dla
    nich nie istnieje, bo port nie jest znany z góry.

    Sprawdzenie polega na wypisaniu nasłuchujących portów i porównaniu ich
    z regułami zapory przed zmianą.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: połączeń wychodzących, ruchu opisanego regułami
    zezwalającymi, pracy lokalnej, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is what listens upon the machine without a rule of
    leave of its own.

    The mark of it is here other than at the turning on of the firewall, and that is worth parting. The firewall
    already works, so the rules of blocking and of leave hold good. What changes is solely the fate of the traffic
    no rule sets out - and that traffic ceases to pass.

    The commonest place is programs that add a rule at their first running, in answer to a question put to the
    user. If the question was once shut without an answer, the rule never came about, and the traffic passed
    hitherto solely by the letting through by default.

    The second place is services run upon ports chosen by lot: some mechanisms from afar and tools of measuring. A
    rule of ports for them does not stand, the port not being known beforehand.

    The review comes down to a writing out of the listening ports and a setting of them beside the firewall's
    rules before the change.

    The consequence shows at once, with no restart.

    What this does not break: outbound joinings, traffic set out by rules of leave, work upon the machine itself,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - remote-management
  what_breaks:
    pl:
      - Programy, dla których reguła nigdy nie powstała, przestaną przyjmować połączenia z sieci
      - Dotyczy to zwłaszcza programów pytających o regułę przy pierwszym uruchomieniu, gdy pytanie zamknięto bez odpowiedzi
      - Usługi nasłuchujące na portach wybieranych losowo stracą dostępność, bo reguła portowa dla nich nie istnieje
      - Ruch opisany istniejącymi regułami zezwalającymi przechodzi dalej bez zmian
      - Połączenia wychodzące, praca lokalna, logowanie i drukowanie pozostają bez zmian
    en:
      - Programs for which a rule never came about will cease to take joinings from the network
      - That holds above all of programs asking for a rule at their first running where the question was shut without an answer
      - Services listening upon ports chosen by lot will lose their standing open, a rule of ports for them not existing
      - Traffic set out by the standing rules of leave passes on unchanged
      - Outbound joinings, work upon the machine itself, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracują usługi nasłuchujące na portach wybieranych losowo i nie da się dla nich napisać reguły
      - Program używany w codziennej pracy przyjmuje połączenia bez własnej reguły zapory
    en:
      - Upon the machine work services listening upon ports chosen by lot and no rule may be written for them
      - A program used in daily work takes joinings without a firewall rule of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The three profiles are weighed together. Naming the ones that fall out
        # matters, a machine set in two of three being a different case from one
        # set in none.
        $wrong = @($profiles | Where-Object { $_.DefaultInboundAction -ne 'Block' })
        if ($wrong.Count -eq 0) { 'ALL_BLOCK' } else { 'OPEN_IN_' + ($wrong.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_BLOCK'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, DefaultInboundAction |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -DefaultInboundAction Block

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -DefaultInboundAction $p.DefaultInboundAction
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest drugim najważniejszym punktem bloku zapory, po samym jej
    włączeniu, i warto, żeby aplikacja pokazała je razem. Włączona zapora
    z domyślnym przepuszczaniem ruchu przychodzącego daje znacznie mniej,
    niż wygląda na to z listy zgodności.

    Argument wart postawienia wprost dotyczy rzeczy nieprzewidzianych.
    Reguła blokująca chroni przed tym, co ktoś wymienił; postawa blokująca
    domyślnie chroni przed tym, czego nikt nie wymienił — a to jest
    zbiór, który rośnie sam przez całe życie maszyny.

    Odnotowuję rozróżnienie objawu wobec punktu o włączeniu zapory,
    bo łatwo je pomylić. Tam przestaje działać wszystko, co nie ma reguły
    i co dotąd działało, bo zapora stała wyłączona. Tutaj zapora już
    działała — przestaje przechodzić wyłącznie ruch, którego żadna reguła
    nie opisuje.
  en: |
    The rule is the second weightiest item of the block of the firewall, after the turning of it on, and it is
    well that the application show them together. A firewall turned on with inbound traffic let through by default
    gives far less than it looks to from a roll of compliance.

    The argument worth putting outright touches things unforeseen. A rule of blocking guards against what somebody
    named; the stand of blocking by default guards against what nobody named - and that is a set which grows of
    itself through the whole life of the machine.

    I set down the parting of the mark of it from the item about the turning on of the firewall, those two being
    easily confused. There everything ceases to work that has no rule and worked hitherto because the firewall
    stood off. Here the firewall already worked - only the traffic no rule sets out ceases to pass.
