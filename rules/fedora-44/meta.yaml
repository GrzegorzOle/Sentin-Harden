id: fedora-44
name:
  pl: Fedora 44
  en: Fedora 44
family: linux
shell: bash
profile: workstation

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0

detection:
  command: |
    . /etc/os-release
    printf '%s|%s\n' "$ID" "$VERSION_ID"
  match: '^fedora\|44$'

notes:
  pl: |
    Najdalej odbiegający od pozostałych celów linuksowych:
      - kontrola dostępu to SELinux, nie AppArmor,
      - menedżer pakietów to dnf, nie apt,
      - zapora to firewalld,
      - wydanie ma krótki cykl życia (około 13 miesięcy wsparcia).

    Krótki cykl ma praktyczną konsekwencję: wersja benchmarku dezaktualizuje
    się tu szybciej niż przy systemach LTS, więc przegląd reguł i zapisanych
    wyjątków wypada częściej.

    CIS nie publikuje aktualnego benchmarku dla Fedory. Numery i tytuły
    punktów w tej paczce odnoszą się do benchmarku dla RHEL 9, z którego
    rodziny Fedora pochodzi, żeby wynik dało się zestawić z tabelą CIS.
    Polecenia, ocena ryzyka i opisy są pisane pod Fedorę 44, a nie pod RHEL:
    tam, gdzie oba systemy się różnią, reguła mówi o tym wprost.
  en: |
    The furthest from the other Linux targets:
      - access control is SELinux, not AppArmor,
      - package manager is dnf, not apt,
      - firewall is firewalld,
      - the release has a short life cycle (around 13 months of support).

    The short cycle has a practical consequence: the benchmark version goes
    stale faster here than on LTS systems, so rule reviews and re-examination
    of stored risk acceptances come around more often.

    CIS does not publish a current benchmark for Fedora. Item numbers and
    titles in this pack refer to the RHEL 9 benchmark, the family Fedora
    comes from, so that results can be matched against the CIS table.
    Commands, risk ratings and descriptions are written for Fedora 44, not for
    RHEL: where the two systems differ, the rule says so.
