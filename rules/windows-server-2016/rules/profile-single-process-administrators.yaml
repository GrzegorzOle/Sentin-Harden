id: win2016-profile-single-process-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Profilowanie pojedynczego procesu tylko dla administratorów
    en: Profiling a single process restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do profilowania pojedynczego procesu do grupy
    administratorów lokalnych.

    Profilowanie oznacza tutaj pobieranie szczegółowych danych o pracy cudzego
    procesu: zużycia procesora, zajętości pamięci, liczników wydajności
    przypisanych do konkretnego programu. Narzędzie do analizy wydajności
    korzysta z tego uprawnienia, żeby zajrzeć w proces, którego nie uruchomiło.

    Uprawnienie nie daje wglądu w zawartość pamięci i nie pozwala niczego
    zmienić. Daje natomiast obraz tego, co na maszynie pracuje i jak intensywnie
    — a to bywa wystarczającą wskazówką. Zmiany zużycia procesora potrafią
    zdradzić, kiedy trwa zadanie szyfrujące, kiedy działa mechanizm
    zabezpieczający i którym procesem warto się zająć.

    Kategoria średnia. Samo uprawnienie nie blokuje ataku i nie otwiera żadnej
    drogi; ogranicza pole rozpoznania i zwiększa wykrywalność, bo narzędzia
    profilujące uruchamiane spoza grupy administratorów stają się widoczne jako
    odmowy.

    Na serwerze 2016 domyślnie uprawnienie ma grupa administratorów, a przy
    zainstalowanych narzędziach diagnostycznych bywa nadane szerzej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozpoznanie tego,
    co na maszynie pracuje i kiedy, bez uruchamiania czegokolwiek własnego.
  en: |
    The item limits the right to profile a single process to the local
    administrators group.

    Profiling here means gathering detailed data on somebody else's process at work:
    processor use, memory held, performance counters tied to a particular program. A
    tool for performance analysis uses this right to look into a process it did not
    start.

    The right gives no sight of memory contents and allows nothing to be changed. It
    does give a picture of what runs on the machine and how hard - and that is
    sometimes hint enough. Shifts in processor use can betray when an encrypting job
    is under way, when a protective mechanism is at work, and which process is worth
    attending to.

    The category is medium. The right by itself blocks no attack and opens no road;
    it narrows the field of reconnaissance and raises detectability, because
    profiling tools started from outside the administrators group become visible as
    refusals.

    On Server 2016 the right belongs by default to the administrators group, and
    with diagnostic tools installed it is sometimes granted more widely.

    What an attacker gains while the item goes unmet: reconnaissance of what runs on
    the machine and when, without starting anything of their own.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zwykła praca, w tym uruchamianie programów
    i oglądanie ich we własnym menedżerze zadań, tego uprawnienia nie wymaga.

    Użytkownik i tak widzi własne procesy — uprawnienie dotyczy zaglądania
    w cudze. Nie zmienia się zatem nic w codziennym korzystaniu z maszyny,
    również w sesji zdalnej.

    Tam, gdzie na liście jest ktoś poza administratorami, wpis pochodzi zwykle
    od narzędzia diagnostycznego zainstalowanego przy okazji rozwiązywania
    problemu z wydajnością. Jeżeli takie narzędzie ma nadal działać na koncie
    usługowym, zmianę trzeba odłożyć — ale to przypadek rzadki i dający się
    rozpoznać z listy zainstalowanego oprogramowania.

    Czego to nie psuje: menedżera zadań, monitora zasobów uruchamianego przez
    administratora, liczników wydajności zbieranych przez usługi systemowe ani
    raportowania zużycia zasobów przez własne procesy użytkownika.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Ordinary work, including starting programs and
    watching them in one's own task manager, does not call for this right.

    A user sees their own processes anyway - the right concerns looking into
    somebody else's. Nothing therefore changes in the daily use of the machine,
    including in a remote session.

    Where somebody outside the administrators is on the list, the entry usually
    comes from a diagnostic tool installed while a performance problem was being
    worked out. If such a tool is still to run under a service account, the change
    has to wait - but that is a rare case and one recognisable from the list of
    installed software.

    What this does not break: the task manager, the resource monitor started by an
    administrator, performance counters gathered by the system's services, or the
    reporting of resource use by a user's own processes.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
    - remote-desktop
  what_breaks:
    pl:
      - Narzędzie do analizy wydajności działające na koncie usługowym traci dostęp do liczników cudzych procesów
      - Monitorowanie wydajności zbierane przez agenta spoza grupy administratorów zwraca puste albo niekompletne dane
      - Menedżer zadań i podgląd własnych procesów użytkownika działają bez zmian
      - Liczniki wydajności zbierane przez usługi systemowe pozostają nietknięte
    en:
      - A performance analysis tool running under a service account loses access to other processes' counters
      - Performance monitoring gathered by an agent outside the administrators group returns empty or incomplete data
      - The task manager and a user's view of their own processes work unchanged
      - Performance counters gathered by the system's services stay untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa agent monitorujący wydajność na koncie spoza grupy administratorów i nie da się go przenieść na konto usługi
    en:
      - An agent monitoring performance under an account outside the administrators group runs on the machine and cannot be moved onto a service account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeProfileSingleProcessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeProfileSingleProcessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeProfileSingleProcessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Profiling reveals what runs on the machine and how hard, which is enough for
    # reconnaissance. Own processes stay visible to their owner regardless.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeProfileSingleProcessPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeProfileSingleProcessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/profile-single-process

notes:
  pl: |
    Punkt bywa mylony z profilowaniem wydajności całego systemu, które jest
    osobnym uprawnieniem i osobną regułą. Różnica jest istotna: tamto dotyczy
    obrazu całej maszyny, to — pojedynczego procesu wskazanego z nazwy.

    Wpisy spoza grupy administratorów warto zestawić z listą zainstalowanego
    oprogramowania diagnostycznego. Zwykle to jest wyjaśnienie, a nie ustalenie.

    Reguła nie ogranicza zbierania liczników przez usługi systemowe, bo te
    działają na kontach, które tego uprawnienia nie potrzebują.
  en: |
    The item gets confused with profiling the whole system's performance, which is a
    separate right and a separate rule. The difference matters: that one concerns a
    picture of the whole machine, this one a single process named outright.

    Entries outside the administrators group are worth setting beside the list of
    installed diagnostic software. That is usually the explanation, not the finding.

    The rule does not limit the gathering of counters by the system's services,
    because those run under accounts that do not need this right.
