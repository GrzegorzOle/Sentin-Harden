id: win2016-microsoft-account-authentication-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft account
  title:
    pl: Uwierzytelnianie kontem konsumenckim zablokowane
    en: Authentication with a consumer account blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania uwierzytelniania kontem z usługi konsumenckiej
    producenta systemu — niezależnie od tego, czy chodzi o logowanie na
    maszynę, czy o dostęp aplikacji do zasobu.

    Konto takie jest tożsamością spoza organizacji i to jest cała rzecz.
    Zakłada je osoba prywatna, hasło do niego ustala sama, zmienia je
    kiedy chce i może je odzyskać przez usługę, nad którą organizacja nie
    ma żadnej kontroli. Nikt tutaj nie może takiego konta zablokować,
    wygasić ani sprawdzić, kto się nim posługuje.

    Na serwerze ma to skutki, których na stanowisku roboczym nie widać.
    Konto konsumenckie użyte do uwierzytelnienia staje się tożsamością
    w systemie — z profilem, z dostępem do zasobów nadanym temu profilowi,
    z zapisem w dzienniku, który wskazuje adres poczty zamiast pracownika.

    Rzecz cięższa dotyczy odejścia. Konto organizacji wyłącza się przy
    pożegnaniu i dostęp znika. Konto konsumenckie zostaje — bo nie należy
    do organizacji i nikt tutaj go nie wyłączy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    posługiwania się na tej maszynie tożsamością, której nikt tutaj nie
    zakłada, nie odbiera i nie kontroluje.
  en: |
    The setting forbids authentication with an account from the system maker's
    consumer service - whether it is a matter of signing in to the machine or of an
    application reaching a resource.

    Such an account is an identity from outside the organisation, and that is the whole
    matter. A private person makes it, sets its password themselves, changes it when
    they like and can recover it through a service the organisation has no control
    over. Nobody here can block, expire or check who uses such an account.

    On a server that has consequences not seen at a workstation. A consumer account
    used for authentication becomes an identity in the system - with a profile, with
    access to resources granted to that profile, with an entry in the log naming an
    email address instead of an employee.

    The heavier matter concerns departure. An organisation's account is switched off at
    a parting and access vanishes. A consumer account stays - not belonging to the
    organisation, and nobody here will switch it off.

    What an attacker gains while the item goes unmet: the chance to use on this machine
    an identity nobody here makes, takes away or controls.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo skutek może dotknąć sesji
    i aplikacji już pracujących.

    Rzecz do ustalenia jest jedna: czy cokolwiek na tej maszynie posługuje
    się kontem konsumenckim. Na serwerze zdarza się to rzadko, ale zdarza
    się w dwóch postaciach i obie warto wymienić.

    Pierwsza to konto założone przy konfigurowaniu maszyny — ktoś zalogował
    się swoim prywatnym kontem, żeby coś pobrać albo aktywować, i konto to
    zostało. Po wdrożeniu przestanie się uwierzytelniać, a profil, dostęp
    do zasobów i zadania z nim związane przestaną działać.

    Druga to aplikacje sięgające do usług producenta, które uwierzytelniają
    się kontem konsumenckim zamiast kontem usługi. Objawem jest odmowa
    dostępu do usługi, a nie odmowa logowania, więc powiązanie z tą regułą
    bywa dalekie.

    Ustawienie wymaga wylogowania, żeby zaczęło obowiązywać dla sesji już
    otwartych. Sesja pracująca pod kontem konsumenckim w chwili wdrożenia
    będzie pracować dalej, aż do wylogowania — i warto to wiedzieć, bo
    wygląda to, jakby reguła nie zadziałała.

    Czego to nie psuje: logowania kontami domenowymi i lokalnymi, usług,
    sieci, dostępu do plików.
  en: |
    The class is "needs a planned rollout", the consequence being able to touch
    sessions and applications already working.

    There is one thing to establish: whether anything on this machine uses a consumer
    account. On a server that happens rarely, but it happens in two forms and both are
    worth naming.

    The first is an account made while the machine was being set up - somebody signed
    in with their private account to fetch or activate something, and the account
    stayed. After the rollout it will stop authenticating, and the profile, the access
    to resources and the tasks tied to it will stop working.

    The second is applications reaching the maker's services which authenticate with a
    consumer account instead of a service account. The symptom is a refusal of access
    to the service rather than a refused sign-in, so the tie to this rule is at times a
    distant one.

    The setting calls for a sign-out to begin holding for sessions already open. A
    session working under a consumer account at the moment of the rollout will work on
    until it signs out - and that is worth knowing, since it looks as though the rule
    had not taken effect.

    What this does not break: signing in with domain and local accounts, services, the
    network, or access to files.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Konto konsumenckie założone przy konfigurowaniu maszyny przestanie się uwierzytelniać, a profil i dostęp do zasobów przestaną działać
      - Aplikacje sięgające do usług producenta kontem konsumenckim zgłoszą odmowę dostępu do usługi, a nie odmowę logowania
      - Sesja pracująca pod takim kontem w chwili wdrożenia pracuje dalej aż do wylogowania, więc wygląda to, jakby reguła nie zadziałała
      - Logowanie kontami domenowymi i lokalnymi, usługi i dostęp do plików pozostają bez zmian
    en:
      - A consumer account made while the machine was being set up will stop authenticating, and the profile and access to resources will stop working
      - Applications reaching the maker's services with a consumer account will report a refusal of access to the service rather than a refused sign-in
      - A session working under such an account at the moment of the rollout works on until it signs out, so it looks as though the rule had not taken effect
      - Signing in with domain and local accounts, services and access to files stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja uwierzytelniająca się kontem konsumenckim i nie przeniesiono jej jeszcze na konto usługi
      - Konfiguracja maszyny była wykonana z konta prywatnego i nie przeniesiono jeszcze związanych z nim ustawień
    en:
      - An application authenticating with a consumer account works on the machine and has not yet been moved to a service account
      - The machine was set up from a private account and the settings tied to it have not yet been moved
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
      $name = 'DisableUserAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    $name = 'DisableUserAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUserAuth' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-accounts

notes:
  pl: |
    Punkt otwiera blok o tym, kto może być tożsamością na tej maszynie
    i jakim sposobem wolno się przedstawić. Jest w nim najszerszy, bo
    dotyczy uwierzytelniania w ogóle, a nie jednego ekranu czy jednej
    metody.

    Tworzy parę z regułą o blokowaniu logowania kontem z usługi sieciowej
    i warto rozumieć, czym się różnią. Tamta zabrania zakładać i dodawać
    takie konta na maszynie. Ta zabrania im się uwierzytelniać, także
    wtedy, gdy już są. Wdrożenie tamtej bez tej zostawia konta wcześniej
    dodane przy pełnej sprawności.

    Opóźniony skutek dla sesji otwartych jest tu najważniejszą rzeczą do
    pokazania w podglądzie. Reguła, która działa dopiero po wylogowaniu,
    wygląda po wykonaniu na niedziałającą — i to jest dokładnie ten rodzaj
    nieporozumienia, przez który ktoś wykonuje ją drugi raz albo cofa.
  en: |
    The item opens the block about who may be an identity on this machine and by what
    means one may present oneself. It is the widest in it, concerning authentication at
    large rather than one screen or one method.

    It makes a pair with the rule blocking sign-in with an account from the online
    service, and it is worth grasping how they differ. That one forbids such accounts
    to be made and added on the machine. This one forbids them to authenticate, also
    where they are there already. Rolling out that one without this leaves accounts
    added earlier in full working order.

    The put-off consequence for open sessions is the most important thing to show in
    the preview here. A rule that takes effect only after a sign-out looks, once
    carried out, as though it did not work - and that is exactly the kind of
    misunderstanding through which somebody carries it out twice or undoes it.
