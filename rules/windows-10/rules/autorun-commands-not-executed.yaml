id: win10-autorun-commands-not-executed

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Polecenia z pliku startowego nośnika nigdy nie wykonywane
    en: Commands out of a carrier s file of starting never set going
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że system nigdy nie wykonuje polecenia zapisanego
    w pliku startowym podłączonego nośnika.

    Plik taki leży w głównym katalogu nośnika i mówi systemowi, co ma się
    stać po jego podłączeniu: który program uruchomić, jaką podać ikonę,
    jaki napis pokazać w oknie wyboru. Jest to mechanizm bardzo stary,
    pochodzący z czasów, gdy nośnikiem był krążek tłoczony fabrycznie.

    Założenie leżące u jego podstaw przestało obowiązywać. Zapisywalny
    nośnik podłączany do maszyny może nieść plik startowy dopisany przez
    kogokolwiek, a system traktuje go tak samo jak ten z krążka
    producenta.

    Punkt jest osobny od wyłączenia autoodtwarzania i to rozróżnienie jest
    tu najważniejsze. Autoodtwarzanie rozstrzyga, czy system sam coś
    uruchomi. Ten punkt sprawia, że polecenie z nośnika nie zostanie
    wykonane także wtedy, gdy użytkownik sam kliknie pozycję w oknie
    wyboru albo otworzy nośnik dwukrotnym kliknięciem.

    Odnotowuję, że ikony i opisy z pliku startowego przestają być brane
    pod uwagę. Właśnie na nich opiera się podszycie nośnika pod folder,
    napęd albo znany program.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykonanie
    polecenia przy podłączeniu albo otwarciu nośnika.
  en: |
    The setting brings it about that the system never sets going a command written in the file of starting of a
    carrier put in.

    Such a file lies in the carrier's head directory and tells the system what is to come to pass once it is put
    in: which program to set going, what mark to give, what wording to show in the window of choosing. It is a
    mechanism very old, out of the days when a carrier was a disc pressed at a works.

    The ground it rests upon holds no longer. A writable carrier put into a machine may bear a file of starting
    added by anybody, and the system holds it just as it holds the one off a maker's disc.

    The item stands apart from the switching off of the playing of itself, and that telling apart is here the
    weightiest thing. The playing of itself settles whether the system will set something going on its own. This
    item brings it about that a command off a carrier is not set going even where the user presses an entry in the
    window of choosing themselves, or opens the carrier with a double press.

    I set down that marks and wordings out of the file of starting cease to be taken into account. Upon those very
    things rests the getting up of a carrier as a folder, a drive or a known program.

    What an attacker gains while the item goes unmet: the setting going of a command at the putting in or the
    opening of a carrier.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm ten jest wycofany z użycia od lat i nie stoi na nim nic,
    co powstało niedawno. Nośniki instalacyjne producentów oprogramowania
    od dawna nie liczą na samoczynne uruchomienie.

    Odnotowuję jedyne miejsce warte uwagi: krążki instalacyjne starszych
    programów branżowych i urządzeń, które po włożeniu miały same otworzyć
    instalator. Po zmianie trzeba będzie wejść na nośnik i uruchomić plik
    ręcznie — czynność o jedno kliknięcie dłuższa, wykonalna przez
    każdego.

    Zastrzegam, że zmiana dotyczy także ikon i opisów. Nośnik, który dotąd
    pokazywał własną nazwę i ikonę producenta, pokaże nazwę zwykłą.
    Bywa to zgłaszane jako usterka, choć jest skutkiem zamierzonym.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: odczytu plików z nośnika, zapisu na nośnik,
    otwierania dokumentów, uruchamiania programów z dysku, logowania,
    drukowania.
  en: |
    The class is "no disruption".

    That mechanism has been drawn back from use for years and nothing lately made rests upon it. Carriers of
    laying on from makers of software have long ceased to count upon a setting going of itself.

    I set down the one place worth notice: discs of laying on of older programs of a trade and of devices, which
    upon being put in were to open the installer themselves. After the change one will have to go onto the carrier
    and set the file going by hand - a doing one press the longer, to be done by anybody.

    I set down that the change touches marks and wordings too. A carrier that hitherto showed a name and a mark of
    its maker will show an ordinary name. That is at times reported as a fault, though it is an upshot meant.

    The consequence shows at once, with no restart.

    What this does not break: the reading of files off a carrier, the writing onto a carrier, the opening of
    documents, the setting going of programs off the disk, logging on, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
    - scripting-and-automation
  what_breaks:
    pl:
      - Krążki instalacyjne starszych programów branżowych przestaną same otwierać instalator po włożeniu
      - Trzeba będzie wejść na nośnik i uruchomić plik ręcznie, co jest czynnością o jedno kliknięcie dłuższą
      - Nośnik pokazujący dotąd własną nazwę i ikonę producenta pokaże nazwę zwykłą
      - Bywa to zgłaszane jako usterka nośnika, choć jest skutkiem zamierzonym
      - Odczyt plików z nośnika, zapis na nośnik, otwieranie dokumentów, logowanie i drukowanie pozostają bez zmian
    en:
      - Discs of laying on of older programs of a trade will cease to open the installer themselves upon being put in
      - One will have to go onto the carrier and set the file going by hand, a doing one press the longer
      - A carrier that hitherto showed a name and a mark of its maker will show an ordinary name
      - That is at times reported as a fault of the carrier, though it is an upshot meant
      - The reading of files off a carrier, the writing onto a carrier, the opening of documents, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko obsługuje urządzenie, którego oprogramowanie instaluje się wyłącznie przez plik startowy nośnika
    en:
      - The station serves a device whose software is laid on solely through the carrier s file of starting
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'NoAutorun'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'NoAutorun'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutorun' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/shell/autoplay

notes:
  pl: |
    Reguła bywa mylona z wyłączeniem autoodtwarzania i warto, żeby
    aplikacja postawiła różnicę wprost. Autoodtwarzanie rozstrzyga, czy
    system sam coś uruchomi. Ten punkt odbiera wykonanie polecenia także
    wtedy, gdy użytkownik kliknie sam.

    Argument wart zachowania dotyczy ikon i opisów. Plik startowy podaje
    nie tylko polecenie, ale i to, jak nośnik ma wyglądać. Na tym opiera
    się podszycie pod folder albo napęd, czyli sposób, w który użytkownik
    bywa nakłoniony do kliknięcia. Punkt zdejmuje obie rzeczy naraz.

    Odnotowuję, że reguła jest zaliczona do klasy bez uciążliwości mimo
    wysokiego ryzyka. Nie jest to sprzeczność: mechanizm jest wycofany
    z użycia i nic dzisiejszego na nim nie stoi, a jednocześnie pozostaje
    gotową drogą wykonania kodu z nośnika.
  en: |
    The rule is at times taken for the switching off of the playing of itself, and it is well that the application
    put the difference outright. The playing of itself settles whether the system will set something going on its
    own. This item takes away the setting going of a command even where the user presses themselves.

    The argument worth keeping touches marks and wordings. The file of starting gives not only a command but also
    how the carrier is to look. Upon that rests the getting up as a folder or a drive, which is to say the manner
    in which a user is at times brought to press. The item takes both things away at once.

    I set down that the rule is set in the class of no disruption for all its high risk. It is no contradiction:
    the mechanism is drawn back from use and nothing of today rests upon it, while it stays at once a ready road
    for the setting going of code off a carrier.
