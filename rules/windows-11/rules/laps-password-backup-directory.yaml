id: win11-laps-password-backup-directory

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Miejsce przechowywania hasła lokalnego administratora wskazane
    en: The place of keeping the local administrator's password named
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza mechanizm zarządzania hasłem lokalnego konta
    administratora przez katalog: system sam losuje hasło, sam je zmienia
    i odkłada w katalogu, skąd uprawnione osoby mogą je odczytać.

    Punkt jest podstawą całej grupy reguł o tym mechanizmie, bo dopóki
    miejsce przechowywania nie jest wskazane, mechanizm nie działa wcale,
    a pozostałe ustawienia nie mają czego opisywać.

    Problem, który ten mechanizm zamyka, jest w sieciach z wieloma
    stanowiskami zjawiskiem powszechnym. Maszyny przygotowywane z jednego
    obrazu mają to samo hasło lokalnego administratora. Hasło to nie zmienia
    się latami, bo jego zmiana wymagałaby obejścia wszystkich maszyn. Zna je
    każdy, kto kiedykolwiek pracował w dziale wsparcia, i każdy, kto ten
    obraz widział.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: po zdobyciu
    hasła na jednej maszynie — dostęp administracyjny do wszystkich
    pozostałych. Jest to mechanizm ruchu bocznego najprostszy z możliwych:
    nie wymaga żadnego błędu, żadnego narzędzia i żadnej dodatkowej
    podatności. Wystarczy odczytać hasło raz i użyć go wszędzie.

    Losowanie osobnego hasła dla każdej maszyny zrywa to powiązanie.
    Przejęcie jednego stanowiska przestaje oznaczać przejęcie całej sieci.
  en: |
    The setting switches on the mechanism of managing the local administrator account's
    password through a directory: the system chooses the password at random itself, changes
    it itself, and lays it in the directory, whence entitled people can read it.

    The item is the ground of the whole group of rules about that mechanism, since until the
    place of keeping is named the mechanism does not work at all, and the remaining settings
    have nothing to describe.

    The trouble this mechanism closes is a common thing on networks with many stations.
    Machines prepared from one image have the same local administrator password. That
    password does not change for years, since changing it would take going round every
    machine. Everyone who ever worked in support knows it, and so does everyone who saw
    that image.

    What an attacker gains while the item goes unmet: after taking the password on one
    machine, administrative access to all the rest. It is the simplest possible mechanism of
    lateral movement: it takes no fault, no tool and no further weakness. It is enough to
    read the password once and use it everywhere.

    Choosing a separate password at random for each machine breaks that bond. Seizing one
    station stops meaning seizing the whole network.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to dlatego, że zmienia sposób dostępu
    administracyjnego do maszyny, a nie samą jej konfigurację.

    Przed włączeniem musi być gotowe miejsce przechowywania. Katalog wymaga
    rozszerzenia schematu i nadania uprawnień do odczytu hasła; bez tego
    maszyna zacznie zmieniać hasło, a odłożyć go nie będzie miała gdzie.
    Skutkiem jest stanowisko z hasłem lokalnego administratora, którego
    nikt nie zna.

    Jest to jedyna sytuacja, w której ta reguła szkodzi, i dlatego kolejność
    ma znaczenie rozstrzygające: najpierw katalog, potem maszyny.

    Sprawdzenia wymagają procedury oparte na wspólnym haśle. Skrypty
    instalacyjne, narzędzia wsparcia zdalnego, systemy inwentaryzacji
    i kopie zapasowe logujące się lokalnie przestaną działać w chwili
    pierwszej zmiany hasła.

    Dostęp awaryjny do maszyny odciętej od sieci wymaga osobnego
    przemyślenia. Hasło jest w katalogu, a maszyna bez łączności z katalogiem
    nie da się z niego odczytać przez nikogo, kto stoi przy niej fizycznie.

    Zmiana nie wymaga restartu, ale pierwsza zmiana hasła następuje
    samoczynnie i od tej chwili poprzednie hasło przestaje działać.
  en: |
    A knowing rollout is needed because it changes the way of administrative access to the
    machine rather than the machine's configuration itself.

    Before it is switched on the place of keeping has to be ready. The directory takes an
    extension of the schema and a granting of rights to read the password; without that the
    machine will start changing the password and will have nowhere to lay it. The result is
    a station with a local administrator password nobody knows.

    That is the one case in which this rule does harm, and so the order is of deciding
    weight: the directory first, the machines after.

    Procedures resting on a shared password need checking. Installation scripts, remote
    support tools, inventory systems and backups signing in locally will stop working at
    the moment of the first password change.

    Emergency access to a machine cut off from the network takes thinking through apart.
    The password is in the directory, and on a machine with no link to the directory it
    cannot be read from there by anyone standing physically beside it.

    The change takes no restart, but the first password change happens of itself and from
    that moment the former password stops working.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Wspólne hasło lokalnego administratora przestaje działać po pierwszej zmianie
      - Skrypty i narzędzia wsparcia logujące się tym hasłem przestają się łączyć
      - Dostęp awaryjny do maszyny odciętej od sieci wymaga osobnej procedury
      - Bez przygotowanego katalogu maszyna zostaje z hasłem, którego nikt nie zna
    en:
      - The shared local administrator password stops working after the first change
      - Scripts and support tools signing in with that password stop connecting
      - Emergency access to a machine cut off from the network takes a separate procedure
      - Without a prepared directory the machine is left with a password nobody knows
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Katalog nie jest przygotowany do przechowywania haseł i nadania uprawnień do odczytu
      - Maszyna nie należy do żadnego katalogu i nie ma go gdzie odłożyć
    en:
      - The directory is not prepared for keeping passwords and granting rights to read them
      - The machine belongs to no directory and there is nowhere to lay it
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # One means the directory in the network, two the directory in the cloud;
      # zero switches the whole mechanism off.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BackupDirectory'
        if ($null -eq $value) { 'MISSING' }
        elseif ($value -eq 1) { 'CLOUD_DIRECTORY' }
        elseif ($value -eq 2) { 'ACTIVE_DIRECTORY' }
        elseif ($value -eq 0) { 'NOT_CONFIGURED' }
        else { 'OTHER ' + [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(CLOUD_DIRECTORY|ACTIVE_DIRECTORY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'BackupDirectory' -ErrorAction SilentlyContinue).'BackupDirectory'
    [pscustomobject]@{
      path        = $path
      name        = 'BackupDirectory'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # Two names the directory in the network. On a machine joined to the cloud
    # directory alone, one is the value to write instead.
    Set-ItemProperty -Path $path -Name 'BackupDirectory' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    # The password already changed does not return to its former value.
    # Where the machine is to be reachable again, the current password has to be
    # read from the directory before the mechanism is switched off.

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-overview

notes:
  pl: |
    Reguła dopuszcza dwie wartości, bo miejsce przechowywania bywa różne:
    katalog w sieci albo katalog w chmurze. Obydwa spełniają ten punkt;
    zero oznacza mechanizm wyłączony i stanem zgodnym nie jest.

    Polecenie naprawcze zapisuje wariant katalogu w sieci. Na maszynie
    należącej wyłącznie do katalogu w chmurze właściwa jest wartość druga
    i trzeba ją podmienić przed uruchomieniem — dlatego w poleceniu stoi to
    wprost.

    Wycofanie nie przywraca poprzedniego hasła lokalnego administratora.
    Hasło zostało już zmienione i jedynym miejscem, gdzie istnieje, jest
    katalog. Jest to jedyna reguła w tej grupie, w której wycofanie samej
    wartości nie wystarcza, żeby wrócić do stanu sprzed zmiany.

    Na maszynie nienależącej do żadnego katalogu punkt nie ma zastosowania
    i właściwym sposobem obsługi jest zapisany wyjątek, a nie wymuszanie
    ustawienia, którego maszyna nie potrafi wykorzystać.
  en: |
    The rule admits two values, since the place of keeping varies: the directory in the
    network or the directory in the cloud. Both meet this item; zero means the mechanism is
    switched off and is not a compliant state.

    The remedy command writes the variant of the directory in the network. On a machine
    belonging to the cloud directory alone the other value is the right one and has to be
    substituted before running - which is why the command says so outright.

    The rollback does not restore the former local administrator password. The password has
    already been changed and the one place it exists is the directory. It is the only rule
    in this group in which rolling the value itself back does not suffice to return to the
    state before the change.

    On a machine belonging to no directory the item does not apply, and the right way of
    handling it is a recorded exception rather than forcing a setting the machine cannot
    make use of.
