id: win2025-bitlocker-encryption-method-strength

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Metoda i siła szyfrowania dysków ustalona wprost
    en: The drive encryption method and strength settled explicitly
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala wprost, jaką metodą i jak silnie szyfrowane są trzy klasy
    nośników: wolumen systemowy, dyski stałe i nośniki wymienne. Trzy
    wartości, jedna na klasę — audyt czyta je razem i nazywa tę, która
    odstaje.

    Zostawiam kategorię średnią, bo ta reguła nie zamyka drogi wejścia,
    tylko rozstrzyga wybór, który system i tak podejmie. Bez niej też coś
    zostanie wybrane, tylko nie przez nas.

    Rzeczą wartą uwagi jest asymetria w samym ustawieniu. Wolumen systemowy
    i dyski stałe dostają tryb blokowy z długim kluczem, a nośniki wymienne
    tryb klasyczny — i to nie jest niedopatrzenie ani kompromis „na wszelki
    wypadek". Tryb blokowy nie jest czytany przez starsze systemy. Nośnik,
    który zostaje w maszynie, nie ma powodu, żeby z nimi rozmawiać. Nośnik,
    który wychodzi, ma.

    Ta sama myśl przewija się przez całą paczkę BitLockera: dysk stały
    chronimy przed tym, że maszyna opuści serwerownię, a nośnik wymienny
    przed tym, co stanie się poza nią. Tutaj widać ją zapisaną w jednym
    ustawieniu, w trzech wartościach naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio, ale organizacja traci pewność, czym właściwie zaszyfrowano
    jej nośniki — a odpowiedź może być różna na różnych maszynach.
  en: |
    The item settles explicitly by what method and how strongly three
    classes of media are encrypted: the system volume, fixed drives and
    removable media. Three values, one per class - the audit reads them
    together and names whichever stands out.

    I keep the category medium, because this rule closes no way in; it
    settles a choice the system will make anyway. Without it something will
    still be chosen, only not by us.

    What is worth noticing is the asymmetry in the setting itself. The
    system volume and fixed drives take the block mode with a long key,
    while removable media take the classic mode - and that is neither an
    oversight nor a compromise made just in case. The block mode is not
    read by older systems. A medium that stays in the machine has no reason
    to talk to them. A medium that leaves does.

    The same thought runs through the whole BitLocker pack: we protect a
    fixed drive against the machine leaving the server room, and a
    removable medium against what happens outside it. Here it can be seen
    written into a single setting, in three values at once.

    What an attacker gains while the item goes unmet: little directly, but
    the organisation loses certainty about what its media were actually
    encrypted with - and the answer may differ from machine to machine.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia". Skutek jest jeden i dotyczy
    nośników wymiennych, a nie tej maszyny.

    Wskazanie trybu dla nośników wymiennych przesądza, gdzie taki nośnik da
    się później odczytać. Tryb klasyczny wybrano właśnie po to, żeby dało
    się go odczytać szerzej, więc sam wybór nie boli. Boli sytuacja
    odwrotna: gdyby ktoś postanowił ujednolicić wszystkie trzy wartości „dla
    porządku" i ustawić tryb blokowy także dla nośników wymiennych, nośniki
    przygotowane od tej chwili przestaną otwierać się na starszych
    systemach. Wygląda to na kosmetykę, a jest decyzją o tym, kto odczyta
    dane.

    Druga rzecz to znane już ograniczenie: ustawienie działa w przód.
    Nośniki zaszyfrowane wcześniej zachowują metodę, którą miały, i wpis
    w rejestrze będzie zgodny mimo to. Na serwerze, gdzie wolumeny bywają
    starsze od bieżącej polityki, ta różnica potrafi utrzymywać się latami
    i nie widać jej w raporcie.

    Zmiana nie wymaga przerwy, nikt jej nie zauważy w codziennej pracy
    i cofa się natychmiast.
  en: |
    I keep the class "needs review". The effect is single and concerns
    removable media rather than this machine.

    Naming the mode for removable media settles where such a medium can
    later be read. The classic mode was chosen precisely so that it can be
    read more widely, so the choice itself does not hurt. What hurts is the
    reverse: if somebody decided to make all three values uniform "for
    tidiness" and set the block mode for removable media too, media
    prepared from that moment on would stop opening on older systems. It
    looks like cosmetics and is a decision about who will read the data.

    The second thing is the limitation already known here: the setting
    works forwards. Media encrypted earlier keep the method they had, and
    the registry entry will be compliant regardless. On a server, where
    volumes are often older than the current policy, that difference can
    persist for years and is not visible in the report.

    The change needs no outage, nobody will notice it in daily work, and it
    is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Wskazanie trybu dla nośników wymiennych przesądza, gdzie taki nośnik da się później odczytać
      - Ujednolicenie wszystkich trzech wartości „dla porządku" odetnie nośniki wymienne od starszych systemów
      - Ustawienie działa w przód — nośniki zaszyfrowane wcześniej zachowują swoją metodę, a wpis będzie zgodny
      - Na serwerze wolumeny bywają starsze od polityki, więc ta różnica potrafi utrzymywać się latami niewidoczna w raporcie
    en:
      - Naming the mode for removable media settles where such a medium can later be read
      - Making all three values uniform "for tidiness" cuts removable media off from older systems
      - The setting works forwards - media encrypted earlier keep their method and the entry is compliant
      - On a server volumes are often older than the policy, so the difference can persist for years unseen in the report
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Przyjęto inną metodę szyfrowania, uzgodnioną w organizacji i stosowaną na wszystkich maszynach
      - Nośniki wymienne z tej maszyny muszą być czytane przez sprzęt obsługujący wyłącznie jeden konkretny tryb
    en:
      - Another encryption method has been adopted, agreed across the organisation and used on every machine
      - Removable media from this machine have to be read by hardware supporting one particular mode only
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item, one per class of drive. The system drive
      # and fixed drives take the block mode with a long key; removable media
      # take the classic mode, because the block mode is not read by older
      # systems. Whichever value differs is named in the result.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $expected = @{
        EncryptionMethodWithXtsOs  = 7
        EncryptionMethodWithXtsFdv = 7
        EncryptionMethodWithXtsRdv = 4
      }
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        $wrong = @()
        foreach ($name in $expected.Keys) {
          $value = $item.$name
          if ($null -eq $value) { $missing += $name }
          elseif ([int]$value -ne $expected[$name]) { $wrong += ($name + '=' + [int]$value) }
        }
        if ($missing.Count -gt 0) { 'MISSING ' + (($missing | Sort-Object) -join ',') }
        elseif ($wrong.Count -gt 0) { 'OTHER ' + (($wrong | Sort-Object) -join ',') }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      os          = $item.'EncryptionMethodWithXtsOs'
      os_existed  = ($null -ne $item.'EncryptionMethodWithXtsOs')
      fdv         = $item.'EncryptionMethodWithXtsFdv'
      fdv_existed = ($null -ne $item.'EncryptionMethodWithXtsFdv')
      rdv         = $item.'EncryptionMethodWithXtsRdv'
      rdv_existed = ($null -ne $item.'EncryptionMethodWithXtsRdv')
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The removable value differs from the other two on purpose. Making all
    # three uniform would cut media prepared here off from older systems, which
    # looks like tidiness and is a decision about who will read the data.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsOs' -Value 7 -Type DWord
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsFdv' -Value 7 -Type DWord
    Set-ItemProperty -Path $path -Name 'EncryptionMethodWithXtsRdv' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $pairs = @(
      @{ name = 'EncryptionMethodWithXtsOs';  value = $b.os;  existed = $b.os_existed },
      @{ name = 'EncryptionMethodWithXtsFdv'; value = $b.fdv; existed = $b.fdv_existed },
      @{ name = 'EncryptionMethodWithXtsRdv'; value = $b.rdv; existed = $b.rdv_existed }
    )
    foreach ($pair in $pairs) {
      if ($pair.existed) {
        Set-ItemProperty -Path $b.path -Name $pair.name -Value $pair.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $pair.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Asymetria w tym ustawieniu jest zamierzona. Wolumen systemowy i dyski
    stałe dostają tryb blokowy, nośniki wymienne klasyczny, bo tryb blokowy
    nie jest czytany przez starsze systemy. Nośnik, który zostaje
    w maszynie, nie ma powodu z nimi rozmawiać. Nośnik, który wychodzi, ma.

    Ujednolicenie wszystkich trzech wartości „dla porządku" wygląda na
    kosmetykę, a jest decyzją o tym, kto odczyta dane.

    Znane ograniczenie: ustawienie działa w przód, a na serwerze wolumeny
    bywają starsze od polityki, więc różnica potrafi utrzymywać się latami
    niewidoczna w raporcie.
  en: |
    The asymmetry in this setting is deliberate. The system volume and fixed
    drives take the block mode, removable media the classic one, because the
    block mode is not read by older systems. A medium that stays in the
    machine has no reason to talk to them. A medium that leaves does.

    Making all three values uniform "for tidiness" looks like cosmetics and
    is a decision about who will read the data.

    The known limitation: the setting works forwards, and on a server
    volumes are often older than the policy, so the difference can persist
    for years unseen in the report.
