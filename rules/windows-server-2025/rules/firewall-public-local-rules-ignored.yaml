id: win2025-firewall-public-local-rules-ignored

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Reguły lokalne zapory pomijane w profilu publicznym
    en: Local firewall rules passed over in the public profile
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy w profilu publicznym obowiązują reguły
    zapory utworzone na samej maszynie, czy wyłącznie te przyniesione
    z zasad domenowych.

    Reguła lokalna powstaje na wiele sposobów i większość z nich nie
    wygląda na decyzję o zabezpieczeniach. Instalator programu dopisuje
    wyjątek przy instalacji. Okno „zezwól na dostęp" przy pierwszym
    uruchomieniu serwera nasłuchującego robi to samo jednym kliknięciem.
    Polecenie wykonane w konsoli podczas rozwiązywania problemu zostaje
    na stałe, bo nikt nie pamięta, żeby je cofnąć.

    Suma tych wyjątków tworzy zbiór otwarć, którego nikt nie projektował
    i nikt nie zna w całości. W profilu publicznym — czyli tam, gdzie
    maszyna jest w sieci nierozpoznanej — jest to najgorsze możliwe
    miejsce na takie niespodzianki.

    Na serwerze punkt ma wagę inną niż na stanowisku roboczym i z innego
    powodu. Serwer nasłuchuje z definicji, więc wyjątków lokalnych bywa
    u niego więcej, a ich treść jest szersza. Z drugiej strony serwer
    trafia do profilu publicznego rzadko i zwykle przez pomyłkę —
    przy zmianie karty sieciowej, po odtworzeniu maszyny albo gdy
    wykrywanie sieci nie zdąży rozpoznać domeny przy starcie.

    Właśnie te sytuacje są najważniejsze. Serwer, który przypadkiem
    wylądował w profilu publicznym, powinien wtedy wpuszczać wyłącznie
    to, co uzgodniono z góry — nie sumę przypadkowych zgód zebranych
    przez lata.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    usług otwartych przez wyjątki, o których nikt nie pamięta, dokładnie
    w tym stanie sieciowym, w którym maszyna jest najbardziej odsłonięta.
  en: |
    The setting settles whether in the public profile firewall rules made on the machine
    itself hold, or only those brought in from domain policies.

    A local rule comes about in many ways and most of them do not look like a decision about
    security. A program's installer writes an exception at the installation. The "allow
    access" window at the first start of a listening server does the same with one click. A
    command run at the console while solving a problem stays for good, since nobody remembers
    to undo it.

    The sum of those exceptions makes a set of openings nobody designed and nobody knows in
    full. In the public profile - that is, where the machine is on an unrecognised network -
    that is the worst possible place for such surprises.

    On a server the item weighs otherwise than at a working station and for another reason. A
    server listens by definition, so local exceptions are at times more numerous on it and
    their content wider. On the other hand a server lands in the public profile seldom and
    usually by mistake - at a change of network adapter, after a machine has been restored,
    or when network detection does not manage to recognise the domain at the start.

    Those very situations are the most important. A server that has landed in the public
    profile by accident ought then to let in only what was agreed in advance - not the sum of
    chance consents gathered over years.

    What an attacker gains while the item goes unmet: access to services opened by exceptions
    nobody remembers, in exactly the network state in which the machine is most exposed.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy jakakolwiek usługa tego serwera opiera się
    na wyjątku utworzonym lokalnie, bo w profilu publicznym taki wyjątek
    przestanie obowiązywać.

    Zmiana nie kasuje żadnej reguły. Reguły lokalne pozostają zapisane
    i wracają do działania w pozostałych profilach oraz po cofnięciu
    ustawienia. Zmienia się wyłącznie to, czy są brane pod uwagę, gdy
    aktywny jest profil publiczny.

    Na serwerze pracującym w domenie skutek bywa dokładnie zerowy —
    profil publiczny nigdy się nie uaktywnia, więc ustawienie nie ma
    okazji zadziałać. Warto to wiedzieć, bo łatwo wtedy uznać zmianę za
    nieszkodliwą i przenieść ten wniosek na maszynę, gdzie nieszkodliwa
    nie jest.

    Maszyna poza domeną albo taka, u której wykrywanie sieci zawodzi,
    to przypadek przeciwny. Tam profil publiczny bywa profilem
    codziennym i zmiana odcina wszystko, czego nie przyniosły zasady.
    Serwer potrafi wtedy przestać odpowiadać na zdalne zarządzanie —
    łącznie z tym, którym właśnie się go konfiguruje.

    Jest to ryzyko warte nazwania wprost: przy zdalnej pracy na maszynie
    poza domeną kolejność jest taka, że najpierw trzeba mieć drogę
    dostępu opisaną w zasadach, a dopiero potem włączać ten punkt.
  en: |
    What needs checking is whether any service of this server rests on an exception made
    locally, since in the public profile such an exception will stop holding.

    The change deletes no rule. Local rules stay recorded and return to working in the
    remaining profiles and after the setting is undone. What changes is only whether they are
    taken into account while the public profile is active.

    On a server working in a domain the effect is at times exactly nil - the public profile
    never becomes active, so the setting gets no chance to work. That is worth knowing, since
    it is then easy to hold the change harmless and carry that conclusion over to a machine
    where it is not.

    A machine outside a domain, or one on which network detection fails, is the opposite
    case. There the public profile is at times the everyday profile and the change cuts off
    everything the policies did not bring in. The server can then stop answering remote
    management - including the management it is at that moment being configured through.

    That is a risk worth naming outright: at remote work on a machine outside a domain the
    order is that one must first have a road of access described in the policies, and only
    then switch this item on.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Usługa otwarta wyjątkiem lokalnym przestanie odpowiadać, gdy aktywny jest profil publiczny
      - Wyjątek dopisany przez instalator programu przestanie obowiązywać w tym profilu
      - Na maszynie poza domeną zdalne zarządzanie może zostać odcięte razem z resztą
      - Na serwerze w domenie profil publiczny nie uaktywnia się i skutek bywa zerowy
      - Reguły lokalne nie są kasowane i wracają po cofnięciu ustawienia
    en:
      - A service opened by a local exception will stop answering while the public profile is active
      - An exception written by a program's installer will stop holding in that profile
      - On a machine outside a domain remote management may be cut off along with the rest
      - On a server in a domain the public profile does not become active and the effect is at times nil
      - Local rules are not deleted and return once the setting is undone
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer pracuje poza domeną i dostęp zdalny opiera się na wyjątku utworzonym lokalnie
      - Wykrywanie sieci na tej maszynie zawodzi i profil publiczny bywa profilem codziennym
    en:
      - The server works outside a domain and remote access rests on an exception made locally
      - Network detection on this machine fails and the public profile is at times the everyday profile
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The reading names the state rather than a bare true or false, so that
      # the report says what holds in the public profile instead of naming a
      # switch nobody remembers the sense of.
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' }
      else {
        if ([string]$public.AllowLocalFirewallRules -eq 'False') { 'IGNORED' } else { 'MERGED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: IGNORED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalFirewallRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalFirewallRules $b.AllowLocalFirewallRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Wynik „MERGED" znaczy, że reguły lokalne są w profilu publicznym
    łączone z przyniesionymi z zasad. Wynik „IGNORED" znaczy, że
    obowiązują wyłącznie te z zasad.

    Ustawienie nie usuwa reguł lokalnych i nie zmienia ich treści.
    Przesądza wyłącznie o tym, czy są brane pod uwagę w tym jednym
    profilu.

    Punkt czyta się razem z odpowiednikiem dotyczącym reguł zabezpieczeń
    połączeń. Oba działają tak samo, ale na dwóch różnych zbiorach reguł,
    i spełnienie jednego nie mówi nic o drugim.
  en: |
    The result "MERGED" means that local rules are in the public profile joined with those
    brought in from policies. The result "IGNORED" means that only those from policies hold.

    The setting does not remove local rules and does not change their content. It settles
    only whether they are taken into account in this one profile.

    The item is read together with its counterpart concerning connection security rules. Both
    work the same way but on two different sets of rules, and meeting one says nothing about
    the other.
