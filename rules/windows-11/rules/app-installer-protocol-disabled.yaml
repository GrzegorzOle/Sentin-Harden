id: win11-app-installer-protocol-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Instalacja pakietu odnośnikiem z przeglądarki zablokowana
    en: Installing a package from a link in a browser blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Instalator pakietów rejestruje w systemie własny rodzaj odnośnika. Kliknięcie
    takiego odnośnika na stronie internetowej uruchamia instalator i podaje mu
    adres pakietu do pobrania — bez zapisywania pliku, bez okna pobierania
    i bez przejścia przez cokolwiek, co sprawdza pobierane pliki.

    Droga została pomyślana jako wygoda: jedno kliknięcie na wewnętrznej stronie
    z oprogramowaniem i program się instaluje. Ta sama wygoda działa jednak dla
    dowolnej strony. Wystarczy, że użytkownik kliknie odnośnik w wiadomości albo
    na przygotowanej stronie, a pakiet pobierze się i zainstaluje, mijając
    sprawdzenie pobranych plików i ostrzeżenie o pliku z sieci.

    Nie jest to zagrożenie teoretyczne. Ta droga była wykorzystywana
    w rzeczywistych kampaniach rozsyłania szkodliwego oprogramowania na tyle
    szeroko, że producent systemu wyłączał ją awaryjnie po swojej stronie.
    Powód jej skuteczności jest prosty: wszystko, co zwykle zatrzymuje
    użytkownika przed uruchomieniem pobranego pliku, tutaj nie występuje.

    Wyłączenie tego rodzaju odnośnika zostawia instalator działający, ale
    odbiera stronom internetowym możliwość jego uruchamiania.
  en: |
    The package installer registers a kind of link of its own in the system. Clicking
    such a link on a web page starts the installer and hands it the address of a package
    to fetch - with no file saved, no download window and no passing through anything
    that checks fetched files.

    The route was meant as a convenience: one click on an internal software page and the
    program installs itself. That same convenience, though, works for any page at all.
    A user need only click a link in a message or on a prepared page, and the package is
    fetched and installed, passing by the check on fetched files and the warning about a
    file from the network.

    This is no theoretical threat. The route was used in real campaigns spreading
    malicious software widely enough that the system's maker switched it off on their
    own side as an emergency measure. The reason for its effectiveness is simple:
    everything that usually stops a user before they run a fetched file is absent here.

    Switching that kind of link off leaves the installer working but takes from web
    pages the ability to start it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w organizacji istnieje strona z oprogramowaniem
    do samodzielnej instalacji, która korzysta z takich odnośników.

    Jeżeli nie ma — a w większości miejsc nie ma — zmiana nie robi nic
    widocznego. Instalowanie programów pozostaje możliwe wszystkimi pozostałymi
    drogami: poleceniem, plikiem pakietu, sklepem, narzędziem wdrożeniowym.

    Jeżeli taka strona istnieje, odnośniki na niej przestaną działać.
    Kliknięcie nie zgłosi błędu w sposób czytelny — najczęściej po prostu nic
    się nie stanie albo pojawi się komunikat o nieznanym rodzaju odnośnika, co
    trafi do zgłoszeń jako „strona nie działa". Warto uprzedzić o tym osoby
    obsługujące zgłoszenia.

    Zamiennikiem jest podanie na tej stronie pliku pakietu do pobrania albo
    wdrożenie przez narzędzie zarządzające oprogramowaniem. Obie drogi są
    wolniejsze o jeden krok i obie zostają pod nadzorem.

    Nie ma restartu.
  en: |
    What needs checking is whether the organisation has a software page for installing
    by oneself that uses such links.

    If there is none - and in most places there is none - the change does nothing
    visible. Installing programs stays possible by all the other routes: by command, by
    a package file, by the store, by a deployment tool.

    If such a page exists, its links will stop working. Clicking will not report an
    error in any readable way - most often simply nothing will happen, or a message
    about an unknown kind of link will appear, which reaches the service desk as "the
    page does not work". The people handling reports are worth warning.

    The replacement is putting a package file on that page to fetch, or rolling out
    through a tool that manages software. Both routes are one step slower and both stay
    under oversight.

    There is no restart.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - email-and-attachments
    - legacy-applications
  what_breaks:
    pl:
      - Odnośniki instalujące program wprost ze strony wewnętrznej przestają działać
      - Kliknięcie takiego odnośnika kończy się brakiem reakcji albo komunikatem o nieznanym odnośniku
      - Instalacja tego samego pakietu pobranym plikiem pozostaje możliwa bez zmian
      - Narzędzia wdrożeniowe działające po stronie serwera nie zmieniają zachowania
    en:
      - Links installing a program straight from an internal page stop working
      - Clicking such a link ends in no reaction or a message about an unknown link
      - Installing the same package from a fetched file stays possible unchanged
      - Deployment tools working on the server side do not change behaviour
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wewnętrzna strona z oprogramowaniem opiera samodzielną instalację na tych odnośnikach
      - Nie da się zastąpić odnośników plikiem pakietu ani wdrożeniem przez narzędzie zarządzające
    en:
      - An internal software page rests self-service installation on those links
      - The links cannot be replaced by a package file or by a rollout through a management tool
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      $name = 'EnableMSAppInstallerProtocol'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableMSAppInstallerProtocol'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMSAppInstallerProtocol' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/msix/app-installer/installing-windows10-apps-web

notes:
  pl: |
    Producent systemu wyłączył tę drogę domyślnie po kampaniach, które ją
    wykorzystywały. Nie zwalnia to z ustawienia zasady: wartość domyślna bywa
    zmieniana przez aktualizację składnika, a zasada trzyma stan niezależnie od
    tego, co ustawi instalator.

    Punkt jest węższy niż wyłączenie instalatora w całości i warto je rozróżnić.
    Tutaj instalator działa dalej — traci jedynie możliwość uruchomienia przez
    kliknięcie na stronie internetowej. Tam, gdzie instalator jest potrzebny do
    pracy, ten punkt jest właściwym wyborem zamiast wyłączenia całości.

    Gałąź zasad jest wspólna dla wszystkich ustawień tego instalatora, więc
    wycofanie usuwa wyłącznie sam wpis.
  en: |
    The system's maker switched this route off by default after the campaigns that used
    it. That does not excuse leaving the policy unset: a default is sometimes changed by
    an update to the component, while a policy holds the state whatever the installer
    sets.

    The item is narrower than switching the installer off altogether and the two are
    worth telling apart. Here the installer carries on working - it merely loses the
    ability to be started by a click on a web page. Where the installer is needed for
    the work, this item is the right choice instead of switching the whole thing off.

    The policy key is shared by every setting of this installer, so rollback removes the
    entry alone.
