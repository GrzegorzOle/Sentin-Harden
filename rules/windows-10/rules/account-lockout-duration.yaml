id: win10-account-lockout-duration

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Czas, na jaki konto zostaje zablokowane
    en: The span for which an account stays locked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, na ile minut konto zostaje zamknięte po przekroczeniu
    progu nieudanych prób.

    Czas ten rozstrzyga o tym, czy blokada faktycznie zatrzymuje zgadywanie.
    Napastnik próbujący haseł nie potrzebuje wielu prób na minutę — potrzebuje
    ich wielu na dobę. Blokada trwająca minutę pozwala mu na kilkaset prób
    dziennie, co przy haśle słabym wystarcza. Blokada kwadransowa sprowadza
    tę liczbę do kilkudziesięciu i czyni zgadywanie niepraktycznym.

    Wartość szczególna to zero, znaczące blokadę do ręcznego odblokowania
    przez administratora. Jest ona mocniejsza, ale zamienia każdą pomyłkę
    w zgłoszenie do obsługi, a przy oprogramowaniu logującym się ze starym
    hasłem — w zgłoszenie powtarzalne. Reguła przyjmuje ją jako spełniającą
    wymaganie, bo czas nieskończony nie jest krótszy niż kwadrans.

    Punkt nie działa samodzielnie. Bez progu nieudanych prób nie ma czego
    odmierzać, więc czytać go należy razem z regułą poprzednią.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: liczbę prób
    na dobę na tyle dużą, że zgadywanie hasła pozostaje opłacalne mimo
    istnienia blokady.
  en: |
    The setting says for how many minutes an account stays shut once the threshold of failed tries is passed.

    That span settles whether the lock truly halts guessing. An attacker trying passwords does not need many
    tries a minute - they need many a day. A lock lasting a minute allows them some hundreds of tries a day,
    which against a weak password suffices. A quarter-hour lock brings that count down to some tens and makes
    guessing impractical.

    A particular value is nought, meaning a lock until an administrator unlocks it by hand. It is the stronger,
    but turns every slip into a request to the attendance, and where software logs in with an old password, into
    a repeating one. The rule takes it as meeting the demand, an endless span not being shorter than a quarter
    of an hour.

    The item does not work on its own. Without a threshold of failed tries there is nothing to measure out, so
    it is to be read together with the foregoing rule.

    What an attacker gains while the item goes unmet: a count of tries a day large enough that guessing a
    password stays worth while, the lock's existence notwithstanding.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, kto będzie konta
    odblokowywał.

    Przy kwadransie nikt — konto otwiera się samo i zgłoszenia zwykle nie ma,
    bo człowiek czeka. Jest to wybór, przy którym obsługa nie dostaje nic
    do roboty.

    Przy blokadzie do ręcznego odblokowania każda pomyłka trafia do obsługi
    i wtedy sprawdzić trzeba dwie rzeczy: czy obsługa jest dostępna w porach,
    w których ludzie pracują, i czy da się do niej dotrzeć inaczej niż
    z zablokowanego konta. Drugie pytanie bywa pomijane, a przy stanowisku
    jednoosobowym prowadzi wprost do impasu.

    Rzecz do odnotowania: wydłużenie czasu blokady nie zmniejsza liczby
    blokad. Jeśli konta zamykają się często, przyczyną jest oprogramowanie
    ponawiające logowanie, a nie długość blokady — zmiana tej reguły
    pogorszy wtedy objaw, nie poprawi.

    Czego to nie psuje: logowania przy haśle prawidłowym, kont domenowych,
    usług systemowych, sieci, aplikacji, drukowania.
  en: |
    The class is "needs review", and the review touches who will be unlocking the accounts.

    At a quarter of an hour, nobody - the account opens of itself and as a rule no request arises, the person
    waiting. It is the choice at which the attendance gets nothing to do.

    At a lock until an unlocking by hand every slip reaches the attendance, and then two things have to be
    reviewed: whether the attendance is to be had at the hours people work, and whether they can be reached
    otherwise than from the locked account. The second question gets passed over, and at a one-person workplace
    it leads straight to a deadlock.

    A thing to note: lengthening the lock's span does not lessen the number of locks. Where accounts shut often,
    the cause is software retrying its logon, not the lock's length - changing this rule will then worsen the
    symptom rather than better it.

    What this does not break: logging on with the right password, domain accounts, system services, the network,
    applications, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Człowiek, któremu konto się zamknie, czeka kwadrans zamiast próbować dalej od razu
      - Przy blokadzie do ręcznego odblokowania każda pomyłka staje się zgłoszeniem do obsługi
      - Na stanowisku jednoosobowym blokada do ręcznego odblokowania potrafi odciąć jedyną drogę do maszyny
      - Wydłużenie blokady nie zmniejsza liczby blokad, więc przy oprogramowaniu ponawiającym logowanie pogarsza objaw
      - Logowanie przy haśle prawidłowym, konta domenowe, usługi systemowe i praca sieci pozostają bez zmian
    en:
      - A person whose account shuts waits a quarter of an hour instead of trying again at once
      - At a lock until an unlocking by hand every slip becomes a request to the attendance
      - At a one-person workplace a lock until an unlocking by hand may cut off the only road to the machine
      - Lengthening the lock does not lessen the number of locks, so with software retrying its logon it worsens the symptom
      - Logging on with the right password, domain accounts, system services and the work of the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana przez jedną osobę i nie ma innej drogi dostępu przy zamkniętym koncie
      - Konta zamykają się często przez oprogramowanie ponawiające logowanie i przyczyny jeszcze nie usunięto
    en:
      - The machine is handled by one person and there is no other road of access when the account is shut
      - Accounts shut often through software retrying its logon and the cause has not yet been taken away
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^LockoutDuration\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '15'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^LockoutDuration\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'LockoutDuration'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Fifteen minutes lets the account open of itself. Nought would mean an
    # unlocking by hand - stronger, but at a one-person workplace it may cut off
    # the only road to the machine.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'LockoutDuration = 15',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('LockoutDuration = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/account-lockout-duration

notes:
  pl: |
    Reguła jest nastawą reguły o progu i opis powinien to mówić wprost.
    Sama z siebie nie zamyka żadnej drogi — bez progu nie ma czego odmierzać,
    a raport pokazujący ją jako punkt niezależny wprowadza w błąd.

    Warto, żeby aplikacja postawiła rachunek, bo tłumaczy wybór kwadransa
    lepiej niż uzasadnienie ogólne: blokada minutowa daje kilkaset prób na
    dobę, kwadransowa kilkadziesiąt. Ta różnica jest całą treścią tej reguły.

    Odnotowuję, że wartość zero, znacząca blokadę do ręcznego odblokowania,
    przechodzi porównanie „nie mniej niż" jako czas nieskończony. Jest to
    odczyt prawidłowy i warto, żeby opis to mówił, bo ktoś czytający samą
    liczbę mógłby uznać ją za brak blokady — tak jak przy regule o progu,
    gdzie zero znaczy dokładnie odwrotnie.
  en: |
    The rule is a setting of the rule about the threshold, and the description ought to say so outright. Of
    itself it closes no road - without a threshold there is nothing to measure out, and a report showing it as
    an item of its own misleads.

    It is well that the application put the reckoning, explaining as it does the choice of a quarter of an hour
    better than a general reasoning: a lock of a minute gives some hundreds of tries a day, one of a quarter of
    an hour some tens. That difference is the whole content of this rule.

    Worth noting that a value of nought, meaning a lock until an unlocking by hand, passes the "not less than"
    comparison as an endless span. It is a right reading, and it is well that the description say so, somebody
    reading the number alone being able to take it for no lock at all - as at the rule about the threshold,
    where nought means exactly the reverse.
