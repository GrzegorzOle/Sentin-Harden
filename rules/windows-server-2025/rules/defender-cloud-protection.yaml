id: win2025-defender-cloud-protection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Ochrona dostarczana z chmury włączona
    en: Cloud-delivered protection enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza odpytywanie usługi zewnętrznej o pliki, których
    mechanizm lokalny nie zna. Zmienia to podstawę rozstrzygnięcia:
    zamiast tego, co maszyna zdążyła pobrać przy ostatniej aktualizacji
    definicji, pytanie idzie do zbioru wiedzy aktualnego na teraz.

    Różnica jest największa dokładnie tam, gdzie liczy się najbardziej:
    przy rzeczy widzianej po raz pierwszy. Definicje przychodzą kilka
    razy na dobę, a między jedną a drugą maszyna jest zdana na to, co
    już ma.

    Na serwerze ten punkt ma jednak warunek, którego stacja robocza
    zwykle nie ma, i to on decyduje o tym, czy naprawa cokolwiek daje.
    Serwer bywa postawiony w segmencie bez wyjścia na zewnątrz. Wpis
    w polityce można tam ustawić i punkt zrobi się zielony, ale
    odpytania nie dojdą. Raport pokaże wtedy ochronę, której nie ma —
    i jest to gorsze niż czerwony wynik, bo czerwony wynik przynajmniej
    nie kłamie.

    Dlatego przy tym punkcie sprawdzenie łączności jest częścią naprawy,
    a nie czynnością po niej. Tam, gdzie wyjścia nie ma i nie będzie,
    właściwym wynikiem pracy jest zapisany wyjątek, a nie zielony wiersz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno
    między wypuszczeniem nowego narzędzia a najbliższą aktualizacją
    definicji na tej maszynie.
  en: |
    The item switches on the asking of an outward service about files the local working knows not.
    That alters the ground of the settling - instead of what the machine had time to draw down at
    the last freshening of its markings, the question goes to a gathering of knowledge current as of
    now.

    The difference is greatest just where it counts most - at a thing seen for the first time. The
    markings come a few times in a day and night, and between the one and the next the machine is
    left to what it already has.

    On a server, though, this item has a bond a workstation mostly has not, and it is that which
    settles whether the mending gives anything at all. A server is at times set in a reach with no
    way out. The entry in the policy can be set there and the item will turn green, but the askings
    will not arrive. The report will then show a guard that is not there - and that is worse than a
    red outcome, a red outcome at least not lying.

    Therefore at this item the checking of the binding is a share of the mending and no act after
    it. Where there is no way out and will be none, the right outcome of the work is a written
    exception and no green line.

    What an attacker gains while the item goes unmet - the window between the loosing of a new tool
    and the nearest freshening of the markings on that machine.

disruption_description:
  pl: |
    Zmiana nie blokuje niczego sama z siebie. Dokłada odpytanie usługi
    zewnętrznej w chwili, gdy mechanizm napotka plik, którego nie zna.

    Pierwszą rzeczą do sprawdzenia jest łączność, i to z dwóch stron.
    Od strony technicznej: czy segment, w którym stoi serwer, w ogóle
    wypuszcza ruch do usługi producenta, także wtedy, gdy idzie on przez
    pośrednika. Od strony organizacyjnej: czy taki ruch jest na tej
    maszynie dopuszczony. To drugie pytanie zadaje się rzadziej,
    a potrafi zatrzymać zmianę mocniej niż pierwsze.

    Drugą rzeczą jest to, co w tym ruchu wychodzi. Wychodzą dane
    o pliku — nazwa, rozmiar, skrót, ścieżka, informacja o tym, co go
    uruchomiło. Samego pliku ten punkt nie wysyła; tym zajmuje się
    osobne ustawienie i osobna reguła. Rozróżnienie warto mieć zapisane,
    bo w rozmowie z osobą odpowiedzialną za dane te dwie rzeczy
    zlewają się w jedną i rozmowa kończy się odmową na obie.

    Trzecią rzeczą jest opóźnienie. Odpytanie kosztuje ułamek sekundy
    i nie widać go przy pojedynczym pliku. Widać je na serwerze, który
    w trakcie wdrożenia zapisuje setki nowych plików naraz.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    The change blocks nothing of itself. It adds an asking of an outward service at the moment the
    working meets a file it knows not.

    The first thing to check is the binding, and that from two sides. From the side of the workings
    - whether the reach the server stands in lets traffic out to the maker's service at all, also
    where it goes by a go-between. From the side of the body - whether such traffic is allowed on
    that machine. The second question is asked the seldomer, and can stop the change harder than the
    first.

    The second thing is what goes out in that traffic. What goes out is data about the file - its
    name, its bigness, its short reckoning, its path, a tiding of what ran it. The file itself this
    item sends not; a setting of its own and a rule of its own see to that. The telling apart is
    worth having written down, for in a talk with the person answerable for data the two run
    together into one and the talk ends in a refusal to both.

    The third thing is the delay. An asking costs a share of a second and is not seen at a single
    file. It is seen on a server that writes hundreds of new files at once in the midst of a rolling
    out.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - W segmencie bez wyjścia na zewnątrz punkt zrobi się zielony, a odpytania i tak nie dojdą
      - Raport pokaże wtedy ochronę, której nie ma, i jest to gorsze niż czerwony wiersz
      - Wychodzą dane o pliku, a nie sam plik, i to rozróżnienie warto mieć przed rozmową o zgodach
      - Opóźnienie odpytania widać na serwerze zapisującym setki nowych plików w trakcie wdrożenia
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - In a reach with no way out the item will turn green and the askings will not arrive anyway
      - The report will then show a guard that is not there, and that is worse than a red line
      - What goes out is data about the file and not the file, and that telling apart is worth having before a talk about leave
      - The delay of an asking is seen on a server writing hundreds of new files in the midst of a rolling out
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer stoi w segmencie bez wyjścia na zewnątrz i właściwym wynikiem jest zapisany wyjątek
      - Ruch do usługi producenta nie jest na tej maszynie dopuszczony przez zasady organizacji
    en:
      - The server stands in a reach with no way out and the right outcome is a written exception
      - Traffic to the maker's service is not allowed on that machine by the body's own rules
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters: with Defender stood down, reading its preferences throws.
      # The question "did another product take over" has to be answered first.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).MAPSReporting }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'SpynetReporting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check that the segment lets this traffic out before writing the entry:
    # a green line over an unreachable service is worse than a red one.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SpynetReporting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Warunek, którego stacja robocza zwykle nie ma: serwer bywa
    w segmencie bez wyjścia na zewnątrz. Wpis da się tam ustawić
    i punkt zrobi się zielony, ale odpytania nie dojdą. Raport pokaże
    ochronę, której nie ma — gorzej niż czerwony wiersz, bo czerwony
    przynajmniej nie kłamie.

    Sprawdzenie łączności jest tu częścią naprawy, nie czynnością po
    niej. Gdzie wyjścia nie ma i nie będzie, właściwym wynikiem jest
    zapisany wyjątek.

    Rozróżnienie do rozmowy o zgodach: ten punkt wysyła dane o pliku,
    a nie sam plik. Tym drugim zajmuje się osobna reguła i warto ich
    nie zlewać, bo rozmowa kończy się wtedy odmową na obie.
  en: |
    A bond a workstation mostly has not - a server is at times in a reach with no way out. The entry
    can be set there and the item will turn green, but the askings will not arrive. The report will
    show a guard that is not there - worse than a red line, a red one at least not lying.

    The checking of the binding is here a share of the mending and no act after it. Where there is
    no way out and will be none, the right outcome is a written exception.

    A telling apart for the talk about leave - this item sends data about the file and not the file.
    The latter a rule of its own sees to, and it is worth not running them together, the talk ending
    then in a refusal to both.
