id: win10-app-shared-local-data-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Wspólny katalog danych aplikacji dla wszystkich użytkowników wyłączony
    en: A shared directory of application data for every user switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza katalog danych aplikacji wspólny dla wszystkich
    użytkowników maszyny.

    Pakiety aplikacji domyślnie trzymają dane w profilu użytkownika,
    osobno dla każdego. Wspólny katalog jest wyjątkiem od tej zasady:
    jedno miejsce, do którego pisze i z którego czyta każdy, kto
    uruchomił daną aplikację.

    Zagrożenie jest zwykłe dla każdego katalogu zapisywalnego przez
    wszystkich. Jeden użytkownik może odczytać to, co zapisał inny,
    i może podłożyć plik, który inny odczyta. Aplikacja czytająca
    z takiego miejsca ustawienia albo dane pomocnicze przyjmuje je od
    kogokolwiek na maszynie.

    Skutek jest tym wyraźniejszy, że aplikacja zwykle nie spodziewa się
    tam cudzej zawartości. Sprawdzenia, które robi na danych z sieci,
    na danych z własnego katalogu bywają pominięte.

    Odnotowuję, że mechanizm ten jest używany rzadko. Wymaga wyraźnego
    zadeklarowania przez aplikację i nie włącza się sam.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    na maszynie, przez które jeden użytkownik dosięga drugiego.
  en: |
    The setting switches off the directory of application data shared by every user of the machine.

    Packages of applications by default keep data in the user's profile, apart for each. A shared directory is the
    exception to that rule: one place into which everybody who set a given application going writes, and out of
    which they read.

    The danger is the ordinary one of any directory writable by all. One user may read what another wrote, and may
    lay in a file another will read. An application reading from such a place its settings or helping data takes
    them from anybody upon the machine.

    The upshot is the plainer for the application commonly not looking for another's content there. Checks it
    makes upon data out of the network are at times passed over upon data out of its own directory.

    I set down that the mechanism is used seldom. It calls for a plain declaring by the application and turns not
    itself on.

    What an attacker gains while the item goes unmet: a place upon the machine through which one user reaches
    another.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm ten jest używany rzadko i wymaga wyraźnego zadeklarowania
    przez aplikację. Na stanowisku z typowym zestawem oprogramowania
    zmiana nie robi nic widocznego.

    Odnotowuję jedyne miejsce warte uwagi: aplikacje branżowe napisane
    w tej technologii i przeznaczone do pracy zmianowej, gdzie jedno
    stanowisko obsługuje kolejno kilka osób i zestaw danych ma być
    wspólny. Tam aplikacja straci dostęp do wspólnego katalogu.

    Rozwiązaniem w takim wypadku jest trzymanie danych wspólnych
    w miejscu przeznaczonym do tego celu, z nadanymi uprawnieniami,
    a nie w katalogu zapisywalnym przez wszystkich.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: danych aplikacji w profilach użytkowników,
    sklepu systemowego, pakietów już zainstalowanych, programów
    klasycznych, logowania, drukowania.
  en: |
    The class is "no disruption".

    The mechanism is used seldom and calls for a plain declaring by the application. Upon a station with the usual
    set of software the change does nothing to be seen.

    I set down the one place worth notice: applications of a trade written in this craft and meant for work by
    shifts, where one station serves several people in turn and the set of data is to be shared. There the
    application will lose its reach of the shared directory.

    The answer in such a case is the keeping of shared data in a place meant for that end, with rights given out,
    and not in a directory writable by all.

    The consequence shows at once, with no restart.

    What this does not break: the data of applications in users' profiles, the system's store, packages already
    laid on, programs of the older make, logging on, or printing.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Aplikacja branżowa przeznaczona do pracy zmianowej straci dostęp do wspólnego katalogu danych
      - Rozwiązaniem jest trzymanie danych wspólnych w miejscu przeznaczonym do tego celu, z nadanymi uprawnieniami
      - Mechanizm wymaga wyraźnego zadeklarowania przez aplikację, więc na typowym stanowisku nikt go nie używa
      - Dane aplikacji w profilach użytkowników pozostają nietknięte i są dalej czytane normalnie
      - Sklep systemowy, pakiety już zainstalowane, programy klasyczne, logowanie i drukowanie pozostają bez zmian
    en:
      - An application of a trade meant for work by shifts will lose its reach of the shared directory of data
      - The answer is the keeping of shared data in a place meant for that end, with rights given out
      - The mechanism calls for a plain declaring by the application, so upon the usual station nobody uses it
      - The data of applications in users profiles stay untouched and are read on in the ordinary manner
      - The system s store, packages already laid on, programs of the older make, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja branżowa obsługująca pracę zmianową trzyma dane wspólne w tym katalogu i nie ma dla niego zamiennika
    en:
      - An application of a trade serving work by shifts keeps shared data in that directory and there is no other in its place
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowSharedLocalAppData'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
    $name = 'AllowSharedLocalAppData'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\AppModel\StateManager'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSharedLocalAppData' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/msix/desktop/desktop-to-uwp-behind-the-scenes

notes:
  pl: |
    Reguła jest zaliczona do klasy bez uciążliwości, bo mechanizm wymaga
    zadeklarowania przez aplikację i na typowym stanowisku nikt go nie
    używa. Warto, żeby aplikacja to powiedziała, bo nazwa ustawienia
    brzmi szeroko i sugeruje skutek większy, niż jest.

    Argument wart zachowania dotyczy tego, czemu wspólny katalog jest
    gorszy od wspólnego pliku w miejscu z nadanymi uprawnieniami. Jest
    zapisywalny przez wszystkich bez rozróżnienia, a aplikacja czytająca
    z własnego katalogu zwykle nie sprawdza zawartości tak, jak
    sprawdzałaby dane z sieci.

    Odnotowuję przypadek pracy zmianowej jako jedyny realny koszt. Warto
    go wymienić razem z rozwiązaniem, bo inaczej zespół obsługujący takie
    stanowisko odrzuci punkt bez rozważenia drogi pośredniej.
  en: |
    The rule is set in the class of no disruption, the mechanism calling for a declaring by the application and
    nobody upon the usual station using it. It is well that the application say so, the setting's name sounding
    broad and hinting at an upshot greater than it is.

    The argument worth keeping touches why a shared directory is worse than a shared file in a place with rights
    given out. It is writable by all without telling apart, and an application reading from its own directory
    commonly weighs the content not as it would weigh data out of the network.

    I set down the case of work by shifts as the one true cost. It is worth naming together with the answer, else
    the team keeping such a station will cast the item aside without weighing the middle road.
