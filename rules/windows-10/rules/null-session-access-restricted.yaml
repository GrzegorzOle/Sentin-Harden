id: win10-null-session-access-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Dostęp bez uwierzytelnienia do kanałów i udziałów ograniczony
    en: Access without authentication to channels and shares restricted
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że połączenie bez poświadczeń dosięga wyłącznie tych
    kanałów i udziałów, które wymieniono na wykazach wyjątków — i niczego
    poza nimi.

    Reguła jest domknięciem bloku o dostępie anonimowym. Tamte reguły
    opróżniają wykazy wyjątków; ta rozstrzyga, co się dzieje z zasobami
    spoza wykazów. Bez niej wykaz pusty nie znaczy „nic nie jest dostępne",
    tylko „nie wskazano niczego wprost".

    Rozróżnienie to jest praktyczne, nie formalne. Maszyna z wykazami
    pustymi i bez tego ustawienia nadal udostępnia połączeniu anonimowemu
    kanały i udziały, które nie zostały nigdzie wymienione — a to jest
    zbiór, którego nikt nie przeglądał, bo nie ma go gdzie obejrzeć.

    Odnotowuję kolejność wykonania: to ustawienie warto wprowadzić razem
    z opróżnieniem wykazów, nie osobno. Każde z nich osobno zostawia
    połowę drogi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp bez
    poświadczeń do zasobów, których nie wymieniono na żadnym wykazie
    i których nikt nie przeglądał.
  en: |
    The setting makes a connection without credentials reach only those channels and shares named upon the rolls
    of exceptions - and nothing beyond them.

    The rule closes the block about access without authentication. Those rules empty the rolls of exceptions;
    this settles what becomes of the resources outside the rolls. Without it an empty roll does not mean
    "nothing is to be had", only "nothing has been named outright".

    That parting is a practical one, not formal. A machine with empty rolls and without this setting still gives
    an anonymous connection the channels and shares that have been named nowhere - and that is a set nobody has
    looked over, there being nowhere to look at it.

    I set down the order of carrying out: this setting is well brought in together with the emptying of the
    rolls, not apart. Each of them alone leaves half the road.

    What an attacker gains while the item goes unmet: access without credentials to resources named upon no roll
    and looked over by nobody.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiot jest ten sam co przy regułach
    o wykazach: czy cokolwiek sięga po zasoby tej maszyny bez
    uwierzytelnienia.

    Na stanowisku roboczym zwykle nie sięga nic i zmiana jest niewidoczna.

    Gdzie sięga, skutek będzie natychmiastowy i objawi się odmową dostępu.
    Dotyczy to urządzeń odkładających pliki, narzędzi inwentaryzacyjnych
    i starszego oprogramowania zarządzającego.

    Odnotowuję przerwę: zmiana wchodzi po restarcie usługi udostępniania
    plików, a ten zrywa otwarte połączenia do udziałów tej maszyny. Jest to
    ta sama przerwa co przy regułach o wykazach, więc wykonanie wszystkich
    naraz kosztuje jeden restart zamiast trzech.

    Czego to nie psuje: dostępu dla połączeń uwierzytelnionych, uprawnień
    do zasobów, logowania, kont domenowych, drukowania, aplikacji.
  en: |
    The class is "needs review", and the object is the same as at the rules about the rolls: whether anything
    reaches for this machine's resources without authentication.

    At a workplace as a rule nothing does, and the change is unseen.

    Where something does, the consequence will be immediate and will show itself as a refusal of access. That
    touches devices laying files down, inventory tools and older management software.

    I set down the break: the change takes hold after a restart of the file-sharing service, and that tears down
    open connections to this machine's shares. It is the same break as at the rules about the rolls, so carrying
    them all out at once costs one restart instead of three.

    What this does not break: the reach for authenticated connections, the rights upon resources, logging on,
    domain accounts, printing, or applications.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - network-and-firewall
    - logging-and-audit
  what_breaks:
    pl:
      - Urządzenia i narzędzia sięgające po zasoby tej maszyny bez uwierzytelnienia dostają odmowę dostępu
      - Restart usługi udostępniania plików, potrzebny do wejścia zmiany, zrywa otwarte połączenia do udziałów
      - Wykonanie tej reguły razem z regułami o wykazach kosztuje jeden restart zamiast trzech
      - Dostęp dla połączeń uwierzytelnionych i uprawnienia do zasobów nie zmieniają się wcale
      - Logowanie, konta domenowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Devices and tools reaching for this machines resources without authentication are refused access
      - The restart of the file-sharing service, needed for the change to take hold, tears down open connections to shares
      - Carrying this rule out together with the rules about the rolls costs one restart instead of three
      - The reach for authenticated connections and the rights upon resources do not change at all
      - Logging on, domain accounts, printing and applications stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Po zasoby tej maszyny sięga urządzenie bez poświadczeń, a konta mu jeszcze nie założono
      - Nie ma okna serwisowego na restart usługi udostępniania plików
    en:
      - A device without credentials reaches for this machines resources and no account has yet been made for it
      - There is no service window for a restart of the file-sharing service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'RestrictNullSessAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'RestrictNullSessAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Best carried out together with the emptying of the rolls of exceptions - they
    # share one restart of the file-sharing service, and each alone leaves half the
    # road.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictNullSessAccess' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-restrict-anonymous-access-to-named-pipes-and-shares

notes:
  pl: |
    Reguła domyka blok o dostępie anonimowym i warto, żeby aplikacja
    pokazała ją razem z regułami o wykazach kanałów i udziałów. Jest między
    nimi zależność, której z listy nie widać: wykaz pusty bez tego
    ustawienia nie zamyka niczego poza tym, co na wykazie było.

    Argument wart postawienia wprost dotyczy zbioru domyślnego. Zasoby
    niewymienione nigdzie są zbiorem, którego nikt nie przeglądał, bo nie ma
    go gdzie obejrzeć — i właśnie dlatego to ustawienie jest potrzebne obok
    opróżnionych wykazów, a nie zamiast nich.

    Odnotowuję oszczędność praktyczną: trzy reguły tej rodziny dzielą jeden
    restart usługi. Aplikacja, która zaproponuje wykonanie ich razem,
    zamienia trzy okna serwisowe na jedno.
  en: |
    The rule closes the block about access without authentication, and it is well that the application show it
    together with the rules about the rolls of channels and shares. There is between them a dependence a list
    does not show: an empty roll without this setting closes nothing beyond what stood upon the roll.

    The argument worth putting outright touches the default set. Resources named nowhere are a set nobody has
    looked over, there being nowhere to look at it - and for just that this setting is needed beside the emptied
    rolls, not instead of them.

    I set down a practical thrift: three rules of this family share one restart of the service. An application
    proposing they be carried out together turns three service windows into one.
