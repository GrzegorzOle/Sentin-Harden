id: win2016-smb-server-idle-session-timeout

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Bezczynne sesje plikowe zawieszane po najwyżej piętnastu minutach
    en: Idle file sessions suspended after fifteen minutes at most
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zawieszać sesję plikową, przez którą nic nie przechodzi
    dłużej niż podany czas.

    Sesja plikowa nie kończy się wtedy, gdy użytkownik zamyka plik. Trwa
    dalej, a wraz z nią trwa uwierzytelnienie, które ją otworzyło. Maszyna
    pamięta, kto jest po drugiej stronie, i nie pyta o to ponownie.

    Stąd wartość tego punktu. Sesja wisząca bez ruchu jest gotowym
    połączeniem o ustalonej tożsamości — czymś, co da się przejąć bez
    uwierzytelniania się na nowo. Zawieszenie jej po kwadransie skraca okno,
    w którym jest to możliwe.

    Warto powiedzieć, ile to realnie waży, bo punkt bywa przeceniany.
    Przejęcie takiej sesji wymaga dostępu do stanowiska użytkownika albo
    do ruchu sieciowego, a więc napastnika, który jest już wewnątrz.
    Kategoria niska opisuje to uczciwie: punkt ogranicza pole manewru
    komuś, kto już wszedł, a nie zamyka drogi wejścia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dłuższe okno
    na przejęcie gotowego połączenia o ustalonej tożsamości, bez
    uwierzytelniania się na nowo.
  en: |
    The setting has a file session through which nothing passes for longer than a
    given time suspended.

    A file session does not end when the user closes a file. It goes on, and with it
    goes on the authentication that opened it. The machine remembers who is at the
    other end and does not ask about it again.

    Hence this item's worth. A session hanging without traffic is a ready connection
    of a settled identity - something that can be taken over without authenticating
    afresh. Suspending it after a quarter of an hour shortens the window in which
    that is possible.

    Worth saying how much it really weighs, the item being at times overrated. Taking
    such a session over calls for access to the user's position or to the network
    traffic, and so for an attacker who is already inside. The low category states
    that honestly: the item narrows the room for manoeuvre of somebody who has
    already got in, rather than shutting a road of entry.

    What an attacker gains while the item goes unmet: a longer window for taking over
    a ready connection of a settled identity, without authenticating afresh.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy coś trzyma na tej
    maszynie połączenie plikowe otwarte bez ruchu.

    Zawieszenie sesji nie jest jej zerwaniem i to jest tu rzecz
    najważniejsza. Klient, który po kwadransie znowu czegoś zechce, nawiąże
    połączenie ponownie — sam, bez pytania użytkownika. Widać to najwyżej
    jako krótkie zatrzymanie przy pierwszym odwołaniu.

    Dotyczy to jednak klientów, które umieją to zrobić. Starsze
    oprogramowanie trzymające otwarty plik na udziale bywa napisane tak,
    że zawieszenia nie przeżywa: zgłasza błąd zapisu albo uszkodzenie
    pliku. Dotyczy to zwłaszcza baz danych na plikach i starych aplikacji
    pracujących na udziale sieciowym.

    Drugi przypadek to urządzenia zapisujące na udział — skanery, kamery,
    sterowniki urządzeń przemysłowych. Bywa, że nawiązują połączenie raz
    i po jego zawieszeniu nie próbują ponownie aż do restartu urządzenia.

    Objaw jest wtedy przewrotny: zapis działa przez pierwszy kwadrans po
    uruchomieniu i przestaje działać potem, na zawsze.

    Czego to nie psuje: sesji, przez które cokolwiek przechodzi, logowania,
    drukowania, usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anything
    holds a file connection open on this machine without traffic.

    Suspending a session is not breaking it off, and that is the chief thing here. A
    client that wants something again after a quarter of an hour will make the
    connection anew - itself, without asking the user. It shows at most as a short
    pause at the first call.

    That holds for clients able to do it, all the same. Older software keeping a file
    open on a share is at times written so that it does not survive a suspension: it
    reports a write error or a damaged file. That touches above all file-based
    databases and old applications working on a network share.

    The second case is devices writing to a share - scanners, cameras, controllers of
    industrial equipment. At times they make the connection once and, once it is
    suspended, do not try again until the device is restarted.

    The symptom is then a perverse one: writing works for the first quarter of an
    hour after starting and stops working afterwards, for good.

    What this does not break: sessions through which anything passes, signing in,
    printing, or services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
  what_breaks:
    pl:
      - Starsze oprogramowanie trzymające otwarty plik na udziale może nie przeżyć zawieszenia i zgłosić błąd zapisu albo uszkodzenie pliku
      - Urządzenia zapisujące na udział - skanery, kamery, sterowniki urządzeń - bywa, że po zawieszeniu nie próbują ponownie aż do restartu urządzenia
      - Objaw bywa przewrotny - zapis działa przez pierwszy kwadrans po uruchomieniu i przestaje działać potem
      - Sesje, przez które cokolwiek przechodzi, nie są zawieszane, a zwykły klient nawiązuje połączenie ponownie sam
    en:
      - Older software keeping a file open on a share may not survive the suspension and may report a write error or a damaged file
      - Devices writing to a share - scanners, cameras, equipment controllers - at times do not try again after a suspension until the device is restarted
      - The symptom is at times perverse - writing works for the first quarter of an hour after starting and stops afterwards
      - Sessions through which anything passes are not suspended, and an ordinary client makes the connection anew itself
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na udziale tej maszyny pracuje baza na plikach albo stara aplikacja trzymająca plik otwarty bez ruchu
      - Na udział zapisują urządzenia, które po zawieszeniu sesji nie nawiązują połączenia ponownie
    en:
      - A file-based database or an old application keeping a file open without traffic works on this machine's share
      - Devices write to the share which, once a session is suspended, do not make the connection anew
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is read as a 64-bit number, because the registry keeps it
      # unsigned and the largest possible value stands for never suspending.
      # Reading it as a 32-bit number would turn that into minus one.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'AutoDisconnect'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        else {
          $minutes = [int64]$value
          if ($minutes -ge 4294967295 -or $minutes -lt 0) { 'NEVER' }
          elseif ($minutes -le 15) { 'WITHIN_LIMIT' }
          else { 'OVER_LIMIT ' + $minutes }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_LIMIT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'AutoDisconnect'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Fifteen minutes is the upper limit this item allows. A lower number is
    # also compliant; the largest possible value stands for "never suspend".
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AutoDisconnect' -Value 15 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/microsoft-network-server-amount-of-idle-time-required-before-suspending-session

notes:
  pl: |
    Punkt zamyka blok i jest w nim najsłabszy, co warto powiedzieć wprost.
    Kategoria niska nie jest tu ostrożnością — opisuje rzeczywistą wagę.
    Punkt nie zamyka żadnej drogi wejścia i wymaga do wykorzystania
    napastnika, który jest już wewnątrz.

    Wartość zapisywana to piętnaście minut, ale audyt sprawdza górną
    granicę, a nie równość. Wartość niższa jest zgodna, bo ogranicza okno
    mocniej. Warto to pokazywać, żeby maszyna z ostrzejszym ustawieniem
    nie trafiała do raportu jako niezgodna.

    Ocena ta nabiera znaczenia dopiero w macierzy dwóch osi: ryzyko
    niskie, uciążliwość wymagająca sprawdzenia. Jest to dokładnie pole
    kandydata do świadomego odpuszczenia — i aplikacja ma wprost pozwolić
    tak zdecydować, jeżeli na udziale pracuje coś, co zawieszenia nie
    przeżywa.
  en: |
    The item shuts the block and is the weakest in it, which is worth saying
    outright. The low category is no caution here - it describes the real weight. The
    item shuts no road of entry and calls, to be used, for an attacker already
    inside.

    The value written down is fifteen minutes, but the audit checks an upper limit
    rather than equality. A lower value is compliant, narrowing the window more
    tightly. That is worth showing, so a machine with a sharper setting does not
    reach the report as non-compliant.

    This judgement is worth most in the light of the two-axis matrix: low risk,
    disruption calling for a review. That is exactly the field of a candidate for
    being deliberately let go - and the application is to allow that decision
    outright where something works on the share that does not survive a suspension.
