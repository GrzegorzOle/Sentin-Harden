id: ubuntu2404-tmp-nodev

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.1.2.1.2
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /tmp
  title:
    pl: Opcja nodev ustawiona dla /tmp
    en: Ensure nodev option set on /tmp partition
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Plik urządzenia to wejście do sterownika jądra: kto może go otworzyć, czyta
    lub pisze bezpośrednio po dysku, pamięci albo innym sprzęcie, z pominięciem
    uprawnień zwykłych plików. Opcja nodev sprawia, że jądro nie otwiera urządzeń
    z plików leżących w /tmp. Plik może tam istnieć, ale nie daje dostępu do
    sprzętu.

    /tmp jest otwarty do zapisu dla wszystkich, więc to pierwsze miejsce, do
    którego trafia plik urządzenia przyniesiony w archiwum rozpakowanym przez
    uprzywilejowany program. Kategoria jest niska, bo zwykłe konto nie może
    samo utworzyć pliku urządzenia.

    Na Ubuntu /tmp nie jest domyślnie osobnym punktem montowania, więc dopóki
    nie zostanie spełniony punkt 1.1.2.1.1, wynik brzmi nie dotyczy. Wpis
    tmpfs, który dodaje naprawa tamtego punktu, ma już opcje nodev i nosuid,
    ale nie noexec.
  en: |
    A device file is an entry into a kernel driver: whoever can open it reads or
    writes directly to a disk, memory or other hardware, bypassing the
    permissions of ordinary files. The nodev option makes the kernel refuse to
    open devices from files that sit in /tmp. The file can exist there, but it
    gives no access to hardware.

    /tmp is open for writing to everybody, so it is the first place a device
    file lands when it comes in an archive unpacked by a privileged program.
    The category is low because an ordinary account cannot create a device
    file by itself.

    On Ubuntu /tmp is not a separate mount point by default, so until item
    1.1.2.1.1 is met the result is not applicable. The tmpfs entry that the
    remediation of that item adds already has the nodev and nosuid options,
    but not noexec.

disruption_description:
  pl: |
    Nic nie przestaje działać. Usługi nie trzymają urządzeń w /tmp.

    Zauważy to tylko ktoś, kto buduje w /tmp drzewo innego systemu, np.
    narzędziem debootstrap, bo utworzone tam pliki urządzeń nie dadzą się
    otworzyć. Takie drzewo buduje się wtedy w innym katalogu.

    Zmiana nie wymaga restartu ani wylogowania.
  en: |
    Nothing stops working. Services do not keep devices in /tmp.

    Only somebody who builds the tree of another system in /tmp, for example
    with debootstrap, will notice, because device files created there cannot
    be opened. Such a tree is then built in another directory.

    The change needs no restart and no sign-out.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
  what_breaks:
    pl:
      - Drzewo systemu budowane w /tmp, np. przez debootstrap, ma pliki urządzeń, których nie da się otworzyć po wejściu przez chroot
    en:
      - A system tree built in /tmp, for example by debootstrap, has device files that cannot be opened after entering it with chroot
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    t=/tmp
    o=nodev
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    live=$(findmnt -kn --mountpoint "$t" -o OPTIONS 2>/dev/null | tail -n 1)
    if [ -z "$live" ]; then echo NOT_APPLICABLE; exit 0; fi
    case ",$live," in *",$o,"*) ;; *) echo MISSING; exit 0 ;; esac
    if [ -e /etc/fstab ] && [ ! -r /etc/fstab ]; then echo CHECK_ERROR; exit 0; fi
    src=""
    if [ -d /run/systemd/system ] && command -v systemd-escape >/dev/null 2>&1; then
      unit=$(systemd-escape -p --suffix=mount "$t")
      src=$(systemctl show -P FragmentPath "$unit" 2>/dev/null || true)
    fi
    case "$src" in
      ""|/run/systemd/generator/*) conf=$(findmnt -sn --mountpoint "$t" -o OPTIONS 2>/dev/null | tail -n 1) ;;
      *) conf=$(systemctl cat "$unit" 2>/dev/null | sed -n 's/^Options=//p' | tail -n 1) ;;
    esac
    if [ -n "$conf" ]; then
      case ",$conf," in *",$o,"*) ;; *) echo NOT_PERSISTENT; exit 0 ;; esac
    fi
    echo SET
  expected: '^SET$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      t=/tmp
      o=nodev
      f=/etc/fstab
      mkdir -p "$(dirname '{{backup_file}}')"
      n=$(awk -v t="$t" '$1 !~ /^#/ && $2 == t' "$f" | wc -l)
      opts=$(awk -v t="$t" '$1 !~ /^#/ && $2 == t { print $4 }' "$f" | head -n 1)
      live=$(findmnt -kn --mountpoint "$t" -o OPTIONS | tail -n 1)
      {
        echo "entry=$n"
        case ",$opts," in *",$o,"*) echo option=1 ;; *) echo option=0 ;; esac
        case ",$live," in *",$o,"*) echo live=1 ;; *) echo live=0 ;; esac
        echo ---
        cat "$f"
      } > '{{backup_file}}'
      echo "Saved previous state to {{backup_file}}"
    )

  change_command: |
    (
      set -e
      t=/tmp
      o=nodev
      f=/etc/fstab
      if [ -d /run/systemd/system ] && command -v systemd-escape >/dev/null 2>&1; then
        unit=$(systemd-escape -p --suffix=mount "$t")
        src=$(systemctl show -P FragmentPath "$unit" 2>/dev/null || true)
        case "$src" in
          ""|/run/systemd/generator/*|/usr/lib/systemd/*|/lib/systemd/*|/usr/local/lib/systemd/*) ;;
          *) echo "$t is defined in $src, which takes precedence over $f; add $o there" >&2; exit 1 ;;
        esac
      fi
      n=$(awk -v t="$t" '$1 !~ /^#/ && $2 == t' "$f" | wc -l)
      new=$(mktemp "$f.sentin.XXXXXX")
      trap 'rm -f "$new"' EXIT
      if [ "$n" -gt 1 ]; then
        echo "$f has more than one entry for $t; add $o there by hand" >&2; exit 1
      elif [ "$n" -eq 1 ]; then
        awk -v t="$t" -v o="$o" '
          function fields(s,    k) {
            k = 0
            while (s != "") {
              k++
              if (match(s, /[ \t]+/)) {
                p[k] = substr(s, 1, RSTART - 1); sep[k] = substr(s, RSTART, RLENGTH)
                s = substr(s, RSTART + RLENGTH)
              } else {
                p[k] = s; sep[k] = ""; s = ""
              }
            }
            return k
          }
          $1 !~ /^#/ && $2 == t {
            lead = substr($0, 1, match($0, /[^ \t]/) - 1)
            k = fields(substr($0, length(lead) + 1))
            if (k < 4) { for (i = k + 1; i <= 4; i++) { sep[i - 1] = " "; p[i] = "defaults" } k = 4 }
            if (index("," p[4] ",", "," o ",") == 0) p[4] = p[4] "," o
            line = lead
            for (i = 1; i <= k; i++) line = line p[i] sep[i]
            print line; next
          }
          { print }' "$f" > "$new"
      else
        opts=$(systemctl cat tmp.mount 2>/dev/null | sed -n 's/^Options=//p' | tail -n 1)
        [ -n "$opts" ] || opts=$(sed -n 's/^Options=//p' /usr/share/systemd/tmp.mount 2>/dev/null | tail -n 1)
        opts=$(printf '%s' "$opts" | sed 's/%%/%/g')
        [ -n "$opts" ] || opts=mode=1777,strictatime,nosuid,nodev,size=50%,nr_inodes=1m
        case ",$opts," in *",$o,"*) ;; *) opts="$opts,$o" ;; esac
        line="tmpfs /tmp tmpfs $opts 0 0"
        { awk '{ print }' "$f"; echo "# Sentin-Harden: $t"; printf '%s\n' "$line"; } > "$new"
      fi
      got=$(findmnt -sn --tab-file "$new" --mountpoint "$t" -o OPTIONS)
      case ",$got," in *",$o,"*) ;; *) echo "The new $f does not parse as expected; nothing was changed" >&2; exit 1 ;; esac
      chmod --reference="$f" "$new"
      chown --reference="$f" "$new"
      mv -f "$new" "$f"
      trap - EXIT
      if [ -d /run/systemd/system ]; then systemctl daemon-reload; fi
      vfs=$(findmnt -kn --mountpoint "$t" -o VFS-OPTIONS | tail -n 1)
      mount --options-mode ignore --options-source disable -o "remount,$vfs,$o" "$t"
      echo "Added $o to $t in $f and remounted $t"
    )

  rollback_command: |
    (
      set -e
      t=/tmp
      o=nodev
      f=/etc/fstab
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      entry=$(sed -n 's/^entry=//p' "$b" | head -n 1)
      option=$(sed -n 's/^option=//p' "$b" | head -n 1)
      live=$(sed -n 's/^live=//p' "$b" | head -n 1)
      case "$entry:$option:$live" in
        [01]:[01]:[01]) ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      new=$(mktemp "$f.sentin.XXXXXX")
      trap 'rm -f "$new"' EXIT
      if [ "$entry" = 0 ]; then
        grep -qx "# Sentin-Harden: $t" "$f" || { echo "The entry for $t added earlier is no longer in $f" >&2; exit 1; }
        awk -v m="# Sentin-Harden: $t" -v t="$t" '
          skip && $2 == t { skip = 0; next }
          { skip = 0 }
          $0 == m { skip = 1; next }
          { print }' "$f" > "$new"
      elif [ "$option" = 0 ]; then
        awk -v t="$t" -v o="$o" '
          function fields(s,    k) {
            k = 0
            while (s != "") {
              k++
              if (match(s, /[ \t]+/)) {
                p[k] = substr(s, 1, RSTART - 1); sep[k] = substr(s, RSTART, RLENGTH)
                s = substr(s, RSTART + RLENGTH)
              } else {
                p[k] = s; sep[k] = ""; s = ""
              }
            }
            return k
          }
          $1 !~ /^#/ && $2 == t {
            lead = substr($0, 1, match($0, /[^ \t]/) - 1)
            k = fields(substr($0, length(lead) + 1))
            n = split(p[4], a, ","); s = ""
            for (i = 1; i <= n; i++) if (a[i] != o) s = s (s == "" ? "" : ",") a[i]
            p[4] = (s == "" ? "defaults" : s)
            line = lead
            for (i = 1; i <= k; i++) line = line p[i] sep[i]
            print line; next
          }
          { print }' "$f" > "$new"
      else
        rm -f "$new"; trap - EXIT
        echo "$o was already in $f before the change; nothing to restore"; exit 0
      fi
      chmod --reference="$f" "$new"
      chown --reference="$f" "$new"
      mv -f "$new" "$f"
      trap - EXIT
      if [ -d /run/systemd/system ]; then systemctl daemon-reload; fi
      if [ "$live" = 0 ]; then
        vfs=$(findmnt -kn --mountpoint "$t" -o VFS-OPTIONS | tail -n 1)
        mount --options-mode ignore --options-source disable -o "remount,$vfs,dev" "$t"
      fi
      echo "Removed $o from $t in $f"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/fstab.5.html
  - https://man7.org/linux/man-pages/man8/mount.8.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.mount.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html

notes:
  pl: |
    Sprawdzenie patrzy w dwa miejsca. Najpierw na bieżące montowanie, bo tylko
    ono działa teraz, a potem na zapis, z którego montowanie powstanie przy
    następnym starcie. Tym zapisem jest wpis w /etc/fstab, chyba że katalog
    montuje plik jednostki systemd w /etc/systemd/system albo w /run, który ma
    pierwszeństwo przed fstab; jednostkę z /usr/lib/systemd test bierze pod
    uwagę tylko wtedy, gdy fstab nie ma wpisu. Opcja obecna tylko w bieżącym
    montowaniu daje wynik niespełniony, bo zniknie po restarcie.

    Gdy /tmp nie jest osobnym punktem montowania, wynik to nie dotyczy: opcji nie
    ma gdzie ustawić, a brak osobnej partycji zgłasza punkt o partycji.

    Naprawa dopisuje opcję do wpisu w /etc/fstab i od razu montuje katalog
    ponownie z nową opcją. Gdy katalog montuje jednostka z /etc/systemd/system
    lub /run, naprawa kończy się błędem bez zmian i wskazuje ten plik, bo wpis
    w fstab i tak nie zostałby użyty. Zmieniony plik jest najpierw zapisywany
    obok i czytany przez findmnt; jeśli nie daje oczekiwanego wyniku, oryginał
    zostaje nietknięty. Wycofanie usuwa tylko tę jedną opcję, a nie przywraca
    całego pliku, więc nie cofa zmian w innych wpisach wprowadzonych
    w międzyczasie.

    Jeśli /etc/fstab nie ma wpisu dla /tmp, naprawa dodaje go, poprzedzony
    komentarzem „# Sentin-Harden: /tmp”, z opcjami, z jakimi systemd montuje ten
    katalog domyślnie, i z dodaną opcją. Wycofanie tej reguły usuwa cały dodany
    wpis razem z opcjami dopisanymi do niego później przez inne reguły, dlatego
    reguły tego katalogu należy wycofywać w odwrotnej kolejności niż
    stosowanie.
  en: |
    The check looks in two places. First at the current mount, because only that
    is in effect now, then at the record the mount will come from at the next
    start. That record is the entry in /etc/fstab, unless a systemd unit file in
    /etc/systemd/system or in /run mounts the directory, which takes precedence
    over fstab; the test uses a unit from /usr/lib/systemd only when fstab has no
    entry. An option present only in the current mount gives a non-compliant
    result, because it will disappear after a restart.

    When /tmp is not a separate mount point, the result is not applicable: there
    is nowhere to set the option, and the missing partition is reported by the
    partition item.

    The remediation adds the option to the entry in /etc/fstab and at once
    remounts the directory with the new option. When a unit in
    /etc/systemd/system or /run mounts the directory, the remediation fails
    without changes and names that file, because an fstab entry would not be used
    anyway. The changed file is first written next to the original and read back
    with findmnt; if that does not give the expected result, the original stays
    untouched. Rollback removes only this one option rather than restoring the
    whole file, so it does not undo changes to other entries made in the
    meantime.

    If /etc/fstab has no entry for /tmp, the remediation adds one, preceded by the
    comment "# Sentin-Harden: /tmp", with the options systemd mounts the directory
    with by default, plus the new option. Rolling back this rule removes the
    whole added entry together with options added to it later by other rules, so
    the rules for this directory should be rolled back in the reverse order of
    applying them.
