id: win2016-web-publishing-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa publikowania stron w sieci wyłączona
    en: The service publishing pages on the web disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przyjmuje żądania sieciowe kierowane do tej maszyny i obsługuje
    witryny, które są na niej opublikowane.

    Reguła nie mówi, że serwer sieciowy jest niebezpieczny. Mówi, że nie
    powinien pracować tam, gdzie nikt go nie zamawiał — a tak bywa częściej,
    niż się przyjmuje. Serwer sieciowy pojawia się na maszynie na trzy
    sposoby i tylko pierwszy jest świadomy.

    Sposób drugi to instalator aplikacji, który włącza rolę serwera
    sieciowego, bo potrzebuje jej do własnego panelu administracyjnego albo
    do jednej strony pomocniczej. Sposób trzeci to rola dołożona przy
    konfigurowaniu czegoś innego i pozostawiona po tym, jak przestała być
    potrzebna.

    W obu przypadkach maszyna nasłuchuje na porcie otwartym dla całej sieci,
    a treść, którą podaje, nie była przez nikogo przeglądana. Domyślne
    witryny, strony błędów i katalogi pomocnicze mówią przy tym o maszynie
    więcej, niż powinny: wersję, ścieżki, czasem nazwy składników.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: punkt
    nasłuchu odpowiadający na żądania z sieci, oparty o treść, której nikt
    nie przejrzał, i o składniki, o których właściciel maszyny może nie
    wiedzieć.
  en: |
    The service takes in web requests directed to this machine and serves the sites
    published on it.

    The rule does not say a web server is dangerous. It says it should not work where
    nobody ordered it - and that happens oftener than is supposed. A web server appears
    on a machine in three ways and only the first is a knowing one.

    The second way is an application installer switching the web server role on, needing
    it for its own administrative panel or for one helper page. The third is a role added
    while something else was being set up and left in place once it ceased to be needed.

    In both cases the machine listens on a port open to the whole network, and the
    content it serves has been looked over by nobody. Default sites, error pages and
    helper directories say besides more about the machine than they should: a version,
    paths, at times the names of components.

    What an attacker gains while the item goes unmet: a listening point answering
    requests from the network, resting on content nobody has looked over and on
    components the machine's owner may not know of.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo jeżeli maszyna cokolwiek
    publikuje, wyłączenie zatrzymuje to wszystko naraz.

    Sprawdzenie jest tu proste i konieczne: trzeba zobaczyć listę witryn
    i listę pul aplikacji, zanim cokolwiek się zatrzyma. Lista pusta albo
    zawierająca wyłącznie witrynę domyślną znaczy, że serwer nie obsługuje
    niczego i wdrożenie nikogo nie dotknie.

    Trudność polega na przypadku pośrednim, który zdarza się najczęściej.
    Witryna wygląda na domyślną, bo nosi domyślną nazwę, ale pod jednym
    z katalogów pracuje panel administracyjny aplikacji, którą ktoś
    zainstalował trzy lata temu. Zatrzymanie usługi odbiera wtedy dostęp do
    narzędzia, o którego istnieniu nikt nie pamiętał — do dnia, w którym
    było potrzebne.

    Drugi przypadek dotyczy aplikacji sięgających do własnego składnika
    przez adres lokalny. Taka aplikacja nie wygląda na sieciową i nikt nie
    szuka dla niej serwera, a przestaje działać razem z nim.

    Zatrzymanie usługi zatrzymuje wszystkie witryny naraz. Nie ma tu
    stopniowania i nie da się wyłączyć jednej, zostawiając pozostałe —
    do tego służy zatrzymanie pojedynczej witryny, nie tej reguły.

    Czego to nie psuje: pracy maszyny poza serwerem sieciowym, udziałów,
    uwierzytelniania, zarządzania zdalnego, pulpitu zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", since if the machine publishes anything at
    all, switching it off stops all of it at once.

    The review here is simple and necessary: the list of sites and the list of
    application pools have to be seen before anything is stopped. An empty list, or one
    holding only the default site, means the server serves nothing and the rollout will
    touch nobody.

    The difficulty lies in the middle case, which happens oftenest. A site looks like the
    default one, bearing the default name, but under one of its directories works the
    administrative panel of an application somebody installed three years ago. Stopping
    the service then takes away access to a tool nobody remembered existed - until the day
    it was needed.

    The second case concerns applications reaching their own component by a local
    address. Such an application does not look like a web one and nobody seeks a server
    for it, and it stops working along with the server.

    Stopping the service stops all the sites at once. There is no grading here and one
    cannot be switched off with the rest left running - that is what stopping a single
    site is for, not this rule.

    What this does not break: the machine's working beyond the web server, shares,
    authentication, remote management, or the remote desktop.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Wszystkie witryny opublikowane na tej maszynie zatrzymują się naraz, bez możliwości zostawienia jednej z nich
      - Panel administracyjny aplikacji ukryty pod katalogiem witryny domyślnej przestaje być osiągalny
      - Aplikacje sięgające do własnego składnika przez adres lokalny przestają działać, choć nie wyglądają na sieciowe
      - Praca maszyny poza serwerem sieciowym, udziały i uwierzytelnianie pozostają bez zmian
    en:
      - All the sites published on this machine stop at once, with no chance of leaving one of them running
      - An application's administrative panel hidden under a directory of the default site ceases to be reachable
      - Applications reaching their own component by a local address stop working, though they do not look like web ones
      - The machine's working beyond the web server, shares and authentication stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna publikuje witrynę używaną przez ludzi albo przez inne systemy i nie wskazano dla niej zamiennika
      - Aplikacja zainstalowana na tej maszynie sięga do własnego składnika przez adres lokalny obsługiwany tą usługą
    en:
      - The machine publishes a site used by people or by other systems and no replacement has been named for it
      - An application installed on this machine reaches its own component by a local address served by this service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'W3SVC' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # If this machine serves any site, this stops all of them at once - also the
    # ones put up by an application installer without anybody being told.
    Stop-Service -Name 'W3SVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'W3SVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'W3SVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

notes:
  pl: |
    Punkt otwiera blok o usługach nasłuchujących na porcie — takich, które
    czekają, aż ktoś się do nich odezwie, zamiast same sięgać na zewnątrz.
    Blok poprzedni dotyczył dróg wychodzących; ten dotyczy wejść.

    Rzecz, którą warto przy tym punkcie powiedzieć wprost, brzmi: reguła
    nie jest wymierzona w serwer sieciowy. Maszyna, która ma publikować,
    niech publikuje — wtedy punkt jest wyjątkiem uzasadnionym i tak trzeba
    go zapisać. Reguła jest wymierzona w serwer, który pojawił się sam.

    Aplikacja powinna tu pokazać w podglądzie coś więcej niż polecenie.
    Lista witryn i pul aplikacji jest odpowiedzią na pytanie, czy wykonanie
    będzie miało skutek, i można ją odczytać w czasie audytu. Bez niej opis
    straszy równie mocno maszynę pustą, co maszynę pracującą, a to jest
    dokładnie ten rodzaj ostrzeżenia, który uczy ludzi klikać dalej bez
    czytania.
  en: |
    The item opens the block about services listening on a port - those that wait for
    somebody to speak to them rather than reaching outward themselves. The previous block
    concerned outgoing roads; this one concerns ways in.

    The thing worth saying outright at this item runs: the rule is not aimed at the web
    server. Let a machine meant to publish publish - the item is then a warranted
    exception and should be recorded as one. The rule is aimed at a server that appeared
    of itself.

    The application should show here in the preview something more than a command. The
    list of sites and application pools is the answer to the question whether the
    execution will have any consequence, and it can be read at the time of the audit.
    Without it the description frightens an empty machine as hard as a working one, and
    that is exactly the kind of warning which teaches people to click on without reading.
