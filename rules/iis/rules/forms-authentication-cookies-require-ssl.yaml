id: iis-forms-authentication-cookies-require-ssl

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: ASP.NET Configuration Recommendations
  title:
    pl: Ciasteczko uwierzytelniania formularzowego wysyłane wyłącznie połączeniem szyfrowanym
    en: The forms authentication cookie is sent only over an encrypted connection

platform:
  system: iis

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Po zalogowaniu przez formularz aplikacja wydaje ciasteczko, które od tej pory
    zastępuje hasło — każde kolejne żądanie niosące to ciasteczko jest traktowane
    jako żądanie zalogowanego użytkownika. To ustawienie rozstrzyga, czy
    przeglądarce wolno wysyłać je połączeniem nieszyfrowanym.

    Co to odbiera atakującemu: przechwycone ciasteczko uwierzytelniania jest tym
    samym co przechwycone hasło, tylko wygodniejszym — nie wymaga logowania,
    działa od razu i nie zostawia śladu nieudanych prób. Bez tego ustawienia
    wystarczy, że użytkownik trafi na jeden odnośnik bez szyfrowania — obrazek,
    przekierowanie, stary link w zakładkach — a przeglądarka dołoży ciasteczko do
    żądania idącego otwartym tekstem. Nasłuch w tej samej sieci, punkt dostępowy
    w kawiarni albo urządzenie pośredniczące po drodze wystarczą, żeby je zabrać.

    Po zmianie przeglądarka nie wyśle ciasteczka połączeniem nieszyfrowanym
    w ogóle, więc taka droga przejęcia sesji przestaje istnieć — niezależnie od
    tego, czy aplikacja o nieszyfrowane żądania sama prosi.
  en: |
    After signing in through a form the application issues a cookie that from
    then on stands in for the password - every further request carrying it is
    taken as a request from a signed-in user. This setting decides whether the
    browser may send it over an unencrypted connection.

    What it takes away from an attacker - an intercepted authentication cookie is
    the same as an intercepted password, only handier - it needs no sign-in,
    works at once and leaves no trace of failed attempts. Without this setting it
    is enough for the user to hit one unencrypted link - an image, a redirect, an
    old bookmark - and the browser will attach the cookie to a request going in
    the clear. Listening on the same network, an access point in a cafe or an
    intermediate device along the way is enough to take it.

    After the change the browser does not send the cookie over an unencrypted
    connection at all, so that road to taking over a session stops existing -
    whether or not the application asks for unencrypted requests itself.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia, bo jej skutkiem na witrynie bez pełnego
    szyfrowania jest pętla logowania, a nie komunikat o błędzie.

    Mechanizm jest prosty i dlatego nieprzyjemny: użytkownik loguje się, dostaje
    ciasteczko, po czym trafia na stronę serwowaną bez szyfrowania. Przeglądarka
    ciasteczka nie wysyła, aplikacja uznaje żądanie za nieuwierzytelnione
    i przekierowuje na formularz logowania. Użytkownik loguje się ponownie, z tym
    samym skutkiem. Nikt nie zobaczy informacji, że przyczyną jest brak szyfrowania.

    Dlatego kolejność jest tu jednoznaczna: najpierw cała witryna, łącznie
    z zasobami pobocznymi, musi być dostępna wyłącznie przez połączenie szyfrowane,
    a dopiero potem to ustawienie. Odwrotna kolejność wyłącza logowanie wszystkim
    naraz.

    Osobno sprawdź integracje logujące się do aplikacji programowo oraz
    środowiska testowe, które szyfrowania nie mają wcale — tam zmiana zablokuje
    dostęp natychmiast.
  en: |
    The change calls for a planned rollout, because on a site without full
    encryption its effect is a sign-in loop rather than an error message.

    The mechanism is simple and for that reason unpleasant - the user signs in,
    gets the cookie, then reaches a page served without encryption. The browser
    does not send the cookie, the application takes the request as
    unauthenticated and redirects to the sign-in form. The user signs in again,
    to the same effect. Nobody sees a word about the missing encryption being the
    cause.

    So the order here is unambiguous - first the whole site, side resources
    included, has to be reachable only over an encrypted connection, and only
    then this setting. The other order locks everybody out at once.

    Check separately for integrations signing in to the application
    programmatically, and for test environments with no encryption at all - there
    the change blocks access immediately.

implementation_consequences:
  impact_areas:
    - web-server-services
    - encryption-and-tls
  what_breaks:
    pl:
      - Witryna dostępna choćby częściowo bez szyfrowania wpadnie w pętlę logowania, bo ciasteczko nie dotrze do aplikacji
      - Użytkownik nie zobaczy przyczyny, tylko powracający formularz logowania, więc zgłoszenie trafi jako awaria logowania
      - Integracje logujące się programowo przez połączenie nieszyfrowane stracą dostęp bez czytelnego błędu
      - Środowiska testowe i wewnętrzne bez certyfikatu przestaną pozwalać na zalogowanie
      - Zasoby poboczne serwowane bez szyfrowania, na przykład obrazki i skrypty ze starych odnośników, wywołają ten sam skutek co strona główna
    en:
      - A site reachable even partly without encryption falls into a sign-in loop, since the cookie never arrives at the application
      - The user sees no cause, only the sign-in form returning, so the report comes in as a broken sign-in
      - Integrations signing in programmatically over an unencrypted connection lose access with no readable error
      - Test and internal environments with no certificate stop allowing anybody to sign in
      - Side resources served without encryption, images and scripts from old links say, produce the same effect as the main page
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Witryny dostępne choćby częściowo przez połączenie nieszyfrowane, dopóki cały ruch nie zostanie przeniesiony na szyfrowany
      - Środowiska bez certyfikatu, w tym testowe i wewnętrzne
      - Aplikacje z integracjami logującymi się programowo bez szyfrowania
    en:
      - Sites reachable even partly over an unencrypted connection, until all traffic has been moved to an encrypted one
      - Environments with no certificate, test and internal ones included
      - Applications with integrations signing in programmatically without encryption
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          # Read from the framework root, where this section may be set as a
          # server-wide default. The server configuration file does not declare
          # this section group at all.
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
            -Filter 'system.web/authentication/forms' -Name 'requireSSL' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([bool]$value) { 'REQUIRED' }
          else { 'NOT_REQUIRED' }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # This setting lives in the framework root configuration and not in the
    # server configuration file, so the server's own backup mechanism does not
    # cover it. The file itself is copied instead - both variants of it,
    # because a 32-bit application pool reads a different copy than a 64-bit
    # one does.
    $files = @()
    foreach ($base in @('Framework', 'Framework64')) {
      $source = Join-Path $env:windir ('Microsoft.NET\' + $base + '\v4.0.30319\Config\web.config')
      if (Test-Path $source) {
        $copy = '{{backup_file}}' + '.' + $base + '.web.config'
        Copy-Item -Path $source -Destination $copy -Force
        $files += [pscustomobject]@{ source = $source; copy = $copy }
      }
    }
    if ($files.Count -eq 0) {
      throw 'The framework root configuration was not found, so nothing was secured and nothing may be changed.'
    }
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/authentication/forms' -Name 'requireSSL' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'framework-root'
      filter  = 'system.web/authentication/forms'
      name    = 'requireSSL'
      value   = [string]$value
      existed = ($null -ne $value)
      files   = $files
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and copied the framework root configuration"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # The write goes to the framework root configuration, which is where this
    # section may be set as a server-wide default. The server configuration
    # file does not declare this section group at all, so a write aimed there
    # fails rather than taking effect quietly.
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT' `
      -Filter 'system.web/authentication/forms' -Name 'requireSSL' -Value $true

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    # The whole file goes back rather than one attribute being rewritten. The
    # copy taken before the change is the only complete record of what the
    # framework root configuration held, and putting it back cannot leave the
    # file half restored.
    foreach ($f in $b.files) {
      if (-not (Test-Path $f.copy)) {
        throw 'A copy recorded in the backup file is missing, so nothing was restored.'
      }
    }
    foreach ($f in $b.files) {
      Copy-Item -Path $f.copy -Destination $f.source -Force
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/dotnet/api/system.web.configuration.formsauthenticationconfiguration.requiressl

notes:
  pl: |
    Ustawienie działa po stronie przeglądarki — serwer oznacza ciasteczko, a
    przeglądarka odmawia wysłania go połączeniem nieszyfrowanym. Aplikacja, która
    wydaje własne ciasteczko sesji poza mechanizmem formularzowym, nie jest tym
    objęta i wymaga osobnego sprawdzenia.

    Zapis idzie do konfiguracji głównej środowiska uruchomieniowego, czyli
    domyślnej dla całego serwera. Aplikacja z własnym wpisem w swoim pliku
    konfiguracyjnym nadpisuje tę wartość i wymaga poprawki u siebie.
  en: |
    The setting works on the browser side - the server marks the cookie and the
    browser refuses to send it over an unencrypted connection. An application
    issuing a session cookie of its own outside the forms mechanism is not
    covered by it and calls for a separate look.

    The write goes to the framework root configuration, that is, the default for
    the whole server. An application with an entry of its own in its
    configuration file overrides that value and calls for a correction there.
