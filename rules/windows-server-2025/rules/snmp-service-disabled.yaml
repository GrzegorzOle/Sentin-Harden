id: win2025-snmp-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania siecią starszym protokołem wyłączona
    en: The service managing the network by an older protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę udostępniającą stan maszyny starszym protokołem
    zarządzania siecią. Usługa ta odpowiada na pytania zadawane z sieci
    o to, co na maszynie działa i jak jej się wiedzie.

    Zostawiam kategorię wysoką, choć usługa niczego nie uruchamia
    i nikogo nie wpuszcza. Powodem jest sposób, w jaki sprawdza, komu
    odpowiada. Uwierzytelnieniem jest w starszych wersjach tego protokołu
    zwykły ciąg znaków wspólny dla wielu urządzeń, przesyłany otwartym
    tekstem i w praktyce bardzo często pozostawiony w postaci domyślnej.
    Jest to więc hasło, które nie jest hasłem: nie jest przypisane do
    nikogo, nie zmienia się i nie zostawia śladu przy użyciu.

    Odpowiedź, którą można za ten ciąg dostać, jest wartościowa. To
    wykaz zainstalowanego oprogramowania wraz z wersjami, wykaz kont,
    wykaz uruchomionych usług, ustawienia sieciowe i tablica połączeń.
    Jest to rozpoznanie, które zwykle wymaga wejścia na maszynę, tu
    dostępne przez zapytanie z sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny
    obraz maszyny za cenę ciągu znaków, który zwykle jest domyślny i tak
    czy owak widoczny w ruchu sieciowym.
  en: |
    The item switches off the service that deals out the state of the machine by an older reckoning
    of the ruling of the net. That service answers askings put from the net as to what works upon the
    machine and how it fares.

    I leave the category high, though the service runs nothing and lets nobody in. The ground is the
    way it looks to whom it answers. The knowing of one is, in the older makes of that reckoning, a
    plain string of marks shared by many devices, borne in open writing and in deed very often left
    as it came. It is therefore a word of passing that is no word of passing - it is set to nobody,
    it alters not and it leaves no trace at its using.

    The answer to be had for that string is worth having. It is a writing out of the installed
    software with its makes, a writing out of standings, a writing out of the services that run, the
    settings of the net and the board of bindings. It is a spying out that mostly takes a coming onto
    the machine, here to be had by an asking off the net.

    What an attacker gains while the item goes unmet - a full likeness of the machine for the price
    of a string of marks that is mostly the one it came with and is in any case seen in the traffic of
    the net.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać, dlaczego niżej
    niż przy większości usług sieciowych w tej grupie — bo różnica opiera
    się na czymś, co warto umieć rozpoznawać także poza tą regułą.

    Skutek zmiany jest jeden i przewidywalny: maszyna znika z monitorowania
    prowadzonego tym protokołem. Brzmi to jak przypadek zdalnego rejestru,
    opisany osobnym punktem, gdzie właśnie zniknięcie z monitorowania
    kazało zostawić regułę poza trybem zbiorczym. Tutaj jest jednak
    odwrotnie i różnica jest istotna.

    Monitorowanie tym protokołem z natury odpytuje urządzenia w stałych
    odstępach i z natury zgłasza alarm, gdy urządzenie przestaje
    odpowiadać — bo dokładnie po to zostało postawione. Skutek jest więc
    głośny, pojawia się w ciągu minut i wskazuje wprost na maszynę,
    której dotyczy. Jest to najlepszy możliwy rodzaj skutku zmiany:
    natychmiastowy, jednoznaczny i widoczny dla właściwego zespołu.

    Sprawdzenie jest zatem proste i sprowadza się do ustalenia, czy ta
    maszyna jest odpytywana tą drogą — a jeżeli tak, to czy chodzi o zwykłe
    zbieranie danych o wydajności, czy o coś, na czym opiera się reakcja
    na awarie. To drugie zasługuje na uprzedzenie zespołu, nie na ciche
    wyłączenie.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I leave the class "needs a checking" and would name why it is lower than at most of the services
    of the net in this group - the difference standing upon a thing worth knowing how to mark also
    beyond this rule.

    The outcome of the change is one and may be foreseen - the machine goes out of sight of the
    watching led by that reckoning. It sounds like the case of the far-off registry, set forth in an
    item of its own, where it was just that going out of sight which bade the rule be left out of the
    bulk mode. Here, though, it is the other way about, and the difference weighs.

    A watching by that reckoning asks devices of its nature at set spans and of its nature raises an
    alarm when a device stops answering - it having been set up for that very thing. The outcome is
    therefore loud, comes forth within minutes and points straight at the machine it bears on. It is
    the best kind of outcome a change could have - at once, of one meaning, and seen by the right
    band.

    The checking is thus plain and comes to the settling whether that machine is asked by that road -
    and if so, whether it be a common gathering of data of how it fares, or a thing whereon the
    answering to faults stands. The latter earns a foretelling to the band and not a still switching
    off.

    The change is undone at once and takes the starting of the service again.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Maszyna znika z monitorowania prowadzonego tym protokołem
      - Zbieranie danych o wydajności i obciążeniu tą drogą przestaje działać
      - Monitorowanie zgłasza alarm o braku odpowiedzi w ciągu minut od zmiany
      - Alarm wskazuje wprost na tę maszynę, więc skutek jest głośny i jednoznaczny
      - Jeżeli na tych danych opiera się reakcja na awarie, zespół należy uprzedzić przed zmianą
    en:
      - The machine goes out of sight of the watching led by that reckoning
      - The gathering of data of how it fares and how laden it is by that road stops working
      - The watching raises an alarm of no answer within minutes of the change
      - The alarm points straight at that machine, so the outcome is loud and of one meaning
      - If the answering to faults stands upon those data, the band is to be foretold before the change
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na danych zbieranych tą drogą opiera się reakcja na awarie i zespół nie został uprzedzony
    en:
      - The answering to faults stands upon the data gathered by that road and the band was not foretold
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # This service comes from an optional component. Where the component was
        # never added, a bare key without a startup value is left behind - that
        # is an absent service, not an unreadable one.
        if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service removes the machine from any monitoring that reaches
    # it by this protocol. Unlike agentless registry monitoring, that monitoring
    # alarms within minutes - the loss is loud, not silent.
    Stop-Service -Name 'SNMP' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SNMP' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SNMP' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/snmp/snmp-top

notes:
  pl: |
    Kategoria wysoka, choć usługa niczego nie uruchamia i nikogo nie
    wpuszcza. Powodem jest sposób uwierzytelnienia: w starszych wersjach
    tego protokołu jest nim zwykły ciąg znaków wspólny dla wielu
    urządzeń, przesyłany otwartym tekstem i bardzo często pozostawiony
    domyślny. Hasło, które nie jest hasłem — nie jest przypisane do
    nikogo, nie zmienia się i nie zostawia śladu przy użyciu.

    Różnica wobec zdalnego rejestru, gdzie zniknięcie z monitorowania
    kazało zostawić regułę poza trybem zbiorczym: monitorowanie tym
    protokołem z natury alarmuje, gdy urządzenie przestaje odpowiadać.
    Skutek jest głośny, pojawia się w ciągu minut i wskazuje wprost na
    maszynę — i dlatego klasa jest tu niższa.

    Gałąź NOT_APPLICABLE przy braku wartości startowej jest zamierzona:
    usługa pochodzi ze składnika opcjonalnego, a sam klucz bez wartości
    zostaje po składniku, którego nigdy nie dodano.
  en: |
    The category is high, though the service runs nothing and lets nobody in. The ground is the way
    one is known to it - in the older makes of that reckoning it is a plain string of marks shared by
    many devices, borne in open writing and very often left as it came. A word of passing that is no
    word of passing - it is set to nobody, it alters not and it leaves no trace at its using.

    The difference from the far-off registry, where the going out of sight of the watching bade the
    rule be left out of the bulk mode - a watching by that reckoning of its nature alarms when a
    device stops answering. The outcome is loud, comes forth within minutes and points straight at the
    machine - and therefore the class is here the lower.

    The NOT_APPLICABLE branch at a wanting starting value is meant - the service comes of an optional
    piece, and a bare key without a value is what is left behind by a piece that was never added.
