id: ubuntu2404-prelink-not-installed

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.5.4
  section: Initial Setup > Configure Additional Process Hardening
  title:
    pl: Program prelink nie jest zainstalowany
    en: Ensure prelink is not installed
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    prelink zapisuje w plikach programów i bibliotek z góry wyliczone adresy
    bibliotek, żeby przyspieszyć start programów. Zmienia przy tym same pliki
    binarne, więc narzędzia kontroli integralności, takie jak AIDE czy debsums,
    widzą je jako zmienione, a stałe adresy osłabiają losowe rozmieszczenie
    pamięci (ASLR). Biblioteka glibc w Ubuntu 24.04 nie korzysta już z tych
    danych, więc program nie daje żadnej korzyści.

    Punkt wymaga, żeby pakietu prelink nie było w systemie, także w stanie
    samych plików konfiguracyjnych po zwykłym usunięciu. Ubuntu go domyślnie
    nie instaluje.
  en: |
    prelink writes precomputed library addresses into program and library
    files to speed up program start. In doing so it changes the binary files
    themselves, so integrity checking tools such as AIDE or debsums see them as
    modified, and fixed addresses weaken address space layout randomization
    (ASLR). The glibc library in Ubuntu 24.04 no longer uses this data, so the
    program brings no benefit.

    The item requires the prelink package to be absent, also in the state of
    configuration files only that a plain removal leaves. Ubuntu does not
    install it by default.

disruption_description:
  pl: |
    Nikt tego nie zauważy: Ubuntu domyślnie nie instaluje prelink, a na
    Ubuntu 24.04 i tak nie przyspiesza on startu programów.
  en: |
    Nobody will notice: Ubuntu does not install prelink by default, and on
    Ubuntu 24.04 it no longer speeds up program start anyway.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v dpkg-query >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    st() { dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null || true; }
    found=""
    for p in prelink; do
      s=$(st "$p")
      case "$s" in ""|not-installed) ;; installed) found="$found,$p" ;; *) found="$found,$p:$s" ;; esac
    done
    if [ -n "$found" ]; then echo "INSTALLED:${found#,}"; else echo NOT_INSTALLED; fi
  expected: '^NOT_INSTALLED$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e -o pipefail
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      st() { dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null || true; }
      keep=""
      for p in prelink; do
        case "$(st "$p")" in ""|not-installed) continue ;; esac
        for f in $(dpkg-query -W -f='${Conffiles}\n' "$p" | awk '{ print $1 }'); do
          if [ -e "$f" ] || [ -L "$f" ]; then keep="$keep ${f#/}"; fi
        done
      done
      data=-
      if [ -n "$keep" ]; then data=$(tar -C / -czf - $keep | base64 -w 0); fi
      {
        echo format=dpkg-off-1
        for p in prelink; do s=$(st "$p"); echo "pkg $p ${s:-not-installed}"; done
        echo "conffiles $data"
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      st() { dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null || true; }
      rm=""
      for p in prelink; do case "$(st "$p")" in ""|not-installed) ;; *) rm="$rm $p" ;; esac; done
      if [ -z "$rm" ]; then echo "Nothing to remove"; exit 0; fi
      # apt-get also removes the packages that depend on these; do not take them along.
      extra=$(LC_ALL=C apt-get -s purge $rm | awk '$1 == "Purg" || $1 == "Remv" { sub(/:.*/, "", $2); print $2 }' |
        grep -vxF -e prelink || true)
      if [ -n "$extra" ]; then
        echo "Removing$rm would also remove: $(echo $extra); nothing changed" >&2; exit 1
      fi
      if command -v prelink >/dev/null 2>&1; then prelink -ua; fi
      export DEBIAN_FRONTEND=noninteractive
      apt-get purge -y -qq $rm
      for p in $rm; do
        case "$(st "$p")" in ""|not-installed) ;; *) echo "$p is still installed" >&2; exit 1 ;; esac
      done
      echo "Removed and purged:$rm"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=dpkg-off-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      [ "$(sed -n 's/^pkg \([^ ]*\) .*/\1/p' "$b" | tr '\n' ' ')" = "prelink " ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      data=$(sed -n 's/^conffiles //p' "$b")
      case "$data" in ""|*[!A-Za-z0-9+/=-]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      st() { dpkg-query -W -f='${db:Status-Status}' "$1" 2>/dev/null || true; }
      inst=""; cfonly=""
      while read -r tag p s x; do
        case "$s" in ""|*[!a-z-]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        [ -z "$x" ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
        [ "$s" != not-installed ] || continue
        case "$(st "$p")" in ""|not-installed) ;; *) continue ;; esac
        inst="$inst $p"
        [ "$s" = installed ] || cfonly="$cfonly $p"
      done < <(grep '^pkg ' "$b")
      if [ -z "$inst" ]; then echo "Nothing to restore"; exit 0; fi
      export DEBIAN_FRONTEND=noninteractive
      o="-y -qq -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
      # Stale package lists end in a download error; refresh them once and retry.
      if ! apt-get install $o $inst; then apt-get update -qq; apt-get install $o $inst; fi
      # The configuration files as they were, with the administrator's changes.
      if [ "$data" != - ]; then printf '%s' "$data" | base64 -d | tar -C / -xzf -; fi
      # A package that only had its configuration files left goes back to that state.
      if [ -n "$cfonly" ]; then dpkg -r $cfonly >/dev/null; fi
      echo "Installed again:$inst"
    )

privileges: root
runnable: true

sources:
  - https://manpages.ubuntu.com/manpages/noble/man8/prelink.8.html
  - https://manpages.ubuntu.com/manpages/noble/man1/dpkg-query.1.html
  - https://manpages.ubuntu.com/manpages/noble/man8/apt-get.8.html

notes:
  pl: |
    Sprawdzenie odczytuje stan pakietu z dpkg-query. Wynik INSTALLED podaje
    pakiet, a przy stanie innym niż installed także ten stan, np.
    prelink:config-files.

    Naprawa najpierw wykonuje prelink -ua, które przywraca pierwotną postać
    plików zmienionych przez prelink, a potem usuwa pakiet z plikami
    konfiguracyjnymi poleceniem apt-get purge. Kończy się błędem bez zmian,
    jeśli razem z nim musiałyby zniknąć inne pakiety. Kopia zapisuje stan
    pakietu i jego pliki konfiguracyjne; wycofanie instaluje go ponownie
    i przywraca te pliki, ale nie zmienia z powrotem plików programów.
  en: |
    The check reads the package state from dpkg-query. The INSTALLED result
    gives the package and, for a state other than installed, the state too,
    for example prelink:config-files.

    The remediation first runs prelink -ua, which restores the original form of
    the files prelink changed, and then removes the package with its
    configuration files with apt-get purge. It ends with an error without
    changes if other packages would have to go with it. The backup records the
    package state and its configuration files; rollback installs it again and
    restores these files, but does not change the program files back.
