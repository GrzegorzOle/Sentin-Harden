id: win11-rdp-clipboard-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie schowka w sesji pulpitu zdalnego wyłączone
    en: Clipboard redirection in Remote Desktop sessions disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Schowek wspólny dla obu stron sesji jest najkrótszą drogą przeniesienia
    danych między maszyną zdalną a tą, przy której ktoś siedzi. Nie wymaga
    zapisania pliku, nie zostawia go nigdzie po drodze i nie przechodzi przez
    nic, co pilnuje wynoszenia danych — dla sieci jest częścią sesji pulpitu
    zdalnego, tak samo jak obraz ekranu.

    Dlatego jest drogą wybieraną najczęściej. Kto uzyskał dostęp do maszyny
    zdalnej, kopiuje z niej zawartość bazy, plik konfiguracyjny albo zapisane
    poświadczenia i wkleja je u siebie — bez pobierania pliku, bez połączenia
    wychodzącego, bez śladu innego niż sama sesja. Narzędzia pilnujące
    wynoszenia danych nie widzą tego przeniesienia, bo nie ma czego zobaczyć.

    Kierunek odwrotny jest równie istotny. Wklejenie polecenia do konsoli na
    maszynie zdalnej jest najwygodniejszym sposobem uruchomienia na niej czegoś,
    czego się tam nie zapisywało. Nie trzeba niczego przesyłać ani pobierać —
    wystarczy skopiować tekst u siebie.

    Wyłączenie przekierowania zostawia sesję tym, czym powinna być: widokiem
    maszyny zdalnej, a nie kanałem między dwoma systemami.
  en: |
    A clipboard shared by both sides of a session is the shortest route for moving
    data between the remote machine and the one somebody is sitting at. It takes no
    saving of a file, leaves none behind on the way and passes through nothing that
    watches for data leaving - to the network it is part of the Remote Desktop
    session, just like the picture of the screen.

    That is why it is the route chosen most often. Whoever has gained access to the
    remote machine copies the contents of a database, a configuration file or saved
    credentials from it and pastes them at their end - with no file downloaded, no
    outgoing connection, no trace beyond the session itself. Tools watching for data
    leaving do not see the move, because there is nothing to see.

    The other direction matters just as much. Pasting a command into a console on the
    remote machine is the handiest way of running something there that was never saved
    there. Nothing has to be sent or downloaded - copying the text at one's own end is
    enough.

    Disabling redirection leaves the session as what it should be: a view of the remote
    machine rather than a channel between two systems.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy do tej maszyny ktoś łączy się pulpitem zdalnym
    i w jaki sposób przenosi przy tym dane.

    Na stacji, na której pulpit zdalny jest wyłączony, zmiana nie robi nic.
    Ustawienie działa po stronie maszyny przyjmującej połączenie, więc maszyna,
    z której ktoś tylko łączy się do innych, pozostaje bez zmian.

    Tam, gdzie połączenia są przyjmowane, skutek jest natychmiastowy
    i odczuwalny. Kopiowanie tekstu w jedną i drugą stronę przestaje działać:
    ścieżka, komunikat błędu, wpis z dokumentacji, hasło z menedżera haseł —
    wszystko to trzeba będzie przepisać ręcznie. Dla osoby prowadzącej serwis
    zdalny jest to różnica odczuwana przy każdym zadaniu, nie raz na jakiś czas.

    Warto rozważyć, czy blokować obie strony. Sam mechanizm nie rozróżnia
    kierunku — wyłącza schowek całkowicie, także wklejanie na maszynę zdalną,
    które bywa jedynym powodem, dla którego ktoś z niego korzysta. Zamiennikiem
    jest udział sieciowy albo dostęp do menedżera haseł po stronie zdalnej.

    Nie ma restartu, ale sesje już otwarte zachowują schowek do rozłączenia.
  en: |
    What needs checking is whether anybody connects to this machine over Remote Desktop
    and how they move data while doing so.

    On a workstation with Remote Desktop switched off, the change does nothing. The
    setting works on the machine taking the connection, so a machine somebody only
    connects from to others stays unchanged.

    Where connections are taken, the effect is immediate and felt. Copying text either
    way stops working: a path, an error message, an entry from documentation, a
    password from a password manager - all of it will have to be typed out by hand. For
    somebody doing remote support that is a difference felt at every task rather than
    now and then.

    Whether to block both directions is worth thinking about. The mechanism itself does
    not tell them apart - it switches the clipboard off altogether, including pasting
    onto the remote machine, which is sometimes the only reason anybody uses it. The
    replacement is a network share or access to a password manager on the remote side.

    There is no restart, but sessions already open keep their clipboard until they
    disconnect.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - user-interface
  what_breaks:
    pl:
      - Kopiowanie i wklejanie tekstu między maszyną łączącą się a zdalną przestaje działać
      - Przeniesienie hasła z menedżera haseł do sesji zdalnej wymaga przepisania go ręcznie
      - Przeciąganie plików przez schowek między dwoma systemami przestaje być możliwe
      - Na maszynie, która nie przyjmuje połączeń pulpitem zdalnym, nie zmienia się nic
    en:
      - Copying and pasting text between the connecting machine and the remote one stops working
      - Moving a password from a password manager into a remote session takes typing it by hand
      - Dragging files through the clipboard between two systems stops being possible
      - On a machine taking no Remote Desktop connections, nothing changes at all
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwis zdalny opiera się na wklejaniu poleceń i przepisywanie ich ręcznie jest źródłem pomyłek
      - Maszyna jest jedynym miejscem pracy zdalnej, a innej drogi przeniesienia danych nie przygotowano
    en:
      - Remote support rests on pasting commands and typing them by hand is a source of mistakes
      - The machine is the only place of remote work and no other route for moving data was prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableClip'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableClip'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableClip' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Ustawienie działa po stronie maszyny przyjmującej połączenie. Wdrożenie go
    na stacji, z której ktoś zarządza innymi maszynami, nie zmieni niczego —
    o schowku rozstrzyga strona zdalna.

    Wpis jest częścią gałęzi wspólnej dla wszystkich ustawień pulpitu zdalnego,
    więc wycofanie usuwa wyłącznie sam wpis. Usunięcie całej gałęzi skasowałoby
    także pozostałe ustawienia pulpitu zdalnego, w tym wdrożone innymi regułami
    tej paczki.

    Punkt nie zamyka wszystkich dróg przeniesienia danych z sesji. Zostaje
    przekierowanie drukarek, zrzut ekranu i przepisanie treści ręcznie. Jest to
    zamknięcie drogi najwygodniejszej, a nie jedynej — i tak należy go czytać.
  en: |
    The setting works on the machine taking the connection. Rolling it out on a
    workstation somebody manages other machines from changes nothing - the clipboard is
    settled by the remote side.

    The entry belongs to a key shared by every Remote Desktop setting, so rollback
    removes the entry alone. Removing the whole key would wipe the other Remote Desktop
    settings as well, including those applied by other rules in this pack.

    The item does not close every route for moving data out of a session. Printer
    redirection remains, as do a screen capture and typing the content out by hand. It
    closes the handiest route rather than the only one, and that is how it should be
    read.
