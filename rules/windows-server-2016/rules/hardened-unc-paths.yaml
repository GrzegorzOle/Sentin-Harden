id: win2016-hardened-unc-paths

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Provider
  title:
    pl: Udziały z zasadami grupy osiągane tylko po wzajemnym uwierzytelnieniu
    en: Group policy shares reached only after mutual authentication
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe maszynie sięgać po dwa udziały kontrolera domeny
    wyłącznie po sprawdzeniu, z kim rozmawia, i z zabezpieczeniem
    nienaruszalności przesyłanych danych.

    Udziały te niosą to, na czym stoi konfiguracja całej domeny: zasady
    grupy i skrypty logowania. Maszyna czyta je przy każdym odświeżeniu
    zasad i wykonuje to, co w nich znajdzie.

    Zachowanie domyślne sięga po nie tak, jak po dowolny udział sieciowy:
    pyta o nazwę, łączy się z tym, kto odpowie, i przyjmuje zawartość.
    Dwa warunki, o które tu chodzi, dodają sprawdzenie strony odpowiadającej
    oraz zabezpieczenie treści w drodze.

    Bez nich wystarczy odpowiedzieć na pytanie o nazwę szybciej niż
    prawdziwy kontroler domeny albo wejść w środek połączenia. Maszyna
    przyjmie wtedy cudze zasady grupy i cudzy skrypt logowania — a skrypt
    logowania jest zwykłym plikiem wykonywalnym, uruchamianym w kontekście,
    który sam wskaże.

    Droga ta była podstawą znanych podatności w obsłudze zasad grupy
    i właśnie dla jej zamknięcia te dwa warunki wprowadzono.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia własnych zasad grupy i własnego skryptu logowania
    wszystkim maszynom, które da się skłonić do zapytania o nazwę.
  en: |
    The setting has the machine reach two of the domain controller's shares only
    after checking whom it talks to, and with the integrity of the carried data
    guarded.

    Those shares carry what the whole domain's configuration stands on: group
    policies and sign-in scripts. The machine reads them at every refresh of policy
    and carries out what it finds in them.

    The default behaviour reaches them as it would any network share: it asks about
    a name, connects to whoever answers, and takes in the contents. The two
    conditions meant here add a check of the answering side and a guard on the
    contents along the way.

    Without them it is enough to answer the question about a name faster than the
    real domain controller, or to step into the middle of the connection. The machine
    will then take in somebody else's group policies and somebody else's sign-in
    script - and a sign-in script is an ordinary executable file, run in a context it
    names itself.

    That road was the basis of known weaknesses in the handling of group policy, and
    it is for shutting it that these two conditions were brought in.

    What an attacker gains while the item goes unmet: the chance to substitute their
    own group policies and their own sign-in script on every machine that can be
    induced to ask about a name.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba dwie rzeczy dotyczące
    tego, jak maszyna odnajduje kontroler domeny.

    Pierwsza to rozwiązywanie nazw. Warunek wzajemnego uwierzytelnienia
    opiera się na nazwie zarejestrowanej w katalogu, więc kontroler
    odnajdywany po adresie liczbowym albo po nazwie zastępczej nie spełni
    go i maszyna odmówi połączenia. Objawem jest brak zasad grupy
    i nieuruchomiony skrypt logowania — a maszyna działa poza tym
    normalnie, więc rozpoznanie bywa długie.

    Druga to zaufanie między domenami. Sięganie po udziały domeny, która
    nie ufa tej, w której maszyna się znajduje, przestanie działać. Dotyczy
    to scenariuszy po połączeniu organizacji i po migracji, gdzie stary
    kontroler bywa jeszcze używany.

    Rzecz trzecia jest drobna: warunek nienaruszalności danych dokłada
    trochę pracy przy każdym odświeżeniu zasad. Na pojedynczej maszynie
    niezauważalne.

    Wdrożenie nie działa wstecz. Zasady wgrane wcześniej zostają, więc
    maszyna po wdrożeniu nie traci konfiguracji — traci tylko zdolność
    pobrania nowej, jeżeli warunki nie są spełnione. Skutek jest przez to
    cichy i opóźniony.

    Czego to nie psuje: dostępu do zwykłych udziałów plikowych, logowania
    użytkowników, usług, pracy lokalnej.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and two things have to be checked concerning how
    the machine finds the domain controller.

    The first is name resolution. The condition of mutual authentication rests on a
    name registered in the directory, so a controller found by a numeric address or
    by a substitute name will not meet it and the machine will refuse the
    connection. The symptom is group policy wanting and a sign-in script not run -
    and the machine works otherwise normally, so the search is at times a long one.

    The second is trust between domains. Reaching the shares of a domain that does
    not trust the one the machine is in will stop working. That touches cases after
    organisations have been joined and after a migration, where an old controller is
    at times still used.

    The third thing is a small one: the condition of integrity adds a little work at
    every refresh of policy. On a single machine it is unnoticeable.

    The rollout does not work backwards. Policy loaded earlier stays, so the machine
    does not lose its configuration after the rollout - it loses only the ability to
    fetch new policy where the conditions are not met. The consequence is thereby
    quiet and put off.

    What this does not break: access to ordinary file shares, users signing in,
    services, or local work.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Kontroler domeny odnajdywany po adresie liczbowym albo po nazwie zastępczej przestanie być osiągalny dla zasad grupy
      - Objawem jest brak nowych zasad i nieuruchomiony skrypt logowania, a maszyna działa poza tym normalnie, więc rozpoznanie bywa długie
      - Sięganie po udziały domeny, która nie ufa tej, w której maszyna się znajduje, przestanie działać
      - Dostęp do zwykłych udziałów plikowych i logowanie użytkowników pozostają bez zmian
    en:
      - A domain controller found by a numeric address or by a substitute name will stop being reachable for group policy
      - The symptom is new policy wanting and a sign-in script not run, the machine working otherwise normally, so the search is at times a long one
      - Reaching the shares of a domain that does not trust the one the machine is in will stop working
      - Access to ordinary file shares and users signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kontroler domeny jest tu odnajdywany po adresie liczbowym albo po nazwie zastępczej i nie da się tego na razie zmienić
      - Maszyna sięga po zasady albo skrypty do domeny, z którą nie ma ustanowionego zaufania
    en:
      - The domain controller is found here by a numeric address or a substitute name and that cannot be changed for the time being
      - The machine reaches for policy or scripts in a domain with which no trust has been established
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        foreach ($share in @('\\*\NETLOGON', '\\*\SYSVOL')) {
          $value = $item.$share
          if ($null -eq $value -or
              $value -notmatch 'RequireMutualAuthentication\s*=\s*1' -or
              $value -notmatch 'RequireIntegrity\s*=\s*1') {
            $missing += $share
          }
        }
        if ($missing.Count -eq 0) { 'HARDENED' } else { 'INCOMPLETE' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'HARDENED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      netlogon    = $item.'\\*\NETLOGON'
      sysvol      = $item.'\\*\SYSVOL'
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $value = 'RequireMutualAuthentication=1, RequireIntegrity=1'
    Set-ItemProperty -Path $path -Name '\\*\NETLOGON' -Value $value -Type String
    Set-ItemProperty -Path $path -Name '\\*\SYSVOL' -Value $value -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($pair in @(@('\\*\NETLOGON', $b.netlogon), @('\\*\SYSVOL', $b.sysvol))) {
      if ($null -eq $pair[1]) {
        Remove-ItemProperty -Path $b.path -Name $pair[0] -ErrorAction SilentlyContinue
      } else {
        Set-ItemProperty -Path $b.path -Name $pair[0] -Value $pair[1] -Type String
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change made it and nothing else has
      # since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/group-policy/ms15-011-ms15-014-hardening-group-policy

notes:
  pl: |
    Punkt domyka trójkę o tym, skąd maszyna bierze swoje ustawienia.
    Dwie poprzednie reguły pilnowały, żeby maszyna o zasady pytała i żeby
    pytanie miało skutek. Ta pilnuje, żeby odpowiedź przychodziła
    od właściwej strony i w stanie nienaruszonym.

    Zależność między nimi warto pokazywać wprost, bo jest wyjątkowo
    niewygodna: im lepiej wdrożone dwie pierwsze, tym groźniejszy brak tej
    trzeciej. Maszyna pytająca o zasady często i wgrywająca je bezwarunkowo
    jest maszyną, która często i bezwarunkowo przyjmie cudze zasady.

    Reguła sprawdza dwa udziały, bo tyle wymienia zalecenie. Wpis jest
    jednak listą i można ją rozszerzyć o własne udziały niosące skrypty
    albo instalatory. Audyt tego nie wymaga i rozszerzenie nie popsuje
    zgodności.

    Cicha i opóźniona postać skutku jest tu wartością samą w sobie do
    zapisania w podglądzie: po wdrożeniu nic nie przestaje działać od razu,
    a maszyna może przestać przyjmować zasady i nikt tego nie zauważy.
  en: |
    The item shuts the three about where the machine takes its settings from. The
    two rules before it saw to the machine asking about policy and to the asking
    having effect. This one sees to the answer coming from the right side and in an
    unaltered state.

    The bearing between them is worth showing outright, being uncommonly awkward:
    the better the first two are rolled out, the more dangerous the want of this
    third. A machine asking about policy often and loading it unconditionally is a
    machine that will often and unconditionally take in somebody else's policy.

    The rule checks two shares, that being how many the recommendation names. The
    entry is a list all the same and can be widened by shares of one's own carrying
    scripts or installers. The audit does not call for it and widening it will not
    break compliance.

    The quiet and put-off form of the consequence is here a thing worth writing into
    the preview in itself: after the rollout nothing stops working at once, and the
    machine may stop taking in policy with nobody noticing.
