id: win2025-process-creation-command-line

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Audit Process Creation
  title:
    pl: Wiersz polecenia zapisywany w zdarzeniach utworzenia procesu
    en: Command line recorded in process creation events
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawia, że w zdarzeniu utworzenia procesu zapisywany jest
    pełny wiersz polecenia, a nie sama nazwa pliku wykonywalnego.

    Zostawiam kategorię średnią — z tego samego powodu co przy
    rejestrowaniu połączeń: zapis niczego nie blokuje. Wartość tego
    punktu jest jednak wyjątkowo duża jak na mechanizm, który tylko
    patrzy, i warto powiedzieć dlaczego.

    Bez wiersza polecenia zapis mówi, że uruchomił się program. Na
    serwerze programem tym jest w przytłaczającej większości powłoka —
    interpreter poleceń albo interpreter skryptów. Sama informacja, że
    uruchomiła się powłoka, nie znaczy nic, bo powłoka uruchamia się na
    serwerze kilkaset razy dziennie z powodów całkowicie zwyczajnych.
    Cała treść zdarzenia leży w argumentach: co ta powłoka dostała do
    wykonania. Bez nich dziennik rejestruje ruch, ale nie rejestruje
    zdarzeń.

    Chcę też zapisać zastrzeżenie, bez którego ten punkt bywa czytany
    błędnie. Sam ten wpis niczego nie zapisuje. Zdarzenia utworzenia
    procesu muszą być osobno włączone w polityce audytu; ten punkt mówi
    tylko, że jeżeli już powstają, mają zawierać wiersz polecenia.
    Wynik zielony przy wyłączonym audycie tworzenia procesów znaczy
    zgodność bez ani jednego zapisu — i jest to jeden z niewielu
    punktów w tej paczce, w którym zgodność da się mieć zupełnie na
    sucho.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dziennik,
    w którym jego polecenia wyglądają identycznie jak polecenia
    administratora, bo widać w nim tylko, że uruchomiła się powłoka.
  en: |
    The item makes it so that in the happening of the making of a working there is written down the
    full line of bidding and not the bare name of the file that runs.

    I leave the category middling - for the same ground as at the writing of bindings - the writing
    blocks nothing. The worth of that item is uncommonly great for a working that only looks, and it is
    worth saying why.

    Without the line of bidding the writing says that a program started. Upon a server that program is
    in the overwhelming most of cases a shell - a reader of biddings or a reader of scripts. The bare
    tiding that a shell started means nothing, a shell starting upon a server some hundreds of times a
    day for wholly everyday grounds. The whole substance of the happening lies in the words given with
    it - what that shell was given to do. Without them the log writes down stir but writes down no
    happenings.

    I would set down too a saving, without which that item is at times read wrongly. This entry of
    itself writes nothing. The happenings of the making of a working must be switched on on their own
    in the rule of looking-over; this item says only that, where they already rise, they are to hold
    the line of bidding. A green outcome where the looking-over of the making of workings is switched
    off means a following with not one writing - and it is one of the few items in this pack whereat a
    following may be had wholly dry.

    What an attacker gains while the item goes unmet - a log wherein their biddings look just like a
    ruler's, nothing being seen in it but that a shell started.

disruption_description:
  pl: |
    Podnoszę klasę wobec oceny dla stacji roboczej do „wymaga świadomego
    wdrożenia" i powód jest jeden, ale poważny: ta zmiana świadomie
    tworzy miejsce, w którym lądują hasła.

    Wiersz polecenia zawiera to, co przekazano programowi — a hasła
    przekazywane jako argument są na serwerach powszechne. Zadanie
    zaplanowane z poświadczeniem w wierszu, instalator uruchamiany
    z parametrem zawierającym hasło konta usługowego, skrypt
    integracyjny podający klucz w argumencie. Na stacji roboczej
    zdarza się to rzadko. Na serwerze jest to codzienność i nie znika
    przez to, że nie powinno tak być.

    Skutkiem jest to, że po tej zmianie poświadczenia trafiają do
    dziennika zabezpieczeń. Dziennik ten czyta szerszy krąg osób niż
    ten, który zna hasło konta usługowego, i — jeżeli zrobiono to
    porządnie — jest wynoszony na maszynę zbierającą, czyli poza tę
    maszynę. Zmiana przenosi więc hasło w dwa nowe miejsca naraz.

    Dlatego kolejność: najpierw ustala się, kto ma prawo czytać dziennik
    zabezpieczeń tej maszyny i dokąd ten dziennik jest wynoszony,
    a dopiero potem włącza się zapis wiersza polecenia. Jeżeli
    odpowiedzi na te dwa pytania nie ma, punkt nie jest gotowy do
    zastosowania, choćby wyglądał na niewinny.

    Nie jest to argument przeciwko zmianie. Jest to argument za tym, żeby
    przy okazji zająć się hasłami w wierszach poleceń, bo to one są tu
    właściwą usterką, a ten punkt tylko wyciąga je na światło.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I raise the class against the reckoning for a workstation to "needs a witting rolling out", and the
    ground is one but it is weighty - that change wittingly makes a stead wherein watchwords come to
    land.

    The line of bidding holds what was given over to the program - and watchwords given over as a word
    of bidding are upon servers everyday. A task set to a time with a token in the line, an installer
    started with a mark holding the watchword of a standing of workings, a script of knitting-together
    giving a key as a word. Upon a workstation it befalls seldom. Upon a server it is the everyday, and
    it goes not away for its being wrong.

    The outcome is that after that change the tokens come into the security log. That log is read by a
    wider ring of folk than the ring that knows the watchword of a standing of workings, and - if it
    was done rightly - it is borne out to a gathering machine, that is, off that machine. The change
    therefore bears the watchword into two new steads at once.

    Therefore the ordering - first it is settled who has the right to read the security log of that
    machine and whither that log is borne, and only then is the writing of the line of bidding switched
    on. If there be no answers to those two questions, the item is not ready to be laid on, however
    harmless it look.

    It is no ground against the change. It is a ground for taking up, by the way, the watchwords in
    lines of bidding, they being here the true fault, and this item only drawing them into the light.

    The change takes no break and is undone at once.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
    - accounts-and-passwords
  what_breaks:
    pl:
      - Hasła przekazywane programom jako argument zaczynają trafiać do dziennika zabezpieczeń
      - Dziennik zabezpieczeń czyta szerszy krąg osób niż ten, który zna hasło konta usługowego
      - Wynoszenie dziennika na maszynę zbierającą przenosi te hasła również poza tę maszynę
      - Sam ten wpis niczego nie zapisuje, dopóki audyt tworzenia procesów nie zostanie włączony osobno
    en:
      - Watchwords given over to programs as a word of bidding begin to come into the security log
      - The security log is read by a wider ring of folk than the ring that knows the watchword of a standing of workings
      - The bearing of the log to a gathering machine bears those watchwords off that machine as well
      - This entry of itself writes nothing until the looking-over of the making of workings be switched on on its own
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, kto ma prawo czytać dziennik zabezpieczeń tej maszyny ani dokąd ten dziennik jest wynoszony
      - Na maszynie są zadania i instalatory przekazujące hasła w wierszu polecenia i nie zaplanowano ich poprawienia
    en:
      - It was not settled who has the right to read the security log of that machine, nor whither that log is borne
      - Upon the machine there are tasks and installers giving watchwords over in the line of bidding and no mending of them was planned
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
      $name = 'ProcessCreationIncludeCmdLine_Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
    $name = 'ProcessCreationIncludeCmdLine_Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two things to know first. This writes nothing unless process creation
    # auditing is enabled separately. And command lines carry passwords passed
    # as arguments - settle who reads the security log and where it is
    # forwarded before switching this on.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ProcessCreationIncludeCmdLine_Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4688

notes:
  pl: |
    Na serwerze uruchamianym programem jest niemal zawsze powłoka, a sama
    informacja, że powłoka się uruchomiła, nie znaczy nic. Cała treść
    zdarzenia leży w argumentach. Bez nich dziennik rejestruje ruch,
    ale nie rejestruje zdarzeń.

    Zastrzeżenie: sam ten wpis niczego nie zapisuje — audyt tworzenia
    procesów musi być włączony osobno. Zgodność da się tu mieć zupełnie
    na sucho.

    Klasę podnoszę, bo zmiana świadomie tworzy miejsce, w którym lądują
    hasła przekazywane jako argument, a na serwerze jest to codzienność.
    Dziennik zabezpieczeń czyta szerszy krąg osób i bywa wynoszony poza
    maszynę, więc hasło trafia w dwa nowe miejsca naraz. Nie jest to
    argument przeciwko zmianie, tylko za zajęciem się hasłami w wierszach
    poleceń.
  en: |
    Upon a server the program started is well-nigh always a shell, and the bare tiding that a shell
    started means nothing. The whole substance lies in the words given with it. Without them the log
    writes down stir but writes down no happenings.

    A saving - this entry of itself writes nothing; the looking-over of the making of workings must be
    switched on on its own. A following may here be had wholly dry.

    I raise the class, the change wittingly making a stead wherein watchwords given over as words of
    bidding come to land, and upon a server that is the everyday. The security log is read by a wider
    ring and is at times borne off the machine, so the watchword comes into two new steads at once. It
    is no ground against the change but a ground for taking up the watchwords in lines of bidding.
