id: win2025-search-assistant-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Search
  title:
    pl: Asystent wyszukiwania nad ekranem blokady wyłączony
    en: The search assistant above the lock screen switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza działanie asystenta wyszukiwania nad zablokowanym ekranem,
    czyli przed podaniem hasła.

    Kategoria wysoka i powód jest jeden, za to mocny. Zablokowany ekran ma
    znaczyć dokładnie tyle: że do maszyny nie ma dostępu, dopóki ktoś nie
    poda poświadczeń. Każda czynność dostępna nad tym ekranem tę granicę
    przesuwa, a asystent wyszukiwania nie jest czynnością drobną — to
    mechanizm przyjmujący dowolne polecenie i odpowiadający na nie danymi
    z maszyny.

    To jest właściwa treść punktu. Granica przestaje być granicą, jeżeli po
    jej niewłaściwej stronie da się zadać pytanie i dostać odpowiedź.
    Zakres tego, co asystent odpowie, bywa zmieniany aktualizacjami — więc
    ocena „ale on i tak niewiele pokazuje" jest oceną stanu chwilowego,
    a nie właściwością mechanizmu.

    Na serwerze kontekstem jest konsola maszyny wirtualnej, dostępna
    z panelu wirtualizacji dla szerszego grona niż sam serwer. Osoba mająca
    dostęp do tego panelu nie ma z tego tytułu prawa do zawartości maszyny,
    a nad ekranem blokady właśnie je dostaje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    zadawania pytań maszynie i otrzymywania odpowiedzi bez podania hasła.
  en: |
    The item switches off the working of the search assistant above a locked
    screen, that is, before a password has been given.

    The category is high, and the reason is a single one but strong. A locked
    screen is meant to mean exactly this: that there is no access to the
    machine until somebody gives credentials. Every action available above
    that screen moves the boundary, and the search assistant is not a small
    action - it is a mechanism that accepts any instruction at all and
    answers it with data from the machine.

    That is the real substance of the item. A boundary stops being a boundary
    if, on the wrong side of it, a question can be asked and an answer given.
    How much the assistant answers with is changed by updates - so the
    judgement "but it shows hardly anything anyway" is a judgement of a
    passing state, not a property of the mechanism.

    On a server the context is the virtual machine's console, available from
    the virtualisation panel to a wider circle than the server itself. A
    person with access to that panel has no right to the machine's contents
    on that account, yet above the lock screen they are given exactly that.

    What an attacker gains while the item goes unmet: a way of asking the
    machine questions and getting answers without giving a password.

disruption_description:
  pl: |
    Klasa „bez uciążliwości" i na serwerze nie mam tu żadnego zastrzeżenia:
    z ekranu blokady serwera nikt nie wyszukuje, a sam asystent na tym
    wydaniu systemu zwykle nie jest obecny.

    Skutek, gdyby go szukać: na zablokowanym ekranie nie da się zadać
    pytania. Wszystko, co dotyczy wyszukiwania po zalogowaniu, zostaje bez
    zmian — reguła dotyczy wyłącznie tego, co dzieje się przed podaniem
    hasła.

    Czego to nie psuje: wyszukiwania w sesji, indeksowania plików, pomocy
    systemowej, logowania ani niczego, co dzieje się po podaniu
    poświadczeń.

    Rzecz do zapamiętania: ten wpis i wyłączenie samego asystenta leżą pod
    tym samym kluczem rejestru i są dwoma osobnymi ustawieniami. Pod tym
    kluczem stoi już kilka reguł o zupełnie innym przedmiocie — znajoma
    ścieżka nie znaczy, że grupa jest zamknięta.

    Bez restartu, natychmiast odwracalne, wolno zastosować hurtem.
  en: |
    The class is "no disruption", and on a server I have no reservation here:
    nobody searches from a server's lock screen, and the assistant itself is
    usually not present on this edition of the system.

    The effect, were one to look for it: on a locked screen no question can
    be asked. Everything concerning search after signing in stays unchanged -
    the rule covers only what happens before a password is given.

    What this does not break: search within a session, file indexing, system
    help, signing in, or anything that happens after credentials are given.

    Something to remember: this entry and the switching off of the assistant
    itself lie under the same registry key and are two separate settings.
    Several rules of an entirely different subject already stand under that
    key - a familiar path does not mean the group is closed.

    No restart, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na zablokowanym ekranie nie da się zadać pytania asystentowi wyszukiwania
      - Wyszukiwanie w sesji, indeksowanie plików i pomoc systemowa działają bez zmian
      - Reguła dotyczy wyłącznie tego, co dzieje się przed podaniem hasła
      - Wpis i wyłączenie samego asystenta leżą pod tym samym kluczem i są dwoma osobnymi ustawieniami
    en:
      - On a locked screen no question can be put to the search assistant
      - Search within a session, file indexing and system help work unchanged
      - The rule covers only what happens before a password is given
      - This entry and the switching off of the assistant itself lie under the same key and are two separate settings
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem, na którym wyszukiwanie z ekranu blokady jest świadomie używanym udogodnieniem
    en:
      - The machine is a workstation where searching from the lock screen is a deliberately used convenience
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      $name = 'AllowCortanaAboveLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    $name = 'AllowCortanaAboveLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A boundary stops being a boundary if a question can be asked on the wrong
    # side of it and an answer given. On a server the console of a virtual
    # machine is reachable from the virtualisation panel by a wider circle than
    # the server itself.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCortanaAboveLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Zablokowany ekran ma znaczyć dokładnie tyle: brak dostępu do maszyny,
    dopóki ktoś nie poda poświadczeń. Asystent wyszukiwania przyjmuje nad
    nim dowolne polecenie i odpowiada danymi z maszyny.

    Zakres tego, co odpowie, bywa zmieniany aktualizacjami — ocena „i tak
    niewiele pokazuje" dotyczy stanu chwilowego, a nie właściwości
    mechanizmu.

    Na serwerze kontekstem jest konsola maszyny wirtualnej, dostępna
    z panelu wirtualizacji dla szerszego grona niż sam serwer.
  en: |
    A locked screen is meant to mean exactly this: no access to the machine
    until somebody gives credentials. The search assistant accepts any
    instruction above it and answers with data from the machine.

    How much it answers with is changed by updates - the judgement "it shows
    hardly anything anyway" concerns a passing state, not a property of the
    mechanism.

    On a server the context is the virtual machine's console, available from
    the virtualisation panel to a wider circle than the server itself.
