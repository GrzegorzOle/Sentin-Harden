id: win2025-anonymous-share-list-empty

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista udziałów dostępnych anonimowo pusta
    en: The list of shares reachable anonymously empty
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przechowuje wykaz udziałów, do których wolno sięgnąć
    połączeniem bez poświadczeń, i punkt wymaga, żeby wykaz ten był pusty.

    Mechanizm jest wyjątkiem od zasady, a nie jej częścią. Domyślnie
    połączenie puste nie sięga nigdzie; każda pozycja na tej liście otwiera
    dokładnie jeden udział dla każdego, kto potrafi się połączyć — bez
    logowania, bez konta, bez śladu wskazującego, kto to był.

    Na serwerze plików jest to jedyny punkt tej grupy, przy którym zagrożone
    są nie nazwy i nie konfiguracja, tylko sama zawartość. Udział wpisany
    na tę listę jest otwarty dla całej sieci, niezależnie od uprawnień
    nadanych na plikach — połączenie anonimowe uprawnienia te otrzymuje przez
    konto gościa albo przez wpis dla wszystkich.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: treść
    udziału, o ile jakiś na liście jest. Nie musi mieć konta i nie zostawia
    za sobą nazwy w dzienniku.

    Wpisy na tej liście prawie nigdy nie powstają dziś świadomie. Zwykle są
    zaszłością po aplikacji sprzed lat, która wymagała dostępu bez
    logowania, albo po konfiguracji przeniesionej z poprzedniego serwera
    razem z całą gałęzią ustawień.
  en: |
    The setting keeps a list of the shares that may be reached by a connection with no
    credentials, and the item takes that the list be empty.

    The mechanism is an exception to the rule rather than part of it. By default an empty
    connection reaches nowhere; every entry on this list opens exactly one share to anyone
    able to connect - with no signing in, no account and no trace showing who it was.

    On a file server it is the one item of this group at which what is at stake is neither
    names nor configuration but the contents themselves. A share entered on this list is
    open to the whole network whatever rights are granted on the files - an anonymous
    connection gets those rights through the guest account or through an entry for everyone.

    What an attacker gains while the item goes unmet: a share's contents, so far as one is
    on the list. They need no account and leave no name behind in the log.

    Entries on this list hardly ever arise knowingly today. They are usually a legacy of an
    application from years ago that took access without signing in, or of a configuration
    carried over from a previous server along with a whole branch of settings.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy coś faktycznie sięga do udziału z tej listy
    — bo jeśli sięga, wyczyszczenie listy odetnie to natychmiast.

    Na większości serwerów lista jest pusta i wdrożenie nie zmienia
    niczego. Tam, gdzie nie jest, wpis zwykle ma powód i powód ten warto
    ustalić przed zmianą, zamiast odkrywać go po niej.

    Korzystają z takich udziałów przede wszystkim urządzenia bez pojęcia
    konta: starsze kopiarki zapisujące skany, sterowniki maszyn
    odczytujące pliki konfiguracyjne, systemy wbudowane pobierające
    oprogramowanie układowe. Drugą grupą są procedury startowe sprzed lat —
    skrypty logowania i instalacyjne pobierające pliki z udziału, do którego
    dostęp musiał działać, zanim ktokolwiek się zalogował.

    Objawem jest odmowa dostępu w miejscu, w którym wcześniej dostęp był.
    Urządzenie zgłosi zwykle błąd sieci albo brak pliku.

    Właściwym rozwiązaniem nie jest pozostawienie wpisu, tylko nadanie
    urządzeniu konta. Tam, gdzie urządzenie konta nie obsługuje,
    rozwiązaniem jest odseparowanie go siecią — nie otwieranie udziału
    dla wszystkich.

    Zmiana wymaga restartu usługi udostępniania.
  en: |
    What needs checking is whether anything actually reaches a share from this list - since
    if it does, clearing the list will cut it off at once.

    On most servers the list is empty and the rollout changes nothing. Where it is not, the
    entry usually has a reason and that reason is worth establishing before the change
    rather than discovering it after.

    What uses such shares is above all devices with no notion of an account: older copiers
    recording scans, machine controllers reading configuration files, embedded systems
    fetching firmware. The second group is start-up procedures from years ago - sign-in and
    installation scripts fetching files from a share access to which had to work before
    anyone had signed in.

    The symptom is access being denied where access was before. The device will usually
    report a network error or a missing file.

    The right answer is not leaving the entry but giving the device an account. Where a
    device does not serve accounts, the answer is separating it off by the network - not
    opening a share to everyone.

    The change takes a restart of the sharing service.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - drivers-and-devices
    - scripting-and-automation
  what_breaks:
    pl:
      - Urządzenia sięgające do udziału bez poświadczeń tracą do niego dostęp
      - Skrypty startowe pobierające pliki przed zalogowaniem przestają je znajdować
      - Urządzenie zgłasza zwykle błąd sieci albo brak pliku, nie odmowę dostępu
      - Restart usługi udostępniania zrywa sesje otwarte w chwili zmiany
    en:
      - Devices reaching a share with no credentials lose access to it
      - Start-up scripts fetching files before signing in stop finding them
      - The device usually reports a network error or a missing file rather than denied access
      - The restart of the sharing service breaks sessions open at the moment of the change
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenie bez obsługi kont sięga do udziału wpisanego na tę listę
      - Procedura startowa pobiera pliki z takiego udziału przed zalogowaniem
    en:
      - A device with no support for accounts reaches a share entered on this list
      - A start-up procedure fetches files from such a share before signing in
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value holds a list of entries, not a number. A missing value and a
      # list with nothing on it mean the same thing here - no share is reachable
      # anonymously - so both are reported as empty.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'NullSessionShares'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'EMPTY' }
        else {
          $entries = @($value | Where-Object { $_ -ne '' })
          if ($entries.Count -eq 0) { 'EMPTY' } else { 'ENTRIES ' + ($entries -join ',') }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: EMPTY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $current = (Get-ItemProperty -Path $path -Name 'NullSessionShares' -ErrorAction SilentlyContinue).'NullSessionShares'
    [pscustomobject]@{
      path    = $path
      name    = 'NullSessionShares'
      entries = @($current)
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # An empty list rather than a removed value - the removed value means the
    # same thing, but an empty list records the decision instead of leaving the
    # state to a default.
    Set-ItemProperty -Path $path -Name 'NullSessionShares' -Value @() -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string[]]@($b.entries)) -Type MultiString
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-shares-that-can-be-accessed-anonymously

notes:
  pl: |
    Brak wartości i lista pusta znaczą tutaj to samo — żaden udział nie
    jest dostępny anonimowo — i audyt traktuje oba jako spełnienie. Jest to
    wyjątek od zasady stosowanej w pozostałych regułach, gdzie brak zapisu
    nie jest uznawany za zgodność. Powód jest taki, że ta wartość jest
    wykazem wyjątków, a nie ustawieniem: wykaz nieistniejący i wykaz pusty
    opisują ten sam stan, nie domysł o wartości domyślnej.

    Wynik „ENTRIES" podaje wykaz wprost, żeby dało się zobaczyć, o które
    udziały chodzi, zanim cokolwiek zostanie wyczyszczone.

    Punkt czyta się razem z wykazem nazwanych potoków dostępnych anonimowo,
    który jest osobną wartością w tym samym kluczu i osobnym punktem
    benchmarku.
  en: |
    An absent value and an empty list mean the same thing here - no share is reachable
    anonymously - and the audit holds both a meeting of the item. That is an exception to
    the rule followed in the other rules, where an absent record is not held compliance. The
    reason is that this value is a list of exceptions rather than a setting: a list that
    does not exist and an empty list describe the same state, not a guess about a default
    value.

    The "ENTRIES" result gives the list outright, so that it can be seen which shares are
    meant before anything is cleared.

    The item is read together with the list of named pipes reachable anonymously, which is a
    separate value in the same key and a separate item of the benchmark.
