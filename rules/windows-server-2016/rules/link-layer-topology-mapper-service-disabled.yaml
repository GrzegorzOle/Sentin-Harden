id: win2016-link-layer-topology-mapper-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa odwzorowująca topologię sieci wyłączona
    en: The service mapping the network's topology disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa wykrywa urządzenia w segmencie sieci i ustala, jak są ze sobą
    połączone, żeby dało się narysować mapę sieci.

    Mechanizm działa poniżej warstwy adresowej — pyta urządzenia
    bezpośrednio, ramkami, na które odpowiadają także te bez skonfigurowanego
    adresu. Daje przez to obraz pełniejszy niż jakiekolwiek skanowanie
    adresów: widzi przełączniki, punkty dostępowe i urządzenia, których
    zwykłe rozpoznanie sieciowe nie pokazuje.

    Dokładnie to czyni go użytecznym dla kogoś obcego w segmencie. Maszyna
    z włączoną usługą odpowiada na pytania o swoje połączenia i pomaga
    złożyć mapę sieci komuś, kto tej mapy nie powinien mieć. Rozpoznanie
    takie nie wymaga uprawnień ani logowania i nie wygląda na atak, bo
    mechanizm istnieje właśnie po to, żeby odpowiadać.

    Waga tego jest umiarkowana i tak została oceniona. Mapa segmentu nie
    otwiera żadnej drogi sama z siebie — skraca tylko czas, w którym
    napastnik ustala, gdzie jest i co ma wokół siebie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pomoc tej
    maszyny w złożeniu mapy segmentu, obejmującej urządzenia niewidoczne
    przy zwykłym rozpoznaniu adresowym.
  en: |
    The service discovers devices in the network segment and establishes how they are
    joined to one another, so that a map of the network may be drawn.

    The mechanism works below the address layer - it asks devices directly, by frames
    answered also by those with no address configured. It thereby gives a fuller picture
    than any scanning of addresses: it sees switches, access points and devices ordinary
    network reconnaissance does not show.

    Exactly that makes it useful to a stranger in the segment. A machine with the
    service switched on answers questions about its connections and helps put together
    a map of the network for somebody who should not have that map. Such reconnaissance
    calls for no permissions and no signing in and does not look like an attack, the
    mechanism existing precisely in order to answer.

    The weight of that is moderate and has been assessed so. A map of the segment opens
    no road of itself - it only shortens the time in which an attacker establishes where
    they are and what they have about them.

    What an attacker gains while the item goes unmet: this machine's help in putting
    together a map of the segment, taking in devices unseen at ordinary address
    reconnaissance.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć skutek jest drobny i dotyczy narzędzia,
    którego na serwerze nikt nie otwiera.

    Znika graficzna mapa sieci — widok pokazujący urządzenia i połączenia
    między nimi. Na stanowisku roboczym bywa używana przy rozwiązywaniu
    problemów z siecią domową; na serwerze nie ma zastosowania i nikt tam
    po nią nie sięga.

    Wyłączenie działa w obie strony, jak przy innych usługach tego bloku.
    Maszyna przestaje rysować mapę i przestaje pomagać rysować ją innym.
    Ta druga strona jest ważniejsza, bo dotyczy tego, co maszyna mówi
    o sobie obcym.

    Sprawdzić warto jedną rzecz: czy narzędzia diagnostyczne używane w tej
    organizacji nie opierają się na tym mechanizmie przy wykrywaniu
    urządzeń. Zdarza się to w oprogramowaniu do inwentaryzacji sieci,
    zwłaszcza takim, które pokazuje schemat połączeń, a nie samą listę
    adresów. Objawem jest niekompletny schemat, a nie błąd — i to jest
    powód, dla którego punkt nie jest w klasie bez uciążliwości.

    Czego to nie psuje: diagnostyki po adresie i po nazwie, rozpoznawania
    nazw, udziałów, zarządzania zdalnego, pulpitu zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", though the consequence is small and concerns a tool
    nobody opens on a server.

    The graphical network map vanishes - the view showing devices and the connections
    among them. At a workstation it is at times used in settling troubles with a home
    network; on a server it has no use and nobody there reaches for it.

    Switching it off works both ways, as with the other services of this block. The
    machine stops drawing the map and stops helping others to draw it. That second side
    matters more, concerning as it does what the machine says of itself to strangers.

    One thing is worth checking: whether the diagnostic tools used in this organisation
    do not rest on this mechanism when discovering devices. That happens in network
    inventory software, above all such as shows a diagram of connections rather than a
    bare list of addresses. The symptom is an incomplete diagram rather than an error -
    and that is the reason the item is not of the class no disruption.

    What this does not break: diagnostics by address and by name, resolving names,
    shares, remote management, or the remote desktop.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Graficzna mapa sieci przestaje się rysować, a widok połączeń między urządzeniami zostaje pusty
      - Oprogramowanie do inwentaryzacji sieci pokazujące schemat połączeń zbuduje schemat niekompletny, bez zgłoszenia błędu
      - Maszyna przestaje także odpowiadać na pytania innych o swoje połączenia, więc znika ze schematów rysowanych gdzie indziej
      - Diagnostyka po adresie i po nazwie, rozpoznawanie nazw i zarządzanie zdalne pozostają bez zmian
    en:
      - The graphical network map stops being drawn and the view of connections among devices stays empty
      - Network inventory software showing a diagram of connections will build an incomplete diagram, reporting no error
      - The machine also stops answering others' questions about its connections, so it vanishes from diagrams drawn elsewhere
      - Diagnostics by address and by name, resolving names and remote management stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Inwentaryzacja sieci w tej organizacji opiera się na tym mechanizmie i buduje z niego schemat połączeń
    en:
      - Network inventory in this organisation rests on this mechanism and builds its diagram of connections from it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'lltdsvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The graphical network map stops being drawn. Ordinary diagnostics by
    # address and by name are untouched.
    Stop-Service -Name 'lltdsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lltdsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'lltdsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/lltd/link-layer-topology-discovery-overview

notes:
  pl: |
    Punkt zamyka blok i jest w nim jedynym, który nie dotyczy szukania
    maszyn, tylko rysowania tego, co je łączy. Umieszczenie go tutaj ma
    sens, bo należy do tej samej rodziny mechanizmów odkrywania, ale warto
    tę różnicę nazwać, żeby nie zlał się z pozostałymi.

    Niekompletny schemat zamiast błędu jest rzeczą, którą warto pokazać
    w interfejsie. Jest to ten sam rodzaj cichej straty, co przy zdalnym
    odczycie rejestru: narzędzie nie przestaje działać, tylko zaczyna
    pokazywać mniej, niż jest — i nikt tego nie zauważa, bo schemat wygląda
    kompletnie.

    Kategoria niska przy klasie wymagającej sprawdzenia to zestawienie,
    które w macierzy dwóch osi daje kandydata do świadomego odpuszczenia.
    Jeżeli inwentaryzacja sieci w organizacji stoi na tym mechanizmie,
    decyzja o pozostawieniu usługi jest wyborem poprawnym i powinna dać się
    zapisać.
  en: |
    The item shuts the block and is the only one in it concerning not the seeking of
    machines but the drawing of what joins them. Putting it here makes sense, belonging
    as it does to the same family of discovery mechanisms, but the difference is worth
    naming so that it does not run together with the rest.

    An incomplete diagram instead of an error is a thing worth showing in the interface.
    It is the same kind of quiet loss as at reading the registry remotely: the tool does
    not stop working, it begins showing less than there is - and nobody notices, the
    diagram looking complete.

    A low category with a class needing review is a pairing which in the matrix of two
    axes gives a candidate for being deliberately let go. Should network inventory in the
    organisation stand on this mechanism, the decision to leave the service in place is a
    right one and should be recordable.
