id: win2016-rdp-drive-redirection-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie dysków w sesji pulpitu zdalnego wyłączone
    en: Drive redirection in Remote Desktop sessions disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odcina podłączanie dysków maszyny łączącej się do sesji
    zdalnej. Serwer przestaje widzieć dyski stanowiska, a stanowisko
    przestaje mieć w sesji swoje pliki.

    Jest to przekierowanie o największych skutkach spośród całej tej grupy,
    bo nie przenosi pojedynczej treści, tylko udostępnia całe urządzenie.
    Sesja na serwerze dostaje dysk maszyny, nad którą zespół utrzymujący
    serwer nie ma żadnej władzy — laptopa wynoszonego z biura, komputera
    domowego, stanowiska z oprogramowaniem, którego nikt nie sprawdzał.

    Droga działa w obie strony i obie są warte nazwania. Do środka: plik
    z przejętego stanowiska trafia na serwer jednym przeciągnięciem, bez
    przechodzenia przez pocztę, przez bramę sieciową ani przez cokolwiek,
    co takie przeniesienie zapisuje. Na zewnątrz: zawartość serwera trafia
    na dysk stanowiska równie łatwo, więc kopiowanie danych poza organizację
    nie wymaga niczego prócz otwartej sesji.

    Dla napastnika, który zdobył dostęp do pulpitu zdalnego, jest to
    najkrótsza droga wniesienia własnych narzędzi na serwer i wyniesienia
    z niego tego, po co przyszedł.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    przenoszenia plików w obie strony między serwerem a maszyną, której
    nikt nie kontroluje — omijający bramy, filtry i zapisy przeniesień.
  en: |
    The setting cuts off the attaching of the connecting machine's drives to the
    remote session. The server ceases to see the workstation's drives, and the
    workstation ceases to have its files inside the session.

    This is the redirection with the greatest consequences of the whole group, since
    it carries not a single piece of content but offers up a whole device. The
    session on the server gets the drive of a machine the team keeping the server
    has no power over - a laptop carried out of the office, a home computer, a
    workstation with software nobody has checked.

    The road works both ways and both are worth naming. Inward: a file from a
    taken-over workstation lands on the server with one drag, passing through no
    mail, no network gateway, and nothing else that records such a carrying.
    Outward: the server's contents land on the workstation's drive just as easily,
    so copying data out of the organisation calls for nothing but an open session.

    For an attacker who has gained access to the remote desktop this is the shortest
    road for bringing their own tools onto the server and carrying off what they
    came for.

    What an attacker gains while the item goes unmet: a channel for carrying files
    both ways between the server and a machine nobody controls - one going round
    gateways, filters, and records of carryings.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i tym razem sprawdzenie dotyczy przyzwyczajeń,
    a nie zgodności technicznej.

    Przekierowanie dysków jest wygodne i właśnie dlatego rozpowszechnione.
    Typowe użycia, które po zmianie przestaną działać: wgrywanie pakietów
    instalacyjnych z własnego stanowiska, wynoszenie z serwera zrzutów
    i dzienników do analizy, przenoszenie plików konfiguracyjnych, praca
    z dokumentem trzymanym u siebie w sesji otwartej na serwerze.

    Objaw jest natychmiastowy i widoczny dla człowieka: dyski stanowiska po
    prostu nie pojawiają się w sesji. Nie ma komunikatu wyjaśniającego, więc
    pierwszą reakcją bywa zgłoszenie awarii, a nie skojarzenie ze zmianą
    zasady. Warto uprzedzić.

    Zastąpienie jest proste, ale wymaga decyzji wcześniej, nie po. Udział
    sieciowy, repozytorium pakietów, uzgodniona ścieżka wymiany plików —
    każde z tych rozwiązań działa i każde zostawia ślad, którego
    przekierowanie dysku nie zostawia. Bez wskazania zastępczej drogi zmiana
    zostanie obejściem obejścia: ludzie zaczną wysyłać sobie pliki pocztą.

    Czego to nie psuje: samej sesji zdalnej, schowka, drukowania, dostępu do
    zasobów sieciowych z poziomu serwera.

    Bez restartu, natychmiast odwracalne — ale skutek widać przy pierwszym
    kolejnym połączeniu.
  en: |
    The class is "needs review", and this time the checking concerns habits rather
    than technical support.

    Drive redirection is convenient and for that very reason widespread. Typical
    uses that will stop working after the change: uploading installation packages
    from one's own workstation, carrying dumps and logs off the server for analysis,
    moving configuration files, working on a document kept at home in a session open
    on the server.

    The symptom is immediate and visible to a person: the workstation's drives
    simply do not appear in the session. There is no explaining message, so the
    first reaction is at times a fault report rather than a connecting of it to the
    change of policy. Worth a warning beforehand.

    The replacement is simple but calls for a decision beforehand rather than after.
    A network share, a package repository, an agreed path for exchanging files -
    each of these works and each leaves a trace that drive redirection does not.
    Without a substitute road being named the change will become a way round a way
    round: people will start sending each other files by mail.

    What this does not break: the remote session itself, the clipboard, printing, or
    access to network resources from the server.

    No restart, undone immediately - but the effect is seen at the first further
    connection.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - file-sharing
    - removable-media
  what_breaks:
    pl:
      - Dyski stanowiska przestają pojawiać się w sesji i nie ma komunikatu wyjaśniającego przyczynę
      - Wgrywanie pakietów instalacyjnych z własnego komputera oraz wynoszenie z serwera zrzutów i dzienników do analizy przestaje działać
      - Praca z dokumentem trzymanym u siebie w sesji otwartej na serwerze wymaga innej drogi przeniesienia pliku
      - Sama sesja zdalna, schowek, drukowanie i dostęp do zasobów sieciowych z poziomu serwera pozostają bez zmian
    en:
      - The workstation's drives stop appearing in the session and there is no message explaining why
      - Uploading installation packages from one's own computer and carrying dumps and logs off the server for analysis stop working
      - Working on a document kept at home in a session open on the server calls for another road for moving the file
      - The remote session itself, the clipboard, printing and access to network resources from the server stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie wskazano zastępczej drogi wymiany plików z serwerem, więc zmiana wypchnie ludzi ku poczcie i nośnikom przenośnym
      - Wdrożenia oprogramowania na tej maszynie odbywają się przez wgranie pakietu z dysku stanowiska i nie ma repozytorium pakietów
    en:
      - No substitute road for exchanging files with the server has been named, so the change will push people towards mail and removable media
      - Software rollouts on this machine are done by uploading a package from the workstation's drive and there is no package repository
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableCdm'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCdm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCdm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-app-compare

notes:
  pl: |
    Punkt jest odczuwalny w codziennej pracy i został tak oznaczony. Różni
    się tym od pozostałych przekierowań tej grupy, które zwykle przechodzą
    niezauważone.

    Wdrożenie warto wiązać ze wskazaniem drogi zastępczej, bo inaczej zmiana
    nie zdejmuje ryzyka, tylko je przenosi. Plik, którego nie da się
    przeciągnąć do sesji, i tak trafi na serwer — pocztą albo nośnikiem
    przenośnym, czyli kanałem równie nieprzejrzystym, a czasem gorszym.
    Aplikacja powinna pokazywać ten punkt razem z obszarem nośników
    wymiennych, bo to właśnie tam skutek ucieka.

    Reguła jest pierwszą z grupy przekierowań i najcięższą z nich. Pozostałe
    — schowek, porty, urządzenia typu plug and play — przenoszą mniej
    i kosztują mniej, więc mogą iść osobno i później.
  en: |
    The item is felt in daily work and has been marked as such. In that it differs
    from the other redirections of this group, which as a rule pass unnoticed.

    The rollout is worth tying to the naming of a substitute road, since otherwise
    the change does not take the risk away but moves it. A file that cannot be
    dragged into the session will reach the server anyway - by mail or on removable
    media, which is to say by a channel just as opaque and at times worse. The
    application should show this item together with the removable media area, since
    that is where the effect escapes to.

    The rule is the first of the redirection group and the heaviest of them. The
    rest - the clipboard, ports, plug and play devices - carry less and cost less,
    so they may go apart and later.
