id: win2025-gaming-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa uwierzytelniania w platformie gier wyłączona
    en: The authentication service of the gaming platform disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę uwierzytelniającą maszynę i użytkownika wobec
    platformy gier. Usługa ta zdobywa i odnawia poświadczenia
    pozwalające korzystać z usług platformy.

    Zostawiam kategorię niską, bo sama platforma na serwerze nie ma
    zastosowania, ale rzecz, której ten punkt dotyczy, jest w tej paczce
    powtarzalna i warto ją nazwać raz jeszcze.

    Usługa ta trzyma na maszynie materiał uwierzytelniający związany
    z kontem producenta, a więc z kontem spoza domeny. Znaczy to, że nie
    obejmuje go polityka haseł, nie widać go w przeglądzie kont, nie
    wygasa razem z czyimś zatrudnieniem i nie znika, kiedy administrator
    usuwa konto w katalogu. Jest to ten sam kształt sprawy, który
    zapisałem przy kluczu do zdalnej powłoki i przy tożsamości platformy
    równorzędnej: dostęp, który przeżywa administrowanie kontami, bo nie
    jest kontem.

    Waga jest tu mniejsza niż tam, bo to, do czego takie poświadczenie
    otwiera drogę, nie jest tą maszyną ani jej danymi. Dlatego kategoria
    niska, a nie wyższa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: materiał
    uwierzytelniający leżący na serwerze i niepodlegający żadnemu
    przeglądowi kont prowadzonemu w tej organizacji.
  en: |
    The item switches off the service that proves the machine and the user to the gaming board. That
    service comes by and makes anew the tokens that let the workings of the board be drawn upon.

    I leave the category low, the board itself having upon a server no use, but the thing this item
    bears upon comes again and again in this pack and is worth the naming once more.

    That service keeps upon the machine stuff of proving bound to a maker's standing, and therefore to
    a standing outside the household. That means the rule of watchwords does not take it in, it is not
    seen in the looking over of standings, it does not fall in with somebody's hiring and it goes not
    away when a ruler does away with a standing in the roll. It is the same shape of matter I set down
    at the key to the far-off shell and at the who-one-is of the board of equals - a reach that
    outlives the ruling of standings, because it is no standing.

    The weight is here less than there, what such a token opens a road to being neither that machine
    nor its data. Therefore the category is low and no higher.

    What an attacker gains while the item goes unmet - stuff of proving lying upon a server and falling
    under no looking over of standings held within that household.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Na serwerze nie ma zastosowania
    platformy gier, więc nie ma czego uwierzytelniać i nikt nie zauważy
    braku.

    Zapisuję jedno rozróżnienie, żeby nikt nie odczytał tej reguły
    szerzej, niż sięga. Punkt ten nie dotyczy logowania do systemu
    kontem producenta w ogóle — to jest osobna sprawa, opisana osobnym
    punktem, i ta zmiana jej nie załatwia. Dotyczy wyłącznie
    poświadczeń jednej platformy. Wyłączenie tej usługi zamyka jedno
    miejsce, w którym takie poświadczenie leży, i nie zamyka pozostałych.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem i, jak reszta tej rodziny, zapada tą samą
    decyzją co pozostałe jej składniki.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". Upon a server there is no use of the gaming board, so there is
    nothing to prove and nobody will mark the want of it.

    I set down one sundering, that nobody read this rule wider than it reaches. This item bears not
    upon the signing into the system by a maker's standing at large - that is a matter of its own,
    told of in an item of its own, and this change settles it not. It bears only upon the tokens of one
    board. The switching off of that service shuts one stead wherein such a token lies and shuts not
    the others.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk and, like the rest of that
    kin, falls by the same deciding as its other pieces.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna i użytkownik przestają być uwierzytelniani wobec platformy gier
      - Na serwerze nie ma zastosowania tej platformy, więc nikt nie zauważy braku
      - Punkt nie dotyczy logowania do systemu kontem producenta w ogóle i tej sprawy nie załatwia
      - Zamknięte zostaje jedno miejsce, w którym leży poświadczenie spoza domeny, a nie wszystkie
    en:
      - The machine and the user stop being proven to the gaming board
      - Upon a server there is no use of that board, so nobody will mark the want of it
      - The item bears not upon the signing into the system by a maker's standing at large and settles not that matter
      - One stead wherein a token from outside the household lies is shut, and not all of them
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna celowo korzysta z usług platformy gier i potrzebuje do tego poświadczeń
    en:
      - The machine draws upon the workings of the gaming board on purpose and takes tokens for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblAuthManager'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This closes one place where credentials tied to an account outside the
    # domain are held. It does not cover signing in to the system with a vendor
    # account - that is a separate item and is not settled here.
    Stop-Service -Name 'XblAuthManager' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblAuthManager' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XblAuthManager' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Usługa trzyma materiał uwierzytelniający związany z kontem spoza
    domeny: nie obejmuje go polityka haseł, nie widać go w przeglądzie
    kont, nie wygasa razem z czyimś zatrudnieniem. Ten sam kształt
    sprawy, co przy kluczu do zdalnej powłoki i przy tożsamości
    platformy równorzędnej — dostęp, który przeżywa administrowanie
    kontami, bo nie jest kontem.

    Waga mniejsza niż tam, bo to, do czego takie poświadczenie otwiera
    drogę, nie jest tą maszyną ani jej danymi.

    Punkt nie dotyczy logowania do systemu kontem producenta w ogóle —
    to osobna sprawa i ta zmiana jej nie załatwia.
  en: |
    The service keeps stuff of proving bound to a standing outside the household - the rule of
    watchwords takes it not in, it is not seen in the looking over of standings, it falls not in with
    somebody's hiring. The same shape of matter as at the key to the far-off shell and at the
    who-one-is of the board of equals - a reach that outlives the ruling of standings, because it is no
    standing.

    The weight is less than there, what such a token opens a road to being neither that machine nor its
    data.

    The item bears not upon the signing into the system by a maker's standing at large - that is a
    matter of its own and this change settles it not.
