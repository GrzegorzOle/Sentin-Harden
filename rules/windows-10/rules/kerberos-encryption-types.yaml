id: win10-kerberos-encryption-types

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Dozwolone typy szyfrowania biletów ograniczone do obecnych
    en: The permitted ticket encryption kinds held to the present-day ones
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza zestaw sposobów szyfrowania biletów
    uwierzytelniających do tych obecnych i odcina odmiany sprzed lat.

    Bilet jest zaszyfrowany kluczem wyprowadzonym z hasła konta, któremu
    służy. Zestaw dopuszczony decyduje więc nie o tym, jak bilet podróżuje,
    tylko o tym, ile trzeba pracy, żeby z przechwyconego biletu odtworzyć
    hasło.

    Odmiany starsze czynią tę pracę wykonalną. Napastnik, który ma konto
    w domenie, może poprosić o bilet do usługi i dostaje go zaszyfrowany
    kluczem z hasła konta usługi — a potem odtwarza hasło u siebie, bez
    kontaktu z siecią i bez śladu w dziennikach. Odcięcie odmian starszych
    zamyka tę drogę, bo klucze obecne opierają się takiej pracy.

    Odnotowuję rzecz istotną: wartość jest sumą znaczników, a nie wyborem
    jednej pozycji, i porównanie musi być dokładne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odtworzenia hasła konta usługi z przechwyconego biletu, bez kontaktu
    z siecią.
  en: |
    The setting holds the set of ways of encrypting authenticating tickets to the present-day ones and cuts off
    the kinds of years ago.

    A ticket is encrypted by a key drawn from the password of the account it serves. The set allowed settles
    therefore not how a ticket travels but how much work it takes to recover a password from a caught ticket.

    The older kinds make that work doable. An attacker holding an account in the domain may ask for a ticket to
    a service and gets it encrypted by a key from the service account's password - and then recovers the
    password at home, without touching the network and without a trace in the logs. Cutting off the older kinds
    closes that road, the present-day keys withstanding such work.

    I set down a thing that matters: the value is a sum of flags and not a choosing of one entry, and the
    matching has to be exact.

    What an attacker gains while the item goes unmet: the means of recovering a service account's password from
    a caught ticket, without touching the network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy domeny, nie tej
    maszyny.

    Sama maszyna po zmianie prosi o bilety w odmianach obecnych i dostaje
    je, o ile kontroler i konto usługi takie odmiany obsługują. Kontrolery
    wspierane obsługują je od lat.

    Kłopot dotyczy kont usług utworzonych dawno i nigdy nieprzestawionych
    oraz relacji zaufania z domenami starszymi. Jeśli konto usługi ma klucz
    wyłącznie w odmianie starszej, maszyna po zmianie nie dostanie biletu do
    tej usługi i dostęp do niej zniknie.

    Objaw jest mylący: usługa zgłasza błąd uwierzytelnienia, a konto i hasło
    są poprawne. Przyczyna leży w odmianie szyfrowania, o której komunikat
    nie wspomina.

    Poza domeną ustawienie nie ma zastosowania praktycznego.

    Czego to nie psuje: logowania kontami lokalnymi, udziałów plikowych,
    uprawnień do zasobów, drukowania, aplikacji lokalnych, sieci.
  en: |
    The class is "needs review", and the review touches the domain, not this machine.

    The machine itself after the change asks for tickets in the present-day kinds and gets them, so far as the
    controller and the service account serve such kinds. Supported controllers have served them for years.

    The trouble touches service accounts made long ago and never reset, and trust relationships with older
    domains. Where a service account holds a key in an older kind alone, the machine will after the change get
    no ticket to that service, and its reach to it will go.

    The symptom misleads: the service reports an authentication error while the account and the password are
    right. The cause lies in an encryption kind the message does not mention.

    Outside a domain the setting has no practical bearing.

    What this does not break: logging on by local accounts, file shares, the rights upon resources, printing,
    local applications, or the network.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Usługi, których konta mają klucz wyłącznie w odmianie starszej, przestają być dostępne z tej maszyny
      - Relacje zaufania z domenami starszymi mogą przestać wydawać bilety akceptowane przez tę maszynę
      - Objaw myli, bo usługa zgłasza błąd uwierzytelnienia mimo poprawnego konta i hasła
      - Poza domeną ustawienie nie ma zastosowania praktycznego i nie zmienia niczego
      - Logowanie kontami lokalnymi, udziały plikowe, uprawnienia do zasobów i drukowanie pozostają bez zmian
    en:
      - Services whose accounts hold a key in an older kind alone cease being reachable from this machine
      - Trust relationships with older domains may cease issuing tickets this machine will take
      - The symptom misleads, the service reporting an authentication error though the account and password are right
      - Outside a domain the setting has no practical bearing and changes nothing
      - Logging on by local accounts, file shares, the rights upon resources and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W domenie pozostają konta usług z kluczem wyłącznie w odmianie sprzed lat, a hasła nie zostały przestawione
      - Maszyna korzysta z usług w domenie połączonej relacją zaufania, której odmian szyfrowania nie ustalono
    en:
      - There remain in the domain service accounts with a key in a kind of years ago alone, and the passwords have not been reset
      - The machine uses services in a domain joined by a trust relationship whose encryption kinds have not been established
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
      $name = 'SupportedEncryptionTypes'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2147483640'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
    $name = 'SupportedEncryptionTypes'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where a service account still holds a key in an older kind alone, the ticket
    # will not be issued and the service will report an authentication error
    # though account and password be right.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SupportedEncryptionTypes' -Value 2147483640 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-configure-encryption-types-allowed-for-kerberos

notes:
  pl: |
    Reguła zamyka blok i jest w nim jedyną, której przedmiot sprawdzenia
    leży poza maszyną. Warto, żeby aplikacja to powiedziała wprost — wynik
    zależy od stanu kont usług w domenie, a tego z tej maszyny nie widać.

    Argument wart zachowania dotyczy pracy bez sieci. Bilet przechwycony
    raz rozkłada się u napastnika, bez kolejnych zapytań i bez śladu
    w dziennikach. Jest to powód, dla którego punkt ma kategorię wysoką
    mimo tego, że sam niczego nie otwiera.

    Odnotowuję postać wartości, tak jak przy regułach o zabezpieczeniu
    sesji: jest to suma znaczników, więc spełnienie częściowe jest
    niezgodnością, a raport powinien pokazywać wartość odczytaną, nie samo
    słowo o niezgodności.
  en: |
    The rule closes the block and is the only one in it whose object of review lies outside the machine. It is
    well that the application say so outright - the outcome hangs upon the state of the domain's service
    accounts, and that cannot be seen from here.

    The argument worth keeping touches work without a network. A ticket caught once is taken apart at the
    attacker's own place, without further queries and without a trace in the logs. It is the reason the item
    carries a high category though of itself it opens nothing.

    I set down the value's shape, as at the rules about a session's guard: it is a sum of flags, so a partial
    meeting is a mismatch, and the report ought to show the value read rather than the word "mismatch" alone.
