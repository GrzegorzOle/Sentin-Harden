id: win10-application-log-size

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Application
  title:
    pl: Maksymalny rozmiar dziennika aplikacji
    en: The greatest size of the journal of applications
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby dziennik aplikacji mieścił co najmniej
    trzydzieści dwa tysiące kilobajtów zapisów.

    Dziennik aplikacji zbiera to, co programy mówią o sobie same: błędy,
    awarie, nieudane próby zapisu, zgłoszenia od usług i od składników
    systemu działających po stronie użytkownika. Jest to dziennik
    najgłośniejszy z trzech i zapełnia się najszybciej.

    Rozmiar rozstrzyga, jak daleko wstecz da się spojrzeć. Dziennik mały
    mieści kilka dni, a na maszynie z rozmownym programem — kilka godzin.
    Po tym czasie wpisy starsze znikają, bo ustępują miejsca nowym.

    Wartością nie jest sam zapis, tylko okres, z którego da się go
    odczytać. Nieprawidłowość bywa zauważona z opóźnieniem, a osoba
    badająca ją sięga do dziennika po fakcie. Jeżeli wpisy z tamtego dnia
    już się nie mieszczą, praca zaczyna się od zera.

    Odnotowuję, że sprawdzenie przyjmuje wartości większe niż wymagana,
    a przy braku zasady odczytuje rozmiar ustawiony na samym dzienniku.
    Maszyna ustawiona ręcznie nie jest raportowana jako nieoceniona.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: krótszy
    okres, z którego da się odtworzyć przebieg zdarzeń.
  en: |
    The setting calls for the journal of applications to hold at least two and thirty thousand kilobytes of
    records.

    The journal of applications gathers what programs say of themselves: faults, breakdowns, writings that did not
    come through, word from services and from the system's parts working upon the user's side. It is the loudest
    of the three and fills up the soonest.

    The size settles how far back one may look. A small journal holds some days, and upon a machine with a
    talkative program some hours. After that span the older entries vanish, giving place to the new.

    The worth lies not in the record itself but in the span it may be read over. A wrongness is at times marked
    late, and whoever looks into it reaches for the journal after the fact. If the entries of that day no longer
    fit, the work begins from nought.

    I set down that the check takes values greater than the one called for, and where no policy stands reads the
    size set at the journal itself. A machine set by hand is not reported as unmeasured.

    What an attacker gains while the item goes unmet: a shorter span over which the course of happenings may be
    put back together.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana zwiększa plik dziennika na dysku systemowym. Trzydzieści dwa
    tysiące kilobajtów to około trzydziestu dwóch megabajtów na dziennik,
    a przy wszystkich trzech — niecały sto megabajtów. Na maszynie
    z dyskiem o rozsądnym zapasie jest to wielkość niezauważalna.

    Odnotowuję jedyne miejsce warte uwagi: maszyny z bardzo małym dyskiem
    systemowym, na przykład terminale i maszyny wirtualne przycięte do
    minimum. Tam warto policzyć miejsce przed zmianą.

    Dziennik nie jest przycinany przy zmniejszaniu rozmiaru w dół, więc
    wycofanie zmiany zostawia plik takim, jaki jest, aż do jego
    wyczyszczenia.

    Skutek pojawia się natychmiast, bez restartu i bez restartu usługi.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, pracy
    programów, logowania, drukowania.
  en: |
    The class is "no disruption".

    The change makes the journal's file upon the system's disk greater. Two and thirty thousand kilobytes is some
    two and thirty megabytes to a journal, and at all three together not a hundred. Upon a machine with a disk of
    sensible room to spare it is a size not to be marked.

    I set down the one place worth notice: machines with a very small system disk, terminals and virtual machines
    pared to the least, say. There it is worth reckoning the room before the change.

    The journal is not cut back when the size is lowered, so the going back of the change leaves the file as it
    is, until it is cleared.

    The consequence shows at once, with no restart and no restart of the service.

    What this does not break: the writing of happenings, the reading of the journal, the work of programs, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Plik dziennika na dysku systemowym urośnie do około trzydziestu dwóch megabajtów
      - Na maszynie z bardzo małym dyskiem systemowym warto policzyć miejsce przed zmianą
      - Wycofanie zmiany nie przycina istniejącego pliku, który zostaje taki, jaki jest, aż do wyczyszczenia
      - Skutek pojawia się natychmiast, bez restartu maszyny i bez restartu usługi dziennika
      - Zapisywanie zdarzeń, odczyt dziennika, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - The journal s file upon the system s disk will grow to some two and thirty megabytes
      - Upon a machine with a very small system disk it is worth reckoning the room before the change
      - The going back of the change does not cut the standing file, which stays as it is until it is cleared
      - The consequence shows at once, with no restart of the machine and no restart of the service of the journal
      - The writing of happenings, the reading of the journal, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk systemowy jest przycięty do minimum i nie ma na nim zapasu na powiększenie dzienników
    en:
      - The system disk is pared to the least and holds no room to spare for the enlarging of the journals
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Where the policy value is absent the log still has a size in force, set at
      # the log itself. The effective state is read rather than the policy alone,
      # so a machine set by hand is not reported as unmeasured.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        $log = Get-WinEvent -ListLog Application -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written in kilobytes, not in bytes - a size given in bytes
    # would be read as a log some thousand times larger than meant.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła ma sens wyłącznie razem z punktem o zachowaniu dziennika po
    zapełnieniu i warto, żeby aplikacja pokazała je obok siebie. Rozmiar
    mówi, ile się mieści; zachowanie mówi, co się dzieje, gdy się już nie
    mieści. Wdrożenie jednego bez drugiego zostawia połowę sprawy
    nierozstrzygniętą.

    Argument wart zachowania dotyczy tego, czego ten punkt broni. Nie
    broni zapisu — zapis działa tak samo przy dzienniku małym i dużym.
    Broni okresu, z którego da się ten zapis odczytać, a to jest
    cecha ujawniająca się dopiero wtedy, gdy ktoś sięga wstecz.

    Odnotowuję, że dziennik aplikacji jest z trzech najgłośniejszy. Jeden
    rozmowny program potrafi zapełnić go w kilka godzin, więc na maszynie
    z takim programem wartość wymaganą warto potraktować jako dolną
    granicę, a nie jako cel.
  en: |
    The rule has sense only together with the item about the journal's behaviour once it fills, and it is well
    that the application show them beside each other. The size says how much fits; the behaviour says what becomes
    of what does not. The rolling out of one without the other leaves half the matter unsettled.

    The argument worth keeping touches what this item guards. It guards not the record - the writing works the
    same at a small journal and a great. It guards the span over which that record may be read, and that is a
    property showing itself only where somebody reaches back.

    I set down that the journal of applications is the loudest of the three. One talkative program can fill it in
    some hours, so upon a machine with such a program the called-for value is best taken for a lower bound and not
    for a mark to reach.
