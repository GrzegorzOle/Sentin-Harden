id: win2016-device-install-deny-dma-capable-ids

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Zakaz instalowania kontrolerów sięgających wprost do pamięci
    en: Controllers reaching straight into memory forbidden to install
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania instalowania sterowników dla dwóch klas kontrolerów
    sięgających z założenia wprost do pamięci maszyny — i robi to wstecznie,
    więc wyłącza również te, które już są zainstalowane.

    Rzecz dotyczy sposobu, w jaki te kontrolery działają, a nie tego, co się
    do nich podłącza. Urządzenie na takim złączu czyta i zapisuje pamięć
    maszyny bez pośrednictwa procesora, bo po to złącze powstało: szybkość
    brała się właśnie z pominięcia tej drogi.

    Skutkiem jest to, że urządzenie podłączone do takiego kontrolera ma
    dostęp do pamięci, w której leżą poświadczenia, klucze i zawartość
    sesji zalogowanych. Nie musi niczego łamać ani obchodzić — wystarczy,
    że czyta.

    Ekran blokady nie stanowi tu przeszkody. Maszyna zablokowana ma pamięć
    pełną tego samego, co maszyna odblokowana, a kontroler czyta ją tak
    samo. Jest to najkrótsza znana droga od dostępu fizycznego do
    poświadczeń.

    Różnica wobec reguł o autoodtwarzaniu jest zasadnicza: tamte dotyczyły
    zawartości nośnika, ta dotyczy samego kanału.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    pamięci maszyny po podłączeniu urządzenia do złącza, również gdy ekran
    jest zablokowany.
  en: |
    The setting forbids drivers to be installed for two classes of controller
    reaching by design straight into the machine's memory - and it does so
    backwards, so it also switches off those already installed.

    The matter concerns the way those controllers work, not what gets plugged into
    them. A device on such a connector reads and writes the machine's memory without
    the processor between, that being what the connector was made for: the speed
    came precisely from leaving that road out.

    The upshot is that a device attached to such a controller has access to the
    memory holding credentials, keys and the contents of signed-in sessions. It need
    break nothing and get round nothing - it is enough that it reads.

    A lock screen is no obstacle here. A locked machine has its memory full of the
    same things an unlocked one has, and the controller reads it just the same. This
    is the shortest known road from physical access to credentials.

    The difference from the rules about automatic playing is fundamental: those
    concerned a medium's contents, this one concerns the channel itself.

    What an attacker gains while the item goes unmet: a read of the machine's memory
    once a device is attached to the connector, the screen being locked included.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rozstrzygają dwie rzeczy:
    wsteczność i restart.

    Wsteczność znaczy, że punkt nie ogranicza się do sprzętu podłączanego
    w przyszłości. Kontroler należący do tych klas i już obecny w maszynie
    zostanie wyłączony. Jeżeli coś z niego korzystało, przestanie działać
    po restarcie — a przyczyna nie będzie widoczna w żadnym komunikacie.

    Na serwerze sprzęt taki bywa obecny częściej, niż podpowiada intuicja.
    Stacja dokująca, przejściówka do pamięci masowej używana przy
    odtwarzaniu kopii, karta rozszerzeń podłączana zewnętrznie, obudowa
    dyskowa na szybkim złączu zewnętrznym — każda z nich może należeć do
    blokowanych klas.

    Restart jest tu warunkiem, nie skutkiem ubocznym. Punkt zaczyna działać
    dopiero po nim i przed nim raport nie powie prawdy o stanie maszyny.

    Cofnięcie również wymaga restartu, więc pomyłka przy wdrożeniu kosztuje
    drugie okno serwisowe, a nie minutę.

    Uwaga o ustaleniu, do czego służył obecny kontroler, siedzi w poleceniu
    naprawczym.

    Czego to nie psuje: dysków wewnętrznych, sieci, usług, logowania,
    urządzeń na złączach nienależących do blokowanych klas.
  en: |
    The class is "needs a planned rollout", and two things settle it: the working
    backwards and the restart.

    Working backwards means the item is not held to hardware plugged in hereafter. A
    controller belonging to these classes and already present in the machine will be
    switched off. If anything was using it, it will stop working after the restart -
    and the cause will show in no message.

    On a server such hardware is present more often than intuition suggests. A
    docking station, an adapter for mass storage used at the restoring of a backup,
    an expansion card attached externally, a disk enclosure on a fast external
    connector - each of them may belong to the blocked classes.

    The restart is a condition here rather than a side effect. The item begins
    working only after it, and before it the report will not tell the truth about
    the machine's state.

    Undoing it calls for a restart too, so a mistake at rollout costs a second
    service window rather than a minute.

    The remark about establishing what the present controller served sits in the
    remedial command.

    What this does not break: internal disks, the network, services, signing in, or
    devices on connectors outside the blocked classes.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Kontroler należący do blokowanych klas i już obecny w maszynie zostaje wyłączony po restarcie, a przyczyna nie pojawia się w żadnym komunikacie
      - Stacja dokująca, obudowa dyskowa na szybkim złączu zewnętrznym i przejściówka używana przy odtwarzaniu kopii mogą przestać działać
      - Punkt zaczyna działać dopiero po restarcie, więc przed nim raport nie mówi prawdy o stanie maszyny
      - Cofnięcie także wymaga restartu, więc pomyłka kosztuje drugie okno serwisowe
    en:
      - A controller of the blocked classes already present in the machine is switched off after the restart, and the cause appears in no message
      - A docking station, a disk enclosure on a fast external connector and an adapter used at the restoring of a backup may stop working
      - The item begins working only after the restart, so before it the report does not tell the truth about the machine's state
      - Undoing it calls for a restart too, so a mistake costs a second service window
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Odtwarzanie kopii zapasowej na tej maszynie opiera się na obudowie dyskowej podłączanej szybkim złączem zewnętrznym
      - W maszynie pracuje karta rozszerzeń należąca do blokowanych klas i nie ustalono, co z niej korzysta
      - Okna serwisowego z restartem nie da się uzyskać, a punkt bez restartu nie zadziała
    en:
      - The restoring of a backup on this machine rests on a disk enclosure attached by a fast external connector
      - An expansion card of the blocked classes works in the machine and it has not been established what uses it
      - A service window with a restart cannot be had, and without a restart the item will not take effect
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $deny = $item.DenyDeviceIDs
        $retroactive = $item.DenyDeviceIDsRetroactive
        $listKey = Join-Path $path 'DenyDeviceIDs'
        $listed = @()
        if (Test-Path -Path $listKey) {
          $listed = @(
            (Get-ItemProperty -Path $listKey -ErrorAction Stop).PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { ([string]$_.Value).Trim().ToUpperInvariant() }
          )
        }
        $absent = @(@('PCI\CC_0C0010', 'PCI\CC_0C0A') | Where-Object { $listed -notcontains $_ })
        if ($null -eq $deny -or $null -eq $retroactive) { 'MISSING' }
        elseif ([int]$deny -eq 1 -and [int]$retroactive -eq 1 -and $absent.Count -eq 0) { 'DENIED_RETROACTIVELY' }
        else { 'DENY=' + $deny + ' RETROACTIVE=' + $retroactive + ' ABSENT=' + ($absent -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DENIED_RETROACTIVELY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $listKey = Join-Path $path 'DenyDeviceIDs'
    $entries = @()
    if (Test-Path -Path $listKey) {
      $entries = @(
        (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties |
          Where-Object { $_.Name -notlike 'PS*' } |
          ForEach-Object { [pscustomobject]@{ name = $_.Name; value = [string]$_.Value } }
      )
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = (Test-Path -Path $path)
      deny          = $item.DenyDeviceIDs
      deny_existed  = ($null -ne $item.DenyDeviceIDs)
      retro         = $item.DenyDeviceIDsRetroactive
      retro_existed = ($null -ne $item.DenyDeviceIDsRetroactive)
      list_key      = $listKey
      list_existed  = (Test-Path -Path $listKey)
      entries       = $entries
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This works backwards - a controller of these classes already sitting in the
    # machine stops working after the restart. On a server, establish first what
    # that controller was for.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyDeviceIDs' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DenyDeviceIDsRetroactive' -Value 1 -Type DWord
    $listKey = Join-Path $path 'DenyDeviceIDs'
    if (-not (Test-Path -Path $listKey)) { New-Item -Path $listKey -Force | Out-Null }
    # Entries put here by somebody else guard against something this rule knows
    # nothing about, so the list is added to and never replaced.
    $taken = @{}
    $present = @()
    foreach ($property in (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties) {
      if ($property.Name -notlike 'PS*') {
        $taken[$property.Name] = $true
        $present += ([string]$property.Value).Trim().ToUpperInvariant()
      }
    }
    $index = 1
    foreach ($id in @('PCI\CC_0C0010', 'PCI\CC_0C0A')) {
      if ($present -notcontains $id) {
        while ($taken.ContainsKey([string]$index)) { $index++ }
        New-ItemProperty -Path $listKey -Name ([string]$index) -Value $id -PropertyType String -Force | Out-Null
        $taken[[string]$index] = $true
      }
    }

  rollback_command: |
    # The list is restored wholesale, so this also undoes what a neighbouring device
    # installation rule appended afterwards. Roll these back in the reverse order
    # they were applied.
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.deny_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceIDs' -Value $b.deny -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceIDs' -ErrorAction SilentlyContinue
    }
    if ($b.retro_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceIDsRetroactive' -Value $b.retro -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceIDsRetroactive' -ErrorAction SilentlyContinue
    }
    Remove-Item -Path $b.list_key -Recurse -Force -ErrorAction SilentlyContinue
    if ($b.list_existed) {
      New-Item -Path $b.list_key -Force | Out-Null
      foreach ($entry in @($b.entries)) {
        New-ItemProperty -Path $b.list_key -Name $entry.name -Value $entry.value -PropertyType String -Force | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-device-installation-with-group-policy

notes:
  pl: |
    Punkt jest w całym bloku najmocniejszy i zarazem najdroższy we
    wdrożeniu. Warto to zestawienie pokazać wprost: zamyka najkrótszą drogę
    od dostępu fizycznego do poświadczeń, a kosztuje okno serwisowe
    i ryzyko wyłączenia sprzętu, o którym nikt nie pamiętał.

    Lista identyfikatorów jest uzupełniana, a nie zastępowana. Wpisy
    umieszczone tam wcześniej przez kogoś innego bronią przed czymś, o czym
    ta reguła nie wie, i ich usunięcie byłoby cichym cofnięciem cudzej
    decyzji.

    Z tego samego powodu wycofanie odtwarza listę w całości, więc cofa
    również to, co dopisała reguła sąsiednia. Obie reguły o listach
    urządzeń należy wycofywać w kolejności odwrotnej do zastosowania
    i aplikacja powinna o tym mówić przed wykonaniem.

    Punkt sąsiaduje z regułą o wstrzymywaniu urządzeń do czasu zalogowania.
    Tamta wstrzymuje urządzenie, ta nie pozwala mu zaistnieć. Tamta broni
    maszyny zablokowanej, ta broni jej zawsze.
  en: |
    The item is the strongest in the whole block and at the same time the dearest to
    roll out. That pairing is worth showing outright: it shuts the shortest road
    from physical access to credentials, and it costs a service window and the risk
    of switching off hardware nobody remembered.

    The list of identifiers is added to rather than replaced. Entries put there
    earlier by somebody else guard against something this rule knows nothing about,
    and removing them would be a quiet undoing of another's decision.

    For the same reason the rollback restores the list wholesale, so it also undoes
    what the neighbouring rule appended. Both rules about device lists should be
    rolled back in the reverse order of their application, and the application ought
    to say so before execution.

    The item stands next to the rule about holding devices back until a sign-in.
    That one holds a device back; this one does not let it come into being at all.
    That one guards a locked machine, this one guards it always.
