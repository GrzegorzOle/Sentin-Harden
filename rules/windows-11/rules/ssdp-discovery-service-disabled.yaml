id: win11-ssdp-discovery-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa wykrywania urządzeń w sieci lokalnej wyłączona
    en: The local network device discovery service disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa odnajduje w sieci lokalnej urządzenia, które same się ogłaszają:
    telewizory, odbiorniki obrazu, drukarki, routery, głośniki. Odbywa się to
    przez rozgłaszanie zapytań do całej sieci i słuchanie odpowiedzi, bez
    jakiegokolwiek uwierzytelnienia — urządzeniem jest to, co się za nie poda.

    Brak uwierzytelnienia jest tu sednem, a nie niedopatrzeniem: protokół
    powstał po to, żeby sprzęt domowy działał bez konfiguracji. W sieci
    organizacji ta sama właściwość znaczy, że dowolna maszyna może ogłosić się
    urządzeniem i zostać przyjęta. Odpowiedź niesie adres, pod którym system
    pobierze opis urządzenia — czyli wskazuje, dokąd maszyna sama się połączy,
    zanim ktokolwiek cokolwiek kliknie.

    Druga strona jest równie istotna. Maszyna z włączoną usługą sama się
    ogłasza i odpowiada na cudze zapytania, oddając przy tym swoją nazwę,
    adres i informacje o tym, co obsługuje. Dla kogoś rozpoznającego sieć jest
    to spis maszyn dostarczony bez wysiłku i bez śladu skanowania.

    Wyłączenie usługi zdejmuje obie te role: maszyna przestaje szukać
    i przestaje się ogłaszać.
  en: |
    The service finds devices on the local network that announce themselves:
    televisions, picture receivers, printers, routers, speakers. It happens by
    broadcasting enquiries to the whole network and listening for answers, with no
    authentication whatever - a device is whatever says it is one.

    The absence of authentication is the heart of it rather than an oversight: the
    protocol came about so that household equipment would work without configuration. On
    an organisation's network that same property means any machine at all can announce
    itself a device and be taken as one. The answer carries an address from which the
    system will fetch a description of the device - that is, it points at where the
    machine will connect of its own accord, before anybody clicks anything.

    The other side matters just as much. A machine with the service on announces itself
    and answers others' enquiries, giving away its name, its address and information
    about what it handles. For somebody getting to know a network that is a list of
    machines delivered without effort and without a trace of scanning.

    Disabling the service takes away both roles: the machine stops searching and stops
    announcing itself.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś na tej maszynie korzysta z urządzeń
    odnajdywanych samoczynnie w sieci.

    Skutek jest wąski i łatwy do wskazania. Przestają pojawiać się na listach
    urządzenia, których nie skonfigurowano wprost: odbiorniki obrazu w salach
    konferencyjnych, głośniki, telewizory, drukarki widoczne dotąd „same
    z siebie". Urządzenia wpisane ręcznie — drukarka dodana po adresie, udział
    sieciowy po nazwie — działają dalej bez zmian.

    Dwa przypadki warto sprawdzić osobno. Pierwszy to rzutowanie obrazu
    bezprzewodowo: część odbiorników odnajduje się właśnie tą drogą i po
    wyłączeniu usługi trzeba będzie dodać je ręcznie albo zrezygnować.
    Drugi to odtwarzanie treści na urządzeniu domowym — spotykane rzadko
    w pracy, ale przestanie działać w całości.

    Na stanowisku, na którym praca opiera się na drukarkach dodanych przez
    dział informatyczny i na udziałach po nazwie, zmiana przechodzi
    niezauważona.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody on this machine uses devices found
    automatically on the network.

    The effect is narrow and easy to name. Devices that were never configured outright
    stop appearing in lists: picture receivers in meeting rooms, speakers, televisions,
    printers visible until now "of their own accord". Devices entered by hand - a
    printer added by address, a network share by name - carry on working unchanged.

    Two cases are worth checking separately. The first is casting a picture wirelessly:
    some receivers are found by exactly this route, and once the service is off they will
    have to be added by hand or given up. The second is playing content on household
    equipment - rarely met at work, but it will stop working altogether.

    At a workstation where the work rests on printers added by the computing department
    and on shares reached by name, the change passes unnoticed.

    There is no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - printing
    - user-interface
  what_breaks:
    pl:
      - Urządzenia odnajdywane samoczynnie znikają z list w oknach wyboru
      - Odbiornik obrazu w sali konferencyjnej może przestać być widoczny na liście
      - Odtwarzanie treści na urządzeniu domowym w sieci przestaje być możliwe
      - Drukarki i udziały dodane ręcznie działają dalej bez zmian
    en:
      - Devices found automatically disappear from the lists in selection windows
      - A picture receiver in a meeting room may stop appearing in the list
      - Playing content on household equipment on the network stops being possible
      - Printers and shares added by hand carry on working unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Odbiorniki obrazu w salach są odnajdywane wyłącznie tą drogą i nie da się dodać ich ręcznie
      - W sieci pracują urządzenia, które nie mają stałego adresu i są odszukiwane samoczynnie
    en:
      - Picture receivers in rooms are found by this route alone and cannot be added by hand
      - The network holds devices with no fixed address that are found automatically
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SSDPSRV'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'SSDPSRV' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SSDPSRV' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SSDPSRV' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Usługa tworzy parę z usługą udostępniania maszyny jako urządzenia, opisaną
    osobną regułą. Ta odnajduje cudze urządzenia, tamta udostępnia tę maszynę
    jako urządzenie. Wyłączenie jednej bez drugiej zostawia połowę drogi
    otwartą i obie warto wdrażać razem.

    Zatrzymanie usługi pociąga za sobą zatrzymanie tej drugiej, bo zależy ona
    od niej. Nie zmienia to jednak jej ustawienia uruchamiania — po restarcie
    wróciłaby, gdyby nie została wyłączona osobno. Jest to najczęstsza
    przyczyna wniosku, że jedna reguła załatwiła obie.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The service forms a pair with the one sharing the machine as a device, described by
    a rule of its own. This one finds other people's devices, that one shares this
    machine as a device. Disabling one without the other leaves half the route open and
    both are worth rolling out together.

    Stopping the service stops that other one too, since it depends on it. That does not
    change its startup setting, though - after a restart it would come back had it not
    been disabled separately. This is the commonest cause of concluding that one rule
    has settled both.

    The check reads the startup setting from the registry rather than the service's
    state at a given moment.
