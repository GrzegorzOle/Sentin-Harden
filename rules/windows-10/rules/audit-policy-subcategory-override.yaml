id: win10-audit-policy-subcategory-override

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Szczegółowe zasady inspekcji nadrzędne wobec kategorii starszych
    en: Detailed audit rules standing above the older categories
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga spór między dwoma sposobami opisania inspekcji na
    korzyść nowszego i dokładniejszego.

    W systemie żyją obok siebie dwa opisy tego, co ma być zapisywane:
    starszy, dzielący zdarzenia na dziewięć szerokich kategorii, i nowszy,
    dzielący je na kilkadziesiąt podkategorii. Wszystkie pozostałe reguły
    tego bloku, i większość reguł inspekcji w całej paczce, mówią językiem
    nowszym.

    Bez tego ustawienia opis starszy potrafi nadpisać nowszy. Skutek jest
    taki, że kilkadziesiąt starannie dobranych podkategorii zostaje
    zastąpionych jedną decyzją kategorii szerokiej — zwykle decyzją
    „nie zapisuj".

    Jest to reguła o naturze innej niż reszta bloku: sama niczego nie
    zapisuje. Sprawia, że zapisuje to, co zostało ustawione. Bez niej
    wszystkie pozostałe reguły inspekcji mogą być spełnione i bezczynne
    jednocześnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    unieważnienia całej szczegółowej konfiguracji inspekcji jedną zmianą
    w opisie starszym.
  en: |
    The setting settles the quarrel between two ways of setting out the audit in favour of the newer and the
    more exact.

    Two descriptions of what is to be written down live side by side in the system: the older, parting events
    into nine broad categories, and the newer, parting them into some dozens of subcategories. Every other rule
    in this block, and most of the audit rules in the whole pack, speak the newer tongue.

    Without this setting the older description may overwrite the newer. The consequence is that some dozens of
    carefully chosen subcategories are put aside for one decision of a broad category - as a rule the decision
    "do not write".

    It is a rule of another nature than the rest of the block: it writes nothing itself. It makes what has been
    set be written. Without it every other audit rule may be met and idle at once.

    What an attacker gains while the item goes unmet: the power to undo the whole detailed setting of the audit
    by one change in the older description.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy ktoś
    jeszcze posługuje się opisem starszym.

    Zmiana nie dotyka pracy maszyny i nie jest przez nikogo widoczna.
    Dotyka wyłącznie tego, który z dwóch opisów wygrywa.

    Sprawdzić trzeba narzędzia. Starsze skrypty konfiguracyjne i starsze
    szablony zasad potrafią ustawiać inspekcję kategoriami szerokimi.
    Po zmianie takie narzędzie wykona się bez błędu i nie odniesie skutku —
    objaw najgorszego rodzaju, bo cichy. Ustawienie trzeba wtedy przenieść
    na podkategorie.

    Odnotowuję skutek uboczny pożądany: zmiana odbiera opisowi starszemu
    możliwość wyłączenia inspekcji. Jest to jedyna droga, którą ktoś mógłby
    wygasić cały zapis, nie ruszając żadnej z ustawionych podkategorii.

    Czego to nie psuje: samej inspekcji, logowania, kont domenowych,
    udziałów plikowych, drukowania, aplikacji.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody still deals in the older
    description.

    The change does not touch the machine's working and is seen by nobody. It touches only which of the two
    descriptions wins.

    What has to be reviewed is the tooling. Older setting-up scripts and older policy templates may set the
    audit by broad categories. After the change such a tool will run without an error and take no effect - a
    symptom of the worst kind, being quiet. The setting then has to be carried over onto the subcategories.

    I set down a welcome side consequence: the change takes from the older description the power to switch the
    audit off. It is the one road by which somebody might put the whole record out without touching any of the
    subcategories set.

    What this does not break: the audit itself, logging on, domain accounts, file shares, printing, or
    applications.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Starsze skrypty i szablony zasad ustawiające inspekcję kategoriami szerokimi wykonują się bez błędu i nie odnoszą skutku
      - Objaw jest cichy, więc ustawienie trzeba przenieść na podkategorie, zanim ktoś zauważy brak zapisu
      - Zmiana odbiera opisowi starszemu możliwość wygaszenia całego zapisu jedną decyzją
      - Sama inspekcja działa dalej dokładnie w zakresie ustawionym podkategoriami
      - Logowanie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - Older scripts and policy templates setting the audit by broad categories run without an error and take no effect
      - The symptom is a quiet one, so the setting has to be carried onto the subcategories before anybody notices the want of a record
      - The change takes from the older description the power to put the whole record out by one decision
      - The audit itself works on exactly within the reach set by the subcategories
      - Logging on, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Inspekcję na tej maszynie ustawia narzędzie posługujące się kategoriami szerokimi i nie ma dla niego zamiennika
    en:
      - The audit upon this machine is set by a tool dealing in broad categories and there is no substitute for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key belongs to the authentication subsystem and is always there, so its
      # absence is a fault rather than a state.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'SCENoApplyLegacyAuditPolicy'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'SCENoApplyLegacyAuditPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The newer description wins from now on. A tool setting the audit by broad
    # categories will after this run without an error and take no effect.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SCENoApplyLegacyAuditPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/advanced-security-auditing

notes:
  pl: |
    Reguła otwiera blok i jest w całej paczce jedną z niewielu, których
    wartość polega wyłącznie na tym, że inne reguły zaczynają działać.
    Warto, żeby aplikacja pokazała ją przy każdej regule inspekcji jako
    warunek, a nie jako pozycję równorzędną na liście.

    Odnotowuję niebezpieczeństwo zgodności pozornej, tym razem odwrócone.
    Zwykle to reguła zależna jest bezużyteczna bez warunku. Tutaj
    kilkadziesiąt reguł inspekcji może świecić na zielono, a maszyna nie
    zapisywać nic — i żaden z tych punktów nie jest wtedy niezgodny.

    Argument wart zachowania dotyczy tego, co ta reguła odbiera
    napastnikowi. Zmiana w opisie starszym jest jedną czynnością wygaszającą
    cały zapis. Po zmianie takiej drogi nie ma i wyłączanie trzeba robić
    podkategoria po podkategorii, zostawiając ślad w każdej z nich.
  en: |
    The rule opens the block and is one of the few in the whole pack whose value lies wholly in this, that other
    rules begin to work. It is well that the application show it at every audit rule as a condition and not as
    an equal line upon a list.

    I set down the hazard of a seeming compliance, this time turned about. As a rule it is the dependent rule
    that is useless without its condition. Here some dozens of audit rules may shine green while the machine
    writes nothing - and none of those items is then at fault.

    The argument worth keeping touches what this rule takes from an attacker. A change in the older description
    is a single act putting the whole record out. After the change there is no such road, and the switching off
    has to be done subcategory by subcategory, leaving a trace in every one of them.
