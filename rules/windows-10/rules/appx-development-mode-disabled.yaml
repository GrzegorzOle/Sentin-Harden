id: win10-appx-development-mode-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Tryb deweloperski dla pakietów aplikacji wyłączony
    en: The mode of development for packages of applications switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera możliwość włączenia trybu deweloperskiego, w którym
    pakiet aplikacji uruchamia się wprost z katalogu, bez podpisu i bez
    spakowania.

    Tryb ten powstał dla osób piszących oprogramowanie. W trakcie pracy
    pakowanie i podpisywanie po każdej zmianie byłoby stratą czasu, więc
    system przyjmuje katalog z plikami i traktuje go jak zainstalowaną
    aplikację.

    Skutkiem ubocznym jest zniesienie właśnie tych dwóch sprawdzeń, na
    których opiera się cała reszta. Nie ma podpisu, więc nie ma wydawcy.
    Nie ma pakietu, więc nie ma skrótu ani wersji. Zawartość katalogu
    można podmienić w dowolnej chwili, a aplikacja przy następnym
    uruchomieniu weźmie to, co tam leży.

    Na stanowisku, na którym nikt nie pisze oprogramowania, tryb ten nie
    ma zastosowania, a jego włączenie jest jednym z prostszych sposobów
    na trwałe umieszczenie czegoś na maszynie.

    Odnotowuję, że tryb bywa włączany przypadkiem, przy szukaniu
    ustawienia obok. Jest to jeden z powodów, dla których warto mieć go
    zamkniętym zasadą, a nie wyłącznie ustawionym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    uruchomienie kodu jako aplikacji, bez podpisu i bez pakietu.
  en: |
    The setting takes away the power of turning on the mode of development, in which a package of an application
    is set going straight from a directory, without a signature and without being packed.

    That mode came about for people writing software. In the course of work the packing and signing after every
    change would be a loss of time, so the system takes a directory of files and holds it for a laid-on
    application.

    The consequence beside is the lifting of just those two checks upon which all the rest rests. There is no
    signature, so there is no issuer. There is no package, so there is neither digest nor version. The directory's
    content may be changed out at any hour, and the application at the next setting going will take what lies
    there.

    Upon a station where nobody writes software that mode has no use, and the turning of it on is among the
    simpler ways of putting something upon a machine for good.

    I set down that the mode is at times turned on by chance, at the seeking of a setting beside it. That is one
    of the grounds for holding it shut by policy and not merely set.

    What an attacker gains while the item goes unmet: the setting going of code as an application, without a
    signature and without a package.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    na maszynie ktoś pisze oprogramowanie.

    Miejscem oczywistym są stanowiska deweloperskie. Tam tryb ten jest
    narzędziem codziennym i punkt zamyka sposób pracy, a nie drobiazg.
    Na takich maszynach zasada powinna być inna niż na reszcie.

    Miejscem mniej oczywistym są stanowiska osób, które piszą narzędzia
    pomocnicze bez uważania się za deweloperów: analitycy, administratorzy,
    osoby przygotowujące wdrożenia. Tam tryb bywa włączony i używany
    rzadko, więc nikt o nim nie pamięta przy ocenie kosztu.

    Odnotowuję, że wyłączenie nie usuwa aplikacji uruchomionych w tym
    trybie wcześniej. Przestanie działać uruchamianie nowych.

    Skutek pojawia się natychmiast, bez restartu, i jest niewidoczny dla
    osoby, która z tego trybu nie korzystała.

    Czego to nie psuje: sklepu systemowego, pakietów już zainstalowanych,
    programów klasycznych, narzędzi wiersza poleceń, logowania,
    drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody upon the machine writes software.

    The plain place is stations of development. There that mode is a daily tool and the item shuts a manner of
    work and no trifle. Upon such machines the policy ought to be other than upon the rest.

    The less plain place is the stations of people who write helping tools without holding themselves makers of
    software: those who weigh data, those who keep the machines, those who make ready rollouts. There the mode is
    at times turned on and used seldom, so nobody remembers it at the grading of the cost.

    I set down that the switching off takes not away applications set going in that mode earlier. What will cease
    is the setting going of new ones.

    The consequence shows at once, with no restart, and is unseen by whoever used not that mode.

    What this does not break: the system's store, packages already laid on, programs of the older make, tools of
    the command line, logging on, or printing.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Stanowiska deweloperskie stracą sposób pracy, bo tryb ten jest tam narzędziem codziennym
      - Osoby piszące narzędzia pomocnicze bez uważania się za deweloperów bywają pominięte przy ocenie kosztu
      - Aplikacje uruchomione w tym trybie wcześniej działają dalej, przestaje działać uruchamianie nowych
      - Skutek jest niewidoczny dla osoby, która z tego trybu nie korzystała
      - Sklep systemowy, pakiety już zainstalowane, programy klasyczne, logowanie i drukowanie pozostają bez zmian
    en:
      - Stations of development will lose a manner of work, that mode being there a daily tool
      - People who write helping tools without holding themselves makers of software are at times passed over at the grading of the cost
      - Applications set going in that mode earlier work on, and what ceases is the setting going of new ones
      - The consequence is unseen by whoever used not that mode
      - The system s store, packages already laid on, programs of the older make, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest stanowiskiem deweloperskim, na którym tryb ten jest narzędziem codziennej pracy
    en:
      - The machine is a station of development upon which that mode is a tool of daily work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowDevelopmentWithoutDevLicense'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'AllowDevelopmentWithoutDevLicense'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDevelopmentWithoutDevLicense' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/apps/get-started/enable-your-device-for-development

notes:
  pl: |
    Reguła jest oceniona wysoko, choć dotyczy ustawienia wyglądającego na
    ciekawostkę. Warto, żeby aplikacja postawiła powód wprost: tryb ten
    znosi podpis i pakiet naraz, czyli obie rzeczy, na których opiera się
    rozpoznanie, skąd aplikacja pochodzi.

    Argument wart zachowania dotyczy trwałości. Katalog z plikami można
    podmienić w dowolnej chwili, a aplikacja przy następnym uruchomieniu
    weźmie nową zawartość. Nie ma tu ani wersji, ani skrótu, po których
    dałoby się zauważyć zmianę.

    Odnotowuję, że stanowiska deweloperskie wymagają zasady odrębnej.
    Aplikacja powinna to wymienić, żeby wdrożenie hurtowe nie objęło
    maszyn, na których punkt odcina pracę.
  en: |
    The rule is graded high, though it touches a setting that looks a curiosity. It is well that the application
    put the ground outright: that mode lifts the signature and the package at once, which is to say both things
    upon which rests the telling of whence an application comes.

    The argument worth keeping touches lastingness. A directory of files may be changed out at any hour, and the
    application at the next setting going will take the new content. There is here neither version nor digest by
    which the change might be marked.

    I set down that stations of development call for a policy apart. The application ought to name that, so that a
    rollout in bulk take not in machines where the item cuts off the work.
