id: win2016-driver-not-found-report-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation
  title:
    pl: Zgłaszanie braku sterownika do producenta wyłączone
    en: The reporting of a missing driver to the maker switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania wysyłać do producenta systemu zgłoszenie o tym, że
    dla podłączonego urządzenia nie znaleziono sterownika.

    Zgłoszenie takie niesie opis urządzenia: identyfikator sprzętowy,
    identyfikator wytwórcy, nazwę modelu i sposób podłączenia. Jest to
    niewiele, ale jest to informacja o sprzęcie, który ktoś do tej maszyny
    podłączył — a więc o czymś, co dzieje się przy niej fizycznie.

    Wartość punktu polega na tym, żeby wykaz urządzeń podłączanych do
    serwera nie opuszczał organizacji. Sam wykaz nie jest tajemnicą, ale
    składa się na obraz: jaki sprzęt pomiarowy, jakie czytniki, jakie
    nośniki pojawiają się przy tej maszynie i kiedy.

    Kategoria niska opisuje to uczciwie. Nie ma tu drogi ataku i nie ma
    danych organizacji w treści zgłoszenia. Jest natomiast zasada, że
    maszyna nie relacjonuje na zewnątrz tego, co się przy niej dzieje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: praktycznie
    nic bezpośrednio; poza organizację wychodzi natomiast wykaz sprzętu
    podłączanego do tej maszyny.
  en: |
    The setting forbids a report to be sent to the system's maker saying that no driver was
    found for a device plugged in.

    Such a report carries a description of the device: the hardware identifier, the maker's
    identifier, the model's name and the manner of its joining. It is little, but it is
    knowledge about hardware somebody plugged into this machine - and so about something
    happening at it physically.

    The item's worth lies in a register of the devices plugged into the server not leaving the
    organisation. The register itself is no secret, but it makes up a picture: what measuring
    hardware, what readers, what media appear at this machine and when.

    The low category describes that honestly. There is here no road of attack and no data of
    the organisation in the report's contents. There is, however, a principle that the machine
    does not relate outward what happens at it.

    What an attacker gains while the item goes unmet: practically nothing directly; what leaves
    the organisation, however, is a register of the hardware plugged into this machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zgłoszenie to nie służy niczemu, co dzieje się na maszynie. Sterownik
    i tak nie zostaje przez nie znaleziony — wyszukiwanie sterowników idzie
    inną drogą i wdrożenie jej nie dotyka.

    Warto to powiedzieć wprost, bo nazwa ustawienia bywa czytana jako
    wyłączenie wyszukiwania sterowników. Nie o to chodzi. Chodzi wyłącznie
    o zgłoszenie wysyłane po tym, jak wyszukiwanie zawiodło.

    Skutek dla użytkownika jest żaden. Urządzenie bez sterownika pozostaje
    urządzeniem bez sterownika, tak jak przedtem, i komunikat o tym
    wygląda tak samo.

    Bez restartu, natychmiast odwracalne. Nie ma znanych regresji.

    Czego to nie psuje: instalowania sterowników, wyszukiwania ich
    w witrynie aktualizacji, działania urządzeń już zainstalowanych, usług,
    sieci.
  en: |
    The class is "no disruption".

    That report serves nothing that happens on the machine. The driver is not found by it
    anyway - the seeking of drivers goes by another road and the rollout does not touch it.

    That is worth saying outright, the setting's name being at times read as a switching off of
    the seeking of drivers. That is not the matter. The matter is solely the report sent after
    the seeking has failed.

    The consequence for the user is none. A device without a driver stays a device without a
    driver, as before, and the message about it looks the same.

    No restart, undone immediately. There are no known regressions.

    What this does not break: the installing of drivers, their seeking in the update site, the
    working of devices already installed, services, or the network.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Wyszukiwanie sterowników idzie inną drogą i pozostaje bez zmian, mimo że nazwa ustawienia bywa tak czytana
      - Urządzenie bez sterownika pozostaje urządzeniem bez sterownika, a komunikat o tym wygląda tak samo
      - Znika wyłącznie zgłoszenie wysyłane po tym, jak wyszukiwanie zawiodło
      - Instalowanie sterowników, działanie urządzeń już zainstalowanych i usługi pozostają bez zmian
    en:
      - The seeking of drivers goes by another road and stays unchanged, though the setting's name is at times read so
      - A device without a driver stays a device without a driver, and the message about it looks the same
      - What goes away is solely the report sent after the seeking has failed
      - The installing of drivers, the working of devices already installed and services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Producent systemu prowadzi dla tej organizacji dochodzenie w sprawie nieobsługiwanego sprzętu i zgłoszenia są jego częścią
    en:
      - The system's maker is tracing unsupported hardware for this organisation and the reports are part of that
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
      $name = 'DisableSendGenericDriverNotFoundToWER'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    $name = 'DisableSendGenericDriverNotFoundToWER'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Settings'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableSendGenericDriverNotFoundToWER' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-overview

notes:
  pl: |
    Punkt tworzy parę z regułą o prośbie sterownika o dodatkowe
    oprogramowanie i obie warto wdrażać razem. Dotyczą tego samego kanału
    i tego samego momentu — podłączenia urządzenia — różniąc się wyłącznie
    tym, co zostaje zgłoszone.

    Najważniejsza rzecz do przekazania jest tu językowa, nie techniczna.
    Nazwa ustawienia mówi o sterowniku i o wyszukiwaniu, a reguła nie
    dotyczy ani sterownika, ani wyszukiwania — dotyczy zgłoszenia
    wysyłanego po fakcie. Bez tego zdania punkt wygląda na odcięcie maszyny
    od sterowników i bywa odpuszczany z tego powodu.

    Kategoria niska jest tu właściwa i nie warto jej podnosić. Zysk polega
    na tym, że maszyna przestaje relacjonować na zewnątrz zdarzenia
    fizyczne przy niej zachodzące — argument prawdziwy, ale słaby, i tak
    trzeba go podać.
  en: |
    The item makes a pair with the rule about a driver's request for additional software, and
    both are worth rolling out together. They concern the same channel and the same moment -
    the plugging in of a device - differing solely in what is reported.

    The most important thing to convey is here a matter of language rather than of technique.
    The setting's name speaks of a driver and of seeking, and the rule concerns neither the
    driver nor the seeking - it concerns the report sent afterwards. Without that sentence the
    item looks like a cutting of the machine off from drivers and is at times let go for that
    reason.

    The low category is right here and not worth lifting. The gain is that the machine stops
    relating outward the physical events happening at it - an argument true but weak, and it
    has to be given so.
