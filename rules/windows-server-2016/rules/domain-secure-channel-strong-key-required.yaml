id: win2016-domain-secure-channel-strong-key-required

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera wymaga silnego klucza sesji
    en: The secure channel to the controller requires a strong session key
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda, żeby klucz sesji uzgadniany na kanale do kontrolera domeny
    był kluczem silnym, a nie jego starszym, krótszym odpowiednikiem.

    Punkt domyka trójkę reguł o tym kanale od strony, o której łatwo zapomnieć.
    Tamte trzy rozstrzygają, czy ruch jest zabezpieczony i czy wolno zejść
    niżej. Ta pyta o coś innego: czy zabezpieczenie, które zastosowano, jest
    cokolwiek warte.

    Różnica jest praktyczna, nie teoretyczna. Kanał zaszyfrowany słabym
    kluczem wygląda w każdym raporcie tak samo jak zaszyfrowany silnym.
    Ustawienia podpisywania i szyfrowania zgłaszają zgodność. A treść daje się
    odtworzyć nakładem, który nie wymaga dziś ani czasu, ani sprzętu
    szczególnego.

    Jest to więc reguła chroniąca pozostałe reguły przed pozornością. Bez niej
    raport potrafi pokazać kanał opisany jako zabezpieczony, którego
    zabezpieczenie jest formalnością.

    Na serwerze 2016 obie strony rozmowy uzgadniają silny klucz domyślnie —
    słaby wariant pozostał wyłącznie ze względu na zgodność z systemami,
    których w sieci produkcyjnej dziś praktycznie nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    formalnie zaszyfrowany, którego treść daje się odtworzyć — a więc wszystkie
    korzyści z podsłuchu przy zachowaniu wyniku zgodnego w raporcie.
  en: |
    The setting demands that the session key settled on the channel to the domain
    controller be a strong key and not its older, shorter counterpart.

    The item closes the set of three rules on this channel from a side easily
    forgotten. Those three settle whether the traffic is protected and whether a
    drop is allowed. This one asks something else: whether the protection applied is
    worth anything.

    The difference is practical rather than theoretical. A channel encrypted with a
    weak key looks in every report just like one encrypted with a strong one. The
    signing and encryption settings report compliance. And the content can be
    recovered at an outlay that today calls for neither time nor any particular
    hardware.

    This is therefore a rule that guards the other rules against being mere
    appearance. Without it a report can show a channel described as protected whose
    protection is a formality.

    On Server 2016 both sides of the conversation settle on a strong key by default
    - the weak variant has stayed for the sake of compatibility with systems
    practically absent from a production network today.

    What an attacker gains while the item goes unmet: a channel formally encrypted
    whose content can be recovered - and so all the gains of eavesdropping while the
    report keeps a compliant result.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie jest tu takie samo jak przy
    bezwarunkowym żądaniu zabezpieczenia, bo dotyczy tej samej rzeczy: co stoi
    po drugiej stronie kanału.

    Odmowa słabego klucza oznacza, że maszyna nie nawiąże kanału z kontrolerem,
    który silnego nie potrafi. Skutkiem jest utrata zaufanej relacji z domeną —
    objaw natychmiastowy i jednoznaczny, w postaci nieudanego uwierzytelnienia
    kontami domenowymi.

    Realnie dotyczy to wyłącznie kontrolerów na systemach sprzed wielu wydań
    oraz relacji zaufania z domenami, których nikt od dawna nie modernizował.
    W domenie utrzymywanej na bieżąco zmiana nie robi nic widocznego.

    Warto to sprawdzić raz, a nie zakładać. Pytanie brzmi po prostu: na jakich
    systemach pracują kontrolery tej domeny i czy istnieją relacje zaufania
    z domenami spoza naszej kontroli. Obie odpowiedzi są dostępne od ręki.

    Czego to nie psuje: pracy usług lokalnych, kont lokalnych, logowania do
    konsoli ani udostępniania plików.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review here is the same as with the
    unconditional demand for protection, since it concerns the same thing: what
    stands on the channel's other side.

    Refusing a weak key means the machine will not establish a channel with a
    controller unable to manage a strong one. The consequence is the loss of the
    trusted relationship with the domain - an immediate and unambiguous symptom, in
    the shape of failed authentication with domain accounts.

    In reality this concerns only controllers on systems many releases back, and
    trust relationships with domains nobody has modernised in a long while. In a
    domain kept current the change does nothing visible.

    Worth checking once rather than assuming. The question is simply this: on what
    systems do this domain's controllers run, and do trust relationships exist with
    domains outside our control. Both answers are available at once.

    What this does not break: the working of local services, local accounts, signing
    in at the console, or file sharing.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - accounts-and-passwords
  what_breaks:
    pl:
      - Kontroler domeny niepotrafiący uzgodnić silnego klucza przestaje nawiązywać kanał i maszyna traci uwierzytelnianie domenowe
      - Relacja zaufania z domeną spoza naszej kontroli może przestać przyznawać dostęp
      - Objaw jest natychmiastowy i jednoznaczny, bez cichego pogorszenia rozłożonego w czasie
      - Praca usług lokalnych, konta lokalne i udostępnianie plików pozostają bez zmian
    en:
      - A domain controller unable to settle a strong key stops establishing the channel and the machine loses domain authentication
      - A trust relationship with a domain outside our control may stop granting access
      - The symptom is immediate and unambiguous, with no quiet worsening spread over time
      - The working of local services, local accounts and file sharing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, na jakich systemach pracują kontrolery tej domeny
      - Istnieją relacje zaufania z domenami spoza naszej kontroli, o których modernizacji nic nie wiadomo
    en:
      - It has not been established on what systems this domain's controllers run
      - Trust relationships exist with domains outside our control, of whose modernisation nothing is known
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'RequireStrongKey'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'RequireStrongKey'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Without this the other three rules can report a protected channel whose
    # protection is a formality - the same report, a recoverable content.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireStrongKey' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-require-strong-windows-2000-or-later-session-key

notes:
  pl: |
    Punkt jest czwartym i ostatnim z bloku o kanale do kontrolera domeny.
    Trzy pozostałe mówią, czy kanał jest zabezpieczony; ten mówi, czy to
    zabezpieczenie cokolwiek znaczy. Wdrożenie tamtych bez tego daje raport
    zgodny przy kanale możliwym do odczytania.

    W macierzy ryzyka i uciążliwości punkt trafia do tego samego pola co
    bezwarunkowe żądanie zabezpieczenia: zysk realny, koszt realny, ten sam
    warunek do sprawdzenia. Wdraża się je razem, bo razem się psują i razem
    naprawiają.

    Brak wartości w rejestrze jest zgłaszany jako niespełnienie. Zachowanie
    domyślne bywa tu zgodne, ale ma być zapisane wprost, żeby nie zależało od
    wersji systemu i roli maszyny.
  en: |
    The item is the fourth and last of the block on the channel to the domain
    controller. The other three say whether the channel is protected; this one says
    whether that protection means anything. Applying those without this gives a
    compliant report on a readable channel.

    In the risk-and-disruption matrix the item falls in the same square as the
    unconditional demand for protection: a real gain, a real cost, the same
    condition to check. They are applied together, since they break together and
    are mended together.

    A missing value in the registry is reported as non-compliance. The default
    behaviour here is at times compliant, but it is to be written outright so that
    it does not depend on the system's version and the machine's role.
