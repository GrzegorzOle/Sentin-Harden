id: win10-local-account-sharing-model-classic

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta lokalne z sieci uwierzytelniane jako one same
    en: Local accounts from the network authenticated as themselves
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że konto lokalne łączące się z sieci jest
    uwierzytelniane jako ono samo, a nie sprowadzane do gościa.

    Tryb przeciwny powstał dla wygody sieci domowych: każde połączenie
    przychodzące, niezależnie od podanych poświadczeń, traktowane jest jak
    gość. Znaczy to, że hasło nie ma znaczenia — podanie dowolnego daje ten
    sam wynik, a podanie żadnego również.

    Skutki są dwa i każdy poważny. Pierwszy to dostęp: wszystko udostępnione
    gościowi albo wszystkim staje się dostępne dla każdego, kto dosięgnie
    maszyny po sieci. Drugi to ślad: zdarzenia zapisują się dla gościa,
    więc dziennik nie mówi, kto czytał, i po fakcie nie da się tego ustalić.

    Rzecz warta odnotowania: tryb ten nie odbiera uprawnień, tylko zamienia
    tożsamość. Uprawnienia nadane konkretnemu kontu przestają dla niego
    działać przy połączeniu z sieci, więc maszyna bywa jednocześnie zbyt
    otwarta dla obcych i zbyt zamknięta dla swoich.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    zasobów udostępnionych szeroko, bez znajomości jakiegokolwiek hasła
    i bez śladu wskazującego, kto z nich korzystał.
  en: |
    The setting makes a local account joining from the network be authenticated as itself rather than brought
    down to the guest.

    The opposite mode came about for the convenience of home networks: every incoming connection, whatever
    credentials it gives, gets treated as the guest. That means the password does not matter - giving any at all
    yields the same outcome, and giving none does likewise.

    There are two consequences and each is grave. The first is access: everything shared to the guest or to
    everybody becomes reachable by anybody who can get at the machine over the network. The second is the trace:
    events get written for the guest, so the log does not say who read, and after the fact it cannot be
    established.

    A thing worth noting: the mode takes no rights away, it exchanges an identity. Rights granted to a named
    account cease working for it at a connection from the network, so the machine is at times at once too open
    to strangers and too shut to its own.

    What an attacker gains while the item goes unmet: access to widely shared resources, with no knowledge of
    any password at all and no trace saying who used them.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, co dziś z tej
    maszyny czyta.

    Na maszynie w domenie tryb gościa praktycznie nie występuje i zmiana
    potwierdza stan zastany. Sprawdzenie ma sens na maszynach stojących poza
    domeną, bo tam tryb ten bywa domyślny albo ustawiony dawno i zapomniany.

    Skutek jest wtedy natychmiastowy i jednostronny: wszystko, co dotąd
    czytało z tej maszyny bez podawania poświadczeń, zaczyna dostawać
    odmowę. Dotyczy to udziałów roboczych, katalogów dla skanerów
    i urządzeń wielofunkcyjnych oraz starszych maszyn wymieniających pliki
    bez logowania.

    Rzecz, która bywa zaskoczeniem: po zmianie mogą zacząć działać rzeczy,
    które wcześniej nie działały. Uprawnienia nadane konkretnemu kontu
    zaczynają być brane pod uwagę, więc dostęp wcześniej sprowadzony do
    gościa zostaje przywrócony właściwemu kontu.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: logowania przy maszynie, kont domenowych, połączeń
    wychodzących do zasobów cudzych, usług systemowych, aplikacji.
  en: |
    The class is "needs review", and the review touches what reads from this machine today.

    On a machine in a domain the guest mode is all but absent and the change confirms the state found. The
    review makes sense on machines standing outside a domain, that mode being there at times the default, or set
    long ago and forgotten.

    The consequence is then immediate and one-sided: everything that until now read from this machine without
    giving credentials begins getting a refusal. That touches working shares, directories for scanners and
    multifunction devices, and older machines exchanging files without a logon.

    A thing that comes at times as a surprise: after the change things may begin working that did not work
    before. Rights granted to a named account begin being taken into account, so access earlier brought down to
    the guest gets restored to the account it belongs to.

    The change takes hold at once and undoes itself at once.

    What this does not break: logging on at the machine, domain accounts, outgoing connections to somebody
    else's resources, system services, or applications.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - legacy-authentication
  what_breaks:
    pl:
      - Wszystko, co czytało z tej maszyny bez podawania poświadczeń, zaczyna dostawać odmowę dostępu
      - Katalogi dla skanerów i urządzeń wielofunkcyjnych przestają być zapisywalne, dopóki urządzenia nie dostaną konta
      - Starsze maszyny wymieniające pliki bez logowania tracą dostęp do udziałów tej maszyny
      - Uprawnienia nadane konkretnemu kontu zaczynają być brane pod uwagę, więc część dostępu bywa przywrócona
      - Logowanie przy maszynie, konta domenowe, połączenia wychodzące oraz usługi systemowe pozostają bez zmian
    en:
      - Everything that read from this machine without giving credentials begins getting access denied
      - Directories for scanners and multifunction devices cease being writable until the devices are given an account
      - Older machines exchanging files without a logon lose access to this machines shares
      - Rights granted to a named account begin being taken into account, so part of the access gets restored
      - Logging on at the machine, domain accounts, outgoing connections and system services stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z tej maszyny czytają urządzenia, które poświadczeń podać nie umieją, a kont im jeszcze nie założono
      - Maszyna stoi poza domeną i wymiana plików z sąsiednimi maszynami opiera się na dostępie bez logowania
    en:
      - Devices unable to give credentials read from this machine and no accounts have yet been made for them
      - The machine stands outside a domain and the exchange of files with its neighbours rests on access without a logon
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero means every account is authenticated as itself; one reduces each
      # network logon with a local account to the guest.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'ForceGuest'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'ForceGuest'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Everything reading from this machine without credentials will begin getting a
    # refusal. Part of the access, on the other hand, may return - rights granted to
    # a named account begin being taken into account again.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ForceGuest' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-sharing-and-security-model-for-local-accounts

notes:
  pl: |
    Reguła jest w tym bloku tą, przy której najłatwiej pomylić kierunek
    zmiany. Warto, żeby aplikacja powiedziała wprost, że tryb gościa niczego
    nie zabezpiecza — on zamienia tożsamość, a nie ogranicza uprawnienia.

    Argument o dzienniku jest tu równie ważny co argument o dostępie i warto
    go nie chować. Maszyna w tym trybie nie daje się rozliczyć, bo wszystkie
    zdarzenia wskazują na to samo konto. Jest to dokładnie ta rzecz,
    o którą pyta audyt, a której lista niezgodności sama z siebie nie
    pokaże.

    Odnotowuję skutek dodatni, rzadki przy regułach utwardzających:
    po zmianie część dostępu bywa przywrócona, bo uprawnienia nadane
    konkretnym kontom zaczynają wreszcie działać. Aplikacja, która to
    wymieni, opisze zmianę uczciwiej niż wyliczenie samych strat.
  en: |
    The rule is the one in this block at which the direction of the change is most easily mistaken. It is well
    that the application say outright that the guest mode safeguards nothing - it exchanges an identity, it does
    not bound rights.

    The argument about the log matters here as much as the argument about access, and is worth not hiding. A
    machine in that mode cannot be called to account, every event pointing at the same account. It is exactly
    the thing the audit asks about and which a list of mismatches will not of itself show.

    I set down a favourable consequence, a rare one at hardening rules: after the change part of the access gets
    restored, rights granted to named accounts beginning at last to work. An application naming that will
    describe the change more honestly than a reckoning of losses alone.
