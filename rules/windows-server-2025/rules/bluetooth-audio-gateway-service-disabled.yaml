id: win2025-bluetooth-audio-gateway-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa bramy dźwięku łączności bliskiego zasięgu wyłączona
    en: The audio gateway service for short range connectivity disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę bramy dźwięku dla łączności bliskiego zasięgu —
    tę, która obsługuje słuchawki i zestawy głośnomówiące.

    Chcę rozróżnić ten punkt od poprzedniego, bo leżą obok siebie
    i wyglądają na jedną rzecz rozbitą na dwie. Usługa poprzednia obsługuje
    sam nadajnik i wszystko, co się przez niego zgłasza, w tym urządzenia
    wejściowe. Ta obsługuje wyłącznie dźwięk. Różnica jest w skutkach:
    tamta potrafi odebrać sterowanie maszyną, ta nie potrafi odebrać
    niczego, bo na serwerze nie ma czego słuchać ani komu.

    Zostawiam kategorię niską, tak jak przy usłudze poprzedniej i z tego
    samego powodu — zasięg. Dodam jednak, że ten punkt jest w całej tej
    paczce jednym z nielicznych, o których mogę powiedzieć bez
    zastrzeżeń: usługa nie pełni na serwerze żadnej funkcji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kolejną
    usługę działającą i nasłuchującą na maszynie, która z niej nigdy nie
    skorzysta.
  en: |
    The item switches off the service of the gate of sound for the binding of short reach - the one
    that handles ear-pieces and sets for speaking aloud.

    I would tell this item apart from the one before, they lying side by side and looking like one
    thing broken into two. The service before handles the sender itself and all that calls through
    it, the gear of putting in among it. This one handles sound alone. The difference is in the
    outcomes - that one can take the steering of the machine away, this one can take nothing away,
    there being upon a server nothing to listen to and nobody to.

    I leave the category low, even as at the service before and of the same ground - the reach. I
    shall add, though, that this item is in this whole pack one of the few whereof I can say without
    reserve that the service fills upon a server no office at all.

    What an attacker gains while the item goes unmet - one more service working and listening upon a
    machine that will never make use of it.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" wobec oceny dla stacji roboczej
    i jest to jedna z niewielu ocen w tej paczce, przy której nie mam nic
    do wyważenia.

    Serwer nie odtwarza dźwięku. Nie ma na nim rozmów, powiadomień ani
    nagrań, a jeżeli cokolwiek dźwięk generuje, to nie ma tego kto
    usłyszeć. Usługa obsługująca bezprzewodowe słuchawki nie ma tu
    odbiorcy w żadnym możliwym układzie.

    Chcę jednak zapisać rozróżnienie, które przy tej parze reguł bywa
    źródłem błędu. Wyłączenie tej usługi nie wyłącza łączności bliskiego
    zasięgu jako takiej i nie odbiera sterowania klawiaturze ani myszy —
    tymi zajmuje się usługa poprzednia, wyłączana osobną decyzją.
    Zastosowanie tej reguły samej w sobie nie niesie ryzyka odcięcia
    konsoli, o którym pisałem obok.

    Usługa zostaje zatrzymana i oznaczona jako wyłączona. Cofnięcie
    przywraca poprzedni tryb uruchamiania i, jeżeli usługa działała,
    uruchamia ją z powrotem.
  en: |
    I lower the class to "no disruption" against the reckoning for a workstation, and it is one of
    the few reckonings in this pack whereat I have nothing to weigh.

    A server plays no sound. There are upon it no speakings, no callings-out and no writings-down of
    sound, and if anything at all makes sound, there is nobody to hear it. A service handling
    wireless ear-pieces has here no taker in any setting there could be.

    I would write down, though, a telling apart that at this pair of rules is at times a wellspring
    of mistake. The switching off of this service switches not off the binding of short reach as
    such, and takes the steering neither from a board of keys nor from a mouse - those are the care
    of the service before, switched off by a deciding of its own. The laying on of this rule by
    itself bears not the hazard of the cutting off of the console I wrote of alongside.

    The service is stopped and marked as switched off. The undoing brings back the former manner of
    starting and, if the service was working, starts it again.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Bezprzewodowe słuchawki i zestawy głośnomówiące przestają być obsługiwane
      - Na serwerze nie ma czego słuchać ani komu, więc usługa nie ma tu odbiorcy
      - Wyłączenie tej usługi nie wyłącza łączności bliskiego zasięgu jako takiej
      - Klawiatura i mysz są obsługiwane przez usługę poprzednią, wyłączaną osobną decyzją
      - Ta reguła sama w sobie nie niesie ryzyka odcięcia konsoli
    en:
      - Wireless ear-pieces and sets for speaking aloud stop being handled
      - Upon a server there is nothing to listen to and nobody to, so the service has here no taker
      - The switching off of this service switches not off the binding of short reach as such
      - A board of keys and a mouse are the care of the service before, switched off by a deciding of its own
      - This rule by itself bears not the hazard of the cutting off of the console
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem na serwerze
    en:
      - No known cases wherein this setting is a mistake on a server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\BTAGService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\BTAGService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This one carries sound only: it does not touch input devices, so it
    # cannot cut the console the way bthserv can.
    Stop-Service -Name 'BTAGService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'BTAGService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'BTAGService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Rozróżnienie wobec usługi obsługi łączności, leżącej obok: tamta
    obsługuje sam nadajnik i wszystko, co się przez niego zgłasza, w tym
    urządzenia wejściowe. Ta obsługuje wyłącznie dźwięk. Tamta potrafi
    odebrać sterowanie maszyną, ta nie potrafi odebrać niczego.

    Jeden z nielicznych punktów w tej paczce, o których mogę powiedzieć
    bez zastrzeżeń, że usługa nie pełni na serwerze żadnej funkcji.

    Zastosowanie tej reguły samej w sobie nie niesie ryzyka odcięcia
    konsoli opisanego przy regule siostrzanej.
  en: |
    A telling apart from the service of the handling of the binding, lying alongside - that one
    handles the sender itself and all that calls through it, the gear of putting in among it. This
    one handles sound alone. That one can take the steering of the machine away, this one can take
    nothing away.

    One of the few items in this pack whereof I can say without reserve that the service fills upon a
    server no office at all.

    The laying on of this rule by itself bears not the hazard of the cutting off of the console set
    forth at the sister rule.
