id: win2016-act-as-operating-system-none

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Działanie jako część systemu operacyjnego nieprzyznane nikomu
    en: Acting as part of the operating system granted to nobody
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt sprawdza, czy uprawnienie do działania jako część systemu
    operacyjnego nie zostało przyznane żadnemu kontu ani żadnej grupie.

    To jest najmocniejsze uprawnienie, jakie na maszynie z Windows istnieje,
    i mocniejsze niż przynależność do grupy administratorów. Proces, który je
    ma, może przedstawić się systemowi jako dowolny użytkownik — nie
    podszywając się, tylko po prostu stając się nim w oczach systemu, razem
    z całym jego zestawem uprawnień i bez żadnego uwierzytelnienia.

    Warto zobaczyć, co to znaczy dla raportów. Czynności wykonane w ten
    sposób zapisują się w dzienniku jako czynności tego użytkownika, za
    którego proces się podał. Nie ma więc śladu mówiącego, że ktoś coś zrobił
    cudzą tożsamością — ślad mówi, że zrobił to ten użytkownik.

    Kategoria krytyczna i jest to jeden z nielicznych przypadków, w których
    ocena nie wymaga zastrzeżeń. Uprawnienie to nie jest potrzebne żadnemu
    zwykłemu oprogramowaniu; system, gdy go potrzebuje, korzysta z konta
    systemowego, które ma je z definicji i bez przyznawania.

    Na serwerze 2016 rzecz warto sprawdzić mimo tego, że domyślnie lista jest
    pusta. Maszyny tego rocznika obsługiwały oprogramowanie z czasów, gdy
    producenci przyznawali to uprawnienie kontom usługowym „na wszelki
    wypadek", a instrukcje instalacji wprost to zalecały.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: tożsamość
    dowolnego użytkownika tej maszyny, przyjętą bez hasła i bez śladu
    wskazującego na podszycie.
  en: |
    The item checks that the right to act as part of the operating system has
    been granted to no account and no group.

    This is the strongest right that exists on a Windows machine, and stronger
    than membership of the administrators group. A process holding it can present
    itself to the system as any user - not by impersonation but by simply
    becoming that user in the system's eyes, with their whole set of rights and
    with no authentication at all.

    It is worth seeing what that means for reports. Actions carried out this way
    are written to the log as that user's actions, the one the process gave
    itself out to be. There is therefore no trace saying that somebody did
    something under another identity - the trace says that user did it.

    The critical category here is one of the few calls that needs no
    qualification. No ordinary software needs this right; where the system needs
    it, it uses the system account, which holds it by definition and without
    being granted it.

    On Server 2016 it is worth checking despite the list being empty by default.
    Machines of this vintage carried software from a time when vendors granted
    this right to service accounts just in case, and installation instructions
    recommended it outright.

    What an attacker gains while the item goes unmet: the identity of any user of
    this machine, taken on with no password and with no trace pointing to
    impersonation.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", bo domyślnie lista jest pusta i na większości
    maszyn zmiana nie robi nic.

    Tam, gdzie lista pusta nie jest, sprawdzenie sprowadza się do jednego
    pytania: które konto ją zajmuje. Odpowiedź niemal zawsze wskazuje na
    konto usługowe starego oprogramowania branżowego. Wtedy warto sprawdzić
    u producenta, czy uprawnienie jest rzeczywiście wymagane — zwykle
    okazuje się, że zostało wpisane do instrukcji lata temu i nigdy nie
    zweryfikowane.

    Usunięcie uprawnienia kontu, które faktycznie z niego korzysta, zatrzyma
    usługę tego konta. Jest to przypadek rzadki, ale nie teoretyczny, więc
    warto najpierw spojrzeć na listę, a dopiero potem naprawiać.

    Czego to nie psuje: pracy konta systemowego, usług systemu, logowania
    ani niczego, co korzysta ze zwykłych uprawnień administracyjnych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption", because the list is empty by default and on
    most machines the change does nothing.

    Where the list is not empty, the check comes down to one question: which
    account occupies it. The answer almost always points to a service account of
    old line-of-business software. It is then worth asking the vendor whether the
    right is genuinely required - usually it turns out to have been written into
    the instructions years ago and never checked since.

    Taking the right from an account that actually uses it will stop that
    account's service. That case is rare but not theoretical, so it is worth
    looking at the list first and remedying afterwards.

    What this does not break: the system account's work, the system's services,
    signing in, or anything using ordinary administrative rights.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - logging-and-audit
  what_breaks:
    pl:
      - Usługa działająca na koncie, któremu to uprawnienie faktycznie było potrzebne, przestaje wstawać
      - Stare oprogramowanie branżowe z instrukcją zalecającą to uprawnienie może zgłosić błąd uwierzytelnienia
      - Konto systemowe ma to uprawnienie z definicji i nie jest objęte zmianą
      - Zwykłe uprawnienia administracyjne, logowanie i usługi systemu działają bez zmian
    en:
      - A service running under an account that genuinely needed this right stops starting
      - Old line-of-business software whose instructions recommended the right may report an authentication error
      - The system account holds this right by definition and is not touched by the change
      - Ordinary administrative rights, signing in and the system's services work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Uprawnienie ma konto usługowe oprogramowania, którego producent potwierdził ten wymóg i nie ma dla niego zamiennika
    en:
      - The right is held by a service account of software whose vendor confirmed the requirement and for which there is no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTcbPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTcbPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTcbPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list is emptied rather than narrowed. No ordinary software needs this
    # right, and the system account holds it without being granted it.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTcbPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTcbPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/act-as-part-of-the-operating-system

notes:
  pl: |
    Audyt odczytuje listę uprawnień eksportem zasad lokalnych i porównuje
    identyfikatory zabezpieczeń, a nie nazwy kont. Nazwa grupy zależy od
    języka instalacji, identyfikator nie — i to jest jedyny sposób, żeby
    ta sama reguła działała na maszynie w dowolnej wersji językowej.

    Brak wiersza w eksporcie i wiersz pusty znaczą to samo, dlatego oba
    wyniki uchodzą za zgodne. Rozróżnienie zachowano w wyniku audytu,
    bo przy diagnozowaniu bywa przydatne.

    Eksport wymaga uprawnień administracyjnych. Bez nich audyt zwraca błąd
    sprawdzenia, a nie niezgodność — komunikat systemu trafia przy tym na
    strumień błędów, żeby w raporcie dało się odróżnić brak uprawnień od
    faktycznej usterki.
  en: |
    The audit reads the list of rights by exporting the local policy and compares
    security identifiers rather than account names. A group's name depends on the
    installation language; its identifier does not - and that is the only way for
    the same rule to work on a machine in any language version.

    A missing line in the export and an empty line mean the same thing, which is
    why both results count as compliant. The distinction is kept in the audit's
    result, because it helps when diagnosing.

    The export needs administrative rights. Without them the audit returns a
    check error rather than non-compliance - and the system's own message goes to
    the error stream, so the report can tell a missing privilege from a real
    fault.
