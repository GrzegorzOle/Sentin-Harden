id: win11-appx-non-admin-install-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji przez użytkowników bez uprawnień zablokowane
    en: Installing application packages by users without rights blocked
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zastrzega instalowanie pakietów aplikacji dla kont
    z uprawnieniami administratora.

    Pakiety aplikacji różnią się od zwykłych programów tym, że instalują się
    w profilu użytkownika i nie wymagają podniesienia uprawnień. Zwykły
    użytkownik, który nie może zainstalować żadnego programu, pakiet
    zainstaluje bez pytania — i tej rozbieżności nikt nie zauważa, dopóki
    nie zajrzy do listy aplikacji.

    Skutek jest taki, że reguła „użytkownik nie instaluje oprogramowania",
    utrzymywana dla programów zwykłych, dla pakietów po prostu nie
    obowiązuje. Na maszynie pojawiają się aplikacje, których nikt nie
    zatwierdzał, a część z nich pracuje z danymi firmowymi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    umieszczenia aplikacji na maszynie rękami użytkownika, bez podniesienia
    uprawnień i bez śladu w miejscach, w których szuka się instalacji
    programów. Wystarczy namówić użytkownika na zainstalowanie „narzędzia,
    które pomoże" — a ponieważ instalacja nie pyta o zgodę administratora,
    nic po drodze nie wygląda niepokojąco.

    Punkt domyka trójkę o pakietach aplikacji: dwie pozostałe mówią, skąd
    pakiet może pochodzić, ta — kto może go zainstalować.
  en: |
    The setting reserves the installing of application packages for accounts with
    administrator rights.

    Application packages differ from ordinary programs in installing into the user's
    profile and taking no raising of rights. An ordinary user, who cannot install a single
    program, will install a package without being asked - and nobody notices that
    discrepancy until they look into the list of applications.

    The effect is that the rule "the user does not install software", upheld for ordinary
    programs, simply does not bind for packages. Applications nobody approved appear on the
    machine, and some of them work with the firm's data.

    What an attacker gains while the item goes unmet: a road to placing an application on
    the machine by the user's hands, with no raising of rights and no trace in the places
    where installations of programs are looked for. It is enough to talk the user into
    installing "a tool that will help" - and since the installation asks no administrator
    for consent, nothing along the way looks alarming.

    The item closes the trio about application packages: the other two say whence a package
    may come, this one who may install it.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy użytkownicy instalują sobie aplikacje ze
    sklepu samodzielnie — bo w części organizacji jest to stan przyjęty
    i akceptowany.

    Skutek jest widoczny od razu i tylko dla użytkowników bez uprawnień:
    instalacja ze sklepu kończy się odmową. Aplikacje już zainstalowane
    działają dalej i nie są usuwane.

    Odczucie bywa gorsze, niż wynika z opisu, bo sklep jest miejscem
    wyglądającym na bezpieczne z definicji. Użytkownik zgłosi odmowę jako
    błąd sklepu, a nie jako zmianę zasady, i warto uprzedzić o tym obsługę
    zgłoszeń.

    Aktualizacje aplikacji już zainstalowanych są osobnym przypadkiem
    i wymagają sprawdzenia na jednym stanowisku. Tam, gdzie aktualizacja
    przestanie przechodzić, aplikacje będą się starzeć niezauważenie — a to
    skutek gorszy niż sama odmowa instalacji.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether users install applications from the store for themselves
    - since in some organisations that is an accepted and tolerated state.

    The effect is visible at once and to users without rights alone: an installation from
    the store ends in a refusal. Applications already installed go on working and are not
    removed.

    The feeling is sometimes worse than the description suggests, since the store is a
    place that looks safe by definition. The user will report the refusal as a fault of the
    store rather than as a changed policy, and it is worth forewarning the people handling
    cases.

    Updates of applications already installed are a separate case and need checking at one
    station. Where an update stops getting through, applications will age unnoticed - and
    that is a worse effect than the refused installation itself.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - accounts-and-passwords
  what_breaks:
    pl:
      - Instalowanie aplikacji ze sklepu przez użytkownika bez uprawnień kończy się odmową
      - Aktualizacje aplikacji już zainstalowanych mogą przestać przechodzić
      - Aplikacje zainstalowane wcześniej działają dalej i nie są usuwane
      - Konta z uprawnieniami administratora instalują pakiety bez zmiany
    en:
      - Installing an application from the store by a user without rights ends in a refusal
      - Updates of applications already installed may stop getting through
      - Applications installed earlier go on working and are not removed
      - Accounts with administrator rights install packages unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Użytkownicy instalują sobie aplikacje ze sklepu samodzielnie i jest to stan przyjęty
    en:
      - Users install applications from the store for themselves and that is an accepted state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BlockNonAdminUserInstall'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $current = (Get-ItemProperty -Path $path -Name 'BlockNonAdminUserInstall' -ErrorAction SilentlyContinue).'BlockNonAdminUserInstall'
    [pscustomobject]@{
      path        = $path
      name        = 'BlockNonAdminUserInstall'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockNonAdminUserInstall' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/apps-in-windows-10

notes:
  pl: |
    Reguła jest trzecią z trójki o pakietach aplikacji i jedyną mówiącą
    o osobie, a nie o pochodzeniu pakietu. Dwie pozostałe zamykają drogi
    obok sklepu; ta zamyka drogę przez sklep dla kont bez uprawnień.

    Warto ją czytać razem z zasadami o instalowaniu programów zwykłych.
    Bez niej cały wysiłek włożony w odebranie użytkownikom prawa instalacji
    omija się jednym kliknięciem w sklepie.

    Osobnego sprawdzenia wymagają aktualizacje aplikacji już
    zainstalowanych — mechanizm bywa tą zmianą obejmowany i skutek nie jest
    widoczny od razu.

    Brak wartości nie jest stanem zgodnym, bo domyślnie użytkownik instaluje
    pakiety bez podniesienia uprawnień.
  en: |
    The rule is the third of the trio about application packages and the only one speaking
    of a person rather than of a package's origin. The other two close the roads beside the
    store; this one closes the road through the store for accounts without rights.

    It is worth reading together with the policies on installing ordinary programs. Without
    it the whole effort put into taking the right of installation from users is got round
    by one click in the store.

    Updates of applications already installed need checking apart - the mechanism is
    sometimes taken in by this change and the effect is not visible at once.

    A missing value is not a compliant state, since by default the user installs packages
    with no raising of rights.
