id: win2016-diagnostic-data-authenticated-proxy-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Data Collection and Preview Builds
  title:
    pl: Uwierzytelnianie usługi diagnostycznej na pośredniku zablokowane
    en: Authentication of the diagnostic service at a proxy blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze wysyłającej dane diagnostyczne
    uwierzytelniać się na pośredniku sieciowym poświadczeniami maszyny.

    Rzecz, o którą tu chodzi, jest subtelna i warto ją wyłożyć powoli.
    Usługa diagnostyczna wysyła dane na zewnątrz. Jeżeli droga na zewnątrz
    prowadzi przez pośrednika wymagającego uwierzytelnienia, usługa musi się
    czymś przedstawić — i domyślnie przedstawia się poświadczeniami konta
    maszyny.

    Powstaje przez to kanał, w którym poświadczenia konta maszyny są
    przedstawiane regularnie, w tle, przy czynności niemającej z
    uwierzytelnianiem nic wspólnego. Kanał ten nie jest przez nikogo
    obserwowany, bo nikt nie traktuje wysyłki danych diagnostycznych jako
    zdarzenia dotyczącego tożsamości.

    Zablokowanie tego kanału nie zmienia niczego w tym, czy dane wychodzą —
    zmienia to, czy przy okazji ich wychodzenia przedstawia się tożsamość
    maszyny. Jeżeli pośrednik nie przepuści ruchu bez uwierzytelnienia, dane
    po prostu nie wyjdą, i to jest wynik właściwy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: regularne,
    nieobserwowane przedstawianie poświadczeń konta maszyny na pośredniku
    przy czynności, której nikt nie ogląda.
  en: |
    The setting forbids the service sending diagnostic data to authenticate at a network proxy by the
    machine's credentials.

    The matter here is a subtle one and worth setting out slowly. The diagnostic service sends data
    outward. If the way outward leads through a proxy requiring authentication, the service has to
    present something - and by default it presents the machine account's credentials.

    There arises through that a channel in which the machine account's credentials are presented
    regularly, in the background, at an act having nothing to do with authentication. That channel is
    watched by nobody, nobody treating the sending of diagnostic data as an event concerning identity.

    Shutting that channel changes nothing about whether the data go out - it changes whether the
    machine's identity is presented on the occasion of their going out. If the proxy will not pass the
    traffic without authentication, the data simply will not go out, and that is the right outcome.

    What an attacker gains while the item goes unmet: a regular, unwatched presenting of the machine
    account's credentials at the proxy, at an act nobody looks at.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, jak wygląda
    droga tej maszyny na zewnątrz.

    Na maszynie bez pośrednika albo z pośrednikiem niewymagającym
    uwierzytelnienia zmiana nie robi nic. Na maszynie, której jedyna droga
    na zewnątrz prowadzi przez pośrednika wymagającego uwierzytelnienia,
    zatrzymuje wysyłkę danych diagnostycznych.

    Drugi skutek jest tym samym skutkiem widzianym inaczej i warto go
    nazwać, bo bywa kosztowny. Maszyna znika z raportów chmurowych, a przyczyna
    leży w ustawieniu, którego nikt nie kojarzy z siecią. Objaw wygląda
    dokładnie jak awaria łączności i bywa tak właśnie diagnozowany —
    tygodniami.

    Wniosek praktyczny: zmianę trzeba odnotować tam, gdzie szuka się
    przyczyn kłopotów z siecią, a nie wyłącznie w rejestrze zmian
    konfiguracji. Jest to jedna z niewielu reguł, przy których zapis
    w odpowiednim miejscu jest częścią wdrożenia.

    Warto zauważyć, że jeżeli poprzedni punkt wdrożono na stopniu
    najniższym, ten nie zmienia już nic — nie ma czego wysyłać. Obie reguły
    warto rozpatrywać razem.

    Czego to nie psuje: pracy systemu, usług, sieci, uwierzytelniania
    użytkowników, ruchu innego niż diagnostyczny.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns what this machine's way outward looks like.

    On a machine without a proxy, or with one requiring no authentication, the change does nothing. On
    a machine whose one way outward leads through a proxy requiring authentication, it stops the
    sending of diagnostic data.

    The second consequence is that same consequence seen otherwise and worth naming, being at times
    costly. The machine vanishes from cloud reports, and the cause lies in a setting nobody ties to the
    network. The symptom looks exactly like a fault in connectivity and is at times so diagnosed - for
    weeks.

    The practical conclusion: the change has to be noted where the causes of network troubles are
    looked for, and not solely in a register of configuration changes. It is one of the few rules where
    a note in the right place is part of the rollout.

    Worth noticing that if the item before was rolled out at the lowest degree, this one changes nothing
    any longer - there is nothing to send. Both rules are worth weighing together.

    What this does not break: the system's working, services, the network, the authentication of users,
    or traffic other than diagnostic.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - network-and-firewall
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na maszynie, której jedyna droga na zewnątrz prowadzi przez pośrednika z uwierzytelnieniem, wysyłka danych diagnostycznych ustaje
      - Maszyna znika z raportów chmurowych, a objaw wygląda dokładnie jak awaria łączności i bywa tak diagnozowany tygodniami
      - Na maszynie bez pośrednika albo z pośrednikiem bez uwierzytelnienia zmiana nie robi nic
      - Praca systemu, usługi, uwierzytelnianie użytkowników i ruch inny niż diagnostyczny pozostają bez zmian
    en:
      - On a machine whose one way outward leads through a proxy with authentication, the sending of diagnostic data ceases
      - The machine vanishes from cloud reports, and the symptom looks exactly like a fault in connectivity and is at times so diagnosed for weeks
      - On a machine without a proxy, or with one requiring no authentication, the change does nothing
      - The system's working, services, the authentication of users and traffic other than diagnostic stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Droga tej maszyny na zewnątrz prowadzi wyłącznie przez pośrednika z uwierzytelnieniem, a dane diagnostyczne są potrzebne
      - Nie ma gdzie odnotować zmiany tak, żeby trafiła do osób szukających przyczyn kłopotów z siecią
    en:
      - This machine's way outward leads solely through a proxy with authentication and the diagnostic data are needed
      - There is nowhere to note the change so that it reaches the people looking for the causes of network troubles
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One here means the service may not authenticate at the proxy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableEnterpriseAuthProxy'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    $name = 'DisableEnterpriseAuthProxy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where the way out leads solely through a proxy requiring authentication,
    # this stops the diagnostic data outright. Record the change where people
    # look for connectivity faults - otherwise the machine vanishing from
    # a cloud report weeks later will be diagnosed as a network problem.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEnterpriseAuthProxy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/configure-windows-diagnostic-data-in-your-organization

notes:
  pl: |
    Punkt jest drugi w bloku i różni się od pozostałych tym, że jego
    przedmiotem nie są dane, tylko tożsamość przedstawiana przy okazji ich
    wysyłania. Warto to postawić w opisie na pierwszym miejscu, bo z nazwy
    ustawienia wynika co innego.

    Powiązanie z punktem poprzednim jest tu twarde i aplikacja powinna je
    znać. Wdrożenie tamtego na stopniu najniższym czyni ten bezprzedmiotowym;
    wdrożenie tego bez tamtego zostawia dane wychodzące, tylko bez
    przedstawiania tożsamości. Pokazywanie obu razem oszczędza użytkownikowi
    rozumowania, które i tak musiałby przeprowadzić.

    Ostrzeżenie o mylnej diagnozie jest przy tym punkcie treścią, nie
    dodatkiem. Zmiana ustawienia, której skutek objawia się jako awaria
    sieci tygodnie później, kosztuje więcej czasu niż samo wdrożenie —
    i jest to koszt, który da się w całości usunąć jednym zdaniem zapisanym
    we właściwym miejscu.
  en: |
    The item is the second in the block and differs from the rest in that its subject is not the data but
    the identity presented on the occasion of their being sent. That is worth putting first in the
    description, the setting's name suggesting otherwise.

    The tie to the item before is here a hard one and the application should know it. Rolling that one
    out at the lowest degree makes this one moot; rolling this one out without that one leaves the data
    going out, only without an identity being presented. Showing both together spares the user a
    reasoning they would have to carry out anyway.

    The warning about a mistaken diagnosis is at this item the substance and not an addition. A changed
    setting whose consequence shows as a network fault weeks later costs more time than the rollout
    itself - and it is a cost removable in whole by one sentence written down in the right place.
