id: win2016-defender-cloud-protection

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > MAPS
  title:
    pl: Ochrona dostarczana z usługi zewnętrznej włączona
    en: Protection delivered from the outside service switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala ochronie pytać usługi zewnętrznej producenta
    o pliki, których nie potrafi ocenić samodzielnie.

    Wartość tego mechanizmu bierze się z czasu. Wzorce rozpoznawania
    rozsyłane są do maszyn w odstępach liczonych w godzinach; zapytanie do
    usługi dostaje odpowiedź w ułamku sekundy i dotyczy wiedzy zebranej
    przed chwilą. Różnica obejmuje dokładnie ten okres, w którym rzecz nowa
    jest najgroźniejsza, bo nikt jej jeszcze nie opisał.

    Mechanizm działa tylko wtedy, gdy maszyna ma drogę do tej usługi. Na
    serwerze wystawionym do sieci jest to zwykle prawda. W segmencie
    odciętym od sieci zewnętrznej nie jest — i tam punkt daje wpis
    w rejestrze, a nie ochronę.

    Rzecz, którą trzeba powiedzieć uczciwie: mechanizm ten wysyła na zewnątrz
    informacje o plikach napotkanych na maszynie. Są to dane techniczne,
    nie zawartość, ale jest to ruch wychodzący z maszyny do usługi
    zewnętrznej i w części organizacji jest to decyzja wymagająca zgody.
    Reguła nie przesądza tej decyzji — opisuje ją.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno czasowe
    między pojawieniem się nowego narzędzia a rozesłaniem wzorców
    rozpoznawania, liczone zwykle w godzinach.
  en: |
    The setting lets the protection ask the maker's outside service about files it
    cannot judge on its own.

    The value of this mechanism comes of time. Recognition patterns are sent out to
    machines at intervals counted in hours; a query to the service gets an answer in
    a fraction of a second and concerns knowledge gathered a moment ago. The
    difference covers exactly the spell in which a new thing is most dangerous,
    nobody having described it yet.

    The mechanism works only where the machine has a road to that service. On a
    server exposed to the network that is as a rule true. In a segment cut off from
    the outside network it is not - and there the item gives a registry entry rather
    than protection.

    A thing that has to be said honestly: this mechanism sends out information about
    files met with on the machine. These are technical data rather than content, but
    it is traffic leaving the machine for an outside service, and in some
    organisations that is a decision calling for consent. The rule does not settle
    that decision - it describes it.

    What an attacker gains while the item goes unmet: the window of time between a
    new tool appearing and recognition patterns being sent out, counted as a rule in
    hours.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba dwie rzeczy, obie leżące
    poza samą maszyną.

    Pierwsza jest techniczna: czy z tego segmentu wychodzi ruch do usługi
    producenta. Jeżeli nie, wpis zostanie ustawiony, audyt pokaże zgodność,
    a ochrona nie zyska nic. Jest to najgorszy możliwy wynik, bo raport
    mówi wtedy nieprawdę — i dlatego uwaga o sprawdzeniu drogi siedzi
    w samym poleceniu naprawczym.

    Druga jest organizacyjna: czy wolno wysyłać te dane. Nie jest to pytanie
    techniczne i nie rozstrzyga go administrator maszyny. W części
    organizacji, zwłaszcza w sektorach regulowanych, odpowiedź brzmi „nie" —
    i wtedy odpuszczenie punktu z zapisanym uzasadnieniem jest wynikiem
    prawidłowym.

    Skutków eksploatacyjnych właściwie nie ma. Zapytania są drobne, rzadkie
    i nie wstrzymują pracy — z jednym zastrzeżeniem: gdy odpowiedź nie
    przychodzi, ochrona czeka krótką chwilę przed podjęciem decyzji własnej.
    Na maszynie z bardzo wolnym łączem bywa to zauważalne przy pierwszym
    napotkaniu nowego pliku.

    Czego to nie psuje: usług, logowania, pracy aplikacji, sprawdzania
    plików lokalnie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and two things have to be checked, both lying
    outside the machine itself.

    The first is technical: does traffic to the maker's service leave this segment.
    If not, the entry will be set, the audit will show compliance, and the
    protection will gain nothing. That is the worst possible outcome, since the
    report then tells an untruth - and for that reason the remark about checking the
    road sits in the remedial command itself.

    The second is organisational: may these data be sent. That is no technical
    question and the machine's administrator does not settle it. In some
    organisations, in regulated sectors above all, the answer is "no" - and then
    letting the item go with a written justification is a proper outcome.

    There are in effect no operational consequences. The queries are small, sparse
    and do not hold work up - with one reservation: where no answer comes, the
    protection waits a short while before taking a decision of its own. On a machine
    with a very slow link that is at times noticeable at the first meeting with a
    new file.

    What this does not break: services, signing in, the working of applications, or
    the checking of files locally.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - network-and-firewall
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - W segmencie bez drogi do usługi producenta wpis zostanie ustawiony, audyt pokaże zgodność, a ochrona nie zyska nic
      - Mechanizm wysyła na zewnątrz dane techniczne o plikach napotkanych na maszynie, co w części organizacji wymaga zgody
      - Na maszynie z bardzo wolnym łączem ochrona czeka krótką chwilę na odpowiedź przy pierwszym napotkaniu nowego pliku
      - Usługi, logowanie, praca aplikacji i sprawdzanie plików lokalnie pozostają bez zmian
    en:
      - In a segment with no road to the maker's service the entry will be set, the audit will show compliance, and the protection will gain nothing
      - The mechanism sends out technical data about files met with on the machine, which in some organisations calls for consent
      - On a machine with a very slow link the protection waits a short while for an answer at the first meeting with a new file
      - Services, signing in, the working of applications and the checking of files locally stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Segment, w którym stoi maszyna, nie przepuszcza ruchu do usługi producenta i nie przewidziano otwarcia tej drogi
      - Zasady organizacji zabraniają wysyłania danych o plikach poza jej infrastrukturę
    en:
      - The segment the machine stands in does not let traffic through to the maker's service and no opening of that road has been planned
      - The organisation's rules forbid data about files to be sent outside its own infrastructure
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else { [string][int](Get-MpPreference -ErrorAction Stop).MAPSReporting }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'SpynetReporting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Check that the segment lets this traffic out before writing the entry - a
    # green line over an unreachable service is worse than a red one.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SpynetReporting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/enable-cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Punkt jest jedynym w bloku, którego skuteczność zależy od czegoś spoza
    maszyny. Aplikacja powinna to mówić wprost, bo inaczej zgodność
    w raporcie zostanie odczytana jako ochrona, której nie ma. Wpis ustawiony
    bez drogi do usługi jest dokładnie tym przypadkiem, przed którym ostrzega
    zasada o różnicy między „oceniono — brak wpływu" a „nieocenione".

    Jest to także jedyny punkt w bloku, przy którym odpuszczenie bywa
    decyzją słuszną i nietechniczną. Zapisanie tej decyzji wraz
    z uzasadnieniem jest tu dokładnie tym, czego oczekuje audyt — a nie
    oznaką zaniedbania.

    Audyt czyta stan działający zamiast samego wpisu, bo wartość może
    pochodzić z kilku miejsc naraz i liczy się ta, która obowiązuje.
  en: |
    The item is the only one in the block whose effect depends on something outside
    the machine. The application should say so outright, since otherwise compliance
    in the report will be read as protection that is not there. An entry set with no
    road to the service is exactly the case the principle on the difference between
    "assessed - no impact" and "not assessed" warns against.

    It is also the only item in the block where letting go is at times a right and
    non-technical decision. Writing that decision down with its justification is
    here exactly what an audit expects - and no sign of neglect.

    The audit reads the working state rather than the entry alone, since the value
    can come from several places at once and what counts is the one that holds.
