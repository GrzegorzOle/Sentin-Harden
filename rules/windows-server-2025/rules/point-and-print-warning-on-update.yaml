id: win2025-point-and-print-warning-on-update

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers > Point and Print Restrictions
  title:
    pl: Ostrzeżenie przy aktualizacji sterownika drukarki sieciowej
    en: Warning when updating a network printer driver
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przywraca ostrzeżenie i prośbę o podniesienie uprawnień
    w chwili, gdy serwer wydruku przysyła nowszą wersję sterownika już
    zainstalowanej drukarki.

    Punkt jest bliźniaczy wobec ostrzeżenia przy instalacji, ale dotyczy
    ścieżki znacznie cichszej i dlatego groźniejszej.

    Instalacja wymaga czyjegoś działania: ktoś musi podłączyć drukarkę.
    Aktualizacja nie wymaga niczego. Połączenie z drukarką zostało
    nawiązane dawno, sterownik jest zainstalowany, a serwer wydruku
    w dowolnej chwili może orzec, że ma nowszą wersję. Maszyna pobierze
    ją i wykona — bez czyjegokolwiek udziału i bez żadnego zdarzenia,
    które ktokolwiek by wiązał z instalacją oprogramowania.

    Dla napastnika, który przejął serwer wydruku albo podstawił własny,
    jest to droga wygodniejsza od instalacji. Nie musi czekać, aż ktoś
    podłączy drukarkę. Wystarczy, że podniesie numer wersji sterownika,
    a kod trafi na wszystkie maszyny, które kiedykolwiek się z tą
    kolejką połączyły.

    Na serwerze waży to samo co przy instalacji, z jedną różnicą:
    połączenia z kolejkami wydruku bywają na serwerach zapomniane.
    Drukarka podłączona raz, przy wdrożeniu systemu branżowego, potrafi
    wisieć latami i nikt o niej nie pamięta — a ścieżka aktualizacji
    działa przez cały ten czas.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    dostarczenia kodu na serwer w dowolnym wybranym przez siebie momencie,
    przez samo ogłoszenie nowszej wersji sterownika.
  en: |
    The setting brings back a warning and a call for a raising of rights at the moment a print
    server sends a newer version of the driver of an already installed printer.

    The item is a twin of the warning at installing, but bears on a path far quieter and hence
    more dangerous.

    Installing takes somebody's doing: someone must connect a printer. Updating takes nothing. The
    connection with the printer was opened long ago, the driver is installed, and the print server
    may at any moment declare that it holds a newer version. The machine will fetch it and run it
    - with nobody's part and with no happening anybody would tie to an installing of software.

    For an attacker who has taken a print server or set up one of their own it is a road handier
    than installing. They need not wait for somebody to connect a printer. It is enough that they
    raise the driver's number of version, and the code will reach every machine that ever
    connected to that queue.

    On a server the same weighs as at installing, with one difference: connections with print
    queues are at times forgotten on servers. A printer connected once, at the rollout of a trade
    system, can hang for years with nobody remembering it - and the path of updating works all
    that while.

    What an attacker gains while the item goes unmet: the means of delivering code onto a server
    at any moment of their own choosing, by the mere declaring of a newer version of a driver.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz: czy serwer wydruku, z którego ta
    maszyna korzysta, rozsyła aktualizacje sterowników.

    Odpowiedź twierdząca nie jest wyjątkiem — tak właśnie działa dobrze
    utrzymywany serwer wydruku i tak się aktualizuje sterowniki
    w organizacji. Na tym polega koszt tego punktu: uderza w mechanizm
    prawidłowy, a nie w zaniedbanie.

    Po zmianie aktualizacja sterownika nie przejdzie na tej maszynie bez
    kogoś, kto jej dopilnuje. Na serwerze, przy którym nikt nie siedzi,
    znaczy to, że nie przejdzie w ogóle i że sterownik zostanie na wersji
    obecnej.

    Skutek jest podwójny i warto go widzieć w całości. Z jednej strony
    tej drogi nie użyje napastnik. Z drugiej nie użyje jej też producent
    drukarki, więc poprawki jego własnych błędów nie dotrą — a sterowniki
    drukarek bywają źródłem awarii bufora wydruku.

    Z tego powodu zmiana ma sens wyłącznie razem z ustaleniem, w jaki
    inny sposób ten serwer będzie dostawał nowe sterowniki: przez
    narzędzie do wdrażania oprogramowania, przez aktualizacje systemu
    albo ręcznie, w oknie serwisowym. Wdrożenie bez tego ustalenia
    zamraża sterowniki na zawsze i nikt tego nie zauważy.

    Objawem nie jest komunikat. Objawem jest drukarka, która po zmianie
    po stronie serwera wydruku zaczyna zachowywać się inaczej niż inne
    — bo tam sterownik jest nowszy, a tutaj został stary.

    Administrator pracujący przy maszynie interaktywnie zaktualizuje
    sterownik jak przedtem, widząc pytanie o zgodę.

    Zmiana wymaga ponownego uruchomienia bufora wydruku, czyli przerwania
    zadań w toku.
  en: |
    One thing needs checking: whether the print server this machine uses sends drivers' updates
    about.

    An answer in the affirmative is no exception - that is just how a well kept print server works
    and how drivers are updated in an organisation. Therein lies this item's cost: it strikes at a
    right mechanism and not at a neglect.

    After the change a driver's update will not go through on this machine without somebody to see
    to it. On a server nobody sits at, that means it will not go through at all and the driver
    will stay at its present version.

    The effect is twofold and worth seeing whole. On the one hand no attacker will use that road.
    On the other the printer's maker will not use it either, so the mending of their own faults
    will not arrive - and printers' drivers are at times a source of the print spooler's
    breakdowns.

    For that reason the change makes sense only together with a settling of how else this server
    will get new drivers: by a tool for rolling out software, by the system's updates, or by hand
    in a service window. A rollout without that settling freezes the drivers for good and nobody
    will notice.

    The symptom is not a message. The symptom is a printer which, after a change on the print
    server's side, begins behaving otherwise than the rest - the driver being newer there and left
    old here.

    An administrator working at the machine face to face will update a driver as before, seeing a
    question about consent.

    The change takes a fresh start of the print spooler, that is the breaking of jobs under way.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
    - updates-and-servicing
  what_breaks:
    pl:
      - Aktualizacja sterownika rozsyłana przez serwer wydruku nie przejdzie na tej maszynie bez człowieka
      - Poprawki błędów w sterowniku producenta przestaną docierać tą drogą
      - Objawem jest drukarka zachowująca się inaczej niż pozostałe, bo został na niej sterownik starszy
      - Administrator pracujący interaktywnie zaktualizuje sterownik jak przedtem
      - Ponowne uruchomienie bufora przerywa zadania w toku
    en:
      - A driver's update sent about by a print server will not go through on this machine without a person
      - The mending of faults in a maker's driver will stop arriving by that road
      - The symptom is a printer behaving otherwise than the rest, an older driver having been left on it
      - An administrator working face to face will update a driver as before
      - A fresh start of the spooler breaks jobs under way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer wydruku rozsyła aktualizacje sterowników i nie ustalono innej drogi ich dostarczania
      - Drukowanie z tej maszyny jest krytyczne czasowo, a przerwa na prośbę o zgodę jest nie do przyjęcia
    en:
      - The print server sends drivers' updates about and no other road of delivering them was settled
      - Printing from this machine is time critical and a pause for a call for consent is unacceptable
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
      $name = 'UpdatePromptSettings'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    $name = 'UpdatePromptSettings'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UpdatePromptSettings' -Value 0 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Ścieżka aktualizacji jest cichsza od instalacji i dlatego
    groźniejsza. Instalacja wymaga, żeby ktoś podłączył drukarkę;
    aktualizacja nie wymaga niczego i działa przez cały czas istnienia
    połączenia z kolejką — także wtedy, gdy o tym połączeniu dawno
    zapomniano.

    Koszt tego punktu polega na tym, że uderza w mechanizm prawidłowy:
    tą samą drogą rozsyła poprawki producent drukarki.

    Przed zmianą ustal, w jaki inny sposób ten serwer będzie dostawał
    nowe sterowniki. Bez tego zmiana zamraża je na zawsze i nikt tego
    nie zauważy.
  en: |
    The path of updating is quieter than that of installing and hence more dangerous. Installing
    takes somebody to connect a printer; updating takes nothing and works for as long as the
    connection with the queue lasts - also where that connection was long forgotten.

    This item's cost lies in its striking at a right mechanism: by that same road the printer's
    maker sends mendings about.

    Before the change settle how else this server will get new drivers. Without that the change
    freezes them for good and nobody will notice.
