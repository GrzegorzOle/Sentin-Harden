id: win2016-system-objects-default-permissions-strengthened

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wzmocnione uprawnienia domyślne wewnętrznych obiektów systemu
    en: Strengthened default permissions on the system's internal objects
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wzmacnia uprawnienia nadawane domyślnie wewnętrznym obiektom
    systemu — nazwanym zdarzeniom, muteksom, pamięci współdzielonej,
    kolejkom komunikatów.

    Obiekty te nie są plikami i nie widać ich w żadnym oknie, ale programy
    posługują się nimi bez przerwy. Służą do umawiania się: jeden proces
    zgłasza, że skończył, drugi na to czeka; jeden pilnuje, żeby tylko on
    zapisywał; trzeci zostawia dane do odebrania.

    Umowa taka opiera się na nazwie. Kto pierwszy założy obiekt o danej
    nazwie, ten go ma — a reszta się do niego przyłącza. Bez wzmocnionych
    uprawnień proces o zwykłych prawach może założyć obiekt o nazwie, której
    za chwilę użyje usługa systemowa, i tym samym wejść w środek jej umowy.

    Skutki są dwojakie. Łagodniejszy to zablokowanie usługi, która nie może
    założyć swojego obiektu i kończy pracę. Groźniejszy to wprowadzenie
    usługi w błąd: usługa czeka na sygnał albo czyta dane z obszaru
    założonego przez kogoś innego, a robi to z uprawnieniami systemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wejścia w umowę między procesami systemowymi przez wcześniejsze
    założenie obiektu o odpowiedniej nazwie, z uprawnieniami zwykłego konta.
  en: |
    The setting strengthens the permissions given by default to the system's internal
    objects - named events, mutexes, shared memory, message queues.

    Those objects are no files and are seen in no window, yet programs use them
    ceaselessly. They serve for agreeing: one process reports it has finished, another
    waits for that; one sees to it that it alone writes; a third leaves data to be
    collected.

    Such an agreement rests on a name. Whoever first makes an object of a given name
    has it - and the rest join to it. Without strengthened permissions a process of
    ordinary rights can make an object of a name a system service will use in a
    moment, and thereby step into the middle of its agreement.

    The consequences are twofold. The gentler is a service blocked, unable to make its
    object and stopping. The graver is a service led into error: it waits for a signal
    or reads data from an area made by somebody else, and does so with the system's
    rights.

    What an attacker gains while the item goes unmet: the chance to step into an
    agreement between system processes by making an object of the right name first,
    with an ordinary account's rights.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie pracują
    aplikacje porozumiewające się między kontami przez obiekty nazwane.

    Wartość wymagana jest wartością domyślną tego wydania systemu, więc na
    przeważającej części maszyn wdrożenie niczego nie zmienia.

    Przypadek, w którym zmienia, jest konkretny i dotyczy starszego
    oprogramowania wielostanowiskowego. Aplikacja, w której część działa
    jako usługa, a część jako program użytkownika, porozumiewa się między
    nimi właśnie obiektami nazwanymi. Po wzmocnieniu uprawnień część
    użytkownika może stracić dostęp do obiektu założonego przez usługę.

    Objaw jest przy tym mylący. Aplikacja uruchamia się normalnie i dopiero
    przy pierwszej czynności wymagającej porozumienia zgłasza błąd —
    zwykle błąd odmowy dostępu do czegoś, czego nazwa nic użytkownikowi nie
    mówi.

    Rzecz druga dotyczy oprogramowania do wirtualizacji i konteneryzacji
    starszej generacji, które bywa napisane przy założeniu słabszych
    uprawnień domyślnych.

    Zmiana wymaga restartu, bo ustawienie czytane jest przy starcie systemu.
    Do czasu restartu raport pokaże zgodność, a system będzie pracował
    po staremu.

    Czego to nie psuje: pracy z plikami, sieci, logowania, usług
    systemowych.
  en: |
    The class is "needs review", and what has to be checked is whether applications
    communicating between accounts through named objects work on the machine.

    The required value is this release's default, so on the greater part of machines
    the rollout changes nothing.

    The case where it does change something is a particular one and concerns older
    multi-position software. An application of which one part works as a service and
    another as a user's program communicates between them by just such named objects.
    After the permissions are strengthened, the user's part may lose access to an
    object made by the service.

    The symptom is misleading besides. The application starts normally and only at the
    first act calling for communication reports an error - as a rule an access denial
    to something whose name tells the user nothing.

    The second thing concerns virtualisation and containerisation software of an older
    generation, at times written on the assumption of weaker default permissions.

    The change calls for a restart, the setting being read as the system starts. Until
    the restart the report will show compliance and the system will work in the old
    way.

    What this does not break: work with files, the network, signing in, or system
    services.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - Starsze oprogramowanie wielostanowiskowe, w którym część działa jako usługa, a część jako program użytkownika, może stracić porozumienie między nimi
      - Objaw jest mylący - aplikacja uruchamia się normalnie i dopiero przy pierwszej czynności zgłasza odmowę dostępu do czegoś o nic nie mówiącej nazwie
      - Oprogramowanie do wirtualizacji i konteneryzacji starszej generacji bywa napisane przy założeniu słabszych uprawnień domyślnych
      - Do czasu restartu raport pokaże zgodność, a system będzie pracował po staremu
    en:
      - Older multi-position software, of which one part works as a service and another as a user's program, may lose the communication between them
      - The symptom is misleading - the application starts normally and only at the first act reports an access denial to something of a meaningless name
      - Virtualisation and containerisation software of an older generation is at times written on the assumption of weaker default permissions
      - Until the restart the report will show compliance and the system will work in the old way
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje starsze oprogramowanie porozumiewające się między kontami przez obiekty nazwane i nie sprawdzono, czy przetrwa wzmocnienie
      - Nie da się wyznaczyć okna na restart maszyny, a bez restartu zmiana i tak nie zacznie obowiązywać
    en:
      - Older software communicating between accounts through named objects works on the machine and it has not been checked whether it survives the strengthening
      - No window can be set for restarting the machine, and without a restart the change will not begin to hold anyway
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
      $name = 'ProtectionMode'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    $name = 'ProtectionMode'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ProtectionMode' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/system-objects-strengthen-default-permissions-of-internal-system-objects

notes:
  pl: |
    Punkt zamyka blok i jest w nim najmniej widoczny, bo dotyczy obiektów,
    których nikt nigdy nie ogląda. Warto to obrócić na korzyść opisu:
    właśnie dlatego, że nikt ich nie ogląda, umowy między procesami są
    miejscem, w którym utwardzenie rzadko się sprawdza i rzadko się
    zauważa jego brak.

    Kategoria średnia opisuje rzeczywistą wagę. Wejście w umowę między
    procesami wymaga konta na maszynie i wiedzy o nazwach, których używa
    konkretne oprogramowanie. Nie jest to droga wejścia, tylko droga
    rozwinięcia — i ta ocena stawia punkt tam, gdzie mu miejsce.

    Blok liczy sześć reguł. Trzy dotyczą pamięci procesu, jedna sposobu
    adresowania w powłoce, jedna zaufania do podpisanego pliku, jedna
    umów między procesami. Trzy są w klasie bez uciążliwości i nadają się
    do trybu zbiorczego; dwie wymagające restartu warto zebrać do jednego
    okna serwisowego.
  en: |
    The item shuts the block and is the least visible in it, concerning objects
    nobody ever looks at. That is worth turning to the description's advantage: just
    because nobody looks at them, agreements between processes are a place where
    hardening is seldom checked and its want seldom noticed.

    The medium category describes the real weight. Stepping into an agreement between
    processes calls for an account on the machine and for knowledge of the names a
    particular piece of software uses. It is no road of entry but a road of
    development - and that judgement puts the item where it belongs.

    The block counts six rules. Three concern a process's memory, one a way of
    addressing in the shell, one trust in a signed file, one agreements between
    processes. Three are of the class no disruption and are fit for bulk mode; the
    two calling for a restart are worth gathering into one maintenance window.
