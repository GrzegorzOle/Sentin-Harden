id: win2025-security-log-warning-level

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Ostrzeżenie o zapełnieniu dziennika zabezpieczeń przy dziewięćdziesięciu procentach
    en: A warning about the security log filling up at ninety per cent
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Dziennik zabezpieczeń ma skończony rozmiar. Gdy się zapełni, system
    robi jedną z dwóch rzeczy: zaczyna nadpisywać wpisy najstarsze albo
    przestaje przyjmować nowe. Obie są złe dokładnie w tej chwili,
    w której zapis z dziennika jest potrzebny.

    Zapełnienie samo w sobie nie jest niczyją winą. Problemem jest to,
    że dzieje się po cichu: wpisy znikają jeden po drugim i nikt się
    o tym nie dowiaduje, dopóki po nie nie sięgnie. Ten punkt każe
    systemowi odezwać się wcześniej — przy dziewięćdziesięciu procentach
    zapełnienia, czyli zanim cokolwiek zostanie utracone.

    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego.
    Na stanowisku dziennik opisuje pracę jednej osoby, a zdarzeń jest
    tyle, ile ta osoba zrobi. Na serwerze dziennik jest zbiorczy: notuje
    logowania wszystkich, dostęp do udziałów, zmiany uprawnień, działania
    kont usług. Rośnie więc wielokrotnie szybciej i zapełnia się
    w dniach, nie w miesiącach.

    Waży też to, do czego ten dziennik służy. Na serwerze jest on
    jedynym zapisem, po którym da się później odtworzyć, kto się
    zalogował i co zrobił. Jest to zarazem pierwsza rzecz, którą
    napastnik chce wyczyścić — a cicho zapełniający się dziennik robi
    to za niego, bez śladu po skasowaniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność,
    że ślad po jego działaniu zniknie sam, w sposób nieodróżnialny od
    normalnej pracy maszyny.
  en: |
    The security log has a finite size. When it fills up the system does one of two things: it
    begins overwriting the oldest entries, or it stops taking new ones. Both are bad at just that
    moment in which a writing from the log is needed.

    The filling up is in itself nobody's fault. The trouble is that it happens quietly: entries go
    one after another and nobody learns of it until they reach for them. This item bids the system
    speak up sooner - at ninety per cent of fill, that is before anything is lost.

    I raised the category of risk against the working station's pack. At a station the log sets
    down the work of one person, and there are as many happenings as that person makes. On a
    server the log is of many: it notes everybody's signings in, the reaching for shares, the
    changes of rights, the doings of service accounts. It grows therefore many times faster and
    fills up in days, not in months.

    What this log is for weighs too. On a server it is the one writing by which it can later be
    made out who signed in and what they did. It is withal the first thing an attacker wishes to
    clear - and a log filling up quietly does it for them, with no trace of an erasing.

    What an attacker gains while the item goes unmet: the certainty that the trace of their doing
    will go of itself, in a way not to be told apart from the machine's ordinary work.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia z dwóch powodów, a żaden nie jest
    skutkiem samej wartości.

    Pierwszy to restart. Usługa dziennika czyta ten próg przy starcie,
    więc do ponownego uruchomienia maszyny ostrzeżenie nie zadziała.
    Serwer restartuje się w oknie planowanym, więc trzeba to okno
    wskazać, a nie zakładać.

    Drugi jest ważniejszy i dotyczy sensu punktu, nie kosztu.
    Ostrzeżenie jest warte tyle, ile warte jest jego przeczytanie.
    Jeżeli z tego serwera nikt nie zbiera zdarzeń i nikt nie zagląda
    do dziennika, punkt dopisuje jeden wpis więcej do dziennika, który
    i tak nikogo nie interesuje. Wdrożenie go bez odbiorcy jest
    czynnością pozorną i lepiej to powiedzieć wprost.

    Trzeba też ustawić rozmiar dziennika i sposób zachowania przy
    zapełnieniu. Ostrzeżenie mówi, że dziennik się kończy — nie mówi,
    co ma się wtedy stać. Bez tych dwóch rzeczy uprzedza tylko
    o nadpisywaniu, zamiast mu zapobiec.

    Skutków w pracy ludzi nie ma żadnych. Nic nie zwalnia, nic się nie
    blokuje, nikt niczego nie zauważy. Cała uciążliwość leży w tym, że
    punkt ma warunki wstępne i termin, a nie w tym, co psuje.

    W środowisku, w którym zdarzenia są zbierane do wspólnego
    repozytorium, wartość punktu jest inna: ostrzeżenie staje się
    sygnałem, że repozytorium przestało odbierać z tej maszyny. To jest
    zwykle jego najlepsze zastosowanie na serwerze.
  en: |
    The change takes a knowing rollout for two reasons, and neither is the effect of the value
    itself.

    The first is the restart. The log service reads this threshold at its starting, so until a
    fresh start of the machine the warning will not work. A server restarts in a planned window,
    so that window must be named and not assumed.

    The second weighs more and bears on the item's sense, not its cost. A warning is worth as much
    as its being read is worth. Where nobody gathers happenings from this server and nobody looks
    into the log, the item adds one entry more to a log that interests nobody anyway. Rolling it
    out with no one to take it is a doing for show, and it is better said outright.

    The log's size and its way of behaving at a filling up must be set too. The warning says the
    log is running out - it does not say what is then to happen. Without those two things it
    merely forewarns of overwriting instead of hindering it.

    There are no effects at all on people's work. Nothing slows, nothing locks, nobody will notice
    a thing. The whole disruption lies in the item's having preconditions and a date, and not in
    what it breaks.

    In a setting where happenings are gathered into a common store the item's worth is another:
    the warning becomes a sign that the store has stopped taking from this machine. That is
    usually its best use on a server.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Nic w pracy ludzi nie zwalnia i nie blokuje się, zmiana jest niewidoczna
      - Ostrzeżenie nie zadziała do ponownego uruchomienia maszyny
      - Bez ustawionego rozmiaru dziennika i zachowania przy zapełnieniu punkt tylko uprzedza o nadpisywaniu
      - Bez odbiorcy zdarzeń wpis ostrzegawczy trafia do dziennika, którego nikt nie czyta
    en:
      - Nothing in people's work slows or locks, the change is unseen
      - The warning will not work until a fresh start of the machine
      - Without a set log size and behaviour at a filling up the item merely forewarns of overwriting
      - With nobody to take the happenings the warning entry goes to a log nobody reads
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tego serwera nikt nie zbiera zdarzeń i nikt nie zagląda do dziennika zabezpieczeń
      - Nie wskazano okna serwisowego, w którym maszyna zostanie ponownie uruchomiona
    en:
      - Nobody gathers happenings from this server and nobody looks into the security log
      - No service window was named in which the machine will be started afresh
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value is a percentage of fill; ninety is required and anything
      # lower warns earlier, so it is compliant as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
      $name = 'WarningLevel'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch [System.Security.SecurityException] {
      # The key of this log is closed to a user without administrative rights.
      # Its own message goes to the error stream, so the report can tell a
      # missing privilege from a real fault.
      [Console]::Error.WriteLine($_.Exception.Message)
      'CHECK_ERROR'
    } catch {
      'CHECK_ERROR'
    }
  expected: '90'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
    $name = 'WarningLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security' `
      -Name 'WarningLevel' -Value 90 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-1104

notes:
  pl: |
    Kategorię ryzyka podniosłem względem paczki stanowiska roboczego.
    Dziennik serwera jest zbiorczy, rośnie wielokrotnie szybciej
    i zapełnia się w dniach, a jest jedynym zapisem, po którym da się
    odtworzyć, kto się zalogował i co zrobił.

    Punkt jest warty tyle, ile warte jest przeczytanie ostrzeżenia.
    Bez odbiorcy zdarzeń jego wdrożenie jest czynnością pozorną.

    Najlepsze zastosowanie na serwerze zbierającym zdarzenia do
    wspólnego repozytorium: ostrzeżenie staje się sygnałem, że
    repozytorium przestało odbierać z tej maszyny.

    Sam odczyt tego wpisu wymaga uprawnień administratora — gałąź
    dziennika zabezpieczeń jest zamknięta dla zwykłego użytkownika.
    Bez podniesienia uprawnień audyt zwraca stan „nie dało się
    sprawdzić", a nie niezgodność.
  en: |
    I raised the category of risk against the working station's pack. A server's log is of many,
    grows many times faster and fills up in days, and it is the one writing by which it can be
    made out who signed in and what they did.

    The item is worth as much as the reading of the warning is worth. With nobody to take the
    happenings, rolling it out is a doing for show.

    Its best use on a server gathering happenings into a common store: the warning becomes a sign
    that the store has stopped taking from this machine.

    The reading of this entry itself takes administrative rights - the branch of the security log
    is closed to an ordinary user. Without a raising of rights the audit gives back the state "it
    could not be checked" and not non-compliance.
