id: win2016-anonymous-sam-enumeration

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Anonimowe wyliczanie kont zablokowane
    en: Anonymous enumeration of accounts blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania połączeniu nieuwierzytelnionemu wylistować konta
    istniejące na tej maszynie.

    Kategoria wysoka, bo to jest pierwszy krok większości ataków na
    poświadczenia i jedyny, który nie wymaga niczego. Napastnik nie musi znać
    hasła, nie musi mieć konta i nie musi nic łamać — pyta maszynę, kto na
    niej jest, i dostaje odpowiedź.

    Z listy kont wynika więcej, niż się z pozoru wydaje. Widać, które konta
    są usługowe, które należą do ludzi, które mają nazwy wskazujące na
    uprawnienia i które zostały założone dawno i pewnie nikt ich nie pilnuje.
    Zgadywanie haseł przestaje być zgadywaniem wszystkiego, a staje się
    zgadywaniem dla trzech wybranych kont.

    Na serwerze 2016 rzecz waży więcej niż na maszynie nowszej, bo nazwy
    kont na starych serwerach bywają opisowe. Konto nazwane wprost od roli,
    którą pełni, mówi napastnikowi, gdzie warto się zatrzymać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: listę kont tej
    maszyny bez logowania i bez śladu, a wraz z nią kierunek dalszego ataku.
  en: |
    The item forbids an unauthenticated connection to list the accounts that
    exist on this machine.

    The category is high, because this is the first step in most attacks on
    credentials and the only one that requires nothing. The attacker need not
    know a password, need not have an account and need not break anything -
    they ask the machine who is on it and get an answer.

    A list of accounts says more than it seems to. One can see which accounts
    are service accounts, which belong to people, which carry names pointing at
    privileges, and which were created long ago and are probably watched by
    nobody. Password guessing stops being the guessing of everything and becomes
    guessing for three chosen accounts.

    On Server 2016 this weighs more than on a newer machine, because account
    names on old servers tend to be descriptive. An account named outright after
    the role it serves tells an attacker where it is worth stopping.

    What an attacker gains while the item goes unmet: the list of this machine's
    accounts with no sign-in and no trace, and with it the direction of the rest
    of the attack.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż w zwykłej pracy nikt tego nie
    zauważy. Sprawdzenie dotyczy rzeczy starych i nielicznych, ale
    konkretnych.

    Z listy kont pobieranej bez uwierzytelnienia korzystają jeszcze niektóre
    narzędzia inwentaryzacyjne, starsze systemy zarządzania oraz aplikacje
    tłumaczące identyfikatory na nazwy w sposób sprzed lat. Po zmianie
    zobaczą pustą listę i zwykle nie powiedzą dlaczego — pokażą po prostu
    mniej niż wcześniej.

    To jest właściwe ryzyko przy tym punkcie: nie awaria, tylko cicha
    niekompletność. Raport inwentaryzacyjny, który nagle pokazuje mniej kont,
    bywa czytany jako stan faktyczny, a nie jako skutek zmiany.

    Na serwerze 2016 warto przejrzeć to, co odpytuje maszynę cyklicznie.
    Narzędzia z tamtego okresu chętniej pytały anonimowo, bo wtedy było to
    zachowanie zwyczajne.

    Czego to nie psuje: logowania, pracy domeny, udostępniania plików,
    zarządzania z konta administratora ani niczego, co się uwierzytelnia.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", although in ordinary work nobody will notice
    it. The review concerns things old and few in number, but concrete.

    A list of accounts fetched without authentication is still used by some
    inventory tools, older management systems and applications that translate
    identifiers into names in a way from years ago. After the change they will
    see an empty list and usually will not say why - they will simply show less
    than before.

    That is the real risk with this item: not a failure but a quiet
    incompleteness. An inventory report that suddenly shows fewer accounts tends
    to be read as the state of things rather than as the effect of a change.

    On Server 2016 it is worth looking at what queries the machine on a cycle.
    Tools from that period asked anonymously more readily, because at the time
    that was ordinary behaviour.

    What this does not break: signing in, the domain's work, file sharing,
    management from an administrator account, or anything that authenticates.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - remote-management
  what_breaks:
    pl:
      - Narzędzia inwentaryzacyjne pytające anonimowo o konta zobaczą pustą listę
      - Aplikacje tłumaczące identyfikatory na nazwy sposobem sprzed lat przestaną to robić
      - Ryzykiem jest cicha niekompletność raportu, a nie awaria, więc zmiana bywa czytana jako stan faktyczny
      - Logowanie, praca domeny i zarządzanie z konta administratora działają bez zmian
    en:
      - Inventory tools asking anonymously about accounts will see an empty list
      - Applications translating identifiers into names in the old way stop doing so
      - The risk is a report quietly incomplete rather than a failure, so the change tends to be read as the state of things
      - Signing in, the domain's work and management from an administrator account work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszynę odpytuje cyklicznie narzędzie inwentaryzacyjne pobierające listę kont bez uwierzytelnienia
    en:
      - An inventory tool that fetches the account list without authenticating queries the machine on a cycle
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'RestrictAnonymousSAM'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $current = (Get-ItemProperty -Path $path -Name 'RestrictAnonymousSAM' -ErrorAction SilentlyContinue).'RestrictAnonymousSAM'
    [pscustomobject]@{
      path        = $path
      name        = 'RestrictAnonymousSAM'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The account list is the first step of most credential attacks and the only
    # one needing nothing at all. This entry covers accounts; the neighbouring
    # one covers accounts and shares together.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictAnonymousSAM' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts

notes:
  pl: |
    Ten punkt i sąsiedni — obejmujący konta razem z udziałami — leżą pod tym
    samym kluczem i mają nazwy różniące się jednym członem. To jest miejsce,
    w którym najłatwiej ustawić jedno, a sprawdzić drugie.

    Zakres jest węższy niż u sąsiada: ten wpis dotyczy kont, tamten kont
    i udziałów. Ustawienie samego węższego zostawia listę udziałów otwartą,
    co przy serwerze plików bywa informacją równie użyteczną dla napastnika.

    Klucz leży w gałęzi systemowej, więc przy cofaniu usuwana jest sama
    wartość. Klucz istniał na długo przed tą zmianą i mieszkają w nim rzeczy
    niezwiązane z regułą.
  en: |
    This item and its neighbour - the one covering accounts together with shares
    - lie under the same key and carry names differing by one part. That is the
    place where it is easiest to set one and check the other.

    Its reach is narrower than the neighbour's: this entry concerns accounts,
    that one accounts and shares. Setting only the narrower leaves the list of
    shares open, which on a file server can be information just as useful to an
    attacker.

    The key lies in the system branch, so undoing removes the value alone. The
    key existed long before this change and holds things unrelated to the rule.
