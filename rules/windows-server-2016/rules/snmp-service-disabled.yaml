id: win2016-snmp-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania siecią starszym protokołem wyłączona
    en: The service managing the network by an older protocol disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa odpowiada na pytania o stan maszyny zadawane protokołem
    zarządzania sieciowego — tym samym, którym odpytuje się przełączniki,
    drukarki i zasilacze awaryjne.

    Sposób uwierzytelniania w tym protokole, w wersjach starszych niż
    trzecia, polega na podaniu wspólnego ciągu znaków. Ciąg ten pełni rolę
    hasła, idzie przez sieć jawnie i jest wspólny dla wszystkich
    odpytujących. W praktyce bywa domyślny — słowo, które zna każdy, kto
    kiedykolwiek zajmował się siecią.

    Zakres tego, co odpowiedź ujawnia, jest szerszy, niż sugeruje nazwa
    „zarządzanie". Protokół potrafi wypisać listę procesów, listę
    zainstalowanego oprogramowania, tablicę interfejsów wraz z adresami,
    tablicę połączeń i czas pracy. Jest to rozpoznanie maszyny wykonane
    jednym pytaniem, bez logowania i bez śladu wyglądającego na atak.

    Gdy dostęp jest skonfigurowany do zapisu, sprawa jest poważniejsza,
    bo część wpisów daje się zmieniać — w tym takie, które dotyczą
    interfejsów sieciowych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: spis
    procesów, oprogramowania i połączeń tej maszyny, uzyskany po podaniu
    ciągu, który bywa domyślny i idzie przez sieć jawnie.
  en: |
    The service answers questions about the machine's state put by the network management
    protocol - the same by which switches, printers and standby power supplies are
    queried.

    The way of authenticating in that protocol, in versions older than the third, rests on
    giving a shared string of characters. That string fills a password's role, goes over
    the network in the clear and is shared by all who query. In practice it is at times
    the default one - a word known to everybody who has ever had to do with a network.

    The reach of what the answer discloses is wider than the name "management" suggests.
    The protocol can list the processes, the installed software, the table of interfaces
    along with their addresses, the table of connections and the running time. It is a
    reconnaissance of the machine done with one question, with no signing in and no trace
    that looks like an attack.

    Where the access is configured for writing, the matter is graver, some entries being
    changeable - among them such as concern the network interfaces.

    What an attacker gains while the item goes unmet: a register of this machine's
    processes, software and connections, got by giving a string that is at times the
    default one and goes over the network in the clear.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia jest ta sama, co
    przy zdalnym odczycie rejestru: nadzór bezagentowy.

    Protokół ten jest w wielu organizacjach podstawową drogą zbierania
    danych o maszynach, właśnie dlatego, że nie wymaga instalowania niczego.
    Po wyłączeniu usługi system nadzoru traci źródło i — co ważniejsze —
    zwykle nie zgłasza tego jako awarii. Maszyna przestaje pojawiać się na
    wykresach, a wykres, który się urywa, bywa czytany jako spokój.

    Drugi przypadek dotyczy systemów inwentaryzacyjnych i narzędzi
    pomiarowych zbierających wykorzystanie łącza. Te milkną tak samo cicho.

    Trzeci, rzadszy, to automatyka reagująca na dane z tego protokołu —
    skrypty przełączające coś, gdy wartość przekroczy próg. Taka automatyka
    po wyłączeniu usługi nie tyle przestaje działać, ile przestaje
    reagować, co jest gorsze, bo wygląda identycznie jak brak zdarzeń.

    Droga wyjścia istnieje i warto ją nazwać: wersja trzecia protokołu ma
    uwierzytelnianie i szyfrowanie i nie podlega tej krytyce. Reguła mówi
    o wyłączeniu usługi, ale realną decyzją bywa przejście na wersję
    nowszą albo na agenta.

    Czego to nie psuje: pracy maszyny, usług, sieci, uwierzytelniania,
    zarządzania zdalnego mechanizmem powłoki.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check is the same as at reading the
    registry remotely: agentless monitoring.

    That protocol is in many organisations the chief road of gathering data about machines,
    precisely because it calls for nothing to be installed. Once the service is off the
    monitoring system loses its source and - what matters more - as a rule does not report
    it as a failure. The machine stops appearing on the charts, and a chart that breaks off
    is at times read as calm.

    The second case concerns inventory systems and measuring tools gathering link use.
    Those fall silent just as quietly.

    The third, rarer, is automation reacting to data from this protocol - scripts switching
    something when a value crosses a threshold. Such automation after the service is off
    does not so much stop working as stop reacting, which is the worse, looking as it does
    exactly like an absence of events.

    A way out exists and is worth naming: the protocol's third version has authentication
    and encryption and does not fall under this criticism. The rule speaks of switching the
    service off, but the real decision is at times a move to the newer version or to an
    agent.

    What this does not break: the machine's working, services, the network, authentication,
    or remote management by the shell mechanism.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Nadzór bezagentowy traci źródło danych i zwykle nie zgłasza tego jako awarii - maszyna przestaje pojawiać się na wykresach
      - Systemy inwentaryzacyjne i narzędzia mierzące wykorzystanie łącza milkną tak samo cicho
      - Automatyka reagująca na przekroczenie progu przestaje reagować, co wygląda identycznie jak brak zdarzeń
      - Praca maszyny, usługi, sieć i zarządzanie zdalne mechanizmem powłoki pozostają bez zmian
    en:
      - Agentless monitoring loses its source of data and as a rule does not report it as a failure - the machine stops appearing on the charts
      - Inventory systems and tools measuring link use fall silent just as quietly
      - Automation reacting to a threshold being crossed stops reacting, which looks exactly like an absence of events
      - The machine's working, services, the network and remote management by the shell mechanism stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nadzór nad tą maszyną jest bezagentowy i opiera się na tym protokole, a nie przewidziano zastąpienia go agentem
      - Automatyka w tej organizacji reaguje na progi odczytywane tym protokołem z tej maszyny
    en:
      - Monitoring of this machine is agentless and rests on this protocol, and no replacement by an agent has been planned
      - Automation in this organisation reacts to thresholds read from this machine by this protocol
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SNMP'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'SNMP' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Monitoring reading this machine by this protocol loses its source and
    # usually reports nothing - the machine just stops appearing.
    Stop-Service -Name 'SNMP' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SNMP' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'SNMP' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/technologies/snmp/snmp-top

notes:
  pl: |
    Punkt powtarza wzorzec cichej straty, znany już z reguły o zdalnym
    odczycie rejestru, i warto te dwa punkty pokazywać obok siebie. Oba
    zabierają nadzorowi źródło danych, oba robią to bez błędu, i oba
    zostawiają wykres, który wygląda na spokojny.

    Rzecz, która ten punkt odróżnia, dotyczy drogi wyjścia. Przy rejestrze
    alternatywą jest agent, czyli zmiana sposobu nadzoru. Tutaj alternatywą
    jest nowsza wersja tego samego protokołu, czyli zmiana znacznie
    mniejsza. Aplikacja powinna to powiedzieć, bo inaczej punkt wygląda na
    wybór między bezpieczeństwem a widocznością maszyny, a nie jest nim.

    Zakres ujawnianych danych warto wymienić z nazwy, bo słowo
    „zarządzanie" niczego nie zdradza. Spis procesów i spis zainstalowanego
    oprogramowania to rozpoznanie, na które przy innych drogach trzeba
    najpierw wejść na maszynę.
  en: |
    The item repeats the pattern of quiet loss already known from the rule on reading the
    registry remotely, and the two are worth showing beside one another. Both take a source
    of data from the monitoring, both do so with no error, and both leave a chart that
    looks calm.

    What sets this item apart concerns the way out. At the registry the alternative is an
    agent, which is to say a change in the manner of monitoring. Here the alternative is a
    newer version of the same protocol, a far smaller change. The application should say so,
    the item looking otherwise like a choice between security and the machine's visibility,
    which it is not.

    The reach of the data disclosed is worth naming outright, the word "management"
    betraying nothing. A register of processes and a register of installed software is a
    reconnaissance for which, by other roads, one must first get onto the machine.
