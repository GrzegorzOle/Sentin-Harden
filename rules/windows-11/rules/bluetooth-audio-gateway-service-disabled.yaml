id: win11-bluetooth-audio-gateway-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa bramy dźwiękowej łączności bliskiego zasięgu wyłączona
    en: The audio gateway service for short range connectivity disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje ten fragment łączności bliskiego zasięgu, w którym maszyna
    występuje jako urządzenie dźwiękowe dla telefonu: odbiera strumień rozmowy,
    przekazuje dźwięk do głośników i mikrofonu maszyny, obsługuje sterowanie
    połączeniem.

    Waga tego punktu jest mniejsza niż wyłączenia całej łączności bliskiego
    zasięgu i nie ma powodu tego ukrywać. Usługa nie paruje urządzeń, nie
    przyjmuje urządzeń wskazujących i nie wprowadza znaków. Obsługuje jeden
    profil, wąsko określony.

    Wartość punktu leży gdzie indziej. Po pierwsze, usługa zestawia połączenie
    z telefonem — urządzeniem, nad którym organizacja zwykle nie ma kontroli
    i które bywa prywatne. Po drugie, przetwarza strumień dźwięku pochodzący
    z zewnątrz, a więc dane, których nikt nie sprawdził, w kodzie działającym
    z wysokimi uprawnieniami. Po trzecie, obecność tej usługi na maszynie, na
    której nikt nie prowadzi rozmów przez komputer, jest po prostu powierzchnią
    bez zastosowania.

    Punkt jest dobrym przykładem zmiany, którą wykonuje się dlatego, że nic
    nie kosztuje, a nie dlatego, że zamyka znaną drogę wejścia.
  en: |
    The service handles that part of short range connectivity in which the machine acts
    as an audio device for a phone: it takes the stream of a call, passes the sound to
    the machine's speakers and microphone, and handles control of the call.

    The weight of this item is smaller than that of disabling short range connectivity
    altogether, and there is no reason to hide it. The service pairs no devices, takes no
    pointing devices and enters no characters. It handles one narrowly defined profile.

    The item's worth lies elsewhere. First, the service sets up a connection with a phone
    - a device the organisation usually has no control over and which is sometimes
    private. Second, it handles a stream of sound coming from outside, that is data
    nobody has checked, in code running with high rights. Third, the presence of this
    service on a machine where nobody holds calls through the computer is simply surface
    with no use.

    The item is a good example of a change made because it costs nothing, rather than
    because it closes a known way in.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy ktokolwiek prowadzi rozmowy telefoniczne
    z użyciem komputera jako zestawu głośnomówiącego.

    Na stanowisku biurowym jest to zastosowanie rzadkie i zmiana zwykle
    przechodzi niezauważona. Rozmowy prowadzone przez programy do spotkań
    działają dalej — one nie korzystają z tej usługi, tylko z urządzenia
    dźwiękowego podłączonego do maszyny.

    Skutek dotyczy wyłącznie sytuacji, w której to telefon jest źródłem
    rozmowy, a komputer jej głośnikiem i mikrofonem. Wtedy po wyłączeniu
    usługi rozmowa zostaje w telefonie i trzeba ją prowadzić z niego albo
    z osobnych słuchawek.

    Sprawdzić warto przede wszystkim stanowiska obsługi klienta i osoby
    pracujące z jednym urządzeniem dźwiękowym podzielonym między telefon
    i komputer. Dla nich przełączanie źródła rozmowy jest czynnością codzienną
    i zmiana będzie odczuwalna od pierwszego dnia.

    Zmiana wymaga zatrzymania usługi.
  en: |
    One thing needs checking: whether anybody holds telephone calls using the computer as
    a hands-free set.

    At an office station that is a rare use and the change usually passes unnoticed.
    Calls held through meeting programs carry on working - they do not use this service
    but the audio device attached to the machine.

    The effect concerns only the case where the phone is the source of the call and the
    computer its speaker and microphone. Once the service is off, the call then stays in
    the phone and has to be held from it or from a separate headset.

    What is worth checking above all are customer service stations and people working
    with one audio device shared between a phone and a computer. For them switching the
    source of a call is a daily act and the change will be felt from the first day.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Rozmowa telefoniczna nie da się przełączyć na głośniki i mikrofon komputera
      - Sterowanie połączeniem telefonicznym z poziomu komputera przestaje być dostępne
      - Programy do spotkań i rozmów przez sieć działają dalej bez zmiany
      - Słuchawki bezprzewodowe podłączone do komputera działają dalej do odtwarzania dźwięku
    en:
      - A telephone call cannot be switched to the computer's speakers and microphone
      - Controlling a telephone call from the computer stops being available
      - Meeting and call programs working over the network carry on working unchanged
      - Wireless headsets attached to the computer carry on working for playing sound
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko obsługi klienta prowadzi rozmowy z telefonu przez komputer
      - Jedno urządzenie dźwiękowe jest dzielone między telefon i komputer w codziennej pracy
    en:
      - A customer service station holds calls from a phone through the computer
      - One audio device is shared between a phone and a computer in daily work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\BTAGService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\BTAGService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'BTAGService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'BTAGService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'BTAGService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/bluetooth/

notes:
  pl: |
    Reguła jest węższa niż wyłączenie całej obsługi łączności bliskiego
    zasięgu, opisane w tej paczce osobno. Tamta reguła czyni tę bezprzedmiotową
    w skutkach, ale nie w zapisie: usługa pozostaje ustawiona na uruchamianie
    i wróci razem z tamtą. Dlatego oba punkty audytuje się niezależnie.

    Odwrotnie natomiast ta reguła nie zastępuje tamtej i nie zbliża się do niej
    wagą. Wyłączenie samej bramy dźwiękowej nie zdejmuje z maszyny ani
    widoczności, ani parowania, ani urządzeń wprowadzających znaki.

    Usługa jest uruchamiana wyzwalaczem i na maszynie, z którą nie sparowano
    telefonu, bywa zatrzymana mimo trybu uruchamiania innego niż wyłączony.
    Stan zatrzymany nie jest zgodnością — sprawdzenie czyta tryb uruchamiania
    z rejestru, a nie stan usługi w danej chwili.
  en: |
    The rule is narrower than disabling all support for short range connectivity, which
    this pack describes separately. That rule makes this one moot in its effects but not
    in what is recorded: the service stays set to start and will come back together with
    that one. So both items are audited independently.

    The other way about, this rule does not stand in for that one and does not come near
    it in weight. Disabling the audio gateway alone takes from the machine neither
    visibility, nor pairing, nor devices that enter characters.

    The service is started by a trigger and on a machine with no phone paired it is
    sometimes stopped despite a startup mode other than disabled. A stopped state is not
    compliance - the check reads the startup mode from the registry rather than the
    service's state at a given moment.
