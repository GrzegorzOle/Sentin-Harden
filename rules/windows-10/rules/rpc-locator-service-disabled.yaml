id: win10-rpc-locator-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa odnajdywania punktów zdalnego wywołania procedur wyłączona
    en: The finding service for points of calling procedures from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę prowadzącą wykaz punktów, pod którymi
    programy udostępniają swoje procedury do wywołania przez sieć.

    Rola tej usługi bywa mylona z rolą mechanizmu, który naprawdę
    kieruje wywołaniami. Tamten działa dalej i jest niezbędny. Ten jest
    starszą warstwą nazewniczą, pochodzącą z czasów przed katalogiem
    domenowym, i od dawna nie ma czego prowadzić.

    Ocena jest niska i tak trzeba ten punkt przedstawiać. Usługa nie
    przyjmuje domyślnie połączeń z sieci i nie jest znaną drogą wejścia.

    Znaczenie ma natomiast to samo co przy łączu podczerwonym: jest to
    warstwa pozostawiona w systemie długo po tym, jak przestała być
    używana, więc nikt jej nie sprawdza. Wykaz punktów jest przy tym
    informacją o tym, co na maszynie działa.

    Odnotowuję, że na stanowisku roboczym usługa ta zwykle stoi
    zatrzymana i punkt jest bezkosztowy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    — jedną niesprawdzaną warstwę więcej i wykaz punktów maszyny.
  en: |
    The setting switches off the service keeping a roll of the points at which programs give out their procedures
    to be called over the network.

    The part of that service is at times taken for the part of the mechanism that truly steers the calls. That one
    works on and is needful. This one is an older layer of naming, come down from before the domain's catalogue,
    and has long had nothing to keep.

    The grading is low and the item is to be put forward as such. The service takes in by default no joinings from
    the network and is no known road in.

    What has weight is the same as at the link by unseen light: it is a layer left in the system long after it
    ceased to be used, so nobody looks it over. The roll of points is withal word of what works upon the machine.

    I set down that upon a station of work that service commonly stands stopped and the item is without cost.

    What an attacker gains while the item goes unmet: little - one unlooked-over layer more and a roll of the
    machine's points.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy starych programów
    rozproszonych.

    Miejscem wartym uwagi są programy branżowe pisane w czasach, gdy
    warstwa ta była sposobem odnajdywania serwera po nazwie. Tam
    zatrzymanie usługi oznacza, że klient nie znajdzie serwera, choć
    serwer działa, a komunikat o błędzie zwykle nie wskaże przyczyny.

    Odnotowuję, że mechanizm kierujący wywołaniami działa dalej.
    Wyłączenie tej usługi nie rusza zdalnego zarządzania, udostępniania
    plików ani niczego, co z wywołań procedur korzysta na bieżąco.

    Zastrzegam, że usługa ta zwykle stoi zatrzymana już przed zmianą.
    Wtedy punkt nie robi nic poza zapisaniem decyzji wprost.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: zdalnego zarządzania, udostępniania plików,
    drukowania, logowania, pracy programów.
  en: |
    The class is "needs review", and the review touches old programs spread over several machines.

    The place worth notice is programs of a trade written in the time when that layer was the way of finding a
    server by name. There the stopping of the service means the client will not find the server, though the server
    works, and the message of the fault will commonly not point to the cause.

    I set down that the mechanism steering the calls works on. The switching off of this service touches not the
    ordering from afar, the giving out of files, nor anything using the calling of procedures day by day.

    I set down that the service commonly stands stopped already before the change. The item does then nothing but
    set the decision down outright.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the ordering from afar, the giving out of files, printing, logging on, or the work
    of programs.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Stary program rozproszony odnajdujący serwer tą warstwą nie znajdzie go, choć serwer działa
      - Komunikat o błędzie w takim programie zwykle nie wskaże przyczyny i szukanie potrwa
      - Mechanizm kierujący wywołaniami działa dalej, więc zdalne zarządzanie pozostaje nietknięte
      - Usługa zwykle stoi zatrzymana już przed zmianą i wtedy punkt zapisuje jedynie decyzję
      - Udostępnianie plików, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - An old program spread over machines finding its server by that layer will not find it, though the server works
      - The message of the fault in such a program will commonly not point to the cause and the seeking will take time
      - The mechanism steering the calls works on, so the ordering from afar stays untouched
      - The service commonly stands stopped already before the change, and the item then sets down the decision alone
      - The giving out of files, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Program branżowy odnajduje swój serwer przez tę warstwę nazewniczą i nie ma innej drogi
    en:
      - A program of a trade finds its server through that layer of naming and has no other road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RpcLocator'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RpcLocator' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RpcLocator' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RpcLocator' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/rpc/the-rpc-name-service-database

notes:
  pl: |
    Reguła bywa mylona z punktem o mechanizmie kierującym wywołaniami
    i warto, żeby aplikacja rozdzieliła to jednym zdaniem. Tamten
    mechanizm jest niezbędny i zostaje. Tutaj chodzi o starszą warstwę
    nazewniczą, która od dawna nie ma czego prowadzić.

    Argument wart zachowania jest ten sam co przy łączu podczerwonym:
    warstwa pozostawiona w systemie po tym, jak przestała być używana,
    nie jest sprawdzana przez nikogo.

    Odnotowuję niską ocenę uczciwie. Usługa nie jest znaną drogą wejścia,
    a wartość punktu polega na porządku, nie na zamknięciu ataku.
  en: |
    The rule is at times taken for the item about the mechanism steering the calls, and it is well that the
    application part them in one sentence. That mechanism is needful and stays. Here it is an older layer of
    naming that has long had nothing to keep.

    The argument worth keeping is the same as at the link by unseen light: a layer left in the system after it
    ceased to be used is looked over by nobody.

    I set down the low grading honestly. The service is no known road in, and the item's worth lies in good order
    and not in the shutting of an assault.
