id: win11-security-log-warning-level

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Ostrzeżenie o zapełnieniu dziennika zabezpieczeń przy dziewięćdziesięciu procentach
    en: A warning about the security log filling up at ninety per cent
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Dziennik zabezpieczeń ma skończony rozmiar. Gdy się zapełni, system robi
    jedną z dwóch rzeczy: zaczyna nadpisywać wpisy najstarsze albo przestaje
    przyjmować nowe. Obie są złe w tej samej chwili — chwili, w której zapis
    z dziennika jest potrzebny.

    Zapełnienie samo w sobie nie jest niczyją winą; dziennik po prostu rośnie.
    Problemem jest to, że dzieje się to po cichu. Wpisy sprzed miesiąca znikają
    jeden po drugim i nikt się o tym nie dowiaduje, dopóki nie sięgnie po nie
    w trakcie wyjaśniania zdarzenia — czyli wtedy, gdy jest już za późno.

    Napastnik korzysta z tego wprost. Wygenerowanie dużej liczby zdarzeń
    zapisywanych do dziennika — choćby seryjnych nieudanych logowań — wypycha
    z niego wpisy starsze, w tym te, które opisują właściwe działanie. Jest to
    zacieranie śladów bez dotykania dziennika: wystarczy go przepełnić.

    Punkt każe systemowi odnotować, że dziennik zbliża się do granicy. Nie
    powiększa go i nie zmienia sposobu nadpisywania — daje sygnał, na który
    można zareagować, zanim wpisy zaczną znikać.
  en: |
    The security log has a finite size. Once it fills, the system does one of two
    things: it starts overwriting the oldest entries or it stops taking new ones. Both
    are bad at the same moment - the moment a record from the log is needed.

    Filling up is nobody's fault in itself; the log simply grows. The trouble is that
    it happens quietly. Entries from a month ago vanish one after another and nobody
    learns of it until they reach for them while working out what happened - that is,
    when it is already too late.

    An attacker uses this outright. Generating a large number of events written to the
    log - a run of failed sign-ins will do - pushes the older entries out of it,
    including those describing the real action. It is the covering of tracks without
    touching the log: overfilling it is enough.

    The item has the system record that the log is nearing its limit. It does not
    enlarge it and does not change how overwriting works - it gives a signal that can
    be acted on before entries start to vanish.

disruption_description:
  pl: |
    Zmiana zaczyna obowiązywać po ponownym uruchomieniu maszyny i z tego powodu
    wymaga świadomego wdrożenia. Poza samym restartem nie kosztuje nic.

    Nic nie przestaje działać, nic nie zmienia zachowania i użytkownik niczego
    nie zauważy. Jedynym widocznym skutkiem jest dodatkowy wpis w dzienniku
    zabezpieczeń, pojawiający się wtedy, gdy dziennik zapełni się w dziewięćdziesięciu
    procentach.

    Skutek uboczny dotyczy narzędzi zbierających zdarzenia. Wpis ostrzegawczy
    jest zdarzeniem jak każde inne i trafi do systemu zbierania logów, a tam
    może uruchomić regułę alarmową napisaną szeroko. Jest to skutek pożądany —
    ostrzeżenie ma dotrzeć do człowieka — ale warto uprzedzić o nim zespół,
    który te alarmy obsługuje.

    Punkt ma sens wtedy, gdy ktoś ten sygnał odbiera. Ostrzeżenie zapisane do
    dziennika, którego nikt nie czyta, jest dokładnie tak samo bezużyteczne jak
    jego brak — i to jest właściwy powód, dla którego benchmark stawia ten punkt
    w poziomie drugim.

    Wymagane jest ponowne uruchomienie maszyny.
  en: |
    The change takes effect once the machine is restarted and for that reason calls
    for a deliberate rollout. Beyond the restart itself it costs nothing.

    Nothing stops working, nothing changes behaviour and the user notices nothing. The
    only visible effect is an added entry in the security log, appearing when the log
    is ninety per cent full.

    A side effect touches tools gathering events. The warning entry is an event like
    any other and will reach the log collection system, where it may trip an alert
    rule written broadly. That effect is wanted - the warning is meant to reach a
    person - but the team handling those alerts is worth forewarning.

    The item makes sense where somebody receives the signal. A warning written to a
    log nobody reads is exactly as useless as no warning, and that is the proper
    reason the benchmark places this item at the second level.

    A restart of the machine is required.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - W dzienniku zabezpieczeń pojawia się dodatkowy wpis przy dziewięćdziesięcioprocentowym zapełnieniu
      - Reguła alarmowa napisana szeroko w systemie zbierania logów może zareagować na ten wpis
      - Rozmiar dziennika i sposób nadpisywania nie zmieniają się
    en:
      - An added entry appears in the security log at ninety per cent fill
      - A broadly written alert rule in the log collection system may react to that entry
      - The log's size and the way it overwrites do not change
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nikt nie czyta dziennika zabezpieczeń ani nie zbiera z maszyny zdarzeń
      - Stanowisko nie może być ponownie uruchomione w przewidywalnym terminie
    en:
      - Nobody reads the security log or gathers events from the machine
      - The station cannot be restarted within a foreseeable time
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value is a percentage of fill; ninety is required and anything
      # lower warns earlier, so it is compliant as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
      $name = 'WarningLevel'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '90'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security'
    $name = 'WarningLevel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Eventlog\Security' `
      -Name 'WarningLevel' -Value 90 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/basic-security-audit-policy-settings

notes:
  pl: |
    Punkt dotyczy wyłącznie dziennika zabezpieczeń. Pozostałe dzienniki mają
    własne gałęzie i ten wpis ich nie obejmuje.

    Gałąź dziennika zabezpieczeń jest zamknięta dla użytkownika bez uprawnień
    administratora — odczyt kończy się odmową dostępu, a nie pustym wynikiem.
    Sprawdzenie uruchomione bez podniesienia uprawnień zwraca więc stan błędu,
    a nie niezgodność, i tak należy je czytać.

    Ostrzeżenie jest sygnałem, nie zabezpieczeniem. Właściwym dopełnieniem
    punktu są dwie rzeczy opisane osobnymi regułami: rozmiar dziennika dobrany
    tak, żeby mieścił zapis z sensownego okresu, i sposób nadpisywania ustawiony
    świadomie. Sam sygnał bez nich mówi tylko tyle, że zaraz zacznie się tracić
    wpisy.

    Gałąź dziennika zabezpieczeń po stronie usługi jest odrębna od gałęzi zasad,
    w której leżą ustawienia rozmiaru i nadpisywania. Przy sprawdzaniu ręcznym
    łatwo pomylić te dwa miejsca.

    Wycofanie nie usuwa gałęzi — należy ona do usługi dzienników i jej usunięcie
    byłoby poważniejsze niż cokolwiek, co ten punkt zmienia.
  en: |
    The item concerns the security log alone. The remaining logs have keys of their
    own and this entry does not cover them.

    The security log's key is closed to a user without administrator rights - a read
    ends in a refusal of access rather than an empty result. A check run without
    raised privileges therefore returns the error state rather than a deviation, and
    that is how it should be read.

    The warning is a signal, not a safeguard. The item's proper completion is two
    things described by rules of their own: a log size chosen so that it holds a
    sensible span of record, and a deliberate setting of how it overwrites. On its own
    the signal says only that entries are about to start being lost.

    The security log's key on the service's side is separate from the policy key where
    the size and overwrite settings live. When checking by hand the two places are
    easy to confuse.

    Rollback does not remove the key - it belongs to the logging service and removing
    it would be graver than anything this item changes.
