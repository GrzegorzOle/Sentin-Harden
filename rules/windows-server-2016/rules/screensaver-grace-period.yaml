id: win2016-screensaver-grace-period

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Zwłoka przed zablokowaniem ekranu ograniczona
    en: The delay before the screen locks limited
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza czas, przez jaki po uruchomieniu wygaszacza ekranu
    maszynę da się odblokować bez podania hasła.

    Zwłoka ta istnieje po to, żeby ktoś, kto zobaczył wygaszacz kątem oka
    i natychmiast ruszył myszą, nie musiał wpisywać hasła. Jest to wygoda
    sensowna, dopóki mierzy się ją w sekundach.

    Kłopot polega na tym, że zwłokę można ustawić dowolnie długą, a przez
    cały ten czas maszyna wygląda na zablokowaną i nie jest. Ekran jest
    ciemny, a naciśnięcie klawisza otwiera sesję bez pytania. Jest to
    dokładnie ten rodzaj rozbieżności między wyglądem a stanem, który
    prowadzi do zostawiania maszyny bez opieki.

    Punkt nie wymaga wartości zerowej, tylko krótkiej. Domyślne pięć
    sekund jest wartością rozsądną i audyt przyjmuje każdą nie większą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno,
    w którym maszyna wygląda na zablokowaną, a otwiera się naciśnięciem
    klawisza — tym dłuższe, im dłuższą zwłokę ustawiono.
  en: |
    The setting limits the time for which, after the screen saver starts, the machine can be unlocked without
    a password being given.

    That delay exists so that somebody who glimpsed the screen saver and at once moved the mouse should not
    have to type a password. It is a sensible convenience so long as it is measured in seconds.

    The trouble is that the delay can be set as long as one likes, and for all that time the machine looks
    locked and is not. The screen is dark, and the pressing of a key opens the session without an asking. It
    is exactly that kind of divergence between look and state which leads to machines being left unattended.

    The item does not call for a value of nil, only for a short one. The default of five seconds is a
    reasonable value and the audit accepts any no greater.

    What an attacker gains while the item goes unmet: a window in which the machine looks locked and opens at
    the pressing of a key - the longer, the longer the delay that was set.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na większości maszyn skutek jest
    żaden.

    Rzecz do ustalenia: czy zwłoka została na tej maszynie wydłużona
    celowo. Zdarza się to tam, gdzie obsługa pracuje przy kilku maszynach
    naraz i odchodzi od jednej na chwilę. Wydłużona zwłoka bywa wtedy
    świadomym ustępstwem, a nie przeoczeniem.

    Jeżeli tak jest, skrócenie zwłoki oznacza wpisywanie hasła częściej.
    Nie jest to awaria, tylko zmiana sposobu pracy — i tak należy o niej
    mówić, bo opis mówiący „przestanie działać" zostanie odrzucony.

    Rzecz druga dotyczy odczytu. Brak wartości w rejestrze nie znaczy, że
    zwłoki nie ma — znaczy, że obowiązuje domyślne pięć sekund. Audyt
    zgłasza wartość obowiązującą, a nie zapisaną, bo raport opisuje
    maszynę, a nie rejestr.

    Zmiana zaczyna obowiązywać po ponownym zalogowaniu.

    Czego to nie psuje: wygaszacza ekranu, czasu do jego uruchomienia,
    blokowania ręcznego, usług, aplikacji, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", though on most machines the consequence is none.

    The thing to be established: has the delay on this machine been lengthened on purpose. That happens where
    the attendance work at several machines at once and step away from one for a moment. A lengthened delay is
    then at times a knowing concession and not an oversight.

    If it is so, shortening the delay means a password being typed oftener. It is no fault but a change in a
    way of working - and so it ought to be spoken of, a description saying "will cease to work" being bound to
    be dismissed.

    The second matter concerns the reading. An absent value in the registry does not mean there is no delay -
    it means the default of five seconds holds. The audit reports the value in force and not the one written,
    the report describing the machine and not the registry.

    The change begins to hold after a fresh logon.

    What this does not break: the screen saver, the time before it starts, locking by hand, services,
    applications, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Osoba odchodząca od maszyny na chwilę będzie wpisywać hasło częściej niż dotąd
      - Tam, gdzie zwłokę wydłużono świadomie, skrócenie jej zmienia przyjęty sposób pracy
      - Zmiana zaczyna obowiązywać po ponownym zalogowaniu, a nie natychmiast
      - Wygaszacz ekranu, czas do jego uruchomienia i blokowanie ręczne pozostają bez zmian
      - Usługi, aplikacje i sieć pozostają bez zmian
    en:
      - A person stepping away from the machine for a moment will type a password oftener than before
      - Where the delay was lengthened knowingly, shortening it changes an accepted way of working
      - The change begins to hold after a fresh logon rather than at once
      - The screen saver, the time before it starts and locking by hand stay unchanged
      - Services, applications and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zwłoka została na tej maszynie wydłużona świadomie, bo obsługa pracuje przy kilku maszynach naraz
      - Nie ustalono, czy obecna wartość jest ustawieniem celowym, czy pozostałością po czymś innym
    en:
      - The delay was lengthened on this machine knowingly, the attendance working at several machines at once
      - It has not been established whether the present value is a deliberate setting or a leftover of something else
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'ScreenSaverGracePeriod'
      $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
      # Absence means the system default of five seconds. The report describes
      # the machine, so the effective value is what gets reported.
      if ($null -eq $current) { '5' }
      elseif ([string]$current -match '^\d+$') { [string]$current }
      else { 'CHECK_ERROR' }
    } catch {
      'CHECK_ERROR'
    }
  expected: '5'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'ScreenSaverGracePeriod'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is text despite looking like a number.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    Set-ItemProperty -Path $path -Name 'ScreenSaverGracePeriod' -Value '5' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-machine-inactivity-limit

notes:
  pl: |
    Punkt jest trzeci w bloku i dotyczy tej samej rozbieżności co dwa
    poprzednie: maszyna wygląda na zamkniętą, a jest otwarta. Różnica
    polega na tym, że tu okno jest krótkie i mierzalne.

    Rzecz warta wyróżnienia w interfejsie dotyczy odczytu. Audyt zwraca
    wartość obowiązującą, także wtedy, gdy w rejestrze nic nie ma. Jest to
    jedna z niewielu reguł w zestawie, przy których brak wpisu jest stanem
    zgodnym, a nie brakiem — i warto, żeby raport nie pokazywał wtedy
    „brak wartości", bo czytelnik weźmie to za lukę.

    Drugą rzeczą wartą pokazania jest porównanie. Punkt nie sprawdza
    równości, tylko czy wartość nie jest większa. Zwłoka krótsza od
    domyślnej jest w porządku i nie wymaga żadnego działania.

    Kategoria średnia jest postawiona zgodnie z kryterium: napastnik musi
    być przy maszynie i musi trafić w okno. Przy zwłoce ustawionej na
    kilkanaście minut warunek drugi przestaje jednak cokolwiek znaczyć,
    i to jest właściwy powód istnienia tej reguły.
  en: |
    The item is the third in the block and concerns the same divergence as the two before: the machine looks
    closed and is open. The difference is that here the window is short and measurable.

    A thing worth setting apart in the interface concerns the reading. The audit returns the value in force,
    also where there is nothing in the registry. It is one of the few rules in the set at which an absent
    entry is a compliant state and not a want - and it is well that the report not then show "no value", a
    reader being bound to take that for a gap.

    The second thing worth showing is the comparison. The item checks not for equality but for the value not
    being greater. A delay shorter than the default is well and calls for no act at all.

    The medium category is set in keeping with the criterion: the attacker must be at the machine and must
    hit the window. At a delay set to a quarter of an hour the second condition ceases, though, to mean
    anything, and that is the proper reason for this rule's existence.
