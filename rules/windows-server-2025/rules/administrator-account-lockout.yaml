id: win2025-administrator-account-lockout

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Account Lockout Policy
  title:
    pl: Wbudowane konto administratora objęte blokadą
    en: The built-in administrator account taken in by the lockout
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozciąga zasadę blokady konta na konto wbudowanego
    administratora, które domyślnie jest z niej wyłączone.

    Wyłączenie tego jednego konta z blokady ma powód historyczny: chodziło
    o to, żeby nie dało się zamknąć administratorowi drogi na własną
    maszynę. Skutek uboczny jest jednak taki, że konto o największych
    uprawnieniach w systemie jest jednocześnie jedynym, którego hasła wolno
    zgadywać bez końca.

    Na serwerze waży to podwójnie. Konto wbudowanego administratora ma
    zawsze ten sam identyfikator, niezależnie od nazwy, więc odszukanie go
    nie wymaga zgadywania. Serwer zwykle słucha na sieci przez całą dobę.
    Zestawienie tych dwóch rzeczy daje cel znany z góry, dostępny stale
    i nieograniczony liczbą prób.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: jedno konto,
    przy którym blokada nie obowiązuje — i akurat to o najszerszych
    uprawnieniach. Cała zasada blokady ma wtedy dziurę dokładnie w miejscu,
    w którym najbardziej przeszkadza.
  en: |
    The setting stretches the account lockout policy over the built-in administrator's
    account, which is by default left out of it.

    Leaving that one account out of the lockout has a historical reason: the point was that
    an administrator's road to their own machine could not be closed. The side effect,
    though, is that the account with the greatest rights in the system is at the same time
    the one whose password may be guessed without end.

    On a server that weighs doubly. The built-in administrator's account always has the same
    identifier whatever its name, so finding it takes no guessing. A server usually listens
    on the network round the clock. Those two things together give a target known in
    advance, reachable at all times and unbounded by a number of tries.

    What an attacker gains while the item goes unmet: one account at which the lockout does
    not bind - and that one with the widest rights. The whole lockout policy then has a hole
    exactly where it gets in the way most.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że zmiana odbiera drogę awaryjną. Konto
    wbudowanego administratora przestaje być kontem, którego nie da się
    zamknąć.

    Skutek najgroźniejszy jest taki: kto zna identyfikator tego konta —
    a zna go każdy — może je zablokować, wysyłając błędne hasła. Na serwerze
    dostępnym z sieci jest to sposób na odcięcie administratora od maszyny
    bez włamywania się do niej. Blokada ustąpi po czasie zapisanym w zasadzie,
    ale przez ten czas droga jest zamknięta i można ją zamykać w kółko.

    Dlatego przed wdrożeniem trzeba mieć drugą drogę wejścia: osobne konto
    administracyjne, dostęp przez konsolę sprzętową albo zarządzanie spoza
    systemu. Na serwerze bez takiej drogi ten punkt zmienia ryzyko
    zgadywania hasła w ryzyko utraty dostępu i nie jest to zamiana korzystna.

    Konto wbudowanego administratora bywa też na serwerach używane przez
    procedury awaryjne i zadania automatyczne. Każde z nich, jeśli pomyli
    hasło cyklicznie, zablokuje teraz konto, czego wcześniej nie robiło.

    Zmiana nie wymaga restartu.
  en: |
    A knowing rollout is needed because the change takes away an emergency road. The
    built-in administrator's account stops being an account that cannot be closed.

    The most dangerous effect is this: whoever knows that account's identifier - and
    everyone does - can lock it by sending wrong passwords. On a server reachable from the
    network that is a way of cutting an administrator off from the machine without breaking
    into it. The lockout will give way after the time recorded in the policy, but for that
    time the road is closed and it can be closed again and again.

    Hence before the rollout one has to have a second road in: a separate administrative
    account, access through a hardware console, or management from outside the system. On a
    server without such a road this item turns the risk of a password being guessed into the
    risk of losing access, and that is no favourable exchange.

    The built-in administrator's account is besides sometimes used on servers by emergency
    procedures and automatic tasks. Each of them, if it gets the password wrong over and
    over, will now lock the account, which it did not do before.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - remote-desktop
  what_breaks:
    pl:
      - Konto wbudowanego administratora daje się zablokować z sieci błędnymi hasłami
      - Zadania automatyczne pracujące na tym koncie mogą je zablokować po zmianie hasła
      - Droga awaryjna na maszynę przestaje być drogą, której nie da się zamknąć
      - Blokada ustępuje po czasie z zasady, ale można ją wywoływać w kółko
    en:
      - The built-in administrator's account can be locked from the network with wrong passwords
      - Automatic tasks working on that account may lock it after a password change
      - The emergency road to the machine stops being a road that cannot be closed
      - The lockout gives way after the time from the policy, but can be brought on again and again
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wbudowane konto administratora jest jedyną drogą wejścia na serwer
      - Nie ma dostępu do konsoli sprzętowej ani zarządzania spoza systemu
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - The built-in administrator's account is the only road onto the server
      - There is no access to a hardware console nor management from outside the system
      - The server is a domain controller and a change of the domain's policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^AllowAdministratorLockout\s*=\s*(\d+)') { $Matches[1] }
        else {
          # No line means the setting was never written. The built-in account is
          # then outside the lockout policy, which is the state this item forbids.
          'MISSING'
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^AllowAdministratorLockout\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'AllowAdministratorLockout'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'AllowAdministratorLockout = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    # Where the setting was absent before the change, the state to return to is
    # the account being outside the lockout - written here as zero, since the
    # line cannot be unwritten through secedit.
    $previous = '0'
    if ($b.existed) { $previous = [string]$b.value }
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('AllowAdministratorLockout = ' + $previous),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/account-lockout-policy

notes:
  pl: |
    Brak wiersza w eksporcie zasady jest tu wynikiem znaczącym, nie brakiem
    danych: konto wbudowanego administratora jest wtedy poza blokadą, czyli
    w stanie, któremu ten punkt się sprzeciwia. Dlatego audyt zwraca
    „MISSING" zamiast błędu sprawdzenia.

    Wycofanie zapisuje zero tam, gdzie ustawienia wcześniej nie było.
    Wiersza raz zapisanego nie da się przez secedit usunąć, a zero opisuje
    ten sam stan faktyczny — konto poza blokadą. Jest to jedyne miejsce
    w tej paczce, w którym wycofanie nie odtwarza zapisu dosłownie, tylko
    jego skutek.

    Punkt ma sens wyłącznie wtedy, gdy zasada blokady w ogóle obowiązuje.
    Przy progu zerowym nie zmienia niczego.
  en: |
    A missing line in the policy export is a telling result here rather than absent data:
    the built-in administrator's account is then outside the lockout, that is in the state
    this item stands against. Hence the audit returns "MISSING" rather than a check error.

    The rollback writes zero where the setting was not there before. A line once written
    cannot be removed through secedit, and zero describes the same state of fact - the
    account outside the lockout. It is the one place in this pack at which the rollback
    reproduces not the record itself but its effect.

    The item makes sense only where the lockout policy binds at all. With a zero threshold
    it changes nothing.
