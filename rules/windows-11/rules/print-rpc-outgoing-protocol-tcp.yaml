id: win11-print-rpc-outgoing-protocol-tcp

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Połączenia wychodzące podsystemu druku wyłącznie przez gniazda sieciowe
    en: Outgoing connections of the printing subsystem over network sockets only
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, jakim sposobem podsystem druku nawiązuje połączenia
    wychodzące do serwerów druku: przez gniazda sieciowe czy przez nazwane
    potoki.

    Różnica brzmi technicznie, a niesie skutek bezpieczeństwa i warto go
    rozpisać. Nazwany potok to kanał zestawiany na wierzchu udostępniania
    plików. Połączenie takie idzie po tej samej drodze co udziały sieciowe
    i korzysta z uwierzytelnienia zestawianego przy nawiązaniu sesji
    z serwerem plików.

    Oznacza to dwie rzeczy naraz. Po pierwsze, sesja z serwerem plików bywa
    zestawiona wcześniej i ponownie użyta — połączenie drukarskie jedzie
    wtedy na uwierzytelnieniu, o którym nikt przy drukowaniu nie decydował.
    Po drugie, całość dziedziczy słabości starszego protokołu udostępniania
    plików, w tym podatność na wymuszenie uwierzytelnienia wobec wskazanego
    serwera.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    skierowania połączenia drukarskiego na własny serwer i odebrania
    uwierzytelnienia maszyny albo użytkownika, bez dotykania samego
    podsystemu druku. Jest to droga używana w praktyce i szczególnie
    skuteczna, bo drukowanie jest czynnością, którą inicjuje użytkownik,
    a więc nie wygląda na zdarzenie warte uwagi.

    Wymuszenie gniazd sieciowych odcina połączenie od mechanizmu
    udostępniania plików. Uwierzytelnienie jest wtedy zestawiane osobno,
    na potrzeby tego jednego połączenia.
  en: |
    The setting settles by what means the printing subsystem makes outgoing connections to
    print servers: over network sockets or over named pipes.

    The difference sounds technical and carries an effect on security worth setting out. A
    named pipe is a channel raised on top of file sharing. Such a connection goes by the
    same road as network shares and uses the authentication raised when a session with the
    file server is opened.

    That means two things at once. First, the session with the file server is sometimes
    opened earlier and used again - the printing connection then rides on an
    authentication nobody decided on while printing. Second, the whole inherits the
    weaknesses of the older file sharing protocol, among them a liability to having
    authentication forced against a named server.

    What an attacker gains while the item goes unmet: the means of directing a printing
    connection to their own server and taking the machine's or the user's authentication,
    without touching the printing subsystem itself. It is a route used in practice and
    particularly effective, since printing is an act the user begins, and so does not look
    like an event worth attention.

    Forcing network sockets cuts the connection off from the file sharing mechanism.
    Authentication is then raised apart, for the needs of that one connection.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy serwery druku w sieci przyjmują połączenia tym
    sposobem — bo starsze przyjmują wyłącznie nazwane potoki.

    Serwery druku wydane w ostatnich latach obsługują oba sposoby i zmiana
    ich nie dotyczy. Problem dotyczy urządzeń i serwerów starszych: serwerów
    wydruku na systemach sprzed kilku wersji, wbudowanych serwerów
    w urządzeniach wielofunkcyjnych oraz rozwiązań kolejkowania wydruku
    innych producentów.

    Objaw jest jednoznaczny i natychmiastowy: drukarka sieciowa przestaje
    przyjmować zadania, a dodanie jej na nowo kończy się błędem połączenia.
    Użytkownik zgłosi to jako niedziałającą drukarkę, bez związku ze zmianą
    ustawienia.

    Warto to sprawdzić na jednym stanowisku przed wdrożeniem szerszym, bo
    drukowanie jest czynnością, której brak zgłasza się natychmiast i głośno.

    Zmiana wymaga zatrzymania i uruchomienia usługi bufora wydruku albo
    restartu maszyny, żeby zaczęła obowiązywać dla nowych połączeń.
  en: |
    What needs checking is whether the print servers on the network take connections by
    this means - since older ones take named pipes alone.

    Print servers issued in recent years support both means and the change does not
    concern them. The trouble concerns older devices and servers: print servers on systems
    several versions old, servers built into multifunction devices, and other makers'
    print queueing solutions.

    The symptom is plain and immediate: a network printer stops taking work, and adding it
    afresh ends in a connection error. The user will report it as a printer that does not
    work, with no bearing on a changed setting.

    It is worth checking at one station before a wider rollout, since printing is an act
    whose absence is reported at once and loudly.

    The change takes stopping and starting the print spooler service, or a restart of the
    machine, before it binds for new connections.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Drukarka obsługiwana przez starszy serwer druku przestaje przyjmować zadania
      - Dodanie drukarki sieciowej na nowo kończy się błędem połączenia
      - Wbudowane serwery w urządzeniach wielofunkcyjnych mogą przestać odpowiadać
      - Serwery druku wydane w ostatnich latach działają bez zmiany
    en:
      - A printer served by an older print server stops taking work
      - Adding a network printer afresh ends in a connection error
      - Servers built into multifunction devices may stop responding
      - Print servers issued in recent years work unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - W sieci pracują serwery druku przyjmujące wyłącznie nazwane potoki
      - Drukowanie odbywa się przez wbudowany serwer w urządzeniu wielofunkcyjnym sprzed lat
    en:
      - Print servers taking named pipes alone work on the network
      - Printing goes through a server built into a multifunction device from years ago
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means connections over network sockets; one means named pipes.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcUseNamedPipeProtocol'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $current = (Get-ItemProperty -Path $path -Name 'RpcUseNamedPipeProtocol' -ErrorAction SilentlyContinue).'RpcUseNamedPipeProtocol'
    [pscustomobject]@{
      path        = $path
      name        = 'RpcUseNamedPipeProtocol'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcUseNamedPipeProtocol' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/printdocs/printer-connections

notes:
  pl: |
    Reguła należy do czwórki opisującej, jak podsystem druku rozmawia przez
    sieć: dwie dotyczą połączeń wychodzących, dwie przychodzących, a w każdej
    parze jedna mówi o sposobie połączenia, druga o uwierzytelnieniu. Wyniki
    tej czwórki warto czytać razem, bo opisują jeden mechanizm z czterech
    stron.

    Ustawienie dotyczy wyłącznie podsystemu druku. Pozostały ruch maszyny
    korzystający z nazwanych potoków działa bez zmiany.

    Brak wartości nie jest stanem zgodnym. Bez ustawienia sposób połączenia
    jest wybierany przez system, a wybór ten bywa zależny od tego, co
    odpowie druga strona.
  en: |
    The rule belongs to a quartet describing how the printing subsystem speaks over the
    network: two concern outgoing connections, two incoming, and in each pair one speaks
    of the means of connecting and the other of authentication. The results of that
    quartet are worth reading together, since they describe one mechanism from four sides.

    The setting concerns the printing subsystem alone. The machine's remaining traffic
    using named pipes works unchanged.

    A missing value is not a compliant state. With no setting the means of connecting is
    chosen by the system, and that choice sometimes depends on what the other side
    answers.
