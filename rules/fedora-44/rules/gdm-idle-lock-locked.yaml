id: fedora44-gdm-idle-lock-locked

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.8.5
  section: Initial Setup > Configure GNOME Display Manager
  title:
    pl: Użytkownik nie może wyłączyć blokady ekranu po bezczynności
    en: Ensure GDM screen locks cannot be overridden
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Czasy blokady ekranu z punktu 1.8.4 są tylko ustawieniami domyślnymi.
    Każdy użytkownik może je zmienić w Ustawieniach, np. wyłączyć wygaszanie
    ekranu albo blokadę, i wtedy zostawione stanowisko pozostaje otwarte.
    dconf pozwala zablokować wybrane klucze tak, że obowiązuje wartość
    systemowa.

    Punkt wymaga zablokowania czasu bezczynności (idle-delay) i opóźnienia
    blokady (lock-delay). Blokuję też włączenie blokady (lock-enabled), bo
    bez tego użytkownik mógłby ją po prostu wyłączyć. Domyślnie żaden z tych
    kluczy nie jest zablokowany.
  en: |
    The screen lock times from item 1.8.4 are only default settings. Every
    user can change them in Settings, for example turn off screen blanking or
    locking, and then an unattended workstation stays open. dconf can lock
    chosen keys so that the system value applies.

    The item requires locking the idle time (idle-delay) and the lock delay
    (lock-delay). I also lock the lock switch (lock-enabled), because
    otherwise a user could simply turn locking off. By default none of these
    keys is locked.

disruption_description:
  pl: |
    Użytkownicy zauważą, że w Ustawieniach, w części o zasilaniu
    i prywatności, opcje wygaszania i automatycznej blokady ekranu są
    nieaktywne. Kto wcześniej ustawił własne czasy albo wyłączył blokadę,
    wraca do ustawień systemowych. Zmiana działa od następnego zalogowania.
  en: |
    Users will notice that the screen blanking and automatic screen lock
    options in the power and privacy parts of Settings are inactive. Anyone
    who set their own times or turned locking off before goes back to the
    system settings. The change takes effect from the next sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Użytkownicy nie mogą zmienić czasu wygaszania ekranu ani wyłączyć automatycznej blokady
      - Własne, dłuższe czasy wygaszania ustawione przez użytkowników przestają działać
    en:
      - Users cannot change the screen blanking time or turn off automatic locking
      - Longer blanking times set by users themselves stop working
  interruption: logoff
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v gsettings >/dev/null 2>&1; then echo GDM_ABSENT; exit 0; fi
    d=$(mktemp -d) || { echo CHECK_ERROR; exit 0; }
    trap 'rm -rf "$d"' EXIT
    g() { env -i PATH=/usr/bin:/bin HOME="$d" XDG_CONFIG_HOME="$d" XDG_RUNTIME_DIR="$d" DCONF_PROFILE=user GSETTINGS_BACKEND=dconf gsettings "$@" 2>/dev/null; }
    if ! g list-schemas | grep -qx org.gnome.login-screen; then echo GDM_ABSENT; exit 0; fi
    state() {
      n=""
      for sk in "org.gnome.desktop.session idle-delay" "org.gnome.desktop.screensaver lock-delay" "org.gnome.desktop.screensaver lock-enabled"; do
        w=$(g writable $sk) || { echo CHECK_ERROR; return; }
        if [ "$w" != false ]; then n="$n,${sk#* }"; fi
      done
      if [ -z "$n" ]; then echo LOCKED; else echo "NOT_LOCKED:${n#,}"; fi
    }
    state
  expected: '^(LOCKED|GDM_ABSENT)$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/locks/sentin-harden-idle-lock
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=dconf-1
        m=""
        p=$(dirname "$f")
        while [ "$p" != /etc/dconf/db ]; do
          if [ ! -d "$p" ]; then m="$m $p"; fi
          p=$(dirname "$p")
        done
        echo "missing=${m# }"
        if [ -e /etc/dconf/db/local ]; then echo db=1; else echo db=0; fi
        if [ -f "$f" ]; then echo file=1; else echo file=0; fi
        echo ---
        if [ -f "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/locks/sentin-harden-idle-lock
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      d=$(mktemp -d) || exit 1
      trap 'rm -rf "$d"' EXIT
      g() { env -i PATH=/usr/bin:/bin HOME="$d" XDG_CONFIG_HOME="$d" XDG_RUNTIME_DIR="$d" DCONF_PROFILE=user GSETTINGS_BACKEND=dconf gsettings "$@" 2>/dev/null; }
      if ! command -v gsettings >/dev/null 2>&1 || ! g list-schemas | grep -qx org.gnome.login-screen; then
        echo "GDM is not installed, nothing to change"; exit 0
      fi
      if [ ! -d "$D" ] && [ -e /etc/dconf/db/local ]; then
        echo "/etc/dconf/db/local is not built from keyfiles in $D, not changing it" >&2; exit 1
      fi
      state() {
        n=""
        for sk in "org.gnome.desktop.session idle-delay" "org.gnome.desktop.screensaver lock-delay" "org.gnome.desktop.screensaver lock-enabled"; do
          w=$(g writable $sk) || { echo CHECK_ERROR; return; }
          if [ "$w" != false ]; then n="$n,${sk#* }"; fi
        done
        if [ -z "$n" ]; then echo LOCKED; else echo "NOT_LOCKED:${n#,}"; fi
      }
      body() {
        printf '%s\n' '/org/gnome/desktop/session/idle-delay' '/org/gnome/desktop/screensaver/lock-delay' '/org/gnome/desktop/screensaver/lock-enabled'
      }
      mkdir -p "$(dirname "$f")"
      tmp=$(mktemp "$f.XXXXXX")
      { echo '# Sentin-Harden: fedora44-gdm-idle-lock-locked'; body; } > "$tmp"
      chmod 0644 "$tmp"
      mv -f "$tmp" "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      dconf update
      s=$(state)
      if ! printf '%s\n' "$s" | grep -Eq '^(LOCKED)$'; then
        echo "The setting is still not in effect ($s): another dconf database or file overrides it" >&2; exit 1
      fi
      echo "Wrote $f and updated the dconf databases ($s)"
    )

  rollback_command: |
    (
      set -e
      f=/etc/dconf/db/local.d/locks/sentin-harden-idle-lock
      D=/etc/dconf/db/local.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=dconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      m=$(sed -n '2s/^missing=//p' "$b")
      db=$(sed -n '3s/^db=//p' "$b")
      fl=$(sed -n '4s/^file=//p' "$b")
      case "$db$fl" in [01][01]) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ "$fl" = 1 ]; then
        tmp=$(mktemp "$f.XXXXXX")
        sed '1,/^---$/d' "$b" > "$tmp"
        chmod 0644 "$tmp"
        mv -f "$tmp" "$f"
        if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      else
        rm -f "$f"
      fi
      for p in $m; do rmdir "$p" 2>/dev/null || true; done
      if command -v dconf >/dev/null 2>&1; then dconf update; fi
      if [ "$db" = 0 ] && [ ! -d "$D" ]; then rm -f /etc/dconf/db/local; fi
      echo "Restored the previous state of $f and updated the dconf databases"
    )

privileges: root
runnable: true

sources:
  - https://help.gnome.org/admin/system-admin-guide/stable/dconf-lockdown.html.en
  - https://help.gnome.org/admin/system-admin-guide/stable/desktop-lockscreen.html.en

notes:
  pl: |
    Blokada obejmuje klucze idle-delay, lock-delay, lock-enabled. Zablokowany klucz ma wartość z baz
    systemowych albo, jeśli żadna jej nie ustawia, wartość domyślną ze
    schematu. Własne ustawienia użytkowników przestają działać i wracają,
    gdy blokada zostanie zdjęta.

    Sprawdzenie pyta gsettings writable, czy użytkownik profilu user może
    zmienić klucz; wynik NOT_LOCKED wymienia klucze bez blokady. Czyta
    skompilowane bazy w /etc/dconf/db, więc plik blokady bez dconf update nie
    spełnia punktu. Jeśli GDM nie jest zainstalowany, wynik GDM_ABSENT
    oznacza, że punkt nie dotyczy systemu.

    Naprawa zapisuje własny plik /etc/dconf/db/local.d/locks/sentin-harden-idle-lock i uruchamia dconf update, które
    przebudowuje wszystkie bazy z plików w katalogach .d. Potem sprawdza
    blokady ponownie i kończy się błędem, jeśli któryś klucz nadal można
    zmienić. Wycofanie przywraca poprzedni stan pliku i ponownie uruchamia
    dconf update.
  en: |
    The lock covers the idle-delay, lock-delay, lock-enabled keys. A locked key takes its value from the
    system databases or, if none sets it, the default from the schema. Users'
    own settings stop working and come back when the lock is removed.

    The check asks gsettings writable whether a user of the user profile can
    change the key; the NOT_LOCKED result lists the keys without a lock. It
    reads the compiled databases in /etc/dconf/db, so a lock file without
    dconf update does not meet the item. If GDM is not installed, the
    GDM_ABSENT result means the item does not apply to the system.

    The remediation writes its own /etc/dconf/db/local.d/locks/sentin-harden-idle-lock file and runs dconf update, which
    rebuilds all databases from the files in the .d directories. It then
    checks the locks again and fails if any key can still be changed. Rollback
    restores the previous state of the file and runs dconf update again.
