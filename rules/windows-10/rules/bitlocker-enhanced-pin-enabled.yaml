id: win10-bitlocker-enhanced-pin-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Kod startowy może zawierać znaki inne niż cyfry
    en: The startup code may hold characters other than digits
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala, żeby kod wpisywany przy starcie zaszyfrowanej
    maszyny zawierał litery i znaki, a nie same cyfry.

    Punkt jest odpowiedzią na problem, który wprowadza wymaganie długiego
    kodu. Siedem cyfr to ciąg bez znaczenia, trudny do zapamiętania i łatwy
    do zapisania na kartce. Siedem znaków złożonych ze słów jest łatwiejsze
    do zapamiętania, a przestrzeń możliwości ma wielokrotnie większą.

    Zysk jest więc podwójny i idzie w tę samą stronę. Kod mocniejszy
    i zarazem lepiej pamiętany oznacza mniej kartek na obudowach i mniej
    wezwań obsługi po zapomnianym kodzie.

    Odnotowuję, że ustawienie niczego nie wymusza. Poszerza zbiór
    dopuszczalnych znaków; kod złożony z samych cyfr pozostaje po zmianie
    poprawny. Jest to reguła, która daje możliwość, a nie odbiera.

    Odnotowuję też ograniczenie sprzętowe: nie każde oprogramowanie
    układowe obsługuje pełną klawiaturę przed uruchomieniem systemu.
    Tam, gdzie nie obsługuje, litery po prostu nie zostaną przyjęte.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przestrzeń
    kodów ograniczoną do cyfr oraz kody zapisane, bo niemożliwe do
    zapamiętania.
  en: |
    The setting lets the code typed at the start of an enciphered machine hold letters and marks, and not digits
    alone.

    The item is an answer to the trouble a call for a long code brings in. Seven digits are a string without
    meaning, hard to call to mind and easy to write upon a slip. Seven marks built of words are easier to call to
    mind, and have a field of possibilities many times larger.

    The gain is therefore a double one and goes the same way. A code both stronger and better remembered means
    fewer slips upon cases and fewer callings of the support after a forgotten code.

    I set down that the setting forces nothing. It widens the set of admissible marks; a code of digits alone
    stays right after the change. It is a rule that gives a chance and takes none away.

    I set down likewise a bound of the gear: not every firmware handles a full keyboard before the system starts.
    Where it does not, letters will simply not be taken.

    What an attacker gains while the item goes unmet: a field of codes bounded to digits, and codes written down
    because they cannot be called to mind.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest
    oprogramowanie układowe maszyn.

    Klawiatura przed uruchomieniem systemu obsługiwana jest przez
    oprogramowanie układowe, nie przez system, i nie wszędzie obejmuje
    pełny zestaw znaków. Na maszynie, która obsługuje wyłącznie klawiaturę
    numeryczną, kod z literami nie da się wpisać — a kod, którego nie da
    się wpisać, zamienia się w wezwanie obsługi z kluczem odzyskiwania.

    Sprawdzenie polega na ustawieniu kodu ze znakiem innym niż cyfra na
    jednej maszynie z danego modelu i zrestartowaniu jej. Jest to
    sprawdzenie tanie i wykonuje się je raz na model, nie na maszynę.

    Odnotowuję rozkład klawiatury. Oprogramowanie układowe zwykle używa
    rozkładu amerykańskiego, więc znaki na klawiszach mogą nie odpowiadać
    opisom. Kod złożony wyłącznie z liter podstawowych i cyfr omija ten
    problem w całości.

    Zmiana nie dotyka kodów już ustawionych. Te działają dalej
    i pozostają poprawne.

    Czego to nie psuje: startu maszyny z dotychczasowym kodem, logowania,
    dostępu do plików, wydajności, drukowania.
  en: |
    The class is "needs review", and the object of the review is the machines' firmware.

    The keyboard before the system starts is handled by the firmware and not by the system, and does not
    everywhere take in the full set of marks. Upon a machine that handles a number keypad alone a code with
    letters cannot be typed - and a code that cannot be typed turns into a calling of the support with a key of
    recovery.

    The review is done by setting a code with a mark other than a digit upon one machine of a given model and
    restarting it. It is a cheap review and is done once per model, not per machine.

    I set down the laying out of the keyboard. Firmware commonly uses the American layout, so the marks upon the
    keys may not answer to what is printed there. A code built of plain letters and digits alone goes round that
    trouble wholly.

    The change does not touch codes already set. Those work on and stay right.

    What this does not break: the machine's start with the code it had, logging on, the way to files, speed, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na maszynie, której oprogramowanie układowe obsługuje tylko klawiaturę numeryczną, kodu z literami nie da się wpisać
      - Kod niemożliwy do wpisania zamienia się w wezwanie obsługi z kluczem odzyskiwania
      - Rozkład klawiatury przed startem bywa amerykański, więc znaki mogą nie odpowiadać opisom na klawiszach
      - Kody już ustawione działają dalej, bo zmiana poszerza zbiór znaków i niczego nie wymusza
      - Start maszyny z dotychczasowym kodem, logowanie, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - Upon a machine whose firmware handles a number keypad alone a code with letters cannot be typed
      - A code that cannot be typed turns into a calling of the support with a key of recovery
      - The keyboard s layout before the start is at times the American one, so marks may not answer to what is printed on the keys
      - Codes already set work on, the change widening the set of marks and forcing nothing
      - The machine s start with the code it had, logging on, the way to files and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe maszyn obsługuje przed startem wyłącznie klawiaturę numeryczną
    en:
      - The machines firmware handles a number keypad alone before the start
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'UseEnhancedPin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'UseEnhancedPin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting widens what a code may hold; it does not force anybody to use the
    # wider set. A code of digits alone stays admissible afterwards.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseEnhancedPin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła ma sens wyłącznie razem z punktami o dodatkowym uwierzytelnieniu
    i o minimalnej długości kodu. Warto, żeby aplikacja pokazała całą
    trójkę razem, bo osobno każda z nich wygląda na mniej sensowną, niż
    jest.

    Argument wart postawienia wprost dotyczy tego, że jest to reguła
    naprawiająca skutek innej reguły. Wymaganie siedmiu cyfr prowadzi
    wprost do kartki na obudowie; ta sama długość w znakach mieszanych
    mieści się w jednym zapamiętanym słowie. Ten sam wymóg formalny daje
    zupełnie inny wynik w praktyce.

    Odnotowuję, że reguła nic nie wymusza, bo bywa to źle odczytywane.
    Poszerza zbiór dopuszczalnych znaków i na tym kończy swoje działanie.
    Użytkownik, który chce zostawić kod cyfrowy, zostawia go bez żadnej
    przeszkody.
  en: |
    The rule makes sense only together with the items about additional authentication and about the least length
    of a code. It is well that the application show all three together, apart each of them looking less sensible
    than it is.

    The argument worth putting outright touches this, that it is a rule mending the consequence of another rule. A
    call for seven digits leads straight to the slip upon the case; that same length in mixed marks fits into one
    remembered word. The same formal requirement gives an altogether different outcome in practice.

    I set down that the rule forces nothing, that being at times read amiss. It widens the set of admissible marks
    and there its working ends. A user who would keep a code of digits keeps it with no hindrance at all.
