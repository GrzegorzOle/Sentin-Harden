id: win10-password-reveal-button-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Przycisk pokazujący wpisywane hasło ukryty
    en: The button revealing a typed password hidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Przycisk odsłaniający wpisywane hasło powstał po to, żeby pomóc trafić w
    znaki na klawiaturze dotykowej. Skutkiem ubocznym jest wyświetlenie hasła na
    ekranie w postaci czytelnej.

    Zagrożeniem nie jest tu żaden mechanizm, tylko otoczenie: sąsiad przy biurku,
    kamera w sali, okno na wprost korytarza, udostępniony ekran w trakcie rozmowy
    zdalnej. Hasło wpisywane w gwiazdkach jest odporne na wszystkie te sytuacje,
    hasło odsłonięte nie jest na żadną.

    Ukrycie przycisku zamyka tę drogę bez odbierania czegokolwiek poza wygodą
    wpisywania.
  en: |
    The button uncovering a typed password came about to help hit the right keys
    on a touch keyboard. The side effect is the password showing on screen in
    readable form.

    The threat here is not a mechanism but the surroundings - a neighbour at the
    next desk, a camera in the room, a window facing the corridor, a screen shared
    during a remote call. A password typed as asterisks withstands all of those
    situations; an uncovered one withstands none.

    Hiding the button shuts that road without taking anything away beyond the
    convenience of typing.

disruption_description:
  pl: |
    Zmiana jest widoczna, ale niczego nie blokuje: hasło wpisuje się jak
    wcześniej, tylko nie da się go podejrzeć. Nie wymaga przerwy i cofa się
    natychmiast.

    Jedyną grupą, która to odczuje, są osoby pracujące na klawiaturze dotykowej i
    osoby z trudnościami we wpisywaniu z pamięci. Dla nich sensownym zamiennikiem
    jest menedżer haseł albo logowanie bez hasła, a nie pozostawienie przycisku.
  en: |
    The change is visible but blocks nothing - a password is typed as before, it
    simply cannot be peeked at. It calls for no interruption and reverses at once.

    The one group that feels it is people working on a touch keyboard and people
    who find typing from memory hard. For them the sensible replacement is a
    password manager or passwordless sign-in, rather than leaving the button
    there.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Podejrzenie wpisywanego hasła przestanie być możliwe w oknach systemowych proszących o poświadczenia
      - Osoby pracujące na klawiaturze dotykowej będą częściej mylić znaki przy wpisywaniu długich haseł
      - Zgłoszenia o niemożności zalogowania mogą wzrosnąć tam, gdzie hasła są długie i wpisywane rzadko
      - Samo logowanie, złożoność haseł, menedżery haseł i praca po zalogowaniu pozostają bez zmian
    en:
      - Peeking at a typed password stops being possible in the system windows asking for credentials
      - People working on a touch keyboard mistype long passwords more often
      - Reports of being unable to sign in may rise where passwords are long and typed rarely
      - Signing in itself, password complexity, password managers and work after signing in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska obsługiwane wyłącznie klawiaturą dotykową, gdzie wpisanie długiego hasła bez podglądu jest realną barierą
      - Środowiska, w których nie wdrożono jeszcze menedżera haseł ani logowania bez hasła
    en:
      - Stations operated solely by touch keyboard, where typing a long password without a preview is a real barrier
      - Environments where neither a password manager nor passwordless sign-in is in place yet
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisablePasswordReveal'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    $name = 'DisablePasswordReveal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordReveal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-credentialsui

notes:
  pl: |
    Zasada dotyczy okien systemowych proszących o poświadczenia. Przeglądarki i
    aplikacje rysujące własne pola hasła mają własne przyciski podglądu i tego
    ustawienia nie widzą — to osobna sprawa, rozstrzygana po stronie tych
    programów.
  en: |
    The rule covers the system windows asking for credentials. Browsers and
    applications drawing their own password fields have preview buttons of their
    own and do not see this setting - that is a separate matter, settled on the
    side of those programs.
