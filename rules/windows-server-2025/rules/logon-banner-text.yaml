id: win2025-logon-banner-text

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Treść komunikatu wyświetlanego przed zalogowaniem ustawiona
    en: The body of the message shown before signing in set
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie nadaje treść komunikatowi pokazywanemu przed
    zalogowaniem się na tej maszynie.

    Tytuł mówi, że komunikat jest. Treść mówi, co właściwie zostało
    powiedziane — i to ona niesie całą wartość punktu, bo to ona jest
    ostrzeżeniem.

    Trzy rzeczy warto w niej zawrzeć, bo z nich bierze się jej sens.
    Pierwsza: że maszyna należy do organizacji, a nie do tego, kto
    właśnie przy niej stoi. Druga: że korzystanie z niej wolno
    wyłącznie osobom upoważnionym. Trzecia: że praca na niej jest
    zapisywana, a zapisy należą do właściciela maszyny. Bez trzeciej
    części dokument zebrany później bywa kwestionowany.

    Na serwerze komunikat widzą osoby logujące się na konsoli i przez
    pulpit zdalny — a więc wyłącznie ci, którzy serwer obsługują.
    Krąg odbiorców jest węższy niż na stanowisku roboczym, ale
    właśnie dlatego ostrzeżenie trafia do tych, których wejście ma
    największe skutki.

    Punkt sprawdza obecność treści, a nie jej brzmienie. Brzmienie jest
    decyzją organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    technicznie nic. Traci na tym właściciel maszyny, gdy przychodzi
    wykazać, że wejście było nieuprawnione, a zapisy z niej wolno było
    zbierać.
  en: |
    The setting gives a body to the message shown before signing in to this machine.

    The title says a message is there. The body says what was actually said - and it is the body
    that carries the whole worth of the item, being the warning itself.

    Three things are worth holding in it, and from them its sense comes. First: that the machine
    belongs to the organisation and not to whoever is standing at it. Second: that only
    authorised people may use it. Third: that work upon it is recorded and the records belong to
    the machine's owner. Without that third part a document gathered later is at times called
    into question.

    On a server the message is seen by the people signing in at the console and through remote
    desktop - that is, only by those who tend the server. The circle of readers is narrower than
    at a working station, but for just that reason the warning reaches those whose entry has the
    greatest effects.

    The item checks that a body is there rather than how it is worded. The wording is the
    organisation's decision.

    What an attacker gains while the item goes unmet: technically nothing. What is lost is the
    machine's owner's, when the time comes to show that an entry was unwarranted and that the
    records from it were theirs to gather.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy ludzi i wymaga uzgodnienia
    brzmienia przed wprowadzeniem.

    Warunkiem wstępnym jest ustalenie treści z osobą odpowiedzialną za
    sprawy prawne w organizacji. Jest to jedyny powód, dla którego
    punkt zaliczono do wymagających świadomego wdrożenia — skutek
    techniczny jest znikomy, a skutek prawny zależy wprost od tego,
    co w komunikacie napisano.

    Treść wpisana naprędce potrafi zaszkodzić. Komunikat zapowiadający
    konsekwencje, których organizacja nie zamierza wyciągać, albo
    powołujący się na przepisy, które nie mają tu zastosowania, jest
    gorszy niż brak komunikatu, bo podważa wiarygodność całej reszty.

    Skutek codzienny jest taki sam jak przy tytule: przy każdym
    logowaniu przybywa krok zamknięcia komunikatu. Na serwerze
    administrowanym pulpitem zdalnym powtarza się to wielokrotnie
    w ciągu dnia.

    Przypadkiem do sprawdzenia jest logowanie zautomatyzowane —
    narzędzia sterujące sesją graficzną potrafią zatrzymać się na
    komunikacie.

    Zmiana nie dotyczy sesji już otwartych ani zarządzania wierszem
    poleceń. Naprawa wpisuje brzmienie przykładowe, będące punktem
    wyjścia, a nie wymaganiem punktu.
  en: |
    The change surely changes how people work and takes an agreeing of the wording before it is
    brought in.

    The precondition is settling the body with whoever answers for matters of law in the
    organisation. That is the one reason the item was counted among those taking a knowing
    rollout - the technical effect is slight, while the effect in law hangs straight on what the
    message says.

    A body written in haste can do harm. A message foretelling consequences the organisation
    does not mean to draw, or calling upon rules that do not apply here, is worse than no message
    at all, undercutting as it does the standing of all the rest.

    The everyday effect is the same as at the title: at every sign-in a step of closing the
    message is added. On a server administered by remote desktop that repeats many times in a
    day.

    The case to be checked is automated signing in - tools steering a graphical session can halt
    upon the message.

    The change does not bear on sessions already open or on management by the command line. The
    mending writes a sample wording, a starting point rather than a requirement of the item.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Przy każdym logowaniu na konsoli i pulpitem zdalnym przybywa krok zamknięcia komunikatu
      - Narzędzie sterujące sesją graficzną w sposób nienadzorowany może zatrzymać się na komunikacie
      - Treść wpisana naprędce potrafi zaszkodzić bardziej niż brak komunikatu
      - Zarządzanie wierszem poleceń i zadania harmonogramu komunikatu nie zobaczą
    en:
      - At every sign-in at the console and by remote desktop a step of closing the message is added
      - A tool steering a graphical session with nobody present may halt upon the message
      - A body written in haste can do more harm than no message at all
      - Management by the command line and the scheduler's jobs will not see the message
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Treść komunikatu nie została uzgodniona z osobą odpowiedzialną za sprawy prawne
      - Do serwera łączą się narzędzia sterujące sesją graficzną w sposób nienadzorowany
    en:
      - The message's body was never agreed with whoever answers for matters of law
      - Tools steering a graphical session with nobody present connect to the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is kept as text, but a policy set earlier can leave it as a
      # list of lines. Both forms are joined before the emptiness check.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticetext'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      else {
        $joined = if ($value -is [array]) { [string]::Join(' ', $value) } else { [string]$value }
        if ($joined.Trim() -eq '') { 'EMPTY' } else { 'SET' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: SET
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticetext'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item.
    # Agree the organisation's own wording before rolling this out widely.
    $message = 'This system is for the use of authorised people only. ' +
      'Use of it is recorded, and the records belong to the organisation ' +
      'that owns this machine.'
    Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
      -Name 'legalnoticetext' -Value $message -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-text-for-users-attempting-to-log-on

notes:
  pl: |
    Sprawdzenie radzi sobie z wpisem zapisanym jako lista wierszy, bo
    zasada wprowadzona wcześniej potrafi pozostawić go w takiej
    postaci. Obie formy są łączone przed sprawdzeniem pustki.

    Treść powinna nazwać trzy rzeczy: czyja jest maszyna, kto może
    z niej korzystać i że praca na niej jest zapisywana. Trzecia część
    bywa pomijana, a to właśnie ona uzasadnia zbieranie zapisów.

    Czytaj razem z tytułem komunikatu. System pokazuje komunikat tylko
    wtedy, gdy obie części są ustawione.
  en: |
    The check manages an entry written as a list of lines, a policy set earlier being able to
    leave it in that form. Both forms are joined before the check for emptiness.

    The body ought to name three things: whose the machine is, who may use it, and that work upon
    it is recorded. The third part is at times passed over, and it is just that part which
    warrants the gathering of records.

    Read together with the message's title. The system shows the message only where both parts
    are set.
