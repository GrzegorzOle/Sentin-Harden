id: win2025-automatic-updates-schedule-mode

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage end user experience
  title:
    pl: Aktualizacje pobierane i instalowane bez pytania użytkownika
    en: Updates downloaded and installed without asking the user
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustawia tryb, w którym maszyna pobiera aktualizacje i instaluje
    je według harmonogramu, bez pytania nikogo o zgodę. Niższe wartości
    oznaczają tryby, w których maszyna najpierw powiadamia i czeka.

    Kategoria wysoka i chcę nazwać, na czym polega tu problem, bo z nazwy
    wygląda on na sprawę wygody, a jest sprawą tego, czy aktualizacja
    w ogóle nastąpi.

    Tryby z pytaniem opierają się na założeniu, że ktoś patrzy na ekran.
    Na stacji roboczej to założenie bywa spełnione. Na serwerze nie jest
    spełnione nigdy: powiadomienie pojawia się na pulpicie, na który nikt
    nie zagląda, w sesji, która została otwarta w zeszłym miesiącu, albo
    w konsoli poza systemem, do której nikt się nie łączy poza awarią.
    Aktualizacja czeka na zgodę, której nikt nigdy nie wyrazi.

    To jest najcichszy sposób, w jaki serwer przestaje być łatany.
    Mechanizm aktualizacji jest włączony, usługa działa, poprawki są
    pobrane — a maszyna stoi na wersji sprzed pół roku i nic w jej stanie
    nie wygląda na błąd. Raport oparty wyłącznie na tym, czy aktualizacje
    są włączone, pokaże taką maszynę jako zdrową.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: serwer
    z pobranymi, ale niezainstalowanymi poprawkami — czyli z lukami, które
    organizacja uważa za zamknięte.
  en: |
    The item sets the mode in which the machine fetches updates and
    installs them on a schedule, without asking anybody for consent. Lower
    values mean modes in which the machine notifies first and waits.

    The category is high, and I want to name what the problem here
    actually is, because from the name it looks like a matter of
    convenience and it is a matter of whether the update happens at all.

    The asking modes rest on the assumption that somebody is looking at the
    screen. On a workstation that assumption is sometimes met. On a server
    it is never met: the notice appears on a desktop nobody looks at, in a
    session opened last month, or in an out-of-band console nobody connects
    to outside a failure. The update waits for a consent nobody will ever
    give.

    This is the quietest way a server stops being patched. The update
    mechanism is on, the service is running, the fixes are downloaded - and
    the machine sits on a version from six months ago with nothing in its
    state looking like an error. A report resting solely on whether updates
    are enabled will show such a machine as healthy.

    What an attacker gains while the item goes unmet: a server with fixes
    downloaded and not installed - that is, with flaws the organisation
    believes to be closed.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia". Nie dlatego, że coś przestanie
    działać, tylko dlatego, że po tej zmianie maszyna zacznie sama wybierać
    moment instalacji, a przedtem czekała.

    Rzecz do sprawdzenia jest jedna i konkretna: czy godzina wpisana
    w harmonogramie pasuje do tego, co ten serwer robi. Instalacja
    aktualizacji obciąża maszynę i kończy się czasem restartem, a domyślna
    godzina bywa ustawiona bez związku z rolą maszyny. Serwer, który
    o trzeciej w nocy wykonuje kopię zapasową albo przelicza zestawienia,
    dostanie oba te zadania naraz.

    Druga rzecz wynika z tego, co ten tryb oznacza naprawdę. On nie mówi
    „instaluj natychmiast" — mówi „nie czekaj na człowieka". Między
    pobraniem a instalacją nadal jest harmonogram, a między instalacją
    a restartem nadal są zasady opisane w osobnym punkcie. Kto spodziewa
    się natychmiastowości, przeoczy, że skutek przyjdzie później, i będzie
    szukał usterki tam, gdzie jej nie ma.

    Warto też wiedzieć, czego ten punkt nie zmienia: on nie odbiera
    administratorowi możliwości zainstalowania czegoś ręcznie ani
    wstrzymania pojedynczej aktualizacji. Odbiera wyłącznie rolę
    warunku — aktualizacja przestaje zależeć od tego, czy ktoś kliknie.

    Zmiana nie wymaga przerwy w chwili wykonania i cofa się natychmiast.
  en: |
    I keep the class "needs review". Not because anything stops working,
    but because after this change the machine starts choosing the moment of
    installation itself, where before it waited.

    There is one specific thing to check: whether the hour written into the
    schedule suits what this server does. Installing updates loads the
    machine and sometimes ends in a restart, and the default hour is often
    set with no regard to the machine's role. A server that runs a backup
    or recomputes reports at three in the morning will get both jobs at
    once.

    The second thing follows from what this mode really means. It does not
    say "install at once" - it says "do not wait for a person". Between the
    download and the installation there is still a schedule, and between
    the installation and the restart there are still the rules described in
    a separate item. Anybody expecting immediacy will miss that the effect
    comes later and will look for a fault where there is none.

    It is also worth knowing what this item does not change: it does not
    take from an administrator the ability to install something by hand or
    to hold back a single update. It takes away only its role as a
    condition - the update stops depending on somebody clicking.

    The change needs no outage at the moment of execution and is undone
    immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Maszyna zaczyna sama wybierać moment instalacji, a przedtem czekała na zgodę człowieka
      - Godzina z harmonogramu bywa ustawiona bez związku z rolą maszyny i może zbiec się z kopią zapasową albo przeliczaniem zestawień
      - Tryb nie oznacza „instaluj natychmiast", tylko „nie czekaj na człowieka" — skutek przyjdzie według harmonogramu
      - Administrator nadal może zainstalować coś ręcznie i wstrzymać pojedynczą aktualizację
    en:
      - The machine starts choosing the moment of installation itself, where before it waited for a person's consent
      - The scheduled hour is often set with no regard to the machine's role and may coincide with a backup or a reporting run
      - The mode does not mean "install at once" but "do not wait for a person" - the effect comes on the schedule
      - An administrator can still install something by hand and hold back a single update
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono, co ta maszyna robi o godzinie wpisanej w harmonogramie instalacji
      - Aktualizacje tej maszyny prowadzi narzędzie zewnętrzne, które samo ustala moment instalacji
    en:
      - It has not been checked what this machine does at the hour written into the installation schedule
      - This machine's updates are driven by an external tool that settles the installation moment itself
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
      $name = 'AUOptions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    $name = 'AUOptions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The asking modes rest on somebody looking at the screen, which on a
    # server is never the case - that is the quietest way a server stops being
    # patched. Check what this machine does at the scheduled hour first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AUOptions' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-wu-settings

notes:
  pl: |
    Z nazwy wygląda to na sprawę wygody, a jest sprawą tego, czy
    aktualizacja w ogóle nastąpi. Tryby z pytaniem opierają się na
    założeniu, że ktoś patrzy na ekran — na serwerze nie jest ono spełnione
    nigdy.

    To najcichszy sposób, w jaki serwer przestaje być łatany: mechanizm
    włączony, usługa działa, poprawki pobrane, a maszyna stoi na wersji
    sprzed pół roku i nic nie wygląda na błąd.

    Tryb nie oznacza „instaluj natychmiast", tylko „nie czekaj na
    człowieka". Kto spodziewa się natychmiastowości, będzie szukał usterki
    tam, gdzie jej nie ma.
  en: |
    From the name this looks like a matter of convenience and it is a
    matter of whether the update happens at all. The asking modes rest on
    the assumption that somebody is looking at the screen - on a server
    that is never met.

    This is the quietest way a server stops being patched: the mechanism
    on, the service running, the fixes downloaded, and the machine sitting
    on a version from six months ago with nothing looking like an error.

    The mode does not mean "install at once" but "do not wait for a
    person". Anybody expecting immediacy will look for a fault where there
    is none.
