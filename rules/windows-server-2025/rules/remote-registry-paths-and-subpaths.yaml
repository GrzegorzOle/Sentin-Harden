id: win2025-remote-registry-paths-and-subpaths

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Lista gałęzi rejestru dostępnych zdalnie wraz z zawartością
    en: The list of registry keys reachable remotely together with their contents
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Wykaz wylicza gałęzie rejestru dostępne zdalnie bez uwierzytelnienia
    wraz z całą ich zawartością — czyli razem ze wszystkim, co leży
    poniżej.

    Różnica wobec wykazu pozycji dokładnych jest tu istotna i warto ją
    widzieć wyraźnie. Tamten otwiera wskazaną gałąź i nic więcej;
    ten otwiera gałąź i wszystko, co kiedykolwiek pod nią powstanie.
    Pozycja dopisana do tego wykazu jest więc zobowiązaniem na
    przyszłość, a nie decyzją o stanie bieżącym.

    Wykaz zgodny obejmuje jedenaście pozycji i wszystkie dotyczą
    rzeczy, które maszyna udostępnia w celu współpracy: konfiguracji
    drukarek, ustawień dziennika zdarzeń, liczników wydajności
    i ustawień usług pulpitu zdalnego. Nie ma wśród nich niczego, co
    opisywałoby konta albo zainstalowane oprogramowanie.

    Na serwerze punkt ten jest mniej rygorystyczny niż poprzedni,
    i jest to celowe. Serwer bywa odczytywany przez systemy
    monitorujące i przez usługi wydruku, a wykaz ten jest dokładnie
    tym, czego takie odczytywanie wymaga.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    do gałęzi dopisanych do wykazu wraz z całą ich zawartością bieżącą
    i przyszłą, bez podania jakiegokolwiek konta.
  en: |
    The list counts up the registry keys reachable remotely without authentication together with
    the whole of their contents - that is, along with everything lying beneath.

    The difference from the list of exact entries weighs here and is worth seeing plainly. That
    one opens a named key and nothing more; this one opens a key and everything that will ever
    arise beneath it. An entry written into this list is therefore a pledge upon the future
    rather than a decision about the present state.

    The compliant list takes in eleven entries, and all of them bear on things the machine puts
    out for the sake of working together: the setting up of printers, the event log's settings,
    performance counters and the settings of the remote desktop services. There is nothing among
    them describing accounts or installed software.

    On a server this item is less strict than the one before, and that is on purpose. A server
    is at times read by monitoring systems and by printing services, and this list is exactly
    what such a reading takes.

    What an attacker gains while the item goes unmet: access to the keys written into the list
    along with the whole of their contents, present and future, with no account named at all.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy coś odczytuje rejestr tego serwera
    zdalnie poza gałęziami z wykazu zgodnego.

    W stanie domyślnym wykaz zawiera dokładnie te jedenaście pozycji,
    więc na części serwerów naprawa nie zmienia niczego. Niezgodność
    bierze się zwykle z pozycji dopisanej kiedyś pod konkretne
    narzędzie i zapomnianej.

    Warto zauważyć, że wykaz zgodny obejmuje gałęzie dziennika zdarzeń
    i liczników wydajności. Znaczy to, że monitorowanie oparte na tych
    dwóch źródłach po zawężeniu działa dalej — a właśnie o nie martwi
    się zwykle ten, kto ten punkt odpuszcza.

    Przypadkiem do sprawdzenia jest narzędzie sięgające do gałęzi
    własnej aplikacji, dopisanej do wykazu przy jej wdrożeniu.
    Po zawężeniu przestanie do niej sięgać.

    Objaw jest natychmiastowy i czytelny: narzędzie zgłasza brak
    dostępu do gałęzi. Bywa to jednak zauważone późno, jeżeli narzędzie
    działa w tle i zgłasza niepowodzenie wyłącznie do własnego
    dziennika.

    Właściwym rozwiązaniem nie jest rozszerzenie wykazu, tylko
    odczytywanie rejestru na koncie uwierzytelnionym. Dopisanie pozycji
    do tego wykazu otwiera gałąź wraz z całą przyszłą zawartością,
    więc jest zobowiązaniem szerszym, niż wygląda.

    Zmiana nie wymaga przerwy i wchodzi w życie natychmiast.
  en: |
    What needs checking is whether anything reads this server's registry remotely beyond the
    keys of the compliant list.

    In the default state the list holds exactly those eleven entries, so on some servers the
    mending changes nothing. Non-compliance usually comes of an entry written in once for a
    particular tool's sake and forgotten.

    It is worth marking that the compliant list takes in the keys of the event log and of the
    performance counters. That means monitoring resting on those two sources works on after the
    narrowing - and it is just those that whoever lets this item go usually worries about.

    The case to be checked is a tool reaching to a key of its own application, written into the
    list at its rollout. After the narrowing it will stop reaching it.

    The symptom is immediate and plain: the tool reports a want of access to the key. It is at
    times noticed late, though, where the tool works in the background and reports its failure
    only to a log of its own.

    The right answer is not a widening of the list but a reading of the registry under an
    authenticated account. Writing an entry into this list opens a key along with the whole of
    its future contents, and so is a wider pledge than it looks.

    The change takes no break and comes into force at once.

implementation_consequences:
  impact_areas:
    - remote-management
    - diagnostics-and-reporting
    - printing
    - logging-and-audit
  what_breaks:
    pl:
      - Narzędzie sięgające do gałęzi własnej aplikacji dopisanej do wykazu przestanie do niej sięgać
      - Monitorowanie oparte na dzienniku zdarzeń i licznikach wydajności działa dalej, bo obie gałęzie są w wykazie zgodnym
      - Objaw bywa zauważony późno, gdy narzędzie zgłasza niepowodzenie wyłącznie do własnego dziennika
      - Narzędzie pracujące na koncie uwierzytelnionym czyta rejestr niezależnie od tego wykazu
    en:
      - A tool reaching to a key of its own application written into the list will stop reaching it
      - Monitoring resting on the event log and performance counters works on, both keys standing in the compliant list
      - The symptom is at times noticed late, where the tool reports its failure only to a log of its own
      - A tool working under an authenticated account reads the registry whatever this list says
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja wdrożona na tym serwerze dopisała własną gałąź do wykazu i odczytuje ją zdalnie
      - Nie ustalono, które pozycje dopisano do wykazu i pod jakie narzędzie
    en:
      - An application rolled out on this server wrote a key of its own into the list and reads it remotely
      - It has not been settled which entries were written into the list and for which tool's sake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The list is compared as a set, without regard to order or letter case,
      # because neither carries meaning here. A list that differs is reported
      # together with its contents rather than as a bare failure.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedPaths'
      $name = 'Machine'
      $expected = @(
        'System\CurrentControlSet\Control\Print\Printers',
        'System\CurrentControlSet\Services\Eventlog',
        'Software\Microsoft\OLAP Server',
        'Software\Microsoft\Windows NT\CurrentVersion\Print',
        'Software\Microsoft\Windows NT\CurrentVersion\Windows',
        'System\CurrentControlSet\Control\ContentIndex',
        'System\CurrentControlSet\Control\Terminal Server',
        'System\CurrentControlSet\Control\Terminal Server\UserConfig',
        'System\CurrentControlSet\Control\Terminal Server\DefaultUserConfiguration',
        'Software\Microsoft\Windows NT\CurrentVersion\Perflib',
        'System\CurrentControlSet\Services\SysmonLog'
      )
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = @($item.$name | Where-Object { $null -ne $_ -and $_ -ne '' })
        $left = ($value | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        $right = ($expected | ForEach-Object { $_.ToUpperInvariant() } | Sort-Object) -join '|'
        if ($left -eq $right) { 'EXACT_MATCH' }
        elseif ($value.Count -eq 0) { 'EMPTY' }
        else { 'OTHER ' + ($value -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: EXACT_MATCH
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedPaths'
    $name = 'Machine'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = @($current)
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurePipeServers\winreg\AllowedPaths'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $value = @(
      'System\CurrentControlSet\Control\Print\Printers',
      'System\CurrentControlSet\Services\Eventlog',
      'Software\Microsoft\OLAP Server',
      'Software\Microsoft\Windows NT\CurrentVersion\Print',
      'Software\Microsoft\Windows NT\CurrentVersion\Windows',
      'System\CurrentControlSet\Control\ContentIndex',
      'System\CurrentControlSet\Control\Terminal Server',
      'System\CurrentControlSet\Control\Terminal Server\UserConfig',
      'System\CurrentControlSet\Control\Terminal Server\DefaultUserConfiguration',
      'Software\Microsoft\Windows NT\CurrentVersion\Perflib',
      'System\CurrentControlSet\Services\SysmonLog'
    )
    Set-ItemProperty -Path $path -Name 'Machine' -Value $value -Type MultiString

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value @($b.value) -Type MultiString
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-access-remotely-accessible-registry-paths-and-subpaths

notes:
  pl: |
    Dopisanie pozycji do tego wykazu otwiera gałąź wraz z całą jej
    przyszłą zawartością. Jest to zobowiązanie szersze niż przy wykazie
    pozycji dokładnych i warto o tym pamiętać, rozważając wyjątek.

    Wykaz zgodny obejmuje dziennik zdarzeń i liczniki wydajności, więc
    monitorowanie oparte na tych dwóch źródłach po zawężeniu działa
    dalej.

    Sprawdzenie porównuje wykaz jako zbiór i raportuje zawartość
    odmienną, żeby dało się zobaczyć, co dopisano.
  en: |
    Writing an entry into this list opens a key along with the whole of its future contents. It
    is a wider pledge than at the list of exact entries, and that is worth keeping in mind in
    weighing an exception.

    The compliant list takes in the event log and the performance counters, so monitoring
    resting on those two sources works on after the narrowing.

    The check compares the list as a set and reports contents that differ, so that what was
    written in may be seen.
