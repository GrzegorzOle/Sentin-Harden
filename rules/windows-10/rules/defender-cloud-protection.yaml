id: win10-defender-cloud-protection

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Ochrona dostarczana z chmury włączona
    en: Cloud-delivered protection enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozwala ochronie zapytać usługi producenta o plik, którego
    nie rozpoznaje lokalnie.

    Jest to odpowiedź na problem czasu. Między pojawieniem się nowej
    odmiany złośliwego oprogramowania a rozesłaniem sygnatur do wszystkich
    maszyn upływają godziny. Zapytanie z maszyny skraca ten odstęp do
    sekund, bo odpowiedź powstaje raz i służy wszystkim pytającym.

    Wartość jest największa tam, gdzie plik jest nowy i widziany po raz
    pierwszy — czyli dokładnie w przypadku, w którym skanowanie lokalne
    nie ma czego porównać.

    Odnotowuję, co maszyna wysyła. Domyślnie są to dane opisujące plik
    i okoliczności jego pojawienia się: skrót, nazwa, rozmiar, ścieżka,
    źródło pobrania. Wysyłanie samych próbek jest ustawieniem osobnym
    i ta reguła go nie obejmuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno
    kilku godzin, w którym nowa odmiana jest dla tej maszyny nierozpoznawalna.
  en: |
    The setting allows the protection to ask the maker's service about a file it does not know locally.

    It is an answer to a problem of time. Between the coming up of a new strain of malicious software and the
    sending out of signatures to every machine, hours run by. An asking from the machine shortens that span to
    seconds, the answer coming about once and serving every asker.

    The worth is greatest where the file is new and seen for the first time - which is to say in just the case in
    which the local scan has nothing to set it against.

    I set down what the machine sends. By default it is data describing the file and the circumstances of its
    coming up: a digest, a name, a size, a path, the source of the download. The sending of samples themselves is
    a setting apart and this rule does not take it in.

    What an attacker gains while the item goes unmet: a window of some hours in which a new strain cannot be
    known upon this machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    maszyna ma sięgać do usług zewnętrznych i co wolno jej o sobie
    powiedzieć.

    Sprawdzić trzeba dwie rzeczy. Pierwszą jest łączność: maszyna
    odcięta od sieci zewnętrznej nie dostanie odpowiedzi, a ochrona
    będzie na nią czekać. Skutkiem jest opóźnienie przy otwieraniu plików
    nieznanych — zwykle kilka sekund, wyznaczone osobnym ustawieniem
    limitu czasu.

    Drugą jest to, co maszyna wysyła. Nazwa pliku i ścieżka bywają
    informacją, której organizacja nie chce wynosić na zewnątrz; ścieżka
    zawiera nazwy katalogów, a te bywają nazwami projektów i klientów.
    Jest to rozmowa o danych, nie o bezpieczeństwie, i należy ją odbyć
    przed zmianą, a nie po niej.

    Odnotowuję, dlaczego wartość jest wyższa z dwóch dostępnych. Niższa
    wysyła mniej, ale przez to ogranicza odpowiedzi, które maszyna może
    otrzymać — czyli obniża zysk, zachowując koszt łączności.

    Czego to nie psuje: pracy ochrony bez łączności, skanowania lokalnego,
    logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether the machine is to reach out to outside
    services and what it may say about itself.

    Two things have to be reviewed. The first is the link: a machine cut off from the outside network will get no
    answer, and the protection will wait for it. The consequence is a delay at the opening of unknown files -
    some few seconds as a rule, set by a separate setting of a time bound.

    The second is what the machine sends. A file's name and its path are at times knowledge a body will not have
    carried outside; a path holds the names of folders, and those are at times the names of projects and of
    clients. It is a conversation about data and not about safety, and it has to be held before the change and
    not after it.

    I set down why the value is the higher of the two to be had. The lower one sends less but by that bounds the
    answers the machine may get back - which is to say it lowers the gain while keeping the cost of the link.

    What this does not break: the protection's working without a link, the local scan, logging on, file shares,
    or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
  what_breaks:
    pl:
      - Maszyna odcięta od sieci zewnętrznej nie dostanie odpowiedzi, a otwieranie plików nieznanych opóźnia się o kilka sekund
      - Wysyłana jest nazwa pliku i ścieżka, a te bywają nazwami projektów i klientów, których nie wolno wynosić
      - Wartość wyższa wysyła więcej, ale niższa ogranicza odpowiedzi przy zachowanym koszcie łączności
      - Wysyłanie samych próbek jest ustawieniem osobnym i ta reguła go nie obejmuje
      - Praca ochrony bez łączności, skanowanie lokalne, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - A machine cut off from the outside network gets no answer, and the opening of unknown files is delayed by some few seconds
      - A file s name and its path are sent, and those are at times the names of projects and of clients that may not be carried outside
      - The higher value sends more, while the lower bounds the answers at an unchanged cost of the link
      - The sending of samples themselves is a setting apart and this rule does not take it in
      - The protection s working without a link, the local scan, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje w sieci odciętej od zewnątrz i zapytanie i tak nie dostanie odpowiedzi
      - Nazwy katalogów na tej maszynie są nazwami projektów i klientów, których nie wolno wynosić na zewnątrz
    en:
      - The machine works in a network cut off from outside and the asking will get no answer anyway
      - The names of the folders upon this machine are the names of projects and of clients that may not be carried outside
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters: with Defender stood down, reading its preferences throws.
      # The question "did another product take over" has to be answered first.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        [string][int](Get-MpPreference -ErrorAction Stop).MAPSReporting
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'SpynetReporting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two, not one: the lower setting sends less and by that cuts the answers the
    # machine can get back.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SpynetReporting' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła jest w tym bloku jedyną, przy której rozmowa nie dotyczy
    wydajności ani zgodności, lecz danych wychodzących z maszyny. Warto,
    żeby aplikacja postawiła to wprost, bo użytkownik, który odkryje to
    sam, straci zaufanie do całej listy.

    Argument za wartością wyższą jest argumentem o koszcie, który już
    został poniesiony. Wybór niższej nie zdejmuje pytania o łączność ani
    o dane wychodzące — zdejmuje jedynie część zysku. Jeśli rozmowa
    kończy się odmową, właściwym wynikiem jest wyłączenie mechanizmu
    w całości, a nie ustawienie połowiczne.

    Odnotowuję relację z regułą o blokowaniu przy pierwszym napotkaniu.
    Tamta korzysta z tego mechanizmu i bez niego nie ma czego blokować —
    więc te dwa punkty wdraża się razem albo wcale.
  en: |
    The rule is in this block the only one at which the conversation touches neither speed nor fitness but data
    leaving the machine. It is well that the application put that outright, a user who finds it out for
    themselves losing trust in the whole list.

    The argument for the higher value is an argument about a cost already borne. The choosing of the lower one
    takes away neither the question of the link nor that of the data going out - it takes away a part of the gain
    alone. Where the conversation ends in a refusal, the proper outcome is the switching off of the mechanism
    whole, and not a half-way setting.

    I set down the tie to the rule about blocking at first sight. That one draws upon this mechanism and without
    it has nothing to block - so those two items are rolled out together or not at all.
