id: win2016-rdp-temp-folders-per-session

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary Folders
  title:
    pl: Osobny folder tymczasowy dla każdej sesji zdalnej
    en: A separate temporary folder for each remote session
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie daje każdej sesji zdalnej własny folder plików tymczasowych,
    zamiast wspólnego dla wszystkich sesji na maszynie.

    Folder tymczasowy brzmi niepozornie, a jest miejscem, przez które
    przechodzi więcej treści niż przez jakikolwiek inny katalog na serwerze.
    Odkłada się tam to, co program otworzył do podglądu, załącznik otwarty
    z poczty, dokument w trakcie edycji, wynik zapytania przed zapisaniem,
    plik rozpakowany z archiwum. Rzeczy te nie są przeznaczone do trwałego
    przechowania i właśnie dlatego nikt ich nie pilnuje.

    Wspólny folder oznacza, że wszystkie sesje odkładają to w jedno miejsce.
    Osoba pracująca w jednej sesji widzi więc pliki tymczasowe osoby
    pracującej w drugiej — dokumenty, których nigdy nie miała zobaczyć,
    i to bez sięgania po żadne uprawnienie. Wystarczy otworzyć katalog.

    Druga droga jest cięższa i mniej oczywista. Wspólne miejsce zapisu,
    w którym nazwy plików bywają przewidywalne, pozwala podstawić plik pod
    nazwę, po którą sięgnie program działający w cudzej sesji. Jest to
    klasyczna droga do wykonania własnego kodu z uprawnieniami tamtej sesji
    — a na serwerze bywają to uprawnienia wyższe niż własne.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wgląd
    w pliki tymczasowe wszystkich pracujących na maszynie oraz możliwość
    podstawienia pliku pod nazwę, po którą sięgnie cudza sesja.
  en: |
    The setting gives every remote session a temporary file folder of its own,
    instead of one shared by all the sessions on the machine.

    A temporary folder sounds unremarkable, and it is the place through which more
    content passes than through any other directory on a server. There are laid down
    what a program opened for viewing, an attachment opened from mail, a document
    being edited, the result of a query before it was saved, a file unpacked from an
    archive. These things are not meant to be kept, and for that very reason nobody
    watches over them.

    A shared folder means every session lays all that down in one place. A person
    working in one session therefore sees the temporary files of a person working in
    another - documents they were never to see, and that without reaching for any
    privilege. Opening the directory is enough.

    The second road is heavier and less obvious. A shared place of writing in which
    file names are at times foreseeable lets a file be planted under a name a
    program running in somebody else's session will reach for. It is the classic
    road to running one's own code with that session's privileges - and on a server
    those are at times higher than one's own.

    What an attacker gains while the item goes unmet: a view of the temporary files
    of everybody working on the machine, and the means of planting a file under a
    name somebody else's session will reach for.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na maszynach z jedną sesją naraz zmiana
    nie ma żadnego skutku odczuwalnego.

    Sprawdzić trzeba oprogramowanie, które zakłada, że folder tymczasowy jest
    wspólny. Takie założenie jest błędne, ale bywa wbudowane w programy
    starsze, a objawia się dopiero przy wielu sesjach. Typowy wzorzec: jedna
    sesja zapisuje plik pod stałą nazwą, druga go odczytuje. Po zmianie druga
    sesja swojego nie znajdzie, bo patrzy w inny katalog.

    Druga rzecz to miejsce na dysku. Osobne foldery dla każdej sesji zajmują
    łącznie więcej niż jeden wspólny, a na maszynie z wieloma sesjami naraz
    różnica bywa zauważalna. Sprzymierzeńcem jest tu reguła o usuwaniu
    folderów po zakończeniu sesji — bez niej osobne foldery narastają, więc
    obie warto wdrażać razem.

    Objaw w razie kłopotu bywa mylący, bo wygląda na brak pliku, a nie na
    zmianę zasady. Program zgłasza, że nie znajduje czegoś, co „przecież
    tam jest" — i jest, tylko w folderze innej sesji.

    Czego to nie psuje: pracy pojedynczej sesji, dostępu do katalogów
    trwałych, zadań harmonogramu, usług działających poza sesją.

    Wymaga wylogowania: zmiana obowiązuje od następnej sesji, bo folder
    tymczasowy powstaje przy jej tworzeniu.
  en: |
    The class is "needs review", though on machines with one session at a time the
    change has no effect anybody will feel.

    What has to be checked is software assuming the temporary folder is shared. That
    assumption is wrong, but it is at times built into older programs, and it shows
    only with several sessions. The typical pattern: one session writes a file under
    a fixed name and another reads it. After the change the second session will not
    find its own, since it looks into another directory.

    The second thing is room on the disk. Separate folders for each session take up
    more together than one shared, and on a machine with many sessions at once the
    difference is at times noticeable. The rule on removing folders once a session
    ends is an ally here - without it the separate folders pile up, so both are
    worth rolling out together.

    The symptom in case of trouble is misleading, since it looks like a missing file
    rather than a change of policy. The program reports it cannot find something
    "that is right there" - and it is, only in another session's folder.

    What this does not break: the work of a single session, access to permanent
    directories, scheduled tasks, or services running outside a session.

    Calls for signing out: the change holds from the next session on, since the
    temporary folder is made when the session is created.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Program starszy zakładający wspólny folder tymczasowy przestaje znajdować plik zapisany przez inną sesję pod stałą nazwą
      - Osobne foldery dla każdej sesji zajmują łącznie więcej miejsca na dysku niż jeden wspólny
      - Objaw wygląda na brak pliku, a nie na zmianę zasady, więc bywa mylnie zgłaszany jako awaria programu
      - Praca pojedynczej sesji, dostęp do katalogów trwałych i zadania harmonogramu pozostają bez zmian
    en:
      - An older program assuming a shared temporary folder stops finding a file another session wrote under a fixed name
      - Separate folders for each session take up more disk space together than one shared folder
      - The symptom looks like a missing file rather than a change of policy, so it is at times wrongly reported as a program fault
      - The work of a single session, access to permanent directories and scheduled tasks stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa oprogramowanie wymieniające pliki między sesjami przez wspólny folder tymczasowy i nie ma dla niego innej drogi
      - Miejsce na dysku jest już ograniczone, a reguła o usuwaniu folderów po zakończeniu sesji nie została wdrożona
    en:
      - Software exchanging files between sessions through a shared temporary folder runs on this machine and there is no other road for it
      - Disk space is already tight and the rule on removing folders once a session ends has not been rolled out
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'PerSessionTempDir'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'PerSessionTempDir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PerSessionTempDir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Punkt jest cięższy, niż sugeruje jego nazwa, i raport powinien to
    pokazywać. Folder tymczasowy brzmi jak sprawa porządkowa, a jest drogą
    do cudzych dokumentów i do wykonania kodu w cudzej sesji — czyli do
    rzeczy, których żadna inna reguła pulpitu zdalnego nie zamyka.

    Reguła idzie w parze z usuwaniem folderów po zakończeniu sesji i obie
    opisują ten sam katalog z dwóch stron: ta rozdziela go między sesje,
    tamta sprząta po nich. Wdrożenie samej tej reguły rozwiązuje problem
    podglądu i podstawienia, ale zostawia narastanie plików; wdrożenie samej
    tamtej sprząta, ale nie rozdziela. Aplikacja powinna pokazywać je razem.

    Na maszynie obsługującej jedną sesję naraz punkt nie zmienia nic
    w praktyce — ale i nic nie kosztuje, a maszyna jednosesyjna bywa
    wielosesyjna pół roku później, bez ponownego przeglądu zasad.
  en: |
    The item is heavier than its name suggests, and the report should show that. A
    temporary folder sounds like a matter of tidiness, and it is a road to other
    people's documents and to running code in another's session - which is to say to
    things no other remote desktop rule shuts.

    The rule goes in a pair with the removing of folders once a session ends, and
    both describe the same directory from two sides: this one divides it between
    sessions, that one clears up after them. Rolling out this one alone answers the
    viewing and the planting but leaves the files piling up; rolling out that one
    alone clears up but does not divide. The application should show them together.

    On a machine serving one session at a time the item changes nothing in practice
    - but it costs nothing either, and a one-session machine is at times a
    many-session machine half a year later, with no fresh reading of the policies.
