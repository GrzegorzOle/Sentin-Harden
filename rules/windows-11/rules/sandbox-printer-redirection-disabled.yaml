id: win11-sandbox-printer-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Sandbox
  title:
    pl: Udostępnianie drukarek piaskownicy wyłączone
    en: Sharing of printers with the sandbox disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy drukarki widoczne na maszynie mają być widoczne
    również w piaskownicy.

    Znaczenie punktu bierze się nie z samego drukowania, lecz z tego, co
    udostępnienie drukarki ze sobą niesie. Żeby piaskownica mogła drukować,
    musi zobaczyć urządzenie gospodarza i skorzystać z jego obsługi — czyli
    powstaje kanał między środowiskiem nieufanym a podsystemem druku maszyny.

    Podsystem druku jest w systemie składnikiem wyjątkowo często wskazywanym
    jako droga podniesienia uprawnień. Powód jest strukturalny: obsługuje dane
    przysyłane z zewnątrz, ładuje sterowniki i pracuje z wysokimi
    uprawnieniami. Udostępnienie go piaskownicy oznacza wystawienie tego
    składnika na to, co w piaskownicy uruchomiono.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    podsystemu druku gospodarza z wnętrza środowiska, które miało go
    odgrodzić, oraz drugą rzecz mniej oczywistą — możliwość wydrukowania
    czegoś z piaskownicy na urządzeniu stojącym w biurze. Dokument, który
    wyszedł z drukarki, przekracza granicę izolacji w sposób, o którym żadna
    zasada dotycząca plików nie wie.

    Na stanowisku, na którym w piaskownicy sprawdza się nieznane pliki,
    drukowanie z jej wnętrza nie ma zastosowania.
  en: |
    The setting settles whether printers visible on the machine are to be visible in the
    sandbox as well.

    The item's weight comes not from printing itself but from what making a printer
    available brings with it. For the sandbox to print, it has to see the host's device
    and use its handling - that is, a channel arises between an untrusted environment and
    the machine's printing subsystem.

    The printing subsystem is a component named unusually often as a route to raising
    rights. The reason is structural: it handles data sent from outside, loads drivers and
    works with high rights. Making it available to the sandbox means exposing that
    component to whatever was started in the sandbox.

    What an attacker gains while the item goes unmet: access to the host's printing
    subsystem from inside the environment that was to fence it off, and a second, less
    obvious thing - the means of printing something from the sandbox on a device standing
    in the office. A document that has come out of a printer crosses the border of
    isolation in a way no policy about files knows of.

    At a station where unknown files are examined in the sandbox, printing from inside it
    has no use.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w piaskownicy cokolwiek się drukuje — a poza
    testowaniem sterowników jest to zastosowanie rzadkie.

    Po zmianie piaskownica zobaczy system bez zainstalowanych drukarek.
    Program próbujący drukować zgłosi brak urządzenia, a nie brak uprawnień.

    Odczuje to osoba, która używa piaskownicy do sprawdzenia, czy dokument
    z nieznanego źródła daje się otworzyć i wydrukować, oraz osoba testująca
    sterownik drukarki przed wdrożeniem. Pierwszemu zastosowaniu warto się
    przyjrzeć osobno: drukowanie dokumentu z nieznanego źródła z piaskownicy
    jest właśnie tym, czego reguła ma zabronić, a nie przypadkiem, który
    przemawia za jej odpuszczeniem.

    Poza piaskownicą nic się nie zmienia. Drukowanie z samej maszyny działa
    tak jak wcześniej.
  en: |
    What needs checking is whether anything is printed in the sandbox - and apart from
    testing drivers it is a rare use.

    After the change the sandbox will see a system with no printers installed. A program
    trying to print will report a want of a device rather than a want of rights.

    It will be felt by whoever uses the sandbox to see whether a document from an unknown
    source can be opened and printed, and by whoever tests a printer driver before a
    rollout. The first use is worth looking at apart: printing a document from an unknown
    source out of the sandbox is exactly what the rule is to forbid, rather than a case
    that speaks for letting it go.

    Outside the sandbox nothing changes. Printing from the machine itself works as before.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Piaskownica nie widzi żadnej drukarki i program zgłasza brak urządzenia
      - Testowanie sterownika drukarki w piaskownicy przestaje być możliwe
      - Wydrukowanie dokumentu otwartego w piaskownicy przestaje być możliwe
      - Drukowanie z samej maszyny działa tak jak wcześniej
    en:
      - The sandbox sees no printer and a program reports a want of a device
      - Testing a printer driver in the sandbox stops being possible
      - Printing a document opened in the sandbox stops being possible
      - Printing from the machine itself works as before
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Piaskownica służy do testowania sterowników drukarek przed wdrożeniem
    en:
      - The sandbox serves to test printer drivers before a rollout
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowPrinterRedirection'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    $current = (Get-ItemProperty -Path $path -Name 'AllowPrinterRedirection' -ErrorAction SilentlyContinue).'AllowPrinterRedirection'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowPrinterRedirection'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Sandbox'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowPrinterRedirection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/application-security/application-isolation/windows-sandbox/

notes:
  pl: |
    Reguła domyka zestaw opisujący przejścia między piaskownicą a maszyną:
    schowek, sieć, mikrofon, kamera, karta graficzna, drukarki. Wyniki tych
    reguł warto czytać razem, bo piaskownica z jednym otwartym przejściem nie
    jest piaskownicą z pięcioma zamkniętymi — jest środowiskiem z przejściem.

    Podsystem druku ma w tej paczce własne reguły dotyczące samej maszyny.
    Ten punkt ich nie zastępuje i ich nie powiela: tamte mówią, jak druk ma
    działać, ten mówi, że piaskownica nie ma do niego sięgać.

    Brak wartości nie jest stanem zgodnym, bo domyślnie udostępnianie bywa
    dozwolone.
  en: |
    The rule closes the set describing the passages between the sandbox and the machine:
    the clipboard, the network, the microphone, the camera, the graphics card, printers.
    The results of these rules are worth reading together, since a sandbox with one open
    passage is not a sandbox with five closed - it is an environment with a crossing.

    The printing subsystem has its own rules in this pack concerning the machine itself.
    This item does not stand in for them and does not repeat them: those say how printing
    is to work, this says that the sandbox is not to reach it.

    A missing value is not a compliant state, since by default the sharing is sometimes
    allowed.
