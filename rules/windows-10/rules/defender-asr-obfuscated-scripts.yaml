id: win10-defender-asr-obfuscated-scripts

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada wykonywania skryptów o zaciemnionej treści
    en: Obfuscated scripts blocked from running
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Reguła zatrzymuje skrypty, których treść została celowo uczyniona
    nieczytelną.

    Zaciemnianie jest w skryptach napastnika regułą, nie wyjątkiem.
    Polecenia bywają zakodowane, nazwy sklejane z kawałków, a tekst
    rozwijany dopiero w pamięci. Robi się to po to, żeby sprawdzenie
    oparte na treści nie miało czego rozpoznać.

    Ta reguła odwraca to rozumowanie. Zamiast pytać, co skrypt robi,
    pyta o to, czy jego treść została ukryta — a ukrywanie treści jest
    samo w sobie sygnałem, bo skrypt pisany w dobrej wierze nie ma powodu
    być nieczytelny.

    Odnotowuję, że jest to reguła opierająca się na ocenie, a nie na
    zamkniętym powiązaniu czynności. Przez to bywa zawodna w obie strony:
    przepuszcza zaciemnianie proste i zatrzymuje kod czytelny, lecz
    nietypowy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: swobodę
    w ukrywaniu treści skryptu przed wszystkim, co treść tę czyta.
  en: |
    The rule stops scripts whose contents have been made unreadable on purpose.

    Darkening is in an attacker's scripts the rule and not the exception. Commands are at times encoded, names
    glued from pieces, and the text unfolded only in memory. It is done so that a check resting upon contents may
    have nothing to know again.

    This rule turns that reasoning about. Instead of asking what the script does, it asks whether its contents
    have been hidden - and the hiding of contents is of itself a signal, a script written in good faith having no
    ground to be unreadable.

    I set down that it is a rule resting upon a weighing and not upon a closed joining of acts. By that it is at
    times unsure both ways: it lets simple darkening through and stops code that is readable but out of the
    ordinary.

    What an attacker gains while the item goes unmet: a free hand in hiding a script's contents from everything
    that reads those contents.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są skrypty
    własnej roboty.

    Techniki uznawane za zaciemnianie bywają używane w dobrej wierze.
    Polecenie zakodowane, żeby przejść przez zadanie zaplanowane bez
    kłopotu z cudzysłowami; nazwa sklejana, żeby uniknąć długiego wiersza;
    tekst uruchamiany z pamięci, bo tak działa narzędzie wdrożeniowe.
    Wszystkie mogą trafić.

    Skutek jest widoczny po stronie administratora: skrypt zostaje
    zatrzymany w chwili uruchomienia. Zgłoszenie zwykle trafia we
    właściwą przyczynę, bo komunikat mówi o ochronie.

    Odpowiedzią jest przepisanie skryptu wprost. Jest to praca, ale praca
    warta wykonania niezależnie od reguły — skrypt czytelny łatwiej
    utrzymać, a przy zmianie autora jest to różnica rozstrzygająca.

    Odnotowuję zawodność w drugą stronę, bo uczciwość opisu tego wymaga.
    Reguła opiera się na ocenie i nie zatrzymuje wszystkiego, co zostało
    zaciemnione. Punkt ogranicza pole, a nie zamyka drogi.

    Czego to nie psuje: uruchamiania skryptów czytelnych, zadań
    zaplanowanych, narzędzi administracyjnych, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is scripts of one's own making.

    Techniques held to be a darkening are at times used in good faith. A command encoded so as to pass through a
    scheduled task without trouble over quotation marks; a name glued so as to shun a long line; text started out
    of memory, that being how the rollout tool works. All may be struck.

    The consequence shows upon the administrator's side: the script is stopped at the hour of starting. The report
    as a rule strikes the right cause, the message speaking of the protection.

    The answer is the writing of the script out plainly. It is work, but work worth doing whatever the rule - a
    readable script is the easier to keep up, and at a change of author that is a settling difference.

    I set down the unsureness the other way, honesty in the setting out calling for it. The rule rests upon a
    weighing and does not stop everything that has been darkened. The item bounds the field; it does not close the
    road.

    What this does not break: the starting of readable scripts, scheduled tasks, administrative tools, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - updates-and-servicing
  what_breaks:
    pl:
      - Polecenie zakodowane, żeby przejść przez zadanie zaplanowane bez kłopotu z cudzysłowami, bywa zatrzymane
      - Nazwa sklejana z kawałków i tekst uruchamiany z pamięci przez narzędzie wdrożeniowe trafiają tak samo
      - Skrypt zostaje zatrzymany w chwili uruchomienia, a komunikat mówi o ochronie, więc zgłoszenie trafia w przyczynę
      - Reguła opiera się na ocenie i nie zatrzymuje wszystkiego, co zaciemnione, więc ogranicza pole, a nie zamyka drogi
      - Uruchamianie skryptów czytelnych, zadania zaplanowane, narzędzia administracyjne i logowanie pozostają bez zmian
    en:
      - A command encoded so as to pass through a scheduled task without trouble over quotation marks is at times stopped
      - A name glued from pieces and text started out of memory by a rollout tool are struck the same way
      - The script is stopped at the hour of starting and the message speaks of the protection, so the report strikes the cause
      - The rule rests upon a weighing and does not stop everything darkened, so it bounds the field and does not close the road
      - The starting of readable scripts, scheduled tasks, administrative tools and logging on stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W użyciu są skrypty wdrożeniowe uruchamiające tekst z pamięci i nie da się ich przepisać przed zmianą
    en:
      - Rollout scripts starting text out of memory are in use and they cannot be written out plainly before the change
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = '5beb7efe-fd9a-4556-801d-275e5ffc04cc'
      # Where another product is in charge, these settings are written but idle,
      # so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = '5beb7efe-fd9a-4556-801d-275e5ffc04cc'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the mechanism reads this
    # entry as a string and a number written here is passed over in silence.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name '5beb7efe-fd9a-4556-801d-275e5ffc04cc' -Value '1' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Reguła domyka parę o skryptach i jest w całym bloku jedyną opartą na
    ocenie, a nie na zamkniętym powiązaniu czynności. Warto, żeby
    aplikacja to powiedziała, bo od tego zależy, czego się po niej
    spodziewać.

    Argument wart zachowania dotyczy odwrócenia pytania. Pozostałe reguły
    pytają, co wolno zrobić. Ta pyta, czy autor chciał, żeby dało się
    przeczytać, co robi. Jest to pytanie słabsze dowodowo, ale trafiające
    w cechę, której napastnik nie może porzucić bez kosztu.

    Odnotowuję zawodność, bo bez niej opis obiecuje więcej, niż reguła
    daje. Zaciemnianie proste przechodzi, kod nietypowy bywa zatrzymywany.
    Ocena średnia, a nie wysoka, bierze się właśnie stąd.
  en: |
    The rule closes the pair about scripts and is in the whole block the only one resting upon a weighing and not
    upon a closed joining of acts. It is well that the application say so, upon that hanging what may be looked
    for from it.

    The argument worth keeping touches the turning about of the question. The other rules ask what may be done.
    This asks whether the author wished it to be readable what they do. It is a question weaker in proof, but one
    striking at a mark the attacker cannot give up without cost.

    I set down the unsureness, without which the setting out promises more than the rule gives. Simple darkening
    passes; out-of-the-ordinary code is at times stopped. The middling weighing, and not a high one, comes of just
    that.
