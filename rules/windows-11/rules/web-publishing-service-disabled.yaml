id: win11-web-publishing-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa publikowania w sieci World Wide Web wyłączona
    en: The World Wide Web publishing service disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje serwer sieciowy: wystawia port, przyjmuje żądania
    i wykonuje to, co witryny na maszynie definiują — w tym kod aplikacji
    sieciowych.

    Na stacji roboczej to ostatnie zdanie wystarcza za całe uzasadnienie.
    Serwer sieciowy przyjmuje żądania od każdego, kto go osiągnie, i część
    z nich prowadzi do wykonania kodu. Jest to dokładnie ta klasa powierzchni,
    której na stanowisku nie ma powodu utrzymywać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony, zależy od tego,
    co na maszynie stoi — i tu leży sedno problemu. Serwer sieciowy na
    stanowisku rzadko jest doglądany: nikt nie zna listy jego witryn, nikt nie
    aktualizuje aplikacji, które na nim stanęły przy okazji testów, i nikt nie
    zauważy, że jedna z nich przyjmuje wysyłanie plików. Serwer
    niedoglądany jest gorszy niż serwer zły, bo o złym ktoś przynajmniej wie.

    Osobno liczy się to, że usługa startuje sama przy uruchomieniu maszyny.
    Witryna postawiona kiedyś na jeden dzień działa dalej latami, bez niczyjej
    decyzji, żeby tak było.
  en: |
    The service runs the web server: it puts out a port, takes requests and does what the
    sites on the machine define - including the code of web applications.

    On a workstation that last sentence is justification enough. A web server takes
    requests from anybody who reaches it, and some of them lead to code being run. That
    is exactly the class of surface there is no reason to keep at a station.

    What an attacker gains while the item goes unmet depends on what stands on the
    machine - and there lies the heart of the problem. A web server at a station is
    seldom watched over: nobody knows the list of its sites, nobody updates the
    applications that ended up on it during testing, and nobody will notice that one of
    them takes file uploads. An unwatched server is worse than a bad one, because of a
    bad one at least somebody knows.

    It counts separately that the service starts by itself when the machine starts. A
    site put up once for a single day goes on running for years, with nobody's decision
    that it should.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, co na maszynie jest wystawione — i jest to pytanie,
    na które trzeba odpowiedzieć przed wdrożeniem, a nie po.

    Na stanowisku biurowym serwera sieciowego zwykle nie ma i audyt zwróci
    wynik „nie dotyczy". Jeżeli usługa działa, warto ustalić dlaczego, bo bywa
    instalowana jako zależność narzędzi programistycznych albo starszych
    programów branżowych, a nie świadomie.

    Przypadek wymagający uwagi to programy branżowe z własnym interfejsem
    działającym przez przeglądarkę na tej maszynie. Część oprogramowania
    starszego rodzaju działa właśnie tak: instaluje serwer sieciowy, stawia na
    nim swój interfejs i otwiera go w przeglądarce pod adresem lokalnym.
    Wyłączenie usługi zabiera wtedy dostęp do programu w całości, a objawem
    jest pusta strona bez wskazania przyczyny.

    Drugi przypadek to stanowisko programisty, na którym serwer obsługuje
    tworzone aplikacje. Tam wyłączenie usługi przerywa pracę natychmiast.

    Przeglądanie stron w przeglądarce nie ma z tą usługą nic wspólnego
    i działa dalej. To nieporozumienie pojawia się przy ocenie tego punktu
    najczęściej.

    Zmiana wymaga zatrzymania usługi; połączenia otwarte do witryn tej maszyny
    zostaną zerwane.
  en: |
    What needs checking is what is put out on the machine - and it is a question to be
    answered before the rollout, not after.

    At an office station there is usually no web server and the audit will return "not
    applicable". If the service is running, it is worth establishing why, since it is
    sometimes installed as a dependency of programming tools or older line-of-business
    programs rather than deliberately.

    The case calling for care is line-of-business programs with an interface of their own
    working through a browser on this machine. Some software of an older kind works just
    so: it installs a web server, puts its interface on it and opens that in a browser at
    a local address. Disabling the service then takes away access to the program
    entirely, and the symptom is a blank page with no hint of the cause.

    The second case is a programmer's station where the server serves the applications
    being made. There, disabling the service breaks off work at once.

    Viewing pages in a browser has nothing to do with this service and carries on
    working. That misunderstanding comes up most often when this item is weighed.

    The change takes stopping the service; connections open to this machine's sites will
    be broken off.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Witryny obsługiwane przez tę maszynę przestają odpowiadać na żądania
      - Program branżowy z interfejsem otwieranym w przeglądarce pod adresem lokalnym przestaje działać
      - Stanowisko programisty traci serwer obsługujący tworzone aplikacje
      - Przeglądanie stron w przeglądarce działa dalej bez żadnej zmiany
    en:
      - Sites served by this machine stop answering requests
      - A line-of-business program with an interface opened in a browser at a local address stops working
      - A programmer's station loses the server serving the applications being made
      - Viewing pages in a browser carries on with no change at all
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Program branżowy udostępnia swój interfejs przez serwer sieciowy na tej maszynie
      - Stanowisko programisty korzysta z serwera do uruchamiania tworzonych aplikacji
      - Maszyna obsługuje witrynę, z której korzysta ktokolwiek poza nią
    en:
      - A line-of-business program offers its interface through the web server on this machine
      - A programmer's station uses the server to run the applications being made
      - The machine serves a site anybody outside it uses
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service breaks off connections open to sites this machine
    # serves.
    Stop-Service -Name 'W3SVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'W3SVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'W3SVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

notes:
  pl: |
    Przed wdrożeniem warto wypisać witryny zdefiniowane na maszynie razem
    z portami, na których nasłuchują. Lista mówi wprost, co przestanie
    odpowiadać, i bywa zaskakująca na stanowisku, na którym serwer znalazł się
    przypadkiem.

    Wyłączenie usługi zatrzymuje obsługę witryn, ale nie usuwa ich definicji
    ani plików. Po ponownym włączeniu usługi wszystko wraca w tym samym
    kształcie. Jeżeli celem jest trwałe zamknięcie tej drogi, właściwym krokiem
    jest odinstalowanie roli serwera sieciowego.

    Reguła dotyczy obsługi witryn. Zdalne zarządzanie konfiguracją serwera
    i usługa administracyjna serwera mają w tej paczce własne reguły
    i wyłącza się je niezależnie.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    Listing the sites defined on the machine, together with the ports they listen on, is
    worth doing before a rollout. The list says outright what will stop answering, and it
    is sometimes surprising at a station where the server turned up by accident.

    Disabling the service stops sites being served but removes neither their definitions
    nor their files. Once the service is switched on again everything comes back in the
    same shape. If the aim is to close this route for good, the right step is to
    uninstall the web server role.

    The rule concerns the serving of sites. Remote management of the server's
    configuration and the server's administrative service have rules of their own in this
    pack and are disabled independently.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
