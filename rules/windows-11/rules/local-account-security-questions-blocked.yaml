id: win11-local-account-security-questions-blocked

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Pytania pomocnicze do odzyskania hasła konta lokalnego zablokowane
    en: Helper questions for recovering a local account's password blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Konto lokalne zakładane na maszynie może mieć przypisane pytania pomocnicze:
    nazwa pierwszego zwierzęcia, miasto urodzenia, nazwisko panieńskie matki.
    Kto odpowie na nie z ekranu logowania, ten ustawia nowe hasło — bez znajomości
    starego i bez udziału kogokolwiek.

    Jest to mechanizm odzyskiwania, który w całości omija hasło, a opiera się na
    danych, które w większości przypadków nie są tajne. Miasto urodzenia
    i nazwisko panieńskie matki bywają w dokumentach, w serwisach
    społecznościowych i po prostu w pamięci współpracowników. Odpowiedzi nie
    da się też zmienić tak jak hasła — data urodzenia zostaje ta sama na zawsze.

    Skutek jest taki, że siła zabezpieczenia konta przestaje zależeć od hasła
    i zaczyna zależeć od tego, jak trudno zgadnąć trzy fakty z życiorysu. Kto ma
    dostęp do klawiatury — kolega z biura, ktoś przy stanowisku bez nadzoru,
    ktoś, kto maszynę ukradł — ten ma drogę do konta, a wraz z nią do wszystkiego,
    co na nim jest, łącznie z poświadczeniami zapisanymi w magazynie.

    Punkt zabiera tę drogę. Odzyskanie hasła konta lokalnego wraca do rąk
    administratora.
  en: |
    A local account set up on the machine can have helper questions attached: the name
    of a first pet, the town of birth, a mother's maiden name. Whoever answers them
    from the sign-in screen sets a new password - without knowing the old one and with
    nobody else taking part.

    It is a recovery mechanism that bypasses the password entirely and rests on data
    that in most cases is not secret. A town of birth and a mother's maiden name turn
    up in documents, on social sites and simply in colleagues' memories. Nor can the
    answers be changed the way a password can - a date of birth stays the same for
    good.

    The effect is that an account's strength stops depending on its password and
    starts depending on how hard three facts from a life story are to guess. Whoever
    reaches the keyboard - a colleague from the office, somebody at an unattended
    station, somebody who has stolen the machine - has a route into the account, and
    with it into everything on it, the credentials kept in the store included.

    The item takes that route away. Recovering a local account's password goes back
    into an administrator's hands.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynach pracuje się na kontach lokalnych
    i kto odzyskuje hasło, gdy użytkownik je zapomni.

    Na stanowisku w domenie albo obsługiwanym kontem zarządzanym centralnie
    zmiana nie zmienia nic — pytania pomocnicze dotyczą wyłącznie kont
    zakładanych na samej maszynie.

    Tam, gdzie konta są lokalne, znika samoobsługa. Użytkownik, który zapomni
    hasła, nie odzyska go sam z ekranu logowania; potrzebny jest administrator
    z innym kontem na tej maszynie. Jeżeli takiego konta nie ma — a na
    stanowiskach jednoosobowych bywa, że nie ma — jedyną drogą pozostaje
    ponowna instalacja systemu wraz z utratą danych. Jest to najpoważniejszy
    skutek tego punktu i właśnie dlatego trzeba go rozważyć przed wdrożeniem,
    a nie po.

    Wdrożenie ma sens wtedy, gdy jest na czym je oprzeć: drugie konto
    administracyjne, hasło w zarządzanym magazynie albo obsługa zgłoszeń, która
    hasło ustawi. Bez tego punkt zamienia jedno ryzyko na inne.

    Pytania ustawione wcześniej przestają działać. Odpowiedzi pozostają zapisane
    i wrócą do użycia po wycofaniu punktu.

    Nie ma restartu.
  en: |
    What needs checking is whether the machines are worked on local accounts and who
    recovers a password when a user forgets it.

    At a station in a domain or served by a centrally managed account the change
    changes nothing - helper questions concern accounts set up on the machine itself
    alone.

    Where the accounts are local, self-service disappears. A user who forgets their
    password will not recover it themselves from the sign-in screen; an administrator
    with another account on that machine is needed. If there is no such account - and
    at single-person stations there sometimes is not - the only way left is
    reinstalling the system along with losing the data. It is this item's gravest
    effect and exactly why it has to be weighed before the rollout rather than after.

    The rollout makes sense where there is something to rest it on: a second
    administrative account, a password in a managed store, or a service desk that will
    set a password. Without that the item trades one risk for another.

    Questions set earlier stop working. The answers stay recorded and will come back
    into use once the item is undone.

    There is no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Użytkownik konta lokalnego przestanie odzyskiwać zapomniane hasło z ekranu logowania
      - Pytania pomocnicze ustawione wcześniej przestaną działać, choć odpowiedzi zostają zapisane
      - Zakładanie nowego konta lokalnego przestanie prosić o ustawienie pytań
      - Konta domenowe i zarządzane centralnie nie zmieniają zachowania
    en:
      - A local account's user stops recovering a forgotten password from the sign-in screen
      - Helper questions set earlier stop working, though the answers stay recorded
      - Setting up a new local account stops asking for questions to be set
      - Domain and centrally managed accounts do not change behaviour
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie jest jedno konto lokalne i nie ma drugiego konta administracyjnego
      - Nie ma obsługi zgłoszeń ani magazynu haseł, z którego da się hasło odzyskać
    en:
      - The machine has one local account and no second administrative account
      - There is no service desk and no password store a password can be recovered from
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'NoLocalPasswordResetQuestions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'NoLocalPasswordResetQuestions'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoLocalPasswordResetQuestions' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/

notes:
  pl: |
    Punkt dotyczy wyłącznie kont zakładanych na maszynie. Kont domenowych
    i zarządzanych centralnie nie obejmuje w ogóle, więc na stanowisku w domenie
    jego wdrożenie jest tanie i bezobjawowe — co nie znaczy, że zbędne: konto
    lokalne na takiej maszynie zwykle istnieje, bywa administracyjne i właśnie
    ono jest tu stawką.

    Zablokowanie pytań nie kasuje odpowiedzi zapisanych wcześniej. Jeżeli powodem
    wdrożenia jest podejrzenie, że ktoś odpowiedzi poznał, samo wdrożenie nie
    wystarczy — trzeba zmienić hasło konta, a odpowiedzi wyczyścić osobno,
    zakładając je na nowo po chwilowym wycofaniu punktu.

    Wycofanie nie usuwa gałęzi — jest wspólna z kilkunastoma innymi ustawieniami
    zasad systemowych.
  en: |
    The item concerns accounts set up on the machine alone. It does not touch domain
    or centrally managed accounts at all, so at a station in a domain applying it is
    cheap and without symptoms - which does not make it needless: a local account on
    such a machine usually exists, is often an administrative one, and it is exactly
    what is at stake here.

    Blocking the questions does not delete answers recorded earlier. Where the reason
    for applying it is a suspicion that somebody has learned the answers, applying it
    is not enough on its own - the account's password has to be changed and the
    answers cleared separately, by setting them anew after briefly undoing the item.

    Rollback does not remove the key - it is shared with a dozen or so other system
    policy settings.
