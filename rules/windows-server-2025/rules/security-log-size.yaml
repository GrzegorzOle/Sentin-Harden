id: win2025-security-log-size

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Security
  title:
    pl: Maksymalny rozmiar dziennika zabezpieczeń
    en: Maximum size of the security log
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ustala dolną granicę rozmiaru dziennika zabezpieczeń. Dziennik
    ten zbiera zapisy logowań, użycia uprawnień i zmian w kontach.

    Podnoszę kategorię wobec oceny dla stacji roboczej i powód jest
    jeden, ale rozstrzygający: liczy się nie rozmiar dziennika, tylko
    okres, jaki ten dziennik obejmuje. Na stacji roboczej jeden
    użytkownik loguje się raz dziennie, więc dziennik tej wielkości sięga
    wstecz o miesiące. Na serwerze — kontrolerze domeny, serwerze plików,
    maszynie z setkami sesji i kontami usługowymi pukającymi co minutę —
    ten sam rozmiar potrafi obejmować dobę, a bywa że kilka godzin.

    Skutek jest taki, że dziennik, na który patrzy się po zdarzeniu,
    zaczyna się już po tym zdarzeniu. Incydent zauważony w poniedziałek
    rano, a rozpoczęty w piątek wieczorem, nie ma czym zostać opisany:
    zapisy istniały, ale zostały nadpisane, zanim ktokolwiek po nie
    sięgnął. Nie jest to utrata dziennika, którą widać. Dziennik jest,
    otwiera się i wygląda normalnie — po prostu nie sięga tam, gdzie
    trzeba spojrzeć.

    Liczba z benchmarku jest dolną granicą, a nie wartością docelową,
    i chcę to powiedzieć wprost, bo dla serwera jest to różnica
    praktyczna. Właściwe pytanie nie brzmi „czy mam wymagane megabajty",
    tylko „ile dni obejmuje mój dziennik" — a to da się zmierzyć,
    zaglądając do najstarszego zapisu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dziennik
    nadpisujący się szybciej, niż ktokolwiek zdąży zauważyć, że stało
    się coś wartego obejrzenia — czyli brak śladów bez kasowania śladów.
  en: |
    The item sets the lower bound of the size of the security log. That log gathers the writings of
    signings-in, of the use of leaves and of changes in standings.

    I raise the category against the reckoning for a workstation, and the ground is one but it settles
    the matter - what tells is not the size of the log but the span of time that log holds. Upon a
    workstation one user signs in once a day, so a log of that bigness reaches back by months. Upon a
    server - a warden of the household, a server of files, a machine with hundreds of sessions and with
    standings of workings knocking every minute - that same size may hold a day and now and then a few
    hours.

    The outcome is that the log one looks at after a happening begins after that happening. A breaking
    marked on a Monday morning and begun on a Friday evening has nothing wherewith to be told of - the
    writings were there, but they were written over before anybody reached for them. It is no loss of a
    log that may be seen. The log is there, it opens and it looks as it should - only it reaches not
    back to where one must look.

    The number from the benchmark is a lower bound and no goal, and I would say it outright, it being
    for a server an unlikeness of practice. The right question is not "have I the asked-for megabytes"
    but "how many days does my log hold" - and that may be measured by looking into the oldest writing.

    What an attacker gains while the item goes unmet - a log writing itself over faster than anybody
    can mark that something worth the looking at befell; that is, a want of traces without the wiping
    of traces.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości". Zwiększenie dolnej granicy
    rozmiaru dziennika nie zatrzymuje żadnej usługi, nie wymaga
    wylogowania ani restartu i nie zmienia niczego w tym, co użytkownicy
    widzą.

    Jedyny koszt jest w miejscu na dysku i przy wartościach z benchmarku
    jest on nieistotny — idzie o setki megabajtów na woluminie
    systemowym. Nie umiem wskazać serwera, na którym ta zmiana
    wypełniłaby dysk, i dlatego zostawiam klasę bez zmian.

    Z czym innym jest natomiast dobranie rozmiaru do faktycznego ruchu
    na maszynie, o którym piszę wyżej. To wykracza poza tę regułę i tam
    miejsce na dysku bywa już realnym ograniczeniem — na kontrolerze
    domeny sensowny dziennik zabezpieczeń liczy się w gigabajtach.
    Planując taką zmianę, warto spojrzeć na wolumin systemowy wcześniej,
    a nie po fakcie.

    Zmiana cofa się natychmiast. Zmniejszenie rozmiaru z powrotem nie
    odzyskuje zapisów, które w międzyczasie zostały nadpisane, ale
    zapisów już zebranych nie kasuje.
  en: |
    I leave the class "no unease". The raising of the lower bound of the size of a log stops no service,
    takes neither a signing-out nor a starting anew, and alters nothing in what the users see.

    The only cost is in room upon the disk, and at the worths from the benchmark it is of no weight -
    it goes in hundreds of megabytes upon the roll of the system. I can name no server whereon that
    change would fill the disk, and therefore I leave the class as it stands.

    Another matter is the choosing of the size to the true traffic upon the machine, whereof I write
    above. That goes beyond this rule, and there the room upon the disk is at times a true bound - upon
    a warden of the household a security log of sense is reckoned in gigabytes. In the planning of such
    a change it is worth looking at the roll of the system beforehand and not after the fact.

    The change is undone at once. The lowering of the size back again wins not back the writings that
    were written over in the meanwhile, but it wipes not those already gathered.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Zajęte zostaje dodatkowe miejsce na woluminie systemowym, przy wartościach z benchmarku rzędu setek megabajtów
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
      - Cofnięcie zmiany nie odzyskuje zapisów nadpisanych w międzyczasie, choć zebranych nie kasuje
      - Dobranie rozmiaru do faktycznego ruchu wykracza poza tę regułę i tam miejsce na dysku bywa realnym ograniczeniem
    en:
      - Further room upon the roll of the system is taken, at the worths from the benchmark of the order of hundreds of megabytes
      - Nothing here takes a break or a starting anew, a worth being written into the rule
      - The undoing of the change wins not back the writings written over in the meanwhile, though it wipes not those gathered
      - The choosing of the size to the true traffic goes beyond this rule, and there the room upon the disk is at times a true bound
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wolumin systemowy jest wymierzony bardzo ciasno i nie ma na nim zapasu na dziennik tej wielkości
    en:
      - The roll of the system is meted out very tightly and there is upon it no store for a log of that bigness
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        # No policy set - report what the log service is actually using, so the
        # number in the report describes the machine rather than the policy.
        $log = Get-WinEvent -ListLog Security -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '196608'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is a floor, not a target. On a busy server it can still amount to
    # hours of history - measure the span by reading the oldest record in the
    # log and size it against that.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 196608 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/view-the-security-event-log

notes:
  pl: |
    Liczy się nie rozmiar dziennika, tylko okres, jaki obejmuje. Na
    stacji roboczej ten rozmiar sięga wstecz o miesiące; na kontrolerze
    domeny albo serwerze plików potrafi obejmować dobę, a bywa że kilka
    godzin.

    Utrata nie jest widoczna: dziennik jest, otwiera się i wygląda
    normalnie — po prostu nie sięga tam, gdzie trzeba spojrzeć. Brak
    śladów bez kasowania śladów.

    Liczba z benchmarku jest dolną granicą, nie wartością docelową.
    Właściwe pytanie brzmi „ile dni obejmuje mój dziennik" i da się je
    zmierzyć, zaglądając do najstarszego zapisu.
  en: |
    What tells is not the size of the log but the span it holds. Upon a workstation that size reaches
    back by months; upon a warden of the household or a server of files it may hold a day and now and
    then a few hours.

    The loss is not to be seen - the log is there, it opens and looks as it should, only it reaches not
    back to where one must look. A want of traces without the wiping of traces.

    The number from the benchmark is a lower bound and no goal. The right question is "how many days
    does my log hold", and it may be measured by looking into the oldest writing.
