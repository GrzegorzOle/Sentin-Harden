id: win2025-laps-password-complexity

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Złożoność losowanego hasła lokalnego administratora pełna
    en: Full complexity of the randomly chosen local administrator password
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt każe losować hasło lokalnego administratora z pełnego zbioru
    znaków — wielkie i małe litery, cyfry i znaki przestankowe. Niższe
    wartości zawężają ten zbiór.

    Zostawiam kategorię średnią i chcę uczciwie powiedzieć, że to jest
    najmniej samodzielny punkt w całej grupie LAPS. Nie zamyka żadnej
    drogi, nie zmienia niczyjej pracy i sam z siebie nie broni przed
    niczym konkretnym. Robi jedną rzecz: powiększa zbiór, z którego
    maszyna losuje, czyli podnosi koszt zgadywania.

    Warto jednak zauważyć, że zwykły argument przeciwko złożoności tutaj
    w ogóle nie obowiązuje. Zwykle mówi się, że znaki przestankowe
    utrudniają ludziom zapamiętanie hasła i skłaniają do zapisywania go na
    kartce. Tego hasła nikt nie zapamiętuje, bo nikt nie ma po co — jest
    losowane przez maszynę i kopiowane z katalogu w chwili użycia.
    Złożoność jest tu więc darmowa, a rzeczy darmowe bierzemy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: mniejszy
    zbiór, z którego losowane jest hasło konta otwierającego maszynę
    niezależnie od stanu katalogu.
  en: |
    The item calls for the local administrator password to be drawn from
    the full set of characters - capitals, lower case, digits and
    punctuation. Lower values narrow that set.

    I keep the category medium and want to say honestly that this is the
    least self-standing item in the whole LAPS group. It closes no route,
    changes nobody's work, and defends by itself against nothing in
    particular. It does one thing: it enlarges the set the machine draws
    from, which raises the cost of guessing.

    It is worth noticing, though, that the usual argument against
    complexity does not apply here at all. The usual claim is that
    punctuation makes passwords harder to remember and encourages people to
    write them on a card. Nobody remembers this password, because nobody
    has any reason to - it is chosen by the machine and copied from the
    directory at the moment of use. Complexity is therefore free here, and
    free things we take.

    What an attacker gains while the item goes unmet: a smaller set from
    which the password is drawn for an account that opens the machine
    regardless of the directory's state.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", ale jeden konkretny przypadek trzeba nazwać,
    bo jest serwerowy i nie występuje na stacji roboczej.

    Do serwera wchodzi się czasem przez konsolę poza systemem, udostępnianą
    przez kontroler zarządzania — i to jest dokładnie ta droga, z której
    korzysta się wtedy, gdy hasło lokalnego administratora jest w ogóle
    potrzebne. Takie konsole bywają ograniczone: mają własne odwzorowanie
    klawiatury, nie przyjmują wklejenia i gubią część znaków
    przestankowych. Hasło z pełnego zbioru potrafi się na takiej drodze nie
    dać wpisać, a objaw wygląda jak hasło błędne.

    To nie jest powód, żeby zawężać zbiór znaków — to jest powód, żeby
    sprawdzić tę drogę przed pierwszą awarią, a nie w jej trakcie.
    Konsolę zdalną warto przetestować faktycznym zalogowaniem z użyciem
    bieżącego hasła; jeżeli przechodzi, sprawa jest zamknięta.

    Poza tym przypadkiem zmiana jest niewidoczna. Nowa złożoność dotyczy
    hasła losowanego po niej, więc skutek pojawia się przy najbliższej
    zmianie hasła, nie od razu.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption", but one specific case has to be named,
    because it belongs to servers and does not occur on a workstation.

    A server is sometimes entered through an out-of-band console provided
    by the management controller - and that is exactly the route used when
    the local administrator password is needed at all. Such consoles are
    often limited: they have their own keyboard mapping, refuse pasting,
    and drop some punctuation. A password from the full set can turn out to
    be untypable on that route, and the symptom looks like a wrong
    password.

    This is not a reason to narrow the character set - it is a reason to
    check that route before the first failure rather than during it. The
    remote console is worth testing by actually signing in with the current
    password; if it goes through, the matter is closed.

    Beyond that case the change is invisible. The new complexity concerns
    the password drawn after it, so the effect appears at the next password
    change rather than at once.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Konsola poza systemem udostępniana przez kontroler zarządzania bywa ograniczona i gubi część znaków przestankowych
      - Hasła z pełnego zbioru potrafi się na takiej drodze nie dać wpisać, a objaw wygląda jak hasło błędne
      - Jest to zarazem ta droga, z której korzysta się wtedy, gdy hasło lokalnego administratora jest w ogóle potrzebne
      - Skutek pojawia się dopiero przy najbliższej zmianie hasła, bo dotyczy hasła losowanego po zmianie
    en:
      - The out-of-band console provided by the management controller is often limited and drops some punctuation
      - A password from the full set can be untypable on that route, and the symptom looks like a wrong password
      - That is also the route used when the local administrator password is needed at all
      - The effect appears only at the next password change, because it concerns the password drawn afterwards
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Konsola poza systemem nie przyjmuje znaków przestankowych, a jest jedyną drogą wejścia przy awarii i nie sprawdzono zamiennika
    en:
      - The out-of-band console does not accept punctuation, is the only way in during a failure, and no replacement has been checked
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Four names the full set of characters; lower numbers narrow it.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordComplexity'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordComplexity' -ErrorAction SilentlyContinue).'PasswordComplexity'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordComplexity'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Before this, sign in once through the out-of-band console using the
    # current password. Those consoles have their own keyboard mapping and
    # sometimes drop punctuation, and the symptom then looks like a wrong
    # password on the one route used during a failure.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordComplexity' -Value 4 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Najmniej samodzielny punkt w całej grupie LAPS i mówię to wprost.
    Nie zamyka drogi, nie zmienia pracy, podnosi tylko koszt zgadywania.

    Zwykły argument przeciwko złożoności tutaj nie obowiązuje: tego hasła
    nikt nie zapamiętuje, bo jest losowane przez maszynę i kopiowane
    z katalogu w chwili użycia. Złożoność jest darmowa.

    Przypadek serwerowy do sprawdzenia: konsola poza systemem przez
    kontroler zarządzania bywa ograniczona i gubi znaki przestankowe.
    To zarazem ta droga, z której korzysta się wtedy, gdy hasło jest w ogóle
    potrzebne — warto ją przetestować przed pierwszą awarią.
  en: |
    The least self-standing item in the whole LAPS group, and I say so
    plainly. It closes no route, changes no work, and only raises the cost
    of guessing.

    The usual argument against complexity does not apply here: nobody
    remembers this password, because it is chosen by the machine and copied
    from the directory at the moment of use. Complexity is free.

    The server case to check: the out-of-band console through the
    management controller is often limited and drops punctuation. That is
    also the route used when the password is needed at all - worth testing
    before the first failure.
