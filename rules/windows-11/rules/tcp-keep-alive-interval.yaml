id: win11-tcp-keep-alive-interval

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Odstęp między pakietami podtrzymującymi połączenie skrócony
    en: The interval between connection keep-alive packets shortened
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Połączenie sieciowe, przez które nic nie płynie, z punktu widzenia obu stron
    wygląda tak samo jak połączenie żywe. Żeby je odróżnić, system co jakiś czas
    wysyła pakiet podtrzymujący i czeka na odpowiedź. Brak odpowiedzi kończy
    połączenie.

    Odstęp domyślny wynosi dwie godziny. Tyle właśnie czasu maszyna trzyma
    połączenie, o którym druga strona dawno zapomniała — wraz z przypisanymi mu
    zasobami i wraz z jego miejscem w tablicy połączeń.

    Daje to dwie rzeczy, obie niewielkie i obie prawdziwe. Pierwsza to zasoby:
    połączenia porzucone gromadzą się przez dwie godziny, a to jest dokładnie
    ten zapas, na którym opiera się zalewanie maszyny połączeniami
    nienawiązanymi do końca. Druga to okno: przez te dwie godziny połączenie
    pozostaje w stanie, w którym ktoś, kto przejmie drogę sieciową albo adres
    porzucony przez klienta, może je podjąć zamiast właściciela.

    Punkt skraca odstęp do pięciu minut. Maszyna dowiaduje się o śmierci
    połączenia dwadzieścia cztery razy szybciej.
  en: |
    A network connection with nothing flowing through it looks, to both sides, exactly
    like a live one. To tell them apart, the system sends a keep-alive packet every so
    often and waits for an answer. No answer ends the connection.

    The default interval is two hours. That is how long the machine keeps a connection
    the other side forgot about long ago - along with the resources tied to it and its
    place in the connection table.

    That gives two things, both small and both real. The first is resources: abandoned
    connections pile up for two hours, and that is exactly the reserve that flooding a
    machine with half-made connections rests on. The second is a window: through those
    two hours the connection stays in a state where somebody taking over the network
    path or the address the client has abandoned can pick it up in the owner's place.

    The item shortens the interval to five minutes. The machine learns of a
    connection's death twenty-four times faster.

disruption_description:
  pl: |
    Zmiana zaczyna obowiązywać dopiero po ponownym uruchomieniu maszyny i z tego
    powodu wymaga świadomego wdrożenia, nawet jeżeli sam jej koszt jest
    niewielki.

    Co się zmienia na co dzień: przez połączenia bezczynne zaczyna płynąć ruch
    co pięć minut zamiast co dwie godziny. Są to pakiety pojedyncze
    i pomijalne w każdej sieci stacjonarnej. Odczuwalne bywają w dwóch
    miejscach: na łączu rozliczanym za przesłane dane, gdzie liczy się każdy
    pakiet, i na komputerze przenośnym pracującym na baterii, gdzie ruch co
    pięć minut nie pozwala układowi sieciowemu zejść do stanu oszczędnego na
    dłużej.

    Skutek uboczny bywa odwrotny do spodziewanego i warto o nim wiedzieć:
    krótszy odstęp utrzymuje przy życiu przejścia w urządzeniach
    translujących adresy, które same zamykają bezczynne połączenia po
    kilkunastu minutach. Połączenia zrywające się dotąd „same z siebie" po
    wdrożeniu bywają trwalsze.

    Nic nie przestaje działać i nikt nie traci żadnej funkcji.

    Wymagane jest ponowne uruchomienie maszyny.
  en: |
    The change takes effect only once the machine is restarted, and for that reason it
    calls for a deliberate rollout even though its own cost is small.

    What changes day to day: traffic starts flowing through idle connections every
    five minutes instead of every two hours. These are single packets, negligible on
    any fixed network. They can be felt in two places: on a link charged by data sent,
    where every packet counts, and on a portable computer running on battery, where
    traffic every five minutes keeps the network chip from settling into its saving
    state for long.

    The side effect can be the opposite of what is expected and is worth knowing:
    a shorter interval keeps alive the mappings in address-translating devices, which
    close idle connections themselves after a quarter of an hour or so. Connections
    that used to drop "of their own accord" can be steadier after the rollout.

    Nothing stops working and nobody loses any function.

    A restart of the machine is required.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Przez połączenia bezczynne zaczyna płynąć ruch co pięć minut zamiast co dwie godziny
      - Na łączu rozliczanym za przesłane dane rośnie liczba pakietów w tle
      - Komputer przenośny na baterii rzadziej schodzi do stanu oszczędnego układu sieciowego
      - Połączenia przez urządzenia translujące adresy bywają po zmianie trwalsze, a nie krótsze
    en:
      - Traffic starts flowing through idle connections every five minutes instead of every two hours
      - On a link charged by data sent the number of background packets grows
      - A portable computer on battery settles into its network saving state less often
      - Connections through address-translating devices can be steadier after the change rather than shorter
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje na łączu rozliczanym za każdy przesłany pakiet
      - Stanowisko nie może być ponownie uruchomione w przewidywalnym terminie
    en:
      - The machine works on a link charged for every packet sent
      - The station cannot be restarted within a foreseeable time
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The value is given in milliseconds; five minutes is three hundred
      # thousand and anything lower is compliant as well.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
      $name = 'KeepAliveTime'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '300000'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'
    $name = 'KeepAliveTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' `
      -Name 'KeepAliveTime' -Value 300000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/description-tcp-features

notes:
  pl: |
    Brak wpisu znaczy, że obowiązuje wartość domyślna, czyli dwie godziny.
    Reguła traktuje brak jako niezgodność, bo domyślna wartość jest właśnie tą,
    którą punkt zmienia.

    Wpis dotyczy wyłącznie połączeń, dla których podtrzymywanie zostało włączone
    przez program je nawiązujący. Nie jest to więc ustawienie obejmujące cały
    ruch maszyny, tylko górne ograniczenie dla tych połączeń, które o
    podtrzymywanie poprosiły.

    Gałąź parametrów stosu sieciowego jest wspólna dla kilku punktów tej paczki,
    więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    A missing entry means the default holds, that is two hours. The rule counts a
    missing entry as a deviation, because the default is exactly what the item
    changes.

    The entry concerns only connections for which keep-alive has been switched on by
    the program making them. So it is not a setting covering all of the machine's
    traffic, but an upper bound for those connections that asked for keep-alive.

    The network stack's parameters key is shared by several items in this pack, so
    rollback removes the entry alone.
