id: win10-defender-maps-local-override-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS
  title:
    pl: Lokalne nadpisanie ustawień zgłaszania do usługi rozpoznawania zablokowane
    en: Local overriding of the reporting settings for the recognition service blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że zgłaszanie do usługi rozpoznawania rozstrzyga
    zasada, a nie przełącznik dostępny na maszynie.

    Punkt ten nie dokłada żadnej ochrony. Pilnuje tego, żeby ochrona
    ustawiona wcześniej nie została zdjęta jednym kliknięciem. Bez niego
    wartość wpisana zasadą jest propozycją, którą użytkownik z odpowiednimi
    uprawnieniami odwołuje z okna ustawień.

    Wartość reguły bierze się z tego, jak wygląda raport. Punkt o ochronie
    dostarczanej z chmury pokazuje stan zgodny, bo zasada ma właściwą
    wartość — a maszyna i tak nie pyta, bo ustawienie lokalne mówi
    inaczej. Jest to rozbieżność między raportem a stanem faktycznym,
    czyli dokładnie to, czego raport ma nie robić.

    Odnotowuję zasięg: punkt dotyczy wyłącznie zgłaszania do usługi
    rozpoznawania. Pozostałe ustawienia ochrony mają własne przełączniki
    i własne punkty.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wyłączenie
    zapytań do usługi rozpoznawania bez dotykania zasady, przy raporcie
    pokazującym stan zgodny.
  en: |
    The setting makes it so that the reporting to the recognition service is settled by the policy and not by a
    switch to be had upon the machine.

    This item adds no protection. It watches that protection set earlier be not taken away by one click. Without
    it the value written by the policy is a proposal, which a user with the fitting rights recalls from the
    window of settings.

    The rule's worth comes of how the report looks. The item about cloud-delivered protection shows a compliant
    state, the policy holding the right value - and the machine still does not ask, the local setting saying
    otherwise. It is a parting of the report from the state of the thing, which is to say just what a report is
    not to do.

    I set down the reach: the item touches the reporting to the recognition service alone. The other settings of
    the protection have switches of their own and items of their own.

    What an attacker gains while the item goes unmet: the switching off of the askings of the recognition service
    without touching the policy, the report showing a compliant state.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś tego przełącznika używa.

    Zmiana odbiera możliwość wyłączenia zgłaszania z poziomu maszyny.
    Użytkownik, który dotąd wyłączał je na czas pracy bez sieci albo na
    czas testów, przestanie móc to zrobić. Przełącznik w oknie ustawień
    pozostaje widoczny, ale nie działa.

    Odnotowuję, że dotyczy to również obsługi. Rozwiązywanie problemów
    przez wyłączenie zgłaszania i sprawdzenie, czy to ono spowalnia pracę,
    przestaje być możliwe bez zmiany zasady.

    Sprawdzić trzeba wobec tego dwie rzeczy: czy zgłaszanie do usługi
    rozpoznawania jest w ogóle włączone zasadą i czy ktoś na tej maszynie
    ma powód, żeby je wyłączać. Punkt ustawiony przy zgłaszaniu wyłączonym
    zasadą utrwala stan gorszy, a nie lepszy.

    Czego to nie psuje: pracy ochrony, wykrywania zagrożeń, pracy bez
    sieci, logowania, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses that switch.

    The change takes away the power to switch the reporting off from the machine. A user who until now switched
    it off for the time of work without a network, or for the time of tests, will cease to be able to do so. The
    switch in the window of settings stays in sight but does not work.

    I set down that it touches the support as well. The solving of a trouble by switching the reporting off and
    seeing whether it is that which slows the work ceases to be possible without a change of the policy.

    Two things therefore have to be reviewed: whether the reporting to the recognition service is switched on by
    the policy at all, and whether anybody upon this machine has a ground for switching it off. The item set with
    the reporting switched off by the policy fastens the worse state and not the better.

    What this does not break: the protection's working, the finding of threats, work without a network, logging
    on, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Przełącznik w oknie ustawień pozostaje widoczny, ale przestaje działać, więc użytkownik uzna go za zepsuty
      - Wyłączenie zgłaszania na czas pracy bez sieci albo na czas testów przestaje być możliwe
      - Obsługa traci sposób na sprawdzenie, czy to zgłaszanie spowalnia pracę, bez zmiany zasady
      - Punkt ustawiony przy zgłaszaniu wyłączonym zasadą utrwala stan gorszy, a nie lepszy
      - Praca ochrony, wykrywanie zagrożeń, praca bez sieci, logowanie i drukowanie pozostają bez zmian
    en:
      - The switch in the window of settings stays in sight but ceases to work, so the user will hold it broken
      - The switching off of the reporting for the time of work without a network, or of tests, ceases to be possible
      - The support loses its means of seeing whether it is the reporting that slows the work, short of a change of the policy
      - The item set with the reporting switched off by the policy fastens the worse state and not the better
      - The protection s working, the finding of threats, work without a network, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zgłaszanie do usługi rozpoznawania jest wyłączone zasadą i zamknięcie nadpisania utrwali ten stan
    en:
      - The reporting to the recognition service is switched off by the policy and the closing of the override will fasten that state
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means the local setting may not override the policy.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'LocalSettingOverrideSpynetReporting'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'LocalSettingOverrideSpynetReporting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A zero closes the local override off. From this moment the policy value is
    # the one that counts.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LocalSettingOverrideSpynetReporting' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus

notes:
  pl: |
    Reguła nie dokłada ochrony i warto, żeby aplikacja powiedziała to
    wprost. Pilnuje wyłącznie tego, żeby ochrona ustawiona gdzie indziej
    nie została zdjęta z poziomu maszyny.

    Argument wart zachowania dotyczy raportu. Bez tego punktu raport
    potrafi pokazać stan zgodny przy maszynie, która nie pyta usługi
    o nic — bo zasada mówi swoje, a ustawienie lokalne swoje. Rozbieżność
    między raportem a stanem jest kosztem większym niż brak samego
    mechanizmu, bo odbiera zaufanie do całej listy.

    Odnotowuję kolejność wdrożenia. Ten punkt ma sens wyłącznie po
    ustawieniu zgłaszania zasadą. Zamknięty przy zgłaszaniu wyłączonym
    utrwala stan, którego nikt nie chciał — i jest to jedyny sposób,
    w jaki ta reguła może zaszkodzić.
  en: |
    The rule adds no protection and it is well that the application say so outright. It watches only that
    protection set elsewhere be not taken away from the machine.

    The argument worth keeping touches the report. Without this item the report can show a compliant state upon a
    machine that asks the service nothing - the policy saying its own and the local setting its own. A parting of
    the report from the state is a cost greater than the want of the mechanism itself, taking away trust in the
    whole list.

    I set down the order of the rollout. This item makes sense only after the reporting has been set by the
    policy. Closed with the reporting switched off it fastens a state nobody wanted - and that is the one way in
    which this rule can do harm.
