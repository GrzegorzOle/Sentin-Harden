id: win2025-messaging-cloud-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Messaging
  title:
    pl: Przenoszenie wiadomości tekstowych poza maszynę wyłączone
    en: Carrying text messages beyond the machine disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza przenoszenie wiadomości tekstowych poza maszynę — kopiowanie
    ich do magazynu w chmurze, z którego trafiają na inne urządzenia
    tej samej osoby.

    Kategoria wysoka i powód jest jeden, za to rozstrzygający. Wiadomość
    tekstowa jest dziś w wielu miejscach drugim składnikiem logowania. Kody
    potwierdzające wysyłane przy logowaniu do bankowości, do paneli
    dostawców, do usług organizacji przychodzą właśnie tą drogą. Wszystko,
    co kopiuje takie wiadomości gdzie indziej, kopiuje tym samym kody, które
    miały nie opuszczać jednego urządzenia.

    To jest właściwa treść punktu. Drugi składnik logowania ma sens, dopóki
    jest osobny. Kiedy wiadomości wędrują do magazynu dostępnego przez
    konto, przejęcie tego konta daje jednocześnie hasło i to, co miało być
    zabezpieczeniem na wypadek jego utraty.

    Na serwerze mechanizm jest w praktyce nieobecny — nie ma tu ani karty
    sieci komórkowej, ani aplikacji wiadomości. Punkt zostaje mimo to,
    z dwóch powodów: maszyna wirtualna może dostać urządzenie od gospodarza,
    a wyjątki robione „bo to i tak nieobecne" są tym, przez co lista
    wyjątków przestaje być znana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    kodów potwierdzających z poziomu przejętego konta w chmurze, bez
    dotykania urządzenia, na które przyszły.
  en: |
    The item disables the carrying of text messages beyond the machine -
    their copying into cloud storage, from which they reach the same person's
    other devices.

    The category is high, and the reason is single but decisive. A text
    message is today, in many places, the second factor of signing in.
    Confirming codes sent when signing in to banking, to providers' panels,
    to the organisation's services come by exactly this road. Anything that
    copies such messages elsewhere copies with them the codes that were meant
    never to leave one device.

    That is the real substance of the item. A second factor makes sense as
    long as it is separate. Once messages travel to storage reachable through
    an account, capturing that account gives at once the password and the
    thing meant to protect against its loss.

    On a server the mechanism is in practice absent - there is neither a
    mobile network card here nor a messaging application. The item stays
    nonetheless, for two reasons: a virtual machine may be given a device by
    its host, and exceptions made "since it is absent anyway" are what stops
    a list of exceptions from being known.

    What an attacker gains while the item goes unmet: access to confirming
    codes from a captured cloud account, without touching the device they
    arrived at.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze sprawdzenie kończy się
    zwykle na stwierdzeniu, że nie ma czego sprawdzać.

    Skutek, gdzie mechanizm działa: wiadomości przestaną pojawiać się na
    pozostałych urządzeniach tej samej osoby. Trzeba będzie sięgnąć po nie
    na urządzeniu, na które faktycznie przyszły — i to jest zmiana sposobu
    pracy, którą warto zapowiedzieć, bo dla kogoś przyzwyczajonego wygląda
    jak awaria.

    Wysyłanie i odbieranie na samej maszynie działa bez zmian. Reguła
    dotyczy wyłącznie kopiowania poza nią, nie samej obsługi wiadomości.

    Czego to nie psuje: powiadomień systemowych, poczty, komunikatorów,
    wysyłania wiadomości przez aplikacje ani niczego, co nie jest
    kopiowaniem wiadomości do magazynu w chmurze.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server the review usually ends
    with the finding that there is nothing to review.

    The effect, where the mechanism works: messages stop appearing on the
    same person's other devices. They will have to be fetched on the device
    they actually arrived at - and that is a change in the way of working
    worth announcing, because to somebody used to it, it looks like a
    failure.

    Sending and receiving on the machine itself works unchanged. The rule
    covers only the copying beyond it, not the handling of messages as such.

    What this does not break: system notifications, mail, messengers, sending
    messages from applications, or anything that is not the copying of
    messages into cloud storage.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Wiadomości przestaną pojawiać się na pozostałych urządzeniach tej samej osoby
      - Trzeba będzie sięgnąć po nie na urządzeniu, na które faktycznie przyszły, co dla przyzwyczajonych wygląda jak awaria
      - Wysyłanie i odbieranie na samej maszynie działa bez zmian — reguła dotyczy wyłącznie kopiowania poza nią
      - Powiadomienia systemowe, poczta, komunikatory i wysyłanie wiadomości przez aplikacje działają bez zmian
    en:
      - Messages stop appearing on the same person's other devices
      - They will have to be fetched on the device they actually arrived at, which to those used to it looks like a failure
      - Sending and receiving on the machine itself works unchanged - the rule covers only the copying beyond it
      - System notifications, mail, messengers and sending messages from applications work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest urządzeniem, na którym wiadomości odbiera się wyłącznie dzięki przeniesieniu ich z innego urządzenia
    en:
      - The machine is a device where messages are read only thanks to their being carried over from another device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
      $name = 'AllowMessageSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    $name = 'AllowMessageSync'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A text message is, in many places, the second factor of signing in. A
    # second factor makes sense as long as it is separate: once messages travel
    # into storage reachable through an account, capturing that account gives
    # both the password and the thing meant to protect against its loss.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Messaging'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowMessageSync' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-messaging

notes:
  pl: |
    Wiadomość tekstowa jest dziś w wielu miejscach drugim składnikiem
    logowania. Wszystko, co kopiuje takie wiadomości gdzie indziej, kopiuje
    tym samym kody, które miały nie opuszczać jednego urządzenia.

    Drugi składnik ma sens, dopóki jest osobny. Przejęcie konta w chmurze
    daje wtedy jednocześnie hasło i to, co miało być zabezpieczeniem na
    wypadek jego utraty.

    Na serwerze mechanizm jest w praktyce nieobecny. Punkt zostaje, bo
    maszyna wirtualna może dostać urządzenie od gospodarza, a wyjątki robione
    „bo to i tak nieobecne" są tym, przez co lista wyjątków przestaje być
    znana.
  en: |
    A text message is today, in many places, the second factor of signing in.
    Anything that copies such messages elsewhere copies with them the codes
    that were meant never to leave one device.

    A second factor makes sense as long as it is separate. Capturing the
    cloud account then gives at once the password and the thing meant to
    protect against its loss.

    On a server the mechanism is in practice absent. The item stays because a
    virtual machine may be given a device by its host, and exceptions made
    "since it is absent anyway" are what stops a list of exceptions from
    being known.
