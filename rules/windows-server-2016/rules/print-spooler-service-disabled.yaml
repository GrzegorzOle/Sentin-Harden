id: win2016-print-spooler-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa bufora wydruku wyłączona
    en: The print spooler service switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę obsługującą kolejkowanie wydruków.

    Usługa ta jest jednym z najdłużej działających składników systemu
    i jednym z najczęściej wykorzystywanych. Powód nie leży w samym
    drukowaniu, tylko w tym, co ta usługa robi przy okazji: przyjmuje
    połączenia zdalne, pobiera i instaluje sterowniki, zapisuje pliki
    w katalogach systemowych i robi to wszystko z uprawnieniami
    najwyższymi z możliwych.

    Każda z tych czynności jest osobną drogą. Przyjmowanie połączeń czyni
    ją osiągalną z sieci bez logowania. Instalowanie sterowników znaczy
    wykonanie kodu w jądrze. Zapis w katalogach systemowych znaczy
    podmianę plików, których nikt inny podmienić nie może.

    Kolejne luki znajdowane w tej usłudze układają się w ten sam wzorzec
    i nie ma podstaw sądzić, że był to ostatni. Dlatego zalecenie brzmi
    tak, jak brzmi: na maszynie, która nie drukuje i nie udostępnia kolejek,
    usługi tej po prostu nie powinno być.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: osiągalną
    zdalnie usługę działającą z uprawnieniami najwyższymi, która z natury
    swojej pracy instaluje kod i zapisuje pliki w katalogach systemowych.
  en: |
    The setting switches off the service handling the queueing of print jobs.

    That service is among the longest-running parts of the system and among the most
    used. The reason lies not in printing itself but in what the service does along
    the way: it accepts remote connections, fetches and installs drivers, writes
    files into system directories, and does all of it with the highest rights there
    are.

    Each of those acts is a road of its own. Accepting connections makes it
    reachable from the network without signing in. Installing drivers means running
    code in the kernel. Writing into system directories means replacing files
    nobody else can replace.

    The gaps found in this service one after another fall into the same pattern, and
    there are no grounds for thinking the last has been found. So the recommendation
    reads as it does: on a machine that does not print and shares no queues, that
    service simply ought not to be there.

    What an attacker gains while the item goes unmet: a remotely reachable service
    running with the highest rights, which by the nature of its work installs code
    and writes files into system directories.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jedno z najostrzejszych
    wdrożeń w całym zestawie.

    Wszystko, co drukuje z tej maszyny, przestaje drukować. Nie ma tu
    stopniowania: nie ma kolejki, nie ma drukarek, nie ma podglądu wydruku.
    Zgłoszenie brzmi „nie da się wydrukować" i jest dokładnie tym,
    czym się wydaje.

    Rzecz poważniejsza dotyczy kolejek udostępnianych. Jeżeli ta maszyna
    jest serwerem wydruku, wyłączenie usługi zabiera drukarki wszystkim
    maszynom, które się z nią łączyły — a jest ich zwykle tyle, ile
    stanowisk w organizacji. Skutek wykracza wtedy daleko poza tę maszynę
    i to jest główny powód, dla którego punkt nigdy nie idzie hurtem.

    Rzecz trzecia, mniej znana: część oprogramowania używa mechanizmu
    wydruku do wytwarzania dokumentów, a nie do drukowania na papierze.
    Raport zapisywany do pliku przez sterownik, eksport z aplikacji
    księgowej, generowanie dokumentu przez usługę — wszystkie one
    przechodzą przez tę samą usługę i wszystkie przestaną działać.

    Rzecz czwarta dotyczy pulpitu zdalnego. Przekierowanie drukarek do
    sesji zdalnej opiera się na tej usłudze i przestaje działać razem z nią.

    Uwaga o ustaleniu, czy cokolwiek przez tę maszynę drukuje, siedzi
    w poleceniu naprawczym.

    Czego to nie psuje: sieci, usług niezwiązanych z wydrukiem, logowania,
    dostępu do plików.
  en: |
    The class is "needs a planned rollout", and it is among the sharpest rollouts in
    the whole set.

    Everything printing from this machine stops printing. There is no gradation
    here: no queue, no printers, no print preview. The report reads "it cannot
    print" and is exactly what it seems.

    The graver thing concerns shared queues. If this machine is a print server,
    switching the service off takes the printers away from every machine that
    connected to it - and those are as a rule as many as there are positions in the
    organisation. The consequence then reaches far beyond this machine, and that is
    the chief reason the item never goes in bulk.

    The third thing, less known: some software uses the printing mechanism to make
    documents rather than to print on paper. A report written to a file by a driver,
    an export from an accounting application, the generating of a document by a
    service - all of them pass through the same service and all will stop working.

    The fourth thing concerns the remote desktop. The redirecting of printers into a
    remote session rests on this service and stops working along with it.

    The remark about establishing whether anything prints through this machine sits
    in the remedial command.

    What this does not break: the network, services unrelated to printing, signing
    in, or access to files.

implementation_consequences:
  impact_areas:
    - printing
    - user-interface
  what_breaks:
    pl:
      - Wszystko, co drukuje z tej maszyny, przestaje drukować - nie ma kolejki, drukarek ani podglądu wydruku
      - Kolejka udostępniana z tej maszyny znika dla każdej maszyny, która się z nią łączyła, więc skutek wykracza daleko poza tę maszynę
      - Oprogramowanie wytwarzające dokumenty przez sterownik wydruku - raporty do pliku, eksporty, generowanie dokumentów - przestaje działać
      - Przekierowanie drukarek do sesji pulpitu zdalnego przestaje działać razem z usługą
    en:
      - Everything printing from this machine stops printing - there is no queue, no printers and no print preview
      - A queue shared from this machine disappears for every machine that connected to it, so the consequence reaches far beyond this machine
      - Software making documents through a print driver - reports to a file, exports, the generating of documents - stops working
      - The redirecting of printers into a remote desktop session stops working along with the service
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna udostępnia kolejki wydruku innym maszynom w organizacji
      - Na maszynie pracuje oprogramowanie wytwarzające dokumenty przez sterownik wydruku, a nie drukujące na papierze
      - Maszyna obsługuje sesje pulpitu zdalnego z przekierowaniem drukarek
    en:
      - The machine shares print queues with other machines in the organisation
      - Software making documents through a print driver rather than printing on paper works on the machine
      - The machine serves remote desktop sessions with printers redirected
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Spooler'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Spooler'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'Spooler' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Everything printing from this machine stops, queues shared from it
    # included, and a queue shared from here disappears for every machine that
    # connected to it. Establish first whether anything prints through this one.
    Stop-Service -Name 'Spooler' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Spooler' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'Spooler' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-print-spooler-service

notes:
  pl: |
    Punkt otwiera blok o wydruku i jest w nim jedyny, który rozwiązuje
    problem przez usunięcie go. Pozostałe pięć reguł ogranicza usługę,
    która zostaje. Warto pokazywać tę zależność wprost: tam, gdzie ten
    punkt da się wykonać, pozostałe tracą znaczenie praktyczne — ale
    zostają jako zabezpieczenie na wypadek ponownego włączenia usługi.

    Poziom drugi jest tu uzasadniony. Punkt zakłada maszynę, która nie
    drukuje, a takich jest sporo — kontroler domeny, serwer bazy danych,
    maszyna aplikacyjna. Na maszynie drukującej jest on po prostu
    niewykonalny i odpuszczenie go z zapisanym uzasadnieniem jest wynikiem
    prawidłowym.

    Audyt zwraca „nie dotyczy", gdy usługi nie ma w systemie w ogóle.
    Na serwerze bywa to skutkiem usunięcia roli i lepiej to nazwać, niż
    zgłaszać jako niezgodność.
  en: |
    The item opens the block about printing and is the only one in it that answers
    the trouble by removing it. The other five rules limit a service that stays.
    That bearing is worth showing outright: where this item can be carried out, the
    others lose their practical weight - but remain as a safeguard should the
    service be switched back on.

    Level two is warranted here. The item assumes a machine that does not print, and
    there are plenty of those - a domain controller, a database server, an
    application machine. On a printing machine it is simply not feasible, and
    letting it go with a written justification is a proper outcome.

    The audit returns "not applicable" where the service is not in the system at
    all. On a server that is at times the upshot of a role having been removed, and
    better named than reported as a non-compliance.
