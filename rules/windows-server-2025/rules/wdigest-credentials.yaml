id: win2025-wdigest-credentials

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie haseł w pamięci przez WDigest wyłączone
    en: WDigest credential caching disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozstrzyga, czy stary dostawca uwierzytelniania trzyma
    w pamięci maszyny hasło zalogowanej osoby w postaci pozwalającej
    je odtworzyć.

    Reszta systemu tego nie robi. Nowsze mechanizmy przechowują skrót
    hasła, a nie samo hasło — skrót pozwala się uwierzytelnić, ale nie
    pozwala hasła odczytać ani użyć gdzie indziej. Dostawca, o którym
    mowa, wymagał hasła w postaci jawnej, bo protokół, do którego go
    napisano, inaczej nie działał.

    Skutek jest taki, że każde hasło użyte do zalogowania się na tej
    maszynie leży w jej pamięci w postaci możliwej do odczytania przez
    tego, kto na niej uzyskał uprawnienia administratora. Nie trzeba
    niczego łamać ani zgadywać — wystarczy przeczytać.

    Na serwerze skutek ten jest dotkliwszy niż gdziekolwiek indziej
    i to jest główna różnica wobec paczki stanowiska roboczego.
    Na stanowisku roboczym leży w pamięci hasło jednej osoby.
    Na serwerze, do którego logują się administratorzy — a zwłaszcza na
    serwerze terminali i na maszynie pośredniczącej w zarządzaniu —
    leżą hasła wszystkich, którzy się na nim ostatnio logowali.
    Maszyna taka jest wtedy zbiorem haseł uprzywilejowanych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    w postaci jawnej wszystkich osób zalogowanych na tym serwerze,
    gotowe do użycia na innych maszynach.
  en: |
    The setting settles whether an old authentication provider holds a signed-in person's
    password in the machine's memory in a form letting it be recovered.

    The rest of the system does not do so. Newer mechanisms keep a password's hash rather than
    the password - a hash lets one authenticate but does not let the password be read or used
    elsewhere. The provider spoken of here wanted the password in plain form, the protocol it
    was written for working no other way.

    The effect is that every password used to sign in to this machine lies in its memory in a
    form readable by whoever has won administrative rights on it. Nothing must be broken or
    guessed - it is enough to read.

    On a server that effect bites harder than anywhere else, and that is the chief difference
    from the working station's pack. At a working station one person's password lies in memory.
    On a server administrators sign in to - and above all on a terminal server and on a machine
    that goes between in management - lie the passwords of everyone who signed in to it lately.
    Such a machine is then a gathering of privileged passwords.

    What an attacker gains while the item goes unmet: the plain passwords of everyone signed in
    to this server, ready for use on other machines.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym przechowywanie jest wyłączone na wszystkich
    współczesnych wersjach systemu, więc na większości serwerów naprawa
    nie zmienia niczego. Niezgodność bierze się z włączenia
    wprowadzonego kiedyś ręcznie — i zwykle wiadomo po co, bo nikt nie
    włącza tego przypadkiem.

    Powodem bywa aplikacja korzystająca ze starego protokołu
    uwierzytelniania przeglądarkowego. Aplikacji takich pozostało
    niewiele i żadna z nich nie jest nowa. Jeżeli na serwerze taka
    pracuje, warto wiedzieć, że jej działanie kosztuje złożenie
    wszystkich haseł z tej maszyny w miejscu, z którego da się je
    odczytać.

    Sama zmiana nie usuwa haseł leżących już w pamięci. Znikną one
    przy następnym uruchomieniu maszyny albo przy wygaśnięciu sesji,
    które je tam umieściły. Znaczy to, że po naprawie warto serwer
    zrestartować, jeżeli istnieje podejrzenie, że hasła już tam leżą.

    Zmiana nie dotyka logowania. Uwierzytelnianie kontami domenowymi
    i lokalnymi działa po niej tak samo, bo korzysta z mechanizmów
    nowszych.
  en: |
    The change has no known side effects and takes no break.

    In the default state the caching is off in every present-day version of the system, so on
    most servers the mending changes nothing. Non-compliance comes of a switching on brought in
    by hand once - and it is usually known what for, nobody turning this on by chance.

    The reason is at times an application using an old browser authentication protocol. Few such
    applications are left and none of them is new. Where one works on the server, it is worth
    knowing that its working costs the gathering of every password from this machine in a place
    they can be read from.

    The change itself does not clear the passwords already lying in memory. They will go at the
    next start of the machine or at the ending of the sessions that put them there. That means
    it is worth restarting the server after the mending where there is a suspicion that
    passwords lie there already.

    The change does not touch signing in. Authentication by domain and local accounts works
    after it just the same, resting on newer mechanisms.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
    - legacy-applications
  what_breaks:
    pl:
      - Aplikacja korzystająca ze starego protokołu uwierzytelniania przeglądarkowego przestanie uwierzytelniać
      - Logowanie kontami domenowymi i lokalnymi działa bez zmiany, bo korzysta z mechanizmów nowszych
      - Zmiana nie usuwa haseł leżących już w pamięci, więc po naprawie warto serwer zrestartować
      - W stanie domyślnym przechowywanie jest wyłączone, więc zmiana zwykle nie robi nic
    en:
      - An application using an old browser authentication protocol will stop authenticating
      - Signing in with domain and local accounts works unchanged, resting on newer mechanisms
      - The change does not clear passwords already in memory, so a restart after the mending is worth making
      - In the default state the caching is off, so the change usually does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje aplikacja uwierzytelniająca się starym protokołem przeglądarkowym
    en:
      - An application authenticating by an old browser protocol works on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
      $name = 'UseLogonCredential'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(0|MISSING)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    $name = 'UseLogonCredential'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseLogonCredential' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection

notes:
  pl: |
    Sprawdzenie uznaje brak wartości za stan zgodny, bo wyłączenie jest
    domyślne. Obecność jedynki znaczy, że ktoś przechowywanie włączył
    świadomie.

    Na serwerze terminali i na maszynie pośredniczącej w zarządzaniu
    punkt waży najwięcej, bo leżą tam hasła wielu osób naraz,
    w tym administratorów.

    Naprawa nie usuwa haseł już zapisanych w pamięci. Przy podejrzeniu
    naruszenia sama zmiana nie wystarczy — potrzebny jest restart
    maszyny i zmiana haseł, które mogły zostać odczytane.
  en: |
    The check holds an absent value the compliant state, the caching being off by default. A one
    standing there means somebody turned the caching on knowingly.

    On a terminal server and on a machine that goes between in management the item weighs most,
    many people's passwords lying there at once, administrators' among them.

    The mending does not clear passwords already written in memory. At a suspicion of a breach
    the change alone is not enough - a restart of the machine is wanted, and a changing of the
    passwords that may have been read.
