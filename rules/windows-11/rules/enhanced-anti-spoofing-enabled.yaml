id: win11-enhanced-anti-spoofing-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Biometrics > Facial Features
  title:
    pl: Wzmocniona ochrona przed podszyciem przy rozpoznawaniu twarzy
    en: Strengthened protection against spoofing in face recognition
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Logowanie twarzą zastępuje hasło obrazem, a obraz da się podstawić. Przy
    zwykłym rozpoznawaniu wystarczy zdjęcie w odpowiedniej rozdzielczości albo
    wydruk — a zdjęcie twarzy pracownika nie jest dziś rzeczą trudną do zdobycia.

    Wzmocniona ochrona każe sprawdzić, czy przed kamerą stoi obiekt trójwymiarowy
    o cechach żywej tkanki, a nie płaska powierzchnia odbijająca światło inaczej.
    Podstawienie wydruku albo ekranu telefonu przestaje wystarczać, a próg wchodzi
    na poziom, którego przypadkowy napastnik nie przekroczy.

    Dla maszyny, na której twarz jest jedynym składnikiem wejścia, jest to
    różnica między zabezpieczeniem a wygodą wyglądającą na zabezpieczenie.
    Napastnik z fizycznym dostępem do stanowiska i zdjęciem jego użytkownika
    traci najprostszą drogę wejścia.
  en: |
    Signing in with a face replaces a password with an image, and an image can be
    substituted. With ordinary recognition a photograph at the right resolution, or
    a printout, is enough - and a photograph of an employee's face is not a hard
    thing to come by today.

    The strengthened protection calls for checking whether what stands before the
    camera is a three-dimensional object with the traits of living tissue, rather
    than a flat surface reflecting light differently. Substituting a printout or a
    phone screen stops being enough, and the bar rises to a level a chance attacker
    will not clear.

    For a machine where a face is the only factor of entry this is the difference
    between a safeguard and a convenience that looks like one. An attacker with
    physical access to the station and a photograph of its user loses the simplest
    road in.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jakimi kamerami dysponują stanowiska.

    Wzmocniona ochrona wymaga kamery z czujnikiem podczerwieni. Na maszynach,
    które takiej kamery nie mają, logowanie twarzą i tak nie działa, więc zmiana
    nie ma skutku. Kłopot dotyczy przypadku pośredniego: kamery obsługującej
    rozpoznawanie, ale realizującej je w sposób, którego sterownik nie zgłasza
    jako spełniający wzmocnione wymagania — takie stanowisko straci logowanie
    twarzą i wróci do kodu albo hasła.

    Zdarza się to przy kamerach zewnętrznych podpinanych przewodem oraz przy
    starszych laptopach, w których sterownik nie był aktualizowany. Objawem jest
    zniknięcie logowania twarzą z ekranu powitalnego, bez komunikatu tłumaczącego
    powód.

    Odcisk palca i kod pozostają nienaruszone, więc nikt nie zostaje bez drogi
    wejścia — ale warto uprzedzić, bo zmiana jest widoczna od pierwszego
    logowania.

    Nie ma restartu. Zmiana obowiązuje po ponownym zalogowaniu.
  en: |
    What needs checking is what cameras the stations have.

    The strengthened protection requires a camera with an infrared sensor. On
    machines without one, face sign-in does not work anyway, so the change has no
    effect. The trouble is the middle case: a camera that supports recognition but
    performs it in a way the driver does not report as meeting the strengthened
    requirements - such a station will lose face sign-in and fall back to a code or
    a password.

    This happens with external cameras attached by cable and with older laptops
    whose driver was never updated. The symptom is face sign-in disappearing from
    the welcome screen, with no message explaining why.

    Fingerprint and code are untouched, so nobody is left without a road in - but it
    is worth warning, because the change shows from the first sign-in.

    There is no restart. The change takes effect at the next sign-in.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - drivers-and-devices
    - user-interface
  what_breaks:
    pl:
      - Logowanie twarzą przestanie być dostępne na kamerach, których sterownik nie zgłasza wzmocnionej ochrony
      - Kamery zewnętrzne podpinane przewodem mogą stracić możliwość rozpoznawania twarzy
      - Użytkownicy przyzwyczajeni do logowania twarzą wrócą do kodu albo hasła bez komunikatu tłumaczącego powód
    en:
      - Face sign-in stops being available on cameras whose driver does not report the strengthened protection
      - External cameras attached by cable may lose the ability to recognise a face
      - Users used to signing in with a face fall back to a code or a password with no message explaining why
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowiska wyposażono w kamery, które obsługują rozpoznawanie twarzy, ale nie spełniają wzmocnionych wymagań, a inne sposoby logowania nie zostały przygotowane
    en:
      - The stations have cameras supporting face recognition but not meeting the strengthened requirements, and other ways of signing in have not been prepared
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
      $name = 'EnhancedAntiSpoofing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    $name = 'EnhancedAntiSpoofing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Biometrics\FacialFeatures'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnhancedAntiSpoofing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Reguła sprawdza wymaganie, a nie to, czy sprzęt na maszynie je spełnia.
    Wynik „spełniony" znaczy, że system nie przyjmie rozpoznawania bez wzmocnionej
    ochrony — nie znaczy, że logowanie twarzą na tej maszynie w ogóle działa.

    Na stanowisku bez kamery z czujnikiem podczerwieni punkt jest bez skutku
    praktycznego, ale zachowuje sens: maszyna dostaje kiedyś nową kamerę albo
    nowego użytkownika, a wtedy wymaganie ma już obowiązywać. Z tego powodu
    reguła nie zgłasza takiego stanowiska jako nieobjętego punktem.

    Rozpoznawanie odcisku palca jest sterowane osobno i ten punkt go nie dotyczy.
  en: |
    The rule checks the requirement, not whether the hardware on the machine meets
    it. A result of "met" means the system will not accept recognition without the
    strengthened protection - it does not mean face sign-in works on this machine at
    all.

    On a station without an infrared camera the item has no practical effect, but it
    keeps its point: the machine gets a new camera or a new user one day, and by
    then the requirement is to be in force. For that reason the rule does not report
    such a station as outside the item's scope.

    Fingerprint recognition is steered separately and this item does not concern it.
