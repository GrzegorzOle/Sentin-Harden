id: win2025-connected-standby-password-delay-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Odroczenie żądania hasła po wybudzeniu z uśpienia wyłączone
    en: Delay of the password demand after waking from sleep switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt znosi okres karencji, w którym maszyna wybudzona z uśpienia nie
    żąda jeszcze hasła od konta domenowego.

    Kategoria średnia i chcę powiedzieć, co ten mechanizm robi, bo jego
    nazwa brzmi jak szczegół techniczny, a chodzi o dziurę w czasie.
    Maszyna, która żąda hasła przy wybudzeniu, może mimo to przez ustalony
    czas po wybudzeniu tego hasła nie żądać. Ochrona jest wtedy warunkowa
    i warunkiem jest zegar.

    To trzeba czytać razem z punktem o wybudzeniu. Tamten ustawia zasadę,
    ten pilnuje, żeby nie miała wyjątku liczonego w minutach. Ustawienie
    wybudzenia samo w sobie zostawia szczelinę, o której nikt nie pamięta
    przy czytaniu sprawozdania, bo w sprawozdaniu tamten punkt jest już
    zielony.

    Na serwerze rzecz ma tę samą wartość co punkt poprzedni i to samo
    zastrzeżenie: maszyna, która nie zasypia, nigdy tego nie użyje. Wartość
    polega na tym, że nie zakładamy, iż nie zasypia — sprawdzamy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: okno czasowe
    po wybudzeniu maszyny, w którym sesja domenowa jest osiągalna bez
    podania hasła.
  en: |
    The item removes the period of grace in which a machine woken from sleep
    does not yet demand a password from a domain account.

    The category is medium, and I want to say what this mechanism does,
    because its name sounds like a technical detail while what is at stake is
    a hole in time. A machine that demands a password on waking may
    nevertheless not demand it for a set time after waking. The protection is
    then conditional and the condition is a clock.

    This has to be read together with the item on waking. That one sets the
    rule, this one sees that it has no exception counted in minutes. The wake
    setting on its own leaves a gap nobody remembers when reading the report,
    because in the report that item is already green.

    On a server the matter carries the same value as the previous item and
    the same caveat: a machine that does not sleep will never use it. The
    value lies in not assuming it does not sleep - in checking.

    What an attacker gains while the item goes unmet: a window of time after
    the machine wakes, in which the domain session is reachable without a
    password.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy nie serwera, lecz
    ludzi, którzy się na niego logują z maszyn przenośnych — bo to tam
    karencja bywa świadomie używana.

    Skutek jest wąski: po wybudzeniu hasło trzeba podać od razu, a nie po
    chwili. Kto zamykał klapę na czas przejścia między pokojami i liczył, że
    wróci bez logowania, będzie się logował. To jest jedyna strata i trudno
    ją nazwać poważną, ale jest odczuwalna i ludzie ją zgłaszają.

    Na serwerze nie widzę czego stracić i mówię to wprost: jeżeli maszyna
    nie zasypia, zmiana jest bez skutku, a jeżeli zasypia, to ochrona
    warunkowa czasem jest gorsza niż jej brak, bo wygląda na obecną.

    Rzecz do zapamiętania: wpis leży w gałęzi systemowej razem z regułami
    o zupełnie innym przedmiocie — przenoszeniem pracy między urządzeniami,
    pobieraniem czcionek i powiadomieniami na ekranie blokady. Cztery punkty,
    jedna ścieżka, cztery różne nazwy wartości.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns not the server but
    the people signing in to it from portable machines - because that is
    where the grace period is sometimes deliberately used.

    The effect is narrow: after waking, the password must be given at once
    rather than after a moment. Anybody who used to close the lid while
    walking between rooms, counting on coming back without signing in, will
    now sign in. That is the only loss and it is hard to call it serious, but
    it is felt and people report it.

    On a server I see nothing to lose and I say so plainly: if the machine
    does not sleep, the change has no effect, and if it does sleep then
    conditional protection is sometimes worse than none, because it looks
    like protection.

    Something to remember: the entry lies in the system branch together with
    rules of an entirely different subject - continuing work across devices,
    fetching fonts and notifications on the lock screen. Four items, one
    path, four different value names.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Po wybudzeniu maszyny hasło trzeba podać od razu, a nie po upływie okresu karencji
      - Kto zamykał klapę na czas przejścia między pokojami i wracał bez logowania, będzie się logował
      - Na serwerze, który nie zasypia, zmiana jest bez skutku — sprawdzenie dotyczy maszyn przenośnych w tej domenie
      - Wpis leży w gałęzi systemowej razem z regułami o zupełnie innym przedmiocie, pod inną nazwą wartości
    en:
      - After the machine wakes, the password must be given at once rather than after the grace period
      - Anybody who closed the lid while walking between rooms and came back without signing in will now sign in
      - On a server that does not sleep the change has no effect - the review concerns portable machines in the domain
      - The entry lies in the system branch together with rules of an entirely different subject, under a different value name
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Zasada obejmuje maszyny przenośne, na których okres karencji po wybudzeniu jest świadomie przyjętym sposobem pracy
    en:
      - The policy covers portable machines where the grace period after waking is a deliberately accepted way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowDomainDelayLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainDelayLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A machine that demands a password on waking may still not demand it for a
    # set time afterwards: the protection is conditional and the condition is a
    # clock. Read together with the wake item - that one sets the rule, this one
    # sees it has no exception counted in minutes.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainDelayLock' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/modern-standby

notes:
  pl: |
    Nazwa brzmi jak szczegół techniczny, a chodzi o dziurę w czasie. Maszyna
    żądająca hasła przy wybudzeniu może mimo to przez ustalony czas po
    wybudzeniu tego hasła nie żądać. Ochrona jest wtedy warunkowa,
    a warunkiem jest zegar.

    Czytaj razem z punktem o wybudzeniu: tamten ustawia zasadę, ten pilnuje,
    żeby nie miała wyjątku liczonego w minutach. Szczelina jest tym
    groźniejsza, że w sprawozdaniu tamten punkt jest już zielony.

    Ochrona warunkowa bywa gorsza niż jej brak, bo wygląda na obecną.
  en: |
    The name sounds like a technical detail, yet what is at stake is a hole
    in time. A machine that demands a password on waking may still not demand
    it for a set time afterwards. The protection is then conditional and the
    condition is a clock.

    Read together with the item on waking: that one sets the rule, this one
    sees that it has no exception counted in minutes. The gap is the more
    dangerous because in the report that item is already green.

    Conditional protection is sometimes worse than none, because it looks
    like protection.
