id: win11-bitlocker-advanced-startup-required

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Dodatkowe uwierzytelnienie przy starcie dysku systemowego wymagane
    en: Additional authentication at startup of the system drive required
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Szyfrowanie dysku systemowego oparte wyłącznie na module sprzętowym działa
    tak, że maszyna odblokowuje się sama. Moduł oddaje klucz, gdy stan
    uruchamiania zgadza się z zapamiętanym, i system startuje aż do ekranu
    logowania bez pytania o cokolwiek.

    Napastnik, który wynosi komputer, dostaje więc urządzenie, które samo się
    odblokowuje. Pozostaje mu pokonanie logowania — a to jest zadanie zupełnie
    innej trudności niż złamanie szyfrowania. Atak na stan pamięci maszyny
    zatrzymanej, atak na interfejs sprzętowy, podmiana składnika startowego:
    każdy z nich zaczyna się od maszyny, która klucz już wydała.

    Dodatkowe uwierzytelnienie przy starcie zmienia to u podstawy. Klucz nie
    zostaje wydany, dopóki ktoś nie poda kodu albo nie wpnie nośnika, więc
    maszyna zabrana ze stanowiska jest zaszyfrowanym dyskiem, a nie działającym
    komputerem.

    Druga połowa punktu jest równie ważna: szyfrowanie bez modułu sprzętowego
    ma pozostać niedopuszczone. Klucz przechowywany wtedy na nośniku wymiennym
    jest zabezpieczeniem tylko dopóty, dopóki nośnik nie leży w tej samej
    torbie co komputer — a leży prawie zawsze.
  en: |
    Encryption of the system drive resting solely on the hardware module works so
    that the machine unlocks itself. The module gives up the key when the startup
    state matches the remembered one, and the system boots all the way to the
    sign-in screen without asking for anything.

    An attacker carrying the computer off therefore gets a device that unlocks
    itself. What is left for them is getting past the sign-in - and that is a task
    of an entirely different difficulty from breaking the encryption. An attack on
    the memory of a suspended machine, an attack on a hardware interface,
    substituting a startup component: each of them begins with a machine that has
    already given the key up.

    Additional authentication at startup changes this at the root. The key is not
    given up until somebody enters a code or plugs a medium in, so a machine taken
    from the station is an encrypted disk rather than a working computer.

    The item's other half matters as much: encryption without the hardware module is
    to stay inadmissible. The key kept in that case on removable media is a
    safeguard only so long as the medium does not lie in the same bag as the
    computer - and it almost always does.

disruption_description:
  pl: |
    Jest to zmiana w sposobie uruchamiania komputera i wymaga okna wdrożeniowego
    oraz uprzedzenia ludzi.

    Po zmianie każdy start maszyny zaczyna się pytaniem o kod przed
    załadowaniem systemu. Użytkownik, który dotąd wpisywał wyłącznie hasło do
    konta, zaczyna wpisywać dwie rzeczy — i pierwszą na ekranie, który wygląda
    zupełnie inaczej niż reszta systemu, bez możliwości zmiany układu klawiatury
    i bez podpowiedzi.

    Skutki uboczne dotyczą wszystkiego, co uruchamia maszynę bez człowieka przy
    niej. Zdalny restart po aktualizacji zatrzyma się na pytaniu o kod i maszyna
    nie wróci do sieci. Zadania nocne, serwis zdalny i wybudzanie przez sieć
    przestają działać w dotychczasowej postaci. Na stanowiskach, które muszą
    wstawać same, punkt wymaga rozwiązania zastępczego, a nie wdrożenia wprost.

    Zapomniany kod prowadzi do odzyskiwania z klucza. Wdrożenie bez ustalonego
    miejsca przechowywania kluczy odzyskiwania kończy się utratą danych, i jest
    to koszt nieodwracalny, w odróżnieniu od samej zmiany.

    Zmiana obowiązuje po ponownym uruchomieniu maszyny.
  en: |
    This is a change in how the computer starts, and it calls for a rollout window
    and for warning people.

    After it, every start of the machine begins with a request for a code before the
    system loads. A user who until now typed only their account password starts
    typing two things - and the first on a screen that looks nothing like the rest
    of the system, with no way to change the keyboard layout and no hints.

    The side effects concern everything that starts the machine with no person at
    it. A remote restart after an update will stop at the request for the code and
    the machine will not come back onto the network. Nightly jobs, remote servicing
    and waking over the network stop working in their present form. At stations that
    must come up by themselves the item calls for a substitute arrangement rather
    than a straight rollout.

    A forgotten code leads to recovery from a key. A rollout without a settled place
    to keep recovery keys ends in lost data, and that is an irreversible cost,
    unlike the change itself.

    The change takes effect after the machine is restarted.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - remote-management
  what_breaks:
    pl:
      - Każde uruchomienie maszyny wymaga podania kodu przed załadowaniem systemu
      - Zdalny restart po aktualizacji zatrzyma się na pytaniu o kod i maszyna nie wróci do sieci bez obsługi
      - Zadania nocne, serwis zdalny i wybudzanie przez sieć przestaną działać w dotychczasowej postaci
      - Zapomniany kod wymaga odzyskiwania z klucza, a bez ustalonego miejsca przechowywania kluczy oznacza utratę danych
    en:
      - Every start of the machine needs a code entered before the system loads
      - A remote restart after an update stops at the request for the code and the machine does not return to the network unattended
      - Nightly jobs, remote servicing and waking over the network stop working in their present form
      - A forgotten code needs recovery from a key, and with no settled place for keys it means lost data
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko musi wstawać bez człowieka przy nim - po zdalnym restarcie, po aktualizacji albo do zadania nocnego
      - Nie ustalono, gdzie trafiają klucze odzyskiwania i kto ma do nich dostęp
    en:
      - The station has to come up with nobody at it - after a remote restart, after an update, or for a nightly job
      - It has not been settled where recovery keys go and who has access to them
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first requires the additional
      # authentication; the second must stay at zero, otherwise encryption
      # without the hardware module is admitted and the requirement is hollow.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $advanced = $item.'UseAdvancedStartup'
        $noTpm = $item.'EnableBDEWithNoTPM'
        if ($null -eq $advanced) { 'MISSING' }
        elseif ([int]$advanced -ne 1) { 'NOT_REQUIRED' }
        elseif ($null -ne $noTpm -and [int]$noTpm -eq 1) { 'WITHOUT_MODULE_ALLOWED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      advanced          = $item.'UseAdvancedStartup'
      advanced_existed  = ($null -ne $item.'UseAdvancedStartup')
      no_tpm            = $item.'EnableBDEWithNoTPM'
      no_tpm_existed    = ($null -ne $item.'EnableBDEWithNoTPM')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseAdvancedStartup' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'EnableBDEWithNoTPM' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.advanced_existed) {
      Set-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -Value $b.advanced -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'UseAdvancedStartup' -ErrorAction SilentlyContinue
    }
    if ($b.no_tpm_existed) {
      Set-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -Value $b.no_tpm -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'EnableBDEWithNoTPM' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła czyta dwie wartości, bo punkt jest jedną decyzją zapisaną w dwóch
    miejscach. Rozdzielenie ich dałoby stan pozornie spełniony: wymagane
    dodatkowe uwierzytelnienie razem z dopuszczonym szyfrowaniem bez modułu
    sprzętowego to układ, w którym wymaganie da się obejść przy włączaniu
    szyfrowania.

    Wpis nie zmienia sposobu odblokowywania dysków już zaszyfrowanych. Dotyczy
    tego, co zostanie ustawione przy następnym włączeniu szyfrowania — maszyna
    zaszyfrowana wcześniej wyłącznie modułem sprzętowym zachowa się tak jak
    przedtem, dopóki jej ochrony nie przestawi się osobno. Reguła tego nie robi
    i nie należy jej czytać jako potwierdzenia, że maszyna pyta o kod.

    Wpis leży w gałęzi wspólnej dla wszystkich ustawień szyfrowania, więc
    wycofanie zdejmuje wyłącznie te dwie wartości.
  en: |
    The rule reads two values, because the item is one decision written in two
    places. Splitting them would give a seemingly met state: additional
    authentication required together with encryption without the hardware module
    admitted is an arrangement in which the requirement can be sidestepped when
    encryption is switched on.

    The entry does not change how drives already encrypted are unlocked. It concerns
    what will be set the next time encryption is switched on - a machine encrypted
    earlier with the hardware module alone will behave as before until its
    protection is changed separately. The rule does not do that, and it should not
    be read as confirming that the machine asks for a code.

    The entry sits in the key shared by all the encryption settings, so undoing it
    lifts these two values only.
