id: win2016-time-zone-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana strefy czasowej ograniczona do administratorów i użytkowników
    en: Changing the time zone restricted to administrators and users
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do zmiany strefy czasowej do administratorów,
    użytkowników i usługi lokalnej.

    Rzecz jest węższa, niż brzmi. Strefa czasowa nie zmienia czasu systemowego,
    tylko sposób jego wyświetlania: zegar wewnętrzny maszyny idzie dalej tak
    samo, a przesunięciu podlega to, co widzi człowiek. Dlatego uprawnienie to
    jest oddzielone od zmiany czasu systemowego i dlatego może przysługiwać
    szerzej.

    Skutek nadużycia jest czysto interpretacyjny. Wpisy w dzienniku są
    zapisywane w czasie uniwersalnym, ale narzędzia pokazują je w strefie
    maszyny — więc zmiana strefy przesuwa całą oś czasu na ekranie osoby
    prowadzącej analizę. Zdarzenia dalej są na swoich miejscach, tylko godziny
    przestają zgadzać się z zapisem z innych źródeł.

    Kategoria niska. To jest porządek i spójność, a nie odpieranie ataku.
    Wartość punktu polega na tym, że zestawienie dzienników z kilku maszyn ma
    sens dopiero wtedy, gdy wszystkie mówią o czasie to samo.

    Na serwerze 2016 uprawnienie domyślnie mają administratorzy, użytkownicy
    i usługa lokalna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: przesunięcie
    godzin widocznych w dziennikach, utrudniające zestawienie zdarzeń z innymi
    maszynami.
  en: |
    The item limits the right to change the time zone to the administrators, the
    users and the local service.

    The matter is narrower than it sounds. A time zone does not change system time,
    only the way it is shown: the machine's inner clock goes on as before, and what
    shifts is what a person sees. That is why this right is kept apart from changing
    system time, and why it may belong more widely.

    The effect of abuse is purely a matter of reading. Log entries are written in
    universal time, but tools show them in the machine's zone - so changing the zone
    shifts the whole axis of time on the screen of whoever is analysing. The events
    are still in their places, only the hours stop agreeing with the record from
    other sources.

    The category is low. This is order and consistency, not the fending off of an
    attack. The item's worth lies in this, that setting logs from several machines
    side by side makes sense only when all of them say the same about time.

    On Server 2016 the right belongs by default to the administrators, the users and
    the local service.

    What an attacker gains while the item goes unmet: a shift in the hours seen in
    the logs, making events harder to set beside those of other machines.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Lista domyślna jest szeroka i taka zostaje —
    reguła nie odbiera uprawnienia użytkownikom, tylko usuwa wpisy dodane poza
    nią.

    Na serwerze nikt strefy czasowej nie zmienia w codziennej pracy, a jeżeli
    zmienia, to raz, przy uruchomieniu maszyny. Praca użytkowników w sesji
    zdalnej korzysta z przekierowania strefy klienta, co jest osobnym
    mechanizmem i tej zmiany nie dotyczy.

    Czego to nie psuje: czasu systemowego, synchronizacji czasu, zapisu
    zdarzeń, pracy w sesji zdalnej ani wyświetlania zegara.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The default list is broad and stays so - the rule
    does not take the right from the users, it removes entries added beyond it.

    On a server nobody changes the time zone in the daily course of work, and if
    anybody does, it is once, when the machine is stood up. Users' work in a remote
    session uses the redirection of the client's zone, which is a separate mechanism
    and is not touched by this change.

    What this does not break: system time, time synchronisation, the writing of
    events, work in a remote session, or the display of the clock.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - logging-and-audit
  what_breaks:
    pl:
      - Konto usługowe dodane poza listą domyślną traci możliwość zmiany strefy czasowej maszyny
      - Skrypt ustawiający strefę przy przygotowaniu maszyny zgłasza odmowę, jeżeli działa spoza tych trzech grup
      - Czas systemowy, jego synchronizacja i zapis zdarzeń działają bez zmian
      - Przekierowanie strefy czasowej klienta w sesji zdalnej jest osobnym mechanizmem i pozostaje nietknięte
    en:
      - A service account added beyond the default list loses the ability to change the machine's time zone
      - A script setting the zone while a machine is prepared reports a refusal if it runs outside those three groups
      - System time, its synchronisation and the writing of events work unchanged
      - The redirection of the client's time zone in a remote session is a separate mechanism and stays untouched
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Strefę czasową maszyny ustawia narzędzie wdrożeniowe działające na koncie spoza administratorów, użytkowników i usługi lokalnej
    en:
      - The machine's time zone is set by a deployment tool running under an account outside the administrators, the users and the local service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTimeZonePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-32-544,S-1-5-32-545|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTimeZonePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTimeZonePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Log entries are written in universal time; the zone shifts only what the
    # person analysing sees. The default list stays broad on purpose.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTimeZonePrivilege = *S-1-5-32-544,*S-1-5-32-545,*S-1-5-19',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTimeZonePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/change-the-time-zone

notes:
  pl: |
    Punkt bywa mylony ze zmianą czasu systemowego, która jest osobnym
    uprawnieniem, osobną regułą i ma zupełnie inną wagę. Ta reguła dotyczy
    wyłącznie wyświetlania.

    Kategoria niska jest tu świadoma. Punkt nadaje się na kandydata do
    świadomego odpuszczenia, jeżeli w organizacji strefę zmienia ktoś poza
    wymienionymi grupami — koszt utrzymania go bywa wyższy niż zysk.

    Oczekiwana lista jest szeroka, bo taki jest stan domyślny systemu. Reguła
    nie zawęża jej z własnej inicjatywy; pilnuje, żeby nikt jej nie rozszerzył.
  en: |
    The item gets confused with changing system time, which is a separate right, a
    separate rule and of an altogether different weight. This rule bears on display
    alone.

    The low category here is deliberate. The item makes a candidate for being
    deliberately let go, if in the organisation the zone is changed by somebody
    outside the groups named - the cost of keeping it is sometimes higher than the
    gain.

    The expected list is broad, because that is the system's default state. The rule
    does not narrow it on its own account; it watches that nobody widens it.
