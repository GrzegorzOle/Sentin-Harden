id: win11-voice-activation-above-lock-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Privacy
  title:
    pl: Uruchamianie aplikacji głosem przy zablokowanym ekranie zabronione
    en: Activating applications by voice on a locked screen forbidden
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Zablokowany ekran jest granicą, na której kończy się dostęp do maszyny bez
    podania tożsamości. Uruchamianie aplikacji głosem tę granicę przekracza:
    program zaczyna działać i odpowiadać, mimo że nikt się nie zalogował.

    Rzecz w tym, że głos nie jest poświadczeniem. Mikrofon przyjmuje polecenie od
    każdego, kto stoi obok — a przy zablokowanym ekranie „obok" znaczy: ktokolwiek
    wszedł do pokoju, korytarza albo otwartej przestrzeni biurowej. Nie trzeba
    nawet stać: polecenie odtworzone z głośnika telefonu działa tak samo.

    Zakres tego, co da się w ten sposób zrobić, bywa niepozorny, ale nie jest
    pusty — odczytanie nadchodzących wiadomości, przywołanie kalendarza,
    wykonanie połączenia, sterowanie urządzeniami. Na stanowisku stojącym
    w miejscu dostępnym dla osób postronnych jest to droga do danych
    z zablokowanej maszyny bez dotykania klawiatury. Zakaz zamyka tę drogę,
    zostawiając mechanizm działający po zalogowaniu.
  en: |
    A locked screen is the boundary where access to the machine without proving an
    identity ends. Activating applications by voice crosses that boundary: a program
    starts running and answering although nobody has signed in.

    The thing is that a voice is not a credential. The microphone takes a command
    from anyone standing nearby - and with the screen locked "nearby" means whoever
    has walked into the room, the corridor or the open-plan office. They need not
    even stand there: a command played from a phone's speaker works the same.

    What can be done this way looks unremarkable but is not nothing - reading out
    arriving messages, calling up a calendar, placing a call, controlling devices.
    On a station standing where outsiders can reach it, this is a road to data on a
    locked machine without touching the keyboard. The ban closes that road, leaving
    the mechanism working once somebody has signed in.

disruption_description:
  pl: |
    Nic nie przestaje działać po zalogowaniu. Sterowanie głosem, dyktowanie
    i narzędzia dostępności działają jak przedtem — zmienia się wyłącznie to, co
    maszyna robi przy zablokowanym ekranie.

    Przestaje działać przywołanie asystenta głosem do zablokowanej maszyny.
    Jest to funkcja używana rzadko na stanowiskach biurowych i w praktyce
    niewidoczna dla większości ludzi.

    Dlatego punkt trafia do klasy bez uciążliwości: nie ma restartu, nie ma okna
    serwisowego, a jedyne zastosowanie, które znika, jest samo w sobie tym, co
    punkt uznaje za niepożądane.

    Warto odnotować przypadek graniczny: użytkownik korzystający ze sterowania
    głosem jako podstawowego sposobu obsługi komputera będzie musiał odblokować
    maszynę inną drogą. Jeśli takie stanowisko istnieje, punkt trzeba rozważyć
    razem ze sposobem logowania.
  en: |
    Nothing stops working once somebody has signed in. Voice control, dictation and
    accessibility tools work as before - all that changes is what the machine does
    while the screen is locked.

    What stops working is calling an assistant by voice to a locked machine. It is a
    function used rarely at office stations and in practice invisible to most
    people.

    That is why the item falls into the no-disruption class: no restart, no
    maintenance window, and the one use that goes is itself the thing the item
    counts as unwanted.

    One borderline case is worth noting: a user who relies on voice control as their
    main way of operating the computer will have to unlock the machine some other
    way. If such a station exists, the item has to be weighed together with how it
    is signed in to.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Przywołanie asystenta głosem przy zablokowanym ekranie przestanie działać
      - Użytkownik obsługujący komputer głosem będzie musiał odblokować maszynę inną drogą
    en:
      - Calling an assistant by voice on a locked screen stops working
      - A user operating the computer by voice will have to unlock the machine some other way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko przystosowano do obsługi głosem jako podstawowego sposobu pracy i odblokowanie inną drogą jest dla użytkownika przeszkodą
    en:
      - The station is set up for voice as the main way of working and unlocking it another way is an obstacle for the user
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is a choice out of three. Two means the machine settles the
      # matter and refuses; zero leaves it to the user and one forces it open,
      # so both are reported with their own value.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
      $name = 'LetAppsActivateWithVoiceAboveLock'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
    $name = 'LetAppsActivateWithVoiceAboveLock'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LetAppsActivateWithVoiceAboveLock' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-privacy

notes:
  pl: |
    Wartość zero nie jest stanem neutralnym, tylko pozostawieniem decyzji
    użytkownikowi — czyli stanem, w którym mechanizm bywa włączony. Reguła
    zgłasza ją jako niespełnienie tak samo jak wymuszone zezwolenie, ale podaje
    odczytaną wartość, żeby dało się odróżnić te dwa przypadki.

    Punkt dotyczy uruchamiania aplikacji, a nie samego dostępu do mikrofonu.
    Mikrofon pozostaje dostępny dla programów działających po zalogowaniu
    i ograniczenie go jest osobną decyzją.
  en: |
    A value of zero is not a neutral state but leaving the decision to the user -
    that is, a state where the mechanism is sometimes on. The rule reports it as
    unmet just as it does forced permission, but gives the value it read so the two
    cases can be told apart.

    The item concerns activating applications, not access to the microphone itself.
    The microphone stays available to programs running after sign-in, and limiting
    it is a separate decision.
