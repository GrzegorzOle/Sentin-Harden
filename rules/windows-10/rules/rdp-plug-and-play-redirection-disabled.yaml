id: win10-rdp-plug-and-play-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie urządzeń rozpoznawanych samoczynnie w sesji zdalnej wyłączone
    en: The turning of things known of themselves into the session from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania udostępniania sesji zdalnej urządzeń
    przyłączanych do maszyny klienta i rozpoznawanych samoczynnie:
    pamięci przenośnych, aparatów, czytników i sprzętu pomiarowego.

    Zagrożenie pierwsze to nośniki przenośne. Pamięć przyłączona do
    maszyny klienta staje się dostępna w sesji zdalnej, więc omija
    wszystkie ograniczenia nałożone na nośniki po stronie maszyny
    zdalnej. Zasada zabraniająca nośników na serwerze nic wtedy nie daje.

    Zagrożenie drugie to sterowniki. Urządzenie przekierowane do sesji
    wymaga sterownika po stronie zdalnej, więc obcy sprzęt powoduje
    ładowanie kodu na maszynie, do której został tylko wskazany.

    Zagrożenie trzecie to kierunek. Dane idą tu w obie strony, więc
    urządzenie służy zarówno do wnoszenia, jak i do wynoszenia.

    Odnotowuję, że punkt ten domyka rodzinę razem z przekierowaniem
    dysków i schowka. Trzy drogi przenoszenia treści, trzy osobne
    ustawienia; zostawienie jednej otwartej wystarcza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośnik
    przenośny dostępny w sesji zdalnej mimo zakazu po tamtej stronie.
  en: |
    The setting forbids the giving out to the session from afar of things joined to the client's machine and known
    of themselves: carried memories, picture-takers, readers and gear of measure.

    The first danger is carried media. A memory joined to the client's machine becomes to be had within the
    session from afar, and so passes by every bound laid upon media at the far machine's side. A policy forbidding
    media upon the server then gives nothing.

    The second danger is drivers. A thing turned into the session calls for a driver upon the far side, so strange
    gear brings about the loading of code upon a machine to which it was only pointed.

    The third danger is the road. Data go here both ways, so a thing serves both for the carrying in and for the
    carrying out.

    I set down that this item closes the kindred together with the turning of disks and of the holding place.
    Three roads for the carrying of content, three settings apart; the leaving of one open suffices.

    What an attacker gains while the item goes unmet: a carried medium to be had within the session from afar
    despite the forbidding upon that side.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest sprzęt
    używany w sesjach zdalnych.

    Miejscem pierwszym są czytniki i skanery obsługiwane przez program
    działający w sesji zdalnej. Po zmianie program przestanie widzieć
    urządzenie, choć będzie ono przyłączone do maszyny użytkownika —
    i to jest objaw mylący.

    Miejscem drugim są klucze sprzętowe wymagane przez programy
    branżowe. Przekierowanie bywa jedyną drogą, żeby program w sesji
    zdalnej zobaczył klucz wpięty u użytkownika.

    Miejscem trzecim są aparaty i urządzenia pomiarowe, z których dane
    pobiera się w sesji.

    Odnotowuję, że pamięci przenośne są tu przypadkiem, o który w tym
    punkcie chodzi najbardziej, a jednocześnie tym, którego użytkownicy
    bronią najsłabiej. Pozostałe wyjątki trzeba rozpatrzyć osobno.

    Skutek jest widoczny natychmiast, w postaci braku urządzenia w sesji.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: urządzeń przyłączonych do maszyny zdalnej, sesji
    jako takich, pracy programów, logowania, drukowania sieciowego.
  en: |
    The class is "needs review", and the object of the review is the gear used within sessions from afar.

    The first place is readers and scanners served by a program working within the session from afar. After the
    change the program will cease to see the thing, though it be joined to the user's machine - and that is a
    misleading sign.

    The second place is keys of gear called for by programs of a trade. The turning is at times the one road for a
    program in the session from afar to see a key plugged in at the user's.

    The third place is picture-takers and gear of measure whose data are taken within the session.

    I set down that carried memories are here the case the item is most about, and withal the one users guard
    least. The other exceptions must be weighed apart.

    The consequence is seen at once, in the shape of the thing's absence within the session.

    The consequence shows at once, with no restart.

    What this does not break: things joined to the far machine, the sessions themselves, the work of programs,
    logging on, or printing over the network.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Czytniki i skanery przyłączone u użytkownika przestaną być widoczne dla programu w sesji zdalnej
      - Objaw jest mylący, bo urządzenie jest przyłączone i działa na maszynie użytkownika
      - Klucze sprzętowe wymagane przez programy branżowe przestaną być widoczne w sesji
      - Aparaty i urządzenia pomiarowe, z których dane pobiera się w sesji, stracą tę drogę
      - Urządzenia przyłączone do maszyny zdalnej, sesje jako takie, praca programów i logowanie pozostają bez zmian
    en:
      - Readers and scanners joined at the user s will cease to be seen by the program within the session from afar
      - The sign is misleading, the thing being joined and working upon the user s machine
      - Keys of gear called for by programs of a trade will cease to be seen within the session
      - Picture-takers and gear of measure whose data are taken within the session will lose that road
      - Things joined to the far machine, the sessions themselves, the work of programs and logging on stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Program w sesji zdalnej wymaga klucza sprzętowego wpiętego do maszyny użytkownika
      - Praca w sesji obejmuje odczyt z czytnika albo urządzenia pomiarowego przyłączonego u użytkownika
    en:
      - A program in the session from afar calls for a key of gear plugged into the user s machine
      - Work in the session takes in the reading from a reader or gear of measure joined at the user s
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fDisablePNPRedir'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisablePNPRedir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisablePNPRedir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła domyka rodzinę trzech dróg przenoszenia treści: dyski,
    schowek, urządzenia. Warto, żeby aplikacja pokazała je razem,
    bo zostawienie jednej otwartej wystarcza, żeby pozostałe dwie
    przestały mieć znaczenie.

    Argument wart postawienia wprost dotyczy zakazu nośników. Zasada
    zabraniająca pamięci przenośnych na maszynie zdalnej nic nie daje,
    dopóki nośnik można pokazać tej maszynie przez sesję.

    Odnotowuję sterowniki jako drugie zagrożenie. Urządzenie
    przekierowane wymaga sterownika po stronie zdalnej, więc obcy sprzęt
    powoduje ładowanie kodu na maszynie, do której został tylko wskazany.
  en: |
    The rule closes the kindred of three roads for the carrying of content: disks, the holding place, things. It
    is well that the application show them together, the leaving of one open sufficing for the other two to lose
    their weight.

    The argument worth putting outright touches the forbidding of media. A policy forbidding carried memories upon
    the far machine gives nothing while a medium may be shown to that machine through a session.

    I set down drivers as the second danger. A thing turned in calls for a driver upon the far side, so strange
    gear brings about the loading of code upon a machine to which it was only pointed.
