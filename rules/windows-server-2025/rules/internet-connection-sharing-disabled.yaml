id: win2025-internet-connection-sharing-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Udostępnianie połączenia internetowego wyłączone
    en: Sharing an internet connection switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Udostępnianie połączenia zamienia maszynę w bramę: ruch z jednej
    karty wychodzi drugą z podmienionym adresem, a maszyna zaczyna pełnić
    rolę, do której nikt jej nie przeznaczył.

    Na serwerze najgorsze nie jest samo przepuszczanie ruchu. Najgorszy
    jest dodatek, o którym mało kto pamięta: razem z udostępnianiem
    startuje własny przydział adresów. Serwer zaczyna rozdawać adresy
    w sieci, w której jest już przydział prawidłowy — a maszyny, które
    zdążyły wziąć adres od niego, dostają wraz z nim jego jako bramę
    i jego jako serwer nazw.

    Skutek jest podwójny i oba jego brzegi są niedobre. Od strony
    eksploatacji to awaria sieci, która wygląda na przypadkową i trwa
    tak długo, aż ktoś zgadnie, gdzie szukać. Od strony bezpieczeństwa
    to gotowe stanowisko pośrednika: ruch części maszyn przechodzi przez
    tę jedną i da się go czytać i zmieniać.

    Punkt zamyka również drogę odwrotną — wyprowadzenie ruchu z sieci
    wewnętrznej na zewnątrz z pominięciem tego, co na brzegu sieci
    postawiono.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość uczynienia z serwera bramy i przydziału adresów, przez
    którą przechodzi ruch innych maszyn.
  en: |
    The sharing of a connection turns a machine into a gate - traffic from one card goes out by the
    other with its address swapped, and the machine takes on a part nobody set it to.

    On a server the worst is not the letting of traffic through itself. The worst is the addition
    few remember - along with the sharing there starts a dealing out of addresses of its own. The
    server begins dealing out addresses in a net wherein a right dealing out already is - and the
    machines that took an address from it get with it that machine as their gate and that machine
    as their server of names.

    The effect is twofold and both its edges are ill. From the side of running it is a fault of the
    net that looks like chance and lasts until somebody guesses where to seek. From the side of
    safety it is a ready place for a go-between - the traffic of some machines passes through this
    one and may be read and altered.

    The item shuts the road back as well - the leading of traffic out of the inner net with what
    was set at the net's edge passed by.

    What an attacker gains while the item goes unmet: the means of making of the server a gate and
    a dealing out of addresses through which other machines' traffic passes.

disruption_description:
  pl: |
    Zmiana jest bezpieczna do zastosowania zbiorczo i chcę powiedzieć,
    dlaczego tak uważam, zamiast zostawić to jako założenie.

    Udostępnianie połączenia nie jest mechanizmem serwerowym.
    Trasowanie, translacja adresów i przydział adresów mają na serwerze
    własne role, konfigurowane osobno i niezależne od tego ustawienia.
    Rola trasowania działa dalej, serwer przydziału adresów działa
    dalej, przełącznik wirtualny działa dalej — żadne z nich nie opiera
    się na udostępnianiu połączenia.

    Wyłączenie dotyczy więc mechanizmu, którego na serwerze nie używa
    się do niczego. Nie ma połączenia, które by się zerwało, ani usługi,
    która by przestała działać.

    Jedyna zauważalna rzecz to zniknięcie zakładki udostępniania
    z właściwości połączenia sieciowego. Jeżeli ktoś jej tam szuka,
    zobaczy, że jej nie ma — i to jest cała widoczna część tej zmiany.

    Wyjątek, przy którym zmiana coś odbiera, jest na tyle rzadki, że
    nie zmienia klasy, ale warto go znać: maszyna postawiona doraźnie
    jako brama dla segmentu laboratoryjnego. Jest to konfiguracja
    tymczasowa z założenia i lepiej ją zastąpić rolą trasowania niż
    utrzymywać na tym mechanizmie.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    The change is safe to apply in bulk and I mean to say why I hold so, rather than leave it as a
    supposition.

    The sharing of a connection is no mechanism of servers. Routing, the swapping of addresses and
    the dealing out of addresses have on a server parts of their own, set up apart and standing
    free of this setting. The part of routing works on, the server of the dealing out of addresses
    works on, the made-up switch works on - none of them leans upon the sharing of a connection.

    The switching off bears therefore on a mechanism used on a server for nothing. There is no
    connection that would break, nor a service that would stop.

    The one thing to be marked is the going of the sharing tab from the properties of a net
    connection. If somebody seeks it there, they will see it is not - and that is the whole seen
    part of this change.

    The exception whereat the change takes something away is rare enough not to alter the class,
    but is worth knowing - a machine set up for the while as a gate for a length used for trials.
    It is a setup meant to be for a time, and it is better replaced by the part of routing than
    kept upon this mechanism.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Zakładka udostępniania zniknie z właściwości połączenia sieciowego
      - Maszyna postawiona doraźnie jako brama dla segmentu laboratoryjnego przestanie nią być
      - Rola trasowania, serwer przydziału adresów i przełącznik wirtualny działają bez zmian
      - Żadne istniejące połączenie sieciowe nie zostanie zerwane przez tę zmianę
    en:
      - The sharing tab will go from the properties of a net connection
      - A machine set up for the while as a gate for a length used for trials will be one no more
      - The part of routing, the server of the dealing out of addresses and the made-up switch work unaltered
      - No standing net connection will be broken by this change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni doraźnie rolę bramy dla segmentu laboratoryjnego właśnie tym mechanizmem
    en:
      - The machine serves for the while as a gate for a length used for trials by this very mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_ShowSharedAccessUI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_ShowSharedAccessUI'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Routing, the swapping of addresses and the dealing out of addresses have
    # their own parts on a server and none of them leans upon this mechanism.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_ShowSharedAccessUI' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/ras/ras-gateway-overview

notes:
  pl: |
    Rzecz, o której mało kto pamięta i która decyduje o wadze tego
    punktu na serwerze: razem z udostępnianiem startuje własny przydział
    adresów. Serwer zaczyna rozdawać adresy w sieci, w której jest już
    przydział prawidłowy, i podaje siebie jako bramę oraz serwer nazw.

    Zostawiam klasę „bez uciążliwości", bo udostępnianie połączenia nie
    jest mechanizmem serwerowym. Trasowanie, translacja adresów
    i przydział adresów mają na serwerze własne role i żadna z nich się
    na nim nie opiera.
  en: |
    The thing few remember and that settles this item's weight on a server - along with the sharing
    there starts a dealing out of addresses of its own. The server begins dealing out addresses in
    a net wherein a right dealing out already is, and gives itself out as the gate and as the
    server of names.

    I leave the class "no disruption", the sharing of a connection being no mechanism of servers.
    Routing, the swapping of addresses and the dealing out of addresses have on a server parts of
    their own and none of them leans upon it.
