id: win2016-nbt-ns-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Network > NetBIOS over TCP/IP
  title:
    pl: Starszy mechanizm nazw wyłączony na wszystkich kartach
    en: The older name mechanism switched off on every card
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza starszy mechanizm nazw na każdej karcie sieciowej
    maszyny z osobna, zamiast ograniczać sposób, w jaki ten mechanizm pyta.

    Różnica względem reguł sąsiednich jest zasadnicza. Tryb punkt-punkt
    zabrania rozgłaszać pytania, ale mechanizm zostaje: nadal ogłasza
    obecność maszyny, nadal przyjmuje komunikaty, nadal jest warstwą, którą
    trzeba pilnować. Wyłączenie go na karcie usuwa tę warstwę z tej karty
    całkowicie.

    Wartość bierze się stąd, że mechanizm ten jest dziś niepotrzebny prawie
    wszędzie, a jednocześnie niesie własne uwierzytelnianie, własne
    ogłaszanie się w sieci i własne, dawno opisane słabości. Nie da się go
    naprawić — można go tylko wyłączyć albo obstawić regułami.

    Ważną cechą tego ustawienia jest to, że żyje przy każdej karcie osobno.
    Maszyna nie ma jednego przełącznika; ma ich tyle, ile kart, a stanem
    maszyny jest stan karty najsłabszej. Karta dodana po wdrożeniu wraca do
    wartości domyślnej i punkt przestaje być spełniony bez żadnego
    ostrzeżenia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działającą
    warstwę nazw ze starszym uwierzytelnianiem i własnym ogłaszaniem się
    w segmencie, na każdej karcie, na której jej nie wyłączono.
  en: |
    The setting switches the older name mechanism off on each of the machine's
    network cards apart, instead of limiting the way that mechanism asks.

    The difference from the neighbouring rules is fundamental. Point-to-point mode
    forbids questions to be called out, but the mechanism remains: it still
    announces the machine's presence, still takes messages in, still is a layer that
    has to be watched. Switching it off on a card removes that layer from that card
    altogether.

    The value comes of the mechanism being needless today almost everywhere while
    carrying an authentication of its own, an announcing of itself on the network of
    its own, and weaknesses of its own long since described. It cannot be mended -
    it can only be switched off or hedged about with rules.

    An important trait of this setting is that it lives by each card apart. The
    machine has no single switch; it has as many as it has cards, and the machine's
    state is the state of its weakest card. A card added after rollout returns to
    the default value and the item ceases to be met with no warning at all.

    What an attacker gains while the item goes unmet: a working name layer with an
    older authentication and an announcing of itself in the segment, on every card
    where it has not been switched off.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to najcięższy punkt w całym
    bloku rozwiązywania nazw.

    Wyłączenie mechanizmu odcina wszystko, co odnajduje zasoby po nazwie
    krótkiej. Dotyczy to starszych aplikacji odwołujących się do serwera
    jedną nazwą, udziałów wskazywanych bez pełnej nazwy, części drukarek
    sieciowych, przeglądania otoczenia sieciowego oraz skryptów logowania
    pisanych lata temu.

    Rzecz, która rozstrzyga o powodzeniu, brzmi: czy wszystkie nazwy używane
    w tej sieci są zapisane w serwerze nazw. Jeżeli tak — zmiana przechodzi
    gładko i nikt jej nie zauważy. Jeżeli nie — przestaną działać dokładnie
    te odwołania, których nikt nie zinwentaryzował, bo działały same z siebie.

    Osobno trzeba wymienić klienty i urządzenia starsze. Skanery i kopiarki
    wysyłające dokumenty na udział sieciowy potrafią korzystać wyłącznie ze
    starszego mechanizmu. Podobnie sprzęt przemysłowy i część oprogramowania
    sprzed lat.

    Objaw jest różny w zależności od tego, co przestało działać, i rzadko
    wskazuje na przyczynę. Najczęściej brzmi „nie widzę serwera" albo „nie
    mogę zapisać na udział", a czasem po prostu „dłużej się łączy", bo
    maszyna czeka na próbę, która nie ma prawa się powieść.

    Czego to nie psuje: udziałów wskazywanych pełną nazwą, rozwiązywania
    nazw przez serwer nazw, łączności po adresie, logowania do domeny.

    Bez restartu, ale skutek na otwartych połączeniach pojawia się
    stopniowo.
  en: |
    The class is "needs a planned rollout", and it is the heaviest item in the whole
    name-resolution block.

    Switching the mechanism off cuts off everything that finds resources by a short
    name. That takes in older applications referring to a server by one name, shares
    pointed at without a full name, some network printers, the browsing of the
    network neighbourhood, and sign-in scripts written years ago.

    The thing that settles success reads: are all the names used on this network
    written into the name server. If so, the change passes smoothly and nobody will
    notice it. If not, what will stop working are precisely those references nobody
    has inventoried, because they worked of their own accord.

    Older clients and devices have to be named apart. Scanners and copiers sending
    documents to a network share can at times use the older mechanism alone. So too
    can industrial equipment and some software of years ago.

    The symptom varies with what has stopped working and seldom points at the cause.
    Most often it reads "I cannot see the server" or "I cannot save to the share",
    and at times simply "it takes longer to connect", since the machine waits on an
    attempt that has no right to succeed.

    What this does not break: shares pointed at by a full name, name resolution by
    the name server, connectivity by address, or signing in to the domain.

    No restart, but the effect on open connections appears gradually.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Skanery, kopiarki i sprzęt przemysłowy wysyłające dokumenty na udział sieciowy tracą jedyny sposób odnalezienia go, jeśli korzystają wyłącznie ze starszego mechanizmu
      - Starsze aplikacje i skrypty logowania odwołujące się do serwera nazwą krótką przestają go odnajdywać
      - Przeglądanie otoczenia sieciowego przestaje pokazywać maszynę i przestaje działać z jej strony
      - Karta sieciowa dodana po wdrożeniu wraca do wartości domyślnej i punkt przestaje być spełniony bez ostrzeżenia
    en:
      - Scanners, copiers and industrial equipment sending documents to a network share lose their only way of finding it, if they use the older mechanism alone
      - Older applications and sign-in scripts referring to a server by a short name cease to find it
      - Browsing of the network neighbourhood stops showing the machine and stops working from its side
      - A network card added after rollout returns to the default value and the item ceases to be met with no warning
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - W sieci pracują skanery, kopiarki albo sprzęt przemysłowy odnajdujące udziały wyłącznie starszym mechanizmem
      - Nie zinwentaryzowano nazw krótkich używanych w skryptach, zadaniach i konfiguracji aplikacji
      - Maszyna pełni rolę wymagającą przeglądania otoczenia sieciowego przez starsze klienty
    en:
      - Scanners, copiers or industrial equipment that find shares by the older mechanism alone work on the network
      - The short names used in scripts, scheduled tasks and application configuration have not been inventoried
      - The machine fills a role calling for the network neighbourhood to be browsed by older clients
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting lives by each card apart, so the state of the machine is the
      # state of the weakest card. Cards still admitting the mechanism are counted
      # and reported, because one of them is enough to leave the road open.
      $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
      $interfaces = @(Get-ChildItem -Path $root -ErrorAction Stop)
      if ($interfaces.Count -eq 0) { 'CHECK_ERROR' }
      else {
        $enabled = @($interfaces | Where-Object {
          $value = (Get-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -ErrorAction SilentlyContinue).NetbiosOptions
          $null -eq $value -or [int]$value -ne 2
        })
        if ($enabled.Count -eq 0) { 'ALL_DISABLED' }
        else { 'ENABLED_ON_' + $enabled.Count + '_OF_' + $interfaces.Count }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
    Get-ChildItem -Path $root | ForEach-Object {
      $current = (Get-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -ErrorAction SilentlyContinue).NetbiosOptions
      [pscustomobject]@{
        path    = $_.PSPath
        value   = $current
        existed = ($null -ne $current)
      }
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The setting lives by each card apart, so a card added later comes back to the
    # value by default and this item stops being met. It is worth auditing again
    # after every change to the machine's network configuration.
    $root = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
    Get-ChildItem -Path $root | ForEach-Object {
      Set-ItemProperty -Path $_.PSPath -Name 'NetbiosOptions' -Value 2 -Type DWord
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $entry.path -Name 'NetbiosOptions' -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $entry.path -Name 'NetbiosOptions' -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt należy do poziomu drugiego i słusznie. Jest to wyłączenie całej
    warstwy, a nie ograniczenie jej zachowania — właściwe maszynom, których
    otoczenie zostało sprawdzone, a nie domyślnym.

    Zależność wobec reguł sąsiednich warto pokazać wprost, bo jest rozłączna.
    Tam, gdzie warstwa jest wyłączona, tryb punkt-punkt i ignorowanie żądań
    zwolnienia nazwy tracą znaczenie praktyczne — zostają jako
    zabezpieczenie na wypadek jej powrotu, choćby wraz z nową kartą. Kolejność
    wdrażania jest zatem naturalna: najpierw reguły łagodniejsze, potem ta.

    Cecha, która odróżnia ten punkt od wszystkich pozostałych w zestawie:
    stan nie jest trwały. Każda nowa karta sieciowa — fizyczna, wirtualna,
    tunelu, klastra — przychodzi z wartością domyślną i cofa zgodność.
    Reguła powinna być audytowana po każdej zmianie w konfiguracji sieciowej
    maszyny, a nie tylko przy przeglądzie okresowym. Audyt zwraca liczbę kart
    niezgodnych, żeby raport mówił, ile ich jest, a nie tylko że coś jest nie
    tak.
  en: |
    The item belongs to the second level and rightly so. It is the switching off of
    a whole layer rather than a limiting of its behaviour - fit for machines whose
    surroundings have been checked, and not for default ones.

    The relation to the neighbouring rules is worth showing outright, since it is
    exclusive. Where the layer is off, point-to-point mode and the ignoring of name
    release demands lose their practical meaning - they remain as a safeguard should
    it return, if only with a new card. The order of rollout is therefore natural:
    the milder rules first, then this one.

    The trait setting this item off from every other in the set: its state is not
    lasting. Every new network card - physical, virtual, tunnel, cluster - arrives
    with the default value and undoes compliance. The rule ought to be audited after
    every change to the machine's network configuration rather than at the periodic
    review alone. The audit returns the number of cards out of compliance, so that
    the report says how many there are and not merely that something is amiss.
