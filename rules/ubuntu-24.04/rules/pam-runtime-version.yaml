id: ubuntu2404-pam-runtime-version

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.1.1
  section: Access Control > Pluggable Authentication Modules > Configure PAM software packages
  title:
    pl: Zainstalowana jest aktualna wersja PAM
    en: Ensure latest version of pam is installed
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    PAM obsługuje uwierzytelnianie przy logowaniu, sudo, su i zmianie hasła.
    Nowsze wersje zawierają poprawki bezpieczeństwa i opcje modułów, na
    których opierają się dalsze punkty tego rozdziału, np. konfiguracja
    pam_faillock i pam_pwhistory w osobnych plikach.

    Punkt wymaga pakietu libpam-runtime w wersji 1.5.3-5 lub nowszej.
  en: |
    PAM handles authentication at login, sudo, su and password change.
    Newer versions contain security fixes and module options that later
    items of this chapter rely on, for example pam_faillock and
    pam_pwhistory settings in separate files.

    The item requires the libpam-runtime package in version 1.5.3-5 or
    later.

disruption_description:
  pl: |
    Nikt tego nie zauważy: każde wydanie Ubuntu 24.04 ma PAM w wersji
    1.5.3-5 lub nowszej.
  en: |
    Nobody will notice: every Ubuntu 24.04 release has PAM in version
    1.5.3-5 or later.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Brak znanych skutków; reguła tylko sprawdza wersję pakietu
    en:
      - No known effects; the rule only checks the package version
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v dpkg-query >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    v=$(dpkg-query -W -f='${db:Status-Status} ${Version}' libpam-runtime 2>/dev/null) || v=""
    case "$v" in
      "installed "*) v=${v#installed } ;;
      *) echo "NOT_OK:libpam-runtime=not-installed"; exit 0 ;;
    esac
    if dpkg --compare-versions "$v" ge 1.5.3-5; then echo "OK:libpam-runtime=$v"; else echo "NOT_OK:libpam-runtime=$v,need=1.5.3-5"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/pam.conf.5.html
  - https://manpages.ubuntu.com/manpages/noble/man1/dpkg-query.1.html
  - https://manpages.ubuntu.com/manpages/noble/man1/dpkg.1.html
  - https://manpages.ubuntu.com/manpages/noble/man8/apt-get.8.html

notes:
  pl: |
    Sprawdzenie pyta dpkg-query o wersję pakietu libpam-runtime i porównuje
    ją poleceniem dpkg --compare-versions, więc wersje Ubuntu, np.
    1.5.3-5ubuntu5, są zgodne. Reguła tylko sprawdza stan: PAM aktualizuje
    się razem z resztą systemu, np. apt-get upgrade albo
    unattended-upgrades, a powrotu do starszej wersji PAM nie da się
    bezpiecznie wycofać. Wersja dostępna w repozytorium nie jest
    sprawdzana.
  en: |
    The check asks dpkg-query for the version of the libpam-runtime package
    and compares it with dpkg --compare-versions, so Ubuntu versions such as
    1.5.3-5ubuntu5 are compliant. The rule only checks the state: PAM is
    updated together with the rest of the system, for example with apt-get
    upgrade or unattended-upgrades, and going back to an older PAM version
    cannot be rolled back safely. The version available in the repository
    is not checked.
