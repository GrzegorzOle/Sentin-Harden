id: win11-restore-files-administrators

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: User Rights Assignment
  title:
    pl: Odtwarzanie plików zastrzeżone dla administratorów
    en: Restoring files restricted to administrators
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Uprawnienie do odtwarzania pozwala zapisać dowolny plik z pominięciem jego
    uprawnień i ustawić mu dowolnego właściciela. Program odtwarzający kopię musi
    to potrafić, bo inaczej nie przywróciłby cudzych katalogów ze stanem sprzed
    awarii.

    Poza programem odtwarzającym ta sama zdolność oznacza prawo nadpisania
    czegokolwiek na dysku — łącznie z plikami wykonywalnymi systemu
    i bibliotekami ładowanymi przez usługi działające jako system. Konto z tym
    uprawnieniem podmienia plik i czeka, aż system sam uruchomi podmienioną
    zawartość z pełnymi uprawnieniami. To krótsza droga do przejęcia maszyny niż
    czytanie cudzych plików i dlatego punkt jest oceniony wyżej niż kopia
    zapasowa.
  en: |
    The restore right allows any file to be written regardless of its permissions
    and any owner to be set on it. Restore software has to be able to do this, or
    it could not return other people's folders to their state before a failure.

    Outside restore software the same ability means the right to overwrite
    anything on disk - including system executables and libraries loaded by
    services running as the system. An account holding it replaces a file and
    waits for the system to run the replaced content itself, with full rights.
    That is a shorter route to taking over the machine than reading other
    people's files, which is why this item is rated above the backup one.

disruption_description:
  pl: |
    Tak jak przy kopii zapasowej, zmiana uderza w oprogramowanie działające
    z konta innego niż administrator — z tą różnicą, że odtwarzanie jest
    uruchamiane rzadko i zwykle wtedy, gdy coś już się zepsuło. Brak uprawnienia
    ujawni się więc w najgorszym momencie: w trakcie odtwarzania po awarii.

    Objaw jest inny niż przy kopii i łatwiejszy do zauważenia. Odtwarzanie
    kończy się błędem odmowy dostępu na pierwszym pliku, do którego zabrakło
    praw, zamiast po cichu pomijać pliki. Gorzej, jeśli zadanie przerwie się
    w połowie — wtedy część danych jest już przywrócona, a część nie.
  en: |
    As with backup, the change hits software running under an account other than
    an administrator - with the difference that a restore runs rarely, and usually
    when something has already gone wrong. The missing right will therefore
    surface at the worst possible moment: during a restore after a failure.

    The symptom differs from the backup case and is easier to notice. The restore
    fails with an access denied error on the first file it lacks rights for,
    rather than quietly skipping files. Worse if the job stops halfway - some of
    the data is then restored and some is not.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Odtwarzanie z konta innego niż administrator zakończy się odmową dostępu
      - Przerwane w połowie odtwarzanie zostawi część danych przywróconą, a część nie
      - Narzędzia przenoszące profile użytkowników na nową maszynę stracą możliwość ustawienia właściciela plików
    en:
      - A restore run under an account other than an administrator fails with access denied
      - A restore interrupted halfway leaves some data recovered and some not
      - Tools migrating user profiles to a new machine lose the ability to set file ownership
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Odtwarzanie kopii wykonuje konto usługowe, które nie należy do administratorów
      - Trwa odtwarzanie danych po awarii i zmiana mogłaby je przerwać
    en:
      - Restores are performed by a service account that is not a member of the administrators group
      - A recovery is under way and the change could interrupt it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRestorePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRestorePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRestorePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRestorePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/restore-files-and-directories

notes:
  pl: |
    Wycofanie przywraca listę uprawnionych, ale nie cofa niczego, co w czasie
    obowiązywania zmiany zostało nadpisane albo pominięte. Jeśli punkt wdrożono
    w trakcie odtwarzania danych, powrót do poprzedniej listy nie naprawia tego,
    co odtworzyło się tylko częściowo — to trzeba uruchomić od nowa.

    Uprawnienie do odtwarzania pozwala też ustawić dowolnego właściciela pliku,
    co jest odrębną zdolnością od zapisu i osobno groźną: właściciel może nadać
    sobie dowolne uprawnienia, więc nadanie własności to nadanie pełnego dostępu
    z opóźnieniem.
  en: |
    A rollback restores the list of holders, but undoes nothing that was
    overwritten or skipped while the change was in force. If the item was applied
    during a recovery, returning to the previous list does not repair data that
    was only partly restored - that has to be run again.

    The restore right also allows any owner to be set on a file, which is a
    separate ability from writing and separately dangerous: an owner can grant
    themselves any permissions, so assigning ownership is granting full access
    with a delay.
