id: win2025-ntlm-session-security-server

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Minimalne zabezpieczenie sesji po stronie serwera
    en: Minimum session security on the server's side
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, jak mocno ma być chroniona sesja, którą ta maszyna
    przyjmuje od klientów uwierzytelniających się starszym mechanizmem,
    i wymaga zarazem szyfrowania oraz podpisu opartego na współczesnej
    funkcji skrótu.

    Jest to odbicie wymagania klienckiego, ale waga jest inna i wynika
    z kierunku. Wymaganie klienckie chroni sesje, które ta maszyna
    nawiązuje — jest ich zwykle kilka. Wymaganie serwerowe chroni wszystkie
    sesje przychodzące, a na serwerze jest ich tyle, ilu jest użytkowników
    i urządzeń w sieci.

    Bez tego wymagania serwer godzi się na wariant, o który poprosi klient.
    Napastnik, który kontroluje klienta albo drogę do niego, prosi o wariant
    najsłabszy i dostaje sesję bez szyfrowania i bez podpisu. Dalsza część
    jest już rutyną: odczyt treści, podmiana żądań, wykorzystanie
    uwierzytelnienia przeprowadzonego przez kogoś uprawnionego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję do tego
    serwera na warunkach, które sam wybiera. Zabezpieczenie jest obecne,
    ale to strona przeciwna decyduje, czy zostanie użyte.
  en: |
    The setting settles how strongly a session this machine takes from clients
    authenticating by the older mechanism is to be guarded, and takes both encryption and a
    signature resting on a present-day digest function.

    It is a mirror of the client demand, but the weight differs and follows from the
    direction. The client demand guards the sessions this machine sets up - usually a few.
    The server demand guards every incoming session, and on a server there are as many of
    those as there are users and devices on the network.

    Without that demand the server agrees to the variant the client asks for. An attacker
    controlling the client or the road to it asks for the weakest variant and gets a session
    with no encryption and no signature. The rest is routine by then: reading the contents,
    swapping the requests, making use of an authentication carried out by somebody entitled.

    What an attacker gains while the item goes unmet: a session to this server on terms they
    choose themselves. The safeguard is present, but it is the opposing side that settles
    whether it is used.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że wymóg po stronie serwera dotyczy
    wszystkiego, co do tej maszyny sięga starszym mechanizmem — i odcina
    to natychmiast, bez okresu przejściowego.

    Różnica wobec wymagania klienckiego jest tu ta sama co przy
    podpisywaniu sesji plikowych i tak samo przesądza o klasie. Tam psuje
    się jedno połączenie tej maszyny. Tu psują się połączenia wszystkich
    maszyn do niej.

    Odciętymi bywają: starsze urządzenia sieciowe łączące się z udziałami,
    oprogramowanie przemysłowe, implementacje protokołu plikowego spoza
    rodziny Windows w wersjach sprzed lat oraz aplikacje własne
    uwierzytelniające się przez biblioteki systemowe w konfiguracji
    domyślnej z tamtych czasów.

    Objawem jest odmowa przy nawiązywaniu połączenia, opisywana po stronie
    klienta jako błąd logowania albo błąd sieci. Przyczyna nie jest widoczna
    po żadnej ze stron bez zajrzenia w dziennik.

    Przed wdrożeniem warto przez kilka dni rejestrować uwierzytelnienia
    starszym mechanizmem. Pokazuje to, kto się nim łączy, i jest jedynym
    sposobem na ustalenie tego bez zgadywania.

    Zmiana nie wymaga restartu, ale sesje już zestawione trwają
    do rozłączenia.
  en: |
    A knowing rollout is needed because the demand on the server's side concerns everything
    reaching this machine by the older mechanism - and cuts it off at once, with no period
    of transition.

    The difference from the client demand is the same here as with the signing of file
    sessions and settles the class the same way. There one connection of this machine
    breaks. Here every machine's connections to it break.

    Those cut off are at times: older network devices connecting to shares, industrial
    software, implementations of the file protocol outside the Windows family in versions
    from years ago, and applications of one's own authenticating through system libraries in
    a default configuration of those days.

    The symptom is a refusal at the setting up of a connection, described on the client's
    side as a sign-in error or a network error. The cause is visible on neither side without
    looking into the log.

    Before the rollout it is worth recording authentications by the older mechanism over a
    few days. That shows who connects by it and is the one way of establishing this without
    guessing.

    The change takes no restart, but sessions already set up last until they are
    disconnected.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - encryption-and-tls
    - legacy-applications
  what_breaks:
    pl:
      - Starsze urządzenia sieciowe łączące się z udziałami tej maszyny tracą dostęp
      - Aplikacje uwierzytelniające się przez biblioteki systemowe w starej konfiguracji dostają odmowę
      - Odmowa jest opisywana jako błąd logowania albo błąd sieci, nie jako niezgodność wymagań
      - Sesje zestawione przed zmianą trwają do rozłączenia
    en:
      - Older network devices connecting to this machine's shares lose access
      - Applications authenticating through system libraries in an old configuration get a refusal
      - The refusal is described as a sign-in or a network error rather than as a mismatch of demands
      - Sessions set up before the change last until they are disconnected
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z serwerem łączą się urządzenia nieumiejące zestawić sesji szyfrowanej i podpisanej
      - Nie sprawdzono w dzienniku, kto uwierzytelnia się starszym mechanizmem
    en:
      - Devices unable to set up an encrypted and signed session connect to the server
      - It has not been checked in the log who authenticates by the older mechanism
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'NTLMMinServerSec'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '537395200'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $current = (Get-ItemProperty -Path $path -Name 'NTLMMinServerSec' -ErrorAction SilentlyContinue).'NTLMMinServerSec'
    [pscustomobject]@{
      path        = $path
      name        = 'NTLMMinServerSec'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    # The value joins two demands set as bits: session encryption and a
    # signature resting on a present-day digest function.
    Set-ItemProperty -Path $path -Name 'NTLMMinServerSec' -Value 537395200 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-minimum-session-security-for-ntlm-ssp-based-including-secure-rpc-servers

notes:
  pl: |
    Wartość jest sumą bitów, nie liczbą porządkową. Wynik zbliżony liczbowo
    opisuje konfigurację zupełnie inną, więc porównanie jest dokładne.

    Punkt ma bliźniaka po stronie klienckiej, w tym samym kluczu. Oba są
    potrzebne i żaden nie zastępuje drugiego — ten chroni sesje przychodzące,
    tamten wychodzące. Na serwerze ten waży więcej.

    Czyta się go razem z poziomem uwierzytelniania menedżera sieci
    i z podpisywaniem sesji plikowych. Wszystkie trzy opisują ten sam
    obszar z różnych stron i dopiero razem zamykają drogę wejścia w środek
    sesji.
  en: |
    The value is a sum of bits rather than an ordinal number. A numerically near result
    describes an altogether different configuration, so the comparison is exact.

    The item has a twin on the client's side, in the same key. Both are needed and neither
    stands in for the other - this one guards incoming sessions, that one outgoing. On a
    server this one weighs more.

    It is read together with the network manager authentication level and with the signing
    of file sessions. All three describe the same area from different sides and only
    together close the road into the middle of a session.
