id: win11-bitlocker-enhanced-pin-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Kod startowy może zawierać znaki inne niż cyfry
    en: The startup code may hold characters other than digits
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Kod odblokowujący dysk jest domyślnie ciągiem samych cyfr. Siedem cyfr daje
    dziesięć milionów kombinacji — dużo, ale mniej, niż się wydaje, bo ludzie
    wybierają daty, powtórzenia i ciągi z klawiatury numerycznej, a napastnik
    zaczyna właśnie od nich.

    Dopuszczenie liter, wielkich liter i znaków przestankowych zmienia
    przestrzeń poszukiwań o kilka rzędów wielkości przy tej samej długości.
    Ważniejsze jednak, że zmienia sposób wybierania kodu: z liczby, którą trzeba
    zapamiętać jako liczbę, na coś, co można zbudować ze słów — a więc dłuższe
    i mniej przewidywalne przy tym samym wysiłku pamięciowym.

    Punkt niczego nie wymusza. Otwiera możliwość, z której użytkownik korzysta
    albo nie — i dlatego jego wartość jest realna, ale umiarkowana.
  en: |
    The code unlocking the disk is by default a string of digits alone. Seven digits
    give ten million combinations - a lot, but less than it seems, because people
    pick dates, repetitions and runs off the numeric keypad, and an attacker starts
    with exactly those.

    Admitting letters, capitals and punctuation changes the search space by several
    orders of magnitude at the same length. More importantly, it changes how a code
    is picked: from a number that has to be remembered as a number into something
    that can be built out of words - and so longer and less predictable for the same
    effort of memory.

    The item forces nothing. It opens a possibility the user either takes or does
    not - and that is why its worth is real but moderate.

disruption_description:
  pl: |
    Sprawdzenia wymaga układ klawiatury na stanowiskach oraz to, czy
    oprogramowanie sprzętowe je obsługuje.

    Ekran sprzed startu systemu nie zna układu klawiatury ustawionego
    w Windows — działa na układzie oprogramowania sprzętowego, zwykle
    amerykańskim. Znaki, które na klawiaturze są pod innym klawiszem niż
    w tym układzie, trafią więc gdzie indziej niż użytkownik zakłada. Przy
    samych cyfrach problem nie występuje; przy literach i znakach przestankowych
    występuje i bywa źródłem zablokowanych komputerów.

    Drugą rzeczą jest obsługa: część starszego oprogramowania sprzętowego
    przyjmuje wyłącznie cyfry i kod z literami po prostu nie zadziała. Objawem
    jest ekran odrzucający poprawny kod.

    Nic nie przestaje działać w chwili wdrożenia — zmiana otwiera możliwość,
    a nie odbiera. Ryzyko pojawia się dopiero, gdy ktoś z niej skorzysta na
    maszynie, która tego nie uniesie. Dlatego warto punkt wdrożyć razem
    z informacją, na jakim układzie klawiatury działa ekran startowy.

    Zmiana obowiązuje przy ustawianiu nowego kodu.
  en: |
    What needs checking is the keyboard layout at the stations and whether the
    firmware supports this.

    The screen from before the system starts does not know the keyboard layout set
    in Windows - it works on the firmware's layout, usually the American one.
    Characters that sit under a different key on the keyboard than in that layout
    will therefore land elsewhere than the user expects. With digits alone the
    problem does not arise; with letters and punctuation it does, and is a source of
    locked computers.

    The second thing is support: some older firmware takes digits only, and a code
    with letters simply will not work. The symptom is a screen refusing a correct
    code.

    Nothing stops working at the moment of the rollout - the change opens a
    possibility rather than taking one away. The risk appears only when somebody
    takes it up on a machine that cannot carry it. That is why the item is worth
    applying together with word about the layout the startup screen works on.

    The change takes effect when a new code is set.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Kod z literami wpisany na ekranie startowym może trafić w inne znaki, bo ekran działa na układzie klawiatury oprogramowania sprzętowego
      - Starsze oprogramowanie sprzętowe przyjmuje wyłącznie cyfry i odrzuci poprawny kod z literami
    en:
      - A code with letters typed on the startup screen may land on other characters, because the screen works on the firmware's keyboard layout
      - Older firmware takes digits only and will refuse a correct code with letters
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Oprogramowanie sprzętowe na stanowiskach przyjmuje przy starcie wyłącznie cyfry
      - Nie da się przekazać użytkownikom, na jakim układzie klawiatury działa ekran startowy
    en:
      - The firmware at the stations takes digits only at startup
      - Users cannot be told which keyboard layout the startup screen works on
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'UseEnhancedPin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'UseEnhancedPin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseEnhancedPin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt dopuszcza znaki inne niż cyfry, ale ich nie wymaga. Użytkownik dalej
    może ustawić kod z samych cyfr i reguła nie sprawdza, co faktycznie ustawił —
    sprawdza, czy możliwość jest otwarta.

    Jest to jedyny punkt w tej grupie, którego skutek zależy od sprzętu w sposób
    trudny do sprawdzenia z poziomu systemu. Obsługa znaków innych niż cyfry
    należy do oprogramowania sprzętowego i nie da się jej odczytać wprost —
    stąd klasa wymagająca sprawdzenia, mimo że sama zmiana niczego nie odbiera.
  en: |
    The item admits characters other than digits but does not require them. The user
    can still set a code of digits alone, and the rule does not check what they
    actually set - it checks whether the possibility is open.

    It is the only item in this group whose effect depends on hardware in a way hard
    to check from the system. Support for characters other than digits belongs to
    the firmware and cannot be read directly - hence the class calling for a check,
    although the change itself takes nothing away.
