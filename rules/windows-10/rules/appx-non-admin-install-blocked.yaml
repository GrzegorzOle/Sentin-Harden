id: win10-appx-non-admin-install-blocked

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > App Package Deployment
  title:
    pl: Instalowanie pakietów aplikacji przez użytkowników bez uprawnień zablokowane
    en: The laying on of packages of applications by users without rights blocked
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera użytkownikom bez uprawnień administratora
    możliwość instalowania pakietów aplikacji na własnym koncie.

    Pakiety aplikacji instalują się inaczej niż programy klasyczne.
    Nie wymagają podniesienia uprawnień, bo trafiają do profilu
    użytkownika i działają w ograniczonym otoczeniu. Z tej przyczyny
    zwykły użytkownik może wprowadzić oprogramowanie na maszynę bez
    pytania kogokolwiek o zgodę.

    Ograniczone otoczenie nie znaczy nieszkodliwe. Pakiet może czytać
    i wysyłać dane, do których użytkownik ma dostęp, może rejestrować
    zadania uruchamiane przy logowaniu i może żądać uprawnień, które
    użytkownik odruchowo przyzna.

    Sednem jest jednak co innego: takie oprogramowanie omija wykaz.
    Maszyna, na której spisuje się zainstalowane programy, przestaje mieć
    spis pełny, jeżeli obok wolno wprowadzać pakiety bez śladu w tym
    miejscu, w które się patrzy.

    Odnotowuję, że punkt nie dotyczy sklepu systemowego ani pakietów
    wdrażanych przez administratora. Dotyczy instalacji pakietu
    wprowadzonego przez użytkownika samodzielnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    na wprowadzenie oprogramowania bez uprawnień i bez śladu w wykazie.
  en: |
    The setting takes from users without the rights of an administrator the power of laying on packages of
    applications upon their own reckoning.

    Packages of applications are laid on otherwise than programs of the older make. They call for no raising of
    rights, coming to rest in the user's profile and working in a bounded setting. For that cause an ordinary user
    may bring software upon the machine without asking anybody's leave.

    A bounded setting does not mean a harmless one. A package may read and send data the user has reach of, may
    set down tasks to be started at a logging on, and may ask for rights the user will grant by reflex.

    The heart of it is however another thing: such software goes about the roll. A machine upon which laid-on
    programs are set down ceases to have a full roll if beside that packages may be brought in leaving no trace in
    the place that is looked at.

    I set down that the item touches not the system's store nor packages rolled out by an administrator. It
    touches the laying on of a package brought in by the user themselves.

    What an attacker gains while the item goes unmet: a way of bringing software in without rights and without a
    trace upon the roll.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    użytkownicy wprowadzają pakiety samodzielnie i po co.

    Miejscem wartym uwagi są zespoły wytwarzające oprogramowanie. Tam
    instalowanie własnych pakietów w trakcie pracy jest zwykłą czynnością
    i po zmianie przestanie być możliwe bez udziału administratora.

    Miejscem drugim są narzędzia rozdawane wewnątrz organizacji jako
    pakiety, poza sklepem systemowym. Jeżeli instrukcja mówi
    użytkownikowi, żeby kliknął plik i zainstalował, po zmianie zobaczy
    odmowę.

    Odnotowuję, że rozwiązaniem jest wdrażanie takich pakietów centralnie,
    a nie zniesienie punktu. Wdrożenie centralne daje przy okazji to,
    czego punkt broni: ślad w wykazie.

    Skutek jest widoczny dla użytkownika i pojawia się natychmiast, bez
    restartu. Pakiety zainstalowane wcześniej działają dalej.

    Czego to nie psuje: sklepu systemowego, pakietów wdrażanych
    centralnie, pakietów już zainstalowanych, programów klasycznych,
    logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether users bring packages in themselves and to
    what end.

    The place worth notice is teams that make software. There the laying on of packages of their own in the course
    of work is an ordinary doing and after the change will cease to be to be had without an administrator's part
    in it.

    The second place is tools handed out within the body as packages, outside the system's store. If the
    directions bid the user press the file and lay it on, after the change they will see a refusal.

    I set down that the answer is the rolling out of such packages from the middle and no lifting of the item. A
    rollout from the middle gives besides the very thing the item guards: a trace upon the roll.

    The consequence is plain to the user and shows at once, with no restart. Packages laid on earlier work on.

    What this does not break: the system's store, packages rolled out from the middle, packages already laid on,
    programs of the older make, logging on, or printing.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zespoły wytwarzające oprogramowanie stracą możliwość instalowania własnych pakietów w trakcie pracy
      - Narzędzia rozdawane wewnątrz organizacji jako pliki pakietów przestaną instalować się z instrukcji dla użytkownika
      - Użytkownik zobaczy odmowę, a nie wyjaśnienie, więc zgłosi to jako awarię instalatora
      - Rozwiązaniem jest wdrażanie takich pakietów centralnie, co przy okazji zostawia ślad w wykazie
      - Sklep systemowy, pakiety już zainstalowane, programy klasyczne, logowanie i drukowanie pozostają bez zmian
    en:
      - Teams that make software will lose the power of laying on packages of their own in the course of work
      - Tools handed out within the body as files of packages will cease to be laid on from the directions given the user
      - The user will see a refusal and no setting out, so they will report it as a breakdown of the installer
      - The answer is the rolling out of such packages from the middle, which leaves besides a trace upon the roll
      - The system s store, packages already laid on, programs of the older make, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna służy wytwarzaniu oprogramowania, w którym instalowanie własnych pakietów jest czynnością codzienną
      - Narzędzia wewnętrzne są rozdawane jako pliki pakietów i nie ma wdrożenia centralnego
    en:
      - The machine serves the making of software, in which the laying on of packages of one s own is a daily doing
      - Inner tools are handed out as files of packages and there is no rollout from the middle
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'BlockNonAdminUserInstall'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    $name = 'BlockNonAdminUserInstall'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockNonAdminUserInstall' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/application-management/apps-in-windows-10

notes:
  pl: |
    Reguła jest na poziomie drugim i warto, żeby aplikacja powiedziała
    czemu. Nie dlatego, że zagrożenie jest małe, tylko dlatego, że koszt
    bywa duży na stanowiskach, na których oprogramowanie się wytwarza.

    Argument wart postawienia wprost dotyczy wykazu. Pakiet aplikacji
    instaluje się bez podniesienia uprawnień i bez śladu tam, gdzie
    zwykle się patrzy. Wartością punktu jest więc nie tyle zablokowanie
    konkretnego programu, ile przywrócenie sytuacji, w której spis
    zainstalowanego oprogramowania jest pełny.

    Odnotowuję rozwiązanie po stronie wdrożenia. Pakiety potrzebne
    użytkownikom warto rozdawać centralnie — to daje ten sam dostęp
    i jednocześnie to, czego punkt broni.
  en: |
    The rule stands at the second level and it is well that the application say why. Not because the danger is
    small but because the cost is at times great upon stations where software is made.

    The argument worth putting outright touches the roll. A package of an application is laid on with no raising
    of rights and with no trace in the place commonly looked at. The item's worth lies therefore not so much in
    the blocking of a given program as in the giving back of a state of things in which the setting down of
    laid-on software is full.

    I set down the answer upon the side of the rollout. Packages the users need are best handed out from the
    middle - that gives the same reach and at once the very thing the item guards.
