id: win10-enable-delegation-none

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Włączanie delegowania nieprzyznane nikomu
    en: The enabling of delegation granted to nobody
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie odbiera wszystkim prawo do oznaczania kont jako zaufanych
    do delegowania.

    Delegowanie pozwala usłudze przekazać dalej tożsamość użytkownika,
    który się do niej zgłosił. Usługa sieciowa łącząca się w imieniu
    użytkownika z bazą danych potrzebuje tego mechanizmu, żeby baza
    widziała właściwą osobę, a nie samą usługę.

    Prawo opisane tu nie jest jednak prawem do delegowania. Jest prawem do
    rozstrzygania, komu wolno delegować — a to jest poziom wyżej. Konto,
    które je posiada, może oznaczyć dowolną usługę jako zaufaną
    i sprawić, że od tej chwili będzie ona dostawać tożsamości wszystkich
    łączących się z nią użytkowników.

    Skutkiem jest cicha zmiana układu zaufania w całej sieci. Usługa
    oznaczona w ten sposób nie musi nic robić — sama zaczyna dostawać
    poświadczenia, także od administratorów.

    Odnotowuję, że prawo ma znaczenie na kontrolerze domeny, a na maszynie
    roboczej jest domyślnie nienadane nikomu. Zapisanie wykazu pustym
    utrwala ten stan.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wskazania usługi, która będzie odtąd zbierać cudze tożsamości.
  en: |
    The setting takes from everybody the right of marking accounts as trusted for delegation.

    Delegation lets a service pass onward the name of the user who came to it. A service upon a network joining
    itself to a base in a user's name needs that mechanism, that the base may see the right person and not the
    service itself.

    The right set out here is however no right of delegating. It is the right of settling who may delegate - and
    that stands a level higher. An account holding it may mark any service at all as trusted and bring it about
    that from that hour it will get the names of every user joining itself to it.

    The upshot is a quiet change of the order of trust in a whole network. A service marked so need do nothing -
    of itself it begins to get credentials, from administrators among others.

    I set down that the right counts upon a controller of a domain, and upon a working machine stands granted to
    nobody by default. The writing of the list empty sets that state down.

    What an attacker gains while the item goes unmet: the naming of a service that will from then on gather other
    people's names.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na stanowisku roboczym wykaz jest pusty i nie ma czego odbierać.
    Prawo ma zastosowanie przy zarządzaniu katalogiem, a nie przy pracy
    na maszynie, więc żaden lokalny program go nie używa.

    Odnotowuję, że wpis w tym wykazie na maszynie roboczej byłby sam
    w sobie sygnałem wartym zbadania. Nie ma powodu, dla którego miałby
    się tam znaleźć.

    Skutek ewentualnej zmiany pojawia się przy następnym zalogowaniu.
    Sesja trwająca zachowuje uprawnienia do wylogowania.

    Czego to nie psuje: logowania, dostępu do zasobów sieciowych, usług,
    dostępu do plików, drukowania.
  en: |
    The class is "no disruption".

    Upon a working station the list stands empty and there is nothing to take away. The right bears upon the
    ruling of a directory and not upon work at a machine, so no local program uses it.

    I set down that an entry in this list upon a working machine would itself be a sign worth looking into. There
    is no ground upon which it should be there.

    The consequence of any change shows at the next signing in. A session at work keeps its rights until the
    signing out.

    What this does not break: logging on, the way to resources upon the network, services, the way to files, or
    printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-authentication
  what_breaks:
    pl:
      - Konto zarządzające katalogiem, któremu prawo nadano na tej maszynie, straci możliwość oznaczania kont jako zaufanych
      - Na stanowisku roboczym wykaz jest pusty, więc zmiana jest tam zapisem stanu
      - Wpis w tym wykazie na maszynie roboczej byłby sam w sobie sygnałem wartym zbadania
      - Skutek pojawia się przy następnym zalogowaniu, a sesja trwająca zachowuje uprawnienia do wylogowania
      - Logowanie, dostęp do zasobów sieciowych, usługi, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - An account ruling a directory granted the right upon this machine will lose the marking of accounts as trusted
      - Upon a working station the list stands empty, so there the change is a setting down of a state
      - An entry in this list upon a working machine would itself be a sign worth looking into
      - The consequence shows at the next signing in, and a session at work keeps its rights until the signing out
      - Logging on, the way to resources upon the network, services, the way to files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pełni rolę zarządzania katalogiem i nadane prawo jest częścią tej roli
    en:
      - The machine bears a part in the ruling of a directory and the granted right belongs to that part
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeEnableDelegationPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right goes to nobody at all, so the line is written empty. An empty line
    # is the setting; leaving the line out would keep whatever stood there before.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeEnableDelegationPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeEnableDelegationPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enable-computer-and-user-accounts-to-be-trusted-for-delegation

notes:
  pl: |
    Reguła jest w tym bloku jedyną, której skutek wykracza poza maszynę,
    na której jest wdrażana. Warto, żeby aplikacja to powiedziała, bo
    zmienia sposób patrzenia na punkt: chodzi tu o układ zaufania w sieci,
    a nie o dostęp do lokalnego dysku.

    Argument wart postawienia wprost dotyczy tego, że jest to prawo
    o poziom wyższe niż samo delegowanie. Delegowanie jest mechanizmem
    użytkowym i w wielu miejscach potrzebnym. Prawo do wskazywania, komu
    wolno delegować, jest prawem do zmiany reguł — i właśnie dlatego nie
    przyznaje się go nikomu na stanowisku roboczym.

    Odnotowuję, że wykaz jest tu domyślnie pusty i punkt kosztuje jeden
    wpis. Wartością jest utrwalenie stanu zastanego jako decyzji:
    maszyna, na której zasada została zapisana pusta, wytrzyma czyjąś
    późniejszą zmianę bez cichego powrotu do wartości domyślnej.
  en: |
    The rule is the only one of this block whose consequence reaches beyond the machine it is rolled out upon. It
    is well that the application say so, it changing how the item is looked at: what is at stake is the order of
    trust in a network and not a way onto a local disk.

    The argument worth putting outright touches this, that it is a right a level above delegation itself.
    Delegation is a mechanism of use and needed in many places. The right of naming who may delegate is a right of
    changing the rules - and for that very reason it is granted to nobody upon a working station.

    I set down that the list stands empty by default here and that the item costs one entry. The worth lies in the
    setting down of what was found as a decision: a machine upon which the policy was written empty will bear
    somebody's later change without a quiet return to the default value.
