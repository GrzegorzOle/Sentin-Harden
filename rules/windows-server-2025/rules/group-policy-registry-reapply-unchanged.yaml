id: win2025-group-policy-registry-reapply-unchanged

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Group Policy
  title:
    pl: Ponowne wgrywanie ustawień rejestru nawet bez zmiany zasad
    en: Registry settings reapplied even when policy has not changed
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt nakazuje wgrywać ustawienia rejestru pochodzące z zasad grupy przy
    każdym przetwarzaniu, także wtedy, gdy sama zasada się nie zmieniła.

    Kategoria średnia i chcę nazwać, czemu to służy, bo domyślne zachowanie
    wygląda rozsądnie: po co wgrywać coś, co się nie zmieniło. Odpowiedź
    brzmi: bo zasada mogła się nie zmienić, ale maszyna mogła. Ustawienie
    wgrane wczoraj mogło zostać dziś nadpisane — ręcznie, instalatorem,
    skryptem, byle czym, co pisze do rejestru.

    To jest właściwa treść punktu. Bez tej reguły zasada jest jednorazowym
    poleceniem: raz wykonanym i potem niesprawdzanym. Z nią jest stanem
    pożądanym, do którego maszyna wraca przy każdym przetwarzaniu. To
    różnica między „ustawiono kiedyś" a „jest ustawione teraz", a w audycie
    liczy się wyłącznie to drugie.

    Na serwerze waży to szczególnie, bo serwer bywa zmieniany ręcznie
    częściej, niż wynika z procedury. Ustawienie rozluźnione w trakcie
    naprawy o drugiej w nocy i niecofnięte nad ranem samo nie wróci na
    miejsce — chyba że zasada wraca po nie sama.

    Uwaga na wartość: wpis jest nazwany przecząco, więc zero oznacza „nie
    pomijaj zasad bez zmian". Stan pożądany jest zapisany zerem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: trwałość
    zmiany. Ustawienie rozluźnione raz zostaje rozluźnione, bo nic nie
    wraca po nie, dopóki ktoś nie tknie samej zasady.
  en: |
    The item orders registry settings coming from group policy to be applied
    at every processing, including when the policy itself has not changed.

    The category is medium, and I want to name what this is for, because the
    default behaviour looks sensible: why apply something that has not
    changed. The answer is that the policy may not have changed, but the
    machine may. A setting applied yesterday may have been overwritten today
    - by hand, by an installer, by a script, by anything at all that writes
    to the registry.

    That is the real substance of the item. Without this rule a policy is a
    one-off instruction: carried out once and then never checked. With it, it
    is a desired state the machine returns to at every processing. That is
    the difference between "was set once" and "is set now", and in an audit
    only the second counts.

    On a server it weighs especially, because a server is changed by hand
    more often than procedure suggests. A setting loosened during a repair at
    two in the morning and not restored by daybreak will not return by itself
    - unless the policy comes back for it.

    Mind the value: the entry is named in the negative, so a zero means "do
    not pass over unchanged policy". The desired state is written with a
    zero.

    What an attacker gains while the item goes unmet: the persistence of a
    change. A setting loosened once stays loosened, because nothing comes
    back for it until somebody touches the policy itself.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia" i sprawdzenie dotyczy dwóch rzeczy, obu
    dających się wskazać.

    Pierwsza to zmiany robione ręcznie. Po zastosowaniu reguły ustawienie
    objęte zasadą, zmienione lokalnie, wróci do wartości z zasady przy
    najbliższym przetwarzaniu — zwykle w ciągu godziny lub dwóch. Jeżeli
    ktoś na tej maszynie pracuje w ten sposób, przestanie to działać, a co
    gorsza objaw będzie wyglądał jak samoczynne cofanie się ustawień. To
    jest zachowanie zamierzone, ale trzeba je znać, zanim się na nie
    trafi.

    Druga to obciążenie. Wgrywanie całości przy każdym przetwarzaniu kosztuje
    więcej niż wgrywanie samych zmian. Na pojedynczym serwerze różnica jest
    nieistotna; przy bardzo rozbudowanym zestawie zasad i dużej liczbie
    maszyn warto na nią spojrzeć, bo dotyczy także serwera zarządzania.

    Czego to nie psuje: ustawień spoza zasad grupy, zadań zaplanowanych,
    usług ani niczego, co nie jest wpisem rejestru pochodzącym z zasady.
    Lokalna zmiana ustawienia nieobjętego zasadą zostaje tam, gdzie była.

    Bez restartu, natychmiast odwracalne, ale nie w trybie zbiorczym.
  en: |
    The class is "needs review", and the review concerns two things, both of
    which can be named.

    The first is changes made by hand. After the rule is applied, a setting
    covered by policy and changed locally will return to the policy's value
    at the next processing - usually within an hour or two. If somebody works
    on this machine that way, it will stop working, and worse, the symptom
    will look like settings undoing themselves. That is intended behaviour,
    but it has to be known before it is run into.

    The second is load. Applying the whole set at every processing costs more
    than applying only the changes. On a single server the difference is
    immaterial; with a very large body of policy and many machines it is
    worth a look, because it concerns the management server too.

    What this does not break: settings outside group policy, scheduled tasks,
    services, or anything that is not a registry entry coming from a policy.
    A local change to a setting not covered by policy stays where it was.

    No restart, undone immediately, but not in the bulk mode.

implementation_consequences:
  impact_areas:
    - remote-management
  what_breaks:
    pl:
      - Ustawienie objęte zasadą, zmienione ręcznie na maszynie, wróci do wartości z zasady przy najbliższym przetwarzaniu
      - Objaw będzie wyglądał jak samoczynne cofanie się ustawień, choć jest zachowaniem zamierzonym
      - Wgrywanie całości przy każdym przetwarzaniu kosztuje więcej niż wgrywanie samych zmian, co dotyczy też serwera zarządzania
      - Ustawienia spoza zasad grupy, zadania zaplanowane i usługi działają bez zmian
    en:
      - A setting covered by policy and changed by hand on the machine returns to the policy's value at the next processing
      - The symptom will look like settings undoing themselves, though it is intended behaviour
      - Applying the whole set at every processing costs more than applying only the changes, which concerns the management server too
      - Settings outside group policy, scheduled tasks and services work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie ustawienia objęte zasadami są celowo utrzymywane w wartościach lokalnych, odmiennych od zasady
    en:
      - On this machine settings covered by policy are deliberately kept at local values different from the policy
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is named in the negative: zero means "do not pass over
      # unchanged policy", so the desired state is written with a zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
      $name = 'NoGPOListChanges'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    $name = 'NoGPOListChanges'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The policy may not have changed, but the machine may. Without this, a
    # policy is a one-off instruction; with it, a desired state the machine
    # returns to. A setting loosened locally will come back to the policy value
    # at the next processing, which looks like settings undoing themselves.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoGPOListChanges' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc978526(v=technet.10)

notes:
  pl: |
    Domyślne zachowanie wygląda rozsądnie: po co wgrywać coś, co się nie
    zmieniło. Odpowiedź: zasada mogła się nie zmienić, ale maszyna mogła.
    Ustawienie wgrane wczoraj mogło dziś nadpisać cokolwiek, co pisze do
    rejestru.

    Różnica jest między „ustawiono kiedyś" a „jest ustawione teraz",
    a w audycie liczy się wyłącznie to drugie. Na serwerze waży to
    szczególnie, bo serwer bywa zmieniany ręcznie częściej, niż wynika
    z procedury.

    Uwaga na wartość: wpis nazwany przecząco, stan pożądany zapisany zerem.
    Ta reguła i okresowe odświeżanie leżą pod tym samym kluczem, ale są
    dwoma osobnymi ustawieniami.
  en: |
    The default behaviour looks sensible: why apply something that has not
    changed. The answer: the policy may not have changed, but the machine
    may. A setting applied yesterday may have been overwritten today by
    anything at all that writes to the registry.

    The difference is between "was set once" and "is set now", and in an
    audit only the second counts. On a server it weighs especially, because a
    server is changed by hand more often than procedure suggests.

    Mind the value: the entry is named in the negative, the desired state
    written with a zero. This rule and the periodic refresh lie under the
    same key but are two separate settings.
