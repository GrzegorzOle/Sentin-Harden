id: win2025-defender-behavior-monitoring

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection
  title:
    pl: Monitorowanie zachowania włączone
    en: Behaviour monitoring enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Monitorowanie zachowania ogląda nie pliki, tylko to, co programy
    robią po uruchomieniu. Jest to jedyny mechanizm w tej grupie, który
    ma szansę zadziałać wobec czegoś, czego nikt wcześniej nie widział,
    bo nie pyta „czy znam ten plik", tylko „czy znam ten sposób
    postępowania".

    Na serwerze waży to więcej niż na stacji roboczej z powodu, który
    warto nazwać wprost: atak na serwer rzadko przychodzi jako plik.
    Przychodzi jako wykorzystanie usługi, która i tak nasłuchuje, i jako
    ciąg czynności wykonanych potem przez programy, które na tej maszynie
    stoją legalnie. Nie ma pliku do rozpoznania. Jest tylko wzorzec
    zachowania.

    Zostawiam kategorię wysoką i nie podnoszę jej wyżej, bo mechanizm
    jest wykrywaniem, a nie zamknięciem drogi. Działa po tym, jak coś
    się już uruchomiło, i tym różni się od punktów, które nie pozwalają
    się uruchomić w ogóle.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: swobodę
    w drugim etapie — ten, w którym nie wnosi już żadnego pliku, tylko
    korzysta z tego, co na serwerze zastał.
  en: |
    The watching of behaviour looks not at files but at what programs do once they are running. It
    is the only working of this group that stands a chance against something nobody has seen before,
    it asking not "do I know this file" but "do I know this way of going about things".

    On a server it weighs more than on a workstation for a ground worth naming outright - an attack
    upon a server seldom comes as a file. It comes as the using of a service that listens anyway,
    and as a string of acts done afterwards by programs that stand lawfully on that machine. There
    is no file to be known. There is only a pattern of behaviour.

    I leave the category high and raise it no higher, the working being a finding out and not the
    shutting of a road. It works after something has already run, and therein it differs from the
    items that let nothing run at all.

    What an attacker gains while the item goes unmet - a free hand in the second stage, the one
    wherein they bring in no file at all but use what they found upon the server.

disruption_description:
  pl: |
    Podnoszę klasę do „wymaga sprawdzenia", choć dla stacji roboczej ta
    reguła idzie hurtem. Powód nie dotyczy blokowania, tylko obciążenia
    i tego, jak wygląda pomyłka.

    Obciążenie: mechanizm obserwuje przebieg pracy programów, więc waży
    tym więcej, im więcej maszyna robi. Na serwerze robiącym niewiele
    jest niezauważalny. Na serwerze aplikacyjnym pod pełnym obciążeniem
    bywa mierzalny i należy to zmierzyć, a nie założyć.

    Pomyłka: zatrzymanie procesu uznanego za działający nieprawidłowo
    wygląda na serwerze inaczej niż na stacji. Nikt nie zobaczy
    komunikatu, bo nikt przy tej maszynie nie siedzi. Zobaczy się
    zadanie, które przestało się kończyć powodzeniem — i zwykle dopiero
    nazajutrz, przy przeglądzie wyników.

    Jest jeden rodzaj oprogramowania, przy którym warto się zatrzymać
    przed zmianą: własne skrypty utrzymaniowe i narzędzia wdrożeniowe
    sięgające szeroko po mechanizmy systemu. Ich przebieg bywa podobny
    do obserwowanego wzorca, bo robią dokładnie te rzeczy, tylko
    w dobrej wierze. Odróżnia je podpis i pochodzenie, a nie sposób
    działania.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, audyt zgłasza
    stan „nie dotyczy".
  en: |
    I raise the class to "needs checking", though for a workstation this rule goes in bulk. The
    ground bears not on blocking but on load, and on what a mistake looks like.

    The load - the working watches the running of programs, so it weighs the more the more the
    machine does. On a server that does little it is not to be marked. On a server of applications
    under full load it can be measured, and it ought to be measured and not taken for granted.

    The mistake - the stopping of a process held to be working amiss looks on a server otherwise
    than on a workstation. Nobody will see a word given, nobody sitting at that machine. What will
    be seen is a task that stopped ending in good speed - and mostly only on the morrow, at the
    looking over of outcomes.

    There is one kind of software whereat it is worth stopping before the change - one's own scripts
    of upkeep and tools of rolling out that reach widely for the workings of the system. Their
    running can look like the watched pattern, they doing just those things, only in good faith.
    What tells them apart is a signature and a coming from, and not a way of working.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the audit reports the state "does
    not apply".

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Własne skrypty utrzymaniowe i narzędzia wdrożeniowe mogą przebiegiem przypominać obserwowany wzorzec
      - Odróżnia je podpis i pochodzenie, a nie sposób działania, więc obserwacja sama z siebie ich nie rozdzieli
      - Obciążenie waży tym więcej, im więcej maszyna robi, i należy je zmierzyć zamiast założyć
      - Zatrzymany proces nie da komunikatu, tylko zadanie, które przestało kończyć się powodzeniem
      - Przy produkcie ochronnym innego wytwórcy audyt zgłasza stan nie dotyczy
    en:
      - One's own scripts of upkeep and tools of rolling out can in their running look like the watched pattern
      - What tells them apart is a signature and a coming from, so the watching alone will not part them
      - The load weighs the more the more the machine does, and ought to be measured and not taken for granted
      - A stopped process gives no word, only a task that stopped ending in good speed
      - Where a guarding product of another maker rules, the audit reports the state does not apply
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie zmierzono obciążenia na serwerze aplikacyjnym pracującym pod pełnym obciążeniem
      - Utrzymanie opiera się na niepodpisanych skryptach własnych sięgających szeroko po mechanizmy systemu
    en:
      - The load was not measured on a server of applications working under full load
      - The upkeep rests upon unsigned scripts of one's own reaching widely for the workings of the system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableBehaviorMonitoring) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableBehaviorMonitoring'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableBehaviorMonitoring' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Jedyny mechanizm w tej grupie mający szansę zadziałać wobec czegoś,
    czego nikt wcześniej nie widział: pyta o sposób postępowania,
    a nie o znajomość pliku.

    Na serwerze waży więcej, bo atak rzadko przychodzi jako plik —
    przychodzi jako wykorzystanie usługi, która i tak nasłuchuje, i jako
    ciąg czynności wykonanych przez programy stojące tu legalnie.

    Klasa podniesiona wobec stacji roboczej nie z powodu blokowania,
    tylko obciążenia i postaci pomyłki: zatrzymany proces nie daje
    komunikatu, bo nikt przy serwerze nie siedzi.
  en: |
    The only working of this group that stands a chance against something nobody has seen before -
    it asks after a way of going about things and not after the knowing of a file.

    On a server it weighs more, an attack seldom coming as a file - it comes as the using of a
    service that listens anyway, and as a string of acts done by programs standing here lawfully.

    The class is raised against the workstation not for blocking but for the load and the shape of
    a mistake - a stopped process gives no word, nobody sitting at the server.
