id: win2016-network-location-elevation-required

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Connections
  title:
    pl: Zmiana typu sieci wymaga podniesienia uprawnień
    en: Changing a network's type requires raised rights
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga uprawnień administracyjnych do zmiany typu sieci, do której
    maszyna jest podłączona.

    Typ sieci nie jest etykietą opisową. Od niego zależy, który zestaw reguł
    zapory obowiązuje — a różnica między siecią prywatną a publiczną to
    zwykle różnica między udostępnianiem plików i wykrywaniem maszyn
    a ich zablokowaniem. Zmiana typu sieci jest więc zmianą zapory wykonaną
    jednym kliknięciem, bez dotykania zapory.

    Bez tego wymagania zwykły użytkownik może tę zmianę wykonać. Zwykle robi
    to nie po to, żeby obejść zabezpieczenie, tylko dlatego, że coś nie
    działa i podpowiedź w systemie sugeruje właśnie ten krok. Skutek jest
    ten sam niezależnie od zamiaru.

    Na serwerze 2016 punkt warto ustawić, choć użytkowników zwykłych bywa tu
    mniej. Maszyna z rolą sesji zdalnych albo serwer z interfejsem
    użytkownika daje takim osobom dostęp do tego samego okna co stanowisko.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    poluzowania reguł zapory bez uprawnień administracyjnych i bez dotykania
    ustawień zapory, z konta zwykłego użytkownika.
  en: |
    The item requires administrative rights to change the type of network the
    machine is connected to.

    A network's type is not a descriptive label. It settles which set of firewall
    rules applies - and the difference between a private and a public network is
    usually the difference between file sharing and machine discovery being on
    and being blocked. Changing a network's type is therefore a change to the
    firewall made with one click, without touching the firewall.

    Without this requirement an ordinary user can make that change. Usually they
    do so not to get round a safeguard but because something is not working and a
    prompt in the system suggests this very step. The effect is the same
    whatever the intent.

    On Server 2016 the item is worth setting, though ordinary users are fewer
    here. A machine with the remote sessions role, or a server with a user
    interface, gives such people access to the same window as a workstation does.

    What an attacker gains while the item goes unmet: the ability to loosen
    firewall rules without administrative rights and without touching the
    firewall's settings, from an ordinary user's account.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana typu sieci nie jest czynnością
    codzienną, a na serwerze wykonuje ją administrator, który uprawnienia
    i tak ma.

    Jedna rzecz warta odnotowania: punkt dotyczy zmiany typu, a nie stanu
    bieżącego. Jeżeli maszyna ma dziś przypisany typ niewłaściwy, reguła go
    nie poprawi — utrwali go tylko przed zmianą przez osobę bez uprawnień.
    Typ przypisany błędnie poprawia się osobno i warto to zrobić przed
    zastosowaniem tej reguły, nie po.

    Czego to nie psuje: połączeń sieciowych, reguł zapory, udostępniania
    plików ani zmiany typu sieci wykonywanej przez administratora.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". Changing a network's type is not a daily
    action, and on a server it is done by an administrator, who holds the rights
    anyway.

    One thing is worth noting: the item bears on the change of type, not on the
    current state. If the machine has the wrong type assigned today, the rule
    will not correct it - it will merely fix it in place against change by
    somebody without rights. A wrongly assigned type is corrected separately, and
    that is worth doing before applying this rule rather than after.

    What this does not break: network connections, firewall rules, file sharing,
    or a change of network type made by an administrator.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administracyjnych nie zmieni już typu sieci z okna systemu
      - Podpowiedź systemu sugerująca zmianę typu sieci przy problemie z połączeniem kończy się odmową
      - Typ sieci przypisany dziś błędnie nie zostaje poprawiony, tylko utrwalony
      - Połączenia, reguły zapory i zmiana typu przez administratora działają bez zmian
    en:
      - A user without administrative rights can no longer change the network type from the system window
      - A system prompt suggesting a change of network type when a connection fails ends in a refusal
      - A network type wrongly assigned today is not corrected but fixed in place
      - Connections, firewall rules and a change of type by an administrator work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna ma dziś przypisany niewłaściwy typ sieci i nie poprawiono go przed zastosowaniem reguły
    en:
      - The machine has the wrong network type assigned today and it has not been corrected before the rule is applied
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
      $name = 'NC_StdDomainUserSetLocation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    $name = 'NC_StdDomainUserSetLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The item bears on changing the network's type, not on the current state. A
    # wrong type already assigned stays wrong and is corrected separately.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Network Connections'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NC_StdDomainUserSetLocation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Nazwa wpisu mówi o użytkowniku domeny, ale skutek dotyczy każdego konta
    bez uprawnień administracyjnych. To jest jedno z tych miejsc, w których
    nazwa techniczna jest węższa niż zachowanie.

    Wartość jeden oznacza tu wymóg uprawnień, a nie pozwolenie na zmianę.
    Kierunek jest odwrotny do tego, co sugeruje słowo „Set" w nazwie wpisu.

    Klucz należy wyłącznie do ustawień połączeń sieciowych z zasad grupy,
    więc przy cofaniu usuwany jest także on — o ile nic innego nie zostało
    w nim tymczasem zapisane.
  en: |
    The entry's name speaks of a domain user, but the effect covers every account
    without administrative rights. This is one of those places where the
    technical name is narrower than the behaviour.

    The value one means the requirement of rights here, not permission to change.
    The direction is the reverse of what the word "Set" in the entry's name
    suggests.

    The key belongs solely to network connection settings from group policy, so
    undoing removes it as well - provided nothing else has been written into it
    meanwhile.
