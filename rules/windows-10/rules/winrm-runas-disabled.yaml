id: win10-winrm-runas-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Service
  title:
    pl: Przechowywanie poświadczeń wykonawczych przez usługę zarządzania zdalnego wyłączone
    en: The holding of warrants of working by the service of ordering from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zdalnego zarządzania przechowywania
    poświadczeń konta, na którym mają być wykonywane polecenia
    przychodzące do wskazanego punktu końcowego.

    Mechanizm ten pozwala zdefiniować punkt końcowy działający zawsze na
    jednym koncie, niezależnie od tego, kto się połączył. Hasło tego
    konta jest zapisywane na maszynie, żeby usługa mogła je podstawić
    przy każdym połączeniu.

    Zagrożenie pierwsze to samo przechowywanie. Hasło konta — zwykle
    uprzywilejowanego — leży na dysku maszyny, a nie w pamięci sesji.
    Ochrona jest miejscowa, więc kto ma dostęp do maszyny na poziomie
    systemu, ma i to.

    Zagrożenie drugie to podniesienie uprawnień. Konto o niskich
    uprawnieniach łączące się z takim punktem końcowym wykonuje polecenia
    jako konto przechowane, czyli awansuje bez zdobywania czegokolwiek.

    Odnotowuję, że mechanizm ten ma zastosowania prawidłowe — punkty
    końcowe o zawężonym zestawie poleceń. Punkt odbiera jednak samo
    przechowywanie hasła, a nie zawężanie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    konta uprzywilejowanego zapisane na maszynie i awans przez połączenie.
  en: |
    The setting forbids the service of ordering from afar to hold the warrants of the reckoning upon which orders
    coming in to a named end point are to be worked.

    That mechanism lets an end point be set that works always upon one reckoning, whoever it be that joined. The
    password of that reckoning is written upon the machine, so that the service may set it in place at every
    joining.

    The first danger is the holding itself. The password of a reckoning - commonly one of privilege - lies upon
    the machine's disk and not in the memory of a session. The guard is of the spot, so whoever has a reach of the
    machine at the system's level has it too.

    The second danger is the raising of rights. A reckoning of low rights joining itself to such an end point
    works orders as the held reckoning, and so is raised without winning anything at all.

    I set down that the mechanism has rightful uses - end points with a narrowed set of orders. The item takes
    away the holding of the password and not the narrowing.

    What an attacker gains while the item goes unmet: the password of a reckoning of privilege written upon the
    machine, and a raising by joining.

disruption_description:
  pl: |
    Klasa „bez uciążliwości", bo na stanowisku roboczym punktów końcowych
    z przechowanym kontem po prostu nie ma.

    Odnotowuję jedyne miejsce, w którym zmiana coś zmienia: maszyna
    z ręcznie zdefiniowanym punktem końcowym, którego zadaniem jest
    udostępnienie wąskiego zestawu poleceń osobom bez uprawnień. Taki
    punkt przestanie działać, a połączenie będzie odrzucane.

    Zastrzegam, że wycofanie zmiany jest trudne i trzeba to powiedzieć
    wprost. Przywrócenie wartości w rejestrze przywraca możliwość
    przechowywania, ale nie przywraca samego hasła — to trzeba wprowadzić
    ponownie przy każdym punkcie końcowym, który z niego korzystał.

    Zmiana zaczyna obowiązywać po ponownym uruchomieniu usługi.

    Czego to nie psuje: zwykłych połączeń zdalnego zarządzania, pracy
    programów, sieci, logowania, drukowania.
  en: |
    The class is "no disruption", for upon a station of work there are simply no end points with a held reckoning.

    I set down the one place where the change changes anything: a machine with an end point set by hand whose task
    is the giving out of a narrow set of orders to people without rights. Such a point will cease to work and the
    joining will be refused.

    I set down that the undoing of the change comes hard and that is to be said outright. The setting back of the
    worth in the register gives back the power of holding, but gives not back the password itself - that must be
    entered anew at every end point that used it.

    The change comes into force after the service is set going anew.

    What this does not break: common joinings of ordering from afar, the work of programs, the network, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - remote-management
    - accounts-and-passwords
  what_breaks:
    pl:
      - Ręcznie zdefiniowany punkt końcowy z przechowanym kontem przestanie działać, a połączenie będzie odrzucane
      - Wycofanie zmiany przywraca możliwość przechowywania, ale nie przywraca samego hasła
      - Hasło trzeba wprowadzić ponownie przy każdym punkcie końcowym, który z niego korzystał
      - Na stanowisku roboczym takich punktów końcowych po prostu nie ma i zmiana nic nie zmienia
      - Zwykłe połączenia zdalnego zarządzania, praca programów, sieć, logowanie i drukowanie pozostają bez zmian
    en:
      - An end point set by hand with a held reckoning will cease to work and the joining will be refused
      - The undoing gives back the power of holding but gives not back the password itself
      - The password must be entered anew at every end point that used it
      - Upon a station of work there are simply no such end points and the change changes nothing
      - Common joinings of ordering from afar, the work of programs, the network, logging on and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa punkt końcowy udostępniający wąski zestaw poleceń przez przechowane konto
    en:
      - Upon the machine works an end point giving out a narrow set of orders through a held reckoning
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableRunAs'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'DisableRunAs'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRunAs' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_remote_troubleshooting

notes:
  pl: |
    Reguła ma klasę bez uciążliwości i jednocześnie trudne wycofanie
    — warto, żeby aplikacja pokazała to zestawienie, bo jest nietypowe.
    Zmiana nic nie psuje, ale powrót wymaga ponownego wprowadzenia haseł.

    Argument wart postawienia dotyczy tego, gdzie leży hasło. Nie
    w pamięci sesji, tylko na dysku maszyny, pod ochroną miejscową. Kto
    ma dostęp do maszyny na poziomie systemu, ma i to.

    Odnotowuję awans przez połączenie jako drugie zagrożenie. Konto
    o niskich uprawnieniach łączące się z takim punktem końcowym wykonuje
    polecenia jako konto przechowane, nie zdobywając niczego po drodze.
  en: |
    The rule bears the class of no disruption and withal a hard undoing - it is well that the application show
    that setting side by side, it being out of the common. The change breaks nothing, but the way back calls for
    passwords to be entered anew.

    The argument worth putting touches where the password lies. Not in the memory of a session but upon the
    machine's disk, under a guard of the spot. Whoever has a reach of the machine at the system's level has it
    too.

    I set down the raising by joining as the second danger. A reckoning of low rights joining itself to such an
    end point works orders as the held reckoning, winning nothing along the way.
