id: win2016-password-minimum-length

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Najmniejsza dopuszczalna długość hasła
    en: Smallest allowed password length
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile znaków musi mieć hasło, i wymaga co najmniej
    czternastu.

    Długość jest jedyną cechą hasła, która naprawdę przekłada się na koszt
    złamania. Wymagania co do rodzajów znaków dokładają niewiele
    w porównaniu z każdym kolejnym znakiem — dlatego ten punkt jest w całej
    grupie haseł najważniejszy.

    Na serwerze waży dodatkowo to, przeciw czemu hasło stoi. Skrót hasła
    zdjęty z maszyny łamie się bez kontaktu z siecią, bez ograniczenia
    liczby prób i bez żadnego śladu. Jedyne, co ogranicza napastnika, to
    czas — a czas rośnie z długością hasła wykładniczo. Konto
    administracyjne z hasłem ośmioznakowym jest kontem, którego hasło da się
    odtworzyć w rozsądnym czasie niezależnie od tego, jak wygląda.

    Na tym wydaniu systemu dochodzi jeszcze jedno. Serwer 2016 stoi
    najczęściej w instalacjach starszych, gdzie hasła kont lokalnych bywają
    ustawione raz, przy wdrożeniu, i nietknięte od lat. Im starsza maszyna,
    tym większa szansa, że jej hasła pochodzą z czasów, w których osiem
    znaków uchodziło za wystarczające.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: realną
    możliwość odtworzenia haseł kont z tej maszyny po jednorazowym dostępie
    do ich skrótów. Przy hasłach krótkich jest to kwestia sprzętu, a nie
    umiejętności.

    Czternaście znaków jest progiem dolnym benchmarku, nie celem. Hasła kont
    uprzywilejowanych i usługowych powinny być dłuższe, bo nikt ich nie
    wpisuje z pamięci.
  en: |
    The setting decides how many characters a password must have, and demands
    at least fourteen.

    Length is the one property of a password that really changes the cost of
    breaking it. Demands about kinds of characters add little next to each
    further character - which is why this item is the most important of the
    whole password group.

    On a server, what the password stands against weighs as well. A password
    hash taken off a machine is broken with no contact with the network, no
    limit on the number of attempts and no trace at all. The only thing that
    limits an attacker is time - and time grows exponentially with the
    password's length. An administrative account with an eight-character
    password is an account whose password can be recovered in reasonable
    time, whatever it looks like.

    On this release of the system there is one thing more. Server 2016
    usually stands in older installations, where the passwords of local
    accounts were often set once, at deployment, and untouched for years. The
    older the machine, the better the chance that its passwords come from a
    time when eight characters passed for enough.

    What an attacker gains while the item goes unmet: a real way of
    recovering the passwords of this machine's accounts after a single access
    to their hashes. With short passwords that is a question of hardware, not
    of skill.

    Fourteen characters is the benchmark's lower bound, not a target. The
    passwords of privileged and service accounts should be longer, because
    nobody types them from memory.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo hasła krótsze niż nowy próg nie
    są unieważniane, ale nie dają się już ustawić ponownie — i to rozróżnienie
    decyduje o przebiegu wdrożenia.

    Hasła bieżące działają dalej i w dniu wdrożenia nic nie przestaje
    działać. Skutek pojawia się przy pierwszej zmianie hasła: krótsze nie
    zostanie przyjęte. Na kontach ludzi kończy się to zgłoszeniem, na kontach
    usługowych — zatrzymaną procedurą zmiany.

    Sprawdzenia wymagają aplikacje, które hasłem operują. Zdarzają się
    systemy przyjmujące hasła krótsze, pola wejściowe przycinające hasło do
    ustalonej długości i integracje przekazujące hasło dalej z ograniczeniem
    własnym. Każde z tych miejsc ujawni się dopiero przy zmianie hasła, a więc
    rozłożone w czasie. Na serwerze tego rocznika takich integracji bywa
    więcej niż na maszynie świeżej — to jest właściwy powód klasy.

    Rzecz do zapamiętania: na tym wydaniu nie ma trybu, w którym system tylko
    odnotowuje hasła krótsze od progu, zamiast ich odrzucać. Nie da się więc
    wdrożyć tej zmiany na próbę i policzyć, kogo dotknie. Trzeba to ustalić
    przed wdrożeniem, pytając o aplikacje.

    Na serwerze członkowskim zasada obejmuje konta lokalne. Na kontrolerze
    domeny obejmuje wszystkie konta w domenie i jest wtedy zmianą dotykającą
    całej organizacji.

    Zmiana nie wymaga restartu.
  en: |
    The class is "needs planned rollout", because passwords shorter than the
    new threshold are not voided but can no longer be set again - and that
    distinction decides how the rollout goes.

    Current passwords go on working and on the day of the rollout nothing
    stops working. The effect shows up at the first password change: a shorter
    one will not be accepted. On people's accounts that ends in a support
    ticket, on service accounts in a halted change procedure.

    Applications that handle passwords need checking. There are systems that
    accept shorter passwords, input fields that cut a password to a fixed
    length, and integrations that pass a password on with a limit of their
    own. Each of those places shows itself only at a password change, and so
    spread out over time. On a server of this vintage there tend to be more
    such integrations than on a fresh machine - that is the real reason for
    the class.

    Something to remember: this release has no mode in which the system merely
    records passwords shorter than the threshold instead of refusing them. The
    change cannot be rolled out as a trial to count who it will hit. That has
    to be settled beforehand, by asking about the applications.

    On a member server the policy covers local accounts. On a domain
    controller it covers every account in the domain and is then a change
    touching the whole organisation.

    The change needs no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Ustawienie hasła krótszego niż próg zostaje odrzucone przy najbliższej zmianie
      - Aplikacje przycinające hasło do ustalonej długości przestają przyjmować logowanie
      - Na tym wydaniu nie ma trybu odnotowywania zamiast odrzucania, więc nie da się wdrożyć zmiany na próbę
      - Hasła bieżące nie są unieważniane i działają do czasu zmiany
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
    en:
      - Setting a password shorter than the threshold is refused at the next change
      - Applications that cut a password to a fixed length stop accepting the sign-in
      - This release has no record-only mode instead of refusal, so the change cannot be rolled out as a trial
      - Current passwords are not voided and work until they are changed
      - On a domain controller the change covers every account in the domain at once
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze pracują aplikacje nieprzyjmujące haseł dłuższych niż ustalony limit
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - Applications that do not accept passwords longer than a fixed limit run on the server
      - The server is a domain controller and a change to the domain policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '14'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MinimumPasswordLength\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MinimumPasswordLength'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Current passwords stay valid; the threshold bites at the next change of
    # each account's password. On this release there is no record-only mode, so
    # ask about the applications before running this rather than after.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MinimumPasswordLength = 14',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MinimumPasswordLength = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/minimum-password-length

notes:
  pl: |
    Porównanie jest „nie mniej niż", więc próg wyższy niż czternaście spełnia
    punkt tak samo. Polecenie naprawcze zapisuje wartość progową jako
    najmniejszą zmianę prowadzącą do zgodności.

    Piętnaście znaków jest granicą, powyżej której przestaje powstawać skrót
    wyliczany mechanizmem sprzed lat. Na maszynie tego rocznika warto o tym
    pamiętać, bo to właśnie tu takie skróty bywają jeszcze obecne — hasło
    losowane maszynowo nie musi być kompromisem i może tę granicę przekroczyć.

    Zakres zasady zależy od roli serwera i na kontrolerze domeny obejmuje
    całą domenę. Jest to najpoważniejsza zmiana z całej grupy haseł i na tej
    roli wymaga uzgodnienia poza zespołem technicznym.
  en: |
    The comparison is "not less than", so a threshold higher than fourteen
    meets the item just as well. The remedy writes the threshold value as the
    smallest change that reaches compliance.

    Fifteen characters is the boundary above which the hash computed by a
    mechanism from years ago stops being stored. On a machine of this vintage
    that is worth remembering, because this is exactly where such hashes may
    still be present - a machine-chosen password need not be a compromise and
    can cross that boundary.

    The policy's reach depends on the server's role, and on a domain
    controller it covers the whole domain. It is the weightiest change of the
    whole password group and on that role it needs agreement beyond the
    technical team.
