id: win2025-uac-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kontrola uprawnień administracyjnych włączona
    en: Control of administrative rights switched on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza mechanizm, przy którym konto należące do
    administratorów pracuje z uprawnieniami zwykłymi, a uprawnienia pełne
    otrzymuje dopiero dla konkretnej czynności, po potwierdzeniu.

    Jest to ustawienie nadrzędne wobec całej grupy dotyczącej kontroli
    uprawnień. Jego wyłączenie nie zmiękcza mechanizmu — usuwa go w całości
    i unieważnia wszystkie pozostałe punkty tej grupy naraz. Każdy program
    uruchomiony przez administratora, w tym uruchomiony przez pomyłkę albo
    podstępem, dostaje wtedy uprawnienia pełne od razu i bez pytania.

    Na serwerze konsekwencja jest ostrzejsza niż na stanowisku roboczym
    z powodu, który łatwo przeoczyć: na serwerze prawie każda praca jest
    pracą administracyjną. Konto, na którym ktoś tu pracuje, jest zwykle
    kontem administracyjnym, a przeglądarka, klient poczty czy narzędzie
    diagnostyczne uruchomione na tym koncie działa z pełnymi uprawnieniami
    systemu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne
    uprawnienia w chwili, gdy uda mu się uruchomić cokolwiek na koncie
    administracyjnym — bez podnoszenia uprawnień, bez potwierdzenia i bez
    zdarzenia, które dałoby się zauważyć.

    Wyłączenie tego mechanizmu jest jedną z niewielu zmian konfiguracji,
    które same w sobie przesądzają o przejęciu maszyny, i dlatego kategoria
    jest krytyczna.
  en: |
    The setting switches on the mechanism by which an account belonging to the
    administrators works with ordinary rights and gets full rights only for a definite
    doing, after a confirmation.

    It is the setting above the whole group concerning the control of rights. Switching it
    off does not soften the mechanism - it removes it whole and voids every other item of
    that group at once. Every program started by an administrator, including one started by
    mistake or by trickery, then gets full rights straight away and without asking.

    On a server the consequence is sharper than at a working station for a reason easy to
    pass over: on a server nearly all work is administrative work. The account somebody
    works on here is usually an administrative account, and a browser, a mail client or a
    diagnostic tool started on that account runs with the system's full rights.

    What an attacker gains while the item goes unmet: full rights the moment they manage to
    start anything at all on an administrative account - with no raising of rights, no
    confirmation and no event that could be noticed.

    Switching this mechanism off is one of the few configuration changes that by themselves
    settle the taking of a machine, and hence the category is critical.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że włączenie tego mechanizmu tam, gdzie
    był wyłączony, zmienia sposób działania każdego programu na maszynie —
    a wyłączony bywał właśnie dlatego, że któryś z nich inaczej nie
    działał.

    Objawy dzielą się na dwie grupy. Pierwsza to programy zapisujące dane
    w miejscach zastrzeżonych — w katalogu instalacyjnym albo w gałęzi
    rejestru systemu — i robiące to bez proszenia o uprawnienia. Te po
    zmianie albo przestaną zapisywać, albo zaczną zapisywać do
    przekierowanej kopii, w której nikt ich potem nie znajdzie.

    Druga to programy i skrypty uruchamiane bez udziału człowieka: zadania
    harmonogramu, instalatory wywoływane zdalnie, narzędzia wdrożeniowe.
    Jeżeli któreś z nich wymaga pełnych uprawnień, a nie ma jak o nie
    poprosić, po prostu zatrzyma się bez wyjaśnienia — potwierdzenia nie ma
    komu kliknąć.

    Na serwerze druga grupa jest ważniejsza i to ją trzeba przejrzeć przed
    zmianą. Zadanie, które działało latami, zatrzyma się w nocy i nikt nie
    połączy tego z tą zmianą.

    Zmiana wymaga restartu systemu.
  en: |
    A knowing rollout is needed because switching this mechanism on where it was off changes
    the way every program on the machine works - and it was off exactly because one of them
    did not work otherwise.

    The symptoms fall into two groups. The first is programs recording data in reserved
    places - in the installation directory or in the system's registry branch - and doing so
    without asking for rights. After the change those will either stop recording or start
    recording into a redirected copy in which nobody will find them afterwards.

    The second is programs and scripts run without a person's part: scheduler tasks,
    installers called remotely, deployment tools. If one of them takes full rights and has
    no way of asking for them, it will simply halt with no explanation - there is nobody to
    click the confirmation.

    On a server the second group matters more and it is the one to look over before the
    change. A task that worked for years will halt at night and nobody will connect that
    with this change.

    The change takes a restart of the system.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - legacy-applications
    - user-interface
    - updates-and-servicing
  what_breaks:
    pl:
      - Zadania harmonogramu wymagające pełnych uprawnień zatrzymują się bez wyjaśnienia
      - Programy zapisujące dane w miejscach zastrzeżonych trafiają do przekierowanej kopii
      - Instalatory wywoływane zdalnie mogą przestać kończyć się powodzeniem
      - Praca przy konsoli wymaga potwierdzania czynności administracyjnych
    en:
      - Scheduler tasks taking full rights halt with no explanation
      - Programs recording data in reserved places land in a redirected copy
      - Installers called remotely may stop ending in success
      - Work at the console takes confirming administrative doings
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze pracuje aplikacja, dla której mechanizm wyłączono i której nie da się zastąpić
      - Nie przejrzano zadań harmonogramu pod kątem tych, które wymagają pełnych uprawnień
    en:
      - An application the mechanism was switched off for and which cannot be replaced works on the server
      - Scheduler tasks have not been looked over for those taking full rights
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableLUA'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'EnableLUA' -ErrorAction SilentlyContinue).'EnableLUA'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableLUA'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableLUA' -Value 1 -Type DWord
    "Takes effect after a restart of the system."

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-run-all-administrators-in-admin-approval-mode

notes:
  pl: |
    Punkt jest nadrzędny wobec pozostałych z grupy kontroli uprawnień.
    Przy wartości zerowej wszystkie one opisują mechanizm, którego nie ma,
    i ich wynik — spełniony czy nie — nie znaczy nic. W raporcie ten punkt
    należy czytać pierwszy.

    Zmiana obowiązuje dopiero po restarcie systemu i wycofanie także wymaga
    restartu. Na serwerze, na którym coś się po zmianie zepsuje, oznacza to
    dwa restarty zamiast jednego — argument za wykonaniem tej zmiany w oknie
    serwisowym.

    Mechanizm nie obowiązuje wbudowanego konta administratora, o ile osobne
    ustawienie tego nie nakazuje. Jest to osobny punkt benchmarku i warto
    czytać oba razem, bo konto to jest na serwerze w użyciu częściej,
    niż się przyjmuje.
  en: |
    The item stands above the others of the rights-control group. At a zero value all of
    them describe a mechanism that is not there, and their result - met or not - means
    nothing. In the report this item is to be read first.

    The change binds only after a restart of the system and a rollback takes a restart as
    well. On a server on which something breaks after the change that means two restarts
    rather than one - an argument for making this change in a service window.

    The mechanism does not bind the built-in administrator account unless a separate setting
    orders it. That is a separate item of the benchmark and it is worth reading the two
    together, since that account is in use on a server more often than is assumed.
