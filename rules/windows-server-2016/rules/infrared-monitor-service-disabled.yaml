id: win2016-infrared-monitor-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa nadzoru łącza podczerwonego wyłączona
    en: The monitor service for the infrared link disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa nadzoruje łącze podczerwone — sposób przesyłania danych między
    urządzeniami ustawionymi naprzeciw siebie, używany zanim pojawiła się
    łączność radiowa bliskiego zasięgu.

    Sprzętu tego nie buduje się od lat i na większości maszyn usługi nie ma
    w ogóle. Audyt zwraca wtedy stan „nie dotyczy" i jest to wynik
    prawidłowy, nie brak wyniku.

    Tam, gdzie usługa jest, została zwykle odziedziczona po starszym
    obrazie systemu albo dołożona wraz ze sterownikiem urządzenia sprzed
    lat. Jej praca polega na czekaniu na urządzenie, które nigdy się nie
    pojawi.

    Wartość punktu leży w porządku i jest to jedyny argument, jaki ma.
    Składnik, którego nikt nie używa, nikt nie sprawdza i nikt nie poprawia,
    nie powinien być uruchamiany — nie dlatego, że coś z nim wiadomo, tylko
    dlatego, że o nim nic nie wiadomo.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: praktycznie
    nic; punkt dotyczy składnika, który czeka na sprzęt niebudowany od lat.
  en: |
    The service watches over the infrared link - a way of passing data between devices set
    facing one another, used before short range radio connectivity appeared.

    That hardware has not been built for years and on most machines the service is not there
    at all. The audit then returns the state "not applicable" and that is a proper outcome,
    not an absence of one.

    Where the service is there, it was as a rule inherited from an older system image or
    added along with a device driver of years past. Its work amounts to waiting for a device
    that will never appear.

    The item's worth lies in good order and that is the only argument it has. A component
    nobody uses, nobody checks and nobody mends should not be started - not because anything
    is known of it, but because nothing is.

    What an attacker gains while the item goes unmet: practically nothing; the item concerns
    a component waiting for hardware not built for years.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Nic z tej usługi nie korzysta i nie ma sprzętu, który by jej wymagał.

    Na większości maszyn usługi nie ma i audyt zwraca stan „nie dotyczy".
    Jest to najczęstszy wynik tego punktu i warto, żeby interfejs pokazywał
    go jako stan prawidłowy, a nie jako sprawę nierozstrzygniętą.

    Nie ma znanych regresji.

    Czego to nie psuje: urządzeń podłączonych kablem, sieci, usług,
    udziałów, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "no disruption".

    Nothing uses that service and there is no hardware that would call for it.

    On most machines the service is not there and the audit returns the state "not
    applicable". It is this item's commonest outcome and it is worth the interface showing it
    as a proper state rather than as an unsettled matter.

    There are no known regressions.

    What this does not break: devices joined by cable, the network, services, shares, or
    authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nic z tej usługi nie korzysta i nie ma sprzętu, który by jej wymagał
      - Na większości maszyn usługi nie ma i audyt zwraca wtedy stan nie dotyczy, co jest wynikiem prawidłowym
      - Urządzenie podczerwone sprzed lat, gdyby takie przy maszynie stało, przestanie być obsługiwane
      - Urządzenia podłączone kablem, sieć, usługi i udziały pozostają bez zmian
    en:
      - Nothing uses that service and there is no hardware that would call for it
      - On most machines the service is not there and the audit then returns the state not applicable, which is a proper outcome
      - An infrared device of years past, were one standing by the machine, will cease to be served
      - Devices joined by cable, the network, services and shares stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Przy maszynie pracuje urządzenie przesyłające dane łączem podczerwonym i nie ma dla niego zamiennika
    en:
      - A device passing data over an infrared link works by the machine and has no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'irmon' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The component belongs to an era of hardware no longer built. On most
    # machines the entry is simply not there.
    Stop-Service -Name 'irmon' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'irmon' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'irmon' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/introduction-to-irda

notes:
  pl: |
    Punkt zamyka blok i jest w całym zestawie najlżejszy. Warto go tak
    pokazywać — bez szukania uzasadnienia mocniejszego, niż ma, i bez
    wyrównywania go w górę do sąsiadów.

    Jest za to dobrym miejscem na powiedzenie rzeczy ogólniejszej. Reguły
    wyłączające składniki nieużywane nie bronią przed niczym konkretnym.
    Bronią przed tym, czego nie wiemy: przed usterką w kodzie, którego nikt
    nie czyta, w składniku, którego nikt nie aktualizuje, bo wszyscy o nim
    zapomnieli. Jest to uzasadnienie słabsze od pozostałych i trzeba je
    podawać jako słabsze, a nie ubierać w język zagrożenia.

    Dominujący wynik „nie dotyczy" warto przy tym punkcie potraktować
    poważnie w interfejsie. Lista, na której połowa pozycji mówi „nie
    dotyczy", jest trudna do czytania, jeżeli stan ten wygląda jak brak
    odpowiedzi. Tutaj jest odpowiedzią — i to najlepszą z możliwych.
  en: |
    The item shuts the block and is the lightest in the whole set. It is worth showing so -
    without seeking for it a warrant stronger than it has, and without levelling it up to its
    neighbours.

    It is for all that a good place to say something more general. Rules switching off unused
    components guard against nothing definite. They guard against what we do not know:
    against a fault in code nobody reads, in a component nobody updates, everybody having
    forgotten it. It is a warrant weaker than the rest and it has to be given as weaker
    rather than dressed in the language of threat.

    The prevailing outcome "not applicable" is worth taking seriously in the interface at
    this item. A list on which half the entries say "not applicable" is hard to read if that
    state looks like an absence of an answer. Here it is an answer - and the best possible
    one.
