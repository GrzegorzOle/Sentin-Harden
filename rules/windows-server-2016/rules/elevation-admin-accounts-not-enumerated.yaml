id: win2016-elevation-admin-accounts-not-enumerated

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Konta administratorów nie są wyliczane przy podnoszeniu uprawnień
    en: Administrator accounts not listed when elevating
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt usuwa listę kont administracyjnych z okna, które prosi o
    poświadczenia przy podnoszeniu uprawnień.

    Wygląda to na drobiazg wizualny i nim nie jest. Okno wyliczające konta
    odpowiada na pytanie, które napastnik musiałby zadać osobno: które konta
    na tej maszynie mają uprawnienia administracyjne. Odpowiedź przychodzi
    bez logowania na żadne z nich, bez żadnego narzędzia i bez śladu — wystarczy
    wywołać czynność wymagającą uprawnień i spojrzeć.

    Kategoria wysoka, bo to jest pierwszy krok, od którego zaczyna się
    wybieranie celu. Napastnik z dostępem do konta zwykłego — albo tylko do
    konsoli maszyny — dostaje listę nazw wartych łamania, w tym nazwy kont
    usługowych i kont administracyjnych utworzonych ręcznie.

    Na serwerze 2016 lista ta bywa wyjątkowo wymowna. Maszyny tego rocznika
    mają za sobą lata obsługi, a nazwy kont administracyjnych zwykle mówią,
    kto i po co je zakładał.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotowy spis
    kont uprzywilejowanych, odczytany z okna systemu, bez jednego zapytania.
  en: |
    The item removes the list of administrative accounts from the window asking
    for credentials when rights are elevated.

    It looks like a visual detail and is not. A window listing accounts answers a
    question the attacker would otherwise have to ask separately: which accounts
    on this machine hold administrative rights. The answer comes with no signing
    in to any of them, with no tool and with no trace - it is enough to trigger
    an action needing rights and look.

    The category is high, because this is the first step from which the choosing
    of a target begins. An attacker with access to an ordinary account - or
    merely to the machine's console - is handed a list of names worth cracking,
    including the names of service accounts and of administrative accounts made
    by hand.

    On Server 2016 that list tends to be unusually telling. Machines of this
    vintage have years of administration behind them, and the names of
    administrative accounts usually say who set them up and what for.

    What an attacker gains while the item goes unmet: a ready roll of privileged
    accounts, read off a system window, without a single query.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmienia się wyłącznie to, że nazwę konta trzeba
    wpisać, zamiast wybrać ją z listy. Możliwość podniesienia uprawnień
    zostaje nietknięta.

    Jedna rzecz warta odnotowania, choć nie zmienia klasy: po tej zmianie
    nazwy kont administracyjnych trzeba znać. Jeżeli jedynym miejscem, w którym
    były zapisane, było to okno, warto je spisać przed zmianą — a to, że
    takie miejsce istniało, jest samo w sobie argumentem za tą regułą.

    Na serwerze 2016 rzecz dotyczy głównie kont lokalnych o nazwach nadanych
    lata temu. Konto domenowe ma nazwę, którą administrator i tak zna
    z codziennej pracy.

    Czego to nie psuje: podnoszenia uprawnień, logowania, pracy przez pulpit
    zdalny ani żadnego automatu, bo automaty nie korzystają z tego okna.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The only thing that changes is that the account
    name has to be typed rather than picked from a list. The ability to elevate
    is untouched.

    One thing is worth noting, though it does not change the class: after this
    change the names of administrative accounts have to be known. If the only
    place they were recorded was that window, they are worth writing down before
    the change - and the fact that such a place existed is itself an argument for
    this rule.

    On Server 2016 the matter concerns mainly local accounts with names given
    years ago. A domain account has a name the administrator knows from daily
    work anyway.

    What this does not break: elevating, signing in, working through remote
    desktop, or any automation, because automation does not use this window.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Nazwę konta administracyjnego trzeba wpisać, zamiast wybrać ją z listy w oknie
      - Konta lokalne o nazwach nadanych lata temu trzeba znać, bo okno już ich nie podpowie
      - Sama możliwość podniesienia uprawnień pozostaje nietknięta
      - Automaty i zadania harmonogramu nie korzystają z tego okna i działają bez zmian
    en:
      - The name of an administrative account has to be typed rather than picked from a list in the window
      - Local accounts named years ago have to be known, because the window no longer suggests them
      - The ability to elevate itself is untouched
      - Automation and scheduled tasks do not use this window and work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nazwy kont administracyjnych na tej maszynie nie są nigdzie zapisane i jedynym ich źródłem jest to okno
    en:
      - The names of administrative accounts on this machine are recorded nowhere and this window is their only source
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI'
      $name = 'EnumerateAdministrators'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI'
    $name = 'EnumerateAdministrators'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The list goes, the ability to elevate does not - the account name has to be
    # typed instead of picked. Worth making sure those names are recorded
    # somewhere other than that window.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnumerateAdministrators' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/user-account-control/user-account-control-overview

notes:
  pl: |
    Punkt nie ukrywa kont przed niczym poza tym jednym oknem. Konta nadal
    da się wyliczyć innymi drogami, jeśli maszyna na to pozwala — i właśnie
    tamte drogi zamykają osobne reguły o odpytywaniu bazy kont. Te trzy
    punkty warto czytać razem, bo osobno każdy zostawia jedną furtkę.

    Kategoria wysoka wynika z kosztu, nie z siły. Zmiana nic nie kosztuje,
    a zamyka najłatwiejsze z możliwych źródeł wiedzy o tym, kogo warto
    zaatakować.

    Klucz należy wyłącznie do tej reguły, więc przy cofaniu usuwany jest
    także on — o ile nic innego nie zostało w nim tymczasem zapisane.
  en: |
    The item hides accounts from nothing but this one window. They can still be
    enumerated by other routes, if the machine allows it - and those routes are
    closed by separate rules about querying the accounts database. The three
    items are worth reading together, because on its own each leaves one door.

    The high category follows from the cost rather than the strength. The change
    costs nothing and closes the easiest possible source of knowledge about who
    is worth attacking.

    The key belongs to this rule alone, so undoing removes it as well - provided
    nothing else has been written into it meanwhile.
