id: win2016-security-log-management-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zarządzanie dziennikiem zabezpieczeń tylko dla administratorów
    en: Managing the security log restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do zarządzania dziennikiem zabezpieczeń
    i ustawieniami audytu do grupy administratorów lokalnych.

    Uprawnienie to obejmuje dwie rzeczy naraz i obie są istotne. Pierwsza to
    możliwość wyczyszczenia dziennika zabezpieczeń — czyli usunięcia zapisu
    o tym, co się na maszynie działo. Druga to możliwość decydowania, co w ogóle
    ma być do tego dziennika zapisywane.

    Druga jest groźniejsza, choć mniej widoczna. Wyczyszczenie dziennika samo
    zostawia w nim wpis i bywa zauważone. Wyłączenie zapisywania konkretnego
    rodzaju zdarzeń nie zostawia luki, którą dałoby się dostrzec — dziennik
    wygląda normalnie, tylko nie ma w nim tego, czego napastnik nie chciał tam
    widzieć.

    Kategoria wysoka. Punkt nie broni maszyny przed przejęciem; broni możliwości
    dowiedzenia się, że do przejęcia doszło. Na maszynie, której raport ma
    trafić do audytu, jest to wartość sama w sobie.

    Na serwerze 2016 warto sprawdzić tę listę osobno, bo systemy zbierania
    dzienników z tamtych lat bywały instalowane z kontem, któremu nadawano to
    uprawnienie zamiast prawa odczytu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zdecydowania, czego o nim nie będzie wiadomo — zanim zacznie działać.
  en: |
    The item limits the right to manage the security log and the audit settings to
    the local administrators group.

    The right covers two things at once and both matter. The first is the ability
    to clear the security log - that is, to remove the record of what happened on
    the machine. The second is the ability to decide what is written into that log
    at all.

    The second is the more dangerous, though the less visible. Clearing the log
    leaves an entry in it and tends to be noticed. Switching off the recording of a
    particular kind of event leaves no gap that could be spotted - the log looks
    normal, it merely lacks what the attacker did not want to see there.

    The category is high. The item does not defend the machine against being taken;
    it defends the possibility of learning that it was. On a machine whose report
    is meant for an audit, that is a value in itself.

    On Server 2016 this list is worth checking separately, because log collection
    systems from those years were sometimes installed with an account granted this
    right instead of a read permission.

    What an attacker gains while the item goes unmet: the ability to decide what
    will not be known about them - before they begin.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy systemów zbierających
    dzienniki.

    Konto agenta zbierającego dzienniki nie potrzebuje tego uprawnienia do
    czytania — do odczytu dziennika zabezpieczeń wystarcza osobne prawo,
    nadawane inaczej. Bywa jednak, że przy instalacji poszło po linii
    najmniejszego oporu i konto dostało uprawnienie do zarządzania.

    Po zawężeniu listy taki agent przestaje czytać dziennik zabezpieczeń,
    a pozostałe dzienniki zbiera dalej. Objaw jest więc częściowy i łatwo go
    przeoczyć: raporty przychodzą, tylko brakuje w nich jednego źródła.

    Właściwą odpowiedzią jest nadanie kontu agenta prawa odczytu dziennika
    zabezpieczeń, a nie zostawienie go na tej liście. Różnica jest zasadnicza:
    odczyt nie pozwala ani wyczyścić dziennika, ani zmienić tego, co się do
    niego zapisuje.

    Czego to nie psuje: zapisywania zdarzeń, odczytu pozostałych dzienników,
    pracy podglądu zdarzeń u administratora ani ustawień audytu.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about log collection systems.

    A collecting agent's account does not need this right in order to read - a
    separate permission, granted otherwise, suffices for reading the security log.
    It happens, though, that installation took the path of least resistance and the
    account was granted the managing right.

    After the list is narrowed, such an agent stops reading the security log and
    goes on collecting the others. The symptom is therefore partial and easy to
    miss: the reports arrive, they merely lack one source.

    The right answer is to grant the agent's account the permission to read the
    security log rather than to leave it on this list. The difference is
    fundamental: reading permits neither clearing the log nor changing what is
    written into it.

    What this does not break: the recording of events, reading the other logs, the
    event viewer's work for an administrator, or the audit settings.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - diagnostics-and-reporting
    - remote-management
  what_breaks:
    pl:
      - Agent zbierający dzienniki na koncie spoza grupy administratorów przestaje czytać dziennik zabezpieczeń
      - Objaw jest częściowy, bo pozostałe dzienniki zbierane są dalej i raporty przychodzą niepełne
      - Narzędzia archiwizujące dziennik zabezpieczeń na koncie usługowym tracą możliwość jego wyczyszczenia
      - Zapisywanie zdarzeń, odczyt pozostałych dzienników i ustawienia audytu działają bez zmian
    en:
      - A log collecting agent under an account outside the administrators group stops reading the security log
      - The symptom is partial, because the other logs go on being collected and the reports arrive incomplete
      - Tools archiving the security log under a service account lose the ability to clear it
      - The recording of events, reading the other logs and the audit settings work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - System zbierania dzienników korzysta z tego uprawnienia i nie nadano jeszcze jego kontu prawa odczytu dziennika zabezpieczeń
    en:
      - A log collection system uses this right and its account has not yet been granted permission to read the security log
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSecurityPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSecurityPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSecurityPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Reading the security log needs a separate permission, not this right. Grant
    # the collecting agent that permission before narrowing the list, or its
    # reports arrive one source short.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSecurityPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSecurityPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/manage-auditing-and-security-log

notes:
  pl: |
    Uprawnienie to nie jest potrzebne do odczytu dziennika zabezpieczeń.
    Odczyt nadaje się osobno i jest to właściwa droga dla systemów zbierania
    dzienników — ta różnica jest sednem sprawdzenia przy tym punkcie.

    Wyczyszczenie dziennika zabezpieczeń zostawia w nim wpis o wyczyszczeniu.
    Zmiana ustawień audytu takiego wpisu nie zostawia, o ile sam audyt zmian
    zasad nie jest włączony. To jest powód, dla którego druga połowa tego
    uprawnienia waży więcej niż pierwsza.

    Punkt warto czytać razem z regułami o ustawieniach audytu. Tamte
    rozstrzygają, co jest zapisywane; ten — kto może to rozstrzygnięcie zmienić.
  en: |
    The right is not needed to read the security log. Reading is granted
    separately, and that is the proper road for log collection systems - the
    distinction is the heart of the review on this item.

    Clearing the security log leaves an entry in it about the clearing. Changing
    the audit settings leaves no such entry, unless the auditing of policy changes
    is itself switched on. That is why the second half of this right weighs more
    than the first.

    The item is worth reading together with the rules on audit settings. Those
    settle what is recorded; this one, who may change that settlement.
