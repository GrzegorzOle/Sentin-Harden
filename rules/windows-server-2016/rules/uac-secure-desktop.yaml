id: win2016-uac-secure-desktop

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Potwierdzenie uprawnień na osobnym, chronionym pulpicie
    en: Confirmation of rights on a separate, protected desktop
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby pytanie o podniesienie uprawnień pojawiało się na
    osobnym pulpicie, do którego zwykłe programy nie mają dostępu, i żeby
    w ogóle się pojawiało.

    Powód istnienia osobnego pulpitu warto nazwać, bo z wyglądu jest to tylko
    przyciemniony ekran. Rzecz w tym, że program działający w zwykłej sesji
    potrafi rysować po cudzych oknach, wysyłać do nich zdarzenia i klikać za
    użytkownika. Pytanie o zgodę wyświetlone na tym samym pulpicie co reszta
    jest więc pytaniem, na które napastnik może odpowiedzieć sam.

    Osobny pulpit zamyka tę drogę: okno potwierdzenia leży poza zasięgiem
    programów działających w sesji użytkownika. Dopiero wtedy pytanie o zgodę
    jest pytaniem do człowieka, a nie elementem, który da się obsłużyć
    programowo.

    Reguła sprawdza także, czy pytanie w ogóle jest zadawane. Ustawienie
    podnoszące uprawnienia bez pytania sprawiłoby, że chroniony pulpit nie ma
    czego chronić — dlatego obie wartości czytane są razem.

    Na serwerze rzecz dotyczy głównie pracy przez sesję zdalną, bo tak
    wygląda tu większość obsługi. Warto wiedzieć, że chroniony pulpit działa
    również w takiej sesji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    potwierdzenia podniesienia uprawnień bez udziału człowieka albo brak
    pytania w ogóle.
  en: |
    The item requires the question about elevating rights to appear on a
    separate desktop that ordinary programs cannot reach - and to appear at all.

    The reason for a separate desktop is worth naming, because to the eye it is
    merely a dimmed screen. The point is that a program running in an ordinary
    session can draw over other windows, send events to them and click on the
    user's behalf. A question about consent shown on the same desktop as
    everything else is therefore a question the attacker can answer themselves.

    A separate desktop closes that road: the confirmation window lies beyond the
    reach of programs running in the user's session. Only then is the question
    about consent a question to a person rather than an element that can be
    handled programmatically.

    The rule also checks whether the question is asked at all. A setting that
    elevates without asking would leave the protected desktop with nothing to
    protect - which is why both values are read together.

    On a server the matter concerns mainly work through a remote session, since
    that is what most administration looks like here. It is worth knowing that
    the protected desktop works in such a session too.

    What an attacker gains while the item goes unmet: the ability to confirm an
    elevation of rights with no person involved, or no question at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy narzędzi zdalnych i tego,
    jak pracuje zespół.

    Chroniony pulpit bywa niewidoczny dla narzędzi przejmujących ekran
    w sposób inny niż sesja zdalna systemu. Starsze oprogramowanie do pomocy
    zdalnej, narzędzia zarządzania wyświetlające ekran maszyny oraz konsole
    wirtualizacji potrafią pokazać ekran przyciemniony bez okna potwierdzenia
    — i wtedy praca zatrzymuje się w miejscu, z którego nie da się ruszyć bez
    dostępu do konsoli.

    To jest realny powód klasy i na serwerze 2016 realniejszy niż gdzie
    indziej, bo narzędzia zdalne przy takich maszynach bywają równie stare jak
    one same.

    Druga rzecz do sprawdzenia to automaty. Reguła upewnia się, że pytanie
    jest zadawane, więc procedura licząca dotąd na ciche podniesienie
    uprawnień zatrzyma się na pytaniu. Na serwerze zatrzyma się bez świadka.

    Rzecz do zapamiętania: żądanie hasła zamiast samej zgody także spełnia ten
    punkt i jest wyborem mocniejszym. Warto po nie sięgnąć tam, gdzie do
    konsoli maszyny ma dostęp więcej niż jedna osoba.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review is about remote tools and how
    the team works.

    The protected desktop is sometimes invisible to tools that take over the
    screen by means other than the system's own remote session. Older remote
    assistance software, management tools displaying a machine's screen and
    virtualisation consoles may show a dimmed screen with no confirmation window
    - and work then stops at a point from which it cannot move without access
    to the console.

    That is the real reason for the class, and on Server 2016 more real than
    elsewhere, because the remote tools used with such machines are often as old
    as they are.

    The second thing to check is automation. The rule makes sure the question is
    asked, so a procedure that until now counted on a silent elevation will stop
    at it. On a server it will stop with no witness.

    Something to remember: demanding a password instead of mere consent also
    meets this item and is the stronger choice. It is worth reaching for where
    more than one person has access to the machine's console.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-management
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Starsze narzędzia pomocy zdalnej pokazują ekran przyciemniony bez okna potwierdzenia
      - Konsole wirtualizacji i narzędzia wyświetlające ekran maszyny mogą nie pokazać pytania o zgodę
      - Procedury liczące na ciche podniesienie uprawnień zatrzymują się na pytaniu, którego nikt nie widzi
      - Żądanie hasła zamiast samej zgody spełnia punkt tak samo i jest wyborem mocniejszym
    en:
      - Older remote assistance tools show a dimmed screen with no confirmation window
      - Virtualisation consoles and tools displaying a machine's screen may not show the consent question
      - Procedures counting on a silent elevation stop at a question nobody sees
      - Demanding a password instead of mere consent meets the item just as well and is the stronger choice
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana narzędziem zdalnym niepokazującym okna na chronionym pulpicie, a dostępu do konsoli nie ma
    en:
      - The machine is administered with a remote tool that does not show the window on the protected desktop, and there is no console access
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $secure = $item.PromptOnSecureDesktop
      $behaviour = $item.ConsentPromptBehaviorAdmin
      if ($null -eq $secure -or $null -eq $behaviour) { 'MISSING' }
      elseif ([int]$secure -eq 1 -and [int]$behaviour -ne 0) { 'PROMPT_ON_SECURE_DESKTOP' }
      else { 'SECURE=' + $secure + ' BEHAVIOUR=' + $behaviour }
    } catch {
      'CHECK_ERROR'
    }
  expected: PROMPT_ON_SECURE_DESKTOP
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      secure            = $item.PromptOnSecureDesktop
      behaviour         = $item.ConsentPromptBehaviorAdmin
      secure_existed    = ($null -ne $item.PromptOnSecureDesktop)
      behaviour_existed = ($null -ne $item.ConsentPromptBehaviorAdmin)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PromptOnSecureDesktop' -Value 1 -Type DWord
    # Two asks for agreement without taking a password. Where the console is
    # reached by more than one person, asking for the password is the stronger
    # choice and meets the item as well.
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorAdmin' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.secure_existed) {
      Set-ItemProperty -Path $b.path -Name 'PromptOnSecureDesktop' -Value $b.secure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'PromptOnSecureDesktop' -ErrorAction SilentlyContinue
    }
    if ($b.behaviour_existed) {
      Set-ItemProperty -Path $b.path -Name 'ConsentPromptBehaviorAdmin' -Value $b.behaviour -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ConsentPromptBehaviorAdmin' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-switch-to-the-secure-desktop-when-prompting-for-elevation

notes:
  pl: |
    Reguła czyta dwie wartości naraz i zgłasza je razem, gdy wynik jest inny
    niż oczekiwany. Sam chroniony pulpit przy podnoszeniu bez pytania nie
    chroni niczego, więc rozdzielenie tych wartości na dwie reguły dawałoby
    raport, w którym każda z nich wygląda dobrze osobno.

    Polecenie naprawcze zapisuje zgodę bez hasła jako zmianę najmniejszą
    prowadzącą do zgodności. Wariant z hasłem spełnia punkt tak samo i jest
    mocniejszy — zmiana wartości na żądanie hasła nie wymaga zmiany reguły.

    Wartości leżą w kluczu wspólnym dla całej grupy kontroli uprawnień.
    Przy cofaniu przywracane są obie niezależnie, bo mogły istnieć osobno.
  en: |
    The rule reads two values at once and reports them together where the result
    is other than expected. A protected desktop alone, with elevation happening
    without a question, protects nothing - so splitting these values into two
    rules would give a report in which each looks fine on its own.

    The remedy writes consent without a password as the smallest change reaching
    compliance. The variant asking for a password meets the item just as well and
    is stronger - changing the value to demand a password needs no change to the
    rule.

    The values lie in a key shared by the whole rights-control group. Undoing
    restores both independently, because they could have existed separately.
