id: win2025-sehop-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Sprawdzanie łańcucha obsługi wyjątków włączone
    en: Structured exception handling overwrite protection enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi sprawdzać spójność łańcucha procedur
    obsługi wyjątków, zanim którąkolwiek z nich wywoła.

    Łańcuch ten jest wykazem miejsc, do których program ma skoczyć, gdy
    coś pójdzie nie tak. Leży na stosie, czyli w tym samym obszarze, do
    którego program zapisuje dane bieżące — i na tym polega problem.
    Zapis przekraczający przewidziany rozmiar potrafi nadpisać wpis
    w tym wykazie.

    Napastnik, któremu się to uda, nie musi robić nic więcej. Wystarczy,
    że doprowadzi do błędu — a błąd wywoła sam, bo właśnie nadpisał
    pamięć. System sięga wtedy do wykazu i skacze tam, gdzie wskazał
    napastnik, wykonując jego kod z uprawnieniami programu, który padł.

    Sprawdzanie łańcucha przerywa tę drogę w punkcie, w którym jest ona
    najtańsza do zamknięcia: przed skokiem. Wykaz uszkodzony nie jest
    używany, tylko odrzucany, a program kończy pracę zamiast wykonać
    cudzy kod.

    Na serwerze punkt waży więcej niż na stanowisku roboczym, bo serwer
    udostępnia usługi sieciowe przyjmujące dane z zewnątrz. To właśnie
    procesy przetwarzające dane przysłane przez kogoś obcego są tymi,
    które da się doprowadzić do przepełnienia — i to one pracują tutaj
    stale, bez udziału człowieka i bez nadzoru.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    wykonania własnego kodu przez wywołanie kontrolowanego błędu
    w procesie przetwarzającym przysłane dane.
  en: |
    The setting bids the system check the wholeness of the chain of exception handling
    procedures before it calls any of them.

    That chain is a list of places a program is to leap to when something goes amiss. It lies on
    the stack, that is in the same room the program writes its present data into - and therein
    lies the trouble. A writing passing the foreseen size can overwrite an entry in that list.

    An attacker who manages it need do nothing further. It is enough that they bring a fault
    about - and they call the fault forth themselves, having just overwritten memory. The system
    then reaches for the list and leaps where the attacker pointed, running their code with the
    rights of the program that fell.

    The checking of the chain breaks that road at the point where it is cheapest to shut: before
    the leap. A damaged list is not used but turned away, and the program ends its work instead
    of running another's code.

    On a server the item weighs more than at a working station, a server holding out network
    services that take data from outside. It is the processes working upon data sent by a
    stranger that can be brought to an overflow - and it is they that work here at all times,
    with no person's part and no watching.

    What an attacker gains while the item goes unmet: a road to running their own code by calling
    forth a governed fault in a process working upon sent data.

disruption_description:
  pl: |
    Sprawdzenia wymagają dwie rzeczy: to, że zmiana zaczyna działać
    dopiero po ponownym uruchomieniu maszyny, oraz programy zbudowane
    tak, że sprawdzenie łańcucha je zatrzymuje.

    Na serwerze współczesnym sprawdzanie jest włączone domyślnie, więc
    niezgodność oznacza zwykle wpis wprowadzony ręcznie — dawno,
    zwykle po to, żeby uruchomić jakąś jedną aplikację. Warto ustalić
    którą, zanim się ten wpis cofnie.

    Przypadkiem drugim, rzadszym, są programy pakowane starymi
    narzędziami ochrony kodu i niektóre sterowniki pisane pod starsze
    wersje systemu. Budują one łańcuch obsługi wyjątków w sposób, który
    sprawdzenie odrzuca — i po zmianie kończą pracę przy pierwszym
    wyjątku.

    Objaw jest gwałtowny i czytelny: program zatrzymuje się, zwykle
    z komunikatem o naruszeniu ochrony. Nie jest to awaria narastająca
    i nie jest to działanie ciche.

    Rozpoznanie prowadzi się na maszynie zapasowej albo na jednej
    maszynie z grupy, a nie na wszystkich naraz. Jest to zresztą
    powód, dla którego punkt nie wchodzi do trybu zbiorczego mimo
    niskiego kosztu w typowym przypadku.

    Zmiana nie dotyczy programów pisanych dla architektury
    sześćdziesięcioczterobitowej, bo te używają innego mechanizmu
    obsługi wyjątków — sprawdzenie ich nie dotyczy i nie zmienia dla
    nich niczego.

    Wartość wchodzi w życie po ponownym uruchomieniu maszyny.
  en: |
    Two things need checking: that the change begins working only after a fresh start of the
    machine, and programs built so that the checking of the chain halts them.

    On a present-day server the checking is on by default, so non-compliance usually means an
    entry made by hand - long ago, and usually so as to start some one application. It is worth
    settling which before that entry is undone.

    The second case, and the rarer, is programs packed by old tools of code protection and some
    drivers written for older versions of the system. They build the chain of exception handling
    in a way the check turns away - and after the change they end their work at the first
    exception.

    The symptom is abrupt and plain: the program halts, usually with a message of a breach of
    protection. It is no breakdown that grows and it is no quiet working.

    The reconnaissance is led on a spare machine or on one machine of a group, not on all at
    once. That is withal the reason the item does not enter the bulk mode despite a low cost in
    the ordinary case.

    The change does not bear on programs written for the sixty-four-bit architecture, those using
    another mechanism of exception handling - the check does not concern them and changes nothing
    for them.

    The value comes into force after a fresh start of the machine.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - drivers-and-devices
  what_breaks:
    pl:
      - Program pakowany starym narzędziem ochrony kodu może zatrzymać się przy pierwszym wyjątku
      - Sterownik pisany pod starsze wersje systemu może zostać odrzucony przez sprawdzenie
      - Programy pisane dla architektury sześćdziesięcioczterobitowej nie są tym punktem dotknięte
      - Wartość wchodzi w życie dopiero po ponownym uruchomieniu maszyny
    en:
      - A program packed by an old tool of code protection may halt at the first exception
      - A driver written for older versions of the system may be turned away by the check
      - Programs written for the sixty-four-bit architecture are untouched by this item
      - The value comes into force only after a fresh start of the machine
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje aplikacja, dla której sprawdzanie łańcucha zostało kiedyś celowo wyłączone
      - Nie przeprowadzono rozpoznania na maszynie zapasowej albo na jednej maszynie z grupy
    en:
      - An application the checking of the chain was once knowingly switched off for works on the server
      - No reconnaissance was made on a spare machine or on one machine of a group
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is written the other way round than it reads: zero means the
      # check is on. An absent value leaves the system default, which is the
      # check being on, but the item calls for the state to be written down, so
      # the absence is reported apart.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
      $name = 'DisableExceptionChainValidation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
    $name = 'DisableExceptionChainValidation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableExceptionChainValidation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server

notes:
  pl: |
    Wpis jest zapisany odwrotnie, niż się czyta: zero znaczy, że
    sprawdzanie jest włączone. Brak wpisu zostawia stan domyślny, czyli
    sprawdzanie włączone, ale punkt wymaga zapisania stanu, więc brak
    raportuję osobno.

    Na serwerze waży to, że usługi sieciowe przetwarzają dane przysłane
    z zewnątrz i pracują stale, bez nadzoru. To one są procesami, które
    da się doprowadzić do przepełnienia.

    Punkt nie wchodzi do trybu zbiorczego mimo niskiego kosztu
    w typowym przypadku, bo rozpoznanie prowadzi się na jednej maszynie
    z grupy, a nie na wszystkich naraz.
  en: |
    The entry is written the other way round than it reads: zero means the checking is on. A want
    of the entry leaves the default state, which is the checking being on, but the item calls for
    the state to be written down, so I report the want apart.

    On a server what weighs is that network services work upon data sent from outside and work at
    all times, unwatched. It is they that are the processes that can be brought to an overflow.

    The item does not enter the bulk mode despite a low cost in the ordinary case, the
    reconnaissance being led on one machine of a group and not on all at once.
