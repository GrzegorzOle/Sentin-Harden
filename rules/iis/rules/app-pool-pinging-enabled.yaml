id: iis-app-pool-pinging-enabled

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Basic Configurations
  title:
    pl: Sprawdzanie żywotności procesu roboczego puli aplikacji włączone
    en: Health checking of the application pool worker process is on
  level: 1
  profile: application

platform:
  system: iis

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer co jakiś czas pyta proces roboczy, czy jeszcze odpowiada. Proces, który
    nie odpowie w wyznaczonym czasie, zostaje uznany za zawieszony i zastąpiony
    nowym. Wyłączenie tego mechanizmu oznacza, że zawieszony proces zostaje tam,
    gdzie jest, i zajmuje pulę bezterminowo.

    Co to odbiera atakującemu: żądanie doprowadzające proces roboczy do zakleszczenia
    albo do pętli bez wyjścia wyłącza witrynę równie skutecznie jak jej zatrzymanie,
    tylko ciszej — usługa działa, pula istnieje, a odpowiedzi nie ma. Bez
    sprawdzania żywotności taki stan trwa do chwili, gdy ktoś zauważy i zrestartuje
    pulę ręcznie. Ze sprawdzaniem serwer sam wymienia zablokowany proces w ciągu
    kilku minut, a atak trzeba ponawiać zamiast wykonać raz.

    Punkt nie zamyka drogi wejścia. Skraca czas, przez który jedno żądanie potrafi
    trzymać witrynę martwą.
  en: |
    The server asks the worker process from time to time whether it still
    answers. A process that does not answer within the appointed time is taken to
    be hung and replaced with a new one. Turning that off means a hung process
    stays where it is and occupies the pool indefinitely.

    What it takes away from an attacker - a request that drives the worker
    process into a deadlock or an endless loop takes the site down as effectively
    as stopping it, only more quietly - the service runs, the pool exists, and
    there are no answers. Without health checking that state lasts until somebody
    notices and restarts the pool by hand. With it the server replaces the
    blocked process by itself within minutes, and the attack has to be repeated
    rather than carried out once.

    The item closes no way in. It shortens the time one request can hold a site
    dead.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo serwer nie odróżnia procesu zawieszonego od
    procesu bardzo zajętego. Aplikacja wykonująca w jednym żądaniu długą operację —
    generowanie obszernego raportu, import pliku, obliczenie zajmujące minuty —
    może nie odpowiedzieć na pytanie o żywotność w wyznaczonym czasie i zostanie
    wymieniona w trakcie pracy. Efekt dla użytkownika jest gorszy niż powolność:
    operacja przepada bez śladu, często bez czytelnego błędu.

    To jest też najczęstszy powód, dla którego ktoś wyłączył ten mechanizm
    świadomie. Zanim go włączysz z powrotem, ustal, czy w aplikacji są takie
    operacje i czy da się je przenieść poza obsługę żądania albo wydłużyć limit
    odpowiedzi zamiast rezygnować ze sprawdzania.

    Drugi przypadek to diagnostyka. Proces podłączony do debuggera stoi z definicji
    i zostanie wymieniony w środku sesji. Na czas takiej pracy sprawdzanie się
    wyłącza — ale wyłącza tymczasowo, a nie zostawia wyłączone na stałe.
  en: |
    The change calls for a review, because the server does not tell a hung
    process from a very busy one. An application doing a long operation within a
    single request - generating a large report, importing a file, a calculation
    taking minutes - may fail to answer the health question in the appointed time
    and be replaced mid-work. The effect for the user is worse than slowness -
    the operation is lost without trace, often with no readable error.

    That is also the most common reason somebody turned this off deliberately.
    Before turning it back on, establish whether the application has such
    operations and whether they can be moved out of request handling, or the
    response limit lengthened, instead of giving up the checking.

    The second case is diagnostics. A process attached to a debugger stands still
    by definition and will be replaced in the middle of a session. For such work
    the checking is turned off - but turned off for the occasion, not left off
    for good.

implementation_consequences:
  impact_areas:
    - web-server-services
  what_breaks:
    pl:
      - Żądanie wykonujące długą operację może nie odpowiedzieć na pytanie o żywotność i zostanie przerwane wraz z wymianą procesu
      - Przerwana operacja przepada bez czytelnego błędu, więc użytkownik widzi pustą stronę albo błąd połączenia
      - Sesja diagnostyczna z procesem podłączonym do debuggera zostanie przerwana przez wymianę procesu
      - Serwer pod bardzo dużym obciążeniem może uznać zajęty proces za zawieszony i wymienić go, pogłębiając chwilowo przeciążenie
      - Aplikacje odpowiadające w typowym czasie nie odczują zmiany w żaden sposób
    en:
      - A request doing a long operation may fail to answer the health question and is cut off along with the process being replaced
      - The interrupted operation is lost with no readable error, so the user sees a blank page or a connection failure
      - A diagnostic session with a process attached to a debugger is cut off by the process being replaced
      - A server under very heavy load may take a busy process for a hung one and replace it, deepening the overload for a moment
      - Applications answering within ordinary times feel nothing at all
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacje wykonujące w jednym żądaniu operacje trwające dłużej niż limit odpowiedzi, dopóki praca nie zostanie z niego wyniesiona
      - Serwery, na których trwa diagnostyka z procesem podłączonym do debuggera
    en:
      - Applications performing operations within one request that run longer than the response limit, until the work has been moved out of it
      - Servers where diagnostics with a process attached to a debugger are under way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel' `
            -Name 'pingingEnabled' -ErrorAction Stop
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([bool]$value) { 'ENABLED' }
          else { 'DISABLED' }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel' `
      -Name 'pingingEnabled' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel'
      name    = 'pingingEnabled'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/applicationPools/applicationPoolDefaults/processModel' `
      -Name 'pingingEnabled' -Value $true

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value ([bool]::Parse($b.value))
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/applicationpools/add/processmodel

notes:
  pl: |
    Sam włącznik nie rozstrzyga wszystkiego — obok niego działają odstęp między
    pytaniami i limit czasu odpowiedzi. Ten punkt włącza mechanizm i zostawia
    oba czasy takimi, jakie zastał, bo ich właściwa wartość zależy od tego, jak
    długo aplikacja potrafi zwlekać z odpowiedzią.

    Zapis obejmuje ustawienia domyślne pul. Pula z własnym ustawieniem wymaga
    poprawki na swoim poziomie.
  en: |
    The switch alone does not settle everything - alongside it work the interval
    between questions and the response time limit. This item turns the mechanism
    on and leaves both times as it found them, since their right value depends on
    how long the application can take to answer.

    The setting covers the pool defaults. A pool with a setting of its own calls
    for a correction at its own level.
