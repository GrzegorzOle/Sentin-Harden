id: win2016-winrm-client-basic-auth-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Client
  title:
    pl: Uwierzytelnianie podstawowe klienta zarządzania zdalnego wyłączone
    en: Basic authentication in the remote management client switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania klientowi zarządzania zdalnego posługiwać się
    uwierzytelnianiem podstawowym przy łączeniu się z innymi maszynami.

    Jest to odbicie reguły o stronie usługi i warto rozumieć, czemu jedno
    nie wystarcza. Tamta pilnuje, żeby ta maszyna nie przyjmowała haseł
    w postaci jawnej. Ta pilnuje, żeby ta maszyna sama takich haseł nie
    wysyłała.

    Różnica w skutkach jest znaczna, bo klient działa w imieniu
    administratora. Hasło wysłane stąd jest hasłem administratora
    łączącego się z maszyną docelową — a docelowa może być maszyną, nad
    którą nikt tu nie ma kontroli.

    Wzorzec ataku jest przy tym prosty i nie wymaga przejęcia niczego.
    Wystarczy skłonić administratora do połączenia się z maszyną
    kontrolowaną przez napastnika: nazwa podstawiona w rozwiązywaniu nazw,
    wpis w skrypcie, literówka w nazwie hosta. Maszyna po drugiej stronie
    odbiera hasło, bo o to właśnie ten sposób prosi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    administratora tej maszyny, oddane dobrowolnie przez samo połączenie
    z maszyną podstawioną.
  en: |
    The setting forbids the remote management client to use basic authentication in
    connecting to other machines.

    It is a mirror of the rule about the service's side, and it is worth grasping
    why one alone does not suffice. That one sees to it that this machine does not
    accept passwords in the clear. This one sees to it that this machine does not
    send such passwords itself.

    The difference in consequences is considerable, the client acting on an
    administrator's behalf. A password sent from here is the password of an
    administrator connecting to a target machine - and the target may be a machine
    nobody here has any control over.

    The pattern of attack is simple besides and calls for nothing to be seized. It
    is enough to induce an administrator to connect to a machine the attacker
    controls: a name substituted in name resolution, an entry in a script, a
    misspelt host name. The machine at the other end receives the password, that
    being exactly what this way asks for.

    What an attacker gains while the item goes unmet: the password of this machine's
    administrator, given up willingly by the mere act of connecting to a substituted
    machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, dokąd ta maszyna się
    łączy.

    Na serwerze, który jest wyłącznie celem zarządzania, a sam nigdzie się
    nie łączy, wdrożenie nie zmienia nic. Jest to przypadek najczęstszy
    i dlatego punkt bywa tani.

    Sprawdzić trzeba maszyny pełniące rolę odwrotną: stanowiska
    administracyjne, serwery wdrożeniowe, maszyny uruchamiające skrypty
    łączące się z wieloma hostami. Tam skutek bywa odczuwalny, jeżeli wśród
    celów są maszyny spoza domeny albo urządzenia z własną implementacją
    usługi.

    Objaw pojawia się po stronie łączącej: skrypt zgłasza niepowodzenie
    uwierzytelniania przy konkretnym celu, a nie przy wszystkich. Prowadzi
    to ku szukaniu przyczyny po stronie celu, choć leży ona tutaj.

    Rzecz druga dotyczy urządzeń wbudowanych i sprzętu sieciowego
    udostępniającego zarządzanie tym samym protokołem. Część z nich
    obsługuje wyłącznie ten najprostszy sposób.

    Czego to nie psuje: przyjmowania połączeń przez tę maszynę, połączeń
    uwierzytelnianych mechanizmem domenowym, pulpitu zdalnego, usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is where this machine
    connects to.

    On a server that is only a target of management and connects nowhere itself, the
    rollout changes nothing. That is the commonest case, and so the item is at times
    cheap.

    What has to be checked are machines in the opposite role: administrative
    positions, deployment servers, machines running scripts that connect to many
    hosts. There the consequence is at times felt, if among the targets are machines
    outside the domain or devices with an implementation of the service of their
    own.

    The symptom appears on the connecting side: a script reports a failure to
    authenticate at a particular target and not at all of them. That leads towards
    looking for the cause on the target's side, though it lies here.

    The second thing concerns embedded devices and network hardware offering
    management over the same protocol. Some of them support that simplest way alone.

    What this does not break: the accepting of connections by this machine,
    connections authenticated by the domain mechanism, the remote desktop, or
    services.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypty łączące się z maszynami spoza domeny zgłaszają niepowodzenie uwierzytelniania przy konkretnym celu, a nie przy wszystkich
      - Urządzenia wbudowane i sprzęt sieciowy obsługujące wyłącznie ten najprostszy sposób przestają być osiągalne z tej maszyny
      - Objaw prowadzi ku szukaniu przyczyny po stronie celu, choć leży ona po stronie łączącej
      - Przyjmowanie połączeń przez tę maszynę i połączenia uwierzytelniane mechanizmem domenowym pozostają bez zmian
    en:
      - Scripts connecting to machines outside the domain report a failure to authenticate at a particular target rather than at all of them
      - Embedded devices and network hardware supporting that simplest way alone cease to be reachable from this machine
      - The symptom leads towards looking for the cause on the target's side, though it lies on the connecting side
      - The accepting of connections by this machine and connections authenticated by the domain mechanism stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Z tej maszyny zarządza się urządzeniami obsługującymi wyłącznie uwierzytelnianie podstawowe
      - Skrypty wdrożeniowe uruchamiane tutaj łączą się z hostami spoza domeny bez wspólnego mechanizmu uwierzytelniania
    en:
      - Devices supporting basic authentication alone are managed from this machine
      - Deployment scripts run here connect to hosts outside the domain with no shared mechanism of authentication
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
      $name = 'AllowBasic'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    $name = 'AllowBasic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowBasic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/authentication-for-remote-connections

notes:
  pl: |
    Punkt otwiera drugą połowę bloku — tę o kliencie. Warto ją wprowadzić
    wprost, bo reguły klienta bywają uznawane za mniej ważne od reguł
    usługi, a przy uwierzytelnianiu podstawowym jest odwrotnie pod jednym
    względem: to klient oddaje hasło.

    Kategoria jest tu niższa niż po stronie usługi i jest to rozróżnienie
    celowe. Strona usługi przyjmuje hasła od wielu i jest osiągalna zdalnie
    bez udziału nikogo stąd. Strona klienta oddaje hasło dopiero wtedy, gdy
    ktoś tutaj zainicjuje połączenie, a więc wymaga dodatkowego warunku.

    Rozpoznanie przyczyny jest przy tej regule trudniejsze niż przy
    pozostałych, bo objaw pojawia się przy jednym celu, a nie przy
    wszystkich. Warto, żeby aplikacja to zapowiadała — oszczędza to godziny
    sprawdzania nie tej maszyny, co trzeba.
  en: |
    The item opens the block's second half - the one about the client. It is worth
    introducing outright, since the client's rules are at times reckoned less
    important than the service's, while at basic authentication the opposite holds
    in one respect: it is the client that gives the password away.

    The category is lower here than on the service's side, and that is a deliberate
    distinction. The service's side accepts passwords from many and is reachable
    remotely with nobody here taking part. The client's side gives a password away
    only once somebody here begins a connection, and so calls for a further
    condition.

    Establishing the cause is harder at this rule than at the others, the symptom
    appearing at one target rather than at all of them. The application had better
    foretell that - it spares hours of checking the wrong machine.
