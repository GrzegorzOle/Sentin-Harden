id: win2016-firewall-logging-successful-connections

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Rejestrowanie nawiązanych połączeń we wszystkich profilach
    en: Logging of connections made in all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaporze zapisywać także te połączenia, które przepuściła,
    a nie tylko te odrzucone.

    Różnica wobec reguły sąsiedniej jest zasadnicza i warto ją rozumieć,
    zanim się tę regułę wdroży. Dziennik odrzuceń pokazuje, czego ktoś
    próbował. Dziennik połączeń nawiązanych pokazuje, co faktycznie się
    odbyło — i to jest jedyne źródło odpowiedzi na pytanie, dokąd maszyna
    rozmawiała i z kim.

    Wartość ujawnia się po włamaniu. Napastnik, który wszedł, korzysta odtąd
    z połączeń dozwolonych — bo gdyby nie były dozwolone, nie miałby ich.
    Cała jego dalsza praca, od pobrania narzędzi po wyprowadzenie danych,
    mieści się w ruchu, którego zapora nie odrzuca. W dzienniku odrzuceń nie
    ma po tym żadnego śladu.

    Drugie zastosowanie jest spokojniejsze: ustalenie, z czym maszyna
    faktycznie się łączy. Wykaz taki bywa zaskakujący i jest punktem wyjścia
    do jakiegokolwiek ograniczania ruchu wychodzącego.

    Zapis ten jest jednak drogi i to trzeba powiedzieć razem z korzyścią.
    Notowane jest każde połączenie, także tysiące zwykłych, roboczych,
    powtarzalnych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    jego praca po wejściu — pobieranie narzędzi, ruch boczny, wyprowadzanie
    danych — nie zostawi w zaporze żadnego zapisu, bo odbywa się
    połączeniami dozwolonymi.
  en: |
    The setting has the firewall write down the connections it has let through as
    well, and not the rejected ones alone.

    The difference from the neighbouring rule is fundamental and worth grasping
    before this one is rolled out. The log of rejections shows what somebody tried.
    The log of connections made shows what actually took place - and it is the only
    source of an answer to the question where the machine talked and with whom.

    The value shows after a break-in. An attacker who has got in uses permitted
    connections from then on - for if they were not permitted they would not have
    them. All their further work, from fetching tools to carrying data out, sits in
    traffic the firewall does not reject. Of that there is no trace whatever in the
    log of rejections.

    The second use is quieter: establishing what the machine really connects to.
    Such a list is at times surprising and is the starting point for any limiting of
    outbound traffic at all.

    This record is dear, though, and that has to be said along with the benefit.
    Every connection is noted, thousands of ordinary, working, repeated ones
    included.

    What an attacker gains while the item goes unmet: the certainty that their work
    after getting in - fetching tools, moving sideways, carrying data out - will
    leave no record in the firewall, since it happens over permitted connections.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i nie dlatego, że coś przestanie
    działać. Nie przestanie. Rzecz jest w tym, że zmiana wprowadzona bez
    przygotowania daje koszt bez pożytku.

    Dziennik zapory ma domyślny rozmiar liczony w kilobajtach. Na serwerze
    obsługującym normalny ruch zapisuje się on w całości w ciągu minut,
    a potem zaczyna nadpisywać najstarsze wpisy. Efektem jest stały strumień
    zapisu na dysk i dziennik, w którym nie ma niczego starszego niż ostatnie
    kilka chwil.

    Dlatego zmiany nie wolno wprowadzać osobno. Poprzedzić ją muszą dwie
    rzeczy: ustalenie rozmiaru dziennika na wartość odpowiadającą ruchowi
    oraz sprawdzenie wolnego miejsca na woluminie systemowym. Bez nich
    reguła jest spełniona formalnie i nieużyteczna.

    Drugą rzeczą do rozważenia jest zbieranie dziennika poza maszynę.
    Dziennik leżący wyłącznie na maszynie, która została przejęta, jest
    dowodem o wartości ograniczonej — napastnik z prawami administratora
    może go skrócić.

    Obciążenie samym zapisem jest zauważalne na maszynach o bardzo dużym
    ruchu, choć rzadko rozstrzygające. Na maszynie granicznej albo
    pośredniczącej warto to zmierzyć, a nie zakładać.

    Czego to nie psuje: działania zapory, reguł, usług, połączeń.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and not because something will stop
    working. It will not. The thing is that the change made without preparation buys
    a cost and no good.

    The firewall log has a default size counted in kilobytes. On a server carrying
    ordinary traffic it writes itself full within minutes and then begins
    overwriting its oldest entries. The effect is a steady stream of writing to disk
    and a log holding nothing older than the last few moments.

    The change must therefore not be made on its own. Two things have to come first:
    settling the log size at a value answering to the traffic, and checking the free
    room on the system volume. Without them the rule is met in form and of no use.

    The second thing to weigh is gathering the log away from the machine. A log
    lying on the machine alone, once that machine has been taken over, is evidence
    of limited worth - an attacker with administrative rights can cut it short.

    The burden of the writing itself is noticeable on machines of very heavy
    traffic, though it seldom settles anything. On a border or intermediary machine
    it is worth measuring rather than assuming.

    What this does not break: the firewall's working, rules, services, or
    connections.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Przy domyślnym rozmiarze dziennika zapis na serwerze o normalnym ruchu nadpisuje się w ciągu minut, więc reguła jest spełniona formalnie i nieużyteczna
      - Stały strumień zapisu obciąża wolumin systemowy, a przy braku wolnego miejsca pogłębia problem zamiast go rozwiązywać
      - Dziennik leżący wyłącznie na maszynie przejętej jest dowodem o ograniczonej wartości, bo napastnik z prawami administratora może go skrócić
      - Działanie zapory, reguły, usługi i połączenia pozostają bez zmian
    en:
      - At the default log size the record on a server of ordinary traffic overwrites itself within minutes, so the rule is met in form and of no use
      - The steady stream of writing burdens the system volume, and where free room is wanting it worsens the problem instead of solving it
      - A log lying on a taken-over machine alone is evidence of limited worth, since an attacker with administrative rights can cut it short
      - The firewall's working, rules, services and connections stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono rozmiaru dziennika i nie sprawdzono wolnego miejsca na woluminie systemowym
      - Maszyna obsługuje bardzo duży ruch, a obciążenia zapisem nie zmierzono, tylko założono
      - Nie przewidziano zbierania dziennika poza maszynę, a zapis ma służyć ustalaniu przebiegu po włamaniu
    en:
      - The log size has not been settled and the free room on the system volume has not been checked
      - The machine carries very heavy traffic and the burden of the writing has been assumed rather than measured
      - No gathering of the log away from the machine has been planned, while the record is to serve for establishing the course of events after a break-in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $silent = @($profiles | Where-Object { $_.LogAllowed -ne 'True' })
        if ($silent.Count -eq 0) { 'ALL_LOGGED' } else { 'SILENT_IN_' + ($silent.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_LOGGED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogAllowed |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the log file size and location first and check free space on the system
    # volume - on a busy server the default log size wraps around within minutes,
    # which buys a large write stream and no usable record.
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogAllowed True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogAllowed $p.LogAllowed
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Punkt jest jedynym w bloku zapory, przy którym zależność od innej,
    nieopisanej regułą decyzji jest rozstrzygająca. Rozmiar dziennika nie
    jest tu szczegółem wdrożeniowym, tylko warunkiem sensowności — i dlatego
    uwaga o tym siedzi wprost w poleceniu naprawczym, a nie tylko w opisie.

    Warto powiedzieć wprost, czego ta reguła nie daje. Nie wykrywa niczego
    sama z siebie i nie ostrzega. Daje materiał, z którego da się odtworzyć
    przebieg — pod warunkiem, że ktoś go zachowa i przeczyta. Bez tego
    warunku jest to koszt bez zysku i uczciwiej powiedzieć to przy regule,
    niż pozwolić użytkownikowi odkryć to po pół roku.

    Kolejność wdrożenia w całym bloku zapory jest naturalna: najpierw zapora
    i domyślne blokowanie, potem dziennik odrzuceń, na końcu ten punkt.
    Odwrócenie tej kolejności daje dane o ruchu na maszynie, której nikt
    jeszcze nie zabezpieczył.
  en: |
    The item is the only one in the firewall block where dependence on another
    decision, described by no rule, is decisive. The log size is no detail of
    rollout here but a condition of the thing making sense - and for that reason the
    remark about it sits in the remedial command outright, and not in the
    description alone.

    It is worth saying outright what this rule does not give. It detects nothing of
    itself and warns of nothing. It gives material from which a course of events can
    be reconstructed - provided somebody keeps and reads it. Without that condition
    it is a cost with no gain, and it is honester to say so at the rule than to let
    the user discover it half a year on.

    The order of rollout in the whole firewall block is natural: the firewall and
    blocking by default first, then the log of rejections, this item last. Reversing
    that order gives data about traffic on a machine nobody has secured yet.
