id: win2025-enable-delegation-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Włączanie delegowania nieprzyznane nikomu
    en: Enabling delegation granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Delegowanie pozwala usłudze sięgnąć po zasób na maszynie trzeciej
    w imieniu użytkownika, który się do niej zgłosił. Jest to mechanizm
    potrzebny i powszechny — bez niego aplikacja sieciowa nie mogłaby
    odczytać bazy danych z uprawnieniami osoby, która o dane poprosiła.

    Kłopot bierze się z zasięgu. Konto oznaczone jako zaufane do
    delegowania może przedstawiać się jako każdy użytkownik, który się
    z nim połączył. Jeżeli wśród nich znajdzie się administrator,
    konto to zyskuje jego uprawnienia — i wystarczy do tego, żeby
    administrator raz otworzył stronę na tym serwerze.

    Prawo omawiane tutaj nie samo delegowanie włącza. Pozwala oznaczyć
    konto jako zaufane, czyli utworzyć taki stan. Jest to różnica
    istotna: prawo to nie jest używane w czasie pracy, tylko w czasie
    konfigurowania, więc odebranie go nie przerywa niczego, co działa.

    Na serwerze członkowskim prawo to nie ma zastosowania — oznaczenia
    dokonuje się w katalogu, a nie lokalnie. Na kontrolerze domeny jest
    odwrotnie: to właśnie tam ktoś musi je mieć, żeby delegowanie w ogóle
    dało się skonfigurować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    oznaczenia wybranego konta jako zaufanego do delegowania i zbierania
    przez nie tożsamości każdego, kto się z nim połączy — łącznie
    z administratorami.
  en: |
    Delegation lets a service reach for a resource on a third machine in the name of the user
    who came to it. It is a mechanism both needed and common - without it a network
    application could not read a database with the rights of the person who asked for the
    data.

    The trouble comes of reach. An account marked trusted for delegation may present itself as
    every user who has connected to it. Should an administrator be among them, that account
    gains their rights - and for that it is enough that the administrator once opened a page
    on this server.

    The right spoken of here does not switch delegation on itself. It allows an account to be
    marked as trusted, that is, such a state to be made. That is a weighty difference: the
    right is not used at working time but at configuring time, so taking it away breaks
    nothing that works.

    On a member server the right has no use - the marking is done in the directory rather than
    locally. On a domain controller it is the other way about: it is there that somebody must
    hold it for delegation to be configurable at all.

    What an attacker gains while the item goes unmet: the means of marking a chosen account as
    trusted for delegation and gathering through it the identity of everyone who connects to
    it - administrators among them.

disruption_description:
  pl: |
    Sprawdzenia wymaga rola tej maszyny, bo skutek jest na serwerze
    członkowskim i na kontrolerze domeny zupełnie inny.

    Na serwerze członkowskim nie przestaje działać nic i nikt niczego
    nie zauważy. Delegowanie konfiguruje się w katalogu, więc prawo
    lokalne jest tu bez znaczenia i w stanie domyślnym wykaz jest pusty.

    Na kontrolerze domeny rzecz wygląda inaczej. Prawo to jest tam
    faktycznie potrzebne do oznaczania kont, a jego odebranie znaczy, że
    nikt nie będzie mógł skonfigurować delegowania ani zmienić
    konfiguracji istniejącej.

    Istotne jest, czego to nie psuje. Delegowanie już skonfigurowane
    działa dalej bez zmiany, bo prawo jest czytane wyłącznie przy
    zmianie oznaczenia, a nie przy każdym użyciu. Aplikacje korzystające
    z delegowania nie odczują niczego.

    Objaw pojawia się dopiero wtedy, gdy ktoś spróbuje coś skonfigurować
    — i jest to odmowa w konsoli zarządzania, czyli komunikat czytelny
    dla tego, kto go zobaczy.

    Rozwiązaniem nie jest pozostawienie prawa na stałe, tylko nadanie go
    na czas zmiany i odebranie po niej. Jest to wykonalne, bo
    konfigurowanie delegowania jest czynnością rzadką i planowaną.
  en: |
    What needs checking is this machine's role, since the effect on a member server and on a
    domain controller is altogether different.

    On a member server nothing stops working and nobody notices anything. Delegation is
    configured in the directory, so the local right is here of no weight and in the default
    state the list is empty.

    On a domain controller the thing looks otherwise. The right is there in fact taken for the
    marking of accounts, and taking it away means nobody will be able to configure delegation
    or change an existing configuration.

    What matters is what this does not break. Delegation already configured goes on working
    unchanged, since the right is read only at a change of the marking rather than at every
    use. Applications using delegation will feel nothing.

    The symptom appears only once somebody tries to configure something - and it is a refusal
    in the management console, that is, a message plain to whoever sees it.

    The answer is not leaving the right in place for good but granting it for the time of a
    change and taking it away after. That is workable, since configuring delegation is a
    seldom and planned doing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - legacy-authentication
  what_breaks:
    pl:
      - Na serwerze członkowskim nie przestaje działać nic, bo wykaz jest pusty z natury
      - Na kontrolerze domeny nikt nie skonfiguruje delegowania ani nie zmieni istniejącej konfiguracji
      - Delegowanie już skonfigurowane działa dalej bez zmiany
      - Aplikacje korzystające z delegowania nie odczuwają niczego
      - Objaw to odmowa w konsoli zarządzania przy próbie zmiany oznaczenia konta
    en:
      - On a member server nothing stops working, since the list is empty by nature
      - On a domain controller nobody will configure delegation or change an existing configuration
      - Delegation already configured goes on working unchanged
      - Applications using delegation feel nothing
      - The symptom is a refusal in the management console at a try to change an account's marking
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest kontrolerem domeny, a konfiguracja delegowania jest w tym okresie zmieniana
    en:
      - The machine is a domain controller and the configuration of delegation is being changed in this period
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeEnableDelegationPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeEnableDelegationPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeEnableDelegationPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeEnableDelegationPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enable-computer-and-user-accounts-to-be-trusted-for-delegation

notes:
  pl: |
    Ocena uciążliwości jest tu wyższa niż w paczce stanowiska roboczego
    i powodem jest kontroler domeny. Tam prawo to jest faktycznie
    używane, więc jego odebranie zatrzymuje pracę konfiguracyjną —
    choć nie zatrzymuje niczego, co już działa.

    Prawo jest czytane przy zmianie oznaczenia konta, a nie przy
    korzystaniu z delegowania. Stąd bierze się rozdział między
    „nie da się skonfigurować" a „przestaje działać": zachodzi wyłącznie
    to pierwsze.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.
  en: |
    The judgement of disruption is higher here than in the working station's pack, and the
    reason is the domain controller. There the right is in fact used, so taking it away halts
    configuring work - though it halts nothing that works already.

    The right is read at a change of an account's marking rather than at the use of delegation.
    Thence comes the parting between "cannot be configured" and "stops working": only the
    first holds.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.
