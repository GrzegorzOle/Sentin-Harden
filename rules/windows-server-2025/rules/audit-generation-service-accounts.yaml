id: win2025-audit-generation-service-accounts

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Generowanie wpisów inspekcji ograniczone do kont usługowych
    en: Generating audit entries restricted to service accounts
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo to pozwala kontu dopisywać własne wpisy do dziennika
    zabezpieczeń i punkt wymaga, żeby miały je wyłącznie konta usług
    systemowych.

    Jest to prawo o działaniu odwrotnym do intuicji. Nie daje dostępu do
    niczego i niczego nie odblokowuje — pozwala pisać. Właśnie dlatego
    bywa pomijane przy przeglądzie uprawnień, mimo że uderza
    bezpośrednio w wiarygodność dziennika.

    Konto z tym prawem może wypełnić dziennik zabezpieczeń wpisami
    własnymi. Wpisy te wyglądają jak każde inne, mają poprawne znaczniki
    czasu i mieszają się z resztą zapisu. Skutek jest podwójny: zapis
    prawdziwy zostaje wyparty przez nieprawdziwy, a to, co zostało,
    przestaje być wiarygodne, bo nie sposób odróżnić jednego od drugiego.

    Na serwerze jest to istotne z powodu praktycznego — to właśnie tutaj
    dziennik zabezpieczeń bywa jedynym źródłem wiedzy o zdarzeniach,
    a maszyna jest zdalna i nikt nie widzi jej na oczy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zaśmiecenia dziennika i podważenia wszystkiego, co w nim zostało.
    Nie musi niczego kasować — wystarczy, że dopisze dość.
  en: |
    This right lets an account write entries of its own into the security log, and the item
    takes that only the system services' accounts have it.

    It is a right whose working runs counter to intuition. It gives access to nothing and
    unlocks nothing - it lets one write. That is exactly why it is at times passed over at a
    review of rights, although it strikes directly at the log's trustworthiness.

    An account with this right can fill the security log with entries of its own. Those
    entries look like any other, have right time stamps and mix in with the rest of the
    record. The effect is doubled: the true record is crowded out by an untrue one, and what
    is left stops being trustworthy, since there is no telling one from the other.

    On a server that matters for a practical reason - it is here that the security log is at
    times the only source of knowledge about events, while the machine is remote and nobody
    sets eyes on it.

    What an attacker gains while the item goes unmet: the means of littering the log and of
    casting doubt on everything left in it. They need delete nothing - it is enough that
    they write enough.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie przestaje działać. Konta usług systemowych zachowują to
    prawo, więc zapis prowadzony przez system pozostaje bez zmiany.

    Skutek pojawia się wyłącznie tam, gdzie prawo to nadano komuś
    jeszcze — a na serwerze zdarza się to przy oprogramowaniu
    zabezpieczającym i przy agentach zbierających zdarzenia. Program,
    który wpisuje własne zdarzenia do dziennika zabezpieczeń, po tej
    zmianie przestanie móc to robić.

    Objaw bywa niejednoznaczny: program działa dalej, nie zgłasza błędu,
    a jego zdarzenia po prostu przestają się pojawiać. Warto sprawdzić
    przed zmianą, czy na tym serwerze pracuje coś takiego.

    Zmiana nie wymaga restartu, ale program, który stracił to prawo,
    odzyska zachowanie prawidłowe dopiero po ponownym uruchomieniu.
  en: |
    The change has no known side effects and takes no break.

    Nothing stops working. The system services' accounts keep this right, so the record led
    by the system stays unchanged.

    The effect appears only where the right was granted to somebody else too - and on a
    server that happens with security software and with agents gathering events. A program
    writing events of its own into the security log will after this change no longer be able
    to.

    The symptom is at times unclear: the program goes on working, reports no error, and its
    events simply stop appearing. It is worth checking before the change whether anything
    like that works on this server.

    The change takes no restart, but a program that has lost this right will regain right
    behaviour only after being started again.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Program dopisujący własne zdarzenia do dziennika zabezpieczeń przestanie móc to robić
      - Objaw jest niejednoznaczny — program działa dalej, a jego zdarzenia znikają
      - Konta usług systemowych zachowują to prawo i zapis systemowy działa bez zmiany
    en:
      - A program writing events of its own into the security log will no longer be able to
      - The symptom is unclear - the program goes on working and its events vanish
      - The system services' accounts keep this right and the system record works unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze działa agent zabezpieczeń zapisujący wpisy do dziennika zabezpieczeń z własnego konta
    en:
      - A security agent writing entries into the security log from an account of its own runs on the server
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right   = 'SeAuditPrivilege'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAuditPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAuditPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/generate-security-audits

notes:
  pl: |
    Sprawdzenie przyjmuje dwa stany zgodne: wykaz złożony wyłącznie
    z dwóch kont usług systemowych albo wykaz pusty. Pusty jest
    dopuszczalny, bo oznacza, że prawa nie ma nikt poza mechanizmami
    działającymi poza tym wykazem.

    Wykaz jest porządkowany przed porównaniem, żeby kolejność wpisów
    nie decydowała o wyniku. Konta wskazywane są identyfikatorami,
    a nie nazwami — nazwy kont wbudowanych są tłumaczone razem
    z systemem.

    Punkt czyta się razem z rozmiarem dziennika zabezpieczeń.
    Nadmiarowe uprawnienie do pisania i mały dziennik dają razem
    najprostszą drogę do wyparcia zapisu prawdziwego.
  en: |
    The check accepts two compliant states: a list made up of the two system services'
    accounts alone, or an empty list. An empty one is admissible, since it means nobody has
    the right beyond mechanisms working outside that list.

    The list is put in order before the comparison, so that the order of entries does not
    settle the outcome. Accounts are pointed to by identifier rather than by name - the
    names of built-in accounts are translated along with the system.

    The item is read together with the security log's size. A surplus right to write and a
    small log give together the simplest road to crowding the true record out.
