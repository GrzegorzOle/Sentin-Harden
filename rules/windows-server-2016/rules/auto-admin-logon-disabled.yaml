id: win2016-auto-admin-logon-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MSS (Legacy)
  title:
    pl: Automatyczne logowanie administratora wyłączone
    en: Automatic administrator sign-in switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza mechanizm logujący maszynę na wskazane konto
    samoczynnie, bez pytania o hasło.

    Mechanizm ten robi dwie rzeczy i obie są groźne, ale z innego powodu.

    Pierwsza to samo logowanie. Maszyna po starcie znajduje się w sesji
    użytkownika, zwykle administratora, bez żadnego uwierzytelnienia.
    Każdy, kto ma dostęp do ekranu — serwerownia, sala, sesja konsolowa
    przez zarządzanie sprzętem — jest w tej sesji zalogowany.

    Druga waży więcej. Żeby zalogować się bez pytania, system musi hasło
    skądś wziąć — i bierze je z wpisu obok, przechowywanego w postaci
    jawnej. Hasło konta administratora leży więc w rejestrze, czytelne dla
    każdego, kto ten rejestr odczyta: lokalnie, zdalnie, z kopii zapasowej,
    z obrazu dysku, z pliku gałęzi rejestru skopiowanego na bok.

    Drugi skutek przeżywa pierwszy. Wyłączenie mechanizmu zatrzymuje
    samoczynne logowanie, ale hasło zostaje tam, gdzie leżało, dopóki
    ktoś go stamtąd nie usunie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło konta
    administratora w postaci jawnej, do odczytania bez łamania czegokolwiek,
    oraz maszynę zalogowaną na to konto od chwili startu.
  en: |
    The setting switches off the mechanism signing the machine in to a named account
    of itself, without asking for a password.

    That mechanism does two things and both are dangerous, though for different
    reasons.

    The first is the signing in itself. After starting, the machine is in a user's
    session, as a rule an administrator's, with no authentication at all. Anybody with
    access to the screen - a server room, a hall, a console session through hardware
    management - is signed in to that session.

    The second weighs more. To sign in without asking, the system has to take the
    password from somewhere - and it takes it from a neighbouring entry, kept in the
    open. An administrator account's password therefore lies in the registry, readable
    by anybody who reads that registry: locally, remotely, from a backup, from a disc
    image, from a registry hive file copied aside.

    The second consequence outlives the first. Switching the mechanism off stops the
    signing in of itself, but the password stays where it lay until somebody removes
    it from there.

    What an attacker gains while the item goes unmet: an administrator account's
    password in the open, to be read without breaking anything, and a machine signed in
    to that account from the moment it starts.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy coś na tej maszynie
    liczy na to, że po starcie będzie zalogowana sesja.

    Mechanizm włącza się rozmyślnie i prawie zawsze z jednego powodu:
    aplikacja, która musi działać w sesji użytkownika, a nie jako usługa.
    Stary system sterowania, pulpit informacyjny, oprogramowanie kasowe,
    narzędzie zbierające dane z urządzenia przez port szeregowy.

    Po wdrożeniu maszyna zatrzyma się po restarcie na ekranie logowania,
    a aplikacja nie wystartuje. Objaw jest jednoznaczny, ale pojawia się
    dopiero przy najbliższym restarcie — a więc może minąć wiele tygodni
    między zmianą a jej skutkiem.

    Rzecz druga jest ważniejsza od pierwszej i trzeba ją nazwać wprost.
    Wyłączenie mechanizmu nie usuwa hasła, które leży w rejestrze obok.
    Punkt jest wykonany, raport pokazuje zgodność, a hasło administratora
    nadal jest tam do odczytania. Usunięcie go jest osobną decyzją,
    bo kopia zapasowa tej reguły go nie obejmuje, a przywrócenie
    mechanizmu bez hasła i tak nie zadziała.

    Czego to nie psuje: logowania ręcznego, usług, sieci, dostępu do
    plików, zadań zaplanowanych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anything on this
    machine counts on a session being signed in after a start.

    The mechanism is switched on deliberately and almost always for one reason: an
    application that has to work in a user's session rather than as a service. An old
    control system, an information display, point-of-sale software, a tool gathering
    data from a device over a serial port.

    After the rollout the machine will stop at the sign-in screen after a restart and
    the application will not start. The symptom is unambiguous, but it appears only at
    the next restart - so many weeks may pass between the change and its consequence.

    The second thing matters more than the first and has to be named outright.
    Switching the mechanism off does not remove the password lying in the registry
    beside it. The item is carried out, the report shows compliance, and the
    administrator's password is still there to be read. Removing it is a separate
    decision, this rule's backup not covering it, and restoring the mechanism without
    the password would not work anyway.

    What this does not break: signing in by hand, services, the network, access to
    files, or scheduled tasks.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Maszyna zatrzyma się po restarcie na ekranie logowania, a aplikacja wymagająca zalogowanej sesji nie wystartuje
      - Objaw pojawia się dopiero przy najbliższym restarcie, więc między zmianą a jej skutkiem może minąć wiele tygodni
      - Hasło przechowywane we wpisie obok nie zostaje usunięte - punkt jest wykonany, a hasło nadal jest do odczytania
      - Logowanie ręczne, usługi, sieć i zadania zaplanowane pozostają bez zmian
    en:
      - The machine will stop at the sign-in screen after a restart and an application needing a signed-in session will not start
      - The symptom appears only at the next restart, so many weeks may pass between the change and its consequence
      - The password kept in the neighbouring entry is not removed - the item is carried out and the password is still there to be read
      - Signing in by hand, services, the network and scheduled tasks stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja wymagająca zalogowanej sesji po starcie i nie da się jej uruchomić jako usługi
      - Maszyna pełni rolę pulpitu informacyjnego albo stanowiska bezobsługowego i nikt nie będzie się na nią logował
    en:
      - An application needing a signed-in session after a start works on the machine and cannot be run as a service
      - The machine fills the role of an information display or an unattended position and nobody will be signing in to it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $current = (Get-ItemProperty -Path $path -Name 'AutoAdminLogon' -ErrorAction SilentlyContinue).AutoAdminLogon
      # Absence is equivalent to the mechanism being off, and that is what the
      # report says - the machine is described, not the registry.
      if ($null -eq $current) { '0' }
      else { ([string]$current).Trim() }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'AutoAdminLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the switch is written here. The stored password sits in a
    # neighbouring entry and is left alone on purpose - clearing it is a
    # separate decision, and this rule's backup does not hold it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AutoAdminLogon' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/user-profiles-and-logon/turn-on-automatic-logon

notes:
  pl: |
    Punkt ma kategorię krytyczną i jest jedynym takim w tym bloku. Powód
    nie leży w samym logowaniu, tylko w haśle leżącym w postaci jawnej —
    to jest bezpośrednia droga do poświadczeń administratora, wykorzystywana
    w praktyce i niewymagająca żadnej usterki.

    Rozdzielenie skutku na dwie części — mechanizm i hasło — jest tu
    najważniejszą rzeczą do pokazania w interfejsie. Reguła zamyka jedną,
    a druga zostaje i wygląda w raporcie na zamkniętą. Jest to dokładnie
    ten rodzaj rozbieżności, przed którym aplikacja ma ostrzegać, zamiast
    pozwolić użytkownikowi przeczytać zieleń jako gwarancję.

    Kopia zapasowa tej reguły nie obejmuje hasła rozmyślnie. Objęcie go
    znaczyłoby przepisanie hasła administratora do pliku kopii, a więc
    wytworzenie drugiego miejsca, w którym leży ono jawnie. Usunięcie
    wpisu z hasłem pozostaje osobną, świadomą czynnością człowieka.
  en: |
    The item is of a critical category and is the only such in this block. The reason
    lies not in the signing in but in the password lying in the open - that is a direct
    road to an administrator's credentials, used in practice and calling for no fault
    at all.

    Parting the consequence into two - the mechanism and the password - is the most
    important thing to show in the interface here. The rule shuts one, and the other
    stays and looks shut in the report. It is exactly the kind of discrepancy the
    application is to warn of, rather than letting the user read green as a guarantee.

    This rule's backup does not cover the password, and deliberately so. Covering it
    would mean copying an administrator's password into a backup file, and so making a
    second place where it lies in the open. Removing the entry holding the password
    stays a separate, deliberate act of a person.
