id: win2025-wireless-display-pairing-pin-required

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Connect
  title:
    pl: Parowanie z wyświetlaczem bezprzewodowym wymaga kodu
    en: Pairing with a wireless display requires a code
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga podania kodu przy parowaniu maszyny z wyświetlaczem
    bezprzewodowym.

    Kategoria średnia i chcę nazwać, czym parowanie z wyświetlaczem jest
    naprawdę, bo brzmi jak wybór ekranu. Jest przesyłaniem obrazu pulpitu do
    urządzenia w zasięgu. Bez kodu jedynym zabezpieczeniem jest to, że oba
    urządzenia muszą się nawzajem widzieć — a zasięg jest większy niż
    pomieszczenie i nie kończy się na drzwiach.

    Na serwerze przedmiotem jest obraz pulpitu administratora. Obejmuje to
    otwarte konsole, wyniki poleceń, zawartość okien poświadczeń i wszystko
    inne, co akurat jest na ekranie. Nie potrzeba wykradać żadnego pliku,
    żeby zobaczyć, co ktoś właśnie robi na tej maszynie.

    Ustawienie przyjmuje wartości ze zbioru, nie tylko zero i jeden: kod
    można wymagać przy pierwszym parowaniu albo za każdym razem. Pierwsze
    wystarcza tam, gdzie odbiornik jest znany i stoi w zamkniętym
    pomieszczeniu; drugie jest właściwe wszędzie, gdzie bywają osoby spoza
    organizacji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sparowania się z maszyną w zasięgu i oglądania jej pulpitu bez podania
    czegokolwiek.
  en: |
    The item requires a code when the machine is paired with a wireless
    display.

    The category is medium, and I want to name what pairing with a display
    really is, because it sounds like choosing a screen. It is the sending of
    the desktop's picture to a device within range. Without a code the only
    protection is that both devices must see each other - and the range is
    larger than a room and does not stop at the door.

    On a server the subject is an administrator's desktop. That takes in open
    consoles, the results of commands, the contents of credential windows and
    whatever else happens to be on the screen. No file has to be stolen to
    see what somebody is doing on that machine.

    The setting takes values from a set, not just zero and one: a code can be
    required at the first pairing or every time. The first is enough where
    the receiver is known and stands in a locked room; the second is right
    anywhere people from outside the organisation come and go.

    What an attacker gains while the item goes unmet: the ability to pair
    with a machine within range and watch its desktop without giving
    anything.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", chociaż na serwerze zwykle nie ma czego
    sprawdzać — przesyłanie obrazu bezprzewodowo wymaga karty
    bezprzewodowej, której serwer najczęściej nie ma.

    Gdzie mechanizm działa, skutek jest widoczny: przy parowaniu pojawi się
    kod, który trzeba przepisać z ekranu odbiornika. To dodaje jeden krok
    i wymaga, żeby ekran odbiornika był widoczny dla osoby parującej.
    Przy odbiorniku wiszącym wysoko pod sufitem albo schowanym za obudową
    potrafi to być realny kłopot i warto to sprawdzić, zanim ktoś stanie
    z tym problemem w sali konferencyjnej.

    Druga rzecz do rozważenia to wybór wartości. Żądanie kodu za każdym
    razem jest bezpieczniejsze, ale zamienia jednorazową niedogodność
    w stałą — a stała niedogodność jest tym, co ludzie obchodzą. Domyślnie
    stawiam na kod przy pierwszym parowaniu i zaznaczam, że w pomieszczeniu
    otwartym dla osób z zewnątrz właściwa jest wartość wyższa.

    Czego to nie psuje: sesji zdalnych, przesyłania obrazu przewodowo,
    ekranów podłączonych kablem ani już sparowanych odbiorników.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", although on a server there is usually
    nothing to review - sending a picture wirelessly needs a wireless card,
    which a server most often does not have.

    Where the mechanism works, the effect is visible: at pairing, a code
    appears that has to be copied from the receiver's screen. That adds a
    step and requires the receiver's screen to be visible to the person
    pairing. With a receiver hung high under the ceiling or hidden behind a
    casing, that can be a real nuisance, and it is worth checking before
    somebody stands with that problem in a meeting room.

    The second thing to weigh is the choice of value. Demanding a code every
    time is safer, but it turns a one-off inconvenience into a permanent one
    - and a permanent inconvenience is what people work around. By default I
    settle on a code at the first pairing, and note that in a room open to
    people from outside the higher value is the right one.

    What this does not break: remote sessions, sending a picture by cable,
    screens attached by cable, or receivers already paired.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
    - drivers-and-devices
  what_breaks:
    pl:
      - Przy parowaniu z wyświetlaczem pojawi się kod, który trzeba przepisać z ekranu odbiornika
      - Przy odbiorniku wiszącym pod sufitem albo schowanym za obudową ekran z kodem bywa niewidoczny dla osoby parującej
      - Żądanie kodu za każdym razem jest bezpieczniejsze, ale stała niedogodność jest tym, co ludzie obchodzą
      - Sesje zdalne, przesyłanie obrazu przewodowo, ekrany podłączone kablem i już sparowane odbiorniki działają bez zmian
    en:
      - At pairing with a display a code appears that has to be copied from the receiver's screen
      - With a receiver hung under the ceiling or hidden behind a casing, the screen showing the code is sometimes not visible to the person pairing
      - Demanding a code every time is safer, but a permanent inconvenience is what people work around
      - Remote sessions, sending a picture by cable, screens attached by cable and receivers already paired work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Odbiornik obrazu stoi tak, że jego ekran z kodem jest niewidoczny dla osoby parującej, i nie da się tego zmienić
    en:
      - The picture receiver stands so that its screen showing the code is not visible to the person pairing, and this cannot be changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero never asks for a code,
      # one asks at the first pairing, two asks every time.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
      $name = 'RequirePinForPairing'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(1|2)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
    $name = 'RequirePinForPairing'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Pairing with a display sends the desktop's picture to a device within
    # range, and the range does not stop at the door. One asks for a code at the
    # first pairing and lets a known receiver through afterwards. Two asks every
    # time and suits rooms open to people from outside.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Connect'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequirePinForPairing' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-wirelessdisplay

