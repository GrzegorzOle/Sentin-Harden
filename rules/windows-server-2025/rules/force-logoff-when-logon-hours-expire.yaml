id: win2025-force-logoff-when-logon-hours-expire

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Sesje sieciowe rozłączane po upływie dozwolonych godzin pracy
    en: Network sessions disconnected once permitted working hours end
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe rozłączyć sesje sieciowe prowadzone do tej maszyny,
    gdy kontu, które je otworzyło, kończą się dozwolone godziny pracy.

    Sam w sobie punkt nie ogranicza niczyjego dostępu. Egzekwuje
    ograniczenie wprowadzone gdzie indziej — w godzinach logowania
    ustawionych na koncie. Bez niego godziny te działają tylko przy
    zakładaniu nowej sesji: kto zdążył się połączyć przed ich upływem,
    zostaje połączony dowolnie długo. Ograniczenie zamienia się wtedy
    w formalność, którą wystarczy wyprzedzić.

    Na serwerze punkt waży więcej niż na stanowisku roboczym i dlatego
    oceniam go inaczej. Do stanowiska roboczego zwykle nikt się nie
    łączy, więc egzekwować nie ma czego. Serwer jest stroną biorącą
    połączenia: to na nim trwają sesje plikowe, to on utrzymuje otwarte
    uchwyty do dokumentów i to jego udziały są celem połączenia. Tutaj
    godziny logowania faktycznie coś znaczą, a ich egzekwowanie ma
    przedmiot.

    Reguła nie widzi, czy na kontach korzystających z tego serwera
    godziny logowania w ogóle wyznaczono, i nie próbuje tego zgadywać.
    Na serwerze, na którym nikt ich nie ustawił, punkt jest spełniony
    i bez skutku jednocześnie — co jest stanem poprawnym, a nie
    zaniedbaniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    otwartą w dozwolonych godzinach i utrzymywaną poza nimi, czyli
    dostęp w czasie, w którym nikt na ten dostęp nie patrzy.
  en: |
    The setting bids the network sessions led to this machine be disconnected when the account
    that opened them runs out of its permitted working hours.

    Of itself the item narrows nobody's access. It enforces a narrowing brought in elsewhere - in
    the sign-in hours set on the account. Without it those hours work only at the opening of a
    new session: whoever managed to connect before they passed stays connected as long as they
    please. The narrowing turns then into a formality it is enough to get ahead of.

    On a server the item weighs more than at a working station and hence I rate it otherwise.
    Nobody usually connects to a working station, so there is nothing to enforce. A server is the
    taking side of connections: upon it the file sessions last, it holds the open handles to
    documents and its shares are the aim of a connection. Here sign-in hours truly mean
    something, and their enforcement has a subject.

    The rule cannot see whether sign-in hours were set at all on the accounts using this server,
    and does not try to guess it. On a server where nobody set them the item is met and without
    effect at once - which is a right state rather than a neglect.

    What an attacker gains while the item goes unmet: a session opened within the permitted hours
    and held beyond them, that is, access at a time when nobody is watching that access.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy ludzi wszędzie tam, gdzie
    godziny logowania są na kontach wyznaczone, i wymaga uprzedzenia ich
    przed wprowadzeniem.

    Podniosłem klasę względem paczki stanowiska roboczego z tego
    właśnie powodu. Na stanowisku rozłączana była sesja, której zwykle
    nie było. Na serwerze rozłączane są sesje cudze — ludzi pracujących
    na plikach w tej chwili.

    Skutek najdotkliwszy: dokument otwarty z udziału w chwili upływu
    godzin zostaje odcięty od źródła. Program, który go trzyma, zgłosi
    błąd zapisu albo utratę połączenia, a praca niezapisana może
    przepaść. Objaw jest przy tym mylący, bo wygląda na awarię sieci,
    a nie na zadziałanie zasady — i tak właśnie bywa zgłaszany.

    Skutek drugi jest zbiorowy: rozłączenie następuje o stałej godzinie,
    więc dotyka naraz wszystkich, którym ta godzina wypada. Nie jest to
    pojedyncze zdarzenie do przeoczenia, tylko fala zgłoszeń.

    Sprawdzić trzeba dwie rzeczy przed zmianą. Czy godziny logowania są
    w ogóle wyznaczone — bez nich zmiana nie robi nic. Oraz czy nie są
    wyznaczone na kontach usługowych, bo tam odcięcie sesji przerywa
    zadanie działające w nocy, a nie pracę człowieka.

    Zmiana nie dotyczy sesji pulpitu zdalnego ani logowania przy
    konsoli. Mowa wyłącznie o sesjach sieciowych do udziałów tej
    maszyny.

    Zmiana nie wymaga przerwy i wchodzi w życie przy najbliższym upływie
    godzin.
  en: |
    The change surely changes how people work wherever sign-in hours are set on the accounts, and
    takes a forewarning of them before it is brought in.

    I raised the class against the working station's pack for just that reason. At a station what
    was disconnected was a session that usually was not there. On a server what is disconnected
    are other people's sessions - of people working on files at that very moment.

    The sorest effect: a document opened from a share at the moment the hours pass is cut off
    from its source. The program holding it will report a fault in writing or a lost connection,
    and unsaved work may be lost. The symptom withal misleads, looking like a fault of the
    network rather than a rule at work - and so it is usually reported.

    The second effect is collective: the disconnecting comes at a fixed hour and so strikes at
    once all for whom that hour falls. It is no single happening to be overlooked but a wave of
    reports.

    Two things must be checked before the change. Whether sign-in hours are set at all - without
    them the change does nothing. And whether they are not set on service accounts, where the
    cutting of a session breaks a job working through the night rather than a person's work.

    The change does not bear on remote desktop sessions or on signing in at the console. What is
    spoken of are network sessions to this machine's shares alone.

    The change takes no break and comes into force at the nearest passing of the hours.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Dokument otwarty z udziału w chwili upływu godzin zostaje odcięty, a praca niezapisana może przepaść
      - Rozłączenie następuje o stałej godzinie, więc dotyka naraz wszystkich, którym ta godzina wypada
      - Objaw wygląda na awarię sieci, a nie na zadziałanie zasady, i tak bywa zgłaszany
      - Sesje pulpitu zdalnego i logowanie przy konsoli pozostają bez zmiany
    en:
      - A document opened from a share at the moment the hours pass is cut off and unsaved work may be lost
      - The disconnecting comes at a fixed hour and strikes at once all for whom that hour falls
      - The symptom looks like a fault of the network rather than a rule at work, and is so reported
      - Remote desktop sessions and signing in at the console stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Godziny logowania wyznaczono na kontach usługowych sięgających do udziałów tego serwera w nocy
      - Nie uprzedzono osób pracujących na plikach z tego serwera, że sesja zostanie przerwana o stałej godzinie
    en:
      - Sign-in hours were set on service accounts reaching for this server's shares through the night
      - The people working on files from this server were never forewarned that the session will be broken at a fixed hour
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'EnableForcedLogOff'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'EnableForcedLogOff'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableForcedLogOff' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-force-logoff-when-logon-hours-expire

notes:
  pl: |
    Punkt sam z siebie nie ogranicza niczyjego dostępu — egzekwuje
    ograniczenie wprowadzone na kontach. Na serwerze, na którym godzin
    logowania nie wyznaczono, jest spełniony i bez skutku jednocześnie.

    Klasę podniosłem względem paczki stanowiska roboczego do wymagającej
    świadomego wdrożenia. Na stanowisku rozłączana była sesja, której
    zwykle nie było; na serwerze rozłączane są sesje cudze, z otwartymi
    plikami.

    Czytaj razem z wymuszaniem wylogowania zapisanym w zasadach
    zabezpieczeń. Ten punkt dotyczy sesji sieciowych do udziałów tej
    maszyny, tamten — zasady na poziomie konta.
  en: |
    Of itself the item narrows nobody's access - it enforces a narrowing brought in on the
    accounts. On a server where sign-in hours were never set it is met and without effect at
    once.

    I raised the class against the working station's pack to one taking a knowing rollout. At a
    station what was disconnected was a session that usually was not there; on a server what is
    disconnected are other people's sessions, with files open.

    Read together with the forcing of a sign-out written in the security policy. This item bears
    on network sessions to this machine's shares, that one on the rule at the account's level.
