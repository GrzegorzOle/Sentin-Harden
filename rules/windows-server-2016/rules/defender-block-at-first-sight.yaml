id: win2016-defender-block-at-first-sight

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > MAPS
  title:
    pl: Wstrzymanie pliku do czasu oceny przy pierwszym napotkaniu
    en: A file held back until judged at its first meeting
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe wstrzymać plik nieznany do czasu, aż usługa zewnętrzna
    go oceni, zamiast przepuszczać go i pytać równolegle.

    Rzecz dotyczy kilku sekund i w tych kilku sekundach mieści się cała
    wartość punktu. Plik zupełnie nowy nie pasuje do żadnego wzorca
    i miejscowa ochrona nie ma podstaw, żeby go zatrzymać. Zapytanie do
    usługi trwa ułamek sekundy, ale odpowiedź czasem wymaga głębszego
    sprawdzenia — i wtedy pytanie brzmi, co robić w międzyczasie.

    Bez tego ustawienia odpowiedź brzmi: przepuścić. Plik zostaje
    uruchomiony, a orzeczenie przychodzi po fakcie. Jeżeli okaże się
    złośliwy, ochrona usunie go wtedy, gdy zdążył już wykonać to, po co
    przyszedł.

    Z ustawieniem odpowiedź brzmi: zaczekać. Wykonanie jest wstrzymane do
    czasu orzeczenia albo do upływu krótkiego czasu oczekiwania.

    Warunkiem działania jest dostęp do usługi zewnętrznej. Bez niej nie ma
    kogo pytać, wstrzymanie nie następuje i punkt nie daje nic — mimo że
    wpis jest ustawiony, a raport pokazuje zgodność.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: te kilka
    sekund między uruchomieniem pliku a jego oceną, czyli dokładnie tyle,
    ile potrzebuje narzędzie zbierające poświadczenia.
  en: |
    The setting has an unknown file held back until the outside service judges it,
    instead of letting it through and asking alongside.

    The matter concerns a few seconds, and in those few seconds sits the whole value
    of the item. A wholly new file matches no pattern, and the local protection has
    no grounds to stop it. A query to the service takes a fraction of a second, but
    the answer at times calls for a deeper check - and then the question is what to
    do meanwhile.

    Without this setting the answer reads: let it through. The file is run and the
    verdict comes after the fact. If it proves malicious, the protection will remove
    it when it has already done what it came for.

    With the setting the answer reads: wait. Execution is held back until the
    verdict, or until a short waiting time has passed.

    The condition of its working is access to the outside service. Without it there
    is nobody to ask, the holding back never happens and the item gives nothing -
    though the entry is set and the report shows compliance.

    What an attacker gains while the item goes unmet: those few seconds between a
    file being run and being judged, which is to say exactly as long as a tool
    gathering credentials needs.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy maszyna uruchamia
    pliki nowe w sposób wrażliwy na opóźnienie.

    Skutek zmiany jest zawsze ten sam i zawsze drobny: pierwsze uruchomienie
    pliku nieznanego trwa kilka sekund dłużej. Kolejne są już natychmiastowe,
    bo orzeczenie zostaje zapamiętane.

    Kłopot pojawia się tam, gdzie tych pierwszych uruchomień jest wiele
    naraz. Wdrożenie pakietu na wielu maszynach, kompilacja tworząca setki
    nowych plików wykonywalnych, narzędzie generujące i uruchamiające kod
    w locie — każde z nich mnoży to opóźnienie przez liczbę plików.

    Przypadek drugi to maszyna z łączem wolnym albo niestabilnym do usługi
    zewnętrznej. Oczekiwanie kończy się wtedy zawsze po upływie czasu, a nie
    po orzeczeniu, więc do stałego opóźnienia nie dochodzi żadna korzyść.

    Warto odnotować, że przy braku dostępu do usługi zewnętrznej punkt jest
    bezczynny — nie szkodzi, ale i nie działa. Uwaga o tym siedzi w poleceniu
    naprawczym, bo zgodność w raporcie znaczy wtedy mniej, niż wygląda.

    Czego to nie psuje: usług, logowania, uruchamiania plików już znanych,
    pracy aplikacji.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether the machine
    runs new files in a way sensitive to delay.

    The change's consequence is always the same and always small: the first running
    of an unknown file takes a few seconds longer. The next ones are immediate, the
    verdict having been remembered.

    The trouble appears where there are many such first runnings at once. The
    rollout of a package across many machines, a build making hundreds of new
    executables, a tool generating and running code on the fly - each of them
    multiplies that delay by the number of files.

    The second case is a machine with a slow or unstable link to the outside
    service. The waiting then always ends at the lapse of time rather than at a
    verdict, so no benefit comes to set against the steady delay.

    Worth noting that with no access to the outside service the item is idle - it
    does no harm, but neither does it work. The remark about that sits in the
    remedial command, since compliance in the report then means less than it looks
    to.

    What this does not break: services, signing in, the running of files already
    known, or the working of applications.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Pierwsze uruchomienie pliku nieznanego trwa kilka sekund dłużej, a przy wdrożeniu pakietu albo kompilacji opóźnienie mnoży się przez liczbę plików
      - Na łączu wolnym albo niestabilnym oczekiwanie kończy się zawsze po upływie czasu, a nie po orzeczeniu, więc zostaje samo opóźnienie
      - Bez dostępu do usługi zewnętrznej punkt jest bezczynny, mimo że wpis jest ustawiony, a raport pokazuje zgodność
      - Uruchamianie plików już znanych, usługi i praca aplikacji pozostają bez zmian
    en:
      - The first running of an unknown file takes a few seconds longer, and at a package rollout or a build the delay multiplies by the number of files
      - On a slow or unstable link the waiting always ends at the lapse of time rather than at a verdict, so the delay alone remains
      - With no access to the outside service the item is idle, though the entry is set and the report shows compliance
      - The running of files already known, services and the working of applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna buduje albo generuje setki nowych plików wykonywalnych i uruchamia je od razu
      - Segment nie przepuszcza ruchu do usługi zewnętrznej, więc punkt pozostanie bezczynny
      - Łącze do usługi zewnętrznej jest wolne albo niestabilne i oczekiwanie zawsze kończy się po upływie czasu
    en:
      - The machine builds or generates hundreds of new executables and runs them at once
      - The segment does not let traffic through to the outside service, so the item will stay idle
      - The link to the outside service is slow or unstable and the waiting always ends at the lapse of time
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableBlockAtFirstSeen) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    $name = 'DisableBlockAtFirstSeen'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Idle without the protection delivered from the outside service - there is
    # nobody to ask, so the holding back never happens and a green line in the
    # report says nothing.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableBlockAtFirstSeen' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-block-at-first-sight-microsoft-defender-antivirus

notes:
  pl: |
    Punkt nie działa samodzielnie i jest to jego najważniejsza cecha.
    Wymaga ochrony dostarczanej z usługi zewnętrznej — bez niej nie ma kogo
    pytać. Aplikacja powinna pokazywać obie reguły razem i mówić wprost, że
    zgodność tej bez tamtej jest zgodnością pozorną.

    Warto zwrócić uwagę, że punkt zmienia domyślną odpowiedź na pytanie
    o rzecz nieznaną. Bez niego systemem rządzi zasada „nieznane znaczy
    dozwolone", z nim „nieznane znaczy zaczekaj". Jest to zmiana filozofii,
    a nie ustawienia, i tak warto ją tłumaczyć.

    Koszt jest jednym z najlepiej ograniczonych w całym zestawie: kilka
    sekund, jednorazowo na plik. Wyjątkiem są maszyny generujące pliki
    wykonywalne masowo — i tam punkt bywa słusznie odpuszczany.
  en: |
    The item does not work on its own and that is its chief trait. It calls for the
    protection delivered from the outside service - without it there is nobody to
    ask. The application should show both rules together and say outright that
    compliance with this one without that one is compliance in appearance.

    Worth noticing that the item changes the default answer to the question about an
    unknown thing. Without it the system is ruled by "unknown means allowed"; with
    it by "unknown means wait". That is a change of philosophy rather than of a
    setting, and is worth explaining so.

    The cost is among the best bounded in the whole set: a few seconds, once per
    file. The exception are machines generating executables in bulk - and there the
    item is at times rightly let go.
