id: win2025-laps-password-expiration-protection

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > LAPS
  title:
    pl: Przedłużanie ważności hasła lokalnego administratora ponad zasadę zablokowane
    en: Prolonging the local administrator password's term beyond the policy blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Punkt blokuje możliwość ustawienia hasłu lokalnego administratora daty
    ważności późniejszej niż wynikająca z zasady. Bez niego datę tę można
    przesunąć w katalogu na dowolnie odległą.

    Kategoria wysoka i chcę nazwać, przed czym ta reguła właściwie broni,
    bo nie broni przed napastnikiem w pierwszej kolejności. Ona broni przed
    tym, żeby raport kłamał.

    Zestaw działa tak: jedna reguła ustala, że hasło ma być zmieniane co
    trzydzieści dni. Ta pilnuje, żeby tamtej nie dało się obejść przez
    przesunięcie daty. Bez niej maszyna z datą ważności ustawioną na kilka
    lat naprzód pozostaje zgodna z regułą o okresie ważności, bo wpis
    w rejestrze wciąż mówi trzydzieści. Zgodność jest wtedy prawdziwa
    formalnie i fałszywa co do rzeczy.

    Przesunięcie daty rzadko bywa złośliwe. Zwykle bierze się z wygody:
    ktoś prowadzi dłuższe prace i nie chce, żeby hasło zmieniło mu się
    w środku migracji; ktoś zapisał hasło w skrypcie i przedłużył je, żeby
    skrypt działał; dostawca poprosił o stałe hasło na czas wdrożenia.
    Żadna z tych osób nie miała złych zamiarów i każda zostawiła po sobie
    maszynę z hasłem niezmieniającym się od lat.

    Na serwerze to właśnie takie sytuacje są regułą, a nie wyjątkiem, bo
    prace na serwerach ciągną się tygodniami i prowadzą je często osoby
    z zewnątrz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszyny,
    na których hasło lokalnego administratora nie zmieniło się mimo zasady,
    i raport, który tego nie pokazuje.
  en: |
    The item blocks the ability to give the local administrator password an
    expiry date later than the policy implies. Without it that date can be
    pushed in the directory to any distance.

    The category is high, and I want to name what this rule actually
    defends against, because it does not defend against an attacker in the
    first place. It defends against the report lying.

    The pair works like this: one rule settles that the password is to be
    changed every thirty days. This one makes sure that rule cannot be got
    round by moving the date. Without it a machine with an expiry set
    several years ahead remains compliant with the rule on the term of
    validity, because the registry entry still says thirty. The compliance
    is then formally true and false as to the substance.

    Moving the date is rarely malicious. It usually comes from
    convenience: somebody is running longer works and does not want the
    password changing mid-migration; somebody wrote the password into a
    script and extended it so the script would keep working; a vendor asked
    for a fixed password for the duration of a deployment. None of those
    people meant any harm, and each left behind a machine whose password
    has not changed for years.

    On a server such situations are the rule rather than the exception,
    because work on servers drags on for weeks and is often done by people
    from outside.

    What an attacker gains while the item goes unmet: machines whose local
    administrator password has not changed despite the policy, and a report
    that does not show it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana nie dotyka niczego, co działa —
    ona odbiera możliwość zrobienia wyjątku, z której w prawidłowo
    prowadzonej maszynie nikt nie korzysta.

    Jedna rzecz jest warta powiedzenia wprost, bo wygląda jak skutek
    uboczny, a jest właściwym zamysłem: po tej zmianie potrzeba „nie
    zmieniaj hasła przez najbliższe trzy tygodnie" przestaje mieć ciche
    rozwiązanie. Prace, które takiego zamrożenia wymagają, trzeba
    poprowadzić inaczej — odczytując hasło na bieżąco zamiast raz na
    początku. To nie jest utrudnienie samo w sobie; to przeniesienie
    kosztu tam, gdzie go widać.

    Druga uwaga, powtarzana w całej tej grupie: bez włączonego mechanizmu
    hasła lokalnego administratora wpis istnieje i nie robi nic. A skutek
    tej konkretnej reguły widać dopiero wtedy, gdy ktoś spróbuje datę
    przesunąć — czyli może nie pojawić się nigdy i to jest stan pożądany.

    Bez restartu, bez wylogowania, cofa się natychmiast i wolno to
    zastosować hurtem.
  en: |
    The class is "no disruption". The change touches nothing that works -
    it takes away the ability to make an exception that nobody uses on a
    properly run machine.

    One thing is worth saying plainly, because it looks like a side effect
    and is the actual intent: after this change the need for "do not change
    the password for the next three weeks" stops having a quiet solution.
    Work that requires such a freeze has to be run differently - reading
    the password as it goes rather than once at the start. That is not a
    hindrance in itself; it moves the cost to where it can be seen.

    A second note, repeated across this group: without the local
    administrator password mechanism on, the entry exists and does nothing.
    And the effect of this particular rule shows only when somebody tries
    to move the date - so it may never show at all, and that is the desired
    state.

    No restart, no sign-out, undone immediately, and it may be applied in
    bulk.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Potrzeba „nie zmieniaj hasła przez najbliższe trzy tygodnie" przestaje mieć ciche rozwiązanie
      - Prace wymagające takiego zamrożenia trzeba poprowadzić inaczej, odczytując hasło na bieżąco zamiast raz na początku
      - Skutek widać dopiero wtedy, gdy ktoś spróbuje przesunąć datę ważności — a może to nie nastąpić nigdy
      - Bez włączonego mechanizmu hasła lokalnego administratora wpis istnieje i nie robi nic
    en:
      - The need for "do not change the password for the next three weeks" stops having a quiet solution
      - Work requiring such a freeze has to be run differently, reading the password as it goes rather than once at the start
      - The effect shows only when somebody tries to move the expiry date - which may never happen
      - Without the local administrator password mechanism on, the entry exists and does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Trwają prace, w których hasło lokalnego administratora zostało celowo zamrożone, i nie ustalono innego sposobu ich dokończenia
    en:
      - Work is under way in which the local administrator password was deliberately frozen and no other way of finishing it has been settled
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'PasswordExpirationProtectionEnabled'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    $current = (Get-ItemProperty -Path $path -Name 'PasswordExpirationProtectionEnabled' -ErrorAction SilentlyContinue).'PasswordExpirationProtectionEnabled'
    [pscustomobject]@{
      path        = $path
      name        = 'PasswordExpirationProtectionEnabled'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is what keeps the rule on the term of validity honest: without it a
    # machine whose expiry was pushed years ahead still reads as compliant,
    # because the registry entry still says thirty days.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpirationProtectionEnabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/identity/laps/laps-management-policy-settings

notes:
  pl: |
    Ta reguła nie broni w pierwszej kolejności przed napastnikiem — ona
    broni przed tym, żeby raport kłamał. Bez niej maszyna z datą ważności
    przesuniętą o kilka lat pozostaje zgodna z regułą o okresie ważności,
    bo wpis w rejestrze wciąż mówi trzydzieści.

    Przesunięcie daty rzadko bywa złośliwe: ktoś prowadzi migrację, ktoś
    wpisał hasło do skryptu, dostawca poprosił o stałe hasło na czas
    wdrożenia. Nikt nie miał złych zamiarów, a każdy zostawił maszynę
    z hasłem niezmieniającym się od lat.

    Na serwerze to reguła, nie wyjątek — prace ciągną się tygodniami
    i prowadzą je często osoby z zewnątrz.
  en: |
    This rule does not defend against an attacker in the first place - it
    defends against the report lying. Without it a machine whose expiry was
    pushed years ahead stays compliant with the rule on the term of
    validity, because the registry entry still says thirty.

    Moving the date is rarely malicious: somebody is running a migration,
    somebody wrote the password into a script, a vendor asked for a fixed
    password for a deployment. None of them meant any harm, and each left a
    machine whose password has not changed for years.

    On a server this is the rule rather than the exception - work drags on
    for weeks and is often done by people from outside.
