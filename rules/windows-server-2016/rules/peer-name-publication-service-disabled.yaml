id: win2016-peer-name-publication-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Publikowanie nazwy maszyny w sieci równorzędnej wyłączone
    en: Publishing the machine's name in peer networking switched off
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa ogłasza nazwę tej maszyny w sieci równorzędnej, żeby inne maszyny
    mogły ją znaleźć, nie znając jej adresu.

    Jest to strona nadawcza mechanizmu, którego stronę odbiorczą opisuje
    reguła sąsiednia. Tamta pozwala maszynie pytać i odpowiadać na pytania
    o adresy; ta sprawia, że maszyna sama z siebie mówi, że jest, i pod jaką
    nazwą.

    Wartość tego ogłoszenia dla napastnika jest skromna, ale nie żadna.
    Maszyna, która się ogłasza, trafia na listę celów bez żadnego wysiłku ze
    strony rozpoznającego — nie trzeba jej szukać, sama się zgłasza.
    Ogłoszenie niesie przy tym nazwę, a nazwa serwera w organizacji zwykle
    mówi o jego roli więcej, niż powinna mówić obcemu.

    Więcej znaczy tutaj zasada ogólna niż konkretne zagrożenie. Serwer nie
    ma powodu ogłaszać się w mechanizmie pomyślanym dla sieci domowych,
    a każde ogłoszenie, którego nikt nie potrzebuje, jest darmową
    informacją dla tego, kto słucha.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nazwę
    i obecność tej maszyny podane mu bez pytania, przez samą maszynę.
  en: |
    The service announces this machine's name in peer networking so that other machines
    may find it without knowing its address.

    It is the sending side of a mechanism whose receiving side the neighbouring rule
    describes. That one lets the machine ask and answer questions about addresses; this
    one makes the machine say of itself that it is there, and under what name.

    The worth of that announcement to an attacker is modest but not nil. A machine that
    announces itself lands on a list of targets with no effort on the part of the one
    reconnoitring - it need not be sought out, it reports itself. The announcement
    carries besides a name, and a server's name in an organisation as a rule says more
    of its role than it should say to a stranger.

    A general principle means more here than any particular threat. A server has no
    reason to announce itself in a mechanism thought up for home networks, and every
    announcement nobody needs is free information for whoever is listening.

    What an attacker gains while the item goes unmet: this machine's name and presence
    given to them unasked, by the machine itself.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wyłączenie dotyczy wyłącznie ogłaszania się. Maszyna przestaje mówić,
    że jest, ale nadal potrafi znaleźć inne, jeżeli usługa sąsiednia
    pozostaje włączona. Rozdzielenie to jest rzeczywiste i warto je
    pokazać, bo z nazw obu reguł nie wynika jasno, która robi co.

    Skutek w praktyce jest żaden. Serwer ogłaszający się w sieci
    równorzędnej nie robi tego dlatego, że coś tego wymaga, tylko dlatego,
    że usługa jest domyślnie włączona. Nie ma znanego zastosowania
    serwerowego, w którym to ogłoszenie byłoby potrzebne.

    Gdyby takie zastosowanie na maszynie było — aplikacja oczekująca, że
    inne stanowiska znajdą ją po nazwie równorzędnej — objawi się brakiem
    połączeń przychodzących, przy zachowaniu wychodzących. Jest to objaw
    niesymetryczny i akurat dlatego dobrze rozpoznawalny.

    Czego to nie psuje: rozpoznawania nazw w domenie i w sieci, połączeń
    wychodzących, udziałów, pulpitu zdalnego. Nie ma znanych regresji.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "no disruption".

    Switching it off concerns only the announcing. The machine stops saying it is there
    but can still find others, should the neighbouring service stay switched on. That
    parting is a real one and worth showing, since from the two rules' names it does not
    follow clearly which does what.

    The consequence in practice is none. A server announcing itself in peer networking
    does so not because anything calls for it but because the service is switched on by
    default. There is no known server use in which that announcement would be needed.

    Were such a use on the machine - an application expecting other positions to find it
    by a peer name - it will show as an absence of incoming connections, the outgoing
    ones being kept. It is a lopsided symptom and is well recognisable just for that.

    What this does not break: resolving names in the domain and on the network, outgoing
    connections, shares, or the remote desktop. There are no known regressions.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Aplikacja oczekująca, że inne stanowiska znajdą tę maszynę po nazwie równorzędnej, przestanie przyjmować połączenia przychodzące
      - Połączenia wychodzące pozostają sprawne, więc objaw jest niesymetryczny i przez to rozpoznawalny
      - Maszyna nadal potrafi znaleźć inne, jeżeli usługa sąsiednia pozostaje włączona
      - Rozpoznawanie nazw w domenie i w sieci, udziały i pulpit zdalny pozostają bez zmian
    en:
      - An application expecting other positions to find this machine by a peer name will stop taking in incoming connections
      - Outgoing connections stay sound, so the symptom is lopsided and recognisable for it
      - The machine can still find others, should the neighbouring service stay switched on
      - Resolving names in the domain and on the network, shares and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja na tej maszynie jest odnajdywana przez inne stanowiska po nazwie równorzędnej i nie skonfigurowano dla niej adresu
    en:
      - An application on this machine is found by other positions by a peer name and no address has been configured for it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPAutoReg'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'PNRPAutoReg' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the announcing of this machine stops. Resolving the names of others
    # belongs to the neighbouring service and is untouched here.
    Stop-Service -Name 'PNRPAutoReg' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPAutoReg' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'PNRPAutoReg' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Punkt jest w całej rodzinie najłatwiejszy i warto go pokazywać jako
    pierwszy do wykonania, choć merytorycznie nie jest pierwszy.

    Kategoria niska jest tu uczciwa. Ogłoszenie nazwy nie otwiera niczego
    i nie daje napastnikowi drogi — daje mu wiedzę, którą i tak zdobyłby
    inaczej, tylko wolniej. Jest to punkt z pola „zrób przy okazji",
    i aplikacja powinna go tam umieścić zamiast podnosić sztucznie.

    Para z regułą o rozpoznawaniu nazw jest tu wyraźna i asymetryczna
    w ocenie. Tamta jest średnia i wymaga sprawdzenia, bo dotyczy
    rozstrzygania; ta jest niska i idzie hurtem, bo dotyczy mówienia
    o sobie. Rozdzielenie ocen dla dwóch stron jednego mechanizmu jest
    zamierzone.
  en: |
    The item is the easiest in the whole family and is worth showing as the first to be
    carried out, though in substance it is not the first.

    The low category is honest here. Announcing a name opens nothing and gives an
    attacker no road - it gives them knowledge they would have got otherwise anyway,
    only more slowly. It is an item from the field "do it along the way", and the
    application should put it there rather than lift it artificially.

    The pair with the rule on name resolution is clear here and lopsided in its
    assessment. That one is medium and needs review, concerning as it does the settling
    of things; this one is low and goes in bulk, concerning the speaking of oneself.
    Parting the assessments for the two sides of one mechanism is intended.
