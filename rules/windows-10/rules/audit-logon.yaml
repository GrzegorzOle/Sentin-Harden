id: win10-audit-logon

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Logon/Logoff
  title:
    pl: Inspekcja logowania
    en: The audit of logging on
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza odnotowywanie każdego wejścia na tę maszynę — udanego
    i nieudanego — wraz z godziną, sposobem wejścia i adresem, z którego
    nastąpiło.

    Zdarzenie zalogowania jest budulcem, z którego składa się każde
    dochodzenie. Odpowiada na pytanie pierwsze i najczęściej zadawane: kto
    tu był i kiedy. Bez niego pozostałe zapisy wiszą w próżni, bo nie da się
    przypisać czynności do sesji ani sesji do człowieka.

    Ważny jest sposób wejścia, zapisywany razem ze zdarzeniem. Logowanie
    lokalne, przez sieć, przez pulpit zdalny, jako usługa albo jako zadanie
    to pięć różnych rzeczy, a z punktu widzenia dochodzenia różnią się
    bardziej niż same konta. Wejście sieciowe na konto, które nigdy nie
    pracowało zdalnie, jest sygnałem samym w sobie.

    Odnotowuję, że podkategoria jest jedyną w tym bloku, której wyłączenie
    czyni pozostałe bezużytecznymi. Reszta bloku dopisuje szczegóły do
    zdarzenia, którego bez tej reguły nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście na
    maszynę i pracę na niej niezostawiające zapisu wskazującego konto,
    porę ani drogę.
  en: |
    The setting switches on the setting down of every entry upon this machine - the successful and the failed
    alike - together with the hour, the manner of entry and the address it came from.

    The event of logging on is the stuff of which every inquiry is built. It answers the first and commonest
    question: who was here and when. Without it the other records hang in a void, no act being fit to be laid
    against a session nor a session against a person.

    What matters is the manner of entry, written down along with the event. Logging on locally, over the
    network, by remote desktop, as a service or as a task are five different things, and from an inquiry's
    standpoint they differ more than the accounts do. A network entry upon an account that never worked remotely
    is a sign in itself.

    I set down that the subcategory is the only one in this block whose switching off makes the rest useless.
    The remainder of the block writes details against an event that without this rule is not there.

    What an attacker gains while the item goes unmet: an entry upon the machine, and work upon it, leaving no
    record naming the account, the hour or the road.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest pojemność
    dziennika, nie praca maszyny.

    Ustawienie niczego nie zabrania. Nikt się przez nie nie zaloguje inaczej
    niż dotąd i nikt niczego nie zobaczy.

    Sprawdzić trzeba rozmiar dziennika zabezpieczeń. Jest to podkategoria
    najgłośniejsza z całego bloku: zapisuje każde wejście, a maszyna
    w domenie ma ich w ciągu dnia więcej, niż widać gołym okiem — logują
    się usługi, zadania i połączenia do udziałów, nie tylko ludzie. Dziennik
    o rozmiarze domyślnym zapełnia się wtedy w kilka dni.

    Skutek przepełnienia jest przewrotny: wypadają wpisy najstarsze, czyli
    początek zdarzenia, którego się szuka. Dziennik zostaje pełny i zgodny,
    a odpowiedzi w nim nie ma.

    Zwiększenie dziennika albo zbieranie zdarzeń poza maszynę wykonuje się
    przed włączeniem inspekcji, nie po.

    Czego to nie psuje: logowania, uwierzytelniania, kont domenowych,
    udziałów plikowych, drukowania, aplikacji.
  en: |
    The class is "needs review", and the object of the review is the log's room, not the machine's working.

    The setting forbids nothing. Nobody will log on by it otherwise than before, and nobody will see a thing.

    What has to be reviewed is the size of the security log. It is the loudest subcategory in the whole block:
    it writes down every entry, and a machine in a domain has more of them in a day than meets the eye - services
    log on, and tasks, and connections to shares, not people alone. A log of its default size then fills within
    a few days.

    The consequence of an overflow is a perverse one: the oldest entries fall out, which is to say the beginning
    of the very happening being sought. The log stays full and compliant, and the answer is not in it.

    The enlarging of the log, or the gathering of events away from the machine, is done before the audit is
    switched on, not after.

    What this does not break: logging on, authentication, domain accounts, file shares, printing, or
    applications.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Dziennik zabezpieczeń o rozmiarze domyślnym zapełnia się w kilka dni, bo jest to najgłośniejsza podkategoria bloku
      - Wypadają wpisy najstarsze, czyli początek zdarzenia, którego się szuka, a dziennik zostaje pełny i zgodny
      - Zwiększenie dziennika albo zbieranie zdarzeń poza maszynę trzeba wykonać przed włączeniem inspekcji
      - Ustawienie niczego nie zabrania i nikt nie zaloguje się inaczej niż dotąd
      - Uwierzytelnianie, konta domenowe, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A security log of its default size fills within a few days, this being the loudest subcategory of the block
      - The oldest entries fall out - the beginning of the very happening being sought - while the log stays full and compliant
      - The log has to be enlarged, or events gathered away from the machine, before the audit is switched on
      - The setting forbids nothing and nobody will log on otherwise than before
      - Authentication, domain accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma rozmiar domyślny, a maszyna pracuje w domenie i wejść jest w ciągu dnia wiele
      - Nie ma kto przejrzeć zapisu ani nie jest on zbierany poza maszynę
    en:
      - The security log is of its default size while the machine works in a domain and entries in a day are many
      - There is nobody to look the record over, nor is it gathered away from the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9215-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9215-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9215-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. Failures alone show an attempt; successes beside
    # them show which attempt ended in a session.
    auditpol /set /subcategory:"{0CCE9215-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9215-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-logon

notes:
  pl: |
    Reguła otwiera blok o logowaniu i jest w nim jedyną, bez której
    pozostałe tracą sens. Warto, żeby aplikacja pokazała tę zależność, bo
    użytkownik oceniający reguły pojedynczo może włączyć przynależność do
    grup przy wyłączonym logowaniu i nie dostać nic.

    Odnotowuję powód, dla którego jest to jedyna reguła bloku w klasie
    wymagającej sprawdzenia, mimo że niczego nie zabrania. Kosztem nie jest
    tu skutek dla człowieka, tylko pojemność dziennika — a przepełnienie
    jest zawodem najgorszego rodzaju, bo maszyna wygląda wtedy na zgodną
    i traci dokładnie to, czego się od niej oczekuje.

    Warto, żeby aplikacja przy tej regule zapytała o rozmiar dziennika
    i o to, czy zdarzenia są zbierane poza maszynę. Bez tej drugiej
    czynności punkt daje zgodność w raporcie, a nie zdolność odpowiedzenia
    na pytanie.
  en: |
    The rule opens the block about logging on and is the only one in it without which the rest lose their sense.
    It is well that the application show that tie, a user weighing the rules one by one being able to switch on
    group membership while logging on is off, and get nothing.

    I set down the reason it is the block's only rule in the class that needs review, though it forbids nothing.
    The cost here is not a consequence to a person but the log's room - and an overflow is a letting down of the
    worst kind, the machine then looking compliant and losing just what is looked for from it.

    It is well that the application ask, at this rule, after the log's size and after whether events are gathered
    away from the machine. Without that second act the item gives compliance in a report and not the power to
    answer a question.
