id: win11-defender-file-hash-computation

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus > MpEngine
  title:
    pl: Wyliczanie sumy kontrolnej plików włączone
    en: Computation of a file checksum switched on
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe ochronie wyliczać dla sprawdzanych plików sumę kontrolną —
    krótki ciąg wyprowadzony z całej zawartości pliku, jednoznacznie ją
    opisujący.

    Wartość tego bierze się z tego, co taką sumą można zrobić, i warto to
    opisać, bo samo wyliczanie brzmi jak szczegół techniczny. Suma kontrolna
    jest nazwą pliku niezależną od jego nazwy. Pozwala rozpoznać, że plik
    widziany tutaj jest tym samym plikiem, który widziano gdzie indziej,
    choćby nazywał się inaczej, leżał w innym katalogu i miał inną datę.

    Co daje jej włączenie w praktyce. Po pierwsze, wskazanie pliku
    w zestawieniach opisujących znane zagrożenia — te opisują pliki właśnie
    sumami, nie nazwami. Po drugie, możliwość zablokowania konkretnego pliku
    w całej organizacji jedną regułą, niezależnie od tego, pod jaką nazwą
    krąży. Po trzecie, sensowne prowadzenie dochodzenia po incydencie: bez
    sumy nie da się odpowiedzieć na pytanie, czy ten sam plik był wcześniej
    na innej maszynie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: rozmycie
    tożsamości plików, które wprowadza. Ten sam plik pod dziesięcioma nazwami
    na dziesięciu maszynach wygląda jak dziesięć osobnych zdarzeń, a nie jak
    jedna kampania.

    Punkt nie blokuje niczego sam z siebie. Dostarcza materiału, dzięki
    któremu blokowanie i rozpoznawanie ma się o co oprzeć — stąd kategoria
    średnia, a nie wyższa.
  en: |
    The setting has the protection compute for the files it checks a checksum - a short
    string derived from the whole content of a file and describing it uniquely.

    The worth of that comes from what can be done with such a sum, and it is worth
    describing, since the computing alone sounds like a technical detail. A checksum is a
    file's name independent of its name. It allows the recognition that a file seen here
    is the same file that was seen elsewhere, though it be called otherwise, lie in
    another directory and carry another date.

    What switching it on gives in practice. First, the naming of a file in lists
    describing known threats - those describe files by sums, not by names. Second, the
    means of blocking a particular file across a whole organisation with one rule,
    whatever name it circulates under. Third, the sensible conduct of an inquiry after an
    incident: without a sum the question whether the same file was earlier on another
    machine cannot be answered.

    What an attacker gains while the item goes unmet: a blurring of the identity of the
    files they bring in. The same file under ten names on ten machines looks like ten
    separate events rather than one campaign.

    The item blocks nothing of itself. It supplies the material on which blocking and
    recognition have something to rest - hence the medium category rather than a higher
    one.

disruption_description:
  pl: |
    Sprawdzenia wymaga wydajność, bo to jedyny wymiar, w którym zmiana jest
    odczuwalna.

    Wyliczenie sumy kontrolnej wymaga przeczytania całego pliku. Przy plikach
    zwykłej wielkości jest to koszt pomijalny; przy bardzo dużych — obrazach
    maszyn wirtualnych, archiwach, zbiorach danych — dochodzi do czasu
    sprawdzenia czas przeczytania całości.

    Odczuwalne jest to przede wszystkim przy pierwszym pełnym sprawdzeniu
    dysku i przy operacjach, w których dużo plików trafia na maszynę naraz.
    W pracy codziennej różnica bywa niezauważalna.

    Na maszynach z dyskiem talerzowym warto to sprawdzić uważniej niż na
    maszynach z dyskiem półprzewodnikowym, bo tam czas czytania całych plików
    jest wielokrotnie dłuższy.

    Żadna funkcja nie przestaje działać. Zmiana nie wymaga restartu.
  en: |
    Performance needs checking, since it is the only dimension in which the change is
    felt.

    Computing a checksum takes reading the whole file. With files of ordinary size that
    cost is negligible; with very large ones - virtual machine images, archives, data sets
    - the time of reading the whole is added to the time of checking.

    It is felt above all at the first full check of a disk and in operations where many
    files reach the machine at once. In everyday work the difference is sometimes
    unnoticeable.

    On machines with a spinning disk this is worth checking more closely than on machines
    with a solid-state one, since there the time of reading whole files is many times
    longer.

    No function stops working. The change takes no restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Sprawdzanie plików trwa dłużej, bo wymaga przeczytania całej zawartości
      - Pierwsze pełne sprawdzenie dysku jest wyraźnie dłuższe, zwłaszcza na dysku talerzowym
      - Operacje przenoszące wiele plików naraz obciążają maszynę mocniej
      - Żadna funkcja systemu ani aplikacja nie przestaje działać
    en:
      - Checking files takes longer, since it takes reading the whole content
      - The first full check of a disk is markedly longer, especially on a spinning disk
      - Operations moving many files at once load the machine more heavily
      - No function of the system and no application stops working
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje na dysku talerzowym i obsługuje bardzo duże pliki w czasie krytycznym
    en:
      - The machine works on a spinning disk and handles very large files under time pressure
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableFileHashComputation'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    $current = (Get-ItemProperty -Path $path -Name 'EnableFileHashComputation' -ErrorAction SilentlyContinue).'EnableFileHashComputation'
    [pscustomobject]@{
      path        = $path
      name        = 'EnableFileHashComputation'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFileHashComputation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Jest to reguła, której wartość ujawnia się dopiero po incydencie i warto
    to powiedzieć wprost. Na maszynie, na której nic się nie dzieje, nie widać
    po niej niczego poza kosztem. Materiał, który dostarcza, przydaje się
    w chwili, gdy trzeba odpowiedzieć, skąd plik się wziął i gdzie jeszcze
    jest — a wtedy albo się go ma, albo nie, bo wstecz wyliczyć się go nie da.

    Punkt jest zaliczony do poziomu drugiego i przy maszynie obciążonej
    obsługą dużych plików jest sensownym kandydatem do świadomego odpuszczenia.
    Decyzja powinna wtedy trafić do raportu razem z uzasadnieniem, bo dotyczy
    możliwości prowadzenia dochodzenia, a nie samej wydajności.

    Brak wartości nie jest stanem zgodnym — domyślnie wyliczanie bywa
    wyłączone.
  en: |
    This is a rule whose worth shows only after an incident, and that is worth saying
    outright. On a machine where nothing happens nothing is seen of it but the cost. The
    material it supplies serves at the moment when the question where a file came from and
    where else it is has to be answered - and then one either has it or not, since it
    cannot be computed backwards.

    The item is counted at the second level, and on a machine loaded with handling large
    files it is a sensible candidate for a conscious letting-go. The decision should then
    go into the report together with its grounds, since it concerns the ability to conduct
    an inquiry rather than performance alone.

    A missing value is not a compliant state - by default the computation is sometimes
    switched off.
