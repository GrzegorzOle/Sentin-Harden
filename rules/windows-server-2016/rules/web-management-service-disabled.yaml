id: win2016-web-management-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zdalnego zarządzania serwerem sieciowym wyłączona
    en: The service for remote management of the web server disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala zarządzać serwerem sieciowym tej maszyny z innej maszyny,
    przez własny port, bez logowania się na nią.

    Jest to w tej czwórce jedyny składnik, który sam z siebie nasłuchuje
    na porcie przeznaczonym do zarządzania. Pozostałe trzy obsługują ruch
    zwykły albo pracują wewnątrz maszyny; ta czeka na połączenie
    administracyjne z sieci.

    Rzecz wymagająca uwagi dotyczy tego, kto może się tym portem posłużyć.
    Usługa pozwala nadać prawo zarządzania witryną kontom spoza
    administratorów maszyny, także kontom, które nigdzie indziej w systemie
    nie mają żadnych uprawnień. Pomyślane było to dla hostingu, gdzie
    właściciel witryny nie jest właścicielem serwera. W organizacji daje to
    konto, które potrafi zmienić sposób obsługi żądań, nie będąc niczyim
    administratorem.

    Sam port jest przy tym osobnym przedmiotem troski. Nie stoi za nim
    żadna z warstw, które chronią zwykły ruch, a wystawiony jest z tego
    samego adresu, z którego maszyna publikuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: port
    zarządzania serwerem sieciowym osiągalny z sieci, z drogą nadania praw
    kontu, które w systemie nie jest administratorem.
  en: |
    The service lets this machine's web server be managed from another machine, over a
    port of its own, without signing in to it.

    It is the only component of the four that listens of itself on a port meant for
    management. The other three serve ordinary traffic or work inside the machine; this
    one waits for an administrative connection from the network.

    The matter calling for attention concerns who may use that port. The service allows
    the right to manage a site to be granted to accounts outside the machine's
    administrators, including accounts holding no permissions anywhere else in the
    system. It was thought up for hosting, where a site's owner is not the server's
    owner. In an organisation it gives an account able to change the way requests are
    served while being nobody's administrator.

    The port itself is besides a separate object of concern. Behind it stands none of the
    layers that guard ordinary traffic, and it is exposed from the same address from which
    the machine publishes.

    What an attacker gains while the item goes unmet: a web server management port
    reachable from the network, with a road of granting rights to an account that is no
    administrator in the system.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, kto zarządza witrynami
    na tej maszynie i skąd.

    Jeżeli robi to ktoś, kto loguje się na maszynę i otwiera konsolę na
    miejscu, wdrożenie nie zmienia nic. Konsola lokalna nie korzysta z tej
    usługi.

    Jeżeli natomiast witrynami zarządza się zdalnie — z konsoli na innej
    maszynie albo z narzędzia wdrożeniowego — wdrożenie odbiera tę drogę
    w całości. Objaw jest natychmiastowy i jednoznaczny: konsola nie
    nawiązuje połączenia.

    Osobny przypadek dotyczy wdrażania aplikacji sieciowych. Część
    narzędzi przenoszących witrynę na serwer korzysta właśnie z tej usługi
    i traci z nią kontakt. Objawem jest nieudane wdrożenie, zwykle
    w połowie, co bywa gorsze niż wdrożenie, które w ogóle nie ruszyło.

    Rzecz wart sprawdzenia przy okazji: usługa ta bywa zainstalowana,
    a nieużywana. Rola serwera sieciowego dokłada ją domyślnie, a korzysta
    z niej tylko ten, kto świadomie włączył zarządzanie zdalne w konsoli.
    Maszyna, na której nikt tego nie włączył, ma usługę gotową i nasłuch
    wyłączony — i wdrożenie jest tam czystym zyskiem.

    Czego to nie psuje: obsługi witryn, publikowania stron, konsoli
    lokalnej, zarządzania zdalnego mechanizmem powłoki, udziałów.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is who manages the sites on
    this machine, and from where.

    If it is somebody who signs in to the machine and opens the console on the spot, the
    rollout changes nothing. The local console does not use this service.

    If, on the other hand, the sites are managed from afar - from a console on another
    machine or from a deployment tool - the rollout takes that road away entirely. The
    symptom is immediate and unambiguous: the console does not make a connection.

    A separate case concerns the deployment of web applications. Some tools carrying a
    site onto a server use just this service and lose touch with it. The symptom is a
    failed deployment, as a rule half done, which is at times worse than one that never
    started.

    A thing worth checking along the way: the service is at times installed and unused.
    The web server role adds it by default, and only somebody who knowingly switched
    remote management on in the console uses it. A machine where nobody switched it on has
    the service ready and the listening off - and the rollout there is pure gain.

    What this does not break: the serving of sites, the publishing of pages, the local
    console, remote management by the shell mechanism, or shares.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Konsola zarządzania witrynami uruchamiana na innej maszynie przestaje nawiązywać połączenie
      - Narzędzia wdrażające aplikacje sieciowe tą drogą kończą wdrożenie niepowodzeniem, zwykle w połowie
      - Usługa bywa zainstalowana, a nieużywana - wtedy nasłuch jest wyłączony i wdrożenie nie odbiera niczego
      - Obsługa witryn, konsola lokalna i zarządzanie zdalne mechanizmem powłoki pozostają bez zmian
    en:
      - A site management console run on another machine stops making a connection
      - Tools deploying web applications by this road end their deployment in failure, as a rule half done
      - The service is at times installed and unused - the listening is then off and the rollout takes nothing away
      - The serving of sites, the local console and remote management by the shell mechanism stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Witrynami na tej maszynie zarządza się zdalnie z konsoli uruchamianej na innej maszynie
      - Aplikacje sieciowe są wdrażane na tę maszynę narzędziem korzystającym z tej usługi
    en:
      - Sites on this machine are managed from afar, from a console run on another machine
      - Web applications are deployed onto this machine by a tool using this service
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'WMSvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This is the one of the four that answers on a port of its own. Check who
    # manages the sites from outside before running.
    Stop-Service -Name 'WMSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'WMSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/manage/remote-administration/remote-administration-for-iis-manager

notes:
  pl: |
    Punkt jest w czwórce jedyny z klasą lżejszą niż świadome wdrożenie i to
    zestawienie warto wytłumaczyć. Nie dlatego, że jest mniej ważny — tylko
    dlatego, że jego skutek jest natychmiastowy, jednoznaczny i dotyczy
    jednej rzeczy, a nie wszystkiego naraz.

    Rozdzielenie kont zarządzających witryną od administratorów maszyny
    jest tu rzeczą wartą osobnego zdania w interfejsie. Jest to mechanizm
    pomyślany dobrze i do innego zastosowania — nadanie komuś władzy nad
    jedną witryną bez władzy nad serwerem ma sens w hostingu i nie ma go
    prawie nigdzie indziej. Reguła nie zwalcza tego mechanizmu, tylko
    zdejmuje go z maszyny, która hostingiem nie jest.

    Przypadek usługi zainstalowanej, a nieużywanej, warto pokazywać jako
    osobny wynik. Audyt zgłosi wtedy niezgodność, a rzeczywisty stan jest
    bezpieczny — nasłuch nie działa. Nie jest to fałszywy alarm, bo usługa
    gotowa do uruchomienia jest czymś innym niż usługa wyłączona, ale
    wielkość skutku jest tam inna i warto o tym powiedzieć.
  en: |
    The item is the only one of the four with a class lighter than a planned rollout, and
    that pairing is worth explaining. Not because it matters less - only because its
    consequence is immediate, unambiguous and touches one thing rather than everything at
    once.

    The parting of accounts managing a site from the machine's administrators is here
    worth a sentence of its own in the interface. It is a mechanism well thought out and
    for another use - granting somebody power over one site without power over the server
    makes sense in hosting and almost nowhere else. The rule does not fight that
    mechanism, it merely takes it off a machine that is not a hosting one.

    The case of a service installed and unused is worth showing as a separate outcome. The
    audit will then report a non-compliance while the state in fact is a safe one - the
    listening does not work. It is no false alarm, a service ready to be started being
    something other than a service switched off, but the size of the consequence is there
    another and that is worth saying.
