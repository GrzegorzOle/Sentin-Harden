id: win2016-lm-hash-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przechowywanie skrótu LAN Manager wyłączone
    en: Storage of the LAN Manager hash switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza zapisywanie skrótu hasła wyliczanego mechanizmem
    z lat osiemdziesiątych przy najbliższej zmianie hasła każdego konta.

    Kategoria krytyczna i chcę wyjaśnić, dlaczego ten konkretny skrót jest
    czymś innym niż skrót zwykły. Mechanizm dzieli hasło na dwie połowy po
    siedem znaków, każdą przetwarza osobno i przed przetworzeniem zamienia
    wszystkie litery na wielkie. Skutek jest taki, że hasło czternastoznakowe
    nie jest jednym hasłem trudnym, tylko dwoma łatwymi — a wielkość liter
    przestaje cokolwiek znaczyć.

    Praktycznie oznacza to, że takie hasło łamie się w czasie liczonym
    w minutach, niezależnie od tego, jak zostało zbudowane. Wszystkie zasady
    dotyczące długości i złożoności przestają mieć znaczenie, bo nie chronią
    przed mechanizmem, który sam odbiera im skutek.

    Na serwerze 2016 ten punkt zasługuje na uwagę szczególną. To jest wydanie
    stare na tyle, że mogło zostać podniesione z instalacji jeszcze
    starszej, a skróty tego rodzaju przeżywają aktualizacje systemu. Maszyna
    może nie wyliczać ich od lat, a mimo to mieć je zapisane.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła kont
    z tej maszyny w czasie, który nie stanowi żadnej przeszkody — nawet gdy
    hasła są długie i złożone.
  en: |
    The item stops the storing of a password hash computed by a mechanism from
    the nineteen-eighties, from each account's next password change onwards.

    The category is critical, and I want to explain why this particular hash is
    a different thing from an ordinary one. The mechanism splits the password
    into two halves of seven characters, processes each separately, and before
    processing turns every letter into a capital. The effect is that a
    fourteen-character password is not one hard password but two easy ones -
    and letter case stops meaning anything.

    In practice that means such a password is broken in a time counted in
    minutes, regardless of how it was built. Every policy about length and
    complexity stops mattering, because none of them protects against a
    mechanism that strips their effect itself.

    On Server 2016 this item deserves particular attention. This is a release
    old enough to have been raised from an installation older still, and hashes
    of this kind survive system upgrades. The machine may not have computed one
    for years and still have them stored.

    What an attacker gains while the item goes unmet: the passwords of this
    machine's accounts in a time that is no obstacle at all - even where those
    passwords are long and complex.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć w codziennej pracy nie widać tego wcale.
    Sprawdzenie dotyczy jednej rzeczy: czy coś na tej maszynie uwierzytelnia
    się mechanizmem sprzed lat.

    Jeżeli tak, po zmianie hasła takiego konta uwierzytelnienie przestanie
    działać, bo skrót potrzebny do niego nie zostanie już wyliczony. Typowe
    przypadki to bardzo stare urządzenia sieciowe, systemy wbudowane oraz
    oprogramowanie, które nigdy nie doczekało się nowszej wersji.

    Ważna rzecz dotycząca kolejności: reguła nie usuwa skrótów już zapisanych
    i nie udaje, że to robi. Wyłącza ich wyliczanie przy kolejnej zmianie
    hasła. Dopóki hasła nie zostaną zmienione, materiał pozostaje w bazie
    kont — dlatego po zastosowaniu reguły należy wymusić zmianę haseł, zamiast
    uznać sprawę za zamkniętą.

    To jest również powód, dla którego cofnięcie zmiany jest trudne. Samo
    przywrócenie wartości niczego nie odtworzy; skróty powstaną ponownie
    dopiero przy kolejnej zmianie haseł.

    Czego to nie psuje: uwierzytelniania domenowego, logowania zwykłego,
    udostępniania plików nowszą wersją protokołu ani kont usługowych, dopóki
    korzystają z mechanizmów współczesnych.

    Bez restartu, ale odwrócenie jest trudne.
  en: |
    The class is "needs review", although nothing of it is visible in daily
    work. The review is about one thing: whether anything on this machine
    authenticates with the mechanism from years ago.

    If it does, then after such an account's password is changed the
    authentication will stop working, because the hash it needs will no longer
    be computed. The usual cases are very old network devices, embedded systems
    and software that never saw a newer version.

    An important point about order: the rule does not remove hashes already
    stored and does not pretend to. It switches off their computation at the
    next password change. Until the passwords are changed, the material stays
    in the account database - so after applying the rule the passwords should be
    forced to change rather than the matter being treated as closed.

    That is also why undoing the change is difficult. Restoring the value alone
    recreates nothing; the hashes will appear again only at the next password
    change.

    What this does not break: domain authentication, ordinary signing in, file
    sharing over a newer version of the protocol, or service accounts, as long
    as they use present-day mechanisms.

    No restart, but undoing it is difficult.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Uwierzytelnianie mechanizmem sprzed lat przestaje działać po pierwszej zmianie hasła danego konta
      - Bardzo stare urządzenia sieciowe i systemy wbudowane tracą możliwość zalogowania się
      - Skróty już zapisane nie znikają, dopóki hasła nie zostaną zmienione, więc samo zastosowanie reguły nie kończy sprawy
      - Cofnięcie zmiany nie odtwarza skrótów natychmiast, bo te powstają dopiero przy kolejnej zmianie hasła
    en:
      - Authentication by the mechanism from years ago stops working after the first password change on that account
      - Very old network devices and embedded systems lose the ability to sign in
      - Hashes already stored do not go until the passwords are changed, so applying the rule does not close the matter
      - Undoing the change does not restore the hashes at once, since they appear only at the next password change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie uwierzytelnia się urządzenie lub oprogramowanie wymagające skrótu wyliczanego mechanizmem sprzed lat
    en:
      - A device or software that requires the hash computed by the old mechanism authenticates on this machine
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'NoLMHash'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'NoLMHash'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change bites at the next password change of each account, not now.
    # Hashes already stored stay until then - force a password change afterwards
    # rather than treating the matter as closed.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'NoLMHash' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-do-not-store-lan-manager-hash-value-on-next-password-change

notes:
  pl: |
    Hasło piętnastoznakowe i dłuższe nie daje się zapisać tym mechanizmem
    w ogóle. To jest ta sama granica, o której piszę przy najmniejszej
    długości hasła — i jedyny przypadek, w którym jeden dodatkowy znak zmienia
    nie tyle koszt złamania, ile samą możliwość zapisu.

    Odwracalność oznaczona jako trudna nie dotyczy wartości w rejestrze, którą
    da się przywrócić od razu. Dotyczy skutku: skróty nie wracają wraz z nią,
    tylko przy kolejnej zmianie haseł.

    Punkt tworzy parę z poziomem uwierzytelniania menedżera sieci. Ten wpis
    decyduje, czy skrót jest przechowywany; tamten, czy wolno go użyć w sieci.
    Zamknięcie obu spraw wymaga obu reguł.
  en: |
    A password of fifteen characters or more cannot be stored by this mechanism
    at all. That is the same boundary I write about under the smallest password
    length - and the one case where a single extra character changes not so
    much the cost of breaking as the very possibility of storage.

    Reversibility marked as difficult does not refer to the registry value,
    which can be restored at once. It refers to the effect: the hashes do not
    come back with it, only at the next password change.

    The item forms a pair with the network manager authentication level. This
    entry decides whether the hash is stored; that one whether it may be used on
    the network. Closing both matters takes both rules.
