id: win2025-firewall-logging-successful-connections

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Logging
  title:
    pl: Rejestrowanie nawiązanych połączeń we wszystkich profilach
    en: Logging of successful connections in all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza rejestrowanie połączeń, które zapora przepuściła,
    we wszystkich trzech profilach sieciowych.

    Zostawiam kategorię średnią i robię to świadomie, bo kusi, żeby dać
    wyżej. Rejestrowanie niczego nie blokuje. Zgodnie z przyjętą tu skalą
    kategoria średnia to utwardzenie zwiększające wykrywalność, i tym
    dokładnie ten punkt jest. Nie podnoszę go z tego samego powodu,
    dla którego nie podniosłem punktu o zbieraniu dzienników: mechanizm
    obronny opisuję tym, czym jest, a nie tym, jak bardzo go cenię.

    Wartość na serwerze jest natomiast większa niż na stacji roboczej
    i warto powiedzieć, na czym polega. Zapora domyślnie zapisuje tylko
    to, co odrzuciła. Zapis odrzuceń mówi, kto pukał i został odprawiony
    — czyli opisuje ruch, który i tak nie doszedł do skutku. Zapis
    połączeń przepuszczonych mówi coś zupełnie innego: kto faktycznie
    rozmawiał z tą maszyną. Na serwerze, który z definicji przyjmuje
    połączenia, jest to jedyny miejscowy zapis odpowiadający na pytanie
    „skąd przyszło to, co się tu wydarzyło".

    Drugi pożytek jest mniej oczywisty i dotyczy ruchu wychodzącego.
    Serwer nawiązuje połączenia sam — do usług aktualizacji, do baz,
    do integracji. Zapis połączeń przepuszczonych jest miejscem, w którym
    widać połączenie wychodzące, którego nikt nie zaplanował.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: brak
    miejscowego śladu, że w ogóle rozmawiał z tą maszyną — zostają tylko
    zapisy o próbach odrzuconych, czyli o wszystkich poza tą, która się
    powiodła.
  en: |
    The item switches on the writing down of the bindings the wall of fire let through, in all three
    kinds of net-standing.

    I leave the category middling and do so wittingly, it tempting one to set it higher. The writing
    down blocks nothing. By the scale taken here a middling category is a hardening that heightens the
    finding out, and that is just what this item is. I raise it not for the same ground whereby I
    raised not the item upon the gathering of logs - a warding working I tell of by what it is and not
    by how highly I hold it.

    The worth upon a server is greater than upon a workstation for all that, and it is worth saying
    wherein it lies. The wall of fire by default writes down only what it turned away. The writing of
    turnings-away says who knocked and was sent off - that is, it tells of traffic that came to nothing
    in any case. The writing of bindings let through says a wholly other thing - who truly spoke with
    that machine. Upon a server, which by its nature takes bindings in, it is the one writing upon the
    spot that answers the question "whence came the thing that befell here".

    The second good is less plain and bears upon the traffic going out. A server sets up bindings of
    itself - to the workings of mending, to hoards of data, to knittings-together. The writing of
    bindings let through is the stead wherein a binding going out that nobody planned is seen.

    What an attacker gains while the item goes unmet - a want of any trace upon the spot that they
    spoke with that machine at all; there are left only the writings upon tries turned away, that is,
    upon all but the one that sped.

disruption_description:
  pl: |
    Podnoszę klasę wobec oceny dla stacji roboczej do „wymaga świadomego
    wdrożenia" i powód jest wyłącznie ilościowy, ale dlatego rozstrzygający.

    Stacja robocza nawiązuje kilkaset połączeń dziennie. Serwer plików,
    serwer bazy danych albo kontroler domeny przyjmuje ich tyle w ciągu
    minuty. Włączenie zapisu połączeń przepuszczonych znaczy na takiej
    maszynie strumień zapisu idący nieustannie na wolumin systemowy,
    o objętości, której nikt przed zmianą nie oszacował.

    Skutek jest podwójny i oba jego składniki są przykre. Po pierwsze,
    plik dziennika zapory ma własny, osobno ustawiany rozmiar i przy
    domyślnej wartości na serwerze zawija się w minutach — czyli
    zapisujemy ogromny strumień po to, żeby nie mieć z niego nic.
    Po drugie, jest to stały zapis na dysk systemowy, który na maszynie
    wirtualnej dzieli nośnik z innymi maszynami i którego nie widać
    w żadnym mierniku aplikacji.

    Dlatego kolejność jest tutaj odwrotna niż zwykle: najpierw ustala się
    rozmiar i położenie pliku dziennika zapory oraz sprawdza zapas na
    woluminie, a dopiero potem włącza się zapis. Zastosowanie tego punktu
    samego, bez tamtych dwóch rozstrzygnięć, daje zgodność w raporcie
    i bezużyteczny dziennik na maszynie.

    Zmiana nie wymaga przerwy i cofa się natychmiast, co jest tu ważne:
    jeżeli po włączeniu okaże się, że objętość jest nie do przyjęcia,
    wycofanie trwa tyle co samo włączenie.
  en: |
    I raise the class against the reckoning for a workstation to "needs a witting rolling out", and the
    ground is only of amount, but therefore it settles the matter.

    A workstation sets up some few hundred bindings a day. A server of files, a server of a hoard of
    data or a warden of the household takes in as many within a minute. The switching on of the writing
    of bindings let through means upon such a machine an unceasing stream of writing onto the roll of
    the system, of a bulk that nobody reckoned up before the change.

    The outcome is twofold and both its pieces are unhappy. First, the file of the wall of fire's log
    has a size of its own, set on its own, and at the default worth it wraps about upon a server within
    minutes - that is, we write down a huge stream in order to have nothing out of it. Second, it is an
    unceasing writing onto the system disk, which upon an unbodily machine shares its bearer with other
    machines and which is seen in no meter of an application.

    Therefore the ordering here is the other way about than it mostly is - first the size and the stead
    of the file of the wall of fire's log are settled and the store upon the roll is looked at, and only
    then is the writing switched on. The laying on of this item alone, without those two settlings,
    gives a following in the writ-up and a log of no use upon the machine.

    The change takes no break and is undone at once, which is here of weight - if after the switching on
    the bulk prove not to be borne, the drawing back takes as long as the switching on did.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Na serwerze przyjmującym setki połączeń na minutę powstaje nieustanny strumień zapisu na wolumin systemowy
      - Plik dziennika zapory ma osobno ustawiany rozmiar i przy wartości domyślnej zawija się na serwerze w minutach
      - Stały zapis obciąża dysk systemowy, który na maszynie wirtualnej dzieli nośnik z innymi maszynami
      - Zastosowanie punktu bez ustalenia rozmiaru i położenia dziennika daje zgodność w raporcie i bezużyteczny dziennik na maszynie
    en:
      - Upon a server taking in hundreds of bindings a minute there rises an unceasing stream of writing onto the roll of the system
      - The file of the wall of fire's log has a size set on its own and at the default worth wraps about upon a server within minutes
      - The unceasing writing lades the system disk, which upon an unbodily machine shares its bearer with other machines
      - The laying on of the item without a settling of the size and stead of the log gives a following in the writ-up and a log of no use
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono wcześniej rozmiaru i położenia pliku dziennika zapory ani nie sprawdzono zapasu na woluminie systemowym
      - Maszyna przyjmuje bardzo duży ruch, a jej dysk systemowy jest współdzielony i bez zapasu na stały zapis
    en:
      - The size and stead of the file of the wall of fire's log were not settled beforehand and the store upon the roll of the system was not looked at
      - The machine takes in very great traffic and its system disk is shared and without store for an unceasing writing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $silent = @($profiles | Where-Object { $_.LogAllowed -ne 'True' })
        if ($silent.Count -eq 0) { 'ALL_LOGGED' } else { 'SILENT_IN_' + ($silent.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_LOGGED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, LogAllowed |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Settle the log file size and location first and check free space on the
    # system volume: on a busy server the default log size wraps around within
    # minutes, which buys a large write stream and no usable record.
    Set-NetFirewallProfile -Profile Domain, Private, Public -LogAllowed True

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -LogAllowed $p.LogAllowed
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Kategorii nie podnoszę świadomie: rejestrowanie niczego nie blokuje,
    a mechanizm obronny opisuję tym, czym jest, a nie tym, jak bardzo go
    cenię. Ten sam powód, co przy zbieraniu dzienników.

    Zapis odrzuceń mówi, kto pukał i został odprawiony. Zapis połączeń
    przepuszczonych mówi, kto faktycznie rozmawiał z maszyną — na
