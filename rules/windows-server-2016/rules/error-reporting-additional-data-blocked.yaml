id: win2016-error-reporting-additional-data-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Error Reporting
  title:
    pl: Dosyłanie danych uzupełniających do raportu o błędzie zablokowane
    en: The sending of further data to a fault report blocked
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania dosyłania danych uzupełniających do raportu
    o błędzie, gdy producent poprosi o nie po otrzymaniu zgłoszenia
    pierwotnego.

    Przebieg wygląda tak: maszyna wysyła raport skrócony, a w odpowiedzi
    może dostać prośbę o więcej — o pełniejszy obraz pamięci, o dodatkowe
    pliki, o zawartość rejestru związaną z awarią. Prośba przychodzi
    z zewnątrz, a maszyna odpowiada na nią sama, bez pytania kogokolwiek.

    Na tym polega właściwa treść punktu. Pierwszy raport ma rozmiar
    i zawartość, które system ustala sam. Dosyłka ma zawartość, którą
    ustala strona trzecia, w odpowiedzi na to, co zobaczyła. Jest to jedyny
    mechanizm w systemie, w którym zakres danych wychodzących zależy od
    tego, o co ktoś z zewnątrz poprosi.

    Mechanizm nie jest wrogi i nie został pomyślany źle — służy dochodzeniu
    przyczyny awarii. Rzecz w tym, że na serwerze przetwarzającym dane
    organizacji zgoda na dosyłanie czegokolwiek na żądanie jest decyzją,
    której nikt świadomie nie podjął.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał,
    w którym zakres danych wysyłanych z tej maszyny zależy od prośby
    przychodzącej z zewnątrz.
  en: |
    The setting forbids further data to be sent to a fault report when the maker asks for it
    after receiving the first submission.

    The course runs thus: the machine sends a shortened report and may get in answer a request
    for more - for a fuller image of memory, for additional files, for the part of the registry
    tied to the failure. The request comes from outside and the machine answers it itself,
    asking nobody.

    In that lies the item's real substance. The first report has a size and contents the system
    settles itself. The further sending has contents a third party settles, in answer to what
    it has seen. It is the one mechanism in the system in which the reach of the data going out
    hangs on what somebody outside asks for.

    The mechanism is not hostile and was not ill thought out - it serves the tracing of a
    failure's cause. The matter is that on a server working with the organisation's data,
    consent to send anything on request is a decision nobody knowingly took.

    What an attacker gains while the item goes unmet: a channel in which the reach of the data
    sent from this machine hangs on a request coming from outside.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Na serwerze nikt nie prowadzi dochodzenia w sprawie awarii przez
    dosyłanie danych producentowi. Droga ta wymaga interaktywnej zgody
    i cierpliwości, a na maszynie pracującej bez obsługi nie jest używana.

    Wdrożenie nie zatrzymuje raportu pierwotnego. Zgłoszenie idzie dalej,
    a blokowana jest wyłącznie odpowiedź na prośbę o więcej. Warto to
    rozróżnić, bo nazwa reguły sugeruje, że zgłaszanie przestaje działać,
    a przestaje działać tylko jego druga faza.

    Wdrożenie jest przy tym zbędne tam, gdzie usługa zgłaszania błędów
    została już wyłączona. Punkt zostaje wtedy jako zabezpieczenie na
    wypadek jej ponownego włączenia — i jest to układ celowy, nie
    przeoczenie.

    Bez restartu, natychmiast odwracalne. Nie ma znanych regresji.

    Czego to nie psuje: zgłoszenia pierwotnego, zrzutów lokalnych,
    dzienników zdarzeń, usług, sieci.
  en: |
    The class is "no disruption".

    On a server nobody traces a failure by sending further data to the maker. That road calls
    for interactive consent and patience, and on a machine working unattended it is not used.

    The rollout does not stop the first report. The submission goes on, and what is blocked is
    solely the answer to a request for more. That is worth telling apart, the rule's name
    suggesting that reporting stops working when only its second phase does.

    The rollout is besides needless where the error reporting service has already been switched
    off. The item then stays as a safeguard should it be switched back on - and that
    arrangement is deliberate, not an oversight.

    No restart, undone immediately. There are no known regressions.

    What this does not break: the first submission, local dumps, event logs, services, or the
    network.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Zgłoszenie pierwotne idzie dalej - blokowana jest wyłącznie odpowiedź na prośbę o dane uzupełniające
      - Dochodzenie przyczyny awarii prowadzone wspólnie z producentem tą drogą przestaje być możliwe
      - Na maszynie z wyłączoną usługą zgłaszania błędów punkt nie zmienia nic dziś i działa jako zabezpieczenie na przyszłość
      - Zrzuty lokalne, dzienniki zdarzeń, usługi i sieć pozostają bez zmian
    en:
      - The first submission goes on - what is blocked is solely the answer to a request for further data
      - Tracing a failure's cause together with the maker by that road ceases to be possible
      - On a machine with the error reporting service off the item changes nothing today and works as a safeguard for the future
      - Local dumps, event logs, services and the network stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Awarie na tej maszynie są rozpatrywane wspólnie z producentem systemu i dosyłanie danych jest częścią tej procedury
    en:
      - Failures on this machine are examined together with the system's maker and the sending of further data is part of that procedure
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
      $name = 'DontSendAdditionalData'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
    $name = 'DontSendAdditionalData'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontSendAdditionalData' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wer/windows-error-reporting

notes:
  pl: |
    Punkt jest ciekawy nie wielkością skutku, tylko tym, co opisuje.
    Jest to jedyne miejsce w całym zestawie, w którym maszyna zgadza się
    z góry odpowiedzieć na pytanie, którego jeszcze nie zna.

    Warto to powiedzieć wprost, bo argumentacja przez wielkość danych
    prowadzi tu na manowce. Nie chodzi o to, ile bajtów wychodzi. Chodzi
    o to, że ich zakres ustala ktoś inny niż właściciel maszyny.

    Relacja z regułą o usłudze zgłaszania błędów jest warstwowa i warto ją
    pokazać jako warstwową. Usługa wyłączona zamyka sprawę w całości; to
    ustawienie zamyka jej gorszą połowę i zostaje aktywne, gdyby usługa
    kiedyś wróciła. Nakładanie się zabezpieczeń nie jest tu powtórzeniem,
    tylko drugą warstwą — i raport powinien to odróżniać.
  en: |
    The item is of interest not for the size of its consequence but for what it describes. It
    is the one place in the whole set where the machine agrees beforehand to answer a question
    it does not yet know.

    That is worth saying outright, an argument by the size of the data leading here astray. It
    is not a matter of how many bytes go out. It is a matter of their reach being settled by
    somebody other than the machine's owner.

    The relation with the rule on the error reporting service is a layered one and is worth
    showing as layered. The service switched off shuts the matter entirely; this setting shuts
    its worse half and stays active should the service ever come back. The overlapping of
    safeguards is here no repetition but a second layer - and the report should tell that
    apart.
