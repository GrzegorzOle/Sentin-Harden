id: win2025-removable-device-installation-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Instalowanie urządzeń wymiennych zablokowane
    en: Installing removable devices blocked
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje instalowanie urządzeń opisujących się systemowi jako
    wymienne. Nie chodzi o jeden rodzaj sprzętu ani o jedno złącze —
    kryterium jest sposób, w jaki urządzenie się przedstawia.

    Zostawiam kategorię wysoką. Wymienny nośnik jest drogą w obie strony
    i obie są istotne. W stronę maszyny wnosi pliki, które nie przeszły
    przez żaden punkt kontroli: nie obejrzała ich brama pocztowa, nie
    zapisał ich serwer plików, nie zobaczył ich nikt poza osobą, która
    je przyniosła. W stronę przeciwną wynosi dane, i robi to bez żadnego
    zapisu, który dałoby się później przeczytać.

    Na serwerze druga strona waży więcej niż na stacji roboczej, i to
    jest różnica, którą chcę tu postawić na pierwszym miejscu. Na stacji
    roboczej wyniesie się to, co ma przy sobie jeden człowiek. Z serwera
    wynosi się bazę, katalog udziałów albo kopię zapasową — czyli
    dokładnie te zbiory, które w innych miejscach obudowano uprawnieniami
    i rejestrowaniem dostępu. Złącze na froncie obudowy omija je wszystkie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kanał
    wejścia i wyjścia, którego nie widzi zapora, nie widzi serwer proxy
    i nie widzi nic, co zbiera ruch sieciowy — bo tędy ruch sieciowy nie
    idzie.
  en: |
    The item blocks the installation of devices that describe themselves
    to the system as removable. This is not about one kind of hardware or
    one connector - the criterion is how the device presents itself.

    I keep the category high. Removable media are a two-way route and both
    directions matter. Towards the machine they bring in files that passed
    no checkpoint: no mail gateway looked at them, no file server recorded
    them, nobody saw them except the person who carried them in. In the
    other direction they carry data out, and they do it without any record
    that could later be read.

    On a server the second direction weighs more than on a workstation,
    and that is the difference I want to put first here. From a workstation
    what leaves is what one person has to hand. From a server what leaves
    is a database, a share directory or a backup - precisely the data sets
    that elsewhere were wrapped in permissions and access logging. A socket
    on the front of the chassis goes around all of it.

    What an attacker gains while the item goes unmet: a channel in and out
    that the firewall does not see, the proxy does not see and nothing
    collecting network traffic sees - because no network traffic goes this
    way.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać scenariusz,
    który na serwerze jest tu najważniejszy, bo nie jest to codzienna
    praca użytkownika.

    Na serwerze nikt nie podłącza nośników na co dzień — i właśnie dlatego
    łatwo uznać ten punkt za darmowy. Nie jest darmowy, bo osobą, którą
    zablokuje, jest administrator w sytuacji awaryjnej. Nośnik
    z sterownikiem, obraz odzyskiwania, klucz sprzętowy do narzędzia
    producenta, przejściówka konsolowa: to wszystko pojawia się w tej
    maszynie dokładnie wtedy, gdy jest źle, i dokładnie wtedy blokada
    zadziała. Warto o tym zdecydować wcześniej niż o trzeciej w nocy.

    Blokada obejmuje również sprzęt, którego zwykle się do tej rodziny nie
    zalicza: drukarkę podłączoną lokalnie na czas serwisu i część adapterów
    zgłaszających się jako wymienne. Kryterium jest deklaracja urządzenia,
    a nie jego przeznaczenie, więc lista rzeczy objętych bywa szersza niż
    intuicja.

    Punkt nie wymaga przerwy i cofa się natychmiast, a to jest tu argument
    praktyczny: przy pracach serwisowych wyłącza się go na czas prac,
    zamiast rezygnować z niego w ogóle. Warto tę procedurę napisać razem
    z wdrożeniem punktu, a nie zostawić jej do wymyślenia na miejscu.
  en: |
    I keep the class "needs a planned rollout" and want to name the
    scenario that matters most here on a server, because it is not a
    user's daily work.

    On a server nobody attaches media day to day - and that is exactly why
    this item is easy to consider free. It is not free, because the person
    it will block is an administrator in an emergency. A driver medium, a
    recovery image, a hardware key for the vendor's tool, a console
    adapter: all of these appear in this machine at exactly the moment
    things are going badly, and at exactly that moment the block will act.
    Better to decide about it earlier than at three in the morning.

    The block also covers hardware not usually counted in this family: a
    printer attached locally for the duration of a service visit, and some
    adapters that announce themselves as removable. The criterion is the
    device's own declaration, not its purpose, so the list of things
    covered is often wider than intuition suggests.

    The item needs no outage and is undone immediately, and here that is a
    practical argument: for maintenance work it is switched off for the
    duration of the work rather than abandoned altogether. That procedure
    is worth writing down together with the rollout, not left to be
    invented on the spot.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
    - printing
  what_breaks:
    pl:
      - Nośnik ze sterownikiem, obraz odzyskiwania i klucz sprzętowy narzędzia producenta nie zainstalują się
      - Blokada zadziała dokładnie w sytuacji awaryjnej, bo wtedy takie urządzenia trafiają do serwera
      - Obejmuje też drukarkę podłączoną lokalnie na czas serwisu i adaptery zgłaszające się jako wymienne
      - Kryterium jest deklaracja urządzenia, a nie jego przeznaczenie, więc lista objętych bywa szersza niż intuicja
    en:
      - A driver medium, a recovery image and a hardware key for the vendor's tool will not install
      - The block acts in exactly the emergency situation, because that is when such devices reach a server
      - It also covers a printer attached locally for a service visit and adapters announcing themselves as removable
      - The criterion is the device's own declaration rather than its purpose, so the list covered is often wider than intuition suggests
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ustalono procedury czasowego wyłączenia blokady na czas prac serwisowych
      - Serwer korzysta z nośnika wymiennego w stałym procesie, na przykład przy wynoszeniu kopii zapasowych
      - Narzędzia producenta do diagnostyki wymagają klucza sprzętowego podłączanego na miejscu
    en:
      - No procedure was agreed for switching the block off temporarily during maintenance
      - The server uses removable media in a standing process, for instance when carrying backups off site
      - The vendor's diagnostic tools require a hardware key attached on site
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      $name = 'DenyRemovableDevices'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $name = 'DenyRemovableDevices'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The person this blocks is an administrator in an emergency: driver media,
    # recovery images, vendor hardware keys. Agree the procedure for switching it
    # off during maintenance before switching it on.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyRemovableDevices' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/install/device-installation-restrictions

notes:
  pl: |
    Wymienny nośnik jest drogą w obie strony. Na serwerze waży bardziej
    strona wyjścia: wynosi się bazę, katalog udziałów albo kopię
    zapasową — czyli zbiory, które gdzie indziej obudowano uprawnieniami
    i rejestrowaniem dostępu.

    Na serwerze nikt nie podłącza nośników na co dzień, więc punkt łatwo
    uznać za darmowy. Osobą, którą zablokuje, jest administrator
    w sytuacji awaryjnej — nośnik ze sterownikiem, obraz odzyskiwania,
    klucz sprzętowy narzędzia producenta.

    Cofa się natychmiast, więc na czas prac serwisowych wyłącza się go
    zamiast rezygnować z niego w ogóle. Tę procedurę pisze się razem
    z wdrożeniem, a nie wymyśla na miejscu.
  en: |
    Removable media are a two-way route. On a server the outbound direction
    weighs more: what leaves is a database, a share directory or a backup -
    data sets that elsewhere were wrapped in permissions and access
    logging.

    On a server nobody attaches media day to day, so the item is easy to
    consider free. The person it will block is an administrator in an
    emergency - a driver medium, a recovery image, a vendor hardware key.

    It is undone immediately, so for maintenance work it is switched off
    rather than abandoned altogether. That procedure is written together
    with the rollout, not invented on the spot.
