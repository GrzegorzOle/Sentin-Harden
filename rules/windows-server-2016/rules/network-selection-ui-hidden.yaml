id: win2016-network-selection-ui-hidden

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Wybór sieci przy zablokowanym ekranie ukryty
    en: The choosing of a network at a locked screen hidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ukrywa wybór sieci dostępny przy zablokowanym ekranie.

    Punkt dotyczy tej samej granicy co reguły o ekranie blokady, ale jest
    z nich najpoważniejszy w skutkach. Osoba stojąca przy maszynie może bez
    logowania zmienić sieć, z którą maszyna jest połączona.

    Znaczy to, że można maszynę przełączyć do sieci pod własną kontrolą,
    nie mając na niej żadnego konta. Po przełączeniu wszystko, co maszyna
    robi w sieci — rozwiązywanie nazw, próby uwierzytelnienia, ruch do
    usług wewnętrznych — idzie przez sprzęt obcy. Nie trzeba przy tym
    niczego łamać, bo jest to funkcja przewidziana.

    Rzecz warta odnotowania: mechanizm powstał dla wygody: maszyna bez
    połączenia nie pozwoliłaby zalogować się kontu domenowemu, więc trzeba
    dać możliwość podłączenia jej wcześniej. Jest to argument prawdziwy
    i właśnie dlatego ten punkt wymaga rozważenia, a nie odruchowego
    wykonania.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    przełączenia maszyny do wybranej przez siebie sieci bez posiadania na
    niej konta.
  en: |
    The setting hides the choosing of a network to be had at a locked screen.

    The item concerns the same boundary as the rules about the lock screen, but is of them the gravest in
    its consequences. A person standing at the machine can, without logging in, change the network the
    machine is joined to.

    That means the machine can be switched to a network under their own control without their having any
    account on it. After the switching, everything the machine does on the network - the resolving of names,
    attempts at authentication, traffic to internal services - goes through somebody else's gear. Nothing
    has to be broken for that, this being a foreseen function.

    A thing worth noting: the mechanism came about for convenience - a machine without a connection would
    not let a domain account log in, so a way of joining it beforehand has to be given. It is a true argument,
    and for just that reason this item calls for weighing rather than a reflexive carrying out.

    What an attacker gains while the item goes unmet: the chance to switch the machine to a network of their
    own choosing without having an account on it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, jak ta maszyna
    wstaje po utracie łączności.

    Przypadek pierwszy i najważniejszy: maszyna podnoszona zdalnie, której
    sieć ustawia się z ekranu logowania. Zdarza się to przy sprzęcie
    w oddziałach i przy maszynach łączących się przez sieć operatorską.
    Po zmianie droga ta znika i trzeba mieć inną — konsolę, kartę
    zarządzania, dostęp fizyczny.

    Przypadek drugi dotyczy pierwszego logowania konta domenowego na
    maszynie bez połączenia. Bez wyboru sieci przy ekranie logowania
    trzeba najpierw zalogować się kontem lokalnym, ustawić sieć i dopiero
    potem zalogować kontem domenowym. Nie jest to niemożliwe, tylko
    dłuższe — i trzeba mieć konto lokalne.

    Na serwerze w szafie, połączonym przewodem, zmiana nie robi nic.

    Czego to nie psuje: połączenia już zestawionego, sieci przewodowej,
    logowania kont domenowych przy działającej sieci, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns how this machine comes up after a loss of
    connectivity.

    The first and weightiest case: a machine brought up remotely whose network is set from the logon screen.
    That happens with gear in branch offices and with machines connecting through an operator's network. After
    the change that road goes, and another has to be had - a console, a management card, physical access.

    The second case concerns the first logon of a domain account on a machine without a connection. Without
    the choosing of a network at the logon screen one has to log in by a local account first, set the network
    and only then log in by the domain account. It is not impossible, only longer - and a local account has
    to be had.

    On a server in a cabinet, joined by cable, the change does nothing.

    What this does not break: a connection already set up, the wired network, the logging on of domain
    accounts while the network works, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Maszyna podnoszona zdalnie, której sieć ustawia się z ekranu logowania, traci tę drogę i trzeba mieć inną
      - Pierwsze logowanie konta domenowego na maszynie bez połączenia wymaga najpierw zalogowania się kontem lokalnym
      - Zmiana sieci przy zablokowanym ekranie przestaje być możliwa dla osoby stojącej przy maszynie
      - Połączenie już zestawione, sieć przewodowa i logowanie kont domenowych przy działającej sieci pozostają bez zmian
      - Usługi systemowe i aplikacje serwerowe pozostają bez zmian
    en:
      - A machine brought up remotely whose network is set from the logon screen loses that road and another has to be had
      - The first logon of a domain account on a machine without a connection calls for a local account to be used first
      - Changing the network at a locked screen ceases to be possible for a person standing at the machine
      - A connection already set up, the wired network and the logging on of domain accounts while the network works stay unchanged
      - Services and applications stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest podnoszona zdalnie, a jej sieć ustawia się z ekranu logowania i nie ma innej drogi
      - Na maszynie nie ma konta lokalnego, którym dałoby się zalogować przy braku połączenia
    en:
      - The machine is brought up remotely and its network is set from the logon screen, and there is no other road
      - There is no local account on the machine by which one could log in when there is no connection
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'DontDisplayNetworkSelectionUI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'DontDisplayNetworkSelectionUI'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # After this, changing the network calls for logging in. Where a machine is
    # brought up remotely and the network is set at the logon screen, establish
    # another road first.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontDisplayNetworkSelectionUI' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Punkt jest czwarty w bloku i najciekawszy, bo argument za nim i argument
    przeciw są tej samej wagi. Mechanizm daje napastnikowi przełączenie
    maszyny do cudzej sieci bez konta; ten sam mechanizm daje obsłudze
    podniesienie maszyny, która straciła łączność.

    Warto, żeby aplikacja postawiła to zestawienie wprost, zamiast
    przedstawiać punkt jako oczywisty. Jest to jedna z niewielu reguł,
    przy których odpuszczenie z zapisanym uzasadnieniem jest decyzją równie
    dobrą co wykonanie — i zależy wyłącznie od tego, czy istnieje droga
    zapasowa.

    Pytanie, które trzeba zadać, brzmi więc nie „czy to jest groźne",
    tylko „czym podniesiemy tę maszynę, gdy straci sieć". Aplikacja, która
    zada to pytanie zamiast pokazać ostrzeżenie, oszczędzi komuś awarii.

    Odnotowuję, że reguła leży w tej samej gałęzi rejestru co ustawienia
    o powiadomieniach przy ekranie blokady i o pobieraniu czcionek. Gałąź
    ta zbiera rzeczy o różnym przeznaczeniu i przy czytaniu kopii
    zapasowej warto o tym pamiętać.
  en: |
    The item is the fourth in the block and the most interesting, the argument for it and the argument against
    it being of the same weight. The mechanism gives an attacker the switching of the machine to somebody
    else's network without an account; that same mechanism gives the attendance the bringing up of a machine
    that has lost its connectivity.

    It is well that the application set that pairing down outright, rather than present the item as obvious.
    It is one of the few rules at which letting go with a written justification is as good a decision as
    carrying out - and it hangs solely on whether a road in reserve exists.

    The question that has to be put runs therefore not "is this dangerous" but "with what shall we bring this
    machine up when it loses the network". An application that puts that question instead of showing a warning
    will spare somebody a fault.

    Worth noting that the rule lies in the same branch of the registry as the settings about notifications at
    the lock screen and about the fetching of fonts. That branch gathers things of different purposes and that
    is worth keeping in mind when reading the backup.
