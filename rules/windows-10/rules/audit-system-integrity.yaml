id: win10-audit-system-integrity

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja integralności systemu
    en: The audit of the system integrity
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje zdarzenia mówiące o naruszeniu spójności samego
    systemu: utratę wpisów inspekcji, niepowodzenie sprawdzenia podpisu
    składnika ładowanego do jądra i błędy mechanizmów pilnujących
    poprawności wywołań systemowych.

    Podkategoria ta jest w całej paczce jedynym miejscem, w którym zapisuje
    się to, że zapisu zabrakło. Wpis o utracie zdarzeń inspekcji powstaje,
    gdy dziennik nie nadążył albo gdy został zatrzymany — i jest to jedyna
    informacja odróżniająca dziurę w zapisie od spokoju.

    Druga połowa treści dotyczy jądra. Nieudane sprawdzenie podpisu
    składnika ładowanego do jądra jest zdarzeniem, które w normalnej pracy
    nie zachodzi wcale. Jeśli zachodzi, znaczy to, że ktoś próbował wstawić
    kod w miejsce, z którego widać wszystko i z którego żaden mechanizm
    ochronny już go nie zobaczy.

    Odnotowuję, że zapisywane są oba wyniki i że połowa nieudana jest tu
    treścią właściwą. Powodzenia w tej podkategorii są w większości
    potwierdzeniami działania mechanizmów; niepowodzenia są zdarzeniami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dziury
    w zapisie i nieudane próby wejścia do jądra pozostające bez żadnego
    śladu.
  en: |
    The setting writes down the events that speak of a breach in the system's own soundness: the loss of audit
    entries, the failure of a signature check upon a component loaded into the kernel, and the faults of the
    mechanisms watching over the correctness of system calls.

    This subcategory is in the whole pack the one place in which it is written down that a record was wanting.
    An entry about the loss of audit events comes about where the log did not keep up or where it was stopped -
    and it is the one word parting a hole in the record from quiet.

    The second half of the substance touches the kernel. A failed signature check upon a component loaded into
    the kernel is an event that in ordinary work does not happen at all. Where it happens, it means somebody
    tried to set code in a place from which everything is seen and from which no guarding mechanism will see it
    any more.

    I set down that both outcomes are written and that the failed half is here the proper substance. The
    successes in this subcategory are for the most part confirmations that the mechanisms work; the failures are
    events.

    What an attacker gains while the item goes unmet: holes in the record, and failed attempts at entering the
    kernel, left without any trace.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnego mechanizmu sprawdzającego i nie wpływa
    na to, co wolno załadować do jądra. Zapisuje wyłącznie wynik działania
    tych mechanizmów.

    Liczba wpisów jest w normalnej pracy bliska zeru po stronie niepowodzeń.
    Po stronie powodzeń bywa ich więcej, bo mechanizmy kryptograficzne
    potwierdzają tu swoje działanie przy starcie systemu.

    Odnotowuję zdarzenie, które przy tej podkategorii bywa mylone z awarią:
    wpis o utracie zdarzeń inspekcji pojawia się także wtedy, gdy dziennik
    jest po prostu za mały i nie nadąża. Nie jest to wtedy ślad napastnika,
    tylko wskazanie, że dziennik trzeba powiększyć — i jedno drugiego nie
    wyklucza.

    Czego to nie psuje: ładowania sterowników, podpisów składników,
    logowania, kont domenowych, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no checking mechanism and bears not upon what may be loaded into the kernel. It writes
    down the outcome of those mechanisms' working alone.

    The number of entries is in ordinary work near nought upon the side of failures. Upon the side of successes
    they are at times more, the cryptographic mechanisms confirming here their working at the system's start.

    I set down an event at times mistaken at this subcategory for a fault: an entry about the loss of audit
    events comes up also where the log is simply too small and does not keep up. It is then no trace of an
    attacker but a showing that the log wants enlarging - and the one does not rule out the other.

    What this does not break: the loading of drivers, the signatures of components, logging on, domain accounts,
    file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Po stronie powodzeń wpisów bywa więcej, bo mechanizmy kryptograficzne potwierdzają tu swoje działanie przy starcie systemu
      - Wpis o utracie zdarzeń inspekcji pojawia się także wtedy, gdy dziennik jest za mały i nie nadąża
      - Nie jest to wtedy ślad napastnika, tylko wskazanie, że dziennik trzeba powiększyć, i jedno drugiego nie wyklucza
      - Ustawienie nie zmienia żadnego mechanizmu sprawdzającego i nie wpływa na to, co wolno załadować do jądra
      - Ładowanie sterowników, podpisy składników, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Upon the side of successes the entries are at times more, the cryptographic mechanisms confirming here their working at the start
      - An entry about the loss of audit events comes up also where the log is too small and does not keep up
      - It is then no trace of an attacker but a showing that the log wants enlarging, and the one does not rule out the other
      - The setting changes no checking mechanism and bears not upon what may be loaded into the kernel
      - The loading of drivers, the signatures of components, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma rozmiar domyślny i wpisy o utracie zdarzeń będą mówić o nim, a nie o napastniku
    en:
      - The security log is of its default size and the entries about lost events will speak of it and not of an attacker
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9212-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9212-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9212-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. The failed half holds the loss of audit entries
    # and the refusals of the integrity checks, which is the substance here.
    auditpol /set /subcategory:"{0CCE9212-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9212-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-system-integrity

notes:
  pl: |
    Reguła jest w całej paczce jedyną, która odpowiada na pytanie o własną
    wiarygodność zapisu. Wpis o utracie zdarzeń inspekcji jest jedyną
    informacją odróżniającą dziurę w dzienniku od spokoju — a różnica ta
    rozstrzyga o tym, czy z pozostałych zapisów wolno wyciągać wnioski.

    Warto, żeby aplikacja pokazała tę regułę przy każdym raporcie z audytu,
    a nie tylko na liście punktów. Raport z maszyny, na której zdarzenia
    ginęły, mówi co innego niż raport z maszyny, na której nic się nie
    działo — i bez tej podkategorii oba wyglądają tak samo.

    Odnotowuję dwuznaczność wpisu o utracie zdarzeń, bo prowadzi do fałszywego
    alarmu. Ten sam wpis powstaje przy zbyt małym dzienniku i przy zapisie
    zatrzymanym celowo. Aplikacja powinna postawić oba odczytania obok
    siebie, zamiast wybierać za użytkownika.
  en: |
    The rule is in the whole pack the only one that answers the question of the record's own trustworthiness.
    An entry about the loss of audit events is the one word parting a hole in the log from quiet - and that
    difference settles whether conclusions may be drawn from the other records at all.

    It is well that the application show this rule at every audit report and not upon the list of items alone. A
    report from a machine upon which events were being lost says something other than a report from a machine
    upon which nothing happened - and without this subcategory the two look alike.

    I set down the double reading of the entry about lost events, it leading to a false alarm. The same entry
    comes about at a log too small and at a record stopped on purpose. The application ought to set both readings
    side by side rather than choose for the user.
