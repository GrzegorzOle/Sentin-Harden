id: win2016-logon-banner-title

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Tytuł komunikatu wyświetlanego przed zalogowaniem ustawiony
    en: The title of the message shown before signing in set
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby przed zalogowaniem pojawiał się komunikat z ustawionym
    tytułem. Sam tytuł jest nagłówkiem okna; treść jest osobnym punktem
    i osobną regułą.

    To jest reguła, przy której trzeba być uczciwym co do tego, czemu ona
    służy. Nie zatrzymuje żadnego ataku. Nie utrudnia ani jednego kroku
    napastnikowi. Napastnik przeczyta ten komunikat i kliknie dalej, tak samo
    jak wszyscy.

    Jej sens leży poza techniką, w tym, co dzieje się po incydencie. Wykazanie,
    że osoba wchodząca na maszynę została uprzedzona o zakresie dozwolonego
    użycia i o tym, że praca jest rejestrowana, bywa warunkiem wyciągnięcia
    konsekwencji — kadrowych albo prawnych. Bez tego komunikatu spór schodzi na
    to, czy ktoś wiedział, że nie wolno.

    Drugi, praktyczny powód jest taki: tytuł jest jednym z niewielu miejsc,
    w których da się na ekranie logowania umieścić informację czyja to maszyna
    i do kogo dzwonić. Na serwerze w oddziale bywa to jedyna tabliczka, jaka
    na nim wisi.

    Kategoria niska i taka ma zostać. Zawyżanie jej podważyłoby wiarygodność
    pozostałych ocen w tym zestawie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    technicznego — zyskuje natomiast osoba z wewnątrz, której nikt formalnie
    nie uprzedził, że to, co robi, jest rejestrowane.
  en: |
    The item requires that before signing in a message with a set title appear. The
    title itself is the window's heading; the body is a separate item and a separate
    rule.

    This is a rule about which one has to be honest as to what it serves. It stops
    no attack. It hinders not one step of an attacker's. The attacker will read this
    message and click through, just as everybody does.

    Its sense lies outside the technical, in what happens after an incident. Showing
    that a person coming onto the machine was warned of the bounds of permitted use
    and of the recording of their work is at times the condition for drawing
    consequences - of employment or of law. Without this message the dispute comes
    down to whether somebody knew it was not allowed.

    The second, practical reason is this: the title is one of the few places where
    the sign-in screen can be made to say whose machine this is and whom to call. On
    a server in a branch it is at times the only label the machine carries.

    The category is low and so it should stay. Raising it would undercut the
    credibility of the other assessments in this set.

    What an attacker gains while the item goes unmet: nothing technical - what gains
    is the person from within, whom nobody formally warned that what they do is
    recorded.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i to nie ze względu na skutek
    techniczny, tylko na treść, która trafi na ekran. Tej treści nie ustala się
    przy wdrożeniu reguły — ustala się ją wcześniej, z kimś, kto odpowiada za
    sprawy pracownicze albo prawne.

    Wpisanie komunikatu z głowy jest tu gorsze niż nieustawienie go wcale.
    Komunikat, który obiecuje nadzór wykraczający poza to, co organizacja
    faktycznie robi, albo grozi konsekwencjami, których nie da się wyciągnąć,
    działa przeciwko tej samej sprawie, której miał służyć.

    Skutek techniczny jest przy tym realny i dotyczy automatyzacji. Każde
    logowanie wymaga po zmianie dodatkowego potwierdzenia, a narzędzia, które
    logują się do maszyny w sposób sterowany skryptem, nie spodziewają się
    okna, którego nikt im nie zapowiedział. Dotyczy to zwłaszcza starszych
    rozwiązań monitorujących i narzędzi obrazowania.

    Trzecia rzecz: komunikat pojawia się także w sesji pulpitu zdalnego,
    i to zanim zobaczy się pulpit. Przy kilkudziesięciu logowaniach dziennie
    jest to zmiana odczuwalna.

    Czego to nie psuje: uwierzytelniania, sesji już otwartych, kont usług,
    zadań zaplanowanych ani dostępu przez udziały sieciowe.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and not on account of a technical effect
    but of the wording that will reach the screen. That wording is not settled while
    the rule is being applied - it is settled beforehand, with somebody answerable
    for employment or legal matters.

    Writing a message off the top of one's head is worse here than not setting one
    at all. A message promising oversight beyond what the organisation actually does,
    or threatening consequences that cannot be drawn, works against the very cause
    it was meant to serve.

    The technical effect is real all the same and concerns automation. After the
    change every sign-in calls for an extra confirmation, and tools that sign in to
    the machine under a script's direction do not expect a window nobody announced
    to them. This concerns older monitoring solutions and imaging tools in
    particular.

    A third thing: the message appears in a remote desktop session too, and before
    the desktop is seen. At some dozens of sign-ins a day that is a noticeable
    change.

    What this does not break: authentication, sessions already open, service
    accounts, scheduled tasks, or access through network shares.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - scripting-and-automation
  what_breaks:
    pl:
      - Narzędzia logujące się do maszyny skryptem trafiają na okno, którego nie przewidziano w ich scenariuszu
      - Każde logowanie do konsoli i do sesji zdalnej wymaga dodatkowego potwierdzenia
      - Starsze rozwiązania monitorujące i narzędzia obrazowania potrafią zatrzymać się na tym oknie bez komunikatu o błędzie
      - Uwierzytelnianie, konta usług, zadania zaplanowane i dostęp przez udziały sieciowe pozostają bez zmian
    en:
      - Tools signing in to the machine by script meet a window their scenario did not foresee
      - Every sign-in at the console and in a remote session calls for an extra confirmation
      - Older monitoring solutions and imaging tools can halt at this window with no error message
      - Authentication, service accounts, scheduled tasks and access through network shares stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Treść komunikatu nie została uzgodniona z osobą odpowiadającą za sprawy pracownicze albo prawne
      - Do maszyny logują się narzędzia sterowane skryptem, które nie poradzą sobie z dodatkowym oknem
    en:
      - The wording has not been agreed with somebody answerable for employment or legal matters
      - Script-driven tools sign in to the machine and will not cope with an extra window
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # An entry present but empty shows no message at all, so it is reported apart
      # from one that is missing entirely.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'legalnoticecaption'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      $value = $item.$name
      if ($null -eq $value) { 'MISSING' }
      elseif (([string]$value).Trim() -eq '') { 'EMPTY' }
      else { 'SET' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'SET'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'legalnoticecaption'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The wording below is a starting point, not a requirement of the item. Replace
    # it with the organisation's own before rolling this out widely.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'legalnoticecaption' -Value 'Authorised access only' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-message-title-for-users-attempting-to-log-on

notes:
  pl: |
    Reguła sprawdza wyłącznie, czy tytuł jest ustawiony i niepusty. Nie ocenia
    treści i nie ma takiej ambicji — ocena tego, czy komunikat jest właściwy,
    należy do organizacji, a nie do skanera.

    Wpis obecny, ale pusty, jest zgłaszany osobno od brakującego. Różnica ma
    znaczenie w praktyce: pusty wpis powstaje zwykle po wyczyszczeniu pola
    w edytorze zasad i wygląda w narzędziu tak, jakby ustawienie obowiązywało,
    choć okno się nie pokazuje.

    Punkt czyta się razem z regułą o treści komunikatu. Sam tytuł bez treści
    daje okno z nagłówkiem i pustym wnętrzem — formalnie zgodne, praktycznie
    bezużyteczne. Obie reguły wdraża się naraz albo wcale.
  en: |
    The rule checks only whether the title is set and not empty. It does not judge
    the wording and has no such ambition - judging whether the message is a fitting
    one belongs to the organisation, not to a scanner.

    An entry present but empty is reported apart from a missing one. The difference
    matters in practice: an empty entry usually arises from clearing the field in
    the policy editor and looks in the tool as though the setting holds, though no
    window appears.

    The item reads together with the rule on the message's body. A title without a
    body gives a window with a heading and an empty inside - formally compliant,
    practically useless. Both rules are applied at once or not at all.
