id: ubuntu2404-shadow-group-empty

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 7.2.4
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Grupa shadow nie ma członków
    en: Ensure shadow group is empty
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Na Ubuntu /etc/shadow i /etc/gshadow należą do grupy shadow, która może
    je czytać. Służy to programom takim jak unix_chkpwd czy chage, które
    dostają tę grupę przez bit setgid. Konto dopisane do grupy shadow może
    więc w każdej chwili skopiować skróty wszystkich haseł i łamać je poza
    systemem.

    Punkt wymaga, żeby grupa shadow nie miała członków w /etc/group i żeby
    żadne konto nie miało jej jako grupy głównej.
  en: |
    On Ubuntu, /etc/shadow and /etc/gshadow belong to the shadow group,
    which can read them. It is there for programs such as unix_chkpwd and
    chage, which get the group through the setgid bit. An account added to
    the shadow group can therefore copy the hashes of all passwords at any
    time and crack them offline.

    The item requires the shadow group to have no members in /etc/group and
    no account to have it as the primary group.

disruption_description:
  pl: |
    Na świeżej instalacji grupa jest pusta i nikt tego nie zauważy. Gdy ktoś
    dopisał do niej konto usługi, na przykład narzędzia do audytu haseł
    albo własnej usługi logowania, ta usługa przestanie czytać /etc/shadow
    po ponownym uruchomieniu. Listę członków pokazuje test.
  en: |
    On a fresh installation the group is empty and nobody will notice. When
    someone added a service account to it, for example for a password audit
    tool or a custom login service, that service stops reading /etc/shadow
    after its next restart. The test shows the list of members.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Konta usunięte z grupy shadow po ponownym zalogowaniu albo uruchomieniu usługi nie czytają już /etc/shadow i /etc/gshadow
    en:
      - Accounts removed from the shadow group can no longer read /etc/shadow and /etc/gshadow after their next login or service restart
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    sgid() { awk -F: '$1 == "shadow" { print $3; exit }' /etc/group; }
    members() { awk -F: '$1 == "shadow" { n = split($4, a, ","); for (i = 1; i <= n; i++) if (a[i] != "") print a[i]; exit }' /etc/group; }
    primary() {
      local g
      g=$(sgid); [ -n "$g" ] || return 0
      awk -F: -v g="$g" '$1 != "" && $4 == g { print $1 }' /etc/passwd
    }
    evaluate() {
      local m p
      [ -r /etc/group ] && [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd-or-/etc/group"; return; }
      [ -n "$(sgid)" ] || { echo "OK:no-shadow-group"; return; }
      m=$(members | paste -sd, -); p=$(primary | paste -sd, -)
      if [ -z "$m$p" ]; then echo "OK:shadow-group-empty"; return; fi
      echo "NOT_OK:members=${m:-none},primary=${p:-none}"
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    sgid() { awk -F: '$1 == "shadow" { print $3; exit }' /etc/group; }
    members() { awk -F: '$1 == "shadow" { n = split($4, a, ","); for (i = 1; i <= n; i++) if (a[i] != "") print a[i]; exit }' /etc/group; }
    primary() {
      local g
      g=$(sgid); [ -n "$g" ] || return 0
      awk -F: -v g="$g" '$1 != "" && $4 == g { print $1 }' /etc/passwd
    }
    evaluate() {
      local m p
      [ -r /etc/group ] && [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd-or-/etc/group"; return; }
      [ -n "$(sgid)" ] || { echo "OK:no-shadow-group"; return; }
      m=$(members | paste -sd, -); p=$(primary | paste -sd, -)
      if [ -z "$m$p" ]; then echo "OK:shadow-group-empty"; return; fi
      echo "NOT_OK:members=${m:-none},primary=${p:-none}"
    }
      [ "$(id -u)" = 0 ] || { echo "Root privileges are required" >&2; exit 1; }
      { echo format=shadowgrp-1; members | sed 's/^/member /'; } > "$b.tmp"
      mv "$b.tmp" "$b"
      echo "Saved $(( $(wc -l < "$b") - 1 )) members of the shadow group"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowgrp-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    sgid() { awk -F: '$1 == "shadow" { print $3; exit }' /etc/group; }
    members() { awk -F: '$1 == "shadow" { n = split($4, a, ","); for (i = 1; i <= n; i++) if (a[i] != "") print a[i]; exit }' /etc/group; }
    primary() {
      local g
      g=$(sgid); [ -n "$g" ] || return 0
      awk -F: -v g="$g" '$1 != "" && $4 == g { print $1 }' /etc/passwd
    }
    evaluate() {
      local m p
      [ -r /etc/group ] && [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd-or-/etc/group"; return; }
      [ -n "$(sgid)" ] || { echo "OK:no-shadow-group"; return; }
      m=$(members | paste -sd, -); p=$(primary | paste -sd, -)
      if [ -z "$m$p" ]; then echo "OK:shadow-group-empty"; return; fi
      echo "NOT_OK:members=${m:-none},primary=${p:-none}"
    }
      [ "$(id -u)" = 0 ] || { echo "Root privileges are required" >&2; exit 1; }
      case "$(evaluate)" in OK:*) echo "Already meets the item, nothing to change"; exit 0 ;; esac
      p=$(primary | paste -sd, -)
      [ -z "$p" ] || { echo "Accounts with shadow as the primary group: $p; give them another group with usermod -g first" >&2; exit 1; }
      m=$(members)
      while IFS= read -r n; do
        grep -qxF "member $n" "$b" || { echo "$n is not in the backup; run backup again" >&2; exit 1; }
      done <<< "$m"
      gpasswd -M '' shadow
      echo "Removed from the shadow group: $(paste -sd, - <<< "$m")"
      r=$(evaluate)
      case "$r" in OK:*) ;; *) echo "The item is not met after the change ($r)" >&2; exit 1 ;; esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=shadowgrp-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      if tail -n +2 "$b" | grep -qvE '^member [A-Za-z0-9_][A-Za-z0-9_.-]*[$]?$'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
    export LC_ALL=C
    sgid() { awk -F: '$1 == "shadow" { print $3; exit }' /etc/group; }
    members() { awk -F: '$1 == "shadow" { n = split($4, a, ","); for (i = 1; i <= n; i++) if (a[i] != "") print a[i]; exit }' /etc/group; }
    primary() {
      local g
      g=$(sgid); [ -n "$g" ] || return 0
      awk -F: -v g="$g" '$1 != "" && $4 == g { print $1 }' /etc/passwd
    }
    evaluate() {
      local m p
      [ -r /etc/group ] && [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd-or-/etc/group"; return; }
      [ -n "$(sgid)" ] || { echo "OK:no-shadow-group"; return; }
      m=$(members | paste -sd, -); p=$(primary | paste -sd, -)
      if [ -z "$m$p" ]; then echo "OK:shadow-group-empty"; return; fi
      echo "NOT_OK:members=${m:-none},primary=${p:-none}"
    }
      cur=$(members | paste -sd, -); new=$cur; n=0
      while read -r tag u; do
        getent passwd "$u" >/dev/null || { echo "Skipped $u: the account no longer exists"; continue; }
        case ",$new," in *",$u,"*) continue ;; esac
        new=${new:+$new,}$u; n=$((n + 1)); echo "Restored $u"
      done < <(tail -n +2 "$b")
      if [ "$n" -gt 0 ]; then gpasswd -M "$new" shadow; else echo "Nothing to restore"; fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/group.5.html
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man1/gpasswd.1.html
  - https://man7.org/linux/man-pages/man5/passwd.5.html

notes:
  pl: |
    Wynik NOT_OK podaje członków grupy (members=) i konta, które mają ją
    jako grupę główną (primary=). Naprawa usuwa wszystkich członków jednym
    poleceniem gpasswd -M '' shadow, które zmienia /etc/group
    i /etc/gshadow razem. Kont z grupą główną shadow nie zmienia, bo nie
    wiadomo, jaką grupę im dać: dopóki takie są, kończy się błędem bez
    zmian i trzeba im ręcznie ustawić inną grupę poleceniem usermod -g.
    Procesy, które już działają, zachowują grupę do końca sesji. Wycofanie
    dopisuje z powrotem zapisanych członków, którzy nadal istnieją,
    i zostawia tych, których dopisano w międzyczasie. Test czyta tylko
    /etc/group i /etc/passwd, więc działa bez roota.
  en: |
    The NOT_OK result gives the members of the group (members=) and the
    accounts that have it as the primary group (primary=). The remediation
    removes all members with a single gpasswd -M '' shadow, which changes
    /etc/group and /etc/gshadow together. It does not change accounts with
    shadow as the primary group, because there is no telling which group
    they should get: while there are any, it fails without changes and they
    need another group set by hand with usermod -g. Processes that are
    already running keep the group until the end of their session. Rollback
    adds back the saved members that still exist and keeps those added in
    the meantime. The test only reads /etc/group and /etc/passwd, so it
    works without root.
