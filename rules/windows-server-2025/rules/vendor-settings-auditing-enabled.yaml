  en: |
    The low category said plainly rather than raised for gravity: this rule
    blocks nothing and takes no possibility from an attacker.

    Its value is of another kind, and it is not nothing. A channel down which
    settings arrive from outside the organisation's procedure for changes is
    the place where a record has the greatest point, because a change from
    there leaves nothing else behind.

    The item has a point even where the downloading has been switched off -
    the record will show whether the switching off genuinely works.
