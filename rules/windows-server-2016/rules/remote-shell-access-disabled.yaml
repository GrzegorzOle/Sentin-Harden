id: win2016-remote-shell-access-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Shell
  title:
    pl: Dostęp do powłoki zdalnej wyłączony
    en: Remote shell access disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka możliwość otwarcia na tej maszynie powłoki zdalnej —
    czyli uruchamiania poleceń z innej maszyny, bez pulpitu i bez sesji
    graficznej.

    Powłoka zdalna jest najbardziej bezpośrednią drogą wykonania kodu na
    maszynie, jaką system oferuje. Nie wymaga wgrania pliku, nie zostawia
    narzędzia na dysku, nie otwiera okna, którego ktoś mógłby zobaczyć.
    Wykonanie zaczyna się i kończy w pamięci, a to co po nim zostaje,
    mieści się w dziennikach, o ile ktoś je zbiera.

    Ta sama cecha, która czyni ją wygodną dla zarządzania, czyni ją
    narzędziem pierwszego wyboru dla kogoś, kto zdobył poświadczenie. Ruch
    boczny w sieci — przejście z maszyny przejętej na następną — odbywa się
    dziś właśnie tą drogą częściej niż jakąkolwiek inną, bo nie wymaga
    niczego poza działającym mechanizmem zarządzania zdalnego i ważnym
    kontem.

    Punkt jest poziomu drugiego i słusznie: zamyka drogę, która na wielu
    serwerach jest podstawowym narzędziem pracy. Jego sens leży w maszynach,
    których nie zarządza się zdalnie powłoką — bo tam droga stoi otworem
    bez powodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: bezpośrednie
    wykonanie poleceń na maszynie z ważnym poświadczeniem, bez wgrywania
    czegokolwiek i bez sesji graficznej.
  en: |
    The setting shuts the possibility of opening a remote shell on this machine -
    which is to say of running commands from another machine, with no desktop and no
    graphical session.

    The remote shell is the most direct road to running code on a machine that the
    system offers. It calls for no file to be uploaded, leaves no tool on the disk,
    opens no window anybody might see. The execution begins and ends in memory, and
    what is left of it fits in the logs, where somebody gathers them.

    The same trait that makes it convenient for management makes it a tool of first
    choice for somebody who has obtained a credential. Lateral movement across a
    network - the passing from a taken-over machine to the next - is today done by
    this road more often than by any other, since it calls for nothing but a working
    remote management mechanism and a valid account.

    The item is of the second level, and rightly: it shuts a road that on many
    servers is the chief tool of work. Its point lies in machines not managed
    remotely by a shell - for there the road stands open without reason.

    What an attacker gains while the item goes unmet: the direct running of commands
    on the machine with a valid credential, with nothing uploaded and no graphical
    session.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to jeden z najcięższych
    punktów w całym zestawie serwerowym pod względem skutków, jeśli trafi na
    niewłaściwą maszynę.

    Pytanie rozstrzygające brzmi: czy tą maszyną zarządza się powłoką
    zdalną. Jeżeli tak — punkt odcina zarządzanie, i to nie stopniowo, tylko
    przy pierwszej próbie po zmianie. Odcina przy tym także siebie: jeżeli
    zmianę wprowadzono zdalnie tą właśnie drogą, cofnięcie wymaga dostępu
    inną drogą, której może nie być.

    Wyliczyć trzeba więcej, niż się na pierwszy rzut oka wydaje. Skrypty
    wdrożeniowe i konfiguracyjne uruchamiane z maszyny zarządzającej.
    Automatyzacja zbierająca stan maszyn do raportów. Narzędzia kopii
    zapasowych wywołujące polecenia przed zadaniem i po nim. Systemy
    orkiestracji. Zadania serwisowe uruchamiane raz na kwartał, o których
    nikt nie pamięta — te ujawnią się najpóźniej i najboleśniej.

    Kolejność jest zatem ustalona: najpierw potwierdzenie, że istnieje druga
    droga dostępu do maszyny, potem wyliczenie tego, co łączy się powłoką,
    potem dopiero zmiana — w oknie serwisowym, z gotową decyzją o wycofaniu.

    Czego to nie psuje: pulpitu zdalnego, konsoli lokalnej, zadań
    harmonogramu uruchamianych miejscowo, usług.

    Bez restartu, ale skutek obejmuje wszystkie kolejne połączenia naraz.
  en: |
    The class is "needs a planned rollout", and it is one of the heaviest items in
    the whole server set in its consequences, should it land on the wrong machine.

    The deciding question is whether this machine is managed by a remote shell. If
    so, the item cuts management off, and not by degrees but at the first attempt
    after the change. It cuts itself off along with it: if the change was made
    remotely by that very road, undoing it calls for access by another road, which
    may not exist.

    More has to be enumerated than seems so at first glance. Deployment and
    configuration scripts run from a management machine. Automation gathering the
    state of machines for reports. Backup tools invoking commands before and after a
    job. Orchestration systems. Maintenance jobs run once a quarter that nobody
    remembers - those will show last and most painfully.

    The order is therefore settled: first confirmation that a second road of access
    to the machine exists, then the enumeration of what connects by shell, and only
    then the change - in a service window, with a decision to undo it ready.

    What this does not break: the remote desktop, the local console, scheduled tasks
    run in place, or services.

    No restart, but the effect takes in every further connection at once.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Zarządzanie tą maszyną powłoką zdalną przestaje działać przy pierwszej próbie po zmianie, łącznie z drogą, którą zmianę wprowadzono
      - Skrypty wdrożeniowe, automatyzacja zbierająca stan maszyn i systemy orkiestracji tracą dostęp do maszyny
      - Narzędzia kopii zapasowych wywołujące polecenia przed zadaniem i po nim przestają je wykonywać
      - Pulpit zdalny, konsola lokalna, zadania harmonogramu uruchamiane miejscowo i usługi pozostają bez zmian
    en:
      - Managing this machine by remote shell stops working at the first attempt after the change, the road the change was made by included
      - Deployment scripts, automation gathering the state of machines and orchestration systems lose access to the machine
      - Backup tools invoking commands before and after a job stop running them
      - The remote desktop, the local console, scheduled tasks run in place and services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ta maszyna jest zarządzana powłoką zdalną i nie potwierdzono istnienia drugiej drogi dostępu
      - Nie wyliczono zadań serwisowych uruchamianych rzadziej niż raz na kwartał, które łączą się powłoką zdalną
      - Zmiana miałaby zostać wprowadzona zdalnie tą samą drogą, którą zamyka
    en:
      - This machine is managed by a remote shell and the existence of a second road of access has not been confirmed
      - Maintenance jobs running less often than quarterly that connect by remote shell have not been enumerated
      - The change would be made remotely by the very road it shuts
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
      $name = 'AllowRemoteShellAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
    $name = 'AllowRemoteShellAccess'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service\WinRS'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowRemoteShellAccess' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    Ostrzeżenie o odcięciu drogi, którą wprowadza się zmianę, powinno być
    w aplikacji widoczne przy samym przycisku uruchomienia, a nie w opisie.
    Jest to jeden z nielicznych punktów zdolnych odciąć operatora od
    maszyny w trakcie własnego wykonania.

    Punkt należy do poziomu drugiego i to odzwierciedla jego naturę: nie
    jest zaleceniem powszechnym, tylko domknięciem maszyn, które powłoki
    zdalnej nie używają. Na serwerze zarządzanym powłoką odpuszczenie tego
    punktu jest decyzją poprawną i aplikacja ma dać ją zapisać razem
    z uzasadnieniem.

    Warto odróżnić to ustawienie od wyłączenia samego mechanizmu
    zarządzania zdalnego. Ten punkt zamyka powłokę, czyli uruchamianie
    poleceń, a zostawia mechanizm działający dla innych zastosowań. Jest to
    cięcie węższe i dlatego możliwe tam, gdzie wyłączenie całego mechanizmu
    byłoby nie do przyjęcia.
  en: |
    The warning about cutting off the road the change is made by should be visible
    in the application at the run button itself, not in the description. It is one
    of the few items able to cut the operator off from the machine in the course of
    its own execution.

    The item belongs to the second level and that reflects its nature: it is not a
    general recommendation but the closing up of machines that do not use a remote
    shell. On a server managed by shell, letting this item go is the right decision,
    and the application is to let that be recorded along with its reasons.

    The setting is worth telling apart from the switching off of the remote
    management mechanism itself. This item shuts the shell, which is to say the
    running of commands, and leaves the mechanism working for other uses. It is a
    narrower cut and therefore possible where switching the whole mechanism off
    would be unacceptable.
