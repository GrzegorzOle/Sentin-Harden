id: win2025-non-domain-networks-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connection Manager
  title:
    pl: Zakaz łączenia z siecią spoza domeny przy podłączonej sieci domenowej
    en: Connecting to a non-domain network forbidden while on a domain network
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania maszynie łączyć się z siecią spoza domeny
    w chwili, gdy jest już podłączona do sieci domenowej. Powodem jest
    to, że maszyna stojąca jednocześnie w obu sieciach staje się między
    nimi przejściem — nie przez mostek, lecz po prostu przez to, że
    obie widzi naraz.

    Obniżam tu kategorię względem paczki stanowiska roboczego i podaję
    powód, bo obniżenie wymaga uzasadnienia tak samo jak podniesienie.

    Mechanizm działa przez menedżera połączeń, czyli przez tę część
    systemu, która połączenia nawiązuje: bezprzewodowe, komórkowe,
    wdzwaniane. Karta wpięta kablem na stałe nie jest przez niego
    nawiązywana i ustawienie jej nie dotyczy. Na typowym serwerze
    w serwerowni, gdzie wszystkie karty są wpięte kablem, punkt nie ma
    więc na co działać.

    Wartość wraca tam, gdzie serwer ma radio albo modem. Maszyna
    w oddziale, serwer z łączem zapasowym przez sieć komórkową, sprzęt
    postawiony tymczasowo w miejscu bez okablowania — tam ustawienie
    robi dokładnie to, co obiecuje, i tam trzymałbym ocenę wyżej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: na
    maszynie z kartą radiową albo komórkową możliwość doprowadzenia jej
    do stanu, w którym widzi naraz sieć organizacji i sieć obcą.
  en: |
    The setting forbids the machine to join a net outside the domain at the moment it is already
    joined to a net of the domain. The ground is that a machine standing in both nets at once
    becomes a way between them - not by a bridge but simply by seeing both at once.

    I lower the category here against the working station's pack and give the reason, a lowering
    calling for grounds as much as a raising does.

    The mechanism works by the manager of connections, that is by the part of the system that opens
    connections - wireless, mobile, dialled. A card plugged in by cable for good is not opened by
    it and the setting bears not upon it. On a common server in a server room, where all the cards
    are plugged in by cable, the item has therefore nothing to work upon.

    The worth comes back where a server has a radio or a modem. A machine in a branch, a server
    with a spare link over the mobile net, gear set up for a time in a place with no cabling -
    there the setting does just what it promises, and there I would hold the reckoning higher.

    What an attacker gains while the item goes unmet: on a machine with a radio or mobile card, the
    means of bringing it to a state wherein it sees at once the body's net and a strange one.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy maszyna ma łącze zapasowe, które nawiązuje
    menedżer połączeń — bezprzewodowe, komórkowe albo wdzwaniane.

    Jeżeli nie ma, zmiana nie robi nic i mogłaby iść hurtem. Zostawiam
    ją jednak poza trybem zbiorczym, bo pytanie „czy ta maszyna ma
    radio" nie jest pytaniem, na które tryb zbiorczy umie odpowiedzieć,
    a skutek błędnej odpowiedzi jest dotkliwy.

    Jeżeli ma, to właśnie to łącze przestanie się zestawiać, dopóki
    działa sieć domenowa. Brzmi to niegroźnie, ale trzeba spojrzeć na
    to od strony awarii. Łącze zapasowe jest po to, żeby zadziałało,
    gdy zawiedzie główne — a ustawienie blokuje je dokładnie wtedy, gdy
    główne jeszcze działa. Jeżeli awaria jest częściowa i sieć domenowa
    wygląda na obecną, choć nic przez nią nie przechodzi, zapasowe łącze
    nie wejdzie.

    Jest to rzecz, którą warto sprawdzić na próbę, zanim się na tym
    łączu polegnie.

    Objaw dla użytkownika, jeśli maszyna go ma, jest widoczny: sieć
    spoza domeny pojawia się na liście, ale połączenia nie da się
    nawiązać, a komunikat nie tłumaczy dlaczego.

    Ustawienie wiąże po restarcie usługi menedżera połączeń, a cofa się
    natychmiast.
  en: |
    What needs checking is whether the machine has a spare link opened by the manager of
    connections - wireless, mobile or dialled.

    If it has not, the change does nothing and might go in bulk. I leave it outside the bulk mode
    for all that, the question "has this machine a radio" not being one the bulk mode can answer,
    and the effect of a wrong answer being sore.

    If it has, it is just that link that will stop being set up while the net of the domain works.
    It sounds harmless, but it must be looked at from the side of a fault. A spare link is there to
    work when the chief one fails - and the setting blocks it just while the chief one still works.
    If the fault is partial and the net of the domain looks present though nothing passes by it,
    the spare link will not come in.

    It is a thing worth trying out before that link is leaned upon.

    The symptom for a user, if the machine has one, is plain - a net outside the domain shows in
    the list, but the connection cannot be opened, and the message sets forth no reason.

    The setting binds after a restart of the service of the manager of connections, and is undone
    at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Łącze zapasowe przez sieć komórkową albo bezprzewodową nie zestawi się, dopóki działa sieć domenowa
      - Przy awarii częściowej, gdy sieć domenowa wygląda na obecną, łącze zapasowe nie wejdzie
      - Na maszynie z interaktywnym użytkownikiem sieć spoza domeny widnieje na liście, ale połączenia nie da się nawiązać
      - Karty wpięte kablem na stałe nie są przez ten mechanizm obsługiwane i zmiana ich nie dotyczy
      - Ustawienie wiąże dopiero po restarcie usługi menedżera połączeń
    en:
      - A spare link over the mobile or wireless net will not be set up while the net of the domain works
      - At a partial fault, where the net of the domain looks present, the spare link will not come in
      - On a machine with an interactive user a net outside the domain shows in the list but cannot be joined
      - Cards plugged in by cable for good are not served by this mechanism and the change bears not on them
      - The setting binds only after a restart of the service of the manager of connections
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer ma łącze zapasowe przez sieć komórkową albo bezprzewodową, na którym polega przy awarii
      - Maszyna stoi tymczasowo w miejscu bez okablowania i łączy się siecią spoza domeny
    en:
      - The server has a spare link over the mobile or wireless net that is leaned upon at a fault
      - The machine stands for a time in a place with no cabling and joins by a net outside the domain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
      $name = 'fBlockNonDomain'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    $name = 'fBlockNonDomain'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The mechanism serves connections the manager opens - wireless, mobile,
    # dialled. A card plugged in by cable for good is untouched by it.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fBlockNonDomain' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/networking/

notes:
  pl: |
    Obniżyłem kategorię, bo mechanizm działa przez menedżera połączeń,
    czyli dotyczy połączeń nawiązywanych — bezprzewodowych, komórkowych,
    wdzwanianych. Karta wpięta kablem na stałe nie jest przez niego
    obsługiwana, więc na typowym serwerze w serwerowni punkt nie ma na
    co działać. Na maszynie z radiem albo modemem ocena wraca wyżej.

    Rzecz warta sprawdzenia na próbę: łącze zapasowe jest po to, żeby
    zadziałało przy awarii, a ustawienie blokuje je dopóty, dopóki sieć
    domenowa wygląda na obecną. Przy awarii częściowej te dwa warunki
    rozjeżdżają się na niekorzyść.

    Punkt czyta się razem z ograniczeniem równoczesnych połączeń —
    oba dotyczą tego samego menedżera i obu dotyczy to samo pytanie
    o radio.
  en: |
    I lowered the category, the mechanism working by the manager of connections, that is bearing on
    connections that are opened - wireless, mobile, dialled. A card plugged in by cable for good is
    not served by it, so on a common server in a server room the item has nothing to work upon. On
    a machine with a radio or a modem the reckoning comes back higher.

    A thing worth trying out - a spare link is there to work at a fault, and the setting blocks it
    so long as the net of the domain looks present. At a partial fault those two conditions part to
    one's harm.

    The item is read together with the bounding of connections at once - both bear on the same
    manager and to both the same question about a radio belongs.
