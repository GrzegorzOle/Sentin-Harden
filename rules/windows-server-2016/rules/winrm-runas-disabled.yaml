id: win2016-winrm-runas-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management (WinRM) > WinRM Service
  title:
    pl: Przechowywanie poświadczeń przez usługę zarządzania zdalnego wyłączone
    en: The keeping of credentials by the remote management service switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zarządzania zdalnego przechowywać
    poświadczenia konta, w którego imieniu mają być wykonywane polecenia
    przychodzące do wskazanej konfiguracji sesji.

    Mechanizm ten powstał dla wygody: konfiguracja sesji może działać
    w imieniu konta o uprawnieniach wyższych niż uprawnienia łączącego się,
    żeby dało się dopuścić kogoś do wąskiego zestawu czynności bez
    nadawania mu pełnych praw. Żeby to było możliwe, hasło tego konta musi
    być gdzieś przechowane — i jest przechowywane na maszynie.

    Stąd bierze się kłopot. Hasło konta uprzywilejowanego leży na maszynie
    w postaci nadającej się do użycia, a maszyna ta jest osiągalna zdalnie.
    Napastnik, który uzyska na niej uprawnienia administratora, dostaje nie
    tylko tę maszynę, ale i konto, którego używa ona do pracy gdzie indziej.

    Drugi skutek jest cichszy i dotyczy rozliczalności. Polecenia wykonane
    w takiej sesji zapisują się jako wykonane przez konto przechowane, nie
    przez tego, kto się połączył. Dziennik przestaje mówić, kto co zrobił.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: poświadczenia
    konta uprzywilejowanego przechowane na maszynie oraz możliwość działania
    pod cudzą tożsamością w zapisach.
  en: |
    The setting forbids the remote management service to keep the credentials of an
    account on whose behalf commands arriving at a named session configuration are
    to be run.

    That mechanism came about for convenience: a session configuration can act on
    behalf of an account with rights higher than the connecting party's, so that
    somebody may be let in to a narrow set of acts without being given full rights.
    For that to be possible the account's password has to be kept somewhere - and it
    is kept on the machine.

    From there comes the trouble. The password of a privileged account lies on the
    machine in a form fit for use, and that machine is reachable remotely. An
    attacker who gains administrator rights on it gets not only that machine but the
    account it uses to work elsewhere.

    The second consequence is quieter and concerns accountability. Commands run in
    such a session are written down as run by the kept account and not by whoever
    connected. The log stops saying who did what.

    What an attacker gains while the item goes unmet: the credentials of a
    privileged account kept on the machine, and the means of acting under another's
    identity in the records.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie
    istnieje konfiguracja sesji korzystająca z tego mechanizmu.

    Na większości serwerów nie istnieje i wdrożenie nie zmienia nic.
    Mechanizm jest używany świadomie i rzadko, więc jego obecność zwykle
    oznacza, że ktoś go tu postawił z zamysłem.

    Zamysłem tym bywa delegowanie wąskiego zakresu czynności: operator ma
    móc zrestartować usługę, nie mając prawa robić niczego innego. Jest to
    rozwiązanie sensowne i wdrożenie tego punktu je psuje — konfiguracja
    sesji przestanie działać, a operator przestanie móc cokolwiek zrobić.

    Warto jednak powiedzieć, że istnieje droga lepsza, osiągająca ten sam
    cel bez przechowywania hasła: konfiguracja sesji o ograniczonym
    zestawie poleceń, działająca na koncie wirtualnym tworzonym na czas
    sesji. Właściwą odpowiedzią przy istniejącej konfiguracji jest więc
    przeniesienie jej na tę drogę, a nie odpuszczenie punktu.

    Objaw jest jednoznaczny: próba połączenia z taką konfiguracją kończy
    się błędem mówiącym o braku poświadczeń.

    Czego to nie psuje: zwykłych sesji zarządzania zdalnego, konfiguracji
    sesji niekorzystających z tego mechanizmu, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether a session
    configuration using that mechanism exists on the machine.

    On most servers none exists and the rollout changes nothing. The mechanism is
    used deliberately and seldom, so its presence as a rule means somebody set it up
    here with a purpose.

    That purpose is at times the delegating of a narrow set of acts: an operator is
    to be able to restart a service without the right to do anything else. That is a
    sensible arrangement, and rolling this item out spoils it - the session
    configuration will stop working and the operator will stop being able to do
    anything at all.

    Worth saying, though, that a better road exists, reaching the same end without a
    password being kept: a session configuration with a limited set of commands,
    running on a virtual account made for the session's duration. The proper answer
    at an existing configuration is therefore to move it onto that road rather than
    to let the item go.

    The symptom is unambiguous: an attempt to connect to such a configuration ends
    in an error speaking of credentials wanting.

    What this does not break: ordinary remote management sessions, session
    configurations not using that mechanism, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Konfiguracja sesji działająca w imieniu przechowanego konta przestaje działać, a próba połączenia kończy się błędem o braku poświadczeń
      - Operator dopuszczony przez taką konfigurację do wąskiego zestawu czynności przestaje móc wykonać cokolwiek
      - Na maszynie bez takiej konfiguracji nie zmienia się nic, bo mechanizm jest używany rzadko i świadomie
      - Zwykłe sesje zarządzania zdalnego, usługi i logowanie pozostają bez zmian
    en:
      - A session configuration acting on behalf of a kept account stops working, and an attempt to connect ends in an error about credentials wanting
      - An operator let in by such a configuration to a narrow set of acts stops being able to do anything at all
      - On a machine without such a configuration nothing changes, the mechanism being used seldom and deliberately
      - Ordinary remote management sessions, services and signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa konfiguracja sesji delegująca czynności operatorom i nie przeniesiono jej na konto wirtualne
      - Narzędzie zewnętrzne łączy się z tą maszyną przez konfigurację sesji opartą na przechowanym koncie
    en:
      - A session configuration delegating acts to operators runs on the machine and has not been moved onto a virtual account
      - An outside tool connects to this machine through a session configuration resting on a kept account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'DisableRunAs'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'DisableRunAs'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRunAs' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/scripting/security/remoting/jea/overview

notes:
  pl: |
    Punkt jest jedyny w tym bloku, który nie dotyczy zapisu, a znalazł się
    tu przez drugi ze swoich skutków: przywraca dziennikowi zdolność
    mówienia, kto co zrobił. Warto tę dwoistość pokazać, bo z jednej strony
    chroni hasło, a z drugiej rozliczalność.

    Rzecz warta postawienia wprost: punkt nie odbiera możliwości
    delegowania uprawnień. Odbiera jeden sposób jej osiągnięcia — ten,
    który wymaga przechowania hasła. Sposób drugi, oparty na koncie
    tworzonym na czas sesji, pozostaje i jest lepszy pod każdym względem.
    Aplikacja powinna o tym mówić, bo inaczej odpuszczenie punktu wygląda
    na jedyne wyjście.

    Kategoria wysoka bierze się z tego, że przechowane hasło jest hasłem
    konta uprzywilejowanego, a maszyna je przechowująca jest osiągalna
    zdalnie. Jest to skrót od przejęcia jednej maszyny do przejęcia
    uprawnień działających na wielu.
  en: |
    The item is the only one in this block not concerned with recording, and it
    found its place here through the second of its effects: it gives the log back
    the ability to say who did what. That doubleness is worth showing, it guarding a
    password on one side and accountability on the other.

    A thing worth putting outright: the item does not take away the possibility of
    delegating rights. It takes away one way of reaching it - the one calling for a
    password to be kept. The second way, resting on an account made for the
    session's duration, remains and is better in every respect. The application
    should say so, since otherwise letting the item go looks like the only way out.

    The high category comes from the kept password being that of a privileged
    account, and the machine keeping it being reachable remotely. It is a short cut
    from the seizing of one machine to the seizing of rights at work on many.
