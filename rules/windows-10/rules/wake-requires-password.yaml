id: win10-wake-requires-password

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Power Management > Sleep Settings
  title:
    pl: Wybudzenie ze snu wymaga podania hasła
    en: Waking from sleep requires a password
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Laptop zamknięty i schowany do torby jest maszyną uśpioną, a nie wyłączoną.
    Jeżeli wybudzenie nie wymaga hasła, to otwarcie pokrywy wystarcza, żeby
    znaleźć się w cudzej sesji ze wszystkimi otwartymi dokumentami i zalogowanymi
    aplikacjami.

    To jest najczęstszy sposób, w jaki sprzęt skradziony albo zostawiony w hotelu
    oddaje zawartość. Szyfrowanie dysku niczego tu nie broni, bo system już
    wystartował i klucze są w pamięci — sprzęt oddaje dane sam, bez żadnego ataku.

    Wymaganie hasła przy wybudzeniu przywraca sens wszystkim pozostałym
    zabezpieczeniom stanowiska przenośnego.
  en: |
    A laptop closed and put in a bag is a machine asleep, not switched off. If
    waking it calls for no password, then opening the lid is enough to land in
    somebody else s session with every open document and signed-in application.

    That is the commonest way hardware stolen or left in a hotel gives up its
    contents. Disk encryption defends nothing here, because the system has already
    started and the keys are in memory - the hardware hands the data over by
    itself, with no attack at all.

    Requiring a password on waking restores the point of every other safeguard on
    a portable station.

disruption_description:
  pl: |
    Koszt sprowadza się do podania hasła przy otwarciu pokrywy, co i tak jest
    odruchem większości ludzi. Nie wymaga przerwy, nie zmienia zachowania
    uśpienia ani czasu wybudzania.

    Sprawdzić trzeba maszyny w miejscach bez obsługi, wybudzane zdalnie albo
    harmonogramem: tam po wybudzeniu nikt nie poda hasła i sesja pozostanie
    zablokowana. Jeżeli coś ma po wybudzeniu działać, musi działać jako usługa,
    a nie w sesji użytkownika.
  en: |
    The cost comes down to entering a password on opening the lid, which is the
    reflex of most people anyway. It calls for no interruption and alters neither
    the sleep behaviour nor the time it takes to wake.

    Machines in unattended places need checking, woken remotely or on a schedule -
    there nobody enters a password after waking and the session stays locked. If
    something is meant to work after waking, it has to work as a service rather
    than in a user session.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Wybudzenie maszyny ze snu będzie wymagało podania hasła, także po otwarciu pokrywy laptopa
      - Maszyny w miejscach bez obsługi wybudzane zdalnie albo harmonogramem zostaną z sesją zablokowaną
      - Zadania działające w sesji użytkownika po wybudzeniu nie ruszą, dopóki ktoś się nie zaloguje
      - Stanowiska pokazowe wybudzane ruchem osoby przed ekranem stracą płynność działania
      - Sam mechanizm uśpienia, czas wybudzania, otwarte pliki i połączenia sieciowe pozostają bez zmian
    en:
      - Waking the machine from sleep calls for a password, including after opening a laptop lid
      - Machines in unattended places woken remotely or on a schedule are left with a locked session
      - Tasks running in a user session after waking do not start until somebody signs in
      - Demonstration stations woken by the movement of a person in front of the screen lose their smoothness
      - The sleep mechanism itself, the time it takes to wake, open files and network connections are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyny w miejscach bez obsługi, od których oczekuje się gotowej sesji po wybudzeniu
      - Stanowiska pokazowe i ekrany informacyjne wybudzane obecnością osoby przed sprzętem
    en:
      - Machines in unattended places, expected to have a ready session after waking
      - Demonstration stations and information screens woken by the presence of a person in front of the hardware
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # One setting in two power variants. The report gives the weaker of them,
      # because the machine is protected only as far as the worse variant
      # protects it - a laptop moves between the two by itself anyway.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $ac = $item.ACSettingIndex
        $dc = $item.DCSettingIndex
        if ($null -eq $ac -or $null -eq $dc) { 'MISSING' }
        elseif ([int]$ac -eq 1 -and [int]$dc -eq 1) { 'REQUIRED' }
        else { 'AC=' + $ac + ' DC=' + $dc }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      ac          = $item.ACSettingIndex
      dc          = $item.DCSettingIndex
      ac_existed  = ($null -ne $item.ACSettingIndex)
      dc_existed  = ($null -ne $item.DCSettingIndex)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ACSettingIndex' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DCSettingIndex' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.ac_existed) {
      Set-ItemProperty -Path $b.path -Name 'ACSettingIndex' -Value $b.ac -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'ACSettingIndex' -ErrorAction SilentlyContinue
    }
    if ($b.dc_existed) {
      Set-ItemProperty -Path $b.path -Name 'DCSettingIndex' -Value $b.dc -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DCSettingIndex' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/customize/power-settings/sleep-settings

notes:
  pl: |
    Jedno ustawienie ma dwa warianty: dla zasilania sieciowego i bateryjnego.
    Sprawdzenie zgłasza słabszy z nich, bo maszyna jest chroniona tylko na tyle,
    na ile chroni ją wariant gorszy — laptop i tak przechodzi między nimi
    samoczynnie. Wartości obu wariantów raport wypisuje wprost, żeby było widać,
    który z nich zawodzi.
  en: |
    One setting has two variants - for mains and for battery power. The check
    reports the weaker of them, because the machine is protected only as far as
    the worse variant protects it; a laptop moves between them by itself anyway.
    The report writes out both values, so that it is visible which of them fails.
