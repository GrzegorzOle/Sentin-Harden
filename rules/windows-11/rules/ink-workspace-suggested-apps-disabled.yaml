id: win11-ink-workspace-suggested-apps-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Ink Workspace
  title:
    pl: Podpowiadanie aplikacji w obszarze pisma odręcznego wyłączone
    en: Suggestion of applications in the handwriting workspace switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z obszaru pisma odręcznego pasek z podpowiadanymi
    aplikacjami do pobrania.

    Podpowiedzi nie są spisem programów zainstalowanych na maszynie. Są
    materiałem przychodzącym z zewnątrz i zmieniającym się w czasie —
    wyborem, którego nie ustala ani administrator, ani użytkownik. Pasek
    prowadzi wprost do sklepu z aplikacjami.

    Waga punktu jest niewielka i warto to powiedzieć wprost zamiast
    dorabiać mu znaczenie. Nie jest to droga wejścia do systemu. Sens reguły
    leży gdzie indziej: na stanowisku roboczym treść wyświetlana przez system
    nie powinna pochodzić ze źródła zewnętrznego, którego nikt w organizacji
    nie kontroluje, a instalowanie oprogramowania nie powinno zaczynać się
    od podpowiedzi w rogu ekranu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    bezpośrednio. Pośrednio — kolejne miejsce, w którym użytkownik
    przyzwyczaja się do klikania w propozycje przychodzące z sieci, a to
    przyzwyczajenie jest tym, co ataki na człowieka wykorzystują.

    Wartość reguły jest głównie w spójności: maszyna ma pokazywać to, co
    postanowiono, a nie to, co akurat przyszło.
  en: |
    The setting removes from the handwriting workspace the strip of suggested applications
    to fetch.

    The suggestions are not a list of the programs installed on the machine. They are
    material coming from outside and changing over time - a choice settled neither by the
    administrator nor by the user. The strip leads straight to the application store.

    The item's weight is slight and it is worth saying so outright rather than inventing
    significance for it. It is not a road into the system. The rule's sense lies elsewhere:
    at a working station the content shown by the system should not come from an outside
    source nobody in the organisation controls, and installing software should not begin
    with a suggestion in the corner of the screen.

    What an attacker gains while the item goes unmet: little directly. Indirectly - one
    more place where the user grows used to clicking on proposals arriving from the
    network, and that habit is what attacks on people make use of.

    The rule's value lies chiefly in consistency: the machine is to show what was settled
    rather than what happened to arrive.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji, z której ktoś pracuje.

    Obszar pisma odręcznego działa dalej. Tablica, wycinek ekranu i rysowanie
    piórem pozostają bez zmiany; znika wyłącznie pasek z propozycjami
    aplikacji do pobrania.

    Użytkownik korzystający z pióra może zauważyć, że rogu ekranu ubyło —
    i na tym skutek się kończy. Nic nie przestaje działać, nic nie wymaga
    innego sposobu pracy.

    Na maszynie bez pióra i bez ekranu dotykowego zmiana jest całkowicie
    niewidoczna.

    Zmiana nie wymaga restartu ani wylogowania i cofa się natychmiast.
  en: |
    The change takes away no function anyone works with.

    The handwriting workspace goes on working. The whiteboard, the screen snip and drawing
    with a pen stay unchanged; what vanishes is the strip of proposed applications to fetch
    alone.

    A user working with a pen may notice that the corner of the screen has lost something -
    and there the effect ends. Nothing stops working, nothing takes a different way of
    working.

    On a machine with no pen and no touch screen the change is wholly invisible.

    The change takes no restart nor signing out and reverses at once.

implementation_consequences:
  impact_areas:
    - user-interface
  what_breaks:
    pl:
      - Pasek z podpowiadanymi aplikacjami znika z obszaru pisma odręcznego
      - Tablica, wycinek ekranu i rysowanie piórem działają bez zmiany
      - Aplikacje już zainstalowane pozostają dostępne tak jak dotąd
      - Na maszynie bez pióra zmiana jest całkowicie niewidoczna
    en:
      - The strip of suggested applications vanishes from the handwriting workspace
      - The whiteboard, the screen snip and drawing with a pen work unchanged
      - Applications already installed stay available as until now
      - On a machine with no pen the change is wholly invisible
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowSuggestedAppsInWindowsInkWorkspace'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    $current = (Get-ItemProperty -Path $path -Name 'AllowSuggestedAppsInWindowsInkWorkspace' -ErrorAction SilentlyContinue).'AllowSuggestedAppsInWindowsInkWorkspace'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowSuggestedAppsInWindowsInkWorkspace'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\WindowsInkWorkspace'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowSuggestedAppsInWindowsInkWorkspace' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-windows-ink-workspace

notes:
  pl: |
    Reguła tworzy parę z tą, która ogranicza dostęp do obszaru pisma
    odręcznego nad ekranem blokady. Tamta dotyczy tego, co da się zrobić na
    maszynie zablokowanej, ta — tego, co obszar pokazuje w sesji otwartej.
    Obie leżą w tym samym kluczu, więc wycofanie jednej nie rusza drugiej.

    Reguła należy do klasy bez uciążliwości i nadaje się do trybu zbiorczego.
    Kategoria ryzyka jest niska i taka ma być — nie każdy punkt benchmarku
    zdejmuje realne zagrożenie, a udawanie inaczej psuje kolejność pracy
    z listą.

    Brak wartości nie jest stanem zgodnym, bo domyślnie podpowiedzi są
    pokazywane.
  en: |
    The rule forms a pair with the one limiting access to the handwriting workspace above
    the lock screen. That one concerns what can be done on a locked machine, this one what
    the workspace shows in an open session. Both lie in the same key, so rolling one back
    does not disturb the other.

    The rule belongs to the class without disruption and suits the bulk mode. The risk
    category is low and is meant to be - not every item of the benchmark takes away a real
    threat, and pretending otherwise spoils the order of work with the list.

    A missing value is not a compliant state, since by default the suggestions are shown.
