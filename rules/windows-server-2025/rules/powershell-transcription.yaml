description:
  pl: |
    Punkt włącza zapisywanie przebiegu sesji interpretera poleceń do
    pliku: zarówno tego, co wpisano, jak i tego, co zostało odpowiedziane.

    Zostawiam kategorię średnią, tak jak przy pozostałych punktach
    o rejestrowaniu, ale chcę wyłożyć, co ten zapis dokłada do dwóch
    poprzednich, bo trzy punkty o tym samym brzmieniu kuszą, żeby uznać
    je za powtórzenie.

    Wiersz polecenia mówi, co uruchomiono. Blok skryptu mówi, co zostało
    wykonane. Zapis przebiegu sesji mówi jako jedyny, co z tego wyszło —
    zawiera wynik, czyli dane, które polecenie zwróciło. Jest to
    różnica jakościowa: dwa poprzednie punkty opisują działanie, ten
    opisuje jego skutek. Przy badaniu incydentu odpowiada na pytanie,
    którego tamte nie obejmują: co napastnik zobaczył. Czy jego zapytanie
    do katalogu coś zwróciło, czy lista udziałów była pusta, czy
    poświadczenie zadziałało.

    Na serwerze ma to szczególną wagę, bo praca administracyjna odbywa
    się tu w przytłaczającej większości przez powłokę, a nie przez okna.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność,
    że nawet przy pełnym zapisie wykonanych poleceń nikt nie odtworzy,
    co te polecenia mu pokazały — a to jest zwykle najważniejsza część
    ustalenia, co wyciekło.
  en: |
    The item switches on the writing down of the run of a session of the reader of biddings into a
    file - both what was typed in and what was answered back.

    I leave the category middling, as at the other items upon writing, but would set out what that
    writing adds to the two before it, three items of the same sound tempting one to hold them for a
    saying over.

    The line of bidding says what was started. The block of script says what was run. The writing of
    the run of a session says, alone of the three, what came of it - it holds the outcome, that is, the
    data the bidding gave back. It is an unlikeness of kind - the two items before tell of a doing,
    this one tells of its outcome. At the looking into a breaking it answers the question the others
    take not in - what did the attacker see. Did their asking of the roll give anything back, was the
    list of shares empty, did the token work.

    Upon a server this weighs the more, the work of ruling here befalling in the overwhelming most of
    cases through the shell and not through windows.

    What an attacker gains while the item goes unmet - the surety that even at a full writing of the
    biddings run nobody will make again what those biddings showed them - and that is mostly the
    weightiest share of the settling of what leaked out.

disruption_description:
  pl: |
    Podnoszę klasę wobec oceny dla stacji roboczej do „wymaga świadomego
    wdrożenia" i rozdzielam ten punkt od sąsiedniego o blokach skryptu,
    choć brzmią podobnie. Powód jest w tym, gdzie ten zapis ląduje.

    Bloki skryptu idą do dziennika zdarzeń, który ma z góry ustalony
    rozmiar i nadpisuje się sam. Przebieg sesji idzie do plików: po
    jednym na sesję, w katalogu, który sam się nie sprząta i rośnie bez
    żadnej granicy. Na serwerze, gdzie sesje powłoki otwierają się
    z harmonogramu co minutę, znaczy to dziesiątki tysięcy plików
    miesięcznie. Katalog domyślny — folder dokumentów użytkownika —
    jest na serwerze wyborem po prostu złym, bo rozsypuje zapis po
    profilach kont usługowych.

    Do tego dochodzi rzecz ważniejsza od objętości. Skoro przebieg sesji
    zawiera wynik poleceń, to zawiera dane, które te polecenia czytały.
    Zapytanie do bazy z danymi osobowymi zostawia te dane w pliku.
    Odczyt konfiguracji z hasłem zostawia hasło. Powstaje więc katalog,
    który trzeba chronić tak samo jak to, co maszyna przetwarza —
    a bardzo łatwo o nim zapomnieć, bo wygląda na dziennik techniczny.

    Dlatego kolejność: najpierw wskazuje się katalog docelowy poza
    profilami, nadaje mu uprawnienia odpowiadające wrażliwości danych na
    tej maszynie i ustala, kto go sprząta i po jakim czasie. Dopiero
    potem włącza się zapis. Punkt włączony bez tych trzech rozstrzygnięć
    zapełnia dysk i tworzy nowe miejsce z danymi, którego nikt nie
    pilnuje.

    Zmiana nie wymaga przerwy i cofa się natychmiast, ale pliki już
    zapisane zostają na dysku i trzeba je usunąć osobno.
  en: |
    I raise the class against the reckoning for a workstation to "needs a witting rolling out" and
    sunder that item from the one beside it upon blocks of script, though they sound alike. The ground
    lies in where that writing comes to land.

    Blocks of script go into a log of happenings that has a size set beforehand and writes itself over
    of itself. The run of a session goes into files - one to a session, in a stead that tidies not
    itself and grows without any bound. Upon a server, where sessions of the shell open off a timetable
    every minute, that means tens of thousands of files in a month. The stead set by default - the
    folder of a user's writings - is upon a server a choosing plainly bad, it scattering the writing
    among the settings of the standings of workings.

    There comes to that a thing weightier than bulk. Since the run of a session holds the outcome of
    the biddings, it holds the data those biddings read. An asking of a hoard with the data of persons
    leaves that data in a file. A reading of a setting-up with a watchword leaves the watchword. There
    rises therefore a stead that must be warded just as what the machine works upon - and it is very
    easy to forget it, it looking like a log of craft.

    Therefore the ordering - first a stead is named outside the settings, leaves are given it answering
    to the tenderness of the data upon that machine, and it is settled who tidies it and after what
    time. Only then is the writing switched on. The item switched on without those three settlings
    fills the disk and makes a new stead holding data that nobody watches over.

    The change takes no break and is undone at once, but the files already written stay upon the disk
    and must be done away with on their own.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - scripting-and-automation
  what_breaks:
    pl:
      - Powstaje po jednym pliku na sesję w katalogu, który sam się nie sprząta i rośnie bez żadnej granicy
      - Na serwerze z sesjami otwieranymi z harmonogramu co minutę daje to dziesiątki tysięcy plików miesięcznie
      - Katalog domyślny jest folderem dokumentów użytkownika, więc zapis rozsypuje się po profilach kont usługowych
      - Pliki zawierają wynik poleceń, czyli dane, które te polecenia czytały, łącznie z hasłami i danymi osobowymi
      - Cofnięcie zmiany nie usuwa plików już zapisanych i trzeba je skasować osobno
    en:
      - There rises one file to a session in a stead that tidies not itself and grows without any bound
      - Upon a server with sessions opened off a timetable every minute that gives tens of thousands of files in a month
      - The stead set by default is the folder of a user's writings, so the writing scatters among the settings of the standings of workings
      - The files hold the outcome of the biddings, that is, the data those biddings read, watchwords and the data of persons among them
      - The undoing of the change does not do away with the files already written and they must be wiped on their own
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie wskazano katalogu docelowego poza profilami ani nie ustalono jego uprawnień i zasad sprzątania
      - Na maszynie brakuje zapasu na woluminie, na którym miałyby lądować pliki z przebiegiem sesji
    en:
      - No stead was named outside the settings, nor were its leaves and the rules of its tidying settled
      - Upon the machine there is no store upon the roll whereon the files with the run of the sessions would land
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
      $name = 'EnableTranscripting'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
    $name = 'EnableTranscripting'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Name an output directory outside user profiles, give it permissions
    # matching the sensitivity of the data on this machine and settle who
    # clears it and after how long - the transcripts hold command output, so
    # they hold whatever the commands read.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableTranscripting' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_group_policy_settings

