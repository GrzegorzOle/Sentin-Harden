id: win10-bitlocker-os-drive

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption
  title:
    pl: Szyfrowanie dysku systemowego włączone
    en: System drive encryption enabled
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie szyfruje dysk, na którym stoi system.

    Punkt ten odpowiada na jedno pytanie: co się dzieje, gdy maszyna
    przestaje być pod kontrolą właściciela. Dysk wyjęty z obudowy
    i podłączony do innej maszyny oddaje wszystko, co na nim leży —
    dokumenty, pliki poczty, zapisane hasła przeglądarki, bazę
    poświadczeń systemu. Żadne uprawnienie ustawione w systemie nie ma
    wtedy znaczenia, bo systemu nikt nie uruchamia.

    Dotyczy to komputera przenośnego skradzionego z samochodu, ale też
    dysku oddanego do serwisu, dysku wymienionego na gwarancji i maszyny
    wycofanej z użycia bez wyczyszczenia. Jest to jedyna reguła w tej
    paczce, która działa po tym, jak maszyna fizycznie wyszła z rąk.

    Odnotowuję, że reguła nie ma przycisku uruchomienia. Włączenie
    szyfrowania jest operacją, która bez zabezpieczonego klucza
    odzyskiwania potrafi odciąć dostęp do danych bezpowrotnie — i nie jest
    to sytuacja, którą powinna wywoływać aplikacja jednym kliknięciem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: całą
    zawartość dysku po fizycznym dostępie do maszyny, bez łamania
    czegokolwiek.
  en: |
    The setting enciphers the disk the system stands upon.

    This item answers one question: what happens when a machine ceases to be under its owner's hand. A disk taken
    out of its case and plugged into another machine gives up everything lying upon it - documents, files of
    post, the browser's saved passwords, the system's store of credentials. No right set within the system then
    counts, nobody starting the system.

    That touches a portable computer stolen from a car, but likewise a disk given in for repair, a disk changed
    under warranty and a machine taken out of use without a wiping. It is the one rule in this pack that works
    after the machine has physically left one's hands.

    I set down that the rule has no button of running. The switching on of encryption is an operation that without
    a secured key of recovery can cut the way to the data off past recall - and it is no case an application ought
    to bring about by one click.

    What an attacker gains while the item goes unmet: the disk's whole contents upon physical reach of the
    machine, with nothing broken.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to jedna z niewielu reguł,
    przy których niewłaściwa kolejność kończy się utratą danych.

    Warunkiem pierwszym jest klucz odzyskiwania zabezpieczony poza tą
    maszyną. Bez niego każda zmiana w konfiguracji rozruchu —
    aktualizacja oprogramowania układowego, zmiana kolejności rozruchu,
    wymiana płyty — potrafi zatrzymać maszynę na ekranie proszącym
    o klucz, którego nikt nie ma.

    Szyfrowanie początkowe trwa od kilkudziesięciu minut do kilku godzin
    i przez ten czas maszyna pracuje wolniej. Idzie w tle i nie wymaga
    przerwy, ale uruchomienia szyfrowania nie planuje się na godzinę
    przed prezentacją.

    Po włączeniu zmienia się obsługa serwisowa. Dysk oddany do naprawy
    jest nieczytelny dla serwisu, odzyskiwanie danych z uszkodzonego
    nośnika staje się niemożliwe bez klucza, a rozruch z nośnika
    zewnętrznego wymaga wstrzymania ochrony.

    Odnotowuję wymagania sprzętowe: moduł zaufanego przetwarzania oraz
    wydanie systemu obsługujące szyfrowanie. Maszyna bez modułu wymaga
    kodu wpisywanego przy każdym starcie, co jest zupełnie inną rozmową.

    Czego to nie psuje: pracy z plikami, wydajności po zakończeniu
    szyfrowania, logowania, udziałów plikowych, drukowania.
  en: |
    The class is "needs a planned rollout", and it is one of the few rules at which a wrong order ends in the loss
    of data.

    The first condition is a key of recovery secured away from this machine. Without it every change in the
    setting up of the start - an update of the firmware, a change of the order of starting, an exchange of the
    board - can hold the machine upon a screen asking for a key nobody has.

    The first enciphering takes from some tens of minutes to some hours, and through that time the machine works
    the slower. It goes on in the background and calls for no break, but the starting of the enciphering is not
    planned for an hour before a presentation.

    Once it is switched on the handling of repairs changes. A disk given in for mending is unreadable to the
    workshop, the winning back of data from a broken drive becomes impossible without the key, and a start from an
    outside drive calls for the guarding to be held off.

    I set down the requirements of the gear: a module of trusted reckoning and an edition of the system that
    handles encryption. A machine without the module calls for a code typed at every start, which is another
    conversation entirely.

    What this does not break: work with files, speed once the enciphering has ended, logging on, file shares, or
    printing.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
    - drivers-and-devices
  what_breaks:
    pl:
      - Zmiana konfiguracji rozruchu zatrzymuje maszynę na ekranie proszącym o klucz odzyskiwania
      - Dysk oddany do naprawy jest dla serwisu nieczytelny, a odzyskiwanie danych z uszkodzonego nośnika wymaga klucza
      - Rozruch z nośnika zewnętrznego wymaga wstrzymania ochrony, więc procedury serwisowe trzeba zmienić
      - Szyfrowanie początkowe trwa od kilkudziesięciu minut do kilku godzin i maszyna pracuje przez ten czas wolniej
      - Praca z plikami, wydajność po zakończeniu szyfrowania, logowanie i drukowanie pozostają bez zmian
    en:
      - A change in the setting up of the start holds the machine upon a screen asking for the key of recovery
      - A disk given in for mending is unreadable to the workshop, and the winning back of data from a broken drive calls for the key
      - A start from an outside drive calls for the guarding to be held off, so the workshop s procedures have to change
      - The first enciphering takes from some tens of minutes to some hours and the machine works the slower through that time
      - Work with files, speed once the enciphering has ended, logging on and printing stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Klucze odzyskiwania nie mają gdzie zostać zabezpieczone poza maszyną, a bez nich zmiana rozruchu odcina dane
      - Maszyna nie ma modułu zaufanego przetwarzania i szyfrowanie wymagałoby kodu wpisywanego przy każdym starcie
    en:
      - The keys of recovery have nowhere to be secured away from the machine, and without them a change of the start cuts the data off
      - The machine has no module of trusted reckoning and encryption would call for a code typed at every start
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $volume = Get-BitLockerVolume -MountPoint $env:SystemDrive -ErrorAction Stop
      if ($null -eq $volume) { 'CHECK_ERROR' } else { [string]$volume.ProtectionStatus }
    } catch {
      # Reading BitLocker state needs elevation, and the feature is absent from
      # some editions. Neither case may be reported as an encrypted drive.
      'CHECK_ERROR'
    }
  expected: 'On'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $volume = Get-BitLockerVolume -MountPoint $env:SystemDrive
    [pscustomobject]@{
      mount_point       = $volume.MountPoint
      protection_status = [string]$volume.ProtectionStatus
      volume_status     = [string]$volume.VolumeStatus
      key_protectors    = @($volume.KeyProtector | ForEach-Object { [string]$_.KeyProtectorType })
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Store the recovery key somewhere off this machine BEFORE going further.
    # Without it, a boot configuration change can leave the data unreachable.
    $drive = $env:SystemDrive
    Add-BitLockerKeyProtector -MountPoint $drive -RecoveryPasswordProtector
    (Get-BitLockerVolume -MountPoint $drive).KeyProtector |
      Where-Object { $_.KeyProtectorType -eq 'RecoveryPassword' } |
      Select-Object -Property KeyProtectorId, RecoveryPassword |
      Format-List
    Enable-BitLocker -MountPoint $drive -TpmProtector -SkipHardwareTest

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła otwiera blok o szyfrowaniu dysku i jest w nim warunkiem
    wszystkich pozostałych. Punkty o rodzaju szyfrowania, o sposobie
    odzyskiwania i o uwierzytelnieniu przy starcie opisują, jak ma
    wyglądać szyfrowanie — ale nie włączają go.

    Argument wart postawienia wprost dotyczy zasięgu w czasie. Wszystkie
    inne reguły tej paczki działają, dopóki maszyna pracuje. Ta działa
    potem: po kradzieży, po oddaniu do serwisu, po wycofaniu sprzętu
    z użycia. Jest to jedyna ochrona obejmująca dysk, który przestał być
    częścią czyjejkolwiek infrastruktury.

    Odnotowuję brak przycisku uruchomienia, bo jest decyzją, a nie
    niedoróbką. Włączenie szyfrowania bez zabezpieczonego klucza
    odzyskiwania potrafi odciąć dane bezpowrotnie, a odwrócenie tej
    operacji nie polega na cofnięciu wpisu w rejestrze. Polecenie jest
    gotowe do skopiowania i to jest właściwy tryb dla tej reguły.
  en: |
    The rule opens the block about the enciphering of a disk and is in it the condition of all the rest. The items
    about the kind of enciphering, about the way of recovery and about the authentication at the start set out how
    the enciphering is to look - but do not switch it on.

    The argument worth putting outright touches reach in time. Every other rule of this pack works while the
    machine runs. This works afterwards: after a theft, after a giving in for repair, after gear is taken out of
    use. It is the one guarding that takes in a disk that has ceased to be part of anybody's estate.

    I set down the want of a button of running, it being a decision and not a shortcoming. The switching on of
    encryption without a secured key of recovery can cut the data off past recall, and the undoing of that
    operation does not rest upon the taking back of an entry in the registry. The command is ready to be copied,
    and that is the fitting mode for this rule.
