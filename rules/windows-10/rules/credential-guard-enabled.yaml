id: win10-credential-guard-enabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Ochrona poświadczeń oparta na wirtualizacji uruchomiona
    en: The guarding of credentials grounded upon virtualisation running
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie uruchamia ochronę, w której poświadczenia zalogowanych osób
    przechowuje osobne środowisko, odcięte od systemu mechanizmem
    wirtualizacji sprzętowej.

    Wszystkie pozostałe reguły tego bloku utrudniają sięgnięcie po
    poświadczenia albo je odnotowują. Ta zmienia miejsce, w którym
    poświadczenia leżą. Napastnik z uprawnieniami administratora na tej
    maszynie nadal ma pełnię władzy nad systemem — i nadal nie sięga do tego
    środowiska, bo leży ono poza systemem.

    Jest to zabezpieczenie o innym charakterze niż reszta paczki: nie
    zamyka drogi, tylko przenosi cel poza jej zasięg.

    Rzecz warta odnotowania: ochrona wymaga sprzętu. Wirtualizacja musi być
    dostępna i włączona w oprogramowaniu układowym, a sterowniki muszą być
    zgodne. Zapisanie ustawień nie jest więc równoznaczne z uruchomieniem
    ochrony, dlatego sprawdzenie pyta o stan działający, a nie o wpisy
    w rejestrze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    poświadczeń zalogowanych osób natychmiast po zdobyciu uprawnień
    administratora.
  en: |
    The setting starts a guard in which the credentials of those logged on are kept by a separate environment,
    cut off from the system by a mechanism of hardware virtualisation.

    Every other rule in this block makes the reaching for credentials harder, or sets it down. This changes
    where the credentials lie. An attacker with administrative rights upon this machine still holds full sway
    over the system - and still does not reach that environment, it lying outside the system.

    It is a safeguard of another nature than the rest of the pack: it closes no road, it moves the mark beyond
    the road's reach.

    A thing worth noting: the guard calls for hardware. Virtualisation has to be there and switched on in the
    firmware, and the drivers have to suit. Writing the settings is therefore not the same as the guard's
    starting, for which the check asks after the running state and not after entries in the registry.

    What an attacker gains while the item goes unmet: a reach to the credentials of those logged on at once upon
    gaining administrative rights.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a cofnięcie jest trudne — to dwie
    rzeczy, które trzeba przeczytać razem.

    Ochrona wchodzi po restarcie maszyny i tylko wtedy, gdy sprzęt
    i sterowniki na to pozwalają. Maszyna, na której wymaganie zostało
    zapisane, a warunki nie są spełnione, potrafi wystartować z ochroną
    nieuruchomioną albo, przy sterowniku niezgodnym, nie wystartować
    prawidłowo wcale.

    Sterowniki są tu punktem najważniejszym. Oprogramowanie sprzętu
    starszego, w szczególności sterowniki urządzeń pomiarowych,
    zabezpieczeń sprzętowych i starszych kart, bywa niezgodne z tym trybem
    i przestaje się ładować.

    Drugim skutkiem jest uwierzytelnianie starsze: ochrona odcina odmiany,
    które wymagają hasła w postaci nadającej się do przekazania dalej.
    Oprogramowanie branżowe opierające się na nich straci możliwość
    zalogowania użytkownika.

    Odnotowuję, dlaczego reguła nie ma przycisku uruchomienia. Wycofanie
    wymaga usunięcia ustawień, restartu, a w części konfiguracji także
    czynności w oprogramowaniu układowym — czyli kroków, których aplikacja
    nie wykona i których nie powinna obiecywać.

    Czego to nie psuje: pracy przeglądarki i pakietu biurowego, udziałów
    plikowych, drukowania przez kolejkę, kont domenowych przy
    uwierzytelnianiu obecnym.
  en: |
    The class is "needs a planned rollout", and the undoing is difficult - two things to be read together.

    The guard takes hold after a restart of the machine, and only where the hardware and the drivers allow it. A
    machine upon which the requirement has been written while the conditions are unmet may start with the guard
    not running or, at an unsuiting driver, not start properly at all.

    The drivers are here the weightiest point. The software of older hardware, in particular the drivers of
    measuring devices, of hardware safeguards and of older cards, is at times at odds with that mode and ceases
    loading.

    The second consequence is older authentication: the guard cuts off the kinds calling for a password in a
    form fit to be passed on further. Trade software resting upon them will lose the means of logging a user in.

    I set down why the rule has no Run button. The undoing calls for the settings to be taken away, for a
    restart, and in some configurations for acts in the firmware besides - which is to say steps the application
    will not carry out and ought not to promise.

    What this does not break: the working of a browser and of an office suite, file shares, printing through a
    queue, or domain accounts under present-day authentication.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - legacy-authentication
    - drivers-and-devices
    - boot-and-firmware
  what_breaks:
    pl:
      - Sterowniki urządzeń pomiarowych, zabezpieczeń sprzętowych i starszych kart mogą przestać się ładować
      - Maszyna z wymaganiem zapisanym przy niespełnionych warunkach potrafi nie wystartować prawidłowo
      - Oprogramowanie branżowe opierające się na starszym uwierzytelnianiu traci możliwość zalogowania użytkownika
      - Wycofanie wymaga usunięcia ustawień, restartu, a bywa że i czynności w oprogramowaniu układowym
      - Praca przeglądarki i pakietu biurowego, udziały plikowe i drukowanie przez kolejkę pozostają bez zmian
    en:
      - The drivers of measuring devices, of hardware safeguards and of older cards may cease loading
      - A machine with the requirement written while the conditions are unmet may fail to start properly
      - Trade software resting upon older authentication loses the means of logging a user in
      - The undoing calls for the settings to be taken away, for a restart, and at times for acts in the firmware
      - The working of a browser and of an office suite, file shares and printing through a queue stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje sprzęt, którego sterownik nie jest zgodny z trybem opartym na wirtualizacji
      - Nie sprawdzono, czy oprogramowanie układowe udostępnia wirtualizację i czy jest ona włączona
    en:
      - Hardware works upon the machine whose driver does not suit the mode grounded upon virtualisation
      - It has not been checked whether the firmware offers virtualisation and whether it is switched on
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      # The question goes to the running state, not to the registry. Values written
      # and not taken up would otherwise be read as a guard that works.
      $dg = Get-CimInstance -ClassName Win32_DeviceGuard `
        -Namespace 'root\Microsoft\Windows\DeviceGuard' -ErrorAction Stop
      if ($null -eq $dg) { 'CHECK_ERROR' }
      elseif ($dg.SecurityServicesRunning -contains 1) { 'RUNNING' }
      else { 'NOT_RUNNING' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'RUNNING'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $lsa = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $dg  = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    [pscustomobject]@{
      lsa_cfg_flags  = (Get-ItemProperty -Path $lsa -Name 'LsaCfgFlags' -ErrorAction SilentlyContinue).LsaCfgFlags
      vbs_enabled    = (Get-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -ErrorAction SilentlyContinue).EnableVirtualizationBasedSecurity
      platform_flags = (Get-ItemProperty -Path $dg -Name 'RequirePlatformSecurityFeatures' -ErrorAction SilentlyContinue).RequirePlatformSecurityFeatures
      dg_key_existed = (Test-Path -Path $dg)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Writing the values does not start the guard - that happens at the next start
    # of the machine, and only where the firmware and the drivers allow it. Read
    # the backup before restarting; undoing this is not a matter of one value.
    $dg = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $dg)) { New-Item -Path $dg -Force | Out-Null }
    Set-ItemProperty -Path $dg -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord
    Set-ItemProperty -Path $dg -Name 'RequirePlatformSecurityFeatures' -Value 1 -Type DWord
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' `
      -Name 'LsaCfgFlags' -Value 1 -Type DWord

privileges: administrator
runnable: false

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/credential-guard/

notes:
  pl: |
    Reguła jest w tym bloku jedyną bez przycisku uruchomienia i warto, żeby
    aplikacja powiedziała dlaczego, zamiast pokazywać sam brak. Powodem nie
    jest ryzyko samej zmiany, tylko to, że wycofanie wykracza poza to, co
    aplikacja umie zrobić — a zasada twarda nie pozwala obiecywać powrotu,
    którego nie da się wykonać.

    Odnotowuję, dlaczego sprawdzenie pyta o stan działający. Ustawienia
    zapisane i nieprzyjęte przez sprzęt wyglądałyby w rejestrze tak samo
    jak ochrona czynna. Jest to jeden z niewielu przypadków w tej paczce,
    w których odczyt rejestru byłby odczytem zamiaru, a nie stanu.

    Argument wart zachowania dotyczy charakteru tej ochrony. Reszta bloku
    utrudnia drogę do poświadczeń; ta reguła wynosi poświadczenia poza
    zasięg administratora maszyny. Jest to jakościowo co innego i aplikacja
    nie powinna stawiać jej w jednym rzędzie z regułami rejestrowymi.
  en: |
    The rule is the only one in this block without a Run button, and it is well that the application say why
    rather than show the want alone. The reason is not the hazard of the change itself but that the undoing goes
    beyond what the application can do - and the hard rule does not allow a return to be promised that cannot be
    carried out.

    I set down why the check asks after the running state. Settings written and not taken up by the hardware
    would look in the registry the same as a live guard. It is one of the few cases in this pack in which a
    reading of the registry would be a reading of an intent and not of a state.

    The argument worth keeping touches this guard's nature. The rest of the block makes the road to credentials
    harder; this rule carries the credentials beyond the machine administrator's reach. That is something else
    in kind, and the application ought not to set it in one row with the registry rules.
