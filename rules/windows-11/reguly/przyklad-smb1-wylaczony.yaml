# REGUŁA WZORCOWA — pokazuje komplet pól i sposób opisu.
# Pola benchmark.punkt i benchmark.wersja celowo zawierają PRZYKLAD:
# nie wstawiamy numerów, których nie sprawdziliśmy w dokumencie.

id: win11-smb1-wylaczony

benchmark:
  nazwa: CIS Microsoft Windows 11 Benchmark
  wersja: PRZYKLAD
  punkt: PRZYKLAD
  tytul: Obsługa protokołu SMB w wersji 1 wyłączona
  poziom: 1
  profil: workstation

platforma:
  system: windows-11

kategoria_ryzyka: wysokie
uciazliwosc: wymaga-sprawdzenia
stan_oceny: oceniono-wplyw-opisany

opis: |
  SMB w wersji pierwszej nie potrafi potwierdzić, że po drugiej stronie połączenia
  jest ten serwer, za który się podaje, ani wykryć, że przesyłane dane ktoś po drodze
  podmienił. Napastnik w tej samej sieci może dzięki temu przechwycić sesję dostępu
  do udziału albo podstawić własny zasób.

  Po wyłączeniu tej wersji protokołu komputer przestaje się nią posługiwać i korzysta
  wyłącznie z nowszych, które wymagają potwierdzenia tożsamości serwera. Odbiera to
  napastnikowi jedną z najprostszych dróg do poświadczeń w sieci lokalnej.

opis_uciazliwosci: |
  Sama zmiana jest niewidoczna dla użytkownika — dopóki w sieci nie stoi urządzenie
  albo system, który nie umie nic nowszego. Wtedy dostęp do zasobu znika całkowicie
  i to bez czytelnego komunikatu: udział po prostu przestaje być osiągalny.

  Dlatego klasa "wymaga sprawdzenia", a nie "bez uciążliwości": na typowej stacji
  nikt nie zauważy, ale jedno stare urządzenie w sieci zamienia to w awarię.

konsekwencje_wdrozenia:
  obszary_wplywu:
    - udostepnianie-plikow
    - uwierzytelnianie-starsze
  co_przestanie_dzialac:
    - Skanery i urządzenia wielofunkcyjne zapisujące skany prosto na udział sieciowy przestaną tam zapisywać
    - Starsze systemy NAS bez obsługi nowszych wersji protokołu staną się niedostępne z tej stacji
    - Zadania kopii zapasowej kierowane na udział obsługiwany wyłącznie przez SMB1 zaczną kończyć się błędem
  przerwa: restart-systemu
  widoczne_dla_uzytkownika: false
  nie_stosowac_gdy:
    - W sieci pracuje urządzenie wielofunkcyjne bez obsługi nowszych wersji protokołu, dla którego nie ma aktualizacji oprogramowania
    - Stacja obsługuje maszyny produkcyjne albo sprzęt pomiarowy komunikujący się wyłącznie tą wersją protokołu
  odwracalnosc: po-restarcie

audyt:
  powloka: powershell
  polecenie_testu: |
    $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue
    if ($null -eq $f) { 'NIEOBECNY' } else { $f.State }
  oczekiwane: '^(Disabled|NIEOBECNY)$'
  porownanie: wyrazenie-regularne

remediacja:
  powloka: powershell
  polecenie_kopii: |
    $kat = Join-Path $env:ProgramData 'Sentin-Harden\kopie'
    New-Item -ItemType Directory -Path $kat -Force | Out-Null
    $plik = Join-Path $kat ('smb1-stan-{0}.txt' -f (Get-Date -Format 'yyyyMMdd-HHmmss'))
    Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol |
      Select-Object FeatureName, State |
      Out-File -FilePath $plik -Encoding UTF8
    "Zapisano stan sprzed zmiany: $plik"

  polecenie_zmiany: |
    Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart

  polecenie_wycofania: |
    Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart

uprawnienia: administrator
uruchamialne: true

zrodla:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

uwagi: |
  Zmiana zaczyna w pełni obowiązywać po ponownym uruchomieniu systemu, dlatego
  ponowny audyt tuż po wykonaniu może jeszcze pokazywać stan przejściowy.
  Przed wdrożeniem w sieci z nieznanym sprzętem warto najpierw sprawdzić, czy
  cokolwiek jeszcze łączy się tą wersją protokołu.
