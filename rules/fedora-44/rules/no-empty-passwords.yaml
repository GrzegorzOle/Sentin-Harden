id: fedora44-no-empty-passwords

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 7.2.2
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Żadne konto nie ma pustego hasła w /etc/shadow
    en: Ensure /etc/shadow password fields are not empty
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Puste pole hasła w /etc/shadow oznacza konto bez hasła. Gdy PAM
    dopuszcza takie konta (opcja nullok modułu pam_unix), każdy może się na
    nie zalogować albo przełączyć poleceniem su, nie znając żadnego sekretu.

    Punkt wymaga, żeby żadne konto nie miało pustego pola hasła.
  en: |
    An empty password field in /etc/shadow means an account without a
    password. When PAM allows such accounts (the nullok option of
    pam_unix), anyone can log in to them or switch to them with su without
    knowing any secret.

    The item requires that no account has an empty password field.

disruption_description:
  pl: |
    Na konto, które nie miało hasła, nie da się już zalogować, dopóki
    administrator nie ustawi mu hasła poleceniem passwd. Na zwykłej stacji
    Fedory takich kont nie ma.
  en: |
    Nobody can log in to an account that had no password until the
    administrator sets one with passwd. A regular Fedora workstation has no
    such accounts.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Logowanie na konta, które dotąd nie miały hasła
    en:
      - Logins to accounts that had no password so far
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    empty() { awk -F: '$1 != "" && $2 == "" { print $1 }' /etc/shadow; }
    evaluate() {
      local e
      [ -r /etc/shadow ] || { echo "NOT_OK:shadow-unreadable"; return; }
      e=$(empty | paste -sd, -)
      if [ -z "$e" ]; then echo "OK:no-empty-password"; else echo "NOT_OK:$e"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    empty() { awk -F: '$1 != "" && $2 == "" { print $1 }' /etc/shadow; }
    evaluate() {
      local e
      [ -r /etc/shadow ] || { echo "NOT_OK:shadow-unreadable"; return; }
      e=$(empty | paste -sd, -)
      if [ -z "$e" ]; then echo "OK:no-empty-password"; else echo "NOT_OK:$e"; fi
    }
      [ -r /etc/shadow ] || { echo "Cannot read /etc/shadow; run as root" >&2; exit 1; }
      { echo format=emptypw-1; empty | sed 's/^/user /'; } > "$b"
      chmod 600 "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=emptypw-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    empty() { awk -F: '$1 != "" && $2 == "" { print $1 }' /etc/shadow; }
    evaluate() {
      local e
      [ -r /etc/shadow ] || { echo "NOT_OK:shadow-unreadable"; return; }
      e=$(empty | paste -sd, -)
      if [ -z "$e" ]; then echo "OK:no-empty-password"; else echo "NOT_OK:$e"; fi
    }
    # unlock_saved: accounts this rule locked that still have only "!" get the empty field back
    unlock_saved() {
      local tag n cur
      while read -r tag n; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" '$1 == n { print $2; exit }' /etc/shadow)
        [ "$cur" = '!' ] || continue
        usermod -p '' "$n"; echo "Restored the empty password of $n"
      done < "$b"
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "Already meets the item, nothing to change"; exit 0 ;;
        *shadow-unreadable*) echo "Cannot read /etc/shadow; run as root" >&2; exit 1 ;;
      esac
      empty | while read -r n; do
        grep -qx "user $n" "$b" || { echo "$n is not in the backup; run backup again" >&2; exit 1; }
      done
      empty | while read -r n; do
        usermod -L "$n" || { unlock_saved >/dev/null; echo "usermod failed for $n; restored the previous state" >&2; exit 1; }
        echo "Locked the password of $n"
      done
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) unlock_saved >/dev/null; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=emptypw-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    # unlock_saved: accounts this rule locked that still have only "!" get the empty field back
    unlock_saved() {
      local tag n cur
      while read -r tag n; do
        [ "$tag" = user ] || continue
        cur=$(awk -F: -v n="$n" '$1 == n { print $2; exit }' /etc/shadow)
        [ "$cur" = '!' ] || continue
        usermod -p '' "$n"; echo "Restored the empty password of $n"
      done < "$b"
    }
      unlock_saved
      echo "Rollback finished"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/shadow.5.html
  - https://man7.org/linux/man-pages/man8/usermod.8.html
  - https://man7.org/linux/man-pages/man1/passwd.1.html

notes:
  pl: |
    Wynik NOT_OK podaje nazwy kont z pustym polem hasła. Naprawa blokuje
    hasło tych kont poleceniem usermod -L, które zapisuje w polu znak !;
    dotyczy to także roota. Konto odblokowuje się, ustawiając mu hasło
    poleceniem passwd. Wycofanie przywraca puste pole (usermod -p '') tylko
    kontom, które nadal mają w nim sam znak !, więc nie rusza kont, którym
    w międzyczasie ustawiono hasło. Test musi czytać /etc/shadow, więc bez
    roota wynik to NOT_OK:shadow-unreadable.
  en: |
    The NOT_OK result gives the names of the accounts with an empty
    password field. The remediation locks the password of these accounts
    with usermod -L, which writes ! into the field; this includes root. An
    account is unlocked by setting its password with passwd. Rollback puts
    the empty field back (usermod -p '') only for the accounts that still
    have just ! in it, so it leaves alone the accounts that got a password
    in the meantime. The test must read /etc/shadow, so without root the
    result is NOT_OK:shadow-unreadable.
