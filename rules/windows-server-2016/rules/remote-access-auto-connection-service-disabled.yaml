id: win2016-remote-access-auto-connection-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Automatyczne nawiązywanie połączenia zdalnego wyłączone
    en: The automatic setting up of a remote connection disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa nawiązuje zapisane wcześniej połączenie zdalne sama z siebie,
    gdy program na tej maszynie sięgnie pod adres, który tym połączeniem
    jest osiągalny.

    Jest to mechanizm wygody i rzecz w nim nie leży w samym połączeniu,
    tylko w tym, kto o nim decyduje. Decyduje program — dowolny, także
    taki, którego nikt świadomie nie uruchomił. Wystarczy, że sięgnie pod
    właściwy adres, a maszyna zestawi połączenie do sieci zdalnej bez
    pytania kogokolwiek.

    Napastnik, który znalazł się na tej maszynie, dostaje przez to drogę
    do sieci, której nie musiał szukać. Nie łamie połączenia, nie zdobywa
    poświadczeń do niego — wywołuje je, sięgając pod adres, który sam
    wybierze. Poświadczenia są zapisane w profilu połączenia i system
    podstawia je sam.

    Rzecz jest tym cięższa, że połączenie takie nawiązuje się cicho. Nie
    ma ekranu, nie ma pytania, nie ma zwykle nawet wpisu, który rzucałby
    się w oczy. Sieć zdalna staje się osiągalna i przestaje być osiągalna
    bez żadnego udziału człowieka.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zestawienia połączenia do sieci zdalnej samym sięgnięciem pod adres,
    z poświadczeniami, których nie musi znać.
  en: |
    The service strikes up a remote connection saved earlier of itself, when a program on
    this machine reaches an address reachable by that connection.

    It is a mechanism of convenience, and the matter in it lies not in the connection but
    in who decides on it. A program decides - any program, including one nobody knowingly
    started. It is enough that it reaches the right address and the machine will set up a
    connection to the remote network asking nobody.

    An attacker who has found their way onto this machine thereby gets a road to a
    network they did not have to seek. They break no connection, they win no credentials
    to it - they call it up by reaching an address they choose themselves. The
    credentials are saved in the connection's profile and the system supplies them
    itself.

    The matter is heavier in that such a connection is struck up quietly. There is no
    screen, no question, and as a rule not even an entry that would catch the eye. The
    remote network becomes reachable and ceases to be reachable with no part taken by a
    human being.

    What an attacker gains while the item goes unmet: the chance to set up a connection
    to a remote network by merely reaching an address, with credentials they need not
    know.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do sprawdzenia dotyczy tego, co na
    tej maszynie sięga poza nią bez udziału człowieka.

    Połączenia nawiązywane ręcznie nie są tą regułą objęte. Kto otwiera
    połączenie sam i sam je zamyka, nie zauważy zmiany. Znika wyłącznie
    nawiązywanie bez proszenia.

    Sprawdzić warto dwa przypadki. Pierwszy to zadania i skrypty sięgające
    do zasobu w sieci zdalnej i liczące na to, że połączenie zestawi się
    samo. Takie zadanie po wdrożeniu kończy się błędem o nieosiągalności
    zasobu, a nie o braku połączenia, więc przyczyna nie jest widoczna od
    razu.

    Drugi to aplikacje branżowe pracujące z odległą bazą albo odległym
    serwerem wydruku, skonfigurowane w czasach, gdy łącze było
    komutowane. Zdarza się to rzadko, ale zdarza się właśnie na maszynach
    starszych — a Server 2016 jest dziś maszyną starszą.

    Poza tymi dwoma przypadkami skutek jest żaden. Usługa uruchamia się
    tylko wtedy, gdy zapisane połączenie zdalne w ogóle istnieje.

    Czego to nie psuje: połączeń nawiązywanych ręcznie, zwykłego ruchu
    sieciowego, udziałów, pulpitu zdalnego, zarządzania zdalnego.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and the thing to check concerns whatever on this machine
    reaches beyond it with no part taken by a human being.

    Connections struck up by hand are not caught by this rule. Whoever opens a connection
    themselves and closes it themselves will not notice the change. What vanishes is
    solely the striking up without being asked.

    Two cases are worth checking. The first is tasks and scripts reaching a resource on a
    remote network and counting on the connection setting itself up. Such a task after
    the rollout ends in an error about the resource being unreachable rather than about
    there being no connection, so the cause is not visible at once.

    The second is line-of-business applications working with a distant database or a
    distant print server, configured in times when the link was a dial-up one. That
    happens rarely, but it happens on older machines above all - and Server 2016 is today
    an older machine.

    Beyond those two cases the consequence is none. The service starts only where a saved
    remote connection exists at all.

    What this does not break: connections struck up by hand, ordinary network traffic,
    shares, the remote desktop, or remote management.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Zadania i skrypty liczące na to, że połączenie zdalne zestawi się samo, kończą się błędem o nieosiągalności zasobu
      - Komunikat mówi o zasobie, a nie o braku połączenia, więc przyczyna nie jest widoczna od razu
      - Aplikacje branżowe skonfigurowane pod łącze komutowane przestaną sięgać do odległej bazy albo serwera wydruku
      - Połączenia nawiązywane ręcznie, zwykły ruch sieciowy i udziały pozostają bez zmian
    en:
      - Tasks and scripts counting on a remote connection setting itself up end in an error about the resource being unreachable
      - The message speaks of the resource rather than of there being no connection, so the cause is not visible at once
      - Line-of-business applications configured for a dial-up link will stop reaching a distant database or print server
      - Connections struck up by hand, ordinary network traffic and shares stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Zadania na tej maszynie sięgają do zasobów w sieci zdalnej i liczą na samoczynne zestawienie połączenia
      - Aplikacja branżowa na tej maszynie pracuje z odległym zasobem osiągalnym wyłącznie przez zapisane połączenie zdalne
    en:
      - Tasks on this machine reach resources on a remote network and count on the connection setting itself up
      - A line-of-business application on this machine works with a distant resource reachable solely through a saved remote connection
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'RasAuto' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Connections struck up by hand are untouched. Only the striking up without
    # being asked for stops.
    Stop-Service -Name 'RasAuto' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RasAuto' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'RasAuto' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/ras/manage-remote-access

notes:
  pl: |
    Punkt różni się od pozostałych w bloku kierunkiem. Tamte dotyczą dróg,
    którymi coś wchodzi do tej maszyny albo przez nią przechodzi; ta
    dotyczy drogi, którą maszyna wychodzi na zewnątrz z własnej inicjatywy.

    Warto to nazwać, bo zmienia sposób myślenia o zagrożeniu. Nie chodzi
    o to, że ktoś wejdzie — chodzi o to, że coś, co już jest w środku,
    otworzy sobie wyjście, a poświadczenia do niego znajdzie gotowe.

    Zapisane poświadczenie w profilu połączenia jest tu rzeczą kluczową
    i wspólną z regułą o logowaniu kodem liczbowym. W obu przypadkach
    wygoda polega na tym, że system pamięta hasło za człowieka, i w obu
    przypadkach cena jest taka sama: kto uruchomi mechanizm, dostaje hasło
    w użyciu, nie musząc go znać.
  en: |
    The item differs from the rest in the block in direction. Those concern roads by
    which something enters this machine or passes through it; this one concerns the road
    by which the machine goes out of its own initiative.

    That is worth naming, changing as it does the way one thinks about the threat. It is
    not a matter of somebody getting in - it is a matter of something already inside
    opening itself a way out and finding the credentials for it ready.

    A credential saved in the connection's profile is here the key thing, and one shared
    with the rule about signing in by a numeric code. In both cases the convenience lies
    in the system remembering a password for a person, and in both cases the price is the
    same: whoever sets the mechanism going gets the password in use without having to know it.
