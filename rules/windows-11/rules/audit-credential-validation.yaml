id: win11-audit-credential-validation

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > Account Logon
  title:
    pl: Inspekcja sprawdzania poświadczeń
    en: Audit credential validation
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    To jedyne miejsce, w którym widać zgadywanie haseł do kont lokalnych.
    Zdarzenie powstaje przy każdym sprawdzeniu poświadczeń przez tę maszynę —
    także wtedy, gdy próba idzie z sieci i nie kończy się zalogowaniem, więc nie
    zostawia śladu nigdzie indziej.

    Rejestrowanie niepowodzeń pokazuje atak; rejestrowanie powodzeń pokazuje,
    czy się udał. Bez tej pary pytanie "czy ktoś dobrał się do konta lokalnego
    i kiedy" nie ma na tej maszynie odpowiedzi — dziennik po prostu nie zawiera
    danych, z których dałoby się ją złożyć.
  en: |
    This is the only place where guessing of local account passwords becomes
    visible. An event is produced at every credential check performed by this
    machine - including an attempt coming from the network that never results in
    a sign-in, and therefore leaves no trace anywhere else.

    Recording failures shows the attack; recording successes shows whether it
    worked. Without that pair, the question "did somebody get into a local
    account, and when" has no answer on this machine - the log simply does not
    hold the data to build one from.

disruption_description:
  pl: |
    Nic nie przestaje działać i użytkownik niczego nie zauważy. Kosztem jest
    objętość dziennika zabezpieczeń: na maszynie odpytywanej z sieci zdarzeń
    przybywa szybko i domyślny rozmiar dziennika potrafi obrócić się w kilka dni.

    Dlatego punkt ma sens wyłącznie razem z powiększeniem dziennika. Sama
    inspekcja bez miejsca na jej wynik daje złudzenie zapisu, który w chwili
    dochodzenia okaże się już nadpisany.
  en: |
    Nothing stops working and no user notices anything. The cost is security log
    volume: on a machine queried from the network events accumulate quickly and
    a default-sized log can turn over in a few days.

    The item therefore makes sense only together with enlarging the log.
    Auditing without room for its output creates the illusion of a record that,
    at the moment of an investigation, turns out to have been overwritten.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Dziennik zabezpieczeń zapełnia się szybciej i przy domyślnym rozmiarze nadpisuje starsze zdarzenia
      - Systemy odbierające zdarzenia dostaną wyraźnie większy strumień danych z tej maszyny
    en:
      - The security log fills faster and at the default size overwrites older events
      - Event collection systems receive a markedly larger stream of data from this machine
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dziennik zabezpieczeń ma domyślny rozmiar i nie ma go jak powiększyć
      - Zdarzenia z tej maszyny są rozliczane objętościowo w systemie zbierającym
    en:
      - The security log is at its default size and cannot be enlarged
      - Events from this machine are billed by volume in the collection system
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $null = auditpol /backup /file:$csv
      if (-not (Test-Path -Path $csv)) { 'CHECK_ERROR' }
      else {
        $rows = Get-Content -Path $csv -ErrorAction Stop
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
        # The backup format carries a numeric setting in the last column, which
        # the localised output of auditpol /get does not.
        $line = $rows | Where-Object { $_ -match '0CCE923F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
        if (-not $line) { 'CHECK_ERROR' }
        else {
          $value = ($line -split ',')[-1].Trim()
          if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE923F-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE923F-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    auditpol /set /subcategory:"{0CCE923F-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE923F-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-credential-validation

notes:
  pl: |
    Podkategoria jest wskazywana identyfikatorem, a nie nazwą. Nazwy są
    tłumaczone razem z systemem, więc reguła oparta na nazwie działałaby
    wyłącznie na jednej wersji językowej — a raport ma być porównywalny
    niezależnie od języka maszyny.

    Odczyt idzie przez kopię polityki inspekcji, bo tylko ona podaje ustawienie
    liczbą. Zwykły odczyt zwraca tekst w języku systemu, którego nie da się
    porównać w sposób pewny.
  en: |
    The subcategory is addressed by identifier rather than by name. Names are
    translated along with the system, so a rule built on the name would work on
    one language version only - and the report is meant to be comparable
    regardless of the machine's language.

    The reading goes through a backup of the audit policy, because only that
    gives the setting as a number. An ordinary read returns text in the system's
    language, which cannot be compared reliably.
