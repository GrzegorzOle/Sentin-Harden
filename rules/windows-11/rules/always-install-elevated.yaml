id: win11-always-install-elevated

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Instalacja pakietów z podniesionymi uprawnieniami wyłączona
    en: Always install with elevated privileges disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Włączone ustawienie sprawia, że każdy pakiet instalacyjny uruchomiony przez
    zwykłego użytkownika wykonuje się z pełnymi uprawnieniami systemu. Wystarczy
    wtedy, że użytkownik podwójnie kliknie przygotowany plik instalatora, aby
    dowolny kod dostał najwyższe uprawnienia — bez pytania o hasło administratora
    i bez żadnego ostrzeżenia.

    Po wyłączeniu instalator działa z uprawnieniami osoby, która go uruchomiła.
    Podniesienie uprawnień wymaga świadomej zgody, a przypadkowo otwarty pakiet
    nie przejmuje maszyny.
  en: |
    When enabled, this setting makes every installer package launched by an
    ordinary user run with full system privileges. It is then enough for a user
    to double-click a prepared installer file for arbitrary code to receive the
    highest privileges, with no administrator password prompt and no warning.

    Once disabled, the installer runs with the privileges of whoever started it.
    Elevation requires deliberate consent, and an accidentally opened package
    does not take over the machine.

disruption_description:
  pl: |
    Zmiana nie dotyka programów już zainstalowanych, aktualizacji systemu ani
    codziennej pracy. Dotyczy jednej czynności: uruchomienia pakietu
    instalacyjnego przez osobę bez uprawnień administracyjnych.

    Jeśli w tym środowisku instalacja odbywa się tak, że użytkownik sam klika
    w pakiet i ten instaluje się bez pytania o hasło, to po zmianie przestanie.
    Objaw jest czytelny — instalator zgłosi brak uprawnień — ale zgłoszenie
    trafi do obsługi jako „nie mogę zainstalować programu", a nie jako skutek
    zmiany polityki.

    Warto sprawdzić dwie rzeczy przed wykonaniem. Po pierwsze, czy któryś
    program aktualizuje się przez uruchomienie pakietu z konta użytkownika —
    takie aktualizacje zaczną się nie udawać po cichu. Po drugie, czy nie ma
    skryptów wdrożeniowych uruchamianych z konta zwykłego; te skończą się
    błędem braku uprawnień.

    Wdrożenia prowadzone przez narzędzie zarządzające instalują z konta usługi
    i zmiana ich nie dotyczy — a to właśnie ta droga jest właściwą odpowiedzią
    na dwa akapity powyżej.
  en: |
    The change does not touch programs already installed, system updates or
    everyday work. It concerns one action - the running of an installer package
    by somebody without administrative rights.

    If installation in this environment works by the user clicking a package
    themselves and it installing with no password asked, then after the change it
    will stop. The symptom is legible - the installer will report a lack of
    rights - but the report reaches the service desk as "I cannot install the
    program" rather than as the consequence of a policy change.

    Two things are worth checking beforehand. First, whether any program updates
    itself by running a package from a user account - such updates will start
    failing quietly. Second, whether there are deployment scripts run from an
    ordinary account; those will end with a rights error.

    Deployments carried out by a management tool install from a service account
    and the change does not touch them - and that road is the proper answer to
    the two paragraphs above.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja pakietu przez użytkownika bez uprawnień administracyjnych przestaje się udawać i wraca na drogę przez konto administracyjne
      - Program aktualizujący się przez uruchomienie pakietu z konta użytkownika przestaje się aktualizować, często po cichu
      - Skrypt wdrożeniowy uruchamiany z konta zwykłego kończy się błędem braku uprawnień
      - Wdrożenia prowadzone przez narzędzie zarządzające instalują z konta usługi i zmiana ich nie dotyczy
      - Programy już zainstalowane, aktualizacje systemu, sieć, profile i drukowanie pozostają bez zmian
    en:
      - Installing a package as a user without administrative rights stops succeeding and goes back by way of an administrative account
      - A program that updates itself by running a package from a user account stops updating, often quietly
      - A deployment script run from an ordinary account ends with a rights error
      - Deployments carried out by a management tool install from a service account and the change does not touch them
      - Programs already installed, system updates, the network, profiles and printing are unaffected
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożone oprogramowanie wymaga instalacji przez użytkowników bez uprawnień administratora
    en:
      - Deployed software relies on installation by users who hold no administrator rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    # Elevation happens only when BOTH hives are set, so both must be read.
    function Get-Flag($path) {
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { return $null }
      (Get-ItemProperty -Path $path -ErrorAction Stop).AlwaysInstallElevated
    }
    try {
      $m = Get-Flag 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $u = Get-Flag 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      if (($m -eq 1) -and ($u -eq 1)) { 'ENABLED' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^DISABLED$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'AlwaysInstallElevated'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AlwaysInstallElevated' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/alwaysinstallelevated

notes:
  pl: |
    Podniesienie uprawnień następuje tylko wtedy, gdy ustawienie jest włączone
    JEDNOCZEŚNIE w gałęzi maszyny i użytkownika. Audyt sprawdza obie, bo
    wyłączenie tylko jednej daje złudzenie zgodności, a druga może zostać
    włączona przez politykę użytkownika.

    Remediacja zmienia gałąź maszyny. Jeśli wartość w gałęzi użytkownika jest
    ustawiona przez politykę grupy, trzeba ją poprawić tam, a nie w rejestrze.
  en: |
    Elevation happens only when the setting is enabled in BOTH the machine and
    the user hive. The audit checks both, because clearing just one creates an
    illusion of compliance while the other may still be set by user policy.

    The remediation changes the machine hive. If the user hive value comes from
    group policy, it has to be corrected there rather than in the registry.
