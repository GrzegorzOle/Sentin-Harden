id: win10-winrm-service-unencrypted-traffic-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Service
  title:
    pl: Nieszyfrowany ruch usługi zarządzania zdalnego zabroniony
    en: Traffic not enciphered to the service of ordering from afar refused
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zdalnego zarządzania przyjmowania
    połączeń, w których treść nie jest zaszyfrowana.

    Zastrzeżenie dotyczy tego, co takim połączeniem płynie. Nie są to
    dane przypadkowe: idą tamtędy polecenia do wykonania na maszynie
    i wyniki tych poleceń, a często także poświadczenia.

    Zagrożenie pierwsze to odczyt. Kto widzi ruch, widzi polecenia
    i wyniki, a więc dowiaduje się, co na maszynie jest, kto nią zarządza
    i czego szuka.

    Zagrożenie drugie to zmiana w locie. Ruch nieszyfrowany daje się nie
    tylko czytać, ale i podmieniać, a podmienione polecenie zostanie
    wykonane z uprawnieniami administratora.

    Zagrożenie trzecie to fałszywa pewność. Sesja zdalnego zarządzania
    wygląda tak samo niezależnie od tego, czy jest szyfrowana, więc
    osoba pracująca nie ma powodu podejrzewać, że pracuje otwartym
    tekstem.

    Odnotowuję, że przy uwierzytelnianiu domenowym treść bywa szyfrowana
    na poziomie samego protokołu, ale nie należy na tym polegać — punkt
    zamyka możliwość, a nie zakłada dobrą wolę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: polecenia
    administracyjne czytelne i podmienialne w locie.
  en: |
    The setting forbids the service of ordering from afar to take in joinings whose content is not enciphered.

    The reservation touches what flows by such a joining. It is no matter come by chance: there go orders to be
    worked upon the machine and the outcomes of those orders, and often warrants as well.

    The first danger is the reading. Whoever sees the traffic sees the orders and the outcomes, and so learns what
    is upon the machine, who orders it and what they seek.

    The second danger is the changing in flight. Traffic not enciphered may not only be read but swapped, and a
    swapped order will be worked with a keeper's rights.

    The third danger is a false surety. A session of ordering from afar looks the same whether it be enciphered or
    no, so whoever works has no ground to suspect they work in open writing.

    I set down that with warranting by the domain the content is at times enciphered at the level of the protocol
    itself, but it is not to be leaned upon - the item shuts the power and leans upon no good will.

    What an attacker gains while the item goes unmet: orders of a keeper readable and to be swapped in flight.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia są połączenia
    nieuwierzytelniane domenowo.

    Miejscem pierwszym są narzędzia łączące się z maszyną spoza domeny
    i polegające na tym, że połączenie nieszyfrowane zadziała. Po zmianie
    zostaną odrzucone bez wykonania polecenia.

    Miejscem drugim są skrypty utrzymaniowe pisane dawno, w których
    wyłączenie szyfrowania było sposobem na obejście problemu
    z certyfikatem. Po zmianie trzeba wrócić do tamtego problemu
    i rozwiązać go właściwie.

    Odnotowuję, że przy uwierzytelnianiu domenowym połączenia działają
    dalej bez żadnej zmiany po stronie narzędzi.

    Zastrzegam, że punkt jest osobny od punktu o uwierzytelnianiu
    podstawowym, choć oba trafiają w te same narzędzia. Wdraża się je
    razem i razem trzeba je przetestować.

    Zmiana zaczyna obowiązywać po ponownym uruchomieniu usługi.

    Czego to nie psuje: połączeń uwierzytelnianych domenowo, pracy
    programów, sieci, drukowania, logowania.
  en: |
    The class is "needs review", and the object of the review is joinings not warranted by the domain.

    The first place is tools joining themselves to the machine from beyond the domain and leaning upon a joining
    not enciphered working. After the change they will be refused with the order unworked.

    The second place is scripts of upkeep written long ago, in which the switching off of enciphering was the way
    round a trouble with a certificate. After the change that trouble must be returned to and settled rightly.

    I set down that with warranting by the domain the joinings work on with no change at all upon the tools' side.

    I set down that the item stands apart from the item about plain warranting, though both strike the same tools.
    They are rolled out together and together must be tried.

    The change comes into force after the service is set going anew.

    What this does not break: joinings warranted by the domain, the work of programs, the network, printing, or
    logging on.

implementation_consequences:
  impact_areas:
    - remote-management
    - scripting-and-automation
    - encryption-and-tls
  what_breaks:
    pl:
      - Narzędzia łączące się z maszyną spoza domeny bez szyfrowania zostaną odrzucone bez wykonania polecenia
      - Skrypty, w których wyłączenie szyfrowania było obejściem problemu z certyfikatem, przestaną działać
      - Trzeba będzie wrócić do problemu z certyfikatem i rozwiązać go właściwie
      - Połączenia uwierzytelniane domenowo działają dalej bez zmiany po stronie narzędzi
      - Praca programów, sieć, drukowanie i logowanie pozostają bez zmian
    en:
      - Tools joining themselves to the machine from beyond the domain with no enciphering will be refused with the order unworked
      - Scripts in which the switching off of enciphering was the way round a trouble with a certificate will cease to work
      - That trouble with a certificate will have to be returned to and settled rightly
      - Joinings warranted by the domain work on with no change upon the tools side
      - The work of programs, the network, printing and logging on stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie spoza domeny zarządza tą maszyną połączeniem nieszyfrowanym i nie da się go teraz zmienić
    en:
      - A tool from beyond the domain orders this machine by a joining not enciphered and it cannot now be changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowUnencryptedTraffic'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'AllowUnencryptedTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowUnencryptedTraffic' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/winrm/installation-and-configuration-for-windows-remote-management

notes:
  pl: |
    Reguła bywa wdrażana razem z punktem o uwierzytelnianiu podstawowym
    i warto, żeby aplikacja pokazała je obok siebie. Oba trafiają w te
    same narzędzia, więc testować trzeba je razem, a nie po kolei.

    Argument wart postawienia dotyczy treści. Tym połączeniem idą
    polecenia do wykonania na maszynie, ich wyniki i często poświadczenia
    — a ruch nieszyfrowany daje się nie tylko czytać, ale i podmieniać.

    Odnotowuję fałszywą pewność. Sesja wygląda tak samo niezależnie od
    tego, czy jest szyfrowana, więc osoba pracująca nie ma powodu
    podejrzewać, że pracuje otwartym tekstem, i nie zgłosi tego nikomu.
  en: |
    The rule is at times rolled out together with the item about plain warranting, and it is well that the
    application show them side by side. Both strike the same tools, so they must be tried together and not one
    after the other.

    The argument worth putting touches the content. By that joining go orders to be worked upon the machine, their
    outcomes and often warrants - and traffic not enciphered may not only be read but swapped.

    I set down the false surety. The session looks the same whether it be enciphered or no, so whoever works has
    no ground to suspect they work in open writing, and will report it to nobody.
