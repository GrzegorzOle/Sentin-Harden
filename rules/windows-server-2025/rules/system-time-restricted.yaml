id: win2025-system-time-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zmiana czasu systemowego ograniczona do administratorów i usługi lokalnej
    en: Changing the system time restricted to administrators and the local service
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala przestawić zegar maszyny.

    Zegar wygląda na ustawienie porządkowe i właśnie dlatego jest
    niedoceniany. W rzeczywistości opiera się na nim uwierzytelnianie.
    Bilet wystawiany przez kontroler domeny ma czas ważności, a strona
    przyjmująca go sprawdza, czy mieści się w oknie liczonym od zegara
    własnego. Rozbieżność większa niż kilka minut unieważnia bilety
    w obie strony — a to znaczy, że logowanie przestaje działać na całej
    maszynie naraz.

    Napastnik wykorzystuje to dwojako. Kierunek pierwszy to odmowa
    działania: przestawienie zegara zatrzymuje uwierzytelnianie
    skuteczniej i ciszej niż zatrzymanie usługi, bo nic nie wygląda na
    awarię. Kierunek drugi dotyczy ważności — cofnięcie zegara ożywia
    certyfikat wygasły, bilet przeterminowany i hasło, które powinno
    było stracić ważność.

    Trzeci skutek dotyczy dziennika. Zapisy niosą znacznik czasu z
    zegara maszyny, więc przestawienie go rozsypuje kolejność zdarzeń
    i utrudnia odtworzenie przebiegu. Zapis cofnięty w czasie trafia
    w miejsce, w którym nikt go nie szuka.

    Na serwerze waga jest większa niż na stanowisku roboczym. Serwer
    bywa źródłem czasu dla innych maszyn, a kontroler domeny jest nim
    z definicji — przestawienie jego zegara rozchodzi się na wszystko,
    co z niego czas pobiera.

    Punkt zawęża wykaz do administratorów i konta usługi lokalnej,
    która obsługuje synchronizację czasu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zatrzymania uwierzytelniania w całej domenie, ożywienia
    poświadczeń wygasłych i zaburzenia kolejności zapisów w dzienniku.
  en: |
    The right allows the machine's clock to be set.

    A clock looks like a housekeeping setting, and is undervalued for just that reason. In truth
    authentication rests on it. A ticket issued by a domain controller has a time of validity,
    and the side taking it checks whether that falls within a window reckoned from its own
    clock. A divergence of more than a few minutes voids tickets both ways - and that means
    logging in stops working on the whole machine at once.

    An attacker turns that to use two ways. The first direction is a denial of working: setting
    the clock halts authentication more surely and more quietly than halting a service, since
    nothing looks like a breakdown. The second direction bears on validity - putting the clock
    back revives an expired certificate, an outdated ticket and a password that ought to have
    lost its validity.

    A third effect bears on the log. Entries carry a time stamp from the machine's clock, so
    setting it scatters the order of events and makes the course of them harder to piece back.
    An entry put back in time lands where nobody looks for it.

    On a server the weight is greater than at a working station. A server is at times a source
    of time for other machines, and a domain controller is one by definition - setting its clock
    spreads to everything that takes its time from it.

    The item narrows the list to administrators and the local service account, which serves the
    synchronising of time.

    What an attacker gains while the item goes unmet: the means of halting authentication across
    the whole domain, of reviving expired credentials and of upsetting the order of entries in
    the log.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, skąd ten serwer bierze czas i czy robi to
    z konta objętego wykazem.

    W stanie domyślnym prawo mają administratorzy, usługa lokalna
    i — na części instalacji — operatorzy serwera. Zawężenie odbiera je
    tej ostatniej grupie.

    Usługa czasu systemowego pracuje na koncie usługi lokalnej, która
    w wykazie pozostaje. Synchronizacja z kontrolerem domeny i ze
    źródłem zewnętrznym działa po zmianie bez różnicy i jest to
    najważniejsze zdanie w całym opisie, bo obawa o synchronizację jest
    najczęstszym powodem odpuszczania tego punktu.

    Przypadkiem do sprawdzenia jest maszyna wirtualna. Narzędzia
    integracyjne hosta potrafią ustawiać czas gościa i robią to spoza
    systemu operacyjnego, więc wykaz ich nie dotyczy. Warto natomiast
    rozstrzygnąć, czy czas ma pochodzić od hosta, czy z domeny —
    dwa źródła naraz powodują dryf, którego ten punkt nie naprawi.

    Drugim przypadkiem jest oprogramowanie, które przy starcie
    wyrównuje zegar we własnym zakresie. Zdarza się to w systemach
    przemysłowych i w narzędziach pomiarowych. Po zawężeniu operacja
    taka kończy się odmową, a objaw bywa cichy — program działa, tylko
    przestaje korygować.

    Zmiana nie wymaga przerwy i nie dotyka czasu bieżącego.
  en: |
    What needs checking is where this server takes its time from and whether it does so under an
    account within the list.

    In the default state administrators, the local service and - on some installations - server
    operators hold the right. The narrowing takes it from that last group.

    The system time service works under the local service account, which stays in the list.
    Synchronising with a domain controller and with an outside source works after the change
    with no difference, and that is the weightiest sentence in the whole description, since fear
    for synchronising is the commonest reason this item is let go.

    The case to be checked is a virtual machine. The host's integration tools can set a guest's
    time and do so from outside the operating system, so the list does not bear on them. It is
    worth settling, though, whether time is to come from the host or from the domain - two
    sources at once cause a drift this item will not mend.

    A second case is software that at its start evens the clock on its own account. That happens
    in industrial systems and in measuring tools. After the narrowing such an operation ends in
    a refusal, and the symptom is at times quiet - the program works, only it stops correcting.

    The change takes no break and does not touch the present time.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - logging-and-audit
    - virtualization-and-containers
    - legacy-applications
  what_breaks:
    pl:
      - Operatorzy serwera stracą możliwość przestawienia zegara maszyny
      - Oprogramowanie wyrównujące zegar przy starcie przestanie korygować, często bez zgłoszenia błędu
      - Synchronizacja czasu z domeną i ze źródłem zewnętrznym działa bez zmiany, bo usługa czasu zostaje w wykazie
      - Ustawianie czasu przez narzędzia integracyjne hosta wirtualizacji nie podlega temu wykazowi
    en:
      - Server operators will lose the means of setting the machine's clock
      - Software evening the clock at its start will stop correcting, often with no error reported
      - Synchronising of time with the domain and with an outside source works unchanged, since the time service stays in the list
      - The setting of time by the virtualisation host's integration tools does not fall under this list
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na serwerze pracuje oprogramowanie pomiarowe albo przemysłowe korygujące zegar z konta własnego
      - Nie ustalono, czy czas maszyny pochodzi od hosta wirtualizacji, czy z domeny
    en:
      - Measuring or industrial software correcting the clock from an account of its own works on the server
      - It has not been settled whether the machine's time comes from the virtualisation host or from the domain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeSystemTimePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeSystemTimePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeSystemTimePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeSystemTimePrivilege = *S-1-5-32-544,*S-1-5-19',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeSystemTimePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/change-the-system-time

notes:
  pl: |
    Konto usługi lokalnej zostaje w wykazie celowo — na nim pracuje
    usługa czasu systemowego. Usunięcie go zatrzymałoby synchronizację,
    czyli wywołałoby dokładnie ten skutek, przed którym punkt broni.

    Na kontrolerze domeny punkt waży najwięcej, bo maszyna ta jest
    źródłem czasu dla całej domeny. Rozbieżność zegara unieważnia
    bilety, a to zatrzymuje logowanie wszędzie, nie tylko tutaj.

    Punkt czyta się razem ze zmianą strefy czasowej. Strefa przesuwa
    czas pokazywany, zegar wewnętrzny zostaje ten sam — i dlatego tamten
    punkt jest niegroźny, a ten nie.
  en: |
    The local service account stays in the list on purpose - the system time service works under
    it. Removing it would halt the synchronising, that is, would raise the very effect the item
    guards against.

    On a domain controller the item weighs most, since that machine is the source of time for
    the whole domain. A divergence of the clock voids tickets, and that halts logging in
    everywhere, not here alone.

    The item is read together with the changing of the time zone. A zone shifts the time shown
    while the inner clock stays the same - and hence that item is harmless and this one is not.
