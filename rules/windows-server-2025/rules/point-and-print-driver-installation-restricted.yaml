id: win2025-point-and-print-driver-installation-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Instalacja sterowników drukarek zastrzeżona dla administratorów
    en: Printer driver installation restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi żądać uprawnień administratora przy
    instalowaniu i aktualizowaniu sterownika drukarki, także wtedy, gdy
    sterownik przychodzi z serwera wydruku.

    Sterownik drukarki nie jest plikiem opisującym urządzenie. Jest
    kodem, który zostaje wczytany do bufora wydruku i wykonany z jego
    uprawnieniami, czyli z uprawnieniami systemu. Instalacja sterownika
    jest więc z natury czynnością podnoszącą uprawnienia — pytanie brzmi
    tylko, kto wolno ją wykonać.

    Bez tego ustawienia wykonać ją może użytkownik bez żadnych uprawnień
    szczególnych, przez samo połączenie się z udostępnioną drukarką.
    Wystarczy, że drukarka ta stoi na maszynie kontrolowanej przez
    napastnika — a udostępnić drukarkę może każdy, na dowolnej maszynie
    w tej samej sieci.

    Jest to najkrótsza znana droga od konta zwykłego użytkownika do
    uprawnień systemu i była wykorzystywana szeroko. Nie wymaga błędu
    w kodzie ani żadnego wyrafinowania: mechanizm działa dokładnie tak,
    jak go zaprojektowano.

    Na serwerze droga ta prowadzi dalej niż na stanowisku roboczym.
    Uprawnienia systemu na serwerze aplikacyjnym to dostęp do danych
    wszystkich jego użytkowników i do poświadczeń kont usług. Na serwerze
    terminali to dodatkowo dostęp do sesji wszystkich zalogowanych osób,
    a użytkowników bez uprawnień szczególnych jest tam z definicji wielu.
    Na kontrolerze domeny to koniec domeny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    z konta zwykłego użytkownika do uprawnień systemu, przechodzoną przez
    samo połączenie się z drukarką udostępnioną na jego własnej maszynie.
  en: |
    The setting bids the system call for administrative rights at the installing and updating of a
    printer driver, also where the driver comes from a print server.

    A printer driver is not a file setting down a device. It is code that is read into the print
    spooler and run with its rights, that is with the system's rights. The installing of a driver
    is therefore by its nature a doing that raises rights - the only question is who is allowed to
    do it.

    Without this setting a user with no particular rights may do it, by the mere connecting to a
    shared printer. It is enough that the printer stands on a machine the attacker governs - and
    anyone may share a printer, on any machine in the same network.

    It is the shortest known road from an ordinary user's account to the system's rights and it
    was widely put to use. It calls for no fault in the code and for no subtlety: the mechanism
    works exactly as it was designed to.

    On a server that road leads further than at a working station. The system's rights on an
    application server mean access to the data of all its users and to the credentials of service
    accounts. On a terminal server they mean besides access to the sessions of all signed-in
    people, and users with no particular rights are there many by definition. On a domain
    controller they mean the end of the domain.

    What an attacker gains while the item goes unmet: a road from an ordinary user's account to
    the system's rights, walked by the mere connecting to a printer shared on a machine of their
    own.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz: czy ktokolwiek bez uprawnień
    administratora dodaje na tej maszynie drukarki.

    Na serwerze odpowiedź zależy od roli i jest to jedyny powód, dla
    którego ta zmiana nie idzie hurtem.

    Na serwerze aplikacyjnym, bazodanowym czy plikowym odpowiedź brzmi
    „nikt". Drukarki, jeżeli w ogóle są, dodaje administrator raz,
    przy wdrożeniu. Zmiana nie zepsuje tam niczego i jest to najtańsze
    zamknięcie tej drogi, jakie w ogóle istnieje.

    Na serwerze terminali odpowiedź bywa inna i trzeba na nią spojrzeć.
    Użytkownicy sesji zdalnych potrafią dodawać drukarki samodzielnie,
    a przekierowanie drukarki z maszyny klienta korzysta z tej samej
    ścieżki instalacji sterownika. Po zmianie takie przekierowanie
    powiedzie się tylko wtedy, gdy sterownik jest na serwerze już
    zainstalowany.

    Objaw jest wtedy czytelny, ale mylący co do przyczyny: drukarka
    użytkownika po prostu nie pojawia się w sesji, bez komunikatu o braku
    uprawnień. Warto to wiedzieć z góry, bo szuka się wtedy błędu
    w przekierowaniu, a nie w polityce sterowników.

    Odpowiedzią nie jest cofnięcie zmiany, tylko wgranie potrzebnych
    sterowników na serwer zawczasu — najlepiej sterowników uniwersalnych,
    które obsługują większość urządzeń bez osobnego pliku dla każdego
    modelu.

    Zmiana wymaga ponownego uruchomienia bufora wydruku. Na serwerze
    terminali i na serwerze wydruku oznacza to przerwanie zadań w toku,
    czyli skutek odczuwalny przez ludzi, którzy o zmianie nie wiedzą.

    Administrator instaluje sterowniki po zmianie tak samo jak przedtem.
  en: |
    One thing needs checking: whether anyone without administrative rights adds printers on this
    machine.

    On a server the answer hangs on the role, and that is the one reason this change does not go
    in bulk.

    On an application, database or file server the answer is "nobody". Printers, where there are
    any, are added by an administrator once, at the rollout. The change will break nothing there
    and it is the cheapest shutting of this road that is to be had at all.

    On a terminal server the answer is at times another and must be looked at. Users of remote
    sessions can add printers themselves, and the redirecting of a printer from a client's machine
    uses the same path of driver installation. After the change such a redirecting will succeed
    only where the driver is already installed on the server.

    The symptom is then plain but misleading as to its cause: the user's printer simply does not
    show up in the session, with no message about a want of rights. It is worth knowing
    beforehand, a fault being then sought in the redirecting and not in the policy of drivers.

    The answer is not the undoing of the change but the laying in of the needful drivers on the
    server beforehand - best of all universal drivers, which serve most devices with no separate
    file for each model.

    The change takes a fresh start of the print spooler. On a terminal server and on a print
    server that means the breaking of jobs under way, that is an effect felt by people who know
    nothing of the change.

    An administrator installs drivers after the change just as before.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
    - remote-desktop
  what_breaks:
    pl:
      - Użytkownik bez uprawnień administratora nie doda drukarki wymagającej instalacji sterownika
      - Przekierowanie drukarki z maszyny klienta do sesji zdalnej powiedzie się tylko dla sterownika już obecnego na serwerze
      - Drukarka użytkownika po prostu nie pojawi się w sesji, bez komunikatu o braku uprawnień
      - Ponowne uruchomienie bufora przerywa zadania w toku
      - Administrator instaluje sterowniki tak samo jak przedtem
    en:
      - A user without administrative rights will not add a printer calling for a driver installation
      - The redirecting of a printer from a client's machine into a remote session will succeed only for a driver already on the server
      - The user's printer will simply not show up in the session, with no message about a want of rights
      - A fresh start of the spooler breaks jobs under way
      - An administrator installs drivers just as before
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer terminali obsługuje przekierowanie drukarek klientów, a potrzebnych sterowników nie wgrano na niego zawczasu
      - Nie ustalono, czy ktokolwiek bez uprawnień administratora dodaje na tej maszynie drukarki
    en:
      - A terminal server serves the redirecting of clients' printers and the needful drivers were not laid in on it beforehand
      - It was not settled whether anyone without administrative rights adds printers on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
      $name = 'RestrictDriverInstallationToAdministrators'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    $name = 'RestrictDriverInstallationToAdministrators'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RestrictDriverInstallationToAdministrators' -Value 1 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Sterownik drukarki jest kodem wykonywanym z uprawnieniami systemu,
    więc jego instalacja jest z natury czynnością podnoszącą uprawnienia.
    Bez tego ustawienia wykonuje ją każdy użytkownik przez samo
    połączenie z drukarką udostępnioną na maszynie napastnika.

    Na serwerze terminali sprawdź wcześniej przekierowanie drukarek
    klientów. Po zmianie powiedzie się tylko dla sterowników już obecnych
    na serwerze, a objawem jest brak drukarki w sesji, bez komunikatu
    o uprawnieniach.

    Odpowiedzią jest wgranie sterowników uniwersalnych zawczasu, nie
    cofnięcie zmiany.
  en: |
    A printer driver is code run with the system's rights, so its installing is by its nature a
    doing that raises rights. Without this setting any user does it by the mere connecting to a
    printer shared on the attacker's machine.

    On a terminal server check the redirecting of clients' printers beforehand. After the change
    it will succeed only for drivers already on the server, and the symptom is a want of the
    printer in the session, with no message about rights.

    The answer is the laying in of universal drivers beforehand, not the undoing of the change.
