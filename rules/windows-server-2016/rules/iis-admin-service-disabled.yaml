id: win2016-iis-admin-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa administracyjna serwera sieciowego wyłączona
    en: The administrative service of the web server disabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa obsługuje starszą postać składnicy konfiguracji serwera
    sieciowego — tę, z której korzystały narzędzia i skrypty pisane, zanim
    konfiguracja przeniosła się do plików.

    Serwer sieciowy w wersji bieżącej tej składnicy nie potrzebuje.
    Konfigurację trzyma w plikach, czyta je sam i pozwala je zmieniać bez
    pośrednika. Usługa została jako most dla tego, co jeszcze mówi starym
    językiem: skryptów zarządzających, narzędzi migracyjnych i kilku
    składników zgodności.

    Most ten jest przy tym dwukierunkowy i na tym polega problem. Kto
    dosięgnie tej usługi, ten może czytać i zmieniać konfigurację serwera
    sieciowego — a zmiana konfiguracji serwera sieciowego jest w praktyce
    równoważna z możliwością uruchomienia kodu, bo wystarczy wskazać nowy
    katalog i nowy sposób jego obsługi.

    Wartość punktu polega więc na usunięciu drogi, której nie da się
    zamknąć innymi środkami, bo nie prowadzi przez witrynę ani przez port
    publiczny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    konfiguracji serwera sieciowego starszą drogą, omijającą wszystko, co
    zabezpiecza drogę bieżącą.
  en: |
    The service serves the older form of the web server's configuration store - the one
    used by tools and scripts written before the configuration moved into files.

    The web server in its current version does not need that store. It keeps its
    configuration in files, reads them itself and allows them to be changed with no
    go-between. The service stayed as a bridge for whatever still speaks the old tongue:
    management scripts, migration tools and a few compatibility components.

    That bridge is besides a two-way one, and in that lies the trouble. Whoever reaches
    this service may read and change the web server's configuration - and changing a web
    server's configuration amounts in practice to being able to run code, it being enough
    to name a new directory and a new way of serving it.

    The item's worth therefore lies in removing a road that cannot be shut by other means,
    leading as it does neither through a site nor through a public port.

    What an attacker gains while the item goes unmet: access to the web server's
    configuration by the older road, going round everything that guards the current one.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo na maszynie z rolą serwera
    sieciowego zależności bywają niewidoczne.

    Na maszynie bez tej roli usługi nie ma w ogóle i audyt zwraca stan
    „nie dotyczy". To jest przypadek najczęstszy i najprostszy.

    Na maszynie z tą rolą trzeba spojrzeć na dwie rzeczy. Pierwsza to
    skrypty zarządzające witrynami — te napisane starszą drogą przestaną
    działać, zgłaszając niemożność połączenia ze składnicą konfiguracji.
    Objaw jest jednoznaczny, ale pojawia się dopiero przy najbliższym
    uruchomieniu skryptu, a więc może minąć tydzień albo miesiąc.

    Druga to składniki serwera sieciowego zainstalowane dla zgodności ze
    starszymi aplikacjami. Bywa wśród nich obsługa metod, które dawno
    zastąpiono, i ta obsługa nadal przez tę usługę chodzi. Objawem jest
    błąd aplikacji, a nie serwera, więc trop prowadzi w złą stronę.

    Rzecz do zapamiętania jest taka, że sam serwer sieciowy pracuje dalej.
    Witryny działają, żądania są obsługiwane, nic publicznie widocznego się
    nie zmienia. Psuje się wyłącznie zarządzanie starszą drogą — i dlatego
    skutek bywa odkrywany długo po wdrożeniu.

    Czego to nie psuje: obsługi witryn, publikowania stron, zarządzania
    serwerem sieciowym drogą bieżącą, udziałów, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", the dependencies on a machine with the web
    server role being at times unseen.

    On a machine without that role the service is not there at all and the audit returns
    the state "not applicable". That is the commonest case and the simplest.

    On a machine with that role two things have to be looked at. The first is scripts
    managing sites - those written by the older road will stop working, reporting an
    inability to connect to the configuration store. The symptom is unambiguous but
    appears only at the script's next run, so a week or a month may pass.

    The second is web server components installed for compatibility with older
    applications. Among them is at times the serving of methods long since replaced, and
    that serving still goes through this service. The symptom is an error in the
    application rather than in the server, so the trail leads the wrong way.

    The thing to keep in mind is that the web server itself works on. Sites work, requests
    are served, nothing publicly visible changes. What breaks is solely management by the
    older road - and so the consequence is at times found long after the rollout.

    What this does not break: the serving of sites, the publishing of pages, management
    of the web server by the current road, shares, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - web-server-services
    - remote-management
  what_breaks:
    pl:
      - Skrypty zarządzające witrynami napisane starszą drogą zgłoszą niemożność połączenia ze składnicą konfiguracji
      - Objaw pojawia się dopiero przy najbliższym uruchomieniu skryptu, więc może minąć tydzień albo miesiąc
      - Składniki zgodności ze starszymi aplikacjami zgłoszą błąd po stronie aplikacji, a nie serwera, więc trop prowadzi w złą stronę
      - Obsługa witryn, publikowanie stron i zarządzanie serwerem drogą bieżącą pozostają bez zmian
    en:
      - Scripts managing sites written by the older road will report an inability to connect to the configuration store
      - The symptom appears only at the script's next run, so a week or a month may pass
      - Compatibility components for older applications will report an error on the application's side rather than the server's, so the trail leads the wrong way
      - The serving of sites, the publishing of pages and management of the server by the current road stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Witrynami na tej maszynie zarządzają skrypty sięgające do starszej składnicy konfiguracji
      - Na serwerze sieciowym zainstalowano składniki zgodności ze starszymi aplikacjami i nie ustalono, czego używają
    en:
      - Sites on this machine are managed by scripts reaching the older configuration store
      - Compatibility components for older applications are installed on the web server and it has not been established what they use
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\IISADMIN'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'IISADMIN' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This carries the older configuration store. On a machine that serves sites
    # it may be needed even though nothing appears to use it.
    Stop-Service -Name 'IISADMIN' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'IISADMIN' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'IISADMIN' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

notes:
  pl: |
    Punkt jest w tej czwórce najtrudniejszy do oceny, bo jego skutek jest
    opóźniony i niewidoczny publicznie. Nic się nie psuje w dniu wdrożenia,
    a psuje się przy najbliższym uruchomieniu czegoś, co uruchamia się
    rzadko.

    Warto to zestawić z regułą o konsoli awaryjnej z bloku poprzedniego.
    Oba punkty mają tę samą własność — cena płacona później niż wykonanie —
    i oba z tego powodu wymagają klasy wyższej, niż sugerowałby brak
    objawów. Jest to wzorzec, który aplikacja powinna umieć pokazywać jako
    wzorzec, a nie jako właściwość pojedynczych reguł.

    Zależność między punktami czwórki warto też nazwać. Ta usługa obsługuje
    konfigurację; usługa publikowania obsługuje żądania. Wyłączenie
    publikowania zatrzymuje witryny, ale zostawia konfigurację osiągalną —
    a więc zostawia drogę, o której ten punkt mówi. Kolejność wdrażania
    nie ma znaczenia, ale wdrożenie tylko jednego z dwóch zostawia robotę
    w połowie.
  en: |
    The item is the hardest of the four to assess, its consequence being put off and
    invisible publicly. Nothing breaks on the day of the rollout, and something breaks at
    the next run of something that runs rarely.

    That is worth setting beside the rule about the emergency console from the previous
    block. Both items have the same property - a price paid later than the execution - and
    both for that reason call for a class higher than the absence of symptoms would
    suggest. It is a pattern the application should be able to show as a pattern rather
    than as a property of single rules.

    The dependence among the four's items is worth naming too. This service serves the
    configuration; the publishing service serves requests. Switching publishing off stops
    the sites but leaves the configuration reachable - and so leaves the road this item
    speaks of. The order of rollout makes no difference, but rolling out only one of the
    two leaves the work half done.
