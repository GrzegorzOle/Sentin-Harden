id: win10-smb-server-signing-required

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podpisywanie komunikacji SMB wymagane po stronie serwera
    en: The signing of SMB traffic required on the server side
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga podpisu na sesjach przychodzących — czyli wtedy, gdy
    to ta maszyna wystawia zasób, a ktoś po niego sięga.

    Stanowisko robocze udostępnia częściej, niż się wydaje: folder wymiany
    z kolegą, drukarka podłączona przewodem, katalog, do którego skaner
    odkłada dokumenty. Każdy z tych zasobów jest usługą przyjmującą
    połączenia.

    Bez wymagania podpisu maszyna przyjmuje sesję, której nikt nie
    weryfikuje. Napastnik stojący w środku rozmowy między użytkownikiem
    a inną maszyną może przekazać zebrane tam uwierzytelnienie tutaj
    i wejść na udział w cudzym imieniu. Zasób jest wtedy dostępny
    z uprawnieniami osoby, która o niczym nie wie.

    Punkt jest bliźniaczy wobec poprzedniego i chroni przed tym samym
    mechanizmem, tylko od strony przeciwnej. Wykonanie jednego bez drugiego
    zostawia połowę drogi otwartą, przy czym która to połowa, zależy od
    tego, czy maszyna w danym momencie sięga, czy wystawia.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście na
    udziały tej maszyny z cudzym uwierzytelnieniem przekazanym z innej
    rozmowy.
  en: |
    The setting calls for a signature upon incoming sessions - which is to say when this machine sets a resource
    out and somebody reaches for it.

    A workplace shares more often than it seems: an exchange folder for a colleague, a printer joined by cable,
    a directory into which a scanner lays documents. Each of those resources is a service taking connections.

    Without a signature being required the machine takes in a session nobody checks. An attacker standing in the
    middle of a conversation between a user and another machine can pass the authentication gathered there on to
    here and enter the share in somebody's name. The resource is then to be had with the rights of a person who
    knows nothing of it.

    The item is twin to the foregoing one and guards against the same mechanism, only from the opposite side.
    Carrying out the one without the other leaves half the road open, and which half that is hangs upon whether
    the machine at the moment reaches out or sets out.

    What an attacker gains while the item goes unmet: entry to this machine's shares by somebody's
    authentication passed on from another conversation.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, kto się z tą
    maszyną łączy.

    Maszyna nieudostępniająca niczego nie odczuje zmiany wcale i jest to
    przypadek najczęstszy na stanowisku roboczym.

    Tam, gdzie zasób jest wystawiony, rozstrzyga sprzęt po drugiej stronie.
    Skanery sieciowe, drukarki wielofunkcyjne i urządzenia pomiarowe
    odkładające pliki na udział bywają podpisywania pozbawione i po zmianie
    zgłoszą odmowę dostępu. Komunikat nie wskaże przyczyny.

    Skutek mierzalny jest ten sam co przy regule poprzedniej: podpisywanie
    kosztuje czas procesora, więc odczyt dużych plików z udziałów tej maszyny
    zwolni. Widać to najbardziej, gdy po drugiej stronie stoi sprzęt starszy.

    Odnotowuję przerwę: zmiana wchodzi po restarcie usługi udostępniania
    plików, a ten zrywa otwarte połączenia do udziałów tej maszyny.

    Czego to nie psuje: uprawnień do zasobów, logowania, kont domenowych,
    drukowania przez kolejkę lokalną, aplikacji, sieci.
  en: |
    The class is "needs review", and the review touches who joins this machine.

    A machine setting nothing out will not feel the change at all, and that is the commonest case at a
    workplace.

    Where a resource is set out, the gear on the other side settles the matter. Network scanners, multifunction
    printers and measuring devices laying files onto a share are at times without signing, and after the change
    will report access denied. The message will not point at the cause.

    The measurable consequence is the same as at the foregoing rule: signing costs processor time, so the
    reading of large files off this machine's shares will slow. That is seen most where older gear stands on the
    other side.

    I set down the break: the change takes hold after a restart of the file-sharing service, and that tears down
    open connections to this machine's shares.

    What this does not break: the rights upon resources, logging on, domain accounts, printing through a local
    queue, applications, or the network.

implementation_consequences:
  impact_areas:
    - file-sharing
    - printing
    - network-and-firewall
    - legacy-authentication
  what_breaks:
    pl:
      - Urządzenia bez obsługi podpisywania przestają zapisywać pliki na udziałach tej maszyny
      - Skanery sieciowe odkładające dokumenty do folderu na tej maszynie tracą możliwość połączenia
      - Odczyt dużych plików z udziałów tej maszyny zwalnia, najbardziej gdy po drugiej stronie stoi sprzęt starszy
      - Restart usługi udostępniania plików, potrzebny do wejścia zmiany, zrywa otwarte połączenia do udziałów
      - Uprawnienia do zasobów, logowanie, konta domenowe i drukowanie przez kolejkę lokalną pozostają bez zmian
    en:
      - Devices without signing support cease writing files to this machines shares
      - Network scanners laying documents into a folder upon this machine lose the ability to join
      - The reading of large files off this machines shares slows, most of all where older gear stands on the other side
      - The restart of the file-sharing service, needed for the change to take hold, tears down open connections to shares
      - The rights upon resources, logging on, domain accounts and printing through a local queue stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Do udziałów tej maszyny łączą się urządzenia, których oprogramowanie podpisywania nie obsługuje
      - Maszyna pełni rolę magazynu plików dla sprzętu pomiarowego, którego nie da się zaktualizować
    en:
      - Devices whose software does not serve signing join this machines shares
      - The machine serves as a file store for measuring hardware that cannot be brought up to date
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
      $name = 'RequireSecuritySignature'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    $name = 'RequireSecuritySignature'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A side that cannot sign will be refused. The change takes hold once the
    # file-sharing service has been restarted, and that tears open connections to
    # this machines shares down.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSecuritySignature' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/smb-signing

notes:
  pl: |
    Reguła domyka parę o podpisywaniu. Warto, żeby aplikacja pokazywała obie
    razem i mówiła, że wykonanie jednej zostawia drugą stronę otwartą —
    inaczej użytkownik naprawi tę, którą zobaczy pierwszą, i uzna rzecz za
    załatwioną.

    Odnotowuję asymetrię w częstości. Strona sięgająca dotyczy każdej
    maszyny; strona wystawiająca dotyczy tylko tej, która coś udostępnia.
    Aplikacja mająca inwentaryzację udziałów mogłaby ten fakt wykorzystać
    i powiedzieć wprost, czy ta maszyna w ogóle coś wystawia — ostrzeżenie
    trafione w stan faktyczny jest tu warte więcej niż ogólne.

    Odnotowuję też, że obie reguły tej pary mają tę samą nazwę wartości
    w rejestrze i różnią się wyłącznie gałęzią usługi. Przy czytaniu kopii
    zapasowej łatwo je pomylić i warto, żeby aplikacja pokazywała ścieżkę,
    a nie samą nazwę.
  en: |
    The rule closes the pair about signing. It is well that the application show both together and say that
    carrying out the one leaves the other side open - or else the user will mend whichever they see first and
    hold the matter settled.

    I set down an unevenness in frequency. The side that reaches out touches every machine; the side that sets
    out touches only a machine sharing something. An application holding an inventory of shares could use that
    fact and say outright whether this machine sets anything out at all - a warning that meets the state of
    affairs being here worth more than a general one.

    I set down, too, that both rules of this pair carry the same value name in the registry and part only by the
    service's branch. While reading a backup they are easily confused, and it is well that the application show
    the path rather than the name alone.
