id: win2025-geolocation-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa ustalania położenia wyłączona
    en: The service determining the machine's whereabouts disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę ustalającą położenie maszyny i podającą je
    programom, które o nie proszą.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej i powód
    jest jednym z najczystszych w całej paczce: to, czego ta usługa
    broni, na serwerze nie jest tajemnicą.

    Na stacji roboczej położenie jest informacją o człowieku. Mówi, gdzie
    ktoś jest teraz, gdzie był wczoraj i jak się przemieszcza. Serwer nie
    przemieszcza się nigdzie. Stoi w tej samej szafie, w której stał rok
    temu, jego położenie jest wypisane na naklejce, w rejestrze środków
    trwałych i w umowie z ośrodkiem przetwarzania. Nie ma tu czego
    chronić, bo nie ma tu niczego, czego ktoś by nie wiedział.

    Zostaje wartość porządkowa i drobna: usługa ta w toku ustalania
    położenia sięga do sieci, a ruch wychodzący z serwera powinien dać
    się uzasadnić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: potwierdzenie
    położenia maszyny, która i tak nie zmienia miejsca i której adres
    fizyczny nie jest tajemnicą.
  en: |
    The item switches off the service that settles the machine's whereabouts and gives them to the
    programs that ask after them.

    I lower the category to low against the reckoning for a workstation, and the ground is one of the
    cleanest in the whole pack - what that service wards is upon a server no secret.

    Upon a workstation the whereabouts are a tiding of a person. They say where somebody is now, where
    they were yesterday and how they move about. A server moves nowhere. It stands in the same press
    wherein it stood a year ago, its whereabouts are written upon a sticker, in the roll of standing
    goods and in the writ with the house of working. There is here nothing to ward, there being
    nothing here that somebody would not know.

    What is left is a worth of order and a small one - that service, in the settling of the
    whereabouts, reaches to the net, and the traffic going out of a server ought to have something to
    stand by it.

    What an attacker gains while the item goes unmet - a making sure of the whereabouts of a machine
    that moves not in any case and whose bodily whereabouts are no secret.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Na serwerze nie ma aplikacji
    proszącej o położenie, bo nie ma zastosowania, w którym byłoby ono
    potrzebne — mapa, pogoda i sugestie oparte na okolicy to rzeczy
    stacji roboczej.

    Punkt ten idzie w parze z osobnym punktem o wyłączeniu ustalania
    położenia polityką i warto znać podział między nimi, bo wyglądają na
    powtórzenie. Ten wyłącza mechanizm — usługę, która położenie ustala.
    Tamten zapisuje decyzję — odmawia programom dostępu do położenia
    niezależnie od tego, czy mechanizm działa. Stosowane razem dają stan
    trwalszy niż każdy z osobna, bo sam typ uruchomienia usługi bywa
    przestawiany z powrotem przez instalator producenta, a wpis polityki
    mówi, co miało być, i przetrwa taką zmianę.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". Upon a server there is no application asking after the
    whereabouts, there being no use wherein they would be needed - a map, the weather and biddings
    grounded upon the neighbourhood are things of a workstation.

    This item goes hand in hand with an item of its own on the switching off of the settling of
    whereabouts by a rule, and it is worth knowing the sundering between them, they looking like a
    saying twice. This one switches off the working - the service that settles the whereabouts. That
    one writes down the deciding - it denies programs the reach to the whereabouts whether or not the
    working run. Laid on together they give a state more lasting than either alone, the kind of the
    starting of a service being at times set back by a maker's installer, while the entry of the rule
    says what was meant and outlives such an altering.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Programy proszące o położenie maszyny przestają je dostawać
      - Na serwerze nie ma zastosowania, w którym położenie byłoby potrzebne
      - Znika sięganie do sieci w toku ustalania położenia
      - Sam typ uruchomienia usługi bywa przestawiany z powrotem przez instalator producenta
    en:
      - Programs that ask after the machine's whereabouts stop being given them
      - Upon a server there is no use wherein the whereabouts would be needed
      - The reaching to the net in the settling of the whereabouts goes away
      - The kind of the starting of a service is at times set back by a maker's installer
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja, która potrzebuje położenia do działania
    en:
      - Upon the machine there stands an application that needs the whereabouts to work
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This switches off the mechanism. The separate policy item records the
    # decision and survives a vendor installer putting the startup type back,
    # so the two belong together.
    Stop-Service -Name 'lfsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lfsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'lfsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-windows-11-endpoints

notes:
  pl: |
    Jeden z najczystszych powodów obniżenia kategorii w całej paczce:
    to, czego ta usługa broni, na serwerze nie jest tajemnicą. Na stacji
    roboczej położenie jest informacją o człowieku — gdzie jest teraz,
    gdzie był wczoraj, jak się przemieszcza. Serwer stoi w tej samej
    szafie, w której stał rok temu.

    Podział wobec punktu o wyłączeniu ustalania położenia polityką: ten
    wyłącza mechanizm, tamten zapisuje decyzję. Razem dają stan trwalszy,
    bo typ uruchomienia usługi bywa przestawiany z powrotem przez
    instalator producenta, a wpis polityki taką zmianę przetrwa.
  en: |
    One of the cleanest grounds for the lowering of a category in the whole pack - what that service
    wards is upon a server no secret. Upon a workstation the whereabouts are a tiding of a person -
    where they are now, where they were yesterday, how they move about. A server stands in the same
    press wherein it stood a year ago.

    The sundering from the item on the switching off of the settling of whereabouts by a rule - this
    one switches off the working, that one writes down the deciding. Together they give a more lasting
    state, the kind of the starting of a service being at times set back by a maker's installer, while
    the entry of the rule outlives such an altering.
