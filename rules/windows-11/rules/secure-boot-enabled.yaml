id: win11-secure-boot-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Integrity > Boot
  title:
    pl: Bezpieczny rozruch włączony
    en: Secure Boot enabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Bezpieczny rozruch sprawdza podpis każdego elementu ładowanego przed
    systemem. Bez niego maszyna uruchomi dowolny program rozruchowy — także
    podmieniony — i zrobi to, zanim cokolwiek w systemie zdąży zadziałać.

    To jest fundament, na którym stoją pozostałe zabezpieczenia. Kod działający
    przed systemem widzi wszystko i może wyłączyć albo oszukać każdy mechanizm
    uruchamiany później: ochronę antywirusową, izolację poświadczeń,
    szyfrowanie. Żadne z nich nie broni się przed czymś, co było w maszynie
    wcześniej. Bez bezpiecznego rozruchu maszyna odzyskana po kradzieży nie
    nadaje się do dalszego użycia w tej samej roli.
  en: |
    Secure Boot verifies the signature of every component loaded before the
    system. Without it the machine will start any boot program - including a
    substituted one - and will do so before anything in the system gets a chance
    to act.

    This is the foundation the remaining protections stand on. Code running
    before the system sees everything and can disable or deceive every mechanism
    started later: antivirus protection, credential isolation, encryption. None
    of them defends against something that was in the machine first. Without
    Secure Boot, a machine recovered after a theft is unfit for further use in
    the same role.

disruption_description:
  pl: |
    Włączenie odbywa się w oprogramowaniu układowym, przy maszynie, poza
    systemem — dlatego ta reguła niczego nie uruchamia i podaje wyłącznie stan.

    Skutki są poważne. Maszyna uruchamiana w trybie zgodności wymaga
    przekonwertowania dysku na układ GPT, zanim bezpieczny rozruch da się
    włączyć; nieudana konwersja oznacza system, który nie startuje. Przestaną
    uruchamiać się także niepodpisane programy rozruchowe: część narzędzi
    serwisowych, starsze obrazy odzyskiwania i systemy na tej samej maszynie,
    których program rozruchowy nie ma podpisu uznawanego przez to urządzenie.
  en: |
    Enabling it happens in the firmware, at the machine, outside the system -
    which is why this rule runs nothing and only reports the state.

    The consequences are serious. A machine started in compatibility mode needs
    its disk converted to the GPT layout before Secure Boot can be turned on; a
    failed conversion means a system that does not start. Unsigned boot programs
    stop running too: some service tools, older recovery images, and systems on
    the same machine whose boot program lacks a signature this device recognises.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - drivers-and-devices
    - encryption-and-tls
  what_breaks:
    pl:
      - Niepodpisane programy rozruchowe i narzędzia serwisowe przestaną się uruchamiać
      - Maszyna w trybie zgodności wymaga konwersji układu dysku, zanim rozruch da się włączyć
      - Nieudana konwersja układu dysku kończy się systemem, który nie startuje
      - Systemy uruchamiane obok, bez uznawanego podpisu, przestaną być dostępne
    en:
      - Unsigned boot programs and service tools stop running
      - A machine in compatibility mode needs its disk layout converted before boot verification can be enabled
      - A failed disk layout conversion ends with a system that does not start
      - Other systems started alongside, lacking a recognised signature, become unavailable
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie uruchamia się system albo narzędzie bez podpisu uznawanego przez to urządzenie
      - Dysk używa układu zgodnościowego, a konwersji nie da się przeprowadzić z zabezpieczoną kopią danych
      - Producent sprzętu nie dostarcza aktualnych kluczy rozruchowych dla tego modelu
    en:
      - The machine runs a system or tool without a signature this device recognises
      - The disk uses the compatibility layout and conversion cannot be done with a secured copy of the data
      - The hardware vendor does not supply current boot keys for this model
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecureBoot\State'
      # The key exists only where the firmware knows the mechanism at all.
      # Its absence means a machine started the old way, and that is a finding
      # in itself rather than an inability to check.
      if (-not (Test-Path -Path $path)) { 'LEGACY_BOOT' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).UEFISecureBootEnabled
        if ($null -eq $value) { 'LEGACY_BOOT' }
        elseif ([int]$value -eq 1) { 'ENABLED' }
        else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

privileges: user
runnable: false

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/oem-secure-boot

notes:
  pl: |
    Reguła jest wyłącznie do odczytu i nie ma przycisku uruchomienia — nie
    dlatego, że brakuje kopii zapasowej, tylko dlatego, że zmiany nie da się
    wprowadzić z poziomu systemu. Polecenie do skopiowania też nie miałoby sensu:
    krok wykonuje się w oprogramowaniu układowym, przy maszynie.

    Brak klucza stanu raportuje jako rozruch w trybie zgodności, a nie jako
    niemożność sprawdzenia. To rozróżnienie jest tu istotne: maszyna bez
    bezpiecznego rozruchu nie jest maszyną, o której nic nie wiadomo — jest
    maszyną, o której wiadomo dość.

    Sprawdzenie czyta stan z rejestru, nie przez polecenie wymagające
    uprawnień administratora. Dzięki temu ten punkt daje wynik także
    w sesji nieuprzywilejowanej, w odróżnieniu od większości paczki.
  en: |
    The rule is read-only and has no run button - not because a backup is
    missing, but because the change cannot be made from within the system. A
    command to copy would make no sense either: the step is performed in the
    firmware, at the machine.

    A missing state key is reported as a compatibility-mode boot rather than an
    inability to check. That distinction matters here: a machine without Secure
    Boot is not a machine nothing is known about - it is a machine about which
    enough is known.

    The check reads the state from the registry rather than through a command
    requiring administrator rights. As a result this item yields a verdict in an
    unprivileged session too, unlike most of the pack.
