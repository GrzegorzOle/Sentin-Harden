id: win2025-rdp-temp-folders-per-session

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Temporary Folders
  title:
    pl: Osobny folder tymczasowy dla każdej sesji zdalnej
    en: A separate temporary folder for each remote session
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe wydzielić każdej sesji zdalnej własny folder
    tymczasowy, zamiast pozwalać sesjom dzielić jeden.

    Jest to punkt, którego wartość na serwerze jest wyraźnie wyższa niż
    na stanowisku roboczym, i warto powiedzieć wprost dlaczego, zamiast
    przenosić ocenę bez zmiany.

    Na stanowisku roboczym sesja jest jedna. Wydzielenie jej osobnego
    folderu tymczasowego jest porządkiem i niczym więcej — nie ma
    drugiej sesji, przed którą miałoby coś chronić.

    Na serwerze terminali sesji bywa kilkadziesiąt i należą do różnych
    osób. Wspólny folder tymczasowy oznacza wtedy, że pliki robocze
    wszystkich tych ludzi leżą w jednym miejscu. A w folderze
    tymczasowym ląduje więcej, niż się zwykle zakłada: załącznik
    otwarty z poczty przed zapisaniem, dokument w trakcie edycji,
    wydruk przygotowywany do wysłania, wyciąg z bazy zrobiony przez
    narzędzie raportujące, plik rozpakowany z archiwum.

    Skutkiem jest podglądanie cudzej pracy bez żadnego nadużycia
    uprawnień — plik po prostu leży tam, gdzie każdy zagląda. Nie
    zostawia to śladu, bo odczyt pliku we własnym folderze tymczasowym
    nie jest zdarzeniem, które ktokolwiek zbiera.

    Jest i strona druga, mniej oczywista: wspólny folder pozwala
    podłożyć plik pod cudzą sesję. Aplikacja, która sięga do swojego
    pliku tymczasowego po nazwie, może sięgnąć po plik, którego sama
    nie zapisała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wgląd
    w pliki robocze wszystkich osób pracujących na tej maszynie i miejsce,
    w którym da się podłożyć plik pod cudzą sesję.
  en: |
    The setting bids that each remote session be given a temporary folder of its own, instead of
    letting sessions share one.

    It is an item whose worth on a server is plainly higher than at a working station, and it is
    worth saying outright why, rather than carrying the reckoning over unchanged.

    At a working station there is one session. The setting apart of a temporary folder of its own
    is good order and nothing more - there is no second session it might guard anything against.

    On a terminal server there are at times dozens of sessions and they belong to differing people.
    A shared temporary folder means then that the working files of all those people lie in one
    place. And into a temporary folder there lands more than is usually supposed: an attachment
    opened from the post before it is saved, a document under editing, a printing made ready for
    sending, a drawing out of a database made by a reporting tool, a file unpacked out of an
    archive.

    The effect is the spying upon another's work with no misuse of rights at all - the file simply
    lies where everyone looks in. It leaves no trace, the reading of a file in one's own temporary
    folder not being an event anybody gathers.

    There is a second side too, less plain: a shared folder lets a file be laid under another's
    session. An application that reaches for its own temporary file by name may reach for a file it
    did not itself write.

    What an attacker gains while the item goes unmet: a sight of the working files of everybody
    working on this machine, and a place where a file may be laid under another's session.

disruption_description:
  pl: |
    W typowej instalacji zmiana jest niewidoczna, ale zaliczam ją do
    klasy wymagającej sprawdzenia, bo przypadek, który ją psuje, jest
    konkretny i spotykany właśnie na serwerach.

    Chodzi o oprogramowanie sięgające do folderu tymczasowego po stałej
    ścieżce — zapisanej w konfiguracji, wpisanej na sztywno w kodzie
    albo wyliczonej raz przy instalacji. Po wydzieleniu folderów
    aplikacja zapisuje plik gdzie indziej, niż go potem szuka.

    Wariant drugi zdarza się w układach wielomodułowych: jeden proces
    zapisuje plik tymczasowy, a drugi ma go odczytać. Jeżeli oba
    pracują w tej samej sesji, wszystko działa. Jeżeli drugi jest usługą
    albo zadaniem pracującym poza sesją, przestanie plik widzieć.

    Objaw bywa mylący i warto go znać: aplikacja zgłasza brak pliku
    albo błąd zapisu w miejscu, w którym dotąd działała bez zastrzeżeń,
    a ścieżka w komunikacie wygląda poprawnie. To, że folder jest teraz
    inny dla każdej sesji, nie jest z tego komunikatu widoczne.

    Poza tym jednym przypadkiem zmiana nie dotyka nikogo. Ludzie
    pracujący na serwerze nie zauważą niczego, bo system podstawia
    ścieżkę sam.

    Punkt czyta się razem z usuwaniem folderów tymczasowych po
    zakończeniu sesji. Ten mówi, żeby sesje się nie mieszały; tamten,
    żeby po sesji nie zostawało. Osobno każdy z nich zostawia połowę
    problemu.

    Zmiana wymaga ponownego zalogowania, żeby zadziałała — sesje już
    trwające pracują na folderze, który dostały przy nawiązaniu. Cofa
    się natychmiast, tak samo od następnego logowania.
  en: |
    In the usual installation the change is unseen, but I reckon it to the class taking a check,
    the case that breaks it being definite and met with on servers above all.

    It is about software reaching for the temporary folder by a fixed path - written in its
    settings, set hard in its code, or reckoned once at the installing. Once the folders are set
    apart, the application writes the file elsewhere than it afterwards looks for it.

    A second turn happens in many-module arrangements: one process writes a temporary file and
    another is to read it. Where both work in the same session all works. Where the second is a
    service or a job working outside a session, it will stop seeing the file.

    The symptom at times misleads and is worth knowing: the application reports a want of a file or
    a fault of writing in a place where it worked without blame until now, and the path in the
    message looks right. That the folder is now another for each session is not to be seen out of
    that message.

    Outside that one case the change touches nobody. People working on the server will notice
    nothing, the system setting the path in of itself.

    The item is read together with the removing of temporary folders once a session ends. This one
    says that sessions are not to mingle; that one, that nothing is to stay after a session. Apart,
    each of them leaves half the trouble.

    The change takes a signing in anew to work - sessions already running work on the folder they
    got at their opening. It is undone at once, likewise from the next signing in.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - legacy-applications
    - file-sharing
  what_breaks:
    pl:
      - Oprogramowanie sięgające do folderu tymczasowego po stałej ścieżce zapisze plik gdzie indziej, niż go szuka
      - Usługa albo zadanie pracujące poza sesją przestanie widzieć plik zapisany przez proces w sesji
      - Komunikat mówi o braku pliku, a ścieżka w nim wygląda poprawnie, więc przyczyna nie jest widoczna
      - Poza tym przypadkiem ludzie pracujący na serwerze nie zauważą niczego
      - Sesje już trwające pracują na folderze, który dostały przy nawiązaniu
    en:
      - Software reaching for the temporary folder by a fixed path will write the file elsewhere than it looks for it
      - A service or job working outside a session will stop seeing a file written by a process within a session
      - The message speaks of a want of a file and the path in it looks right, so the cause is not to be seen
      - Outside that case people working on the server will notice nothing
      - Sessions already running work on the folder they got at their opening
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie na tym serwerze sięga do folderu tymczasowego po ścieżce wpisanej na sztywno
      - Plik tymczasowy zapisywany w sesji ma być odczytany przez usługę pracującą poza sesją
    en:
      - Software on this server reaches for the temporary folder by a path set hard
      - A temporary file written within a session is to be read by a service working outside a session
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'PerSessionTempDir'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'PerSessionTempDir'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The folder is handed out at the opening of a session, so sessions already
    # running keep the one they got.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PerSessionTempDir' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    To jeden z nielicznych punktów, którego wartość na serwerze jest
    wyraźnie wyższa niż na stanowisku roboczym. Na stanowisku sesja jest
    jedna i wydzielenie folderu jest samym porządkiem. Na serwerze
    terminali sesji bywa kilkadziesiąt i należą do różnych osób.

    W folderze tymczasowym ląduje więcej, niż się zakłada: załącznik
    otwarty z poczty przed zapisaniem, dokument w trakcie edycji,
    wyciąg z bazy, plik rozpakowany z archiwum.

    Odczyt cudzego pliku nie zostawia przy tym śladu, bo nie jest
    zdarzeniem, które ktokolwiek zbiera.

    Czytaj razem z usuwaniem folderów po zakończeniu sesji — osobno
    każdy z tych punktów zostawia połowę problemu.
  en: |
    It is one of the few items whose worth on a server is plainly higher than at a working station.
    At a station there is one session and the setting apart of a folder is good order alone. On a
    terminal server there are at times dozens of sessions and they belong to differing people.

    Into a temporary folder there lands more than is supposed: an attachment opened from the post
    before it is saved, a document under editing, a drawing out of a database, a file unpacked out
    of an archive.

    The reading of another's file leaves withal no trace, not being an event anybody gathers.

    Read together with the removing of folders once a session ends - apart, each of these items
    leaves half the trouble.
