id: ubuntu2404-audit-tools-group

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.2.4.10
  section: Logging and Auditing > System Accounting (auditd) > Configure auditd File Access
  title:
    pl: Grupą narzędzi audytu jest root
    en: Ensure audit tools group owner is configured
  level: 2
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Grupa programu dostaje uprawnienia z drugiej cyfry trybu. Gdyby ktoś
    nadał grupie prawo zapisu, każdy jej członek mógłby podmienić narzędzie
    audytu.

    Punkt wymaga, żeby programom audytu była przypisana grupa root.
  en: |
    The group of a program gets the permissions of the second digit of the
    mode. If someone gave the group write access, any of its members could
    replace an audit tool.

    The item requires the audit programs to belong to the root group.

disruption_description:
  pl: |
    Nikt tego nie zauważy: narzędzia audytu uruchamia root, a zwykli
    użytkownicy i tak nie mogą z nich korzystać, bo jądro przyjmuje
    polecenia audytu tylko od roota.
  en: |
    Nobody will notice: the audit tools are run by root, and regular users
    cannot use them anyway, because the kernel accepts audit commands only
    from root.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    plist() {
      local t n=0
      for t in auditctl aureport ausearch autrace auditd augenrules; do
        [ -e "/usr/sbin/$t" ] || continue
        readlink -f -- "/usr/sbin/$t"; n=$((n + 1))
      done
      [ "$n" -gt 0 ] || { echo audit-not-installed; return 1; }
    }
    pok() { [ "$3" = root ]; }
    gok() { set -- '' '' "$1"; [ "$3" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    plist() {
      local t n=0
      for t in auditctl aureport ausearch autrace auditd augenrules; do
        [ -e "/usr/sbin/$t" ] || continue
        readlink -f -- "/usr/sbin/$t"; n=$((n + 1))
      done
      [ "$n" -gt 0 ] || { echo audit-not-installed; return 1; }
    }
    pok() { [ "$3" = root ]; }
    gok() { set -- '' '' "$1"; [ "$3" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      {
        echo format=perms-1
        printf '%s\n' "$l" | while IFS= read -r f; do
          [ -n "$f" ] && [ -e "$f" ] || continue
          printf '%s %s\n' "$(stat -c '%a %u %g' -- "$f")" "$f"
        done
      } > "$b.tmp"
      mv "$b.tmp" "$b"
      echo "Saved the owner and mode of $(( $(wc -l < "$b") - 1 )) paths"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    plist() {
      local t n=0
      for t in auditctl aureport ausearch autrace auditd augenrules; do
        [ -e "/usr/sbin/$t" ] || continue
        readlink -f -- "/usr/sbin/$t"; n=$((n + 1))
      done
      [ "$n" -gt 0 ] || { echo audit-not-installed; return 1; }
    }
    pok() { [ "$3" = root ]; }
    gok() { set -- '' '' "$1"; [ "$3" = root ]; }
    evaluate() {
      local l f n=0 bad=0 first="" m o g
      if ! l=$(plist); then echo "NOT_OK:$l"; return; fi
      while IFS= read -r f; do
        [ -n "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f" 2>/dev/null)"
        [ -n "$m" ] || continue
        n=$((n + 1))
        pok "$m" "$o" "$g" || { bad=$((bad + 1)); [ -n "$first" ] || first="$f=$m:$o:$g"; }
      done <<< "$l"
      if [ "$bad" -gt 0 ]; then echo "NOT_OK:bad=$bad,$first"; else echo "OK:paths=$n"; fi
    }
      l=$(plist) || { echo "Cannot list the paths: $l" >&2; exit 1; }
      n=0
      while IFS= read -r f; do
        [ -n "$f" ] && [ -e "$f" ] || continue
        read -r m o g <<< "$(stat -c '%a %U %G' -- "$f")"
        ! pok "$m" "$o" "$g" || continue
        gok "$g" || chgrp root -- "$f"
        chmod "$(printf '0%04o' $(( 0$m )))" -- "$f"
        n=$((n + 1))
      done <<< "$l"
      echo "Corrected $n paths"
      r=$(evaluate)
      case "$r" in OK:*) ;; *) echo "Paths still not as required ($r)" >&2; exit 1 ;; esac
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=perms-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      if tail -n +2 "$b" | grep -qvE '^[0-7]+ [0-9]+ [0-9]+ /'; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      n=0
      while read -r m u g f; do
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        read -r cm cu cg <<< "$(stat -c '%a %u %g' -- "$f")"
        k=0
        [ "$cg" = "$g" ] || { chgrp "$g" -- "$f"; k=1; }
        [ "$k" = 1 ] || continue
        chmod "$(printf '0%04o' $(( 0$cm )))" -- "$f"
        echo "Restored $f"; n=$((n + 1))
      done < <(tail -n +2 "$b")
      [ "$n" -gt 0 ] || echo "Nothing to restore"
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man8/auditctl.8.html
  - https://man7.org/linux/man-pages/man8/auditd.8.html
  - https://man7.org/linux/man-pages/man8/augenrules.8.html

notes:
  pl: |
    Punkt obejmuje auditctl, aureport, ausearch, autrace, auditd
    i augenrules z /usr/sbin (w Ubuntu /sbin jest dowiązaniem do /usr/sbin).
    Programy są czytelne dla każdego, więc test działa także bez roota.
    Naprawa zmienia tylko grupę na root; tryb i właściciel pozostają bez
    zmian.
    Pakiet auditd instaluje te programy jako 755 root:root, więc
    aktualizacja pakietu przywraca stan zgodny z punktem.
    Wycofanie przywraca tylko to, czym reguła zarządza (tryb, właściciela
    albo grupę), i tylko dla ścieżek, które nadal istnieją, więc reguły
    trybu, właściciela i grupy tych samych plików można wycofywać osobno.
  en: |
    The item covers auditctl, aureport, ausearch, autrace, auditd and
    augenrules in /usr/sbin (in Ubuntu /sbin is a link to /usr/sbin). The
    programs are readable by anyone, so the test also works without root.
    The remediation only changes the group to root; the mode and owner stay
    unchanged.
    The auditd package installs these programs as 755 root:root, so a
    package update restores a state that meets the item.
    Rollback restores only what the rule manages (mode, owner or group),
    and only for the paths that still exist, so the mode, owner and group
    rules for the same files can be rolled back separately.
