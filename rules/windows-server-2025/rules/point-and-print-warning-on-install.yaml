id: win2025-point-and-print-warning-on-install

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers > Point and Print Restrictions
  title:
    pl: Ostrzeżenie przy instalacji sterownika drukarki sieciowej
    en: Warning when installing a network printer driver
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przywraca ostrzeżenie i prośbę o podniesienie uprawnień
    w chwili, gdy maszyna ma zainstalować u siebie sterownik pobrany
    z serwera wydruku.

    Przeciwna wartość jest wygodna i właśnie dlatego bywa ustawiana:
    użytkownik podłącza drukarkę, sterownik instaluje się sam, nikt
    o nic nie pyta. Cena tej wygody jest taka, że kod pobrany z maszyny
    sieciowej zostaje wykonany z uprawnieniami systemu bez żadnego
    punktu, w którym cokolwiek dałoby się zatrzymać.

    Warto być tu uczciwym co do tego, ile ten punkt wnosi. Prośba
    o zgodę nie sprawdza, czy sterownik jest dobry — sprawdza tylko,
    czy ktoś obecny przy maszynie się na niego godzi. Na stanowisku
    roboczym ma to wartość mierną, bo człowiek klika zgodę odruchowo.

    Na serwerze rzecz wygląda inaczej i to jest różnica warta nazwania.
    Przy serwerze nikt nie siedzi. Pytanie, na które nie ma kto
    odpowiedzieć, nie jest pytaniem — jest odmową. Ustawienie to działa
    więc na serwerze twardziej niż na stanowisku: instalacja sterownika
    z serwera wydruku przez proces działający bez udziału człowieka po
    prostu się nie powiedzie.

    Jest to skutek dobry i taki właśnie ma być, ale trzeba go rozumieć,
    bo w raporcie wygląda jak łagodne ostrzeżenie, a w praktyce jest
    zakazem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    własnego sterownika na serwerze bez jednego momentu, w którym
    cokolwiek wymagałoby czyjejkolwiek decyzji.
  en: |
    The setting brings back a warning and a call for a raising of rights at the moment a machine is
    to install in itself a driver fetched from a print server.

    The opposite value is handy and for just that reason gets set: a user connects a printer, the
    driver installs itself, nobody is asked anything. The price of that ease is that code fetched
    from a machine on the network is run with the system's rights with no point at which anything
    might be stopped.

    It is worth being honest here about how much this item brings. A call for consent does not
    check whether a driver is good - it checks only whether somebody present at the machine agrees
    to it. At a working station that is of middling worth, a person clicking consent by reflex.

    On a server the matter looks otherwise, and that is a difference worth naming. Nobody sits at
    a server. A question nobody is there to answer is no question - it is a refusal. This setting
    works therefore harder on a server than at a station: the installing of a driver from a print
    server by a process working with no person's part will simply not succeed.

    It is a good effect and just the one intended, but it must be understood, for in the report it
    looks like a mild warning and in practice it is a ban.

    What an attacker gains while the item goes unmet: the installing of a driver of their own on a
    server with not one moment at which anything would call for anybody's decision.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedna rzecz i wynika wprost z tego, co napisano
    wyżej: czy na tym serwerze cokolwiek instaluje sterowniki drukarek
    bez udziału człowieka.

    Typowe przypadki są dwa. Pierwszy to skrypt logowania albo zasada
    grupy podłączająca drukarki przy starcie sesji — spotykany
    najczęściej na serwerze terminali. Drugi to przekierowanie drukarki
    z maszyny klienta do sesji zdalnej, które korzysta z tej samej
    ścieżki.

    W obu przypadkach po zmianie zadziała to nadal, ale wyłącznie dla
    sterowników już obecnych na serwerze. Dla pozostałych instalacja
    cicho się nie powiedzie, bo nie ma komu potwierdzić.

    Objaw jest mylący: drukarka nie pojawia się w sesji, bez komunikatu
    i bez wpisu, który rzucałby się w oczy. Szuka się wtedy przyczyny
    w przekierowaniu albo w samej drukarce, a leży ona w polityce
    sterowników.

    Odpowiedzią jest wgranie na serwer sterowników potrzebnych ludziom
    zawczasu, najlepiej uniwersalnych. Nie jest nią cofnięcie zmiany,
    bo to przywraca dokładnie tę drogę, o którą w tym punkcie chodzi.

    Administrator pracujący przy maszynie interaktywnie instaluje
    sterowniki po zmianie tak samo jak przedtem — zobaczy tylko pytanie
    o zgodę.

    Zmiana wymaga ponownego uruchomienia bufora wydruku, czyli przerwania
    zadań w toku.

    Punkt czyta się razem z ostrzeżeniem przy aktualizacji sterownika.
    Ustawienie jednego bez drugiego zostawia otwartą drugą połowę tej
    samej ścieżki.
  en: |
    One thing needs checking and it follows straight from what was written above: whether anything
    on this server installs printer drivers with no person's part.

    The usual cases are two. The first is a sign-in script or a group policy connecting printers at
    the start of a session - met most often on a terminal server. The second is the redirecting of
    a printer from a client's machine into a remote session, which uses the same path.

    In both cases it will work after the change still, but for drivers already on the server
    alone. For the rest the installing will quietly fail, there being nobody to bear it out.

    The symptom misleads: the printer does not show up in the session, with no message and with no
    entry that would catch the eye. The cause is then sought in the redirecting or in the printer
    itself, and it lies in the policy of drivers.

    The answer is the laying in on the server of the drivers people need beforehand, best of all
    universal ones. It is not the undoing of the change, that bringing back exactly the road this
    item is about.

    An administrator working at the machine face to face installs drivers after the change just as
    before - they will only see a question about consent.

    The change takes a fresh start of the print spooler, that is the breaking of jobs under way.

    The item is read together with the warning at the updating of a driver. Setting one without
    the other leaves the other half of the same path open.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
    - remote-desktop
  what_breaks:
    pl:
      - Skrypt logowania podłączający drukarki zainstaluje tylko te sterowniki, które już są na serwerze
      - Przekierowanie drukarki klienta do sesji zdalnej powiedzie się tylko dla sterownika obecnego na serwerze
      - Instalacja bez udziału człowieka nie powiedzie się cicho, bo nie ma komu potwierdzić
      - Administrator pracujący interaktywnie zobaczy pytanie o zgodę i zainstaluje sterownik jak przedtem
      - Ponowne uruchomienie bufora przerywa zadania w toku
    en:
      - A sign-in script connecting printers will install only those drivers already on the server
      - The redirecting of a client's printer into a remote session will succeed only for a driver on the server
      - An installing with no person's part will quietly fail, there being nobody to bear it out
      - An administrator working face to face will see a question about consent and install the driver as before
      - A fresh start of the spooler breaks jobs under way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Drukarki są podłączane przy logowaniu przez skrypt i instalacja ma przebiegać bez udziału człowieka
      - Serwer terminali przekierowuje drukarki klientów, a ich sterowników nie wgrano na niego zawczasu
    en:
      - Printers are connected at sign-in by a script and the installing is meant to go through with no person's part
      - A terminal server redirects clients' printers and their drivers were not laid in on it beforehand
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
      $name = 'NoWarningNoElevationOnInstall'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    $name = 'NoWarningNoElevationOnInstall'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoWarningNoElevationOnInstall' -Value 0 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Na serwerze nikt nie siedzi, więc pytanie, na które nie ma kto
    odpowiedzieć, jest odmową. Ustawienie działa tu twardziej niż na
    stanowisku roboczym — w raporcie wygląda jak ostrzeżenie, a
    w praktyce jest zakazem instalacji bez udziału człowieka.

    Prośba o zgodę nie sprawdza, czy sterownik jest dobry. Sprawdza
    tylko, czy ktoś obecny przy maszynie się na niego godzi.

    Czytaj razem z ostrzeżeniem przy aktualizacji sterownika.
  en: |
    Nobody sits at a server, so a question nobody is there to answer is a refusal. The setting
    works here harder than at a working station - in the report it looks like a warning and in
    practice it is a ban on installing with no person's part.

    A call for consent does not check whether a driver is good. It checks only whether somebody
    present at the machine agrees to it.

    Read together with the warning at the updating of a driver.
