id: win2025-microsoft-account-authentication-blocked

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft account
  title:
    pl: Uwierzytelnianie kontem konsumenckim zablokowane
    en: Authentication with a consumer account blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje uwierzytelnianie kontem konsumenckim — kontem zakładanym
    przez człowieka u dostawcy, poza jakąkolwiek kontrolą organizacji.

    Kategoria wysoka i chcę nazwać, na czym polega tu problem, bo konto to
    konto. Rzecz w tym, kto nim zarządza. Konto domenowe da się wyłączyć,
    da się wymusić na nim zmianę hasła, da się sprawdzić, kiedy i skąd się
    logowało. Konto konsumenckie jest własnością osoby, nie organizacji —
    odejście pracownika nie odbiera mu go, a zmiana hasła w nim nie jest
    niczyją decyzją poza jego własną.

    To jest właściwa treść punktu. Dostęp do zasobu przypięty do takiego
    konta przeżywa rozstanie z organizacją i nie widać go w żadnym
    przeglądzie uprawnień prowadzonym po stronie domeny. Powstaje droga
    dostępu, o której nie wie ten, kto za dostęp odpowiada.

    Na serwerze punkt jest wyraźniejszy niż na stanowisku. Konto
    konsumenckie na serwerze nie ma zastosowania, które dałoby się obronić,
    a każda jego obecność oznacza, że ktoś postawił tu ścieżkę poza
    porządkiem domenowym.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    związania dostępu do maszyny z kontem, którego organizacja nie wyłączy,
    nie zresetuje i nie zobaczy w przeglądzie uprawnień.
  en: |
    The item blocks authentication with a consumer account - an account set
    up by a person with a provider, outside any control of the organisation.

    The category is high, and I want to name where the problem lies, because
    an account is an account. The matter is who administers it. A domain
    account can be disabled, a password change can be forced on it, it can be
    checked when and from where it signed in. A consumer account is the
    property of a person, not of the organisation - an employee's departure
    does not take it from them, and a change of its password is nobody's
    decision but their own.

    That is the real substance of the item. Access to a resource pinned to
    such an account survives a parting with the organisation and shows in no
    review of rights carried out on the domain's side. A route of access
    comes into being which the person answering for access does not know of.

    On a server the item is plainer than on a workstation. A consumer account
    on a server has no use that could be defended, and every presence of one
    means somebody has laid a path here outside the domain order.

    What an attacker gains while the item goes unmet: the ability to tie
    access to the machine to an account the organisation will not disable,
    will not reset and will not see in a review of rights.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to ocena poważna, mimo że na
    serwerze takich kont zwykle nie ma. Powód jest jeden: jeżeli są, reguła
    odetnie komuś dostęp do maszyny, a objaw pojawi się przy logowaniu.

    Dlatego kolejność jest tu odwrotna niż zwykle. Najpierw sprawdź, czy na
    tej maszynie istnieje profil związany z kontem konsumenckim i czy
    ktokolwiek się nim loguje. Dopiero potem zastosuj. Sprawdzenie zajmuje
    minutę, a pominięte zamienia się w zgłoszenie od osoby, która nie może
    wejść na serwer.

    Drugą rzeczą do przemyślenia jest to, że część aplikacji ze sklepu
    prosi o takie konto przy pierwszym uruchomieniu. Po zastosowaniu reguły
    zgłoszą błąd logowania. Na serwerze takich aplikacji zwykle nie ma,
    ale to jest właśnie ten szczegół, który warto sprawdzić zamiast
    założyć.

    Czego to nie psuje: kont domenowych, kont lokalnych, kont usługowych,
    logowania do usług organizacji ani niczego, co idzie przez porządek
    domenowy.

    Wymaga wylogowania, żeby zadziałało w bieżącej sesji. Natychmiast
    odwracalne, ale decyzję podejmuj punkt po punkcie, nie w trybie
    zbiorczym.
  en: |
    The class is "needs planned rollout", and that is a serious assessment,
    even though such accounts are usually absent from a server. The reason is
    single: if they are there, the rule will cut somebody off from the
    machine, and the symptom will appear at sign-in.

    The order is therefore the reverse of usual here. First check whether a
    profile tied to a consumer account exists on this machine and whether
    anybody signs in with it. Only then apply. The check takes a minute;
    skipped, it turns into a report from somebody who cannot get onto the
    server.

    The second thing to think through is that some store applications ask for
    such an account when first started. After the rule is applied they will
    report a sign-in error. On a server such applications are usually absent,
    but that is exactly the detail worth checking rather than assuming.

    What this does not break: domain accounts, local accounts, service
    accounts, signing in to the organisation's services, or anything that
    goes through the domain order.

    It needs a sign-out to take effect in the current session. Undone
    immediately, but take the decision item by item, not in the bulk mode.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Osoba logująca się na tę maszynę kontem konsumenckim przestanie się logować, a objaw pojawi się przy logowaniu
      - Sprawdź przed zastosowaniem, czy istnieje profil związany z takim kontem i czy ktoś się nim loguje
      - Aplikacje ze sklepu proszące o takie konto przy pierwszym uruchomieniu zgłoszą błąd logowania
      - Konta domenowe, lokalne i usługowe oraz logowanie do usług organizacji działają bez zmian
    en:
      - Anybody signing in to this machine with a consumer account stops being able to, and the symptom appears at sign-in
      - Check before applying whether a profile tied to such an account exists and whether anybody signs in with it
      - Store applications that ask for such an account when first started will report a sign-in error
      - Domain, local and service accounts and signing in to the organisation's services work unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Na tej maszynie istnieje profil związany z kontem konsumenckim, którym ktoś się loguje albo z którego korzysta aplikacja
    en:
      - A profile tied to a consumer account exists on this machine and somebody signs in with it or an application uses it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
      $name = 'DisableUserAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    $name = 'DisableUserAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A consumer account is the property of a person, not of the organisation:
    # it cannot be disabled, its password cannot be reset, and access pinned to
    # it survives a parting. Check first whether anybody signs in to this machine
    # with such an account - the symptom would appear at sign-in.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUserAuth' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-accounts

notes:
  pl: |
    Konto to konto — rzecz w tym, kto nim zarządza. Konto domenowe da się
    wyłączyć, zresetować i prześledzić. Konto konsumenckie jest własnością
    osoby: odejście z organizacji go nie odbiera, a zmiana hasła nie jest
    niczyją decyzją poza jego własną.

    Dostęp przypięty do takiego konta przeżywa rozstanie z organizacją
    i nie widać go w przeglądzie uprawnień po stronie domeny.

    Kolejność odwrotna niż zwykle: najpierw sprawdź, czy ktoś się tu takim
    kontem loguje, potem zastosuj. Sprawdzenie zajmuje minutę, pominięte
    wraca jako zgłoszenie od osoby, która nie może wejść na serwer.
  en: |
    An account is an account - the matter is who administers it. A domain
    account can be disabled, reset and traced. A consumer account is a
    person's property: leaving the organisation does not take it from them,
    and a password change is nobody's decision but their own.

    Access pinned to such an account survives a parting with the
    organisation and shows in no review of rights on the domain's side.

    The order is the reverse of usual: first check whether anybody signs in
    here with such an account, then apply. The check takes a minute; skipped,
    it comes back as a report from somebody who cannot get onto the server.
