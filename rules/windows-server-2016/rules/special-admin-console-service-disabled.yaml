id: win2016-special-admin-console-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konsoli awaryjnej dostępnej poza systemem wyłączona
    en: The emergency console service reachable outside the system disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa udostępnia konsolę awaryjną, przez którą da się sterować maszyną
    łączem szeregowym — także wtedy, gdy system nie wstał albo nie przyjmuje
    już logowania zwykłą drogą.

    Konsola ta nie jest zwykłą powłoką. Pozwala wypisać procesy, zabić
    proces, zmienić adres, ponownie uruchomić maszynę i otworzyć sesję
    poleceń — zanim system dojdzie do stanu, w którym cokolwiek działa
    normalnie. Po to właśnie powstała i w tym leży jej wartość.

    W tym też leży jej niebezpieczeństwo, bo droga ta omija wszystko, co
    stoi na drodze zwykłej. Nie ma tu zasad logowania z katalogu, nie ma
    zapory, nie ma zwykle nadzoru, a uwierzytelnienie odbywa się już po
    uzyskaniu dostępu do łącza. Kto ma dostęp do łącza szeregowego albo do
    jego odpowiednika w sterowniku zarządzania płyty, ten stoi przed
    maszyną w sposób, którego żadna reguła sieciowa nie ogranicza.

    W serwerowni fizycznej znaczy to dostęp kablowy. W maszynie wirtualnej
    i w serwerze z kontrolerem zarządzania znaczy to dostęp przez sieć
    zarządzania — a ta bywa gorzej strzeżona niż produkcyjna właśnie
    dlatego, że wygląda na wewnętrzną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sterowanie
    maszyną drogą omijającą zaporę, zasady logowania i nadzór, dostępne
    także wtedy, gdy system nie działa.
  en: |
    The service opens an emergency console through which the machine may be steered over
    a serial link - also where the system has not come up or no longer takes a sign-in by
    the ordinary road.

    That console is no ordinary shell. It allows processes to be listed, a process to be
    killed, an address to be changed, the machine to be restarted and a command session
    to be opened - before the system reaches a state in which anything works normally.
    For that it came about and in that lies its worth.

    In that too lies its danger, the road going round everything standing in the ordinary
    road's way. There are here no sign-in policies from the directory, no firewall, as a
    rule no monitoring, and the authentication happens after access to the link has
    already been got. Whoever has access to the serial link, or to its counterpart in the
    board's management controller, stands before the machine in a way no network rule
    limits.

    In a physical server room that means access by cable. In a virtual machine and in a
    server with a management controller it means access over the management network - and
    that is at times worse guarded than the production one, precisely because it looks
    like an inner one.

    What an attacker gains while the item goes unmet: the steering of the machine by a
    road going round the firewall, the sign-in policies and the monitoring, reachable
    also where the system is not working.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i jest to jeden z nielicznych
    punktów, w których wdrożenie odbiera narzędzie ratunkowe.

    Trzeba to powiedzieć wprost, bo inaczej opis byłby nieuczciwy. Konsola
    ta jest w części serwerowni jedyną drogą do maszyny, która nie wstaje.
    Serwer w odległej lokalizacji, bez nikogo na miejscu, z systemem
    zatrzymanym przed uruchomieniem sieci, jest bez niej maszyną, do której
    trzeba pojechać.

    Rozstrzygnięcie zależy więc od jednej rzeczy: czy istnieje inna droga
    do maszyny w tym stanie. Kontroler zarządzania z własną konsolą
    graficzną, konsola nadzorcy maszyn wirtualnych, dostęp fizyczny
    w rozsądnym czasie — każda z tych rzeczy zastępuje tę konsolę
    i wtedy wdrożenie nie odbiera nic.

    Jeżeli żadnej z nich nie ma, punkt jest kandydatem do świadomego
    odpuszczenia i aplikacja powinna pozwolić tak zdecydować z zapisanym
    uzasadnieniem. Nie jest to przegrana — jest to wybór między ryzykiem
    zdalnego sterowania a ryzykiem maszyny nieosiągalnej.

    Skutek bieżący jest przy tym żaden. Dopóki maszyna działa, konsoli
    tej nikt nie używa i jej wyłączenie nie zmienia niczego widocznego.
    Cena płaci się dopiero w dniu awarii.

    Czego to nie psuje: pracy bieżącej maszyny, zarządzania zdalnego,
    pulpitu zdalnego, usług, sieci.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and it is one of the few items at which the
    rollout takes away a rescue tool.

    That has to be said outright, the description being otherwise dishonest. In some
    server rooms that console is the only road to a machine that will not come up. A
    server in a distant location, with nobody on site and the system halted before the
    network starts, is without it a machine one has to drive to.

    The settling of it therefore hangs on one thing: whether another road to the machine
    in that state exists. A management controller with its own graphical console, a
    virtual machine supervisor's console, physical access within a sensible time - each
    of those replaces this console, and then the rollout takes nothing away.

    If none of them is there, the item is a candidate for being deliberately let go and
    the application should allow such a decision with a recorded warrant. It is no defeat
    - it is a choice between the risk of remote steering and the risk of an unreachable
    machine.

    The present consequence is for all that none. As long as the machine works, nobody
    uses that console and switching it off changes nothing visible. The price is paid
    only on the day of a failure.

    What this does not break: the machine's day-to-day working, remote management, the
    remote desktop, services, or the network.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - remote-management
    - boot-and-firmware
    - logging-and-audit
  what_breaks:
    pl:
      - Maszyna, która nie wstaje, przestaje być osiągalna tą drogą i wymaga dojazdu albo innej konsoli poza systemem
      - Skutek nie jest widoczny w dniu wdrożenia - cena płaci się dopiero w dniu awarii
      - Kontroler zarządzania z własną konsolą albo konsola nadzorcy maszyn wirtualnych zastępują tę drogę w całości
      - Praca bieżąca maszyny, zarządzanie zdalne i pulpit zdalny pozostają bez zmian
    en:
      - A machine that will not come up ceases to be reachable by this road and calls for a drive out or another console outside the system
      - The consequence is not visible on the day of the rollout - the price is paid only on the day of a failure
      - A management controller with its own console, or a virtual machine supervisor's console, replaces this road entirely
      - The machine's day-to-day working, remote management and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna stoi w odległej lokalizacji bez obsługi na miejscu, a konsola szeregowa jest jedyną drogą do systemu, który nie wstał
      - Serwer nie ma kontrolera zarządzania ani nadzorcy maszyn wirtualnych z własną konsolą
    en:
      - The machine stands in a distant location with nobody on site, and the serial console is the only road to a system that has not come up
      - The server has no management controller and no virtual machine supervisor with its own console
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\sacsvr'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'sacsvr' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The console reachable outside the system goes away. Make sure another road
    # into an unbootable machine exists before running.
    Stop-Service -Name 'sacsvr' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'sacsvr' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'sacsvr' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/administration/windows-commands/sac

notes:
  pl: |
    Punkt jest w całym dotychczasowym zestawie najbliższy sytuacji, w której
    wdrożenie zwiększa ryzyko innego rodzaju, zamiast je tylko przenosić.
    Nie wolno tego ukrywać za formułą o kandydacie do odpuszczenia.

    Aplikacja powinna przy tym punkcie zapytać o jedną rzecz, a nie
    przedstawiać listy skutków: czy do tej maszyny w stanie, w którym nie
    wstaje, prowadzi jeszcze jakaś droga. Odpowiedź rozstrzyga i jest
    krótka, a bez niej cały opis jest tylko materiałem do czytania.

    Warto też odnotować, że punkt nie ma skutku w dniu wdrożenia. Jest to
    rzadka własność i myląca, bo zachęca do wykonania hurtem. Klasa
    wymagająca świadomego wdrożenia jest tu postawiona właśnie po to, żeby
    punkt nie trafił do trybu zbiorczego na podstawie braku widocznych
    objawów.
  en: |
    The item is in the whole set so far the closest to a case where a rollout raises a
    risk of another kind rather than merely shifting it. That must not be hidden behind a
    formula about a candidate for being let go.

    At this item the application should ask one thing rather than set out a list of
    consequences: whether any road still leads to this machine in the state where it will
    not come up. The answer settles it and is a short one, and without it the whole
    description is only reading matter.

    Worth noting too that the item has no consequence on the day of the rollout. It is a
    rare property and a misleading one, tempting as it does to bulk execution. The class
    needing a planned rollout is put here precisely so that the item does not reach bulk
    mode on the strength of an absence of visible symptoms.
