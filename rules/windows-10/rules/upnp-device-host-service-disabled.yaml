id: win10-upnp-device-host-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Udostępnianie maszyny jako urządzenia sieciowego wyłączone
    en: The giving out of the machine as gear of the network switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zgłaszającą maszynę w sieci lokalnej jako
    urządzenie, z którego inni mogą korzystać.

    Jest to kierunek odwrotny do wykrywania. Tam maszyna szuka urządzeń.
    Tutaj maszyna sama ogłasza się urządzeniem i przyjmuje połączenia od
    tego, kto ją znajdzie.

    Zagrożenie pierwsze to ogłaszanie. Maszyna wysyła do sieci opis
    siebie i udostępnianych możliwości, więc każdy w tej sieci dostaje
    gotową informację, że coś tu jest i co potrafi.

    Zagrożenie drugie to przyjmowanie połączeń. Usługa nasłuchuje
    i obsługuje żądania od urządzeń, których nikt nie potwierdzał, bo
    mechanizm ten uwierzytelniania nie przewiduje.

    Zagrożenie trzecie dotyczy sieci obcych. Na stanowisku przenośnym
    maszyna ogłasza się także w sieci hotelowej, konferencyjnej
    i domowej, a więc wszędzie tam, gdzie sąsiedztwo jest przypadkowe.

    Odnotowuję, że usługa ta opiera się na mechanizmie wykrywania, więc
    wyłączenie tamtej zatrzymuje ją w praktyce. Wdraża się je razem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: opis
    maszyny rozgłaszany w każdej sieci i port przyjmujący żądania.
  en: |
    The setting switches off the service reporting the machine in the near network as gear that others may use.

    It is the road the other way about from the finding. There the machine seeks gear. Here the machine gives
    itself out as gear and takes in joinings from whoever finds it.

    The first danger is the giving out. The machine sends to the network a setting out of itself and of what it
    offers, so everyone in that network gets ready word that something is here and what it can do.

    The second danger is the taking in of joinings. The service listens and serves the askings of things nobody
    has warranted, that mechanism looking for no warranting.

    The third danger touches strange networks. Upon a station carried about the machine gives itself out also in
    the network of an inn, of a gathering and of a home, and so wherever the neighbourhood is come by chance.

    I set down that this service rests upon the mechanism of finding, so the switching off of that one stops it in
    practice. They are rolled out together.

    What an attacker gains while the item goes unmet: a setting out of the machine called out in every network,
    and a door taking in askings.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy tego, czy z tej
    maszyny coś jest udostępniane tą drogą.

    Miejscem pierwszym jest udostępnianie multimediów do odtwarzaczy
    i telewizorów w tej samej sieci. Po zmianie maszyna zniknie z listy
    źródeł na tych urządzeniach.

    Miejscem drugim jest otwieranie portów na routerze na żądanie
    programu. Programy korzystające z tego mechanizmu przestaną same
    udrażniać sobie drogę i mogą zgłaszać problemy z połączeniem, których
    przyczyna nie będzie oczywista. Odnotowuję, że zamknięcie tej
    możliwości jest tu jednym z zysków, a nie skutkiem ubocznym.

    Miejscem trzecim są starsze programy do rozmów i przesyłania plików
    oparte na bezpośrednim połączeniu między maszynami.

    Odnotowuję, że dostęp z tej maszyny do urządzeń w sieci to osobna
    sprawa. Ten punkt zamyka kierunek wychodzący z maszyny jako
    urządzenia, a nie korzystanie z cudzych.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: udostępniania plików zwykłą drogą, sieci,
    drukowania, logowania, pracy programów.
  en: |
    The class is "needs review", and the review touches whether anything is given out from this machine by that
    road.

    The first place is the giving out of sound and picture to players and seeing screens in that same network.
    After the change the machine will vanish from the roll of springs upon those things.

    The second place is the opening of doors upon the router at a program's asking. Programs using that mechanism
    will cease to clear their own road and may report troubles of joining whose cause will not be plain. I set
    down that the shutting of that power is here one of the gains and no side upshot.

    The third place is older programs for speech and the sending of files that rest upon a straight joining
    between machines.

    I set down that the reach from this machine to gear in the network is a matter apart. This item shuts the road
    going out from the machine as gear, and not the using of others.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the giving out of files by the common road, the network, printing, logging on, or
    the work of programs.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Maszyna zniknie z listy źródeł multimediów na odtwarzaczach i telewizorach w tej samej sieci
      - Programy otwierające porty na routerze na żądanie przestaną same udrażniać sobie drogę
      - Zamknięcie tej możliwości jest jednym z zysków punktu, a nie skutkiem ubocznym
      - Starsze programy do rozmów i przesyłania plików oparte na bezpośrednim połączeniu stracą tę drogę
      - Udostępnianie plików zwykłą drogą, sieć, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - The machine will vanish from the roll of springs of sound and picture upon players and seeing screens in that network
      - Programs opening doors upon the router at their asking will cease to clear their own road
      - The shutting of that power is one of the item s gains and no side upshot
      - Older programs for speech and the sending of files resting upon a straight joining will lose that road
      - The giving out of files by the common road, the network, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna udostępnia multimedia odtwarzaczom albo telewizorom w tej samej sieci
    en:
      - The machine gives out sound and picture to players or seeing screens in that same network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\upnphost'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'upnphost' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'upnphost' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'upnphost' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/upnp/universal-plug-and-play-start-page

notes:
  pl: |
    Reguła jest kierunkiem odwrotnym do punktu o wykrywaniu urządzeń
    i warto, żeby aplikacja pokazała je razem. Tam maszyna szuka. Tutaj
    maszyna sama ogłasza się urządzeniem i przyjmuje połączenia.

    Argument wart postawienia wprost dotyczy otwierania portów na
    routerze. Program potrafi tą drogą poprosić router o udrożnienie
    drogi do siebie i dostać je bez niczyjej decyzji. Zamknięcie tego
    jest zyskiem punktu, a nie jego kosztem, i trzeba to nazwać.

    Odnotowuję stanowiska przenośne. Maszyna ogłasza się także w sieci
    hotelowej i konferencyjnej, czyli tam, gdzie sąsiedztwo jest
    przypadkowe, a to jest najmocniejszy argument za wdrożeniem.
  en: |
    The rule is the road the other way about from the item on the finding of gear, and it is well that the
    application show them together. There the machine seeks. Here the machine gives itself out as gear and takes
    in joinings.

    The argument worth putting outright touches the opening of doors upon the router. A program can by that road
    ask the router to clear the way to itself and get it with nobody's decision. The shutting of that is the
    item's gain and not its cost, and it is to be so named.

    I set down stations carried about. The machine gives itself out also in the network of an inn and of a
    gathering, which is to say where the neighbourhood is come by chance, and that is the strongest argument for
    the rollout.
