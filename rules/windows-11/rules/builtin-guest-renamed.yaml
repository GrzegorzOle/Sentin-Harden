id: win11-builtin-guest-renamed

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto gościa przemianowane
    en: The built-in guest account renamed
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Obok konta administratora każda maszyna ma wbudowane konto gościa —
    również założone przy instalacji, również nazwane domyślnie tak samo
    wszędzie i również niemożliwe do usunięcia.

    Konto to jest domyślnie wyłączone i osobna reguła tej paczki pilnuje, żeby
    takie pozostało. Ten punkt dokłada do tego drugą warstwę i trzeba od razu
    powiedzieć, ile ona waży: niewiele. Przemianowanie konta wyłączonego nie
    zmienia stanu maszyny, bo zalogować się na nie i tak nie można.

    Wartość jest w tym, co dzieje się później. Konto gościa bywa włączane —
    przez pomyłkę przy konfiguracji udziału, przez narzędzie, przez kogoś, kto
    rozwiązywał problem i zapomniał cofnąć zmianę. Od tej chwili maszyna ma
    konto bez hasła, o nazwie znanej z góry, na które seryjne narzędzia trafiają
    same. Przemianowanie sprawia, że takie przypadkowe włączenie nie zostaje
    od razu znalezione przez pierwszego, kto skanuje sieć.

    Punkt wymaga, żeby konto nosiło nazwę inną niż domyślna.
  en: |
    Beside the administrator account, every machine has a built-in guest account -
    also created at installation, also named the same everywhere by default and also
    impossible to delete.

    The account is off by default, and a separate rule in this pack sees to it that it
    stays so. This item adds a second layer to that, and it is worth saying at once
    how much that layer weighs: not much. Renaming a disabled account does not change
    the machine's state, because there is no signing in on it anyway.

    Its worth lies in what happens later. The guest account does get switched on - by
    a slip while setting up a share, by a tool, by somebody who was solving a problem
    and forgot to undo the change. From that moment the machine has an account with no
    password, bearing a name known in advance, which tools working in series find by
    themselves. Renaming means such an accidental switching on is not found at once by
    the first person scanning the network.

    The item requires the account to bear a name other than the default one.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z konta gościa ktoś na tej maszynie korzysta —
    a bywa, że korzysta, wbrew temu, co sugeruje jego domyślne wyłączenie.

    Zdarza się to przy udziałach otwartych dla wszystkich w małej sieci,
    przy stanowiskach dla odwiedzających i przy starszych urządzeniach
    biurowych, którym ktoś kiedyś pozwolił zapisywać pliki właśnie tą drogą.
    Wszystko, co odwołuje się do konta po nazwie, po przemianowaniu przestanie
    je znajdować.

    Poza tym przypadkiem zmiany nie widać. Konto pozostaje wyłączone, nikt się
    na nie nie loguje i żadna funkcja nie znika.

    Warto wiedzieć, że przemianowanie nie zastępuje wyłączenia. Konto włączone
    i przemianowane jest nadal kontem bez hasła; nowa nazwa tylko odsuwa chwilę,
    w której ktoś je znajdzie. Kolejność jest odwrotna, niż sugeruje ten punkt:
    najpierw wyłączenie, dopiero potem nazwa.

    Nie ma restartu.
  en: |
    What needs checking is whether anybody uses the guest account on this machine -
    and sometimes somebody does, against what its being off by default suggests.

    It happens with shares open to everyone on a small network, with stations for
    visitors, and with older office devices that somebody once allowed to write files
    by exactly this route. Everything referring to the account by name stops finding
    it after the rename.

    Apart from that case the change is not visible. The account stays off, nobody
    signs in on it and no function disappears.

    It is worth knowing that renaming does not stand in for switching off. An account
    switched on and renamed is still an account with no password; the new name only
    pushes back the moment somebody finds it. The order is the reverse of what this
    item suggests: switching off first, the name only after.

    There is no restart.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
  what_breaks:
    pl:
      - Udział otwarty dla gościa przestanie być osiągalny po dotychczasowej nazwie konta
      - Urządzenie biurowe zapisujące pliki na tym koncie przestanie je znajdować
      - Skrypt nadający uprawnienia po nazwie konta gościa przestanie działać
      - Konto pozostaje wyłączone i dla zwykłego użytkownika nic się nie zmienia
    en:
      - A share open to the guest stops being reachable under the account's former name
      - An office device writing files on this account stops finding it
      - A script granting rights by the guest account's name stops working
      - The account stays off and for an ordinary user nothing changes
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Udziały w małej sieci są świadomie otwarte dla konta gościa
      - Urządzenie biurowe zapisuje pliki na koncie gościa i nie da się go przestawić
    en:
      - Shares on a small network are deliberately open to the guest account
      - An office device writes files on the guest account and cannot be set otherwise
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The built-in account is found by the ending of its identifier, not by
      # name. The default names below stand for the commonest language
      # versions; a dot takes the place of a letter outside the basic alphabet,
      # so that the check does not depend on the encoding in which the command
      # reaches the shell.
      $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
      if ($null -eq $account) { 'CHECK_ERROR' }
      elseif ($account.Name -match '^(guest|gast|go.{1,2}|invit.|invitado|convidado|ospite)$') { 'DEFAULT_NAME' }
      else { 'RENAMED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: RENAMED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
    if ($null -eq $account) { throw 'The built-in guest account was not found.' }
    [pscustomobject]@{
      sid  = $account.SID.Value
      name = $account.Name
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The name below is a starting point. Pick one of the organisation's own,
    # and do not give every machine the same one.
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-501$' }
    if ($null -eq $account) { throw 'The built-in guest account was not found.' }
    Rename-LocalUser -SID $account.SID -NewName 'usr-local'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $account = Get-LocalUser | Where-Object { $_.SID.Value -eq $b.sid }
    if ($null -eq $account) { throw 'The account from the backup was not found.' }
    Rename-LocalUser -SID $account.SID -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-guest-account

notes:
  pl: |
    Reguła powtarza kształt swojej pary — przemianowania konta administratora —
    i jest to zamierzone. Oba punkty szukają konta po końcówce identyfikatora
    i oba porównują nazwę z listą wersji językowych.

    Różnica jest w wadze. Tam chodzi o konto z najwyższymi uprawnieniami,
    którego nie da się zablokować; tutaj o konto wyłączone i pozbawione
    uprawnień. Dlatego ten punkt jest oceniony nisko i jest dobrym kandydatem
    do świadomego odpuszczenia tam, gdzie przemianowanie kosztuje więcej niż
    wnosi.

    Wzorzec nazw domyślnych obejmuje zapisy z kropką w miejscu liter spoza
    alfabetu podstawowego. Może to objąć rzadką nazwę własną o tej samej
    długości — nazwa czteroliterowa zaczynająca się od tych samych dwóch liter
    zostanie zaraportowana jako domyślna. Pomyłka idzie w stronę ostrożniejszą
    i jest to wybór świadomy.

    Przemianowanie nie zastępuje wyłączenia konta, które ma w tej paczce osobną
    regułę. Wdrożenie samego przemianowania na koncie włączonym daje wrażenie
    utwardzenia bez utwardzenia.
  en: |
    The rule repeats the shape of its pair - the renaming of the administrator account
    - and that is deliberate. Both items look for the account by the ending of its
    identifier and both compare the name against a list of language versions.

    The difference lies in weight. There it is an account with the highest privileges
    that cannot be locked; here an account switched off and stripped of rights. That
    is why this item is judged low and is a good candidate for being deliberately let
    go where renaming costs more than it brings.

    The pattern of default names uses a dot in place of letters outside the basic
    alphabet. That may take in a rare name of its own of the same length - a
    four-letter name starting with the same two letters will be reported as the
    default. The error goes to the more cautious side and is a deliberate choice.

    Renaming does not stand in for switching the account off, which has a rule of its
    own in this pack. Applying the rename alone on a switched-on account gives an
    impression of hardening without the hardening.
