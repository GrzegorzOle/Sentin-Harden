id: win2016-group-policy-registry-background-processing

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Group Policy
  title:
    pl: Okresowe odświeżanie ustawień rejestru z zasad grupy włączone
    en: Periodic background refresh of registry policy enabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pilnuje, żeby maszyna odświeżała ustawienia rejestru
    pochodzące z zasad grupy także wtedy, gdy nikt się na nią nie loguje
    ani z niej nie wylogowuje.

    Zasady grupy wgrywają się w dwóch momentach: przy starcie i logowaniu
    oraz okresowo w tle. Pierwszy moment na serwerze zdarza się rzadko —
    maszyna startuje raz na kilka miesięcy, a logowań interaktywnych bywa
    zero. Odświeżanie w tle jest więc jedyną drogą, którą docierają tam
    zmiany.

    Rzecz jest ważniejsza, niż wygląda, bo dotyczy nie samej wygody
    zarządzania, ale utrzymania zabezpieczeń w czasie. Zasada podniesiona
    po incydencie, wyłączenie usługi po znalezieniu luki, zmiana ustawień
    uwierzytelniania — wszystko to dociera na maszynę właśnie tą drogą.
    Bez niej maszyna zostaje z konfiguracją z dnia ostatniego restartu
    i nikt tego nie zauważy, bo raport z serwera zasad pokaże, że zasada
    została wydana.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: maszynę,
    która nie przyjmuje zmian w zabezpieczeniach miesiącami, i to bez
    żadnego śladu, że ich nie przyjmuje.
  en: |
    The setting sees to it that the machine refreshes registry settings coming from
    group policy also where nobody signs in to it or out of it.

    Group policy is loaded at two moments: at start and sign-in, and periodically in
    the background. The first moment happens rarely on a server - the machine starts
    once in a few months and interactive sign-ins are at times none. Refreshing in
    the background is therefore the one road by which changes reach it.

    The matter weighs more than it looks, concerning not the convenience of
    management but the keeping of protections over time. A policy raised after an
    incident, a service switched off after a gap was found, a change in
    authentication settings - all of it reaches the machine by just that road.
    Without it the machine stays with the configuration of the day of its last
    restart, and nobody will notice, the report from the policy server showing that
    the policy was issued.

    What an attacker gains while the item goes unmet: a machine taking in no changes
    to its protections for months, and that with no trace at all that it is not
    taking them in.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Wartość wymagana jest wartością domyślną
    systemu, więc na przeważającej części maszyn wdrożenie zapisuje tylko
    wpis, który i tak obowiązywał.

    Odświeżanie w tle jest czynnością lekką: maszyna pyta serwer zasad,
    czy coś się zmieniło, i w razie potrzeby wgrywa różnicę. Ruch sieciowy
    z tego tytułu jest niewielki, a poza godzinami pracy praktycznie żaden.

    Nie wiąże się z tym restart, wylogowanie ani zatrzymanie usługi.
    Użytkownik niczego nie zobaczy.

    Jedyne, co warto odnotować: wdrożenie może spowodować, że zasada
    wstrzymana dotąd ręcznie na tej maszynie zacznie obowiązywać. Nie jest
    to skutek tej reguły, tylko skutek przywrócenia zamierzonego działania —
    ale objaw pojawi się właśnie po jej wdrożeniu i warto o tym wiedzieć.

    Czego to nie psuje: niczego. Nie ma znanych regresji.
  en: |
    The class is "no disruption". The required value is the system's default, so on
    the greater part of machines the rollout only writes down an entry that held
    anyway.

    Refreshing in the background is a light act: the machine asks the policy server
    whether anything has changed and, where needed, loads the difference. The
    network traffic from it is slight, and outside working hours practically none.

    No restart, sign-out or stopping of a service goes with it. The user will see
    nothing.

    The one thing worth noting: the rollout may bring it about that a policy held
    back by hand on this machine until now begins to hold. That is no consequence of
    this rule but of the intended working being restored - the symptom will however
    appear just after its rollout, and it is worth knowing.

    What this does not break: nothing. There are no known regressions.

implementation_consequences:
  impact_areas:
    - remote-management
  what_breaks:
    pl:
      - Zasada wstrzymana dotąd ręcznie na tej maszynie zacznie obowiązywać, bo maszyna znowu przyjmuje zmiany
      - Ruch do serwera zasad wzrasta o okresowe zapytanie, co jest obciążeniem znikomym
      - Bez restartu, bez wylogowania, bez zatrzymania usługi
      - Użytkownik nie zobaczy żadnej zmiany w codziennej pracy
    en:
      - A policy held back by hand on this machine until now will begin to hold, the machine taking in changes again
      - Traffic to the policy server grows by a periodic query, which is a negligible load
      - No restart, no sign-out, no stopping of a service
      - The user will see no change in their daily work
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest celowo odcięta od zasad grupy i jej konfiguracja jest utrzymywana inną drogą
      - Trwa wdrożenie, w którym zmiany zasad mają docierać wyłącznie w wyznaczonych oknach
    en:
      - The machine is deliberately cut off from group policy and its configuration is kept by another road
      - A rollout is under way in which policy changes are to arrive only in appointed windows
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry is named in the negative: zero means the refresh is not
      # switched off, so the wanted state is written with a zero.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
      $name = 'NoBackgroundPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    $name = 'NoBackgroundPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named in the negative - zero means the refresh is not
    # switched off, so the wanted state is written with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Group Policy\{35378EAC-683F-11D2-A89A-00C04FBBCFA2}'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoBackgroundPolicy' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc978526(v=technet.10)

notes:
  pl: |
    Punkt otwiera blok o tym, skąd maszyna bierze swoje ustawienia i na
    jakich warunkach. Jest w nim pierwszym z dwóch dotyczących samego
    wgrywania zasad; trzecia reguła dotyczy drogi, którą one przychodzą.

    Warto pokazywać tę trójkę razem, bo osobno każda wygląda na drobiazg
    administracyjny. Razem opisują łańcuch, w którym zasada wydana na
    serwerze staje się ustawieniem na tej maszynie — a łańcuch ten jest
    tym, na czym stoi większość pozostałych reguł tego zestawu.

    Zgodność w tym punkcie nie dowodzi, że zasady rzeczywiście docierają.
    Dowodzi, że maszyna ich nie odrzuca. Sprawdzenie, czy docierają, jest
    osobną czynnością i nie wykonuje jej ta reguła.
  en: |
    The item opens the block about where the machine takes its settings from and on
    what terms. It is the first in it of two concerning the loading of policy
    itself; a third rule concerns the road by which it comes.

    Those three are worth showing together, since apart each looks like an
    administrative trifle. Together they describe the chain by which a policy issued
    on a server becomes a setting on this machine - and that chain is what most of
    this set's other rules stand on.

    Compliance at this item does not prove that policy actually arrives. It proves
    the machine does not turn it away. Checking whether it arrives is a separate act
    and this rule does not perform it.
