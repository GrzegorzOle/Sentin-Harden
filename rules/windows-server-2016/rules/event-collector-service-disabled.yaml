id: win2016-event-collector-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zbierania dzienników z innych maszyn wyłączona
    en: The service collecting logs from other machines disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zbierającą zdarzenia przesyłane przez inne
    maszyny. Usługa ta nasłuchuje na połączenia i przyjmuje dzienniki
    z maszyn, którym kazano je tutaj odsyłać.

    Rozróżnienie, od którego trzeba zacząć: punkt nie dotyczy zapisywania
    własnych dzienników tej maszyny. Te są zapisywane niezależnie i po
    zmianie działają tak samo. Chodzi wyłącznie o przyjmowanie cudzych.

    Powierzchnia, którą ten punkt zdejmuje, jest niewielka, ale ma cechę
    nieprzyjemną. Usługa przyjmuje dane pochodzące z innych maszyn
    i zapisuje je u siebie, a maszyna zbierająca dzienniki jest z natury
    rzeczy miejscem, do którego zagląda się rzadko i któremu się ufa.
    Wysłanie do niej treści spreparowanej jest drogą wpływania na to, co
    zobaczy ten, kto później będzie czytał dziennik.

    Na maszynie, która punktem zbiorczym nie jest, usługa ta nasłuchuje bez
    zadania. Na maszynie, która nim jest, punkt jest niewykonalny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nasłuchujący
    port przyjmujący dane z innych maszyn tam, gdzie nikt nie kazał ich
    zbierać.
  en: |
    The item switches off the service gathering events sent by other machines. That service listens for
    connections and takes in logs from machines told to send them here.

    The distinction to begin from: the item does not concern the writing of this machine's own logs.
    Those are written independently and after the change work the same. It is solely a matter of taking
    in those of others.

    The surface this item removes is a small one, but it has an unpleasant feature. The service takes in
    data coming from other machines and writes them at home, and a machine gathering logs is by the
    nature of the thing a place looked into seldom and trusted. Sending a contrived content to it is a
    road for bearing on what whoever later reads the log will see.

    On a machine that is no gathering point, that service listens without a task. On a machine that is
    one, the item is not feasible.

    What an attacker gains while the item goes unmet: a listening port taking data in from other machines
    where nobody ordered them gathered.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", a rzecz do sprawdzenia jest jedna:
    czy ta maszyna jest punktem zbiorczym dzienników.

    Jeżeli jest, wykonanie punktu zatrzymuje zbieranie. Maszyny nadal
    próbują odsyłać zdarzenia, ale nie ma ich komu przyjąć — i tu leży
    istota kłopotu. Dziennik zbiorczy nie zgłasza, że przestał przyrastać.
    Jest pusty i wygląda dokładnie tak samo jak dziennik z okresu, w którym
    nic się nie działo.

    Znaczy to, że skutek nieudanego wdrożenia objawia się dopiero wtedy,
    gdy ktoś sięgnie do dzienników po zdarzenie z przeszłości, a więc
    zwykle w najgorszym możliwym momencie. Jest to jedyna reguła w tym
    bloku, której skutkiem jest brak danych, a nie brak działania.

    Jeżeli maszyna punktem zbiorczym nie jest, wykonanie nie zmienia nic
    oprócz zamknięcia nasłuchu.

    Czego to nie psuje: zapisywania własnych dzienników tej maszyny, ich
    odczytu, przekazywania własnych zdarzeń gdzie indziej, zdalnych
    poleceń, sieci.

    Wymaga zatrzymania usługi; cofnięcie natychmiastowe, ale zdarzenia
    z okresu przerwy nie wracają.
  en: |
    The class is "needs a planned rollout", and the thing to be established is one: whether this machine
    is a gathering point for logs.

    If it is, carrying the item out stops the gathering. Machines go on trying to send events, but there
    is nobody to take them in - and there lies the heart of the trouble. A gathering log does not report
    that it has ceased to grow. It is empty and looks exactly like a log from a spell in which nothing
    happened.

    That means the consequence of a failed rollout shows only when somebody reaches into the logs for an
    event of the past, and so as a rule at the worst possible moment. It is the one rule in this block
    whose consequence is a want of data rather than a want of working.

    If the machine is no gathering point, the carrying out changes nothing beyond shutting the listening.

    What this does not break: the writing of this machine's own logs, their reading, the passing of its
    own events elsewhere, remote commands, or the network.

    Calls for a service to be stopped; the undoing is immediate, but the events from the spell of the
    break do not come back.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - remote-management
    - network-and-firewall
  what_breaks:
    pl:
      - Maszyna będąca punktem zbiorczym przestaje przyjmować zdarzenia z innych maszyn
      - Dziennik zbiorczy nie zgłasza, że przestał przyrastać, i wygląda jak dziennik z okresu bez zdarzeń
      - Brak danych wychodzi na jaw dopiero, gdy ktoś sięgnie po zdarzenie z przeszłości
      - Zdarzenia z okresu przerwy nie wracają po cofnięciu zmiany
      - Zapisywanie własnych dzienników tej maszyny i przekazywanie własnych zdarzeń gdzie indziej pozostają bez zmian
    en:
      - A machine that is a gathering point ceases to take in events from other machines
      - The gathering log does not report that it has ceased to grow and looks like a log from a spell without events
      - The want of data comes to light only when somebody reaches for an event of the past
      - The events from the spell of the break do not come back after the change is undone
      - The writing of this machine's own logs and the passing of its own events elsewhere stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest punktem zbiorczym dzienników i inne maszyny odsyłają tu swoje zdarzenia
      - Wdrożono przekazywanie zdarzeń, a nie sprawdzono, dokąd trafiają
    en:
      - The machine is a gathering point for logs and other machines send their events here
      - Event forwarding has been rolled out and it has not been established where the events go
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Wecsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'Wecsvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This concerns collecting logs from other machines, not writing this one's
    # own. Where the machine is the collecting point, the logs sent to it are
    # lost for the whole time it is off, and nobody will see that they are gone.
    Stop-Service -Name 'Wecsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Wecsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'Wecsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wec/windows-event-collector

notes:
  pl: |
    Punkt jest w tym bloku jedyny, którego nieudane wdrożenie nie objawia
    się wcale. Wszystkie pozostałe psują coś, co ktoś zauważy: znika
    udział, nie wstaje sesja, nie dochodzi polecenie. Tutaj przestaje
    przyrastać zbiór, na który nikt nie patrzy.

    Warto, żeby aplikacja postawiła to na pierwszym miejscu, bo zmienia
    sposób sprawdzenia. Przy pozostałych regułach wystarczy wykonać
    i zobaczyć. Tutaj trzeba ustalić rolę maszyny przed wykonaniem, bo po
    wykonaniu nie będzie czego zobaczyć.

    Drugą rzeczą wartą pokazania jest asymetria cofnięcia. Technicznie
    odwracalność jest natychmiastowa — jedna wartość, jedno polecenie. Ale
    zdarzenia, które w międzyczasie miały przyjść, nie przyjdą już nigdy.
    Jest to przypadek, w którym „odwracalne natychmiast" opisuje ustawienie,
    a nie skutek, i warto tę różnicę wypowiedzieć.

    Rozróżnienie między zbieraniem cudzych dzienników a zapisywaniem
    własnych jest trzecią rzeczą, którą trzeba powiedzieć wprost. Obawa
    przed utratą własnego dziennika jest przy tym punkcie częsta
    i bezpodstawna, a prowadzi do odpuszczania go tam, gdzie byłby
    bezbolesny.
  en: |
    The item is in this block the only one whose failed rollout shows not at all. All the rest break
    something somebody will notice: a share vanishes, a session does not come up, a command does not
    arrive. Here a store nobody looks at ceases to grow.

    It is well that the application put that first, changing as it does the manner of checking. At the
    other rules it is enough to carry out and see. Here the machine's role has to be established before
    the carrying out, after it there being nothing to see.

    The second thing worth showing is the asymmetry of the undoing. Technically the reversibility is
    immediate - one value, one command. But the events that were to come in the meantime will never come
    now. It is a case in which "reversible immediately" describes the setting and not the consequence,
    and that difference is worth uttering.

    The distinction between gathering the logs of others and writing one's own is the third thing that
    has to be said outright. The fear of losing one's own log is at this item a common one and
    groundless, and leads to its being let go where it would be painless.
