id: win10-firewall-public-local-ipsec-rules-ignored

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Public Profile
  title:
    pl: Lokalne reguły zabezpieczeń połączenia pomijane w sieci publicznej
    en: Local rules of the securing of joinings passed over in a public network
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że w profilu publicznym obowiązują wyłącznie
    reguły zabezpieczeń połączenia pochodzące z zasad, a utworzone
    lokalnie są pomijane.

    Reguły zabezpieczeń połączenia są warstwą osobną od zwykłych reguł
    zapory. Nie rozstrzygają, czy ruch przejdzie, tylko na jakich
    warunkach: czy ma być uwierzytelniony, czy szyfrowany i z kim
    maszyna ma prawo w ten sposób rozmawiać.

    Zagrożenie polega na tym, że reguła taka potrafi ustanowić zaufanie.
    Reguła lokalna mówiąca, że z określonym adresem maszyna łączy się na
    warunkach uwierzytelnionych, tworzy relację, w której druga strona
    jest traktowana jako znana — i to niezależnie od tego, gdzie maszyna
    się znajduje.

    W sieci publicznej relacje takie są szczególnie niepożądane, bo
    adresy sieci obcej nie są przewidywalne, a reguła napisana kiedyś pod
    sieć domową może dopasować się do zupełnie innego urządzenia.

    Odnotowuję, że punkt dotyczy wyłącznie profilu publicznego. Reguły
    lokalne w sieci domenowej i prywatnej działają dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    trafienia w relację zaufania opisaną regułą lokalną.
  en: |
    The setting brings it about that in the public profile only the rules of the securing of joinings coming from
    policy hold good, while those made locally are passed over.

    Rules of the securing of joinings are a layer apart from the ordinary rules of the firewall. They settle not
    whether traffic will pass but upon what terms: whether it is to be proved, whether ciphered, and with whom the
    machine has the right to speak in that manner.

    The danger rests in this, that such a rule can set up a trust. A local rule saying that with a given address
    the machine joins itself upon proved terms makes a bond in which the other side is held as known - and that
    wherever the machine may stand.

    In a public network such bonds are the less to be wished for, the addresses of a strange network not being to
    be foretold, and a rule written once for a home network being able to fit a wholly other device.

    I set down that the item touches the public profile alone. Local rules in the domain and the private network
    work on.

    What an attacker gains while the item goes unmet: the chance of falling into a bond of trust set out by a
    local rule.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Reguły zabezpieczeń połączenia tworzone lokalnie są rzadkością. Na
    stanowisku roboczym zwykle nie ma żadnej, a te, które istnieją,
    pochodzą z zasad i punktem nie są objęte.

    Odnotowuję jedyne miejsce warte uwagi: maszyny, na których ktoś
    ustawiał tunel uwierzytelniony do urządzenia w sieci lokalnej —
    na przykład do sterownika przemysłowego albo urządzenia pomiarowego.
    Jeżeli sieć, w której to urządzenie stoi, bywa oznaczona jako
    publiczna, połączenie przestanie się zestawiać.

    Skutek pojawia się natychmiast i wyłącznie w profilu publicznym.

    Czego to nie psuje: reguł zapory, reguł zabezpieczeń z zasad,
    połączeń w sieci domenowej i prywatnej, pracy lokalnej, drukowania.
  en: |
    The class is "no disruption".

    Rules of the securing of joinings made locally are a rarity. Upon a working station there is commonly none,
    and those that stand come from policy and are not held by the item.

    I set down the one place worth notice: machines upon which somebody set up a proved tunnel to a device in a
    local network - to a controller of industry or an instrument of measuring, say. If the network in which that
    device stands is at times marked as public, the joining will cease to be set up.

    The consequence shows at once and in the public profile alone.

    What this does not break: the firewall's rules, rules of securing from policy, joinings in the domain and the
    private network, work upon the machine itself, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - encryption-and-tls
    - remote-management
  what_breaks:
    pl:
      - Tunel uwierzytelniony do urządzenia w sieci oznaczonej jako publiczna przestanie się zestawiać
      - Dotyczy to zwłaszcza połączeń do sterowników przemysłowych i urządzeń pomiarowych ustawianych ręcznie
      - Reguły zabezpieczeń połączenia pochodzące z zasad działają dalej i nie są punktem objęte
      - Na stanowisku roboczym takich reguł lokalnych zwykle w ogóle nie ma
      - Reguły zapory, połączenia w sieci domenowej i prywatnej, praca lokalna i drukowanie pozostają bez zmian
    en:
      - A proved tunnel to a device in a network marked as public will cease to be set up
      - That holds above all of joinings to controllers of industry and instruments of measuring set up by hand
      - Rules of the securing of joinings coming from policy work on and are not held by the item
      - Upon a working station there are commonly no such local rules at all
      - The firewall s rules, joinings in the domain and the private network, work upon the machine itself and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie ustawiono ręcznie tunel uwierzytelniony do urządzenia w sieci oznaczonej jako publiczna
    en:
      - Upon the machine a proved tunnel was set up by hand to a device in a network marked as public
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Only the public profile is read here. The two remaining profiles keep their
      # local rules on purpose and stand outside this item.
      $public = Get-NetFirewallProfile -Profile Public -ErrorAction Stop
      if ($null -eq $public) { 'CHECK_ERROR' }
      else { [string]$public.AllowLocalIPsecRules }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'False'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile -Profile Public |
      Select-Object -Property Name, AllowLocalIPsecRules |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Set-NetFirewallProfile -Profile Public -AllowLocalIPsecRules $b.AllowLocalIPsecRules

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła jest parą do punktu o lokalnych regułach zapory i warto, żeby
    aplikacja pokazała je razem. Oba pomijają w sieci publicznej to, co
    powstało na maszynie — ale dotyczą dwóch różnych warstw i wdrożenie
    jednego nie obejmuje drugiej.

    Argument wart postawienia wprost dotyczy różnicy między nimi. Reguła
    zapory rozstrzyga, czy ruch przejdzie. Reguła zabezpieczeń połączenia
    rozstrzyga, na jakich warunkach i z kim — czyli ustanawia zaufanie,
    a nie przepustkę. Zaufanie ustanowione lokalnie i obowiązujące
    w sieci obcej jest z tych dwóch rzeczą gorszą.

    Odnotowuję, że na stanowisku roboczym punkt zwykle nic nie zmienia,
    bo reguł lokalnych tej warstwy po prostu nie ma. Nie jest to powód do
    pominięcia go — zasada zapisana obowiązuje także wtedy, gdy ktoś taką
    regułę dopiero utworzy.
  en: |
    The rule is the pair of the item about local firewall rules, and it is well that the application show them
    together. Both pass over in a public network what came about upon the machine - but they touch two several
    layers and the rolling out of one does not hold the other.

    The argument worth putting outright touches the difference between them. A firewall rule settles whether
    traffic will pass. A rule of the securing of joinings settles upon what terms and with whom - which is to say
    it sets up a trust and no pass. A trust set up locally and holding good in a strange network is the worse of
    the two.

    I set down that upon a working station the item commonly changes nothing, there being simply no local rules of
    that layer. It is no ground for passing it by - a policy written down holds good also when somebody first
    makes such a rule.
