id: win2025-guest-account-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto gościa wyłączone
    en: The built-in guest account switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wbudowane konto gościa, czyli konto pozwalające
    zalogować się bez hasła.

    Znaczenie tego konta na serwerze jest inne niż na stanowisku roboczym.
    Konto gościa nie służy tu nikomu do pracy — służy za punkt wejścia.
    Zalogowanie się na nie nie wymaga niczego: ani hasła, ani wiedzy o tym,
    kto na maszynie pracuje. Wystarcza, żeby zobaczyć listę kont, listę
    udziałów, nazwę domeny i zasady haseł, a więc żeby przygotować atak
    właściwy na podstawie danych zebranych z samego celu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    zalogowany bez poświadczeń. Nie jest to dostęp administracyjny, ale jest
    to różnica między patrzeniem na maszynę z zewnątrz a patrzeniem od
    środka — i właśnie ta różnica rozstrzyga o tym, ile wysiłku kosztuje
    krok następny.

    Konto gościa jest domyślnie wyłączone, więc punkt jest zwykle spełniony
    od początku. Wynik niespełniony oznacza tu zwykle włączenie ręczne
    sprzed lat, o którym nikt już nie pamięta, a to jest przypadek wart
    odszukania.
  en: |
    The setting switches off the built-in guest account, that is the account letting one
    sign in with no password.

    That account's meaning on a server differs from that at a working station. The guest
    account serves nobody here for work - it serves as a point of entry. Signing in to it
    takes nothing: neither a password nor knowledge of who works on the machine. It is
    enough to see the list of accounts, the list of shares, the domain's name and the
    password policy, and so to prepare the attack proper from data gathered off the target
    itself.

    What an attacker gains while the item goes unmet: a signed-in access with no
    credentials. It is not administrative access, but it is the difference between looking
    at a machine from outside and looking at it from within - and that difference settles
    how much effort the next step costs.

    The guest account is switched off by default, so the item is usually met from the start.
    An unmet result here usually means a switching on by hand years ago that nobody
    remembers any more, and that is a case worth tracking down.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy z konta gościa cokolwiek na tym serwerze
    korzysta — bo bywa, że korzysta, i to nie tam, gdzie się tego szuka.

    Przypadkiem najczęstszym jest udział plikowy albo drukarka udostępnione
    „dla wszystkich" w czasach, gdy tak było prościej. Dostęp bez
    poświadczeń trafia wtedy na konto gościa, choć nikt się nigdzie nie
    loguje i nikt o tym koncie nie myśli. Po wyłączeniu takie połączenia
    zaczynają być odrzucane, a komunikat po stronie klienta mówi o odmowie
    dostępu, nie o wyłączonym koncie — więc przyczyna nie jest oczywista.

    Przypadkiem drugim są urządzenia sieciowe zapisujące pliki na serwer:
    skanery, kopiarki, kamery, sterowniki. Ich konfiguracja bywa pusta
    w polu poświadczeń i działa właśnie dzięki kontu gościa.

    Zmiana nie unieważnia sesji już nawiązanych. Skutek pojawia się przy
    następnym połączeniu, co bywa dopiero po godzinach.

    Na serwerze będącym kontrolerem domeny konta lokalne nie istnieją —
    wbudowane konto gościa jest tam kontem domeny i podlega osobnemu
    punktowi benchmarku. Reguła rozpoznaje tę sytuację i zwraca wynik
    „nie dotyczy" zamiast mylącego błędu.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anything on this server uses the guest account - since it
    sometimes does, and not where one looks for it.

    The commonest case is a file share or a printer opened "to everyone" in days when that
    was simpler. Access with no credentials then lands on the guest account, though nobody
    signs in anywhere and nobody thinks of that account. Once it is switched off such
    connections start being refused, and the message on the client's side speaks of access
    being denied rather than of an account switched off - so the cause is not obvious.

    The second case is network devices recording files onto the server: scanners, copiers,
    cameras, controllers. Their configuration is sometimes empty in the credentials field
    and works exactly thanks to the guest account.

    The change does not void sessions already set up. The effect appears at the next
    connection, which is sometimes only hours later.

    On a server that is a domain controller local accounts do not exist - the built-in guest
    account is a domain account there and falls under a separate item of the benchmark. The
    rule recognises that situation and returns a "not applicable" result rather than a
    misleading error.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - file-sharing
    - accounts-and-passwords
    - printing
    - legacy-applications
  what_breaks:
    pl:
      - Udziały plikowe otwarte dla wszystkich przestają przyjmować połączenia bez poświadczeń
      - Skanery i kopiarki zapisujące pliki bez podanego konta przestają je zapisywać
      - Komunikat po stronie klienta mówi o odmowie dostępu, nie o wyłączonym koncie
      - Sesje już nawiązane działają do czasu następnego połączenia
    en:
      - File shares opened to everyone stop taking connections with no credentials
      - Scanners and copiers recording files with no account given stop recording them
      - The message on the client's side speaks of denied access rather than of a switched-off account
      - Sessions already set up work until the next connection
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Urządzenia sieciowe zapisują pliki na serwer bez podanych poświadczeń
      - Udział plikowy jest celowo otwarty dla połączeń bez uwierzytelnienia
    en:
      - Network devices record files onto the server with no credentials given
      - A file share is deliberately open to connections with no authentication
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
      if ($os.ProductType -eq 2) {
        # A domain controller keeps no local accounts. The built-in guest is a
        # domain account there and falls under a separate item.
        'NOT_APPLICABLE'
      }
      else {
        $guest = Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-501' }
        if ($null -eq $guest) { 'NOT_APPLICABLE' }
        elseif ($guest.Enabled) { 'ENABLED' }
        else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: DISABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $guest = Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' }
    [pscustomobject]@{
      sid     = $guest.SID.Value
      name    = $guest.Name
      enabled = $guest.Enabled
      existed = ($null -ne $guest)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $guest = Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' }
    # Addressed by identifier rather than by name - the account may have been
    # renamed, and a rename does not change what it is.
    Disable-LocalUser -SID $guest.SID

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous state - refusing to guess one.' }
    if ($b.enabled) { Enable-LocalUser -SID $b.sid }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-guest-account-status

notes:
  pl: |
    Konto jest odszukiwane po identyfikatorze kończącym się na 501, a nie po
    nazwie. Zmiana nazwy konta gościa jest osobnym punktem benchmarku
    i sprawdzenie po nazwie dawałoby po niej wynik fałszywy.

    Wynik „nie dotyczy" na kontrolerze domeny nie jest uchyleniem się od
    oceny: kontroler nie ma kont lokalnych, a wbudowane konto gościa jest
    tam obiektem domeny, ocenianym osobno. Sklejenie tych dwóch przypadków
    w jeden dawałoby na jednej z ról wynik mylący.

    Wyłączenie konta nie usuwa go i nie zmienia jego uprawnień. Konto
    pozostaje w systemie, a wraz z nim przynależność do grupy gości, która
    bywa używana w uprawnieniach do zasobów — warto to sprawdzić osobno.
  en: |
    The account is found by an identifier ending in 501 rather than by name. Renaming the
    guest account is a separate item of the benchmark and a check by name would give a false
    result after it.

    A "not applicable" result on a domain controller is no dodging of the assessment: a
    controller has no local accounts, and the built-in guest account is a domain object
    there, assessed apart. Sticking those two cases into one would give a misleading result
    on one of the roles.

    Switching the account off does not remove it and does not change its rights. The account
    stays in the system, and with it its membership of the guests group, which is sometimes
    used in the rights to resources - that is worth checking apart.
