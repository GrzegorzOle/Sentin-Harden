id: win10-security-log-retention

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Security
  title:
    pl: Zachowanie dziennika zabezpieczeń po zapełnieniu
    en: The behaviour of the security log once full
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że po zapełnieniu dziennika zabezpieczeń zapis
    trwa dalej, a wypadają wpisy najstarsze.

    Jest to wybór między dwiema stratami i warto go nazwać wprost.
    Ustawienie przeciwne zatrzymuje zapis po zapełnieniu: dziennik zachowuje
    wszystko, co w nim jest, i od tej chwili maszyna nie zapisuje już nic.
    Napastnik, który chce ciszy, nie musi wtedy niczego wyłączać —
    wystarczy, że wywoła dość zdarzeń, żeby zapełnić dziennik.

    Utrata wpisów najstarszych jest stratą realną i dotyczy właśnie tego,
    co przy dochodzeniu najbardziej się liczy: początku zdarzenia. Jest to
    jednak strata ograniczona i przewidywalna, a nie wyłączenie mechanizmu.

    Odnotowuję relację z regułą o rozmiarze dziennika. Te dwa punkty
    rozwiązują ten sam problem z dwóch stron: rozmiar odsuwa moment
    zapełnienia, zachowanie po zapełnieniu rozstrzyga, co się wtedy stanie.
    Żaden z nich nie zastępuje drugiego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uciszenia zapisu przez samo wywołanie dużej liczby zdarzeń.
  en: |
    The setting makes it so that once the security log is full the writing goes on, and the oldest entries fall
    out.

    It is a choosing between two losses and it is worth naming outright. The opposite setting stops the writing
    once the log is full: the log keeps everything in it, and from that hour the machine writes nothing more. An
    attacker who wants quiet need then switch nothing off - it suffices that they raise events enough to fill the
    log.

    The loss of the oldest entries is a real loss and touches just what counts most in an inquiry: the beginning
    of a happening. It is nonetheless a bounded and foreseeable loss, and not the switching off of a mechanism.

    I set down the tie to the rule about the log's size. Those two items settle the same problem from two sides:
    the size pushes the hour of filling further off, the behaviour once full settles what happens then. Neither
    stands in place of the other.

    What an attacker gains while the item goes unmet: the power to quiet the record by the mere raising of a
    great number of events.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia rozmiaru dziennika, nie zmienia tego, co jest
    zapisywane, i nie wpływa na pracę maszyny. Rozstrzyga wyłącznie
    zachowanie w chwili zapełnienia.

    Na maszynie, której dziennik nigdy się nie zapełnia, zmiana nie robi
    nic.

    Odnotowuję, co się zmienia dla kogoś, kto polegał na ustawieniu
    przeciwnym: dziennik przestaje być archiwum. Jeśli na tej maszynie
    zapis miał być zachowywany w całości, zmiana ten zamiar przekreśla —
    i właściwą odpowiedzią jest wtedy zbieranie zdarzeń poza maszynę,
    a nie zatrzymywanie zapisu na miejscu.

    Sprawdzenie porównuje wartość jako tekst, bo wartość jest tekstem.
    Odczyt liczbowy zamieniłby brak wpisu w zero i pokazywał maszynę bez
    żadnej zasady jako zgodną.

    Czego to nie psuje: zapisywania zdarzeń, rozmiaru dziennika, odczytu
    wpisów, logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes not the log's size, changes not what is written down, and bears not upon the machine's
    working. It settles the behaviour at the hour of filling alone.

    Upon a machine whose log never fills the change does nothing.

    I set down what changes for somebody who leant upon the opposite setting: the log ceases to be an archive.
    Where the record upon this machine was to be kept whole, the change strikes that intent out - and the proper
    answer is then the gathering of events away from the machine, and not the stopping of the record in place.

    The check sets the value against its mark as text, the value being text. A numeric reading would turn a
    missing entry into a nought and show a machine with no policy at all as compliant.

    What this does not break: the writing down of events, the log's size, the reading of entries, logging on,
    file shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Dziennik przestaje być archiwum, więc zamiar zachowania zapisu w całości zostaje przekreślony
      - Właściwą odpowiedzią jest wtedy zbieranie zdarzeń poza maszynę, a nie zatrzymywanie zapisu na miejscu
      - Na maszynie, której dziennik nigdy się nie zapełnia, zmiana nie robi nic
      - Ustawienie nie zmienia rozmiaru dziennika ani tego, co jest zapisywane
      - Odczyt wpisów, logowanie, konta domenowe, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - The log ceases to be an archive, so an intent of keeping the record whole is struck out
      - The proper answer is then the gathering of events away from the machine, and not the stopping of the record in place
      - Upon a machine whose log never fills the change does nothing
      - The setting changes not the log s size nor what is written down
      - The reading of entries, logging on, domain accounts, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie dziennik zabezpieczeń ma być archiwum, a zdarzenia nie są zbierane nigdzie indziej
    en:
      - The security log upon this machine is to be an archive and the events are gathered nowhere else
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The value is kept as text, not a number, so it is compared as text. Reading
      # it numerically would turn an absent value into a zero and report a machine
      # with no policy at all as satisfying the item.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
      $name = 'Retention'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The log goes on writing and the oldest entries fall out. The other setting -
    # stop writing once full - turns a full log into a machine that records nothing.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value ([string]$b.value) -Type String
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła domyka blok i jest w nim jedyną, przy której wybiera się między
    dwiema stratami, a nie między stratą a zyskiem. Warto, żeby aplikacja
    przedstawiła to jako wybór, bo opis mówiący wyłącznie o korzyści
    przemilcza to, co użytkownik zobaczy po kilku miesiącach.

    Argument rozstrzygający dotyczy tego, co da się osiągnąć bez
    uprawnień. Ustawienie przeciwne pozwala uciszyć maszynę przez samo
    wywołanie dużej liczby zdarzeń — czyli czynnością dostępną komuś, kto
    nie ma jeszcze żadnych uprawnień. Utrata wpisów najstarszych jest
    kosztem, ale kosztem, którego napastnik nie może obrócić w narzędzie.

    Odnotowuję, że ten punkt i punkt o rozmiarze dziennika trzeba czytać
    razem. Osobno pierwszy odsuwa problem w czasie, a drugi rozstrzyga, co
    się stanie, gdy czas minie. Aplikacja pokazująca je w oddaleniu od
    siebie gubi połowę argumentu.
  en: |
    The rule closes the block and is the only one in it at which the choosing is between two losses and not
    between a loss and a gain. It is well that the application set that out as a choice, a description speaking
    of the good alone passing over in silence what the user will see after some months.

    The settling argument touches what may be come at without rights. The opposite setting allows a machine to
    be quieted by the mere raising of a great number of events - which is to say by an act open to somebody who
    holds no rights yet. The loss of the oldest entries is a cost, but a cost an attacker cannot turn into a
    tool.

    I set down that this item and the item about the log's size have to be read together. Apart, the first pushes
    the problem off in time, and the second settles what happens when the time runs out. An application showing
    them far from each other loses half the argument.
