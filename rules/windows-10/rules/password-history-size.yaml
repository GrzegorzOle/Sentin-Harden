id: win10-password-history-size

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Liczba pamiętanych haseł poprzednich
    en: The number of former passwords remembered
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, ile haseł poprzednich maszyna pamięta, żeby nie
    pozwolić na powrót do nich.

    Punkt sam z siebie nie zdejmuje żadnego ataku i opis powinien to
    przyznać. Jest to zabezpieczenie reguły o wieku hasła: bez historii
    wymaganie zmiany hasła daje się spełnić przez ustawienie tego samego
    hasła ponownie, a wtedy cała reguła o wygasaniu staje się czynnością
    pozorną.

    Wartość dwudziestu czterech bierze się z prostego rachunku. Przy zmianie
    hasła co rok historia tej długości obejmuje okres, po którym hasło
    poprzednie i tak przestaje mieć znaczenie. Przy zmianach częstszych
    osłania cykl na tyle długi, że powrót do hasła dawnego przestaje być
    sposobem na obejście.

    Wartość rzeczywista tej reguły jest więc pośrednia i tym właśnie tłumaczy
    się kategoria niska. Historia haseł nie broni przed niczym samodzielnie —
    sprawia, że broni reguła stojąca obok.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    hasło zdobyte kiedyś może wrócić do użycia, mimo obowiązku jego zmiany.
  en: |
    The setting says how many former passwords the machine remembers, so as not to allow a return to them.

    The item takes away no attack by itself and the description ought to own that. It is a safeguard for the
    rule about a password's age: without a history the demand that a password be changed can be met by setting
    the same password afresh, and then the whole rule about expiry becomes an act in appearance only.

    The value of twenty-four comes of a plain reckoning. At a change of password once a year a history of that
    length covers a span after which a former password ceases to matter anyway. At more frequent changes it
    shields a cycle long enough that a return to an old password ceases to be a way round.

    This rule's real value is therefore an indirect one, and by just that the low category is explained. A
    history of passwords guards against nothing on its own - it makes the rule standing beside it guard.

    What an attacker gains while the item goes unmet: the certainty that a password won at some time may come
    back into use, the duty of changing it notwithstanding.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć skutek dla człowieka jest niewielki.

    Dla użytkownika zmiana znaczy tyle, że przy ustawianiu hasła trzeba
    wymyślić nowe zamiast wrócić do znanego. Bywa to odbierane jako
    utrudnienie, ale awarią nie jest.

    Sprawdzenia wymaga co innego: konta obsługiwane skryptem, który hasło
    ustawia z wyliczenia. Skrypty budujące hasło z daty albo z numeru cyklu
    potrafią po pewnym czasie trafić na wartość już użytą, a wtedy
    ustawienie się nie uda. Objaw jest ten sam co przy regule o długości —
    skrypt kończy się powodzeniem, a hasło zostaje stare.

    Drugi przypadek dotyczy kont o haśle zapisanym w konfiguracji usługi
    i zmienianym przy każdym wdrożeniu. Tam też historia może zablokować
    wartość, której się spodziewano.

    Zmiana wchodzi natychmiast i nie unieważnia hasła bieżącego.

    Czego to nie psuje: logowania, haseł już ustawionych, kont domenowych,
    usług, sieci, aplikacji, profili.
  en: |
    The class is "needs review", though the consequence for a person is a small one.

    For a user the change means that at the setting of a password a new one has to be thought up instead of a
    return to a known one. That gets taken at times for a hindrance, but it is no fault.

    Something else calls for review: accounts handled by a script that sets the password from a reckoning.
    Scripts building a password out of a date or a cycle number may after a while light on a value already used,
    and then the setting will not succeed. The symptom is the same as at the rule about length - the script ends
    in success and the password stays the old one.

    The second case touches accounts whose password is written into a service's configuration and changed at
    every rollout. There too the history may block a value that was looked for.

    The change takes hold at once and does not void the password in force.

    What this does not break: logging on, passwords already set, domain accounts, services, the network,
    applications, or profiles.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Skrypt budujący hasło z wyliczenia trafia po czasie na wartość już użytą i ustawienie hasła się nie udaje
      - Objaw jest cichy, bo skrypt kończy się powodzeniem, a hasło konta zostaje stare
      - Użytkownik przy zmianie hasła musi wymyślić nowe zamiast wrócić do znanego, co bywa odbierane jako utrudnienie
      - Hasło zapisane w konfiguracji usługi i zmieniane przy wdrożeniu może trafić na wartość zablokowaną przez historię
      - Logowanie, hasła już ustawione, konta domenowe, praca usług i sieci pozostają bez zmian
    en:
      - A script building a password from a reckoning lights after a while on a value already used and the setting fails
      - The symptom is quiet, the script ending in success while the accounts password stays the old one
      - A user changing their password has to think up a new one instead of returning to a known one, which gets taken for a hindrance
      - A password written into a services configuration and changed at a rollout may light on a value the history blocks
      - Logging on, passwords already set, domain accounts, the work of services and of the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Hasła kont lokalnych ustawia skrypt budujący je z wyliczenia, którego nie da się na razie zmienić
    en:
      - The passwords of local accounts get set by a script building them from a reckoning that cannot for now be changed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordHistorySize\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '24'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^PasswordHistorySize\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'PasswordHistorySize'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The password in force is not voided. Look over the scripts that set
    # passwords from a reckoning - those will light in time on a value already
    # used and will leave the password unchanged without saying so.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordHistorySize = 24',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordHistorySize = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enforce-password-history

notes:
  pl: |
    Reguła jest w tym bloku najsłabsza w oderwaniu i najmocniejsza w parze.
    Warto, żeby aplikacja pokazywała ją razem z regułą o wygasaniu hasła,
    bo dopiero razem robią to, co obiecują — osobno pierwsza jest zapisem
    bez skutku, a druga daje się spełnić pozornie.

    Kategoria niska jest tu oceną świadomą, nie niedopatrzeniem. Historia
    haseł nie zamyka żadnej drogi wejścia; porządkuje sposób, w jaki działa
    reguła sąsiednia. Jest to dokładnie ten typ punktu, który w liście
    płaskiej wygląda tak samo jak zamknięcie realnej drogi — i po to jest
    druga oś.

    Odnotowuję, że wartość porównywana jest przez „nie mniej niż", więc
    maszyna pamiętająca haseł więcej przechodzi bez zmiany.
  en: |
    The rule is the weakest in this block taken alone and the strongest taken in a pair. It is well that the
    application show it together with the rule about a password's expiry, only together doing they what they
    promise - apart, the first is an entry without effect and the second can be met in appearance only.

    The low category is here a knowing judgement, not an oversight. A history of passwords closes no road in; it
    sets in order the way the neighbouring rule works. It is exactly the kind of item that in a flat list looks
    like the closing of a real road - and for that the second axis is there.

    Worth noting that the value is weighed by "not less than", so a machine remembering more passwords passes
    unchanged.
