id: win2025-bitlocker-enhanced-pin-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Kod startowy może zawierać znaki inne niż cyfry
    en: The startup code may hold characters other than digits
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt dopuszcza, żeby kod odblokowujący dysk systemowy zawierał litery
    i znaki, a nie wyłącznie cyfry.

    Zostawiam kategorię średnią i chcę powiedzieć, dlaczego nie wyżej,
    mimo że punkt sąsiaduje z regułą o długości kodu ocenioną wysoko.
    Tamta reguła ustala dolną granicę, poniżej której kod jest bezwartościowy.
    Ta tylko poszerza zbiór znaków — czyli poprawia tę samą wielkość, którą
    tamta już zabezpiecza, i poprawia ją mniej, niż zrobiłoby to dodanie
    dwóch cyfr. Oceniam mechanizm tym, czym jest, a nie tym, jak bardzo go
    cenię.

    Wartość realna leży gdzie indziej niż w arytmetyce. Kod złożony
    wyłącznie z cyfr ludzie wymyślają sami i wymyślają go źle: daty,
    numery pomieszczeń, numery z inwentaryzacji, ten sam kod na wszystkich
    maszynach w szafie. Dopuszczenie liter pozwala potraktować kod
    startowy jak każde inne hasło — czyli wygenerować go i trzymać
    w menedżerze haseł razem z resztą. To jest zmiana w sposobie pracy,
    nie w przestrzeni kombinacji, i tam leży jej wartość.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kody
    wymyślane przez ludzi, w praktyce powtarzalne i związane z maszyną albo
    z pomieszczeniem, w którym stoi.
  en: |
    The item permits the code unlocking the system drive to contain letters
    and symbols rather than digits alone.

    I keep the category medium and want to say why not higher, even though
    the item sits next to a rule about code length rated high. That rule
    sets the floor below which a code is worthless. This one only widens
    the character set - that is, it improves the same quantity the other
    one already secures, and improves it less than adding two digits would.
    I rate a mechanism by what it is, not by how much I value it.

    The real value lies elsewhere than in the arithmetic. A code made of
    digits alone is something people invent themselves, and they invent it
    badly: dates, room numbers, asset numbers, the same code on every
    machine in the rack. Permitting letters allows the startup code to be
    treated like any other password - that is, generated and kept in the
    password manager along with the rest. That is a change in the way
    people work, not in the combination space, and that is where its value
    lies.

    What an attacker gains while the item goes unmet: codes invented by
    people, in practice repetitive and tied to the machine or to the room
    it stands in.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę wskazać konkretne miejsce,
    w którym ta zmiana potrafi zaboleć, bo brzmi niewinnie, a na serwerze
    nie jest niewinna.

    Środowisko przed startem systemu nie ma układu klawiatury. Klawisze są
    odczytywane w układzie amerykańskim niezależnie od tego, co jest
    ustawione w systemie i co jest napisane na klawiszach. Kod zawierający
    litery przechodzi przez to bez szwanku, ale kod zawierający znaki
    specjalne — już niekoniecznie: znak wpisany poprawnie z punktu widzenia
    użytkownika trafi jako inny i maszyna odmówi, nie tłumacząc dlaczego.

    Na serwerze dokłada się do tego druga warstwa, bo kod wpisuje się
    zwykle przez zdalną konsolę karty zarządzania, która ma własne
    tłumaczenie klawiszy i własne ograniczenia. Zestaw tych dwóch rzeczy
    sprawia, że kod z bogatym zestawem znaków bywa niewpisywalny akurat
    tą drogą, którą trzeba go wpisać.

    Praktyczny wniosek nie brzmi „nie stosować", tylko: przy generowaniu
    kodu ograniczyć się do liter i cyfr, a poprawność wpisania sprawdzić
    raz, przez tę konsolę, której realnie się używa — zanim ten kod stanie
    się jedyną drogą do maszyny.

    Zmiana nie wymaga przerwy i cofa się natychmiast, a dotyczy kodów
    ustawianych po niej, nie tych już ustawionych.
  en: |
    I keep the class "needs review" and want to point at the specific place
    where this change can hurt, because it sounds innocent and on a server
    is not.

    The environment before the system starts has no keyboard layout. Keys
    are read in the US layout regardless of what is set in the system and
    what is printed on the keys. A code containing letters passes through
    that unharmed, but a code containing special characters may not: a
    character typed correctly from the user's point of view arrives as a
    different one, and the machine refuses without explaining why.

    On a server a second layer is added, because the code is usually typed
    through the management card's remote console, which has its own key
    translation and its own limits. The combination of the two means a code
    with a rich character set is sometimes untypeable by exactly the route
    it has to be typed through.

    The practical conclusion is not "do not apply" but: when generating the
    code, keep to letters and digits, and verify once that it can be typed,
    through the console actually in use - before that code becomes the only
    route into the machine.

    The change needs no outage and is undone immediately, and it applies to
    codes set after it rather than to those already set.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - accounts-and-passwords
  what_breaks:
    pl:
      - Środowisko przed startem systemu nie ma układu klawiatury i czyta klawisze w układzie amerykańskim
      - Znak specjalny wpisany poprawnie trafia jako inny, a maszyna odmawia bez wyjaśnienia
      - Zdalna konsola karty zarządzania ma własne tłumaczenie klawiszy i własne ograniczenia
      - Kod z bogatym zestawem znaków bywa niewpisywalny akurat tą drogą, którą trzeba go wpisać
      - Zmiana dotyczy kodów ustawianych po niej, a nie tych już ustawionych
    en:
      - The environment before the system starts has no keyboard layout and reads keys in the US layout
      - A special character typed correctly arrives as a different one, and the machine refuses without explanation
      - The management card's remote console has its own key translation and its own limits
      - A code with a rich character set is sometimes untypeable by exactly the route it has to be typed through
      - The change applies to codes set after it rather than to those already set
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy planowany zestaw znaków da się wpisać przez konsolę, której realnie się używa
      - Dodatkowe uwierzytelnienie przy starcie zostało na tej maszynie świadomie odpuszczone
    en:
      - It has not been checked whether the intended character set can be typed through the console actually in use
      - Additional authentication at startup was deliberately declined on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'UseEnhancedPin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'UseEnhancedPin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The pre-boot environment has no keyboard layout and reads keys as US.
    # Keep generated codes to letters and digits, and confirm once that the
    # code can be typed through the console actually in use - before it becomes
    # the only route into the machine.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'UseEnhancedPin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Nie oceniam tego punktu wyżej niż na średni, chociaż sąsiaduje z regułą
    o długości kodu ocenioną wysoko. Tamta ustala dolną granicę, ta tylko
    poszerza zbiór znaków — poprawia tę samą wielkość i mniej, niż zrobiłoby
    to dodanie dwóch cyfr.

    Wartość leży w sposobie pracy, nie w arytmetyce: dopuszczenie liter
    pozwala wygenerować kod i trzymać go w menedżerze haseł, zamiast
    wymyślać numer pomieszczenia.

    Miejsce, w którym to boli: środowisko przed startem nie ma układu
    klawiatury, a zdalna konsola karty zarządzania ma własne tłumaczenie
    klawiszy. Kod ze znakami specjalnymi bywa niewpisywalny akurat tą
    drogą, którą trzeba go wpisać.
  en: |
    I do not rate this item above medium, though it sits next to a rule on
    code length rated high. That one sets the floor, this one only widens
    the character set - it improves the same quantity and improves it less
    than adding two digits would.

    The value lies in the way people work, not in the arithmetic:
    permitting letters allows the code to be generated and kept in the
    password manager instead of invented as a room number.

    Where it hurts: the pre-boot environment has no keyboard layout, and
    the management card's remote console has its own key translation. A
    code with special characters is sometimes untypeable by exactly the
    route it has to be typed through.
