id: win10-infrared-monitor-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa nadzoru łącza podczerwonego wyłączona
    en: The watching service of the link by unseen light switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę nadzorującą łącze podczerwone — mechanizm
    przenoszenia danych światłem, wywodzący się z czasów, gdy nie było
    innej drogi bezprzewodowej.

    Zastrzeżenie dotyczy nie tego, czym łącze to jest, tylko tego, jak
    dawno przestało być używane. Mechanizm pozostaje w systemie, a wraz
    z nim sterowniki i warstwa obsługi, których nikt nie sprawdza, bo
    nikt z nich nie korzysta.

    Zagrożenie płynie właśnie stąd. Kod niesprawdzany jest kodem
    wartościowym dla napastnika, a łącze to przyjmuje dane z zewnątrz
    i przekazuje je warstwie działającej z wysokimi uprawnieniami.

    Drugim zastrzeżeniem jest zakres. Przenoszenie plików tą drogą omija
    sieć w całości, więc omija także wszystko, co sieć kontroluje.

    Odnotowuję, że na większości stanowisk usługa ta nie ma czego
    nadzorować, bo sprzęt podczerwony zniknął z maszyn dawno. To jest
    właśnie argument za jej wyłączeniem, a nie przeciw.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: warstwę
    obsługi starego łącza, niesprawdzaną, bo nieużywaną.
  en: |
    The setting switches off the service watching over the link by unseen light - a mechanism for the carrying of
    data by light, come down from the time when there was no other road without wires.

    The reservation touches not what that link is, but how long ago it ceased to be used. The mechanism stays in
    the system, and with it the drivers and the layer of backing, which nobody looks over, nobody using them.

    The danger flows from just that. Code unlooked-over is code of worth to an attacker, and that link takes data
    from without and hands it to a layer working with high rights.

    The second reservation is the reach. The carrying of files by that road passes the network by whole, and so
    passes by whatever the network keeps watch over.

    I set down that upon most stations that service has nothing to watch over, gear of unseen light having gone
    from machines long since. That is the very argument for its switching off and not against it.

    What an attacker gains while the item goes unmet: a layer backing an old link, unlooked-over for being unused.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na większości stanowisk sprawdzenie
    kończy się stwierdzeniem, że sprzętu tego nie ma.

    Miejscem wartym uwagi są urządzenia branżowe wyposażone w łącze
    podczerwone: starsze wagi, czytniki, przyrządy pomiarowe i sprzęt
    medyczny. Tam wymiana danych idzie właśnie tą drogą, bo producent
    nie przewidział innej.

    Miejscem drugim są stanowiska z przejściówką podczerwoną dołączoną
    po to, żeby obsłużyć jedno takie urządzenie. Przejściówka bywa
    wpięta na stałe i nikt o niej nie pamięta do chwili, gdy przestanie
    działać.

    Odnotowuję, że na maszynie bez sprzętu podczerwonego zmiana nie robi
    nic poza zdjęciem usługi z zestawu uruchamianych. Wtedy jest to punkt
    bez kosztu.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: sieci, łączności bezprzewodowej, przenoszenia
    plików innymi drogami, drukowania, logowania, pracy programów.
  en: |
    The class is "needs review", though upon most stations the review ends in the finding that such gear is not
    there.

    The place worth notice is gear of a trade furnished with a link by unseen light: older scales, readers,
    instruments of measure and gear of medicine. There the trading of data goes by that very road, the maker
    having looked for no other.

    The second place is stations with a piece of passage for unseen light joined on to serve one such thing. Such
    a piece is at times plugged in for good and nobody remembers it until the hour it ceases to work.

    I set down that upon a machine with no gear of unseen light the change does nothing but take the service out
    of the set that is set going. It is then an item with no cost.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the network, wireless joining, the carrying of files by other roads, printing,
    logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - legacy-applications
    - removable-media
  what_breaks:
    pl:
      - Starsze wagi, czytniki i przyrządy pomiarowe wymieniające dane łączem podczerwonym przestaną się zgłaszać
      - Przejściówka podczerwona wpięta na stałe przestanie działać, a zwykle nikt o niej nie pamięta
      - Sprzęt medyczny przewidziany przez producenta wyłącznie na to łącze straci drogę wymiany danych
      - Na maszynie bez sprzętu podczerwonego zmiana nie robi nic poza zdjęciem usługi z zestawu uruchamianych
      - Sieć, łączność bezprzewodowa, przenoszenie plików innymi drogami, drukowanie i logowanie pozostają bez zmian
    en:
      - Older scales, readers and instruments of measure trading data by the link of unseen light will cease to report
      - A piece of passage for unseen light plugged in for good will cease to work, and commonly nobody remembers it
      - Gear of medicine looked for by its maker upon that link alone will lose its road of trading data
      - Upon a machine with no gear of unseen light the change does nothing but take the service out of the set that is set going
      - The network, wireless joining, the carrying of files by other roads, printing and logging on stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna obsługuje urządzenie branżowe wymieniające dane wyłącznie łączem podczerwonym
    en:
      - The machine serves gear of a trade trading data by the link of unseen light alone
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\irmon'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'irmon' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'irmon' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'irmon' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-hardware/drivers/network/introduction-to-irda

notes:
  pl: |
    Reguła jest wygodnym przykładem na to, że wartość punktu nie musi
    wynikać z podatności. Warto, żeby aplikacja powiedziała to wprost:
    mechanizm zostaje w systemie długo po tym, jak przestał być używany,
    i przez to nikt go nie sprawdza.

    Argument wart postawienia dotyczy drogi omijającej sieć. Przenoszenie
    plików podczerwienią nie przechodzi przez żaden mechanizm kontroli
    ruchu, więc to, co sieć zatrzymuje, tą drogą wchodzi bez przeszkód.

    Odnotowuję wyjątek wart wymienienia z nazwy: urządzenia branżowe
    i medyczne, w których producent nie przewidział innej drogi wymiany
    danych. Tam punkt jest błędem i trzeba to powiedzieć wprost.
  en: |
    The rule is a handy showing that an item's worth need not flow from a weakness. It is well that the
    application say it outright: a mechanism stays in the system long after it has ceased to be used, and for that
    nobody looks it over.

    The argument worth putting touches the road that passes the network by. The carrying of files by unseen light
    goes through no mechanism watching over traffic, so what the network holds back comes in by that road
    unhindered.

    I set down the exception worth naming outright: gear of a trade and of medicine in which the maker looked for
    no other road of trading data. There the item is a mistake and that is to be said plainly.
