id: win2025-print-rpc-outgoing-protocol-tcp

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Połączenia wychodzące podsystemu druku wyłącznie przez gniazda sieciowe
    en: Outgoing connections of the printing subsystem over network sockets only
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe podsystemowi druku łączyć się z cudzymi serwerami
    wydruku przez gniazdo sieciowe, a nie przez nazwany potok.

    Jest to druga strona tej samej relacji co punkt o połączeniach
    przychodzących. Tam chodziło o to, czym można dobić się do tej
    maszyny. Tutaj o to, czym ta maszyna dobija się do innych — i skutki
    są innego rodzaju, bo tym razem to ona jest stroną, która się
    przedstawia.

    Połączenie nazwanym potokiem jest sesją udostępniania plików.
    Nawiązanie jej wymaga uwierzytelnienia, więc maszyna przedstawia się
    kontem, na którym pracuje bufor wydruku — czyli kontem komputera
    albo kontem usługi. Robi to w chwili, gdy sięga do kolejki, a więc
    bez czyjejkolwiek decyzji i wobec maszyny, której adres wziął się
    z rozwiązania nazwy.

    Dla napastnika, który potrafi odpowiedzieć na to rozwiązanie nazwy,
    jest to sposób na wywołanie uwierzytelnienia u siebie. Nie musi
    niczego łamać — wystarczy, że serwer sam się do niego zgłosi.

    Połączenie przez gniazdo sieciowe tej możliwości nie daje w tej
    postaci i dodatkowo jest widoczne jako ruch wydruku, a nie jako
    zwykły ruch plikowy.

    Na serwerze rzecz waży więcej, bo konto, którym maszyna się
    przedstawia, jest kontem serwera, a nie stanowiska jednej osoby.
    Serwer sięga też do kolejek wydruku sam, bez udziału człowieka —
    przez usługę raportową, przez zadanie terminarza, przez aplikację
    drukującą dokumenty w nocy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    sprowokowania serwera do uwierzytelnienia się na maszynie napastnika
    przez samo sięgnięcie do kolejki wydruku.
  en: |
    The setting bids the printing subsystem connect with others' print servers by a network socket
    and not by a named pipe.

    It is the other side of the same relation as the item about incoming connections. There it was
    about by what this machine can be reached. Here about by what this machine reaches others -
    and the effects are of another kind, this time it being the side that presents itself.

    A connection by a named pipe is a session of file sharing. Its opening takes an authentication,
    so the machine presents itself by the account the print spooler works under - that is by the
    computer's account or by a service's. It does so at the moment it reaches for a queue, and so
    with nobody's decision and towards a machine whose address came from the resolving of a name.

    For an attacker able to answer that resolving of a name it is a way of calling an
    authentication forth at their own place. They need break nothing - it is enough that the
    server report to them of itself.

    A connection over a network socket does not give that means in this form and is besides seen
    as print traffic and not as ordinary file traffic.

    On a server the matter weighs more, the account the machine presents itself by being a
    server's and not one person's station. A server also reaches for print queues of itself, with
    no person's part - by a service of reports, by a scheduler's job, by an application printing
    documents at night.

    What an attacker gains while the item goes unmet: the means of provoking the server into
    authenticating itself at the attacker's machine by the mere reaching for a print queue.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy ta maszyna łączy się z serwerem
    wydruku albo z urządzeniem, które przyjmuje wyłącznie nazwane
    potoki.

    Urządzenia takie istnieją i są to zwykle wbudowane serwery wydruku
    w maszynach wielofunkcyjnych sprzed lat. Ich oprogramowanie
    wewnętrzne bywa zamrożone na wersji sprzed dekady i nie da się go
    zmienić — bo aktualizacji nie ma, a nie dlatego, że nikt jej nie
    wgrał.

    Na serwerze trzeba szukać innego rodzaju powiązań niż na stanowisku
    roboczym. Stanowisko drukuje, bo ktoś kliknął. Serwer drukuje, bo tak
    ma w zadaniu terminarza, w definicji raportu albo w konfiguracji
    aplikacji branżowej — i takie połączenia są zapisane w miejscach,
    do których nikt nie zagląda.

    Objaw po zmianie jest cichy i to jest tutaj najgorsze. Zadanie nocne
    po prostu nie wydrukuje tego, co miało, a rano nie będzie po tym
    śladu poza brakiem wydruku. Nikt nie zobaczy komunikatu, bo nikogo
    przy tym nie ma.

    Rozpoznanie idzie po kolejkach wydruku widocznych na tej maszynie
    i po tym, co je dodało. Kolejka dodana przez aplikację, a nie przez
    człowieka, jest tą, którą warto sprawdzić najpierw.

    Zmiana wymaga ponownego uruchomienia bufora wydruku, czyli przerwania
    zadań w toku.

    Drukowanie na drukarkach podłączonych bezpośrednio i na urządzeniach
    adresowanych po adresie sieciowym pozostaje bez różnicy — punkt
    dotyczy wyłącznie sięgania do cudzych kolejek.
  en: |
    One thing needs checking: whether this machine connects with a print server or with a device
    that takes named pipes alone.

    Such devices are, and they are usually print servers built into multi-purpose machines from
    years ago. Their inner software is at times frozen at a version a decade old and cannot be
    changed - there being no update, and not because nobody laid one in.

    On a server ties of another kind must be sought than at a working station. A station prints
    because somebody clicked. A server prints because it is so set in a scheduler's job, in the
    definition of a report or in the setting up of trade software - and such connections are
    written in places nobody looks into.

    The symptom after the change is quiet, and that is here the worst of it. A night job will
    simply not print what it was to, and in the morning there will be no trace of it beyond the
    want of the printout. Nobody will see a message, nobody being there.

    The reconnaissance goes by the print queues to be seen on this machine and by what added them.
    A queue added by an application and not by a person is the one worth checking first.

    The change takes a fresh start of the print spooler, that is the breaking of jobs under way.

    Printing on printers connected straight and on devices addressed by a network address stays
    with no difference - the item bears on the reaching for others' queues alone.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - file-sharing
  what_breaks:
    pl:
      - Serwer nie połączy się z kolejką wydruku przyjmującą wyłącznie nazwane potoki
      - Wbudowany serwer wydruku w urządzeniu wielofunkcyjnym sprzed lat jest typową ofiarą
      - Zadanie nocne po prostu nie wydrukuje tego, co miało, bez komunikatu i bez śladu
      - Drukowanie na drukarkach podłączonych bezpośrednio i adresowanych po adresie sieciowym działa bez różnicy
      - Ponowne uruchomienie bufora przerywa zadania w toku
    en:
      - The server will not connect with a print queue that takes named pipes alone
      - A print server built into a multi-purpose device from years ago is the usual victim
      - A night job will simply not print what it was to, with no message and no trace
      - Printing on printers connected straight and addressed by a network address works with no difference
      - A fresh start of the spooler breaks jobs under way
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer sięga do kolejki wydruku przyjmującej wyłącznie nazwane potoki
      - Nie ustalono, co dodało kolejki wydruku widoczne na tej maszynie
    en:
      - The server reaches for a print queue that takes named pipes alone
      - It was not settled what added the print queues to be seen on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero here means connections over network sockets; one means named pipes.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'RpcUseNamedPipeProtocol'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'RpcUseNamedPipeProtocol'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RpcUseNamedPipeProtocol' -Value 0 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-rpc-connection-settings

notes:
  pl: |
    To jest druga strona relacji opisanej w punkcie o połączeniach
    przychodzących. Tam chodzi o to, czym można dobić się do tej
    maszyny; tutaj o to, czym ta maszyna dobija się do innych.

    Połączenie nazwanym potokiem jest sesją udostępniania plików, więc
    serwer przedstawia się kontem, na którym pracuje bufor wydruku.
    Napastnik potrafiący odpowiedzieć na rozwiązanie nazwy wywołuje to
    uwierzytelnienie u siebie.

    Na serwerze połączenia z kolejkami bywają zapisane w zadaniach
    terminarza i w konfiguracji aplikacji, a nie tworzone przez ludzi.
    Objaw po zmianie jest wtedy cichy — nocny wydruk po prostu nie
    wychodzi.
  en: |
    This is the other side of the relation set down in the item about incoming connections. There
    it is about by what this machine can be reached; here about by what this machine reaches
    others.

    A connection by a named pipe is a session of file sharing, so the server presents itself by
    the account the print spooler works under. An attacker able to answer the resolving of a name
    calls that authentication forth at their own place.

    On a server connections with queues are at times written in a scheduler's jobs and in
    applications' settings, and not made by people. The symptom after the change is then quiet -
    the night printout simply does not come out.
