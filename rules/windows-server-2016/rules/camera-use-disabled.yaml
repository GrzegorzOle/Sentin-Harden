id: win2016-camera-use-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Camera
  title:
    pl: Korzystanie z kamery zablokowane
    en: The use of the camera blocked
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje korzystanie z kamery na poziomie systemu.

    Rzecz, o którą tu chodzi, nie jest twarzą osoby siedzącej przy
    maszynie. Kamera pokazuje to, co za tą osobą: tablicę z rozpisanym
    wdrożeniem, ekran sąsiedniego stanowiska, kartkę leżącą na biurku,
    wejście do pomieszczenia. Jest to podgląd pokoju, nie podgląd
    człowieka, i tak trzeba go oceniać.

    Druga rzecz dotyczy poziomu, na którym blokada działa. Jest to
    ustawienie systemu, więc obowiązuje niezależnie od tego, co deklaruje
    pojedyncza aplikacja i niezależnie od tego, jakie uprawnienia jej
    nadano. Uprawnienia aplikacji można obejść; tego ustawienia aplikacja
    nie obchodzi.

    Trzecia rzecz jest konsekwencją drugiej i to ona stanowi koszt.
    Zablokowana kamera nie działa także dla rozpoznawania twarzy przy
    logowaniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: podgląd
    pomieszczenia, w którym stoi maszyna, razem z tym, co w tym
    pomieszczeniu widać.
  en: |
    The setting blocks the use of the camera at the level of the system.

    The thing at stake here is not the face of the person sitting at the machine. The camera shows what is
    behind that person: a whiteboard with a rollout written out on it, the screen of the next desk, a sheet
    lying on the table, the way into the room. It is a view of a room, not a view of a person, and so it has
    to be weighed.

    The second matter concerns the level at which the block works. It is a setting of the system, so it holds
    whatever a single application declares and whatever permissions were granted to it. An application's
    permissions can be got round; this setting an application does not get round.

    The third matter follows from the second and it is the one that makes the cost. A blocked camera does not
    work for face recognition at a logon either.

    What an attacker gains while the item goes unmet: a view of the room the machine stands in, along with
    whatever can be seen in that room.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i powód jest jeden, ale poważny.

    Jeżeli ktokolwiek loguje się na tej maszynie rozpoznawaniem twarzy,
    zmiana odetnie go od własnego konta. Nie będzie to komunikat o braku
    uprawnień ani prośba o inne hasło — kamera po prostu nie ruszy,
    a logowanie twarzą zniknie z ekranu. Osoba, która nie pamięta hasła,
    bo od miesięcy wchodzi twarzą, nie wejdzie wcale.

    Dlatego punkt wymaga ustalenia przed wykonaniem, kto i jak się na tej
    maszynie loguje, oraz upewnienia się, że każdy ma drogę zapasową.
    Jest to warunek do sprawdzenia, a nie ostrzeżenie do przeczytania.

    Druga rzecz dotyczy spotkań. Na maszynie, przy której ktoś prowadzi
    rozmowy z obrazem, zmiana zabiera obraz całkowicie. Dźwięk zostaje,
    więc objaw wygląda jak awaria kamery, a nie jak zasada — i tak będzie
    zgłoszony.

    Na serwerze w szafie, bez kamery, zmiana nie robi nic.

    Czego to nie psuje: mikrofonu, dźwięku w rozmowach, logowania hasłem,
    kluczem sprzętowym i kartą, usług, aplikacji, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs a planned rollout", and the reason is one but a grave one.

    If anybody at all logs on at this machine by face recognition, the change will cut them off from their own
    account. It will be no message about a want of permissions nor a request for another password - the camera
    simply will not start, and the logon by face will go from the screen. A person who does not remember their
    password, having entered by face for months, will not enter at all.

    Therefore the item calls for it to be established before carrying out who logs on at this machine and how,
    and for a making sure that everybody has a road in reserve. It is a condition to be checked, not a warning
    to be read.

    The second matter concerns meetings. On a machine at which somebody holds conversations with a picture, the
    change takes the picture away altogether. The sound stays, so the symptom looks like a fault of the camera
    rather than like a policy - and so it will be reported.

    On a server in a cabinet, without a camera, the change does nothing.

    What this does not break: the microphone, sound in conversations, logging on by password, by a hardware key
    and by a card, services, applications, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Logowanie rozpoznawaniem twarzy przestaje działać i osoba bez innej drogi wejścia nie zaloguje się wcale
      - Logowanie twarzą znika z ekranu bez komunikatu o zasadzie, więc wygląda jak awaria sprzętu
      - Rozmowy z obrazem tracą obraz przy zachowanym dźwięku, co bywa zgłaszane jako awaria kamery
      - Aplikacje sięgające po kamerę dostają odmowę niezależnie od nadanych im uprawnień
      - Mikrofon, logowanie hasłem, kluczem sprzętowym i kartą oraz usługi systemowe pozostają bez zmian
    en:
      - Logging on by face recognition ceases to work and a person without another road in will not log on at all
      - The logon by face goes from the screen without a message about a policy, so it looks like a fault of the gear
      - Conversations with a picture lose the picture while keeping the sound, which is at times reported as a camera fault
      - Applications reaching for the camera get a refusal whatever permissions were granted to them
      - The microphone, logging on by password, by a hardware key and by a card, and system services stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktokolwiek loguje się na tej maszynie rozpoznawaniem twarzy i nie ma ustalonej drogi zapasowej
      - Maszyna służy do prowadzenia rozmów z obrazem i kamera jest do tego potrzebna
      - Kamera jest częścią zainstalowanego rozwiązania dozoru albo kontroli dostępu
    en:
      - Anybody at all logs on at this machine by face recognition and has no road in reserve established
      - The machine serves for holding conversations with a picture and the camera is needed for that
      - The camera is part of an installed solution for watching or for access control
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
      $name = 'AllowCamera'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    $name = 'AllowCamera'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish first whether anybody signs in by face recognition on this
    # machine. They must have another way in before this is carried out,
    # otherwise the change shuts them out of their own account.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Camera'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowCamera' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-camera

notes:
  pl: |
    Punkt otwiera blok o tym, co maszyna zbiera od człowieka, który przy
    niej siedzi — obraz, twarz, położenie, wpisywane słowa, pismo odręczne.
    Wszystkie reguły bloku dotyczą danych powstających z obecności
    człowieka, a nie z pracy systemu.

    Ta reguła jest w bloku najdroższa i warto, żeby aplikacja postawiła
    warunek wprost: zanim punkt zostanie wykonany, trzeba wiedzieć, kto
    loguje się twarzą. Nie jest to koszt do rozważenia, tylko fakt do
    sprawdzenia, a różnica między jednym a drugim jest tu cała.

    Argument wart zachowania dotyczy tego, co kamera pokazuje. Zwykle mówi
    się o twarzy, a najcenniejsza jest reszta kadru — tablica, sąsiedni
    ekran, kartka na biurku. Zdanie o tym przenosi rozmowę z prywatności
    na dane, i to jest właściwe miejsce tej rozmowy na serwerze.

    Odnotowuję, że przy inwentaryzacji warto sprawdzić obecność kamery,
    bo na maszynie, która jej nie ma, cały koszt znika, a reguła zostaje
    porządkowa.
  en: |
    The item opens the block about what the machine gathers from the person who sits at it - a picture, a face,
    a position, the words typed, handwriting. All the block's rules concern data arising from a person's
    presence rather than from the system's work.

    This rule is the dearest in the block, and it is well that the application set the condition down outright:
    before the item is carried out, one has to know who logs on by face. It is not a cost to be weighed but a
    fact to be checked, and the difference between the one and the other is here the whole matter.

    The argument worth keeping concerns what the camera shows. One speaks as a rule of the face, and the most
    valuable thing is the rest of the frame - the whiteboard, the next screen, the sheet on the desk. A
    sentence about that moves the conversation from privacy to data, and that is the proper place of that
    conversation on a server.

    Worth noting that at the inventory it is worth checking for a camera's presence, on a machine that has none
    the whole cost going and the rule staying one of order.
