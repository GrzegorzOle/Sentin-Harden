id: win2016-scripted-diagnostics-remote-query-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Troubleshooting and Diagnostics > Scripted Diagnostics
  title:
    pl: Pobieranie treści diagnostycznych z sieci wyłączone
    en: The fetching of diagnostic content from the network switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza pobieranie z sieci treści diagnostycznych
    uruchamianych przez mechanizm rozwiązywania problemów.

    Punkt stoi obok poprzedniego, leży w tej samej gałęzi rejestru i pod
    inną nazwą wartości. Warto to powiedzieć wprost, bo wyglądają na
    powtórzenie i kusi, żeby jeden pominąć. Wykonanie jednego nie
    rozstrzyga drugiego.

    Rzecz dotyczy tego samego rodzaju zagrożenia. Paczka diagnostyczna
    jest zestawem czynności, nie opisem, więc jej pobranie kończy się
    wykonaniem na tym serwerze. Różnica polega na tym, kto pyta i skąd
    bierze się odpowiedź; skutek jest taki sam.

    Warto odnotować, co ten punkt odbiera. Odbiera możliwość dostarczenia
    na maszynę nowej treści wykonywalnej pod postacią pomocy
    w rozwiązaniu problemu — czyli pod postacią, przy której nikt nie
    spodziewa się kodu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drugą,
    niezależną drogę dostarczenia na maszynę treści, która zostanie na
    niej wykonana.
  en: |
    The setting switches off the fetching from the network of diagnostic content started by the troubleshooting
    mechanism.

    The item stands beside the one before, lies in the same branch of the registry and under another value name.
    That is worth saying outright, they looking a repetition and it being tempting to leave one out. The carrying
    out of one does not settle the other.

    The matter concerns the same kind of threat. A diagnostic package is a set of actions, not a description, so
    the fetching of it ends in a carrying out on this server. The difference rests on who asks and whence the
    answer comes; the consequence is the same.

    Worth noting what this item takes away. It takes away the possibility of delivering onto the machine new
    executable content in the shape of help with solving a trouble - which is to say in a shape at which nobody
    expects code.

    What an attacker gains while the item goes unmet: a second, independent road for delivering onto the machine
    content that will be carried out on it.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm rozwiązywania problemów nadal działa i pracuje na treściach,
    które maszyna ma u siebie. Znika wyłącznie pobieranie treści nowszych
    z sieci.

    Na serwerze nie zauważy tego nikt, bo diagnozę stawia się z dzienników
    i z poleceń, a nie z kreatorów.

    Nie ma znanych regresji.

    Czego to nie psuje: mechanizmu rozwiązywania problemów jako takiego,
    treści diagnostycznych wbudowanych, dzienników zdarzeń, poleceń
    diagnostycznych, usług, aplikacji.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    The troubleshooting mechanism still works and works on the content the machine holds at home. What goes is
    solely the fetching of newer content from the network.

    On a server nobody will notice it, the diagnosis being made from the logs and from commands rather than from
    wizards.

    There are no known regressions.

    What this does not break: the troubleshooting mechanism as such, the built-in diagnostic content, the event
    logs, diagnostic commands, services, or applications.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - scripting-and-automation
  what_breaks:
    pl:
      - Mechanizm rozwiązywania problemów przestaje pobierać nowsze treści i pracuje na wbudowanych
      - Wykonanie tego punktu nie rozstrzyga punktu o narzędziu diagnostycznym, mimo wspólnego klucza rejestru
      - Treści diagnostyczne wbudowane, dzienniki zdarzeń i polecenia diagnostyczne pozostają bez zmian
      - Role serwera, usługi systemowe i aplikacje pozostają bez zmian
    en:
      - The troubleshooting mechanism ceases to fetch newer content and works on the built-in kind
      - The carrying out of this item does not settle the item about the diagnostic tool, despite the shared registry key
      - The built-in diagnostic content, the event logs and diagnostic commands stay unchanged
      - The server roles, system services and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Rozpoznawanie usterek na tej maszynie opiera się na treściach diagnostycznych pobieranych z sieci
    en:
      - The diagnosing of faults on this machine rests on diagnostic content fetched from the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
      $name = 'EnableQueryRemoteServer'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    $name = 'EnableQueryRemoteServer'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The same registry branch as the diagnostic tool item, under a different
    # value name - carrying out one does not settle the other.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\ScriptedDiagnosticsProvider\Policy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableQueryRemoteServer' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-sdiageng

notes:
  pl: |
    Punkt jest drugi w bloku i najłatwiej go pominąć, bo wygląda na
    powtórzenie poprzedniego. Warto, żeby aplikacja pokazywała oba razem
    i mówiła wprost, że wspólny klucz nie znaczy wspólnego ustawienia.

    Rzecz warta zapamiętania przy czytaniu kopii zapasowej: kopia dotyczy
    jednej wartości, nie całego klucza. Wycofanie jednej reguły zostawia
    drugą na miejscu i tak ma być.

    Koszt jest tu zerowy, a kategoria średnia, więc pozycja należy do
    szybkich wygranych i domyślne sortowanie powinno wysuwać ją wysoko.
    Jest to zarazem przykład reguły, którą wolno wykonać hurtem — w
    odróżnieniu od sąsiedniej, która hurtem nie idzie mimo wyższej
    kategorii.

    Zestawienie tych dwóch pozycji obok siebie pokazuje, po co są dwie osie
    naraz. Wyższa kategoria nie przesądza kolejności działania, jeśli
    koszt jest większy; niższa nie zwalnia z wykonania, jeśli koszt jest
    żaden.
  en: |
    The item is the second in the block and the easiest to leave out, looking as it does a repetition of the one
    before. It is well that the application show both together and say outright that a shared key does not mean a
    shared setting.

    Worth keeping in mind when reading the backup: the backup concerns one value, not the whole key. The undoing
    of one rule leaves the other in place and so it should.

    The cost here is nil and the category medium, so the entry belongs among the quick wins and the default
    sorting ought to put it high. It is at the same time an example of a rule that may be carried out in bulk -
    unlike its neighbour, which does not go in bulk despite its higher category.

    Setting those two entries beside each other shows what two axes at once are for. A higher category does not
    settle the order of work if the cost is greater; a lower one does not excuse from carrying out if the cost is
    none.
