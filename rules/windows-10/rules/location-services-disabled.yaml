id: win10-location-services-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Location and Sensors
  title:
    pl: Ustalanie położenia maszyny wyłączone zasadą
    en: The telling of the machine s whereabouts switched off by policy
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka zasadą cały mechanizm ustalania położenia maszyny,
    niezależnie od tego, czy odpowiednia usługa działa.

    Różnica wobec punktu o usłudze polega na trwałości. Usługę da się
    uruchomić z powrotem, a przełącznik w oknie ustawień jest dostępny
    użytkownikowi. Zasada zamyka mechanizm na poziomie, do którego
    użytkownik nie sięga.

    Drugą różnicą jest zakres. Zasada obejmuje także czujniki wbudowane
    w sprzęt, jeżeli maszyna je ma — odbiornik satelitarny w laptopie
    z modemem, czujnik orientacji, czujnik światła wykorzystywany do
    ustalania otoczenia.

    Zagrożeniem jest to, że położenie jest dostępne dla programów bez
    zgody użytkownika w każdym pojedynczym przypadku. Zgoda udzielana
    raz obowiązuje dalej, a program uruchomiony bez wiedzy użytkownika
    korzysta z niej tak samo jak każdy inny.

    Odnotowuję, że oba punkty warto wdrożyć razem. Usługa zamyka
    wykonanie, zasada zamyka możliwość włączenia go z powrotem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: położenie
    maszyny dostępne programom przez mechanizm, który użytkownik może
    włączyć jednym kliknięciem.
  en: |
    The setting shuts by policy the whole mechanism of the telling of the machine's whereabouts, whether the
    answering service works or not.

    The difference against the item about the service lies in lastingness. A service may be set going again, and
    the switch in a window of settings is to be had by the user. Policy shuts the mechanism at a level the user
    reaches not.

    The second difference is the reach. Policy takes in also the feelers built into the thing itself, if the
    machine has them - a taker of signals from the sky in a laptop with a modem, a feeler of bearing, a feeler of
    light used for the telling of the surroundings.

    The danger is that the whereabouts is to be had by programs without the user's leave in every single case. A
    leave given once holds on, and a program set going without the user's knowledge uses it just as any other
    does.

    I set down that both items are worth rolling out together. The service shuts the doing, the policy shuts the
    power of turning it back on.

    What an attacker gains while the item goes unmet: the machine's whereabouts to be had by programs through a
    mechanism the user may turn on at one press.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to samo
    co przy usłudze: czy któryś z używanych programów potrzebuje
    położenia.

    Miejscem wartym uwagi jest różnica w skutku. Zasada zamyka mechanizm
    także dla użytkownika, więc przełącznik w oknie ustawień przestanie
    działać albo zniknie. Użytkownik zobaczy komunikat o zasadzie
    organizacji, a nie o braku sprzętu.

    Odnotowuję, że jest to skutek zamierzony i warto go opisać wprost.
    Zgłoszenie „nie mogę włączyć lokalizacji" jest wtedy potwierdzeniem,
    że punkt działa, a nie usterką.

    Miejscem drugim są maszyny z czujnikami wbudowanymi, na których
    zasada obejmuje szerszy zakres niż samo ustalanie położenia z sieci.
    Warto sprawdzić, czy któryś program z tych czujników korzysta.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: łączności sieciowej, przeglądania stron, pracy
    programów niekorzystających z położenia, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is the same as at the service: whether any of the
    programs in use needs the whereabouts.

    The place worth notice is the difference in the upshot. Policy shuts the mechanism for the user as well, so
    the switch in the window of settings will cease to work or will vanish. The user will see a message about the
    body's policy and not about a want of a thing.

    I set down that it is an upshot meant and is worth setting out outright. A report of "I cannot turn the
    whereabouts on" is then a warrant that the item works and no fault.

    The second place is machines with feelers built in, upon which the policy takes in a wider reach than the
    telling of the whereabouts out of the network alone. It is worth looking at whether any program uses those
    feelers.

    The consequence shows at once, with no restart.

    What this does not break: the joining to the network, the looking over of pages, the work of programs that use
    no whereabouts, logging on, or printing.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Przełącznik lokalizacji w oknie ustawień przestanie działać albo zniknie, a użytkownik zobaczy komunikat o zasadzie organizacji
      - Zgłoszenie o niemożności włączenia lokalizacji jest potwierdzeniem, że punkt działa, a nie usterką
      - Na maszynach z czujnikami wbudowanymi zasada obejmuje szerszy zakres niż ustalanie położenia z sieci
      - Programy korzystające z czujnika orientacji albo światła warto sprawdzić przed wdrożeniem
      - Łączność sieciowa, przeglądanie stron, logowanie, drukowanie i praca pozostałych programów pozostają bez zmian
    en:
      - The switch of the whereabouts in the window of settings will cease to work or will vanish, and the user will see a message about the body s policy
      - A report of being unable to turn the whereabouts on is a warrant that the item works and no fault
      - Upon machines with feelers built in the policy takes in a wider reach than the telling of the whereabouts out of the network
      - Programs using a feeler of bearing or of light are worth looking at before the rollout
      - The joining to the network, the looking over of pages, logging on, printing and the work of other programs stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Program używany na maszynie korzysta z czujnika orientacji albo światła wbudowanego w sprzęt
      - Stanowisko przenośne jest zabezpieczone narzędziem odnajdywania zagubionego urządzenia
    en:
      - A program used upon the machine uses a feeler of bearing or of light built into the thing itself
      - A station carried about is guarded by a tool for the finding of a lost thing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableLocation'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    $name = 'DisableLocation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLocation' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Reguła jest parą do punktu o usłudze ustalania położenia i warto,
    żeby aplikacja pokazała je razem, zaznaczając podział pracy. Usługa
    zamyka wykonanie. Zasada zamyka możliwość włączenia go z powrotem
    przez użytkownika.

    Argument wart postawienia wprost dotyczy zgody. Zgoda na dostęp do
    położenia jest udzielana raz i obowiązuje dalej, więc program
    uruchomiony bez wiedzy użytkownika korzysta z niej tak samo jak
    każdy inny. Zamknięcie mechanizmu zdejmuje to pytanie w całości.

    Odnotowuję, że komunikat widziany przez użytkownika mówi o zasadzie
    organizacji. Warto to wymienić, bo zgłoszenie po wdrożeniu brzmi
    zwykle „lokalizacja nie działa", a jest to potwierdzenie skuteczności
    punktu.
  en: |
    The rule is the pair of the item about the service telling the whereabouts, and it is well that the
    application show them together, marking the parting of the work. The service shuts the doing. The policy shuts
    the power of the user turning it back on.

    The argument worth putting outright touches leave. Leave for a reach of the whereabouts is given once and
    holds on, so a program set going without the user's knowledge uses it just as any other does. The shutting of
    the mechanism takes that question away whole.

    I set down that the message the user sees speaks of the body's policy. It is worth naming, a report after the
    rollout commonly running "the whereabouts does not work", while it is a warrant of the item's working.
