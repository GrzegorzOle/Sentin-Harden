id: win2025-bitlocker-smart-card-fixed-drives

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Fixed Data Drives
  title:
    pl: Karta wymagana do odblokowania dysków stałych
    en: A card required to unlock fixed drives
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby wolumen stały z danymi odblokowywało się
    certyfikatem z karty, a nie innym sposobem. Pierwsza wartość dopuszcza
    kartę, druga czyni ją wymaganą — dopuszczenie bez wymagania zostawia
    wybór otwarty i audyt raportuje ten stan osobno.

    Zostawiam kategorię średnią. Wartość tego punktu jest realna, ale
    węższa niż przy pozostałych regułach tej grupy, i chcę powiedzieć
    dlaczego. Karta wiąże odblokowanie wolumenu z konkretnym
    certyfikatem, a certyfikat — inaczej niż hasło — da się unieważnić.
    To jest ta sama myśl co przy regule o hasłach, tylko zapisana od
    drugiej strony: tam zabieramy sekret, którego nie da się cofnąć, tu
    wskazujemy sekret, który da się cofnąć. Obie reguły opisują jedno
    postanowienie i stosuje się je razem.

    Na serwerze rzecz wymaga uczciwego zastrzeżenia. Nazwa mówi o karcie,
    czyli o przedmiocie, który ktoś wkłada do czytnika — i w tym
    rozumieniu punkt na serwerze nie ma sensu, bo nie ma tam nikogo, kto
    by cokolwiek wkładał. Mechanizm jest jednak certyfikatowy, więc
    w praktyce chodzi o certyfikat w magazynie, niekoniecznie o plastik.
    Nie chcę udawać, że to rozwiązuje problem: certyfikat w magazynie tej
    samej maszyny jest wygodny i jednocześnie słabszy niż przedmiot
    trzymany osobno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    wolumenu danych oparty na sposobie odblokowania, którego nikt nie
    będzie mógł unieważnić, gdy zajdzie potrzeba.
  en: |
    The item requires a fixed data volume to be unlocked with a certificate
    from a card rather than by another means. The first value admits the
    card, the second makes it required - admitted without required leaves
    the choice open, and the audit reports that state separately.

    I keep the category medium. This item's value is real but narrower than
    at the other rules in this group, and I want to say why. A card binds
    the unlocking of a volume to a specific certificate, and a certificate
    - unlike a password - can be revoked. This is the same thought as at
    the rule about passwords, only written from the other side: there we
    take away a secret that cannot be withdrawn, here we point at a secret
    that can be. Both rules describe one decision and are applied together.

    On a server the matter needs an honest caveat. The name speaks of a
    card, that is, an object somebody inserts into a reader - and in that
    reading the item makes no sense on a server, because there is nobody
    there to insert anything. The mechanism is certificate-based, though,
    so in practice this concerns a certificate in a store, not necessarily
    plastic. I do not want to pretend that this solves the problem: a
    certificate in the same machine's store is convenient and at the same
    time weaker than an object kept separately.

    What an attacker gains while the item goes unmet: access to the data
    volume resting on an unlocking method nobody will be able to revoke
    when the need arises.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać
    sprzeczność, która tu występuje, bo jest mniejszą wersją tej samej
    sprzeczności co przy uwierzytelnianiu przy starcie.

    Zwykły układ na serwerze jest taki, że wolumeny danych odblokowują się
    automatycznie przy starcie maszyny, żeby usługi mogły ruszyć bez
    człowieka. Wymaganie karty i automatyczne odblokowywanie wykluczają
    się: jeżeli wolumen ma ruszyć sam, to nie czeka na certyfikat
    użytkownika, a jeżeli czeka, to usługi nie wstaną, dopóki ktoś się nie
    zaloguje. Nie jest to problem do obejścia sprytną konfiguracją —
    to są dwa różne postanowienia o tym, jak ta maszyna ma działać.

    Dlatego na serwerze udostępniającym dane w sposób ciągły właściwym
    wynikiem pracy z tą regułą bywa zapisany wyjątek z uzasadnieniem:
    wolumen ma się odblokowywać bez udziału człowieka i tak ma być.
    Tam, gdzie wolumen z danymi jest udostępniany w sesji administratora —
    nośnik z materiałem dochodzeniowym, wolumen z kopiami podłączany na
    czas odtworzenia — punkt jest na miejscu i wtedy warto go wdrożyć.

    Objaw przy złym wdrożeniu jest ten sam co przy odzyskiwaniu wolumenów
    danych i równie mylący: maszyna wstaje, a usługa nie widzi swoich
    plików.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs a planned rollout" and want to name the
    contradiction present here, because it is a smaller version of the same
    contradiction as at startup authentication.

    The usual arrangement on a server is that data volumes unlock
    automatically at machine start so that services can come up without a
    person. Requiring a card and automatic unlocking exclude each other: if
    the volume is to come up by itself it does not wait for a user's
    certificate, and if it does wait then services will not start until
    somebody signs in. This is not a problem to be worked around with
    clever configuration - these are two different decisions about how this
    machine is to work.

    So on a server serving data continuously, the right result of working
    with this rule is often a recorded exception with a justification: the
    volume is to unlock without a person and is meant to. Where a data
    volume is made available within an administrator's session - a medium
    holding investigation material, a backup volume attached for the
    duration of a restore - the item is appropriate and then worth rolling
    out.

    The symptom of a bad rollout is the same as at data volume recovery and
    just as misleading: the machine comes up and the service cannot see its
    files.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - accounts-and-passwords
    - drivers-and-devices
  what_breaks:
    pl:
      - Wymaganie karty wyklucza się z automatycznym odblokowywaniem wolumenu przy starcie maszyny
      - Usługi korzystające z tego wolumenu nie wstaną, dopóki ktoś się nie zaloguje i nie odblokuje go
      - Objaw jest mylący — maszyna wstaje normalnie, a usługa nie widzi swoich plików
      - Certyfikat trzymany w magazynie tej samej maszyny jest wygodny i jednocześnie słabszy niż przedmiot trzymany osobno
    en:
      - Requiring a card excludes automatic unlocking of the volume at machine start
      - Services using that volume will not start until somebody signs in and unlocks it
      - The symptom misleads - the machine comes up normally and the service cannot see its files
      - A certificate kept in the same machine's store is convenient and at the same time weaker than an object kept separately
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wolumen z danymi ma się odblokowywać automatycznie przy starcie, żeby usługi ruszyły bez człowieka
      - Na maszynie nie ma certyfikatu przeznaczonego do odblokowywania wolumenów ani sposobu jego unieważnienia
      - Wdrożenie miałoby polegać na trzymaniu certyfikatu w magazynie tej samej maszyny bez innego zabezpieczenia
    en:
      - The data volume is to unlock automatically at start so that services come up without a person
      - The machine has no certificate intended for unlocking volumes, nor any way of revoking one
      - The rollout would amount to keeping the certificate in the same machine's store with no other protection
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item. The first admits the card, the second makes
      # it required - admitted without required leaves the choice open and is
      # reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $allow = $item.'FDVAllowUserCert'
        $enforce = $item.'FDVEnforceUserCert'
        if ($null -eq $allow -or $null -eq $enforce) { 'MISSING' }
        elseif ([int]$allow -ne 1) { 'NOT_ALLOWED' }
        elseif ([int]$enforce -ne 1) { 'ALLOWED_NOT_REQUIRED' }
        else { 'REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path            = $path
      allow           = $item.'FDVAllowUserCert'
      allow_existed   = ($null -ne $item.'FDVAllowUserCert')
      enforce         = $item.'FDVEnforceUserCert'
      enforce_existed = ($null -ne $item.'FDVEnforceUserCert')
      key_existed     = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This and automatic unlocking at machine start exclude each other. On a
    # server serving data continuously the right answer is often a recorded
    # exception instead of this change; the bad rollout shows up as a service
    # that cannot see its files on a machine that came up normally.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'FDVAllowUserCert' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'FDVEnforceUserCert' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'FDVAllowUserCert' -ErrorAction SilentlyContinue
    }
    if ($b.enforce_existed) {
      Set-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -Value $b.enforce -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'FDVEnforceUserCert' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Ta sama myśl co przy regule o hasłach, zapisana od drugiej strony: tam
    zabieramy sekret, którego nie da się cofnąć, tu wskazujemy sekret,
    który da się unieważnić. Obie opisują jedno postanowienie i stosuje się
    je razem.

    Zastrzeżenie serwerowe: nazwa mówi o karcie wkładanej do czytnika,
    a przy serwerze nikt nie stoi. Mechanizm jest certyfikatowy, więc
    w praktyce chodzi o certyfikat w magazynie — ale certyfikat w magazynie
    tej samej maszyny jest wygodny i jednocześnie słabszy niż przedmiot
    trzymany osobno.

    Sprzeczność do rozstrzygnięcia przed wdrożeniem: wymaganie karty
    wyklucza się z automatycznym odblokowywaniem wolumenu przy starcie.
    Na serwerze udostępniającym dane w sposób ciągły właściwym wynikiem
    bywa zapisany wyjątek.
  en: |
    The same thought as at the rule about passwords, written from the other
    side: there we take away a secret that cannot be withdrawn, here we
    point at a secret that can be revoked. Both describe one decision and
    are applied together.

    The server caveat: the name speaks of a card inserted into a reader,
    and nobody stands at a server. The mechanism is certificate-based, so
    in practice this concerns a certificate in a store - but a certificate
    in the same machine's store is convenient and at the same time weaker
    than an object kept separately.

    A contradiction to settle before rollout: requiring a card excludes
    automatic unlocking of the volume at start. On a server serving data
    continuously the right result is often a recorded exception.
