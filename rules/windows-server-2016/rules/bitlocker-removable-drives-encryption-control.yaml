id: win2016-bitlocker-removable-drives-encryption-control

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zakładanie ochrony nośnika wymiennego dozwolone, zdejmowanie zabronione
    en: Setting up protection of removable media allowed, removing it forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt rozdziela dwie czynności, które system domyślnie traktuje razem:
    założenie ochrony na nośniku wymiennym i jej zdjęcie. Pierwsza ma
    zostać dozwolona, druga zabroniona.

    Rozdzielenie to jest całą treścią reguły i warto powiedzieć, po co się
    je robi. Nośnik wymienny szyfruje zwykle ten, kto go używa — nie
    administrator, tylko człowiek, który za chwilę zabierze go ze sobą.
    Zabranianie mu szyfrowania byłoby więc zabranianiem rzeczy, o którą
    chodzi.

    Zdejmowanie ochrony jest natomiast czynnością o odwrotnym znaku.
    Nośnik, z którego zdjęto szyfrowanie, wygląda dokładnie tak samo jak
    przed zdjęciem i nadal nosi te same pliki. Różnicę widać dopiero
    wtedy, gdy ktoś go znajdzie.

    Zdjęcie ochrony bywa przy tym czynnością niezamierzoną. Robi się je,
    żeby nośnik dał się odczytać w starszym urządzeniu, na kasie, w drukarce,
    w aparacie — i zostawia się tak, bo odczyt działa.

    Punkt niesie trzy wartości, bo sama zasada, zgoda na zakładanie
    i zakaz zdejmowania są w systemie trzema osobnymi ustawieniami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośniki,
    z których ochronę zdjęto dla wygody i nie założono z powrotem.
  en: |
    The item parts two acts the system by default treats together: setting up protection on a
    removable medium and taking it off. The first is to stay allowed, the second forbidden.

    That parting is the whole substance of the rule, and it is worth saying what it is done for. A
    removable medium is as a rule encrypted by whoever uses it - not an administrator but the
    person who will in a moment carry it off. Forbidding them to encrypt would therefore be
    forbidding the very thing at stake.

    Taking protection off is, on the other hand, an act of the opposite sign. A medium the
    encryption has been taken off looks exactly as it did before and still carries the same files.
    The difference shows only once somebody finds it.

    Taking protection off is besides at times an unmeant act. It is done so that the medium can be
    read in an older device, at a till, in a printer, in a camera - and left so, the reading
    working.

    The item carries three values, the policy itself, leave to set up and the ban on taking off
    being in the system three separate settings.

    What an attacker gains while the item goes unmet: media whose protection was taken off for
    convenience and not set up again.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy urządzeń, do których
    te nośniki się wkłada.

    Na serwerze nośniki wymienne służą zwykle dwóm rzeczom: przenoszeniu
    kopii zapasowych i przenoszeniu plików instalacyjnych. Obie są czynnościami
    między maszynami z systemem bieżącym i zmiana ich nie dotyczy.

    Rzecz do sprawdzenia dotyczy wszystkiego innego. Nośnik, który jeździ do
    urządzenia nieznającego szyfrowania — sterownika maszyny, rejestratora,
    starszego urządzenia pomiarowego — wymaga zdjęcia ochrony, a po zmianie
    zdjąć jej nie będzie się dało bez uprawnień administracyjnych.

    Objaw jest łagodny i czytelny: system odmawia zdjęcia ochrony
    i mówi o zasadzie. Nie ma tu utraty danych ani zatrzymania usługi;
    jest czynność, której nie da się wykonać z tego konta.

    Zmiana nie dotyczy nośników, z których ochronę już zdjęto. Nośnik
    niezaszyfrowany pozostaje niezaszyfrowany i nic go do szyfrowania nie
    zmusza — tym zajmuje się osobna reguła o zakazie zapisu.

    Czego to nie psuje: zakładania ochrony, odczytu nośników zaszyfrowanych,
    zapisu na nich, pracy systemu, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns the devices those media are put into.

    On a server removable media serve as a rule two things: the carrying of backup copies and the
    carrying of installation files. Both are acts between machines with a current system and the
    change does not touch them.

    The thing to be reviewed concerns everything else. A medium that travels to a device knowing
    nothing of encryption - a machine's controller, a recorder, an older measuring device - calls
    for the protection to be taken off, and after the change taking it off will not be possible
    without administrative rights.

    The symptom is mild and legible: the system refuses to take the protection off and speaks of a
    policy. There is here no loss of data and no stopping of a service; there is an act that cannot
    be carried out from that account.

    The change does not concern media whose protection has already been taken off. An unencrypted
    medium stays unencrypted and nothing forces it to be encrypted - a separate rule about the ban
    on writing sees to that.

    What this does not break: the setting up of protection, the reading of encrypted media, writing
    to them, the system's working, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nośnik wożony do urządzenia nieznającego szyfrowania nie da się już odbezpieczyć z konta bez uprawnień administracyjnych
      - Objaw jest odmową z komunikatem o zasadzie, bez utraty danych i bez zatrzymania jakiejkolwiek usługi
      - Nośniki, z których ochronę zdjęto wcześniej, pozostają niezaszyfrowane i ta reguła ich nie dotyczy
      - Zakładanie ochrony, odczyt nośników zaszyfrowanych i zapis na nich pozostają bez zmian
    en:
      - A medium carried to a device knowing nothing of encryption can no longer be unprotected from an account without administrative rights
      - The symptom is a refusal with a message about a policy, with no loss of data and no stopping of any service
      - Media whose protection was taken off earlier stay unencrypted and this rule does not touch them
      - The setting up of protection, the reading of encrypted media and writing to them stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nośniki wożone są do urządzeń nieznających szyfrowania, a zdejmowanie ochrony należy do codziennej obsługi
      - Nie ustalono, kto ma zdejmować ochronę po zmianie, gdy nośnik musi trafić do starszego urządzenia
    en:
      - Media are carried to devices knowing nothing of encryption and taking the protection off belongs to everyday attendance
      - It has not been settled who is to take the protection off after the change, when a medium has to reach an older device
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item: the policy itself, permission to set up
      # protection and permission to take it off. Anything other than
      # "may set up, may not remove" is reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $configure = $item.'RDVConfigureBDE'
        $allow = $item.'RDVAllowBDE'
        $disable = $item.'RDVDisableBDE'
        if ($null -eq $configure -or $null -eq $allow -or $null -eq $disable) { 'MISSING' }
        elseif ([int]$configure -ne 1) { 'NOT_CONFIGURED' }
        elseif ([int]$allow -ne 1) { 'SETUP_BLOCKED' }
        elseif ([int]$disable -ne 0) { 'REMOVAL_ALLOWED' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      configure         = $item.'RDVConfigureBDE'
      configure_existed = ($null -ne $item.'RDVConfigureBDE')
      allow             = $item.'RDVAllowBDE'
      allow_existed     = ($null -ne $item.'RDVAllowBDE')
      disable           = $item.'RDVDisableBDE'
      disable_existed   = ($null -ne $item.'RDVDisableBDE')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Three values, one decision. Setting up protection stays open, taking it
    # off is shut - the order matters, because the reverse leaves media that
    # nobody can encrypt and everybody can strip.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVConfigureBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVAllowBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVDisableBDE' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.configure_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -Value $b.configure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -ErrorAction SilentlyContinue
    }
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -ErrorAction SilentlyContinue
    }
    if ($b.disable_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -Value $b.disable -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Punkt otwiera blok o nośnikach wymiennych. Różnica wobec bloku
    poprzedniego jest zasadnicza i warto ją nazwać: dysk stały chroni się
    przed kimś, kto przyjdzie po maszynę; nośnik wymienny chroni się przed
    własnym zgubieniem.

    Z tej różnicy wynika, dlaczego ten blok wygląda inaczej. Przy dysku
    stałym pytanie brzmiało, jak trudno go otworzyć. Tutaj brzmi, co się
    stanie, gdy zostanie w taksówce — bo to jest zdarzenie, które naprawdę
    zachodzi, i zachodzi bez udziału nikogo, kto by czegokolwiek chciał.

    Rozdzielenie zakładania od zdejmowania jest w tej regule rzeczą, którą
    łatwo przeoczyć przy czytaniu nazwy ustawienia. Nazwa mówi o sterowaniu
    szyfrowaniem, a decyzja dotyczy wyłącznie kierunku: w stronę ochrony
    wolno, od ochrony nie wolno. Opis powinien to stawiać na pierwszym
    miejscu.

    Stany pośrednie zgłaszane przez audyt odpowiadają dwóm różnym
    pomyłkom. Zablokowane zakładanie znaczy, że ktoś potraktował szyfrowanie
    nośników jako zagrożenie; dozwolone zdejmowanie znaczy, że ktoś ustawił
    zasadę i nie dokończył. Pierwsza wymaga rozmowy, druga tylko poprawki.
  en: |
    The item opens the block about removable media. The difference from the block before it is a
    cardinal one and worth naming: a fixed drive is guarded against somebody who will come for the
    machine; a removable medium is guarded against its own loss.

    From that difference follows why this block looks otherwise. At the fixed drive the question
    was how hard it is to open. Here it is what will happen when it is left in a taxi - that being
    an event that really occurs, and occurs without anybody who wanted anything taking part.

    The parting of setting up from taking off is in this rule a thing easily missed when reading
    the setting's name. The name speaks of controlling encryption, and the decision concerns solely
    the direction: towards protection is allowed, away from it is not. The description should put
    that first.

    The middle states the audit reports answer two different mistakes. A blocked setting up means
    somebody took the encryption of media for a threat; an allowed taking off means somebody set a
    policy and did not finish. The first calls for a conversation, the second only for a
    correction.
