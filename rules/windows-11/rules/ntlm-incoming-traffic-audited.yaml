id: win11-ntlm-incoming-traffic-audited

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Przychodzący ruch starszego mechanizmu uwierzytelniania rejestrowany
    en: Incoming traffic of the older authentication mechanism recorded
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm uwierzytelniania sieciowego jest w tym systemie wciąż
    obecny i wciąż używany, choć od dawna ma następcę. Jest słabszy w sposób
    nieusuwalny: poświadczenia przesyłane tą drogą dają się przekazać dalej
    i użyć wobec innej maszyny, a przechwycone — złamać poza siecią, bez limitu
    prób.

    Wyłączenie go byłoby właściwym rozwiązaniem i dla wielu maszyn jest
    osiągalne. Nie da się jednak tego zrobić na ślepo: w każdej sieci zostaje
    garść miejsc, które bez niego przestaną działać — starsze urządzenia,
    połączenia po adresie zamiast po nazwie, aplikacje z własną obsługą
    logowania. Wyłączenie bez rozpoznania kończy się cofnięciem zmiany po
    pierwszym zgłoszeniu.

    Ten punkt jest krokiem poprzedzającym. Nie blokuje niczego — każe zapisywać,
    kto i skąd uwierzytelnia się do tej maszyny tą starszą drogą. Po kilku
    tygodniach taki zapis daje listę rzeczywistych zależności, a z nią decyzję
    opartą na danych, a nie na przypuszczeniach.

    Wartość samego zapisu jest przy tym niezależna od dalszych kroków:
    uwierzytelnienie starszą drogą z nieoczekiwanego miejsca jest jednym
    z czytelniejszych objawów ruchu bocznego w sieci.
  en: |
    The older network authentication mechanism is still present in this system and
    still used, though it has long had a successor. It is weaker in a way that cannot
    be mended: credentials sent this way can be passed on and used against another
    machine, and once captured, cracked outside the network with no limit on attempts.

    Switching it off would be the right answer and is within reach for many machines.
    It cannot be done blindly, though: on every network a handful of places remain
    that will stop working without it - older devices, connections by address rather
    than by name, applications with sign-in handling of their own. Switching it off
    without reconnaissance ends in the change being undone after the first report.

    This item is the step that comes first. It blocks nothing - it has it recorded who
    authenticates to this machine by that older route, and from where. After a few
    weeks such a record gives a list of the real dependencies, and with it a decision
    resting on data rather than on guesses.

    The worth of the record itself does not depend on the later steps: authentication
    by the older route from an unexpected place is one of the plainer signs of lateral
    movement on a network.

disruption_description:
  pl: |
    Nic nie przestaje działać. Punkt niczego nie blokuje i niczego nie odrzuca
    — zapisuje zdarzenia obok ruchu, który i tak przechodzi.

    Dlatego trafia do klasy bez uciążliwości: nie ma restartu, nie ma okna
    serwisowego, żadne połączenie nie zmienia zachowania, a użytkownik nie
    zauważy niczego w żadnym momencie.

    Jedynym kosztem jest objętość zapisu. Na stanowisku zdarzeń jest niewiele;
    na maszynie, do której sięga przez sieć wielu użytkowników albo wiele
    urządzeń, zapis rośnie zauważalnie i trafia do dziennika operacyjnego
    osobnego od dziennika zabezpieczeń. Warto to uwzględnić tam, gdzie zdarzenia
    są zbierane i rozliczane objętościowo.

    Drugi skutek, także niegroźny, dotyczy narzędzi zbierających zdarzenia.
    Pojawi się nowe źródło, którego reguły alarmowe dotąd nie widziały — i to
    jest właśnie cel punktu, a nie jego efekt uboczny.

    Nie ma restartu.
  en: |
    Nothing stops working. The item blocks nothing and refuses nothing - it records
    events alongside traffic that passes anyway.

    That is why it falls into the no-disruption class: no restart, no maintenance
    window, no connection changing behaviour, and nothing the user notices at any
    point.

    The only cost is the volume of the record. At a station there are few events; on a
    machine many users or many devices reach over the network, the record grows
    noticeably and lands in an operational log separate from the security log. That is
    worth bearing in mind where events are gathered and charged by volume.

    The second effect, also harmless, touches tools gathering events. A new source
    will appear that the alert rules have not seen before - and that is the item's
    purpose rather than its side effect.

    There is no restart.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - legacy-authentication
  what_breaks:
    pl:
      - Objętość zapisu w dzienniku operacyjnym rośnie proporcjonalnie do liczby połączeń
      - W systemie zbierania zdarzeń pojawia się nowe źródło, którego reguły dotąd nie znały
      - Żadne połączenie nie jest blokowane ani odrzucane
    en:
      - The volume of the operational log grows in proportion to the number of connections
      - A new source appears in the event gathering system that its rules have not known
      - No connection is blocked, refused or slowed down in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zdarzenia z maszyny są rozliczane objętościowo, a budżet jest już wyczerpany
    en:
      - Events from the machine are charged by volume and the budget is already spent
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero records nothing, one records
      # accounts outside the domain, two records every account.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AuditReceivingNTLMTraffic'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AuditReceivingNTLMTraffic'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0' `
      -Name 'AuditReceivingNTLMTraffic' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-audit-incoming-ntlm-traffic

notes:
  pl: |
    Zdarzenia trafiają do dziennika operacyjnego mechanizmu uwierzytelniania,
    a nie do dziennika zabezpieczeń. Szukanie ich w tym drugim jest najczęstszą
    przyczyną wniosku, że punkt „nie działa".

    Punkt jest rozpoznaniem, a nie zabezpieczeniem, i tak należy go czytać.
    Jego wdrożenie samo w sobie nie zmniejsza ryzyka — zmniejsza je dopiero
    decyzja podjęta na podstawie zebranego zapisu. Reguła, która zbiera dane
    i nigdy nie zostaje przejrzana, jest kosztem bez zysku.

    Wartość jeden zawęża zapis do kont spoza domeny i bywa proponowana jako
    oszczędniejsza. Nie jest zgodnością: ruch boczny wewnątrz domeny to
    dokładnie ten przypadek, który chce się zobaczyć.

    Gałąź mechanizmu uwierzytelniania jest wspólna z ustawieniami minimalnego
    poziomu zabezpieczeń sesji, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The events land in the authentication mechanism's operational log rather than in
    the security log. Looking for them in the latter is the commonest cause of
    concluding that the item "does not work".

    The item is reconnaissance rather than a safeguard, and should be read that way.
    Applying it does not lower the risk on its own - what lowers it is the decision
    taken on the strength of the record gathered. A rule that gathers data and is
    never looked through is a cost without a gain.

    The value one narrows the record to accounts outside the domain and is sometimes
    proposed as the thriftier choice. It is not compliance: lateral movement inside
    the domain is exactly the case one wants to see.

    The authentication mechanism's key is shared with the minimum session security
    settings, so rollback removes the entry alone.
