id: fedora44-tmp-separate-partition

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.2.1.1
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /tmp
  title:
    pl: Katalog /tmp jest osobną partycją
    en: Ensure /tmp is a separate partition
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Do katalogu /tmp może pisać każdy użytkownik i każdy program. Jeśli leży na
    tym samym systemie plików co reszta systemu, jeden proces, który zapisze tam
    za dużo, zabiera miejsce usługom, dziennikom i aktualizacjom, a te zaczynają
    kończyć się błędami. Osobne montowanie ogranicza taki wyciek do samego /tmp.

    Osobne montowanie jest też warunkiem kolejnych punktów: opcje nodev, nosuid
    i noexec ustawia się dla punktu montowania, więc bez niego nie ma ich gdzie
    zapisać.

    Fedora montuje /tmp jako tmpfs w pamięci od wielu wydań, przez jednostkę
    tmp.mount dostarczaną z systemd. Punkt jest więc spełniony na świeżej
    instalacji, a niespełniony zwykle wtedy, gdy ktoś celowo zamaskował tę
    jednostkę.
  en: |
    Every user and every program can write to /tmp. If it sits on the same file
    system as the rest of the system, one process that writes too much there
    takes space away from services, logs and updates, and they start failing.
    A separate mount confines such a leak to /tmp itself.

    A separate mount is also the condition for the following items: the nodev,
    nosuid and noexec options are set for a mount point, so without one there is
    nowhere to put them.

    Fedora has mounted /tmp as an in-memory tmpfs for many releases, through the
    tmp.mount unit shipped with systemd. The item is therefore met on a fresh
    installation, and usually fails when somebody deliberately masked that unit.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo jeśli jednostka tmp.mount jest zamaskowana, ktoś
    zrobił to celowo, najczęściej na maszynie z małą ilością pamięci albo dla
    programu, który trzyma w /tmp duże pliki.

    Po zmianie /tmp jest w pamięci i ma rozmiar do połowy RAM. Pliki w nim
    znikają przy każdym restarcie, a zapis dużego pliku kończy się brakiem
    miejsca szybciej niż na dysku. Zmiana działa dopiero po restarcie, bo
    zamontowanie tmpfs na działającym /tmp zasłoniłoby pliki i gniazda, z
    których programy właśnie korzystają.
  en: |
    The class needs review because if the tmp.mount unit is masked, somebody did
    it on purpose, most often on a machine with little memory or for a program
    that keeps large files in /tmp.

    After the change /tmp lives in memory and is limited to half of RAM. Files in
    it disappear at every restart, and writing a large file runs out of space
    sooner than on disk. The change only takes effect after a restart, because
    mounting a tmpfs over a live /tmp would hide files and sockets that programs
    are using right now.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - legacy-applications
  what_breaks:
    pl:
      - Pliki zostawione w /tmp, np. pobrany obraz ISO albo rozpakowane archiwum, znikają przy następnym restarcie stacji
      - Zapis w /tmp pliku większego niż połowa pamięci RAM, np. obrazu maszyny wirtualnej, kończy się błędem braku miejsca
    en:
      - Files left in /tmp, such as a downloaded ISO image or an unpacked archive, disappear at the next restart of the workstation
      - Writing a file larger than half of RAM to /tmp, such as a virtual machine image, fails with an out of space error
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna ma mało pamięci, a jednostkę tmp.mount zamaskowano właśnie po to, by /tmp nie zajmował RAM
    en:
      - The machine has little memory and the tmp.mount unit was masked precisely to keep /tmp out of RAM
  reversibility: after-restart

audit:
  shell: bash
  test_command: |
    t=/tmp
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if findmnt -kn --mountpoint "$t" >/dev/null 2>&1; then echo SEPARATE; else echo NOT_SEPARATE; fi
  expected: '^SEPARATE$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      mkdir -p "$(dirname '{{backup_file}}')"
      state=$(systemctl is-enabled tmp.mount 2>/dev/null || true)
      echo "state=$state" > '{{backup_file}}'
      echo "Saved previous state to {{backup_file}}"
    )

  change_command: |
    (
      set -e
      state=$(systemctl is-enabled tmp.mount 2>/dev/null || true)
      if [ "$state" != masked ]; then
        echo "tmp.mount is not masked (state: ${state:-unknown}); check /etc/fstab and /etc/systemd/system for what keeps /tmp off its own mount" >&2
        exit 1
      fi
      systemctl unmask tmp.mount
      echo "Unmasked tmp.mount; /tmp becomes a separate tmpfs at the next start"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      state=$(sed -n 's/^state=//p' "$b" | head -n 1)
      case "$state" in
        masked) systemctl mask tmp.mount; echo "Masked tmp.mount again; takes effect at the next start" ;;
        "") echo "Backup file is damaged: $b" >&2; exit 1 ;;
        *) echo "tmp.mount was not masked before the change; nothing to restore" ;;
      esac
    )

privileges: root
runnable: true

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/tmp.mount.html
  - https://docs.kernel.org/filesystems/tmpfs.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.mount.html

notes:
  pl: |
    Sprawdzenie uznaje punkt za spełniony, gdy /tmp jest osobnym punktem
    montowania, bez względu na to, czy jest to tmpfs, osobna partycja czy
    podwolumin btrfs.

    Naprawa obsługuje tylko przypadek typowy dla Fedory, czyli zamaskowaną
    jednostkę tmp.mount: zdejmuje maskę, a /tmp staje się osobnym tmpfs przy
    najbliższym starcie. Jeśli jednostka nie jest zamaskowana, a /tmp mimo to
    nie jest osobno montowany, naprawa kończy się błędem i niczego nie zmienia,
    bo przyczyna leży gdzie indziej, np. we wpisie w /etc/fstab albo w jednostce
    w /etc/systemd/system, i wymaga decyzji administratora.
  en: |
    The check considers the item met when /tmp is a separate mount point,
    whether it is a tmpfs, a separate partition or a btrfs subvolume.

    The remediation handles only the case typical for Fedora, a masked tmp.mount
    unit: it removes the mask, and /tmp becomes a separate tmpfs at the next
    start. If the unit is not masked and /tmp is still not mounted separately,
    the remediation fails and changes nothing, because the cause is elsewhere,
    for example in an entry in /etc/fstab or in a unit in /etc/systemd/system,
    and needs an administrator's decision.
