id: win2025-firewall-notifications-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Settings
  title:
    pl: Powiadomienia zapory wyłączone we wszystkich profilach
    en: Firewall notifications disabled on all profiles
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza okno, w którym zapora pyta zalogowaną osobę, czy
    wpuścić do sieci program zaczynający właśnie nasłuchiwać.

    Pytanie to jest sensowne na stanowisku roboczym, gdzie przy maszynie
    siedzi jej właściciel. Na serwerze sensu nie ma żadnego i ma jedną
    właściwość szczególnie kłopotliwą: okno pojawia się w sesji tej osoby,
    która akurat jest zalogowana, a nie tej, która odpowiada za
    konfigurację zapory. Bywa więc, że reguła przepuszczająca powstaje
    z kliknięcia kogoś, kto wszedł na serwer w zupełnie innej sprawie.

    Wartością punktu nie jest zamknięcie okienka, tylko to, że wykaz
    programów dopuszczonych do sieci przestaje rosnąć bez decyzji. Reguła
    dalej może powstać — ale powstaje tam, gdzie ktoś ją rozważy, a nie
    w odruchu przy zamykaniu komunikatu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę do
    otwarcia portu cudzym kliknięciem. Program uruchomiony w sesji
    użytkownika pokazuje okno nieodróżnialne od systemowego, a odpowiedź
    „zezwól" jest odpowiedzią typową, bo pada w środku innej pracy.

    Jest to ograniczenie pola manewru, nie zamknięcie drogi ataku,
    i dlatego kategoria jest niska.
  en: |
    The setting switches off the window in which the firewall asks the signed-in person
    whether to let onto the network a program that is just starting to listen.

    That question makes sense at a working station where the machine's owner sits at it. On
    a server it makes none at all, and it has one property especially troublesome: the
    window appears in the session of whoever happens to be signed in rather than of whoever
    answers for the firewall's configuration. So it happens that a letting-through rule
    arises from a click by somebody who came onto the server on an altogether different
    errand.

    The item's worth is not in closing the box but in the list of programs let onto the
    network no longer growing with no decision behind it. A rule may still arise - but it
    arises where somebody weighs it rather than by reflex at the closing of a message.

    What an attacker gains while the item goes unmet: a road to opening a port by somebody
    else's click. A program started in a user's session shows a window indistinguishable
    from the system's, and "allow" is the typical answer, since it comes in the middle of
    other work.

    It is a narrowing of room for manoeuvre rather than the closing of a road of attack, and
    hence the category is low.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    Nic nie zostaje dodatkowo zablokowane. Blokada następuje tak samo jak
    wcześniej — zmienia się wyłącznie to, czy ktoś zobaczy o niej
    komunikat. Program, który działał, działa dalej.

    Na stanowisku roboczym ten sam punkt oceniono wyżej, bo tam brak
    komunikatu zostawia użytkownika bez żadnej wskazówki. Na serwerze
    argument ten nie ma zastosowania: przy serwerze nikt nie pracuje
    na co dzień, konfiguracją zapory zajmuje się administrator, a wykaz
    ruchu odrzuconego odczytuje się z dziennika zapory, nie z okienka.

    Jedyny skutek wart odnotowania dotyczy chwili wdrażania nowej
    aplikacji: po zmianie jej pierwsze uruchomienie nie zapyta o nic
    i nie zadziała z sieci, a przyczyna nie pojawi się na ekranie.
    Dziennik zapory ją pokaże, o ile rejestrowanie jest włączone.
  en: |
    The change has no known side effects and takes no break.

    Nothing extra is blocked. The blocking happens just as before - what changes is only
    whether anybody sees a message about it. A program that worked goes on working.

    At a working station the same item is rated higher, because there the missing message
    leaves the user with no hint at all. On a server that argument does not apply: nobody
    works at a server day to day, the firewall's configuration is the administrator's
    business, and the list of refused traffic is read off the firewall's log rather than off
    a box.

    The one effect worth noting concerns the moment a new application is rolled out: after
    the change its first start will ask nothing and will not work from the network, and the
    cause will not appear on screen. The firewall's log will show it, so far as logging is
    switched on.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Brak znanych regresji — blokada następuje tak samo, znika tylko komunikat o niej
      - Nie da się już dopuścić programu do sieci jednym kliknięciem w sesji zalogowanej osoby
      - Pierwsze uruchomienie nowej aplikacji nie zapyta o nic i nie zadziała z sieci
      - Przyczynę odczytuje się wtedy z dziennika zapory, o ile rejestrowanie jest włączone
    en:
      - No known regressions - the blocking happens just the same, only the message about it goes
      - A program can no longer be let onto the network with one click in the signed-in person's session
      - A new application's first start will ask nothing and will not work from the network
      - The cause is then read off the firewall's log, so far as logging is switched on
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer udostępnia sesje pulpitu zdalnego i to użytkownicy wdrażają na nim własne narzędzia sieciowe
    en:
      - The server puts up remote desktop sessions and it is the users who roll out network tools of their own on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        $noisy = @($profiles | Where-Object { $_.NotifyOnListen -ne 'False' })
        if ($noisy.Count -eq 0) { 'ALL_SILENT' } else { 'NOTIFIES_IN_' + ($noisy.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ALL_SILENT
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, NotifyOnListen |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -NotifyOnListen False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -NotifyOnListen $p.NotifyOnListen
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Klasa uciążliwości jest tu niższa niż w paczce dla stanowiska
    roboczego i jest to różnica świadoma, nie przeoczenie. Cały koszt tej
    zmiany bierze się z braku komunikatu dla osoby pracującej przy
    maszynie — na serwerze takiej osoby zwykle nie ma.

    Wyjątkiem jest serwer udostępniający sesje pulpitu zdalnego. Tam
    argument ze stanowiska roboczego wraca w całości i punkt warto
    przeczytać przed zastosowaniem.

    Punkt nie zmienia tego, co zapora przepuszcza. Reguły już istniejące
    działają dalej, a nowe da się dopisać tak samo jak wcześniej — zmienia
    się wyłącznie to, kto i w jakim trybie je dopisuje.
  en: |
    The disruption class is lower here than in the pack for a working station, and that is a
    knowing difference rather than an oversight. The whole cost of this change comes from
    the missing message for the person working at the machine - on a server there is usually
    no such person.

    The exception is a server putting up remote desktop sessions. There the argument from
    the working station returns whole and the item is worth reading before applying.

    The item does not change what the firewall lets through. Rules already there go on
    working and new ones can be written in just as before - what changes is only who writes
    them in and in what manner.
