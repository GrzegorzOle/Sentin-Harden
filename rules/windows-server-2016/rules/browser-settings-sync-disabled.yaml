id: win2016-browser-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Przenoszenie ustawień przeglądarki do chmury zablokowane
    en: The carrying of browser settings to the cloud blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje przenoszenie ustawień przeglądarki do chmury
    i między maszynami.

    Punkt jest bliźniakiem poprzedniego i dotyczy tej samej drogi, ale
    innego zbioru danych — i zbiór ten bywa gorszy. Ustawienia przeglądarki
    obejmują zapamiętane hasła do stron, historię odwiedzin, otwarte karty
    i zapisane adresy.

    Na serwerze przeglądarka bywa używana do jednej rzeczy: do zalogowania
    się do konsoli zarządzania czymkolwiek. Znaczy to, że hasła zapamiętane
    w przeglądarce na serwerze są hasłami do paneli administracyjnych,
    a historia odwiedzin jest spisem tego, czym ta organizacja zarządza
    i pod jakimi adresami.

    Wyniesienie tego zbioru do magazynu poza organizacją jest czymś
    zupełnie innym niż wyniesienie układu pulpitu. Stąd kategoria równa
    punktowi poprzedniemu, a nie niższa.

    Punkt wymaga dwóch wartości, z tego samego powodu co poprzedni.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę,
    którą hasła do paneli zarządzania i spis adresów tych paneli
    opuszczają maszynę.
  en: |
    The setting blocks the carrying of the browser's settings to the cloud and between machines.

    The item is the twin of the one before and concerns the same road but another set of data - and that
    set is at times the worse. A browser's settings take in remembered passwords to sites, the history of
    visits, open tabs and saved addresses.

    On a server a browser is at times used for one thing: logging on to a management console of something.
    That means the passwords remembered in a browser on a server are the passwords to administrative
    panels, and the history of visits is a register of what this organisation manages and at what
    addresses.

    Carrying that set out to a store outside the organisation is an altogether different thing from
    carrying out a desktop's layout. Hence a category equal to the item before and not lower.

    The item calls for two values, for the same reason as the one before.

    What an attacker gains while the item goes unmet: a road by which the passwords to management panels
    and the register of those panels' addresses leave the machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rzecz do ustalenia jest ta sama co przy
    punkcie poprzednim: czy ktokolwiek loguje się na tę maszynę profilem
    przenoszonym między urządzeniami.

    Jeżeli tak, po zmianie hasła zapamiętane w przeglądarce, zapisane
    adresy i historia przestaną się przenosić. Osoba, która polegała na
    tym, że jej zakładki pojawiają się na każdej maszynie, będzie musiała
    przenieść je raz sama.

    Rzecz warta wymienienia dotyczy przeglądarek innych niż wbudowana.
    Ustawienie dotyczy mechanizmu systemowego; przeglądarki mające własne
    konto i własne przenoszenie ustawień działają dalej i wymagają osobnej
    decyzji. Wykonanie tego punktu nie domyka tamtej drogi.

    Objaw jest natychmiastowy i czytelny.

    Czego to nie psuje: pracy przeglądarki, logowania do stron,
    zapamiętywania haseł na tej maszynie, aplikacji, usług, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the thing to be established is the same as at the item before: whether
    anybody logs on to this machine by a profile carried between devices.

    If so, after the change the passwords remembered in the browser, the saved addresses and the history
    will cease to be carried. A person who relied on their bookmarks appearing on every machine will have to
    carry them over once themselves.

    A thing worth naming concerns browsers other than the built-in one. The setting concerns the system's
    mechanism; browsers having an account of their own and a carrying of settings of their own work on and
    call for a separate decision. Carrying this item out does not shut that road.

    The symptom is immediate and legible.

    What this does not break: the browser's working, logging on to sites, the remembering of passwords on
    this machine, applications, services, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Hasła zapamiętane w przeglądarce, zapisane adresy i historia przestają się przenosić między maszynami
      - Osoba polegająca na tym, że jej zakładki pojawiają się wszędzie, musi przenieść je raz sama
      - Przeglądarki mające własne konto i własne przenoszenie ustawień działają dalej i wymagają osobnej decyzji
      - Praca przeglądarki, logowanie do stron i zapamiętywanie haseł na tej maszynie pozostają bez zmian
      - Aplikacje, usługi i sieć pozostają bez zmian
    en:
      - The passwords remembered in the browser, the saved addresses and the history cease to be carried between machines
      - A person relying on their bookmarks appearing everywhere has to carry them over once themselves
      - Browsers having an account of their own and a carrying of settings of their own work on and call for a separate decision
      - The browser's working, logging on to sites and the remembering of passwords on this machine stay unchanged
      - Applications, services and the network stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Ktoś loguje się na tę maszynę profilem przenoszonym między urządzeniami i polega na przychodzących zakładkach
      - Nie ustalono, która przeglądarka jest na tej maszynie używana i czy przenosi ustawienia własnym kanałem
    en:
      - Somebody logs on to this machine by a profile carried between devices and relies on the bookmarks coming in
      - It has not been established which browser is used on this machine and whether it carries settings by a channel of its own
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableWebBrowserSettingSync'
        $override = $item.'DisableWebBrowserSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $state = @()
    foreach ($name in @('DisableWebBrowserSettingSync', 'DisableWebBrowserSettingSyncUserOverride')) {
      $state += [pscustomobject]@{
        name    = $name
        value   = $item.$name
        existed = ($null -ne $item.$name)
      }
    }
    [pscustomobject]@{
      path        = $path
      key_existed = (Test-Path -Path $path)
      values      = $state
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both values are needed, for the same reason as at the item before - the
    # switch alone leaves the choice with the user.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { $null = New-Item -Path $path -Force }
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($entry in @($b.values)) {
      if ($entry.existed) {
        Set-ItemProperty -Path $b.path -Name $entry.name -Value $entry.value -Type DWord
      } else {
        Remove-ItemProperty -Path $b.path -Name $entry.name -ErrorAction SilentlyContinue
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Punkt zamyka blok i tworzy z poprzednim parę, którą warto rozstrzygać
    razem. Mechanizm jest jeden, wartości cztery, a rozdzielenie ich na dwie
    reguły wynika z układu benchmarku, nie z natury rzeczy.

    Argument, który tę regułę wyróżnia, dotyczy tego, co na serwerze robi
    przeglądarka. Na stanowisku roboczym zapamiętane hasła to hasła do
    sklepów i poczty; na serwerze to hasła do paneli zarządzania. Ta sama
    funkcja, zupełnie inna waga — i warto, żeby opis mówił o drugim
    przypadku, bo aplikacja jest o serwerach.

    Ostrzeżenie o przeglądarkach innych niż wbudowana jest rzeczą, bez
    której ten punkt daje fałszywe poczucie domknięcia. Przeglądarka
    z własnym kontem przenosi dokładnie ten sam zbiór danych własnym
    kanałem, którego to ustawienie nie dotyka. Warto, żeby aplikacja
    pokazała to wprost, bo inaczej raport zielony na tej pozycji znaczy
    mniej, niż wygląda.
  en: |
    The item shuts the block and makes with the one before a pair worth settling together. The mechanism is
    one, the values four, and their parting into two rules follows from the benchmark's arrangement and not
    from the nature of the thing.

    The argument setting this rule apart concerns what a browser does on a server. At a workplace the
    remembered passwords are passwords to shops and mail; on a server they are passwords to management
    panels. The same function, an altogether different weight - and it is well that the description speak of
    the second case, the application being about servers.

    The warning about browsers other than the built-in one is a thing without which this item gives a false
    sense of a shutting. A browser with an account of its own carries exactly the same set of data by a
    channel of its own, which this setting does not touch. It is well that the application show that
    outright, else a green report at this entry means less than it looks.
