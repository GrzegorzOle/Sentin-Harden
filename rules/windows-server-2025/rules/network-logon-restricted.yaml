id: win2025-network-logon-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp z sieci ograniczony do administratorów i użytkowników uwierzytelnionych
    en: Network access restricted to administrators and authenticated users
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo dostępu z sieci jest bramą, przez którą przechodzi wszystko,
    co łączy się z maszyną zdalnie: udziały plików, zarządzanie
    zdalne, odpytywanie usług i dostęp do rejestru przez sieć.

    Jest to prawo o zasięgu najszerszym z całej grupy i dlatego jego
    wykaz wymaga dyscypliny. Wpis dodany tu w celu wąskim — żeby jedna
    aplikacja mogła odczytać jeden udział — otwiera w rzeczywistości
    wszystkie drogi sieciowe naraz, bo system nie rozróżnia, po co
    połączenie zostało nawiązane.

    Punkt nie zamyka dostępu, tylko go porządkuje. Zgodnością jest
    wykaz obejmujący administratorów oraz użytkowników uwierzytelnionych
    — na serwerze członkowskim także kontrolery domeny przedsiębiorstwa,
    bez których przestałoby działać stosowanie zasad i uwierzytelnianie.

    Wartość polega na tym, co z wykazu znika. Najczęściej jest to grupa
    Wszyscy, wpisana tam przy instalacji dawnej aplikacji albo
    odziedziczona z maszyny starszej. Grupa ta obejmuje również dostęp
    bez uwierzytelnienia, więc jej obecność oznacza, że brama stoi
    otworem dla połączeń, które niczym się nie wykazały.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    udziałów, rejestru i usług serwera z sieci bez przedstawienia
    poświadczeń, jeżeli w wykazie pozostaje wpis obejmujący połączenia
    anonimowe.
  en: |
    The right of access from the network is the gate everything that connects to the machine
    remotely passes through: file shares, remote management, the querying of services and
    access to the registry over the network.

    It is the widest-reaching right of the whole group and hence its list takes discipline. An
    entry added here for a narrow end - so that one application might read one share - in truth
    opens all the network roads at once, since the system does not tell apart what a connection
    was made for.

    The item does not shut access but puts it in order. Compliance is a list taking in
    administrators and authenticated users - on a member server the enterprise's domain
    controllers as well, without which the applying of policies and authentication would stop
    working.

    The worth lies in what goes from the list. Most often it is the Everyone group, written
    there at the installation of a bygone application or inherited from an older machine. That
    group takes in access without authentication too, so its presence means the gate stands
    open to connections that have shown nothing.

    What an attacker gains while the item goes unmet: access to the server's shares, registry
    and services from the network without presenting credentials, where an entry taking in
    anonymous connections stays in the list.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia, bo zawęża bramę, przez którą
    przechodzi cały ruch sieciowy do tej maszyny naraz.

    Skutek jest natychmiastowy i dotyczy wszystkich dróg jednocześnie.
    Konto usunięte z wykazu traci nie tylko dostęp do udziału, o który
    chodziło — traci także zarządzanie zdalne, odpytywanie usług
    i dostęp do rejestru przez sieć.

    Na serwerze rodzi to ryzyko, którego na stanowisku roboczym nie ma:
    zmiana wykonana zdalnie potrafi odciąć drogę, którą właśnie się ją
    wykonuje. Warunkiem wdrożenia jest więc sprawdzenie, czy konto
    używane do zarządzania należy do grup pozostawionych w wykazie —
    przed zmianą, nie po.

    Przypadkiem wymagającym uwagi są urządzenia i aplikacje łączące się
    z serwerem na kontach, które nie są uwierzytelniane w domenie:
    skanery zapisujące na udziale, drukarki sieciowe, sterowniki maszyn,
    oprogramowanie sprzed lat. Wszystko to bywa objęte grupą Wszyscy
    i po zawężeniu przestanie działać.

    Objaw jest jednoznaczny: połączenie zgłasza odmowę dostępu, a nie
    działa gorzej po cichu. Jest to jedyna dobra strona tej zmiany —
    skutek widać od razu i nie trzeba go szukać.

    Rejestrowanie ruchu przychodzącego starszego mechanizmu
    uwierzytelniania, opisane osobnym punktem tej paczki, jest tu
    właściwym przygotowaniem. Zebrany przez nie wykaz mówi, kto się
    z tym serwerem łączy, zanim brama zostanie zawężona.
  en: |
    The change takes a knowing rollout, since it narrows the gate all network traffic to this
    machine passes through at once.

    The effect is immediate and touches every road at the same time. An account struck from the
    list loses not only access to the share at issue - it loses remote management, the querying
    of services and access to the registry over the network as well.

    On a server that raises a risk a working station does not have: a change made remotely can
    cut off the very road it is being made through. A condition of the rollout is therefore
    checking that the account used for managing belongs to the groups left in the list - before
    the change, not after.

    A case taking care is devices and applications connecting to the server under accounts not
    authenticated in the domain: scanners writing to a share, network printers, machine
    controllers, software from years back. All of that is at times taken in by the Everyone
    group and after the narrowing will stop working.

    The symptom is unmistakable: the connection reports a refusal of access rather than working
    worse in silence. That is the one good side of this change - the effect shows at once and
    needs no seeking.

    The recording of incoming traffic of the older authentication mechanism, described by an
    item of its own in this pack, is the right preparation here. The list it gathers says who
    connects to this server before the gate is narrowed.

implementation_consequences:
  impact_areas:
    - file-sharing
    - remote-management
    - network-and-firewall
    - legacy-applications
    - printing
  what_breaks:
    pl:
      - Konto usunięte z wykazu traci dostęp do udziałów, zarządzania zdalnego i rejestru naraz
      - Skaner albo drukarka łącząca się na koncie spoza domeny przestanie zapisywać na udziale
      - Zmiana wykonana zdalnie potrafi odciąć drogę, którą właśnie się ją wykonuje
      - Aplikacja sprzed lat objęta grupą Wszyscy przestanie sięgać po zasoby tego serwera
      - Objaw jest jednoznaczny — połączenie zgłasza odmowę dostępu, a nie cichnie
    en:
      - An account struck from the list loses shares, remote management and the registry at once
      - A scanner or printer connecting under an account outside the domain will stop writing to a share
      - A change made remotely can cut off the very road it is being made through
      - An application from years back taken in by the Everyone group will stop reaching this server's resources
      - The symptom is unmistakable - the connection reports a refusal of access rather than falling silent
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Z serwerem łączą się urządzenia na kontach nieuwierzytelnianych w domenie i nie da się ich przekonfigurować
      - Nie sprawdzono, czy konto używane do zarządzania należy do grup pozostawionych w wykazie
    en:
      - Devices under accounts not authenticated in the domain connect to the server and cannot be reconfigured
      - It has not been checked that the account used for managing belongs to the groups left in the list
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeNetworkLogonRight\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-11,S-1-5-32-544,S-1-5-9|S-1-5-11,S-1-5-32-544|S-1-5-32-544,S-1-5-9|S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeNetworkLogonRight\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeNetworkLogonRight'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Enterprise domain controllers stay in the list, since without them the
    # applying of policies and authentication would stop working on a member
    # server.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11,*S-1-5-9',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeNetworkLogonRight = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-this-computer-from-the-network

notes:
  pl: |
    Wykaz zgodny obejmuje administratorów, użytkowników
    uwierzytelnionych oraz kontrolery domeny przedsiębiorstwa. Ostatnia
    pozycja jest na serwerze członkowskim konieczna — bez niej przestaje
    działać stosowanie zasad i uwierzytelnianie w domenie.

    Sprawdzenie przyjmuje również warianty węższe, aż do wykazu
    złożonego z samych administratorów. Wariant najwęższy zamyka udziały
    dla zwykłych użytkowników i na serwerze plików jest błędem, ale
    na serwerze aplikacyjnym bywa zamierzony.

    Zestaw ten różni się od paczki stanowiska roboczego. Tam zgodność
    obejmuje użytkowników pulpitu zdalnego, tutaj — użytkowników
    uwierzytelnionych i kontrolery domeny, bo inne są role obu maszyn.

    Wykaz jest porządkowany przed porównaniem, a konta i grupy
    wskazywane identyfikatorami.
  en: |
    The compliant list takes in administrators, authenticated users and the enterprise's domain
    controllers. The last entry is on a member server needful - without it the applying of
    policies and authentication in the domain stop working.

    The check accepts narrower variants as well, down to a list made up of administrators
    alone. The narrowest variant shuts shares to ordinary users and on a file server is a
    mistake, but on an application server is at times meant.

    That set differs from the working station's pack. There compliance takes in remote desktop
    users; here, authenticated users and domain controllers, since the two machines' roles
    differ.

    The list is put in order before the comparison, and accounts and groups are pointed to by
    identifier.
