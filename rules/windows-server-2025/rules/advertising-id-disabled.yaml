id: win2025-advertising-id-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > User Profiles
  title:
    pl: Identyfikator reklamowy wyłączony
    en: The advertising identifier disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zapisuje w polityce wyłączenie identyfikatora reklamowego —
    trwałego znacznika, który aplikacje mogą odczytać i dołączyć do
    wysyłanych danych.

    Zostawiam kategorię niską i mówię wprost, że na serwerze jest to
    punkt porządku. Nie dorabiam do niego historii o napastniku, bo
    żadnej uczciwej nie ma.

    Wartość, jaka zostaje, jest jednak konkretna i warto ją nazwać
    dokładnie. Znacznik taki nie niesie sam w sobie żadnej treści.
    Robi co innego: pozwala zszyć osobne obserwacje w jeden ciąg
    dotyczący tej samej maszyny. Bez niego zdarzenia wysłane przez różne
    składniki są osobnymi zdarzeniami; z nim układają się w historię.
    Na serwerze nie ma użytkownika, którego dałoby się w ten sposób
    opisać, ale sama maszyna daje się rozpoznawać w czasie, a to jest
    rzecz, której w raporcie nie chcemy zostawiać bez decyzji.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Jest to punkt spójności konfiguracji, a nie obrony
    przed nazwanym zagrożeniem.
  en: |
    The item writes into the rule the switching off of the advertising mark - the lasting mark that
    applications may read and set to the data they send.

    I leave the category low and say outright that upon a server it is an item of order. I make up for
    it no tale of an attacker, there being no true one.

    The worth that is left is a set one for all that, and it is worth the naming closely. Such a mark
    carries of itself no substance at all. It does another thing - it lets sundry beholdings be sewn
    into one string touching the same machine. Without it the happenings sent by sundry pieces are
    happenings on their own; with it they lay themselves into a tale. Upon a server there is no user
    that could be told of in such a way, but the machine itself may be known again over time, and that
    is a thing we would not leave in the writ-up without a deciding.

    What an attacker gains while the item goes unmet - nothing straightway. It is an item of the
    oneness of the setting up and not of warding against a named threat.

disruption_description:
  pl: |
    Zostawiam klasę „bez uciążliwości" — jest taka sama jak w ocenie dla
    stacji roboczej i nie mam powodu jej ruszać. Nie ma na serwerze
    aplikacji, która z tego znacznika korzysta, i nie ma nikogo, kto
    zauważyłby jego brak.

    Warto przy tym punkcie zapytać o coś innego niż o sam znacznik.
    Jeżeli wypada on jako niespełniony, zwykle nie jest sam: wraz z nim
    wypada zestaw innych ustawień przeniesionych z obrazu stacji
    roboczej. Wartość tego punktu leży więc raczej w tym, co przy nim
    widać, niż w nim samym.

    Punkt nie wymaga przerwy, bo zapisywana jest wartość w polityce.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem i jest przykładem tego, po co ta klasa istnieje:
    żeby rzeczy takie jak ta dało się zamknąć jednym ruchem i zająć się
    tymi, przy których trzeba myśleć.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "no unease" - it is the same as in the reckoning for a workstation and I have no
    ground to stir it. There is upon a server no application drawing upon that mark, and nobody who
    would mark the want of it.

    It is worth asking at that item after another thing than the mark itself. If it come out as unmet,
    it is mostly not alone - along with it there come out a set of other settings borne over from the
    likeness of a workstation. The worth of that item lies therefore rather in what is seen beside it
    than in itself.

    The item takes no break, a worth being written into the rule.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk, and it is a showing of what
    that class is there for - that things such as this may be shut with one stroke and one may turn to
    those whereat thought is needed.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - user-interface
  what_breaks:
    pl:
      - Aplikacje przestają dostawać trwały identyfikator reklamowy, który mogłyby dołączyć do wysyłanych danych
      - Na serwerze nie ma aplikacji, która z tego znacznika korzysta, ani nikogo, kto zauważyłby brak
      - Maszyna przestaje dawać się rozpoznawać w czasie przez ten jeden znacznik, choć nie przez wszystkie
      - Nic nie wymaga tu przerwy ani ponownego uruchomienia, bo zapisywana jest wartość w polityce
    en:
      - Applications stop being given the lasting advertising mark that they might set to the data they send
      - Upon a server there is no application drawing upon that mark and nobody who would mark the want of it
      - The machine stops being knowable again over time by that one mark, though not by all of them
      - Nothing here takes a break or a starting anew, a worth being written into the rule
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja, która dla poprawnego działania odczytuje identyfikator reklamowy
    en:
      - Upon the machine there stands an application that reads the advertising mark for its right working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisabledByGroupPolicy'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
    $name = 'DisabledByGroupPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # An ordering item. The marker carries no content of its own; what it does
    # is let separate observations be stitched into one string about the same
    # machine.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisabledByGroupPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services

notes:
  pl: |
    Punkt porządku i mówię to wprost, bo uczciwej historii o napastniku
    tu nie ma. Wartość, jaka zostaje, jest konkretna: znacznik nie niesie
    treści, tylko pozwala zszyć osobne obserwacje w jeden ciąg dotyczący
    tej samej maszyny.

    Na serwerze nie ma użytkownika, którego dałoby się w ten sposób
    opisać, ale sama maszyna daje się rozpoznawać w czasie.

    Jeżeli punkt wypada jako niespełniony, zwykle nie jest sam — wraz
    z nim wypada zestaw ustawień przeniesionych z obrazu stacji
    roboczej. Wartość leży raczej w tym, co przy nim widać.
  en: |
    An item of order, and I say it outright, there being here no true tale of an attacker. The worth
    that is left is a set one - the mark carries no substance, it only lets sundry beholdings be sewn
    into one string touching the same machine.

    Upon a server there is no user that could be told of in such a way, but the machine itself may be
    known again over time.

    If the item come out as unmet, it is mostly not alone - along with it there comes out a set of
    settings borne over from the likeness of a workstation. The worth lies rather in what is seen
    beside it.
