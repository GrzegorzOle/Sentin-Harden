      - Plikiem kandydującym do wysłania jest zwykle program napisany na miejscu albo narzędzie od małego dostawcy
      - Kryterium wyboru pochodzi od producenta oprogramowania i nie zna umów ani przepisów organizacji
      - Na serwerze nie ma nikogo, kto odpowiedziałby na pytanie o zgodę, więc wariant pośredni nie działa
      - Od strony technicznej zmiana nie blokuje, nie opóźnia i nie zmienia sposobu pracy maszyny
    en:
      - A file goes out of the server and not the tiding about it alone, and therein lies the deciding
      - The file standing for the sending is mostly a program written on the spot or a tool of a small seller
      - The measure of choosing comes of the maker of the software and knows neither the body's covenants nor its rules
      - On a server there is nobody to answer a question about leave, so the middle way works not
      - From the side of the workings the change blocks not, delays not and alters not the machine's way of working
  interruption: none
  user_visible: false
