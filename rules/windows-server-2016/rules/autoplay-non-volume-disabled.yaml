id: win2016-autoplay-non-volume-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > AutoPlay Policies
  title:
    pl: Autoodtwarzanie dla urządzeń niebędących dyskiem wyłączone
    en: Automatic playing for devices that are not disks switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza autoodtwarzanie dla urządzeń, które nie zgłaszają
    się systemowi jako dysk.

    Cała treść punktu mieści się w jednym rozróżnieniu, więc powiem je
    wprost. Reguła wyłączająca autoodtwarzanie dla napędów operuje
    rodzajami napędów: wymienny, stały, sieciowy, płyta. Urządzenie, które
    nie jest napędem, nie mieści się w żadnym z tych rodzajów i tamta reguła
    go nie obejmuje.

    Urządzeń takich jest więcej, niż wygląda. Aparat, telefon, czytnik
    kart, urządzenie przedstawiające się własnym protokołem przesyłania
    plików — każde z nich podłącza się, zgłasza zawartość i ma własną drogę
    uruchamiania, osobną od tej, którą zamknęły dwie poprzednie reguły.

    Na serwerze urządzenia te podłącza się rzadko, ale podłącza: telefon do
    naładowania, czytnik przy wdrożeniu, urządzenie pomiarowe przy
    diagnostyce. Każde z nich wnosi zawartość, której nikt nie sprawdził.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    omijającą obie poprzednie reguły przez samo przedstawienie się systemowi
    jako coś innego niż dysk.
  en: |
    The setting switches automatic playing off for devices that do not present
    themselves to the system as a disk.

    The item's whole substance sits in one distinction, so I shall put it outright.
    The rule switching automatic playing off for drives works by kinds of drive:
    removable, fixed, network, disc. A device that is not a drive fits none of those
    kinds and that rule does not cover it.

    There are more such devices than it looks. A camera, a telephone, a card reader,
    a device presenting itself with a file transfer protocol of its own - each of
    them attaches, reports contents, and has a road of its own for starting things,
    separate from the one the two previous rules shut.

    On a server such devices are plugged in seldom, but they are: a telephone to
    charge, a reader at a rollout, a measuring device at a diagnosis. Each of them
    brings in contents nobody has checked.

    What an attacker gains while the item goes unmet: a road round both previous
    rules by presenting itself to the system as something other than a disk.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Skutek dotyczy wyłącznie tego, co dzieje się samo po podłączeniu
    urządzenia niebędącego dyskiem. Urządzenie nadal się podłącza, nadal
    instaluje sterownik, nadal daje się z niego przenieść pliki. Nie otwiera
    się tylko okno proponujące, co z nim zrobić.

    Na stanowisku różnica bywa widoczna — ktoś podłącza aparat i przywykł,
    że program do zdjęć wstaje sam. Na serwerze nikt tego nie robi
    i zauważalnego skutku nie ma.

    Warto odnotować, czego punkt nie obejmuje, bo bywa przeceniany.
    Nie blokuje podłączania takich urządzeń i nie zabrania instalowania dla
    nich sterowników. Zajmuje się tym reguła o blokadzie instalowania
    urządzeń wymiennych, stojąca w tym bloku dalej i mająca klasę znacznie
    wyższą.

    Czego to nie psuje: podłączania urządzeń, instalowania sterowników,
    przenoszenia plików, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption".

    The consequence concerns only what happens by itself once a device that is not a
    disk is plugged in. The device still attaches, still installs a driver, files
    can still be moved off it. All that fails to open is the window proposing what
    to do with it.

    At a workstation the difference is at times visible - somebody plugs in a camera
    and is used to the photo program rising by itself. On a server nobody does that
    and there is no noticeable consequence.

    Worth noting what the item does not cover, being at times overrated. It does not
    block the plugging in of such devices and does not forbid drivers to be
    installed for them. That is the business of the rule on blocking the
    installation of removable devices, standing further on in this block and of a
    much higher class.

    What this does not break: the plugging in of devices, the installing of drivers,
    the moving of files, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - removable-media
    - drivers-and-devices
  what_breaks:
    pl:
      - Okno proponujące działanie przestaje pojawiać się po podłączeniu aparatu, telefonu albo czytnika kart
      - Program obsługujący takie urządzenie nie wstaje sam i trzeba uruchomić go ręcznie
      - Podłączanie urządzeń, instalowanie sterowników i przenoszenie plików pozostają bez zmian
      - Usługi, logowanie i dostęp do dysków pozostają bez zmian
    en:
      - The window proposing an action stops appearing once a camera, telephone or card reader is plugged in
      - The program handling such a device does not rise by itself and has to be started by hand
      - The plugging in of devices, the installing of drivers and the moving of files stay unchanged
      - Services, signing in and access to disks stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Obsługa urządzenia pomiarowego na tej maszynie opiera się na programie wstającym samoczynnie po podłączeniu
    en:
      - The handling of a measuring device on this machine rests on a program rising by itself once it is plugged in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
      $name = 'NoAutoplayfornonVolume'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    $name = 'NoAutoplayfornonVolume'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NoAutoplayfornonVolume' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-autoplay

notes:
  pl: |
    Punkt zamyka trójkę o zachowaniu systemu wobec nośnika przyjętego
    i jest w niej najmniej znany. Właśnie dlatego warto go pokazywać razem
    z dwoma poprzednimi: sam w sobie wygląda na drobiazg, a w zestawieniu
    widać, że domyka lukę zostawioną przez tamte.

    Dobrym sposobem wyjaśnienia jest pytanie, jak urządzenie się
    przedstawia. Dwie poprzednie reguły pytają, jakiego rodzaju to napęd.
    Ta pyta, czy to w ogóle napęd. Urządzenie odpowiadające „nie" wypada
    z zasięgu tamtych i dopiero ta reguła je obejmuje.

    Trzy reguły razem zamykają zachowanie samoczynne. Nie zamykają
    natomiast samego podłączania — i to rozróżnienie warto postawić
    w interfejsie wprost, żeby zgodność w tej trójce nie została odczytana
    jako kontrola nad nośnikami.
  en: |
    The item shuts the three about the system's behaviour towards a medium taken in,
    and is the least known of them. Just for that reason it is worth showing along
    with the two before it: on its own it looks a trifle, and set beside them it can
    be seen to close a gap those two leave.

    A good way of explaining it is the question of how a device presents itself. The
    two previous rules ask what kind of drive it is. This one asks whether it is a
    drive at all. A device answering "no" falls outside their reach, and only this
    rule covers it.

    The three rules together shut the behaviour that happens by itself. They do not
    shut the plugging in - and that distinction is worth putting outright in the
    interface, so that compliance across the three is not read as control over
    media.
