id: ubuntu2404-pwquality-maxrepeat

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.3.2.4
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_pwquality module
  title:
    pl: Limit powtórzeń tego samego znaku w haśle jest skonfigurowany
    en: Ensure password same consecutive characters is configured
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Hasła z długimi ciągami tego samego znaku, np. aaaa1111, łatwo zgadnąć
    i sprawdzają je najpierw narzędzia do łamania haseł. Parametr maxrepeat
    ogranicza, ile razy z rzędu może wystąpić ten sam znak.

    Punkt wymaga, żeby maxrepeat wynosił od 1 do 3; 0 wyłącza limit.
  en: |
    Passwords with long runs of the same character, for example aaaa1111,
    are easy to guess and password cracking tools try them first. The
    maxrepeat parameter limits how many times in a row the same character
    may appear.

    The item requires maxrepeat to be between 1 and 3; 0 turns the limit
    off.

disruption_description:
  pl: |
    Domyślnie nie ma tego limitu. Naprawa ustawia maxrepeat = 3, więc nowe
    hasło nie może mieć czterech takich samych znaków z rzędu.
  en: |
    There is no such limit by default. The remediation sets maxrepeat = 3,
    so a new password cannot have four same characters in a row.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownicy, których nowe hasło ma więcej niż trzy takie same znaki z rzędu
    en:
      - Users whose new password has more than three same characters in a row
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta, których hasła zmienia automatyzacja wybierająca hasła według własnych, słabszych zasad
    en:
      - Accounts whose passwords are changed by automation that picks passwords by its own, weaker rules
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    # conf_get KEY FILE...: value of the key in the files read in this order;
    # the last entry wins (the first with first=1), ic=1 ignores the case of names.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" -v ic=1 -v first=0 '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name == "" || (ic ? tolower(name) != tolower(k) : name != k) { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*=?[ \t]*/, "", v); sub(/[ \t]+$/, "", v)
          if (!(first && seen)) val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value, KEY alone and conf=... on active lines of a module,
    # one "file:argument" item each.
    pam_args() {
      local f
      for f in common-password; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if ($i == k || index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 3) }'; }
    evaluate() {
      local v s a bad=""
      if v=$(conf_get maxrepeat /etc/security/pwquality.conf.d/*.conf /etc/security/pwquality.conf); then s="maxrepeat=$v"; else v='0'; s="maxrepeat=$v(default)"; fi
      for a in $(pam_args pam_pwquality.so maxrepeat); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          maxrepeat) ;;
          *) ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if [ -n "$bad" ]; then echo "NOT_OK:$s,by-hand:${bad#,}"
      elif ok "$v"; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=secconf-1
        if [ -e /etc/security/pwquality.conf ]; then echo existed=1; else echo existed=0; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/pwquality.conf
      mark='# Sentin-Harden: ubuntu2404-pwquality-maxrepeat'
      line='maxrepeat = 3'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    # conf_get KEY FILE...: value of the key in the files read in this order;
    # the last entry wins (the first with first=1), ic=1 ignores the case of names.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" -v ic=1 -v first=0 '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name == "" || (ic ? tolower(name) != tolower(k) : name != k) { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*=?[ \t]*/, "", v); sub(/[ \t]+$/, "", v)
          if (!(first && seen)) val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value, KEY alone and conf=... on active lines of a module,
    # one "file:argument" item each.
    pam_args() {
      local f
      for f in common-password; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if ($i == k || index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 1 && v + 0 <= 3) }'; }
    evaluate() {
      local v s a bad=""
      if v=$(conf_get maxrepeat /etc/security/pwquality.conf.d/*.conf /etc/security/pwquality.conf); then s="maxrepeat=$v"; else v='0'; s="maxrepeat=$v(default)"; fi
      for a in $(pam_args pam_pwquality.so maxrepeat); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          maxrepeat) ;;
          *) ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if [ -n "$bad" ]; then echo "NOT_OK:$s,by-hand:${bad#,}"
      elif ok "$v"; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "$f already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *by-hand:*) echo "The pam_pwquality lines in the PAM files have arguments that decide it instead of $f (${r##*by-hand:}); change them by hand in /etc/pam.d or in the pam-auth-update profile that adds them" >&2; exit 1 ;;
      esac
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      # The last entry wins, so the line of this rule goes at the end; an older
      # copy of it is removed.
      { if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f"; fi
        echo "$mark"; echo "$line"; } > "$t"
      if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
      mv -f "$t" "$f"
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi
           echo "$f does not meet the item after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      echo "Set $line in $f"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/pwquality.conf
      mark='# Sentin-Harden: ubuntu2404-pwquality-maxrepeat'
      line='maxrepeat = 3'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the maxrepeat line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://github.com/libpwquality/libpwquality

notes:
  pl: |
    pam_pwquality czyta najpierw pliki /etc/security/pwquality.conf.d/*.conf
    w kolejności alfabetycznej (Ubuntu domyślnie nie ma tego katalogu),
    potem /etc/security/pwquality.conf, a na końcu argumenty ze swojego
    wiersza w /etc/pam.d/common-password. Wygrywa ostatni wpis, więc
    argument w pliku PAM wygrywa ze wszystkimi plikami. Wielkość liter
    w nazwach kluczy nie ma znaczenia, a wartość może stać po znaku = albo
    po spacji. Sprawdzenie bierze ostatni wpis z tych plików, a gdy go nie
    ma, wartość domyślną modułu. Argument w wierszu pam_pwquality
    z niepoprawną wartością daje wynik NOT_OK z dopiskiem by-hand; naprawa
    wtedy niczego nie zmienia, bo ten wiersz trzeba poprawić ręcznie.

    Naprawa dopisuje wiersz tej reguły na końcu pwquality.conf pod
    komentarzem Sentin-Harden, bo ten plik jest czytany po katalogu
    pwquality.conf.d. Wycofanie usuwa tylko te dwa wiersze. Zasady działają
    dopiero przy włączonym pam_pwquality (punkty 5.3.1.3 i 5.3.2.3)
    i obowiązują przy każdej zmianie hasła przez użytkownika, np. passwd;
    obecne hasła zostają ważne. Root ustawiający hasła dostaje tylko
    ostrzeżenie, dopóki nie włączy się enforce_for_root (punkt 5.3.3.2.8).
  en: |
    pam_pwquality reads the /etc/security/pwquality.conf.d/*.conf files in
    alphabetical order first (Ubuntu has no such directory by default), then
    /etc/security/pwquality.conf, and last the arguments on its line in
    /etc/pam.d/common-password. The last entry wins, so an argument in the
    PAM file wins over all files. The case of key names does not matter,
    and the value may follow = or a space. The check takes the last entry
    in these files and, when there is none, the default of the module. An
    argument on the pam_pwquality line with a wrong value gives the NOT_OK
    result with a by-hand note; the remediation then changes nothing,
    because this line has to be fixed by hand.

    The remediation appends the line of this rule at the end of
    pwquality.conf under a Sentin-Harden comment, because this file is read
    after the pwquality.conf.d directory. Rollback removes only these two
    lines. The rules only work with pam_pwquality enabled (items 5.3.1.3 and
    5.3.2.3) and apply to every password change by a user, for example
    passwd; current passwords stay valid. Root setting passwords only gets
    a warning unless enforce_for_root is turned on (item 5.3.3.2.8).
