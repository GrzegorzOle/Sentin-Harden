id: win11-defender-antivirus-enabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Antivirus
  title:
    pl: Wyłączenie wbudowanej ochrony przed złośliwym oprogramowaniem zablokowane
    en: Switching the built-in malware protection off blocked
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, czy wbudowana ochrona przed złośliwym
    oprogramowaniem może zostać wyłączona zasadą. Stan wymagany nie polega na
    włączeniu czegokolwiek — polega na zapisaniu wprost, że wyłączona być nie
    ma.

    Punkt bywa czytany jako oczywisty i dlatego warto powiedzieć, przed czym
    naprawdę broni. Nie chroni przed użytkownikiem, który klika w ustawieniach
    — tego zabraniają inne mechanizmy. Chroni przed zapisem w rejestrze, który
    wyłącza ochronę na poziomie zasady, czyli tak, że interfejs pokazuje ją
    jako niedostępną z powodu decyzji administratora.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wyłączenia ochrony jednym zapisem do rejestru, jeżeli zdobył uprawnienia
    administratora, i to w sposób, który wygląda na decyzję organizacji, a nie
    na atak. Jest to czynność wykonywana rutynowo na początku włamania —
    zanim ruszy cokolwiek, co ochrona mogłaby zauważyć.

    Zapisanie wartości zabraniającej wyłączenia odbiera tę drogę. Ochrona
    pozostaje pod kontrolą zasady, a nie tego, kto akurat ma dostęp do
    rejestru.

    Kategoria krytyczna wynika stąd, że punkt nie utrudnia jednego kroku
    ataku — broni mechanizmu, który ma zauważyć wszystkie pozostałe.
  en: |
    The setting settles whether the built-in malware protection may be switched off by
    policy. The required state does not consist in switching anything on - it consists in
    writing down outright that it is not to be switched off.

    The item is sometimes read as obvious, and so it is worth saying what it really guards
    against. It does not guard against a user clicking in the settings - other mechanisms
    forbid that. It guards against an entry in the registry that switches protection off
    at the level of policy, that is, so that the interface shows it as unavailable by an
    administrator's decision.

    What an attacker gains while the item goes unmet: the means of switching protection
    off with one write to the registry, if they have gained administrator rights, and in a
    way that looks like an organisation's decision rather than an attack. It is an act
    performed routinely at the start of a break-in - before anything moves that the
    protection might notice.

    Writing the value that forbids switching off takes that route away. Protection stays
    under the control of policy rather than of whoever happens to have access to the
    registry.

    The critical category follows from the item's not hindering one step of an attack - it
    guards the mechanism meant to notice all the rest.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na maszynie ma stać ochrona innego producenta —
    bo to jedyny przypadek, w którym zmiana bywa problemem.

    Sama zmiana nie włącza niczego i nie zmienia zachowania maszyny, na której
    ochrona wbudowana pracuje normalnie. Zapisuje decyzję, której skutek widać
    dopiero wtedy, gdy ktoś spróbuje ochronę wyłączyć.

    Instalatory ochrony innych producentów bywają napisane tak, że przy
    instalacji wpisują dokładnie tę wartość, żeby wyłączyć ochronę wbudowaną.
    Po wdrożeniu zasady taki zapis zostanie nadpisany albo zignorowany,
    a instalator może zgłosić błąd.

    Warto jednak wiedzieć, że nie jest to zwykle problem realny. Ochrona
    wbudowana sama ustępuje, gdy w systemie zarejestruje się inny mechanizm
    ochrony, i nie robi tego przez tę wartość. Konflikt dotyczy instalatorów
    napisanych niedbale, nie samego współistnienia.

    Zmiana nie wymaga restartu. Praca użytkownika nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is whether protection from another maker is to stand on the
    machine - since that is the only case in which the change is sometimes a problem.

    The change itself switches nothing on and alters no behaviour on a machine where the
    built-in protection works normally. It writes down a decision whose effect shows only
    when somebody tries to switch protection off.

    Installers of other makers' protection are sometimes written so as to enter that very
    value on installation, in order to switch the built-in protection off. Once the policy
    is applied such an entry will be overwritten or ignored, and the installer may report
    an error.

    It is worth knowing, though, that this is not usually a real problem. The built-in
    protection stands aside of itself when another protection mechanism registers in the
    system, and it does not do so through this value. The conflict concerns carelessly
    written installers, not coexistence as such.

    The change takes no restart. The user's work does not change in any way.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Instalator ochrony innego producenta, który wyłącza ochronę wbudowaną tą wartością, może zgłosić błąd
      - Wyłączenie ochrony wbudowanej zapisem do rejestru przestaje być możliwe
      - Ochrona wbudowana ustępuje innemu mechanizmowi ochrony tak jak wcześniej
      - Praca użytkownika nie zmienia się w żaden sposób
    en:
      - An installer of another maker's protection that switches the built-in one off by this value may report an error
      - Switching the built-in protection off by a registry entry stops being possible
      - The built-in protection stands aside for another protection mechanism as before
      - The user's work does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Wdrożenie ochrony innego producenta opiera się na wyłączeniu ochrony wbudowanej tą wartością
    en:
      - The rollout of another maker's protection rests on switching the built-in one off by this value
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The compliant state is an explicit zero, not an absent value: without
      # the entry the decision stays with whoever can write to the registry.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DisableAntiSpyware'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    $current = (Get-ItemProperty -Path $path -Name 'DisableAntiSpyware' -ErrorAction SilentlyContinue).'DisableAntiSpyware'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableAntiSpyware'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableAntiSpyware' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-windows

notes:
  pl: |
    Zapisana zasada nie zmusza ochrony wbudowanej do pracy tam, gdzie
    zarejestrowany jest inny mechanizm ochrony. Ustąpienie odbywa się inną
    drogą i ta reguła go nie dotyczy — warto to wiedzieć, żeby nie oczekiwać
    po niej czegoś, czego nie robi.

    Brak wartości nie jest stanem zgodnym, choć zachowanie maszyny jest wtedy
    takie samo. Różnica polega na tym, kto decyduje: przy braku wartości
    decyduje ten, kto zdoła zapisać do rejestru, przy zapisanym zerze decyduje
    zasada.

    Wartość jednostkowa w tym miejscu jest jednym z najczęściej spotykanych
    śladów po skutecznym włamaniu. Warto ją traktować jako sygnał do
    sprawdzenia maszyny, a nie tylko jako niezgodność do naprawienia.
  en: |
    The written policy does not compel the built-in protection to work where another
    protection mechanism is registered. Standing aside happens by another route and this
    rule does not concern it - worth knowing, so as not to expect of it something it does
    not do.

    A missing value is not a compliant state, though the machine's behaviour is then the
    same. The difference lies in who decides: with no value it is whoever manages to write
    to the registry, with a written zero it is the policy.

    A one in this place is among the most commonly met traces of a successful break-in. It
    is worth treating as a signal to examine the machine rather than only as a
    non-compliance to repair.
