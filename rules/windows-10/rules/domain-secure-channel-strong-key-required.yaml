id: win10-domain-secure-channel-strong-key-required

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera wymaga silnego klucza sesji
    en: The secure channel to the controller requires a strong session key
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby klucz sesji chroniący kanał do kontrolera był
    wyliczany mechanizmem obecnym, a nie tym z czasów, gdy klucze były
    krótkie.

    Punkt domyka rodzinę czterech i jest w niej tym, który nadaje pozostałym
    sens. Podpis i szyfrowanie liczone są z klucza sesji. Klucz słaby sprawia,
    że ochrona formalnie jest, a praktycznie daje się odtworzyć nakładem
    niewielkim — podpis wtedy da się podrobić, a szyfr złamać.

    Jest to więc różnica między ochroną nazwaną a ochroną działającą.
    Maszyna z podpisywaniem wymaganym i kluczem słabym wygląda w raporcie
    zgodności lepiej, niż jest w istocie, i właśnie dlatego ten punkt należy
    czytać razem z trzema poprzednimi.

    Odnotowuję granicę reguły: nie zmienia ona tego, czy ochrona jest
    wymagana. Zmienia to, czy jest cokolwiek warta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: klucz sesji
    na tyle krótki, że ochronę kanału da się obejść nakładem niewielkim.
  en: |
    The setting calls for the session key guarding the channel to the controller to be reckoned by a present-day
    mechanism and not by one from the days when keys were short.

    The item closes the family of four and is the one in it that gives the rest their sense. A signature and an
    encryption are reckoned from the session key. A weak key makes the guard formally present and in practice
    recoverable at small cost - a signature can then be forged and a cipher broken.

    It is therefore the difference between a guard named and a guard working. A machine with signing required
    and a weak key looks in a compliance report better than it is in truth, and for just that this item is to be
    read together with the three foregoing.

    I set down the rule's bound: it does not change whether the guard is required. It changes whether the guard
    is worth anything.

    What an attacker gains while the item goes unmet: a session key short enough that the channel's guard can be
    gone round at small cost.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie ma ten sam przedmiot co przy
    regule pierwszej z tej rodziny.

    Kontrolery wspierane obsługują klucz obecny od dawna i zmiany nie
    zauważą. Ryzyko dotyczy kontrolera bardzo starego albo implementacji
    obcej, udającej kontroler na potrzeby oprogramowania branżowego.

    Jeśli taki układ istnieje, maszyna po zmianie przestanie ustalać z nim
    kanał, a skutkiem będzie brak logowania kontami domenowymi i brak zasad.
    Objaw jest ten sam co przy regule pierwszej i warto sprawdzić obie
    rzeczy naraz, a nie po kolei.

    Poza domeną ustawienie nie robi nic.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: logowania kontami lokalnymi, udziałów plikowych,
    drukowania, aplikacji, sieci, usług systemowych.
  en: |
    The class is "needs review", and the review has the same object as at the first rule of this family.

    Supported controllers have long served the present-day key and will not notice the change. The hazard
    touches a very old controller, or a foreign implementation standing in for one on behalf of trade software.

    Where such an arrangement is, the machine will after the change cease settling a channel with it, and the
    consequence will be no logging on by domain accounts and no policies. The symptom is the same as at the
    first rule, and it is well to review both things at once rather than in turn.

    Outside a domain the setting does nothing.

    The change takes hold at once and undoes itself at once.

    What this does not break: logging on by local accounts, file shares, printing, applications, the network, or
    system services.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - encryption-and-tls
    - network-and-firewall
  what_breaks:
    pl:
      - Kontroler bardzo stary albo implementacja udająca kontroler przestaje ustalać kanał z tą maszyną
      - Logowanie kontami domenowymi przestaje dochodzić do skutku, gdy taki kontroler jest jedynym osiągalnym
      - Zasady domenowe przestają się pobierać, bo idą tym samym kanałem
      - Objaw jest ten sam co przy regule wymagającej podpisu, więc obie warto sprawdzić naraz
      - Logowanie kontami lokalnymi, udziały plikowe, drukowanie i aplikacje pozostają bez zmian
    en:
      - A very old controller, or an implementation standing in for one, ceases settling a channel with this machine
      - Logging on by domain accounts ceases coming about where such a controller is the only one to be reached
      - Domain policies cease being fetched, going as they do by that same channel
      - The symptom is the same as at the rule requiring a signature, so both are well reviewed at once
      - Logging on by local accounts, file shares, printing and applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W domenie pozostaje kontroler wyliczający klucz sesji mechanizmem sprzed lat
      - Rolę kontrolera pełni implementacja obca, wniesiona na potrzeby oprogramowania branżowego
    en:
      - There remains in the domain a controller reckoning the session key by a mechanism of years ago
      - The controller's part is taken by a foreign implementation brought in on behalf of trade software
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'RequireStrongKey'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'RequireStrongKey'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The same review as at the rule requiring a signature - a controller unable
    # to reckon a present-day key will cease settling a channel, and domain logons
    # will stop.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireStrongKey' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-require-strong-windows-2000-or-later-session-key

notes:
  pl: |
    Reguła domyka rodzinę czterech i jest w niej tą, bez której trzy
    pozostałe bywają warte mniej, niż pokazuje raport. Warto, żeby aplikacja
    wiązała ją z regułą wymagającą podpisu i pokazywała obie jako jedną
    decyzję — mają ten sam przedmiot sprawdzenia i ten sam objaw awarii.

    Argument wart postawienia wprost dotyczy różnicy między ochroną
    nazwaną a działającą. Podpis liczony ze słabego klucza jest podpisem
    w sensie formalnym i niczym więcej. Bez tego zdania reguła wygląda na
    uszczegółowienie, a jest warunkiem.

    Odnotowuję, że wszystkie cztery reguły tej rodziny leżą w jednej gałęzi
    rejestru i różnią się wyłącznie nazwą wartości. Przy czytaniu kopii
    zapasowej łatwo je pomylić.
  en: |
    The rule closes the family of four and is the one without which the other three are at times worth less than
    the report shows. It is well that the application bind it to the rule requiring a signature and show both as
    one decision - they have the same object of review and the same symptom of failure.

    The argument worth putting outright touches the difference between a guard named and a guard working. A
    signature reckoned from a weak key is a signature in the formal sense and nothing besides. Without that
    sentence the rule looks a detailing, while it is a condition.

    I set down that all four rules of this family lie in one branch of the registry and part only by the value's
    name. While reading a backup they are easily confused.
