id: win2016-builtin-administrator-renamed

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora przemianowane
    en: The built-in administrator account renamed
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby wbudowane konto administratora nosiło nazwę inną niż
    domyślna.

    Chcę od razu powiedzieć, czego ten punkt nie robi, bo bywa przedstawiany
    jako coś więcej. Nie ukrywa konta: identyfikator zostaje ten sam i ktoś,
    kto już jest w systemie, odczyta go bez trudu. Przemianowanie nie jest
    zabezpieczeniem, tylko utrudnieniem.

    Utrudnienie jest jednak realne i dotyczy konkretnego etapu ataku. Próby
    zgadywania hasła prowadzone z zewnątrz zaczynają się od nazwy domyślnej,
    bo to jedyna, którą napastnik zna z góry. Konto przemianowane wymaga
    najpierw ustalenia nazwy — a to znaczy więcej prób, więcej hałasu
    i większą szansę, że blokada konta albo dziennik zdążą zadziałać.

    Na serwerze 2016 waży dodatkowo to, że wbudowany administrator na tej
    roli jest kontem o pełnej władzy nad maszyną i często jest to konto,
    którego hasła nie zmieniano od wdrożenia. Im mniej oczywiste jest, gdzie
    go szukać, tym lepiej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową nazwę
    konta o pełnych uprawnieniach, dzięki czemu z dwóch niewiadomych
    logowania pozostaje mu tylko jedna.
  en: |
    The item requires the built-in administrator account to carry a name other
    than the default one.

    I want to say at once what this item does not do, because it is sometimes
    presented as more. It does not hide the account: the identifier stays the
    same, and somebody already inside the system will read it off without
    trouble. Renaming is not a safeguard but an obstacle.

    The obstacle is real, though, and concerns a particular stage of an attack.
    Password guessing from outside starts with the default name, because that
    is the only one an attacker knows in advance. A renamed account requires the
    name to be worked out first - which means more attempts, more noise and a
    better chance that the account lockout or the log gets there first.

    On Server 2016 there is the added weight that the built-in administrator on
    this role is an account with full power over the machine, and often one
    whose password has not been changed since deployment. The less obvious it is
    where to look for it, the better.

    What an attacker gains while the item goes unmet: a ready name for an
    account with full rights, leaving them one unknown instead of two.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest praktyczny: nazwa
    wbudowanego administratora bywa wpisana w miejsca, o których nikt już nie
    pamięta.

    Do sprawdzenia przed zmianą: skrypty logujące się na to konto po nazwie,
    zapisane poświadczenia w menedżerze, zadania harmonogramu uruchamiane
    jako administrator, połączenia narzędzi zarządzających, wpisy w plikach
    konfiguracyjnych aplikacji. Każde z tych miejsc podaje nazwę, a nie
    identyfikator — i każde przestanie działać w chwili przemianowania.

    Na serwerze tego rocznika lista takich miejsc bywa dłuższa niż na maszynie
    świeżej i rzadziej jest kompletna. To jest właściwy powód klasy: nie sama
    zmiana, tylko to, czego o niej nie wiadomo.

    Osobno warto pomyśleć o drodze powrotnej. Jeżeli dostęp do maszyny opiera
    się na tym koncie i na sesji zdalnej, warto mieć drugie konto
    administracyjne działające przed zmianą, a nie po niej.

    Czego to nie psuje: uprawnień konta, jego hasła, profilu ani niczego, co
    odwołuje się do identyfikatora zamiast do nazwy.

    Bez restartu, natychmiast odwracalne — pod warunkiem, że poprzednia nazwa
    jest zapisana, a kopia zapasowa reguły właśnie ją zapisuje.
  en: |
    The class is "needs planned rollout", and the reason is practical: the name
    of the built-in administrator tends to be written into places nobody
    remembers any more.

    To check before the change: scripts signing in to this account by name,
    credentials saved in the credential manager, scheduled tasks running as
    administrator, connections from management tools, entries in applications'
    configuration files. Every one of those supplies a name rather than an
    identifier - and every one stops working the moment it is renamed.

    On a server of this vintage the list of such places tends to be longer than
    on a fresh machine and is less often complete. That is the real reason for
    the class: not the change itself, but what is not known about it.

    The way back deserves a separate thought. If access to the machine rests on
    this account and on a remote session, it is worth having a second
    administrative account working before the change rather than after.

    What this does not break: the account's rights, its password, its profile,
    or anything that refers to the identifier instead of the name.

    No restart, undone immediately - provided the previous name is recorded, and
    the rule's backup records exactly that.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Skrypty i zadania harmonogramu logujące się na to konto po nazwie przestają działać
      - Zapisane poświadczenia i wpisy w plikach konfiguracyjnych aplikacji przestają pasować
      - Narzędzia zarządzające łączące się po nazwie konta tracą dostęp
      - Uprawnienia, hasło i profil konta pozostają bez zmian, bo zmienia się tylko nazwa
    en:
      - Scripts and scheduled tasks signing in to this account by name stop working
      - Saved credentials and entries in applications' configuration files stop matching
      - Management tools connecting by account name lose access
      - The account's rights, password and profile stay unchanged, since only the name changes
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Dostęp do maszyny opiera się wyłącznie na tym koncie i nie ma drugiego konta administracyjnego
      - Nie wiadomo, które skrypty i narzędzia odwołują się do tego konta po nazwie
    en:
      - Access to the machine rests solely on this account and there is no second administrative account
      - It is not known which scripts and tools refer to this account by name
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
      if ($os.ProductType -eq 2) {
        # A domain controller keeps no local accounts. The built-in administrator
        # is a domain account there and falls under a separate item.
        'NOT_APPLICABLE'
      }
      else {
        # The built-in account is found by the ending of its identifier, not by
        # name. The default names below are written without letters outside the
        # basic alphabet, so that the check does not depend on the encoding in
        # which the command reaches the shell.
        $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
        if ($null -eq $account) { 'CHECK_ERROR' }
        elseif ($account.Name -match '^(administrator|administrador|administrateur|amministratore|rendszergazda)$') { 'DEFAULT_NAME' }
        else { 'RENAMED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'RENAMED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    [pscustomobject]@{
      sid     = $account.SID.Value
      name    = $account.Name
      existed = ($null -ne $account)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A name unconnected with the role, so that it gives nothing away. The
    # identifier does not change, so rights, password and profile stay as they
    # were - only what is typed at a sign-in changes.
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    $new = 'svcadm-' + (Get-Random -Minimum 1000 -Maximum 9999)
    Rename-LocalUser -SID $account.SID -NewName $new
    "Renamed to $new"

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous name - refusing to guess one.' }
    Rename-LocalUser -SID $b.sid -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-administrator-account

notes:
  pl: |
    Audyt rozpoznaje konto po końcówce identyfikatora, a nazwy domyślne
    porównuje z listą obejmującą kilka wersji językowych. Lista jest zapisana
    bez liter spoza alfabetu podstawowego, żeby wynik nie zależał od
    kodowania, w jakim polecenie dociera do powłoki.

    Wartość punktu jest umiarkowana i tak ją oceniam. Przemianowanie nie ukrywa
    konta przed kimś, kto jest już w środku — utrudnia natomiast etap
    poprzedzający wejście, czyli ten, na którym napastnik zgaduje.

    Punkt tworzy parę z blokadą konta. Nazwa nieznana napastnikowi wymusza
    więcej prób, a więcej prób to właśnie to, co blokada ma wyłapać.
  en: |
    The audit recognises the account by the ending of its identifier, and
    compares the default names against a list covering several language
    versions. The list is written without letters outside the basic alphabet, so
    that the result does not depend on the encoding in which the command reaches
    the shell.

    The item's value is moderate and I rate it as such. Renaming does not hide
    the account from somebody already inside - what it hinders is the stage
    before entry, the one where an attacker guesses.

    The item forms a pair with the account lockout. A name unknown to an
    attacker forces more attempts, and more attempts is exactly what a lockout
    is there to catch.
