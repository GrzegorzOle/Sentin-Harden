id: win10-dont-display-last-username

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nazwa ostatnio zalogowanego użytkownika ukryta na ekranie logowania
    en: Last signed-in user name hidden on the sign-in screen
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Po wylogowaniu system zostawia na ekranie nazwę osoby, która korzystała z
    maszyny ostatnio. Wystarczy podejść, żeby dowiedzieć się, czyj to sprzęt i jak
    nazywa się konto w tej organizacji.

    Wartość tej informacji dla napastnika jest realna, ale ograniczona: schemat
    nazw kont zwykle daje się odgadnąć innymi drogami, a przy maszynie osobistej
    właściciel bywa znany i tak. Dlatego punkt ma niską kategorię ryzyka, choć
    sama zasada jest słuszna.

    Po zmianie ekran pokazuje puste pola: nazwę konta trzeba wpisać za każdym
    razem.
  en: |
    After a sign-out the system leaves on the screen the name of whoever used the
    machine last. Walking up to it is enough to learn whose hardware it is and
    what the account is called within the organisation.

    The value of that to an attacker is real but limited - the account naming
    scheme can usually be worked out by other roads, and with a personal machine
    the owner tends to be known anyway. Hence the low risk rating, though the rule
    itself is sound.

    After the change the screen shows empty fields - the account name has to be
    typed every time.

disruption_description:
  pl: |
    To jest zmiana, którą użytkownik odczuwa przy każdym logowaniu, i dlatego
    trafia do klasy wymagającej świadomego wdrożenia. Nie dlatego, że coś psuje,
    tylko dlatego, że zmienia codzienny odruch setek osób naraz.

    Skutki uboczne są przewidywalne: w domenie trzeba wpisywać pełną nazwę konta,
    rośnie liczba pomyłek, a przy ostrym progu blokady rośnie liczba
    zablokowanych kont w pierwszych dniach. Wdrożenie bez uprzedzenia ludzi
    kończy się falą zgłoszeń, a nie poprawą bezpieczeństwa.

    Osobno trzeba sprawdzić stanowiska bez klawiatury — kioski, panele dotykowe,
    maszyny w hali — gdzie wpisanie nazwy konta bywa kłopotliwe albo niemożliwe.
  en: |
    This is a change the user feels at every sign-in, and that is why it goes into
    the class needing a planned rollout. Not because it breaks anything, but
    because it changes the daily reflex of hundreds of people at once.

    The side effects are predictable - in a domain the full account name has to be
    typed, mistakes grow more frequent, and with a tight lockout threshold so does
    the number of locked accounts in the first days. Deploying it without warning
    people ends in a wave of tickets rather than better security.

    Stations with no keyboard have to be checked separately - kiosks, touch
    panels, machines on a shop floor - where typing an account name is awkward or
    impossible.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Nazwę konta trzeba będzie wpisywać przy każdym logowaniu, w domenie razem z nazwą domeny
      - Stanowiska bez klawiatury fizycznej, kioski i panele dotykowe stają się trudne w obsłudze
      - Liczba nieudanych prób logowania rośnie w pierwszych dniach, co przy niskim progu blokady prowadzi do blokowania kont
      - Procedury pomocy technicznej oparte na odczytaniu nazwy konta z ekranu przestaną działać
      - Logowanie kartą inteligentną, dostęp do zasobów, drukowanie i praca po zalogowaniu pozostają bez zmian
    en:
      - The account name has to be typed at every sign-in, in a domain together with the domain name
      - Stations with no physical keyboard, kiosks and touch panels become awkward to use
      - The number of failed sign-in attempts grows in the first days, which with a low lockout threshold leads to locked accounts
      - Support procedures built on reading the account name off the screen stop working
      - Smart card sign-in, access to resources, printing and work after signing in are all unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Kioski, panele dotykowe i stanowiska bez wygodnej klawiatury, gdzie wpisanie nazwy konta jest realną przeszkodą
      - Środowiska z niskim progiem blokady konta, dopóki użytkownicy nie zostaną uprzedzeni o zmianie
      - Stanowiska produkcyjne wymagające szybkiego logowania przy zmianie zmiany
    en:
      - Kiosks, touch panels and stations with no comfortable keyboard, where typing an account name is a genuine obstacle
      - Environments with a low account lockout threshold, until users have been warned of the change
      - Production stations calling for a quick sign-in at a shift change
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'DontDisplayLastUserName'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'DontDisplayLastUserName'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontDisplayLastUserName' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-display-last-user-name

notes:
  pl: |
    Wartość leży poza gałęzią zasad grupy, wprost w gałęzi zasad systemowych —
    to samo miejsce, z którego korzysta kilka innych reguł z tego obszaru.
    Ustawienie dotyczy wyłącznie ostatniego zalogowania; wykaz kont z otwartą
    sesją zamyka osobna reguła.
  en: |
    The value lies outside the group policy branch, directly in the system policy
    one - the same place several other rules in this area use. The setting covers
    the last sign-in alone; the list of accounts with an open session is closed by
    a separate rule.
