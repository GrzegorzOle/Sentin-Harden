id: win11-password-history-size

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Liczba pamiętanych poprzednich haseł
    en: Number of remembered previous passwords
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Bez pamięci poprzednich haseł wymuszona zmiana jest pozorna: użytkownik
    ustawia to samo hasło, które właśnie wygasło, i wszystko wraca do punktu
    wyjścia. Materiał, który wyciekł, znów jest aktualny, a data zmiany
    w raporcie sugeruje coś, co się nie wydarzyło.

    Historia haseł zamyka tę furtkę. Nie jest zabezpieczeniem samodzielnym —
    ma sens wyłącznie razem z wygasaniem haseł, któremu służy. Bez niego
    wygasanie jest kosztem bez efektu.
  en: |
    Without a memory of previous passwords a forced change is only apparent: the
    user sets the same password that has just expired and everything returns to
    the starting point. Leaked material is current again, while the change date
    in the report suggests something that did not happen.

    Password history closes that door. It is not a standalone safeguard - it
    makes sense only together with password expiry, which it serves. Without it,
    expiry is a cost with no effect.

disruption_description:
  pl: |
    Dla użytkownika zmiana jest odczuwalna dokładnie raz: przy najbliższej
    zmianie hasła, kiedy system odrzuci wariant, którego już używał.
    Najczęstszy objaw to nie tyle problem, co irytacja — hasło różniące się
    jedną cyfrą zwykle nadal przechodzi, więc pilnowanie historii samo w sobie
    nie wymusza lepszych haseł.

    Realny kłopot dotyczy kont używanych przez oprogramowanie: jeśli hasło jest
    wpisane w konfiguracji, a procedura zakłada jego cykliczny powrót do
    ustalonej wartości, historia to uniemożliwi.
  en: |
    For the user the change is felt exactly once: at the next password change,
    when the system rejects a variant they have already used. The most common
    symptom is less a problem than an irritation - a password differing by one
    digit usually still passes, so keeping history does not by itself force
    better passwords.

    The real trouble concerns accounts used by software: if the password sits in
    a configuration and the procedure assumes it periodically returns to an
    agreed value, the history makes that impossible.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Procedury zakładające cykliczny powrót hasła konta do ustalonej wartości przestaną się powodzić
      - Użytkownicy nie ustawią ponownie hasła, którego już używali, i zgłoszą to jako usterkę
      - Konta usługowe z hasłem wpisanym w konfiguracji wymagają nowej wartości przy każdej zmianie
    en:
      - Procedures assuming an account password periodically returns to an agreed value stop succeeding
      - Users cannot set a password they have used before and will report it as a fault
      - Service accounts with a password in their configuration need a fresh value at every change
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie działa konto usługowe, którego hasło jest przywracane do stałej wartości procedurą
      - Organizacja nie stosuje wygasania haseł, więc historia nie ma czemu służyć
    en:
      - The machine runs a service account whose password is restored to a fixed value by a procedure
      - The organisation does not use password expiry, so the history has nothing to serve
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^PasswordHistorySize\s*=\s*(\d+)') { $Matches[1] }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '24'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^PasswordHistorySize\s*=\s*(\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'PasswordHistorySize'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'PasswordHistorySize = 24',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('PasswordHistorySize = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/enforce-password-history

notes:
  pl: |
    Kategoria ryzyka jest niska, bo sam punkt niczego nie zamyka — podnosi
    natomiast skuteczność wygasania haseł, z którym tworzy parę. Wdrożony bez
    wygasania nie daje nic poza wpisem w raporcie.
  en: |
    The risk category is low, because the item closes nothing on its own - what
    it does is make password expiry effective, with which it forms a pair.
    Rolled out without expiry it gives nothing beyond an entry in the report.
