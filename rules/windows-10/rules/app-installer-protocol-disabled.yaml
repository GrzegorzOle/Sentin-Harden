id: win10-app-installer-protocol-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Desktop App Installer
  title:
    pl: Instalacja pakietu odnośnikiem z przeglądarki zablokowana
    en: The laying on of a package by a link from a browser blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza obsługę odnośnika, który po kliknięciu w przeglądarce
    uruchamia instalator pakietów i podaje mu adres do pobrania.

    Mechanizm ten powstał po to, żeby instalacja ze strony internetowej
    była jednym kliknięciem. Strona podaje odnośnik we własnym schemacie,
    system rozpoznaje go, otwiera instalator i ten pobiera pakiet
    ze wskazanego adresu.

    Droga jest krótka i to jest jej wadą. Kliknięcie w odnośnik na
    stronie albo w wiadomości prowadzi wprost do pobrania i instalacji,
    z pominięciem kroku, w którym użytkownik widzi plik, jego nazwę
    i miejsce zapisania. Zniknięcie tego kroku zabiera jedyny moment,
    w którym coś mogło wydać się podejrzane.

    Mechanizm ten był wykorzystywany w kampaniach rozsyłających odnośniki
    udające instalatory znanych programów — właśnie dlatego, że wygląda
    jak zwykłe kliknięcie i nie wymaga od odbiorcy niczego więcej.

    Odnotowuję, że punkt nie blokuje instalowania z sieci w ogóle. Pakiet
    pobrany osobno i uruchomiony ręcznie zainstaluje się tak jak dotąd.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: instalację
    z jednego kliknięcia w odnośnik przysłany z zewnątrz.
  en: |
    The setting switches off the serving of a link which, pressed in a browser, sets going the installer of
    packages and gives it an address to draw from.

    That mechanism came about so that the laying on from a page of the web should be one press. The page gives a
    link in a scheme of its own, the system knows it, opens the installer, and that draws the package from the
    given address.

    The road is short and therein lies its fault. A press upon a link in a page or in a message leads straight to
    a drawing and a laying on, the step being passed over in which the user sees the file, its name and the place
    of its keeping. The vanishing of that step takes away the one moment at which something might have seemed
    amiss.

    That mechanism was used in campaigns sending about links got up as installers of known programs - for the very
    reason that it looks like an ordinary press and asks nothing further of whoever gets it.

    I set down that the item blocks not the laying on out of the network altogether. A package drawn apart and set
    going by hand will be laid on as hitherto.

    What an attacker gains while the item goes unmet: a laying on from one press upon a link sent in from outside.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    w organizacji istnieje strona rozdająca oprogramowanie tą drogą.

    Miejscem wartym uwagi jest wewnętrzny katalog programów. Strony takie
    bywają zbudowane właśnie na odnośnikach uruchamiających instalator
    i po zmianie przyciski przestaną działać. Kliknięcie nic nie zrobi
    albo przeglądarka zapyta o program do otwarcia odnośnika.

    Odnotowuję, że rozwiązaniem jest podanie na stronie zwykłego odnośnika
    do pliku. Użytkownik pobiera go i uruchamia, co jest jednym krokiem
    więcej, ale krokiem, w którym widzi, co pobrał.

    Miejscem drugim są instrukcje wdrożeniowe producentów oprogramowania,
    które prowadzą użytkownika przez taki odnośnik. Po zmianie instrukcja
    przestanie się zgadzać z tym, co widać na ekranie.

    Skutek pojawia się natychmiast, bez restartu, i jest widoczny dla
    użytkownika.

    Czego to nie psuje: pobierania pakietów wprost, instalowania ich
    ręcznie, sklepu systemowego, programów już zainstalowanych,
    drukowania.
  en: |
    The class is "needs review", and the object of the review is whether there stands in the body a page handing
    out software by this road.

    The place worth notice is an inner catalogue of programs. Such pages are at times built upon these very links
    setting the installer going, and after the change the buttons will cease to work. A press will do nothing, or
    the browser will ask which program is to open the link.

    I set down that the answer is the giving upon the page of an ordinary link to the file. The user draws it and
    sets it going, which is one step more, but a step at which they see what they drew.

    The second place is the directions for rollout of makers of software, which lead the user through such a link.
    After the change the directions will cease to agree with what stands upon the screen.

    The consequence shows at once, with no restart, and is plain to the user.

    What this does not break: the drawing of packages outright, the laying of them on by hand, the system's store,
    programs already laid on, or printing.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - email-and-attachments
    - legacy-applications
  what_breaks:
    pl:
      - Przyciski instalacji na wewnętrznej stronie z katalogiem programów przestaną działać
      - Kliknięcie nic nie zrobi albo przeglądarka zapyta o program do otwarcia odnośnika, co użytkownik zgłosi jako awarię
      - Rozwiązaniem jest podanie na stronie zwykłego odnośnika do pliku, który użytkownik pobiera i uruchamia sam
      - Instrukcje wdrożeniowe producentów prowadzące przez taki odnośnik przestaną zgadzać się z ekranem
      - Pobieranie pakietów wprost, sklep systemowy, programy już zainstalowane, logowanie i drukowanie pozostają bez zmian
    en:
      - Buttons of laying on upon an inner page with a catalogue of programs will cease to work
      - A press will do nothing, or the browser will ask which program is to open the link, which the user will report as a breakdown
      - The answer is the giving upon the page of an ordinary link to the file, which the user draws and sets going themselves
      - Directions for rollout of makers leading through such a link will cease to agree with the screen
      - The drawing of packages outright, the system s store, programs already laid on, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Wewnętrzny katalog programów rozdaje oprogramowanie wyłącznie przez odnośniki uruchamiające instalator
    en:
      - An inner catalogue of programs hands out software solely through links setting the installer going
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'EnableMSAppInstallerProtocol'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    $name = 'EnableMSAppInstallerProtocol'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppInstaller'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableMSAppInstallerProtocol' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/msix/app-installer/installing-windows10-apps-web

notes:
  pl: |
    Reguła jest w tym bloku najbliższa codziennemu doświadczeniu
    użytkownika i warto, żeby aplikacja napisała to jego językiem. Punkt
    nie odbiera instalowania programów. Odbiera instalowanie ich jednym
    kliknięciem w odnośnik przysłany z zewnątrz.

    Argument wart zachowania dotyczy tego, co znika razem z tym
    kliknięciem. Znika krok, w którym użytkownik widzi pobrany plik: jego
    nazwę, rozmiar i miejsce. To jedyny moment, w którym podszycie się
    pod znany program bywa zauważone, a mechanizm ten właśnie ten moment
    usuwa.

    Odnotowuję rozwiązanie po stronie strony wewnętrznej. Zwykły odnośnik
    do pliku daje ten sam skutek kosztem jednego kliknięcia więcej —
    i warto, żeby aplikacja to wymieniła, bo inaczej punkt wygląda na
    odcięcie użytkownika od oprogramowania.
  en: |
    The rule is in this block the nearest to the user's daily lot and it is well that the application write it in
    their tongue. The item takes not the laying on of programs. It takes the laying of them on by one press upon a
    link sent in from outside.

    The argument worth keeping touches what goes along with that press. There goes the step at which the user sees
    the drawn file: its name, its size and its place. That is the one moment at which a getting up as a known
    program is at times marked, and this mechanism takes away just that moment.

    I set down the answer upon the side of the inner page. An ordinary link to the file gives the same upshot at
    the cost of one press more - and it is well that the application name that, the item otherwise looking like a
    cutting off of the user from software.
