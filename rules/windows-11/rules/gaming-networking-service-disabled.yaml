id: win11-gaming-networking-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa łączności sieciowej platformy gier wyłączona
    en: The network connectivity service of the gaming platform disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zestawia łączność między tą maszyną a innymi uczestnikami rozgrywki.
    Jej zadaniem jest doprowadzić do połączenia bezpośredniego również wtedy,
    gdy obie strony siedzą za urządzeniami przekładającymi adresy, a więc
    w sytuacji, w której połączenie przychodzące normalnie nie dochodzi.

    To jest właśnie powód, dla którego ta reguła ma wyższą kategorię ryzyka
    niż pozostałe z rodziny, i warto powiedzieć go wprost. Usługa nie jest
    biernym składnikiem rozrywki — jej zadaniem jest przebić się przez
    ograniczenia sieci. Robi to sama, bez pytania i bez śladu w miejscu,
    w którym ktokolwiek zarządza dostępem do sieci.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: obecność na
    maszynie składnika, który potrafi zestawić połączenie z drugą stroną mimo
    zapory i mimo przekładania adresów, i który do tego celu utrzymuje
    łączność z pośrednikiem w sieci publicznej. Nie jest to droga wejścia sama
    w sobie, ale jest to mechanizm dokładnie tego rodzaju, jakiego napastnik
    potrzebuje po wejściu inną drogą.

    Osobno liczy się to, że ruch zestawiony w ten sposób jest trudny do
    powiązania z czymkolwiek przy oglądaniu dzienników sieciowych.
  en: |
    The service sets up connectivity between this machine and other participants in a
    game. Its task is to bring about a direct connection even where both sides sit behind
    devices translating addresses, that is in a situation where an incoming connection
    normally does not get through.

    That is exactly why this rule carries a higher risk category than the family's
    others, and it is worth saying outright. The service is not a passive part of
    entertainment - its task is to break through the network's limits. It does so of its
    own accord, without asking and with no trace in any place where anybody manages
    access to the network.

    What an attacker gains while the item goes unmet: the presence on the machine of a
    component able to set up a connection with the other side despite a firewall and
    despite address translation, and which for that purpose keeps up contact with an
    intermediary on the public network. It is not a way in by itself, but it is a
    mechanism of exactly the kind an attacker needs after entering by another route.

    It counts separately that traffic set up in this way is hard to tie to anything when
    network logs are looked over.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy pozostałych składnikach rodziny:
    czy gry ze sklepu systemowego są na tej maszynie używane i dopuszczone.

    Po wyłączeniu usługi rozgrywka przez sieć przestaje działać, przy czym
    objawem bywa nie komunikat o błędzie, tylko niemożność dołączenia do
    rozgrywki bez wyjaśnienia. Gra uruchamiana pojedynczo działa dalej.

    Na zwykłym stanowisku biurowym zmiana nie robi nic. Warto jednak sprawdzić
    dwie rzeczy mniej oczywiste.

    Pierwsza: część programów niebędących grami korzysta z tej samej warstwy
    łączności do zestawiania połączeń bezpośrednich między maszynami. Jest to
    rozwiązanie rzadkie, ale gdy zachodzi, skutkiem jest cicha utrata
    łączności, bez komunikatu.

    Druga: stanowiska świetlicowe i szkoleniowe z dopuszczonymi grami, gdzie
    rozgrywka przez sieć bywa celem, a nie skutkiem ubocznym.

    Zwykła praca sieciowa — przeglądanie, poczta, udziały, programy branżowe —
    nie ma z tą usługą nic wspólnego i nie zmienia się w żaden sposób.

    Zmiana wymaga zatrzymania usługi.
  en: |
    The same needs checking as with the family's other components: whether games from the
    system store are used and allowed on this machine.

    Once the service is off, play over the network stops working, and the symptom is
    sometimes not an error message but an inability to join a game with no explanation. A
    game played alone carries on working.

    At an ordinary office station the change does nothing. Two less obvious things are
    worth checking, though.

    The first: some programs that are not games use the same connectivity layer to set up
    direct connections between machines. That arrangement is rare, but where it holds the
    effect is a silent loss of connectivity, with no message.

    The second: common room and training stations with games allowed, where play over the
    network is sometimes the point rather than a side effect.

    Ordinary network work - browsing, mail, shares, line-of-business programs - has
    nothing to do with this service and does not change in any way.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Rozgrywka przez sieć przestaje działać, zwykle bez komunikatu o przyczynie
      - Program niebędący grą, korzystający z tej warstwy łączności, cicho traci połączenie
      - Gra uruchamiana pojedynczo działa dalej bez zmiany
      - Przeglądanie, poczta, udziały i programy branżowe nie zmieniają się w żaden sposób
    en:
      - Play over the network stops working, usually with no message about the cause
      - A program that is not a game but uses this connectivity layer silently loses its connection
      - A game played alone carries on working unchanged
      - Browsing, mail, shares and line-of-business programs do not change in any way
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko świetlicowe albo szkoleniowe ma dopuszczoną rozgrywkę przez sieć
      - Program niebędący grą zestawia połączenia bezpośrednie przez tę warstwę łączności
    en:
      - A common room or training station has play over the network allowed
      - A program that is not a game sets up direct connections through this connectivity layer
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XboxNetApiSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XboxNetApiSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XboxNetApiSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XboxNetApiSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła domyka czwórkę opisującą platformę gier i jest w niej pozycją
    o najwyższej wadze. Jeżeli wdraża się tylko część rodziny, ta powinna być
    pierwsza — pozostałe trzy dotyczą tożsamości, zapisów i sprzętu, ta dotyczy
    zestawiania połączeń przez ograniczenia sieci.

    Punkt nie zastępuje reguł zapory ani ustawień ograniczających ruch
    wychodzący. Zdejmuje jeden konkretny mechanizm obchodzenia tych ograniczeń,
    a nie wszystkie.

    Wyłączenie usługi nie wpływa na zwykłą łączność sieciową maszyny.
    Mechanizmy przekładania adresów i zapora działają dalej tak samo jak
    wcześniej.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule closes the quartet describing the gaming platform and is the weightiest item
    in it. If only part of the family is applied, this should be first - the other three
    concern identity, saves and hardware, this one concerns setting up connections
    through the network's limits.

    The item does not stand in for firewall rules or settings limiting outgoing traffic.
    It takes away one particular mechanism for getting round those limits, not all of
    them.

    Disabling the service bears on the machine's ordinary network connectivity not at
    all. Address translation and the firewall carry on just as before.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
