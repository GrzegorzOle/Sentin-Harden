id: win2016-dont-display-last-username

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nazwa ostatnio zalogowanego użytkownika ukryta na ekranie logowania
    en: Last signed-in user name hidden on the sign-in screen
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby ekran logowania nie pokazywał nazwy osoby, która
    logowała się ostatnio.

    Wartość tej zmiany jest ograniczona i warto powiedzieć to wprost, zamiast
    podpierać ją ogólnikiem o zmniejszaniu powierzchni ataku. Nazwa konta nie
    jest tajemnicą: da się ją zwykle wyprowadzić z adresu pocztowego, z nazwy
    w katalogu albo z metadanych dokumentu. Ukrycie jej na ekranie nie zamyka
    żadnej drogi.

    To, co ta zmiana faktycznie robi, jest węższe i dotyczy konkretnej
    sytuacji. Serwer, do którego ktoś ma fizyczny dostęp albo podgląd przez
    konsolę hipernadzorcy, przestaje sam z siebie odpowiadać na pytanie „kto
    tutaj administruje". Różnica ma znaczenie tam, gdzie konta administracyjne
    nie nazywają się jak konta zwykłe — bo wtedy nazwa na ekranie jest
    wskazówką, które konto warto atakować.

    Druga sytuacja to serwer udostępniający sesje zdalne. Ekran logowania
    widzi tam każdy, kto dosięgnie usługi, a więc potencjalnie ktoś spoza
    organizacji. Nazwa administratora pokazana takiej osobie jest już nie
    drobiazgiem, tylko podpowiedzią.

    Kategoria niska i taka ma pozostać. Punkt jest higieną, nie zabezpieczeniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową nazwę
    konta o podwyższonych uprawnieniach, odczytaną z ekranu bez żadnego
    działania, które zostawiłoby ślad.
  en: |
    The item requires that the sign-in screen not show the name of the person who
    signed in last.

    The worth of this change is limited, and that is worth saying outright rather
    than propping it up with a generality about reducing the attack surface. An
    account name is no secret: it can usually be derived from a mail address, from a
    name in the directory, or from a document's metadata. Hiding it on the screen
    closes no road.

    What the change actually does is narrower and concerns a particular situation. A
    server to which somebody has physical access, or a view through the hypervisor's
    console, stops answering of its own accord the question "who administers here".
    The difference matters where administrative accounts are not named as ordinary
    ones are - because then the name on the screen is a hint as to which account is
    worth attacking.

    The second situation is a server offering remote sessions. There the sign-in
    screen is seen by anybody who can reach the service, and so possibly by somebody
    outside the organisation. An administrator's name shown to such a person is no
    longer a trifle but a pointer.

    The category is low and so it should stay. The item is hygiene, not a safeguard.

    What an attacker gains while the item goes unmet: a ready name of an account
    with raised privileges, read off the screen without any action that would leave
    a trace.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", i to nie ze względu na ryzyko, tylko na
    codzienną wygodę, która potrafi zamienić się w telefon do działu wsparcia.

    Po zmianie każde logowanie zaczyna się od wpisania nazwy konta. Na maszynie
    z jednym administratorem jest to sekunda. Na serwerze sesji zdalnych,
    z którego korzysta kilkadziesiąt osób nawykłych do klikania w gotową nazwę,
    pierwszy dzień po zmianie wygląda inaczej.

    Drugi scenariusz jest cichszy i dlatego wart uwagi. Konta domenowe trzeba
    wtedy podawać w pełnej postaci, z domeną — a część osób nie wie, w jakiej
    domenie ma konto, bo nigdy nie musiała tego pisać. Pomaga uprzedzenie
    z gotowym wzorem nazwy, a nie objaśnianie tego przy telefonie.

    Trzeci dotyczy automatyzacji. Skrypty i narzędzia sterujące pulpitem, które
    wypełniają pola logowania na podstawie ich położenia na ekranie, po zmianie
    trafiają w inny układ.

    Czego to nie psuje: samego uwierzytelniania, sesji już otwartych,
    logowania z zapisanymi poświadczeniami ani kont usług.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and not on account of risk but of the daily
    convenience that can turn into a call to the support desk.

    After the change every sign-in begins with typing the account name. On a machine
    with one administrator that is a second. On a remote session server used by some
    dozens of people accustomed to clicking a name already there, the first day
    after the change looks different.

    The second scenario is quieter and worth attention for that reason. Domain
    accounts then have to be given in full, with the domain - and some people do not
    know which domain their account is in, having never had to type it. Fair warning
    with a ready pattern of the name helps; explaining it over the telephone does
    not.

    The third concerns automation. Scripts and desktop-driving tools that fill the
    sign-in fields by their position on the screen meet a different layout after the
    change.

    What this does not break: authentication itself, sessions already open, signing
    in with saved credentials, or service accounts.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - remote-desktop
  what_breaks:
    pl:
      - Każde logowanie zaczyna się od wpisania nazwy konta, co na serwerze sesji zdalnych czuje kilkadziesiąt osób naraz
      - Konta domenowe trzeba podawać w pełnej postaci z domeną, której część osób nigdy nie musiała pisać
      - Skrypty wypełniające pola logowania na podstawie ich położenia na ekranie trafiają w inny układ
      - Uwierzytelnianie, sesje już otwarte i konta usług pozostają bez zmian
    en:
      - Every sign-in begins with typing the account name, which on a remote session server is felt by dozens of people at once
      - Domain accounts have to be given in full with the domain, which some people have never had to type
      - Scripts filling the sign-in fields by their position on the screen meet a different layout
      - Authentication, sessions already open and service accounts stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwer sesji zdalnych obsługuje osoby, których nie da się uprzedzić o zmianie przed jej wprowadzeniem
      - Na maszynie pracują narzędzia sterujące pulpitem, które wypełniają pola logowania po ich położeniu
    en:
      - A remote session server serves people who cannot be warned of the change before it is made
      - Desktop-driving tools run on the machine that fill the sign-in fields by their position
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'DontDisplayLastUserName'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'DontDisplayLastUserName'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DontDisplayLastUserName' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-display-last-user-name

notes:
  pl: |
    Punkt należy pokazywać jako tani, a nie jako ważny. Jego miejsce w raporcie
    jest w dolnej części listy roboczej: koszt bliski zeru, zysk również
    niewielki.

    Sensowniej brzmi w zestawieniu z regułą o ukrywaniu ostatniej nazwy przy
    sesjach zdalnych i z regułą o zmianie nazwy konta wbudowanego administratora.
    Osobno każda z tych trzech jest drobiazgiem; razem składają się na maszynę,
    która nie przedstawia się napastnikowi sama.

    Odpuszczenie punktu na serwerze sesji zdalnych o dużym obłożeniu jest
    decyzją obronną i warto ją zapisać jako wyjątek, a nie jako zaniedbanie.
  en: |
    The item should be shown as cheap rather than as important. Its place in the
    report is in the lower part of the working list: a cost near zero and a gain
    likewise small.

    It reads more sensibly set beside the rule on hiding the last name in remote
    sessions and the rule on renaming the built-in administrator account. Apart,
    each of those three is a trifle; together they make up a machine that does not
    introduce itself to an attacker.

    Letting the item go on a heavily used remote session server is a defensible
    decision, and it is worth recording as an exception rather than as neglect.
