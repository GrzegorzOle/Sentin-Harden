id: win2016-first-logon-animation-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Powitanie przy pierwszym logowaniu wyłączone
    en: The greeting at a first logon switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza powitanie wyświetlane przy pierwszym logowaniu
    nowego konta.

    Uzasadnienie tego punktu jest skromne i nie ma powodu udawać inaczej.
    Powitanie jest sekwencją ekranów pokazywanych, gdy system przygotowuje
    profil. Zajmuje czas, przykrywa to, co się dzieje, i w części wydań
    proponuje przy okazji ustawienia, których nikt nie zamawiał.

    Rzecz, która ma znaczenie praktyczne, dotyczy widoczności. Przy
    przygotowywaniu profilu bywają błędy — brak miejsca, niedostępny
    udział z profilem, zasada, która nie dochodzi. Powitanie te błędy
    przykrywa i pokazuje zamiast nich ekran powitalny, więc pierwsze
    logowanie kończy się pozornie dobrze, a kłopot wychodzi później.

    Na serwerze nowe konta logują się rzadko, więc punkt jest w dużej
    mierze porządkowy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio — wartość reguły leży w przejrzystości pierwszego
    logowania, nie w obronie.
  en: |
    The setting switches off the greeting shown at the first logon of a new account.

    This item's warrant is a modest one and there is no cause to pretend otherwise. The greeting is a sequence of
    screens shown while the system prepares the profile. It takes time, covers what is going on, and in some
    releases proposes along the way settings nobody ordered.

    The thing of practical weight concerns visibility. At the preparing of a profile there are at times errors -
    a want of room, an unreachable share holding the profile, a policy that does not arrive. The greeting covers
    those errors and shows a welcome screen in their stead, so the first logon ends seemingly well and the
    trouble comes out later.

    On a server new accounts log in seldom, so the item is in large part one of order.

    What an attacker gains while the item goes unmet: nothing directly - the rule's value lies in the clarity of a
    first logon, not in defence.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Pierwsze logowanie przestaje pokazywać powitanie i przechodzi wprost
    do pulpitu. Przygotowanie profilu odbywa się tak jak dotąd, tylko bez
    niczego wyświetlonego na wierzchu.

    Zmiana dotyczy wyłącznie pierwszego logowania konta. Kolejne logowania
    wyglądają tak samo jak dotąd, bo powitania i tak przy nich nie ma.

    Nie ma znanych regresji.

    Czego to nie psuje: zakładania kont, przygotowywania profilu, profili
    mobilnych, przekierowanych folderów, zasad przypisanych do konta,
    aplikacji, usług.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "no disruption".

    A first logon ceases to show the greeting and goes straight to the desktop. The preparing of the profile
    happens just as before, only without anything shown on top of it.

    The change concerns solely a first logon of an account. Later logons look just as before, there being no
    greeting at them anyway.

    There are no known regressions.

    What this does not break: the making of accounts, the preparing of a profile, roaming profiles, redirected
    folders, the policies bound to an account, applications, or services.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
  what_breaks:
    pl:
      - Pierwsze logowanie nowego konta przechodzi wprost do pulpitu, bez sekwencji ekranów powitalnych
      - Przygotowanie profilu odbywa się tak jak dotąd, a błędy przy nim przestają być przykryte
      - Kolejne logowania tego samego konta wyglądają tak samo jak dotąd
      - Zakładanie kont, profile mobilne i przekierowane foldery pozostają bez zmian
    en:
      - The first logon of a new account goes straight to the desktop, without the sequence of welcome screens
      - The preparing of the profile happens just as before, and the errors at it cease to be covered
      - Later logons of the same account look just as before
      - The making of accounts, roaming profiles and redirected folders stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Powitanie jest na tej maszynie częścią przyjętej procedury wdrażania nowego konta
    en:
      - The greeting is on this machine part of an accepted procedure for setting a new account up
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # This key sits outside the Policies\Microsoft branch, and the value is
      # affirmative: switching off is a zero, not a one.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableFirstLogonAnimation'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableFirstLogonAnimation'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The first logon stops showing the greeting and goes straight to the
    # desktop. The preparing of the profile happens as before, only without
    # anything shown on top of it.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableFirstLogonAnimation' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/

notes:
  pl: |
    Punkt zamyka blok i jest w nim najlżejszy. Warto go pokazywać na końcu
    i nie robić z niego więcej, niż jest.

    Argument wart zachowania dotyczy widoczności, nie obrony. Powitanie
    przykrywa błędy przygotowania profilu, więc pierwsze logowanie kończy
    się pozornie dobrze, a kłopot ujawnia się później i w innym miejscu.
    Jest to argument z porządku pracy, a nie z bezpieczeństwa, i lepiej
    postawić go wprost niż podnosić kategorię bez pokrycia.

    Odnotowuję cechę wartą uwagi przy odczycie: wartość jest twierdząca,
    więc wyłączeniu odpowiada zero, a nie jedynka. Jest to odwrotnie niż
    w większości reguł tego zestawu i przy ręcznym sprawdzaniu prowadzi
    do pomyłek.

    Reguła leży w tej samej gałęzi co dwie inne w tym bloku — gałąź zasad
    systemowych zbiera ustawienia o bardzo różnym przeznaczeniu i warto
    o tym pamiętać przy wycofywaniu zmian.
  en: |
    The item shuts the block and is the lightest in it. It is worth showing at the end and making no more of it
    than it is.

    The argument worth keeping concerns visibility, not defence. The greeting covers the errors of a profile's
    preparing, so a first logon ends seemingly well and the trouble shows itself later and in another place. It
    is an argument from the order of work rather than from security, and better set down outright than used to
    raise a category without backing.

    Worth noting a feature deserving attention at the reading: the value is affirmative, so a switching off
    answers to a zero and not a one. That is the reverse of most rules in this set and at a checking by hand
    leads to mistakes.

    The rule lies in the same branch as two others in this block - the branch of system policies gathers settings
    of very different purposes and that is worth keeping in mind when undoing changes.
