id: win10-logon-hours-expiry-forced-logoff

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wylogowanie po upływie dozwolonych godzin pracy wymuszane
    en: The signing out once the allowed working hours pass enforced
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że sesja sieciowa konta, któremu wyznaczono godziny
    pracy, kończy się z chwilą ich upływu, zamiast trwać dalej.

    Godziny pracy konta są ograniczeniem, które bez tego ustawienia dotyczy
    wyłącznie chwili logowania. Konto zalogowane przed granicą pozostaje
    zalogowane po niej i zachowuje pełny dostęp do zasobów.

    Znaczy to, że ograniczenie działa przeciw komuś, kto próbuje wejść poza
    godzinami, a nie działa przeciw komuś, kto wszedł wcześniej i został.
    Napastnik, który przejął poświadczenia, mieści się w tym drugim
    przypadku bez żadnego wysiłku.

    Reguła ma sens tylko tam, gdzie godziny pracy w ogóle wyznaczono.
    Na maszynie, gdzie żadne konto ich nie ma, ustawienie jest poprawne
    i bezskutkowe — i warto, żeby aplikacja tego nie przedstawiała jako
    zabezpieczenia czynnego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sesję
    trwającą bez ograniczeń czasowych mimo wyznaczonych kontu godzin pracy.
  en: |
    The setting makes the network session of an account with set working hours end at the moment they pass,
    rather than carry on.

    An account's working hours are a bound which, without this setting, touches the moment of logging on alone.
    An account logged on before the boundary stays logged on past it and keeps its full reach to resources.

    Which means the bound works against somebody trying to enter outside the hours and does not work against
    somebody who entered earlier and stayed. An attacker who has taken credentials falls into the second case
    without any effort at all.

    The rule makes sense only where working hours have been set at all. Upon a machine where no account has
    them, the setting is right and without effect - and it is well that the application not present it as a live
    safeguard.

    What an attacker gains while the item goes unmet: a session carrying on without bound in time, the account's
    set working hours notwithstanding.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a rozstrzyga jedno pytanie: czy na tej
    maszynie jakiekolwiek konto ma wyznaczone godziny pracy.

    Jeśli nie ma, zmiana nie robi nic i jest to przypadek najczęstszy na
    stanowisku roboczym poza domeną.

    Jeśli ma, skutek jest odczuwalny i widoczny. Sesja sieciowa kończy się
    w chwili upływu godzin, więc praca z plikiem otwartym z udziału
    przerywa się i zmiany niezapisane mogą przepaść. Osoba pracująca dłużej
    raz na jakiś czas odczuje to jako utratę pracy, nie jako zasadę.

    Drugi przypadek dotyczy zadań uruchamianych automatycznie na koncie
    z godzinami. Zadanie rozpoczęte przed granicą zostanie przerwane
    w połowie, a jego dziennik pokaże błąd dostępu, nie upływ czasu.

    Odnotowuję, że przerwane zostają sesje sieciowe, nie sesja lokalna.
    Osoba przy maszynie nie zostanie z niej wylogowana.

    Czego to nie psuje: sesji lokalnej, logowania kont bez wyznaczonych
    godzin, uprawnień do zasobów, drukowania, aplikacji lokalnych.
  en: |
    The class is "needs review", and one question settles it: whether any account upon this machine has set
    working hours.

    Where none has, the change does nothing, and that is the commonest case at a workplace outside a domain.

    Where one has, the consequence is felt and seen. The network session ends at the moment the hours pass, so
    work upon a file opened from a share breaks off and unsaved changes may be lost. A person working late now
    and then will feel it as a loss of work, not as a rule.

    The second case touches tasks started of themselves upon an account with hours. A task begun before the
    boundary will be broken off halfway, and its log will show an error of access, not a passing of time.

    I set down that it is network sessions that are broken off, not the local session. A person at the machine
    will not be signed out of it.

    What this does not break: the local session, the logging on of accounts without set hours, the rights upon
    resources, printing, or local applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Praca z plikiem otwartym z udziału przerywa się w chwili upływu godzin i zmiany niezapisane mogą przepaść
      - Osoba pracująca dłużej raz na jakiś czas odczuje to jako utratę pracy, a nie jako zasadę
      - Zadanie uruchamiane automatycznie na koncie z godzinami zostaje przerwane w połowie
      - Dziennik zadania pokazuje błąd dostępu, a nie upływ czasu, więc przyczyna nie jest oczywista
      - Sesja lokalna, logowanie kont bez wyznaczonych godzin, uprawnienia i drukowanie pozostają bez zmian
    en:
      - Work upon a file opened from a share breaks off when the hours pass and unsaved changes may be lost
      - A person working late now and then will feel it as a loss of work, not as a rule
      - A task started of itself upon an account with hours is broken off halfway
      - The tasks log shows an error of access and not a passing of time, so the cause is not obvious
      - The local session, the logging on of accounts without set hours, the rights upon resources and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta z wyznaczonymi godzinami uruchamiają zadania przekraczające granicę godzin
      - Osoby z wyznaczonymi godzinami pracują niekiedy dłużej i nie uprzedzono ich o przerwaniu sesji
    en:
      - Accounts with set hours start tasks that run past the boundary of those hours
      - People with set hours work late now and then and have not been forewarned that the session will be broken off
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^ForceLogoffWhenHourExpire\s*=\s*(-?\d+)') {
          $Matches[1]
        }
        else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $current = ''
    if ($text -match '(?m)^ForceLogoffWhenHourExpire\s*=\s*(-?\d+)') { $current = $Matches[1] }
    [pscustomobject]@{
      name    = 'ForceLogoffWhenHourExpire'
      value   = $current
      existed = ($current -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Network sessions are broken off, the local one is not. Where hours are set,
    # forewarn the people concerned - unsaved work in a file opened from a share
    # may be lost.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'ForceLogoffWhenHourExpire = 1',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('ForceLogoffWhenHourExpire = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-force-logoff-when-logon-hours-expire

notes:
  pl: |
    Reguła zamyka blok i jest w nim jedyną, której skutek zależy od
    konfiguracji kont, a nie od stanu maszyny. Warto, żeby aplikacja
    powiedziała wprost, że na maszynie bez kont z godzinami punkt jest
    spełniony i bezskutkowy — to jest uczciwszy opis niż zielony wynik bez
    komentarza.

    Argument wart zachowania dotyczy tego, przeciw komu działa samo
    ograniczenie godzin. Bez tej reguły działa przeciw próbie wejścia,
    a nie przeciw obecności — czyli przeciw przypadkowi łatwiejszemu.
    Napastnik z przejętymi poświadczeniami po prostu zostaje.

    Odnotowuję, że przerwane zostają sesje sieciowe, a nie lokalna. Jest to
    rozróżnienie, którego nazwa ustawienia nie oddaje, a bez niego opis
    sugeruje wylogowanie osoby siedzącej przy maszynie.
  en: |
    The rule closes the block and is the only one in it whose consequence hangs upon the accounts' configuration
    rather than upon the machine's state. It is well that the application say outright that upon a machine
    without accounts having hours the item is met and without effect - that is a more honest description than a
    green outcome without a word.

    The argument worth keeping touches whom the bound of hours works against of itself. Without this rule it
    works against an attempt to enter and not against a presence - which is to say against the easier case. An
    attacker with taken credentials simply stays.

    I set down that it is network sessions that are broken off, not the local one. It is a parting the setting's
    name does not carry, and without it the description hints at the signing out of a person sitting at the
    machine.
