id: fedora44-var-log-separate-partition

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.1.2.6.1
  section: Initial Setup > Filesystem > Configure Filesystem Partitions > Configure /var/log
  title:
    pl: Katalog /var/log jest osobną partycją
    en: Ensure separate partition exists for /var/log
  level: 2
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    W /var/log system zapisuje dzienniki. Gdy dzielą miejsce z resztą systemu,
    usługa, która zaczyna gwałtownie logować, np. po błędzie albo w trakcie
    ataku, może zapełnić dysk i zatrzymać wszystko inne. Odwrotnie też: pełny
    dysk z innego powodu przerywa zapis dzienników, a właśnie wtedy są
    najbardziej potrzebne.

    Na domyślnej instalacji Fedory /var/log nie jest osobnym punktem
    montowania. Dziennik systemd ogranicza własny rozmiar, ale nie obejmuje to
    plików pisanych przez rsyslog i inne usługi. Punkt należy do poziomu 2, bo
    zmiana wymaga przeniesienia danych.
  en: |
    /var/log is where the system writes its logs. When they share space with the
    rest of the system, a service that starts logging heavily, for example after
    an error or during an attack, can fill the disk and stop everything else. It
    works the other way too: a disk full for another reason stops logging,
    exactly when logs are needed most.

    On a default Fedora installation /var/log is not a separate mount point. The
    systemd journal limits its own size, but that does not cover files written
    by rsyslog and other services. The item belongs to level 2 because the change
    needs data to be moved.

disruption_description:
  pl: |
    Zmiana wymaga planowanego wdrożenia, bo przenosi dane systemu na nowe
    miejsce i wymaga pracy przy zatrzymanym systemie. Program nie wykonuje jej
    sam; opis mówi, co trzeba zaplanować.

    Przeniesienie /var/log trzeba zrobić, gdy usługi dzienników są zatrzymane,
    czyli z systemu ratunkowego, i zachować etykiety SELinux, bez których
    journald i rsyslog nie zapiszą nowych wpisów.
  en: |
    The change needs a planned rollout because it moves system data to a new
    place and needs work while the system is stopped. The program does not
    perform it; the description says what has to be planned.

    Moving /var/log has to be done while the logging services are stopped, that
    is, from a rescue system, keeping the SELinux labels without which journald
    and rsyslog will not write new entries.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - updates-and-servicing
  what_breaks:
    pl:
      - Przeniesienie /var/log wymaga uruchomienia stacji z nośnika ratunkowego i przerwy w pracy na czas kopiowania dzienników
      - Pominięcie etykiet SELinux przy kopiowaniu dzienników sprawia, że journald i rsyslog po starcie nie zapisują nowych wpisów
    en:
      - Moving /var/log needs the workstation to be started from rescue media and a break in work while the logs are copied
      - Skipping SELinux labels when copying the logs makes journald and rsyslog fail to write new entries after start
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Dysk nie ma wolnego miejsca na osobny wolumin, a zmiana układu partycji nie była zaplanowana
    en:
      - The disk has no free space for a separate volume and no change to the partition layout has been planned
  reversibility: difficult

audit:
  shell: bash
  test_command: |
    t=/var/log
    if [ ! -r /proc/self/mountinfo ] || ! command -v findmnt >/dev/null 2>&1; then
      echo CHECK_ERROR; exit 0
    fi
    if findmnt -kn --mountpoint "$t" >/dev/null 2>&1; then echo SEPARATE; else echo NOT_SEPARATE; fi
  expected: '^SEPARATE$'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/fstab.5.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.mount.html
  - https://www.freedesktop.org/software/systemd/man/latest/file-hierarchy.html

notes:
  pl: |
    Sprawdzenie uznaje punkt za spełniony, gdy /var/log jest osobnym punktem
    montowania, bez względu na to, czy jest to partycja, wolumin logiczny czy
    podwolumin btrfs.

    Punkt nie ma naprawy uruchamianej z programu. Wydzielenie katalogu wymaga
    przeniesienia jego zawartości na nowe miejsce, gdy nic z niej nie korzysta,
    czyli w trybie ratunkowym albo przy instalacji, i nie da się go bezpiecznie
    cofnąć jednym poleceniem.

    Na Fedorze z domyślnym btrfs najprostszą drogą jest osobny podwolumin
    zamontowany w /var/log wpisem w /etc/fstab. Daje on osobny punkt montowania
    i własne opcje, ale dzieli miejsce z resztą systemu, więc przed zapełnieniem
    dysku chroni dopiero przy włączonych limitach (quota) btrfs. Pełną ochronę
    daje osobna partycja lub wolumin logiczny.
  en: |
    The check considers the item met when /var/log is a separate mount point, whether
    it is a partition, a logical volume or a btrfs subvolume.

    The item has no remediation that the program runs. Separating the directory
    means moving its contents to the new place while nothing uses them, that is,
    in rescue mode or during installation, and it cannot be safely undone with
    one command.

    On Fedora with the default btrfs the simplest way is a separate subvolume
    mounted at /var/log by an entry in /etc/fstab. It gives a separate mount point and
    its own options, but shares space with the rest of the system, so it protects
    against a full disk only with btrfs quotas enabled. Full protection comes from
    a separate partition or logical volume.
