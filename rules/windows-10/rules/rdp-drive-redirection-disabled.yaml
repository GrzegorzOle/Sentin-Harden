id: win10-rdp-drive-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie dysków w sesji pulpitu zdalnego wyłączone
    en: The turning of disks into the session of the desk from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania udostępniania w sesji zdalnej dysków maszyny,
    z której użytkownik się łączy.

    Przekierowanie dysków tworzy most między dwiema maszynami. Zasoby
    klienta pojawiają się w sesji jako zwykłe dyski, a pliki przechodzą
    w obie strony bez udziału sieciowego udostępniania i bez śladu
    w mechanizmach, które ruchem plików zarządzają.

    Zagrożenie pierwsze to wynoszenie danych. Pliki z maszyny zdalnej
    kopiują się na dysk klienta jednym przeciągnięciem, a mechanizmy
    nadzorujące przenoszenie danych zwykle tej drogi nie widzą.

    Zagrożenie drugie to kierunek odwrotny. Plik uruchamialny przyniesiony
    z maszyny klienta trafia do sesji zdalnej, więc omija kontrole
    stosowane wobec plików przychodzących z sieci.

    Zagrożenie trzecie to maszyny niezarządzane. Użytkownik łączący się
    z komputera domowego udostępnia sesji jego dyski razem z tym, co na
    nich jest.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: most
    plikowy między maszyną zdalną a dowolnym komputerem klienta.
  en: |
    The setting forbids the giving out within a session from afar of the disks of the machine the user joins
    themselves from.

    The turning of disks makes a bridge between two machines. The client's holdings show in the session as common
    disks, and files pass both ways with no giving out over the network and with no trace in the mechanisms that
    order the moving of files.

    The first danger is the carrying out of data. Files from the far machine copy themselves onto the client's
    disk at one drawing across, and the mechanisms watching over the moving of data commonly see not that road.

    The second danger is the road the other way. A file that may be set going, brought from the client's machine,
    reaches the session from afar, and so passes by the watches laid upon files coming in from the network.

    The third danger is machines beyond ordering. A user joining themselves from a computer at home gives out to
    the session its disks together with whatever is upon them.

    What an attacker gains while the item goes unmet: a bridge for files between the far machine and any computer
    of a client.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, jak
    ludzie przenoszą pliki do sesji zdalnej i z powrotem.

    Miejscem pierwszym jest codzienna praca z dokumentami. Osoba
    pracująca w sesji zdalnej często przynosi do niej plik z własnego
    komputera i odsyła wynik. Po zmianie trzeba będzie użyć udziału
    sieciowego albo poczty, a to zmienia nawyk, nie tylko narzędzie.

    Miejscem drugim są instalatory i narzędzia wnoszone do sesji przez
    osoby zarządzające. Po zmianie trzeba je umieścić na udziale, do
    którego maszyna zdalna ma dostęp.

    Miejscem trzecim są drukarki podłączone do maszyny klienta,
    korzystające czasem z tej samej warstwy.

    Odnotowuję, że przed wdrożeniem trzeba wskazać drogę zastępczą.
    Punkt wdrożony bez niej nie zatrzyma przenoszenia plików, tylko
    przeniesie je na pocztę prywatną — czyli pogorszy stan.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: samych sesji pulpitu zdalnego, udziałów
    sieciowych, pracy programów, logowania, drukowania sieciowego.
  en: |
    The class is "needs review", and the object of the review is how people carry files into a session from afar
    and back again.

    The first place is the day's work with papers. Whoever works in a session from afar often brings into it a
    file from their own computer and sends the outcome back. After the change a share over the network or the post
    must be used, and that changes a habit and not the tool alone.

    The second place is layers-on and tools brought into the session by those who order machines. After the change
    they must be laid upon a share the far machine can reach.

    The third place is printers joined to the client's machine, which use at times that same layer.

    I set down that before the rollout a road in its stead must be pointed out. The item rolled out without one
    will not stop the carrying of files but will move it onto private post - which is to say worsen the state.

    The consequence shows at once, with no restart.

    What this does not break: the sessions of the desk from afar themselves, shares over the network, the work of
    programs, logging on, or printing over the network.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - file-sharing
  what_breaks:
    pl:
      - Przenoszenie plików między własnym komputerem a sesją zdalną przestanie działać
      - Trzeba będzie użyć udziału sieciowego albo poczty, co zmienia nawyk, nie tylko narzędzie
      - Instalatory i narzędzia wnoszone do sesji trzeba będzie umieścić na udziale dostępnym dla maszyny zdalnej
      - Drukarki podłączone do maszyny klienta korzystające z tej samej warstwy mogą przestać działać
      - Wdrożenie bez wskazania drogi zastępczej przeniesie przenoszenie plików na pocztę prywatną
    en:
      - The carrying of files between one s own computer and the session from afar will cease to work
      - A share over the network or the post must be used, which changes a habit and not the tool alone
      - Layers-on and tools brought into the session must be laid upon a share the far machine can reach
      - Printers joined to the client s machine that use that same layer may cease to work
      - A rollout with no road pointed out in its stead will move the carrying of files onto private post
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca w sesji zdalnej opiera się na przenoszeniu dokumentów z własnego komputera i nie ma udziału sieciowego
    en:
      - Work in the session from afar rests upon the carrying of papers from one s own computer and there is no share over the network
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'fDisableCdm'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableCdm'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableCdm' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Reguła wymaga wskazania drogi zastępczej i warto, żeby aplikacja
    powiedziała to wprost. Wdrożona bez udziału sieciowego nie zatrzyma
    przenoszenia plików — przeniesie je na pocztę prywatną, czyli
    pogorszy stan zamiast go poprawić.

    Argument wart postawienia dotyczy niewidoczności. Pliki idą tą drogą
    bez udziału sieciowego udostępniania, więc mechanizmy nadzorujące
    przenoszenie danych zwykle tego ruchu nie widzą.

    Odnotowuję maszyny niezarządzane. Użytkownik łączący się z komputera
    domowego udostępnia sesji jego dyski razem z tym, co na nich jest,
    a o stanie tamtej maszyny nikt tu nic nie wie.
  en: |
    The rule calls for a road to be pointed out in its stead, and it is well that the application say so outright.
    Rolled out with no share over the network it will not stop the carrying of files - it will move it onto
    private post, which is to say worsen the state rather than mend it.

    The argument worth putting touches unseenness. The files go by that road with no giving out over the network,
    so the mechanisms watching over the moving of data commonly see not that traffic.

    I set down machines beyond ordering. A user joining themselves from a computer at home gives out to the
    session its disks together with whatever is upon them, and of that machine's state nobody here knows anything.
