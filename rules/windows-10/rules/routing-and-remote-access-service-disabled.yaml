id: win10-routing-and-remote-access-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa trasowania i dostępu zdalnego wyłączona
    en: The service of routing and of reach from afar switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę zamieniającą maszynę w bramę sieciową:
    przyjmującą połączenia z zewnątrz i przepuszczającą ruch między
    sieciami.

    Na stanowisku roboczym usługa ta nie ma zastosowania. Jest częścią
    roli serwerowej i służy do budowania dostępu zdalnego dla całej
    organizacji albo do łączenia sieci ze sobą.

    Zagrożenie polega właśnie na tym, czym usługa jest. Maszyna z nią
    uruchomioną może trasować ruch, czyli przepuszczać pakiety z jednej
    sieci do drugiej. Stanowisko podłączone do dwóch sieci — na przykład
    przewodowej i bezprzewodowej — staje się wtedy mostem między nimi.

    Drugim zastosowaniem jest przyjmowanie połączeń zdalnych. Maszyna
    zaczyna być punktem wejścia do sieci, w której stoi, i to punktem
    opisanym własną konfiguracją, a nie zasadami organizacji.

    Odnotowuję, że usługa bywa uruchamiana przez oprogramowanie
    tunelujące, które korzysta z niej jako warstwy pomocniczej. Warto to
    sprawdzić przed wdrożeniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: gotową
    bramę między sieciami i punkt wejścia opisany lokalnie.
  en: |
    The setting switches off the service turning the machine into a gate of the network: one taking joinings from
    without and letting traffic through between networks.

    Upon a working station that service has no use. It is part of an office of a server and serves for the
    building of reach from afar for a whole body or for the joining of networks to one another.

    The danger lies in what the service is. A machine with it set going may route traffic, which is to say let
    packets through from one network into another. A station joined to two networks - one by wire and one without,
    say - becomes then a bridge between them.

    The second use is the taking of joinings from afar. The machine begins to be a point of entry into the network
    it stands in, and one set out by its own setting up rather than by the body's policy.

    I set down that the service is at times set going by software of tunnelling that uses it as a helping layer.
    It is worth looking into before the rollout.

    What an attacker gains while the item goes unmet: a ready gate between networks and a point of entry set out
    locally.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    usługa nie jest wykorzystywana przez oprogramowanie tunelujące.

    Miejscem wartym uwagi są klienty sieci wirtualnych i narzędzia
    zdalnego dostępu, które korzystają z tej usługi jako warstwy
    pomocniczej. Część z nich uruchamia ją cicho, przy instalacji, i nie
    mówi o tym w dokumentacji. Po zmianie tunel przestanie się zestawiać.

    Miejscem drugim jest współdzielenie połączenia internetowego, jeżeli
    ktoś na tym stanowisku je włączył. Mechanizm ten opiera się na tej
    samej usłudze.

    Odnotowuję, że na stanowisku roboczym bez tych dwóch rzeczy zmiana
    nie robi nic. Usługa jest domyślnie zatrzymana i nikt jej nie używa.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: zwykłej łączności sieciowej, dostępu do internetu,
    udziałów, pulpitu zdalnego, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether the service is not being used by software
    of tunnelling.

    The place worth notice is clients of networks made by craft and tools of reach from afar that use this service
    as a helping layer. Some of them set it going quietly, at the laying on, and say nothing of it in their
    papers. After the change the tunnel will cease to be set up.

    The second place is the sharing out of a joining to the internet, if anybody upon this station turned it on.
    That mechanism rests upon this same service.

    I set down that upon a working station without those two things the change does nothing. The service stands
    stopped by default and nobody uses it.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the ordinary joining to the network, the reach of the internet, of shares, of the
    desk from afar, logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Klient sieci wirtualnej korzystający z tej usługi jako warstwy pomocniczej przestanie zestawiać tunel
      - Część takich narzędzi uruchamia ją cicho przy instalacji i nie mówi o tym w dokumentacji
      - Współdzielenie połączenia internetowego z tego stanowiska przestanie działać, bo opiera się na tej samej usłudze
      - Na stanowisku roboczym bez tych dwóch rzeczy zmiana nie robi nic, bo usługa jest domyślnie zatrzymana
      - Zwykła łączność sieciowa, dostęp do internetu, udziały, pulpit zdalny i drukowanie pozostają bez zmian
    en:
      - A client of a network made by craft using this service as a helping layer will cease to set up its tunnel
      - Some such tools set it going quietly at the laying on and say nothing of it in their papers
      - The sharing out of a joining to the internet from this station will cease to work, resting as it does upon this same service
      - Upon a working station without those two things the change does nothing, the service standing stopped by default
      - The ordinary joining to the network, the reach of the internet, of shares, of the desk from afar and printing stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa klient sieci wirtualnej korzystający z tej usługi i nie ma dla niego zamiennika
      - Stanowisko współdzieli połączenie internetowe z innymi urządzeniami
    en:
      - Upon the machine works a client of a network made by craft that uses this service and there is no other in its place
      - The station shares out its joining to the internet with other devices
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RemoteAccess'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'RemoteAccess' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RemoteAccess' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RemoteAccess' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/remote-access

notes:
  pl: |
    Reguła jest oceniona wysoko, choć usługa jest domyślnie zatrzymana.
    Warto, żeby aplikacja wyjaśniła tę pozorną sprzeczność: zagrożeniem
    nie jest stan bieżący, tylko to, czym maszyna staje się po
    uruchomieniu usługi — bramą między sieciami.

    Argument wart zachowania dotyczy stanowiska podłączonego do dwóch
    sieci naraz. Przewodowa i bezprzewodowa, biurowa i domowa, firmowa
    i gościnna — z uruchomioną usługą maszyna potrafi przepuszczać ruch
    między nimi, a podział sieci przestaje cokolwiek znaczyć.

    Odnotowuję zastrzeżenie wobec oprogramowania tunelującego. Część
    klientów sieci wirtualnych uruchamia tę usługę przy instalacji i nie
    mówi o tym. Warto sprawdzić przed wdrożeniem, bo objaw po zmianie
    brzmi „tunel się nie zestawia" i nie prowadzi do przyczyny.
  en: |
    The rule is graded high, though the service stands stopped by default. It is well that the application set out
    that seeming contradiction: the danger is not the standing state but what the machine becomes once the service
    is set going - a gate between networks.

    The argument worth keeping touches a station joined to two networks at once. By wire and without, of the
    office and of the home, of the firm and of the guests - with the service set going the machine can let traffic
    through between them, and the parting of the network ceases to mean anything.

    I set down the reservation touching software of tunnelling. Some clients of networks made by craft set this
    service going at the laying on and say nothing of it. It is worth looking into before the rollout, the sign
    after the change running "the tunnel is not set up" and leading not to the cause.
