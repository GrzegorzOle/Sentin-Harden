id: ubuntu2404-bootloader-password-set

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 1.4.1
  section: Initial Setup > Configure Bootloader
  title:
    pl: Hasło programu rozruchowego jest ustawione
    en: Ensure bootloader password is set
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Kto ma dostęp do konsoli przy starcie, może w menu GRUB zmienić wpis
    rozruchu, np. dopisać init=/bin/bash, i dostać powłokę roota bez żadnego
    hasła. Na serwerze konsolą jest też zdalna konsola karty zarządzającej
    albo okno maszyny wirtualnej w panelu hiperwizora.

    Hasło GRUB wymaga logowania przed edycją wpisu i przed użyciem wiersza
    poleceń GRUB. Na Ubuntu skrót hasła tworzy polecenie grub-mkpasswd-pbkdf2,
    a polecenia set superusers i password_pbkdf2 trafiają do pliku
    w /etc/grub.d, z którego update-grub buduje grub.cfg. Punkt sprawdza oba
    polecenia w /boot/grub/grub.cfg. Na domyślnej instalacji ich nie ma.
  en: |
    Anyone with console access at start can change a boot entry in the GRUB
    menu, for example append init=/bin/bash, and get a root shell without any
    password. On a server the console also means the remote console of the
    management card or the virtual machine window in the hypervisor panel.

    A GRUB password requires signing in before editing an entry and before
    using the GRUB command line. On Ubuntu the password hash is created by the
    grub-mkpasswd-pbkdf2 command, and the set superusers and password_pbkdf2
    commands go into a file in /etc/grub.d, from which update-grub builds
    grub.cfg. The item checks both commands in /boot/grub/grub.cfg. A default
    installation does not have them.

disruption_description:
  pl: |
    Klasa wymaga zaplanowanego wdrożenia, bo wpisy menu Ubuntu nie mają opcji
    --unrestricted. Po ustawieniu hasła każdy start, także zwykły restart po
    aktualizacji, zatrzymuje się w GRUB i czeka na login i hasło, więc serwer
    restartowany zdalnie nie wraca do pracy. Trzeba dopisać --unrestricted do
    wpisów, które mają startować bez hasła, i przygotować przechowywanie
    hasła dla administratorów pracujących przy konsoli.
  en: |
    The class needs a planned rollout because Ubuntu menu entries do not have
    the --unrestricted option. Once the password is set, every start, including
    an ordinary restart after updates, stops in GRUB and waits for the login
    and password, so a server restarted remotely does not come back. The
    --unrestricted option has to be added to the entries that should start
    without a password, and the password has to be stored for administrators
    working at the console.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
  what_breaks:
    pl:
      - "Bez --unrestricted we wpisach: każdy start serwera czeka w menu GRUB na login i hasło, także automatyczny restart po aktualizacjach"
      - Edycja wpisu w menu GRUB i wiersz poleceń GRUB, np. do startu w trybie odzyskiwania z dodatkowym parametrem, wymagają loginu i hasła programu rozruchowego
    en:
      - "Without --unrestricted in the entries: every server start waits in the GRUB menu for the login and password, including an automatic restart after updates"
      - Editing an entry in the GRUB menu and the GRUB command line, for example to start recovery mode with an extra parameter, require the bootloader login and password
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer restartowany automatycznie, do którego konsoli nikt nie ma dostępu w czasie restartu, jeśli wpisy nie dostaną opcji --unrestricted
    en:
      - A server restarted automatically whose console nobody can reach during the restart, unless the entries get the --unrestricted option
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    c=/boot/grub/grub.cfg
    if [ ! -r "$c" ]; then echo CHECK_ERROR; exit 0; fi
    su=$(sed -n 's/^[[:space:]]*set[[:space:]]\{1,\}superusers=//p' "$c" | tail -n 1 | tr -d "\"'" | tr -s ' ' ',')
    pw=$(grep -cE '^[[:space:]]*password(_pbkdf2)?[[:space:]]+[^[:space:]$]+[[:space:]]+[^[:space:]$]' "$c")
    n=$(grep -cE '^[[:space:]]*menuentry[[:space:]]' "$c")
    u=$(grep -E '^[[:space:]]*menuentry[[:space:]]' "$c" | grep -c -- '--unrestricted')
    if [ -z "$su" ]; then echo NOT_SET:no-superusers
    elif [ "$pw" = 0 ]; then echo NOT_SET:no-password
    else echo "SET:superusers=$su,entries=$n,unrestricted=$u"; fi
  expected: '^SET:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html
  - https://manpages.ubuntu.com/manpages/noble/man1/grub-mkpasswd-pbkdf2.1.html
  - https://help.ubuntu.com/community/Grub2/Passwords

notes:
  pl: |
    Reguła tylko sprawdza stan, bo hasło trzeba wybrać i przechować; naprawa
    nie może zrobić tego za administratora. Wynik SET podaje użytkowników
    z superusers, liczbę wpisów menu i liczbę wpisów z --unrestricted: gdy ta
    druga jest mniejsza, zwykły start części wpisów wymaga hasła. Wynik
    NOT_SET mówi, czego brakuje: superusers albo hasła.

    Opcję --unrestricted dla wpisów Ubuntu dodaje się w zmiennej CLASS pliku
    /etc/grub.d/10_linux, a następnie uruchamia update-grub. Sprawdzenie czyta
    tylko grub.cfg, więc hasło dopisane do /etc/grub.d bez update-grub nie
    działa i nie jest liczone. Plik grub.cfg bywa dostępny tylko dla roota
    (punkt 1.4.2), więc sprawdzenie wymaga uprawnień roota.
  en: |
    The rule only checks the state, because the password has to be chosen and
    stored; a remediation cannot do that for the administrator. The SET result
    gives the superusers, the number of menu entries and the number of entries
    with --unrestricted: when the latter is smaller, an ordinary start of some
    entries needs the password. The NOT_SET result says what is missing:
    superusers or a password.

    The --unrestricted option for the Ubuntu entries is added in the CLASS
    variable of /etc/grub.d/10_linux, followed by update-grub. The check only
    reads grub.cfg, so a password added to /etc/grub.d without update-grub does
    not work and is not counted. grub.cfg may be accessible only to root (item
    1.4.2), so the check needs root privileges.
