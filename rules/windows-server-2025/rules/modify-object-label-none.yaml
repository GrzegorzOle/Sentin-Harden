id: win2025-modify-object-label-none

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Modyfikowanie etykiety obiektu nieprzyznane nikomu
    en: Modifying an object label granted to no one
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Obok uprawnień system prowadzi drugi, prostszy mechanizm
    rozgraniczenia: każdy obiekt i każdy proces ma etykietę poziomu
    nienaruszalności. Zasada jest jedna — proces o etykiecie niższej nie
    może zmienić obiektu o etykiecie wyższej, nawet jeśli uprawnienia mu
    na to pozwalają.

    Mechanizm ten jest podstawą izolacji procesów pracujących
    z ograniczeniami: kart przeglądarki, składników otwierających
    dokumenty i usług celowo uruchamianych nisko. To on sprawia, że
    przejęcie takiego procesu nie daje jeszcze dostępu do reszty
    systemu — bo napastnik ląduje na poziomie, z którego nie sięgnie
    wyżej.

    Prawo omawiane tutaj pozwala zmieniać te etykiety, w tym obniżać je
    na obiektach cudzych. Skutek jest dwojaki: własny proces można
    podnieść, a cel — obniżyć. W obu przypadkach granica, na której
    opiera się izolacja, przestaje istnieć.

    Na serwerze znaczenie jest większe niż na stanowisku roboczym, bo
    usługi sieciowe są właśnie tym rodzajem oprogramowania, który celowo
    uruchamia się nisko. Serwer aplikacyjny i serwer sieciowy opierają
    na tym mechanizmie całą swoją odporność na przejęcie procesu
    obsługującego żądania z zewnątrz.

    Prawo to nie jest potrzebne niczemu. W systemie domyślnym wykaz jest
    pusty i nawet składniki systemu zarządzające etykietami go nie
    używają.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zniesienie
    granicy, która miała powstrzymać go po przejęciu procesu
    uruchomionego celowo na niskim poziomie.
  en: |
    Beside rights the system keeps a second, simpler mechanism of parting: every object and
    every process has a label of integrity level. The rule is one - a process of a lower label
    cannot change an object of a higher label, even where rights would let it.

    That mechanism is the ground of isolating processes working under bounds: a browser's
    tabs, parts that open documents, and services deliberately started low. It is what makes
    the taking over of such a process not yet give access to the rest of the system - for the
    attacker lands at a level they cannot reach up from.

    The right spoken of here allows those labels to be changed, among them lowered on others'
    objects. The effect is twofold: one's own process may be raised and the target lowered. In
    both cases the bound isolation rests on stops existing.

    On a server the weight is greater than at a working station, since network services are
    exactly the kind of software deliberately started low. An application server and a web
    server rest on this mechanism their whole soundness against the taking over of the process
    that serves requests from outside.

    The right is needed by nothing. In the default system the list is empty, and even the
    system's parts that manage labels do not use it.

    What an attacker gains while the item goes unmet: the undoing of the bound that was to
    hold them back after the taking over of a process deliberately started at a low level.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym wykaz jest pusty, więc naprawa nie ma czego
    usunąć. Na serwerze pracującym normalnie jest to stan spotykany
    zawsze.

    Etykiety nienaruszalności są nadawane i zmieniane przez system
    w toku normalnej pracy — przy tworzeniu procesu, przy zapisie pliku,
    przy uruchomieniu usługi z ograniczeniami. Żadna z tych czynności nie
    korzysta z omawianego prawa, bo system działa z innego tytułu.
    Opróżnienie wykazu nie dotyka więc niczego, co dzieje się na co
    dzień.

    Nie ma znanego oprogramowania, które potrzebowałoby tego prawa do
    działania. Niepusty wykaz oznacza w praktyce zasadę skopiowaną
    z maszyny innej albo ślad po czyjejś wcześniejszej pracy — i jedno,
    i drugie warto wyjaśnić, ale żadne z nich nie jest zależnością.

    Zmiana obowiązuje od następnej próby zmiany etykiety. Etykiety już
    nadane pozostają, jakie są, więc naprawa nie porządkuje stanu
    zastanego.
  en: |
    The change has no known side effects and takes no break.

    In the default state the list is empty, so the mending has nothing to remove. On a server
    working normally that is the state always met.

    Labels of integrity are set and changed by the system in the course of normal work - at the
    making of a process, at the writing of a file, at the starting of a service under bounds.
    None of those doings uses the right spoken of, since the system works on another title.
    Emptying the list thus touches nothing that happens day to day.

    There is no known software that would take this right to work. A list that is not empty
    means in practice a policy copied from another machine or a trace of somebody's earlier
    work - both are worth explaining, but neither is a dependence.

    The change holds from the next try at changing a label. Labels already set stay as they
    are, so the mending does not put the found state in order.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - web-server-services
    - virtualization-and-containers
  what_breaks:
    pl:
      - W stanie domyślnym wykaz jest pusty i naprawa nie ma czego usunąć
      - Nadawanie etykiet przez system w toku normalnej pracy nie korzysta z tego prawa
      - Nie ma znanego oprogramowania, które potrzebowałoby tego prawa do działania
      - Etykiety już nadane pozostają bez zmiany, więc naprawa nie porządkuje stanu zastanego
    en:
      - In the default state the list is empty and the mending has nothing to remove
      - The setting of labels by the system in normal work does not use this right
      - There is no known software that would take this right to work
      - Labels already set stay unchanged, so the mending does not put the found state in order
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których ten punkt byłby błędem
    en:
      - No known cases in which this item would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRelabelPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRelabelPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRelabelPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRelabelPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRelabelPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/modify-an-object-label

notes:
  pl: |
    Poziom nienaruszalności jest mechanizmem osobnym od uprawnień
    i działa niezależnie od nich. Proces może mieć uprawnienia do
    obiektu i mimo to nie móc go zmienić, bo etykieta na to nie pozwala.
    Ten punkt broni właśnie tej drugiej granicy.

    Prawo nie jest potrzebne systemowi do nadawania etykiet w toku
    normalnej pracy. System robi to z innego tytułu, więc pusty wykaz
    niczego nie blokuje.

    Sprawdzenie przyjmuje wykaz pusty i brak wpisu jako stany
    równoważne. Wykaz jest porządkowany przed porównaniem, a konta
    wskazywane identyfikatorami.
  en: |
    The integrity level is a mechanism apart from rights and works free of them. A process may
    have rights to an object and still be unable to change it, since the label does not let
    it. This item guards that second bound.

    The right is not taken by the system for the setting of labels in the course of normal
    work. The system does it on another title, so an empty list blocks nothing.

    The check takes an empty list and no entry as equivalent states. The list is put in order
    before the comparison, and accounts are pointed to by identifier.
