id: win2025-push-to-install-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa instalowania programów zleconego z innego urządzenia wyłączona
    en: The service installing programs ordered from another device disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przyjmującą zlecenia instalacji wydane z innego
    urządzenia. Program wskazany gdzie indziej zostaje pobrany
    i zainstalowany na tej maszynie.

    Zostawiam kategorię średnią i chcę nazwać, na czym polega rzecz,
    bo z opisu może się wydawać, że chodzi o wygodę.

    Chodzi o to, że jest to droga, którą oprogramowanie trafia na serwer
    z pominięciem wszystkiego, co postawiono po to, żeby kontrolować,
    jak oprogramowanie trafia na serwer. Zgoda na zmianę, okno
    serwisowe, wpis w rejestrze zmian, uzgodnienie z właścicielem
    aplikacji — cała ta procedura istnieje dokładnie po to, żeby nic nie
    instalowało się na maszynie produkcyjnej bez decyzji. Ta usługa jest
    kanałem, w którym decyzja zapada na innym urządzeniu, a skutek
    pojawia się tutaj.

    Ograniczenie tej drogi jest realne i mówię o nim wprost, bo wpływa
    na ocenę: kanał wymaga konta producenta zalogowanego na tej maszynie.
    Na większości serwerów takiego konta nie ma, więc punkt pilnuje
    możliwości, a nie stanu. Jest to ta sama uwaga, którą zapisałem przy
    synchronizacji schowka między urządzeniami.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    umieszczenia oprogramowania na serwerze, w której decyzja zapada poza
    tą maszyną i poza procedurą zmian.
  en: |
    The item switches off the service that takes in orderings of an installing given from another
    device. A program named elsewhere is drawn down and installed upon that machine.

    I leave the category middling and would name wherein the thing lies, it seeming from the telling
    that it might be a matter of ease.

    It lies in this, that it is a road whereby software comes onto a server with a passing by of
    everything that was set up to ward how software comes onto a server. The leave for a change, the
    window of work, the entry in the roll of changes, the agreeing with the owner of the application -
    that whole ordering is there for just this, that nothing be installed upon a machine at work
    without a deciding. That service is a channel wherein the deciding is made upon another device and
    the outcome comes forth here.

    The bound of that road is a true one and I name it outright, it telling upon the reckoning - the
    channel takes a maker's standing signed in upon that machine. Upon most servers there is no such
    standing, so the item wards a possibility and not a state. It is the same note I set down at the
    keeping in step of the board of copying between devices.

    What an attacker gains while the item goes unmet - a road for the setting of software upon a
    server, wherein the deciding is made off that machine and outside the ordering of changes.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości" i powód jest bezpośrednim
    następstwem tego, co napisałem wyżej: nie ma na serwerze praktyki,
    którą ta zmiana by przerwała.

    Instalowanie oprogramowania na serwerze przez zlecenie wydane
    z telefonu albo z innego komputera nie jest sposobem pracy, który
    ktokolwiek zaplanował. Nie jest to też droga, którą posługują się
    narzędzia wdrożeniowe — te mają własne kanały i własne konta
    usługowe, i po tej zmianie działają dokładnie tak jak przedtem.
    Nie umiem wskazać scenariusza, w którym ktoś ucierpi, a to jest
    kryterium rozstrzygające.

    Warto natomiast zauważyć rzecz odwrotną, bo bywa użyteczna
    w rozmowie o priorytetach. Jeżeli na serwerze jest zalogowane konto
    producenta zdolne przyjąć takie zlecenie, to sam ten fakt jest
    ustaleniem ważniejszym niż niniejsza reguła. Wyłączenie tej jednej
    usługi zamyka jedną drogę, a otwarte pozostaje pytanie, po co na
    maszynie produkcyjnej jest konto, przez które cokolwiek może na nią
    trafić.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease", and the ground follows straight from what I wrote above - there
    is upon a server no wont that this change would break off.

    The installing of software upon a server by an ordering given from a speaking-box or from another
    reckoner is no way of working that anybody planned. Nor is it the road the tools of rolling out
    go by - those have channels of their own and standings of their own for their workings, and after
    that change they work just as before. I can name no happening wherein somebody will suffer, and
    that is the settling mark.

    It is worth marking, though, the thing the other way about, it being at times good in a speech of
    what comes first. If upon a server there be a maker's standing signed in and able to take such an
    ordering, that fact in itself is a settling weightier than this rule. The switching off of this
    one service shuts one road, and there stays open the question what a standing is doing upon a
    machine at work whereby anything at all may come onto it.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Przestaje być możliwe zlecenie instalacji programu na tej maszynie z innego urządzenia
      - Narzędzia wdrożeniowe mają własne kanały i konta usługowe, więc działają dokładnie tak jak przedtem
      - Kanał wymaga konta producenta zalogowanego na maszynie, więc punkt pilnuje możliwości, a nie stanu
      - Obecność takiego konta na serwerze produkcyjnym jest ustaleniem ważniejszym niż sama ta reguła
    en:
      - The ordering of the installing of a program upon that machine from another device stops being open to anybody
      - Tools of rolling out have channels and standings of their own, so they work just as before
      - The channel takes a maker's standing signed in upon the machine, so the item wards a possibility and not a state
      - The being of such a standing upon a server of work is a settling weightier than this rule itself
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie trafia na tę maszynę przez zlecenie wydane z innego urządzenia i jest to ustalony sposób pracy
    en:
      - Software comes onto that machine by an ordering given from another device and that is a settled way of working
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PushToInstall'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PushToInstall'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Deployment tooling has its own channels and service accounts and is not
    # affected. This closes the route where the decision to install is taken on
    # a different device and the result appears here.
    Stop-Service -Name 'PushToInstall' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PushToInstall' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'PushToInstall' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-pushtoinstall

