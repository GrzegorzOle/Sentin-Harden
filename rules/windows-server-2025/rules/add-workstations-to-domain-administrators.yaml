id: win2025-add-workstations-to-domain-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dodawanie stacji roboczych do domeny zastrzeżone dla administratorów
    en: Adding workstations to the domain restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala utworzyć w domenie konto komputera — czyli
    przyłączyć maszynę do domeny.

    Punkt ten ma znaczenie wyłącznie na kontrolerze domeny i jest
    jednym z niewielu w tej paczce, które nie mają odpowiednika na
    stanowisku roboczym. W stanie domyślnym prawo mają w domenie
    wszyscy uwierzytelnieni użytkownicy, z ograniczeniem do dziesięciu
    maszyn na osobę. Jest to ustawienie zastane, nie decyzja — pochodzi
    z czasów, gdy przyłączanie komputerów rozkładano na wielu ludzi.

    Skutek jest taki, że każde konto domenowe może wprowadzić do
    domeny maszynę, nad którą ma pełną władzę. Maszyna taka jest
    członkiem domeny, ma konto komputera i hasło tego konta, a przez to
    staje się pełnoprawnym uczestnikiem uwierzytelniania.

    Dla napastnika jest to krok pośredni o dużej wartości. Konto
    komputera utworzone przez siebie pozwala przeprowadzić operacje,
    których z konta użytkownika przeprowadzić się nie da — w tym
    ustawienia dotyczące delegowania, które prowadzą do podszycia się
    pod konto uprzywilejowane. Wejściem do tej drogi jest właśnie
    możliwość utworzenia konta komputera.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wprowadzenia do domeny własnej maszyny z własnym kontem
    komputera, będącą wejściem do eskalacji przez delegowanie.
  en: |
    The right allows a computer account to be made in the domain - that is, a machine to be
    joined to the domain.

    The item weighs on a domain controller alone and is one of the few in this pack with no
    counterpart at a working station. In the default state every authenticated user in the
    domain holds the right, bounded to ten machines apiece. That is a setting inherited rather
    than a decision - it comes of the days when the joining of computers was spread over many
    people.

    The effect is that any domain account may bring into the domain a machine it holds full
    power over. Such a machine is a member of the domain, has a computer account and that
    account's password, and thereby becomes a full participant in authentication.

    For an attacker it is a middle step of great worth. A computer account made by oneself
    allows operations that cannot be carried out from a user's account - among them settings
    bearing on delegation, which lead to the taking on of a privileged account's identity. The
    entrance to that road is just the means of making a computer account.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: the means of bringing into the domain a
    machine of their own with a computer account of their own, which is the entrance to an
    escalation by delegation.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak w tej domenie przyłącza się komputery,
    bo po zawężeniu będą mogli to robić wyłącznie administratorzy.

    Przypadkiem pierwszym jest wdrażanie stanowisk roboczych przez
    obsługę techniczną. Jeżeli osoby te pracują na kontach zwykłych
    i przyłączają komputery do domeny w ramach codziennej pracy,
    zawężenie zatrzyma wdrożenia.

    Przypadkiem drugim jest wdrażanie zautomatyzowane. Narzędzia
    instalujące system po sieci przyłączają maszynę do domeny na koncie
    wskazanym w konfiguracji i konto to bywa zwykłym kontem usługowym.

    Objaw jest natychmiastowy i czytelny: przyłączanie kończy się
    komunikatem o braku uprawnień do utworzenia konta komputera. Widać
    go od razu, bo przyłączenie jest operacją wykonywaną z ręki albo
    przez narzędzie zgłaszające niepowodzenie wprost.

    Zmiana nie dotyczy maszyn już przyłączonych. Ich konta działają
    dalej, hasła odnawiają się normalnie i nic w ich pracy się nie
    zmienia. Nie dotyczy też ponownego przyłączenia maszyny, której
    konto w domenie nadal istnieje.

    Właściwym rozwiązaniem nie jest odpuszczenie punktu, tylko nadanie
    prawa do tworzenia kont komputerów w konkretnej jednostce
    organizacyjnej temu, kto wdraża stanowiska. Jest to uprawnienie
    węższe i nie wymaga obecności w tym wykazie.
  en: |
    What needs checking is how computers are joined in this domain, since after the narrowing
    only administrators will be able to.

    The first case is the rolling out of working stations by technical support. Where those
    people work under ordinary accounts and join computers to the domain as part of their daily
    work, the narrowing will halt the rollouts.

    The second case is an automated rollout. Tools installing the system over the network join
    the machine to the domain under an account named in their configuration, and that account is
    at times an ordinary service account.

    The symptom is immediate and plain: the joining ends with a message about wanting rights to
    make a computer account. It is seen at once, the joining being an operation done by hand or
    by a tool that reports a failure outright.

    The change does not bear on machines already joined. Their accounts go on working, their
    passwords renew as usual and nothing in their working changes. Neither does it bear on the
    rejoining of a machine whose account still stands in the domain.

    The right answer is not letting the item go but granting the right to make computer accounts
    in a particular organisational unit to whoever rolls the stations out. That is a narrower
    entitlement and takes no standing in this list.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Obsługa techniczna pracująca na kontach zwykłych nie przyłączy stanowiska do domeny
      - Narzędzie wdrożeniowe przyłączające maszyny na koncie usługowym zgłosi brak uprawnień
      - Maszyny już przyłączone działają bez zmiany, a ich hasła odnawiają się normalnie
      - Ponowne przyłączenie maszyny, której konto w domenie istnieje, nie wymaga tego prawa
    en:
      - Technical support working under ordinary accounts will not join a station to the domain
      - A rollout tool joining machines under a service account will report a want of rights
      - Machines already joined work unchanged and their passwords renew as usual
      - The rejoining of a machine whose account stands in the domain does not take this right
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowiska robocze przyłącza do domeny obsługa techniczna pracująca na kontach zwykłych
      - Wdrożenie zautomatyzowane przyłącza maszyny na koncie usługowym spoza grupy administratorów
      - Maszyna nie jest kontrolerem domeny i punkt nie ma na niej zastosowania
    en:
      - Working stations are joined to the domain by technical support working under ordinary accounts
      - An automated rollout joins machines under a service account outside the administrators' group
      - The machine is no domain controller and the item does not apply on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeMachineAccountPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeMachineAccountPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeMachineAccountPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeMachineAccountPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/add-workstations-to-domain

notes:
  pl: |
    Punkt ma zastosowanie wyłącznie na kontrolerze domeny. Na serwerze
    członkowskim wykaz istnieje, ale nie rozstrzyga o niczym.

    Ustawienie domyślne — wszyscy uwierzytelnieni użytkownicy, do
    dziesięciu maszyn na osobę — pochodzi z czasów, gdy przyłączanie
    komputerów rozkładano na wielu ludzi. Jest zastane, nie wybrane.

    Kto wdraża stanowiska, temu nadaj prawo do tworzenia kont
    komputerów w konkretnej jednostce organizacyjnej. Jest to
    uprawnienie węższe i nie wymaga obecności w tym wykazie.
  en: |
    The item applies on a domain controller alone. On a member server the list stands but
    settles nothing.

    The default setting - every authenticated user, up to ten machines apiece - comes of the
    days when the joining of computers was spread over many people. It is inherited rather than
    chosen.

    To whoever rolls the stations out, grant the right to make computer accounts in a particular
    organisational unit. That is a narrower entitlement and takes no standing in this list.
