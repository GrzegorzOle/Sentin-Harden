id: win2025-create-pagefile-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Tworzenie pliku stronicowania tylko dla administratorów
    en: Creating a paging file restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala utworzyć plik stronicowania, zmienić jego rozmiar
    i wskazać dysk, na którym ma leżeć.

    Plik stronicowania jest miejscem, dokąd system odkłada zawartość
    pamięci, gdy zaczyna jej brakować. Trafia tam wszystko, co w pamięci
    było: fragmenty dokumentów, zawartość formularzy, klucze i hasła
    przetwarzane przez programy.

    Stąd bierze się znaczenie tego prawa. Wskazanie dysku przesądza,
    gdzie ta zawartość wyląduje — a dysk wskazany może być
    nieszyfrowany, może być woluminem udostępnionym albo może być
    miejscem, do którego dostęp ma ktoś jeszcze. Sam mechanizm
    stronicowania jest wtedy drogą wyniesienia danych z pamięci na
    nośnik czytelny dla kogoś innego.

    Druga droga jest prostsza i dotyczy dostępności. Plik stronicowania
    o rozmiarze zerowym albo umieszczony na dysku pełnym potrafi
    wprowadzić serwer w stan, w którym zabraknie mu pamięci pod
    obciążeniem — a objaw pojawi się dopiero wtedy, gdy obciążenie
    nadejdzie.

    Na serwerze waży to więcej niż na stanowisku roboczym, bo serwer
    pracuje pod obciążeniem stałym i przetwarza w pamięci dane wielu
    osób naraz.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    skierowania zawartości pamięci serwera na nośnik, do którego ma
    dostęp, albo zatrzymania maszyny pod obciążeniem.
  en: |
    The right allows a paging file to be made, its size changed and the disk it is to lie on
    named.

    The paging file is the place the system lays the contents of memory down in when memory
    starts running short. Everything that was in memory lands there: parts of documents, the
    contents of forms, keys and passwords handled by programs.

    Thence comes this right's weight. Naming the disk settles where those contents will land -
    and the disk named may be unencrypted, may be a volume given out, or may be a place
    somebody else has access to. The paging mechanism itself is then a road of carrying data
    out of memory onto media readable by another.

    The second road is simpler and bears on availability. A paging file of nil size or placed
    on a full disk can bring a server into a state where it runs short of memory under load -
    and the symptom will appear only once the load comes.

    On a server that weighs more than at a working station, since a server works under steady
    load and handles many people's data in memory at once.

    What an attacker gains while the item goes unmet: the means of turning the server's memory
    contents onto media they have access to, or of halting the machine under load.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    większości serwerów naprawa nie zmienia niczego.

    Plik stronicowania działa dalej bez zmiany. Naprawa dotyczy tego,
    kto może go zmienić, a nie tego, jak on obecnie wygląda — ustawienia
    bieżące zostają nietknięte.

    Administratorzy zachowują prawo, więc dostrajanie pamięci przy
    wdrożeniu aplikacji i zmiana rozmiaru po rozbudowie serwera działają
    dalej.

    Skutek dotyczy wyłącznie kont spoza grupy administratorów, którym
    prawo nadano dodatkowo. Na serwerze bywają to konta narzędzi
    dostrajających wydajność, którym nadano je przy wdrożeniu.

    Objaw, gdyby wystąpił, jest natychmiastowy i czytelny: odmowa przy
    próbie zmiany ustawień pamięci wirtualnej.
  en: |
    The change has no known side effects and takes no break.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    The paging file goes on working unchanged. The mending bears on who may change it rather
    than on how it now looks - the present settings are left untouched.

    Administrators keep the right, so the tuning of memory at an application's rollout and the
    changing of size after a server has been enlarged go on working.

    The effect concerns only accounts outside the administrators' group that were granted the
    right besides. On a server those are at times the accounts of performance tuning tools,
    granted at a rollout.

    The symptom, should it arise, is immediate and plain: a refusal at a try to change the
    settings of virtual memory.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - encryption-and-tls
  what_breaks:
    pl:
      - Narzędzie dostrajające wydajność na koncie spoza grupy administratorów zgłosi odmowę
      - Plik stronicowania działa dalej bez zmiany, bo naprawa nie dotyka ustawień bieżących
      - Administratorzy zachowują prawo, więc dostrajanie pamięci działa dalej
      - W stanie domyślnym prawo mają wyłącznie administratorzy i zmiana nie robi nic
    en:
      - A performance tuning tool under an account outside the administrators' group will report a refusal
      - The paging file goes on working unchanged, since the mending does not touch the present settings
      - Administrators keep the right, so the tuning of memory goes on working
      - In the default state only administrators hold the right and the change does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie dostrajające pamięć pracuje na koncie spoza grupy administratorów i zmienia ustawienia samoczynnie
    en:
      - A memory tuning tool works under an account outside the administrators' group and changes the settings of itself
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeCreatePagefilePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeCreatePagefilePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeCreatePagefilePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeCreatePagefilePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeCreatePagefilePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/create-a-pagefile

notes:
  pl: |
    Naprawa nie zmienia ustawień pliku stronicowania. Dotyczy wyłącznie
    tego, kto może je zmienić, więc stan bieżący pozostaje nietknięty.

    Punkt czyta się razem z szyfrowaniem woluminu systemowego.
    Zawartość pamięci odłożona do pliku stronicowania na dysku
    nieszyfrowanym jest czytelna dla każdego, kto ten dysk odczyta poza
    systemem.

    Osobnym zagadnieniem jest czyszczenie pliku stronicowania przy
    zamykaniu systemu. Jest to inne ustawienie i inny punkt — to prawo
    przesądza, kto plik może utworzyć, a nie co się z nim dzieje przy
    wyłączeniu maszyny.
  en: |
    The mending does not change the paging file's settings. It bears only on who may change
    them, so the present state is left untouched.

    The item is read together with the encrypting of the system volume. Memory contents laid
    down in a paging file on an unencrypted disk are readable by anyone who reads that disk
    outside the system.

    A matter apart is the clearing of the paging file at the system's shutting down. That is
    another setting and another item - this right settles who may make the file rather than
    what happens to it at the machine's switching off.
