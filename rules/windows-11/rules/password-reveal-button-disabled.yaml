id: win11-password-reveal-button-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Credential User Interface
  title:
    pl: Przycisk pokazujący wpisywane hasło ukryty
    en: The button revealing a typed password hidden
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Przy polach na hasło system pokazuje ikonę oka, po której naciśnięciu hasło
    wyświetla się otwartym tekstem. Powstało to dla osób, które wpisują długie
    hasło i chcą sprawdzić, czy się nie pomyliły.

    Zagrożenie jest proste i całkowicie fizyczne: hasło pojawia się na ekranie.
    Widzi je każdy, kto stoi obok, każda kamera skierowana na stanowisko i każde
    spotkanie zdalne, na którym akurat udostępniany jest ekran. To ostatnie jest
    dziś najczęstszym przypadkiem i zarazem najgorszym, bo spotkania bywają
    nagrywane — hasło zostaje wtedy zapisane w pliku, o którym nikt nie myśli
    jak o miejscu przechowywania haseł.

    Ukrycie przycisku nie zamyka żadnej drogi zdalnej i stąd kategoria średnia.
    Odbiera natomiast najprostszy istniejący sposób na to, żeby hasło opuściło
    głowę użytkownika i trafiło na ekran.
  en: |
    Next to password fields the system shows an eye icon which, when pressed,
    displays the password in plain text. It was made for people typing a long
    password who want to check they have not mistyped.

    The threat is simple and entirely physical: the password appears on the
    screen. It is seen by anybody standing nearby, by every camera pointed at the
    station, and by every remote meeting where a screen happens to be shared. The
    last is today the commonest case and also the worst, because meetings are
    sometimes recorded - the password is then written into a file nobody thinks of
    as a place where passwords are kept.

    Hiding the button closes no remote route, hence the medium category. What it
    does take away is the simplest existing way for a password to leave the user's
    head and land on the screen.

disruption_description:
  pl: |
    Nic nie przestaje działać. Znika ikona obok pola na hasło.

    Odczuje to osoba, która ma długie hasło i sprawdzała nim, czy wpisała je
    dobrze. Po zmianie zostaje jej wpisać ponownie, gdy logowanie się nie uda.
    Jest to niewygoda, nie przeszkoda, i mija po kilku dniach.

    Logowanie, podnoszenie uprawnień, zapisane hasła w przeglądarce i menedżery
    haseł działają bez zmian — ten punkt dotyczy wyłącznie pól obsługiwanych
    przez sam system.

    Nie ma restartu ani wylogowania. Zmiana jest natychmiastowa i natychmiast
    odwracalna.
  en: |
    Nothing stops working. An icon next to the password field disappears.

    It will be felt by somebody with a long password who used it to check they had
    typed it right. After the change they are left retyping it when the sign-in
    fails. That is an inconvenience, not an obstacle, and it passes within days.

    Signing in, elevating, saved browser passwords and password managers all work
    unchanged - this item concerns only the fields the system itself handles.

    There is no restart and no sign-out. The change is immediate and immediately
    reversible.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Nie da się już sprawdzić wzrokiem, czy długie hasło zostało wpisane poprawnie
    en:
      - A long password can no longer be checked visually before submitting it
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
      $name = 'DisablePasswordReveal'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    $name = 'DisablePasswordReveal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CredUI'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisablePasswordReveal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-credentialsui

notes:
  pl: |
    Ustawienie obejmuje pola obsługiwane przez system i przez programy, które
    korzystają z systemowego okna poświadczeń. Nie obejmuje przeglądarek ani
    programów rysujących własne pole na hasło, a takich jest coraz więcej.

    Warto to powiedzieć wprost, bo spełnienie tego punktu łatwo przeczytać jako
    „hasła nie da się u nas pokazać na ekranie", a to nieprawda. Da się —
    w przeglądarce, w programie pocztowym i w większości aplikacji sieciowych.
    Punkt zamyka tę drogę tam, gdzie system ma nad nią władzę, i tylko tam.
  en: |
    The setting covers fields handled by the system and by programs that use the
    system credential window. It does not cover browsers or programs drawing a
    password field of their own, and there are more of those all the time.

    Worth saying plainly, because satisfying this item is easily read as "a
    password cannot be shown on screen here", and that is untrue. It can - in the
    browser, in the mail program and in most web applications. The item closes
    that route where the system has authority over it, and only there.
