id: win2016-virtualization-based-security-enabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Zabezpieczenia oparte na wirtualizacji włączone
    en: Virtualization-based security enabled
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie włącza warstwę zabezpieczeń opartą na wirtualizacji —
    oddzielne, mniejsze środowisko uruchamiane obok systemu i chronione
    przed nim przez ten sam mechanizm, którym oddziela się maszyny
    wirtualne od siebie.

    Założenie, które ta warstwa podważa, brzmi: kto ma jądro, ten ma
    wszystko. Przez lata było prawdziwe. Kod działający w jądrze mógł
    czytać dowolny obszar pamięci, więc przejęcie jądra oznaczało dostęp do
    wszystkiego, co w pamięci leżało — łącznie z poświadczeniami.

    Warstwa ta przenosi najwrażliwsze rzeczy poza zasięg jądra. Jądro nadal
    rządzi systemem, ale przestaje mieć dostęp do obszarów oddzielonych
    przez hipernadzorcę. Napastnik, który przejął jądro, zyskuje wiele,
    ale nie zyskuje już wszystkiego.

    Punkt ten sam w sobie niczego nie chroni — włącza warstwę, na której
    stoją zabezpieczenia opisane w regułach sąsiednich. Jest fundamentem,
    nie ochroną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełny dostęp
    do pamięci systemu po przejęciu jądra, bez żadnego obszaru pozostającego
    poza jego zasięgiem.
  en: |
    The setting switches on a layer of security resting on virtualisation - a separate,
    smaller environment started beside the system and guarded from it by the same mechanism by
    which virtual machines are kept apart from one another.

    The assumption that layer undermines runs: whoever has the kernel has everything. For
    years it was true. Code running in the kernel could read any area of memory, so taking the
    kernel over meant access to everything lying in memory - credentials among them.

    That layer moves the most sensitive things beyond the kernel's reach. The kernel still
    rules the system but ceases to have access to the areas set apart by the hypervisor. An
    attacker who has taken the kernel over gains much but no longer gains everything.

    This item of itself guards nothing - it switches on the layer on which the safeguards
    described in the neighbouring rules stand. It is a ground, not a guard.

    What an attacker gains while the item goes unmet: full access to the system's memory once
    the kernel is taken over, with no area staying beyond its reach.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", bo warstwa ta zajmuje zasoby
    i zmienia warunki pracy wirtualizacji na tej maszynie.

    Pierwszy skutek dotyczy zagnieżdżenia. Maszyna, na której włączono tę
    warstwę, sama korzysta z hipernadzorcy — a więc maszyna wirtualna,
    która miałaby to zrobić, potrzebuje wirtualizacji zagnieżdżonej.
    Na starszych wersjach nadzorcy i na części platform obcych nie jest to
    dostępne i warstwa się nie włączy.

    Drugi skutek dotyczy roli nadzorcy maszyn wirtualnych. Serwer pełniący
    tę rolę może warstwę włączyć, ale narzut hipernadzorcy dokłada się do
    narzutu, który już ponosi. Na maszynie z ciasnym zapasem pamięci
    i procesora bywa to odczuwalne.

    Trzeci skutek dotyczy sprzętu. Warstwa wymaga wsparcia wirtualizacji
    w procesorze i włączenia go w oprogramowaniu układowym. Na serwerze
    sprzed lat bywa ono wyłączone domyślnie, a jego włączenie wymaga
    restartu z dostępem do ustawień płyty.

    Rzecz do zapamiętania: po włączeniu warstwa nie zaczyna działać od razu.
    Wymaga restartu i sprawdzenia po nim, czy faktycznie wstała — sam wpis
    w rejestrze niczego nie dowodzi.

    Czego to nie psuje: usług, sieci, aplikacji, udziałów, uwierzytelniania.

    Wymaga restartu; cofnięcie działa po kolejnym restarcie.
  en: |
    The class is "needs a planned rollout", the layer taking up resources and changing the
    conditions of virtualisation's working on this machine.

    The first consequence concerns nesting. A machine on which that layer is switched on itself
    uses a hypervisor - and so a virtual machine that would do the same needs nested
    virtualisation. On older versions of the supervisor and on some foreign platforms that is
    not to be had and the layer will not come on.

    The second consequence concerns the role of a virtual machine supervisor. A server filling
    that role may switch the layer on, but the hypervisor's overhead adds to the overhead it
    already bears. On a machine with a tight margin of memory and processor that is at times
    felt.

    The third consequence concerns hardware. The layer calls for virtualisation support in the
    processor and for its being switched on in the firmware. On a server of years past it is at
    times off by default, and switching it on calls for a restart with access to the board's
    settings.

    A thing to keep in mind: once switched on, the layer does not begin working at once. It
    calls for a restart and for a check afterwards whether it in fact came up - the registry
    entry by itself proves nothing.

    What this does not break: services, the network, applications, shares, or authentication.

    Calls for a restart; the undoing works after a further restart.

implementation_consequences:
  impact_areas:
    - virtualization-and-containers
    - boot-and-firmware
    - drivers-and-devices
  what_breaks:
    pl:
      - Maszyna wirtualna, na której warstwę się włącza, potrzebuje wirtualizacji zagnieżdżonej, a na części platform nie jest ona dostępna
      - Serwer pełniący rolę nadzorcy maszyn wirtualnych ponosi narzut hipernadzorcy dokładający się do narzutu już ponoszonego
      - Bez wsparcia wirtualizacji włączonego w oprogramowaniu układowym warstwa nie wstanie, a wpis w rejestrze pozostanie
      - Usługi, sieć, aplikacje i udziały pozostają bez zmian
    en:
      - A virtual machine on which the layer is switched on needs nested virtualisation, and on some platforms that is not to be had
      - A server filling the role of a virtual machine supervisor bears a hypervisor overhead adding to the one it already bears
      - Without virtualisation support switched on in the firmware the layer will not come up, and the registry entry will stay
      - Services, the network, applications and shares stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna pracuje jako gość na platformie bez wirtualizacji zagnieżdżonej
      - Zapas pamięci i procesora na tej maszynie jest ciasny, a narzut hipernadzorcy nie został policzony
      - Wsparcie wirtualizacji jest wyłączone w oprogramowaniu układowym i nie ma dostępu do ustawień płyty
    en:
      - The machine works as a guest on a platform without nested virtualisation
      - The margin of memory and processor on this machine is tight and the hypervisor's overhead has not been reckoned
      - Virtualisation support is off in the firmware and there is no access to the board's settings
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
      $name = 'EnableVirtualizationBasedSecurity'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    $name = 'EnableVirtualizationBasedSecurity'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualizationBasedSecurity' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/enable-virtualization-based-protection-of-code-integrity

notes:
  pl: |
    Punkt jest fundamentem trójki o zabezpieczeniach opartych na
    wirtualizacji i warto pokazywać go jako fundament, a nie jako jedną
    z trzech równorzędnych pozycji. Sam z siebie nie chroni niczego —
    udostępnia warstwę, z której korzystają pozostałe dwa.

    Wynika z tego porządek wdrażania, którego nie da się odwrócić. Włączenie
    integralności kodu bez tej warstwy nie robi nic; włączenie tej warstwy
    bez integralności kodu robi niewiele, ale przygotowuje grunt. Aplikacja
    powinna to rozstrzygać za użytkownika i proponować całą trójkę razem,
    zamiast wypisywać trzy niezależne niezgodności.

    Rozbieżność między wpisem a stanem faktycznym jest tu ważniejsza niż
    przy większości punktów. Rejestr może mówić „włączone", a warstwa może
    nie wstać — z braku wsparcia w procesorze, z wyłączonego ustawienia
    płyty, z braku wirtualizacji zagnieżdżonej. Raport oparty wyłącznie na
    odczycie rejestru pokaże wtedy zgodność, której nie ma, i jest to
    jedyne miejsce w bloku, gdzie warto to powiedzieć wprost.
  en: |
    The item is the ground of the three about security resting on virtualisation, and it is
    worth showing as a ground rather than as one of three equal entries. Of itself it guards
    nothing - it makes available the layer the other two use.

    From that follows an order of rollout that cannot be turned about. Switching code integrity
    on without that layer does nothing; switching that layer on without code integrity does
    little but prepares the ground. The application should settle that for the user and offer
    all three together rather than list three independent non-compliances.

    The divergence between the entry and the state in fact matters more here than at most
    items. The registry may say "switched on" while the layer does not come up - for want of
    support in the processor, from a setting off in the board, from an absence of nested
    virtualisation. A report resting on a reading of the registry alone will then show a
    compliance that is not there, and it is the one place in the block where that is worth
    saying outright.
