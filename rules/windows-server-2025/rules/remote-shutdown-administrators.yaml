id: win2025-remote-shutdown-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Wymuszanie zamknięcia z systemu zdalnego zastrzeżone dla administratorów
    en: Forcing shutdown from a remote system restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala zamknąć albo zrestartować tę maszynę z innej maszyny,
    bez logowania się na niej.

    Jest to prawo bliźniacze wobec zamykania systemu, ale różnica między
    nimi jest istotna. Tamto wymaga sesji na maszynie — czyli
    wcześniejszego zalogowania się, które zostawia ślad i podlega
    wszystkim ograniczeniom logowania. To wystarcza samo: napastnik
    z konta w sieci zatrzymuje serwer, nie zakładając na nim sesji.

    Na serwerze różnica ta waży podwójnie. Po pierwsze, serwer
    z założenia przyjmuje połączenia sieciowe, więc droga jest otwarta
    zawsze. Po drugie, ograniczenia logowania — a te zbudowano
    starannie, osobnym punktem na każdy rodzaj logowania — tego
    kierunku nie obejmują.

    Zastosowanie napastnika jest takie samo jak przy prawie bliźniaczym:
    zatrzymanie usługi bez uprawnień do niej oraz wymuszenie restartu,
    po którym zaczyna działać to, co zostało podłożone. Sposób jest
    jednak szybszy i tańszy, bo nie wymaga przejścia przez logowanie.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zatrzymania serwera z sieci, bez zakładania na nim sesji
    i bez potykania się o ograniczenia logowania.
  en: |
    The right allows this machine to be shut down or restarted from another machine, without
    logging in to it.

    It is a twin right to the shutting down of the system, but the difference between them
    weighs. That one takes a session on the machine - that is, an earlier logging in, which
    leaves a trace and falls under every bound set on logging in. This one is enough of itself:
    an attacker from an account on the network halts the server without opening a session on it.

    On a server that difference weighs twice over. First, a server by its nature takes network
    connections, so the road is always open. Second, the bounds on logging in - and those were
    built with care, an item apiece for every kind of logging in - do not take in this
    direction.

    An attacker's use is the same as at the twin right: a halting of the service with no rights
    to it, and a forcing of the restart after which what was planted begins working. The way is
    quicker and cheaper, though, since it takes no passage through a logging in.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: the means of halting the server from the
    network, without opening a session on it and without stumbling on the bounds set on logging
    in.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy restarty tego serwera zleca narzędzie
    zarządzające pracujące na koncie spoza grupy administratorów.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc
    na większości serwerów naprawa nie zmienia niczego.

    Przypadkiem do sprawdzenia jest zarządzanie aktualizacjami. Serwery
    restartuje się po instalacji poprawek i robi to zwykle narzędzie
    centralne, zdalnie, w oknie serwisowym. Jeżeli narzędzie takie
    pracuje na koncie usługowym umieszczonym poza administratorami —
    a bywa, że tak właśnie je skonfigurowano, żeby ograniczyć jego
    uprawnienia — restart przestanie się udawać.

    Objaw jest wtedy podstępny. Poprawki instalują się poprawnie,
    narzędzie zgłasza powodzenie instalacji, a maszyna nie wstaje
    ponownie i zostaje w stanie oczekiwania na restart. Zauważa się to
    po tygodniach, kiedy narasta wykaz aktualizacji niedokończonych.

    Zmiana nie dotyczy restartu zlecanego przez sam system ani przez
    zadania pracujące na koncie systemowym tej maszyny. Nie dotyczy też
    zamknięcia przez hosta wirtualizacji i kartę zarządzającą — obie
    drogi omijają system operacyjny.
  en: |
    What needs checking is whether this server's restarts are ordered by a management tool
    working under an account outside the administrators' group.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    The case to be checked is the managing of updates. Servers are restarted after the
    installing of patches, and it is usually a central tool that does it, remotely, in a service
    window. Where such a tool works under a service account placed outside the administrators -
    and it is at times set up just so, to hold its rights down - the restart will stop
    succeeding.

    The symptom is then sly. The patches install rightly, the tool reports the installing a
    success, and the machine does not come up again and stays awaiting a restart. It is noticed
    after weeks, as the list of unfinished updates grows.

    The change does not bear on a restart ordered by the system itself or by tasks working under
    this machine's system account. Neither does it bear on a shutting down by the virtualisation
    host and the management card - both roads go round the operating system.

implementation_consequences:
  impact_areas:
    - remote-management
    - updates-and-servicing
    - network-and-firewall
  what_breaks:
    pl:
      - Narzędzie zarządzania aktualizacjami na koncie spoza grupy administratorów nie zrestartuje serwera
      - Objaw jest podstępny — poprawki instalują się, a maszyna zostaje w stanie oczekiwania na restart
      - Restart zlecany przez sam system i przez zadania na koncie systemowym działa bez zmiany
      - Zamknięcie z hosta wirtualizacji i karty zarządzającej pozostaje dostępne
    en:
      - An update management tool under an account outside the administrators' group will not restart the server
      - The symptom is sly - the patches install while the machine stays awaiting a restart
      - A restart ordered by the system itself and by tasks under the system account goes on unchanged
      - Shutting down from the virtualisation host and the management card stays open
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Restarty po instalacji poprawek zleca zdalnie narzędzie pracujące na koncie usługowym spoza administratorów
      - Nie ustalono, na jakim koncie pracuje narzędzie restartujące ten serwer
    en:
      - Restarts after the installing of patches are ordered remotely by a tool working under a service account outside the administrators
      - It has not been settled what account the tool restarting this server works under
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeRemoteShutdownPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeRemoteShutdownPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeRemoteShutdownPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeRemoteShutdownPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeRemoteShutdownPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/force-shutdown-from-a-remote-system

notes:
  pl: |
    Punkt czyta się razem z zamykaniem systemu. Tamto prawo wymaga
    sesji na maszynie, to wystarcza samo — i dlatego to jest drogą
    krótszą, omijającą wszystkie ograniczenia logowania.

    Najczęstszym powodem niezgodności na serwerze jest konto usługowe
    narzędzia zarządzania aktualizacjami, któremu prawo nadano celowo,
    żeby nie musiało być administratorem. Jest to przypadek do wyjątku,
    a nie do odpuszczenia całego punktu.

    Zamknięcie przez hosta wirtualizacji i kartę zarządzającą omija
    system operacyjny i pozostaje dostępne.
  en: |
    The item is read together with the shutting down of the system. That right takes a session
    on the machine, this one is enough of itself - and hence this is the shorter road, going
    round every bound set on logging in.

    The commonest cause of non-compliance on a server is the service account of an update
    management tool, granted the right on purpose so that it need not be an administrator. That
    is a case for an exception rather than for letting the whole item go.

    Shutting down by the virtualisation host and the management card goes round the operating
    system and stays open.
