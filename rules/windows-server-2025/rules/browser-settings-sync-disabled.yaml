id: win2025-browser-settings-sync-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Sync your settings
  title:
    pl: Synchronizowanie ustawień przeglądarki wyłączone
    en: Synchronising the browser's settings switched off
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza przenoszenie ustawień przeglądarki między maszynami przez
    konto w chmurze i odbiera użytkownikowi możliwość włączenia tego
    z powrotem.

    Kategoria wysoka i wyższa niż przy pozostałych punktach o synchronizacji,
    bo przedmiot jest inny. Ustawienia przeglądarki to nie jest układ okien
    ani lista zakładek. To zapisane hasła, wypełniane automatycznie dane,
    ciasteczka sesji i historia — czyli materiał, którym się logujemy,
    i zapis tego, dokąd się logowaliśmy.

    To jest właściwa treść punktu. Materiał uwierzytelniający zebrany na
    jednej maszynie pojawia się na każdej innej, na której ktoś zaloguje się
    tym samym kontem w chmurze. Zasięg tego, co leżało na serwerze,
    przestaje być wyznaczany przez dostęp do serwera, a zaczyna przez
    dostęp do cudzego konta u dostawcy.

    Na serwerze ma to skutek szczególny. Hasła zapisane w przeglądarce na
    serwerze to zwykle hasła do paneli administracyjnych, do urządzeń
    sieciowych, do konsol zarządzania. Przeniesione na prywatne stanowisko
    przestają podlegać jakiemukolwiek zabezpieczeniu, które ustawiono tutaj.

    Punkt niosą dwie wartości: sam przełącznik i wpis odbierający
    użytkownikowi wybór. Bez tego drugiego ustawienie jest sugestią, nie
    zasadą — audyt sprawdza oba i mówi wprost, którego brakuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    haseł i ciasteczek sesji z tego serwera na każdej maszynie, na której
    zaloguje się przejętym kontem u dostawcy.
  en: |
    The item switches off the carrying of the browser's settings between
    machines through a cloud account, and takes from the user the ability to
    switch it back on.

    The category is high, and higher than for the other items about
    synchronisation, because the subject is different. A browser's settings
    are not a window layout or a list of bookmarks. They are saved passwords,
    automatically filled data, session cookies and history - the material we
    sign in with, and the record of where we signed in.

    That is the real substance of the item. Authentication material gathered
    on one machine appears on every other where somebody signs in with the
    same cloud account. The reach of what lay on the server stops being set
    by access to the server and starts being set by access to somebody's
    account with a provider.

    On a server this has a particular consequence. Passwords saved in a
    browser on a server are usually passwords to administrative panels, to
    network devices, to management consoles. Carried onto a private
    workstation, they cease to be covered by any protection set up here.

    Two values carry this item: the switch itself and the entry taking the
    choice away from the user. Without the second the setting is a
    suggestion, not a rule - the audit checks both and says plainly which is
    missing.

    What an attacker gains while the item goes unmet: access to passwords and
    session cookies from this server on every machine where they sign in with
    a captured provider account.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy ludzi, nie maszyny.
    Na serwerze z przeglądarki korzysta się rzadko i zwykle nie ma tu czego
    przenosić, więc realne pytanie brzmi: czy ktoś liczy na to, że jego
    hasła pojawią się tutaj same.

    Jeżeli tak, po zastosowaniu reguły przestaną. Trzeba będzie wpisać je
    ręcznie albo — co jest odpowiedzią właściwą — sięgnąć po nie tam, gdzie
    organizacja trzyma poświadczenia. To jest zmiana sposobu pracy
    i uprzedzenie o niej jest tańsze niż zgłoszenie.

    Czego to nie psuje: przeglądania stron, zapisywania haseł lokalnie na
    tej maszynie, zakładek utworzonych tutaj, logowania kontem domenowym ani
    dostępu do zasobów organizacji.

    Rzecz do zapamiętania: reguła zatrzymuje przenoszenie, ale nie usuwa
    tego, co zostało przeniesione wcześniej. Hasła, które już tu trafiły,
    zostają w profilu przeglądarki i usuwa się je osobno.

    Bez przerwy, natychmiast odwracalne.
  en: |
    The class is "needs review", and the review concerns people rather than
    the machine. A browser is used on a server rarely and there is usually
    nothing here to carry over, so the real question is: does anybody count
    on their passwords appearing here by themselves.

    If so, after the rule is applied they will stop. They will have to be
    typed by hand or - which is the proper answer - fetched from wherever the
    organisation keeps credentials. That is a change in the way of working,
    and warning about it costs less than a support report.

    What this does not break: browsing pages, saving passwords locally on
    this machine, bookmarks made here, signing in with a domain account, or
    access to the organisation's resources.

    Something to remember: the rule stops the carrying over, but does not
    remove what was carried over earlier. Passwords that already reached this
    machine stay in the browser's profile and are removed separately.

    No outage, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
    - legacy-applications
  what_breaks:
    pl:
      - Hasła, zakładki i historia z innych maszyn przestaną pojawiać się tutaj same
      - Poświadczenia trzeba będzie wpisać ręcznie albo sięgnąć po nie tam, gdzie organizacja trzyma hasła
      - Reguła zatrzymuje przenoszenie, ale nie usuwa tego, co zostało przeniesione wcześniej
      - Przeglądanie stron, zapisywanie haseł lokalnie, zakładki utworzone tutaj i logowanie kontem domenowym działają bez zmian
    en:
      - Passwords, bookmarks and history from other machines stop appearing here by themselves
      - Credentials will have to be typed by hand or fetched from wherever the organisation keeps passwords
      - The rule stops the carrying over but does not remove what was carried over earlier
      - Browsing pages, saving passwords locally, bookmarks made here and signing in with a domain account work unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca na tej maszynie opiera się na poświadczeniach przenoszonych z innego stanowiska i nie ma dla nich innego źródła
    en:
      - Work on this machine rests on credentials carried over from another workstation and there is no other source for them
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Two values carry this item: the switch itself and the entry taking the
      # choice away from the user.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $switch = $item.'DisableWebBrowserSettingSync'
        $override = $item.'DisableWebBrowserSettingSyncUserOverride'
        if ($null -eq $switch -or $null -eq $override) { 'MISSING' }
        elseif ([int]$switch -ne 2) { 'NOT_BLOCKED' }
        elseif ([int]$override -ne 1) { 'USER_CAN_OVERRIDE' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'AS_REQUIRED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path             = $path
      switch           = $item.'DisableWebBrowserSettingSync'
      switch_existed   = ($null -ne $item.'DisableWebBrowserSettingSync')
      override         = $item.'DisableWebBrowserSettingSyncUserOverride'
      override_existed = ($null -ne $item.'DisableWebBrowserSettingSyncUserOverride')
      key_existed      = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The subject is not a window layout but saved passwords, session cookies
    # and history. On a server those are passwords to administrative panels and
    # management consoles. The second value matters as much as the first: without
    # it the setting is a suggestion rather than a rule.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\SettingSync'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSync' -Value 2 -Type DWord
    Set-ItemProperty -Path $path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.switch_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSync' -Value $b.switch -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSync' -ErrorAction SilentlyContinue
    }
    if ($b.override_existed) {
      Set-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSyncUserOverride' -Value $b.override -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DisableWebBrowserSettingSyncUserOverride' -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-experience

notes:
  pl: |
    Kategoria wyższa niż przy pozostałych punktach o synchronizacji, bo
    przedmiot jest inny: nie układ okien, tylko zapisane hasła, dane
    wypełniane automatycznie, ciasteczka sesji i historia.

    Na serwerze hasła zapisane w przeglądarce to zwykle hasła do paneli
    administracyjnych, urządzeń sieciowych i konsol zarządzania. Przeniesione
    na prywatne stanowisko przestają podlegać zabezpieczeniom ustawionym
    tutaj.

    Punkt niosą dwie wartości: przełącznik i wpis odbierający wybór
    użytkownikowi. Bez tego drugiego ustawienie jest sugestią, nie zasadą.
  en: |
    A higher category than the other items about synchronisation, because the
    subject is different: not a window layout but saved passwords,
    automatically filled data, session cookies and history.

    On a server, passwords saved in a browser are usually passwords to
    administrative panels, network devices and management consoles. Carried
    onto a private workstation, they cease to be covered by the protections
    set up here.

    Two values carry the item: the switch and the entry taking the choice
    away from the user. Without the second the setting is a suggestion, not a
    rule.
