id: win11-audit-generation-service-accounts

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Generowanie wpisów inspekcji ograniczone do kont usługowych
    en: Generating audit entries restricted to service accounts
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Uprawnienie pozwala procesowi dopisać własny wpis do dziennika zabezpieczeń.
    Korzystają z niego składniki, które same obsługują uwierzytelnianie
    i muszą zgłosić jego wynik — a dziennik zabezpieczeń jest jedynym miejscem,
    w którym taki wynik ma sens.

    Konto spoza tego zestawu, które to potrafi, może pisać do dziennika
    zabezpieczeń rzeczy nieprawdziwe. To nie usuwa zapisów, ale robi coś równie
    kłopotliwego: podważa wiarygodność całego dziennika, bo przestaje być
    pewne, które wpisy pochodzą od systemu. Osobno, zalewanie dziennika wpisami
    wypycha z niego starsze zdarzenia, jeśli ustawiono nadpisywanie.
  en: |
    The right allows a process to write its own entry into the security log. It is
    used by components that handle authentication themselves and must report its
    outcome - and the security log is the only place where such an outcome means
    anything.

    An account outside that set which can do this can write untrue things into the
    security log. That removes no records, but does something equally awkward: it
    undermines the credibility of the whole log, because it stops being certain
    which entries came from the system. Separately, flooding the log with entries
    pushes older events out of it, where overwriting is configured.

disruption_description:
  pl: |
    Nic. Uprawnienie mają domyślnie usługa lokalna i usługa sieciowa, i tyle
    wystarcza składnikom systemu, które z niego korzystają.

    Wyjątkiem bywa oprogramowanie zabezpieczające albo agent systemu zbierania
    zdarzeń, który dopisuje własne wpisy do dziennika zabezpieczeń zamiast do
    dziennika aplikacji. Taki agent po zmianie przestanie pisać, ale nie
    przestanie działać — jego wpisy po prostu zniknął z dziennika, co jest
    objawem cichym i trzeba go szukać, zamiast czekać, aż się zgłosi.
  en: |
    Nothing. By default the local service and the network service hold the right,
    and that suffices for the system components that use it.

    The exception is security software or an event collection agent that writes
    its own entries into the security log rather than the application log. After
    the change such an agent stops writing but does not stop working - its entries
    simply disappear from the log, which is a silent symptom and has to be looked
    for rather than waited on.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - accounts-and-passwords
  what_breaks:
    pl:
      - Agent zabezpieczeń dopisujący własne wpisy do dziennika zabezpieczeń przestanie je tam zapisywać
      - Objaw jest cichy, bo agent działa dalej, a wpisy po prostu znikają z dziennika
    en:
      - A security agent writing its own entries into the security log stops writing them there
      - The symptom is silent, as the agent keeps running and the entries simply stop appearing
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa agent zabezpieczeń zapisujący wpisy do dziennika zabezpieczeń z własnego konta
    en:
      - The machine runs a security agent writing entries into the security log from its own account
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAuditPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeAuditPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAuditPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAuditPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/generate-security-audits

notes:
  pl: |
    Ten punkt i zarządzanie dziennikiem zabezpieczeń dotyczą tego samego
    dziennika z dwóch stron: tamten ogranicza, kto może go wyczyścić, ten
    ogranicza, kto może do niego dopisać. Wiarygodność zapisu wymaga obu —
    dziennik, do którego każdy może pisać, jest równie mało wart jak dziennik,
    który każdy może skasować.

    Administratorzy nie znajdują się na liście wymaganej i to nie jest
    przeoczenie. Administrator dopisujący wpisy wprost do dziennika zabezpieczeń
    nie ma po temu powodu, a możliwość taką i tak może sobie nadać. Lista ma
    opisywać stan zamierzony, nie stan osiągalny.
  en: |
    This item and managing the security log concern the same log from two sides:
    that one limits who may clear it, this one limits who may write to it. The
    credibility of the record needs both - a log anybody can write to is worth as
    little as a log anybody can erase.

    Administrators are not on the required list and that is not an oversight. An
    administrator writing entries straight into the security log has no reason to,
    and can grant themselves the ability anyway. The list is meant to describe the
    intended state, not the attainable one.
