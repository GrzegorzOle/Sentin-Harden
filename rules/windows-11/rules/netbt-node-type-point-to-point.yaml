id: win11-netbt-node-type-point-to-point

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Tryb rozwiązywania nazw starszym mechanizmem ustawiony na zapytanie skierowane
    en: The older mechanism's name resolution mode set to a directed query
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Starszy mechanizm nazw sieciowych może szukać maszyn na dwa sposoby: pytając
    całą sieć rozgłoszeniem albo pytając wskazany serwer nazw. Tryb pracy
    rozstrzyga wpis przyjmujący wartości ze zbioru, a domyślnie maszyna zaczyna
    od rozgłoszenia.

    Rozgłoszenie jest tu całym problemem. Pytanie rzucone w sieć odbiera każdy,
    a odpowiedzieć może każdy — odpowiedź nie jest podpisana ani w żaden sposób
    sprawdzana, więc przyjmowana jest pierwsza, która wróci. Napastnik w tej
    samej sieci odpowiada na wszystko i kieruje ruch do siebie, a maszyna wysyła
    mu poświadczenia w postaci nadającej się do złamania albo do przekazania
    dalej.

    Ustawienie trybu na zapytanie skierowane odbiera tę możliwość u podstawy.
    Maszyna przestaje pytać sieć i pyta wyłącznie wskazany serwer. Nie ma
    pytania rzuconego w powietrze, więc nie ma czego przechwycić.

    Punkt jest trzecim zamknięciem tej samej drogi, obok wyłączenia mechanizmu
    na kartach sieciowych i wyłączenia go w kliencie nazw. Każde z nich działa
    na innym poziomie i żadne nie zastępuje pozostałych — wpis pozostaje
    w mocy również wtedy, gdy mechanizm wróci na nowej karcie albo w nowej
    sieci.
  en: |
    The older network name mechanism can look for machines in two ways: by asking the
    whole network with a broadcast, or by asking a named name server. An entry taking
    values from a set settles which mode is used, and by default the machine starts
    with a broadcast.

    The broadcast is the whole trouble here. A question thrown onto the network is
    received by everyone and may be answered by anyone - the answer is neither signed
    nor checked in any way, so the first one back is taken. An attacker on the same
    network answers everything and steers the traffic to themselves, and the machine
    sends them credentials in a form fit for cracking or for passing on.

    Setting the mode to a directed query takes that possibility away at its root. The
    machine stops asking the network and asks only the named server. There is no
    question thrown into the air, so there is nothing to intercept.

    The item is the third closing of the same route, beside switching the mechanism
    off on the network adapters and switching it off in the name client. Each works at
    a different level and none replaces the others - the entry stays in force even
    when the mechanism comes back on a new adapter or on a new network.

disruption_description:
  pl: |
    Zmiana zaczyna obowiązywać po ponownym uruchomieniu maszyny i potrafi odciąć
    starsze zasoby, więc wymaga świadomego wdrożenia.

    Skutek jest prosty do przewidzenia: maszyna przestaje znajdować po nazwie
    krótkiej cokolwiek, czego nie zna serwer nazw starszego mechanizmu. Jeżeli
    w sieci takiego serwera nie ma — a w większości dzisiejszych sieci go nie ma
    — to znaczy, że nie znajdzie tą drogą nic.

    W praktyce dotyczy to rzeczy starych: udziałów na maszynach spoza domeny,
    urządzeń przemysłowych z wbudowanym systemem, aplikacji z nazwą serwera
    wpisaną na sztywno w konfiguracji sprzed lat. Wszystko to pozostaje
    osiągalne po pełnej nazwie znanej zwykłemu serwerowi nazw albo po adresie.

    Drugim skutkiem jest lista maszyn w oknie otoczenia sieciowego. Opiera się
    częściowo na rozgłoszeniu i po wdrożeniu bywa pusta.

    Wdrożenie wymaga przejrzenia, czy nazwy używane przez aplikacje są znane
    zwykłemu serwerowi nazw. Jest to praca do wykonania przed zmianą, nie po niej.

    Wymagane jest ponowne uruchomienie maszyny.
  en: |
    The change takes effect once the machine is restarted and can cut off older
    resources, so it calls for a deliberate rollout.

    The effect is easy to foresee: the machine stops finding, by short name, anything
    the older mechanism's name server does not know. If the network has no such server
    - and most of today's networks do not - that means it will find nothing this way.

    In practice this concerns old things: shares on machines outside the domain,
    industrial devices with an embedded system, applications with a server's name
    written hard into a configuration made years ago. All of it stays reachable by a
    full name the ordinary name server knows, or by address.

    The second effect is the list of machines in the network neighbourhood window. It
    rests partly on broadcast and can be empty after the rollout.

    The rollout calls for going through whether the names applications use are known
    to the ordinary name server. That is work to be done before the change, not after.

    A restart of the machine is required.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
    - legacy-applications
  what_breaks:
    pl:
      - Maszyna przestanie znajdować po nazwie krótkiej wszystko, czego nie zna serwer nazw starszego mechanizmu
      - Udziały na maszynach spoza domeny przestaną być osiągalne po nazwie krótkiej
      - Lista maszyn w oknie otoczenia sieciowego bywa po wdrożeniu pusta
      - Zasoby pozostają osiągalne po pełnej nazwie albo po adresie
    en:
      - The machine stops finding by short name everything the older mechanism's name server does not know
      - Shares on machines outside the domain stop being reachable by a short name
      - The list of machines in the network neighbourhood window can be empty after the rollout
      - Resources stay reachable by a full name or by address
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - W sieci pracują urządzenia z wbudowanym systemem, odnajdywane wyłącznie rozgłoszeniem
      - Aplikacje odwołują się do serwerów po nazwach nieznanych zwykłemu serwerowi nazw
    en:
      - Devices with embedded systems, found by broadcast alone, work on the network
      - Applications refer to servers by names the ordinary name server does not know
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: one is broadcast only, two is a
      # directed query only, four and eight mix the two in a set order.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
      $name = 'NodeType'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
    $name = 'NodeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters' `
      -Name 'NodeType' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-and-nbt-configuration-parameters

notes:
  pl: |
    Wpis ustawiony ręcznie ma pierwszeństwo przed trybem rozdawanym razem
    z adresem. Jest to tutaj zaleta: maszyna zachowuje się tak samo w sieci
    firmowej i w obcej, a nie tak, jak każe jej sieć, do której właśnie się
    podłączyła.

    Punkt nakłada się na dwie inne reguły tej paczki: wyłączenie mechanizmu na
    kartach sieciowych i wyłączenie go w kliencie nazw. Nakładanie się jest
    zamierzone i nie jest powtórzeniem — karta może powstać nowa, klient może
    zostać przestawiony, a ten wpis obowiązuje niezależnie od obu.

    Wartości cztery i osiem mieszają oba sposoby i zostawiają rozgłoszenie jako
    drogę zastępczą, więc nie są zgodnością. Wymagana jest dwójka.

    Gałąź parametrów starszego mechanizmu jest wspólna z innymi jego
    ustawieniami, więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    An entry set by hand takes precedence over the mode handed out with the address.
    That is a merit here: the machine behaves the same on a company network and on a
    foreign one, rather than as the network it has just attached to tells it to.

    The item overlaps two other rules in this pack: switching the mechanism off on the
    network adapters and switching it off in the name client. The overlap is
    deliberate and is not a repetition - an adapter may be created anew, a client may
    be set back, and this entry holds regardless of both.

    The values four and eight mix the two ways and leave broadcast as a fallback
    route, so they are not compliance. Two is what is required.

    The older mechanism's parameters key is shared with its other settings, so
    rollback removes the entry alone.
