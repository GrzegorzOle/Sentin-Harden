id: win10-computer-browser-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa spisu maszyn w sieci lokalnej wyłączona
    en: The service keeping a register of machines upon the local network switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę prowadzącą spis maszyn widocznych w sieci
    lokalnej — tę, dzięki której komputery pojawiały się na liście
    otoczenia sieciowego.

    Mechanizm pochodzi z czasów przed powszechnym rozpoznawaniem nazw.
    Maszyny co jakiś czas rozgłaszają swoją obecność, jedna z nich
    obejmuje rolę prowadzącego spis, a reszta pyta ją o listę. Wszystko
    to dzieje się bez uwierzytelnienia i bez jakiegokolwiek potwierdzenia
    tożsamości.

    Zagrożenie płynie z obu stron naraz. Maszyna rozgłasza własną nazwę
    i rolę, czyli sama opisuje sieć napastnikowi, który tylko słucha.
    Jednocześnie przyjmuje spis od maszyny, która ogłosiła się
    prowadzącym — a ogłosić się może każdy, kto jest w tej sieci.

    Skutkiem drugim jest to, że nazwy z tego spisu prowadzą do zasobów.
    Użytkownik klikający maszynę na liście otoczenia łączy się tam,
    dokąd wskazał spis, a nie tam, dokąd zamierzał.

    Odnotowuję, że mechanizm jest wycofany. Rozpoznawanie maszyn w sieci
    lokalnej opiera się dziś na innych usługach i wyłączenie tej nie
    odbiera dostępu do udziałów po nazwie ani po adresie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: spis
    maszyn w sieci i możliwość podania w nim własnych wpisów.
  en: |
    The setting switches off the service keeping a register of the machines to be seen upon the local network -
    the one by which computers showed upon the roll of the neighbourhood.

    The mechanism comes out of the days before the knowing of names was everywhere. Machines from time to time put
    out word of their being there, one of them takes the office of keeper of the register, and the rest ask it for
    the roll. All that comes to pass without any proving and without any warrant of who is who.

    The danger flows from both sides at once. The machine puts out its own name and office, which is to say it
    sets out the network itself to an attacker who does no more than listen. At the same time it takes the
    register from a machine that gave itself out for the keeper - and anybody in that network may so give
    themselves out.

    The second upshot is that the names upon that register lead to shares. A user pressing a machine upon the roll
    of the neighbourhood joins themselves where the register pointed and not where they meant to go.

    I set down that the mechanism is drawn back. The knowing of machines upon a local network rests today upon
    other services, and the switching off of this one takes not the reach of shares by name nor by address.

    What an attacker gains while the item goes unmet: a register of the machines in the network and the power of
    putting entries of their own into it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś korzysta z listy otoczenia sieciowego jako drogi do udziałów.

    Miejscem wartym uwagi są małe sieci bez serwera nazw, w których
    przeglądanie otoczenia bywa jedynym znanym użytkownikowi sposobem
    dotarcia do folderu na innej maszynie. Po zmianie lista będzie pusta
    albo niepełna.

    Odnotowuję, że dostęp po nazwie i po adresie działa dalej. Udział
    otwarty przez wpisanie ścieżki albo przez skrót zapisany wcześniej
    otworzy się tak jak dotąd. Traci się przeglądanie, nie dostęp.

    Miejscem drugim są starsze programy branżowe wyszukujące serwer przez
    ten mechanizm. Zdarza się to rzadko, ale objawia się brakiem serwera
    na liście wyboru przy pierwszym uruchomieniu.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: dostępu do udziałów po nazwie i adresie, mapowanych
    dysków sieciowych, drukowania sieciowego, logowania, pracy programów.
  en: |
    The class is "needs review", and the object of the review is whether anybody uses the roll of the
    neighbourhood as a road to shares.

    The place worth notice is small networks without a server of names, in which the looking over of the
    neighbourhood is at times the one way a user knows of coming at a folder upon another machine. After the
    change the roll will stand empty or wanting.

    I set down that the reach by name and by address works on. A share opened by the writing out of a road or by a
    shortcut kept earlier will open as hitherto. What is lost is the looking over and not the reach.

    The second place is older programs of a trade that seek a server by this mechanism. That happens seldom, but
    shows itself as a want of the server upon the roll of choosing at the first setting going.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the reach of shares by name and address, drives of the network set to a letter,
    printing upon the network, logging on, or the work of programs.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Lista otoczenia sieciowego będzie pusta albo niepełna, co w małej sieci bez serwera nazw bywa jedyną znaną drogą do folderu
      - Starsze programy branżowe wyszukujące serwer tym mechanizmem nie pokażą go na liście wyboru przy pierwszym uruchomieniu
      - Dostęp po nazwie i po adresie działa dalej, więc traci się przeglądanie, a nie dostęp
      - Skróty i dyski mapowane zapisane wcześniej otwierają się tak jak dotąd
      - Drukowanie sieciowe, logowanie, praca programów i dostęp do internetu pozostają bez zmian
    en:
      - The roll of the neighbourhood will stand empty or wanting, which in a small network without a server of names is at times the one known road to a folder
      - Older programs of a trade seeking a server by this mechanism will not show it upon the roll of choosing at the first setting going
      - The reach by name and by address works on, so what is lost is the looking over and not the reach
      - Shortcuts and drives set to a letter kept earlier open as hitherto
      - Printing upon the network, logging on, the work of programs and the reach of the internet stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Mała sieć bez serwera nazw, w której użytkownicy docierają do folderów wyłącznie przez listę otoczenia
    en:
      - A small network without a server of names, in which users come at folders solely through the roll of the neighbourhood
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Browser'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'Browser' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'Browser' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'Browser' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/network-browsing-overview

notes:
  pl: |
    Reguła bywa odrzucana zdaniem „ale wtedy nie zobaczę komputerów
    w sieci" i warto, żeby aplikacja odpowiedziała na to wprost. Traci
    się przeglądanie, nie dostęp — udział otwarty po nazwie albo po
    adresie działa dalej.

    Argument wart postawienia wprost dotyczy tego, że mechanizm działa
    w obie strony. Maszyna nie tylko pyta o spis, ale i rozgłasza siebie,
    więc sama opisuje sieć komuś, kto wyłącznie słucha. Wyłączenie usługi
    zdejmuje oba te zachowania naraz.

    Odnotowuję drugi skutek, mniej widoczny: spis prowadzi do zasobów.
    Wpis podany przez maszynę ogłaszającą się prowadzącym kieruje
    użytkownika tam, dokąd chciał napastnik, a użytkownik klika nazwę,
    której ufa.
  en: |
    The rule is at times cast aside with the words "but then I shall not see the computers in the network", and it
    is well that the application answer that outright. What is lost is the looking over and not the reach - a
    share opened by name or by address works on.

    The argument worth putting outright touches the mechanism's working both ways. The machine not only asks for
    the register but puts out word of itself, so it sets out the network to whoever does no more than listen. The
    switching off of the service takes both bearings away at once.

    I set down the second upshot, the less plain: the register leads to shares. An entry given by a machine that
    gave itself out for the keeper sends the user where the attacker would have them, and the user presses a name
    they trust.
