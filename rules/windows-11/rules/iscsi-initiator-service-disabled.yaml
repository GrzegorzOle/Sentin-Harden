id: win11-iscsi-initiator-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa dołączania dysków blokowych przez sieć wyłączona
    en: The service attaching block disks over the network disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa pozwala dołączyć do maszyny dysk udostępniony przez sieć i używać
    go tak, jakby był dyskiem wewnętrznym: z własnym systemem plików, literą
    napędu i pełnym dostępem blokowym.

    Różnica wobec udziału sieciowego jest tu istotna i warto ją nazwać.
    Udział sieciowy daje dostęp do plików, a serwer decyduje, kto i co może
    z nimi zrobić. Dysk dołączony przez sieć daje dostęp do bloków —
    maszyna zakłada na nim system plików, nadaje uprawnienia i traktuje go
    jak własny sprzęt.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podłączenia do maszyny dysku z dowolną zawartością, bez nośnika,
    bez portu i bez śladu w tych miejscach, w których szuka się nośników
    wymiennych. Dysk taki może nieść pliki wykonywalne albo przyjmować dane
    wyprowadzane z maszyny — a wygląda w systemie jak zwykły napęd lokalny.

    Osobno liczy się uwierzytelnianie. Protokół tego mechanizmu bywa używany
    bez żadnego uwierzytelnienia, bo w sieci składowania danych zakłada się,
    że sama sieć jest odgrodzona. Na stacji roboczej to założenie nie
    obowiązuje.
  en: |
    The service allows a disk shared over the network to be attached to the machine and
    used as if it were an internal one: with a file system of its own, a drive letter and
    full block-level access.

    The difference from a network share matters here and is worth naming. A network share
    gives access to files, and the server decides who may do what with them. A disk
    attached over the network gives access to blocks - the machine puts a file system on
    it, assigns permissions and treats it as its own hardware.

    What an attacker gains while the item goes unmet: the means of attaching a disk with
    any contents at all to the machine, with no medium, no port and no trace in the
    places where removable media are looked for. Such a disk may carry executable files
    or take in data being taken out of the machine - and it looks in the system like an
    ordinary local drive.

    Authentication counts separately. This mechanism's protocol is sometimes used with no
    authentication at all, since on a storage network the network itself is assumed to be
    fenced off. At a workstation that assumption does not hold.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy do maszyny dołączony jest jakikolwiek dysk
    sieciowy tego rodzaju — a na stacji roboczej zwykle nie jest.

    Standardowo usługa nie jest uruchamiana i zmiana niczego nie dotyka.
    Jeżeli usługa działa, warto ustalić dlaczego, bo na stanowisku jest to
    stan nietypowy.

    Tam, gdzie dysk jest dołączony, skutek jest natychmiastowy i dotkliwy:
    napęd znika, a programy mające na nim otwarte pliki zgłoszą błąd zapisu.
    Jeżeli na takim dysku leżą dane robocze, utrata połączenia w trakcie
    zapisu może pozostawić plik niekompletny.

    Z tego powodu przed wdrożeniem trzeba sprawdzić stan dołączonych dysków,
    a nie polegać wyłącznie na deklaracji użytkownika. Dysk dołączany
    samoczynnie przy starcie maszyny bywa traktowany jak dysk wewnętrzny
    i użytkownik nie wie, że jest sieciowy.

    Udziały sieciowe, dyski mapowane literą oraz dyski w chmurze nie mają
    z tą usługą nic wspólnego i działają dalej bez zmiany.

    Zmiana wymaga zatrzymania usługi.
  en: |
    What needs checking is whether any network disk of this kind is attached to the
    machine - and at a workstation it usually is not.

    As a matter of course the service is not started and the change touches nothing. If
    the service is running, it is worth establishing why, since at a station that is an
    unusual state.

    Where a disk is attached, the effect is immediate and severe: the drive vanishes, and
    programs with files open on it will report write errors. If working data lie on such
    a disk, losing the connection mid-write may leave a file incomplete.

    For that reason the state of attached disks has to be checked before a rollout rather
    than relying on the user's word alone. A disk attached automatically when the machine
    starts is sometimes taken for an internal one, and the user does not know it is a
    network disk.

    Network shares, drives mapped to a letter and cloud drives have nothing to do with
    this service and carry on unchanged.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
    - network-and-firewall
  what_breaks:
    pl:
      - Dysk dołączony przez sieć znika z systemu razem ze swoją literą napędu
      - Program mający otwarte pliki na takim dysku zgłasza błąd zapisu
      - Dysk dołączany samoczynnie przy starcie maszyny nie zostanie dołączony ponownie
      - Udziały sieciowe, dyski mapowane literą i dyski w chmurze działają dalej bez zmiany
    en:
      - A disk attached over the network vanishes from the system along with its drive letter
      - A program with files open on such a disk reports write errors
      - A disk attached automatically when the machine starts will not be attached again
      - Network shares, drives mapped to a letter and cloud drives carry on unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Do maszyny dołączony jest dysk sieciowy tego rodzaju z danymi roboczymi
      - Stanowisko korzysta ze składnicy danych udostępnianej blokowo przez sieć
    en:
      - A network disk of this kind holding working data is attached to the machine
      - The station uses a data store made available over the network at block level
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Stopping the service detaches disks attached over the network; programs
    # writing to them at this moment will report an error.
    Stop-Service -Name 'MSiSCSI' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MSiSCSI' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'MSiSCSI' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/iscsi/iscsi-target-server

notes:
  pl: |
    Przed wdrożeniem warto sprawdzić listę dołączonych dysków tego rodzaju,
    a nie tylko stan usługi. Usługa uruchomiona bez dołączonych dysków oznacza
    zmianę bez skutków; usługa z dołączonym dyskiem oznacza zmianę odczuwalną
    natychmiast.

    Wyłączenie usługi nie usuwa zapisanych połączeń ani poświadczeń do nich.
    Po cofnięciu zmiany dyski dołączają się ponownie w tym samym kształcie.

    Punkt dotyczy strony dołączającej dysk. Udostępnianie dysku z tej maszyny
    innym maszynom obsługuje osobny składnik, który na stacji roboczej
    standardowo nie jest instalowany.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    Before a rollout it is worth checking the list of attached disks of this kind rather
    than the service's state alone. A service running with no disks attached means a
    change with no effects; a service with a disk attached means a change felt at once.

    Disabling the service removes neither saved connections nor the credentials for them.
    Once the change is undone the disks attach again in the same shape.

    The item concerns the side attaching a disk. Making a disk from this machine
    available to others is handled by a separate component, which at a workstation is not
    installed as a matter of course.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
