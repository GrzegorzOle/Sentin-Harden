id: win2025-print-rpc-listener-authentication-negotiate

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Uwierzytelnianie połączeń przychodzących podsystemu druku przez negocjację
    en: Authentication of incoming connections of the printing subsystem by negotiation
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie mówi, w jaki sposób podsystem druku uwierzytelnia maszyny,
    które się z nim łączą: przez negocjację mechanizmu czy wyłącznie
    mechanizmem domenowym.

    Obniżyłem tu kategorię ryzyka względem paczki stanowiska roboczego
    i uważam, że trzeba powiedzieć wprost dlaczego, bo inaczej ten punkt
    wygląda na poważniejszy, niż jest.

    Wartość wymagana jest wartością domyślną i jest to wariant
    łagodniejszy, nie ostrzejszy. Wariant ostrzejszy — wymuszenie
    mechanizmu domenowego — nie jest tutaj utwardzeniem, tylko
    ograniczeniem zgodności, i to on psuje drukowanie klientom spoza
    domeny.

    Napastnik nie zyskuje więc nic na tym, że punkt pozostaje
    niespełniony. Niezgodność znaczy tu, że ktoś ustawił wariant
    ostrzejszy — i skutkiem jest to, że część klientów nie wydrukuje,
    a nie to, że ktoś wejdzie.

    Wartość tego punktu jest zatem porządkowa: spisuje stan, w którym
    maszyna faktycznie pracuje, i pozwala odróżnić ustawienie domyślne
    od ustawienia wprowadzonego świadomie. Na serwerze wydruku
    obsługującym klientów z różnych źródeł ma to znaczenie praktyczne,
    bo inaczej przyczyna braku wydruku u części z nich pozostaje
    nieznana.

    Prawdziwa ochrona połączeń przychodzących leży w punktach
    sąsiednich: w wyborze kanału, którym te połączenia przychodzą,
    i w tym, kto wolno wgrać sterownik. Tutaj jej nie ma i lepiej to
    powiedzieć, niż udawać.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nic
    bezpośrednio. Ocena niska jest tu oceną szczerą, a nie ostrożną.
  en: |
    The setting says in what way the printing subsystem authenticates the machines that connect
    with it: by a negotiation of the mechanism or by the domain's mechanism alone.

    I lowered the category of risk here against the working station's pack and hold that it must
    be said outright why, this item looking otherwise graver than it is.

    The value called for is the default value and it is the milder variant, not the sterner. The
    sterner variant - the forcing of the domain's mechanism - is here no hardening but a bounding
    of compatibility, and it is the one that breaks printing for clients from outside the domain.

    An attacker therefore gains nothing by the item's going unmet. Non-compliance means here that
    somebody set the sterner variant - and the effect is that some clients will not print, and not
    that somebody will get in.

    The worth of this item is thus one of order: it writes down the state the machine truly works
    in and lets a default setting be told from one made knowingly. On a print server serving
    clients from differing sources that has a practical meaning, the cause of a want of printing
    at some of them staying otherwise unknown.

    The true shielding of incoming connections lies in the neighbouring items: in the choosing of
    the channel those connections come by, and in who may lay a driver in. Here there is none of
    it, and it is better said than feigned.

    What an attacker gains while the item goes unmet: nothing directly. The low rating is here an
    honest rating and not a wary one.

disruption_description:
  pl: |
    Skutek samej zmiany jest żaden w przypadku typowym, a w przypadku
    nietypowym jest to przywrócenie drukowania, a nie jego zepsucie.

    Serwer w stanie domyślnym jest już zgodny i nie ma tu czego zmieniać.
    Niezgodność oznacza, że ktoś wymusił mechanizm domenowy — zwykle
    przy jakimś utwardzaniu, w przekonaniu że wariant ostrzejszy jest
    zawsze lepszy.

    Cofnięcie tego wymuszenia sprawia, że serwer znów porozumie się
    z klientami, którzy mechanizmu domenowego użyć nie mogą. Trzeba
    jednak zobaczyć, czy nie było ono ustawione celowo: są środowiska,
    w których dostęp do wydruku ma być ograniczony wyłącznie do maszyn
    domenowych i wymuszenie jest tam decyzją, a nie pomyłką.

    Rozstrzyga to dokument decyzji albo rozmowa z jej autorem, nie sam
    stan rejestru. Bez tego sprawdzenia zmiana rozszerza krąg maszyn,
    które mogą się połączyć — a to jest kierunek przeciwny do
    zamierzonego.

    Klasę podniosłem względem klasy bez uciążliwości z powodu restartu:
    zmiana wymaga ponownego uruchomienia bufora wydruku, a na serwerze
    wydruku oznacza to przerwanie zadań w toku i utratę tego, co stoi
    w kolejce.

    Sam sposób drukowania, kolejki, sterowniki i uprawnienia pozostają
    po zmianie bez różnicy.
  en: |
    The effect of the change itself is none in the ordinary case, and in the unusual case it is a
    bringing back of printing and not a breaking of it.

    A server in its default state is compliant already and there is nothing here to change.
    Non-compliance means somebody forced the domain's mechanism - usually at some hardening, in
    the belief that the sterner variant is always the better.

    The undoing of that forcing makes the server able to speak again with clients that cannot use
    the domain's mechanism. It must be seen, though, whether it was not set on purpose: there are
    settings in which access to printing is to be bounded to domain machines alone, and the
    forcing is there a decision and not a slip.

    That is settled by the writing down of the decision or by a word with its author, and not by
    the state of the registry alone. Without that check the change widens the circle of machines
    that may connect - and that is the contrary way to the one meant.

    I raised the class from the class without disruption by reason of the restart: the change
    takes a fresh start of the print spooler, and on a print server that means the breaking of
    jobs under way and the loss of what stands in the queue.

    The way of printing itself, the queues, the drivers and the rights stay after the change with
    no difference.

implementation_consequences:
  impact_areas:
    - printing
    - legacy-authentication
    - accounts-and-passwords
  what_breaks:
    pl:
      - Zmiana rozszerza krąg maszyn mogących się połączyć, jeśli wymuszenie mechanizmu domenowego było decyzją
      - Kolejki, sterowniki, uprawnienia i sam sposób drukowania pozostają bez różnicy
      - Ponowne uruchomienie bufora przerywa zadania w toku i kasuje to, co stoi w kolejce
    en:
      - The change widens the circle of machines that may connect where the forcing of the domain's mechanism was a decision
      - Queues, drivers, rights and the way of printing itself stay with no difference
      - A fresh start of the spooler breaks jobs under way and clears what stands in the queue
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Wymuszenie mechanizmu domenowego jest świadomą decyzją, bo dostęp do wydruku ma mieć tylko maszyna domenowa
      - Nie ustalono, kto i po co wymusił na tej maszynie mechanizm domenowy
    en:
      - The forcing of the domain's mechanism is a knowing decision, printing being meant for a domain machine alone
      - It was not settled who forced the domain's mechanism on this machine and what for
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero means negotiation, one forces the domain mechanism alone.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ForceKerberosForRpc'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    $name = 'ForceKerberosForRpc'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value written here is the milder variant and the system's default.
    # Where the sterner one was set on purpose, this change undoes that
    # decision - see the description.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers\RPC'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ForceKerberosForRpc' -Value 0 -Type DWord
    # The value is read at the spooler's starting. The service is restarted
    # only where it is running, so a machine with the spooler stopped is left
    # as it is.
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }
    $svc = Get-Service -Name Spooler -ErrorAction SilentlyContinue
    if ($svc -and $svc.Status -eq 'Running') { Restart-Service -Name Spooler -Force }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/manage-rpc-connection-settings

notes:
  pl: |
    Obniżyłem kategorię ryzyka względem paczki stanowiska roboczego
    i robię to świadomie. Wartość wymagana jest domyślna i łagodniejsza;
    wariant ostrzejszy nie jest utwardzeniem, tylko ograniczeniem
    zgodności. Napastnik nie zyskuje nic na niezgodności tego punktu.

    Wartość tej reguły jest porządkowa: pozwala odróżnić stan domyślny
    od ustawienia wprowadzonego świadomie i wskazuje przyczynę braku
    wydruku u części klientów.

    Prawdziwa ochrona połączeń przychodzących leży w punktach
    sąsiednich — w wyborze kanału i w tym, kto wolno wgrać sterownik.
  en: |
    I lowered the category of risk against the working station's pack and do so knowingly. The
    value called for is the default and the milder; the sterner variant is no hardening but a
    bounding of compatibility. An attacker gains nothing by this item's going unmet.

    This rule's worth is one of order: it lets a default state be told from a setting made
    knowingly and points to the cause of a want of printing at some clients.

    The true shielding of incoming connections lies in the neighbouring items - in the choosing of
    the channel and in who may lay a driver in.
