id: win2025-volume-maintenance-administrators

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Konserwacja woluminów zastrzeżona dla administratorów
    en: Volume maintenance restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala wykonywać operacje konserwacyjne na woluminie —
    czyli sięgać do dysku z pominięciem systemu plików.

    Tu leży cała rzecz. System plików jest warstwą, w której żyją
    uprawnienia. Wykaz kontroli dostępu przypisany do pliku działa
    dlatego, że każdy odczyt idzie przez sterownik systemu plików,
    a ten uprawnienia sprawdza. Prawo omawiane tutaj pozwala pominąć
    tę warstwę i czytać wolumin jako ciąg bloków.

    Skutek jest taki, że uprawnienia przestają obowiązywać. Zawartość
    pliku, do którego konto nie ma dostępu, daje się odczytać, bo
    odczyt nie pyta systemu plików o zgodę. Dotyczy to również plików
    otwartych na wyłączność — bazy danych i pliku bazy kont wśród nich.

    Na serwerze rzecz waży najwięcej właśnie przez tę ostatnią pozycję.
    Na kontrolerze domeny odczyt bloków woluminu systemowego jest drogą
    do bazy kont całej domeny. Nie ma znaczenia, że plik jest zajęty
    i strzeżony — na poziomie bloków nie jest ani jednym, ani drugim.

    Kierunek odwrotny też istnieje: zapis bloków pozwala zmienić
    zawartość pliku bez dotykania jego uprawnień i bez zapisu w
    dzienniku dostępu.

    Punkt zawęża wykaz do administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    dowolnego pliku na maszynie — łącznie z bazą kont — z pominięciem
    uprawnień i bez śladu w dzienniku dostępu do plików.
  en: |
    The right allows maintenance operations to be done on a volume - that is, the disk to be
    reached with the file system passed by.

    There lies the whole matter. The file system is the layer rights live in. An access control
    list set on a file works because every reading goes through the file system's driver, and
    that driver checks the rights. The right spoken of here allows that layer to be passed by
    and the volume to be read as a run of blocks.

    The effect is that rights stop holding. The content of a file an account has no access to
    can be read, since the reading does not ask the file system's leave. That takes in files
    open exclusively as well - a database's and the account base's file among them.

    On a server the matter weighs most by reason of that last entry. On a domain controller a
    reading of the system volume's blocks is a road to the whole domain's account base. It does
    not matter that the file is held and guarded - at the level of blocks it is neither.

    The opposite direction exists too: a writing of blocks allows a file's content to be changed
    without touching its rights and without an entry in the access log.

    The item narrows the list to administrators.

    What an attacker gains while the item goes unmet: the reading of any file on the machine -
    the account base among them - with rights passed by and with no trace in the file access
    log.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy na tym serwerze pracuje agent sięgający
    do dysku poniżej systemu plików, bo po zawężeniu przestanie móc to
    robić.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    części serwerów naprawa nie zmienia niczego. Różnica wobec
    stanowiska roboczego polega na tym, co się na serwerze dodatkowo
    instaluje.

    Przypadkiem pierwszym jest kopia zapasowa na poziomie bloków.
    Rozwiązania takie czytają wolumin wprost, bo jest to szybsze niż
    czytanie plików po kolei, i robią to z konta usługi agenta. Jeżeli
    konto to celowo umieszczono poza administratorami — a bywa tak
    właśnie ze względów bezpieczeństwa — kopia przestanie się wykonywać.

    Przypadkiem drugim jest replikacja i migracja maszyn, gdzie ten sam
    mechanizm służy do przenoszenia woluminu na inny host.

    Trzecim jest oprogramowanie zarządzania dyskami producenta macierzy,
    sprawdzające stan nośników poniżej systemu plików.

    Objaw jest natychmiastowy i czytelny: agent zgłasza odmowę dostępu
    do woluminu i zadanie kończy się niepowodzeniem. Bywa jednak
    zauważony późno, bo kopie wykonują się nocą, a wykaz zadań
    nieudanych ogląda się rzadziej, niż się zakłada.

    Sama zmiana nie wymaga przerwy i nie dotyka danych na dysku.
  en: |
    What needs checking is whether an agent reaching the disk below the file system works on
    this server, since after the narrowing it will no longer be able to.

    In the default state only administrators hold the right, so on some servers the mending
    changes nothing. The difference from a working station lies in what is installed on a server
    besides.

    The first case is a block-level backup. Such arrangements read the volume outright, that
    being quicker than reading the files one after another, and do so under the agent service's
    account. Where that account was purposely placed outside the administrators - and it is at
    times so for the sake of security - the backup will stop being made.

    The second case is replication and the migration of machines, where the same mechanism
    serves to carry a volume to another host.

    The third is a storage maker's disk management software, checking the media's state below
    the file system.

    The symptom is immediate and plain: the agent reports a refusal of access to the volume and
    the task ends in failure. It is at times noticed late, though, since backups are made at
    night and the list of failed tasks is looked over less often than is assumed.

    The change itself takes no break and does not touch the data on the disk.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
    - virtualization-and-containers
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Agent kopii zapasowej na poziomie bloków na koncie spoza grupy administratorów zgłosi odmowę dostępu do woluminu
      - Replikacja i migracja woluminu na inny host przestaną działać z konta spoza wykazu
      - Oprogramowanie zarządzania dyskami producenta macierzy nie odczyta stanu nośników
      - Objaw bywa zauważony późno, bo zadania kopii wykonują się nocą
    en:
      - A block-level backup agent under an account outside the administrators' group will report a refusal of access to the volume
      - Replication and the migration of a volume to another host will stop working from an account outside the list
      - A storage maker's disk management software will not read the media's state
      - The symptom is at times noticed late, since backup tasks are made at night
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kopie zapasowe wykonuje agent na poziomie bloków pracujący na koncie celowo umieszczonym poza administratorami
      - Serwer jest replikowany na inny host mechanizmem sięgającym do woluminu wprost
    en:
      - Backups are made by a block-level agent working under an account purposely placed outside the administrators
      - The server is replicated to another host by a mechanism reaching the volume outright
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeManageVolumePrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeManageVolumePrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeManageVolumePrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeManageVolumePrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeManageVolumePrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/perform-volume-maintenance-tasks

notes:
  pl: |
    Nazwa punktu mówi o konserwacji i brzmi porządkowo, ale rzecz
    dotyczy dostępu do dysku poniżej systemu plików. Uprawnienia
    do plików obowiązują w systemie plików — kto sięga do bloków,
    ten ich nie napotyka.

    Na kontrolerze domeny punkt waży najwięcej, bo odczyt bloków
    woluminu systemowego jest drogą do bazy kont całej domeny.

    Niezgodność na serwerze bierze się najczęściej z konta agenta kopii
    zapasowej na poziomie bloków. Jest to przypadek do wyjątku
    zapisanego wraz z uzasadnieniem, a nie do odpuszczenia punktu.
  en: |
    The item's name speaks of maintenance and sounds orderly, but the matter is access to the
    disk below the file system. Rights on files hold within the file system - whoever reaches
    the blocks does not meet them.

    On a domain controller the item weighs most, since a reading of the system volume's blocks
    is a road to the whole domain's account base.

    Non-compliance on a server comes most often of a block-level backup agent's account. That is
    a case for an exception recorded with its grounds rather than for letting the item go.
