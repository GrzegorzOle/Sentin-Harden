id: win10-smb1-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Składnik obsługi protokołu SMB w wersji pierwszej usunięty
    en: The component serving SMB version one taken out
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z użycia cały składnik systemu odpowiadający za pierwszą
    wersję protokołu udostępniania plików — obie jego strony naraz.

    Punkt jest trzeci z tej rodziny i najszerszy. Dwie reguły poprzednie
    wyłączają zachowanie; ta wyjmuje z obiegu kod, który to zachowanie
    realizuje. Różnica jest istotna, bo kod nieusunięty da się z powrotem
    uruchomić zmianą jednej wartości, a kod wyjęty wymaga świadomego
    przywrócenia składnika.

    Wartość reguły bierze się z trwałości. Ustawienia rejestru bywają
    nadpisywane przez zasady, przez instalatory i przez narzędzia
    naprawcze — bez złej woli, po prostu dlatego, że coś je przywraca do
    stanu oczekiwanego przez siebie. Składnik usunięty nie wraca przypadkiem.

    Odnotowuję, że na maszynach nowszych składnik bywa nieobecny od
    instalacji. Sprawdzenie traktuje taką maszynę jako zgodną i mówi o tym
    osobną odpowiedzią.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: kod obsługi
    protokołu gotowy do użycia, który wystarczy z powrotem włączyć.
  en: |
    The setting takes out of use the whole system component answering for the first version of the file-sharing
    protocol - both its sides at once.

    The item is the third of that family and the widest. The two foregoing rules switch a behaviour off; this
    one takes out of circulation the code that carries the behaviour out. The difference matters, code not taken
    out being startable again by the change of a single value, while code taken out calls for a knowing putting
    back of the component.

    The rule's value comes of its lastingness. Registry settings are at times written over by policies, by
    installers and by repair tools - without ill will, simply because something sets them back to the state it
    looks for. A component taken out does not come back by chance.

    I set down that on newer machines the component is at times absent from the installation. The check holds
    such a machine compliant and says so by an answer of its own.

    What an attacker gains while the item goes unmet: the protocol's serving code ready for use, which need only
    be switched back on.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a zakres skutków jest sumą dwóch reguł
    poprzednich — dotyczy i sięgania po cudze udziały, i wystawiania
    własnych.

    Sprawdzenie i wykonanie wymagają uprawnień podniesionych, bo pytanie
    idzie do magazynu składników systemu. Bez nich odpowiedzi nie ma wcale,
    a to wyglądałoby tak samo jak brak składnika — dlatego sprawdzenie zwraca
    wtedy błąd, a nie zgodność.

    Odnotowuję rzecz odróżniającą tę regułę od dwóch poprzednich: cofnięcie
    jest tu droższe. Przywrócenie składnika oznacza jego ponowną instalację
    i kolejny restart, a nie zmianę wartości. Decyzja ma więc być podjęta
    raz, po sprawdzeniu, a nie sprawdzona wykonaniem.

    Czego to nie psuje: udziałów obsługiwanych nowszymi wersjami protokołu,
    drukowania przez udział, logowania, kont domenowych, aplikacji, sieci.
  en: |
    The class is "needs review", and the reach of the consequences is the sum of the two foregoing rules - it
    touches both the reaching for others' shares and the setting out of one's own.

    The check and the carrying out call for raised rights, the question going to the system's servicing store.
    Without them there is no answer at all, and that would look the same as the component's absence - for which
    the check returns an error then, and not compliance.

    I set down a thing that parts this rule from the two foregoing: the undoing comes dearer here. Putting the
    component back means installing it afresh and another restart, not the change of a value. The decision is
    therefore to be taken once, upon a review, and not tried out by carrying it out.

    What this does not break: shares served over newer versions of the protocol, printing through a share,
    logging on, domain accounts, applications, or the network.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
  what_breaks:
    pl:
      - Sięganie po udziały obsługiwane wyłącznie pierwszą wersją protokołu i wystawianie własnych tą wersją przestaje być możliwe
      - Cofnięcie wymaga ponownej instalacji składnika i kolejnego restartu, a nie zmiany wartości w rejestrze
      - Sprawdzenie bez uprawnień podniesionych zwraca błąd, bo pytanie idzie do magazynu składników systemu
      - Na maszynie, z której składnik usunięto przy instalacji, zmiana nie robi nic i sprawdzenie mówi o tym osobno
      - Udziały obsługiwane nowszymi wersjami, drukowanie przez udział, logowanie i aplikacje pozostają bez zmian
    en:
      - Reaching for shares served only over the first protocol version, and setting out ones own over it, ceases to be possible
      - The undoing calls for the component to be installed afresh and for another restart, not for a change of a registry value
      - A check without raised rights returns an error, the question going to the systems servicing store
      - On a machine from which the component was left out at installation the change does nothing and the check says so apart
      - Shares served over newer versions, printing through a share, logging on and applications stay unchanged
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - W sieci pozostaje urządzenie lub zasób obsługujący wyłącznie pierwszą wersję protokołu i nie ma dla niego zamiennika
      - Nie ma okna serwisowego na restart maszyny, a bez niego zmiana i tak nie wejdzie
    en:
      - A device or resource serving only the first protocol version remains on the network and has no substitute
      - There is no service window for a restart of the machine, and without one the change will not take hold anyway
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      # The call asks the servicing store and calls for raised rights. Without the
      # try/catch a refused call returns nothing at all, which would look exactly
      # like "the component is not there" and report a compliance that is not.
      $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction Stop
      if ($null -eq $f) { 'ABSENT' } else { [string]$f.State }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(Disabled|ABSENT)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue
    [pscustomobject]@{
      feature = 'SMB1Protocol'
      state   = $(if ($null -ne $f) { [string]$f.State } else { '' })
      present = ($null -ne $f)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The component goes out of use at the next start of the machine. The restart
    # is deferred on purpose, so that the moment of it stays with whoever decides
    # upon it rather than with this command.
    Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.present) { throw 'The component was not in the servicing store before the change - refusing to guess a state.' }
    if ($b.state -eq 'Enabled') {
      Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
    } else {
      "The component was already switched off before the change - nothing to restore."
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3

notes:
  pl: |
    Reguła domyka rodzinę trzech i jest w niej tą, którą warto wykonać
    zamiast dwóch pozostałych, a nie obok nich. Aplikacja powinna to
    powiedzieć wprost przy symulacji, bo inaczej użytkownik wykona trzy
    zmiany i trzy razy zaplanuje restart.

    Kategoria jest tu wysoka, nie krytyczna, i jest to ocena świadoma.
    Zagrożenie opisują dwie reguły poprzednie; ta wnosi trwałość, czyli
    odporność na przypadkowe przywrócenie. Jest to wkład realny, ale wtórny
    wobec nich, i podnoszenie go do kategorii krytycznej byłoby liczeniem
    tego samego ryzyka trzy razy.

    Odnotowuję asymetrię kosztu. Wyłączenie to jedno polecenie; przywrócenie
    to instalacja składnika i restart. Reguła jest odwracalna, ale nie
    odwracalna tanio, i opis skutków ma to mówić.
  en: |
    The rule closes the family of three and is the one in it worth carrying out instead of the other two, not
    beside them. The application ought to say so outright at the simulation, or else the user will make three
    changes and plan a restart three times over.

    The category is here high, not critical, and that is a knowing judgement. The threat is described by the two
    foregoing rules; this one brings lastingness, which is to say a hardiness against a chance putting back. That
    is a real contribution but a secondary one beside them, and raising it to critical would be reckoning the
    same risk three times.

    I set down the unevenness of cost. The switching off is one command; the putting back is an installation of
    the component and a restart. The rule can be undone, but not undone cheaply, and the description of
    consequences is to say so.
