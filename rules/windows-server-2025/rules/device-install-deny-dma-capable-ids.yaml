id: win2025-device-install-deny-dma-capable-ids

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Zakaz instalacji kontrolerów sięgających wprost do pamięci
    en: Installation of controllers reaching straight into memory forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania instalowania sterowników dla dwóch klas kontrolerów,
    które z założenia sięgają wprost do pamięci maszyny, i robi to
    wstecznie — więc wyłącza również te, które już są zainstalowane.

    Zostawiam kategorię wysoką i chcę pokazać, czym ten punkt różni się
    od sąsiedniego, o blokadzie uruchamiania takich urządzeń. Tamten
    wstrzymuje urządzenie do chwili zalogowania. Ten nie pozwala mu
    zaistnieć w ogóle. Tamten broni maszyny zablokowanej, ten broni jej
    również wtedy, gdy ktoś jest zalogowany — a więc obejmuje sytuację,
    w której napastnik ma już konto, ale nie ma uprawnień.

    Na serwerze najważniejszy jest przymiotnik „wstecznie". Reguła
    sięga do sprzętu już zainstalowanego i wyłącza go. Na stacji roboczej
    takim sprzętem jest złącze, z którego nikt nie korzysta; na serwerze
    trzeba sprawdzić, czy przypadkiem nie jest nim coś, przez co maszyna
    widzi swoje dyski albo sieć. Sprawdzenie zajmuje minutę i nie da się
    go zastąpić założeniem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    doprowadzenia do zainstalowania kontrolera, który czyta pamięć
    z pominięciem procesora — również na maszynie, do której już się
    dostał, ale bez wystarczających uprawnień.
  en: |
    The item forbids installing drivers for two classes of controller that
    by design reach straight into the machine's memory, and it does so
    retroactively - so it also disables those already installed.

    I keep the category high, and I want to show how this item differs
    from the neighbouring one on blocking the start-up of such devices.
    That one holds a device back until somebody signs in. This one does
    not let it exist at all. That one defends a locked machine; this one
    defends it while somebody is signed in too - so it covers the
    situation where an attacker already has an account but not the
    privileges.

    On a server the important word is "retroactively". The rule reaches
    into hardware already installed and disables it. On a workstation that
    hardware is a connector nobody uses; on a server one has to check
    whether it happens to be something through which the machine sees its
    disks or its network. The check takes a minute and cannot be replaced
    by an assumption.

    What an attacker gains while the item goes unmet: the ability to get a
    controller installed that reads memory bypassing the processor - on a
    machine they have already reached but without sufficient privileges.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i chcę nazwać dwie
    rzeczy, z których jedna jest w tej paczce nowa.

    Pierwsza to wsteczność. Zmiana nie ogranicza się do tego, co ktoś
    dołączy w przyszłości — wyłącza sprzęt obecny teraz. Jeżeli w tej
    maszynie siedzi kontroler należący do zablokowanej klasy, przestanie
    działać po restarcie, a objaw będzie zależał od tego, do czego ten
    kontroler służył. Na serwerze to jest cała treść ryzyka tego punktu
    i dlatego symulacja przed wykonaniem jest tu warta więcej niż
    gdziekolwiek indziej w tej grupie.

    Druga rzecz dotyczy współdzielonego zapisu i obowiązuje w tej paczce
    trzy reguły naraz. Zakazy instalacji urządzeń mieszkają w jednym
    miejscu w rejestrze, a listy zakazanych identyfikatorów i klas są
    listami, nie pojedynczymi wartościami. Polecenie naprawcze dopisuje
    się do listy i nigdy jej nie zastępuje, bo wpisy umieszczone tam przez
    kogoś innego chronią przed czymś, o czym ta reguła nie wie. Wycofanie
    natomiast przywraca listę do stanu z kopii zapasowej — czyli cofa
    również to, co dopisała w międzyczasie reguła sąsiednia. Praktyczny
    wniosek: wycofuj te reguły w odwrotnej kolejności niż je stosowałeś,
    a nie wybiórczo.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout" and want to name two
    things, one of which is new in this pack.

    The first is retroactivity. The change is not limited to what somebody
    attaches in future - it disables hardware present now. If a controller
    belonging to a blocked class sits in this machine, it will stop working
    after a restart, and the symptom will depend on what that controller
    was for. On a server that is the whole substance of this item's risk,
    and that is why the pre-execution simulation is worth more here than
    anywhere else in this group.

    The second concerns a shared record and applies to three rules in this
    pack at once. The device installation prohibitions live in one place in
    the registry, and the lists of forbidden identifiers and classes are
    lists, not single values. The remediation command appends to the list
    and never replaces it, because entries placed there by somebody else
    guard against something this rule does not know about. A rollback, by
    contrast, restores the list to the state held in the backup - which
    also undoes whatever a neighbouring rule appended in the meantime. The
    practical conclusion: roll these rules back in the reverse order you
    applied them, not selectively.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Zmiana działa wstecznie i wyłącza kontrolery zablokowanych klas już zainstalowane w maszynie
      - Objaw zależy od tego, do czego ten kontroler służył, i może dotyczyć dostępu do dysków albo sieci
      - Wycofanie przywraca listę z kopii zapasowej, więc cofa też wpisy dodane w międzyczasie przez regułę sąsiednią
      - Trzy reguły zakazów instalacji urządzeń zapisują się w to samo miejsce w rejestrze
    en:
      - The change works retroactively and disables controllers of the blocked classes already installed in the machine
      - The symptom depends on what that controller was for and may concern access to disks or to the network
      - A rollback restores the list from the backup, so it also undoes entries added in the meantime by a neighbouring rule
      - Three device installation restriction rules write into the same place in the registry
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie sprawdzono, czy w maszynie pracuje już kontroler należący do zablokowanych klas
      - Serwer korzysta z kart rozszerzeń tych klas do obsługi macierzy albo sieci
      - Reguły zakazów instalacji urządzeń mają być wycofywane wybiórczo, a nie w odwrotnej kolejności stosowania
    en:
      - It has not been checked whether a controller of the blocked classes already runs in the machine
      - The server uses expansion cards of these classes for storage or network access
      - The device installation restriction rules are to be rolled back selectively rather than in the reverse order of application
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $deny = $item.DenyDeviceIDs
        $retroactive = $item.DenyDeviceIDsRetroactive
        $listKey = Join-Path $path 'DenyDeviceIDs'
        $listed = @()
        if (Test-Path -Path $listKey) {
          $listed = @(
            (Get-ItemProperty -Path $listKey -ErrorAction Stop).PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { ([string]$_.Value).Trim().ToUpperInvariant() }
          )
        }
        $absent = @(@('PCI\CC_0C0010', 'PCI\CC_0C0A') | Where-Object { $listed -notcontains $_ })
        if ($null -eq $deny -or $null -eq $retroactive) { 'MISSING' }
        elseif ([int]$deny -eq 1 -and [int]$retroactive -eq 1 -and $absent.Count -eq 0) { 'DENIED_RETROACTIVELY' }
        else { 'DENY=' + $deny + ' RETROACTIVE=' + $retroactive + ' ABSENT=' + ($absent -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: DENIED_RETROACTIVELY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $listKey = Join-Path $path 'DenyDeviceIDs'
    $entries = @()
    if (Test-Path -Path $listKey) {
      $entries = @(
        (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties |
          Where-Object { $_.Name -notlike 'PS*' } |
          ForEach-Object { [pscustomobject]@{ name = $_.Name; value = [string]$_.Value } }
      )
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = (Test-Path -Path $path)
      deny          = $item.DenyDeviceIDs
      deny_existed  = ($null -ne $item.DenyDeviceIDs)
      retro         = $item.DenyDeviceIDsRetroactive
      retro_existed = ($null -ne $item.DenyDeviceIDsRetroactive)
      list_key      = $listKey
      list_existed  = (Test-Path -Path $listKey)
      entries       = $entries
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This works retroactively: a controller of these classes already sitting in
    # the machine stops working after the restart. On a server, check first what
    # that controller was for.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyDeviceIDs' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DenyDeviceIDsRetroactive' -Value 1 -Type DWord
    $listKey = Join-Path $path 'DenyDeviceIDs'
    if (-not (Test-Path -Path $listKey)) { New-Item -Path $listKey -Force | Out-Null }
    # Entries put here by somebody else guard against something this rule does not
    # know about, so the list is added to and never replaced.
    $taken = @{}
    $present = @()
    foreach ($property in (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties) {
      if ($property.Name -notlike 'PS*') {
        $taken[$property.Name] = $true
        $present += ([string]$property.Value).Trim().ToUpperInvariant()
      }
    }
    $index = 1
    foreach ($id in @('PCI\CC_0C0010', 'PCI\CC_0C0A')) {
      if ($present -notcontains $id) {
        while ($taken.ContainsKey([string]$index)) { $index++ }
        New-ItemProperty -Path $listKey -Name ([string]$index) -Value $id -PropertyType String -Force | Out-Null
        $taken[[string]$index] = $true
      }
    }

  rollback_command: |
    # The list is restored wholesale, so this also undoes what a neighbouring
    # device installation rule appended afterwards. Roll these back in the
    # reverse order they were applied.
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.deny_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceIDs' -Value $b.deny -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceIDs' -ErrorAction SilentlyContinue
    }
    if ($b.retro_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceIDsRetroactive' -Value $b.retro -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceIDsRetroactive' -ErrorAction SilentlyContinue
    }
    Remove-Item -Path $b.list_key -Recurse -Force -ErrorAction SilentlyContinue
    if ($b.list_existed) {
      New-Item -Path $b.list_key -Force | Out-Null
      foreach ($entry in @($b.entries)) {
        New-ItemProperty -Path $b.list_key -Name $entry.name -Value $entry.value -PropertyType String -Force | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-device-installation-with-group-policy

notes:
  pl: |
    Różnica wobec punktu o blokadzie uruchamiania takich urządzeń: tamten
    wstrzymuje urządzenie do chwili zalogowania, ten nie pozwala mu
    zaistnieć w ogóle — więc obejmuje też maszynę, na której ktoś już jest
    zalogowany.

    Na serwerze najważniejsze jest słowo „wstecznie". Reguła wyłącza
    sprzęt już zainstalowany, a objaw zależy od tego, do czego ten sprzęt
    służył. Symulacja przed wykonaniem jest tu warta więcej niż gdzie
    indziej w tej grupie.

    Trzy reguły zakazów instalacji urządzeń zapisują się w to samo miejsce
    w rejestrze. Naprawa dopisuje do listy, wycofanie przywraca całą listę
    z kopii — więc wycofuj je w odwrotnej kolejności stosowania, a nie
    wybiórczo.
  en: |
    The difference from the item on blocking the start-up of such devices:
    that one holds a device back until somebody signs in, this one does not
    let it exist at all - so it also covers a machine where somebody is
    already signed in.

    On a server the important word is "retroactively". The rule disables
    hardware already installed, and the symptom depends on what that
    hardware was for. The pre-execution simulation is worth more here than
    anywhere else in this group.

    Three device installation restriction rules write into the same place
    in the registry. Remediation appends to the list, rollback restores the
    whole list from the backup - so roll them back in the reverse order of
    application, not selectively.
