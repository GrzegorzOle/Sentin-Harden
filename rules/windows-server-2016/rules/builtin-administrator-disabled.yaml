id: win2016-builtin-administrator-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora wyłączone
    en: The built-in administrator account switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza konto administratora zakładane przy instalacji
    systemu.

    Konto to ma trzy cechy, które razem czynią je celem szczególnym.
    Istnieje na każdej maszynie. Ma ten sam identyfikator końcowy wszędzie,
    więc rozpoznaje się je niezależnie od nadanej nazwy. I nie podlega
    blokadzie po nieudanych próbach logowania na tym wydaniu systemu — co
    znaczy, że hasło do niego można zgadywać bez końca.

    Ostatnia z tych cech waży najwięcej. Zabezpieczenie, które chroni każde
    inne konto przed zgadywaniem hasła, tego jednego nie chroni. Napastnik,
    który wie o tym, nie próbuje nigdzie indziej.

    Dochodzi do tego rzecz czwarta: konto to bywa zakładane raz, z hasłem
    ustawionym przy instalacji, i nikt do niego nie wraca. Hasło to bywa
    takie samo na wielu maszynach, bo pochodzi z tego samego obrazu
    instalacyjnego. Przejęcie go na jednej maszynie bywa wtedy przejęciem
    go na wszystkich.

    Wyłączenie konta odbiera tę drogę bez usuwania samego konta. Konto
    zostaje, zachowuje swoje uprawnienia i da się je włączyć z powrotem —
    ale zalogować się na nie nie można.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto
    pewnie istniejące, rozpoznawalne mimo zmienionej nazwy i odporne na
    blokadę po nieudanych próbach — a więc cel, na którym zgadywanie hasła
    nie ma kosztu.
  en: |
    The setting switches off the administrator account made when the system is
    installed.

    That account has three traits which together make it a particular target. It
    exists on every machine. It has the same ending identifier everywhere, so it is
    recognised whatever name it has been given. And it is not subject to lockout after
    failed sign-in attempts on this release of the system - which means its password
    can be guessed without end.

    The last of those weighs most. The safeguard that guards every other account
    against password guessing does not guard this one. An attacker who knows that
    tries nowhere else.

    A fourth thing follows: that account is at times made once, with a password set at
    installation, and nobody returns to it. That password is at times the same on many
    machines, coming from the same installation image. Taking it on one machine is
    then at times taking it on all of them.

    Switching the account off takes that road away without removing the account
    itself. The account stays, keeps its rights and can be switched back on - but
    cannot be signed in to.

    What an attacker gains while the item goes unmet: an account certain to exist,
    recognisable despite a changed name and proof against lockout after failed
    attempts - a target, then, on which guessing a password costs nothing.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest jeden, ale poważny:
    jest to konto, którym ratuje się maszynę, gdy zawiodą wszystkie inne
    drogi wejścia.

    Zanim punkt zostanie wykonany, trzeba mieć pewność co do dwóch rzeczy.
    Po pierwsze, że istnieje inne konto administratora na tej maszynie.
    Po drugie — i to jest rzecz, której żadne polecenie nie sprawdzi — że
    hasło do tego innego konta jest znane komuś, kto będzie pod ręką.
    Polecenie naprawcze sprawdza pierwszą rzecz i odmawia wykonania, gdy
    innego administratora nie ma; drugiej sprawdzić się nie da.

    Skutki praktyczne dotyczą trzech obszarów.

    Pierwszy to automatyzacja. Zadania zaplanowane, skrypty wdrożeniowe
    i połączenia zdalne skonfigurowane na to konto przestaną działać.
    Objawem jest odmowa logowania, więc przyczyna jest jasna, ale zakres
    bywa szerszy, niż się pamięta.

    Drugi to dostęp ratunkowy. Maszyna odcięta od domeny — bo padł
    kontroler, bo zerwane jest połączenie, bo konto komputera straciło
    zaufanie — pozwala zalogować się wyłącznie kontem lokalnym. Wyłączenie
    tego konta bez przygotowania innego zamyka tę drogę.

    Trzeci to tryb awaryjny i naprawa systemu, gdzie często dostępne jest
    właśnie to konto.

    Czego to nie psuje: logowania kontami domenowymi, usług, sieci,
    dostępu do plików, pracy użytkowników.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs a planned rollout", and the reason is one but grave: it is the
    account by which a machine is rescued when every other road in fails.

    Before the item is carried out, two things have to be certain. First, that another
    administrator account exists on this machine. Second - and this is what no command
    will check - that the password of that other account is known to somebody who will
    be at hand. The remedial command checks the first and refuses to run where there
    is no other administrator; the second cannot be checked.

    The practical consequences touch three areas.

    The first is automation. Scheduled tasks, deployment scripts and remote
    connections set up on that account will stop working. The symptom is a refused
    sign-in, so the cause is plain, but the reach is at times wider than one
    remembers.

    The second is rescue access. A machine cut off from the domain - a controller
    having failed, a connection been broken, a computer account lost its trust - lets
    one sign in with a local account alone. Switching this account off without
    preparing another shuts that road.

    The third is safe mode and system repair, where just this account is often
    available.

    What this does not break: signing in with domain accounts, services, the network,
    access to files, or users' work.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Zadania zaplanowane, skrypty wdrożeniowe i połączenia zdalne skonfigurowane na to konto przestaną działać
      - Maszyna odcięta od domeny pozwala zalogować się wyłącznie kontem lokalnym, więc bez przygotowanego zamiennika droga ratunkowa zostaje zamknięta
      - W trybie awaryjnym i przy naprawie systemu to konto bywa jedynym dostępnym
      - Logowanie kontami domenowymi, usługi, sieć i dostęp do plików pozostają bez zmian
    en:
      - Scheduled tasks, deployment scripts and remote connections set up on that account will stop working
      - A machine cut off from the domain lets one sign in with a local account alone, so without a prepared replacement the rescue road is shut
      - In safe mode and at system repair that account is at times the only one available
      - Signing in with domain accounts, services, the network and access to files stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie nie ma innego konta administratora albo hasło do niego nie jest znane nikomu, kto będzie pod ręką
      - Zadania zaplanowane albo połączenia zdalne działają na tym koncie i nie przeniesiono ich jeszcze gdzie indziej
      - Maszyna bywa odcinana od domeny i to konto jest przewidzianą drogą ratunkową
    en:
      - There is no other administrator account on the machine, or its password is known to nobody who will be at hand
      - Scheduled tasks or remote connections run on that account and have not yet been moved elsewhere
      - The machine is at times cut off from the domain and that account is the foreseen rescue road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A domain controller keeps no local account base, so the account of this
      # identifier is there the domain's own and falls outside this rule.
      $role = (Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction Stop).DomainRole
      if ($role -eq 4 -or $role -eq 5) { 'NOT_APPLICABLE' }
      else {
        $admin = Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-500' }
        if ($null -eq $admin) { 'NOT_APPLICABLE' }
        elseif ($admin.Enabled) { 'ENABLED' } else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $admin = Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }
    $others = @(
      Get-LocalGroupMember -SID 'S-1-5-32-544' -ErrorAction SilentlyContinue |
        Where-Object { $_.SID.Value -notlike '*-500' }
    )
    [pscustomobject]@{
      sid          = $admin.SID.Value
      name         = $admin.Name
      enabled      = [bool]$admin.Enabled
      other_admins = $others.Count
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}. Other administrators found: $($others.Count)"

  change_command: |
    # The count of other administrators is checked, not whether their passwords
    # are known. That part stays with the person making the change.
    $others = @(
      Get-LocalGroupMember -SID 'S-1-5-32-544' -ErrorAction Stop |
        Where-Object { $_.SID.Value -notlike '*-500' }
    )
    if ($others.Count -eq 0) {
      throw 'No other administrator account on this machine - refusing to disable the only one.'
    }
    $admin = Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }
    Disable-LocalUser -SID $admin.SID

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.enabled) { Enable-LocalUser -SID $b.sid } else { Disable-LocalUser -SID $b.sid }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-administrator-account-status

notes:
  pl: |
    Punkt otwiera blok o tym, co ekran logowania przyjmuje i co o maszynie
    mówi. Jest w nim jedyny, którego wykonanie może odciąć od maszyny
    osobę uprawnioną, i dlatego stoi na początku, z pełnym opisem, a nie
    wśród reszty.

    Polecenie naprawcze odmawia wykonania, gdy na maszynie nie ma innego
    administratora. Jest to zabezpieczenie celowe i warto je pokazywać
    w podglądzie jako część reguły, nie jako szczegół implementacji.
    Sprawdza ono jednak tylko istnienie konta, nie znajomość hasła do niego
    — i tej granicy nie wolno zamazywać.

    Audyt zwraca „nie dotyczy" na kontrolerze domeny, bo ten nie prowadzi
    lokalnej bazy kont, a konto o tym identyfikatorze jest tam kontem
    domeny i podlega zupełnie innym zasadom. Zgłaszanie tego jako
    niezgodności byłoby błędem.
  en: |
    The item opens the block about what the sign-in screen takes in and what it says
    about the machine. It is the only one in it whose execution can cut an entitled
    person off from the machine, and so it stands at the beginning, with a full
    description rather than among the rest.

    The remedial command refuses to run where there is no other administrator on the
    machine. That is a deliberate safeguard and is worth showing in the preview as
    part of the rule rather than as a detail of implementation. It checks only the
    account's existence all the same, not knowledge of its password - and that line
    must not be blurred.

    The audit returns "not applicable" on a domain controller, which keeps no local
    account base; the account of that identifier is there the domain's own and falls
    under wholly different rules. Reporting it as a non-compliance would be an error.
