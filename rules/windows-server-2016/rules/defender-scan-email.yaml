id: win2016-defender-scan-email

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Scan
  title:
    pl: Skanowanie zawartości skrzynek pocztowych włączone
    en: Scanning of mailbox contents switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe zaglądać do plików skrzynek pocztowych i sprawdzać
    załączniki leżące w środku.

    Skrzynka pocztowa zapisana w jednym pliku jest z punktu widzenia ochrony
    tym samym co archiwum: opakowaniem, w którym leżą pliki niewidoczne
    z zewnątrz. Różnica polega na tym, że opakowanie to jest duże, stale
    otwarte i zmieniane przez program pocztowy w trakcie pracy.

    Wartość sprawdzania jest tu niższa niż przy innych warstwach i warto
    powiedzieć dlaczego. Załącznik groźny zostanie wykryty najpóźniej
    wtedy, gdy ktoś go zapisze albo otworzy — i wtedy zajmie się nim warstwa
    sprawdzania przy wejściu albo w czasie rzeczywistym. Ta warstwa jedynie
    przesuwa moment wykrycia wcześniej, do chwili, gdy załącznik jeszcze
    leży w skrzynce.

    Na serwerze punkt ma zastosowanie wąskie. Serwery pocztowe mają własne
    mechanizmy sprawdzania poczty, działające na poziomie usługi, a nie
    pliku — i to one wykonują tę pracę właściwie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele.
    Załącznik pozostaje nierozpoznany, dopóki leży w skrzynce, ale zostanie
    sprawdzony w chwili, gdy zacznie być użyteczny.
  en: |
    The setting has the files of mailboxes looked into and the attachments lying
    inside them checked.

    A mailbox written into one file is, from the protection's point of view, the
    same as an archive: a wrapping with files inside invisible from without. The
    difference is that this wrapping is large, constantly open, and changed by the
    mail program in the course of work.

    The value of the checking is lower here than at the other layers, and it is
    worth saying why. A dangerous attachment will be detected at the latest when
    somebody saves or opens it - and then the layer checking at the entrance or in
    real time will deal with it. This layer merely moves the moment of detection
    earlier, to when the attachment still lies in the mailbox.

    On a server the item has a narrow use. Mail servers have mechanisms of their own
    for checking mail, working at the level of the service rather than of the file -
    and it is they that do this work properly.

    What an attacker gains while the item goes unmet: little. An attachment stays
    unrecognised so long as it lies in a mailbox, but will be checked the moment it
    begins to be of use.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przyczyna jest poważniejsza niż sama
    ocena wagi punktu.

    Na maszynie z serwerem pocztowym warstwa ta jest wprost szkodliwa.
    Ochrona otwierająca pliki magazynu pocztowego blokuje je na czas
    odczytu, a magazyn jest w tym czasie zapisywany przez usługę. Skutkiem
    bywa uszkodzenie bazy pocztowej — awaria poważna, kosztowna
    w odtwarzaniu i dobrze udokumentowana przez producentów, którzy wprost
    zalecają wyłączenia dla tych katalogów.

    Dlatego uwaga o wyłączeniach dla magazynu pocztowego siedzi wprost
    w poleceniu naprawczym, a nie w opisie. Jest to warunek wykonania,
    a nie zalecenie.

    Na maszynie bez serwera pocztowego skutków nie ma prawie żadnych,
    poza wydłużeniem skanowania pełnego tam, gdzie leżą duże pliki skrzynek
    lokalnych.

    Czego to nie psuje: pracy serwera pocztowego przy założonych
    wyłączeniach, dostarczania poczty, usług, logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and the cause is graver than the judgement of the
    item's weight alone.

    On a machine with a mail server this layer is outright harmful. Protection
    opening the files of a mail store locks them for the time of the reading, while
    the store is at that time being written by the service. The upshot is at times a
    damaged mail database - a grave breakdown, dear to recover from and well
    documented by the makers, who outright recommend exclusions for those
    directories.

    That is why the remark about exclusions for the mail store sits in the remedial
    command outright, and not in the description. It is a condition of execution
    rather than a recommendation.

    On a machine with no mail server there are next to no consequences, beyond a
    lengthened full scan where large files of local mailboxes are lying.

    What this does not break: the working of a mail server with the exclusions in
    place, the delivery of mail, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - file-sharing
  what_breaks:
    pl:
      - Na maszynie z serwerem pocztowym bez założonych wyłączeń odczyt plików magazynu blokuje je i potrafi uszkodzić bazę pocztową
      - Skanowanie pełne wydłuża się tam, gdzie leżą duże pliki skrzynek lokalnych
      - Wartość punktu jest ograniczona, bo załącznik i tak zostanie sprawdzony przy zapisie albo otwarciu
      - Dostarczanie poczty, usługi i logowanie pozostają bez zmian
    en:
      - On a machine with a mail server and no exclusions in place, reading the store files locks them and can damage the mail database
      - A full scan lengthens where large files of local mailboxes are lying
      - The item's value is limited, an attachment being checked anyway at the saving or the opening
      - The delivery of mail, services and signing in stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje serwer pocztowy, a katalogi magazynu nie mają założonych wyłączeń zalecanych przez producenta
      - Maszyna przechowuje wielkie pliki skrzynek, a czasu skanowania pełnego nie można wydłużyć
    en:
      - A mail server works on the machine and the store directories have no exclusions the maker recommends
      - The machine holds very large mailbox files and the time of a full scan cannot be lengthened
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableEmailScanning) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    $name = 'DisableEmailScanning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a machine running a mail server the store folders must carry an exclusion
    # first - reading them locks files and damages the store.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Scan'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableEmailScanning' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-advanced-scan-types-microsoft-defender-antivirus

notes:
  pl: |
    Punkt jest jedynym w bloku, którego wykonanie bez przygotowania grozi
    uszkodzeniem danych, a nie tylko spowolnieniem. Ocena niska odnosi się do
    tego, ile punkt daje, a nie do tego, ile kosztuje przy błędnym wdrożeniu
    — i te dwie rzeczy trzeba pokazywać obok siebie, bo inaczej niska
    kategoria zostanie odczytana jako „bezpieczne do wykonania hurtem".

    Jest to zarazem dobry przykład na to, dlaczego kategoria ryzyka
    i klasa uciążliwości są osobnymi osiami. Punkt daje mało i może
    kosztować dużo. Żadna z tych ocen nie wynika z drugiej.

    Na maszynie z serwerem pocztowym właściwym rozwiązaniem jest wykonanie
    punktu po założeniu wyłączeń, a nie odpuszczenie go — ale odpuszczenie
    z zapisanym uzasadnieniem jest tu również wynikiem prawidłowym, bo
    wartość punktu na takiej maszynie jest bliska zeru.
  en: |
    The item is the only one in the block whose execution without preparation
    threatens damage to data rather than a slowdown alone. The low judgement refers
    to how much the item gives, and not to how much it costs on a wrong rollout -
    and those two things have to be shown side by side, since otherwise the low
    category will be read as "safe to do in bulk".

    It is at the same time a good example of why risk category and disruption class
    are separate axes. The item gives little and can cost much. Neither judgement
    follows from the other.

    On a machine with a mail server the proper answer is to carry the item out once
    the exclusions are in place, rather than to let it go - but letting it go with a
    written justification is a proper outcome here too, the item's value on such a
    machine being close to nothing.
