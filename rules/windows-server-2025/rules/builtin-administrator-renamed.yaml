id: win2025-builtin-administrator-renamed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora przemianowane
    en: The built-in administrator account renamed
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby wbudowane konto administratora nosiło nazwę inną niż
    domyślna.

    Trzeba od razu powiedzieć, czym ta zmiana nie jest: nie jest
    zabezpieczeniem. Konto zachowuje ten sam identyfikator, a identyfikator
    ten jest stały we wszystkich instalacjach Windows i da się go odczytać
    kilkoma drogami, z których żadna nie wymaga uprawnień. Kto wie, czego
    szuka, odnajdzie to konto niezależnie od nazwy.

    Zmiana nazwy działa na innym poziomie: odcina narzędzia, które nazwy nie
    sprawdzają, tylko ją zakładają. Automaty zgadujące hasła po sieci
    zaczynają od nazwy domyślnej, bo jest darmowa i najczęściej trafia.
    Na serwerze dostępnym z sieci przez całą dobę różnica jest wymierna:
    zamiast prób liczonych w tysiącach na godzinę, kierowanych w istniejące
    konto, próby idą w nazwę, której nie ma.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: cel gotowy,
    bez rozpoznania. Nie zyskuje dostępu — zyskuje pierwszy krok za darmo.

    Wartość tego punktu jest więc realna, ale wąska, i nie zwalnia z niczego
    innego. Konto administratora z nazwą zmienioną i hasłem ośmioznakowym
    jest kontem słabym.
  en: |
    The item takes that the built-in administrator account bear a name other than the
    default one.

    It has to be said at once what this change is not: it is no safeguard. The account keeps
    the same identifier, and that identifier is fixed across every Windows installation and
    can be read by several roads, none of which takes any rights. Whoever knows what they
    are looking for will find that account whatever its name.

    Renaming works at another level: it cuts off tools that do not check the name but assume
    it. Machines guessing passwords over the network begin with the default name, since it
    is free and hits most often. On a server reachable from the network round the clock the
    difference is measurable: instead of tries counted in thousands an hour, aimed at an
    account that exists, the tries go at a name that is not there.

    What an attacker gains while the item goes unmet: a target ready, with no reconnaissance.
    They gain no access - they gain the first step for free.

    This item's worth is therefore real but narrow, and excuses nothing else. An
    administrator account with a changed name and an eight-character password is a weak
    account.

disruption_description:
  pl: |
    Wdrożenia świadomego wymaga to, że nazwa konta bywa na serwerze zapisana
    w miejscach, o których nikt nie pamięta, a zmiana nazwy nie aktualizuje
    żadnego z nich.

    Miejsca typowe: zadania harmonogramu uruchamiane jako administrator,
    skrypty wdrożeniowe podające nazwę konta wprost, konfiguracje narzędzi
    kopii zapasowej i monitoringu, wpisy w dokumentacji i w menedżerach
    haseł. Każde z nich po zmianie przestanie działać i objawi się osobno,
    w różnym czasie — zadanie przy najbliższym uruchomieniu, kopia zapasowa
    w nocy, monitoring przy pierwszym połączeniu.

    Skutek drugi dotyczy ludzi. Nazwa domyślna jest tym, co obsługa serwera
    wpisuje odruchowo. Po zmianie odruch prowadzi w nazwę nieistniejącą,
    a przy włączonej blokadzie konta seria takich prób potrafi zablokować
    konto właściwe — o ile trafi w nowe nazwisko, albo zablokować cokolwiek
    innego, jeśli nowa nazwa pokrywa się z kontem istniejącym.

    Przed zmianą trzeba mieć spis miejsc, w których nazwa występuje,
    i wybrać nazwę nieodróżnialną od zwykłego konta. Nazwa w rodzaju
    „admin2" nie daje nic.

    Zmiana nie wymaga restartu, ale sesje otwarte na starą nazwę trwają
    do wylogowania.
  en: |
    A knowing rollout is needed because on a server an account's name is sometimes recorded
    in places nobody remembers, and renaming updates none of them.

    Typical places: scheduler tasks run as the administrator, deployment scripts giving the
    account's name outright, the configurations of backup and monitoring tools, entries in
    the documentation and in password managers. Each of them will stop working after the
    change and will come to light apart, at a different time - a task at its next run, a
    backup at night, monitoring at the first connection.

    The second effect concerns people. The default name is what a server's support types by
    reflex. After the change the reflex leads at a name that does not exist, and with
    account lockout switched on a run of such tries can lock the right account - so far as
    it hits the new name - or lock something else, if the new name coincides with an
    existing account.

    Before the change one has to have a list of the places the name appears in, and to
    choose a name indistinguishable from an ordinary account. A name of the "admin2" kind
    gives nothing.

    The change takes no restart, but sessions opened on the old name last until signing out.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Zadania harmonogramu podające nazwę konta wprost przestają się uruchamiać
      - Narzędzia kopii zapasowej i monitoringu logujące się tą nazwą tracą dostęp
      - Obsługa serwera wpisuje nazwę domyślną odruchowo i trafia w konto nieistniejące
      - Sesje otwarte przed zmianą trwają do wylogowania
    en:
      - Scheduler tasks giving the account's name outright stop running
      - Backup and monitoring tools signing in by that name lose access
      - The server's support types the default name by reflex and hits an account that is not there
      - Sessions opened before the change last until signing out
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie ma spisu miejsc, w których nazwa konta administratora jest zapisana
      - Serwer jest kontrolerem domeny, a zmiana konta domeny nie została uzgodniona
    en:
      - There is no list of the places the administrator account's name is recorded in
      - The server is a domain controller and a change of the domain's account has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
      if ($os.ProductType -eq 2) {
        # A domain controller keeps no local accounts. The built-in administrator
        # is a domain account there and falls under a separate item.
        'NOT_APPLICABLE'
      }
      else {
        # The built-in account is found by the ending of its identifier, not by
        # name. The default names below are written without letters outside the
        # basic alphabet, so that the check does not depend on the encoding in
        # which the command reaches the shell.
        $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
        if ($null -eq $account) { 'CHECK_ERROR' }
        elseif ($account.Name -match '^(administrator|administrador|administrateur|amministratore|rendszergazda)$') { 'DEFAULT_NAME' }
        else { 'RENAMED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: RENAMED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    [pscustomobject]@{
      sid     = $account.SID.Value
      name    = $account.Name
      existed = ($null -ne $account)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $account = Get-LocalUser | Where-Object { $_.SID.Value -match '-500$' }
    # A name unconnected with the role, so that it gives nothing away. The suffix
    # keeps it apart from the accounts of people working on the machine.
    $new = 'svcadm-' + (Get-Random -Minimum 1000 -Maximum 9999)
    Rename-LocalUser -SID $account.SID -NewName $new
    "Renamed to $new"

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous name - refusing to guess one.' }
    Rename-LocalUser -SID $b.sid -NewName $b.name

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-rename-administrator-account

notes:
  pl: |
    Polecenie naprawcze nadaje nazwę losową z przedrostkiem. Jest to wybór
    świadomy: nazwa ustalona z góry i taka sama na wszystkich maszynach
    byłaby po pewnym czasie równie znana jak domyślna. Nazwę można wpisać
    własną — tryb „Kopiuj" jest tu drogą właściwą tam, gdzie nazwa musi
    pasować do istniejącej konwencji.

    Sprawdzenie porównuje nazwę z listą wariantów domyślnych w kilku
    wersjach językowych. Lista nie jest pełna; na systemie w wersji
    językowej spoza niej konto z nazwą domyślną zostanie uznane
    za przemianowane. Jest to znane ograniczenie i warto je zweryfikować
    ręcznie przy pierwszym audycie.

    Na kontrolerze domeny wynik brzmi „nie dotyczy": kontroler nie ma kont
    lokalnych, a wbudowane konto administratora jest tam obiektem domeny,
    ocenianym osobno.
  en: |
    The remedy command gives a random name with a prefix. That is a knowing choice: a name
    settled in advance and the same on every machine would after a while be as well known as
    the default one. A name of one's own can be typed in - the "Copy" mode is the right road
    here wherever the name has to fit an existing convention.

    The check compares the name with a list of default variants in several language
    versions. The list is not complete; on a system in a language version outside it an
    account with a default name will be held renamed. That is a known limit and is worth
    verifying by hand at the first audit.

    On a domain controller the result reads "not applicable": a controller has no local
    accounts, and the built-in administrator account is a domain object there, assessed
    apart.
