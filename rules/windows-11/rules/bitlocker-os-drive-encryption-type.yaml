id: win11-bitlocker-os-drive-encryption-type

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives
  title:
    pl: Szyfrowanie całego dysku systemowego wymuszone
    en: Full encryption of the operating system drive enforced
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, ile dysku systemowego zostanie zaszyfrowane przy
    zakładaniu ochrony: cały nośnik czy wyłącznie ta jego część, na której
    w danej chwili leżą dane.

    Różnica brzmi technicznie, a jest zasadnicza. Szyfrowanie samego zajętego
    miejsca zostawia obszar wolny w stanie, w jakim był — czyli razem z tym,
    co zostało na nim zapisane, zanim ochronę włączono, i z tym, co zostało
    usunięte później. Usunięcie pliku nie kasuje jego zawartości, tylko
    zwalnia miejsce. Zawartość leży tam dalej, w postaci jawnej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp do
    danych, które były na dysku przed włączeniem ochrony, oraz do wszystkiego,
    co od tego czasu usunięto. Wystarczy wymontować nośnik i przeczytać obszar
    wolny — hasło ani klucz nie są do tego potrzebne, bo ten obszar nigdy nie
    został zaszyfrowany.

    Jest to sytuacja gorsza niż brak ochrony, bo sprawia wrażenie ochrony
    pełnej. Raport pokazuje dysk jako zaszyfrowany, a część jego zawartości
    jawną. Właśnie ta rozbieżność jest powodem, dla którego punkt ma wysoką
    kategorię ryzyka mimo pozornie technicznego charakteru.
  en: |
    The setting settles how much of the operating system drive is encrypted when
    protection is set up: the whole medium, or only that part of it where data lie at the
    moment.

    The difference sounds technical and is fundamental. Encrypting the used space alone
    leaves the free area as it was - that is, along with what was written on it before
    protection was switched on, and with what was deleted later. Deleting a file does not
    erase its contents but frees the space. The contents lie on there, in the clear.

    What an attacker gains while the item goes unmet: access to data that were on the
    disk before protection was switched on, and to everything deleted since. It is enough
    to take the medium out and read the free area - no password and no key are needed for
    that, because that area was never encrypted.

    It is a state worse than no protection, because it gives the impression of full
    protection. The report shows the disk as encrypted while part of its contents is in
    the clear. That very discrepancy is why the item carries a high risk category despite
    its seemingly technical nature.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, ile czasu zajmie pierwsze szyfrowanie i kiedy
    maszyna może sobie na to pozwolić.

    Ustawienie nie zmienia niczego na dyskach już zaszyfrowanych. Dysk
    zaszyfrowany wcześniej w trybie oszczędnym pozostaje w tym trybie —
    i to jest najważniejsza rzecz do powiedzenia przy tej regule. Aby
    doprowadzić taki dysk do stanu pełnego, trzeba ochronę zdjąć i założyć od
    nowa, co jest operacją długą i wymagającą kopii zapasowej.

    Skutek dotyczy więc maszyn, na których ochrona dopiero zostanie założona.
    Tam pierwsze szyfrowanie obejmie cały nośnik, także jego część pustą,
    i potrwa odpowiednio dłużej — na dużym dysku są to godziny zamiast minut.
    Maszyna pracuje w tym czasie normalnie, ale wolniej, a przerwanie procesu
    wyłączeniem zasilania wydłuża go przy następnym uruchomieniu.

    Na komputerze przenośnym warto zaplanować to na czas pracy z zasilaniem
    sieciowym. Szyfrowanie na baterii bywa wstrzymywane i proces ciągnie się
    dniami.

    Praca użytkownika po zakończeniu szyfrowania nie zmienia się w żaden
    sposób.
  en: |
    What needs checking is how long the first encryption will take and when the machine
    can afford it.

    The setting changes nothing on disks already encrypted. A disk encrypted earlier in
    the sparing mode stays in that mode - and that is the most important thing to say
    about this rule. To bring such a disk to the full state, protection has to be removed
    and set up afresh, which is a long operation calling for a backup.

    The effect therefore concerns machines where protection is yet to be set up. There
    the first encryption will cover the whole medium, its empty part as well, and will
    take correspondingly longer - on a large disk that means hours instead of minutes.
    The machine works normally during that time, but more slowly, and breaking the
    process off by cutting the power lengthens it at the next start.

    On a portable computer it is worth planning for a time of work on mains power.
    Encryption on battery is sometimes held back and the process drags on for days.

    The user's work after the encryption has finished does not change in any way.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - boot-and-firmware
    - updates-and-servicing
  what_breaks:
    pl:
      - Pierwsze szyfrowanie dysku systemowego trwa znacznie dłużej i obciąża maszynę
      - Na komputerze przenośnym proces bywa wstrzymywany przy pracy na baterii
      - Dyski zaszyfrowane wcześniej w trybie oszczędnym pozostają w tym trybie
      - Praca użytkownika po zakończeniu szyfrowania nie zmienia się w żaden sposób
    en:
      - The first encryption of the operating system drive takes much longer and loads the machine
      - On a portable computer the process is sometimes held back while running on battery
      - Disks encrypted earlier in the sparing mode stay in that mode
      - The user's work after the encryption has finished does not change in any way
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyny są wdrażane masowo w oknie, które nie pomieści pełnego szyfrowania
      - Nośnik jest u kresu trwałości i pełny zapis jest ryzykiem większym niż zysk
    en:
      - Machines are rolled out in bulk in a window that will not fit a full encryption
      - The medium is at the end of its life and writing it whole is a greater risk than the gain
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'OSEncryptionType'
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 1) { 'FULL' }
        elseif ([int]$value -eq 2) { 'USED_SPACE_ONLY' }
        elseif ([int]$value -eq 0) { 'USER_CAN_OVERRIDE' }
        else { "OTHER $value" }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: FULL
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $current = (Get-ItemProperty -Path $path -Name 'OSEncryptionType' -ErrorAction SilentlyContinue).'OSEncryptionType'
    [pscustomobject]@{
      path        = $path
      name        = 'OSEncryptionType'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'OSEncryptionType' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Sprawdzenie rozróżnia trzy stany niezgodne zamiast zgłaszać jeden.
    Ustawienie na tryb oszczędny to świadomy wybór gorszego wariantu;
    pozostawienie wyboru użytkownikowi to brak decyzji; brak wartości to brak
    ustawienia. Różnica ma znaczenie przy czytaniu raportu i przy ustalaniu,
    czy ktoś kiedyś ten punkt rozważał.

    Ustawienie działa wyłącznie przy zakładaniu ochrony. Nie przeszyfruje
    dysku już chronionego i nie da się tego obejść zmianą zasady —
    doprowadzenie takiego dysku do stanu pełnego wymaga zdjęcia ochrony
    i założenia jej od nowa.

    Punkt tworzy trójkę z bliźniaczymi ustawieniami dla dysków stałych
    z danymi i dla nośników wymiennych. Wyniki tych trzech reguł warto czytać
    razem — maszyna z pełnym szyfrowaniem dysku systemowego i oszczędnym
    na dysku z danymi chroni jedno, a zostawia drugie.
  en: |
    The check tells three non-compliant states apart instead of reporting one. Setting
    the sparing mode is a deliberate choice of the worse option; leaving the choice to
    the user is an absence of decision; a missing value is an absence of setting. The
    difference matters when the report is read and when establishing whether anybody ever
    weighed this item.

    The setting works only when protection is being set up. It will not re-encrypt a disk
    already protected, and that cannot be got round by changing the policy - bringing
    such a disk to the full state takes removing protection and setting it up afresh.

    The item forms a trio with the twin settings for fixed data disks and for removable
    media. The results of these three rules are worth reading together - a machine with
    full encryption of the operating system drive and the sparing mode on the data disk
    guards one and leaves the other.
