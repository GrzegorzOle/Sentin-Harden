id: win10-ntlm-session-security-server

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Minimalne zabezpieczenie sesji po stronie serwera NTLM
    en: The least session guard on the NTLM server side
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, na co najmniej maszyna zgadza się, przyjmując sesję
    uwierzytelnianą starszym mechanizmem — czyli wtedy, gdy to ona wystawia
    zasób, a ktoś po niego sięga.

    Punkt jest bliźniaczy wobec poprzedniego i żąda tego samego: odmiany
    nowszej i klucza pełnej długości. Różnica leży w kierunku, a przez to
    w tym, czyje poświadczenia są narażone.

    Po stronie nawiązującej narażony jest ten, kto się łączy. Po stronie
    przyjmującej narażony jest każdy, kto do tej maszyny sięga — a jego
    poświadczenia przechodzą przez wymianę, którą napastnik może
    przechwycić po drodze. Maszyna godząca się na odmianę starszą naraża
    więc nie siebie, tylko tych, którzy jej ufają.

    Rzecz warta odnotowania: wystawiając zasób, maszyna decyduje za stronę
    drugą. Ta nie ma jak zażądać ochrony mocniejszej, niż serwer dopuszcza.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wymianę
    uwierzytelniającą osób sięgających po zasoby tej maszyny, prowadzoną
    odmianą podatną na odtworzenie hasła.
  en: |
    The setting says what the machine agrees to at the least when taking in a session authenticated by the older
    mechanism - which is to say when it sets a resource out and somebody reaches for it.

    The item is twin to the foregoing one and asks the same: the newer kind and a key of full length. The
    difference lies in the direction, and thereby in whose credentials are put at hazard.

    On the side that sets up, whoever joins is at hazard. On the side that takes in, everybody reaching for this
    machine is at hazard - and their credentials pass through an exchange an attacker may catch on the way. A
    machine agreeing to the older kind puts at hazard therefore not itself but those who trust it.

    A thing worth noting: setting a resource out, the machine decides on the other side's behalf. That side has
    no way of asking for a guard stronger than the server allows.

    What an attacker gains while the item goes unmet: the authenticating exchange of people reaching for this
    machine's resources, carried on in a kind open to a password being recovered.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiot jest ten sam co przy regule
    poprzedniej, tylko po drugiej stronie połączenia.

    Maszyna nieudostępniająca niczego zmiany nie odczuje i jest to przypadek
    najczęstszy na stanowisku roboczym.

    Tam, gdzie zasób jest wystawiony, rozstrzyga strona łącząca się. Skanery
    odkładające dokumenty do katalogu, urządzenia pomiarowe i oprogramowanie
    branżowe z własną implementacją bywają zatrzymane na odmianie starszej
    i po zmianie dostaną odmowę.

    Objaw po tej stronie jest trudniejszy do rozpoznania niż po stronie
    poprzedniej, bo komunikat widzi strona łącząca się, a nie ta maszyna.
    Urządzenie zgłasza błąd uwierzytelnienia, a przyczyna leży
    w ustawieniu tutaj.

    Zmiana wchodzi natychmiast i cofa się natychmiast.

    Czego to nie psuje: połączeń przychodzących uwierzytelnianych
    mechanizmem nowszym, uprawnień do zasobów, logowania, kont domenowych,
    aplikacji lokalnych.
  en: |
    The class is "needs review", and the object is the same as at the foregoing rule, only on the connection's
    other side.

    A machine setting nothing out will not feel the change, and that is the commonest case at a workplace.

    Where a resource is set out, the joining side settles the matter. Scanners laying documents into a
    directory, measuring devices and trade software of its own making are at times stopped at the older kind,
    and after the change will be refused.

    The symptom on this side is harder to recognise than on the foregoing one, the message being seen by the
    joining side and not by this machine. The device reports an authentication error while the cause lies in a
    setting here.

    The change takes hold at once and undoes itself at once.

    What this does not break: incoming connections authenticated by the newer mechanism, the rights upon
    resources, logging on, domain accounts, or local applications.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Skanery, urządzenia pomiarowe i oprogramowanie branżowe zatrzymane na odmianie starszej dostają odmowę przy dostępie do zasobów tej maszyny
      - Komunikat widzi strona łącząca się, a nie ta maszyna, więc rozpoznanie przyczyny jest trudniejsze
      - Urządzenie zgłasza błąd uwierzytelnienia, choć przyczyna leży w ustawieniu na tej maszynie
      - Połączenia przychodzące uwierzytelniane mechanizmem nowszym działają dalej bez zmiany
      - Uprawnienia do zasobów, logowanie, konta domenowe i aplikacje lokalne pozostają bez zmian
    en:
      - Scanners, measuring devices and trade software stopped at the older kind are refused when reaching this machines resources
      - The message is seen by the joining side and not by this machine, so the cause is harder to recognise
      - The device reports an authentication error though the cause lies in a setting upon this machine
      - Incoming connections authenticated by the newer mechanism work on without change
      - The rights upon resources, logging on, domain accounts and local applications stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Po zasoby tej maszyny sięga urządzenie obsługujące wyłącznie odmianę starszą tego mechanizmu
      - Nie ustalono, co i czym uwierzytelnia się wobec zasobów wystawionych przez tę maszynę
    en:
      - A device serving only the older kind of that mechanism reaches for this machines resources
      - It has not been established what authenticates itself against this machines resources, nor by what means
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key is part of the authentication package and is always there, so its
      # absence is a fault rather than a state. The value is read as a number, the
      # setting being a sum of flags and not a plain switch.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'NTLMMinServerSec'
      $item = Get-ItemProperty -Path $path -ErrorAction Stop
      if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
    } catch {
      'CHECK_ERROR'
    }
  expected: '537395200'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'NTLMMinServerSec'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The joining side will be refused where it cannot agree upon the newer kind.
    # The message comes up there, not here, so the cause is harder to recognise
    # from this machine.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NTLMMinServerSec' -Value 537395200 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-minimum-session-security-for-ntlm-ssp-based-including-secure-rpc-servers

notes:
  pl: |
    Reguła domyka parę i domyka cały blok. Warto, żeby aplikacja pokazywała
    obie reguły pary razem, bo różnią się wyłącznie kierunkiem, a nazwy
    wartości w rejestrze są prawie identyczne.

    Argument wart postawienia wprost dotyczy tego, czyje poświadczenia są
    narażone. Po tej stronie maszyna decyduje nie za siebie, tylko za tych,
    którzy po jej zasoby sięgają — oni nie mają jak zażądać ochrony
    mocniejszej. Jest to zdanie, które tę regułę uzasadnia lepiej niż opis
    mechanizmu.

    Odnotowuję, że objaw po tej stronie widzi ktoś inny niż użytkownik tej
    maszyny. Aplikacja, która to nazwie, oszczędzi rozpoznania, w którym
    szuka się przyczyny nie tam, gdzie ona jest.
  en: |
    The rule closes the pair and closes the whole block. It is well that the application show both rules of the
    pair together, they parting only by direction while their registry value names are all but the same.

    The argument worth putting outright touches whose credentials are at hazard. On this side the machine
    decides not for itself but for those who reach for its resources - and they have no way of asking for a
    stronger guard. It is a sentence that grounds this rule better than a description of the mechanism.

    I set down that the symptom on this side is seen by somebody other than this machine's user. An application
    naming that will spare a recognising in which the cause is sought where it is not.
