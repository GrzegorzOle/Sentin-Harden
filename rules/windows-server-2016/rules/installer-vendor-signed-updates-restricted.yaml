id: win2016-installer-vendor-signed-updates-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Nakładanie poprawek podpisanych przez producenta zastrzeżone dla administratorów
    en: The applying of patches signed by the maker reserved for administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zamyka drogę, którą użytkownik bez uprawnień administratora
    mógł nałożyć poprawkę na zainstalowany pakiet, o ile poprawka była
    podpisana przez producenta tego pakietu.

    Droga ta powstała z myślą wygodną: skoro producent podpisał poprawkę,
    to poprawka jest tym, za co się podaje, a skoro pakiet już jest
    zainstalowany, to jego naprawa nie wymaga decyzji administratora.
    Rozumowanie ma jednak lukę.

    Poprawka nakładana na pakiet wykonuje się z uprawnieniami mechanizmu
    instalacyjnego, czyli wysokimi. Podpis mówi, kto poprawkę wydał, i nic
    poza tym. Nie mówi, czy jest to poprawka aktualna, czy stara; czy
    naprawia, czy przywraca wersję dziurawą; ani czy producent nadal stoi
    za tym, co wtedy podpisał.

    Napastnik mający dostęp do konta zwykłego użytkownika nie musi więc
    niczego podrabiać. Wystarczy, że odnajdzie starą, prawidłowo podpisaną
    poprawkę producenta, która przywraca wersję składnika z luką.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wykonania z konta bez uprawnień zmiany o wysokich uprawnieniach, przy
    użyciu pliku, którego autentyczności nie trzeba podrabiać.
  en: |
    The setting shuts the road by which a user without administrator rights could
    apply a patch to an installed package, so long as the patch was signed by that
    package's maker.

    That road came about from a convenient thought: since the maker signed the
    patch, the patch is what it claims to be, and since the package is installed
    already, mending it calls for no administrator's decision. The reasoning has a
    gap, though.

    A patch applied to a package runs with the installing mechanism's rights, which
    is to say high ones. The signature says who released the patch and nothing
    besides. It does not say whether the patch is current or old; whether it mends
    or brings back a version full of holes; nor whether the maker still stands
    behind what they signed then.

    An attacker holding an ordinary user's account therefore need forge nothing. It
    is enough that they find an old, properly signed patch of the maker's that
    brings back a version of a component with a gap in it.

    What an attacker gains while the item goes unmet: the means of carrying out,
    from an account without rights, a change of high rights, using a file whose
    authenticity need not be forged.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy na maszynie coś
    tej drogi używa.

    Na serwerze używa jej niewiele, bo poprawki nakłada się tu przez
    narzędzia wdrożeniowe pracujące z uprawnieniami administratora, a te
    punkt pomija.

    Przypadek wart wymienienia dotyczy aplikacji aktualizujących się same
    w kontekście zalogowanego użytkownika. Program uruchamiany na serwerze
    w sesji użytkownika, który przy starcie sprawdza, czy ma poprawkę do
    nałożenia, i nakłada ją bez pytania — taki program przestanie umieć się
    zaktualizować.

    Objaw bywa przy tym cichy i to jest tu najbardziej kłopotliwe. Część
    takich aplikacji nie zgłasza niepowodzenia aktualizacji, tylko dalej
    pracuje w wersji starej. Wygląda to jak wszystko w porządku, a znaczy,
    że poprawki nie są nakładane od miesięcy.

    Rzecz druga dotyczy oprogramowania wyspecjalizowanego, które bywa
    projektowane wprost pod tę drogę, żeby nie wymagać administratora przy
    każdej drobnej poprawce.

    Czego to nie psuje: instalacji i poprawek wykonywanych przez
    administratora, narzędzi wdrożeniowych, odinstalowywania, usług,
    logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether anything on
    the machine uses that road.

    On a server little does, patches being applied here by deployment tools working
    with administrator rights, and the item passes those over.

    A case worth naming concerns applications updating themselves in the context of
    a signed-in user. A program started on the server in a user's session that
    checks at its start whether it has a patch to apply, and applies it without
    asking - such a program will lose the ability to update itself.

    The symptom is at times quiet, and that is the most troublesome part. Some such
    applications do not report a failed update but go on working in the old version.
    It looks like all being well, and means patches have not been applied for
    months.

    The second thing concerns specialised software at times designed for that very
    road, so as not to call for an administrator at every small patch.

    What this does not break: installations and patches carried out by an
    administrator, deployment tools, uninstalling, services, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - legacy-applications
    - scripting-and-automation
  what_breaks:
    pl:
      - Aplikacja aktualizująca się sama w sesji zalogowanego użytkownika przestaje umieć nałożyć poprawkę
      - Część takich aplikacji nie zgłasza niepowodzenia, tylko dalej pracuje w wersji starej, więc objaw jest cichy
      - Oprogramowanie wyspecjalizowane projektowane wprost pod tę drogę wymaga odtąd administratora przy każdej poprawce
      - Instalacje i poprawki wykonywane przez administratora oraz narzędzia wdrożeniowe pozostają bez zmian
    en:
      - An application updating itself in a signed-in user's session loses the ability to apply a patch
      - Some such applications report no failure but go on working in the old version, so the symptom is a quiet one
      - Specialised software designed for that very road now calls for an administrator at every patch
      - Installations and patches carried out by an administrator, and deployment tools, stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje aplikacja nakładająca własne poprawki w sesji użytkownika i nie przewidziano dla niej innej drogi aktualizacji
      - Oprogramowanie wyspecjalizowane na tej maszynie aktualizuje się wyłącznie tą drogą, a administrator nie jest dostępny przy każdej poprawce
    en:
      - An application applying its own patches in a user's session works on the machine and no other road of updating has been provided for it
      - Specialised software on this machine updates itself only by that road, and an administrator is not on hand at every patch
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $name = 'DisableLUAPatching'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'DisableLUAPatching'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableLUAPatching' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/patching

notes:
  pl: |
    Punkt zamyka trójkę o mechanizmie instalacyjnym i jest w niej
    najciekawszy, bo pokazuje granicę zaufania do podpisu. Podpis
    odpowiada na pytanie, kto to wydał, a nie na pytanie, czy wolno to
    teraz nałożyć. Rozróżnienie to wraca w całym zestawie i warto je
    w tym miejscu nazwać wprost.

    Cicha postać skutku jest tu ważniejsza niż sam skutek. Aplikacja, która
    przestała się aktualizować i nic o tym nie mówi, wygląda dokładnie tak
    samo jak aplikacja aktualna. Przy wdrożeniu warto więc po kilku
    tygodniach sprawdzić wersje tego, co na maszynie pracuje.

    Trzy reguły o mechanizmie instalacyjnym opisują razem jedno: skąd ten
    mechanizm przyjmuje polecenia i czyim głosem. Pierwsza mówi, że nie od
    użytkownika. Druga, że nie ze skryptu w środowisku ograniczonym.
    Trzecia, że nie od podpisu zamiast od administratora.
  en: |
    The item shuts the set of three about the installing mechanism and is the most
    interesting of them, showing the bound of trust in a signature. A signature
    answers the question who released this, and not the question whether it may be
    applied now. That distinction returns across the whole set and is worth naming
    outright here.

    The quiet form of the consequence matters more here than the consequence itself.
    An application that has stopped updating and says nothing about it looks exactly
    like an up-to-date one. At rollout it is therefore worth checking, a few weeks
    on, the versions of what works on the machine.

    The three rules about the installing mechanism together describe one thing:
    where that mechanism takes its orders from, and in whose voice. The first says
    not from the user. The second, not from a script in limited surroundings. The
    third, not from a signature in place of an administrator.
