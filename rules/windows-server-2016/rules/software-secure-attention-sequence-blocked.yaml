id: win2016-software-secure-attention-sequence-blocked

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Logon Options
  title:
    pl: Wywoływanie sekwencji uwagi przez oprogramowanie zablokowane
    en: The calling of the attention sequence by software blocked
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania oprogramowaniu wywoływać sekwencję uwagi, czyli
    kombinację klawiszy otwierającą ekran logowania.

    Sens tej kombinacji polega na jednym: ma jej nie dać się podrobić.
    Przechwytuje ją sam system, przed jakimkolwiek programem, i dlatego
    ekran, który się po niej pokazuje, na pewno pochodzi od systemu.
    Człowiek, który ją naciśnie, wie, że wpisuje hasło w miejscu
    prawdziwym, a nie w oknie udającym logowanie.

    Dopuszczenie oprogramowania do wywoływania tej sekwencji odbiera jej tę
    właściwość. Skoro program potrafi ją wywołać, to potrafi także wywołać
    ją w chwili przez siebie wybranej — a dalszy ciąg zależy już od tego,
    co użytkownik zobaczy.

    Ustawienie przyjmuje wartości ze zbioru: od niedopuszczania niczego,
    przez dopuszczenie usług, narzędzi ułatwień dostępu, po jedno i drugie.
    Punkt wymaga wartości najniższej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    wywołania w wybranej chwili sekwencji, której właściwością miało być
    to, że wywołać jej nie można.
  en: |
    The setting forbids software to call the attention sequence, which is to say the key combination opening
    the logon screen.

    That combination's sense rests on one thing: it is not to be counterfeited. The system itself catches it,
    before any program, and therefore the screen that follows it surely comes from the system. A person who
    presses it knows they are typing a password in a true place and not in a window feigning a logon.

    Admitting software to the calling of that sequence takes that property away from it. If a program can
    call it, then it can also call it at a moment of its own choosing - and what follows hangs already on
    what the user sees.

    The setting takes values from a set: from admitting nothing, through admitting services, accessibility
    tools, and both. The item calls for the lowest value.

    What an attacker gains while the item goes unmet: the chance to call at a chosen moment a sequence whose
    property was to be that it cannot be called.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie dotyczy dwóch rodzajów
    narzędzi.

    Pierwszy to rozwiązania pomocy zdalnej. Część z nich pokazuje osobie
    łączącej się ekran logowania maszyny i robi to właśnie tą drogą. Po
    zmianie połączenie zestawi się, ale zalogować się przez nie nie da —
    a objaw wygląda jak zawieszenie, nie jak odmowa.

    Drugi to narzędzia ułatwień dostępu. Klawiatura ekranowa i podobne
    rozwiązania muszą umieć wywołać tę sekwencję, bo inaczej osoba
    korzystająca z nich nie zaloguje się w ogóle. Jest to przypadek,
    w którym odpuszczenie punktu z zapisanym uzasadnieniem jest jedynym
    właściwym wynikiem.

    Ustawienie ma wartości pośrednie i warto o tym pamiętać przy
    odpuszczaniu. Zamiast zostawiać stan domyślny, można dopuścić
    wyłącznie ten rodzaj oprogramowania, który jest potrzebny.

    Czego to nie psuje: logowania z klawiatury, pulpitu zdalnego, blokady
    ekranu, usług, aplikacji, sieci.

    Nie wymaga restartu ani zatrzymania usługi.
  en: |
    The class is "needs review", and the review concerns two kinds of tools.

    The first is remote-help solutions. Some of them show the connecting person the machine's logon screen and
    do it by just that road. After the change the connection will be set up, but logging in through it will
    not be possible - and the symptom looks like a hanging rather than a refusal.

    The second is accessibility tools. An on-screen keyboard and like solutions must be able to call that
    sequence, else the person using them will not log in at all. It is a case in which letting the item go with
    a written justification is the one proper outcome.

    The setting has middle values and that is worth keeping in mind when letting go. Instead of leaving the
    default state, one may admit solely the kind of software that is needed.

    What this does not break: logging on from a keyboard, the remote desktop, the screen lock, services,
    applications, or the network.

    Calls for no restart and no stopping of a service.

implementation_consequences:
  impact_areas:
    - user-interface
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Rozwiązanie pomocy zdalnej pokazujące ekran logowania tą drogą przestaje pozwalać na zalogowanie się
      - Objaw wygląda jak zawieszenie połączenia, a nie jak odmowa, więc przyczyna bywa szukana w sieci
      - Klawiatura ekranowa i narzędzia ułatwień dostępu przestają pozwalać na zalogowanie osobie, która z nich korzysta
      - Zamiast stanu domyślnego można dopuścić wyłącznie ten rodzaj oprogramowania, który jest potrzebny
      - Logowanie z klawiatury, pulpit zdalny i blokada ekranu pozostają bez zmian
    en:
      - A remote-help solution showing the logon screen by that road ceases to allow a logon
      - The symptom looks like a hanging connection rather than a refusal, so the cause is at times looked for in the network
      - An on-screen keyboard and accessibility tools cease to allow a logon to the person using them
      - Instead of the default state one may admit solely the kind of software that is needed
      - Logging on from a keyboard, the remote desktop and the screen lock stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ktoś korzystający z tej maszyny loguje się przy pomocy narzędzia ułatwień dostępu wywołującego tę sekwencję
      - Rozwiązanie pomocy zdalnej używane do obsługi tej maszyny pokazuje ekran logowania tą drogą
    en:
      - Somebody using this machine logs in by an accessibility tool that calls that sequence
      - The remote-help solution used to attend this machine shows the logon screen by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: zero admits no software at all, and
      # the further positions admit services, accessibility tools, or both.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'SoftwareSASGeneration'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string][int]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'SoftwareSASGeneration'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Establish first whether a remote-help tool or an accessibility tool sends
    # this sequence. Where one does, its way of logging in stops working.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SoftwareSASGeneration' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/secauthn/winlogon-and-gina

notes:
  pl: |
    Punkt jest czwarty w bloku i jedyny, przy którym odpuszczenie bywa
    wymuszone względami dostępności. Warto, żeby aplikacja traktowała ten
    przypadek osobno: nie jest to koszt, który da się rozważyć, tylko
    warunek, którego nie wolno naruszyć.

    Rzecz warta pokazania dotyczy wartości pośrednich. Ustawienie nie jest
    przełącznikiem i przy odpuszczaniu nie trzeba wracać do stanu
    domyślnego — wystarczy dopuścić ten jeden rodzaj oprogramowania, który
    jest potrzebny. Jest to przykład decyzji, której benchmark nie
    przewiduje, bo benchmark zna tylko zgodność i niezgodność.

    Argument broniący tej reguły jest wart zapamiętania, bo ma szerszy
    zasięg niż sama sekwencja. Rzecz, której właściwością jest to, że nie
    da się jej podrobić, traci całą wartość w chwili, gdy da się ją
    wywołać programowo. Nie ma stanu pośredniego: albo gwarancja
    obowiązuje, albo jej nie ma.

    Objaw wart zapowiedzenia to zawieszenie, a nie odmowa. Przyczyna bywa
    wtedy szukana w sieci przez czas nieproporcjonalny do trudności.
  en: |
    The item is the fourth in the block and the only one at which a letting go is at times forced by matters of
    accessibility. It is well that the application treat that case apart: it is not a cost to be weighed but a
    condition that must not be breached.

    A thing worth showing concerns the middle values. The setting is no switch, and in letting go one need not
    return to the default state - it is enough to admit the one kind of software that is needed. It is an
    example of a decision the benchmark does not foresee, the benchmark knowing only compliance and
    non-compliance.

    The argument defending this rule is worth keeping in mind, having a wider reach than the sequence itself. A
    thing whose property is that it cannot be counterfeited loses all its value the moment it can be called by
    a program. There is no middle state: either the guarantee holds or it does not.

    The symptom worth announcing is a hanging rather than a refusal. The cause is then at times looked for in
    the network for a time out of all proportion to the difficulty.
