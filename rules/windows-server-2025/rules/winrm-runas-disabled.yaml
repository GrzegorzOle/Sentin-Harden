id: win2025-winrm-runas-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Remote Management > WinRM Service
  title:
    pl: Przechowywanie poświadczeń RunAs przez usługę zarządzania zdalnego wyłączone
    en: RunAs credential storage by the remote management service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania usłudze zarządzania zdalnego przechowywania
    poświadczeń, którymi mają być uruchamiane jej punkty końcowe.

    Mechanizm, o który chodzi, pozwala skonfigurować punkt końcowy tak,
    żeby polecenia wykonywały się nie na koncie łączącego się, tylko na
    koncie zapisanym wcześniej w konfiguracji usługi. Hasło tego konta
    leży wtedy na maszynie.

    Jest to wzorzec o dwóch twarzach i trzeba opisać obie, bo na
    serwerze występują obie.

    Twarz pierwsza jest zagrożeniem. Poświadczenie zapisane na maszynie
    jest poświadczeniem do zdobycia razem z maszyną. Konta podstawiane
    w ten sposób bywają uprzywilejowane — po to się je podstawia, żeby
    wykonać coś, na co łączący się nie ma uprawnień. Napastnik, który
    przejmie taki serwer, dostaje nie tylko jego, ale i konto, które
    tam zapisano.

    Gorsze jest to, że wzorzec ten zaciera ślad. Dziennik pokazuje
    czynność wykonaną przez konto usługowe, a nie przez osobę, która
    ją zleciła. Po fakcie nie da się ustalić, kto co zrobił, a jest to
    dokładnie to pytanie, które pada po każdym incydencie.

    Twarz druga jest zastosowaniem uprawnionym i dlatego ta reguła nie
    idzie hurtem. Ograniczone punkty końcowe zarządzania — takie, które
    dopuszczają wąski zestaw poleceń i nic poza nim — bywają celowo
    uruchamiane na koncie innym niż konto łączącego się. Jest to
    sposób na to, żeby dać komuś jedną czynność bez dawania mu
    uprawnień administratora, i jest to sposób dobry.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    poświadczenie konta uprzywilejowanego leżące na maszynie oraz
    dziennik, z którego nie wynika, kto naprawdę wydał polecenie.
  en: |
    The setting forbids the remote management service to keep credentials by which its end points
    are to be run.

    The mechanism in question lets an end point be set up so that orders are carried out not on the
    account of the one connecting but on an account written earlier into the service's settings.
    That account's password lies then upon the machine.

    It is a pattern with two faces and both must be described, both occurring on a server.

    The first face is a danger. A credential written upon a machine is a credential to be won along
    with the machine. Accounts set in this way are at times privileged - they are set so in order
    to carry out something the one connecting has no rights for. An attacker who takes such a
    server gets not it alone but the account written there.

    Worse is that the pattern blurs the trace. The log shows an act carried out by the service's
    account and not by the person who ordered it. After the fact it cannot be settled who did what,
    and that is exactly the question asked after every incident.

    The second face is a lawful use, and for that reason this rule does not go in bulk. Bounded end
    points of management - those that let through a narrow set of orders and nothing beyond - are
    at times run on purpose on an account other than that of the one connecting. It is a way of
    giving somebody one act without giving them an administrator's rights, and it is a good way.

    What an attacker gains while the item goes unmet: a privileged account's credential lying upon
    the machine, and a log from which it does not follow who truly gave the order.

disruption_description:
  pl: |
    Zaliczam ten punkt do klasy wymagającej sprawdzenia, wyżej niż
    w paczce stanowiska roboczego, i powód jest jeden, ale rozstrzygający.

    Na stanowisku roboczym nikt nie konfiguruje ograniczonych punktów
    końcowych zarządzania. Na serwerze jest to wzorzec używany świadomie
    i spotykany w środowiskach dojrzałych: zespół, który chce dać
    dyżurnemu możliwość zrestartowania jednej usługi bez dawania mu
    administratora, robi to właśnie tak.

    Po zmianie każdy punkt końcowy skonfigurowany z poświadczeniem
    przestanie działać. Objaw jest przy tym mylący i warto go znać:
    połączenie do punktu końcowego zostaje odrzucone, a komunikat mówi
    o braku możliwości utworzenia sesji, nie o zablokowanym
    przechowywaniu poświadczeń.

    Rzecz do ustalenia przed zmianą jest konkretna i da się ją sprawdzić:
    czy na tej maszynie istnieją punkty końcowe zarządzania inne niż
    domyślne i czy któryś z nich ma przypisane konto. Jeżeli tak, ta
    zmiana nie jest utwardzeniem, tylko wyłączeniem mechanizmu delegacji
    uprawnień, z którego ktoś korzysta.

    Warto wskazać właściwe zastępstwo, zamiast zostawiać ludzi
    z wyborem między zgodnością a działaniem. Ograniczony punkt końcowy
    można uruchamiać na koncie wirtualnym albo na koncie usługi
    zarządzanym przez domenę — w obu przypadkach hasło nie leży
    w konfiguracji usługi, a skutek dla użytkownika jest ten sam.
    Wtedy ten punkt daje się wdrożyć bez straty.

    Na serwerze bez własnych punktów końcowych — a więc na większości
    serwerów — zmiana jest całkowicie niewidoczna.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    trwające nie są przerywane.
  en: |
    I reckon this item to the class taking a check, higher than in the working station's pack, and
    the reason is one but settling.

    At a working station nobody sets up bounded end points of management. On a server it is a
    pattern used knowingly and met with in ripe settings: a team that means to give the one on duty
    the means of restarting one service without giving them an administrator's rights does it just
    so.

    After the change every end point set up with a credential will stop working. The symptom
    withal misleads and is worth knowing: the connection to the end point is thrown out, and the
    message speaks of an inability to make a session and not of a barred keeping of credentials.

    The thing to settle before the change is definite and can be checked: whether there are on this
    machine end points of management other than the default ones, and whether any of them has an
    account set to it. If so, this change is no hardening but a switching off of a mechanism of
    delegated rights which somebody uses.

    It is worth pointing to the right stand-in rather than leaving people with a choice between
    compliance and working. A bounded end point may be run on a virtual account or on an account of
    a service managed by the domain - in either case the password does not lie in the service's
    settings, and the effect for the user is the same. Then this item can be rolled out at no loss.

    On a server without end points of its own - and so on most servers - the change is wholly
    unseen.

    The change comes into force straight away and is undone at once. Sessions already running are
    not broken.

implementation_consequences:
  impact_areas:
    - remote-management
    - accounts-and-passwords
    - logging-and-audit
  what_breaks:
    pl:
      - Ograniczony punkt końcowy zarządzania skonfigurowany z poświadczeniem przestanie działać
      - Komunikat mówi o braku możliwości utworzenia sesji, a nie o zablokowanym przechowywaniu poświadczeń
      - Delegacja pojedynczej czynności dyżurnemu bez dawania mu uprawnień administratora przestanie być możliwa tą drogą
      - Na serwerze bez własnych punktów końcowych zmiana jest całkowicie niewidoczna
      - Sesje zarządzania już trwające nie są przerywane, warunek sprawdza się przy następnym połączeniu
    en:
      - A bounded end point of management set up with a credential will stop working
      - The message speaks of an inability to make a session and not of a barred keeping of credentials
      - The delegating of one act to the person on duty without an administrator's rights stops being possible by this road
      - On a server without end points of its own the change is wholly unseen
      - Sessions of management already running are not broken, the condition being checked at the next connecting
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa ograniczony punkt końcowy z przypisanym kontem i nie przeniesiono go na konto wirtualne
      - Delegacja uprawnień w tym środowisku opiera się na poświadczeniu zapisanym w konfiguracji usługi
    en:
      - A bounded end point with an account set to it works on the machine and was not moved onto a virtual account
      - The delegating of rights in this setting rests on a credential written into the service's settings
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
      $name = 'DisableRunAs'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    $name = 'DisableRunAs'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # End points set up with an account stop working. Where such an end point is
    # in use, it is moved onto a virtual account before this change.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableRunAs' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/powershell/scripting/security/remoting/jea/overview

notes:
  pl: |
    Wzorzec ma dwie twarze i dlatego reguła nie idzie hurtem. Twarz
    pierwsza: poświadczenie zapisane na maszynie jest do zdobycia razem
    z maszyną, a dziennik pokazuje czynność konta usługowego zamiast
    osoby, która ją zleciła.

    Twarz druga: ograniczone punkty końcowe zarządzania celowo
    uruchamiane na innym koncie to dobry sposób na danie komuś jednej
    czynności bez uprawnień administratora.

    Właściwe zastępstwo, żeby nie wybierać między zgodnością
    a działaniem: konto wirtualne albo konto usługi zarządzane przez
    domenę. Hasło nie leży wtedy w konfiguracji usługi, a skutek dla
    użytkownika jest ten sam.

    Klasę podniosłem względem paczki stanowiska roboczego, bo tam nikt
    takich punktów końcowych nie konfiguruje, a na serwerze jest to
    wzorzec używany świadomie.
  en: |
    The pattern has two faces and so the rule does not go in bulk. The first face: a credential
    written upon a machine is to be won along with the machine, and the log shows an act of the
    service's account instead of the person who ordered it.

    The second face: bounded end points of management run on purpose on another account are a good
    way of giving somebody one act without an administrator's rights.

    The right stand-in, so as not to choose between compliance and working: a virtual account or an
    account of a service managed by the domain. The password does not lie then in the service's
    settings and the effect for the user is the same.

    I raised the class against the working station's pack, nobody setting up such end points there,
    while on a server it is a pattern used knowingly.
