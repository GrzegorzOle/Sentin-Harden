id: win2025-require-ctrl-alt-del

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kombinacja klawiszy wymagana przed logowaniem
    en: Key combination required before signing in
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby przed pokazaniem pól logowania trzeba było nacisnąć
    ustaloną kombinację klawiszy.

    Powód jest jeden i niezmienny od lat: tej kombinacji nie da się
    przechwycić z poziomu zwykłego programu. Obsługuje ją bezpośrednio
    jądro systemu, więc naciśnięcie zawsze prowadzi do prawdziwego ekranu
    logowania, a nie do programu, który ten ekran udaje. Bez tego wymagania
    okno proszące o hasło może narysować dowolna aplikacja i nie ma sposobu,
    żeby odróżnić je od prawdziwego.

    Na serwerze scenariusz jest inny niż na stanowisku roboczym i mniej
    oczywisty. Ekranu logowania serwera nikt nie ogląda na co dzień —
    ale ogląda go ten, kto właśnie wszedł do serwerowni albo połączył się
    przez konsolę zarządzania sprzętowego. Jest to więc zabezpieczenie
    dokładnie tej drogi, która omija wszystkie zabezpieczenia sieciowe.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podstawienia ekranu logowania osobie z uprawnieniami administracyjnymi
    i zebrania hasła, które ta osoba wpisze przekonana, że loguje się
    do systemu.
  en: |
    The item takes that a settled key combination be pressed before the sign-in fields are
    shown.

    There is one reason and it has not changed for years: that combination cannot be
    intercepted from an ordinary program. The system's kernel handles it directly, so
    pressing it always leads to the true sign-in screen rather than to a program pretending
    to be one. Without that demand a window asking for a password can be drawn by any
    application and there is no way of telling it from the real one.

    On a server the scenario differs from that at a working station and is less obvious.
    Nobody looks at a server's sign-in screen day to day - but the person who has just
    walked into the server room or connected through the hardware management console does.
    It is therefore a safeguard of exactly the road that goes round every network safeguard.

    What an attacker gains while the item goes unmet: the means of putting a sign-in screen
    in front of someone with administrative rights and gathering the password that person
    types, certain they are signing in to the system.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy do serwera sięga się przez konsolę, która tę
    kombinację potrafi wysłać.

    Przy klawiaturze podłączonej do maszyny pytania nie ma. Pytanie pojawia
    się przy dostępie zdalnym do konsoli: przełącznik konsolowy, karta
    zarządzania sprzętowego, konsola maszyny wirtualnej w hipernadzorcy.
    Każde z tych narzędzi ma osobne polecenie wysłania tej kombinacji,
    zwykle w menu, i każde robi to inaczej. Obsługa, która o tym nie wie,
    zobaczy ekran, na którym nic się nie dzieje.

    Pulpit zdalny obsługuje to sam i po jego stronie nie zmienia się nic.

    Punkt bywa wyłączany celowo tam, gdzie logowanie ma być automatyczne —
    i to jest jedyny przypadek, w którym zmiana faktycznie coś zepsuje.
    Logowanie automatyczne przestanie działać, bo cała jego idea polega na
    pominięciu ekranu logowania.

    Zmiana nie wymaga restartu; obowiązuje od następnego logowania.
  en: |
    What needs checking is whether the server is reached through a console able to send that
    combination.

    At a keyboard plugged into the machine there is no question. The question arises at
    remote access to the console: a console switch, a hardware management card, a virtual
    machine's console in the hypervisor. Each of those tools has a separate command for
    sending that combination, usually in a menu, and each does it differently. Support that
    does not know of it will see a screen on which nothing happens.

    The remote desktop handles it itself and on its side nothing changes.

    The item is sometimes switched off deliberately where signing in is to be automatic -
    and that is the one case in which the change will actually break something. Automatic
    signing in will stop working, since its whole idea rests on passing the sign-in screen
    over.

    The change takes no restart; it binds from the next signing in.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-management
    - accounts-and-passwords
  what_breaks:
    pl:
      - Logowanie automatyczne przestaje działać, bo omija ekran logowania
      - Konsola sprzętowa wymaga osobnego polecenia wysłania tej kombinacji
      - Obsługa nieznająca tego polecenia widzi ekran, na którym nic się nie dzieje
      - Pulpit zdalny obsługuje kombinację sam i nie zmienia się po jego stronie
    en:
      - Automatic signing in stops working, since it passes the sign-in screen over
      - A hardware console takes a separate command for sending that combination
      - Support that does not know that command sees a screen on which nothing happens
      - The remote desktop handles the combination itself and nothing changes on its side
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer loguje się automatycznie na konto, bo tego wymaga uruchamiana na nim aplikacja
    en:
      - The server signs in to an account automatically, since the application run on it takes that
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'DisableCAD'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'DisableCAD' -ErrorAction SilentlyContinue).'DisableCAD'
    [pscustomobject]@{
      path        = $path
      name        = 'DisableCAD'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableCAD' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-require-ctrl-alt-del

notes:
  pl: |
    Wartość zero znaczy „wymagaj kombinacji", a jedynka „nie wymagaj".
    Nazwa ustawienia jest przeczeniem, więc czytana pobieżnie prowadzi do
    wniosku odwrotnego — warto o tym pamiętać przy ręcznej weryfikacji.

    Wynik „MISSING" nie jest tu równoważny niezgodności, bo stan domyślny na
    serwerze wymaga tej kombinacji. Audyt mimo to nie uznaje braku wartości
    za spełnienie: zgodność ma wynikać z zapisu, nie z domysłu o wartości
    domyślnej, która w kolejnej wersji systemu może być inna.

    Punkt dotyczy wyłącznie logowania interaktywnego przy konsoli. Dostęp
    sieciowy — udziały, zarządzanie zdalne, usługi — nie przechodzi przez
    ten ekran i nie jest tym punktem objęty.
  en: |
    The value zero means "take the combination" and one means "do not take it". The
    setting's name is a negation, so read in passing it leads to the opposite conclusion -
    worth keeping in mind at a check by hand.

    A "MISSING" result is not here equivalent to non-compliance, since the default state on
    a server takes that combination. The audit all the same does not hold an absent value a
    meeting of the item: compliance is to follow from a record rather than from a guess
    about a default value which in the next version of the system may be another.

    The item concerns interactive signing in at the console alone. Network access - shares,
    remote management, services - does not pass through that screen and is not taken in by
    this item.
