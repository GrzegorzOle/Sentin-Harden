id: win2025-domain-secure-channel-signed-or-sealed

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera zawsze podpisany lub zaszyfrowany
    en: The secure channel to the controller always signed or encrypted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby ruch kanału bezpiecznego między tą maszyną
    a kontrolerem domeny był zawsze podpisany albo zaszyfrowany, bez
    możliwości zejścia do postaci jawnej.

    Kanał bezpieczny to połączenie, którym maszyna rozmawia z domeną
    o sprawach własnego członkostwa: o haśle swojego konta, o
    przynależności do grup, o przekazywaniu żądań uwierzytelnienia.
    Nie jest to kanał, którym idą dane użytkowników — idą nim dane
    o tożsamości maszyny, a więc materiał, z którego buduje się zaufanie
    do wszystkiego pozostałego.

    Bez tego wymagania maszyna godzi się rozmawiać jawnie, jeżeli druga
    strona tak zaproponuje. To właśnie jest miejsce ataku: nie na
    szyfrowanie, tylko na możliwość jego pominięcia. Kto stoi między
    maszyną a kontrolerem, ten podaje się za stronę niepotrafiącą
    lepiej i czyta albo zmienia ruch, który powinien być chroniony.

    Na serwerze waga jest większa niż na stanowisku roboczym z powodu
    liczby i rodzaju maszyn po drugiej stronie. Serwer członkowski
    prowadzi ten kanał stale, a kontroler domeny prowadzi go wobec
    innych kontrolerów i wobec domen zaufanych — czyli tam, gdzie
    podsłuchany albo zmieniony ruch rozchodzi się poza jedną maszynę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość wymuszenia rozmowy jawnej na kanale, którym idą dane
    o tożsamości maszyny i żądania uwierzytelnienia.
  en: |
    The setting requires that the traffic of the secure channel between this machine and a
    domain controller be always signed or encrypted, with no way down to a plain form.

    A secure channel is the connection a machine talks to the domain over about the matters of
    its own membership: its account's password, its standing in groups, the passing on of
    requests to authenticate. It is no channel users' data go over - what goes over it is data
    about the machine's identity, and so the material trust in all the rest is built from.

    Without this requirement the machine agrees to talk plainly where the other side so
    proposes. That is just the place of the attack: not on the encryption but on the chance of
    passing it by. Whoever stands between the machine and the controller gives themselves out
    for a side unable to do better and reads or changes traffic that ought to be guarded.

    On a server the weight is greater than at a working station by reason of the number and kind
    of machines on the other side. A member server keeps this channel steadily, and a domain
    controller keeps it towards other controllers and towards trusted domains - that is, where
    traffic listened to or changed spreads beyond one machine.

    What an attacker gains while the item goes unmet: the means of forcing a plain conversation
    on the channel that carries data about the machine's identity and requests to authenticate.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w tej domenie pozostały kontrolery albo
    domeny zaufane niepotrafiące podpisywać ani szyfrować kanału.

    W praktyce takich nie ma. Wymaganie to spełniają wszystkie systemy
    z ostatnich wielu lat, a nowsze wersje egzekwują je niezależnie od
    tego ustawienia. Na serwerze pracującym w domenie zbudowanej ze
    współczesnych systemów naprawa nie zmienia więc niczego.

    Sprawdzenie jest wymagane z powodu przypadków brzegowych, a nie
    z powodu prawdopodobieństwa. Przypadkiem takim jest relacja
    zaufania z domeną starszą, utrzymywaną po to, żeby jakaś aplikacja
    nadal działała. Tam, gdzie taka relacja istnieje, zmiana potrafi ją
    zerwać.

    Objaw byłby wtedy gwałtowny i szeroki: maszyna traci kanał
    bezpieczny, a to znaczy, że logowanie kontami domenowymi na niej
    przestaje działać, dostęp do zasobów domenowych zanika, a w
    dzienniku pojawiają się wpisy o niepowodzeniu nawiązania kanału.
    Nie jest to usterka drobna i dlatego punkt wymaga sprawdzenia mimo
    niskiego prawdopodobieństwa.

    Zmiana nie wymaga restartu maszyny. Wchodzi w życie przy następnym
    nawiązywaniu kanału.
  en: |
    What needs checking is whether any controllers or trusted domains unable to sign or encrypt
    the channel are left in this domain.

    In practice there are none. Every system of the last many years meets the requirement, and
    newer versions enforce it whatever this setting says. On a server working in a domain built
    of present-day systems the mending thus changes nothing.

    The check is asked for by reason of edge cases rather than of likelihood. Such a case is a
    trust relation with an older domain, kept up so that some application may go on working.
    Where such a relation stands, the change can break it.

    The symptom would then be abrupt and wide: the machine loses the secure channel, and that
    means logging in with domain accounts on it stops working, access to the domain's resources
    falls away, and entries about a failure to set up the channel appear in the log. It is no
    small fault, and hence the item takes a check despite the low likelihood.

    The change takes no restart of the machine. It comes into force at the next setting up of
    the channel.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - accounts-and-passwords
    - network-and-firewall
  what_breaks:
    pl:
      - Relacja zaufania z domeną starszą, niepotrafiącą podpisać kanału, zostanie zerwana
      - Po zerwaniu kanału logowanie kontami domenowymi na tej maszynie przestaje działać
      - W dzienniku pojawiają się wpisy o niepowodzeniu nawiązania kanału bezpiecznego
      - W domenie zbudowanej ze współczesnych systemów zmiana nie robi nic, bo wymaganie jest już spełnione
    en:
      - A trust relation with an older domain unable to sign the channel will be broken
      - After the channel breaks, logging in with domain accounts on this machine stops working
      - Entries about a failure to set up the secure channel appear in the log
      - In a domain built of present-day systems the change does nothing, the requirement being met already
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - W domenie utrzymywana jest relacja zaufania z domeną starszą ze względu na aplikację
      - Nie ustalono, jakie wersje systemu pracują na pozostałych kontrolerach domeny
    en:
      - A trust relation with an older domain is kept up in the domain for an application's sake
      - It has not been settled what versions of the system work on the remaining domain controllers
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'RequireSignOrSeal'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'RequireSignOrSeal'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RequireSignOrSeal' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-encrypt-or-sign-secure-channel-data-always

notes:
  pl: |
    Punkt jest najważniejszy z czwórki dotyczącej kanału bezpiecznego.
    Pozostałe trzy mówią, co robić, gdy druga strona potrafi; ten mówi,
    że rozmowa bez ochrony nie dochodzi do skutku w ogóle.

    Na kontrolerze domeny waży więcej niż na serwerze członkowskim, bo
    kanał prowadzony jest wtedy także wobec innych kontrolerów i wobec
    domen zaufanych.

    Nowsze wersje systemu egzekwują to wymaganie niezależnie od
    ustawienia. Punkt zapisuje więc zamiar i pozwala go zweryfikować,
    nawet gdy praktyczna różnica jest żadna.
  en: |
    The item is the weightiest of the four bearing on the secure channel. The other three say
    what to do where the other side can; this one says that a conversation without guard does
    not come about at all.

    On a domain controller it weighs more than on a member server, the channel being kept then
    towards other controllers and towards trusted domains as well.

    Newer versions of the system enforce this requirement whatever the setting says. The item
    thus records the intent and lets it be verified, even where the practical difference is
    none.
