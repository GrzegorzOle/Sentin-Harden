id: fedora44-time-sync-in-use

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.3.1
  section: Services > Configure Time Synchronization
  title:
    pl: Synchronizacja czasu jest używana
    en: Ensure time synchronization is in use
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Dokładny zegar jest potrzebny, żeby wpisy w dziennikach z różnych
    komputerów dało się ze sobą zestawić, a Kerberos, certyfikaty TLS i kody
    jednorazowe działały poprawnie. Zegar, który się spieszy albo spóźnia,
    utrudnia analizę incydentu i może blokować logowanie do domeny.

    Punkt wymaga, żeby czas synchronizował chrony. Fedora Workstation
    instaluje go i uruchamia usługę chronyd domyślnie.
  en: |
    An accurate clock is needed so that log entries from different computers
    can be matched, and so that Kerberos, TLS certificates and one-time codes
    work correctly. A clock that runs fast or slow makes incident analysis
    harder and can block sign-in to a domain.

    The item requires chrony to synchronize the time. Fedora Workstation
    installs it and runs the chronyd service by default.

disruption_description:
  pl: |
    Nikt tego nie zauważy, jeśli chronyd już działał. W przeciwnym razie
    naprawa instaluje chrony, jeśli go brakuje, a systemd-timesyncd
    i ntpd z NTPsec, jeśli działały, zastępuje usługą chronyd. Chronyd pyta
    wtedy serwery z puli Fedory, chyba że konfiguracja wskazuje inne.
  en: |
    Nobody will notice if chronyd was already running. Otherwise the
    remediation installs chrony if it is missing and replaces
    systemd-timesyncd and ntpd from NTPsec, if they were running, with the
    chronyd service. chronyd then queries the servers of the Fedora pool
    unless the configuration names other ones.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - logging-and-audit
  what_breaks:
    pl:
      - Usługi systemd-timesyncd i ntpd zostają zatrzymane i wyłączone, a czas synchronizuje chronyd
      - Komputer wysyła zapytania NTP do serwerów z pliku /etc/chrony.conf, domyślnie do puli 2.fedora.pool.ntp.org
    en:
      - The systemd-timesyncd and ntpd services are stopped and disabled, and chronyd synchronizes the time
      - The computer sends NTP queries to the servers in /etc/chrony.conf, by default to the 2.fedora.pool.ntp.org pool
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Czas synchronizuje świadomie inna usługa, np. systemd-timesyncd, a organizacja przyjęła to jako odstępstwo od CIS
    en:
      - Another service, such as systemd-timesyncd, synchronizes the time on purpose, and the organization accepted this as a deviation from CIS
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || ! command -v rpm >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then
      echo CHECK_ERROR; exit 0
    fi
    if ! rpm -q --quiet chrony; then echo NOT_INSTALLED; exit 0; fi
    e=$(systemctl is-enabled chronyd.service 2>/dev/null) || true
    a=$(systemctl is-active chronyd.service 2>/dev/null) || true
    if [ "$e" = enabled ] && [ "$a" = active ]; then echo ENABLED_ACTIVE
    else echo "NOT_RUNNING:${e:-none}/${a:-unknown}"; fi
  expected: '^ENABLED_ACTIVE$'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=svc-on-1
        if rpm -q --quiet chrony; then echo installed=1; else echo installed=0; fi
        for u in chronyd.service systemd-timesyncd.service ntpd.service; do
          e=$(systemctl is-enabled "$u" 2>/dev/null) || true
          a=$(systemctl is-active "$u" 2>/dev/null) || true
          echo "$u ${e:--} ${a:--}"
        done
        find /etc/systemd/system /run/systemd/system -type l \( -name chronyd.service -o -lname '*/chronyd.service' \) \
          -printf 'link %p %l\n' 2>/dev/null | sort
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      if ! rpm -q --quiet chrony; then dnf -y -q install chrony; echo "Installed chrony"; fi
      for u in systemd-timesyncd.service ntpd.service; do
        e=$(systemctl is-enabled "$u" 2>/dev/null) || true
        a=$(systemctl is-active "$u" 2>/dev/null) || true
        case "$e" in enabled|enabled-runtime) systemctl disable -q "$u"; echo "Disabled $u" ;; esac
        case "$a" in active|activating|reloading) systemctl stop "$u"; echo "Stopped $u" ;; esac
      done
      e=$(systemctl is-enabled chronyd.service 2>/dev/null) || true
      case "$e" in
        masked) systemctl unmask -q chronyd.service ;;
        masked-runtime) systemctl unmask -q --runtime chronyd.service ;;
      esac
      systemctl enable -q --now chronyd.service
      e=$(systemctl is-enabled chronyd.service 2>/dev/null) || true
      a=$(systemctl is-active chronyd.service 2>/dev/null) || true
      if [ "$e" != enabled ] || [ "$a" != active ]; then
        echo "chronyd.service is still not running ($e/$a)" >&2; exit 1
      fi
      echo "Enabled and started chronyd.service"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=svc-on-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      inst=$(sed -n '2s/^installed=//p' "$b")
      case "$inst" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      lines=$(tail -n +3 "$b" | grep -v '^link ') || true
      links=$(grep '^link ' "$b") || true
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "chronyd.service systemd-timesyncd.service ntpd.service " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r u e a x; do
        case "$e$a" in *[!a-z-]*|"") echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        if [ -z "$a" ] || [ -n "$x" ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
      done <<< "$lines"
      if [ -n "$links" ]; then
        while read -r k p t x; do
          bad=0
          if [ -z "$t" ] || [ -n "$x" ]; then bad=1; fi
          case "$p" in /etc/systemd/system/*|/run/systemd/system/*) ;; *) bad=1 ;; esac
          case "$p$t" in *..*) bad=1 ;; esac
          if [ "${p##*/}" != chronyd.service ] && [ "${t##*/}" != chronyd.service ]; then bad=1; fi
          if [ "$bad" = 1 ]; then echo "Backup file is damaged: $b" >&2; exit 1; fi
        done <<< "$links"
      fi
      read -r u e a <<< "$(printf '%s\n' "$lines" | head -n 1)"
      # The unit links in /etc and /run are restored as they were, which also
      # brings back the enabled state hidden under a mask.
      if [ "$inst" = 1 ] && rpm -q --quiet chrony; then
        case "$a" in active|activating|reloading) ;; *) systemctl stop chronyd.service ;; esac
        find /etc/systemd/system /run/systemd/system -type l \( -name chronyd.service -o -lname '*/chronyd.service' \) -delete 2>/dev/null || true
        if [ -n "$links" ]; then
          while read -r k p t; do
            mkdir -p "$(dirname "$p")"
            ln -s "$t" "$p"
            if command -v restorecon >/dev/null 2>&1; then restorecon "$p"; fi
          done <<< "$links"
        fi
        systemctl daemon-reload
      fi
      if [ "$inst" = 0 ] && rpm -q --quiet chrony; then
        systemctl stop chronyd.service; dnf -y -q remove --no-autoremove chrony; echo "Removed chrony again"
      fi
      start=""
      while read -r u e a; do
        [ "$u" = chronyd.service ] && continue
        case "$e" in
          enabled) systemctl enable -q "$u" ;;
          enabled-runtime) systemctl enable -q --runtime "$u" ;;
        esac
        case "$a" in active|activating|reloading) start="$start $u" ;; esac
      done <<< "$lines"
      if [ -n "$start" ]; then systemctl start $start; fi
      echo "Restored the previous state of chronyd.service"
    )

privileges: root
runnable: true

sources:
  - https://packages.fedoraproject.org/pkgs/chrony/chrony/
  - https://chrony-project.org/doc/latest/chronyd.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html

notes:
  pl: |
    CIS sprawdza tylko, czy pakiet chrony jest zainstalowany. Reguła
    wymaga też, żeby usługa chronyd była włączona i działała, bo dopiero
    wtedy czas jest synchronizowany. Wynik NOT_RUNNING podaje stan
    włączenia i działania usługi.

    Naprawa instaluje chrony, jeśli go brakuje, co wymaga dostępu do
    repozytoriów. Zatrzymuje i wyłącza systemd-timesyncd oraz ntpd, bo
    chronyd.service nie działa razem z nimi, a potem włącza i uruchamia
    chronyd, zdejmując wcześniej maskowanie. Kopia zapisuje, czy chrony był
    zainstalowany, stan włączenia i działania tych trzech usług oraz
    dowiązania chronyd.service w /etc/systemd/system i /run/systemd/system.
    Wycofanie odtwarza te dowiązania, więc wraca także stan włączenia ukryty
    pod maskowaniem, przywraca stan pozostałych usług, a chrony
    zainstalowany przez naprawę usuwa.
  en: |
    CIS only checks whether the chrony package is installed. The rule also
    requires the chronyd service to be enabled and running, because only
    then is the time synchronized. The NOT_RUNNING result gives the enabled
    and running state of the service.

    The remediation installs chrony if it is missing, which needs access to
    the repositories. It stops and disables systemd-timesyncd and ntpd,
    because chronyd.service does not run together with them, and then
    unmasks, enables and starts chronyd. The backup records whether chrony
    was installed, the enabled and running state of these three services
    and the chronyd.service links in /etc/systemd/system and
    /run/systemd/system. Rollback recreates these links, which also brings
    back the enabled state hidden under a mask, restores the state of the
    other services and removes chrony if the remediation installed it.
