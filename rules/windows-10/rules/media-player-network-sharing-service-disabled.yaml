id: win10-media-player-network-sharing-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa udostępniania biblioteki multimediów w sieci wyłączona
    en: The service serving out the store of media upon the network switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę udostępniającą bibliotekę multimediów tej
    maszyny innym urządzeniom w sieci.

    Mechanizm służy odtwarzaniu muzyki i filmów z maszyny na telewizorze
    albo odtwarzaczu sieciowym. Usługa ogłasza obecność biblioteki
    w sieci lokalnej i odpowiada na zapytania o jej zawartość.

    Zagrożenie jest niewielkie i punkt jest oceniony odpowiednio nisko.
    Znaczenie ma to, że usługa ogłasza się sama i wymienia z siecią
    informacje o zawartości, czyli o nazwach plików w bibliotece
    użytkownika.

    Drugim zastrzeżeniem jest port otwarty bez potrzeby. Na stanowisku
    roboczym nikt nie odtwarza biblioteki z maszyny na telewizorze,
    a usługa i tak nasłuchuje i odpowiada.

    Odnotowuję, że mechanizm ten należy do odtwarzacza wycofywanego
    z systemu. Jego obecność na stanowisku jest zwykle pozostałością,
    a nie decyzją.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wykaz
    nazw z biblioteki multimediów i kolejną usługę nasłuchującą w sieci.
  en: |
    The setting switches off the service serving out this machine's store of media to other devices upon the
    network.

    The mechanism serves for the playing of music and of films off the machine upon a television or a player of
    the network. The service puts out word of the store's being there in the local network and answers askings
    upon its content.

    The danger is small and the item is graded low to match. What has weight is that the service puts itself out
    and trades with the network word of its content, which is to say of the names of files in the user's store.

    The second reservation is a port open without need. Upon a working station nobody plays a store off the
    machine upon a television, and the service listens and answers all the same.

    I set down that the mechanism belongs to a player being drawn back from the system. Its standing upon a
    station is commonly a leaving and no decision.

    What an attacker gains while the item goes unmet: a roll of names out of the store of media and one more
    service listening upon the network.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś odtwarza z tej maszyny na urządzeniu sieciowym.

    Miejscem wartym uwagi są stanowiska w salach konferencyjnych
    i pokazowych, gdzie materiał odtwarza się z maszyny na telewizorze
    albo rzutniku sieciowym. Po zmianie urządzenie przestanie widzieć
    bibliotekę.

    Odnotowuję, że odtwarzanie przez podłączenie przewodem obrazu działa
    dalej i jest w tych zastosowaniach częstsze. Traci się drogę
    sieciową, nie samo odtwarzanie.

    Miejscem drugim są stanowiska domowe, jeżeli maszyna służy też do
    odtwarzania na telewizorze w tym samym mieszkaniu.

    Skutek jest widoczny dla użytkownika i pojawia się natychmiast.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: odtwarzania multimediów na samej maszynie,
    odtwarzania przez przewód obrazu, dostępu do udziałów, logowania,
    drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody plays off this machine upon a
    device of the network.

    The place worth notice is stations in rooms of meeting and of showing, where matter is played off the machine
    upon a television or a caster of the network. After the change the device will cease to see the store.

    I set down that the playing through a wire for the picture works on and is in those uses the commoner. What is
    lost is the road through the network and not the playing itself.

    The second place is stations at home, if the machine serves also for the playing upon a television in that
    same dwelling.

    The consequence is plain to the user and shows at once.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the playing of media upon the machine itself, the playing through a wire for the
    picture, the reach of shares, logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - file-sharing
  what_breaks:
    pl:
      - Telewizor albo rzutnik sieciowy w sali konferencyjnej przestanie widzieć bibliotekę multimediów tej maszyny
      - Odtwarzanie przez podłączenie przewodem obrazu działa dalej i w tych zastosowaniach jest częstsze
      - Na stanowisku domowym odtwarzanie na telewizorze w tym samym mieszkaniu przestanie być możliwe tą drogą
      - Odtwarzanie multimediów na samej maszynie pozostaje nietknięte
      - Dostęp do udziałów, logowanie, praca programów, internet i drukowanie pozostają bez zmian
    en:
      - A television or a caster of the network in a room of meeting will cease to see this machine s store of media
      - The playing through a wire for the picture works on and is in those uses the commoner
      - Upon a station at home the playing upon a television in that same dwelling will cease to be had by that road
      - The playing of media upon the machine itself stays untouched
      - The reach of shares, logging on, the work of programs, the internet and printing stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko w sali pokazowej odtwarza materiał na rzutniku sieciowym i nie ma podłączenia przewodem obrazu
    en:
      - A station in a room of showing plays matter upon a caster of the network and has no wire for the picture
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\WMPNetworkSvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'WMPNetworkSvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'WMPNetworkSvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'WMPNetworkSvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wmp/windows-media-player-sdk

notes:
  pl: |
    Reguła jest najniżej oceniona w tym bloku i tak trzeba ją
    przedstawiać. Nie broni przed niczym konkretnym. Zdejmuje usługę,
    która ogłasza się w sieci i odpowiada na zapytania, a na stanowisku
    roboczym nie ma zastosowania.

    Argument wart zachowania dotyczy tego, co usługa ogłasza. Odpowiedź
    na zapytanie o zawartość biblioteki jest wykazem nazw plików
    użytkownika. Nie jest to wielka strata, ale jest to informacja
    wychodząca z maszyny bez czyjejkolwiek decyzji.

    Odnotowuję, że mechanizm należy do odtwarzacza wycofywanego z systemu.
    Warto to powiedzieć, bo obniża koszt punktu: obecność tej usługi jest
    zwykle pozostałością po starszej instalacji, a nie sposobem pracy.
  en: |
    The rule is the lowest graded in this block and is to be put forward as such. It guards against nothing in
    particular. It takes away a service that puts itself out upon the network and answers askings, and that upon a
    working station has no use.

    The argument worth keeping touches what the service puts out. The answer to an asking upon the store's content
    is a roll of the names of the user's files. It is no great loss, but it is word going out of the machine with
    nobody's decision.

    I set down that the mechanism belongs to a player being drawn back from the system. It is worth saying, that
    lowering the item's cost: the standing of this service is commonly a leaving of an older laying on and no
    manner of work.
