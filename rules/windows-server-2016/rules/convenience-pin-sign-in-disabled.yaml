id: win2016-convenience-pin-sign-in-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Logowanie kodem liczbowym do konta domenowego wyłączone
    en: Signing in to a domain account by a numeric code switched off
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza możliwość logowania się na konto domenowe krótkim
    kodem liczbowym zamiast hasłem.

    Rozróżnienie, które trzeba tu zrobić, jest kluczowe i bywa mylone.
    Istnieje mechanizm logowania kodem, w którym kod odblokowuje klucz
    zapisany w układzie zabezpieczającym maszyny; taki kod nie jest hasłem
    i nie da się go użyć nigdzie indziej. Ten punkt nie o nim mówi.

    Ten punkt dotyczy starszego mechanizmu wygody, w którym kod liczbowy
    zastępuje hasło przy logowaniu, a hasło zostaje zapisane w systemie,
    żeby dało się je podstawić po podaniu kodu. Mechanizm ten sprowadza
    siłę uwierzytelnienia do czterech cyfr — i przechowuje przy tym
    poświadczenie konta domenowego na maszynie.

    Oba skutki są poważne. Czterocyfrowy kod da się odgadnąć w kilku
    tysiącach prób, a konto domenowe otwiera nie tę maszynę, tylko zasoby
    domeny. Zapisane poświadczenie jest zaś drugim miejscem, w którym
    hasło konta domenowego leży poza kontrolerem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto
    domenowe chronione czterema cyframi zamiast hasłem oraz poświadczenie
    tego konta przechowywane na maszynie.
  en: |
    The setting switches off the possibility of signing in to a domain account by a
    short numeric code instead of a password.

    The distinction to be made here is crucial and is at times confused. There is a
    mechanism of signing in by a code where the code unlocks a key written into the
    machine's security chip; such a code is no password and cannot be used anywhere
    else. This item does not speak of that.

    This item concerns an older convenience mechanism in which a numeric code takes a
    password's place at signing in, and the password is kept in the system so that it
    can be supplied once the code is given. That mechanism brings the strength of
    authentication down to four digits - and keeps a domain account's credential on the
    machine along the way.

    Both consequences are grave. A four-digit code can be guessed in a few thousand
    attempts, and a domain account opens not this machine but the domain's resources.
    A kept credential is besides a second place where a domain account's password lies
    outside the controller.

    What an attacker gains while the item goes unmet: a domain account guarded by four
    digits instead of a password, and that account's credential kept on the machine.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Mechanizm ten nie jest na serwerze używany. Powstał dla stanowisk
    dotykowych i urządzeń przenośnych, a na maszynie obsługiwanej z konsoli
    albo przez sesję zdalną nie ma zastosowania.

    Wdrożenie nie usuwa istniejących kodów — wyłącza możliwość logowania
    się nimi. Gdyby na maszynie taki kod był ustawiony, użytkownik zobaczy
    przy logowaniu pole na hasło zamiast pola na kod. Hasło działa tak jak
    dotąd.

    Nie wiąże się z tym restart ani zatrzymanie usługi.

    Czego to nie psuje: logowania hasłem, logowania kartą, sesji zdalnych,
    usług, sieci. Nie ma znanych regresji.
  en: |
    The class is "no disruption".

    That mechanism is not used on a server. It came about for touch positions and
    portable devices, and on a machine attended at the console or through a remote
    session it has no use.

    The rollout does not remove existing codes - it switches off the possibility of
    signing in with them. Were such a code set on the machine, the user will see at
    signing in a field for a password instead of a field for a code. The password works
    as before.

    No restart or stopping of a service goes with it.

    What this does not break: signing in by password, signing in by card, remote
    sessions, services, or the network. There are no known regressions.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Użytkownik, który miał ustawiony kod liczbowy, zobaczy przy logowaniu pole na hasło zamiast pola na kod
      - Istniejące kody nie są usuwane - wyłączona zostaje tylko możliwość logowania się nimi
      - Zmiana obowiązuje od razu, bez restartu maszyny i bez zatrzymywania jakiejkolwiek usługi
      - Logowanie hasłem, logowanie kartą i sesje zdalne pozostają bez zmian
    en:
      - A user who had a numeric code set will see at signing in a field for a password instead of a field for a code
      - Existing codes are not removed - only the possibility of signing in with them is switched off
      - The change holds at once, with no restart of the machine and no stopping of any service
      - Signing in by password, signing in by card and remote sessions stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna jest obsługiwana z ekranu dotykowego bez klawiatury i kod liczbowy jest jedyną praktyczną drogą logowania
    en:
      - The machine is attended from a touch screen without a keyboard and a numeric code is the one practical road of signing in
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'AllowDomainPINLogon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'AllowDomainPINLogon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The entry is named after the permission, so the wanted state is written
    # with a zero.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowDomainPINLogon' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/identity-protection/hello-for-business/

notes:
  pl: |
    Punkt otwiera drugą część bloku, dotyczącą nie tego, kto się
    przedstawia, tylko czym. Trzy poprzednie reguły pytały o pochodzenie
    tożsamości; ta i następna pytają o siłę sposobu.

    Rozróżnienie między kodem odblokowującym klucz a kodem zastępującym
    hasło jest tu najważniejszą rzeczą do przekazania. Bez niego reguła
    wygląda na zakaz nowoczesnego uwierzytelniania, a jest zakazem starego
    skrótu. Warto to powiedzieć w opisie, bo pomylenie tych dwóch rzeczy
    prowadzi do odpuszczenia punktu z niewłaściwego powodu.

    Kategoria wysoka przy klasie bez uciążliwości stawia punkt w polu
    szybkich wygranych. Na serwerze koszt jest zerowy, a przedmiotem jest
    poświadczenie konta domenowego.
  en: |
    The item opens the block's second part, concerning not who presents themselves but
    by what. The three rules before it asked about an identity's origin; this one and
    the next ask about a means's strength.

    The distinction between a code unlocking a key and a code taking a password's place
    is the most important thing to convey here. Without it the rule looks like a ban on
    modern authentication, and it is a ban on an old shortcut. That is worth saying in
    the description, confusing the two leading to the item being let go for the wrong
    reason.

    A high category with the class no disruption puts the item in the field of quick
    wins. On a server the cost is nil and the subject is a domain account's credential.
