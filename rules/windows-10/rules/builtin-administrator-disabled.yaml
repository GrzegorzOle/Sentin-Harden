id: win10-builtin-administrator-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora wyłączone
    en: The built-in administrator account switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wbudowane konto administratora — to o identyfikatorze
    kończącym się na 500.

    Konto to ma trzy własności, które razem czynią je celem pierwszym.
    Istnieje na każdej maszynie z tym systemem, ma identyfikator znany z góry
    i nie zmienia go zmiana nazwy, a do tego należy do administratorów
    od chwili instalacji.

    Znaczy to, że napastnik zgadujący hasła nie musi niczego ustalać. Nie
    potrzebuje nazwy konta, nie potrzebuje wiedzieć, kto na maszynie pracuje,
    i nie musi trafić na konto o uprawnieniach — wie z góry, że to jedno
    istnieje i że uprawnienia ma.

    Wyłączenie konta odbiera mu ten punkt zaczepienia. Zgadywanie trzeba wtedy
    zacząć od ustalenia, jakie konta istnieją, a to jest czynność znacznie
    trudniejsza i zostawiająca ślad.

    Reguła nie ma przy tym znaczyć, że maszyna zostaje bez administratora.
    Znaczy, że administrator ma konto własne, o nazwie nieznanej z góry
    i o haśle, które można zmienić bez naruszania czegokolwiek innego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto
    o uprawnieniach administratora, o którego istnieniu wie przed
    rozpoczęciem, bez potrzeby ustalania czegokolwiek o maszynie.
  en: |
    The setting switches off the built-in administrator account - the one whose identifier ends in 500.

    The account has three properties which together make it the first target. It exists on every machine with
    this system, it has an identifier known beforehand which renaming does not change, and besides that it
    belongs to the administrators from the moment of installation.

    That means an attacker guessing passwords has nothing to establish. They need no account name, need not know
    who works on the machine, and need not light on an account holding rights - they know beforehand that this
    one exists and that it holds them.

    Switching the account off takes that foothold from them. Guessing has then to begin with establishing what
    accounts exist, and that is a far harder act and one leaving a trace.

    The rule is not at the same time to mean that the machine is left without an administrator. It means the
    administrator has an account of their own, of a name not known beforehand and with a password that can be
    changed without disturbing anything else.

    What an attacker gains while the item goes unmet: an account with an administrator's rights whose existence
    they know before beginning, with no need of establishing anything about the machine.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzenie sprowadza się do jednego
    pytania: czym zostanie naprawiona ta maszyna, gdy zabraknie innej drogi.

    Konto wbudowane jest kontem ostatniej szansy. Działa w trybie awaryjnym,
    nie wymaga połączenia z domeną i nie podlega zasadom, które mogłyby
    odciąć konta pozostałe. Wyłączenie go bez przygotowania konta zastępczego
    o tych samych własnościach zamienia drobną awarię w instalację systemu
    od nowa.

    Polecenie naprawcze sprawdza to za użytkownika. Przed wyłączeniem czyta
    grupę administratorów i odmawia wykonania, gdy konto wbudowane jest w niej
    jedyne. Jest to jedyna reguła w tym bloku, która może odmówić.

    Sprawdzenia wymagają ponadto rzeczy, które tym kontem się logują: zadania
    w harmonogramie, usługi skonfigurowane ręcznie, połączenia między
    maszynami. Każda z nich przestanie działać w chwili wyłączenia, bez
    ostrzeżenia i z komunikatem o odmowie dostępu.

    Czego to nie psuje: pozostałych kont administracyjnych, kont zwykłych,
    logowania domenowego, usług systemowych, sieci, aplikacji.
  en: |
    The class is "needs review", and the review comes to a single question: with what will this machine be
    mended when no other road is left.

    The built-in account is the account of last resort. It works in safe mode, calls for no connection to the
    domain and is not bound by policies that might cut the remaining accounts off. Switching it off without
    having prepared a standby account of the same properties turns a small fault into a fresh installation of
    the system.

    The remedy command reviews that for the user. Before switching off it reads the group of administrators and
    refuses to run where the built-in account is the only one in it. It is the one rule in this block that may
    refuse.

    Beyond that, review is called for by the things that log in by that account: scheduled tasks, services set
    up by hand, connections between machines. Each of them will cease working the moment it is switched off,
    without warning and with a message of access denied.

    What this does not break: the remaining administrative accounts, ordinary accounts, domain logon, system
    services, the network, or applications.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Zadanie w harmonogramie logujące się kontem wbudowanym przestaje działać z komunikatem o odmowie dostępu
      - Usługa skonfigurowana ręcznie na to konto przestaje wstawać po restarcie maszyny
      - Droga naprawy przez tryb awaryjny znika, o ile nie przygotowano konta zastępczego o tych samych własnościach
      - Polecenie naprawcze odmawia wykonania, gdy konto wbudowane jest jedynym administratorem na maszynie
      - Pozostałe konta administracyjne, konta zwykłe, logowanie domenowe oraz usługi systemowe pozostają bez zmian
    en:
      - A scheduled task logging in by the built-in account ceases working with a message of access denied
      - A service set up by hand under that account ceases coming up after a restart of the machine
      - The road of mending by safe mode goes, unless a standby account of the same properties has been prepared
      - The remedy command refuses to run where the built-in account is the only administrator on the machine
      - The remaining administrative accounts, ordinary accounts, domain logon and system services stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Konto wbudowane jest jedyną drogą naprawy tej maszyny i nie przygotowano konta zastępczego
      - Kontem wbudowanym logują się zadania lub usługi, których nie da się na razie przepisać na konto inne
    en:
      - The built-in account is the only road of mending this machine and no standby account has been prepared
      - Tasks or services log in by the built-in account and cannot for now be moved to another
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $admin = Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-500' }
      if ($null -eq $admin) { 'NOT_APPLICABLE' }
      elseif ($admin.Enabled) { 'ENABLED' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DISABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $admin = Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }
    [pscustomobject]@{
      sid     = (($admin.SID.Value) -join '')
      name    = (($admin.Name) -join '')
      enabled = [bool]($admin.Enabled)
      found   = ($null -ne $admin)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Before switching it off, the group of administrators is read. Where the
    # built-in account is the only one in it, the change refuses to run - it would
    # otherwise leave the machine without any road to administer it.
    $others = @(
      Get-LocalGroupMember -SID 'S-1-5-32-544' -ErrorAction Stop |
        Where-Object { $_.SID.Value -notlike '*-500' }
    )
    if ($others.Count -eq 0) {
      throw 'No other administrator account on this machine - refusing to disable the only one.'
    }
    $admin = Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }
    Disable-LocalUser -SID $admin.SID

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.found) { throw 'Backup holds no built-in administrator account - nothing to restore.' }
    if ($b.enabled) { Enable-LocalUser -SID $b.sid } else { Disable-LocalUser -SID $b.sid }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-administrator-account-status

notes:
  pl: |
    Reguła jest jedną z niewielu w całej paczce, w których polecenie
    naprawcze może odmówić wykonania, i warto, żeby aplikacja to pokazała.
    Odmowa nie jest błędem — jest wynikiem sprawdzenia, którego użytkownik
    mógłby nie zrobić sam.

    Warto pokazać ją razem z regułą o trybie zatwierdzania dla konta
    wbudowanego. Tamta przyjmuje, że konto działa, i obejmuje je kontrolą;
    ta wyłącza je całkiem. Obie są poprawne i wykluczają się tylko pozornie —
    tam, gdzie konta wyłączyć nie wolno, tamta reguła jest jedyną dostępną
    odpowiedzią i warto, żeby aplikacja to powiedziała.

    Odnotowuję, że reguła nie zmniejsza liczby administratorów na maszynie.
    Zmienia to, czy jeden z nich ma nazwę i identyfikator znane z góry.
  en: |
    The rule is one of the few in the whole pack in which the remedy command may refuse to run, and it is well
    that the application show that. A refusal is no error - it is the outcome of a check the user might not have
    made themselves.

    It is worth showing together with the rule about approval mode for the built-in account. That one takes it
    that the account works and brings it under the control; this one switches it off altogether. Both are right
    and they exclude one another only in appearance - where the account may not be switched off, that rule is
    the one answer to be had, and it is well that the application say so.

    Worth noting that the rule does not lessen the number of administrators on the machine. It changes whether
    one of them has a name and an identifier known beforehand.
