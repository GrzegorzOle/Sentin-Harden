id: fedora44-coredump-backtraces-disabled

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.5.3
  section: Initial Setup > Configure Additional Process Hardening
  title:
    pl: Przetwarzanie zrzutów pamięci po awarii programu jest wyłączone
    en: Ensure core dump backtraces are disabled
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy program kończy się awarią, jądro przekazuje obraz jego pamięci do
    systemd-coredump. Ten go analizuje, zapisuje ślad stosu w dzienniku
    systemowym i, zależnie od ustawień, przechowuje cały zrzut na dysku. Obraz
    pamięci może zawierać hasła, klucze sesji i treść dokumentów, które program
    miał otwarte w chwili awarii.

    Parametr ProcessSizeMax w [Coredump] określa, do jakiego rozmiaru zrzuty są
    w ogóle przetwarzane. Punkt wymaga wartości 0, przy której systemd-coredump
    odrzuca każdy zrzut: nie powstaje ani ślad stosu, ani plik. Domyślnie
    Fedora przetwarza zrzuty do kilku gigabajtów.
  en: |
    When a program crashes, the kernel hands an image of its memory to
    systemd-coredump. It analyses the image, writes a stack trace to the system
    journal and, depending on the settings, keeps the whole dump on disk. The
    memory image may hold passwords, session keys and the content of documents
    the program had open at the moment of the crash.

    The ProcessSizeMax setting in [Coredump] sets up to which size dumps are
    processed at all. The item requires value 0, at which systemd-coredump
    drops every dump: neither a stack trace nor a file is produced. By default
    Fedora processes dumps up to several gigabytes.

disruption_description:
  pl: |
    Klasa wymaga przeglądu, bo zmiana odbiera materiał do diagnozy awarii.
    Zwykły użytkownik tego nie zauważy, ale okno zgłaszania problemów w GNOME
    (ABRT) przestaje pokazywać awarie programów, a programista nie odczyta
    zrzutu przez coredumpctl. Zmiana działa od następnej awarii, bez restartu.
  en: |
    The class needs review because the change removes material for crash
    diagnosis. A regular user will not notice, but the GNOME problem reporting
    window (ABRT) stops showing program crashes, and a developer cannot read a
    dump with coredumpctl. The change takes effect from the next crash, without
    a restart.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - ABRT i okno zgłaszania problemów w GNOME nie wykrywają awarii programów, więc nie da się ich zgłosić do Fedory ani producenta
      - Polecenia coredumpctl list, info i debug nie pokazują nowych awarii, a dziennik systemowy nie zawiera śladu stosu programu, który się zakończył
    en:
      - ABRT and the GNOME problem reporting window do not detect program crashes, so they cannot be reported to Fedora or the vendor
      - The coredumpctl list, info and debug commands show no new crashes, and the system journal holds no stack trace of the program that ended
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Stacja programisty lub testera, który diagnozuje awarie własnych programów na podstawie zrzutów pamięci
    en:
      - A developer or tester workstation where crashes of one's own programs are diagnosed from memory dumps
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! systemd-analyze cat-config systemd/coredump.conf >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    c=$(systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | awk -v s="[Coredump]" -v k="ProcessSizeMax" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
    if printf '%s\n' "$c" | grep -qxE '0'; then echo "OK:$c"; else echo "NOT_OK:${c:-default}"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        if [ -e "$f" ]; then echo existed=1; else echo existed=0; fi
        echo ---
        if [ -e "$f" ]; then cat "$f"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      mkdir -p /etc/systemd/coredump.conf.d
      printf '%s\n' '# Sentin-Harden: fedora44-coredump-backtraces-disabled' '[Coredump]' 'ProcessSizeMax=0' > "$f"
      chmod 0644 "$f"
      if command -v restorecon >/dev/null 2>&1; then restorecon "$f"; fi
      c=$(systemd-analyze cat-config systemd/coredump.conf 2>/dev/null | awk -v s="[Coredump]" -v k="ProcessSizeMax" '
      /^[ \t]*[#;]/ { next }
      { t = $0; gsub(/^[ \t]+|[ \t]+$/, "", t) }
      t ~ /^\[/ { in_s = (t == s); next }
      in_s && index(t, "=") {
        i = index(t, "="); n = substr(t, 1, i - 1); v = substr(t, i + 1)
        gsub(/[ \t]+$/, "", n); gsub(/^[ \t]+/, "", v)
        if (n == k) c = v }
      END { print c }')
      if [ "$c" != "0" ]; then
        echo "Another drop-in sets ProcessSizeMax after $f; the effective value is ${c:-default}" >&2; exit 1
      fi
      echo "Set ProcessSizeMax=0 in $f"
    )

  rollback_command: |
    (
      set -e
      f=/etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      existed=$(sed -n 's/^existed=//p' "$b" | head -n 1)
      case "$existed" in
        1) sed '1,/^---$/d' "$b" > "$f" ;;
        0) rm -f "$f" ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      echo "Restored the previous state of $f"
    )

privileges: root
runnable: true

sources:
  - https://www.freedesktop.org/software/systemd/man/latest/coredump.conf.html
  - https://www.freedesktop.org/software/systemd/man/latest/coredumpctl.html
  - https://abrt.readthedocs.io/en/latest/

notes:
  pl: |
    Sprawdzenie odczytuje wartość, którą widzi systemd-coredump, z polecenia
    systemd-analyze cat-config systemd/coredump.conf. Wypisuje ono plik główny
    i pliki z katalogów coredump.conf.d w kolejności stosowania, więc liczy się
    ostatnie przypisanie w sekcji [Coredump]. Brak wpisu oznacza wartość
    domyślną i nie spełnia punktu.

    Naprawa zapisuje ustawienie w
    /etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf i
    kończy się błędem, jeśli inny plik je nadpisuje. systemd-coredump czyta
    konfigurację przy każdej awarii, więc nie trzeba niczego restartować.
    Wycofanie przywraca poprzedni stan pliku.

    Ustawienie działa tylko wtedy, gdy parametr jądra kernel.core_pattern
    przekazuje zrzuty do systemd-coredump, co jest domyślne na Fedorze.
  en: |
    The check reads the value systemd-coredump sees from the systemd-analyze
    cat-config systemd/coredump.conf command. It prints the main file and the
    files from the coredump.conf.d directories in the order they are applied,
    so the last assignment in the [Coredump] section counts. No entry means the
    default value and does not meet the item.

    The remediation writes the setting to
    /etc/systemd/coredump.conf.d/sentin-harden-coredump-backtraces.conf and ends
    with an error if another file overrides it. systemd-coredump reads its
    configuration on every crash, so nothing has to be restarted. Rollback
    restores the previous state of the file.

    The setting only works when the kernel.core_pattern kernel parameter hands
    dumps to systemd-coredump, which is the Fedora default.
