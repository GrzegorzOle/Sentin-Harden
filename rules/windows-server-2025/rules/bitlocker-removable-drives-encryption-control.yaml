id: win2025-bitlocker-removable-drives-encryption-control

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zakładanie ochrony nośnika wymiennego dozwolone, zdejmowanie zabronione
    en: Setting up protection of removable media allowed, removing it forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt pozwala zakładać ochronę na nośniku wymiennym i jednocześnie
    zabrania jej zdejmowania. Trzy wartości: sama polityka, zgoda na
    założenie i zakaz zdjęcia — każdy inny układ audyt raportuje osobno.

    Zostawiam kategorię średnią i chcę powiedzieć, na czym polega
    asymetria, bo to ona jest tutaj treścią. Założenie ochrony jest
    decyzją. Zdjęcie ochrony jest cofnięciem cudzej decyzji, zwykle
    podjętej wcześniej i w innym celu. Te dwie czynności wyglądają na
    parę, a nie są nią wcale.

    Ta grupa reguł zaczyna nowy rozdział całej paczki BitLockera. Dyski
    stałe zostają w maszynie i chronimy je na wypadek, gdyby maszyna
    wyszła z serwerowni. Nośnik wymienny wychodzi z założenia — po to
    istnieje. Reguły tej grupy są jedyną częścią BitLockera, która
    działa wtedy, gdy dane są już poza budynkiem.

    Na serwerze nośnik wymienny nie jest pamięcią przenośną pracownika.
    To jest dysk z kopiami zapasowymi, nośnik kurierski, dysk inżyniera
    dostawcy podłączany na czas diagnostyki i nośnik z materiałem
    przekazywanym na zewnątrz. Każdy z nich opuszcza pomieszczenie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: nośnik,
    z którego ochronę zdjęto poza jakąkolwiek procedurą, bo tak było
    wygodniej przy przekazaniu — i który od tej pory jest zwykłym dyskiem
    z danymi produkcyjnymi.
  en: |
    The item permits protection to be set up on a removable medium and at
    the same time forbids taking it off. Three values: the policy itself,
    permission to set it up, and a ban on removing it - the audit reports
    any other arrangement separately.

    I keep the category medium, and I want to say what the asymmetry
    consists in, because that is the substance here. Setting protection up
    is a decision. Taking protection off is undoing somebody else's
    decision, usually made earlier and for a different purpose. Those two
    acts look like a pair and are nothing of the sort.

    This group of rules opens a new chapter in the whole BitLocker pack.
    Fixed drives stay in the machine and we protect them in case the
    machine leaves the server room. A removable medium leaves by
    assumption - that is what it is for. The rules in this group are the
    only part of BitLocker that works once the data is already outside the
    building.

    On a server a removable medium is not an employee's portable storage.
    It is the backup drive, the courier medium, a vendor engineer's disk
    attached for the duration of a diagnosis, and the medium carrying
    material handed outside. Every one of them leaves the room.

    What an attacker gains while the item goes unmet: a medium whose
    protection was taken off outside any procedure because that was more
    convenient at handover - and which from then on is an ordinary disk
    holding production data.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia". Skutek jest wąski i daje się
    nazwać, ale nie jest zerowy.

    Zablokowane zostaje jedno konkretne działanie: zdjęcie ochrony
    z nośnika, który już ją ma. Dotyczy to przypadku, który na serwerze
    zdarza się naprawdę — trzeba przekazać dysk komuś, kto nie ma jak go
    odczytać, więc ktoś zdejmuje ochronę zamiast szukać innej drogi. Po tej
    zmianie ta droga jest zamknięta i pozostaje skopiowanie zawartości na
    nośnik przeznaczony do przekazania. To jest dodatkowa czynność i trzeba
    o niej wiedzieć wcześniej, a nie w dniu przekazania.

    Warto też zauważyć, czego ta reguła nie robi. Nie zmusza do
    zaszyfrowania czegokolwiek — nośnik niezaszyfrowany pozostaje
    niezaszyfrowany i nadal przyjmuje zapis. Wymuszenie jest treścią innej
    reguły z tej grupy i te dwie należy czytać razem.

    Druga rzecz: zdjęcie ochrony nie zostawia śladu w samych danych. Plik
    jest tym samym plikiem, tylko od tej pory czytelnym dla każdego. Dlatego
    ta reguła zamyka drogę, która po fakcie jest niewidoczna.

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review". The effect is narrow and nameable, but
    it is not zero.

    One specific action is blocked: taking protection off a medium that
    already has it. This covers a case that really does happen on a server
    - a disk has to be handed to somebody with no way of reading it, so
    somebody takes the protection off instead of finding another route.
    After this change that route is closed and what remains is copying the
    contents onto a medium meant for handover. That is an extra step, and
    people need to know about it beforehand, not on the day of the handover.

    It is also worth noticing what this rule does not do. It does not force
    anything to be encrypted - an unencrypted medium stays unencrypted and
    goes on accepting writes. Enforcement is the substance of another rule
    in this group, and the two should be read together.

    The second thing: taking protection off leaves no trace in the data
    itself. The file is the same file, only readable by anyone from then on.
    That is why this rule closes a route that is invisible after the fact.

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - encryption-and-tls
    - removable-media
    - legacy-applications
  what_breaks:
    pl:
      - Nie da się zdjąć ochrony z nośnika, który już ją ma, nawet gdy zrobiłby to ten, kto ją zakładał
      - Przekazanie dysku komuś, kto nie ma jak go odczytać, wymaga skopiowania zawartości na inny nośnik
      - Reguła niczego nie wymusza — nośnik niezaszyfrowany pozostaje niezaszyfrowany i nadal przyjmuje zapis
      - Zdjęcie ochrony nie zostawia śladu w danych, więc po fakcie nikt nie odróżni nośnika, z którego ją zdjęto
    en:
      - Protection cannot be taken off a medium that already has it, even by the person who set it up
      - Handing a disk to somebody with no way of reading it requires copying the contents onto another medium
      - The rule enforces nothing - an unencrypted medium stays unencrypted and goes on accepting writes
      - Taking protection off leaves no trace in the data, so afterwards nobody can tell such a medium apart
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Procedura przekazywania danych na zewnątrz opiera się na zdejmowaniu ochrony z nośnika przed wydaniem go
      - Nośniki wymienne tej maszyny są cyklicznie przygotowywane do użycia na sprzęcie, który nie obsługuje tego szyfrowania
    en:
      - The procedure for handing data outside rests on taking protection off the medium before it is released
      - This machine's removable media are cyclically prepared for use on hardware that does not support this encryption
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Three values carry this item: the policy itself, permission to set up
      # protection and permission to take it off. Anything other than
      # "may set up, may not remove" is reported apart.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $configure = $item.'RDVConfigureBDE'
        $allow = $item.'RDVAllowBDE'
        $disable = $item.'RDVDisableBDE'
        if ($null -eq $configure -or $null -eq $allow -or $null -eq $disable) { 'MISSING' }
        elseif ([int]$configure -ne 1) { 'NOT_CONFIGURED' }
        elseif ([int]$allow -ne 1) { 'SETUP_BLOCKED' }
        elseif ([int]$disable -ne 0) { 'REMOVAL_ALLOWED' }
        else { 'AS_REQUIRED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: AS_REQUIRED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path              = $path
      configure         = $item.'RDVConfigureBDE'
      configure_existed = ($null -ne $item.'RDVConfigureBDE')
      allow             = $item.'RDVAllowBDE'
      allow_existed     = ($null -ne $item.'RDVAllowBDE')
      disable           = $item.'RDVDisableBDE'
      disable_existed   = ($null -ne $item.'RDVDisableBDE')
      key_existed       = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This closes one route that really is used on a server: taking protection
    # off a disk before handing it to somebody who cannot read it. What remains
    # is copying the contents onto a medium meant for handover - tell people
    # beforehand, not on the day.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVConfigureBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVAllowBDE' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'RDVDisableBDE' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.configure_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -Value $b.configure -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVConfigureBDE' -ErrorAction SilentlyContinue
    }
    if ($b.allow_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -Value $b.allow -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVAllowBDE' -ErrorAction SilentlyContinue
    }
    if ($b.disable_existed) {
      Set-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -Value $b.disable -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'RDVDisableBDE' -ErrorAction SilentlyContinue
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Ta grupa zaczyna nowy rozdział paczki BitLockera. Dyski stałe zostają
    w maszynie i chronimy je na wypadek, gdyby maszyna wyszła z serwerowni.
    Nośnik wymienny wychodzi z założenia — reguły tej grupy są jedyną
    częścią BitLockera działającą wtedy, gdy dane są już poza budynkiem.

    Na serwerze nośnik wymienny to dysk z kopiami zapasowymi, nośnik
    kurierski, dysk inżyniera dostawcy i nośnik z materiałem przekazywanym
    na zewnątrz — nie pamięć przenośna pracownika.

    Asymetria jest tu treścią: założenie ochrony to decyzja, zdjęcie to
    cofnięcie cudzej decyzji. Wyglądają na parę, a nie są nią.
  en: |
    This group opens a new chapter in the BitLocker pack. Fixed drives stay
    in the machine and we protect them in case the machine leaves the server
    room. A removable medium leaves by assumption - the rules in this group
    are the only part of BitLocker that works once the data is already
    outside the building.

    On a server a removable medium is the backup drive, the courier medium,
    a vendor engineer's disk and the medium carrying material handed outside
    - not an employee's portable storage.

    The asymmetry is the substance here: setting protection up is a
    decision, taking it off is undoing somebody else's. They look like a
    pair and are not.
