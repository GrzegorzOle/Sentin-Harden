id: win2025-rdp-idle-session-limit

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Session Time Limits
  title:
    pl: Bezczynna sesja pulpitu zdalnego kończona po kwadransie
    en: An idle remote desktop session ended after a quarter of an hour
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie rozłącza sesję pulpitu zdalnego, w której przez kwadrans
    nie było żadnej czynności użytkownika.

    Sesja bezczynna jest sesją zalogowaną, tyle że bez nikogo przy niej.
    Wszystko, co daje zalogowanie, jest w niej nadal dostępne: otwarte
    konsole, token dostępu w pamięci, połączenia do innych maszyn
    zestawione z tej sesji.

    Na serwerze rzecz waży inaczej niż na stanowisku roboczym i różnica
    jest w tym, kto może z takiej sesji skorzystać.

    Na stanowisku sesja bezczynna czeka przy biurku swojego właściciela,
    w tym samym pokoju. Na serwerze nie czeka nigdzie — serwer nie ma
    pokoju. Sesja bezczynna na serwerze jest dostępna dla każdego, kto
    zdobędzie na tej maszynie uprawnienia pozwalające sesję przejąć,
    a sesja administracyjna zostawiona na noc jest dla napastnika
    najkrótszą drogą do uprawnień, których sam nie zdobył.

    Jest jeszcze powód drugi, mniej związany z pojedynczym atakiem,
    a ważny dla samej maszyny: sesje bezczynne nie kończą się same
    i przybywa ich z tygodnia na tydzień. Każda trzyma pamięć i materiał
    poświadczeniowy. Na serwerze terminali po kilku miesiącach jest to
    zbiór poświadczeń niemal wszystkich pracowników, leżący w pamięci
    jednej maszyny.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zbiór
    sesji zalogowanych, przy których nikogo nie ma, i możliwość wejścia
    w cudze uprawnienia bez zdobywania hasła.
  en: |
    The setting disconnects a remote desktop session wherein no act of the user has been for a
    quarter of an hour.

    An idle session is a signed-in session, only with nobody at it. All that signing in gives is
    still to be had within it: open consoles, a token of access in memory, connections to other
    machines set up out of that session.

    On a server the matter weighs otherwise than at a working station, and the difference lies in
    who may make use of such a session.

    At a station an idle session waits at its owner's desk, in the same room. On a server it waits
    nowhere - a server has no room. An idle session on a server is to be had by anyone who wins on
    that machine the rights letting a session be taken over, and an administrative session left for
    the night is for an attacker the shortest road to rights they did not win themselves.

    There is a second reason besides, less tied to a single attack and weighty for the machine
    itself: idle sessions do not end of themselves and they grow in number week by week. Each holds
    memory and credential matter. On a terminal server after some months it is a body of
    credentials of well-nigh every worker, lying in the memory of one machine.

    What an attacker gains while the item goes unmet: a body of signed-in sessions with nobody at
    them, and the means of stepping into another's rights without winning a password.

disruption_description:
  pl: |
    Zaliczam ten punkt do klasy wymagającej świadomego wdrożenia i robię
    to wyżej niż w paczce stanowiska roboczego, bo na serwerze bezczynność
    znaczy co innego niż nieobecność.

    Rzecz, którą trzeba zrozumieć przed wdrożeniem, jest taka: licznik
    bezczynności liczy czynności użytkownika, a nie pracę maszyny.
    Administrator, który uruchomił w konsoli długie zapytanie, import
    albo przebudowę indeksu i czeka na wynik, nie naciskając klawiszy,
    jest dla tego licznika bezczynny. Po kwadransie jego sesja zostanie
    rozłączona, a jeśli wdrożono też ograniczenie sesji rozłączonych,
    po chwili zakończona razem z tym, co w niej działało.

    Skutek złożenia tych dwóch punktów jest najważniejszą rzeczą, jaką
    można o nich powiedzieć, i dlatego zapisuję go wprost: kwadrans bez
    dotknięcia klawiatury plus minuta rozłączenia oznacza, że po
    szesnastu minutach ginie wszystko, co w sesji było uruchomione.
    Trzeba je wdrażać razem, w jednym oknie, i razem o nich uprzedzać.

    Druga rzecz do ustalenia to ludzie pracujący na serwerze terminali.
    Praca, w której czyta się dokument, rozmawia przez telefon albo
    czeka na czyjąś odpowiedź, wygląda dla licznika identycznie jak
    wyjście do domu. Po zmianie takie osoby będą logować się kilka razy
    dziennie.

    Trzecia to stanowiska pokazowe i ekrany zbiorcze — pulpit
    z wykresami wiszący na ścianie działu, zasilany sesją zdalną.
    Zgasną po kwadransie i nikt nie połączy tego ze zmianą na serwerze.

    Objaw jest jednoznaczny: sesja znika, a klient pokazuje rozłączenie
    bez podania powodu. Nie wygląda to na awarię sieci, ale też nie
    mówi, że zadziałało ograniczenie.

    Warto zapisać jedno: na serwerze, na którym te wartości są za ostre
    dla faktycznej pracy, właściwą odpowiedzią jest zapisanie wyjątku
    z uzasadnieniem, a nie ciche pominięcie punktu przy przeglądzie.

    Zmiana wchodzi w życie od razu i cofa się natychmiast. Sesje już
    nawiązane obejmuje przy następnym sprawdzeniu licznika.
  en: |
    I reckon this item to the class taking a knowing rollout, and I do so higher than in the
    working station's pack, idleness meaning on a server something other than absence.

    The thing to be understood before the rollout is this: the counter of idleness counts the
    user's acts and not the machine's work. An administrator who has started in a console a long
    query, an import or a rebuilding of an index, and waits for the outcome without pressing keys,
    is to that counter idle. After a quarter of an hour their session will be disconnected, and if
    the bound on disconnected sessions is rolled out too, in a moment ended along with what was
    running within it.

    The effect of these two items laid together is the weightiest thing that can be said of them,
    and so I write it plainly: a quarter of an hour without touching the keyboard plus a minute of
    disconnection means that after sixteen minutes all that was running in the session perishes.
    They must be rolled out together, in one window, and foretold together.

    The second thing to settle is the people working on a terminal server. Work wherein a document
    is read, a call is spoken, or somebody's answer is waited for, looks to the counter just as
    going home does. After the change such people will sign in several times a day.

    The third is stations for showing and gathered screens - a board of charts hanging on a
    department's wall, fed by a remote session. They will go dark after a quarter of an hour and
    nobody will tie it to a change on the server.

    The symptom is plain: the session vanishes and the client shows a disconnection with no reason
    given. It does not look like a fault of the network, but neither does it say that a bound took
    effect.

    One thing is worth writing down: on a server where these values are too stern for the actual
    work, the right answer is the writing of an exception with its grounds, and not a quiet passing
    over of the item at the review.

    The change comes into force straight away and is undone at once. It takes in sessions already
    opened at the counter's next checking.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - user-interface
    - scripting-and-automation
  what_breaks:
    pl:
      - Długie zapytanie albo import uruchomiony w konsoli liczy się jako bezczynność, bo licznik liczy czynności użytkownika
      - Razem z ograniczeniem sesji rozłączonych po szesnastu minutach ginie wszystko, co w sesji było uruchomione
      - Czytanie dokumentu albo rozmowa przez telefon wygląda dla licznika identycznie jak wyjście do domu
      - Pulpit z wykresami zasilany sesją zdalną zgaśnie po kwadransie
      - Klient pokazuje rozłączenie bez podania powodu, więc przyczyna nie jest oczywista
    en:
      - A long query or import started in a console counts as idleness, the counter counting the user's acts
      - Together with the bound on disconnected sessions, after sixteen minutes all that was running in the session perishes
      - The reading of a document or a spoken call looks to the counter just as going home does
      - A board of charts fed by a remote session will go dark after a quarter of an hour
      - The client shows a disconnection with no reason given, so the cause is not plain
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na serwerze uruchamia się z konsoli długie operacje, przy których nikt nie dotyka klawiatury
      - Sesja zdalna zasila ekran zbiorczy albo stanowisko pokazowe, które ma świecić bez przerwy
    en:
      - Long workings are started from a console on the server with nobody touching the keyboard
      - A remote session feeds a gathered screen or a station for showing that is to shine without a break
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it is the absence of a limit, not
      # the shortest one. Reported apart, so a report cannot read it as a very
      # strict setting.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'MaxIdleTime'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_LIMIT' }
        elseif ([int]$value -le 900000) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_LIMIT
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'MaxIdleTime'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxIdleTime' -Value 900000 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/rds-plan-access-from-anywhere

notes:
  pl: |
    Licznik bezczynności liczy czynności użytkownika, a nie pracę
    maszyny. Długie zapytanie uruchomione w konsoli jest dla niego
    bezczynnością — to najważniejsza rzecz do zrozumienia przed
    wdrożeniem.

    Złożenie z ograniczeniem sesji rozłączonych daje szesnaście minut
    bez dotknięcia klawiatury do zniknięcia wszystkiego, co w sesji
    działało. Oba punkty wdraża się razem, w jednym oknie.

    Na stanowisku sesja bezczynna czeka przy biurku właściciela. Serwer
    nie ma biurka — czeka tam, gdzie sięgnie każdy, kto zdobędzie
    uprawnienia pozwalające ją przejąć.
  en: |
    The counter of idleness counts the user's acts and not the machine's work. A long query started
    in a console is to it idleness - that is the weightiest thing to understand before the rollout.

    Laid together with the bound on disconnected sessions it gives sixteen minutes without touching
    the keyboard until all that ran in the session vanishes. Both items are rolled out together, in
    one window.

    At a station an idle session waits at its owner's desk. A server has no desk - it waits where
    anyone reaches who wins the rights letting it be taken over.
