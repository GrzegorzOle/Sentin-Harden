id: win10-audit-ipsec-driver

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Advanced Audit Policy Configuration > System
  title:
    pl: Inspekcja sterownika ochrony ruchu sieciowego
    en: The audit of the driver guarding network traffic
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zapisuje pracę sterownika odpowiadającego za ochronę ruchu
    sieciowego na poziomie pakietów: jego uruchomienie i zatrzymanie,
    odrzucenie pakietów oraz niepowodzenia sprawdzania spójności.

    Sterownik ten pracuje poniżej warstwy reguł zapory i jest tym miejscem,
    w którym ruch bywa szyfrowany i sprawdzany, zanim dotrze do
    czegokolwiek, co widać z poziomu aplikacji. Jego zatrzymanie zdejmuje
    ochronę, nie zmieniając ani jednej reguły widocznej w konfiguracji.

    Wpisami o największej wartości są niepowodzenia sprawdzania spójności.
    Pakiet, który dotarł, a nie zgadza się ze swoją sumą kontrolną, jest
    albo skutkiem awarii sieci, albo skutkiem cudzej ingerencji w połączenie.
    Seria takich wpisów z jednego kierunku mówi, że ktoś próbował, nie mówiąc
    jeszcze, czy mu się udało.

    Odnotowuję granicę praktyczną: podkategoria ma treść wyłącznie tam, gdzie
    ochrona ruchu na tym poziomie jest w ogóle używana. Na stanowisku bez
    takich zasad zapis pozostaje pusty poza wpisami o starcie sterownika.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zatrzymanie
    ochrony ruchu i ingerencję w pakiety niezostawiające śladu w żadnym
    innym zapisie.
  en: |
    The setting writes down the working of the driver answering for the guarding of network traffic at the level
    of packets: its starting and its stopping, the dropping of packets, and the failures of the checks of
    soundness.

    That driver works below the layer of firewall rules and is the place in which traffic is at times encrypted
    and checked before it comes to anything seen from an application's level. Its stopping lifts the guard
    without changing one rule seen in the setting.

    The entries of the greatest worth are the failures of the checks of soundness. A packet that arrived and
    does not agree with its own checksum is either the outcome of a network fault or the outcome of somebody
    else's meddling with the connection. A run of such entries from one quarter says somebody tried, without yet
    saying whether they got through.

    I set down a practical bound: the subcategory has substance only where the guarding of traffic at that level
    is used at all. Upon a workplace without such rules the record stays empty but for the entries about the
    driver's start.

    What an attacker gains while the item goes unmet: the stopping of the traffic guard, and a meddling with
    packets, leaving no trace in any other record.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie zmienia żadnej zasady ochrony ruchu i nie wpływa na to,
    co przez sieć przechodzi. Zapisuje wyłącznie pracę sterownika.

    Liczba wpisów na stanowisku bez zasad ochrony ruchu jest bliska zeru —
    poza wpisami o starcie i zatrzymaniu sterownika przy uruchamianiu
    i zamykaniu maszyny.

    Odnotowuję sytuację odwrotną, o której warto wiedzieć przed
    wykonaniem: na maszynie z włączoną ochroną ruchu w sieci niestabilnej
    wpisy o odrzuconych pakietach potrafią być liczne. Nie jest to wtedy
    ślad ingerencji, tylko obraz jakości łącza.

    Zapisywane są oba wyniki, bo odrzucenia i nieudane sprawdzenia
    spójności są tu treścią właściwą.

    Czego to nie psuje: ochrony ruchu sieciowego, połączeń, zapory,
    logowania, udziałów plikowych, drukowania.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The setting changes no rule of traffic guarding and bears not upon what passes over the network. It writes
    down the driver's working alone.

    The number of entries upon a workplace without rules of traffic guarding is near nought - but for the
    entries about the driver's start and stop at the running and the shutting down of the machine.

    I set down the opposite case, worth knowing of before the carrying out: upon a machine with traffic guarding
    switched on, in an unsteady network, the entries about dropped packets can be many. It is then no trace of
    meddling but a picture of the link's quality.

    Both outcomes are written, the droppings and the failed checks of soundness being here the proper substance.

    What this does not break: the guarding of network traffic, connections, the firewall, logging on, file
    shares, or printing.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - logging-and-audit
    - network-and-firewall
  what_breaks:
    pl:
      - Na maszynie z włączoną ochroną ruchu w sieci niestabilnej wpisy o odrzuconych pakietach potrafią być liczne
      - Nie jest to wtedy ślad ingerencji, tylko obraz jakości łącza, i trzeba to rozstrzygnąć przed wyciąganiem wniosków
      - Na stanowisku bez zasad ochrony ruchu zapis pozostaje pusty poza wpisami o starcie sterownika
      - Ustawienie nie zmienia żadnej zasady ochrony ruchu i nie wpływa na to, co przez sieć przechodzi
      - Połączenia, zapora, logowanie, udziały plikowe i drukowanie pozostają bez zmian
    en:
      - Upon a machine with traffic guarding switched on, in an unsteady network, the entries about dropped packets can be many
      - It is then no trace of meddling but a picture of the link s quality, and that has to be settled before conclusions are drawn
      - Upon a workplace without rules of traffic guarding the record stays empty but for the entries about the driver s start
      - The setting changes no rule of traffic guarding and bears not upon what passes over the network
      - Connections, the firewall, logging on, file shares and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna pracuje z ochroną ruchu w sieci niestabilnej i wpisy o odrzuceniach zaleją dziennik obrazem jakości łącza
    en:
      - The machine works with traffic guarding in an unsteady network and the entries about droppings will flood the log with a picture of the link
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $csv = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.csv')
      $output = & auditpol /backup /file:$csv 2>&1
      $rows = @()
      if (Test-Path -Path $csv) {
        $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
        Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
      }
      # The backup format carries a numeric setting in its last column, which the
      # localised output of auditpol /get does not.
      $line = $rows | Where-Object { $_ -match '0CCE9213-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
      if (-not $line) {
        # auditpol writes the file even where it refuses the backup, so it is the
        # missing row - not a missing file - that tells the refusal apart. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        $text = ($output | ForEach-Object {
          if ($_ -is [System.Management.Automation.ErrorRecord]) { $_.Exception.Message }
          else { [string]$_ }
        }) -join ' '
        [Console]::Error.WriteLine($text.Trim())
        'CHECK_ERROR'
      }
      else {
        $value = ($line -split ',')[-1].Trim()
        if ($value -match '^\d+$') { $value } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^3$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $csv = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.csv')
    $null = auditpol /backup /file:$csv
    $rows = Get-Content -Path $csv -ErrorAction SilentlyContinue
    Remove-Item -Path $csv -Force -ErrorAction SilentlyContinue
    $line = $rows | Where-Object { $_ -match '0CCE9213-69AE-11D9-BED3-505054503030' } | Select-Object -First 1
    $value = ''
    if ($line) { $value = ($line -split ',')[-1].Trim() }
    [pscustomobject]@{
      subcategory = '{0CCE9213-69AE-11D9-BED3-505054503030}'
      value       = $value
      existed     = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Both outcomes are recorded. The start and the stop of the driver is a success;
    # the dropping of packets and the failed checks are failures, and those are the
    # substance.
    auditpol /set /subcategory:"{0CCE9213-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $value = [int]$b.value
    $success = if ($value -band 1) { 'enable' } else { 'disable' }
    $failure = if ($value -band 2) { 'enable' } else { 'disable' }
    auditpol /set /subcategory:"{0CCE9213-69AE-11D9-BED3-505054503030}" /success:$success /failure:$failure

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/audit-ipsec-driver

notes:
  pl: |
    Reguła jest w tym bloku tą, której wartość najmocniej zależy od maszyny.
    Na stanowisku bez zasad ochrony ruchu jest formalnością; na maszynie,
    która z nich korzysta, jest jedynym zapisem mówiącym, czy ochrona
    faktycznie działała.

    Warto, żeby aplikacja umiała to rozróżnić, korzystając z inwentaryzacji
    z etapu audytu. Reguła, o której wiadomo, że na tej maszynie nie ma
    zastosowania praktycznego, powinna to mówić — zamiast stać na liście
    obok punktów, które coś zmieniają.

    Odnotowuję zastrzeżenie: brak zasad ochrony ruchu dzisiaj nie znaczy,
    że ich nie będzie. Podkategoria włączona z wyprzedzeniem nie kosztuje
    nic, a włączona po fakcie nie odtworzy zdarzeń, które już zaszły.
  en: |
    The rule is the one in this block whose worth hangs hardest upon the machine. Upon a workplace without rules
    of traffic guarding it is a formality; upon a machine that uses them it is the one record saying whether the
    guard in fact worked.

    It is well that the application be able to tell the two apart, drawing upon the taking of stock from the
    audit stage. A rule known to have upon this machine no practical use ought to say so - rather than stand in
    the list beside items that change something.

    I set down a caveat: no rules of traffic guarding today does not mean there will be none. The subcategory
    switched on ahead of time costs nothing, and switched on after the fact will not build up again the events
    that have already happened.
