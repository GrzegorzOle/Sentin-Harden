id: win2025-device-install-deny-sbp2-class

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Zakaz instalacji sterowników pamięci masowej na starszym złączu szeregowym
    en: Storage drivers on the older serial connector forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt zabrania instalowania sterowników dla klasy urządzeń pamięci
    masowej podłączanych starszym złączem szeregowym, i robi to wstecznie.

    Zostawiam kategorię średnią i chcę od razu powiedzieć, co ten punkt
    realnie wnosi na serwerze, bo łatwo go tu przecenić albo odrzucić.
    Nie przeceniam: złącze, o które chodzi, zniknęło z serwerów ponad
    dekadę temu i na maszynie kupionej w tym stuleciu z dużym
    prawdopodobieństwem nie ma go wcale. Nie odrzucam natomiast, bo sam
    fakt, że złącza nie ma, nie usuwa obsługi klasy z systemu — system
    nadal potrafi ten sterownik załadować, jeżeli zobaczy urządzenie na
    przejściówce.

    To jest ta sama rodzina co kontrolery sięgające wprost do pamięci,
    tylko starsza. Urządzenie pamięci masowej na tym złączu było
    projektowane tak, żeby czytać pamięć maszyny bez pośrednictwa
    systemu, i ta własność nie zniknęła razem z popularnością złącza.
    Zamykamy więc drogę udokumentowaną, nie hipotetyczną.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: starą,
    dobrze opisaną drogę odczytu pamięci, która działa właśnie dlatego,
    że nikt jej już nie pilnuje.
  en: |
    The item forbids installing drivers for a class of storage devices
    attached over the older serial connector, and does so retroactively.

    I keep the category medium, and I want to say straight away what this
    item actually contributes on a server, because it is easy either to
    overrate or to dismiss. I do not overrate it: the connector in question
    disappeared from servers over a decade ago, and on a machine bought
    this century it very probably is not present at all. Nor do I dismiss
    it, because the absence of the connector does not remove support for
    the class from the system - the system can still load that driver if it
    sees such a device on an adapter.

    This is the same family as the controllers reaching straight into
    memory, only older. A storage device on that connector was designed to
    read the machine's memory without the system's mediation, and that
    property did not vanish along with the connector's popularity. So we
    are closing a documented route, not a hypothetical one.

    What an attacker gains while the item goes unmet: an old, well
    documented route to reading memory that works precisely because nobody
    watches it any more.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i chcę uczciwie powiedzieć,
    dlaczego, bo sam skutek dla urządzeń jest tu bliski zera. Złącza na
    serwerze nie ma, więc zmiana z reguły niczego nie wyłączy i niczego
    nie zablokuje. Gdyby chodziło wyłącznie o to, punkt należałby do klasy
    bez uciążliwości.

    Trzyma go wyżej nie sprzęt, tylko sposób zapisu. Ta reguła dopisuje
    się do listy zakazanych klas urządzeń w miejscu wspólnym dla trzech
    reguł tej paczki, a jej wycofanie przywraca całą listę ze stanu
    zapisanego w kopii. Zastosowana hurtem, w serii z regułami
    sąsiednimi, tworzy sytuację, w której kolejność stosowania i kolejność
    wycofywania przestają być obojętne — a tryb zbiorczy jest z założenia
    miejscem, w którym nikt na kolejność nie patrzy.

    Wolę powiedzieć wprost, że powodem jest mechanika zapisu, a nie
    zagrożenie dla eksploatacji. Reguła, która trafia poza tryb zbiorczy
    z podanym powodem, jest uczciwsza niż reguła wpuszczona tam dlatego,
    że „i tak nic nie robi".

    Zmiana nie wymaga przerwy i cofa się natychmiast.
  en: |
    I keep the class "needs review" and want to say honestly why, because
    the effect on devices here is close to zero. The connector is not
    present on a server, so the change will as a rule disable nothing and
    block nothing. If that were all, the item would belong to the class
    without disruption.

    What keeps it higher is not the hardware but the way it is recorded.
    This rule appends to a list of forbidden device classes in a place
    shared by three rules in this pack, and rolling it back restores the
    whole list from the state held in the backup. Applied in bulk, in a
    series with the neighbouring rules, it creates a situation where the
    order of application and the order of rollback stop being immaterial -
    and bulk mode is by design the place where nobody looks at order.

    I would rather say outright that the reason is the recording mechanics
    and not a threat to operations. A rule that stays out of bulk mode with
    a stated reason is more honest than a rule let into it because "it does
    nothing anyway".

    The change needs no outage and is undone immediately.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Urządzenia pamięci masowej na starszym złączu szeregowym przestaną być instalowane, również te już obecne
      - Na serwerze skutek dla urządzeń jest bliski zera, bo złącza z reguły nie ma
      - Reguła dopisuje się do listy wspólnej dla trzech reguł tej paczki, a wycofanie przywraca całą listę z kopii
      - Zastosowana hurtem w serii z regułami sąsiednimi sprawia, że kolejność stosowania i wycofywania przestaje być obojętna
    en:
      - Storage devices on the older serial connector stop being installed, including those already present
      - On a server the effect on devices is close to zero, because the connector is as a rule not present
      - The rule appends to a list shared by three rules in this pack, and a rollback restores the whole list from the backup
      - Applied in bulk in a series with the neighbouring rules, it makes the order of application and rollback stop being immaterial
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna korzysta z pamięci masowej podłączonej starszym złączem szeregowym albo przez przejściówkę
      - Reguły zakazów instalacji urządzeń mają być stosowane hurtem, bez kontroli kolejności wycofywania
    en:
      - The machine uses storage attached over the older serial connector or through an adapter
      - The device installation restriction rules are to be applied in bulk without control over the rollback order
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $deny = $item.DenyDeviceClasses
        $retroactive = $item.DenyDeviceClassesRetroactive
        $listKey = Join-Path $path 'DenyDeviceClasses'
        $listed = @()
        if (Test-Path -Path $listKey) {
          $listed = @(
            (Get-ItemProperty -Path $listKey -ErrorAction Stop).PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { ([string]$_.Value).Trim().ToLowerInvariant() }
          )
        }
        $absent = @(@('{d48179be-ec20-11d1-b6b8-00c04fa372a7}') | Where-Object { $listed -notcontains $_ })
        if ($null -eq $deny -or $null -eq $retroactive) { 'MISSING' }
        elseif ([int]$deny -eq 1 -and [int]$retroactive -eq 1 -and $absent.Count -eq 0) { 'DENIED_RETROACTIVELY' }
        else { 'DENY=' + $deny + ' RETROACTIVE=' + $retroactive + ' ABSENT=' + ($absent -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: DENIED_RETROACTIVELY
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $listKey = Join-Path $path 'DenyDeviceClasses'
    $entries = @()
    if (Test-Path -Path $listKey) {
      $entries = @(
        (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties |
          Where-Object { $_.Name -notlike 'PS*' } |
          ForEach-Object { [pscustomobject]@{ name = $_.Name; value = [string]$_.Value } }
      )
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = (Test-Path -Path $path)
      deny          = $item.DenyDeviceClasses
      deny_existed  = ($null -ne $item.DenyDeviceClasses)
      retro         = $item.DenyDeviceClassesRetroactive
      retro_existed = ($null -ne $item.DenyDeviceClassesRetroactive)
      list_key      = $listKey
      list_existed  = (Test-Path -Path $listKey)
      entries       = $entries
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a server this usually disables nothing, the connector being long gone.
    # It stays out of bulk mode because of the shared list below, not because of
    # any risk to operations.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyDeviceClasses' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DenyDeviceClassesRetroactive' -Value 1 -Type DWord
    $listKey = Join-Path $path 'DenyDeviceClasses'
    if (-not (Test-Path -Path $listKey)) { New-Item -Path $listKey -Force | Out-Null }
    # Classes put here by somebody else guard against something this rule does not
    # know about, so the list is added to and never replaced.
    $taken = @{}
    $present = @()
    foreach ($property in (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties) {
      if ($property.Name -notlike 'PS*') {
        $taken[$property.Name] = $true
        $present += ([string]$property.Value).Trim().ToLowerInvariant()
      }
    }
    $index = 1
    foreach ($class in @('{d48179be-ec20-11d1-b6b8-00c04fa372a7}')) {
      if ($present -notcontains $class) {
        while ($taken.ContainsKey([string]$index)) { $index++ }
        New-ItemProperty -Path $listKey -Name ([string]$index) -Value $class -PropertyType String -Force | Out-Null
        $taken[[string]$index] = $true
      }
    }

  rollback_command: |
    # The list is restored wholesale, so this also undoes what a neighbouring
    # device installation rule appended afterwards. Roll these back in the
    # reverse order they were applied.
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.deny_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceClasses' -Value $b.deny -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceClasses' -ErrorAction SilentlyContinue
    }
    if ($b.retro_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceClassesRetroactive' -Value $b.retro -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceClassesRetroactive' -ErrorAction SilentlyContinue
    }
    Remove-Item -Path $b.list_key -Recurse -Force -ErrorAction SilentlyContinue
    if ($b.list_existed) {
      New-Item -Path $b.list_key -Force | Out-Null
      foreach ($entry in @($b.entries)) {
        New-ItemProperty -Path $b.list_key -Name $entry.name -Value $entry.value -PropertyType String -Force | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-device-installation-with-group-policy

notes:
  pl: |
    Ta sama rodzina co kontrolery sięgające wprost do pamięci, tylko
    starsza. Brak złącza nie usuwa obsługi klasy z systemu — sterownik
    nadal da się załadować, jeżeli system zobaczy urządzenie na
    przejściówce.

    Powodem pozostawienia punktu poza trybem zbiorczym jest mechanika
    zapisu, a nie zagrożenie dla eksploatacji. Reguła dopisuje się do
    listy wspólnej dla trzech reguł tej paczki, a wycofanie przywraca całą
    listę z kopii.

    Uczciwiej trzymać taką regułę poza trybem zbiorczym z podanym powodem
    niż wpuścić ją tam dlatego, że i tak nic nie robi.
  en: |
    The same family as the controllers reaching straight into memory, only
    older. The absence of the connector does not remove support for the
    class from the system - the driver can still be loaded if the system
    sees such a device on an adapter.

    The reason for keeping this item out of bulk mode is the recording
    mechanics, not a threat to operations. The rule appends to a list
    shared by three rules in this pack, and a rollback restores the whole
    list from the backup.

    It is more honest to keep such a rule out of bulk mode with a stated
    reason than to let it in because it does nothing anyway.
