id: win11-game-recording-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Game Recording and Broadcasting
  title:
    pl: Nagrywanie i transmitowanie obrazu z gier wyłączone
    en: Recording and broadcasting the picture from games switched off
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Składnik nagrywania gier jest w systemie obecny niezależnie od tego, czy
    ktokolwiek gra. Potrafi nagrywać obraz z okna dowolnej aplikacji, zapisywać
    ostatnie minuty pracy z bufora działającego stale w tle i transmitować obraz
    na zewnątrz — a wszystko to uruchamia się skrótem klawiszowym, bez pytania
    i bez okna, które trzeba by wcześniej otworzyć.

    Opis brzmi jak opis narzędzia do podglądu ekranu, bo funkcjonalnie nim jest.
    Różnica polega na tym, że ten jest częścią systemu, podpisany przez
    producenta i nie wzbudza podejrzeń narzędzi zabezpieczających.

    Dla napastnika z dostępem do sesji użytkownika jest to gotowy sposób
    nagrania tego, co na ekranie: dokumentów, poczty, okien aplikacji
    firmowych. Nie trzeba niczego wnosić na maszynę, więc nie ma czego wykryć.

    Osobno liczy się bufor pracujący w tle. Nagranie „ostatnich minut" znaczy,
    że obraz ekranu jest stale gdzieś przetrzymywany — również wtedy, gdy nikt
    świadomie nic nie nagrywa.
  en: |
    The game recording component is present in the system whether or not anyone
    plays. It can record the picture from any application's window, save the last
    minutes of work from a buffer running constantly in the background, and broadcast
    the picture outwards - and all of it starts from a keyboard shortcut, without
    asking and without a window that would have to be opened first.

    The description reads like that of a screen-watching tool, because functionally
    it is one. The difference is that this one is part of the system, signed by the
    maker, and raises no suspicion in security tools.

    For an attacker with access to a user's session it is a ready means of recording
    what is on screen: documents, mail, the windows of company applications. Nothing
    has to be brought onto the machine, so there is nothing to detect.

    The buffer running in the background counts separately. Recording "the last
    minutes" means the screen's picture is constantly being held somewhere - also
    when nobody is knowingly recording anything.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś nie używa tego składnika do nagrywania
    ekranu w pracy — i jest to częstsze, niż wynikałoby z nazwy ustawienia.

    Skrót klawiszowy uruchamiający nagrywanie jest wygodny i bywa używany do
    rzeczy niemających z grami nic wspólnego: nagrania krótkiej instrukcji dla
    współpracownika, pokazania błędu w aplikacji, przygotowania materiału
    szkoleniowego. Po wdrożeniu skrót przestaje działać i te sposoby pracy
    trzeba zastąpić osobnym narzędziem.

    Poza tym nie przestaje działać nic. Gry działają bez zmian — punkt dotyczy
    nagrywania, nie uruchamiania. Nakładka z licznikiem klatek i pozostałe
    funkcje paska gier znikają razem z nagrywaniem.

    Warto policzyć, ile osób w organizacji ma ten skrót w codziennym użyciu,
    zanim się zastosuje. Odpowiedź bywa zaskakująca.

    Nie ma restartu.
  en: |
    What needs checking is whether somebody is using this component to record the
    screen at work - and that is commoner than the setting's name would suggest.

    The keyboard shortcut that starts recording is convenient and gets used for
    things having nothing to do with games: recording a short instruction for a
    colleague, showing a fault in an application, preparing training material. After
    the rollout the shortcut stops working and those ways of working have to be
    replaced with a separate tool.

    Otherwise nothing stops working. Games run unchanged - the item concerns
    recording, not launching. The overlay with the frame counter and the game bar's
    remaining functions disappear along with the recording.

    It is worth counting how many people in the organisation have that shortcut in
    daily use before applying. The answer can be surprising.

    There is no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Skrót klawiszowy nagrywający obraz z okna aplikacji przestanie działać
      - Nagrywanie krótkich instrukcji i materiałów szkoleniowych tym składnikiem wymaga osobnego narzędzia
      - Nakładka paska gier razem z licznikiem klatek przestanie się pojawiać
    en:
      - The keyboard shortcut recording the picture from an application's window stops working
      - Recording short instructions and training material with this component needs a separate tool
      - The game bar overlay along with the frame counter stops appearing
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Nagrywanie ekranu tym składnikiem jest w organizacji przyjętym sposobem dokumentowania zgłoszeń
      - Stanowisko służy do przygotowywania materiałów wideo i nie ma zamiennika
    en:
      - Recording the screen with this component is the organisation's accepted way of documenting reports
      - The station is used to prepare video material and there is no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
      $name = 'AllowGameDVR'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    $name = 'AllowGameDVR'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowGameDVR' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-gamedvr

notes:
  pl: |
    Nazwa punktu wskazuje na gry i przez to bywa pomijana przy utwardzaniu
    stanowisk biurowych jako nieistotna. Jest to pomyłka: składnik nagrywa
    obraz z okna dowolnej aplikacji, a nie tylko z gry, i właśnie to czyni go
    wartym uwagi na maszynie, na której nikt nie gra.

    Punkt nie usuwa składnika i nie odinstalowuje paska gier. Wyłącza
    nagrywanie i transmitowanie — reszta powłoki pozostaje nietknięta.

    Ustawienie nie występuje w wydaniach serwerowych. Przy przenoszeniu reguły
    na inną platformę trzeba to sprawdzić, zamiast zakładać zgodność.
  en: |
    The item's name points at games and for that reason gets passed over when
    hardening office stations, as irrelevant. That is a mistake: the component
    records the picture from any application's window, not only from a game, and that
    is exactly what makes it worth attention on a machine where nobody plays.

    The item does not remove the component and does not uninstall the game bar. It
    switches recording and broadcasting off - the rest of the shell stays untouched.

    The setting is absent from server editions. When carrying the rule to another
    platform that has to be checked rather than assumed.
