id: win2025-uac-deny-elevation-standard-users

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Podnoszenie uprawnień przez zwykłych użytkowników odrzucane
    en: Raising of rights by ordinary users refused
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie przesądza, co system robi, gdy uprawnień administracyjnych
    zażąda program uruchomiony na koncie bez takich uprawnień, i punkt
    wymaga odrzucenia żądania bez pytania.

    Wariantem alternatywnym jest pytanie o poświadczenia administratora.
    Wygląda to na rozwiązanie wygodniejsze i bywa wybierane właśnie
    dlatego — ale przenosi decyzję na użytkownika, który uprawnień nie ma,
    i uczy go, że w odpowiedzi na okno systemowe wpisuje się cudze hasło.

    Na serwerze pytanie to jest szczególnie niepożądane z powodu, który
    trudno przecenić: konta zwykłych użytkowników na serwerze są kontami
    usług, kontami aplikacji i kontami sesji zdalnych. Okno proszące
    o poświadczenia administratora, pokazane w takiej sesji, jest wprost
    zaproszeniem do wprowadzenia hasła administracyjnego tam, gdzie żadne
    hasło administracyjne nie powinno się pojawić.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    poproszenia o hasło administratora w sposób nieodróżnialny od żądania
    systemowego. Wystarczy uruchomić na koncie użytkownika cokolwiek, co
    o uprawnienia poprosi — a okno wygląda tak samo niezależnie od tego,
    co je wywołało.

    Odrzucenie żądania zamyka tę drogę całkowicie: okno się nie pojawia,
    więc nie ma czego podrabiać.
  en: |
    The setting settles what the system does when administrative rights are demanded by a
    program started on an account without such rights, and the item takes that the demand be
    refused without asking.

    The alternative variant is asking for an administrator's credentials. It looks the more
    convenient answer and is sometimes chosen for exactly that reason - but it moves the
    decision onto a user who has no rights, and teaches them that in answer to a system
    window one types somebody else's password.

    On a server that question is especially unwanted for a reason hard to overrate: ordinary
    users' accounts on a server are services' accounts, applications' accounts and remote
    sessions' accounts. A window asking for an administrator's credentials, shown in such a
    session, is an outright invitation to enter an administrative password where no
    administrative password ought to appear.

    What an attacker gains while the item goes unmet: the means of asking for an
    administrator's password in a way indistinguishable from a system demand. It is enough
    to start on a user's account anything that asks for rights - and the window looks the
    same whatever brought it up.

    Refusing the demand closes that road entirely: the window does not appear, so there is
    nothing to counterfeit.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy ktoś na tym serwerze pracuje na koncie bez
    uprawnień administracyjnych i potrzebuje czasem wykonać czynność, która
    ich wymaga.

    Na serwerze zarządzanym wyłącznie przez administratorów zmiana nie robi
    nic. Konta administracyjne tego punktu nie dotyczą — ich żądania
    obsługuje osobne ustawienie.

    Skutek pojawia się tam, gdzie serwer udostępnia sesje zdalne zwykłym
    użytkownikom albo gdzie obsługa pracuje na koncie bez uprawnień
    i podnosi je doraźnie. Po zmianie żądanie zostanie odrzucone i nie
    będzie już możliwości wpisania cudzych poświadczeń w oknie. Właściwą
    drogą jest wtedy zalogowanie się na konto administracyjne, a nie
    podniesienie uprawnień w sesji użytkownika.

    Instalatory uruchamiane przez zwykłych użytkowników przestaną się
    kończyć powodzeniem. Jest to skutek zamierzony i dokładnie ten,
    o który w punkcie chodzi.

    Komunikat po odrzuceniu bywa lakoniczny i nie wskazuje przyczyny.
    Obsługa, która nie wie o zmianie, uzna to za awarię instalatora.

    Zmiana nie wymaga restartu.
  en: |
    What needs checking is whether anyone on this server works on an account without
    administrative rights and at times has to carry out a doing that takes them.

    On a server managed by administrators alone the change does nothing. Administrative
    accounts are not concerned by this item - their demands are served by a separate
    setting.

    The effect appears where the server puts up remote sessions to ordinary users or where
    support works on an account without rights and raises them as needed. After the change
    the demand will be refused and there will no longer be a means of typing somebody else's
    credentials into a window. The right road is then signing in to an administrative
    account rather than raising rights in a user's session.

    Installers started by ordinary users will stop ending in success. That is an intended
    effect and exactly the one the item is about.

    The message after a refusal is at times terse and shows no cause. Support that does not
    know of the change will hold it a fault of the installer.

    The change takes no restart.

implementation_consequences:
  impact_areas:
    - user-interface
    - remote-desktop
    - updates-and-servicing
    - accounts-and-passwords
  what_breaks:
    pl:
      - Instalatory uruchamiane przez zwykłych użytkowników przestają się kończyć powodzeniem
      - Nie da się już podnieść uprawnień w sesji użytkownika przez podanie cudzego hasła
      - Komunikat po odrzuceniu nie wskazuje przyczyny i bywa brany za awarię programu
      - Konta administracyjne nie są tym punktem objęte
    en:
      - Installers started by ordinary users stop ending in success
      - Rights can no longer be raised in a user's session by giving somebody else's password
      - The message after a refusal shows no cause and is at times taken for a fault of the program
      - Administrative accounts are not taken in by this item
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Obsługa serwera pracuje na koncie bez uprawnień i podnosi je poświadczeniami administratora
    en:
      - The server's support works on an account without rights and raises them with an administrator's credentials
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'ConsentPromptBehaviorUser'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $current = (Get-ItemProperty -Path $path -Name 'ConsentPromptBehaviorUser' -ErrorAction SilentlyContinue).'ConsentPromptBehaviorUser'
    [pscustomobject]@{
      path        = $path
      name        = 'ConsentPromptBehaviorUser'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ConsentPromptBehaviorUser' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-behavior-of-the-elevation-prompt-for-standard-users

notes:
  pl: |
    Punkt dotyczy kont bez uprawnień administracyjnych. Zachowanie przy
    kontach administracyjnych opisuje osobna wartość w tym samym kluczu
    i jest osobnym punktem benchmarku — oba trzeba czytać razem, bo same
    nazwy łatwo pomylić.

    Wartość zerowa oznacza odrzucenie żądania, nie ciche podniesienie
    uprawnień. Jest to rozróżnienie warte podkreślenia, bo zero w innych
    ustawieniach tej grupy znaczy właśnie „bez pytania podnieś".

    Punkt ma sens wyłącznie przy włączonej kontroli uprawnień. Przy
    wyłączonej opisuje zachowanie mechanizmu, którego nie ma.
  en: |
    The item concerns accounts without administrative rights. The behaviour at
    administrative accounts is described by a separate value in the same key and is a
    separate item of the benchmark - the two have to be read together, since the names alone
    are easily confused.

    The zero value means the demand being refused rather than rights being raised quietly.
    That distinction is worth stressing, since zero in other settings of this group means
    exactly "raise without asking".

    The item makes sense only with the control of rights switched on. With it off it
    describes the behaviour of a mechanism that is not there.
