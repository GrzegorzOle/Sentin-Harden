id: win2025-increase-scheduling-priority-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zwiększanie priorytetu planowania ograniczone
    en: Increasing scheduling priority restricted
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala podnieść priorytet procesu, czyli przesądzić, że
    system będzie go obsługiwał przed innymi.

    Planista systemu dzieli czas procesora między procesy według
    priorytetów i jest to mechanizm, który działa niezależnie od
    uprawnień. Proces o priorytecie wyższym dostaje procesor zawsze,
    gdy go zażąda — a proces o priorytecie najwyższym dostaje go
    także przed składnikami systemu.

    Zagrożeniem jest właśnie ten najwyższy zakres. Proces podniesiony
    do priorytetu czasu rzeczywistego potrafi zająć procesor na tyle
    skutecznie, że maszyna przestaje odpowiadać: usługi nie dostają
    czasu, zapis do dziennika nie nadąża, a zarządzanie zdalne nie
    dochodzi do skutku. Nie jest to awaria — system działa poprawnie,
    wykonując dokładnie to, o co go poproszono.

    Na serwerze skutek jest dotkliwszy niż na stanowisku roboczym
    z powodu zdalności. Maszyna, która przestała odpowiadać na
    zarządzanie, wymaga sięgnięcia po kartę zarządzającą albo konsolę
    hosta — a bywa, że po prostu po restart.

    Punkt zawęża wykaz do administratorów, dopuszczając obecność konta
    kontenerów systemowych.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    na doprowadzenie serwera do bezruchu bez wywołania żadnego błędu,
    którego mógłby ktoś szukać.
  en: |
    The right allows a process's priority to be raised, that is, it to be settled that the
    system will serve it before others.

    The system's scheduler divides the processor's time among processes by priority, and that
    is a mechanism working free of rights. A process of higher priority gets the processor
    whenever it asks - and a process of the highest priority gets it ahead of the system's own
    parts as well.

    The danger lies in that highest range. A process raised to real-time priority can take the
    processor so thoroughly that the machine stops answering: services get no time, the writing
    to the log falls behind, and remote management does not come about. It is no breakdown -
    the system works rightly, doing exactly what it was asked.

    On a server the effect bites harder than at a working station by reason of remoteness. A
    machine that has stopped answering management takes a reach for the management card or the
    host's console - and at times simply for a restart.

    The item narrows the list to administrators, allowing the presence of the system containers
    account.

    What an attacker gains while the item goes unmet: a way of bringing the server to a
    standstill without raising any error anybody might look for.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym prawo mają wyłącznie administratorzy, więc na
    większości serwerów naprawa nie zmienia niczego.

    Priorytety procesów pozostają takie, jakie są. Naprawa dotyczy
    tego, kto może je podnieść, a nie wartości bieżących.

    Obniżanie priorytetu własnego procesu nie wymaga tego prawa
    i działa dalej dla każdego. Jest to rozróżnienie warte zapamiętania,
    bo obawa o procesy uruchamiane z priorytetem obniżonym jest
    najczęstszym powodem odpuszczania tego punktu.

    Skutek dotyczy kont spoza grupy administratorów, którym prawo
    nadano dodatkowo. Na serwerze bywa to konto oprogramowania
    dostrajającego wydajność albo aplikacji, która przy starcie podnosi
    priorytet własnego procesu roboczego.

    Objaw jest wtedy cichy: aplikacja uruchamia się poprawnie, nie
    zgłasza błędu i działa z priorytetem zwykłym. Widać to wyłącznie
    jako pogorszenie czasów odpowiedzi pod obciążeniem, a więc trudno
    powiązać z przyczyną.
  en: |
    The change has no known side effects and takes no break.

    In the default state only administrators hold the right, so on most servers the mending
    changes nothing.

    Processes' priorities stay as they are. The mending bears on who may raise them rather than
    on the present values.

    Lowering one's own process's priority does not take this right and goes on working for
    everyone. That is a distinction worth keeping, since fear for processes started at a
    lowered priority is the commonest reason this item is let go.

    The effect concerns accounts outside the administrators' group that were granted the right
    besides. On a server that is at times the account of performance tuning software or of an
    application that at its start raises the priority of its own working process.

    The symptom is then quiet: the application starts rightly, reports no error and works at
    ordinary priority. It shows only as a worsening of answering times under load, and is
    therefore hard to tie to its cause.

implementation_consequences:
  impact_areas:
    - diagnostics-and-reporting
    - legacy-applications
    - virtualization-and-containers
  what_breaks:
    pl:
      - Aplikacja podnosząca priorytet własnego procesu roboczego będzie działać z priorytetem zwykłym
      - Objaw jest cichy — aplikacja nie zgłasza błędu, a czasy odpowiedzi pogarszają się pod obciążeniem
      - Obniżanie priorytetu nie wymaga tego prawa i działa dalej dla każdego
      - W stanie domyślnym prawo mają wyłącznie administratorzy i zmiana nie robi nic
    en:
      - An application raising its own working process's priority will work at ordinary priority
      - The symptom is quiet - the application reports no error while answering times worsen under load
      - Lowering priority does not take this right and goes on working for everyone
      - In the default state only administrators hold the right and the change does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Aplikacja o wymaganiach czasowych podnosi priorytet własnego procesu z konta spoza grupy administratorów
    en:
      - An application with timing requirements raises its own process's priority from an account outside the administrators' group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544(,S-1-5-90-0)?|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeIncreaseBasePriorityPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The window manager account stays in the list where it is already there,
    # since removing it makes the desktop's composition stutter under load.
    $export = Join-Path $env:TEMP ('sentin-read-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = '*S-1-5-32-544'
    if ($text -match '(?m)^SeIncreaseBasePriorityPrivilege\s*=\s*(.*)$') {
      if ($Matches[1] -match 'S-1-5-90-0') { $value = '*S-1-5-32-544,*S-1-5-90-0' }
    }
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeIncreaseBasePriorityPrivilege = ' + $value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeIncreaseBasePriorityPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/increase-scheduling-priority

notes:
  pl: |
    Sprawdzenie dopuszcza obecność konta zarządcy okien obok
    administratorów. Konto to bywa w wykazie domyślnie i jego usunięcie
    pogarsza płynność pulpitu pod obciążeniem, więc naprawa je
    zachowuje, jeżeli już tam jest.

    Obniżanie priorytetu nie wymaga tego prawa. Ograniczenie dotyczy
    wyłącznie podnoszenia.

    Punkt czyta się razem z prawem do zmiany przydziału pamięci. Oba
    pozwalają wpływać na warunki pracy procesów, przy czym to działa na
    osi czasu procesora, a tamto na osi pamięci.
  en: |
    The check allows the window manager's account beside the administrators. That account
    stands in the list by default at times, and removing it worsens the desktop's smoothness
    under load, so the mending keeps it where it is there already.

    Lowering priority does not take this right. The bound bears on raising alone.

    The item is read together with the right of changing a memory quota. Both allow the terms
    of processes' working to be bent, this one along the axis of the processor's time and that
    one along the axis of memory.
