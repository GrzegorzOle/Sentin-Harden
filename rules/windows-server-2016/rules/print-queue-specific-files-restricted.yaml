id: win2016-print-queue-specific-files-restricted

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Printers
  title:
    pl: Pliki towarzyszące kolejce przyjmowane tylko do katalogu sterowników
    en: Files accompanying a queue accepted only into the driver folder
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe przyjmować pliki towarzyszące kolejce wydruku wyłącznie
    do katalogu przeznaczonego na sterowniki wydruku.

    Sterownik drukarki rzadko przychodzi sam. Razem z nim idą pliki
    pomocnicze przypisane do konkretnej kolejki: profile kolorów, pliki
    ustawień, biblioteki dodatkowe. Bez tego ograniczenia miejsce ich
    zapisu wskazuje strona, która sterownik przysyła.

    Jest to rzecz poważniejsza, niż brzmi. Plik trafia tam, gdzie każe
    serwer wydruku, a zapisu dokonuje bufor wydruku — proces pracujący
    z uprawnieniami systemu. Otrzymujemy więc zapis dowolnego pliku
    w dowolnym miejscu, wykonany przez proces, któremu wolno wszystko,
    a wywołany przez wskazanie drukarki.

    Droga ta obchodzi ograniczenia nałożone przez cztery poprzednie reguły,
    bo nie jest instalacją sterownika. Jest kopiowaniem pliku przy okazji
    instalacji — i właśnie dlatego trzeba ją zamknąć osobno.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: zapis
    własnego pliku w dowolnym miejscu systemu plików, wykonany przez proces
    o uprawnieniach systemu, bez instalowania czegokolwiek.
  en: |
    The setting has files accompanying a print queue accepted only into the folder
    meant for print drivers.

    A printer driver seldom comes alone. Along with it go helper files tied to a
    particular queue: colour profiles, settings files, extra libraries. Without this
    limit the place they are written to is named by the side sending the driver.

    That is a graver thing than it sounds. The file goes where the print server
    says, and the writing is done by the print spooler - a process working with the
    system's rights. So we get the writing of any file in any place, done by a
    process allowed everything, and set going by the naming of a printer.

    That road goes round the limits laid down by the four rules before it, not being
    an installing of a driver. It is the copying of a file alongside an installing -
    and just for that it has to be shut apart.

    What an attacker gains while the item goes unmet: the writing of their own file
    anywhere in the file system, done by a process with the system's rights, without
    installing anything at all.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a sprawdzić trzeba, czy któryś ze sterowników
    używanych w organizacji wymaga plików poza katalogiem sterowników.

    W przeważającej części nie wymaga i wdrożenie nie zmienia nic. Sterowniki
    pisane zgodnie z zaleceniami producenta systemu trzymają swoje pliki
    tam, gdzie ta reguła je dopuszcza.

    Wyjątkiem bywają sterowniki urządzeń wielofunkcyjnych z rozbudowanym
    oprogramowaniem towarzyszącym — skanowanie, rozliczanie wydruków,
    odczyt kart. Te zapisują czasem pliki poza katalogiem sterowników
    i po wdrożeniu część ich możliwości przestanie działać.

    Objaw jest przy tym częściowy i to jest tu rzecz najtrudniejsza.
    Drukowanie działa, a przestaje działać funkcja poboczna: profil koloru
    się nie stosuje, rozliczanie nie widzi użytkownika, ustawienia wstępne
    znikają. Nikt nie łączy tego z zasadą wdrożoną tydzień wcześniej.

    Czego to nie psuje: drukowania jako takiego, kolejek udostępnianych,
    instalowania sterowników, usług.

    Wymaga zatrzymania usługi wydruku; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", and what has to be checked is whether any driver
    used in the organisation calls for files outside the driver folder.

    In the greater part it does not and the rollout changes nothing. Drivers written
    along the system maker's guidance keep their files where this rule allows them.

    The exception is at times drivers of multifunction devices with extensive
    software alongside - scanning, print accounting, card reading. Those at times
    write files outside the driver folder, and after the rollout some of their
    abilities will stop working.

    The symptom is besides a partial one, and that is the hardest thing here.
    Printing works, and it is a side function that stops: a colour profile is not
    applied, accounting does not see the user, preset settings vanish. Nobody ties
    that to a policy rolled out a week before.

    What this does not break: printing as such, shared queues, the installing of
    drivers, or services.

    Calls for the print service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Sterowniki urządzeń wielofunkcyjnych z oprogramowaniem towarzyszącym tracą część możliwości - skanowanie, rozliczanie wydrukow, odczyt kart
      - Objaw jest częściowy - drukowanie działa, a przestaje działać funkcja poboczna, więc nikt nie łączy tego z zasadą wdrożoną tydzień wcześniej
      - Profil koloru może się nie stosować, a ustawienia wstępne kolejki zniknąć
      - Drukowanie jako takie, kolejki udostępniane i instalowanie sterowników pozostają bez zmian
    en:
      - Drivers of multifunction devices with software alongside lose some abilities - scanning, print accounting, card reading
      - The symptom is a partial one - printing works and a side function stops, so nobody ties it to a policy rolled out a week before
      - A colour profile may fail to apply and a queue's preset settings may vanish
      - Printing as such, shared queues and the installing of drivers stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - W organizacji pracują urządzenia wielofunkcyjne, których oprogramowanie towarzyszące zapisuje pliki poza katalogiem sterowników
      - Rozliczanie wydruków albo odczyt kart opiera się tu na plikach kolejki trzymanych poza katalogiem sterowników
    en:
      - Multifunction devices work in the organisation whose accompanying software writes files outside the driver folder
      - Print accounting or card reading rests here on queue files kept outside the driver folder
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
      $name = 'CopyFilesPolicy'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    $name = 'CopyFilesPolicy'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Printers'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'CopyFilesPolicy' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/printing/point-and-print-default-behavior-change

notes:
  pl: |
    Punkt jest wart pokazania obok czterech reguł o instalowaniu sterowników,
    bo zamyka drogę, którą tamte zostawiają otwartą. Zastrzeżenie kto może
    instalować nie dotyczy kopiowania plików towarzyszących, a skutek bywa
    ten sam: cudzy plik w katalogu systemowym, zapisany procesem
    o uprawnieniach systemu.

    Jest to kolejny punkt, w którym pełna obrona wymaga wdrożenia wszystkich
    reguł bloku. Każda z nich osobno wygląda na wystarczającą i żadna nią
    nie jest.

    Częściowa postać skutku jest tu warta wpisania do podglądu przed
    wykonaniem. Reguła, która psuje funkcję poboczną i zostawia główną
    działającą, jest trudna do rozpoznania po fakcie, bo objaw nie wygląda
    na skutek zmiany zabezpieczeń.
  en: |
    The item is worth showing beside the four rules about installing drivers,
    shutting a road those leave open. Reserving who may install does not reach the
    copying of accompanying files, and the consequence is at times the same: an
    outsider's file in a system folder, written by a process with the system's
    rights.

    It is another item where a full defence calls for every rule of the block to be
    rolled out. Each of them apart looks sufficient and none of them is.

    The partial form of the consequence is worth writing into the preview before
    execution. A rule that breaks a side function and leaves the main one working is
    hard to recognise after the fact, the symptom not looking like the upshot of a
    change in protections.
