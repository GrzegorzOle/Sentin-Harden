id: win2016-netbt-node-type-point-to-point

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Tryb rozwiązywania nazw starszego mechanizmu ustawiony na punkt-punkt
    en: The older net mechanism set to resolve names point to point
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe starszemu mechanizmowi sieciowemu pytać o nazwę
    wyłącznie wyznaczonego serwera, zamiast rozgłaszać pytanie do całego
    segmentu.

    Mechanizm ten ma cztery tryby pracy i różnią się one jedną rzeczą: czy
    wolno pytać rozgłoszeniem. Tryb domyślny na maszynie bez wskazanego
    serwera nazw zaczyna właśnie od rozgłoszenia, więc maszyna sama z siebie
    ogłasza w segmencie, czego szuka, i przyjmuje pierwszą odpowiedź.

    Tryb wymagany usuwa rozgłoszenie całkowicie. Pytanie idzie do serwera
    wskazanego w konfiguracji, a odpowiedź pochodzi stamtąd albo nie ma jej
    wcale. Zgadywanie przestaje być częścią rozwiązywania nazw.

    Wartość tej zmiany bierze się z tego, że zamyka ona wzorzec u samego
    źródła. Reguła o rozgłoszeniu w segmencie zamyka jedną warstwę
    i zostawia tę; ta zamyka tę i zostawia tamtą. Ochronę daje dopiero
    zamknięcie obu, bo maszyna próbuje ich po kolei.

    Zmiana ma jeszcze skutek uboczny, korzystny i rzadko wymieniany: znika
    znaczna część ruchu rozgłoszeniowego w segmencie, którego nikt nie
    czyta, a który każdy musi przyjąć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pytania
    rozgłaszane do segmentu przez starszą warstwę nazw, czyli tę samą okazję
    do podania fałszywej odpowiedzi, którą zamyka reguła sąsiednia — tyle że
    inną drogą.
  en: |
    The setting has the older net mechanism ask after a name of an appointed server
    alone, instead of calling the question out to the whole segment.

    The mechanism has four modes of working, and they differ in one thing: whether
    calling out is allowed. The default mode on a machine with no named name server
    begins with just that calling out, so the machine of its own accord announces in
    the segment what it is looking for and takes the first answer.

    The required mode removes the calling out altogether. The question goes to the
    server named in the configuration, and the answer comes from there or there is
    none at all. Guessing ceases to be part of resolving names.

    The value of this change comes of its shutting the pattern at its very source.
    The rule on calling out in the segment shuts one layer and leaves this one; this
    one shuts this and leaves that. Protection comes only of shutting both, since
    the machine tries them in turn.

    The change has one more side effect, welcome and seldom named: a good part of
    the calling-out traffic in the segment disappears - traffic nobody reads and
    everybody must take in.

    What an attacker gains while the item goes unmet: questions called out to the
    segment by the older name layer, which is to say the same opening for a false
    answer that the neighbouring rule shuts - only by another road.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia", i to z dwóch niezależnych powodów.

    Pierwszy jest techniczny: zmiana zaczyna obowiązywać dopiero po
    ponownym uruchomieniu maszyny. Nie da się jej wprowadzić w trakcie
    pracy i sprawdzić od razu, więc skutek pojawia się w oknie serwisowym,
    a nie przy kliknięciu.

    Drugi jest praktyczny. Tryb punkt-punkt wymaga, żeby maszyna miała
    wskazany serwer nazw dla tej warstwy — a jeśli go nie ma, rozwiązywanie
    nazw tą drogą przestaje działać zupełnie, bo rozgłoszenie było jedynym
    sposobem, jakiego używała. Jest to najważniejsza rzecz do sprawdzenia
    przed wdrożeniem i sprawdzenie trwa chwilę.

    Skutki po zmianie dotyczą tego, co odnajduje zasoby po nazwie krótkiej:
    starsze aplikacje, odwołania do udziałów bez pełnej nazwy, część drukarek
    sieciowych, skrypty logowania. Tam, gdzie nazwa jest wpisana w pełnej
    postaci, nic się nie zmienia.

    Objaw bywa opóźniony, bo nazwy raz rozwiązane siedzą w pamięci podręcznej
    maszyny i przestają działać dopiero po jej wyczyszczeniu albo po
    restarcie — co akurat tutaj następuje.

    Czego to nie psuje: rozwiązywania nazw przez serwer nazw właściwy,
    nazw pełnych, łączności po adresie, udziałów wskazywanych pełną nazwą.

    Wymaga ponownego uruchomienia maszyny.
  en: |
    The class is "needs a planned rollout", and that for two independent reasons.

    The first is technical: the change takes hold only after the machine is started
    again. It cannot be made in the course of work and checked at once, so the
    effect appears in a maintenance window rather than at a click.

    The second is practical. Point-to-point mode calls for the machine to have a
    name server named for this layer - and if it has none, name resolution by this
    road stops working altogether, since calling out was the only way it used. That
    is the chief thing to check before rollout, and the check takes a moment.

    The consequences after the change concern whatever finds resources by a short
    name: older applications, references to shares without a full name, some network
    printers, sign-in scripts. Where the name is written in its full form, nothing
    changes.

    The symptom is at times delayed, since names once resolved sit in the machine's
    cache and stop working only once it is cleared or after a restart - which here
    happens anyway.

    What this does not break: name resolution by the proper name server, full names,
    connectivity by address, or shares pointed at by a full name.

    Calls for the machine to be started again.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Bez wskazanego serwera nazw dla tej warstwy rozwiązywanie nazw tą drogą przestaje działać zupełnie, bo rozgłoszenie było jedynym używanym sposobem
      - Starsze aplikacje, udziały wskazywane nazwą krótką i część drukarek sieciowych przestają odnajdywać zasoby
      - Skrypty logowania odwołujące się do zasobów nazwą krótką zgłaszają błąd przy następnym logowaniu
      - Rozwiązywanie nazw przez serwer nazw właściwy, nazwy pełne i łączność po adresie pozostają bez zmian
    en:
      - With no name server named for this layer, name resolution by this road stops working altogether, since calling out was the only way used
      - Older applications, shares pointed at by a short name and some network printers cease to find resources
      - Sign-in scripts referring to resources by a short name report an error at the next sign-in
      - Name resolution by the proper name server, full names and connectivity by address stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna nie ma wskazanego serwera nazw dla tej warstwy, a zasoby odnajduje dziś przez rozgłoszenie
      - Nie ma okna serwisowego na ponowne uruchomienie maszyny, a zmiana bez niego nie obowiązuje
    en:
      - The machine has no name server named for this layer and finds resources today by calling out
      - There is no maintenance window for starting the machine again, and without one the change does not hold
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
      $name = 'NodeType'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
    $name = 'NodeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'NodeType' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Punkt jest bliźniakiem reguły o rozgłoszeniu w segmencie i oba trzeba
    wdrażać razem. Zamykają ten sam wzorzec w dwóch warstwach, a maszyna
    próbuje ich po kolei — zamknięcie jednej przesuwa tylko ruch do drugiej
    i nie daje żadnej ochrony. Aplikacja powinna pokazywać je obok siebie
    i mówić o tej zależności wprost, bo osobno każdy z nich wygląda na
    wystarczający.

    Wymóg ponownego uruchomienia odróżnia ten punkt od sąsiednich
    i przesądza o jego klasie. Warto to powiedzieć przy regule, bo
    użytkownik zaznaczający cały blok rozwiązywania nazw powinien wiedzieć,
    że akurat ten element wymaga okna serwisowego.

    Sprawdzenie, czy maszyna ma wskazany serwer nazw dla tej warstwy,
    powinno być częścią symulacji przed wykonaniem. Jest to jedyny warunek,
    którego niespełnienie zamienia zmianę porządkową w awarię.
  en: |
    The item is a twin of the rule on calling out in the segment, and the two must
    be rolled out together. They shut the same pattern in two layers, and the
    machine tries them in turn - shutting one only moves the traffic to the other
    and gives no protection at all. The application should show them side by side
    and say so outright, since apart each looks sufficient.

    The call for a restart sets this item off from its neighbours and settles its
    class. It is worth saying at the rule, since a user ticking the whole
    name-resolution block ought to know that this element in particular calls for a
    maintenance window.

    Checking whether the machine has a name server named for this layer should be
    part of the simulation before execution. It is the one condition whose failure
    turns a tidying change into a breakdown.
