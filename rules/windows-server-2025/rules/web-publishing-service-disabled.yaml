id: win2025-web-publishing-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa publikowania w sieci World Wide Web wyłączona
    en: The World Wide Web publishing service disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę obsługującą witryny sieciowe. Usługa ta
    nasłuchuje na połączenia, przyjmuje żądania z sieci i uruchamia kod
    aplikacji, które na tej maszynie stoją.

    Zostawiam kategorię wysoką. Serwer sieciowy jest usługą, którą widać
    z zewnątrz, która przyjmuje dane od nieznanych stron i która wykonuje
    kod w odpowiedzi na te dane. Jest to najczęściej wykorzystywana droga
    wejścia do serwerów w ogóle, a jej powierzchnia nie ogranicza się do
    samej usługi — obejmuje każdą aplikację, którą ta usługa uruchamia.

    Chcę jednak zwrócić uwagę na rzecz, która przy tej regule jest
    ważniejsza niż opis ryzyka, bo decyduje o tym, czy w ogóle warto ją
    czytać na danej maszynie.

    Wynik czerwony przy tym punkcie znaczy, że rola serwera sieciowego na
    tej maszynie jest zainstalowana. Bardzo często nie została
    zainstalowana świadomie. Rola ta bywa dokładana jako zależność
    czegoś innego: konsoli zarządzania, narzędzia raportowego producenta,
    mechanizmu wystawiania certyfikatów przez stronę, panelu
    administracyjnego aplikacji biznesowej. Zdanie „to nie jest serwer
    sieciowy" jest w takich przypadkach nieprawdziwe, choć wypowiadane
    w dobrej wierze.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: usługę
    przyjmującą żądania z sieci i wykonującą kod, na maszynie, o której
    nikt nie pamięta, że taką usługę ma.
  en: |
    The item switches off the service that handles sites of the net. That service listens for
    bindings, takes askings off the net and runs the code of the applications that stand upon that
    machine.

    I leave the category high. A server of the net is a service seen from without, taking data of
    unknown sides and carrying out code in answer to those data. It is the most used road into
    servers at all, and its face is not bounded to the service itself - it takes in every application
    that service runs.

    I would, though, draw heed to a thing that at this rule weighs more than the setting forth of the
    hazard, it settling whether the rule be worth reading at all upon a given machine.

    A red outcome at this item means the role of a server of the net is installed upon that machine.
    Very often it was not installed wittingly. That role is at times set alongside as a hanging of
    something else - of a board of ruling, of a maker's tool of reports, of a working that gives out
    tokens through a page, of a board of ruling of an application of business. The sentence "this is
    no server of the net" is in such cases untrue, though spoken in good faith.

    What an attacker gains while the item goes unmet - a service taking askings off the net and
    carrying out code, upon a machine whereof nobody remembers that it has such a service.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia". Jest to najbardziej
    wyrazisty przykład reguły, która na jednej maszynie jest oczywistym
    utwardzeniem, a na drugiej poleceniem wyłączenia tego, po co serwer
    postawiono.

    Na serwerze sieciowym zatrzymanie tej usługi zatrzymuje witryny.
    Połączenia otwarte w tej chwili zostają zerwane, a to znaczy: przerwane
    zamówienie, przerwane wgrywanie pliku, przerwana sesja pracy w
    aplikacji. Nie jest to punkt do wdrożenia — jest to punkt do zapisania
    jako wyjątek, z uzasadnieniem i datą przeglądu, a samą usługę należy
    utwardzać osobno, tym, co jest właściwe serwerom sieciowym.

    Na maszynie, na której rola została doinstalowana jako zależność
    czegoś innego, sprawa wygląda odwrotnie i jest to najlepsza możliwa
    okazja do zamknięcia drogi, o której nikt nie pamięta. Zanim jednak
    ją zamkniesz, ustal, co tę rolę dołożyło — bo zatrzymanie usługi
    zatrzyma również tamto, a objaw pojawi się po stronie narzędzia, nie
    po stronie serwera sieciowego.

    Sprawdzenie sprowadza się do jednego kroku, który zajmuje chwilę
    i rozstrzyga wszystko: wypisz witryny stojące na tej maszynie.
    Pusto albo jedna domyślna — zamykaj. Cokolwiek innego — czytaj dalej,
    zanim ruszysz.

    Zmiana cofa się natychmiast i wymaga uruchomienia usługi z powrotem.
  en: |
    I leave the class "needs a witting rolling out". It is the plainest showing of a rule that upon
    the one machine is a plain hardening and upon the other a bidding to switch off that for which
    the server was set up.

    Upon a server of the net the stopping of that service stops the sites. The bindings open at that
    hour are broken off, and that means - an ordering broken off, an uploading of a file broken off,
    a sitting of work in an application broken off. It is no item to be rolled out - it is an item to
    be written down as an exception, with a standing by it and a day of looking over, and the service
    itself is to be hardened apart, by what befits servers of the net.

    Upon a machine whereon the role was set alongside as a hanging of something else the matter looks
    the other way, and it is the best hap there could be for the shutting of a road nobody remembers.
    Before you shut it, though, settle what set that role alongside - for the stopping of the service
    will stop that too, and the symptom will come forth on the tool's side and not on the side of the
    server of the net.

    The checking comes to one step that takes a moment and settles everything - write out the sites
    standing upon that machine. Empty, or one that is there by default - shut it. Anything else -
    read on before you stir.

    The change is undone at once and takes the starting of the service again.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - network-and-firewall
  what_breaks:
    pl:
      - Witryny obsługiwane przez tę maszynę przestają odpowiadać
      - Połączenia otwarte w tej chwili zostają zerwane, w tym trwające zamówienia i wgrywanie plików
      - Narzędzie, które doinstalowało rolę serwera sieciowego jako zależność, przestaje działać
      - Objaw pojawia się po stronie tego narzędzia, a nie po stronie serwera sieciowego
      - Wynik czerwony znaczy, że rola jest zainstalowana, choć często nie została zainstalowana świadomie
    en:
      - The sites this machine handles stop answering
      - The bindings open at that hour are broken off, among them lasting orderings and the uploading of files
      - The tool that set the role of a server of the net alongside as a hanging stops working
      - The symptom comes forth on that tool's side and not on the side of the server of the net
      - A red outcome means the role is installed, though often it was not installed wittingly
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna obsługuje witryny i rola serwera sieciowego jest jej rolą
      - Nie ustalono, co doinstalowało tę rolę, ani nie wypisano witryn stojących na maszynie
    en:
      - The machine handles sites and the role of a server of the net is its role
      - It was not settled what set that role alongside, nor were the sites standing upon the machine written out
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # List the sites on this machine first. Empty or one default site means the
    # role came along with something else - find out what, because stopping
    # this stops that too, and the symptom appears on the tool's side.
    Stop-Service -Name 'W3SVC' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'W3SVC' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'W3SVC' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/get-started/introduction-to-iis/introduction-to-iis-architecture

