id: win2016-password-max-age

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Account Policies > Password Policy
  title:
    pl: Okres ważności hasła ograniczony i różny od nieskończoności
    en: Password lifetime limited and not endless
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wymaga, żeby hasło miało termin ważności i żeby termin ten nie był
    dłuższy niż rok.

    Wygasanie hasła nie broni przed jego złamaniem. Broni przed czymś innym:
    przed tym, żeby hasło raz zdobyte było ważne bez końca. Napastnik, który
    wszedł w posiadanie hasła rok temu i nie zrobił z nim nic głośnego, ma
    dostęp do dziś — i nie potrzebuje niczego więcej.

    Na serwerze ten wzorzec jest regułą, a nie wyjątkiem. Hasło konta
    lokalnego administratora, podane kiedyś wykonawcy przy wdrożeniu,
    zapisane w dokumentacji projektu i nigdy niezmienione, jest dostępem
    trwałym udzielonym osobie, która dawno przestała mieć z maszyną cokolwiek
    wspólnego.

    Na tym wydaniu systemu rzecz ma szczególne znaczenie, bo serwer 2016 stoi
    zwykle długo. Im dłużej maszyna pracuje bez wygasania haseł, tym więcej
    ludzi zdążyło przez nią przejść i tym dłuższa jest lista osób, które
    wciąż mogłyby się zalogować.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dostęp
    bezterminowy. Jednorazowe zdobycie hasła zamienia się w obecność stałą,
    niezależną od tego, czy ktokolwiek zauważył pierwotne wejście.

    Rok jest granicą górną benchmarku, nie zaleceniem. Sens tego punktu nie
    leży w częstotliwości zmian, tylko w istnieniu terminu w ogóle.
  en: |
    The item requires a password to have an expiry date, and that date to be no
    further off than a year.

    Password expiry does not defend against a password being broken. It
    defends against something else: against a password, once obtained, being
    valid forever. An attacker who came by a password a year ago and did
    nothing loud with it still has access today - and needs nothing more.

    On a server that pattern is the rule rather than the exception. The
    password of the local administrator account, handed to a contractor at
    deployment, written into the project documentation and never changed, is
    permanent access granted to somebody who long ago stopped having anything
    to do with the machine.

    On this release it matters particularly, because a Server 2016 machine
    usually stands for a long time. The longer a machine runs without password
    expiry, the more people have passed through it and the longer the list of
    those who could still sign in.

    What an attacker gains while the item goes unmet: access with no end date.
    A single capture of a password turns into a permanent presence, regardless
    of whether anybody noticed the original entry.

    A year is the benchmark's upper bound, not a recommendation. The point of
    this item lies not in how often passwords change but in there being a term
    at all.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i powód jest konkretny: wraz z tą
    zmianą wszystkie hasła na maszynie dostają termin, a część z nich może
    wygasnąć niemal natychmiast.

    Hasło ma wiek liczony od ostatniej zmiany, a nie od dnia wdrożenia
    reguły. Konto, którego hasła nie zmieniano od trzech lat, po wprowadzeniu
    terminu rocznego jest hasłem przeterminowanym w tej samej chwili.
    Człowiek zobaczy wtedy żądanie zmiany przy najbliższym logowaniu; konto
    usługowe nie zobaczy nic — po prostu przestanie się uwierzytelniać.

    To jest najważniejsza rzecz do sprawdzenia przed uruchomieniem tej
    reguły: które konta na tej maszynie mają hasło starsze niż nowy termin
    i które z nich są kontami usług, zadań harmonogramu albo pul aplikacji.
    Konto usługowe z wygasłym hasłem zatrzymuje usługę, a nie zgłasza się do
    działu wsparcia.

    Na serwerze 2016 osobnej uwagi wymagają usługi uruchamiane na koncie
    domenowym o stałym haśle — układ typowy dla instalacji z tego okresu,
    w których nie korzystano jeszcze z kont zarządzanych przez system.

    Na serwerze członkowskim zasada obejmuje konta lokalne. Na kontrolerze
    domeny obejmuje całą domenę.

    Zmiana nie wymaga restartu, ale skutek bywa natychmiastowy.
  en: |
    The class is "needs planned rollout", and the reason is concrete: with this
    change every password on the machine gains a term, and some of them may
    expire almost at once.

    A password's age is counted from its last change, not from the day the rule
    is applied. An account whose password has not been changed for three years
    is, the moment a one-year term is introduced, a password already past its
    date. A person will then see a demand to change it at the next sign-in; a
    service account will see nothing - it will simply stop authenticating.

    That is the most important thing to check before running this rule: which
    accounts on this machine have a password older than the new term, and which
    of those are accounts of services, scheduled tasks or application pools. A
    service account with an expired password stops a service; it does not raise
    a support ticket.

    On Server 2016 particular attention is due to services running under a
    domain account with a fixed password - an arrangement typical of
    installations from that period, before system-managed accounts were in
    common use.

    On a member server the policy covers local accounts. On a domain controller
    it covers the whole domain.

    The change needs no restart, but the effect can be immediate.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
    - remote-management
  what_breaks:
    pl:
      - Konta z hasłem starszym niż nowy termin są przeterminowane natychmiast, a nie po roku
      - Usługi, zadania harmonogramu i pule aplikacji na koncie ze stałym hasłem przestają się uwierzytelniać bez żadnego zgłoszenia
      - Ludzie zobaczą żądanie zmiany hasła przy najbliższym logowaniu
      - Na kontrolerze domeny zmiana obejmuje wszystkie konta w domenie naraz
    en:
      - Accounts with a password older than the new term are past their date at once, not in a year
      - Services, scheduled tasks and application pools under an account with a fixed password stop authenticating with no ticket raised
      - People will see a demand to change their password at the next sign-in
      - On a domain controller the change covers every account in the domain at once
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie pracują usługi na koncie ze stałym hasłem, a procedura jego zmiany nie jest znana
      - Serwer jest kontrolerem domeny, a zmiana zasady domeny nie została uzgodniona
    en:
      - Services run on the machine under an account with a fixed password and the procedure for changing it is not known
      - The server is a domain controller and a change to the domain policy has not been agreed
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas SECURITYPOLICY 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') {
          # -1 means "never expires". It must not pass an upper-bound comparison
          # as if it were the smallest possible number of days.
          if ([int]$Matches[1] -lt 1) { 'NEVER' } else { $Matches[1] }
        } else { 'CHECK_ERROR' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '365'
  comparison: not-greater-than

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas SECURITYPOLICY /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^MaximumPasswordAge\s*=\s*(-?\d+)') { $value = $Matches[1] }
    [pscustomobject]@{
      setting = 'MaximumPasswordAge'
      value   = $value
      existed = ($value -ne '')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A password's age counts from its last change, not from today. Accounts
    # whose password is older than the new term expire the moment this runs -
    # check the service accounts before, not after.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      'MaximumPasswordAge = 365',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[System Access]',
      ('MaximumPasswordAge = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas SECURITYPOLICY /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/maximum-password-age

notes:
  pl: |
    Pułapka odczytu: zero i minus jeden znaczą „hasło nie wygasa nigdy", a przy
    porównaniu „nie więcej niż" wyglądałyby na wartość najlepszą z możliwych.
    Polecenie audytu zwraca w takim przypadku słowo zamiast liczby, żeby
    raport nie pokazał zgodności tam, gdzie termin nie istnieje.

    Reguła działa w parze z pamięcią poprzednich haseł. Sam termin bez
    historii prowadzi do ustawiania w kółko tego samego hasła, a sama historia
    bez terminu nie robi nic, bo nic nie wymusza zmiany.

    Kategoria średnia, bo punkt nie zamyka drogi wejścia — skraca czas, przez
    który raz zdobyte hasło pozostaje ważne.
  en: |
    A reading trap: zero and minus one mean "the password never expires", and
    under a "not greater than" comparison they would look like the best
    possible value. The audit command returns a word instead of a number in
    that case, so the report does not show compliance where no term exists.

    The rule works as a pair with the memory of previous passwords. A term
    without a history leads to the same password being set over and over, and a
    history without a term does nothing, because nothing forces a change.

    The category is medium, because the item closes no way in - it shortens the
    time for which a password, once obtained, stays valid.
