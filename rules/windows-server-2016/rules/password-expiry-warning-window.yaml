id: win2016-password-expiry-warning-window

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Uprzedzenie o wygaśnięciu hasła od 5 do 14 dni wcześniej
    en: Warning of password expiry between 5 and 14 days ahead
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie określa, na ile dni przed wygaśnięciem hasła system zaczyna
    o tym uprzedzać, i wymaga okna od pięciu do czternastu dni.

    Punkt wygląda na kosmetyczny i w kategoriach ryzyka taki jest. Jego treść
    leży gdzie indziej: to reguła, która broni polityki haseł przed nią samą.

    Mechanizm jest następujący. Hasło wygasające bez uprzedzenia zastaje
    człowieka w złym momencie — przed spotkaniem, w trakcie pracy, zdalnie,
    bez dostępu do konsoli. Wymyślone wtedy hasło jest zawsze najgorszym
    z możliwych: krótkie, oparte na poprzednim, zapisane na kartce, żeby nie
    wypaść z rytmu. Dokładnie to, czemu polityka haseł miała zapobiec.

    Zbyt wczesne uprzedzenie działa odwrotnie, ale z tym samym skutkiem.
    Komunikat pokazywany przez miesiąc przestaje być komunikatem i staje się
    tłem, które się zamyka odruchowo. Gdy hasło faktycznie wygasa, jest to
    zaskoczenie mimo trzydziestu ostrzeżeń.

    Okno od pięciu do czternastu dni jest kompromisem: dość długie, żeby
    zmieścić w nim urlop i weekend, dość krótkie, żeby komunikat zachował
    znaczenie.

    Na serwerze punkt dotyczy głównie kont administracyjnych, które logują
    się rzadziej i którym łatwiej przegapić ostrzeżenie pokazywane wyłącznie
    przy logowaniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasła
    wymyślane w pośpiechu, czyli dokładnie te, które łamie się najszybciej.
  en: |
    The setting states how many days before a password expires the system begins to
    warn of it, and requires a window of between five and fourteen days.

    The item looks cosmetic and in terms of risk it is. Its substance lies
    elsewhere: it is a rule that defends the password policy against itself.

    The mechanism runs thus. A password expiring without warning catches a person at
    a bad moment - before a meeting, mid-work, from afar, with no access to the
    console. The password thought up then is always the worst possible: short, built
    on the previous one, written on a slip of paper so as not to fall out of step.
    Exactly what the password policy was to prevent.

    Warning too early works the other way but to the same effect. A message shown
    for a month stops being a message and becomes background, closed by reflex. When
    the password does expire it is a surprise despite thirty warnings.

    A window of five to fourteen days is a compromise: long enough to hold a holiday
    and a weekend, short enough for the message to keep its meaning.

    On a server the item concerns chiefly administrative accounts, which sign in
    more rarely and which more easily miss a warning shown only at sign-in.

    What an attacker gains while the item goes unmet: passwords thought up in haste,
    which is to say exactly those that are cracked fastest.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Zmiana dotyczy tego, kiedy pojawia się
    powiadomienie, i niczego poza tym. Nie zmienia ani daty wygaśnięcia hasła,
    ani wymagań co do jego postaci, ani zachowania konta po wygaśnięciu.

    Jedyną odczuwalną rzeczą jest to, że komunikat zaczyna pojawiać się
    wcześniej albo później niż dotąd. Przy skróceniu okna trafia się na osoby,
    które przyzwyczaiły się widzieć ostrzeżenie z dużym wyprzedzeniem —
    i to jest cała lista skutków.

    Warto jednak wiedzieć, że powiadomienie pokazuje się przy logowaniu.
    Konto, które loguje się do tej maszyny raz na miesiąc, może nie zobaczyć
    go wcale, niezależnie od ustawionej wartości. Reguła tego nie naprawia
    i nie udaje, że naprawia.

    Czego to nie psuje: logowania, daty wygaśnięcia hasła, zmiany hasła,
    kont usług ani zadań zaplanowanych.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The change concerns when the notice appears and
    nothing besides. It alters neither the password's expiry date, nor the
    requirements as to its form, nor the account's behaviour once it has expired.

    The one noticeable thing is that the message begins appearing earlier or later
    than before. Shortening the window meets people accustomed to seeing the warning
    well in advance - and that is the whole list of effects.

    It is worth knowing, though, that the notice is shown at sign-in. An account
    signing in to this machine once a month may not see it at all, whatever value is
    set. The rule does not mend that and does not pretend to.

    What this does not break: signing in, the password's expiry date, changing a
    password, service accounts, or scheduled tasks.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Brak regresji w działaniu — zmienia się wyłącznie moment pokazania powiadomienia
      - Osoby przyzwyczajone do ostrzeżenia z dużym wyprzedzeniem zobaczą je później niż dotąd
      - Konto logujące się do tej maszyny rzadziej niż raz na dwa tygodnie może nie zobaczyć powiadomienia wcale
      - Data wygaśnięcia hasła, wymagania co do jego postaci i konta usług pozostają bez zmian
    en:
      - No regression in the working - only the moment the notice is shown changes
      - People accustomed to a warning well in advance will see it later than before
      - An account signing in to this machine less often than once a fortnight may not see the notice at all
      - The password expiry date, the requirements as to its form and service accounts stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — ustawienie dotyczy wyłącznie momentu powiadomienia i nie zmienia zasad haseł
    en:
      - No known contraindication - the setting concerns only the moment of the notice and changes no password rules
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The item sets a range, not a single value, so both ends are reported apart.
      # A value below the range and a value above it are different mistakes and a
      # report should not merge them into one.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
      $name = 'PasswordExpiryWarning'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -lt 5) { 'BELOW_RANGE ' + $value }
        elseif ([int]$value -gt 14) { 'ABOVE_RANGE ' + $value }
        else { 'WITHIN_RANGE' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'WITHIN_RANGE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    $name = 'PasswordExpiryWarning'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Fourteen days is the upper end of the range the item allows, and the safer
    # one: a shorter window is more easily swallowed by a holiday.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PasswordExpiryWarning' -Value 14 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/interactive-logon-prompt-user-to-change-password-before-expiration

notes:
  pl: |
    Audyt zgłasza osobno wartość poniżej zakresu i osobno powyżej. Są to dwa
    różne błędy i dwie różne naprawy — zbyt krótkie okno zaskakuje człowieka,
    zbyt długie uczy go ignorować ostrzeżenie. Sklejenie ich w jeden wynik
    „niezgodne" ukryłoby tę różnicę przed osobą czytającą raport.

    Wartość wpisywana przez regułę to czternaście dni, czyli górny koniec
    dopuszczalnego zakresu. Jest to wybór świadomy: krótsze okno łatwiej
    przepada w trakcie urlopu, a skutkiem jest hasło wymyślane w pośpiechu
    pierwszego dnia po powrocie.

    Punkt ma sens wyłącznie tam, gdzie hasła w ogóle wygasają. W organizacji,
    która odeszła od wygasania haseł na rzecz dłuższych haseł i drugiego
    składnika, reguła jest zgodna i bez znaczenia.
  en: |
    The audit reports a value below the range apart from one above it. These are two
    different mistakes and two different mends - too short a window takes a person
    by surprise, too long a one teaches them to ignore the warning. Merging them
    into a single "non-compliant" result would hide that difference from whoever
    reads the report.

    The value the rule writes is fourteen days, the upper end of the allowed range.
    The choice is a deliberate one: a shorter window is more easily lost inside a
    holiday, and the outcome is a password thought up in haste on the first day
    back.

    The item makes sense only where passwords expire at all. In an organisation that
    has moved away from expiry in favour of longer passwords and a second factor,
    the rule is compliant and beside the point.
