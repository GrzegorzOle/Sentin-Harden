id: win10-uac-virtualize-write-failures

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Nieudane zapisy starszych programów przekierowane do profilu
    en: Failed writes by older programs redirected into the profile
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że gdy starszy program próbuje zapisać do miejsca
    chronionego — katalogu systemowego albo gałęzi rejestru wspólnej dla
    maszyny — zapis nie kończy się błędem, tylko trafia do kopii
    umieszczonej w profilu użytkownika.

    Mechanizm powstał dla zgodności, nie dla bezpieczeństwa, i właśnie
    stąd bierze się jego wartość ochronna. Programy pisane przed
    wprowadzeniem kontroli konta zakładały, że mogą pisać wszędzie.
    Bez przekierowania jedynym sposobem na ich uruchomienie jest nadanie im
    pełnych uprawnień, a to znaczy uruchamianie codziennej pracy z prawami
    do całej maszyny.

    Przekierowanie zdejmuje tę presję. Program dostaje zapis, który mu się
    udaje, i pracuje dalej bez uprawnień. Zapis ten jest przy tym osobny dla
    każdego użytkownika, więc program uruchomiony przez jedną osobę nie
    zmienia tego, co widzi druga.

    Reguła jest przy tym cicha. Dotyczy wyłącznie programów działających bez
    podniesienia — te podniesione piszą tam, gdzie chciały. Programów
    sześćdziesięcioczterobitowych nie dotyczy w ogóle, bo dla nich
    przekierowanie nie działa.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pretekst do
    nadania codziennej pracy pełnych uprawnień, bo inaczej starsze programy
    nie ruszą.
  en: |
    The setting makes an older program's write to a guarded place - a system directory or a registry branch
    shared by the machine - land in a copy set inside the user's profile instead of ending in an error.

    The mechanism came about for compatibility, not for security, and from just there its protective value
    comes. Programs written before the control was brought in took it that they might write anywhere. Without
    the redirection the only way of running them is to give them full rights, and that means everyday work
    running with rights to the whole machine.

    The redirection lifts that pressure. The program gets a write that succeeds and carries on without rights.
    That write is at the same time separate for each user, so a program run by one person does not change what
    another sees.

    The rule is a quiet one. It touches only programs running unelevated - those elevated write where they meant
    to. It does not touch sixty-four-bit programs at all, the redirection not working for them.

    What an attacker gains while the item goes unmet: a pretext for giving everyday work full rights, older
    programs not starting otherwise.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie to jest domyślnie włączone i reguła zwykle tylko potwierdza
    stan zastany. Tam, gdzie zostało wyłączone, włączenie go wraca do
    zachowania, pod które pisano oprogramowanie starsze.

    Nie ma znanych regresji. Kierunek zmiany jest łagodzący: zapis, który
    dotąd kończył się błędem, zaczyna się udawać.

    Jedyna rzecz warta odnotowania dotyczy nie psucia, lecz mylenia.
    Administrator szukający pliku zapisanego przez program starszy nie
    znajdzie go w katalogu systemowym, bo leży w profilu. Nie jest to
    regresja, ale bywa mylące przy szukaniu.

    Zmiana wchodzi bez restartu i cofa się natychmiast.

    Czego to nie psuje: programów nowszych, programów uruchamianych
    z podniesieniem, aplikacji ze sklepu, usług systemowych, sieci,
    profili.
  en: |
    The class is "no disruption".

    The setting is on by default and the rule as a rule only confirms the state found. Where it has been
    switched off, switching it on returns to the behaviour older software was written for.

    There are no known regressions. The change's direction is a softening one: a write that until now ended in
    an error begins to succeed.

    The one thing worth noting touches not breaking but misleading. An administrator looking for a file written
    by an older program will not find it in the system directory, it lying in the profile. That is no
    regression, but it misleads at times while searching.

    The change takes hold without a restart and undoes itself at once.

    What this does not break: newer programs, programs run with elevation, store applications, system services,
    the network, or profiles.

implementation_consequences:
  impact_areas:
    - legacy-applications
  what_breaks:
    pl:
      - Plik zapisany przez starszy program nie leży w katalogu systemowym, tylko w profilu, co myli przy szukaniu
      - Dwoje ludzi uruchamiających ten sam starszy program widzi własne kopie zapisów zamiast jednej wspólnej
      - Programy sześćdziesięcioczterobitowe nie są objęte przekierowaniem i ich zapisy dalej kończą się błędem
      - Programy nowsze, programy uruchamiane z podniesieniem oraz aplikacje ze sklepu pozostają bez zmian
      - Usługi systemowe, praca sieci i profile użytkowników pozostają bez zmian
    en:
      - A file written by an older program lies not in the system directory but in the profile, which misleads while searching
      - Two people running the same older program see their own copies of its writes instead of one shared set
      - Sixty-four-bit programs are not covered by the redirection and their writes still end in an error
      - Newer programs, programs run with elevation and store applications stay unchanged
      - System services, the work of the network and users profiles stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie działa starszy program, który ma wymieniać dane z innymi kontami przez plik w katalogu wspólnym
    en:
      - An older program works on the machine meant to exchange data with other accounts through a file in a shared directory
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      $name = 'EnableVirtualization'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    $name = 'EnableVirtualization'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The write direction is a softening one - what ended in an error begins to
    # succeed. Keep in mind only that the file will then lie in the profile, not
    # in the system directory.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'EnableVirtualization' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/user-account-control-virtualize-file-and-registry-write-failures-to-per-user-locations

notes:
  pl: |
    Reguła zamyka blok i jest w nim najsłabsza, co opis powinien przyznać
    wprost. Nie zdejmuje żadnego ataku. Zdejmuje powód, dla którego ludzie
    wyłączają kontrolę konta albo nadają programom pełne uprawnienia,
    a to jest wkład realny, tylko pośredni.

    Warto, żeby aplikacja pokazywała ją razem z regułą pierwszą, bo to
    właśnie ta para rozstrzyga o losie oprogramowania starszego. Reguła
    pierwsza stawia wymaganie, ta szósta daje drogę jego spełnienia bez
    łamania zgodności.

    Odnotowuję, że ustawienie jest domyślnie włączone i punkt bywa
    spełniony bez żadnej czynności. Nie czyni go to zbędnym — raport ma
    odnotować, że sprawdzono, a nie milczeć.
  en: |
    The rule closes the block and is the weakest in it, which the description ought to own outright. It takes
    away no attack. It takes away the reason for which people switch the control off or give programs full
    rights, and that is a real contribution, only an indirect one.

    It is well that the application show it together with the first rule, that pair settling the fate of older
    software. The first rule sets a demand; this sixth one gives a road to meeting it without breaking
    compatibility.

    Worth noting that the setting is on by default and the item is at times met without any act. That does not
    make it needless - a report is to record that it was checked, not keep silent.
