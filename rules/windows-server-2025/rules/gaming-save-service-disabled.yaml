id: win2025-gaming-save-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zapisu stanu rozgrywki poza maszyną wyłączona
    en: The service saving the state of play off the machine disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przenoszącą zapisany stan rozgrywki do składnicy
    producenta, żeby dał się odczytać z innego urządzenia.

    Zostawiam kategorię niską, bo na serwerze nie ma czego zapisywać.
    Chcę jednak odłożyć nazwę na bok, tak jak zrobiłem przy łączności tej
    samej platformy, i nazwać, czym ten składnik jest z punktu widzenia
    maszyny.

    Jest usługą, której zadaniem jest kopiowanie plików z tej maszyny do
    składnicy poza organizacją, wykonywane samoczynnie i w tle. Kopiowanie
    czegokolwiek z serwera na zewnątrz jest czynnością, która powinna mieć
    nazwę, właściciela i uzasadnienie, a tutaj ma je tylko dopóty, dopóki
    trzymamy się nazwy usługi i wierzymy, że skoro mówi o rozgrywce, to
    poza rozgrywką nic przez nią nie przejdzie.

    Nie twierdzę, że przechodzi. Twierdzę, że działający na serwerze
    składnik o takim zadaniu nie ma po co działać, i że to wystarcza za
    uzasadnienie bez dorabiania groźniejszej historii.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: niewiele
    wprost; działa uruchomiona bez potrzeby droga wyjścia danych
    z maszyny, po której nikt się niczego nie spodziewa.
  en: |
    The item switches off the service that bears the written-down standing of a play to a maker's
    hoard, that it may be read off another device.

    I leave the category low, there being upon a server nothing to write down. I would set the name
    aside for all that, as I did at the net-binding of that same board, and name what that piece is
    from the machine's side.

    It is a service whose task is the copying of files off that machine to a hoard outside the
    household, done of itself and behind the back. The copying of anything at all off a server to
    without is a doing that ought to have a name, an owner and a standing, and here it has them only so
    long as we hold to the name of the service and trow that, it speaking of play, nothing but play
    will go through it.

    I say not that anything does. I say that a piece with such a task running upon a server has no
    cause to run, and that this is standing enough without the making up of a grimmer tale.

    What an attacker gains while the item goes unmet - little outright; there runs, without need, a
    road out of the machine for data, whereof nobody looks for anything.

disruption_description:
  pl: |
    Obniżam klasę do „bez uciążliwości". Na serwerze nie ma stanu
    rozgrywki, nie ma kto go zapisać i nie ma urządzenia, z którego ktoś
    by go odczytywał.

    Warto przy tym punkcie powtórzyć uwagę dotyczącą całej rodziny, bo
    tu widać ją najwyraźniej. Kilka punktów benchmarku opisuje składniki
    jednej platformy, a każdy z nich w raporcie wygląda na osobną
    sprawę. Na serwerze nie jest osobną: wszystkie zapadają tą samą
    decyzją, wszystkie są bez uciążliwości i wszystkie idą hurtem.
    Rozważanie ich pojedynczo nie jest ostrożnością, tylko marnowaniem
    uwagi, której potrzeba przy punktach naprawdę trudnych.

    Zgodnie z zasadą twardą o trybie zbiorczym punkt nadaje się do
    zastosowania hurtem.

    Zmiana cofa się natychmiast.
  en: |
    I lower the class to "no unease". Upon a server there is no standing of a play, nobody to write it
    down and no device off which anybody would read it.

    It is worth saying again at this item the note upon the whole kin, it being here seen the clearest.
    Some few items of the benchmark tell of the pieces of one board, and each of them looks in the
    writ-up like a matter of its own. Upon a server it is no matter of its own - they all fall by one
    and the same deciding, they are all without unease and they all go in bulk. The weighing of them
    one by one is no heedfulness but a wasting of the heed that is needed at the items that are truly
    hard.

    By the hard rule of the bulk mode the item is fit to be laid on in bulk.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Zapisany stan rozgrywki przestaje trafiać do składnicy producenta i nie da się go odczytać z innego urządzenia
      - Na serwerze nie ma stanu rozgrywki, nie ma kto go zapisać i nie ma urządzenia, z którego ktoś by go odczytywał
      - Znika działająca samoczynnie droga kopiowania plików z maszyny do składnicy poza organizacją
      - Składniki tej rodziny zapadają na serwerze tą samą decyzją i nie są osobnymi sprawami
    en:
      - The written-down standing of a play stops coming to a maker's hoard and may not be read off another device
      - Upon a server there is no standing of a play, nobody to write it down and no device off which anybody would read it
      - The road working of itself for the copying of files off the machine to a hoard outside the household goes away
      - The pieces of that kin fall upon a server by one and the same deciding and are no matters of their own
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna celowo przechowuje stan rozgrywki w składnicy producenta, na przykład jako stanowisko do sprawdzania
    en:
      - The machine holds the standing of a play in a maker's hoard on purpose, as a stead for testing for a byspel
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblGameSave'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblGameSave'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Set the name aside: this is a component whose task is copying files off
    # the machine to storage outside the organisation, on its own and in the
    # background. On a server it has no reason to run.
    Stop-Service -Name 'XblGameSave' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblGameSave' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XblGameSave' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Odkładając nazwę na bok: jest to usługa, której zadaniem jest
    kopiowanie plików z maszyny do składnicy poza organizacją,
    samoczynnie i w tle. Kopiowanie czegokolwiek z serwera na zewnątrz
    powinno mieć nazwę, właściciela i uzasadnienie.

    Nie twierdzę, że przechodzi tędy cokolwiek poza rozgrywką. Twierdzę,
    że składnik o takim zadaniu nie ma na serwerze po co działać, i że to
    wystarcza bez dorabiania groźniejszej historii.

    Tu najwyraźniej widać uwagę o całej rodzinie: rozważanie tych
    punktów pojedynczo nie jest ostrożnością, tylko marnowaniem uwagi
    potrzebnej przy punktach naprawdę trudnych.
  en: |
    Setting the name aside - it is a service whose task is the copying of files off the machine to a
    hoard outside the household, of itself and behind the back. The copying of anything off a server to
    without ought to have a name, an owner and a standing.

    I say not that anything but play goes this way. I say that a piece with such a task has upon a
    server no cause to run, and that this is enough without the making up of a grimmer tale.

    Here the note upon the whole kin is seen the clearest - the weighing of these items one by one is
    no heedfulness but a wasting of the heed needed at the items that are truly hard.
