id: win2016-undock-device-administrators

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Odłączanie komputera od stacji dokującej tylko dla administratorów
    en: Removing the computer from a docking station restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt ogranicza uprawnienie do odłączania komputera od stacji dokującej do
    grupy administratorów lokalnych.

    Uprawnienie pochodzi z czasów, gdy stacja dokująca miała zamek, a system
    musiał wiedzieć, czy wolno ją zwolnić bez wyłączania maszyny. Na serwerze
    nie ma dla niego zastosowania: serwery nie stoją w dokach i nie mają czego
    odłączać.

    Zostawiamy regułę mimo to, i to z powodu praktycznego. Uprawnienie jest
    oceniane przy każdym zdarzeniu wyjęcia i wyrzucenia urządzenia, także
    takiego, które ze stacją dokującą nie ma nic wspólnego — bezpiecznego
    usuwania nośnika wymiennego na przykład. Lista, na której są osoby postronne,
    jest więc listą, która w pewnych przypadkach wpuszcza je szerzej, niż
    wskazywałaby nazwa punktu.

    Kategoria niska i taka ma pozostać. To nie jest zabezpieczenie przed
    atakiem, tylko spójność konfiguracji: uprawnienie bez zastosowania powinno
    należeć do nikogo poza administratorami, żeby nie stało się furtką, kiedy
    zastosowanie się znajdzie.

    Na serwerze 2016 lista domyślnie obejmuje administratorów.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: uprawnienie
    w systemie, którego nikt nie przegląda, bo wszyscy uznali je za martwe.
  en: |
    The item limits the right to remove the computer from a docking station to the
    local administrators group.

    The right comes from a time when a docking station had a lock and the system had
    to know whether it might be released without switching the machine off. On a
    server it has no application: servers do not stand in docks and have nothing to
    undock from.

    The rule stays nonetheless, and for a practical reason. The right is weighed at
    every event of a device being taken out or ejected, including one having nothing
    to do with a docking station - the safe removal of a removable medium, say. A
    list with outsiders on it is therefore a list that in certain cases lets them in
    more widely than the item's name would suggest.

    The category is low and so it should stay. This is no safeguard against an
    attack, only consistency of configuration: a right without application ought to
    belong to nobody outside the administrators, so that it does not become a way in
    when an application is found.

    On Server 2016 the list covers the administrators by default.

    What an attacker gains while the item goes unmet: a right in the system that
    nobody reviews, because everybody has held it to be dead.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Na serwerze uprawnienie nie ma zastosowania,
    więc jego ograniczenie nie zmienia niczego w codziennej pracy.

    Jedyny przypadek wart sprawdzenia dotyczy maszyn, które serwerami są tylko
    z nazwy: stacji roboczych z rolą serwerową, komputerów przenośnych
    pełniących funkcję serwera w małym biurze albo maszyn testowych
    w dokach. Tam odłączenie bez uprawnienia kończy się komunikatem odmowy
    przy próbie zwolnienia stacji.

    Czego to nie psuje: pracy urządzeń, podłączania i odłączania nośników przez
    administratora, sterowników ani niczego związanego z pracą serwera w szafie.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". On a server the right has no application, so
    limiting it changes nothing in the daily course of work.

    The one case worth checking concerns machines that are servers in name only: a
    workstation with a server role, a portable computer serving as a server in a
    small office, or test machines in docks. There an undocking without the right
    ends in a message of refusal when the station is released.

    What this does not break: the working of devices, the connecting and
    disconnecting of media by an administrator, drivers, or anything to do with a
    server's work in a rack.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Komputer przenośny pełniący funkcję serwera nie daje się zwolnić z doku przez konto spoza grupy administratorów
      - Bezpieczne usuwanie nośnika wymiennego bywa oceniane przez to samo uprawnienie i może zostać odmówione
      - Praca urządzeń, sterowniki i podłączanie nośników przez administratora działają bez zmian
      - Na serwerze stojącym w szafie zmiana nie ma żadnego widocznego skutku
    en:
      - A portable computer serving as a server cannot be released from its dock by an account outside the administrators group
      - The safe removal of a removable medium is sometimes weighed by the same right and may be refused
      - The working of devices, drivers and the connecting of media by an administrator work unchanged
      - On a server standing in a rack the change has no visible effect at all
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna jest komputerem przenośnym albo stacją roboczą z rolą serwerową, która bywa odłączana od doku przez osobę spoza grupy administratorów
    en:
      - The machine is a portable computer or a workstation with a server role, undocked at times by somebody outside the administrators group
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeUndockPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeUndockPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeUndockPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # On a server the right has no application, but it is weighed at device removal
    # events too, so it is not simply dead.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeUndockPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeUndockPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/remove-computer-from-docking-station

notes:
  pl: |
    Jest to najlżejszy punkt w całej grupie uprawnień i tak należy go
    przedstawić. Nie zasługuje na miejsce wyżej niż na końcu listy roboczej.

    Powód jego utrzymania jest porządkowy: uprawnienia bez zastosowania są
    tymi, które najdłużej zostają nieprzejrzane, bo nikt nie widzi powodu, żeby
    na nie patrzeć. Reguła kosztuje nic, więc niech pilnuje.

    Nazwa punktu jest myląca — uprawnienie bywa oceniane przy zdarzeniach
    niezwiązanych ze stacją dokującą. To jest jedyny powód, dla którego ma ono
    na serwerze jakiekolwiek znaczenie.
  en: |
    This is the lightest item in the whole group of rights and it should be
    presented as such. It deserves no place higher than the end of the working list.

    The reason for keeping it is housekeeping: rights without application are the
    ones that stay unreviewed longest, because nobody sees a reason to look at them.
    The rule costs nothing, so let it watch.

    The item's name misleads - the right is weighed at events unconnected with a
    docking station. That is the only reason it carries any weight at all on a
    server.
