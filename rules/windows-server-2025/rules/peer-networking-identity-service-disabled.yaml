id: win2025-peer-networking-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa menedżera tożsamości dla sieci równorzędnej wyłączona
    en: The identity manager service for peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zarządzającą tożsamościami w sieci równorzędnej.
    Usługa ta wytwarza i przechowuje tożsamości węzłów oraz materiał
    kryptograficzny, którym węzły poświadczają się sobie nawzajem.

    Rzecz wspólna dla czterech reguł tej platformy zapisana jest przy
    rozpoznawaniu nazw. Tutaj mówię o tym, co własne.

    Zostawiam kategorię średnią, ale z zupełnie innego powodu niż przy
    trzech pozostałych. Tamte dotyczyły sieci: kto kogo znajduje, kto się
    ogłasza, czym płyną dane. Ta dotyczy tożsamości — i to jest jedyna
    usługa tej czwórki, która trzyma na maszynie materiał
    uwierzytelniający.

    Trzyma go w sposób niezwiązany z kontami domenowymi, poza wszystkim,
    czym zwykle zarządza się tożsamościami na serwerze. Tożsamość
    równorzędna nie wygasa razem z kontem, nie znika przy odebraniu
    uprawnień i nie pojawia się w żadnym przeglądzie kont. Jest to ten
    sam kształt problemu, co przy kluczu powłoki zdalnej, opisany osobnym
    punktem — dostęp, który przeżywa administrowanie kontami, bo nie jest
    kontem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    mechanizm wytwarzania i przechowywania na serwerze tożsamości
    poświadczających, nad którymi zarządzanie kontami nie ma żadnej
    władzy.
  en: |
    The item switches off the service that rules standings in the net of equals. That service makes
    and keeps the standings of knots and the hidden-writing matter wherewith knots vouch for
    themselves one to another.

    The thing common to the four rules of that platform is set down at the knowing of names. Here I
    speak of what is its own.

    I leave the category middling, but of a wholly other ground than at the three others. Those bore
    upon the net - who finds whom, who calls themselves abroad, whereby data flow. This one bears upon
    standing - and it is the one service of that four that keeps upon the machine matter for the
    knowing of who one is.

    It keeps it in a way unbound to the standings of the holding, outside all whereby standings upon a
    server are commonly ruled. A standing of equals runs not out along with a standing of the holding,
    goes not away at the taking of leaves and comes forth in no looking over of standings. It is the
    same shape of trouble as at the key of the far-off shell, set forth in an item of its own - a
    reach that outlives the ruling of standings, it being no standing.

    What an attacker gains while the item goes unmet - a working for the making and the keeping upon
    the server of vouching standings whereover the ruling of standings has no might at all.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", zgodnie z ustaleniem wspólnym
    dla całej czwórki, zapisanym przy rozpoznawaniu nazw.

    Jedna uwaga własna dotyczy cofania zmiany i jest to jedyne miejsce
    w tej czwórce, w którym cofnięcie nie jest zupełnie symetryczne.
    Uruchomienie usługi z powrotem przywraca działanie mechanizmu, ale
    aplikacja zbudowana na tej platformie może w międzyczasie stracić
    zdolność posługiwania się tożsamością, która została wytworzona
    wcześniej. Sama usługa wraca natychmiast; przywrócenie aplikacji do
    pracy bywa czynnością osobną.

    Zależność jest ta sama, co przy grupowaniu: usługa opiera się na
    rozpoznawaniu nazw z sąsiedniego punktu i bywa już zatrzymana po
    zmianie tamtego.

    Zmiana cofa się natychmiast w sensie samej usługi.
  en: |
    I leave the class "needs a checking", after the settling common to all four set down at the
    knowing of names.

    One note of its own bears upon the undoing of the change, and it is the one stead in that four
    whereat the undoing is not wholly even. The starting of the service again brings the working back,
    but an application built upon that platform may in the meanwhile lose the might of using a
    standing that was made beforehand. The service itself comes back at once; the bringing of the
    application back to work is at times a doing of its own.

    The hanging is the same as at the grouping - the service rests upon the knowing of names of the
    neighbouring item and is at times stopped already after the change of that one.

    The change is undone at once as touching the service itself.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Własna aplikacja zbudowana na platformie sieci równorzędnej traci dostęp do tożsamości węzła
      - Aplikacja może stracić zdolność posługiwania się tożsamością wytworzoną przed zmianą
      - Sama usługa wraca natychmiast, ale przywrócenie aplikacji do pracy bywa czynnością osobną
      - Usługa opiera się na rozpoznawaniu nazw, więc bywa już zatrzymana po zmianie sąsiedniego punktu
      - Konta domenowe i logowanie do serwera nie mają z tą usługą nic wspólnego
    en:
      - An application of one's own built upon the platform of the net of equals loses its reach to the knot's standing
      - The application may lose the might of using a standing that was made before the change
      - The service itself comes back at once, but the bringing of the application back to work is at times a doing of its own
      - The service rests upon the knowing of names, so it is at times stopped already after the change of the neighbouring item
      - The standings of the holding and the signing in to the server have with that service nothing in common
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi aplikacja zbudowana na platformie sieci równorzędnej i posługuje się tożsamością węzła
    en:
      - Upon the machine there stands an application built upon the platform of the net of equals and it uses the knot's standing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The only service of this platform that holds authentication material on
    # the machine. Starting it again restores the mechanism, but an application
    # may not pick up an identity it created before the change.
    Stop-Service -Name 'p2pimsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2pimsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'p2pimsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-identity-manager

notes:
  pl: |
    Kategoria średnia z zupełnie innego powodu niż przy trzech
    pozostałych usługach tej platformy. Tamte dotyczyły sieci: kto kogo
    znajduje, kto się ogłasza, czym płyną dane. Ta dotyczy tożsamości —
    jako jedyna z czwórki trzyma na maszynie materiał uwierzytelniający.

    Ten sam kształt problemu, co przy kluczu powłoki zdalnej: tożsamość
    równorzędna nie wygasa razem z kontem, nie znika przy odebraniu
