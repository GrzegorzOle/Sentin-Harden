id: win2016-defender-scan-downloaded-files

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Defender Antivirus > Real-time Protection
  title:
    pl: Sprawdzanie plików pobranych i załączników włączone
    en: Checking of files fetched and of attachments switched on
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe sprawdzać pliki przychodzące na maszynę z zewnątrz
    w chwili, gdy się na niej pojawiają.

    Warstwa ta jest osobna od sprawdzania w czasie rzeczywistym i warto
    rozumieć dlaczego. Tamta patrzy na plik przy otwarciu lub uruchomieniu,
    czyli w chwili użycia. Ta patrzy przy wejściu — gdy plik zostaje pobrany
    przez przeglądarkę, odebrany jako załącznik albo zapisany przez program
    ściągający coś z sieci.

    Różnica jest różnicą miejsca w łańcuchu. Plik zatrzymany przy wejściu
    nigdy nie trafia na dysk w postaci użytecznej; plik zatrzymany przy
    uruchomieniu leżał tam wcześniej i mógł zostać skopiowany dalej.

    Na serwerze warstwa ta ma zastosowanie węższe niż na stanowisku, ale
    istotne. Pliki przychodzą tu przez narzędzia pobierające pakiety
    i aktualizacje, przez agentów zarządzania ściągających swoje składniki
    i przez usługi przyjmujące wgrywane pliki. Każda z tych dróg jest
    dokładnie tym, co ta warstwa obserwuje.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pewność, że
    plik przyniesiony na maszynę z sieci zostanie zapisany bez sprawdzenia,
    a jego ocena odłoży się do chwili, gdy ktoś go uruchomi.
  en: |
    The setting has files arriving on the machine from outside checked at the moment
    they appear on it.

    This layer is separate from real-time checking, and it is worth grasping why.
    That one looks at a file at its opening or running, which is to say at the
    moment of use. This one looks at the entrance - when a file is fetched by a
    browser, received as an attachment, or saved by a program pulling something off
    the network.

    The difference is one of place in the chain. A file stopped at the entrance
    never reaches the disk in usable form; a file stopped at its running lay there
    beforehand and may have been copied on.

    On a server the layer has a narrower use than on a workstation, but a real one.
    Files come here through tools fetching packages and updates, through management
    agents pulling down their own parts, and through services taking uploaded files.
    Each of those roads is exactly what this layer watches.

    What an attacker gains while the item goes unmet: the certainty that a file
    brought onto the machine from the network will be saved without a check, its
    judgement put off until somebody runs it.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na serwerze skutków odczuwalnych
    zwykle nie ma.

    Powód jest taki, że na serwer pliki przychodzą rzadko i przez wąski
    zestaw dróg. Nie ma tu przeglądania stron ani odbierania poczty, więc
    warstwa ta pracuje głównie przy pobieraniu pakietów i aktualizacji.

    Rzecz do sprawdzenia dotyczy narzędzi wdrożeniowych. Programy pobierające
    duże pliki — obrazy instalacyjne, paczki aktualizacji, kopie baz —
    przechodzą przez tę warstwę i bywają spowalniane przy zapisie. Na łączu
    szybkim różnica jest niewidoczna; przy plikach wielkich i dysku wolnym
    potrafi być zauważalna.

    Drugą rzeczą są narzędzia administracyjne pobierane doraźnie. Część z nich
    jest rozpoznawana jako niepożądana, bo służy też napastnikom — i wtedy
    zostaje usunięta w chwili pobrania, zanim ktokolwiek zdąży z niej
    skorzystać. Objaw brzmi wtedy „plik znika zaraz po pobraniu".

    Czego to nie psuje: usług, logowania, łączności, plików już leżących na
    maszynie, pracy innego programu ochronnego.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "needs review", though on a server there are as a rule no
    consequences anybody feels.

    The reason is that files come onto a server seldom and by a narrow set of roads.
    There is no browsing of pages here and no receiving of mail, so the layer works
    chiefly at the fetching of packages and updates.

    The thing to check concerns deployment tools. Programs fetching large files -
    installation images, update packages, database copies - pass through this layer
    and are at times slowed at the write. On a fast link the difference is
    invisible; with very large files and a slow disk it can be noticeable.

    The second thing are administrative tools fetched as the need arises. Some of
    them are recognised as unwanted, serving attackers too - and are then removed at
    the moment of fetching, before anybody can use them. The symptom then reads "the
    file vanishes right after being fetched".

    What this does not break: services, signing in, connectivity, files already
    lying on the machine, or the working of another protection program.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - email-and-attachments
    - file-sharing
    - updates-and-servicing
  what_breaks:
    pl:
      - Narzędzia administracyjne o podwójnym zastosowaniu bywają usuwane w chwili pobrania, a objaw brzmi plik znika zaraz po pobraniu
      - Pobieranie bardzo dużych plików na wolny dysk bywa zauważalnie spowolnione, bo zapis przechodzi przez tę warstwę
      - Narzędzia wdrożeniowe ściągające obrazy instalacyjne i paczki aktualizacji pracują wolniej niż dotąd
      - Usługi, logowanie, łączność i pliki już leżące na maszynie pozostają bez zmian
    en:
      - Administrative tools of double use are at times removed at the moment of fetching, and the symptom reads the file vanishes right after being fetched
      - The fetching of very large files onto a slow disk is at times noticeably slowed, the write passing through this layer
      - Deployment tools pulling down installation images and update packages work more slowly than before
      - Services, signing in, connectivity and files already lying on the machine stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Praca na maszynie opiera się na doraźnie pobieranych narzędziach administracyjnych o podwójnym zastosowaniu
      - Maszyna pobiera bardzo duże pliki na wolny dysk i opóźnienie zapisu byłoby odczuwalne
    en:
      - Work on the machine rests on administrative tools of double use fetched as the need arises
      - The machine fetches very large files onto a slow disk and a delay at the write would be felt
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Order matters - with the protection stood down, reading its preferences
      # throws. The question whether another product took over has to be answered
      # first, because a protection that stood aside and one that was switched off
      # are opposite states and must not share an answer.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      else {
        if ((Get-MpPreference -ErrorAction Stop).DisableIOAVProtection) { 'DISABLED' } else { 'ENABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ENABLED'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    $name = 'DisableIOAVProtection'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableIOAVProtection' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/configure-real-time-protection-microsoft-defender-antivirus

notes:
  pl: |
    Punkt otwiera drugą część bloku ochrony — tę, która opisuje, co i kiedy
    jest sprawdzane. Część pierwsza mówiła, czy ochrona działa; ta mówi,
    gdzie sięga.

    Warstwa ta bywa mylona ze sprawdzaniem w czasie rzeczywistym
    i traktowana jako to samo. Nie jest. Reguła pilnuje wejścia, tamta
    użycia, a plik może przejść przez jedną i zostać zatrzymany przez drugą.
    Aplikacja powinna pokazywać je obok siebie i mówić o tej różnicy, bo bez
    niej punkt wygląda na powtórzenie.

    Skutek w postaci znikających narzędzi administracyjnych jest wart
    osobnej wzmianki, bo jest najczęstszą przyczyną, dla której ktoś tę
    warstwę wyłącza. Właściwą odpowiedzią jest wyłączenie dla wskazanego
    katalogu, a nie zdjęcie warstwy z całej maszyny.
  en: |
    The item opens the second part of the protection block - the part describing
    what is checked and when. The first part said whether the protection works; this
    one says how far it reaches.

    The layer is at times confused with real-time checking and treated as the same
    thing. It is not. This rule watches the entrance, that one the use, and a file
    can pass through one and be stopped by the other. The application should show
    them side by side and speak of that difference, since without it the item looks
    like a repetition.

    The consequence of vanishing administrative tools deserves a mention of its own,
    being the commonest reason why somebody switches this layer off. The proper
    answer is an exclusion for a named directory, not the taking of the layer off
    the whole machine.
