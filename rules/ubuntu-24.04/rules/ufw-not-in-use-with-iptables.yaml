id: ubuntu2404-ufw-not-in-use-with-iptables

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 4.4.1.3
  section: Host Based Firewall > Configure iptables > Configure iptables software
  title:
    pl: ufw nie jest używany razem z iptables
    en: Ensure ufw is not in use with iptables
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    ufw tworzy własne łańcuchy iptables i ustawia politykę wbudowanych
    łańcuchów. Włączony obok iptables-persistent miesza swoje reguły
    z regułami administratora, a jego wyłączenie albo przeładowanie zmienia
    zaporę niezależnie od plików w /etc/iptables.

    Punkt wymaga, żeby przy iptables w użyciu ufw nie był zainstalowany
    albo był wyłączony, czyli miał wpis ENABLED=no w /etc/ufw/ufw.conf.
  en: |
    ufw builds its own iptables chains and sets the policy of the built-in
    chains. Turned on next to iptables-persistent, it mixes its rules with
    the rules of the administrator, and turning it off or reloading it
    changes the firewall independently of the files in /etc/iptables.

    The item requires that with iptables in use ufw is not installed or is
    turned off, that is has the ENABLED=no entry in /etc/ufw/ufw.conf.

disruption_description:
  pl: |
    Ruch, który blokowały tylko reguły ufw, zaczyna przechodzić, jeśli nie
    blokują go reguły iptables. ufw disable ustawia politykę ACCEPT
    we wbudowanych łańcuchach, więc naprawa wczytuje od razu reguły
    zapisane w /etc/iptables; reguły dodane ręcznie i niezapisane znikają.
  en: |
    Traffic that only the ufw rules blocked starts to pass if the iptables
    rules do not block it. ufw disable sets the ACCEPT policy in the
    built-in chains, so the remediation at once loads the rules saved in
    /etc/iptables; rules added by hand and not saved disappear.

implementation_consequences:
  impact_areas:
    - network-and-firewall
  what_breaks:
    pl:
      - Ruch blokowany dotąd tylko przez ufw przechodzi, gdy reguły iptables go nie blokują
      - Reguły iptables dodane ręcznie i niezapisane poleceniem netfilter-persistent save
    en:
      - Traffic blocked so far only by ufw passes when the iptables rules do not block it
      - iptables rules added by hand and not saved with netfilter-persistent save
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Zaporą serwera ma zarządzać ufw, a netfilter-persistent został włączony przypadkiem; wtedy właściwa jest naprawa z punktu 4.1.1
    en:
      - The firewall of the server should be managed by ufw, and netfilter-persistent was enabled by accident; then the remediation of item 4.1.1 is the right one
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v systemctl >/dev/null 2>&1 || [ ! -d /run/systemd/system ]; then echo CHECK_ERROR; exit 0; fi
    fw_st() {
      e=$(systemctl is-enabled "$1" 2>/dev/null) || true
      a=$(systemctl is-active "$1" 2>/dev/null) || true
      echo "${e:-none}/${a:-unknown}"
    }
    fw_used() { case "$1" in enabled/*|enabled-runtime/*|*/active|*/activating|*/reloading) return 0 ;; esac; return 1; }
    ufw_on() { [ -x /usr/sbin/ufw ] && grep -qsx 'ENABLED=yes' /etc/ufw/ufw.conf; }
    fwmode() {
      m=""
      if ufw_on; then m="$m,ufw"; fi
      if fw_used "$(fw_st nftables.service)"; then m="$m,nftables"; fi
      if fw_used "$(fw_st netfilter-persistent.service)"; then m="$m,iptables"; fi
      m=${m#,}
      case "$m" in "") echo none ;; *,*) echo "multiple:$m" ;; *) echo "$m" ;; esac
    }
    case "$(fwmode)" in iptables|multiple:*iptables*) ;; *) echo NOT_APPLICABLE; exit 0 ;; esac
    if [ ! -x /usr/sbin/ufw ]; then echo "OK:ufw=not-installed"
    elif ufw_on; then echo "NOT_OK:ufw=on"
    else echo "OK:ufw=off"; fi
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      fw_st() {
        e=$(systemctl is-enabled "$1" 2>/dev/null) || true
        a=$(systemctl is-active "$1" 2>/dev/null) || true
        echo "${e:-none}/${a:-unknown}"
      }
      fw_used() { case "$1" in enabled/*|enabled-runtime/*|*/active|*/activating|*/reloading) return 0 ;; esac; return 1; }
      ufw_on() { [ -x /usr/sbin/ufw ] && grep -qsx 'ENABLED=yes' /etc/ufw/ufw.conf; }
      fwmode() {
        m=""
        if ufw_on; then m="$m,ufw"; fi
        if fw_used "$(fw_st nftables.service)"; then m="$m,nftables"; fi
        if fw_used "$(fw_st netfilter-persistent.service)"; then m="$m,iptables"; fi
        m=${m#,}
        case "$m" in "") echo none ;; *,*) echo "multiple:$m" ;; *) echo "$m" ;; esac
      }
      { echo format=ufwoff-1; if ufw_on; then echo enabled=yes; else echo enabled=no; fi; } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ -d /run/systemd/system ] || { echo "systemd is not running" >&2; exit 1; }
      case "$(tr '\n' ' ' < "$b")" in
        "format=ufwoff-1 enabled=yes "|"format=ufwoff-1 enabled=no ") ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      fw_st() {
        e=$(systemctl is-enabled "$1" 2>/dev/null) || true
        a=$(systemctl is-active "$1" 2>/dev/null) || true
        echo "${e:-none}/${a:-unknown}"
      }
      fw_used() { case "$1" in enabled/*|enabled-runtime/*|*/active|*/activating|*/reloading) return 0 ;; esac; return 1; }
      ufw_on() { [ -x /usr/sbin/ufw ] && grep -qsx 'ENABLED=yes' /etc/ufw/ufw.conf; }
      fwmode() {
        m=""
        if ufw_on; then m="$m,ufw"; fi
        if fw_used "$(fw_st nftables.service)"; then m="$m,nftables"; fi
        if fw_used "$(fw_st netfilter-persistent.service)"; then m="$m,iptables"; fi
        m=${m#,}
        case "$m" in "") echo none ;; *,*) echo "multiple:$m" ;; *) echo "$m" ;; esac
      }
      m=$(fwmode)
      case "$m" in iptables|multiple:*iptables*) ;; *) echo "iptables-persistent is not in use as the firewall ($m); the iptables items do not apply (see item 4.1.1)" >&2; exit 1 ;; esac
      if ufw_on; then
        ufw --force disable >/dev/null
        if ufw_on; then echo "ufw is still enabled" >&2; exit 1; fi
        echo "Disabled ufw"
        # ufw disable sets the accept policy in the built-in chains of iptables.
        case "$(fw_st netfilter-persistent.service)" in */active)
          netfilter-persistent start >/dev/null
          echo "Loaded the saved iptables rules again" ;;
        esac
      else
        echo "ufw is not enabled, nothing to change"
      fi
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      case "$(tr '\n' ' ' < "$b")" in
        "format=ufwoff-1 enabled=yes "|"format=ufwoff-1 enabled=no ") ;;
        *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
      esac
      fw_st() {
        e=$(systemctl is-enabled "$1" 2>/dev/null) || true
        a=$(systemctl is-active "$1" 2>/dev/null) || true
        echo "${e:-none}/${a:-unknown}"
      }
      fw_used() { case "$1" in enabled/*|enabled-runtime/*|*/active|*/activating|*/reloading) return 0 ;; esac; return 1; }
      ufw_on() { [ -x /usr/sbin/ufw ] && grep -qsx 'ENABLED=yes' /etc/ufw/ufw.conf; }
      fwmode() {
        m=""
        if ufw_on; then m="$m,ufw"; fi
        if fw_used "$(fw_st nftables.service)"; then m="$m,nftables"; fi
        if fw_used "$(fw_st netfilter-persistent.service)"; then m="$m,iptables"; fi
        m=${m#,}
        case "$m" in "") echo none ;; *,*) echo "multiple:$m" ;; *) echo "$m" ;; esac
      }
      if grep -qx enabled=yes "$b" && [ -x /usr/sbin/ufw ] && ! ufw_on; then
        ufw --force enable >/dev/null
        echo "Enabled ufw again"
      fi
      echo "Restored the previous state of ufw"
    )

privileges: root
runnable: true

sources:
  - https://manpages.ubuntu.com/manpages/noble/man8/ufw.8.html
  - https://manpages.ubuntu.com/manpages/noble/man8/iptables.8.html
  - https://manpages.ubuntu.com/manpages/noble/man8/netfilter-persistent.8.html
  - https://documentation.ubuntu.com/server/how-to/security/firewalls/

notes:
  pl: |
    Punkty 4.4 dotyczą serwera, na którym w użyciu jest iptables-persistent,
    czyli netfilter-persistent.service jest włączona lub uruchomiona.
    W pozostałych przypadkach sprawdzenie zwraca NOT_APPLICABLE, a naprawa
    odmawia. Wybór narzędzia ocenia punkt 4.1.1. Wynik OK:ufw=not-installed oznacza brak
    pakietu, OK:ufw=off wyłączony ufw, a NOT_OK:ufw=on ufw włączony obok
    iptables.

    Pakiet ufw nie może być zainstalowany razem z iptables-persistent, więc
    ten stan zdarza się tylko wtedy, gdy netfilter-persistent działa bez
    tego pakietu. Naprawa wyłącza ufw poleceniem ufw --force disable, a gdy
    netfilter-persistent.service działa, wczytuje ponownie zapisane reguły.
    Reguły iptables zapisane przez iptables-persistent leżą
    w /etc/iptables/rules.v4 i rules.v6, a zapisuje je polecenie
    netfilter-persistent save. Kopia zapisuje stan ENABLED, a wycofanie włącza ufw
    ponownie, jeśli był włączony.
  en: |
    The items in 4.4 concern a server where iptables-persistent is in use,
    that is netfilter-persistent.service is enabled or running. In the other
    cases the check returns NOT_APPLICABLE and the remediation refuses. The
    choice of the tool is assessed by item 4.1.1. The OK:ufw=not-installed result means the
    package is not there, OK:ufw=off that ufw is turned off, and
    NOT_OK:ufw=on that ufw is turned on next to iptables.

    The ufw package cannot be installed together with iptables-persistent,
    so this state happens only when netfilter-persistent runs without that
    package. The remediation turns ufw off with ufw --force disable, and
    when netfilter-persistent.service runs, loads the saved rules again.
    The iptables rules saved by iptables-persistent are in
    /etc/iptables/rules.v4 and rules.v6, and the netfilter-persistent save
    command saves them. The backup records the ENABLED state, and rollback
    turns ufw on again if it was on.
