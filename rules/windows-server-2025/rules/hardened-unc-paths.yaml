id: win2025-hardened-unc-paths

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Network Provider
  title:
    pl: Utwardzone ścieżki UNC dla udziałów zasad grupy
    en: Hardened UNC paths for group policy shares
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Serwer należący do domeny pobiera zasady grupy i skrypty
    z udziałów sieciowych kontrolera dokładnie tak samo jak stanowisko
    robocze. Bez dodatkowych warunków wystarczy, że ktoś podstawi się
    pod ten udział, żeby maszyna wykonała przysłany skrypt —
    z uprawnieniami systemu i przy każdym zastosowaniu zasady.

    Utwardzenie ścieżki nakłada dwa warunki: druga strona musi
    udowodnić, że jest tym, za kogo się podaje, a treść musi dotrzeć
    niezmieniona. Podstawienie się pod udział przestaje wystarczać, bo
    napastnik nie ma czym potwierdzić tożsamości kontrolera.

    Na serwerze warto powiedzieć wprost rzecz, którą łatwo przeoczyć:
    to, że nikt się tu nie loguje, nie zmniejsza wagi punktu. Zasady
    pobierają się cyklicznie, niezależnie od tego, czy ktokolwiek
    siedzi przy maszynie. Skrypt podstawiony w miejsce tego z udziału
    wykona się na serwerze o piątej rano, w kontekście systemu, i nikt
    tego nie zobaczy.

    Rachunek jest przy tym gorszy niż na stanowisku. Kod wykonany
    z uprawnieniami systemu na serwerze plików albo na serwerze
    aplikacyjnym daje napastnikowi to, co maszyna obsługuje — czyli
    zwykle dane wielu osób naraz, a nie jednej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podstawienia się pod udział kontrolera i wykonania
    własnego kodu na serwerze w kontekście systemu, bez żadnego
    poświadczenia do tej maszyny.
  en: |
    A server belonging to a domain fetches group policy and scripts from the controller's network
    shares in just the same way as a working station. With no further conditions it is enough for
    somebody to stand in that share's stead for the machine to carry out the script sent - with the
    system's rights and at every applying of policy.

    Hardening the path lays down two conditions: the other side must prove it is what it gives
    itself out to be, and the content must come through unaltered. Standing in the share's stead
    stops being enough, the attacker having nothing to confirm the controller's name with.

    On a server it is worth saying outright a thing easily overlooked: that nobody signs in here
    does not lessen the item's weight. Policy is fetched by turns, whether or not anybody sits at
    the machine. A script put in the place of the one from the share will run on the server at five
    in the morning, in the system's stead, and nobody will see it.

    The reckoning is withal worse than at a station. Code carried out with the system's rights on a
    server of files or on a server of applications gives the attacker what the machine serves -
    that is, usually the data of many people at once and not of one.

    What an attacker gains while the item goes unmet: the means of standing in the stead of the
    controller's share and of carrying out their own code on the server in the system's stead, with
    no credential to this machine at all.

disruption_description:
  pl: |
    Na serwerze poza domeną ustawienie nie ma czego chronić i nie
    zmienia niczego — ścieżki, których dotyczy, nie są używane.

    W domenie sprawdzenia wymaga jedno: czy kontroler spełnia warunek
    wzajemnego uwierzytelnienia. Jeżeli tak — a tak jest w środowiskach
    utrzymywanych — zmiana przechodzi niezauważona. Jeżeli nie, bo
    konfiguracja jest starsza niż to ustawienie, pobieranie zasad
    zatrzymuje się.

    Objaw na serwerze wygląda inaczej niż na stanowisku i to jest
    właściwa różnica między tymi dwiema regułami. Na stanowisku widać
    go natychmiast: użytkownik czeka na pulpit. Na serwerze nie widać
    go wcale — nie ma komu czekać. Maszyna po prostu przestaje
    odświeżać zasady i pracuje dalej na tym, co już ma. Rozjazd
    konfiguracji ujawnia się dopiero wtedy, gdy ktoś zmieni zasadę
    i zdziwi się, że nie zadziałała.

    Dlatego po zmianie warto sprawdzić dziennik zastosowania zasad na
    tej maszynie, zamiast czekać, aż problem zgłosi się sam. Sam się
    nie zgłosi.

    Skrypty uruchamiane z udziału domeny — startowe, zamykające, albo
    wołane z zadań — przestaną się wykonywać, jeżeli warunek nie może
    być spełniony. To jest ten przypadek, w którym cisza jest gorsza od
    błędu.

    Zmiana cofa się natychmiast i nie wymaga restartu.
  en: |
    On a server outside a domain the setting has nothing to guard and alters nothing - the paths it
    bears on are not used.

    In a domain one thing needs checking: whether the controller meets the condition of mutual
    authentication. If so - and so it is in kept-up settings - the change goes unmarked. If not,
    the setup being older than this setting, the fetching of policy stops.

    The symptom on a server looks otherwise than at a station and that is the true difference
    between these two rules. At a station it is seen at once: the user waits for a desktop. On a
    server it is not seen at all - there is nobody to wait. The machine simply stops freshening its
    policy and works on with what it already has. The parting of the setup shows itself only when
    somebody alters a rule and wonders that it did not take.

    Therefore after the change it is worth looking into the log of policy applying on this machine
    rather than waiting for the trouble to report itself. It will not report itself.

    Scripts run off the domain's share - at starting, at shutting, or called from tasks - will stop
    running where the condition cannot be met. It is the case wherein silence is worse than an
    error.

    The change is undone at once and takes no restart.

implementation_consequences:
  impact_areas:
    - file-sharing
    - legacy-authentication
    - scripting-and-automation
  what_breaks:
    pl:
      - Pobieranie zasad grupy zatrzyma się, jeśli kontroler nie spełni warunku wzajemnego uwierzytelnienia
      - Skrypty startowe i zamykające pobierane z udziału domeny przestaną się wykonywać
      - Na serwerze nie widać objawu wprost, bo nikt nie czeka na pulpit — maszyna pracuje na starych zasadach
      - Rozjazd konfiguracji ujawnia się dopiero wtedy, gdy ktoś zmieni zasadę i zdziwi się, że nie zadziałała
      - Serwer poza domeną nie odczuje zmiany, bo tych ścieżek nie używa
    en:
      - The fetching of group policy will stop if the controller does not meet the condition of mutual authentication
      - Scripts of starting and of shutting fetched from the domain's share will stop running
      - On a server the symptom is not seen outright, nobody waiting for a desktop - the machine works on old policy
      - The parting of the setup shows itself only when somebody alters a rule and wonders that it did not take
      - A server outside a domain will not feel the change, using none of these paths
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Kontroler domeny nie obsługuje wzajemnego uwierzytelnienia dla tych udziałów
      - Serwer pobiera zasady przez łącze, na którym kontroler bywa nieosiągalny
    en:
      - The domain controller does not serve mutual authentication for these shares
      - The server fetches policy over a link on which the controller is at times unreachable
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $missing = @()
        foreach ($share in @('\\*\NETLOGON', '\\*\SYSVOL')) {
          $value = $item.$share
          if ($null -eq $value -or
              $value -notmatch 'RequireMutualAuthentication\s*=\s*1' -or
              $value -notmatch 'RequireIntegrity\s*=\s*1') {
            $missing += $share
          }
        }
        if ($missing.Count -eq 0) { 'HARDENED' } else { 'INCOMPLETE' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: HARDENED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    [pscustomobject]@{
      path        = $path
      netlogon    = $item.'\\*\NETLOGON'
      sysvol      = $item.'\\*\SYSVOL'
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\NetworkProvider\HardenedPaths'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    $value = 'RequireMutualAuthentication=1, RequireIntegrity=1'
    Set-ItemProperty -Path $path -Name '\\*\NETLOGON' -Value $value -Type String
    Set-ItemProperty -Path $path -Name '\\*\SYSVOL' -Value $value -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($pair in @(@('\\*\NETLOGON', $b.netlogon), @('\\*\SYSVOL', $b.sysvol))) {
      if ($null -eq $pair[1]) {
        Remove-ItemProperty -Path $b.path -Name $pair[0] -ErrorAction SilentlyContinue
      } else {
        Set-ItemProperty -Path $b.path -Name $pair[0] -Value $pair[1] -Type String
      }
    }
    if (-not $b.key_existed) {
      # The key is removed only where the change created it and nothing else
      # has since been written into it.
      $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
      if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
        Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/group-policy/ms15-011-ms15-014-hardening-group-policy

notes:
  pl: |
    Sprawdzenie wymaga obu warunków naraz i dla obu udziałów. Spełnienie
    połowy nie jest stanem pośrednim: sam wymóg spójności bez wzajemnego
    uwierzytelnienia chroni przed zmianą treści, ale nie przed
    podstawieniem się pod źródło, czyli przed właściwym atakiem.

    Na serwerze brak interaktywnych użytkowników nie zmniejsza wagi
    punktu, tylko zmienia objaw: zasady pobierają się cyklicznie,
    a zatrzymanie pobierania nie daje żadnego sygnału, bo nikt nie czeka
    na pulpit. Po zmianie sprawdź dziennik zastosowania zasad.

    Na serwerze poza domeną punkt pozostanie niespełniony, choć nic
    z tego nie wynika praktycznie. Konfiguracja ma być gotowa, zanim
    maszyna trafi do domeny.
  en: |
    The check takes both conditions at once and for both shares. The meeting of half is no
    middling state: the requirement of wholeness alone, without mutual authentication, guards
    against the altering of content but not against the standing in the source's stead - that is,
    against the true attack.

    On a server the want of interactive users does not lessen the item's weight, it only alters the
    symptom: policy is fetched by turns, and a halt in the fetching gives no sign at all, nobody
    waiting for a desktop. After the change look into the log of policy applying.

    On a server outside a domain the item will stay unmet, though nothing practical follows from
    it. The setup is to be ready before the machine comes into a domain.
