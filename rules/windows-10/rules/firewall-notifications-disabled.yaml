id: win10-firewall-notifications-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Windows Defender Firewall with Advanced Security > Settings
  title:
    pl: Powiadomienia zapory wyłączone we wszystkich profilach
    en: The firewall notices turned off in all profiles
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza okno, które zapora pokazuje użytkownikowi, gdy
    program zaczyna nasłuchiwać na porcie.

    Okno to pyta, czy zezwolić programowi na przyjmowanie połączeń,
    i pozwala odpowiedzieć jednym kliknięciem. Odpowiedź tworzy regułę
    zapory.

    Powód wyłączenia jest jeden i wart wypowiedzenia wprost: decyzja
    o otwarciu portu nie jest decyzją użytkownika. Pytanie pojawia się
    w chwili, w której człowiek chce dokończyć to, co robił, a jedyna
    odpowiedź pozwalająca to zrobić brzmi „zezwól". Pytanie zadane w takim
    momencie nie jest pytaniem — jest przeszkodą do usunięcia.

    Skutek uboczny jest poważniejszy. Napastnik, który uruchomił własny
    nasłuch, potrzebuje reguły zapory. Okno powiadomienia daje mu ją
    z rąk samego użytkownika, i to w sposób wyglądający zupełnie zwyczajnie.

    Odnotowuję, że wyłączenie powiadomień nie tworzy ani nie usuwa żadnej
    reguły. Programy, które regułę już mają, działają dalej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: regułę
    zapory utworzoną przez użytkownika, o którą nie musiał się starać.
  en: |
    The setting turns off the window the firewall shows a user when a program begins to listen upon a port.

    That window asks whether to allow the program to take joinings, and lets it be answered with one press. The
    answer makes a firewall rule.

    The ground for the turning off is one and worth speaking outright: the decision to open a port is no user's
    decision. The question shows at the hour a person wishes to finish what they were at, and the one answer that
    lets them do so is "allow". A question put at such an hour is no question - it is a hindrance to be got out of
    the way.

    The side consequence is the graver. An attacker who has started a listening of their own needs a firewall
    rule. The window of notice gives it them from the user's own hand, and in a manner looking wholly ordinary.

    I set down that the turning off of the notices makes and takes away no rule. Programs that already have a rule
    work on.

    What an attacker gains while the item goes unmet: a firewall rule made by the user, which cost them no effort.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktoś na tej maszynie tworzy reguły zapory tą drogą.

    Miejscem najczęstszym jest stanowisko programistyczne albo
    laboratoryjne, na którym uruchamia się własne programy nasłuchujące.
    Po zmianie okno przestanie się pojawiać, a program po prostu nie
    będzie przyjmował połączeń — bez żadnego komunikatu. Jest to objaw
    mylący, bo wygląda na błąd programu, a nie na zaporę.

    Warto z tego powodu uprzedzić osobę pracującą przy takiej maszynie,
    że reguły trzeba odtąd dodawać wprost.

    Odnotowuję, że skutek jest widoczny dla użytkownika w sposób
    negatywny: nie pojawia się nic, co wcześniej się pojawiało.
    Użytkownik nie dostanie informacji, że coś zostało zablokowane.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: reguł już istniejących, połączeń wychodzących,
    pracy programów nienasłuchujących, logowania, drukowania.
  en: |
    The class is "needs review", and the object of the review is whether anybody upon this machine makes firewall
    rules by that road.

    The commonest place is a station for programming or for trials, upon which listening programs of one's own are
    run. After the change the window will cease to show, and the program will simply not take joinings - with no
    message at all. It is a misleading mark, looking like a fault in the program and not like the firewall.

    For that reason it is worth forewarning whoever works at such a machine that rules must from now be added
    outright.

    I set down that the consequence is plain to the user in a negative manner: nothing shows that showed before.
    The user will get no word that anything was blocked.

    The consequence shows at once, with no restart.

    What this does not break: rules already standing, outbound joinings, the work of programs that do not listen,
    logging on, or printing.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - user-interface
  what_breaks:
    pl:
      - Na stanowisku programistycznym program nasłuchujący przestanie przyjmować połączenia bez żadnego komunikatu
      - Objaw wygląda na błąd programu, a nie na zaporę, więc szukanie przyczyny idzie w złą stronę
      - Osobę pracującą przy takiej maszynie warto uprzedzić, że reguły trzeba odtąd dodawać wprost
      - Reguły już istniejące nie są tworzone ani usuwane przez tę zmianę i działają dalej
      - Połączenia wychodzące, praca programów nienasłuchujących, logowanie i drukowanie pozostają bez zmian
    en:
      - Upon a station for programming a listening program will cease to take joinings with no message at all
      - The mark looks like a fault in the program and not like the firewall, so the search for the cause goes the wrong way
      - Whoever works at such a machine is best forewarned that rules must from now be added outright
      - Rules already standing are neither made nor taken away by this change and work on
      - Outbound joinings, the work of programs that do not listen, logging on and printing stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko służy do programowania i reguły zapory powstają na nim w odpowiedzi na pytanie zadawane użytkownikowi
    en:
      - The station serves for programming and firewall rules come about upon it in answer to the question put to the user
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $profiles = Get-NetFirewallProfile -ErrorAction Stop
      if ($null -eq $profiles -or @($profiles).Count -lt 3) { 'CHECK_ERROR' }
      else {
        # The three profiles are weighed together. Naming the ones that fall out
        # matters, a machine set in two of three being a different case from one
        # set in none.
        $wrong = @($profiles | Where-Object { $_.NotifyOnListen -ne 'False' })
        if ($wrong.Count -eq 0) { 'ALL_SILENT' } else { 'NOTIFIES_IN_' + ($wrong.Name -join '_') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'ALL_SILENT'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Get-NetFirewallProfile |
      Select-Object -Property Name, NotifyOnListen |
      ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Set-NetFirewallProfile -Profile Domain, Private, Public -NotifyOnListen False

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    foreach ($p in @($b)) {
      Set-NetFirewallProfile -Profile $p.Name -NotifyOnListen $p.NotifyOnListen
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/

notes:
  pl: |
    Reguła bywa odbierana jako odebranie użytkownikowi informacji i warto,
    żeby aplikacja wyjaśniła, dlaczego jest odwrotnie. Okno zapory nie
    informuje — ono pyta, i to w momencie, w którym odpowiedź jest z góry
    wymuszona przez to, co człowiek właśnie robi.

    Argument wart postawienia wprost dotyczy tego, kto z tego okna
    korzysta. Program, który ma prawo nasłuchiwać, dostaje regułę przy
    instalacji. Okno pojawia się głównie dla programów, które reguły nie
    dostały — a wśród nich jest i ten, który napastnik właśnie uruchomił.

    Odnotowuję objaw po zmianie, bo jest mylący. Program nie dostaje
    komunikatu o blokadzie i wygląda na zepsuty. Na stanowisku
    programistycznym warto uprzedzić o tym zawczasu, bo inaczej pierwsza
    godzina pójdzie na szukanie błędu w kodzie, którego tam nie ma.
  en: |
    The rule is at times taken for a taking of word from the user, and it is well that the application set out why
    the opposite is true. The firewall's window does not inform - it asks, and at an hour when the answer is
    forced beforehand by what the person is just at.

    The argument worth putting outright touches who makes use of that window. A program that has the right to
    listen gets a rule at its installing. The window shows chiefly for programs that got no rule - and among them
    is the one the attacker has just started.

    I set down the mark after the change, that being a misleading one. The program gets no message about a
    blocking and looks broken. Upon a station for programming it is worth forewarning of that, else the first hour
    will go to the seeking of a fault in code where none is.
