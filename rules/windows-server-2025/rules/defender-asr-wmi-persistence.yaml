id: win2025-defender-asr-wmi-persistence

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft Defender Exploit Guard > Attack Surface Reduction
  title:
    pl: Blokada trwałości przez subskrypcje zdarzeń mechanizmu zarządzania
    en: Persistence through management event subscriptions blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Mechanizm zarządzania systemem pozwala zapisać regułę o postaci
    „gdy zdarzy się to, wykonaj tamto". Reguła taka żyje w bazie
    mechanizmu, przeżywa restart maszyny i nie jest widoczna w żadnym
    z miejsc, w które ludzie zaglądają, szukając rzeczy uruchamianych
    przy starcie.

    Dla napastnika jest to sposób na zostanie w maszynie na stałe.
    Nie ma pliku w katalogu autostartu, nie ma zadania w harmonogramie,
    nie ma wpisu w rejestrze w miejscu, które ktoś sprawdzi. Jest wpis
    w bazie mechanizmu zarządzania i wyzwalacz, którym może być
    cokolwiek — zalogowanie użytkownika, upływ czasu, uruchomienie
    procesu.

    Punkt zamyka właśnie to: zakładanie takich subskrypcji.

    Na serwerze wartość jest wyższa niż na stanowisku i wynika to
    z prostego rachunku czasu. Trwałość ma sens wtedy, gdy maszyna
    pracuje. Stanowisko jest wyłączane, przenoszone, przestawiane,
    czasem przeinstalowywane. Serwer stoi latami. Napastnik, który
    zdołał zostawić na nim wyzwalacz, ma tam miejsce, które zostanie
    po zamknięciu incydentu, po zmianie haseł i po wymianie osoby,
    która się tym zajmowała.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość pozostawienia na serwerze trwałego wyzwalacza w miejscu,
    którego zwykłe sprawdzenie autostartu nie obejmuje.
  en: |
    The mechanism for the management of the system lets a rule be written of the shape "where this
    happens, do that". Such a rule lives in the mechanism's store, outlives a restart of the
    machine and is seen in none of the places people look into when seeking things run at starting.

    For an attacker it is a way of staying in the machine for good. There is no file in the folder
    of self-starting, no task in the timetable, no entry in the register in a place somebody will
    check. There is an entry in the store of the mechanism of management and a trigger, which may
    be anything - a user's signing in, a passing of time, a process's starting.

    The item shuts just that - the laying down of such subscriptions.

    On a server the worth is higher than at a station and it comes of a simple reckoning of time.
    Persistence has sense where a machine works. A station is switched off, carried about, set over,
    at times set up anew. A server stands for years. An attacker who managed to leave a trigger
    upon it has there a place that will outlive the shutting of the incident, the altering of words
    of passage and the changing of the person who dealt with it.

    What an attacker gains while the item goes unmet: the means of leaving on the server a lasting
    trigger in a place an ordinary checking of self-starting does not take in.

disruption_description:
  pl: |
    Podnoszę tu klasę względem paczki stanowiska roboczego i powód jest
    konkretny, a nie ostrożnościowy.

    Subskrypcje zdarzeń mechanizmu zarządzania są na serwerze narzędziem
    prawidłowym i używanym. Na stanowisku prawie nikt ich nie zakłada —
    i dlatego tamta reguła może iść hurtem. Tutaj zakładają je
    systemy monitorowania, agenty inwentaryzacji, narzędzia zarządzania
    konfiguracją i własne skrypty utrzymaniowe, pisane często lata temu
    przez osobę, której już nie ma.

    Ta ostatnia grupa jest najtrudniejsza. Subskrypcja założona kiedyś
    i działająca od lat nie jest nigdzie udokumentowana właśnie dlatego,
    że działa. Nikt o niej nie pamięta, dopóki nie przestanie.

    Rzecz do zrobienia przed zmianą jest więc konkretna: wypisz
    subskrypcje istniejące na tej maszynie i ustal, skąd pochodzi każda
    z nich. Te, których pochodzenia nie da się ustalić, są osobnym
    zagadnieniem i wymagają uwagi niezależnie od tego punktu.

    Blokada dotyczy zakładania nowych, a nie wykonywania istniejących.
    Subskrypcja już zapisana działa dalej — także ta, którą zostawił
    napastnik. Punkt nie jest więc środkiem naprawczym na maszynie już
    opanowanej i nie należy go tak traktować.

    Objaw trafienia jest na serwerze cichy: agent, który przy instalacji
    albo aktualizacji nie zdołał założyć swojej subskrypcji, zwykle
    działa dalej, tylko część jego funkcji milczy.

    Zmiana cofa się natychmiast i nie wymaga restartu.

    Gdy produkt ochronny innego wytwórcy zarządza maszyną, ustawienie
    jest zapisywane, ale bezczynne, i audyt zgłasza stan „nie dotyczy".
  en: |
    I raise the class here against the working station's pack, and the ground is a set one and not
    one of caution.

    Subscriptions to the events of the mechanism of management are on a server a right tool and a
    used one. At a station all but nobody lays them down - and therefore that rule may go in bulk.
    Here they are laid down by systems of watching, agents of taking stock, tools for the managing
    of setups and one's own scripts of upkeep, written often years ago by a person who is no longer
    there.

    That last band is the hardest. A subscription laid down once and working for years is set down
    nowhere for the very reason that it works. Nobody remembers it until it stops.

    The thing to do before the change is therefore a set one - write out the subscriptions standing
    on this machine and settle whence each of them comes. Those whose springing cannot be settled
    are a matter apart and call for heed whatever this item says.

    The blocking bears on the laying down of new ones and not on the working of those that stand. A
    subscription already written works on - that one too which an attacker left. The item is
    therefore no means of mending on a machine already held and should not be taken for one.

    The symptom of a striking is on a server a quiet one - an agent that at its setting up or
    freshening could not lay down its subscription mostly works on, only some part of its doings
    falling silent.

    The change is undone at once and takes no restart.

    Where a guarding product of another maker rules the machine, the setting is written but idle,
    and the audit reports the state "does not apply".

implementation_consequences:
  impact_areas:
    - scripting-and-automation
    - diagnostics-and-reporting
    - logging-and-audit
  what_breaks:
    pl:
      - System monitorowania zakładający subskrypcję przy instalacji może jej nie założyć
      - Własne skrypty utrzymaniowe oparte na subskrypcjach przestaną dawać się instalować od nowa
      - Objaw jest cichy, bo agent zwykle działa dalej, tylko część jego funkcji milczy
      - Blokada dotyczy zakładania nowych subskrypcji, a nie wykonywania już istniejących
      - Przy produkcie ochronnym innego wytwórcy ustawienie jest zapisywane, ale bezczynne
    en:
      - A system of watching that lays down a subscription at its setting up may fail to lay it down
      - One's own scripts of upkeep resting on subscriptions will stop being settable anew
      - The symptom is quiet, the agent mostly working on with some part of its doings silent
      - The blocking bears on the laying down of new subscriptions and not on the working of standing ones
      - Where a guarding product of another maker rules, the setting is written but idle
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie wypisano subskrypcji istniejących na tej maszynie i nie ustalono, skąd pochodzą
      - Na maszynie przewidziano instalację agentów, które zakładają subskrypcje przy wdrożeniu
    en:
      - The subscriptions standing on this machine were not written out nor their springing settled
      - Agents that lay down subscriptions at their rolling out are meant to be set up on this machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
      $name = 'e6db77e5-3df2-4cf1-b95a-636979351e5b'
      # A third-party product in charge means these settings are written but
      # idle, so the honest answer is that the question does not apply here.
      $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
      $others = @()
      if ($null -eq $status -or $status.AMRunningMode -ne 'Normal') {
        $others = @(
          Get-CimInstance -Namespace 'root\SecurityCenter2' `
            -ClassName AntiVirusProduct -ErrorAction SilentlyContinue |
            Where-Object { $_.displayName -notmatch 'Windows Defender|Microsoft Defender' }
        )
      }
      if ($others.Count -gt 0) { 'NOT_APPLICABLE' }
      elseif (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    $name = 'e6db77e5-3df2-4cf1-b95a-636979351e5b'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The blocking bears on the laying down of new subscriptions. Those already
    # written work on, the attacker's among them.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'e6db77e5-3df2-4cf1-b95a-636979351e5b' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/defender-endpoint/attack-surface-reduction-rules-reference

notes:
  pl: |
    Wartość tego punktu na serwerze wynika z rachunku czasu: trwałość
    ma sens tam, gdzie maszyna pracuje latami. Wyzwalacz zostawiony na
    serwerze przeżyje zamknięcie incydentu, zmianę haseł i wymianę
    osoby, która się tym zajmowała.

    Klasę podniosłem, bo subskrypcje zdarzeń są na serwerze narzędziem
    prawidłowym — zakładają je systemy monitorowania i własne skrypty
    utrzymaniowe, często pisane lata temu i nigdzie nieudokumentowane
    właśnie dlatego, że działają.

    Ograniczenie, o którym trzeba wiedzieć: blokada dotyczy zakładania
    nowych subskrypcji, nie wykonywania istniejących. Na maszynie już
    opanowanej ten punkt niczego nie naprawia.
  en: |
    This item's worth on a server comes of a reckoning of time - persistence has sense where a
    machine works for years. A trigger left on a server will outlive the shutting of the incident,
    the altering of words of passage and the changing of the person who dealt with it.

    I raised the class, subscriptions to events being on a server a right tool - they are laid down
    by systems of watching and by one's own scripts of upkeep, often written years ago and set down
    nowhere for the very reason that they work.

    A bound one must know of - the blocking bears on the laying down of new subscriptions and not
    on the working of standing ones. On a machine already held this item mends nothing.
