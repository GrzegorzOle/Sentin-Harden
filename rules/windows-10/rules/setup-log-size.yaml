id: win10-setup-log-size

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Setup
  title:
    pl: Maksymalny rozmiar dziennika instalacji
    en: The greatest size of the journal of setup
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wymaga, żeby dziennik instalacji mieścił co najmniej
    trzydzieści dwa tysiące kilobajtów zapisów.

    Dziennik instalacji zbiera przebieg wgrywania poprawek, dodawania
    i usuwania składników systemu oraz zmian wersji. Jest najcichszy
    z trzech: na maszynie utrzymywanej normalnie przyrasta o kilkanaście
    wpisów w miesiącu.

    Właśnie dlatego jego rozmiar bywa uznawany za sprawę bez znaczenia.
    Argument jest jednak odwrotny: skoro dziennik przyrasta powoli, to
    rozmiar wymagany starcza na historię liczoną w latach, a koszt jest
    ten sam co przy pozostałych. Jest to najtańsza historia w całym
    zestawie.

    Wartość ujawnia się przy pytaniu, na które trudno odpowiedzieć
    inaczej: kiedy ta maszyna dostała tę poprawkę i czy w ogóle ją
    dostała. Zapis instalacji jest jedynym miejscem, w którym widać to
    niezależnie od raportów systemu zarządzania aktualizacjami.

    Odnotowuję, że sprawdzenie przy braku zasady odczytuje rozmiar
    ustawiony wprost na dzienniku.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: krótszy
    zapis zmian wprowadzonych w składnikach systemu.
  en: |
    The setting calls for the journal of setup to hold at least two and thirty thousand kilobytes of records.

    The journal of setup gathers the course of the laying on of patches, of the adding and the taking away of the
    system's parts and of changes of version. It is the quietest of the three: upon a machine kept in the ordinary
    way it grows by some tens of entries in a month.

    For that very reason its size is at times held a matter of no weight. The argument runs however the other way:
    the journal growing slowly, the called-for size suffices for a history reckoned in years, and the cost is the
    same as at the others. It is the cheapest history in the whole set.

    The worth shows at a question hard to answer otherwise: when did this machine get that patch and did it get it
    at all. The record of setup is the one place where that is seen apart from the reports of the system that
    rules the servicing.

    I set down that the check, where no policy stands, reads the size set at the journal outright.

    What an attacker gains while the item goes unmet: a shorter record of the changes made in the system's parts.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana zwiększa plik dziennika o wielkość rzędu trzydziestu dwóch
    megabajtów, ale w praktyce plik ten nigdy nie dorasta do swojego
    rozmiaru na maszynie utrzymywanej normalnie. Miejsce jest rezerwowane
    w miarę zapisywania, a nie z góry.

    Odnotowuję, że jest to punkt o koszcie najniższym z trójki. Dziennik
    instalacji rośnie wolno, więc rozmiar wymagany oznacza w praktyce, że
    plik nie zapełni się przez całe życie maszyny.

    Skutek pojawia się natychmiast, bez restartu i bez restartu usługi.

    Czego to nie psuje: wgrywania poprawek, dodawania i usuwania
    składników, pracy programów, logowania, drukowania.
  en: |
    The class is "no disruption".

    The change makes the journal's file greater by some two and thirty megabytes, but in practice that file never
    grows to its size upon a machine kept in the ordinary way. The room is set aside as the writing goes on and
    not beforehand.

    I set down that it is the item of the lowest cost of the three. The journal of setup grows slowly, so the
    called-for size means in practice that the file will not fill up in the whole life of the machine.

    The consequence shows at once, with no restart and no restart of the service.

    What this does not break: the laying on of patches, the adding and the taking away of parts, the work of
    programs, logging on, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Plik dziennika instalacji może urosnąć do trzydziestu dwóch megabajtów, choć w praktyce rośnie wolno
      - Miejsce jest rezerwowane w miarę zapisywania, a nie z góry, więc zmiana nie zajmuje dysku natychmiast
      - Na maszynie utrzymywanej normalnie plik nie zapełni się przez całe jej życie
      - Skutek pojawia się natychmiast, bez restartu maszyny i bez restartu usługi dziennika
      - Wgrywanie poprawek, dodawanie składników, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - The file of the journal of setup may grow to two and thirty megabytes, though in practice it grows slowly
      - The room is set aside as the writing goes on and not beforehand, so the change takes no disk at once
      - Upon a machine kept in the ordinary way the file will not fill up in the whole of its life
      - The consequence shows at once, with no restart of the machine and no restart of the service of the journal
      - The laying on of patches, the adding of parts, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Dysk systemowy jest przycięty do minimum i nie ma na nim zapasu na powiększenie dzienników
    en:
      - The system disk is pared to the least and holds no room to spare for the enlarging of the journals
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Where the policy value is absent the log still has a size in force, set at
      # the log itself. The effective state is read rather than the policy alone,
      # so a machine set by hand is not reported as unmeasured.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
      $policy = (Get-ItemProperty -Path $path -ErrorAction SilentlyContinue).MaxSize
      if ($null -ne $policy) { [string][int]$policy }
      else {
        $log = Get-WinEvent -ListLog Setup -ErrorAction Stop
        [string][int]($log.MaximumSizeInBytes / 1024)
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '32768'
  comparison: not-less-than

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    $name = 'MaxSize'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written in kilobytes, not in bytes - a size given in bytes
    # would be read as a log some thousand times larger than meant.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Setup'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaxSize' -Value 32768 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła bywa odpuszczana jako nieistotna, bo dziennik instalacji jest
    cichy. Warto, żeby aplikacja odwróciła ten argument: właśnie dlatego,
    że jest cichy, wymagany rozmiar daje historię liczoną w latach — przy
    koszcie takim samym jak przy dziennikach głośnych.

    Argument wart postawienia wprost dotyczy pytania o poprawki. Raport
    systemu zarządzania aktualizacjami mówi, co ten system wgrał. Dziennik
    instalacji mówi, co maszyna faktycznie przyjęła — a to bywają dwie
    różne rzeczy, zwłaszcza gdy ktoś wgrywał coś ręcznie albo gdy
    poprawka została później usunięta.

    Odnotowuję, że miejsce na dysku jest rezerwowane w miarę zapisywania.
    Ustawienie rozmiaru nie zajmuje trzydziestu dwóch megabajtów od razu
    i warto to wymienić, bo obawa o miejsce jest tu najczęstszym powodem
    odpuszczenia punktu.
  en: |
    The rule is at times let go as of no weight, the journal of setup being quiet. It is well that the application
    turn that argument about: for the very reason that it is quiet, the called-for size gives a history reckoned
    in years - at a cost the same as at the loud journals.

    The argument worth putting outright touches the question about patches. The report of the system that rules
    the servicing says what that system laid on. The journal of setup says what the machine truly took - and those
    are at times two several things, above all where somebody laid something on by hand or where a patch was later
    taken away.

    I set down that the room upon the disk is set aside as the writing goes on. The setting of the size does not
    take two and thirty megabytes at once, and that is worth naming, a fear for room being here the commonest
    ground for the letting go of the item.
