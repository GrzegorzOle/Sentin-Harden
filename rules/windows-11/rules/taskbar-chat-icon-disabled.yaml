id: win11-taskbar-chat-icon-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Chat
  title:
    pl: Ikona wbudowanego komunikatora na pasku zadań wyłączona
    en: The built-in messenger's icon on the taskbar switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Na pasku zadań stanowiska domowego i firmowego stoi domyślnie ikona
    komunikatora przeznaczonego do użytku prywatnego. Jedno kliknięcie otwiera
    okno rozmowy powiązane z kontem osobistym użytkownika, a nie z kontem
    służbowym.

    Wartość tego punktu jest umiarkowana i warto to powiedzieć wprost: ukrycie
    ikony nie usuwa programu ani nie odcina go od sieci. Zmienia się droga
    wejścia, nie sama możliwość.

    To, co zmiana daje, leży gdzie indziej. Ikona na pasku zadań jest
    zaproszeniem — sprawia, że kanał prywatny stoi na stanowisku obok kanałów
    służbowych i wygląda tak samo pierwszorzędnie. Wiadomości, odnośniki i pliki
    przychodzące tą drogą omijają wszystko, co organizacja zbudowała wokół
    poczty: filtrowanie, oznaczanie nadawcy z zewnątrz, zapis do archiwum.
    Napastnik szukający drogi do człowieka wybiera kanał, którego nikt nie
    pilnuje — i to jest cała wartość tego punktu.

    Punkt wyłącza ikonę tak, że użytkownik nie może jej przywrócić
    w ustawieniach.
  en: |
    On the taskbar of a household and a company station alike stands, by default, the
    icon of a messenger meant for private use. One click opens a conversation window
    tied to the user's personal account rather than to their work one.

    This item's worth is moderate, and it is worth saying so plainly: hiding the icon
    removes neither the program nor its reach to the network. What changes is the way
    in, not the possibility itself.

    What the change does give lies elsewhere. An icon on the taskbar is an invitation
    - it puts a private channel on the station beside the work ones and makes it look
    every bit as first-class. Messages, links and files arriving that way pass by
    everything the organisation has built around mail: filtering, marking a sender as
    external, keeping a copy in the archive. An attacker looking for a way to a person
    picks the channel nobody watches - and that is this item's entire worth.

    The item switches the icon off so that the user cannot bring it back in settings.

disruption_description:
  pl: |
    Sprawdzenia wymaga jedno: czy ktoś na stanowisku z tego komunikatora
    korzysta w pracy.

    Zdarza się to rzadko, ale nie nigdy — w małych organizacjach, w kontakcie
    z klientem indywidualnym albo tam, gdzie zespół zżył się z narzędziem, zanim
    pojawiło się służbowe. Taka osoba po wdrożeniu straci ikonę i możliwość jej
    przywrócenia; program pozostanie dostępny z menu, ale przestanie być pod
    ręką.

    Poza tym przypadkiem zmiany nie widać. Ikona znika z paska, ustawienia
    przestają pozwalać na jej pokazanie i na tym kończy się cały skutek. Nic nie
    przestaje działać, nic się nie odinstalowuje, nie ma restartu ani wylogowania.

    Ponieważ waga samego punktu jest niska, a jedyny jego koszt dotyczy osób
    faktycznie używających tego narzędzia, jest to dobry kandydat do świadomego
    odpuszczenia tam, gdzie takie użycie istnieje. Zapisanie takiej decyzji
    z uzasadnieniem jest tu prawidłowym wynikiem pracy, a nie zaniedbaniem.

    Skutek widać po odświeżeniu paska zadań, czyli przy następnym zalogowaniu.
  en: |
    One thing needs checking: whether anybody at the station uses this messenger for
    work.

    It happens rarely but not never - in small organisations, in contact with an
    individual customer, or where a team grew used to the tool before a work one
    appeared. After the rollout such a person loses the icon and the means of bringing
    it back; the program stays reachable from the menu but stops being at hand.

    Apart from that case the change is not visible. The icon disappears from the bar,
    settings stop allowing it to be shown, and there the whole effect ends. Nothing
    stops working, nothing is uninstalled, there is no restart and no signing out.

    Since the item's own weight is low and its only cost touches people actually using
    the tool, it is a good candidate for being deliberately let go where such use
    exists. Recording that decision with its reasons is a proper result of the work
    here rather than a neglect.

    The effect shows once the taskbar is refreshed, that is at the next sign-in.

implementation_consequences:
  impact_areas:
    - user-interface
    - email-and-attachments
  what_breaks:
    pl:
      - Ikona komunikatora znika z paska zadań i użytkownik nie przywróci jej w ustawieniach
      - Osoba używająca tego narzędzia w kontakcie z klientem straci je spod ręki
      - Sam program pozostaje zainstalowany i dostępny z menu
    en:
      - The messenger's icon disappears from the taskbar and the user cannot bring it back in settings
      - Somebody using the tool in contact with a customer loses it from under their hand
      - The program itself stays installed and reachable from the menu
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Zespół używa tego komunikatora w kontakcie z klientami
      - Na stanowisku nie ma innego narzędzia do rozmów, a kontakt bieżący odbywa się tą drogą
    en:
      - The team uses this messenger in contact with customers
      - The station has no other conversation tool and day-to-day contact goes this way
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The entry takes values from a set: one shows the icon, two hides it but
      # lets the user bring it back, three switches it off for good.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
      $name = 'ChatIcon'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
    $name = 'ChatIcon'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ChatIcon' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-admx-taskbar

notes:
  pl: |
    Wpis przyjmuje trzy wartości i tylko trzecia zamyka sprawę. Dwójka ukrywa
    ikonę, ale zostawia użytkownikowi przełącznik w ustawieniach, więc stan
    utrzymuje się wyłącznie do chwili, gdy ktoś zajrzy w ustawienia paska zadań.
    Wymagana jest trójka.

    Ikona jest osobna od samego programu i od jego automatycznego startu.
    Wyłączenie ikony nie odinstalowuje narzędzia — jeżeli celem jest usunięcie
    go z maszyny, to jest osobna praca, wykonywana poza tą regułą.

    Gałąź zasad należy wyłącznie do tego ustawienia, więc wycofanie usuwa ją
    w całości, gdy przed wdrożeniem nie istniała.
  en: |
    The entry takes three values and only the third settles the matter. Two hides the
    icon but leaves the user a switch in settings, so the state holds only until
    somebody looks into the taskbar settings. Three is what is required.

    The icon is separate from the program itself and from its automatic start.
    Switching the icon off does not uninstall the tool - where the aim is removing it
    from the machine, that is separate work carried out outside this rule.

    The policy key belongs to this setting alone, so rollback removes it whole where
    it did not exist before the change.
