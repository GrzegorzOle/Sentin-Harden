id: win2025-secure-boot-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Integrity > Boot
  title:
    pl: Bezpieczny rozruch włączony
    en: Secure Boot enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: critical
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Bezpieczny rozruch sprawdza podpis każdego elementu ładowanego przed
    systemem. Bez niego maszyna uruchomi dowolny program rozruchowy —
    także podmieniony — i zrobi to, zanim cokolwiek w systemie zdąży
    zadziałać.

    Zostawiam kategorię krytyczną, bo jest to fundament, na którym stoi
    wszystko pozostałe w tej paczce. Kod działający przed systemem widzi
    wszystko i może wyłączyć albo oszukać każdy mechanizm uruchamiany
    później: integralność kodu jądra, izolację poświadczeń, szyfrowanie
    dysku, agenta wykrywania. Żaden z nich nie broni się przed czymś, co
    było w maszynie wcześniej.

    Na serwerze chcę nazwać skutek, który na stacji roboczej brzmi
    inaczej. Standardową odpowiedzią na pytanie „czy tej maszynie jeszcze
    ufamy" jest na serwerze przeinstalowanie systemu. Bezpieczny rozruch
    jest tym, co nadaje tej odpowiedzi sens: bez niego program rozruchowy
    przeżywa formatowanie, więc maszyna po przeinstalowaniu jest tą samą
    maszyną, co przed nim. Procedura, na której opiera się reagowanie na
    incydenty, przestaje być procedurą, a staje się rytuałem.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: miejsce
    przed systemem, którego nie czyści przeinstalowanie i którego nie
    widzi żaden mechanizm uruchamiany po nim.
  en: |
    Secure Boot verifies the signature of every component loaded before
    the system. Without it the machine will start any boot program -
    including a substituted one - and will do so before anything in the
    system gets a chance to act.

    I keep the category critical, because this is the foundation
    everything else in this pack stands on. Code running before the system
    sees everything and can disable or deceive every mechanism started
    later: kernel code integrity, credential isolation, disk encryption,
    the detection agent. None of them defends against something that was
    in the machine first.

    On a server I want to name a consequence that sounds different on a
    workstation. The standard answer to the question "do we still trust
    this machine" is, on a server, to reinstall the system. Secure Boot is
    what gives that answer meaning: without it the boot program survives
    the format, so the machine after a reinstall is the same machine it
    was before. The procedure incident response rests on stops being a
    procedure and becomes a ritual.

    What an attacker gains while the item goes unmet: a place before the
    system that a reinstall does not clear and that no mechanism started
    afterwards can see.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i od razu odnotowuję
    rzecz, która odróżnia ten punkt od wszystkich pozostałych w paczce:
    włączenie odbywa się w oprogramowaniu układowym, poza systemem.
    Dlatego reguła niczego nie uruchamia i podaje wyłącznie stan.

    Na serwerze „przy maszynie" nie jest drobnym zastrzeżeniem. Maszyna
    stoi w zamkniętym pomieszczeniu, do którego trzeba pojechać, albo
    w cudzej serwerowni, gdzie fizyczny dostęp oznacza zgłoszenie,
    okno i czyjś kalendarz. Alternatywą jest karta zarządzania — i to
    ona jest tutaj właściwym narzędziem, o ile ktoś wcześniej sprawdził,
    że działa.

    Skutki są poważniejsze niż na stacji roboczej. Serwer uruchamiany
    w trybie zgodności to zwykle maszyna założona lata temu i przenoszona
    z wersji na wersję; konwersja układu dysku na serwerze z danymi
    produkcyjnymi jest operacją innego kalibru niż na laptopie i wymaga
    sprawdzonej kopii, a nie deklaracji, że kopia jest. Nieudana
    konwersja kończy się systemem, który nie startuje.

    Przestaną uruchamiać się także niepodpisane programy rozruchowe:
    część narzędzi serwisowych producenta, starsze obrazy odzyskiwania
    i nośniki diagnostyczne, z których korzysta się dokładnie wtedy, gdy
    jest źle.
  en: |
    I keep the class "needs a planned rollout" and note straight away the
    thing that sets this item apart from every other in the pack:
    switching it on happens in the firmware, outside the system. That is
    why the rule runs nothing and only reports the state.

    On a server "at the machine" is no small caveat. The machine stands in
    a locked room somebody has to drive to, or in somebody else's data
    centre where physical access means a ticket, a window and another
    party's calendar. The alternative is the management card - and that is
    the right tool here, provided somebody has checked beforehand that it
    works.

    The consequences are more serious than on a workstation. A server
    booting in compatibility mode is usually a machine built years ago and
    carried forward from version to version; converting the disk layout on
    a server holding production data is an operation of a different
    calibre than on a laptop, and calls for a verified backup rather than
    an assurance that one exists. A failed conversion ends with a system
    that does not start.

    Unsigned boot programs stop running too: some of the vendor's service
    tools, older recovery images and diagnostic media - the ones reached
    for at exactly the moment things are going badly.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - drivers-and-devices
    - encryption-and-tls
  what_breaks:
    pl:
      - Niepodpisane programy rozruchowe, narzędzia serwisowe producenta i nośniki diagnostyczne przestaną się uruchamiać
      - Serwer w trybie zgodności wymaga konwersji układu dysku, a na maszynie z danymi produkcyjnymi jest to operacja innego kalibru
      - Nieudana konwersja układu dysku kończy się systemem, który nie startuje
      - Włączenie wykonuje się w oprogramowaniu układowym, więc wymaga dostępu fizycznego albo sprawdzonej karty zarządzania
    en:
      - Unsigned boot programs, vendor service tools and diagnostic media stop running
      - A server in compatibility mode needs its disk layout converted, and on a machine holding production data that is an operation of a different calibre
      - A failed disk layout conversion ends with a system that does not start
      - Switching it on happens in the firmware, so it needs physical access or a verified management card
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie uruchamia się narzędzie serwisowe albo obraz odzyskiwania bez podpisu uznawanego przez to urządzenie
      - Dysk używa układu zgodnościowego, a konwersji nie da się przeprowadzić ze sprawdzoną kopią danych
      - Producent sprzętu nie dostarcza aktualnych kluczy rozruchowych dla tego modelu serwera
      - Nie ma ani dostępu fizycznego do maszyny, ani sprawdzonego dostępu przez kartę zarządzania
    en:
      - The machine runs a service tool or recovery image without a signature this device recognises
      - The disk uses the compatibility layout and conversion cannot be done with a verified backup of the data
      - The hardware vendor does not supply current boot keys for this server model
      - There is neither physical access to the machine nor verified access through the management card
  reversibility: difficult

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\SecureBoot\State'
      # The key exists only where the firmware knows the mechanism at all.
      # Its absence means a machine started the old way, and that is a finding
      # in itself rather than an inability to check.
      if (-not (Test-Path -Path $path)) { 'LEGACY_BOOT' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).UEFISecureBootEnabled
        if ($null -eq $value) { 'LEGACY_BOOT' }
        elseif ([int]$value -eq 1) { 'ENABLED' }
        else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: ENABLED
  comparison: equals

privileges: user
runnable: false

sources:
  - https://learn.microsoft.com/windows-hardware/design/device-experiences/oem-secure-boot

notes:
  pl: |
    Reguła jest wyłącznie do odczytu i nie ma przycisku uruchomienia — nie
    dlatego, że brakuje kopii zapasowej, tylko dlatego, że zmiany nie da
    się wprowadzić z poziomu systemu. Polecenie do skopiowania też nie
    miałoby sensu: krok wykonuje się w oprogramowaniu układowym, przy
    maszynie albo przez kartę zarządzania.

    Brak klucza stanu raportuje jako rozruch w trybie zgodności, a nie
    jako niemożność sprawdzenia. To rozróżnienie jest tu istotne: maszyna
    bez bezpiecznego rozruchu nie jest maszyną, o której nic nie wiadomo —
    jest maszyną, o której wiadomo dość.

    Sprawdzenie czyta stan z rejestru, nie przez polecenie wymagające
    uprawnień administratora. Dzięki temu ten punkt daje wynik także
    w sesji nieuprzywilejowanej, w odróżnieniu od większości paczki.
  en: |
    The rule is read-only and has no run button - not because a backup is
    missing, but because the change cannot be made from within the system.
    A command to copy would make no sense either: the step is performed in
    the firmware, at the machine or through the management card.

    A missing state key is reported as a compatibility-mode boot rather
    than an inability to check. That distinction matters here: a machine
    without Secure Boot is not a machine nothing is known about - it is a
    machine about which enough is known.

    The check reads the state from the registry rather than through a
    command requiring administrator rights. As a result this item yields a
    verdict in an unprivileged session too, unlike most of the pack.
