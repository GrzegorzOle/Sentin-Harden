id: win10-peer-networking-identity-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zarządzania tożsamościami w sieci równorzędnej wyłączona
    en: The service keeping identities in a network of peers switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę prowadzącą tożsamości używane w sieci
    równorzędnej — te, którymi maszyna przedstawia się innym uczestnikom.

    Tożsamość taka nie jest kontem systemowym. Jest osobnym bytem
    tworzonym na potrzeby sieci równorzędnej, z własnym kluczem, własną
    nazwą i własnym okresem ważności. Powstaje bez udziału administratora
    i żyje obok kont, którymi zarządza organizacja.

    Zagrożenie leży właśnie w tej odrębności. Na maszynie pojawia się
    poświadczenie, którego nie widać w żadnym wykazie kont, którego nikt
    nie wyłącza przy odejściu pracownika i którego ważność nie podlega
    zasadom haseł.

    Skutkiem drugim jest to, że tożsamość ta wystarcza do udziału
    w grupie. Maszyna dołącza do zbioru innych maszyn, przedstawiając się
    poświadczeniem, którego nikt poza nią nie nadał ani nie zatwierdził.

    Odnotowuję, że usługa jest podstawą dla dwóch pozostałych usług sieci
    równorzędnej. Bez tożsamości nie ma ani publikowania nazwy, ani
    członkostwa w grupie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    poświadczenie tworzone na maszynie poza wszelkim zarządzaniem kontami.
  en: |
    The setting switches off the service keeping the identities used in a network of peers - those by which the
    machine shows itself to the others taking part.

    Such an identity is no reckoning of the system. It is a thing apart, made for the needs of the network of
    peers, with a key of its own, a name of its own and a term of its own. It comes about without an
    administrator's part in it and lives beside the reckonings the body governs.

    The danger lies in that very apartness. Upon the machine there appears a warrant seen upon no roll of
    reckonings, that nobody switches off when a worker leaves, and whose term falls under no policy of words of
    passing.

    The second upshot is that such an identity suffices for a part in a group. The machine joins a gathering of
    other machines, showing itself by a warrant nobody outside it gave out or approved.

    I set down that the service is the ground of the two remaining services of the network of peers. Without an
    identity there is neither a putting out of a name nor a membership of a group.

    What an attacker gains while the item goes unmet: a warrant made upon the machine outside all governing of
    reckonings.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, czy
    ktokolwiek na maszynie korzysta z sieci równorzędnej.

    Odnotowuję, że wyłączenie tej usługi jest w praktyce wyłączeniem
    całego mechanizmu. Dwie pozostałe usługi sieci równorzędnej opierają
    się na tożsamościach i bez nich nie mają czym się przedstawić.

    Miejscem wartym uwagi są te same narzędzia, które wymieniono przy
    grupowaniu: starsze programy do wspólnej pracy i zdalnej pomocy.
    Po zmianie zgłoszą brak tożsamości albo brak połączenia, zależnie
    od tego, jak zostały napisane.

    Zastrzegam, że tożsamości utworzone wcześniej zostają na dysku.
    Wyłączenie usługi nie kasuje ich, więc powrót przywraca stan
    poprzedni bez zakładania ich od nowa.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: kont systemowych, logowania, dostępu do udziałów,
    przeglądania stron, drukowania, pracy programów.
  en: |
    The class is "needs review", and the object of the review is whether anybody at all upon the machine uses the
    network of peers.

    I set down that the switching off of this service is in practice the switching off of the whole mechanism. The
    two remaining services of the network of peers rest upon identities and without them have nothing to show
    themselves by.

    The place worth notice is the same tools named at the grouping: older programs for common work and for help
    from afar. After the change they will report either a want of an identity or a want of a joining, according to
    how they were written.

    I set down that identities made earlier stay upon the disk. The switching off of the service deletes them not,
    so the going back gives the former state again without their being set up anew.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: reckonings of the system, logging on, the reach of shares, the looking over of
    pages, printing, or the work of programs.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - network-and-firewall
    - legacy-applications
  what_breaks:
    pl:
      - Wyłączenie tej usługi jest w praktyce wyłączeniem całego mechanizmu sieci równorzędnej
      - Starsze programy do wspólnej pracy i zdalnej pomocy zgłoszą brak tożsamości albo brak połączenia
      - Tożsamości utworzone wcześniej zostają na dysku i nie trzeba zakładać ich od nowa po powrocie
      - Dwie pozostałe usługi sieci równorzędnej opierają się na tożsamościach i bez nich nie mają czym się przedstawić
      - Konta systemowe, logowanie, dostęp do udziałów, drukowanie i praca programów pozostają bez zmian
    en:
      - The switching off of this service is in practice the switching off of the whole mechanism of the network of peers
      - Older programs for common work and for help from afar will report either a want of an identity or a want of a joining
      - Identities made earlier stay upon the disk and need not be set up anew after a going back
      - The two remaining services of the network of peers rest upon identities and without them have nothing to show themselves by
      - Reckonings of the system, logging on, the reach of shares, printing and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Narzędzie współpracy używane na maszynie przedstawia się tożsamością sieci równorzędnej i nie ma innej drogi
    en:
      - A tool of working together used upon the machine shows itself by an identity of the network of peers and has no other road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\p2pimsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'p2pimsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'p2pimsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'p2pimsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-identity-manager

notes:
  pl: |
    Reguła jest podstawą trójki usług sieci równorzędnej i warto, żeby
    aplikacja postawiła to wprost: wyłączenie jej zamyka mechanizm
    w całości, bo pozostałe dwie usługi nie mają czym się przedstawić.
    Kto chce wdrożyć jedną z trzech, powinien wdrożyć właśnie tę.

    Argument wart zachowania dotyczy natury tożsamości. Nie jest to konto
    systemowe. Jest poświadczeniem tworzonym na maszynie, poza wykazem
    kont, poza zasadami haseł i poza procedurą odejścia pracownika —
    czyli poza wszystkim, na czym opiera się zarządzanie dostępem.

    Odnotowuję, że tożsamości utworzone wcześniej zostają na dysku.
    Ma to znaczenie przy wycofaniu zmiany: powrót przywraca stan
    poprzedni bez zakładania ich od nowa.
  en: |
    The rule is the ground of the three services of the network of peers, and it is well that the application put
    that outright: the switching off of it shuts the mechanism whole, the other two services having nothing to
    show themselves by. Whoever would roll out one of the three ought to roll out this one.

    The argument worth keeping touches the nature of an identity. It is no reckoning of the system. It is a
    warrant made upon the machine, outside the roll of reckonings, outside the policy of words of passing and
    outside the course taken when a worker leaves - which is to say outside everything upon which the governing of
    reach rests.

    I set down that identities made earlier stay upon the disk. That has weight at the drawing back of the change:
    the going back gives the former state again without their being set up anew.
