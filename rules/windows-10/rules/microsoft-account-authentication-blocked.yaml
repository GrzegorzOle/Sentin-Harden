id: win10-microsoft-account-authentication-blocked

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Microsoft account
  title:
    pl: Uwierzytelnianie aplikacji kontem dostawcy zablokowane
    en: The authenticating of applications by a provider's account blocked
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie blokuje usługę, przez którą aplikacje uwierzytelniają się
    kontem powiązanym z dostawcą systemu.

    Reguła sąsiednia zamyka logowanie do maszyny takim kontem. Ta zamyka
    rzecz inną i często pomijaną: aplikację, która o takie konto prosi już
    po zalogowaniu. Rozróżnienie jest istotne, bo maszyna z zablokowanym
    logowaniem, ale z działającą usługą uwierzytelniania, wciąż pozwala
    powiązać sesję lokalną z tożsamością spoza organizacji.

    Skutek tego powiązania jest konkretny. Ustawienia, zakładki, hasła
    zapisane w przeglądarce i zawartość katalogów synchronizowanych zaczynają
    wędrować między tą maszyną a wszystkim innym, na czym to samo konto
    zostało użyte — w tym sprzętem prywatnym. Dane wychodzą wtedy z maszyny
    drogą przewidzianą, więc żadne zabezpieczenie sieciowe tego nie zatrzyma
    ani nie zapisze.

    Blokada tej usługi zamyka drogę u źródła, zamiast ścigać każdą aplikację
    z osobna. Aplikacje dalej działają; przestają dostawać tożsamość, o którą
    proszą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę wyjścia
    danych z maszyny przez konto spoza organizacji, bez ruchu, który dałoby
    się rozpoznać jako niepożądany.
  en: |
    The setting blocks the service through which applications authenticate by an account linked to the system's
    provider.

    The neighbouring rule closes the signing in to the machine by such an account. This one closes another
    thing, and one often passed over: an application asking for such an account after the logon has already
    happened. The distinction matters, a machine with the signing in blocked but the authenticating service
    working still allowing a local session to be tied to an identity outside the organisation.

    The consequence of that tying is a concrete one. Settings, bookmarks, passwords kept in the browser and the
    contents of synchronised directories begin travelling between this machine and everything else the same
    account has been used on - private gear among it. Data leave the machine then by a foreseen road, so no
    network safeguard will halt that or write it down.

    Blocking the service closes the road at its source instead of chasing each application apart. The
    applications work on; they cease getting the identity they ask for.

    What an attacker gains while the item goes unmet: a road out of the machine for data, by an account outside
    the organisation, with no traffic that could be recognised as unwanted.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia" i jest to w tym bloku punkt
    najbardziej odczuwalny dla ludzi.

    Zmiana wchodzi przy następnym zalogowaniu, nie od razu — stąd oznaczenie
    przerwy jako wylogowania. Sesja już otwarta zachowuje uwierzytelnienie
    dotychczasowe.

    Potem przestaje działać sklep systemowy, przestaje działać synchronizacja
    ustawień między maszynami i przestają logować się aplikacje proszące
    o to konto. Część z nich powie o tym wprost; część zachowa się tak,
    jakby brakowało sieci, i to właśnie rozpoznanie zajmuje najwięcej czasu.

    Rzecz do sprawdzenia przed wykonaniem jest jedna i konkretna: czy jakieś
    narzędzie potrzebne do pracy loguje się tym kontem. Zdarza się to przy
    aplikacjach do notatek, do rysowania i przy narzędziach dołączanych do
    sprzętu. Zamiennik zwykle istnieje, ale trzeba go przygotować wcześniej.

    Czego to nie psuje: logowania do maszyny, kont lokalnych, kont
    domenowych, aplikacji niekorzystających z tego konta, usług systemowych,
    sieci, drukowania.
  en: |
    The class is "needs a planned rollout", and it is in this block the item most felt by people.

    The change takes hold at the next logon, not at once - hence the marking of the break as a logging off. A
    session already open keeps the authentication it has.

    Afterwards the system's store ceases working, the synchronising of settings between machines ceases, and
    applications asking for that account cease signing in. Part of them will say so outright; part will behave
    as though the network were wanting, and it is just that recognising which takes the most time.

    There is one concrete thing to review before carrying out: whether some tool needed for the work signs in by
    that account. That happens with applications for notes, for drawing, and with tools that come with a piece
    of gear. A substitute as a rule exists, but has to be prepared beforehand.

    What this does not break: signing in to the machine, local accounts, domain accounts, applications not using
    that account, system services, the network, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Sklep systemowy przestaje działać, a pobieranie i aktualizowanie aplikacji z niego staje się niemożliwe
      - Synchronizacja ustawień, zakładek i haseł przeglądarki między maszynami przestaje działać w obie strony
      - Aplikacje logujące się tym kontem zachowują się czasem tak, jakby brakowało sieci, co utrudnia rozpoznanie przyczyny
      - Zmiana wchodzi przy następnym zalogowaniu, więc sesja już otwarta zachowuje uwierzytelnienie dotychczasowe
      - Logowanie do maszyny, konta lokalne, konta domenowe oraz usługi systemowe i drukowanie pozostają bez zmian
    en:
      - The systems store ceases working and the fetching and updating of applications from it becomes impossible
      - The synchronising of settings, bookmarks and browser passwords between machines ceases in both directions
      - Applications signing in by that account behave at times as though the network were wanting, which hinders the recognising of the cause
      - The change takes hold at the next logon, so a session already open keeps the authentication it has
      - Signing in to the machine, local accounts, domain accounts, system services and printing stay unchanged
  interruption: logoff
  user_visible: true
  do_not_apply_when:
    pl:
      - Do pracy na tej maszynie potrzebne jest narzędzie logujące się kontem dostawcy i nie przygotowano zamiennika
      - Aplikacje na tej maszynie pobiera się i aktualizuje wyłącznie przez sklep systemowy
    en:
      - A tool signing in by the providers account is needed for the work on this machine and no substitute has been prepared
      - Applications on this machine get fetched and updated solely through the systems store
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
      $name = 'DisableUserAuth'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    $name = 'DisableUserAuth'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The change takes hold at the next logon. Afterwards the store stops, the
    # synchronising of settings stops, and part of the applications will behave as
    # though the network were wanting rather than say what happened.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftAccount'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DisableUserAuth' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-accounts

notes:
  pl: |
    Reguła jest w tym bloku jedyną o kategorii wysokiej i zarazem jedyną,
    którą użytkownik zauważy w ciągu godziny. Zestawienie osi jest tu
    trudne — zysk realny, koszt widoczny codziennie — i dokładnie o takich
    punktach mówi macierz decyzyjna, gdy każe opisowi skutków być najlepszym
    w całej aplikacji.

    Warto, żeby aplikacja pokazała ją razem z regułą o logowaniu kontem
    powiązanym i nazwała różnicę wprost. Tamta dotyczy wejścia na maszynę,
    ta — tego, co sesja już otwarta może z maszyny wynieść. Wykonanie samej
    tamtej zostawia drogę wyjścia otwartą, a raport pokaże wtedy obraz
    niepełny.

    Odnotowuję objaw utrudniający rozpoznanie: część aplikacji po tej
    zmianie zachowuje się jak przy braku sieci. Aplikacja, która wymieni to
    w opisie skutków, oszczędzi obsłudze szukania w zupełnie złym miejscu.
  en: |
    The rule is the only one of a high category in this block and at the same time the only one a user will
    notice within an hour. The pairing of the axes is here a hard one - a real gain, a cost felt daily - and it
    is of just such items the decision matrix speaks when it bids the description of consequences be the best in
    the whole application.

    It is well that the application show it together with the rule about signing in by a linked account and name
    the difference outright. That one touches the way onto the machine, this one what a session already open may
    carry off it. Carrying out that one alone leaves the road out open, and the report will then show an
    incomplete picture.

    I set down a symptom that hinders the recognising: part of the applications behave after this change as at a
    want of network. An application naming that in its description of consequences will spare the attendance a
    search in entirely the wrong place.
