id: win10-always-install-elevated

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Installer
  title:
    pl: Instalacja pakietów zawsze z pełnymi uprawnieniami wyłączona
    en: Installing packages always with full rights switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza tryb, w którym każdy pakiet instalacyjny uruchamiany
    przez użytkownika wykonuje się z pełnymi uprawnieniami systemu,
    niezależnie od tego, kim jest ten użytkownik.

    Jest to jedno z najkrótszych przejść od konta zwykłego do pełnych praw,
    jakie istnieją w systemie Windows. Nie wymaga błędu w oprogramowaniu ani
    żadnej sztuczki. Wystarczy zbudować pakiet instalacyjny robiący to, co
    się chce, i uruchomić go — system sam nada mu uprawnienia najwyższe,
    bo tak mu kazano.

    Pakiet instalacyjny nie jest przy tym formatem trudnym do przygotowania.
    Narzędzia do jego budowy są powszechnie dostępne, a treścią pakietu może
    być dowolne polecenie wykonywane w trakcie instalacji.

    Ustawienie jest przy tym parą wartości, po jednej w gałęzi maszyny
    i w gałęzi użytkownika. Tryb działa wyłącznie wtedy, gdy obie są
    ustawione, i dlatego audyt czyta obie. Wystarczy jednak wyłączyć jedną,
    żeby przejście zamknąć.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: pełne prawa
    do maszyny z konta zwykłego, przez uruchomienie samodzielnie
    przygotowanego pakietu instalacyjnego.
  en: |
    The setting switches off the mode in which every installation package run by a user carries itself out with
    the system's full rights, whoever that user may be.

    It is one of the shortest passages from an ordinary account to full rights that exist in Windows. It calls
    for no fault in software and no trick. It is enough to build an installation package doing what one wants
    and run it - the system will give it the highest rights of itself, having been told to.

    An installation package is at the same time no hard format to prepare. The tools for building one are widely
    to be had, and a package's contents may be any command at all carried out in the course of installing.

    The setting is at the same time a pair of values, one in the machine's branch and one in the user's. The
    mode works only where both are set, and for that reason the audit reads both. Switching one off is enough,
    though, to close the passage.

    What an attacker gains while the item goes unmet: full rights to the machine from an ordinary account, by
    running an installation package prepared by themselves.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Tryb ten jest domyślnie wyłączony i nigdy nie był ustawieniem zalecanym.
    Tam, gdzie go włączono, zrobiono to zwykle świadomie — po to, żeby
    użytkownik bez uprawnień mógł zainstalować wskazane oprogramowanie bez
    udziału obsługi.

    I to jest jedyny skutek wyłączenia: taka instalacja przestanie się
    udawać i wróci na drogę zwykłą, czyli przez konto administracyjne albo
    przez narzędzie do wdrożeń, które pakiety instaluje własnym kontem
    usługi.

    Odnotowuję, że wdrożenia prowadzone przez narzędzie zarządzające nie
    korzystają z tego trybu w ogóle — instalują z konta usługi, które
    uprawnienia ma niezależnie od tego ustawienia. Zmiana ich nie dotyka.

    Nie ma znanych regresji.

    Czego to nie psuje: programów już zainstalowanych, aktualizacji
    systemowych, wdrożeń przez narzędzie zarządzające, sieci, profili,
    pracy codziennej.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The mode is off by default and was never a recommended setting. Where it has been switched on, that was as a
    rule done knowingly - so that a user without rights might install some named software without the attendance
    taking part.

    And that is the only consequence of switching it off: such an installation will cease succeeding and will
    return to the ordinary road, which is by an administrative account or by a rollout tool that installs
    packages under its own service account.

    Worth noting that rollouts led by a management tool do not use this mode at all - they install under a
    service account holding its rights regardless of this setting. The change does not touch them.

    There are no known regressions.

    What this does not break: programs already installed, system updates, rollouts by a management tool, the
    network, profiles, or everyday work.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - scripting-and-automation
  what_breaks:
    pl:
      - Instalacja pakietu przez użytkownika bez uprawnień przestaje się udawać i wraca na drogę przez konto administracyjne
      - Skrypt liczący na to, że pakiet zainstaluje się z konta zwykłego, kończy się błędem braku uprawnień
      - Wdrożenia prowadzone przez narzędzie zarządzające instalują z konta usługi i zmiana ich nie dotyczy
      - Programy już zainstalowane, aktualizacje systemowe oraz praca codzienna pozostają bez zmian
      - Praca sieci, profile użytkowników i drukowanie pozostają bez zmian
    en:
      - Installing a package by a user without rights ceases succeeding and returns to the road by an administrative account
      - A script counting on a package installing from an ordinary account ends in an insufficient-rights error
      - Rollouts led by a management tool install under a service account and the change does not touch them
      - Programs already installed, system updates and everyday work stay unchanged
      - The work of the network, users profiles and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Użytkownicy bez uprawnień muszą sami instalować wskazane oprogramowanie i nie ma narzędzia do wdrożeń
    en:
      - Users without rights have to install named software themselves and there is no rollout tool
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    # Elevation happens only when BOTH hives are set, so both must be read.
    function Get-Flag($path) {
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { return $null }
      (Get-ItemProperty -Path $path -ErrorAction Stop).AlwaysInstallElevated
    }
    try {
      $m = Get-Flag 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      $u = Get-Flag 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
      if (($m -eq 1) -and ($u -eq 1)) { 'ENABLED' } else { 'DISABLED' }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^DISABLED$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    $name = 'AlwaysInstallElevated'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Only the machine half is written here. The per-user half lies in the user's
    # own hive and has to be cleared in each profile separately - the machine half
    # alone already breaks the pair, and elevation calls for both.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AlwaysInstallElevated' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/msi/alwaysinstallelevated

notes:
  pl: |
    Reguła jest w całej paczce jedną z niewielu łączących kategorię
    krytyczną z klasą bez uciążliwości. Według macierzy decyzyjnej jest to
    szybka wygrana i domyślne otwarcie widoku — punkt, który robi się
    najpierw i bez rozmowy.

    Warto, żeby aplikacja pokazała, dlaczego audyt czyta dwie gałęzie,
    a naprawa pisze do jednej. Tryb wymaga obu wartości naraz, więc
    zamknięcie jednej wystarczy, a pisanie do gałęzi użytkownika musiałoby
    objąć każdy profil z osobna. Jest to ta sama granica, którą aplikacja
    napotka przy pozostałych ustawieniach z gałęzi użytkownika.

    Odnotowuję, że wartość zwracana przez sprawdzenie to „ENABLED" albo
    „DISABLED", a nie liczba. Wynika to stąd, że pojedyncza liczba nie
    powiedziałaby, czy tryb działa — działa dopiero para.
  en: |
    The rule is one of the few in the whole pack joining a critical category to a class of no disruption. By the
    decision matrix it is a quick win and the view's default opening - an item done first and without
    discussion.

    It is well that the application show why the audit reads two branches while the remedy writes to one. The
    mode calls for both values at once, so closing one is enough, and writing to the user's branch would have to
    cover each profile separately. It is the same boundary the application will meet at the remaining settings
    in the user's branch.

    Worth noting that the value the check returns is "ENABLED" or "DISABLED" rather than a number. That follows
    from a single number not saying whether the mode works - it is the pair that makes it work.
