id: windows-10
name:
  pl: Windows 10
  en: Windows 10
family: windows
shell: powershell
profile: workstation

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD

detection:
  command: |
    $os = Get-CimInstance Win32_OperatingSystem
    '{0}|{1}|{2}' -f $os.Caption, $os.BuildNumber, $os.ProductType
  # ProductType 1 = workstation. Windows 10 is build below 22000.
  match: '^Microsoft Windows 10 .*\|(1[0-9]{4}|2[01][0-9]{3})\|1$'

notes:
  pl: |
    Windows 10 wszedł w fazę wygaszania wsparcia — przy planowaniu hardeningu
    warto najpierw sprawdzić, czy maszyna nie powinna zostać podniesiona do
    Windows 11. Część reguł ma tu odpowiedniki o innych nazwach kluczy niż
    w Windows 11; nie przenoś plików między paczkami bez weryfikacji.
  en: |
    Windows 10 has entered its support wind-down. Before planning hardening,
    check whether the machine should be upgraded to Windows 11 first. Some
    rules use different key names here than on Windows 11; do not move files
    between packs without verifying them.
