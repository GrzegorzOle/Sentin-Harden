id: win11-simultaneous-connections-minimized

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Network > Windows Connection Manager
  title:
    pl: Równoczesne połączenia z wieloma sieciami ograniczone
    en: Simultaneous connections to several networks limited
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Laptop wpięty kablem do sieci firmowej i jednocześnie podłączony do sieci
    bezprzewodowej ma dwie drogi na zewnątrz naraz. Nie jest to samo w sobie
    atakiem, ale tworzy warunek, na którym opiera się cała rodzina ataków:
    maszyna staje się punktem stycznym dwóch sieci, które nigdy nie miały się
    spotkać.

    Napastnik obecny w sieci bezprzewodowej — cudzej, podstawionej albo po prostu
    słabo pilnowanej — i zdolny wykonać kod na tej maszynie dostaje drogę do
    sieci firmowej z pominięciem wszystkiego, co stoi na jej brzegu. Ruch nie
    przechodzi przez zaporę na styku ani przez żadne urządzenie rozdzielające,
    bo nie przekracza granicy sieci — przechodzi przez komputer stojący po obu
    stronach.

    Ograniczenie każe systemowi rozłączyć sieć bezprzewodową, kiedy dostępne jest
    połączenie przewodowe. Dwie drogi przestają istnieć jednocześnie, a wraz
    z nimi znika warunek konieczny tej klasy ataków.
  en: |
    A laptop plugged by cable into the company network and at the same time attached
    to a wireless network has two roads out at once. That is not an attack in
    itself, but it creates the condition a whole family of attacks rests on: the
    machine becomes a point of contact between two networks that were never meant to
    meet.

    An attacker present on the wireless network - somebody else's, a planted one, or
    simply one poorly watched - and able to run code on this machine gets a road
    into the company network bypassing everything standing at its edge. The traffic
    passes neither the firewall at the boundary nor any separating device, because
    it does not cross the network's boundary - it passes through a computer standing
    on both sides.

    The limit tells the system to drop the wireless network when a wired connection
    is available. Two roads stop existing at once, and with them the condition this
    class of attacks needs.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, jak na maszynie wygląda codzienne przełączanie się
    między kablem a siecią bezprzewodową.

    Dla laptopa odkładanego do stacji dokującej zmiana jest niewidoczna: po
    wpięciu kabla sieć bezprzewodowa znika, po wypięciu wraca. Rozłączenie sieci
    bezprzewodowej zrywa jednak połączenia, które przez nią szły — rozmowa
    głosowa albo przesyłanie dużego pliku w momencie wpięcia kabla urwą się
    i trzeba je podjąć na nowo.

    Zauważalne jest to również tam, gdzie obie sieci prowadzą w różne miejsca:
    kabel do sieci laboratoryjnej bez dostępu na zewnątrz i sieć bezprzewodowa
    jako jedyna droga do internetu to układ, w którym wpięcie kabla odetnie
    użytkownika od sieci. Objawem jest utrata dostępu do internetu przy
    podłączonym kablu — mylona zwykle z awarią sieci.

    Nie ma restartu maszyny. Zmiana obowiązuje po ponownym uruchomieniu usługi
    zarządzania połączeniami albo po zalogowaniu.
  en: |
    What needs checking is what the everyday switching between cable and wireless
    looks like on the machine.

    For a laptop dropped into a docking station the change is invisible: plug the
    cable in and the wireless network goes, unplug it and it comes back. Dropping
    the wireless network does, however, break connections that were running over it
    - a voice call or a large file transfer at the moment the cable goes in will cut
    out and have to be taken up again.

    It is also noticeable where the two networks lead to different places: a cable
    to a laboratory network with no way out and wireless as the only road to the
    internet is an arrangement in which plugging the cable in cuts the user off. The
    symptom is losing internet access while the cable is connected - usually
    mistaken for a network fault.

    There is no machine restart. The change takes effect once the connection
    management service restarts, or after signing in.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
  what_breaks:
    pl:
      - Sieć bezprzewodowa zostanie rozłączona w momencie wpięcia kabla, zrywając połączenia, które przez nią szły
      - Rozmowy głosowe i przesyłanie plików trwające przy zmianie połączenia urwą się i będą wymagały podjęcia na nowo
      - Tam, gdzie kabel prowadzi do sieci bez dostępu na zewnątrz, użytkownik straci internet na czas podłączenia kabla
    en:
      - The wireless network is dropped the moment the cable goes in, breaking connections that ran over it
      - Voice calls and file transfers under way at the moment of the switch cut out and have to be taken up again
      - Where the cable leads to a network with no way out, the user loses the internet while the cable is connected
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko korzysta jednocześnie z sieci przewodowej bez dostępu na zewnątrz i z sieci bezprzewodowej jako drogi do internetu
      - Maszyna pełni rolę, w której równoczesny dostęp do dwóch sieci jest zamierzony i zabezpieczony inaczej
    en:
      - The station uses at once a wired network with no way out and a wireless one as its road to the internet
      - The machine holds a role in which simultaneous access to two networks is intended and secured by other means
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The setting is a choice out of four, not a switch. Three is the variant
      # the item calls for - wireless dropped while the cable is in. The weaker
      # variants are reported with their own value so the report says which one
      # was found.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
      $name = 'fMinimizeConnections'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '3'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    $name = 'fMinimizeConnections'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WcmSvc\GroupPolicy'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fMinimizeConnections' -Value 3 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-wifi

notes:
  pl: |
    Ustawienie ma cztery warianty, z czego dwa pośrednie — ograniczanie liczby
    połączeń i stałe utrzymywanie połączenia komórkowego — są słabsze od tego,
    którego wymaga punkt. Reguła zgłasza je jako niespełnienie i podaje odczytaną
    wartość, żeby dało się odróżnić maszynę bez żadnego ustawienia od maszyny
    ustawionej łagodniej.

    Zakres jest węższy, niż sugeruje nazwa: ograniczenie dotyczy pary sieć
    przewodowa — sieć bezprzewodowa. Dwa jednocześnie wpięte kable ani połączenie
    bezprzewodowe razem z modemem komórkowym nie są nim objęte, a rozdzielenie
    sieci trzeba w tych przypadkach zapewnić inaczej.
  en: |
    The setting has four variants, two of which - limiting the number of connections
    and keeping the mobile connection up at all times - are weaker than the one the
    item calls for. The rule reports them as unmet and gives the value it read, so a
    machine with no setting at all can be told from one set more leniently.

    Its reach is narrower than the name suggests: the limit concerns the wired -
    wireless pair. Two cables plugged in at once, or a wireless connection together
    with a mobile modem, are not covered, and separation has to be provided by other
    means in those cases.
