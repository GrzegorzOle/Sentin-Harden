id: win10-blank-password-console-only

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Konta bez hasła dopuszczone wyłącznie przy maszynie
    en: Accounts without a password allowed only at the machine
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że konto lokalne bez hasła daje się użyć wyłącznie
    przy samej maszynie, a nie przez sieć ani przez pulpit zdalny.

    Reguła nie zabrania kont bez hasła i opis nie powinien tego sugerować.
    Zawęża miejsce, w którym takie konto działa, do tego jedynego, w którym
    brak hasła jest osłonięty czymś innym — dostępem fizycznym do sprzętu.

    Znaczenie bierze się stąd, że konta bez hasła powstają przypadkiem.
    Konto założone doraźnie do jednej czynności, konto zostawione po
    instalacji programu, konto testowe sprzed wdrożenia — żadne z nich nie
    miało być drogą wejścia, ale każde nią jest, dopóki daje się z niego
    skorzystać zdalnie.

    Bez tego ustawienia każde takie konto otwiera maszynę każdemu, kto
    dosięgnie jej po sieci i zna jego nazwę. Nie trzeba przy tym hasła ani
    błędu w oprogramowaniu — wystarczy trafić w nazwę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: wejście na
    maszynę przez dowolne konto lokalne pozostawione bez hasła, po samej
    znajomości jego nazwy.
  en: |
    The setting makes a local account without a password usable at the machine itself alone, and not over the
    network nor through the remote desktop.

    The rule does not forbid accounts without a password and the description ought not suggest it does. It
    narrows the place where such an account works to the one place where the want of a password is shielded by
    something else - physical access to the gear.

    Its weight comes of this, that accounts without a password come about by chance. An account made for the
    occasion for one act, an account left after a program's installation, a test account from before a rollout -
    none of them was meant to be a road in, yet each is one so long as it can be used remotely.

    Without this setting every such account opens the machine to anybody who can get at it over the network and
    knows its name. No password is needed for that, and no fault in software - it is enough to light on the
    name.

    What an attacker gains while the item goes unmet: a way onto the machine by any local account left without a
    password, upon a mere knowledge of its name.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Wartość wymagana jest domyślna i na maszynie nietykanej reguła
    potwierdza stan zastany. Zmiana nie dotyka kont, które hasło mają,
    ani logowania przy samej maszynie.

    Przypadek, w którym coś przestaje działać, jest jeden: konto bez hasła
    używane zdalnie. Jest to układ, którego się nie planuje — powstaje przez
    zapomnienie, a nie przez wybór — więc jego przerwanie jest zwykle
    wynikiem pożądanym, nie kosztem.

    Gdyby jednak coś na nim stało, objaw będzie jednoznaczny: odmowa dostępu
    przy logowaniu zdalnym, przy działającym logowaniu przy maszynie.
    Rozwiązaniem jest nadanie kontu hasła, nie cofnięcie tej reguły.

    Nie ma znanych regresji.

    Czego to nie psuje: kont z hasłem, logowania przy maszynie, kont
    domenowych, udziałów plikowych, pulpitu zdalnego dla kont z hasłem,
    usług systemowych, sieci.

    Nie wymaga restartu ani wylogowania.
  en: |
    The class is "no disruption".

    The value called for is the default and on an untouched machine the rule confirms the state found. The
    change touches neither accounts that have a password nor logging on at the machine itself.

    There is one case in which something ceases working: an account without a password used remotely. It is an
    arrangement nobody plans - it comes about by forgetting rather than by choice - so its breaking off is as a
    rule a wanted outcome and not a cost.

    Were something to rest on it all the same, the symptom will be unambiguous: access denied at a remote logon,
    while logging on at the machine works. The answer is to give the account a password, not to undo this rule.

    There are no known regressions.

    What this does not break: accounts with a password, logging on at the machine, domain accounts, file shares,
    the remote desktop for accounts with a password, system services, or the network.

    Calls for no restart and no logging off.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - file-sharing
    - remote-desktop
  what_breaks:
    pl:
      - Konto lokalne bez hasła przestaje dać się użyć przez sieć i przez pulpit zdalny
      - Objaw jest jednoznaczny, bo logowanie przy samej maszynie tym samym kontem działa dalej
      - Rozwiązaniem jest nadanie kontu hasła, a nie cofnięcie tej reguły, bo układ bez hasła powstaje przez zapomnienie
      - Konta z hasłem, konta domenowe oraz pulpit zdalny dla kont z hasłem pozostają bez zmian
      - Udziały plikowe, usługi systemowe, praca sieci i drukowanie pozostają bez zmian
    en:
      - A local account without a password ceases to be usable over the network and through the remote desktop
      - The symptom is unambiguous, logging on at the machine itself by that same account still working
      - The answer is to give the account a password rather than undo this rule, the passwordless arrangement coming of forgetting
      - Accounts with a password, domain accounts and the remote desktop for accounts with a password stay unchanged
      - File shares, system services, the work of the network and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na tej maszynie coś łączy się zdalnie kontem lokalnym bez hasła i nie da się mu na razie hasła nadać
    en:
      - Something joins remotely to this machine by a local account without a password and cannot for now be given one
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
      $name = 'LimitBlankPasswordUse'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    $name = 'LimitBlankPasswordUse'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Accounts with a password are untouched, as is logging on at the machine
    # itself. Where something did join remotely by an account without a password,
    # give that account a password rather than undo this.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'LimitBlankPasswordUse' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-limit-local-account-use-of-blank-passwords-to-console-logon-only

notes:
  pl: |
    Reguła zamyka blok i jest w nim najprostsza do wytłumaczenia, a przy tym
    jedyną o kategorii wysokiej i klasie bez uciążliwości. Według macierzy
    decyzyjnej jest to szybka wygrana i punkt, który robi się bez rozmowy.

    Warto, żeby aplikacja powiedziała wprost, czego reguła nie robi. Nie
    usuwa kont bez hasła i nie wymusza ich nadania — zawęża tylko miejsce
    ich użycia. Użytkownik, który oczekuje po niej uporządkowania kont,
    uzna ją za niedziałającą, a to jest osobna czynność.

    Odnotowuję, że reguła i tak nie zwalnia z przeglądu kont lokalnych.
    Konto bez hasła osłonięte dostępem fizycznym jest bezpieczne wyłącznie
    wtedy, gdy ten dostęp faktycznie jest ograniczony — co przy sprzęcie
    przenośnym bywa założeniem zbyt mocnym.
  en: |
    The rule closes the block and is the easiest in it to set out, being at the same time the only one of a high
    category with a class of no disruption. By the decision matrix it is a quick win and an item done without
    discussion.

    It is well that the application say outright what the rule does not do. It neither takes away accounts
    without a password nor forces them to be given one - it narrows only the place of their use. A user
    expecting from it an ordering of accounts will judge it not to work, and that is a separate act.

    Worth noting that the rule does not release one from a review of the local accounts all the same. An account
    without a password shielded by physical access is safe only where that access is truly bounded - which with
    portable gear is at times too strong an assumption.
