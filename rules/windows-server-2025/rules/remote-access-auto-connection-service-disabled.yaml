id: win2025-remote-access-auto-connection-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Automatyczne nawiązywanie połączenia zdalnego wyłączone
    en: Automatic setting up of a remote connection disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę zestawiającą połączenie zdalne samoczynnie,
    kiedy program na tej maszynie próbuje sięgnąć pod adres, do którego
    nie ma innej drogi.

    Zostawiam kategorię średnią i chcę powiedzieć, na czym polega tu
    ryzyko, bo usługa ta nie nasłuchuje i na pierwszy rzut oka nie ma jej
    o co podejrzewać. Jest odwrotnie niż przy pozostałych punktach tej
    grupy: tam maszyna przyjmowała połączenia, tutaj sama je nawiązuje.

    Rzecz sprowadza się do tego, kto podejmuje decyzję. Zwykle
    o połączeniu wychodzącym z serwera decyduje człowiek albo zaplanowane
    zadanie. Tutaj decyduje o nim program, który dotknął adresu — i to
    wystarczy, żeby maszyna zestawiła kanał na zewnątrz. Jeżeli
    w ustawieniach połączeń został wpis z dawnych czasów, kanał ten
    prowadzi tam, gdzie prowadził wtedy, i nikt go dziś nie ogląda.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    zestawienia połączenia wychodzącego z serwera przez samo sięgnięcie
    pod adres, bez decyzji człowieka i bez zmiany czegokolwiek
    w konfiguracji sieci.
  en: |
    The item switches off the service that sets a far-off binding up of itself when a program upon
    that machine reaches for a whereabouts whereto it has no other road.

    I leave the category middling and would say wherein the hazard here lies, that service listening
    not and at first sight being nothing to hold in doubt. It is the other way about than at the rest
    of the items of this group - there the machine took bindings, here it sets them up itself.

    The thing comes to who makes the deciding. Mostly a binding going out of a server is decided by a
    person or by a task that was planned. Here it is decided by a program that touched a whereabouts -
    and that is enough for the machine to set a channel up outwards. If in the settings of bindings
    there was left an entry of old days, that channel leads whither it led then, and nobody looks upon
    it today.

    What an attacker gains while the item goes unmet - a way of setting a binding going out of the
    server up by the mere reaching for a whereabouts, with no deciding of a person and with no
    altering of anything in the settings of the net.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia" i trzymam ją mimo tego, że dla
    zdecydowanej większości serwerów zmiana ta nie znaczy nic. Powodem
    utrzymania jest jeden rodzaj rzeczy, ale trafiający dokładnie tam,
    gdzie boli najbardziej.

    Starsze aplikacje branżowe bywają zbudowane wokół założenia, że łącze
    zestawia się samo w chwili, gdy staje się potrzebne. Wymiana danych
    z centralą, pobranie kursów, odesłanie raportu na koniec dnia,
    połączenie do systemu partnera. Takie połączenie nie jest zapisane
    w harmonogramie, bo nie zostało zaplanowane — dzieje się przy okazji
    sięgnięcia po dane.

    Objaw jest dokładnie tym, przed czym przestrzegam w całej tej paczce:
    zadanie, które przestało się udawać. Aplikacja zgłosi brak dostępu do
    zdalnego zasobu, nie brak połączenia, i nikt nie zwiąże tego
    z wyłączoną usługą.

    Sprawdzenie polega na zajrzeniu, czy w ustawieniach są w ogóle
    zdefiniowane jakiekolwiek połączenia zdalne. Brak wpisów jest
    odpowiedzią pełną i zamyka sprawę — wtedy usługa nie miałaby czego
    zestawiać.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking" and hold it though for the greater part of servers by far
    that change means nothing. The ground of the holding is one kind of thing, but one striking just
    where it hurts the most.

    Older applications of a trade are at times built about the taking for granted that a link sets
    itself up at the hour it is needed. A trading of data with the head house, a drawing of rates, a
    sending back of a report at the end of the day, a binding to the system of a dealing side. Such a
    binding is not written in the ordering of times, it not having been planned - it befalls at the
    hap of the reaching for data.

    The symptom is just that whereof I warn throughout this pack - a task that stopped succeeding. The
    application will give word of a wanting reach to a far-off holding and not of a wanting binding,
    and nobody will bind that to a switched-off service.

    The checking comes to a looking whether in the settings there be set down any far-off bindings at
    all. A want of entries is a full answer and shuts the matter - the service would then have nothing
    to set up.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - scripting-and-automation
    - legacy-applications
  what_breaks:
    pl:
      - Starsza aplikacja zestawiająca łącze samoczynnie w chwili potrzeby przestaje sięgać po dane zdalne
      - Wymiana danych z centralą, pobranie kursów albo odesłanie raportu na koniec dnia przestaje dochodzić do skutku
      - Połączenie takie nie jest zapisane w harmonogramie, więc nie widać go tam, gdzie się go szuka
      - Aplikacja zgłasza brak dostępu do zdalnego zasobu, a nie brak połączenia
      - Brak zdefiniowanych połączeń zdalnych w ustawieniach zamyka sprawę i czyni zmianę bezskutkową
    en:
      - An older application setting a link up of itself at the hour of need stops reaching for far-off data
      - A trading of data with the head house, a drawing of rates or a sending back of a report at the end of the day stops coming about
      - Such a binding is not written in the ordering of times, so it is not seen where it is sought
      - The application gives word of a wanting reach to a far-off holding and not of a wanting binding
      - A want of set-down far-off bindings in the settings shuts the matter and leaves the change without outcome
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - W ustawieniach zdefiniowane są połączenia zdalne, z których korzysta starsza aplikacja branżowa
    en:
      - In the settings there are set down far-off bindings that an older application of a trade draws upon
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\RasAuto'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Look first at whether any remote connections are defined at all. If none
    # are, this service has nothing to dial and the change has no effect; if
    # some are, an older application may be relying on them without a schedule.
    Stop-Service -Name 'RasAuto' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'RasAuto' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'RasAuto' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-access/ras/manage-remote-access

