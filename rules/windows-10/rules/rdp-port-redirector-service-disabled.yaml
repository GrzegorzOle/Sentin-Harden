id: win10-rdp-port-redirector-service-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa przekierowania portów w sesji zdalnej wyłączona
    en: The service of the turning aside of ports in a sitting from afar switched off
  level: 2
  profile: workstation

platform:
  system: windows-10

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza usługę przenoszącą urządzenia z maszyny łączącej
    się do sesji zdalnej: dyski, drukarki, porty, schowek.

    Mechanizm ten sprawia, że osoba łącząca się zdalnie widzi w sesji
    własny dysk, własną drukarkę i własny schowek. Wygoda jest znaczna,
    a cena polega na tym, że przez sesję zdalną biegnie dwukierunkowa
    droga dla plików.

    Zagrożenie płynie z obu kierunków. Plik da się wnieść na maszynę
    zdalną bez korzystania z sieci, bo idzie kanałem samej sesji —
    z pominięciem reguł, zapisu ruchu i kontroli treści. Da się też
    wynieść dane z maszyny zdalnej na dysk osoby łączącej się.

    Schowek zasługuje na osobną uwagę, bo bywa pomijany w ocenach.
    Kopiowanie między sesją a maszyną łączącą się jest przenoszeniem
    danych i podlega tym samym zastrzeżeniom co przeniesienie pliku.

    Odnotowuję, że punkt nie zamyka samej sesji zdalnej. Zamyka
    przenoszenie urządzeń wewnątrz niej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    przenoszenia plików w obie strony kanałem sesji zdalnej.
  en: |
    The setting switches off the service carrying devices from the joining machine into a sitting from afar:
    disks, printers, ports, the keeping-place for copying.

    That mechanism brings it about that whoever joins themselves from afar sees in the sitting their own disk,
    their own printer and their own keeping-place. The ease is great, and the price is that through the sitting
    from afar there runs a road for files going both ways.

    The danger flows from both directions. A file may be brought onto the machine from afar without the network
    being used, going as it does by the sitting's own channel - past the rules, past the record of traffic and
    past the weighing of content. Data may likewise be borne out of the machine from afar onto the joining
    person's disk.

    The keeping-place for copying deserves notice apart, being at times passed over in gradings. The copying
    between a sitting and the joining machine is a carrying of data and falls under the same reservations as the
    carrying of a file.

    I set down that the item shuts not the sitting from afar itself. It shuts the carrying of devices within it.

    What an attacker gains while the item goes unmet: a road of carrying files both ways by the channel of the
    sitting from afar.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", a przedmiotem sprawdzenia jest to, jak
    ludzie pracują w sesjach zdalnych.

    Miejscem pierwszym jest drukowanie. Osoba pracująca zdalnie drukuje
    zwykle na drukarce stojącej przy niej, a nie przy maszynie zdalnej.
    Po zmianie ta drukarka zniknie z sesji i trzeba będzie drukować przez
    drukarkę sieciową albo przenosić plik.

    Miejscem drugim jest schowek. Kopiowanie tekstu między maszyną
    własną a sesją jest czynnością odruchową i jego zniknięcie jest
    zmianą sposobu pracy, zgłaszaną natychmiast.

    Miejscem trzecim jest przenoszenie plików. Tam, gdzie sesja służy do
    pracy na dokumentach, dysk przekierowany bywa jedyną drogą wniesienia
    pliku. Trzeba wskazać zamiennik: udział sieciowy albo miejsce
    wspólne.

    Skutek jest widoczny dla użytkownika i zgłaszany szybko. Warto
    uprzedzić, zamiast czekać na zgłoszenie.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: samej sesji zdalnej, pracy w niej, dostępu do
    udziałów sieciowych, drukowania na drukarkach sieciowych, logowania.
  en: |
    The class is "needs review", and the object of the review is how people work in sittings from afar.

    The first place is printing. Whoever works from afar prints commonly upon a printer standing by them and not
    by the machine from afar. After the change that printer will vanish from the sitting, and one will have to
    print through a printer of the network or carry the file over.

    The second place is the keeping-place for copying. The copying of writing between one's own machine and the
    sitting is a doing of reflex and its vanishing is a change in the manner of work, reported at once.

    The third place is the carrying of files. Where a sitting serves for work upon papers, a turned-aside disk is
    at times the one road of bringing a file in. Another has to be pointed out in its stead: a share of the
    network or a common place.

    The consequence is plain to the user and is reported swiftly. It is well to forewarn rather than wait for the
    report.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the sitting from afar itself, the work in it, the reach of shares of the network,
    printing upon printers of the network, or logging on.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - printing
    - drivers-and-devices
  what_breaks:
    pl:
      - Drukarka stojąca przy osobie pracującej zdalnie zniknie z sesji i trzeba będzie drukować przez drukarkę sieciową
      - Schowek przestanie przenosić tekst między maszyną własną a sesją, co jest zmianą odruchu zgłaszaną natychmiast
      - Dysk przekierowany bywa jedyną drogą wniesienia pliku do sesji i trzeba wskazać zamiennik
      - Zamiennikiem jest udział sieciowy albo miejsce wspólne, więc warto przygotować je przed wdrożeniem
      - Sama sesja zdalna, praca w niej, dostęp do udziałów sieciowych i logowanie pozostają bez zmian
    en:
      - The printer standing by whoever works from afar will vanish from the sitting and one will have to print through a printer of the network
      - The keeping-place for copying will cease to carry writing between one s own machine and the sitting, a change of reflex reported at once
      - A turned-aside disk is at times the one road of bringing a file into the sitting and another has to be pointed out in its stead
      - That other is a share of the network or a common place, so it is well to make it ready before the rollout
      - The sitting from afar itself, the work in it, the reach of shares of the network and logging on stay unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Praca w sesji zdalnej opiera się na drukowaniu na drukarce stojącej przy osobie łączącej się
      - Dysk przekierowany jest jedyną drogą wnoszenia dokumentów do sesji i nie ma udziału zastępczego
    en:
      - The work in a sitting from afar rests upon printing at a printer standing by whoever joins themselves
      - A turned-aside disk is the one road of bringing papers into the sitting and there is no share to stand in its stead
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\UmRdpService'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'UmRdpService' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'UmRdpService' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'UmRdpService' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Reguła jest jedynym punktem w tej rodzinie, który zostawia pulpit
    zdalny otwarty, a zabiera tylko jego część. Warto, żeby aplikacja to
    podkreśliła, bo czyni ją dobrym kompromisem tam, gdzie zamknięcie
    całego pulpitu zdalnego jest niemożliwe.

    Argument wart postawienia wprost dotyczy kanału. Plik przeniesiony
    tą drogą nie idzie przez sieć w zwykłym sensie — idzie wewnątrz sesji,
    więc omija reguły, zapis ruchu i kontrolę treści. Jest to droga obok
    wszystkich dróg, których się pilnuje.

    Odnotowuję schowek, bo bywa pomijany. Kopiowanie tekstu między sesją
    a maszyną łączącą się jest przeniesieniem danych i podlega tym samym
    zastrzeżeniom co plik, choć nikt tak o nim nie myśli.
  en: |
    The rule is the one item in this kin that leaves the desk from afar open and takes away only a part of it. It
    is well that the application mark that, it making the rule a good middle way where the shutting of the whole
    desk from afar is not to be had.

    The argument worth putting outright touches the channel. A file carried by that road goes not through the
    network in the ordinary sense - it goes within the sitting, and so goes about the rules, the record of traffic
    and the weighing of content. It is a road beside all the roads that are watched.

    I set down the keeping-place for copying, it being at times passed over. The copying of writing between a
    sitting and the joining machine is a carrying of data and falls under the same reservations as a file, though
    nobody thinks of it so.
