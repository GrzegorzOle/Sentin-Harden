id: win2025-windows-update-preview-builds-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update
  title:
    pl: Instalowanie wydań przedpremierowych systemu zablokowane
    en: Installing of pre-release system builds blocked
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt blokuje pobieranie wydań przedpremierowych przez mechanizm
    aktualizacji. Wartość jeden oznacza zasadę wyłączoną, dwa — wydania
    przedpremierowe zarządzane i dopuszczone.

    Kategoria średnia. Wydanie przedpremierowe to wersja systemu, która nie
    przeszła jeszcze pełnego cyklu poprawek i nie jest objęta zwykłym
    wsparciem. Na maszynie testowej to jest w porządku i po to te wydania
    istnieją. Na serwerze, który coś udostępnia, oznacza to usługę stojącą
    na oprogramowaniu, którego producent sam nie uważa jeszcze za gotowe.

    Chcę dodać rzecz, którą łatwo przeoczyć, a która przy serwerze waży
    więcej niż sama stabilność: wydania przedpremierowe wysyłają o maszynie
    znacznie więcej niż wydania zwykłe, i nie da się tego ograniczyć tak
    jak zwykłych danych diagnostycznych. Zgoda na wydanie przedpremierowe
    jest więc jednocześnie zgodą na wynoszenie z tej maszyny informacji
    o jej pracy.

    Druga rzecz: przejście na wydanie przedpremierowe bywa jednokierunkowe.
    Powrót do wydania wspieranego oznacza czasem instalację od nowa, a nie
    cofnięcie ustawienia. Dlatego wolę zablokować to zawczasu, niż
    rozwiązywać po fakcie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: serwer
    na wersji, dla której poprawki bezpieczeństwa idą innym, wolniejszym
    torem, a wykazy znanych usterek dopiero powstają.
  en: |
    The item blocks fetching of pre-release builds through the update
    mechanism. A value of one means the policy is switched off, two means
    pre-release builds are managed and permitted.

    The category is medium. A pre-release build is a system version that has
    not yet been through a full cycle of fixes and is not covered by
    ordinary support. On a test machine that is fine, and it is what these
    builds exist for. On a server that serves something it means a service
    standing on software its own maker does not yet consider ready.

    I want to add something easy to miss that on a server weighs more than
    stability itself: pre-release builds send far more about the machine
    than ordinary ones, and this cannot be trimmed the way ordinary
    diagnostic data can. Consenting to a pre-release build is therefore at
    the same time consenting to information about this machine's work being
    carried out of it.

    The second thing: moving to a pre-release build is sometimes one-way. A
    return to a supported build occasionally means installing from scratch
    rather than undoing a setting. So I would rather block it beforehand
    than solve it afterwards.

    What an attacker gains while the item goes unmet: a server on a version
    whose security fixes travel a different, slower route, and whose lists
    of known faults are only being written.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", choć na większości serwerów ta
    zmiana nie zmieni niczego — po prostu zabroni czegoś, czego i tak nikt
    nie robił.

    Sprawdzić trzeba jedno: czy ta maszyna nie jest właśnie tą, która ma
    chodzić na wydaniu przedpremierowym. Takie maszyny istnieją w każdej
    większej organizacji i mają sens — sprawdza się na nich, czy kolejna
    wersja nie zepsuje roli, zanim trafi na maszyny produkcyjne. Zabranie
    im tej możliwości jednym przebiegiem zbiorczym odbiera organizacji
    ostrzeżenie o tydzień wcześniejsze niż awaria.

    Rzecz do zapamiętania: jeżeli maszyna jest już zapisana do wydań
    przedpremierowych, ta zmiana nie sprowadzi jej z powrotem na wersję
    wspieraną. Zablokuje tylko kolejne. Sprowadzenie z powrotem jest
    osobnym zadaniem i bywa trudniejsze niż ustawienie.

    Trzeba też wiedzieć, że ten punkt nie jest jedyną drogą do wydań
    przedpremierowych — ta sama rzecz da się włączyć osobnym ustawieniem
    zapisania maszyny do programu. Reguły trzeba czytać razem, bo każda
    z nich osobno zostawia drugą drogę otwartą.

    Zmiana nie wymaga przerwy, nikt jej nie zauważy w codziennej pracy
    i cofa się natychmiast.
  en: |
    I keep the class "needs review", though on most servers this change will
    alter nothing - it will simply forbid something nobody was doing anyway.

    One thing has to be checked: whether this machine is precisely the one
    meant to run a pre-release build. Such machines exist in every larger
    organisation and they make sense - they are where it is found out
    whether the next version breaks the role, before it reaches production
    machines. Taking that away from them in one bulk run costs the
    organisation a warning a week earlier than the failure.

    Something to remember: if the machine is already enrolled for
    pre-release builds, this change will not bring it back to a supported
    version. It will only block the next ones. Bringing it back is a
    separate job and is sometimes harder than the setting.

    It also has to be known that this item is not the only road to
    pre-release builds - the same thing can be switched on by a separate
    setting that enrols the machine in the programme. The rules have to be
    read together, because each of them alone leaves the other road open.

    The change needs no outage, nobody will notice it in daily work, and it
    is undone immediately.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Maszyna przeznaczona do sprawdzania kolejnej wersji przestanie dostawać wydania przedpremierowe
      - Organizacja traci ostrzeżenie o tydzień wcześniejsze niż awaria na maszynie produkcyjnej
      - Maszyna już zapisana do wydań przedpremierowych nie wróci przez tę zmianę na wersję wspieraną
      - To nie jedyna droga — zapisanie maszyny do programu jest osobnym ustawieniem i pozostaje otwarte
    en:
      - A machine meant for trying out the next version stops receiving pre-release builds
      - The organisation loses a warning a week earlier than a failure on a production machine
      - A machine already enrolled for pre-release builds will not return to a supported version through this change
      - This is not the only road - enrolling the machine in the programme is a separate setting and stays open
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Ta maszyna jest przeznaczona do sprawdzania kolejnej wersji systemu przed wdrożeniem produkcyjnym
      - Maszyna chodzi już na wydaniu przedpremierowym i trzeba najpierw zaplanować jej powrót na wersję wspieraną
    en:
      - This machine is meant for trying out the next system version before a production rollout
      - The machine already runs a pre-release build and its return to a supported version has to be planned first
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The policy switched off writes 1 here; 2 means pre-release builds are
      # managed and allowed.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'ManagePreviewBuildsPolicyValue'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    $current = (Get-ItemProperty -Path $path -Name 'ManagePreviewBuildsPolicyValue' -ErrorAction SilentlyContinue).'ManagePreviewBuildsPolicyValue'
    [pscustomobject]@{
      path        = $path
      name        = 'ManagePreviewBuildsPolicyValue'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # This blocks the next pre-release builds; a machine already running one is
    # not brought back by it. Enrolling the machine in the programme is a
    # separate setting and stays open unless that rule is applied too.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'ManagePreviewBuildsPolicyValue' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/deployment/update/waas-servicing-channels-windows-10-updates

notes:
  pl: |
    Przy serwerze waży tu więcej niż stabilność: wydania przedpremierowe
    wysyłają o maszynie znacznie więcej niż zwykłe i nie da się tego
    ograniczyć tak jak zwykłych danych diagnostycznych. Zgoda na wydanie
    przedpremierowe jest jednocześnie zgodą na wynoszenie informacji
    o pracy tej maszyny.

    Przejście bywa jednokierunkowe — powrót do wydania wspieranego oznacza
    czasem instalację od nowa, a nie cofnięcie ustawienia.

    Czytaj razem z regułą o zapisaniu maszyny do programu wydań
    zapoznawczych: każda z nich osobno zostawia drugą drogę otwartą.
  en: |
    On a server something weighs more here than stability: pre-release
    builds send far more about the machine than ordinary ones, and this
    cannot be trimmed the way ordinary diagnostic data can. Consenting to a
    pre-release build is at the same time consenting to information about
    this machine's work being carried out of it.

    The move is sometimes one-way - a return to a supported build
    occasionally means installing from scratch rather than undoing a
    setting.

    Read together with the rule on enrolling the machine in the preview
    programme: each of them alone leaves the other road open.
