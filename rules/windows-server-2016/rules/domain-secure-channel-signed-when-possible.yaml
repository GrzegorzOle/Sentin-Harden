id: win2016-domain-secure-channel-signed-when-possible

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Kanał bezpieczny do kontrolera podpisywany, gdy druga strona to potrafi
    en: The secure channel to the controller signed where the other side can
  level: 1
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie żąda podpisywania ruchu w kanale do kontrolera domeny wszędzie
    tam, gdzie druga strona podpisywanie obsługuje.

    Podpis odpowiada za nienaruszalność, a nie za tajność. Nie ukrywa treści —
    sprawia, że odbiorca rozpozna jej podmianę. Jest to obrona przed innym
    atakiem niż szyfrowanie i warto to rozróżnić, bo oba ustawienia sąsiadują
    ze sobą i bywają mylone.

    Podmiana treści w kanale do kontrolera jest groźniejsza niż jej odczytanie.
    Odczytanie daje wiedzę. Podmiana pozwala zmienić odpowiedź na pytanie,
    kto należy do jakiej grupy — a odpowiedź na to pytanie przesądza
    o uprawnieniach w całej domenie. Napastnik pośrodku, który potrafi
    podmienić jeden komunikat, nie musi nikogo podszywać: wystarczy, że dopisze
    grupę do wyniku już wydanego przez kontroler.

    Punkt jest warunkowy i tu leży jego ograniczenie. Podpis pojawia się
    wtedy, gdy druga strona go obsługuje; jeżeli zgłosi, że nie, ruch pójdzie
    bez podpisu. Bezwarunkowe żądanie jest osobną regułą i to ona domyka
    tę furtkę.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    podmiany komunikatów w kanale do kontrolera, a przez to wpływ na to,
    jakie uprawnienia maszyna przyzna użytkownikowi.
  en: |
    The setting demands the signing of traffic in the channel to the domain
    controller wherever the other side supports signing.

    A signature answers for inviolability, not for secrecy. It hides no content - it
    makes the receiver recognise its substitution. This is a defence against a
    different attack from encryption's, and the difference is worth drawing, since
    the two settings sit beside each other and are at times confused.

    Substituting content in the channel to the controller is more dangerous than
    reading it. Reading gives knowledge. Substitution allows the answer to the
    question of who belongs to which group to be altered - and the answer to that
    question settles privileges across the whole domain. An attacker in the middle
    able to substitute one message need impersonate nobody: it suffices that they
    add a group to a result the controller has already issued.

    The item is conditional, and there lies its limit. The signature appears where
    the other side supports it; if it declares that it does not, the traffic goes
    unsigned. The unconditional demand is a separate rule, and it is that one which
    shuts the gate.

    What an attacker gains while the item goes unmet: the means of substituting
    messages in the channel to the controller, and thereby a hand in what privileges
    the machine grants a user.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Ustawienie jest warunkowe: podpis pojawia się
    tam, gdzie druga strona go obsługuje, a tam, gdzie nie obsługuje, ruch idzie
    jak dotąd. Nie ma więc sytuacji, w której coś przestaje działać z powodu
    samej tej zmiany.

    Koszt jest obliczeniowy i w praktyce niemierzalny. Podpisanie komunikatu
    w kanale kontroli domeny to ułamek pracy, jaką maszyna wykonuje przy
    uwierzytelnieniu, a liczba tych komunikatów jest niewielka w porównaniu
    z ruchem plikowym czy bazodanowym.

    Jedyna rzecz warta powiedzenia jest taka, że ta reguła sama z siebie niczego
    nie gwarantuje. Daje zabezpieczenie tam, gdzie i tak było możliwe. Jej
    wartość ujawnia się dopiero w zestawieniu z regułą żądającą zabezpieczenia
    bezwarunkowo.

    Czego to nie psuje: uwierzytelniania domenowego, zasad grupy, pracy usług,
    udostępniania plików ani logowania.

    Bez restartu, natychmiast odwracalne.
  en: |
    The class is "no disruption". The setting is conditional: the signature appears
    where the other side supports it, and where it does not the traffic goes as
    before. There is therefore no situation in which something stops working on
    account of this change alone.

    The cost is in computation and in practice unmeasurable. Signing a message in
    the domain control channel is a fraction of the work the machine does at
    authentication, and the number of such messages is small beside file or database
    traffic.

    The one thing worth saying is that this rule guarantees nothing by itself. It
    gives protection where protection was possible anyway. Its worth shows only when
    set beside the rule that demands protection unconditionally.

    What this does not break: domain authentication, group policy, the working of
    services, file sharing, or signing in.

    No restart, undone immediately.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - network-and-firewall
  what_breaks:
    pl:
      - Brak regresji w działaniu — tam, gdzie druga strona nie obsługuje podpisu, ruch idzie jak dotąd
      - Koszt obliczeniowy podpisania komunikatów kanału kontroli domeny jest w praktyce niemierzalny
      - Reguła sama z siebie nie zamyka drogi zejścia do ruchu bez podpisu — robi to dopiero żądanie bezwarunkowe
      - Uwierzytelnianie domenowe, zasady grupy i udostępnianie plików pozostają bez zmian
    en:
      - No regression in the working - where the other side does not support signing, the traffic goes as before
      - The computational cost of signing domain control channel messages is in practice unmeasurable
      - The rule does not by itself shut the road down to unsigned traffic - only the unconditional demand does that
      - Domain authentication, group policy and file sharing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przeciwwskazań — ustawienie działa warunkowo i nie odbiera możliwości rozmowy stronie, która podpisu nie obsługuje
    en:
      - No known contraindication - the setting works conditionally and takes no means of talking from a side that does not support signing
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'SignSecureChannel'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { ([string]$item.$name).Trim() }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'SignSecureChannel'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Signing answers for inviolability, not secrecy: it hides no content but makes
    # its substitution recognisable to the receiver.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'SignSecureChannel' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      # Only the value is removed. The key holds unrelated settings and stays.
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-digitally-sign-secure-channel-data-when-possible

notes:
  pl: |
    Reguła jest tania i warto ją pokazywać jako szybką wygraną, ale w raporcie
    nie powinna stać sama. Bez bezwarunkowego żądania zabezpieczenia jest
    ustawieniem, które napastnik wyłącza zgłoszeniem, że nie potrafi podpisać.

    Podpis i szyfrowanie to dwie różne obrony i mają osobne reguły. Podpis
    broni przed podmianą, szyfrowanie przed odczytem. Utrzymujemy je osobno,
    zamiast łączyć w jedną regułę, właśnie po to, żeby raport mógł powiedzieć,
    którego z dwóch zabezpieczeń brakuje.

    Brak wartości w rejestrze zgłaszany jest jako niespełnienie, bo zachowanie
    domyślne bywa różne i ma być tutaj zapisane wprost.
  en: |
    The rule is cheap and worth showing as a quick win, but in the report it should
    not stand alone. Without the unconditional demand for protection it is a setting
    an attacker switches off by declaring an inability to sign.

    Signing and encryption are two different defences and have separate rules.
    Signing guards against substitution, encryption against reading. They are kept
    apart rather than joined into one rule precisely so that the report can say
    which of the two is missing.

    A missing value in the registry is reported as non-compliance, since the default
    behaviour varies and is to be written outright here.
