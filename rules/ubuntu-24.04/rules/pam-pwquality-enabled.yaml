id: ubuntu2404-pam-pwquality-enabled

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.2.3
  section: Access Control > Pluggable Authentication Modules > Configure pam-auth-update profiles
  title:
    pl: Moduł pam_pwquality jest włączony
    en: Ensure pam_pwquality module is enabled
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Wymagania co do długości i złożoności nowych haseł sprawdza w PAM moduł
    pam_pwquality. Bez niego passwd przyjmie niemal każde hasło, także
    krótkie albo słownikowe.

    Punkt wymaga, żeby wiersz password z pam_pwquality był aktywny
    w /etc/pam.d/common-password.
  en: |
    In PAM, the pam_pwquality module checks the length and complexity of
    new passwords. Without it passwd accepts almost any password, even a
    short or dictionary one.

    The item requires an active password line with pam_pwquality in
    /etc/pam.d/common-password.

disruption_description:
  pl: |
    Gdy pakiet libpam-pwquality jest zainstalowany, profil jest zwykle już
    włączony i nikt tego nie zauważy. W przeciwnym razie przy zmianie hasła
    passwd zaczyna odrzucać hasła krótsze niż 8 znaków, słownikowe albo
    zawierające nazwę użytkownika; root ustawiający hasło innym kontom
    dostaje tylko ostrzeżenie.
  en: |
    When the libpam-pwquality package is installed, the profile is usually
    on already and nobody will notice. Otherwise at password change passwd
    starts to reject passwords shorter than 8 characters, dictionary words
    or passwords that contain the user name; root setting the password of
    other accounts only gets a warning.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - "Użytkownicy zmieniający hasło na krótkie albo słownikowe: passwd je odrzuca"
    en:
      - "Users who change the password to a short or dictionary one: passwd rejects it"
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    pam_has() {
      [ -r "$1" ] || return 1
      awk -v t="$2" -v m="$3" -v a="$4" '
        /^[ \t]*#/ || NF == 0 { next }
        { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
        $1 == t && p[n] == m && (a == "" || index(" " $0 " ", " " a " ")) { f = 1 }
        END { exit !f }' "$1"
    }
    evaluate() {
      local miss="" s f ty mo ar
      for s in common-password:password:pam_pwquality.so:; do
        f=${s%%:*}; s=${s#*:}; ty=${s%%:*}; s=${s#*:}; mo=${s%%:*}; ar=${s#*:}
        pam_has "/etc/pam.d/$f" "$ty" "$mo" "$ar" || miss="$miss,$f:$ty:$mo${ar:+:$ar}"
      done
      if [ -z "$miss" ]; then echo "OK:pam_pwquality"; else echo "NOT_OK:missing=${miss#,}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    D=/usr/share/pam-configs
    prof_on() {
      debconf-show libpam-runtime 2>/dev/null | awk -v p="$1" '
        { sub(/^[* \t]*/, "") }
        index($0, "libpam-runtime/profiles:") == 1 {
          n = split(substr($0, 25), a, ",")
          for (i = 1; i <= n; i++) { gsub(/[ \t]/, "", a[i]); if (a[i] == p) f = 1 } }
        END { exit !f }'
    }
    # undo BACKUP: turn off again the profiles that were off; a profile file this
    # rule created is removed from the configuration and deleted.
    undo() {
      local k p e x rm="" dis=""
      while read -r k p e x; do
        [ "$e" = 0 ] && [ -e "$D/$p" ] || continue
        if [ "$x" = 0 ]; then rm="$rm $p"; elif prof_on "$p"; then dis="$dis $p"; fi
      done < <(tail -n +2 "$1")
      export DEBIAN_FRONTEND=noninteractive
      if [ -n "$dis" ]; then pam-auth-update --disable $dis >/dev/null; fi
      if [ -n "$rm" ]; then
        pam-auth-update --remove $rm >/dev/null
        for p in $rm; do rm -f "$D/$p"; done
      fi
      [ -z "$dis" ] || echo "Disabled the PAM profiles$dis"
      [ -z "$rm" ] || echo "Removed the PAM profiles$rm, which this rule created"
    }
      # Without the list of enabled profiles, rollback could turn off profiles that were on.
      debconf-show libpam-runtime 2>/dev/null | grep -q 'libpam-runtime/profiles:' ||
        { echo "debconf does not report the enabled PAM profiles (debconf-show libpam-runtime); nothing saved" >&2; exit 1; }
      {
        echo format=pamprof-1
        for p in pwquality; do
          if prof_on "$p"; then e=1; else e=0; fi
          if [ -e "$D/$p" ]; then x=1; else x=0; fi
          echo "prof $p $e $x"
        done
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=pamprof-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      [ "$(tail -n +2 "$b" | awk '$1 == "prof" && $3 ~ /^[01]$/ && $4 ~ /^[01]$/ && NF == 4 { printf "%s ", $2; next } { print "bad" }')" = "pwquality " ] ||
        { echo "Backup file is damaged: $b" >&2; exit 1; }
    pam_has() {
      [ -r "$1" ] || return 1
      awk -v t="$2" -v m="$3" -v a="$4" '
        /^[ \t]*#/ || NF == 0 { next }
        { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
        $1 == t && p[n] == m && (a == "" || index(" " $0 " ", " " a " ")) { f = 1 }
        END { exit !f }' "$1"
    }
    evaluate() {
      local miss="" s f ty mo ar
      for s in common-password:password:pam_pwquality.so:; do
        f=${s%%:*}; s=${s#*:}; ty=${s%%:*}; s=${s#*:}; mo=${s%%:*}; ar=${s#*:}
        pam_has "/etc/pam.d/$f" "$ty" "$mo" "$ar" || miss="$miss,$f:$ty:$mo${ar:+:$ar}"
      done
      if [ -z "$miss" ]; then echo "OK:pam_pwquality"; else echo "NOT_OK:missing=${miss#,}"; fi
    }
    D=/usr/share/pam-configs
    prof_on() {
      debconf-show libpam-runtime 2>/dev/null | awk -v p="$1" '
        { sub(/^[* \t]*/, "") }
        index($0, "libpam-runtime/profiles:") == 1 {
          n = split(substr($0, 25), a, ",")
          for (i = 1; i <= n; i++) { gsub(/[ \t]/, "", a[i]); if (a[i] == p) f = 1 } }
        END { exit !f }'
    }
    # undo BACKUP: turn off again the profiles that were off; a profile file this
    # rule created is removed from the configuration and deleted.
    undo() {
      local k p e x rm="" dis=""
      while read -r k p e x; do
        [ "$e" = 0 ] && [ -e "$D/$p" ] || continue
        if [ "$x" = 0 ]; then rm="$rm $p"; elif prof_on "$p"; then dis="$dis $p"; fi
      done < <(tail -n +2 "$1")
      export DEBIAN_FRONTEND=noninteractive
      if [ -n "$dis" ]; then pam-auth-update --disable $dis >/dev/null; fi
      if [ -n "$rm" ]; then
        pam-auth-update --remove $rm >/dev/null
        for p in $rm; do rm -f "$D/$p"; done
      fi
      [ -z "$dis" ] || echo "Disabled the PAM profiles$dis"
      [ -z "$rm" ] || echo "Removed the PAM profiles$rm, which this rule created"
    }
      r=$(evaluate)
      case "$r" in OK*) echo "PAM already uses pam_pwquality, nothing to change"; exit 0 ;; esac
      command -v pam-auth-update >/dev/null 2>&1 || { echo "pam-auth-update is not installed; add pam_pwquality to the PAM files by hand" >&2; exit 1; }
      [ -e "$D/pwquality" ] || { echo "The PAM profile $D/pwquality does not exist; install the libpam-pwquality package first (item 5.3.1.3)" >&2; exit 1; }
      if ! ls /var/cache/cracklib/cracklib_dict.pwd* >/dev/null 2>&1; then
        echo "The cracklib dictionary /var/cache/cracklib/cracklib_dict.pwd is missing, so pam_pwquality would reject every new password; install the cracklib-runtime package first" >&2; exit 1
      fi
      export DEBIAN_FRONTEND=noninteractive
      pam-auth-update --enable pwquality >/dev/null
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) undo "$b" >/dev/null
           echo "PAM does not use pam_pwquality after enabling the profiles ($r), for example because the common-* files were changed by hand outside the part that pam-auth-update manages; restored the previous state" >&2; exit 1 ;;
      esac
      echo "Enabled the PAM profiles pwquality with pam-auth-update"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=pamprof-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      [ "$(tail -n +2 "$b" | awk '$1 == "prof" && $3 ~ /^[01]$/ && $4 ~ /^[01]$/ && NF == 4 { printf "%s ", $2; next } { print "bad" }')" = "pwquality " ] ||
        { echo "Backup file is damaged: $b" >&2; exit 1; }
    D=/usr/share/pam-configs
    prof_on() {
      debconf-show libpam-runtime 2>/dev/null | awk -v p="$1" '
        { sub(/^[* \t]*/, "") }
        index($0, "libpam-runtime/profiles:") == 1 {
          n = split(substr($0, 25), a, ",")
          for (i = 1; i <= n; i++) { gsub(/[ \t]/, "", a[i]); if (a[i] == p) f = 1 } }
        END { exit !f }'
    }
    # undo BACKUP: turn off again the profiles that were off; a profile file this
    # rule created is removed from the configuration and deleted.
    undo() {
      local k p e x rm="" dis=""
      while read -r k p e x; do
        [ "$e" = 0 ] && [ -e "$D/$p" ] || continue
        if [ "$x" = 0 ]; then rm="$rm $p"; elif prof_on "$p"; then dis="$dis $p"; fi
      done < <(tail -n +2 "$1")
      export DEBIAN_FRONTEND=noninteractive
      if [ -n "$dis" ]; then pam-auth-update --disable $dis >/dev/null; fi
      if [ -n "$rm" ]; then
        pam-auth-update --remove $rm >/dev/null
        for p in $rm; do rm -f "$D/$p"; done
      fi
      [ -z "$dis" ] || echo "Disabled the PAM profiles$dis"
      [ -z "$rm" ] || echo "Removed the PAM profiles$rm, which this rule created"
    }
      command -v pam-auth-update >/dev/null 2>&1 || { echo "pam-auth-update is not installed; nothing changed" >&2; exit 1; }
      out=$(undo "$b")
      echo "${out:-Nothing to restore}"
    )

privileges: root
runnable: true

sources:
  - https://github.com/libpwquality/libpwquality
  - https://manpages.ubuntu.com/manpages/noble/man8/pam-auth-update.8.html

notes:
  pl: |
    Ubuntu buduje pliki /etc/pam.d/common-auth, common-account,
    common-password i common-session poleceniem pam-auth-update z profili
    w /usr/share/pam-configs, a listę włączonych profili trzyma w debconf
    (debconf-show libpam-runtime). pam-auth-update zapisuje od nowa tylko
    część plików między swoimi znacznikami; argumenty dopisane ręcznie do
    wierszy w tej części zachowuje, a wiersze poza nią zostawia bez zmian.
    Naprawa włącza profil poleceniem pam-auth-update --enable i sprawdza
    pliki ponownie; gdy moduł nadal nie jest aktywny, np. po ręcznych
    zmianach w plikach common-*, przywraca poprzedni stan i kończy się
    błędem. Wycofanie wyłącza profil tylko wtedy, gdy przed naprawą był
    wyłączony.

    Profil pwquality pochodzi z pakietu libpam-pwquality i włącza się sam
    przy jego instalacji (punkt 5.3.1.3); dodaje wiersz password requisite
    pam_pwquality.so retry=3 przed pam_unix. Naprawa włącza go poleceniem
    pam-auth-update --enable pwquality, a gdy pakietu nie ma, niczego nie
    zmienia i kończy się błędem. Odmawia też, gdy brakuje słownika cracklib
    (/var/cache/cracklib/cracklib_dict.pwd z pakietu cracklib-runtime), bo
    pam_pwquality odrzucałby wtedy każde nowe hasło. Wymagania co do haseł ustawia się
    w /etc/security/pwquality.conf (punkty 5.3.3.2.x).
  en: |
    Ubuntu builds the /etc/pam.d/common-auth, common-account,
    common-password and common-session files with pam-auth-update from the
    profiles in /usr/share/pam-configs and keeps the list of enabled
    profiles in debconf (debconf-show libpam-runtime). pam-auth-update
    writes again only the part of the files between its markers; it keeps
    arguments added by hand to lines in that part and leaves lines outside
    it unchanged. The remediation enables the profile with pam-auth-update
    --enable and checks the files again; when the module is still not
    active, for example after manual changes to the common-* files, it
    restores the previous state and fails. Rollback turns the profile off
    only when it was off before the remediation.

    The pwquality profile comes from the libpam-pwquality package and is
    enabled by its installation (item 5.3.1.3); it adds the line password
    requisite pam_pwquality.so retry=3 before pam_unix. The remediation
    enables it with pam-auth-update --enable pwquality and, when the package
    is missing, changes nothing and fails. It also refuses when the cracklib
    dictionary (/var/cache/cracklib/cracklib_dict.pwd from the
    cracklib-runtime package) is missing, because pam_pwquality would then
    reject every new password. The password requirements are
    set in /etc/security/pwquality.conf (items 5.3.3.2.x).
