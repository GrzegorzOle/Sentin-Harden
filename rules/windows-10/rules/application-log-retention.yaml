id: win10-application-log-retention

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Event Log Service > Application
  title:
    pl: Zachowanie dziennika aplikacji po zapełnieniu
    en: The behaviour of the journal of applications once it fills up
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie sprawia, że dziennik aplikacji po zapełnieniu nadpisuje
    wpisy najstarsze, zamiast przestać przyjmować nowe.

    Do wyboru są trzy zachowania. Pierwsze to nadpisywanie najstarszych
    wpisów — dziennik pracuje bez przerwy, a historia sięga tak daleko,
    jak pozwala rozmiar. Drugie to zatrzymanie zapisu po zapełnieniu.
    Trzecie to archiwizowanie pełnego dziennika i zaczynanie nowego.

    Punkt wymaga pierwszego i warto powiedzieć, dlaczego nie drugiego.
    Dziennik, który przestał przyjmować wpisy, jest dziennikiem martwym.
    Od tej chwili maszyna pracuje bez zapisu, a nikt się o tym nie
    dowiaduje, bo brak wpisów wygląda dokładnie tak samo jak brak zdarzeń.

    Jest to różnica rozstrzygająca. Przy nadpisywaniu traci się przeszłość
    odległą, czyli tę, której zwykle się już nie potrzebuje. Przy
    zatrzymaniu traci się teraźniejszość — czyli dokładnie to, co dzieje
    się w chwili, gdy ktoś patrzy.

    Odnotowuję, że napastnik potrafi tę drugą postawę wykorzystać wprost.
    Zapełnienie dziennika zdarzeniami nieistotnymi zatrzymuje zapis,
    a dalsze działania nie zostawiają już żadnego śladu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    zatrzymania zapisu przez zapełnienie dziennika.
  en: |
    The setting brings it about that the journal of applications, once full, writes over the oldest entries
    instead of ceasing to take new ones.

    Three behaviours stand to be chosen from. The first is the writing over of the oldest entries - the journal
    works without pause and the history reaches as far back as the size allows. The second is the halting of the
    writing once it is full. The third is the laying up of the full journal and the beginning of a new one.

    The item calls for the first, and it is worth saying why not the second. A journal that has ceased to take
    entries is a dead journal. From that hour the machine works without a record, and nobody learns of it, a want
    of entries looking exactly like a want of happenings.

    It is the difference that settles the matter. At the writing over one loses the far past, which is to say what
    one commonly needs no longer. At the halting one loses the present - which is to say just what is afoot at the
    hour somebody looks.

    I set down that an attacker can turn that second stand to their use outright. A filling of the journal with
    happenings of no weight halts the writing, and what they do thereafter leaves no trace at all.

    What an attacker gains while the item goes unmet: the halting of the record by a filling of the journal.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Zmiana nie zwiększa pliku dziennika ani nie kasuje wpisów już
    zapisanych. Rozstrzyga wyłącznie, co się stanie, gdy dziennik dojdzie
    do swojego rozmiaru.

    Odnotowuję jedyne miejsce warte uwagi: maszyny, na których wybrano
    archiwizowanie pełnych dzienników ze względu na obowiązek zewnętrzny.
    Po zmianie archiwa przestaną powstawać, a historia będzie sięgać
    tylko tak daleko, jak pozwala rozmiar bieżącego pliku. Jest to
    decyzja do podjęcia świadomie, bo obowiązek zachowania zapisu przez
    określony czas przestanie być spełniany po stronie maszyny.

    Skutek pojawia się natychmiast, bez restartu.

    Czego to nie psuje: zapisywania zdarzeń, odczytu dziennika, wpisów
    już zapisanych, pracy programów, drukowania.
  en: |
    The class is "no disruption".

    The change makes the journal's file no greater and deletes no entries already written. It settles solely what
    becomes of it when the journal comes to its size.

    I set down the one place worth notice: machines upon which the laying up of full journals was chosen for the
    sake of some outward duty. After the change the stores will cease to come about, and the history will reach
    only as far back as the size of the standing file allows. It is a decision to be taken knowingly, a duty of
    keeping a record for a set span ceasing to be met upon the machine's side.

    The consequence shows at once, with no restart.

    What this does not break: the writing of happenings, the reading of the journal, the entries already written,
    the work of programs, or printing.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Na maszynie archiwizującej pełne dzienniki archiwa przestaną powstawać
      - Historia będzie sięgać tylko tak daleko, jak pozwala rozmiar bieżącego pliku dziennika
      - Obowiązek zachowania zapisu przez określony czas przestanie być spełniany po stronie maszyny
      - Zmiana nie kasuje wpisów już zapisanych i nie zmienia rozmiaru pliku dziennika
      - Zapisywanie zdarzeń, odczyt dziennika, praca programów, logowanie i drukowanie pozostają bez zmian
    en:
      - Upon a machine laying up full journals the stores will cease to come about
      - The history will reach only as far back as the size of the standing file of the journal allows
      - A duty of keeping a record for a set span will cease to be met upon the machine s side
      - The change deletes no entries already written and changes not the size of the journal s file
      - The writing of happenings, the reading of the journal, the work of programs, logging on and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie obowiązuje wymóg zewnętrzny nakazujący archiwizowanie pełnych dzienników zamiast ich nadpisywania
    en:
      - Upon the machine holds an outward requirement bidding that full journals be laid up rather than written over
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'Retention'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    $name = 'Retention'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The value is written as text, not as a number - the service of the journal
    # reads this entry as a string and a number written here is passed over.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Retention' -Value '0' -Type String

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type String
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key goes only where the change made it and nothing else has since
        # been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/wes/windows-event-log

notes:
  pl: |
    Reguła bywa mylona z punktem o rozmiarze dziennika i warto, żeby
    aplikacja rozdzieliła je wyraźnie. Rozmiar rozstrzyga, ile się
    mieści; ten punkt rozstrzyga, co się dzieje po przekroczeniu tej
    granicy. Są to dwa różne pytania i wdrożenie jednego nie odpowiada na
    drugie.

    Argument wart postawienia wprost dotyczy tego, co się traci przy
    każdym z dwóch zachowań. Nadpisywanie zabiera przeszłość odległą,
    której zwykle nikt już nie potrzebuje. Zatrzymanie zapisu zabiera
    teraźniejszość — czyli wpisy z chwili, w której coś się dzieje.
    Wybór między nimi jest wyborem, co jest cenniejsze, i odpowiedź nie
    jest tu wcale oczywista dopóki się jej nie wypowie.

    Odnotowuję zastosowanie po stronie napastnika, bo nadaje punktowi
    wagę większą, niż sugeruje jego opis. Dziennik zatrzymany to dziennik,
    który nie zapisze już niczego, co nastąpi potem — a zapełnić go
    zdarzeniami nieistotnymi potrafi każdy, kto może uruchomić program.
  en: |
    The rule is at times confused with the item about the journal's size, and it is well that the application part
    them plainly. The size settles how much fits; this item settles what becomes of things once that bound is
    passed. They are two several questions and the rolling out of one answers not the other.

    The argument worth putting outright touches what is lost at each of the two behaviours. The writing over takes
    the far past, which commonly nobody needs any longer. The halting of the record takes the present - which is
    to say the entries of the hour at which something is afoot. The choice between them is a choice of which is
    the dearer, and the answer is here not at all plain until it is spoken.

    I set down the use upon the attacker's side, it giving the item a weight greater than its setting out hints. A
    halted journal is a journal that will write down nothing of what follows - and anybody who can start a program
    can fill it with happenings of no weight.
