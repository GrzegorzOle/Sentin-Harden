id: win2025-remote-desktop-configuration-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa konfiguracji pulpitu zdalnego wyłączona
    en: The Remote Desktop configuration service disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę przygotowującą sesje pulpitu zdalnego: ustawienia
    sesji, uprawnienia, certyfikaty i sprawy związane z licencjonowaniem
    dostępu.

    Zostawiam kategorię średnią, niżej niż przy samej usłudze pulpitu
    zdalnego, i chcę powiedzieć, na czym polega podział. Tamta przyjmuje
    połączenia — to ona jest wejściem. Ta nie nasłuchuje na nic; działa
    obok, przygotowując to, na czym sesja stanie. Napastnik nie wchodzi
    przez nią do maszyny.

    Wartość punktu jest więc taka sama, jak przy każdej innej usłudze
    działającej bez potrzeby: kod uruchomiony z wysokimi uprawnieniami,
    którego nikt nie obserwuje, na maszynie, która z sesji zdalnych nie
    korzysta. Na serwerze bez roli pulpitu zdalnego jest to składnik
    czekający na coś, co nigdy nie nastąpi.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: działający
    składnik o wysokich uprawnieniach, związany z obsługą sesji zdalnych,
    na maszynie, która sesji zdalnych nie obsługuje.
  en: |
    The item switches off the service that makes the sittings of the far-off board ready - the
    settings of a sitting, the leaves, the tokens and the matters bound to the leave to reach.

    I leave the category middling, lower than at the service of the far-off board itself, and would
    say wherein the sundering lies. That one takes bindings - it is the way in. This one listens for
    nothing; it works alongside, making ready that whereon a sitting will stand. An attacker comes not
    through it into the machine.

    The worth of the item is therefore the same as at any other service working without need - code
    running with high leaves that nobody watches, upon a machine that draws not upon far-off sittings.
    Upon a server with no role of the far-off board it is a piece waiting for a thing that will never
    come about.

    What an attacker gains while the item goes unmet - a working piece with high leaves, bound to the
    serving of far-off sittings, upon a machine that serves no far-off sittings.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia" i powód jest inny niż
    przy usłudze pulpitu zdalnego, więc warto go nazwać osobno.

    Tamta reguła jest groźna dlatego, że działa czysto: zatrzymujesz
    usługę i wejście znika. Skutek jest natychmiastowy, całkowity
    i jednoznaczny. Ta jest groźna dlatego, że nie działa czysto.
    Po jej zatrzymaniu pulpit zdalny nie przestaje działać — zaczyna
    działać źle.

    Sesje potrafią nie zestawić się przy niektórych ustawieniach
    i zestawić przy innych. Aplikacje publikowane zamiast pełnego pulpitu
    zachowują się inaczej niż dotąd. Sprawy licencjonowania dostępu,
    które mają własne okresy karencji, ujawniają się dopiero po upływie
    tych okresów — czyli tygodnie po zmianie, jako nagłe odcięcie
    użytkowników bez żadnego widocznego powodu.

    Usterka częściowa jest gorsza od zupełnej, bo nie daje jasnego
    sygnału i nie wskazuje przyczyny. Człowiek szukający powodu, dla
    którego część sesji się nie zestawia, sprawdzi sieć, konta, zaporę
    i certyfikaty, zanim pomyśli o usłudze, którą wyłączono miesiąc temu
    i po której nic się wtedy nie stało.

    Sprawdzenie jest proste: jeżeli maszyna obsługuje sesje zdalne
    w jakiejkolwiek postaci — pełnego pulpitu, aplikacji publikowanych
    albo roli serwera sesji — punkt ten zostaje jako wyjątek. Jeżeli nie
    obsługuje żadnych, zmiana jest czysta.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a witting rolling out", and the ground is other than at the service of
    the far-off board, so it is worth naming apart.

    That rule is fearful because it works cleanly - you stop the service and the way in goes away. The
    outcome is at once, whole and of one meaning. This one is fearful because it works not cleanly.
    After its stopping the far-off board stops not working - it begins working ill.

    Sittings may fail to be set up at some settings and be set up at others. Applications given out in
    the stead of a whole board behave otherwise than hitherto. The matters of the leave to reach,
    which have spans of grace of their own, come to light only after those spans are out - that is,
    weeks after the change, as a sudden cutting off of people with no ground to be seen.

    A fault in part is worse than a whole one, it giving no clear sign and pointing to no ground. A
    person seeking the ground whereof some sittings are not set up will look to the net, to the
    standings, to the wall of fire and to the tokens before they think upon a service switched off a
    month ago whereafter nothing then befell.

    The checking is plain - if the machine serves far-off sittings in any shape, of a whole board, of
    applications given out or of the role of a server of sittings, this item stays as an exception. If
    it serves none, the change is clean.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - remote-management
  what_breaks:
    pl:
      - Pulpit zdalny nie przestaje działać, tylko zaczyna działać źle
      - Sesje potrafią nie zestawić się przy niektórych ustawieniach i zestawić przy innych
      - Aplikacje publikowane zamiast pełnego pulpitu zachowują się inaczej niż dotąd
      - Sprawy licencjonowania dostępu ujawniają się po upływie okresów karencji, tygodnie po zmianie
      - Usterka częściowa nie daje jasnego sygnału, więc przyczyny szuka się w sieci, kontach i zaporze
    en:
      - The far-off board stops not working, it begins working ill
      - Sittings may fail to be set up at some settings and be set up at others
      - Applications given out in the stead of a whole board behave otherwise than hitherto
      - The matters of the leave to reach come to light after the spans of grace are out, weeks after the change
      - A fault in part gives no clear sign, so the ground is sought in the net, the standings and the wall of fire
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Maszyna obsługuje sesje zdalne w jakiejkolwiek postaci, łącznie z aplikacjami publikowanymi
      - Maszyna pełni rolę serwera sesji albo bierze udział w licencjonowaniu dostępu
    en:
      - The machine serves far-off sittings in any shape, taking in applications given out
      - The machine bears the role of a server of sittings or has a share in the leave to reach
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\SessionEnv'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Where remote sessions are served this does not break them cleanly - it
    # breaks them partly, and the licensing side surfaces only after its grace
    # period, weeks later, as users cut off for no visible reason.
    Stop-Service -Name 'SessionEnv' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'SessionEnv' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'SessionEnv' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/welcome-to-rds

notes:
  pl: |
    Podział wobec samej usługi pulpitu zdalnego: tamta przyjmuje
    połączenia i jest wejściem, ta nie nasłuchuje na nic i działa obok.
    Napastnik nie wchodzi przez nią do maszyny, więc kategoria niższa.

    Klasa utrzymana z innego powodu niż tam. Tamta reguła jest groźna,
    bo działa czysto — zatrzymujesz usługę i wejście znika. Ta jest
    groźna, bo nie działa czysto: pulpit zdalny nie przestaje działać,
    tylko zaczyna działać źle.

    Usterka częściowa jest gorsza od zupełnej, bo nie wskazuje
    przyczyny. Sprawy licencjonowania mają własne okresy karencji, więc
    ujawniają się tygodnie po zmianie, gdy nikt już jej nie pamięta.
  en: |
    The sundering from the service of the far-off board itself - that one takes bindings and is the
    way in, this one listens for nothing and works alongside. An attacker comes not through it into
    the machine, so the category is the lower.

    The class is held of another ground than there. That rule is fearful because it works cleanly -
    you stop the service and the way in goes away. This one is fearful because it works not cleanly -
    the far-off board stops not working, it begins working ill.

    A fault in part is worse than a whole one, it pointing to no ground. The matters of the leave to
    reach have spans of grace of their own, so they come to light weeks after the change, when nobody
    remembers it any more.
