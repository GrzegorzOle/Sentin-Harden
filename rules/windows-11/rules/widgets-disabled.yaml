id: win11-widgets-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Widgets
  title:
    pl: Panel widżetów na pasku zadań wyłączony
    en: The widgets panel on the taskbar switched off
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie usuwa z paska zadań panel widżetów — obszar pokazujący pogodę,
    kursy, wiadomości i karty dostarczane z sieci.

    Panel wygląda na dodatek kosmetyczny i pod tym względem nim jest. Jego
    znaczenie leży gdzie indziej: jest to składnik systemu, który samoczynnie
    pobiera i wyświetla treść ze źródeł zewnętrznych, na stanowisku roboczym,
    w miejscu widocznym cały czas.

    Trzy rzeczy z tego wynikają. Pierwsza: treść nie jest przez nikogo
    w organizacji zatwierdzana ani przeglądana. Druga: karty prowadzą do
    stron otwieranych jednym kliknięciem, więc pasek zadań staje się
    powierzchnią, z której użytkownik trafia w sieć bez własnej intencji.
    Trzecia: panel odpytuje sieć stale, a więc generuje ruch wychodzący,
    który trzeba odróżnić od ruchu podejrzanego.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: powierzchnię,
    na której obok pogody pojawiają się nagłówki dobierane poza kontrolą
    organizacji, i przyzwyczajenie użytkownika do klikania w nie z paska
    zadań. Ataki na człowieka żyją właśnie z takich przyzwyczajeń.

    Wyłączenie panelu nie odbiera dostępu do żadnej informacji, którą
    użytkownik chce mieć. Odbiera wyłącznie jej dostarczanie bez pytania.
  en: |
    The setting removes from the taskbar the widgets panel - the area showing the weather,
    rates, news and cards delivered from the network.

    The panel looks a cosmetic addition and in that regard it is one. Its weight lies
    elsewhere: it is a component of the system that fetches and shows content from outside
    sources of itself, at a working station, in a place visible all the time.

    Three things follow from that. The first: the content is approved and reviewed by
    nobody in the organisation. The second: the cards lead to pages opened by one click, so
    the taskbar becomes a surface from which the user lands on the network without their
    own intent. The third: the panel questions the network constantly, and so makes
    outgoing traffic that has to be told apart from suspect traffic.

    What an attacker gains while the item goes unmet: a surface on which, beside the
    weather, headlines chosen beyond the organisation's control appear, and the user's
    habit of clicking on them from the taskbar. Attacks on people live on such habits.

    Switching the panel off takes away access to no information the user wants to have. It
    takes away its delivery without asking alone.

disruption_description:
  pl: |
    Zmiana nie odbiera żadnej funkcji potrzebnej do pracy.

    Znika obszar z paska zadań i tyle. Wszystko, co panel pokazywał —
    pogoda, kursy, wiadomości — pozostaje dostępne w przeglądarce, tam gdzie
    użytkownik i tak po to sięga.

    Część osób zauważy brak i niektórym będzie go brakowało; panel bywa
    używany do sprawdzania pogody rzutem oka. Jest to jednak brak wygody,
    a nie przeszkoda w pracy, i nie ma tu żadnej funkcji, której nie da się
    zastąpić.

    Miejsce na pasku zadań zostaje zwolnione i układ paska się przesuwa.
    Jest to jedyna zmiana widoczna od razu.

    Zmiana nie wymaga restartu maszyny; panel znika po wylogowaniu
    i zalogowaniu albo po ponownym uruchomieniu powłoki.
  en: |
    The change takes away no function needed for work.

    An area vanishes from the taskbar and that is all. Everything the panel showed - the
    weather, rates, news - stays available in the browser, where the user reaches for it
    anyway.

    Some people will notice the absence and some will miss it; the panel is sometimes used
    for checking the weather at a glance. That is, however, a loss of convenience rather
    than an obstacle to work, and there is no function here that cannot be replaced.

    The space on the taskbar is freed and the taskbar's layout shifts. That is the one
    change visible at once.

    The change takes no restart of the machine; the panel vanishes after signing out and in
    again, or after the shell is started afresh.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Panel widżetów znika z paska zadań i układ paska się przesuwa
      - Sprawdzanie pogody i wiadomości rzutem oka z paska przestaje być możliwe
      - Te same informacje pozostają dostępne w przeglądarce
      - Żadna funkcja potrzebna do pracy nie przestaje działać
    en:
      - The widgets panel vanishes from the taskbar and the taskbar's layout shifts
      - Checking the weather and news at a glance from the taskbar stops being possible
      - The same information stays available in the browser
      - No function needed for work stops working
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych konfiguracji, na których ta zmiana byłaby błędem
    en:
      - There are no known configurations on which this change would be a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The key's last element is a short name unrelated to the panel's own.
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).'AllowNewsAndInterests'
        if ($null -eq $value) { 'MISSING' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
    $current = (Get-ItemProperty -Path $path -Name 'AllowNewsAndInterests' -ErrorAction SilentlyContinue).'AllowNewsAndInterests'
    [pscustomobject]@{
      path        = $path
      name        = 'AllowNewsAndInterests'
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Dsh'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNewsAndInterests' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-windows-widgets

notes:
  pl: |
    Nazwa klucza i nazwa wartości pochodzą z wcześniejszego wcielenia tego
    samego mechanizmu, dlatego żadna z nich nie przypomina nazwy panelu.
    Przy sprawdzaniu ręcznym jest to najczęstsza przyczyna szukania
    w niewłaściwym miejscu.

    Reguła należy do klasy bez uciążliwości i nadaje się do trybu zbiorczego,
    choć skutek jest widoczny dla użytkownika. Widoczność nie jest tym samym
    co uciążliwość: nic nie przestaje działać, nic nie wymaga innego sposobu
    pracy i nic nie wymaga uprzedzenia poza zwykłą informacją.

    Reguła sąsiaduje z tymi, które wyłączają treść dostarczaną z sieci
    w innych miejscach systemu — na ekranie blokady, w podpowiedziach
    aplikacji, w polu wyszukiwania. Razem opisują jedną decyzję: stanowisko
    robocze nie jest powierzchnią do wyświetlania treści zewnętrznych.

    Brak wartości nie jest stanem zgodnym, bo domyślnie panel jest włączony.
  en: |
    The key's name and the value's name come from an earlier incarnation of the same
    mechanism, which is why neither resembles the panel's name. When checking by hand that
    is the commonest reason for looking in the wrong place.

    The rule belongs to the class without disruption and suits the bulk mode, though the
    effect is visible to the user. Visibility is not the same as disruption: nothing stops
    working, nothing takes a different way of working, and nothing takes forewarning beyond
    ordinary notice.

    The rule stands beside those switching off content delivered from the network in other
    places of the system - on the lock screen, in application suggestions, in the search
    field. Together they describe one decision: a working station is not a surface for
    showing outside content.

    A missing value is not a compliant state, since by default the panel is switched on.
