id: ubuntu2404-auditd-disk-full-action

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 6.2.2.3
  section: Logging and Auditing > System Accounting (auditd) > Configure Data Retention
  title:
    pl: System przestaje działać, gdy dzienniki audytu zapełnią dysk
    en: Ensure system is disabled when audit logs are full
  level: 2
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy na dysku z dziennikami audytu zabraknie miejsca albo wystąpi błąd
    zapisu, auditd robi to, co mówią disk_full_action i disk_error_action.
    Pakiet auditd ma domyślnie SUSPEND: auditd przestaje zapisywać
    zdarzenia, a komputer działa dalej bez audytu.

    Punkt wymaga, żeby przy pełnym dysku system przestał działać (single
    albo halt), a przy błędzie zapisu co najmniej zapisał komunikat
    w dzienniku systemowym (syslog, single albo halt). Naprawa ustawia
    disk_full_action = single i disk_error_action = syslog.
  en: |
    When the disk with the audit logs runs out of space or a write error
    occurs, auditd does what disk_full_action and disk_error_action say.
    The auditd package has SUSPEND by default: auditd stops recording events
    and the computer keeps running without auditing.

    The item requires the system to stop working when the disk is full
    (single or halt), and at least to write a message to the system log on
    a write error (syslog, single or halt). The remediation sets
    disk_full_action = single and disk_error_action = syslog.

disruption_description:
  pl: |
    Klasa wymaga planowanego wdrożenia: gdy system plików z /var/log/audit
    się zapełni, auditd przełącza komputer w tryb ratunkowy (rescue.target),
    co kończy sesje użytkowników i zatrzymuje usługi.
  en: |
    The class needs a planned rollout: when the file system holding
    /var/log/audit fills up, auditd switches the computer into rescue mode
    (rescue.target), which ends the user sessions and stops the services.

implementation_consequences:
  impact_areas:
    - logging-and-audit
  what_breaks:
    pl:
      - Pełny dysk z /var/log/audit przełącza komputer w tryb ratunkowy i kończy sesje użytkowników
    en:
      - A full disk holding /var/log/audit switches the computer into rescue mode and ends the user sessions
  interruption: none
  user_visible: true
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "disk_full_action" && (v == "single" || v == "halt")) || (k == "disk_error_action" && (v == "syslog" || v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in disk_full_action disk_error_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "disk_full_action" && (v == "single" || v == "halt")) || (k == "disk_error_action" && (v == "syslog" || v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in disk_full_action disk_error_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
      [ -f "$c" ] || { echo "$c not found; install auditd first" >&2; exit 1; }
      {
        echo format=auditd-conf-1
        for k in disk_full_action disk_error_action; do
          l=$(aline "$k")
          if [ -n "$l" ]; then echo "$k present $(sed -n "${l}p" "$c")"; else echo "$k absent"; fi
        done
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=auditd-conf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "disk_full_action" && (v == "single" || v == "halt")) || (k == "disk_error_action" && (v == "syslog" || v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in disk_full_action disk_error_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
      sets='disk_full_action single
    disk_error_action syslog'
      lines=$(tail -n +2 "$b")
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "disk_full_action disk_error_action " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r k s rest; do
        case "$s" in
          absent) [ -z "$rest" ] || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          present) printf '%s\n' "$rest" | grep -qiE "^[[:space:]]*$k[[:space:]]*=" || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
        esac
      done <<< "$lines"
      # aset KEY LINE: LINE in place of the last active line of KEY, appended
      # when there is none; an empty LINE removes it
      aset() {
        local l t; l=$(aline "$1"); t=$(mktemp)
        if [ -n "$l" ]; then
          awk -v l="$l" -v s="$2" 'NR == l { if (s != "") print s; next } { print }' "$c" > "$t"
        else
          cat "$c" > "$t"; if [ -n "$2" ]; then printf '%s\n' "$2" >> "$t"; fi
        fi
        cat "$t" > "$c"; rm -f "$t"
      }
      restore() {
        local k s rest cur n=0
        while read -r k s rest; do
          l=$(aline "$k"); cur=""; [ -z "$l" ] || cur=$(sed -n "${l}p" "$c")
          want=$(printf '%s\n' "$sets" | awk -v k="$k" '$1 == k { sub(/^[^ ]+ /, ""); print }')
          if [ "$cur" = "$rest" ] && [ "$s" = present ]; then continue; fi
          if [ -z "$l" ] && [ "$s" = absent ]; then continue; fi
          if [ "$cur" != "$k = $want" ]; then echo "Kept $k: changed since the remediation (${cur:-none})"; continue; fi
          aset "$k" "$rest"; n=$((n + 1))
        done <<< "$lines"
        echo "Restored $n settings in $c"
      }
      [ -f "$c" ] || { echo "$c not found; install auditd first" >&2; exit 1; }
      r=$(evaluate)
      case "$r" in OK*) echo "Already meets the item, nothing to change"; exit 0 ;; esac
      while read -r k v; do
        if ! aok "$k" "$(aval "$k")"; then aset "$k" "$k = $v"; echo "Set $k = $v in $c"; fi
      done <<< "$sets"
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) restore >/dev/null; echo "The item is not met after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      if [ -d /run/systemd/system ] && systemctl is-active --quiet auditd.service; then
        auditctl --signal reload >/dev/null 2>&1 || kill -HUP "$(systemctl show -p MainPID --value auditd.service)"
        echo "auditd reloaded its configuration"
      fi
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=auditd-conf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    export LC_ALL=C
    c=/etc/audit/auditd.conf
    # aline KEY: number of the last active line setting KEY, empty when none
    aline() { awk -v k="$1" '/^[ \t]*#/ { next } { i = index($0, "="); if (!i) next; n = tolower(substr($0, 1, i - 1)); gsub(/[ \t]/, "", n) } n == k { r = NR } END { print r }' "$c"; }
    aval() {
      local l; l=$(aline "$1")
      if [ -z "$l" ]; then echo -; return; fi
      sed -n "${l}p" "$c" | sed -e 's/^[^=]*=//' -e 's/^[ \t]*//' -e 's/[ \t]*$//'
    }
    aok() { [ "$2" != "-" ] && printf '%s\n' "$2" | awk -v k="$1" '{ v = tolower($0) } END { exit !((k == "disk_full_action" && (v == "single" || v == "halt")) || (k == "disk_error_action" && (v == "syslog" || v == "single" || v == "halt"))) }'; }
    evaluate() {
      local k v ok="" bad=""
      if [ -d /etc/audit ] && [ ! -x /etc/audit ]; then echo "NOT_OK:needs-root"; return; fi
      [ -e "$c" ] || { echo "NOT_OK:no-auditd-conf"; return; }
      [ -r "$c" ] || { echo "NOT_OK:needs-root"; return; }
      for k in disk_full_action disk_error_action; do
        v=$(aval "$k")
        if aok "$k" "$v"; then ok="$ok,$k=$v"; else bad="$bad,$k=$([ "$v" = - ] && echo missing || echo "$v")"; fi
      done
      if [ -n "$bad" ]; then echo "NOT_OK:${bad#,}"; else echo "OK:${ok#,}"; fi
    }
      sets='disk_full_action single
    disk_error_action syslog'
      lines=$(tail -n +2 "$b")
      if [ "$(printf '%s\n' "$lines" | cut -d' ' -f1 | tr '\n' ' ')" != "disk_full_action disk_error_action " ]; then
        echo "Backup file is damaged: $b" >&2; exit 1
      fi
      while read -r k s rest; do
        case "$s" in
          absent) [ -z "$rest" ] || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          present) printf '%s\n' "$rest" | grep -qiE "^[[:space:]]*$k[[:space:]]*=" || { echo "Backup file is damaged: $b" >&2; exit 1; } ;;
          *) echo "Backup file is damaged: $b" >&2; exit 1 ;;
        esac
      done <<< "$lines"
      # aset KEY LINE: LINE in place of the last active line of KEY, appended
      # when there is none; an empty LINE removes it
      aset() {
        local l t; l=$(aline "$1"); t=$(mktemp)
        if [ -n "$l" ]; then
          awk -v l="$l" -v s="$2" 'NR == l { if (s != "") print s; next } { print }' "$c" > "$t"
        else
          cat "$c" > "$t"; if [ -n "$2" ]; then printf '%s\n' "$2" >> "$t"; fi
        fi
        cat "$t" > "$c"; rm -f "$t"
      }
      restore() {
        local k s rest cur n=0
        while read -r k s rest; do
          l=$(aline "$k"); cur=""; [ -z "$l" ] || cur=$(sed -n "${l}p" "$c")
          want=$(printf '%s\n' "$sets" | awk -v k="$k" '$1 == k { sub(/^[^ ]+ /, ""); print }')
          if [ "$cur" = "$rest" ] && [ "$s" = present ]; then continue; fi
          if [ -z "$l" ] && [ "$s" = absent ]; then continue; fi
          if [ "$cur" != "$k = $want" ]; then echo "Kept $k: changed since the remediation (${cur:-none})"; continue; fi
          aset "$k" "$rest"; n=$((n + 1))
        done <<< "$lines"
        echo "Restored $n settings in $c"
      }
      [ -f "$c" ] || { echo "$c not found" >&2; exit 1; }
      restore
      if [ -d /run/systemd/system ] && systemctl is-active --quiet auditd.service; then
        auditctl --signal reload >/dev/null 2>&1 || kill -HUP "$(systemctl show -p MainPID --value auditd.service)"
        echo "auditd reloaded its configuration"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/auditd.conf.5.html
  - https://man7.org/linux/man-pages/man8/auditd.8.html

notes:
  pl: |
    Z dozwolonych wartości wybieramy single zamiast halt, bo w trybie
    ratunkowym administrator może zwolnić miejsce przy konsoli, oraz syslog
    przy błędzie zapisu, bo błąd dysku nie musi oznaczać braku miejsca.
    Ustawione wcześniej halt lub single spełnia punkt i zostaje.

    Punkty 6.2.2.2, 6.2.2.3 i 6.2.2.4 działają razem: keep_logs sprawia, że
    dzienniki rosną bez końca, a akcje z 6.2.2.3 i 6.2.2.4 decydują, co się
    stanie, gdy zabraknie miejsca. Bez archiwizacji i usuwania starych
    dzienników przez administratora komputer w końcu przejdzie w tryb
    ratunkowy. Progi space_left (domyślnie 75 MB) i admin_space_left
    (domyślnie 50 MB) dotyczą systemu plików z /var/log/audit, czyli na
    zwykłej instalacji Ubuntu głównego systemu plików, więc zapełnić go może
    dowolny program.

    Naprawa zastępuje ostatni wiersz każdego ustawienia w
    /etc/audit/auditd.conf w miejscu albo dopisuje go na końcu, a potem
    każe działającemu auditd przeładować konfigurację. Wycofanie przywraca
    poprzednie wiersze tam, gdzie nadal jest wartość ustawiona przez
    naprawę. /etc/audit jest dostępny tylko dla roota, więc bez tych
    uprawnień wynik to NOT_OK:needs-root.
  en: |
    Of the allowed values we choose single rather than halt, because in
    rescue mode the administrator can free space at the console, and syslog
    for a write error, because a disk error does not have to mean a lack of
    space. halt or single set earlier meets the item and stays.

    Items 6.2.2.2, 6.2.2.3 and 6.2.2.4 work together: keep_logs makes the
    logs grow without end, and the actions from 6.2.2.3 and 6.2.2.4 decide
    what happens when space runs out. Without the administrator archiving
    and removing old logs, the computer will eventually go into rescue
    mode. The space_left (75 MB by default) and admin_space_left (50 MB by
    default) thresholds apply to the file system holding /var/log/audit,
    which on a regular Ubuntu installation is the root file system, so any
    program can fill it.

    The remediation replaces the last line of each setting in
    /etc/audit/auditd.conf in place or appends it at the end, and then tells
    a running auditd to reload its configuration. Rollback restores the
    previous lines where the value set by the remediation is still there.
    /etc/audit is only accessible to root, so without these privileges the
    result is NOT_OK:needs-root.
