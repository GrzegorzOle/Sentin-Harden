id: fedora44-selinux-installed

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 1.3.1.1
  section: Initial Setup > Mandatory Access Control > Configure SELinux
  title:
    pl: SELinux jest zainstalowany
    en: Ensure SELinux is installed
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: high
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    SELinux to mechanizm kontroli dostępu wbudowany w jądro: każdy proces
    i każdy plik ma etykietę, a polityka opisuje, co proces o danej etykiecie
    może zrobić. Nawet usługa działająca jako root dostaje dostęp tylko do tego,
    czego potrzebuje, więc przejęcie jej nie daje od razu władzy nad całym
    systemem.

    Z SELinux korzystają programy przez bibliotekę libselinux, której obecność
    sprawdza ten punkt. Na Fedorze jest ona zależnością systemd, dnf i wielu
    innych podstawowych pakietów, więc jest zawsze zainstalowana. Reguła daje
    pozycji z tabeli CIS wynik zamiast luki.
  en: |
    SELinux is an access control mechanism built into the kernel: every process
    and every file has a label, and the policy describes what a process with a
    given label may do. Even a service running as root only gets access to what
    it needs, so taking it over does not give power over the whole system at
    once.

    Programs use SELinux through the libselinux library, whose presence this
    item checks. On Fedora it is a dependency of systemd, dnf and many other
    core packages, so it is always installed. The rule gives the CIS table entry
    a result instead of a gap.

disruption_description:
  pl: |
    Nic nie przestaje działać, bo nic nie trzeba zmieniać: biblioteka jest
    częścią każdej instalacji Fedory.
  en: |
    Nothing stops working, because nothing has to change: the library is part of
    every Fedora installation.

implementation_consequences:
  impact_areas:
    - updates-and-servicing
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    if ! command -v rpm >/dev/null 2>&1; then echo CHECK_ERROR; exit 0; fi
    if rpm -q libselinux >/dev/null 2>&1; then echo INSTALLED; else echo NOT_INSTALLED; fi
  expected: '^INSTALLED$'
  comparison: regex

privileges: user
runnable: false

sources:
  - https://docs.fedoraproject.org/en-US/quick-docs/selinux-getting-started/

notes:
  pl: |
    Reguła nie ma naprawy. Brak libselinux oznacza uszkodzony system, bo bez
    niej nie uruchamia się systemd ani dnf; trzeba go naprawić z nośnika
    ratunkowego, a nie jednym poleceniem.
  en: |
    The rule has no remediation. A missing libselinux means a broken system,
    because systemd and dnf do not run without it; it has to be repaired from
    rescue media rather than with one command.
