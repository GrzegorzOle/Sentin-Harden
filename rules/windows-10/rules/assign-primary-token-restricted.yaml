id: win10-assign-primary-token-restricted

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zastępowanie tokenu procesu ograniczone do kont usługowych
    en: Replacing a process token restricted to service accounts
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza prawo do zastępowania tokenu procesu do dwóch
    wbudowanych kont usługowych.

    Prawo to pozwala uruchomić nowy proces z przepustką inną niż własna.
    Program nie tworzy tu tożsamości od zera — musi wziąć token istniejący
    — ale może go przypisać procesowi, który sam uruchamia.

    Skutek jest taki, że proces zaczyna działać pod cudzą nazwą.
    Wszystko, co robi, dzieje się z uprawnieniami tej drugiej osoby
    i pod jej nazwą trafia do dziennika. Jest to droga i do rozszerzenia
    uprawnień, i do ukrycia śladu — a to drugie bywa ważniejsze.

    Dwa konta pozostawione w wykazie to konta, którymi system uruchamia
    usługi. Potrzebują tego prawa z natury swojej pracy, bo właśnie na tym
    polega uruchamianie usługi pod wskazanym kontem.

    Odnotowuję, że sprawdzenie przyjmuje także wykaz pusty. Maszyna, która
    nie uruchamia usług pod kontami wskazanymi, może obejść się bez tego
    prawa w ogóle.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    uruchamiania procesów pod cudzą tożsamością, z cudzym śladem
    w dzienniku.
  en: |
    The setting bounds the right of replacing a process token to the two built-in service accounts.

    That right lets a new process be started with a pass other than one's own. The program does not here make a
    name out of nothing - it has to take an existing token - but it may fasten that token to a process it starts
    itself.

    The upshot is that the process begins to work under somebody else's name. All it does is done with that other
    person's rights and goes into the log under their name. It is a road both to a widening of rights and to a
    hiding of the trace - and the second of those at times weighs more.

    The two accounts left in the list are those by which the system starts its services. They need this right by
    the nature of their work, the starting of a service under a named account being just that.

    I set down that the check takes an empty list as well. A machine that starts no services under named accounts
    may do without this right at all.

    What an attacker gains while the item goes unmet: the starting of processes under somebody else's name, with
    somebody else's trace in the log.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", bo wykaz bywa poszerzany przez
    oprogramowanie instalowane na maszynie.

    Miejscem najczęstszym są serwery aplikacyjne i usługi uruchamiające
    procesy robocze pod kontami użytkowników. Program pośredniczący
    w wykonaniu zadania cudzym kontem potrzebuje tego prawa i dopisuje
    swoje konto usługowe do wykazu przy instalacji.

    Sprawdzenie polega na przeczytaniu wykazu przed zmianą. Wpis inny niż
    dwa konta wbudowane oznacza, że coś na maszynie tego prawa używa,
    i warto ustalić co, zanim się je odbierze.

    Skutek odebrania jest wyraźny: usługa nie zdoła uruchomić procesu pod
    wskazanym kontem i zgłosi błąd uprawnień. Zadanie wykonywane tą drogą
    przestanie się wykonywać.

    Zmiana obowiązuje od następnego zalogowania, bo token powstaje wtedy.
    Procesy trwające nie tracą uprawnień w locie.

    Czego to nie psuje: logowania, uruchamiania programów pod własnym
    kontem, dostępu do plików, udziałów plikowych, drukowania.
  en: |
    The class is "needs review", the list being at times widened by software installed upon a machine.

    The commonest places are servers of applications and services that start working processes under users'
    accounts. A program standing between a task and its doing under somebody else's account needs this right and
    adds its own service account to the list at its installing.

    The review comes down to a reading of the list before the change. An entry other than the two built-in
    accounts means something upon the machine uses this right, and it is worth settling what before it is taken
    away.

    The upshot of the taking away is plain: the service will fail to start a process under the named account and
    will report a fault of rights. A task done by that road will cease to be done.

    The change holds from the next signing in, a token coming about then. Processes at work do not lose rights in
    flight.

    What this does not break: logging on, the running of programs under one's own account, the way to files, file
    shares, or printing.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - scripting-and-automation
  what_breaks:
    pl:
      - Usługa uruchamiająca procesy robocze pod kontami użytkowników zgłosi błąd uprawnień i zadanie się nie wykona
      - Dotyczy to zwłaszcza serwerów aplikacyjnych i programów pośredniczących w wykonaniu zadania cudzym kontem
      - Wpis inny niż dwa konta wbudowane oznacza, że coś na maszynie tego prawa używa
      - Zmiana obowiązuje od następnego zalogowania, bo token powstaje właśnie wtedy
      - Logowanie, uruchamianie programów pod własnym kontem, dostęp do plików i drukowanie pozostają bez zmian
    en:
      - A service starting working processes under users accounts will report a fault of rights and the task will not be done
      - That touches above all servers of applications and programs standing between a task and its doing under another s account
      - An entry other than the two built-in accounts means something upon the machine uses this right
      - The change holds from the next signing in, a token coming about just then
      - Logging on, the running of programs under one s own account, the way to files and printing stay unchanged
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie stoi serwer aplikacyjny uruchamiający zadania pod kontami użytkowników i wymagający tego prawa
    en:
      - Upon the machine stands a server of applications starting tasks under users accounts and calling for this right
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own message
        # goes to the error stream, so the report can tell a missing privilege from
        # a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeAssignPrimaryTokenPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-19,S-1-5-20|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeAssignPrimaryTokenPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeAssignPrimaryTokenPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The right is left to the two built-in service accounts. Anybody else in this
    # list can start a process under a name other than their own.
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeAssignPrimaryTokenPrivilege = *S-1-5-19,*S-1-5-20',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeAssignPrimaryTokenPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/replace-a-process-level-token

notes:
  pl: |
    Reguła bywa mylona z punktem o tworzeniu tokenu i warto, żeby
    aplikacja powiedziała, czym się różnią. Tamto prawo pozwala napisać
    przepustkę od zera; to pozwala przypisać procesowi przepustkę już
    istniejącą. Pierwsze jest mocniejsze, ale drugie łatwiej przeoczyć,
    bo częściej stoi w wykazie z powodów niewinnych.

    Argument wart zachowania dotyczy dziennika. Rozszerzenie uprawnień jest
    tu skutkiem oczywistym, ale nie jedynym. Proces uruchomiony pod cudzą
    tożsamością zapisuje się w dzienniku pod cudzą nazwą — więc ślad
    prowadzi do osoby, która niczego nie zrobiła. Punkt broni zatem nie
    tylko dostępu, ale i wiarygodności zapisów.

    Odnotowuję, że wykaz pusty jest przyjmowany. Maszyna, która nie
    uruchamia usług pod kontami wskazanymi, może obejść się bez tego prawa,
    i sprawdzenie nie podważa takiego ustawienia.
  en: |
    The rule is at times taken for the item about the making of a token, and it is well that the application say
    how they differ. That right lets a pass be written out of nothing; this lets a pass already made be fastened
    to a process. The first is the stronger, but the second is the easier to pass over, standing the oftener in
    the list for innocent grounds.

    The argument worth keeping touches the log. A widening of rights is here the plain upshot but not the only
    one. A process started under another's name writes itself into the log under that name - so the trace leads to
    a person who did nothing. The item therefore guards not only access but the trustworthiness of what is written
    down.

    I set down that an empty list is taken. A machine that starts no services under named accounts may do without
    this right, and the check does not gainsay such a setting.
