id: win2025-netbt-node-type-point-to-point

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > MS Security Guide
  title:
    pl: Tryb rozwiązywania nazw NetBIOS ustawiony na punkt-punkt
    en: NetBIOS name resolution set to point-to-point
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie każe systemowi rozwiązywać nazwy NetBIOS wyłącznie przez
    zapytanie do wyznaczonego serwera nazw, a nie przez rozgłaszanie
    pytania po całej sieci.

    Rozgłaszanie jest tutaj sednem sprawy. Maszyna pyta „kto jest pod tą
    nazwą?", a odpowiedzieć może każdy, kto to pytanie usłyszy.
    Przyjmowana jest pierwsza odpowiedź, bez sprawdzenia, czy
    odpowiadający ma do nazwy jakikolwiek tytuł.

    Napastnik w tej samej sieci nie musi więc nic przechwytywać.
    Wystarczy, że nasłuchuje i odpowiada twierdząco na wszystko.
    Ponieważ pytania rozgłoszeniowe padają najczęściej wtedy, gdy nazwa
    była literówką albo gdy właściwa droga zawiodła, napastnik zbiera
    połączenia kierowane donikąd — a te i tak niosą poświadczenia.

    Dalszy ciąg jest znany: maszyna łączy się do napastnika i podaje mu
    skrót hasła konta, na którym pracuje. Skrót ten da się przekazać
    dalej albo łamać na spokojnie poza siecią ofiary.

    Na serwerze konto to jest zwykle kontem usługi, a te bywają
    uprzywilejowane i mają hasła niezmieniane latami. Jest to różnica
    w stosunku do stanowiska roboczego na tyle duża, że warto ją nazwać:
    zbierany tu skrót jest wart więcej i żyje dłużej.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość podania się za dowolną nazwę, o którą serwer zapyta
    rozgłoszeniem, i odebrania poświadczeń konta usługi bez łamania
    czegokolwiek.
  en: |
    The setting bids the system resolve NetBIOS names by a query to an appointed name server
    alone, and not by the broadcasting of the question over the whole network.

    The broadcasting is here the heart of the matter. A machine asks "who is under this name?",
    and anyone who hears that question may answer. The first answer is taken, with no checking
    whether the answerer holds any title to the name.

    An attacker on the same network thus need catch nothing. It is enough that they listen and
    answer yes to everything. And since broadcast questions fall most often where the name was a
    slip of the keys or where the right road failed, the attacker gathers connections aimed
    nowhere - and those carry credentials all the same.

    What follows is known: the machine connects to the attacker and gives them the hash of the
    password of the account it works under. That hash may be passed further or broken at leisure
    outside the victim's network.

    On a server that account is usually a service's, and those are at times privileged and hold
    passwords unchanged for years. It is a difference against a working station great enough to be
    worth naming: the hash gathered here is worth more and lives longer.

    What an attacker gains while the item goes unmet: the means of giving themselves out for any
    name the server asks after by broadcast, and of taking a service account's credentials without
    breaking anything.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy maszyny i wymaga warunku
    wstępnego, który trzeba spełnić przed jej wprowadzeniem, a nie po.

    Warunkiem tym jest działające rozwiązywanie nazw bez rozgłaszania.
    W praktyce znaczy to albo wskazany serwer WINS, albo — częściej
    dzisiaj — pełne i poprawne rozwiązywanie nazw przez system domenowy
    wraz z przyrostkami wyszukiwania ustawionymi tak, żeby nazwa krótka
    rozwinęła się do pełnej.

    Bez tego warunku nazwy, które dotąd rozwiązywały się rozgłoszeniem,
    przestaną się rozwiązywać w ogóle. Dotyczy to zwykle rzeczy starych
    i słabo udokumentowanych: udziału na maszynie spoza domeny, drukarki
    z własnym serwerem wydruku, urządzenia przemysłowego, skryptu
    odwołującego się do nazwy krótkiej.

    Objaw jest przy tym trudny do powiązania ze zmianą, bo pojawia się
    tylko w tych miejscach, które na rozgłaszaniu stały — a nikt zwykle
    nie wie z góry, które to są. Do tego skutek ujawnia się dopiero po
    ponownym uruchomieniu maszyny, więc być może wiele tygodni po samej
    zmianie.

    Rozpoznanie robi się przed zmianą i polega na sprawdzeniu, czy
    nazwy używane przez aplikacje serwera rozwiązują się przez system
    domenowy. Warto to zrobić także dla nazw wpisanych w plikach
    konfiguracyjnych i w zadaniach terminarza, bo tam najczęściej siedzą
    nazwy krótkie.

    Zmiana nie dotyczy rozwiązywania nazw przez system domenowy,
    połączeń nawiązywanych po adresie ani wpisów w pliku hosts.
  en: |
    The change surely changes how the machine works and takes a precondition to be met before it
    is brought in rather than after.

    That precondition is a working resolving of names without broadcasting. In practice it means
    either an appointed WINS server or - more often today - a full and right resolving of names by
    the domain system together with search suffixes set so that a short name unfolds into a full
    one.

    Without that condition names that had until now resolved by broadcast will stop resolving at
    all. It touches usually things old and poorly written down: a share on a machine outside the
    domain, a printer with a print server of its own, an industrial device, a script reaching for
    a short name.

    The symptom is withal hard to tie to the change, showing only in those places that stood upon
    broadcasting - and nobody usually knows beforehand which those are. Besides, the effect shows
    only after a fresh start of the machine, and so perhaps many weeks after the change itself.

    The reconnaissance is made before the change and lies in checking whether the names used by
    the server's applications resolve by the domain system. It is worth doing also for names
    written in configuration files and in the scheduler's jobs, short names sitting there most
    often.

    The change does not bear on the resolving of names by the domain system, on connections opened
    by address, or on entries in the hosts file.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - legacy-applications
    - file-sharing
    - printing
  what_breaks:
    pl:
      - Nazwa rozwiązywana dotąd rozgłoszeniem przestanie się rozwiązywać, jeśli nie ma jej w systemie domenowym ani w WINS
      - Udział na maszynie spoza domeny, drukarka z własnym serwerem wydruku i urządzenie przemysłowe to typowe ofiary
      - Skrypt odwołujący się do nazwy krótkiej przestanie działać bez ustawionych przyrostków wyszukiwania
      - Skutek ujawnia się dopiero po ponownym uruchomieniu, być może tygodnie po zmianie
      - Połączenia po adresie i wpisy w pliku hosts działają bez różnicy
    en:
      - A name resolved until now by broadcast will stop resolving where it is neither in the domain system nor in WINS
      - A share on a machine outside the domain, a printer with its own print server and an industrial device are the usual victims
      - A script reaching for a short name will stop working without search suffixes set
      - The effect shows only after a fresh start, perhaps weeks after the change
      - Connections by address and entries in the hosts file work with no difference
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Nie wskazano serwera WINS ani nie sprawdzono, czy używane nazwy rozwiązują się przez system domenowy
      - Na serwerze pracuje aplikacja odwołująca się do nazw krótkich maszyn spoza domeny
    en:
      - No WINS server was appointed and it was not checked whether the names in use resolve by the domain system
      - An application reaching for short names of machines outside the domain works on the server
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
      $name = 'NodeType'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '2'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters'
    $name = 'NodeType'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Two means questions go to the appointed name server alone and are never
    # broadcast. The entry set here outranks the node type handed out by the
    # service that gives out addresses.
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters' `
      -Name 'NodeType' -Value 2 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/tcpip-registry-values

notes:
  pl: |
    Warunek wstępny: działające rozwiązywanie nazw bez rozgłaszania —
    wskazany serwer WINS albo pełne rozwiązywanie przez system domenowy
    z ustawionymi przyrostkami wyszukiwania. Bez tego nazwy stojące
    dotąd na rozgłaszaniu przestaną się rozwiązywać.

    Na serwerze waży to, że konto, którego skrót hasła wycieka, jest
    zwykle kontem usługi — uprzywilejowanym i z hasłem niezmienianym
    latami.

    Wpis w rejestrze ma pierwszeństwo przed typem węzła przysłanym przez
    usługę przydzielania adresów.
  en: |
    The precondition: a working resolving of names without broadcasting - an appointed WINS server
    or a full resolving by the domain system with search suffixes set. Without it, names standing
    until now upon broadcasting will stop resolving.

    On a server what weighs is that the account whose password hash leaks is usually a service's -
    privileged and with a password unchanged for years.

    The entry in the registry outranks the node type sent by the service handing out addresses.
