id: win11-rdp-lpt-port-redirection-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host > Device and Resource Redirection
  title:
    pl: Przekierowanie portów równoległych w sesji pulpitu zdalnego wyłączone
    en: Parallel port redirection in Remote Desktop sessions disabled
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Port równoległy to złącze starsze od portu szeregowego i wycofane jeszcze
    wcześniej. Mechanizm sesji zdalnej wciąż potrafi je udostępnić maszynie
    przyjmującej połączenie i wciąż robi to domyślnie.

    Nie ma sensu udawać, że jest to punkt o dużej wadze. Sprzętu na złączu
    równoległym praktycznie nie ma, a to, co zostało, to pojedyncze drukarki
    igłowe i klucze sprzętowe starych programów. Droga wyniesienia danych tędy
    jest teoretyczna.

    Uzasadnienie jest inne i trzeba je postawić uczciwie: chodzi o wyłączenie
    obsługi, której nikt nie używa, nie przegląda i nie aktualizuje. Kod
    przekierowania portu równoległego pracuje po stronie maszyny przyjmującej
    połączenie na danych pochodzących z maszyny łączącej się. Jest to fragment
    systemu rzadko oglądany przez kogokolwiek, a jednocześnie osiągalny dla
    każdego, kto nawiąże sesję. Wyłączenie go zdejmuje ten fragment z drogi,
    nie odbierając nikomu niczego.

    Punkt należy do tej samej rodziny co pozostałe ograniczenia przekierowań
    i ma sens przede wszystkim jako ich uzupełnienie.
  en: |
    A parallel port is a connector older than a serial port and withdrawn even earlier.
    The remote session mechanism can still share it with the machine taking the
    connection, and still does so by default.

    There is no sense in pretending this item carries much weight. Equipment on a
    parallel connector has all but gone, and what remains amounts to the odd dot matrix
    printer and hardware keys of old programs. A route for taking data out this way is
    theoretical.

    The reasoning is different and worth putting honestly: it is about switching off
    handling that nobody uses, nobody looks through and nobody updates. The parallel
    port redirection code works on the side of the machine taking the connection, on
    data coming from the connecting machine. It is a part of the system rarely looked at
    by anyone, and at the same time within reach of anybody who opens a session.
    Switching it off takes that part out of the way without taking anything from anyone.

    The item belongs to the same family as the other limits on redirection and makes
    sense above all as their completion.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, czy w sesji zdalnej używa się czegokolwiek
    podłączonego złączem równoległym.

    Niemal zawsze odpowiedź brzmi „nie" i zmiana nie robi nic. Stacje robocze
    nie mają już takiego złącza, a sprzęt, który je miał, został wymieniony albo
    podłączony przejściówką — a wtedy system widzi go inaczej i ten punkt go
    nie dotyczy.

    Tam, gdzie takie urządzenie jednak pracuje, skutek jest jednoznaczny: port
    przestaje być widoczny w sesji, a program go szukający zgłosi jego brak.
    Najczęstszym przypadkiem jest klucz sprzętowy starego programu — wtedy
    zamiast błędu portu pojawi się komunikat o braku licencji, co bywa mylące
    przy szukaniu przyczyny.

    Drugim przypadkiem jest drukarka igłowa używana do wydruków
    wielowarstwowych, spotykana w magazynach i przy dokumentach przewozowych.
    Takiej drukarki zwykle nie da się zastąpić inną.

    Nie ma restartu, ale sesje już otwarte zachowują przekierowane porty do
    rozłączenia.
  en: |
    What needs checking is whether anything attached by a parallel connector is used in
    a remote session.

    Almost always the answer is no and the change does nothing. Workstations no longer
    have such a connector, and equipment that had one has been replaced or attached by
    an adapter - and then the system sees it differently and this item does not touch it.

    Where such a device does still work, the effect is plain: the port stops being
    visible in the session and a program looking for it reports it missing. The
    commonest case is a hardware key of an old program - there, instead of a port error,
    a message about a missing licence appears, which can mislead when looking for the
    cause.

    The second case is a dot matrix printer used for multi-layer printouts, met in
    warehouses and with transport documents. Such a printer usually cannot be replaced
    by another.

    There is no restart, but sessions already open keep their redirected ports until
    they disconnect.

implementation_consequences:
  impact_areas:
    - remote-desktop
    - drivers-and-devices
    - printing
    - legacy-applications
  what_breaks:
    pl:
      - Urządzenie na złączu równoległym przestaje być widoczne w sesji zdalnej
      - Klucz sprzętowy starego programu nie zostanie odnaleziony, co objawi się brakiem licencji
      - Drukarka igłowa do wydruków wielowarstwowych przestaje być osiągalna z sesji zdalnej
      - Na maszynie bez złącza równoległego nie zmienia się nic
    en:
      - A device on a parallel connector stops being visible in a remote session
      - A hardware key of an old program is not found, which shows as a missing licence
      - A dot matrix printer for multi-layer printouts stops being reachable from a remote session
      - On a machine with no parallel connector nothing changes at all
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Licencja starego programu jest sprawdzana kluczem sprzętowym na złączu równoległym
      - Drukarka igłowa na złączu równoległym jest używana do dokumentów przewozowych i nie ma zamiennika
    en:
      - An old program's licence is checked by a hardware key on a parallel connector
      - A dot matrix printer on a parallel connector is used for transport documents and has no replacement
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
      $name = 'fDisableLPT'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    $name = 'fDisableLPT'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path    = $path
      name    = $name
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'fDisableLPT' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/remote/remote-desktop-services/clients/remote-desktop-allow-access

notes:
  pl: |
    Punkt nie dotyczy zwykłego przekierowania drukarek, które ma w tej paczce
    własne miejsce i działa niezależnie. Drukarka podłączona sieciowo albo
    złączem uniwersalnym pozostaje osiągalna z sesji zdalnej tak samo jak
    wcześniej.

    Jest to jedna z reguł, przy których świadome odpuszczenie jest rozsądnym
    wynikiem pracy: tam, gdzie klucz sprzętowy na złączu równoległym decyduje
    o działaniu programu produkcyjnego, zysk z wdrożenia jest bliski zeru,
    a koszt zatrzymania pracy realny.

    Wpis jest częścią gałęzi wspólnej dla wszystkich ustawień pulpitu zdalnego,
    więc wycofanie usuwa wyłącznie sam wpis.
  en: |
    The item does not concern ordinary printer redirection, which has a place of its
    own in this pack and works independently. A printer attached over the network or by
    a universal connector stays reachable from a remote session just as before.

    It is one of the rules where a deliberate acceptance is a sensible outcome of the
    work: where a hardware key on a parallel connector settles whether a production
    program runs, the gain from the rollout is close to nothing and the cost of work
    stopping is real.

    The entry belongs to a key shared by every Remote Desktop setting, so rollback
    removes the entry alone.
