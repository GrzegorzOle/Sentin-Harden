id: win2025-builtin-administrator-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Wbudowane konto administratora wyłączone
    en: Built-in administrator account disabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza wbudowane konto administratora, czyli to jedno
    konto, które system zakłada sam i którego nie da się usunąć.

    Wartość tego punktu bierze się z przewidywalności. Konto to ma na
    każdej maszynie ten sam identyfikator, a jego nazwa jest znana
    z góry i zmiana nazwy niczego nie ukrywa — identyfikator zostaje
    ten sam. Napastnik zgadujący hasło nie musi więc najpierw ustalać,
    jakie konta istnieją. Jedno zna zawsze.

    Druga rzecz dotyczy rozliczalności. Konto wbudowane bywa używane
    wspólnie przez kilka osób, bo „zawsze było". Zapis w dzienniku mówi
    wtedy, że pracował administrator, ale nie mówi który, a to jest
    dokładnie ta informacja, której szuka się po zdarzeniu.

    Na serwerze punkt wygląda inaczej niż na stanowisku roboczym i tę
    różnicę trzeba postawić na pierwszym planie. Na stanowisku konto to
    jest zwykle nieużywane. Na serwerze bywa kontem ostatniej szansy:
    tym, którym wchodzi się na konsolę, gdy domena nie odpowiada,
    a uwierzytelnienie kontem domenowym nie jest możliwe. Wyłączenie go
    bez przygotowania zastępstwa zamyka drogę powrotu w sytuacji,
    w której będzie najbardziej potrzebna.

    Na kontrolerze domeny reguła nie ma zastosowania, bo kontroler nie
    ma lokalnej bazy kont — konto o tym identyfikatorze jest tam kontem
    domeny i podlega zupełnie innym rozważaniom. Sprawdzenie rozpoznaje
    tę rolę i zgłasza ją osobno, zamiast udawać wynik.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: konto
    o znanej z góry tożsamości, obecne na każdej maszynie, nadające się
    do zgadywania hasła i do pracy wspólnej bez rozliczalności.
  en: |
    The setting switches off the built-in administrator account - the one account the system
    makes of itself and which cannot be removed.

    This item's worth comes from foreseeability. The account bears the same identifier on every
    machine, its name is known beforehand, and a change of name hides nothing - the identifier
    stays the same. An attacker guessing a password need therefore not first settle which
    accounts exist. One they always know.

    The second matter bears on accountability. The built-in account is at times used in common by
    several people, it "always having been there". A record in the log then says an administrator
    worked, but not which one, and that is exactly the knowledge sought after an incident.

    On a server the item looks other than at a working station, and that difference must be put
    in the foreground. At a station the account is usually unused. On a server it is at times the
    account of last resort: the one the console is entered by when the domain does not answer and
    authenticating by a domain account is not to be had. Its switching off without a stand-in
    made ready shuts the road back in the very situation where it will be wanted most.

    On a domain controller the rule has no use, a controller holding no local account base - the
    account of that identifier is there the domain's account and falls under wholly other
    weighings. The check knows that part and reports it apart instead of feigning an outcome.

    What an attacker gains while the item goes unmet: an account of an identity known beforehand,
    present on every machine, fit for the guessing of a password and for common work without
    accountability.

disruption_description:
  pl: |
    Zmiana na pewno zmienia sposób pracy ludzi obsługujących ten serwer
    i wymaga przygotowania drogi zastępczej, zanim zostanie wykonana.

    Podniosłem klasę względem paczki stanowiska roboczego z jednego
    powodu, który wystarcza: na serwerze to konto bywa drogą powrotu.
    Serwer, do którego nie da się już wejść, nie jest maszyną, którą
    ktoś zaniesie do serwisu — jest usługą, która przestała działać dla
    wszystkich.

    Warunkiem wstępnym jest istnienie innego konta lokalnego
    w administratorach, ze znanym i sprawdzonym hasłem. Sprawdzonym
    znaczy tu: użytym przynajmniej raz do zalogowania się na konsoli,
    a nie tylko założonym. Naprawa odmawia działania, gdy innego
    administratora nie ma, ale nie umie sprawdzić, czy jego hasło jest
    znane — to zostaje po stronie człowieka.

    Przypadkiem do sprawdzenia są zadania i usługi pracujące na tym
    koncie. Na serwerach starszych zdarza się, że konto wbudowane jest
    właścicielem zadania harmonogramu albo usługi uruchamianej z jego
    poświadczeniami. Po wyłączeniu konta takie zadanie przestanie się
    wykonywać, a objaw pojawi się dopiero przy następnym terminie.

    Przypadkiem drugim jest dostęp awaryjny przez kartę zarządzającą.
    Jeżeli procedura postępowania w awarii wymienia to konto z nazwy,
    trzeba ją poprawić razem ze zmianą, a nie po niej.

    Zmiana nie dotyczy kont domenowych ani członkostwa w grupach.
    Konto pozostaje na maszynie, jest tylko wyłączone, więc wycofanie
    polega na jego ponownym włączeniu i działa natychmiast.

    Zmiana nie wymaga przerwy i dotyczy prób logowania po niej.
  en: |
    The change surely changes how the people tending this server work and takes a spare road made
    ready before it is done.

    I raised the class against the working station's pack for one reason, and it suffices: on a
    server the account is at times the road back. A server that can no longer be entered is no
    machine somebody carries in for repair - it is a service that stopped working for everyone.

    The precondition is another local account among the administrators, with a known and tried
    password. Tried means here: used at least once to sign in at the console, not merely made.
    The mending refuses to act where no other administrator is there, but cannot check whether
    their password is known - that stays on the person's side.

    The case to be checked is jobs and services working under this account. On older servers it
    happens that the built-in account owns a scheduler's job or a service started with its
    credentials. Once the account is switched off such a job will stop being done, and the
    symptom will show only at the next appointed time.

    The second case is emergency access through the management card. Where the procedure for a
    breakdown names this account outright, it must be mended along with the change and not after
    it.

    The change does not bear on domain accounts or on membership in groups. The account stays on
    the machine, being only switched off, so the undoing is its switching on again and works at
    once.

    The change takes no break and bears on tries at signing in after it.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
    - scripting-and-automation
  what_breaks:
    pl:
      - Zadanie harmonogramu albo usługa uruchamiana z poświadczeniami tego konta przestanie działać
      - Procedura awaryjna wymieniająca to konto z nazwy przestanie być wykonalna
      - Droga powrotu na konsolę przy niedostępnej domenie zniknie, jeśli nie przygotowano zastępstwa
      - Konta domenowe i członkostwo w grupach pozostają bez zmiany
    en:
      - A scheduler's job or a service started with this account's credentials will stop working
      - An emergency procedure naming this account outright will stop being doable
      - The road back to the console with the domain unreachable will go, where no stand-in was made ready
      - Domain accounts and membership in groups stay unchanged
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Na maszynie nie ma innego konta lokalnego w administratorach ze sprawdzonym hasłem
      - Konto wbudowane jest właścicielem zadania harmonogramu albo usługi uruchamianej z jego poświadczeniami
      - Procedura postępowania w awarii wymienia to konto i nie została poprawiona
    en:
      - There is no other local account among the administrators on the machine with a tried password
      - The built-in account owns a scheduler's job or a service started with its credentials
      - The procedure for a breakdown names this account and was never mended
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # A domain controller keeps no local account base, so the account of this
      # identifier is there the domain's own and falls outside this rule.
      $role = (Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction Stop).DomainRole
      if ($role -eq 4 -or $role -eq 5) { 'NOT_APPLICABLE' }
      else {
        $admin = Get-LocalUser -ErrorAction Stop | Where-Object { $_.SID.Value -like '*-500' }
        if ($null -eq $admin) { 'NOT_APPLICABLE' }
        elseif ($admin.Enabled) { 'ENABLED' } else { 'DISABLED' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: DISABLED
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $admin = Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }
    $others = @(
      Get-LocalGroupMember -SID 'S-1-5-32-544' -ErrorAction SilentlyContinue |
        Where-Object { $_.SID.Value -notlike '*-500' }
    )
    [pscustomobject]@{
      sid          = $admin.SID.Value
      name         = $admin.Name
      enabled      = [bool]$admin.Enabled
      other_admins = $others.Count
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}. Other administrators found: $($others.Count)"

  change_command: |
    # The count of other administrators is checked, not whether their
    # passwords are known. That part stays with the person making the change.
    $others = @(
      Get-LocalGroupMember -SID 'S-1-5-32-544' -ErrorAction Stop |
        Where-Object { $_.SID.Value -notlike '*-500' }
    )
    if ($others.Count -eq 0) {
      throw 'No other administrator account on this machine - refusing to disable the only one.'
    }
    $admin = Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' }
    Disable-LocalUser -SID $admin.SID

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.enabled) { Enable-LocalUser -SID $b.sid } else { Disable-LocalUser -SID $b.sid }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/accounts-administrator-account-status

notes:
  pl: |
    Sprawdzenie rozpoznaje kontroler domeny i zgłasza go jako
    niedotyczący, bo kontroler nie ma lokalnej bazy kont. Bez tego
    odczyt kończyłby się błędem, który czytałoby się jak awarię.

    Klasę podniosłem względem paczki stanowiska roboczego, bo na
    serwerze to konto bywa drogą powrotu na konsolę przy niedostępnej
    domenie. Wyłączenie go bez przygotowanego zastępstwa zamyka tę
    drogę wtedy, gdy jest najbardziej potrzebna.

    Naprawa sprawdza liczbę pozostałych administratorów, ale nie umie
    sprawdzić, czy ich hasła są znane. To zostaje po stronie człowieka
    i mówię o tym wprost w komentarzu.
  en: |
    The check knows a domain controller and reports it as not concerned, a controller holding no
    local account base. Without that the reading would end in a fault that would read like a
    breakdown.

    I raised the class against the working station's pack, the account on a server being at times
    the road back to the console with the domain unreachable. Its switching off without a
    stand-in made ready shuts that road just when it is wanted most.

    The mending checks the count of the remaining administrators but cannot check whether their
    passwords are known. That stays on the person's side and I say so outright in the comment.
