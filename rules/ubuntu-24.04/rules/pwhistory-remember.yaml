id: ubuntu2404-pwhistory-remember

benchmark:
  name: CIS Ubuntu Linux 24.04 LTS Benchmark
  version: 1.0.0
  item: 5.3.3.3.1
  section: Access Control > Pluggable Authentication Modules > Configure pluggable module arguments > Configure pam_pwhistory module
  title:
    pl: Liczba zapamiętanych haseł jest skonfigurowana
    en: Ensure password history remember is configured
  level: 1
  profile: server

platform:
  system: ubuntu-24.04

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Gdy system nie pamięta starych haseł, użytkownik po wymuszonej zmianie
    może wrócić do poprzedniego hasła, także takiego, które wyciekło.
    pam_pwhistory odrzuca hasła z historii, a parametr remember mówi, ile
    haseł ta historia obejmuje.

    Punkt wymaga, żeby remember wynosił co najmniej 24.
  en: |
    When the system does not remember old passwords, a user can go back to
    the previous password after a forced change, also one that leaked.
    pam_pwhistory rejects passwords from the history, and the remember
    parameter sets how many passwords the history covers.

    The item requires remember to be at least 24.

disruption_description:
  pl: |
    pam_pwhistory domyślnie pamięta 10 haseł. Naprawa ustawia remember = 24,
    więc użytkownik nie może wrócić do żadnego z ostatnich 24 haseł. Obecne
    hasła działają dalej.
  en: |
    pam_pwhistory remembers 10 passwords by default. The remediation sets
    remember = 24, so a user cannot go back to any of the last 24 passwords.
    Current passwords keep working.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Użytkownicy, którzy na zmianę używają kilku tych samych haseł
    en:
      - Users who rotate between a few of the same passwords
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Konta, którym automatyzacja zmienia hasła z niewielkiej stałej puli
    en:
      - Accounts whose passwords automation changes from a small fixed pool
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    # conf_get KEY FILE...: value of the key in the files read in this order;
    # the last entry wins (the first with first=1), ic=1 ignores the case of names.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" -v ic=1 -v first=1 '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name == "" || (ic ? tolower(name) != tolower(k) : name != k) { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*=?[ \t]*/, "", v); sub(/[ \t]+$/, "", v)
          if (!(first && seen)) val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value, KEY alone and conf=... on active lines of a module,
    # one "file:argument" item each.
    pam_args() {
      local f
      for f in common-password; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if ($i == k || index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 24) }'; }
    evaluate() {
      local v s a bad=""
      if v=$(conf_get remember /etc/security/pwhistory.conf); then s="remember=$v"; else v='10'; s="remember=$v(default)"; fi
      for a in $(pam_args pam_pwhistory.so remember); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          remember) ;;
          *) ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if [ -n "$bad" ]; then echo "NOT_OK:$s,by-hand:${bad#,}"
      elif ok "$v"; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
    evaluate
  expected: '^OK:'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=secconf-1
        if [ -e /etc/security/pwhistory.conf ]; then echo existed=1; else echo existed=0; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/pwhistory.conf
      mark='# Sentin-Harden: ubuntu2404-pwhistory-remember'
      line='remember = 24'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
    # conf_get KEY FILE...: value of the key in the files read in this order;
    # the last entry wins (the first with first=1), ic=1 ignores the case of names.
    conf_get() {
      local k=$1 f
      shift
      set -- $(for f in "$@"; do if [ -r "$f" ]; then printf '%s\n' "$f"; fi; done)
      [ $# -gt 0 ] || return 1
      awk -v k="$k" -v ic=1 -v first=1 '
        { sub(/#.*/, ""); n = $0; sub(/^[ \t]+/, "", n); name = n; sub(/[ \t=].*/, "", name) }
        name == "" || (ic ? tolower(name) != tolower(k) : name != k) { next }
        { v = substr(n, length(name) + 1); sub(/^[ \t]*=?[ \t]*/, "", v); sub(/[ \t]+$/, "", v)
          if (!(first && seen)) val = v; seen = 1 }
        END { if (seen) print val; exit !seen }' "$@"
    }
    # Arguments KEY=value, KEY alone and conf=... on active lines of a module,
    # one "file:argument" item each.
    pam_args() {
      local f
      for f in common-password; do
        [ -r "/etc/pam.d/$f" ] || continue
        awk -v m="$1" -v k="$2" -v f="$f" '
          /^[ \t]*#/ || NF == 0 { next }
          { sub(/^[ \t]*-/, ""); gsub(/\[[^]]*\]/, "[jump]"); $1 = $1; n = split($3, p, "/") }
          p[n] != m { next }
          { for (i = 4; i <= NF; i++) if ($i == k || index($i, k "=") == 1 || index($i, "conf=") == 1) print f ":" $i }' "/etc/pam.d/$f"
      done
    }
    ok() { awk -v v="$1" 'BEGIN { exit !(v ~ /^[0-9]+$/ && v + 0 >= 24) }'; }
    evaluate() {
      local v s a bad=""
      if v=$(conf_get remember /etc/security/pwhistory.conf); then s="remember=$v"; else v='10'; s="remember=$v(default)"; fi
      for a in $(pam_args pam_pwhistory.so remember); do
        case "${a#*:}" in
          conf=*) bad="$bad,$a" ;;
          remember) ;;
          *) ok "${a#*=}" || bad="$bad,$a" ;;
        esac
      done
      if [ -n "$bad" ]; then echo "NOT_OK:$s,by-hand:${bad#,}"
      elif ok "$v"; then echo "OK:$s"
      else echo "NOT_OK:$s"; fi
    }
      r=$(evaluate)
      case "$r" in
        OK*) echo "$f already meets the item (${r#OK:}), nothing to change"; exit 0 ;;
        *by-hand:*) echo "The pam_pwhistory lines in the PAM files have arguments that decide it instead of $f (${r##*by-hand:}); change them by hand in /etc/pam.d or in the pam-auth-update profile that adds them" >&2; exit 1 ;;
      esac
      d=$(dirname "$f")
      old=$(mktemp "$d/.sentin-harden-old.XXXXXX")
      t=$(mktemp "$d/.sentin-harden.XXXXXX")
      trap 'rm -f "$old" "$t"' EXIT
      if [ -e "$f" ]; then had=1; cat "$f" > "$old"; else had=0; fi
      # The first entry wins, so the line of this rule goes at the start; an
      # older copy of it is removed.
      { echo "$mark"; echo "$line"
        if [ "$had" = 1 ]; then awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f"; fi; } > "$t"
      if [ "$had" = 1 ]; then chmod --reference="$f" "$t"; chown --reference="$f" "$t"; else chmod 644 "$t"; chown root:root "$t"; fi
      mv -f "$t" "$f"
      r=$(evaluate)
      case "$r" in
        OK*) ;;
        *) if [ "$had" = 1 ]; then cat "$old" > "$f"; else rm -f "$f"; fi
           echo "$f does not meet the item after the change ($r); restored the previous state" >&2; exit 1 ;;
      esac
      echo "Set $line in $f"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      f=/etc/security/pwhistory.conf
      mark='# Sentin-Harden: ubuntu2404-pwhistory-remember'
      line='remember = 24'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=secconf-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      e=$(sed -n '2s/^existed=//p' "$b")
      case "$e" in 0|1) ;; *) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
      if [ ! -f "$f" ] || ! grep -qxF "$mark" "$f"; then echo "The line of this rule is not in $f, nothing to restore"; exit 0; fi
      t=$(mktemp "$(dirname "$f")/.sentin-harden.XXXXXX")
      trap 'rm -f "$t"' EXIT
      # Only the marked line of this rule goes; the rest of the file stays as it is now.
      awk -v mark="$mark" -v line="$line" 'skip { skip = 0; if ($0 == line) next } $0 == mark { skip = 1; next } { print }' "$f" > "$t"
      if grep -A 1 -xF "$mark" "$f" | grep -qxF "$line"; then kept=0; else kept=1; fi
      if [ "$e" = 0 ] && ! grep -q '[^[:space:]]' "$t"; then
        rm -f "$f"; echo "Removed $f, which this rule created"; exit 0
      fi
      chmod --reference="$f" "$t"; chown --reference="$f" "$t"; mv -f "$t" "$f"
      if [ "$kept" = 1 ]; then
        echo "Removed the comment of this rule from $f; the line under it was changed by hand and stays"
      else
        echo "Removed the remember line of this rule from $f"
      fi
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man5/pwhistory.conf.5.html
  - https://man7.org/linux/man-pages/man8/pam_pwhistory.8.html

notes:
  pl: |
    pam_pwhistory czyta tylko /etc/security/pwhistory.conf (nie ma katalogu
    pwhistory.conf.d), a potem argumenty ze swojego wiersza
    w /etc/pam.d/common-password, które wygrywają z plikiem. W pliku,
    inaczej niż w faillock.conf i pwquality.conf, wygrywa pierwszy wpis
    danego klucza. Wielkość liter w nazwach kluczy nie ma znaczenia,
    a wartość może stać po znaku = albo po spacji; sprawdziłem to
    w kontenerze Ubuntu 24.04. Argument w wierszu pam_pwhistory
    z niepoprawną wartością albo argument conf= daje wynik NOT_OK
    z dopiskiem by-hand; naprawa wtedy niczego nie zmienia, bo ten wiersz
    trzeba poprawić ręcznie.

    Naprawa wstawia wiersz tej reguły na początku pwhistory.conf pod
    komentarzem Sentin-Harden, żeby był pierwszym wpisem. Wycofanie usuwa
    tylko te dwa wiersze. Ustawienie działa dopiero wtedy, gdy pam_pwhistory
    jest włączony (punkt 5.3.2.4); Ubuntu domyślnie go nie włącza. Stare
    hasła moduł zapisuje w /etc/security/opasswd.

    remember liczy także obecne hasło: przy remember = 24 odrzucane jest
    obecne hasło i 23 poprzednie. Wartość 0 wyłącza historię.
  en: |
    pam_pwhistory reads only /etc/security/pwhistory.conf (there is no
    pwhistory.conf.d directory) and then the arguments on its line in
    /etc/pam.d/common-password, which win over the file. In the file,
    unlike faillock.conf and pwquality.conf, the first entry of a key wins.
    The case of key names does not matter, and the value may follow = or a
    space; this was checked in an Ubuntu 24.04 container. An argument on
    the pam_pwhistory line with a wrong value, or a conf= argument, gives
    the NOT_OK result with a by-hand note; the remediation then changes
    nothing, because this line has to be fixed by hand.

    The remediation inserts the line of this rule at the start of
    pwhistory.conf under a Sentin-Harden comment, so that it is the first
    entry. Rollback removes only these two lines. The setting only works
    when pam_pwhistory is enabled (item 5.3.2.4); Ubuntu does not enable it
    by default. The module keeps old passwords in /etc/security/opasswd.

    remember also counts the current password: with remember = 24 the
    current password and the 23 previous ones are rejected. The value 0
    turns the history off.
