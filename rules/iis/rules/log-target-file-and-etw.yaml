id: iis-log-target-file-and-etw

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Logging Recommendations
  title:
    pl: Dziennik kierowany jednocześnie do pliku i do zdarzeń systemu
    en: The log directed at once to a file and to the system events
  level: 1
  profile: application

platform:
  system: iis

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Zapis żądań może trafiać do pliku, do mechanizmu zdarzeń systemu albo do obu
    naraz. Każda droga ma inną słabość i dlatego warto mieć obie.

    Plik jest trwały, ale leży na dysku serwera i ten, kto przejmie maszynę, może
    go zmienić albo skasować — zacieranie śladów zaczyna się właśnie od dziennika
    serwera. Mechanizm zdarzeń pozwala odbierać zapis na bieżąco i wynieść go poza
    maszynę, gdzie jest już poza zasięgiem atakującego, ale bez odbiorcy nic nie
    przechowuje.

    Kierowanie zapisu w obie strony daje dziennik czytelny na miejscu i taki,
    którego skasowanie na maszynie nie usuwa z systemu zbierającego zdarzenia.
  en: |
    The record of requests may go to a file, to the system event mechanism, or to
    both at once. Each road has a weakness of its own and that is why both are
    worth having.

    A file is durable, but it lies on the server disk and whoever takes over the
    machine may alter or delete it - covering tracks begins with the server log.
    The event mechanism allows the record to be received as it happens and carried
    off the machine, where it is beyond the attacker reach, but without a receiver
    it stores nothing.

    Directing the record both ways gives a log readable on the spot and one whose
    deletion on the machine does not remove it from the system gathering the
    events.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia, bo sama w sobie niczego nie daje. Kierowanie zapisu
    do mechanizmu zdarzeń ma sens wyłącznie wtedy, gdy po drugiej stronie ktoś go
    odbiera. Bez odbiorcy jedynym skutkiem jest dodatkowy koszt na każde żądanie,
    zapłacony za nic.

    Na serwerze o dużym ruchu ten koszt bywa zauważalny — każde żądanie oznacza
    dodatkowe zdarzenie do wystawienia. Nie jest to obciążenie duże, ale nie jest
    też zerowe i przy bardzo gęstym ruchu daje się zmierzyć.

    Dlatego kolejność jest odwrotna niż zwykle: najpierw ustawia się odbieranie
    zdarzeń, potem włącza się ich wystawianie. Wdrożenie w drugą stronę zostawia
    serwer płacący za strumień, którego nikt nie czyta.
  en: |
    The change calls for a review, since by itself it gives nothing. Directing the
    record to the event mechanism makes sense only where somebody on the other side
    receives it. Without a receiver the sole effect is an added cost on every
    request, paid for nothing.

    On a busy server that cost is sometimes noticeable - every request means one
    more event to raise. It is not a heavy load, but it is not nil either, and
    under very dense traffic it can be measured.

    Hence the order is the reverse of the usual - the receiving of events is set up
    first, the raising of them switched on afterwards. Rolling it out the other way
    leaves the server paying for a stream nobody reads.

implementation_consequences:
  impact_areas:
    - web-server-services
    - logging-and-audit
  what_breaks:
    pl:
      - Bez ustawionego odbiorcy zdarzeń zmiana daje wyłącznie dodatkowy koszt na każde żądanie
      - Na serwerze o bardzo gęstym ruchu narzut na wystawianie zdarzeń daje się zmierzyć
      - Zapis do pliku działa dalej bez zmian, więc dotychczasowa analiza dzienników pozostaje możliwa
      - Systemy zbierające zdarzenia zaczną otrzymywać strumień żądań i może to wymagać zwiększenia ich pojemności
      - Obsługa żądań, uwierzytelnianie, uprawnienia i zawartość stron pozostają bez zmian
    en:
      - Without a receiver of events set up, the change gives only an added cost on every request
      - On a server under very dense traffic the overhead of raising events can be measured
      - Writing to a file still works unchanged, so the existing log analysis stays possible
      - Systems gathering events begin receiving a stream of requests and this may call for raising their capacity
      - Serving requests, authentication, permissions and page contents are all unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwery, dla których nie ustawiono odbiorcy zdarzeń poza maszyną
      - Maszyny o bardzo gęstym ruchu, na których narzut na wystawianie zdarzeń nie został oszacowany
    en:
      - Servers for which no receiver of events outside the machine has been set up
      - Machines under very dense traffic where the overhead of raising events has not been estimated
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'logTargetW3C' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([string]$value -eq 'True') { 'TRUE' }
          elseif ([string]$value -eq 'False') { 'FALSE' }
          else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(File,ETW|ETW,File)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'logTargetW3C' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.applicationHost/sites/siteDefaults/logFile'
      name    = 'logTargetW3C'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name 'logTargetW3C' -Value 'File,ETW'

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.applicationhost/sites/sitedefaults/logfile/

notes:
  pl: |
    Porównanie jest wyrażeniem, bo serwer zwraca obie drogi w kolejności zależnej
    od zapisu, a znaczenie ustawienia jest w obu przypadkach to samo. Zasada
    zakłada, że pola dziennika ustawiono osobno — kierowanie zapisu w dwie strony
    nie zmienia tego, co w zapisie się znajdzie.
  en: |
    The comparison is an expression, since the server returns both roads in an
    order depending on how it was written, while the meaning of the setting is the
    same either way. The rule assumes the log fields were set apart - directing the
    record both ways does not change what the record holds.
