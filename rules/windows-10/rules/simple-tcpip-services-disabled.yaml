id: win10-simple-tcpip-services-disabled

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Proste usługi diagnostyczne protokołu sieciowego wyłączone
    en: The simple services of telling faults in the network protocol switched off
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie wyłącza zestaw drobnych usług sieciowych pochodzących
    z początków protokołu: odsyłanie odebranych danych, odrzucanie ich,
    podawanie godziny, wysyłanie strumienia znaków.

    Usługi te powstały do sprawdzania, czy połączenie w ogóle działa,
    w czasach, gdy nie było lepszych narzędzi. Nie mają uwierzytelniania,
    nie prowadzą dziennika i nie ograniczają, kto może z nich skorzystać.

    Zagrożenie pierwsze to wzmacnianie. Usługa odsyłająca dane odpowiada
    każdemu, kto wyśle pakiet, więc nadaje się do zalewania cudzej
    maszyny ruchem, który wygląda, jakby pochodził stąd.

    Zagrożenie drugie to samo obciążenie. Strumień znaków wysyłany bez
    końca zajmuje pasmo i procesor, a wyzwala go pojedynczy pakiet.

    Zagrożenie trzecie to rozpoznanie. Odpowiedź z takiej usługi mówi
    napastnikowi, że maszyna istnieje, odpowiada i ma otwarty port,
    którego nikt nie pilnuje.

    Ocena jest wysoka, bo są to otwarte porty bez uwierzytelniania,
    o których istnieniu zwykle nikt nie pamięta.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: porty
    odpowiadające każdemu, nadające się do wzmacniania ruchu.
  en: |
    The setting switches off a set of small services of the network come down from the beginnings of the protocol:
    the sending back of data taken in, the casting of them away, the giving of the hour, the sending of a stream
    of signs.

    Those services arose for the looking at whether a joining works at all, in a time when there were no better
    tools. They have no warranting, keep no record and hold back nobody from using them.

    The first danger is the swelling of traffic. The service sending data back answers whoever sends a packet, so
    it serves for the flooding of another's machine with traffic that looks as though it came from here.

    The second danger is the burden upon this machine. A stream of signs sent without end takes up band and
    reckoner, and a single packet sets it going.

    The third danger is the knowing. An answer from such a service tells an attacker that the machine is there,
    answers, and has an open door nobody watches over.

    The grading is high, these being open doors with no warranting whose being there nobody commonly remembers.

    What an attacker gains while the item goes unmet: doors answering whoever asks, fit for the swelling of
    traffic.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć na stanowisku roboczym sprawdzenie
    zwykle kończy się stwierdzeniem, że nikt z tego nie korzysta.

    Miejscem wartym uwagi są stare narzędzia nadzoru sieci sprawdzające
    dostępność maszyny przez odesłanie danych. Po zmianie zgłoszą
    maszynę jako niedostępną, choć będzie działać.

    Miejscem drugim są urządzenia branżowe pobierające godzinę tą drogą.
    Jest to rozwiązanie dawne, ale spotykane w sprzęcie, którego nikt nie
    wymienił.

    Odnotowuję, że składnik ten nie jest w systemie instalowany domyślnie.
    Na większości maszyn usługi po prostu nie ma i wynik audytu to
    pokaże — jest to stan odrębny od niespełnienia punktu.

    Zmiana wymaga zatrzymania usługi i jest odwracalna natychmiast.

    Czego to nie psuje: sieci jako takiej, udostępniania plików,
    drukowania, logowania, pracy programów.
  en: |
    The class is "needs review", though upon a station of work the review commonly ends in the finding that
    nobody uses it.

    The place worth notice is old tools of the watching of the network that look at a machine's being to be
    reached by the sending back of data. After the change they will give the machine out as beyond reach, though
    it works.

    The second place is gear of a trade taking the hour by that road. It is an old answer, but met with in gear
    nobody has changed out.

    I set down that this part is not laid on by default in the system. Upon most machines the service is simply
    not there and the outcome of the audit will show it - that being a state apart from the item's going unmet.

    The change calls for the service to be stopped and is to be undone at once.

    What this does not break: the network itself, the giving out of files, printing, logging on, or the work of
    programs.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
    - legacy-applications
  what_breaks:
    pl:
      - Stare narzędzia nadzoru sprawdzające dostępność przez odesłanie danych zgłoszą maszynę jako niedostępną
      - Urządzenia branżowe pobierające godzinę tą drogą stracą źródło czasu
      - Składnik nie jest instalowany domyślnie, więc na większości maszyn usługi po prostu nie ma
      - Brak usługi jest stanem odrębnym od niespełnienia punktu i raport ma to rozróżniać
      - Sieć jako taka, udostępnianie plików, drukowanie, logowanie i praca programów pozostają bez zmian
    en:
      - Old tools of watching that look at a machine s being to be reached by the sending back of data will give it out as beyond reach
      - Gear of a trade taking the hour by that road will lose its spring of time
      - The part is not laid on by default, so upon most machines the service is simply not there
      - The want of the service is a state apart from the item s going unmet and the report is to tell them apart
      - The network itself, the giving out of files, printing, logging on and the work of programs stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Nadzór sieci sprawdza dostępność tej maszyny przez odesłanie danych i nie ma innej metody
      - Urządzenie branżowe pobiera z tej maszyny godzinę tą drogą
    en:
      - The watching of the network looks at this machine s being to be reached by the sending back of data and has no other way
      - Gear of a trade takes the hour from this machine by that road
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\simptcp'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'simptcp' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'simptcp' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'simptcp' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/troubleshoot/windows-server/networking/simple-tcpip-services

notes:
  pl: |
    Reguła ma ocenę wysoką, a mimo to na większości maszyn kosztu nie ma
    żadnego — warto, żeby aplikacja pokazała to zestawienie, bo jest to
    wzorcowy przykład szybkiej wygranej.

    Argument wart postawienia dotyczy wzmacniania. Usługa odsyłająca dane
    odpowiada każdemu, więc maszyna staje się narzędziem do zalewania
    cudzego adresu ruchem wyglądającym, jakby pochodził stąd. Szkoda
    powstaje więc gdzie indziej, a odpowiedzialność zostaje tutaj.

    Odnotowuję, że składnik nie jest instalowany domyślnie. Wynik
    „nieadekwatne" jest tu częsty i trzeba go pokazywać jako stan
    odrębny, a nie jako spełnienie punktu.
  en: |
    The rule bears a high grading, and for all that upon most machines there is no cost at all - it is well that
    the application show that setting side by side, it being a pattern showing of a swift winning.

    The argument worth putting touches the swelling of traffic. The service sending data back answers whoever
    asks, so the machine becomes a tool for the flooding of another's address with traffic that looks as though it
    came from here. The harm arises therefore elsewhere, and the answering for it stays here.

    I set down that the part is not laid on by default. The outcome "does not apply" is here a common one and is
    to be shown as a state apart and not as the item's being met.
