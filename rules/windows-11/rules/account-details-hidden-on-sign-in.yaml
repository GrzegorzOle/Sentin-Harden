id: win11-account-details-hidden-on-sign-in

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Logon
  title:
    pl: Dane konta ukryte na ekranie logowania
    en: Account details hidden on the sign-in screen
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ekran logowania potrafi pokazywać dane konta ostatnio używanego na maszynie —
    adres poczty, imię i nazwisko, zdjęcie. Ma to ułatwić rozpoznanie, na które
    konto się loguje.

    Maszyna zablokowana stoi jednak w miejscu, w którym widzi ją więcej osób niż
    tylko jej użytkownik: w otwartej przestrzeni biurowej, w recepcji, w sali
    konferencyjnej podczas przerwy, na biurku przy przechodzącym gościu.
    Wyświetlony adres poczty jest gotową połową poświadczenia i gotowym adresem
    do wiadomości podszywającej się pod kogoś z organizacji. Imię i nazwisko na
    ekranie mówią, kto przy tym biurku siedzi i do czego prawdopodobnie ma
    dostęp.

    Ukrycie tych danych nie utrudnia logowania nikomu, kto wie, na jakie konto
    się loguje. Zabiera natomiast informację każdemu, kto tylko przechodzi obok.
  en: |
    The sign-in screen can display details of the account last used on the machine
    - the mail address, the full name, the photo. This is meant to make it easier
    to recognise which account is being signed in to.

    A locked machine, however, stands where more people see it than just its user:
    in open-plan office space, at a reception desk, in a meeting room during a
    break, on a desk a visitor walks past. A displayed mail address is a ready
    half of a credential and a ready address for a message impersonating somebody
    in the organisation. A full name on screen says who sits at that desk and what
    they probably have access to.

    Hiding these details makes signing in no harder for anybody who knows which
    account they are signing in to. It takes the information away from everybody
    merely walking past.

disruption_description:
  pl: |
    Nic nie przestaje działać. Ekran logowania pokazuje mniej.

    Użytkownik zobaczy pole na nazwę konta zamiast gotowego wpisu ze swoim
    adresem i będzie musiał tę nazwę wpisać. Na maszynie używanej przez jedną
    osobę jest to jedno pole więcej przy każdym logowaniu; na maszynie dzielonej
    przez kilka osób nie zmienia się właściwie nic, bo i tak trzeba było wybierać.

    Logowanie biometryczne działa bez zmian — palec i twarz rozpoznają konto bez
    wpisywania czegokolwiek, więc tam, gdzie są używane, punkt jest
    niezauważalny.

    Nie ma restartu ani wylogowania. Zmiana obowiązuje od najbliższego
    zablokowania ekranu.
  en: |
    Nothing stops working. The sign-in screen shows less.

    The user will see a field for the account name instead of a ready entry
    holding their address, and will have to type that name. On a machine used by
    one person this is one more field at each sign-in; on a machine shared by
    several it changes essentially nothing, since a choice had to be made anyway.

    Biometric sign-in works unchanged - a finger and a face identify the account
    without anything being typed, so where they are used the item goes unnoticed.

    There is no restart and no sign-out. The change applies from the next time the
    screen is locked.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - user-interface
  what_breaks:
    pl:
      - Na ekranie logowania trzeba wpisać nazwę konta zamiast skorzystać z gotowego wpisu
    en:
      - The sign-in screen requires the account name to be typed instead of using a ready entry
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
      $name = 'BlockUserFromShowingAccountDetailsOnSignin'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    $name = 'BlockUserFromShowingAccountDetailsOnSignin'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'BlockUserFromShowingAccountDetailsOnSignin' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } elseif ($b.key_existed) {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
    } else {
      Remove-Item -Path $b.path -Recurse -Force -ErrorAction SilentlyContinue
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-windowslogon

notes:
  pl: |
    Paczka ma kilka reguł dotyczących tego, co widać na zablokowanym ekranie,
    i razem układają się w jedną decyzję: maszyna zablokowana ma nie mówić nic
    o tym, kto z niej korzysta. Osobno każda z nich zdejmuje niewiele.

    Ta reguła jest z nich najważniejsza, bo adres poczty jest jedyną z tych
    informacji, która sama w sobie nadaje się do użycia — reszta opisuje
    maszynę, ta opisuje konto.
  en: |
    The pack has several rules about what is visible on a locked screen, and
    together they make one decision: a locked machine should say nothing about who
    uses it. Separately each of them removes little.

    This rule is the most important of them, because the mail address is the only
    one of those pieces of information usable in itself - the rest describe the
    machine, this one describes the account.
