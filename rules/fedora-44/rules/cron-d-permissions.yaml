id: fedora44-cron-d-permissions

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 2.4.1.7
  section: Services > Job Schedulers > Configure cron
  title:
    pl: Uprawnienia do /etc/cron.d są skonfigurowane
    en: Ensure permissions on /etc/cron.d are configured
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: low
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Pliki w katalogu /etc/cron.d mają format /etc/crontab: każdy wpis podaje
    harmonogram, użytkownika i polecenie. Kto może dodać tu plik, uruchomi
    polecenie jako dowolny użytkownik, także root, a kto może przeglądać
    katalog, poznaje zadania systemowe i ich słabe punkty.

    Punkt wymaga, żeby katalog należał do roota i był dostępny tylko dla
    niego, czyli miał uprawnienia 700 lub bardziej restrykcyjne. Fedora
    tworzy go z uprawnieniami 755.
  en: |
    The files in the /etc/cron.d directory use the /etc/crontab format: each
    entry gives a schedule, a user and a command. Whoever can add a file
    here runs a command as any user, including root, and whoever can list
    the directory learns the system jobs and their weak spots.

    The item requires the directory to be owned by root and accessible only
    to root, that is with mode 700 or stricter. Fedora creates it with mode
    755.

disruption_description:
  pl: |
    Nikt tego nie zauważy: pliki z katalogu czyta demon cron działający
    jako root, a pakiety instalują w nim wpisy jako root.
  en: |
    Nobody will notice: the files in the directory are read by the cron
    daemon running as root, and packages install their entries there as
    root.

implementation_consequences:
  impact_areas:
    - scripting-and-automation
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    f=/etc/cron.d
    if [ ! -e "$f" ]; then echo ABSENT; exit 0; fi
    set -- $(stat -Lc '%a %u %g' "$f")
    if [ $(( 0$1 & 07077 )) -eq 0 ] && [ "$2" = 0 ] && [ "$3" = 0 ]; then echo "RESTRICTED:$1"; else echo "TOO_OPEN:$1:$2:$3"; fi
  expected: '^(RESTRICTED:|ABSENT$)'
  comparison: regex

remediation:
  shell: bash
  backup_command: |
    (
      set -e
      f=/etc/cron.d
      b='{{backup_file}}'
      mkdir -p "$(dirname "$b")"
      {
        echo format=access-1
        if [ -e "$f" ]; then echo "$(readlink -f "$f") $(stat -Lc '%a %u %g' "$f")"; fi
      } > "$b"
      echo "Saved previous state to $b"
    )

  change_command: |
    (
      set -e
      f=/etc/cron.d
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      if [ ! -e "$f" ]; then echo "$f does not exist, nothing to change"; exit 0; fi
      tg=$(readlink -f "$f")
      set -- $(stat -c '%a' "$tg")
      chown 0:0 "$tg"
      # Five digits: with fewer, chmod keeps the setuid and setgid bits of a directory.
      chmod "$(printf '0%04o' $(( 0$1 & 0700 )))" "$tg"
      echo "Set owner root:root and mode $(stat -c '%a' "$tg") on $tg"
    )

  rollback_command: |
    (
      set -e
      b='{{backup_file}}'
      [ -r "$b" ] || { echo "Backup file not found: $b" >&2; exit 1; }
      [ "$(head -n 1 "$b")" = format=access-1 ] || { echo "Backup file is damaged: $b" >&2; exit 1; }
      tail -n +2 "$b" | while read -r f mode uid gid; do
        case "$mode" in ""|*[!0-7]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        case "$uid:$gid" in :*|*:|*[!0-9:]*) echo "Backup file is damaged: $b" >&2; exit 1 ;; esac
        [ -e "$f" ] || { echo "Skipped $f: it no longer exists"; continue; }
        chown "$uid:$gid" "$f"
        chmod "$(printf '0%04o' $(( 0$mode )))" "$f"
        echo "Restored owner and mode of $f"
      done
    )

privileges: root
runnable: true

sources:
  - https://man7.org/linux/man-pages/man8/cron.8.html

notes:
  pl: |
    Wynik RESTRICTED podaje obecne uprawnienia, TOO_OPEN uprawnienia,
    właściciela i grupę (UID i GID), a ABSENT oznacza brak katalogu, co też
    spełnia regułę. Naprawa ustawia właściciela root:root i usuwa prawa
    spoza 700, a wycofanie przywraca poprzedniego właściciela i uprawnienia
    zapisane w kopii. Uprawnienia plików w katalogu się nie zmieniają.

    Katalog należy do pakietu cronie, więc rpm -V cronie zgłasza po naprawie
    zmianę uprawnień, a ponowna instalacja lub aktualizacja pakietu
    przywraca 755 i reguła znów zgłasza wynik TOO_OPEN.
  en: |
    The RESTRICTED result gives the current mode, TOO_OPEN the mode, owner
    and group (UID and GID), and ABSENT means the directory does not exist,
    which also meets the rule. The remediation sets the owner to root:root
    and removes the permissions beyond 700, and rollback restores the
    previous owner and mode recorded in the backup. The permissions of the
    files in the directory do not change.

    The directory belongs to the cronie package, so rpm -V cronie reports the
    changed mode after the remediation, and reinstalling or updating the
    package sets 755 again, so the rule reports TOO_OPEN again.
