id: win2025-secure-launch-enabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Guard
  title:
    pl: Bezpieczne uruchamianie systemu włączone
    en: Secure launch enabled
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt włącza bezpieczne uruchamianie systemu w zestawie ustawień
    warstwy wirtualizacji.

    Zostawiam kategorię wysoką i od razu mówię rzecz, przez którą ten
    punkt bywa pomijany: rozstrzyga on ten sam zamiar co punkt
    o bezpiecznym starcie warstwy wirtualizacji, ale zapisany w innym
    miejscu. Tamten wpis leży wśród zasad, ten wśród ustawień bieżącej
    konfiguracji sterowania.

    Nie jest to powtórzenie, które wolno odpuścić, i chcę to uzasadnić,
    a nie tylko stwierdzić. Benchmark sprawdza oba miejsca, więc raport,
    w którym jedno jest zielone, a drugie czerwone, jest stanem
    prawdziwym i częstym: zamiar zapisano w jednym miejscu, a w drugim
    nie. Maszyna w takim stanie wygląda na skonfigurowaną w połowie
    i zwykle nią jest — najczęściej dlatego, że ktoś ustawił zasadę
    w konsoli zarządzania, a wartość sterowania nigdy się za nią nie
    przepisała, albo odwrotnie, ktoś zmienił rejestr ręcznie, a zasada
    nadpisze to przy najbliższym odświeżeniu.

    Praktyczny wniosek jest taki, że te dwa punkty ustawia się razem
    i sprawdza razem, a rozjazd między nimi traktuje jako ustalenie samo
    w sobie: znaczy, że ktoś kiedyś robił tu coś ręcznie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: to samo,
    co przy sąsiednim punkcie — możliwość umieszczenia się poniżej
    systemu, w warstwie, której system nie widzi.
  en: |
    The item switches on secure launch of the system in the virtualisation layer's
    set of settings.

    I keep the category high, and I will say straight away the thing that makes
    this item get skipped: it settles the same intent as the item on secure launch
    of the virtualisation layer, but recorded in a different place. That entry sits
    among the policies, this one among the settings of the current control set.

    This is not a repetition that may be let go, and I want to give grounds for
    that rather than merely state it. The benchmark checks both places, so a report
    in which one is green and the other red is a real and common state: the intent
    was recorded in one place and not in the other. A machine in that state looks
    half configured and usually is - most often because somebody set the policy in
    a management console and the control-set value was never written after it, or
    the other way round, somebody changed the registry by hand and the policy will
    overwrite it at the next refresh.

    The practical conclusion is that these two items are set together and checked
    together, and a divergence between them is a finding in itself: it means
    somebody once did something here by hand.

    What an attacker gains while the item goes unmet: the same as at the item next
    to it - the ability to place themselves below the system, in a layer the system
    does not see.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga świadomego wdrożenia", tę samą co przy
    sąsiednim punkcie, i z tego samego powodu: skutek jest zerowy
    w normalnej pracy i całkowity przy rozruchu, jeżeli sprzęt albo
    oprogramowanie układowe nie spełnia wymagań.

    Jedna uwaga, która wynika z podwójnego zapisu i której nie ma przy
    tamtym punkcie. Skoro zasada nadpisuje wartość sterowania przy
    odświeżeniu, to cofnięcie zmiany wykonane tylko tutaj bywa pozorne:
    wartość wróci, gdy tylko zasada zostanie ponownie zastosowana.
    Przy wycofywaniu trzeba więc cofnąć oba punkty, a nie ten, który
    akurat wypadł czerwony.

    Ma to znaczenie w sytuacji najgorszej z możliwych, czyli gdy maszyna
    po restarcie nie wstała i cofa się zmianę z konsoli pod presją czasu.
    Cofnięcie jednego wpisu, restart i drugi nieudany rozruch to
    scenariusz, który zdarza się właśnie dlatego, że pod presją sprawdza
    się jedno miejsce.

    Zmiana wiąże się po restarcie i cofa po kolejnym.
  en: |
    I keep the class "needs a planned rollout", the same as at the item next to it,
    and for the same reason: the effect is zero in normal operation and total at
    boot, if the hardware or the firmware does not meet the requirements.

    One note follows from the double recording and is absent at that other item.
    Since the policy overwrites the control-set value at a refresh, a rollback
    performed only here is sometimes only apparent: the value will come back as
    soon as the policy is applied again. When rolling back, both items must
    therefore be undone, not the one that happened to come out red.

    This matters in the worst situation there is, namely when the machine did not
    come up after a restart and the change is being undone from the console under
    time pressure. Undoing one entry, restarting, and a second failed boot is a
    scenario that happens for exactly this reason: under pressure only one place
    gets checked.

    The change binds after a restart and is undone after another one.

implementation_consequences:
  impact_areas:
    - boot-and-firmware
    - virtualization-and-containers
  what_breaks:
    pl:
      - Sprzęt albo oprogramowanie układowe niespełniające wymagań daje maszynę, która po restarcie nie wstaje
      - Cofnięcie zmiany wykonane tylko w jednym z dwóch miejsc bywa pozorne, bo zasada nadpisze wartość przy odświeżeniu
      - Rozjazd między tym punktem a sąsiednim znaczy, że ktoś kiedyś zmieniał tu coś ręcznie
      - W normalnej pracy skutek jest zerowy — zmiana niczego nie blokuje i nie odmawia żadnemu programowi
    en:
      - Hardware or firmware that does not meet the requirements gives a machine that does not come up after a restart
      - A rollback performed in only one of the two places is sometimes only apparent, because the policy overwrites the value at a refresh
      - A divergence between this item and the one next to it means somebody once changed something here by hand
      - In normal operation the effect is zero - the change blocks nothing and refuses no program
  interruption: system-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Oprogramowanie układowe nie zostało uaktualnione do wersji wspieranej przez producenta maszyny
      - Nie ma sprawdzonej drogi dostępu do konsoli maszyny na wypadek, gdyby po restarcie nie wstała
    en:
      - The firmware has not been updated to a version supported by the machine's vendor
      - There is no proven route to the machine's console in case it does not come up after the restart
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\SystemGuard'
      $name = 'Enabled'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '1'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\SystemGuard'
    $name = 'Enabled'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The same intent as the policy item, recorded in the other of the two
    # places the benchmark checks. Set and roll back both together: undoing
    # only one is undone again at the next policy refresh.
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\SystemGuard'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'Enabled' -Value 1 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/hardware-security/how-hardware-based-root-of-trust-helps-protect-windows

notes:
  pl: |
    Ten sam zamiar co punkt o bezpiecznym starcie warstwy wirtualizacji,
    zapisany w innym miejscu: tamten wśród zasad, ten wśród ustawień
    bieżącej konfiguracji sterowania. Benchmark sprawdza oba, więc
    raport z jednym zielonym i jednym czerwonym jest stanem prawdziwym
    i częstym.

    Rozjazd między nimi traktuj jako ustalenie samo w sobie: znaczy, że
    ktoś kiedyś robił tu coś ręcznie.

    Uwaga przy wycofywaniu, której nie ma przy tamtym punkcie: cofnięcie
    tylko jednego wpisu bywa pozorne, bo zasada nadpisze wartość przy
    odświeżeniu. Pod presją czasu, przy maszynie, która nie wstała, jest
    to scenariusz drugiego nieudanego rozruchu.
  en: |
    The same intent as the item on secure launch of the virtualisation layer,
    recorded in a different place: that one among the policies, this one among the
    settings of the current control set. The benchmark checks both, so a report
    with one green and one red is a real and common state.

    Treat a divergence between them as a finding in itself: it means somebody once
    did something here by hand.

    A note on rolling back, absent at that other item: undoing one entry alone is
    sometimes only apparent, because the policy overwrites the value at a refresh.
    Under time pressure, at a machine that did not come up, that is the scenario of
    a second failed boot.
