id: win2025-shutdown-restricted

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Zamykanie systemu zastrzeżone dla administratorów
    en: Shutting down the system restricted to administrators
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Prawo pozwala zamknąć albo ponownie uruchomić maszynę z poziomu
    zalogowanej sesji.

    Na stanowisku roboczym zamknięcie systemu jest czynnością codzienną
    i nikt nie uznaje jej za zdarzenie. Na serwerze jest odwrotnie.
    Serwer pracuje miesiącami bez przerwy, a jego zamknięcie odcina
    wszystkich, których obsługuje — i nie kończy się samo, bo przy
    maszynie nikt nie stoi. Powrót wymaga sięgnięcia po kartę
    zarządzającą albo po konsolę hosta wirtualizacji.

    Napastnik używa tego prawa dwojako. Pierwszy sposób jest wprost:
    zatrzymanie usługi przez zatrzymanie maszyny, bez potrzeby
    posiadania jakichkolwiek uprawnień do samej usługi. Drugi jest
    subtelniejszy i groźniejszy — restart bywa krokiem potrzebnym,
    żeby zaczęło działać to, co zostało wcześniej podłożone. Sterownik
    wpisany do rejestru, zadanie uruchamiane przy starcie i zmiana
    w konfiguracji rozruchu czekają właśnie na ponowne uruchomienie.

    Trzeci skutek dotyczy śladów. Zamknięcie systemu kończy sesje,
    opróżnia pamięć i przerywa przesyłanie dziennika do zbiornicy —
    a wszystko to wygląda jak zdarzenie zwyczajne, więc nikt nie
    szuka w nim przyczyny.

    Punkt zawęża wykaz do administratorów. Różni się tym od paczki
    stanowiska roboczego, gdzie prawo mają również użytkownicy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony:
    możliwość zatrzymania serwera i wymuszenia restartu, który
    uruchamia podłożone mechanizmy i przerywa zapis śladów.
  en: |
    The right allows the machine to be shut down or started again from a logged-in session.

    At a working station a shutting down of the system is an everyday act and nobody counts it
    an event. On a server it is the other way about. A server works for months unbroken, and
    shutting it down cuts off everyone it serves - and does not end of itself, since nobody
    stands at the machine. The return takes a reach for the management card or for the
    virtualisation host's console.

    An attacker uses the right two ways. The first is plain: a halting of the service by a
    halting of the machine, with no need of any rights to the service itself. The second is
    subtler and graver - a restart is at times the step needed for what was planted earlier to
    begin working. A driver written into the registry, a task started at boot and a change in
    the boot configuration all wait on just such a starting again.

    A third effect bears on traces. A shutting down of the system ends the sessions, empties the
    memory and breaks the sending of the log to its collector - and all of that looks like an
    ordinary event, so nobody looks in it for a cause.

    The item narrows the list to administrators. It differs thereby from the working station's
    pack, where users hold the right as well.

    What an attacker gains while the item goes unmet: the means of halting the server and of
    forcing a restart that starts the planted mechanisms and breaks the writing of traces.

disruption_description:
  pl: |
    Sprawdzenia wymaga to, kto dziś zamyka i restartuje ten serwer, bo
    po zawężeniu będą mogli to robić wyłącznie administratorzy.

    W stanie domyślnym prawo mają na serwerze administratorzy oraz
    operatorzy kopii zapasowych. Zawężenie odbiera je tej drugiej
    grupie i to jest cała treść zmiany.

    Przypadkiem do sprawdzenia jest agent kopii zapasowej pracujący na
    koncie umieszczonym w grupie operatorów kopii zapasowych i
    restartujący maszynę po odtworzeniu stanu albo po aktualizacji
    własnego oprogramowania. Rozwiązania takie są rzadkie, ale istnieją
    i zdarzają się właśnie na serwerach.

    Zmiana nie dotyczy restartu wywoływanego przez sam system.
    Aktualizacje instalowane przez usługę systemową, restart po
    instalacji roli i restart zlecony przez zadanie pracujące na koncie
    systemowym działają dalej bez zmiany — konto systemowe nie podlega
    temu wykazowi.

    Nie dotyczy też zamknięcia z poziomu hosta wirtualizacji ani karty
    zarządzającej. Obie drogi omijają system operacyjny i pozostają
    dostępne, co warto odnotować, bo bywa to jedyna droga powrotu.

    Objaw jest natychmiastowy i czytelny: pozycja zamknięcia znika
    z menu, a polecenie zamknięcia kończy się odmową dostępu.
  en: |
    What needs checking is who shuts down and restarts this server today, since after the
    narrowing only administrators will be able to.

    In the default state administrators and backup operators hold the right on a server. The
    narrowing takes it from that second group, and that is the whole of the change.

    The case to be checked is a backup agent working under an account placed in the backup
    operators' group and restarting the machine after a restoring of state or after an updating
    of its own software. Such arrangements are rare, but they exist and happen on servers above
    all.

    The change does not bear on a restart the system itself calls. Updates installed by a system
    service, a restart after the installing of a role and a restart ordered by a task working
    under the system account all go on unchanged - the system account does not fall under this
    list.

    Neither does it bear on a shutting down from the virtualisation host or the management card.
    Both roads go round the operating system and stay open, which is worth noting, since it is
    at times the only road back.

    The symptom is immediate and plain: the shutdown entry leaves the menu, and a shutdown
    command ends in a refusal of access.

implementation_consequences:
  impact_areas:
    - remote-management
    - updates-and-servicing
    - user-interface
  what_breaks:
    pl:
      - Operatorzy kopii zapasowych stracą możliwość zamknięcia i restartu maszyny
      - Agent kopii zapasowej restartujący serwer po odtworzeniu stanu zgłosi odmowę dostępu
      - Restart wywołany przez sam system i przez zadania na koncie systemowym działa bez zmiany
      - Zamknięcie z poziomu hosta wirtualizacji i karty zarządzającej pozostaje dostępne
    en:
      - Backup operators will lose the means of shutting down and restarting the machine
      - A backup agent restarting the server after a restoring of state will report a refusal of access
      - A restart called by the system itself and by tasks under the system account goes on unchanged
      - Shutting down from the virtualisation host and the management card stays open
  interruption: none
  user_visible: true
  do_not_apply_when:
    pl:
      - Serwer jest restartowany przez agenta pracującego na koncie z grupy operatorów kopii zapasowych
      - Obsługa maszyny należy do osób, którym celowo nie nadano uprawnień administratora
    en:
      - The server is restarted by an agent working under an account in the backup operators' group
      - The tending of the machine belongs to people purposely not granted administrative rights
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $output = & secedit /export /cfg $export /areas USER_RIGHTS 2>&1
      if (-not (Test-Path -Path $export)) {
        # secedit refuses the export without administrative rights. Its own
        # message goes to the error stream, so the report can tell a missing
        # privilege from a real fault instead of showing a bare error.
        [Console]::Error.WriteLine((($output | Out-String).Trim()))
        'CHECK_ERROR'
      }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeShutdownPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(S-1-5-32-544|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeShutdownPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeShutdownPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeShutdownPrivilege = *S-1-5-32-544',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeShutdownPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/shut-down-the-system

notes:
  pl: |
    Wykaz zgodny obejmuje wyłącznie administratorów. W paczce stanowiska
    roboczego dopuszczeni są również użytkownicy — na serwerze nie,
    i jest to różnica celowa.

    Domyślnie prawo mają na serwerze także operatorzy kopii zapasowych.
    To właśnie tę grupę zawężenie odbiera i to jest cała treść zmiany.

    Zamknięcie z poziomu hosta wirtualizacji albo karty zarządzającej
    omija system operacyjny i pozostaje dostępne. Punkt nie jest
    zabezpieczeniem przed zatrzymaniem maszyny, tylko przed zatrzymaniem
    jej przez osobę zalogowaną.
  en: |
    The compliant list takes in administrators alone. In the working station's pack users are
    allowed as well - on a server they are not, and that difference is on purpose.

    By default backup operators hold the right on a server too. It is that group the narrowing
    takes it from, and that is the whole of the change.

    Shutting down from the virtualisation host or the management card goes round the operating
    system and stays open. The item is no guard against the machine being halted, only against
    its being halted by somebody logged in.
