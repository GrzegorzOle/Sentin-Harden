id: win2025-machine-account-password-age-limited

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Okres ważności hasła konta maszyny ograniczony do 30 dni
    en: Machine account password validity limited to 30 days
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie ogranicza czas, przez jaki obowiązuje hasło konta
    maszyny, i każe je zmieniać nie rzadziej niż co trzydzieści dni.

    Warto zacząć od tego, że konto maszyny w ogóle istnieje, bo bywa to
    pomijane. Serwer należący do domeny ma w niej własne konto i własne
    hasło, ustalane bez udziału człowieka. Tym hasłem serwer
    uwierzytelnia się w domenie, zanim zaloguje się na nim ktokolwiek,
    i na nim opiera się kanał, którym rozmawia z kontrolerem.

    Hasło to jest zatem poświadczeniem takim jak każde inne, tyle że
    nikt go nie zna i nikt o nim nie pamięta. Leży na maszynie
    i w katalogu domeny. Kto odczyta je z przejętego serwera, może
    podawać się za ten serwer wobec domeny — a serwerom domena ufa
    inaczej niż ludziom.

    Zmiana hasła co trzydzieści dni ogranicza czas, przez który
    odczytane hasło pozostaje użyteczne. Jest to obrona na czas, nie na
    zawsze, i tak ją oceniam.

    Na serwerze punkt waży więcej niż na stanowisku roboczym z powodu
    tego, czym dysponuje konto maszyny. Konto serwera plików, serwera
    aplikacji czy kontrolera ma w domenie znaczenie, którego konto
    stanowiska nie ma — bywa uprawnione do delegowania, do odczytu
    atrybutów, do usług wystawianych we własnym imieniu.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: hasło
    konta maszyny pozostające ważne bezterminowo, a więc możliwość
    podawania się za ten serwer wobec domeny długo po tym, jak
    z serwera go usunięto.
  en: |
    The setting bounds the time a machine account's password holds good and bids it be changed no
    seldomer than every thirty days.

    It is worth beginning with the fact that a machine account exists at all, that being at times
    passed over. A server belonging to a domain holds an account of its own in it and a password
    of its own, settled with no person's part in it. By that password the server authenticates in
    the domain before anyone signs in upon it, and upon it rests the channel it speaks with the
    controller by.

    The password is thus a credential like any other, save that nobody knows it and nobody holds
    it in mind. It lies on the machine and in the domain's directory. Whoever reads it from a
    taken server can give themselves out for that server towards the domain - and a domain trusts
    servers otherwise than it trusts people.

    A change of the password every thirty days bounds the time a read password stays of use. It
    is a guard for a time and not for ever, and I rate it so.

    On a server the item weighs more than at a working station by reason of what a machine
    account holds. The account of a file server, of an application server or of a controller
    bears a meaning in the domain a station's account does not - it is at times entitled to
    delegate, to read attributes, to services held out in its own name.

    What an attacker gains while the item goes unmet: a machine account's password holding good
    without end, and so the means of giving themselves out for that server towards the domain
    long after it was cleared from the server itself.

disruption_description:
  pl: |
    Nikt tego nie zauważy. Zmiana hasła konta maszyny odbywa się bez
    udziału człowieka i bez przerwy w pracy — serwer robi to sam, przy
    okazji rozmowy z kontrolerem domeny.

    Nie ma tu żadnego logowania do powtórzenia, żadnego hasła do
    zapamiętania i żadnej usługi do zrestartowania. Trzydzieści dni jest
    zresztą ustawieniem domyślnym, więc na maszynie pozostawionej
    w spokoju punkt jest spełniony bez żadnej czynności.

    Jedna sytuacja jest warta wspomnienia, choć nie zmienia klasy.
    Serwer wyłączony na dłużej niż okres ważności hasła — na przykład
    maszyna wirtualna zatrzymana na kilka miesięcy albo serwer zapasowy
    trzymany wyłączony — po włączeniu może mieć hasło rozminięte
    z katalogiem. Nie jest to skutek tej zmiany, tylko własność
    mechanizmu, ale objaw bywa mylący: maszyna zgłasza zerwanie relacji
    zaufania z domeną i wygląda to na awarię poważniejszą, niż jest.

    Nie jest też prawdą, że skrócenie okresu zwiększa ryzyko takiego
    rozminięcia w sposób istotny — kontroler domeny przyjmuje także
    hasło poprzednie, więc zapas jest szerszy niż sama liczba dni.

    Zmiana nie dotyczy haseł kont ludzkich ani usługowych. Mowa
    wyłącznie o haśle samego komputera.

    Zmiana nie wymaga przerwy i wchodzi w życie przy najbliższej
    zmianie hasła.
  en: |
    Nobody will mark it. The change of a machine account's password happens with no person's part
    in it and with no break in work - the server does it of itself, in the course of speaking
    with the domain controller.

    There is here no signing in to repeat, no password to hold in mind and no service to restart.
    Thirty days is withal the default setting, so on a machine left in peace the item is met with
    no deed at all.

    One situation is worth the mention, though it changes no class. A server switched off longer
    than the password's term - a virtual machine halted for some months, say, or a spare server
    kept switched off - may upon its switching on hold a password parted from the directory's.
    That is no effect of this change but a property of the mechanism, yet the symptom misleads:
    the machine reports a broken trust relation with the domain, and it looks like a graver
    breakdown than it is.

    Neither is it true that a shortening of the term raises the risk of such a parting to any
    weight - a domain controller takes the former password too, so the margin is wider than the
    count of days alone.

    The change does not bear on the passwords of human or service accounts. What is spoken of is
    the computer's own password alone.

    The change takes no break and comes into force at the nearest change of the password.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
    - remote-management
  what_breaks:
    pl:
      - Zmiana hasła odbywa się bez udziału człowieka i bez przerwy w pracy serwera
      - Serwer wyłączony dłużej niż okres ważności może zgłosić zerwaną relację zaufania z domeną
      - Hasła kont ludzkich i usługowych nie są tym punktem dotknięte
      - Trzydzieści dni jest ustawieniem domyślnym, więc zwykle nie ma czego zmieniać
    en:
      - The change of the password happens with no person's part in it and with no break in the server's work
      - A server switched off longer than the term may report a broken trust relation with the domain
      - The passwords of human and service accounts are untouched by this item
      - Thirty days is the default setting, so there is usually nothing to change
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Brak znanych przypadków, w których to ustawienie jest błędem
    en:
      - No known cases in which this setting is a mistake
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # Zero has a meaning of its own here - it stands for a password that never
      # expires, not for the shortest possible period. Reported apart, so a report
      # cannot read it as the strictest setting in the range.
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
      $name = 'MaximumPasswordAge'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $value = $item.$name
        if ($null -eq $value) { 'MISSING' }
        elseif ([int]$value -eq 0) { 'NO_EXPIRY' }
        elseif ([int]$value -le 30) { 'WITHIN_LIMIT' }
        else { 'OVER_LIMIT ' + $value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: WITHIN_LIMIT
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    $name = 'MaximumPasswordAge'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'MaximumPasswordAge' -Value 30 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/domain-member-maximum-machine-account-password-age

notes:
  pl: |
    Zero znaczy tutaj „hasło nie wygasa", a nie „najkrótszy możliwy
    okres". Sprawdzenie zgłasza tę wartość osobno, żeby raport nie
    czytał jej jako ustawienia najsurowszego.

    Na serwerze konto maszyny ma w domenie znaczenie, którego konto
    stanowiska nie ma — bywa uprawnione do delegowania i do usług
    wystawianych we własnym imieniu. Stąd ta sama kategoria ryzyka
    waży tu więcej.

    Czytaj razem z punktem o zmienianiu hasła konta maszyny. Ten mówi,
    jak długo hasło obowiązuje, tamten — czy wolno je zmieniać w ogóle.
  en: |
    Zero means here "the password does not lapse" and not "the shortest possible term". The check
    reports that value apart, lest a report read it as the strictest setting.

    On a server a machine account bears a meaning in the domain a station's account does not - it
    is at times entitled to delegate and to services held out in its own name. Thence the same
    risk category weighs more here.

    Read together with the item on the changing of a machine account's password. This one says
    how long the password holds good, that one whether it may be changed at all.
