id: win2025-link-layer-topology-mapper-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa odwzorowująca topologię sieci wyłączona
    en: The service mapping the network's topology disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę odwzorowującą topologię sieci. Usługa ta
    odpowiada na pytania sąsiadów o to, czym ta maszyna jest i jak jest
    podłączona, żeby ktoś mógł z tych odpowiedzi złożyć rysunek sieci.

    Obniżam kategorię do niskiej wobec oceny dla stacji roboczej
    i powodem jest to, komu ta usługa służy. Rysunek sieci ogląda
    człowiek, w oknie, na stacji roboczej. Na serwerze nie ma ani okna,
    ani człowieka, który by się w nie wpatrywał.

    Nie schodzę do zera, bo zostaje strona, która odpowiada. Usługa
    odpowiada każdemu sąsiadowi, bez pytania o to, kim jest, i wydaje
    przy tym nazwę maszyny oraz szczegóły jej podłączenia. Jest to ta
    sama uwaga, którą zapisałem przy ogłaszaniu się jako urządzenie
    sieciowe: wiedza, nie wpływ. Różnica polega na tym, że tam maszyna
    ogłasza się sama, a tutaj odpowiada dopiero zapytana — co jest gorsze
    o tyle, że pytanie może zadać każdy i w dowolnej chwili.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odpowiedź
    o nazwie i sposobie podłączenia tej maszyny, wydawaną każdemu
    sąsiadowi na żądanie.
  en: |
    The item switches off the service that maps the shape of the net. That service answers the askings
    of neighbours as to what that machine is and how it is bound in, that somebody might lay a drawing
    of the net together out of those answers.

    I lower the category to low against the reckoning for a workstation, and the ground is whom that
    service serves. A drawing of the net is looked upon by a person, in a window, upon a workstation.
    Upon a server there is neither a window nor a person to gaze into it.

    I go not down to naught, there being left the side that answers. The service answers every
    neighbour, with no asking after who they are, and gives out therewith the machine's name and the
    small things of how it is bound in. It is the same note I set down at the calling of oneself
    abroad as a device of the net - knowing and not sway. The difference is that there the machine
    calls itself abroad, and here it answers only when asked - which is the worse in so much as the
    asking may be put by anybody and at any hour.

    What an attacker gains while the item goes unmet - an answer as to the name of that machine and
    the way it is bound in, given out to every neighbour upon an asking.

disruption_description:
  pl: |
    Zostawiam klasę „wymaga sprawdzenia", choć kategorię obniżyłem, i to
    jest dobry przykład na to, że te dwie osie nie idą razem.

    Na serwerze nic z tej usługi nie korzysta i nikt nie zauważy jej
    braku w codziennej pracy. Umiem jednak wskazać scenariusz, a to
    wystarcza, żeby punkt nie trafił do trybu zbiorczego. Narzędzia
    odwzorowujące sieć w mniejszych lokalizacjach — te, które rysują
    mapę połączeń zamiast czytać konfigurację urządzeń — opierają się
    właśnie na tym protokole. Po zmianie serwer przestanie się na takiej
    mapie pojawiać.

    Skutek jest łagodny i widoczny od razu: maszyna znika z rysunku,
    a nie z sieci. Nic nie przestaje działać, nic nie traci dostępu
    i nikt nie zgłosi awarii. Ktoś natomiast może stracić czas na
    szukanie przyczyny, dla której serwer zniknął z mapy, jeżeli nie
    będzie wiedział, że sam to zrobił.

    Zmiana cofa się natychmiast.
  en: |
    I leave the class "needs a checking", though I lowered the category, and it is a good showing that
    those two axes go not together.

    Upon a server nothing draws upon that service and nobody will mark its want in the work of every
    day. I can name a happening for all that, and that is enough to keep the item out of the bulk
    mode. Tools that map the net in lesser steads - those that draw a map of bindings in the stead of
    reading the settings of devices - rest upon that very reckoning. After the change the server will
    stop coming forth upon such a map.

    The outcome is mild and seen at once - the machine goes out of the drawing and not out of the net.
    Nothing stops working, nothing loses its reach and nobody will give word of a fault. Somebody may,
    though, lose time seeking the ground whereof the server went from the map, if they know not that
    they did it themselves.

    The change is undone at once.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - diagnostics-and-reporting
  what_breaks:
    pl:
      - Narzędzie rysujące mapę połączeń przestaje pokazywać tę maszynę
      - Maszyna znika z rysunku, a nie z sieci, więc nic nie traci dostępu
      - Nikt nie zgłosi awarii, ale ktoś może stracić czas na szukanie przyczyny zniknięcia z mapy
      - Na serwerze nie ma okna ani człowieka, który oglądałby rysunek sieci
    en:
      - A tool that draws a map of bindings stops showing that machine
      - The machine goes out of the drawing and not out of the net, so nothing loses its reach
      - Nobody will give word of a fault, but somebody may lose time seeking the ground of the going from the map
      - Upon a server there is neither a window nor a person to look upon a drawing of the net
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - W lokalizacji używa się narzędzia rysującego mapę połączeń na podstawie tego protokołu
    en:
      - In that stead a tool is used that draws a map of bindings upon the ground of that reckoning
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\lltdsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine drops off a network map, not off the network. Nothing loses
    # access - but if a mapping tool is in use here, note the change so nobody
    # spends an afternoon looking for a server that is working fine.
    Stop-Service -Name 'lltdsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'lltdsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'lltdsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/lltd/link-layer-topology-discovery-overview

notes:
  pl: |
    Kategoria obniżona, bo rysunek sieci ogląda człowiek w oknie, na
    stacji roboczej — a na serwerze nie ma ani okna, ani człowieka.

    Nie zero, bo zostaje strona, która odpowiada: usługa odpowiada
    każdemu sąsiadowi bez pytania, kim jest, wydając nazwę maszyny
    i szczegóły podłączenia. Różnica wobec ogłaszania się jako urządzenie
    sieciowe: tam maszyna ogłasza się sama, tutaj odpowiada dopiero
    zapytana — co jest gorsze o tyle, że pytanie może zadać każdy
    i w dowolnej chwili.

    Dobry przykład na to, że obie osie nie idą razem: kategoria niska,
    klasa utrzymana, bo scenariusz da się wskazać.
  en: |
    The category is lowered, a drawing of the net being looked upon by a person in a window upon a
    workstation - and upon a server there is neither a window nor a person.

    Not naught, there being left the side that answers - the service answers every neighbour with no
    asking after who they are, giving out the machine's name and the small things of how it is bound
    in. The difference from the calling of oneself abroad as a device of the net - there the machine
    calls itself abroad, here it answers only when asked, which is the worse in so much as the asking
    may be put by anybody and at any hour.

    A good showing that the two axes go not together - the category low, the class held, a happening
    being nameable.
