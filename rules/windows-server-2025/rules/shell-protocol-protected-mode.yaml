id: win2025-shell-protocol-protected-mode

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > File Explorer
  title:
    pl: Tryb chroniony protokołu powłoki włączony
    en: Protected mode for the shell protocol left on
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt utrzymuje ograniczony tryb pracy protokołu powłoki — mechanizmu,
    którym odwołanie w postaci adresu uruchamia czynność w systemie.

    Kategoria wysoka, a rzecz wymaga wyjaśnienia, bo nazwa nic nie mówi.
    Powłoka systemu przyjmuje odwołania wyglądające jak adres. W trybie
    ograniczonym takie odwołanie może dosięgnąć wyłącznie ustalonego zbioru
    miejsc i wykonać wyłącznie ustalony zbiór czynności. W trybie starszym
    to ograniczenie nie działa i odwołanie sięga dalej.

    To jest właściwa treść punktu. Adres nie wygląda na uruchomienie
    programu. Trafia w miejsca, w których człowiek adresu się spodziewa
    i nie ogląda go uważnie: w treść dokumentu, w skrót, w wiadomość,
    w plik pobrany z sieci. Odwołanie, które w trybie ograniczonym nic nie
    zrobi, w trybie starszym potrafi doprowadzić do wykonania czynności
    przewidzianej dla zupełnie innego kontekstu.

    Na serwerze nie zmienia to wagi punktu w dół. Serwer też otwiera pliki,
    też ma powłokę i też loguje się do niego człowiek — a każde otwarcie
    czegoś przyniesionego z zewnątrz przechodzi tą samą drogą.

    Uwaga na wartość: tryb chroniony jest zapisany zerem. Jedynka przywraca
    zachowanie starsze, czyli słabsze. To wpis, przy którym intuicja myli
    kierunek.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: szerszy zbiór
    czynności osiągalnych odwołaniem wyglądającym jak zwykły adres.
  en: |
    The item keeps the shell protocol in its restricted mode of working - the
    mechanism by which a reference in the shape of an address starts an
    action in the system.

    The category is high, and the matter needs explaining, because the name
    says nothing. The system's shell accepts references that look like an
    address. In the restricted mode such a reference can reach only a settled
    set of places and carry out only a settled set of actions. In the older
    mode that restriction does not hold and the reference reaches further.

    That is the real substance of the item. An address does not look like the
    starting of a program. It lands in places where a person expects an
    address and does not examine it closely: in the body of a document, in a
    shortcut, in a message, in a file fetched from the network. A reference
    which does nothing in the restricted mode can, in the older one, lead to
    an action meant for an entirely different context.

    On a server this does not lower the item's weight. A server also opens
    files, also has a shell, and a person also signs in to it - and every
    opening of something brought in from outside goes by the same road.

    Mind the value: the protected mode is written with a zero. A one restores
    the older, weaker behaviour. This is an entry where intuition gets the
    direction wrong.

    What an attacker gains while the item goes unmet: a wider set of actions
    reachable by a reference that looks like an ordinary address.

disruption_description:
  pl: |
    Klasa „bez uciążliwości". Tryb ograniczony jest tu stanem domyślnym od
    bardzo dawna, a reguła go potwierdza, zamiast wprowadzać zmianę.
    W praktyce najczęstszym wynikiem zastosowania jest to, że nic się nie
    dzieje, bo maszyna i tak tak pracowała.

    Skutek pojawiłby się tylko na maszynie, na której ktoś ten tryb
    świadomie osłabił, a robi się to wyłącznie pod bardzo stare
    oprogramowanie, które odwołuje się do powłoki w sposób dziś
    niedopuszczalny. Jeżeli audyt pokaże tu wartość starszą, warto zapytać
    kto i po co ją ustawił, zanim się ją cofnie — to jedyny przypadek,
    w którym ta reguła cokolwiek zmienia.

    Czego to nie psuje: otwierania plików, skrótów, powiązań typów plików,
    eksploratora ani żadnej usługi. Nic w codziennej pracy nie wygląda
    inaczej.

    Rzecz do zapamiętania: wpis leży pod tą samą ścieżką co reguły o listach
    startowych i o kreatorach publikowania. Ścieżka jest wspólna, przedmiot
    zupełnie inny.

    Bez restartu, niewidoczne, natychmiast odwracalne, wolno zastosować
    hurtem.
  en: |
    The class is "no disruption". The restricted mode has been the default
    state here for a very long time, and the rule confirms it rather than
    introducing a change. In practice the commonest outcome of applying it is
    that nothing happens, because the machine was working that way anyway.

    An effect would appear only on a machine where somebody deliberately
    weakened that mode, and this is done solely for very old software which
    addresses the shell in a way no longer acceptable today. If the audit
    shows the older value here, it is worth asking who set it and why before
    undoing it - that is the only case in which this rule changes anything.

    What this does not break: opening files, shortcuts, file type
    associations, the explorer, or any service. Nothing in daily work looks
    different.

    Something to remember: the entry lies under the same path as the rules
    about startup lists and about the publishing wizards. The path is shared,
    the subject entirely different.

    No restart, invisible, undone immediately, may be applied in bulk.

implementation_consequences:
  impact_areas:
    - legacy-applications
    - scripting-and-automation
    - user-interface
  what_breaks:
    pl:
      - Na większości maszyn nic, bo tryb ograniczony jest stanem domyślnym i reguła go tylko potwierdza
      - Skutek pojawi się na maszynie, na której ktoś świadomie osłabił ten tryb pod bardzo stare oprogramowanie
      - Jeżeli audyt pokaże wartość starszą, zapytaj kto i po co ją ustawił, zanim ją cofniesz
      - Otwieranie plików, skróty, powiązania typów plików i eksplorator działają bez zmian
    en:
      - On most machines nothing, because the restricted mode is the default state and the rule only confirms it
      - An effect appears on a machine where somebody deliberately weakened that mode for very old software
      - If the audit shows the older value, ask who set it and why before undoing it
      - Opening files, shortcuts, file type associations and the explorer work unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Na maszynie pracuje stare oprogramowanie, dla którego ktoś świadomie ustawił starsze zachowanie powłoki
    en:
      - The machine runs old software for which somebody deliberately set the older shell behaviour
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The protected mode is written with a zero; a one restores the older,
      # weaker behaviour. Intuition gets the direction wrong here.
      $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
      $name = 'PreXPSP2ShellProtocolBehavior'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    $name = 'PreXPSP2ShellProtocolBehavior'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # A reference in the shape of an address can start an action in the system.
    # In the restricted mode it reaches only a settled set of places; in the
    # older one it reaches further. Zero is the restricted mode - the value runs
    # against intuition.
    $path = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'PreXPSP2ShellProtocolBehavior' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/shell/shell-and-managed-code

notes:
  pl: |
    Nazwa nic nie mówi, więc krótko: powłoka przyjmuje odwołania wyglądające
    jak adres. W trybie ograniczonym takie odwołanie sięga wyłącznie
    ustalonego zbioru miejsc i czynności; w trybie starszym sięga dalej.

    Adres nie wygląda na uruchomienie programu i trafia tam, gdzie człowiek
    się go spodziewa: w treść dokumentu, w skrót, w wiadomość, w plik
    pobrany z sieci.

    Uwaga na wartość: tryb chroniony jest zapisany zerem, jedynka przywraca
    zachowanie słabsze. To wpis, przy którym intuicja myli kierunek.
  en: |
    The name says nothing, so briefly: the shell accepts references that look
    like an address. In the restricted mode such a reference reaches only a
    settled set of places and actions; in the older one it reaches further.

    An address does not look like the starting of a program and lands where a
    person expects it: in the body of a document, in a shortcut, in a
    message, in a file fetched from the network.

    Mind the value: the protected mode is written with a zero, a one restores
    the weaker behaviour. This is an entry where intuition gets the direction
    wrong.
