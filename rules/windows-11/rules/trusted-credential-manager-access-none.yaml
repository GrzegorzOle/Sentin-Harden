id: win11-trusted-credential-manager-access-none

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > User Rights Assignment
  title:
    pl: Dostęp do menedżera poświadczeń jako zaufany obiekt wywołujący nieprzyznany nikomu
    en: Trusted caller access to Credential Manager granted to no one
  level: 1
  profile: workstation

platform:
  system: windows-11

risk_category: critical
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Menedżer poświadczeń przechowuje hasła zapisane przez użytkownika: do
    udziałów sieciowych, do stron, do pulpitu zdalnego. Trzyma je w postaci,
    z której da się odtworzyć hasło, bo inaczej nie mógłby ich podstawić przy
    logowaniu.

    To uprawnienie oznacza konto jako zaufane przy sięganiu do tego magazynu —
    a magazyn zaufanemu wywołującemu wydaje poświadczenia bez ograniczeń, które
    obowiązują wszystkich innych. Nie chodzi więc o dostęp do własnych haseł,
    tylko o dostęp do cudzych. Uprawnienie jest przeznaczone wyłącznie dla
    składników systemu obsługujących logowanie i nie ma być przyznane żadnemu
    kontu.
  en: |
    Credential Manager stores the passwords a user has saved: for network shares,
    for websites, for remote desktop. It holds them in a form the password can be
    recovered from, because otherwise it could not supply them at sign-in.

    This right marks an account as trusted when reaching into that store - and the
    store hands a trusted caller credentials without the limits that apply to
    everybody else. So it is not about access to one's own passwords but to other
    people's. The right is intended solely for the system components that handle
    sign-in and is to be granted to no account at all.

disruption_description:
  pl: |
    Nic. Lista jest pusta w standardowej konfiguracji i pusta ma pozostać.
    Składniki systemu, które z magazynu korzystają, robią to nie przez wpis na
    tej liście, tylko z racji tego, czym są.

    Użytkownik nadal zapisuje i używa własnych haseł — to zupełnie inna droga
    i ta reguła jej nie dotyka. Zapamiętane hasło do udziału sieciowego nadal
    podstawi się samo.
  en: |
    Nothing. The list is empty in a standard configuration and is to stay empty.
    The system components that use the store do so not through an entry on this
    list but by virtue of what they are.

    The user still saves and uses their own passwords - that is an entirely
    different route and this rule does not touch it. A remembered password for a
    network share will still be supplied automatically.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl:
      - Na maszynie skonfigurowanej standardowo nie przestaje działać nic
      - Oprogramowanie, któremu ktoś świadomie przyznał to uprawnienie, straci dostęp do zapisanych poświadczeń
    en:
      - On a machine configured as standard nothing stops working
      - Software to which somebody deliberately granted this right loses access to saved credentials
  interruption: logoff
  user_visible: false
  do_not_apply_when:
    pl:
      - Uprawnienie zostało przyznane konkretnemu kontu i nie ustalono jeszcze, jakie oprogramowanie z niego korzysta
    en:
      - The right was granted to a specific account and it has not been established what software relies on it
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $export = Join-Path $env:TEMP ('sentin-audit-' + [guid]::NewGuid().ToString() + '.inf')
      $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
      if (-not (Test-Path -Path $export)) { 'CHECK_ERROR' }
      else {
        $text = Get-Content -Path $export -Raw -ErrorAction Stop
        Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
        if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') {
          $members = $Matches[1].Trim()
          if ($members -eq '') { 'EMPTY' }
          else { (($members -split ',' | ForEach-Object { $_.Trim().TrimStart('*') } | Sort-Object) -join ',') }
        } else { 'ABSENT' }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '^(ABSENT|EMPTY)$'
  comparison: regex

remediation:
  shell: powershell
  backup_command: |
    $export = Join-Path $env:TEMP ('sentin-backup-' + [guid]::NewGuid().ToString() + '.inf')
    $null = secedit /export /cfg $export /areas USER_RIGHTS /quiet
    $text = Get-Content -Path $export -Raw
    Remove-Item -Path $export -Force -ErrorAction SilentlyContinue
    $value = ''
    if ($text -match '(?m)^SeTrustedCredManAccessPrivilege\s*=\s*(.*)$') { $value = $Matches[1].Trim() }
    [pscustomobject]@{
      right = 'SeTrustedCredManAccessPrivilege'
      value = $value
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $inf = Join-Path $env:TEMP ('sentin-change-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      'SeTrustedCredManAccessPrivilege =',
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    $inf = Join-Path $env:TEMP ('sentin-rollback-' + [guid]::NewGuid().ToString() + '.inf')
    $body = @(
      '[Unicode]',
      'Unicode=yes',
      '[Privilege Rights]',
      ('SeTrustedCredManAccessPrivilege = ' + $b.value),
      '[Version]',
      'signature="$CHICAGO$"',
      'Revision=1'
    ) -join "`r`n"
    Set-Content -Path $inf -Value $body -Encoding Unicode
    secedit /configure /db (Join-Path $env:TEMP 'sentin-secpol.sdb') /cfg $inf /areas USER_RIGHTS /quiet
    Remove-Item -Path $inf -Force -ErrorAction SilentlyContinue

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/access-credential-manager-as-a-trusted-caller

notes:
  pl: |
    Kategoria krytyczna przy zerowej uciążliwości to rzadkie zestawienie i warto
    rozumieć, skąd się bierze. Punkt nie utwardza niczego, co działa — pilnuje
    tylko, żeby lista, która ma być pusta, pusta pozostała. Cała wartość leży
    w wykryciu wpisu, którego nie powinno tam być.

    W macierzy ryzyka i uciążliwości reguła trafia do pola „szybkie wygrane",
    czyli do trybu zbiorczego. To jest dokładnie ten przypadek, dla którego ten
    tryb istnieje: wysoka stawka, zerowy koszt, brak powodu do zwłoki.
  en: |
    A critical category paired with zero disruption is a rare combination and it
    is worth understanding where it comes from. The item hardens nothing that runs -
    it merely sees to it that a list meant to be empty stays empty. All of its
    value lies in detecting an entry that should not be there.

    On the risk and disruption matrix the rule lands in the quick wins field, that
    is, in bulk mode. This is exactly the case that mode exists for: high stakes,
    no cost, no reason to delay.
