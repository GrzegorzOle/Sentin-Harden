id: win2025-null-session-fallback-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: Local Policies > Security Options
  title:
    pl: Powrót do sesji bez uwierzytelnienia zabroniony
    en: Falling back to an unauthenticated session forbidden
  level: 1
  profile: server

platform:
  system: windows-server-2025

risk_category: high
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zabrania zejścia do sesji bez uwierzytelnienia wtedy,
    gdy uzgodnienie ochrony sesji się nie powiodło.

    Jest to punkt o zapasowej drodze, a nie o drodze głównej. Maszyny
    uzgadniają między sobą, jak zabezpieczyć sesję. Gdy uzgodnienie
    zawiedzie, pozostaje pytanie, co zrobić dalej: przerwać albo
    rozmawiać bez zabezpieczenia. Punkt ten wybiera przerwanie.

    Schemat ataku powtarza się w tym benchmarku wielokrotnie i zawsze
    wygląda tak samo. Napastnik nie łamie zabezpieczenia — doprowadza
    do tego, żeby uzgodnienie się nie powiodło. Sposób jest prosty:
    podać się za stronę niepotrafiącą lepiej albo zakłócić samo
    uzgodnienie. Jeżeli maszyna ma wtedy drogę zapasową, to właśnie tę
    drogę napastnik otwiera.

    Na serwerze rzecz waży bardziej niż na stanowisku roboczym, bo
    serwer jest stroną przyjmującą i przyjmuje wiele połączeń naraz,
    w tym połączenia z miejsc, nad którymi nikt nie ma kontroli.
    Droga zapasowa otwarta na serwerze jest otwarta dla wszystkich,
    którzy się z nim łączą.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: sposób
    na sprowadzenie sesji do postaci bez uwierzytelnienia przez samo
    zakłócenie uzgodnienia, bez potrzeby łamania czegokolwiek.
  en: |
    The setting forbids a going down to a session without authentication where the agreeing of
    the session's guard did not succeed.

    It is an item about the spare road, not the main one. Machines agree between themselves how
    to guard a session. Where the agreeing fails, the question is left of what to do next: to
    break off, or to talk without a guard. This item chooses the breaking off.

    The pattern of the attack repeats many times in this benchmark and always looks the same.
    The attacker does not break the safeguard - they bring it about that the agreeing does not
    succeed. The way is plain: to give oneself out for a side unable to do better, or to disturb
    the agreeing itself. Where the machine then has a spare road, it is that road the attacker
    opens.

    On a server the matter weighs more than at a working station, a server being the taking side
    and taking many connections at once, among them connections from places nobody holds sway
    over. A spare road open on a server is open to all who connect to it.

    What an attacker gains while the item goes unmet: a way of bringing a session down to a form
    without authentication by the mere disturbing of the agreeing, with no need of breaking
    anything.

disruption_description:
  pl: |
    Zmiana nie ma znanych skutków ubocznych i nie wymaga przerwy.

    W stanie domyślnym droga zapasowa jest zamknięta na współczesnych
    wersjach systemu, więc na większości serwerów naprawa nie zmienia
    niczego.

    Rzecz, na którą warto zwrócić uwagę, brzmi tak: punkt nie
    odbiera niczego, co działa. Zamyka wyłącznie zachowanie
    występujące wtedy, gdy uzgodnienie już zawiodło — czyli w sytuacji,
    która sama w sobie jest usterką. Połączenie, które dziś działa
    poprawnie, po zmianie działa tak samo.

    Różni to ten punkt od ograniczenia dostępu bez uwierzytelnienia do
    potoków i udziałów. Tamten odbiera coś, z czego ktoś być może
    korzysta; ten zamyka wyjście awaryjne, z którego nie korzysta nikt
    zamierzenie.

    Jeżeli po zmianie coś przestanie działać, znaczy to, że korzystało
    z drogi zapasowej stale — a więc że uzgodnienie zawodziło stale
    i nikt tego nie zauważył. Jest to informacja cenna sama w sobie
    i powód do sprawdzenia, a nie do cofnięcia zmiany.

    Zmiana wchodzi w życie natychmiast i nie wymaga restartu.
  en: |
    The change has no known side effects and takes no break.

    In the default state the spare road is shut in present-day versions of the system, so on
    most servers the mending changes nothing.

    The thing worth marking runs thus: the item takes away nothing that works. It shuts only the
    behaviour arising where the agreeing has already failed - that is, in a situation which is
    of itself a fault. A connection that works rightly today works the same after the change.

    Therein this item differs from the bounding of unauthenticated access to pipes and shares.
    That one takes away something somebody may be using; this one shuts an emergency exit nobody
    uses on purpose.

    Where something stops working after the change, it means it was using the spare road
    steadily - and so that the agreeing was failing steadily and nobody marked it. That is worth
    knowing of itself and is a cause for a check rather than for undoing the change.

    The change comes into force at once and takes no restart.

implementation_consequences:
  impact_areas:
    - legacy-authentication
    - file-sharing
    - network-and-firewall
  what_breaks:
    pl:
      - Punkt nie odbiera niczego, co działa, bo zamyka zachowanie występujące po nieudanym uzgodnieniu
      - Połączenie działające dziś poprawnie po zmianie działa dokładnie tak samo
      - Gdy coś przestanie działać, znaczy to, że uzgodnienie zawodziło stale i nikt tego nie zauważył
      - W stanie domyślnym droga zapasowa jest zamknięta, więc zmiana zwykle nie robi nic
    en:
      - The item takes away nothing that works, shutting only the behaviour arising after a failed agreeing
      - A connection working rightly today works after the change exactly the same
      - Where something stops working, it means the agreeing was failing steadily and nobody marked it
      - In the default state the spare road is shut, so the change usually does nothing
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Nie ustalono, czy jakieś połączenie do tego serwera korzysta z drogi zapasowej stale
    en:
      - It has not been settled whether any connection to this server uses the spare road steadily
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
      $name = 'AllowNullSessionFallback'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    $name = 'AllowNullSessionFallback'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'AllowNullSessionFallback' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else
        # has since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/threat-protection/security-policy-settings/network-security-allow-localsystem-null-session-fallback

notes:
  pl: |
    Punkt zamyka wyjście awaryjne, a nie drogę główną. Dlatego mimo
    wysokiego ryzyka zaliczono go do klasy bez uciążliwości — nie
    odbiera niczego, co dziś działa poprawnie.

    Czytaj go razem z ograniczeniem dostępu bez uwierzytelnienia do
    potoków i udziałów. Tamten rozstrzyga, co widać przez sesję bez
    uwierzytelnienia; ten — czy taka sesja w ogóle powstaje w wyniku
    nieudanego uzgodnienia.

    Jeżeli po zmianie coś przestanie działać, sprawdź, dlaczego
    uzgodnienie ochrony zawodzi. Jest to usterka istniejąca już
    wcześniej, którą zmiana jedynie ujawniła.
  en: |
    The item shuts an emergency exit rather than the main road. Hence, despite the high risk, it
    was counted in the class without disruption - it takes away nothing that works rightly
    today.

    Read it together with the bounding of unauthenticated access to pipes and shares. That one
    settles what shows through a session without authentication; this one, whether such a
    session arises at all out of a failed agreeing.

    Where something stops working after the change, look into why the agreeing of the guard
    fails. It is a fault standing already before, which the change has merely brought to light.
