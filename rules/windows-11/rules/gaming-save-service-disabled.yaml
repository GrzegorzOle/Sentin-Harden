id: win11-gaming-save-service-disabled

benchmark:
  name: CIS Microsoft Windows 11 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa zapisu stanu rozgrywki poza maszyną wyłączona
    en: The service saving the state of play off the machine disabled
  level: 2
  profile: workstation

platform:
  system: windows-11

risk_category: low
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa przechowuje stan rozgrywki poza maszyną i synchronizuje go między
    urządzeniami tego samego użytkownika: wysyła pliki zapisu do usługi
    zewnętrznej i pobiera je z powrotem.

    Kategoria ryzyka jest niska, bo mechanizm nie przyjmuje niczego z sieci
    z własnej inicjatywy i nie udostępnia niczego innym. Wartość punktu leży
    w kierunku wychodzącym: usługa wysyła pliki z maszyny do składnicy poza
    organizacją, powiązanej z kontem prywatnym użytkownika.

    Na stanowisku służbowym jest to kanał wysyłania plików, który istnieje
    niezależnie od jakiejkolwiek decyzji o tym, co z tej maszyny wolno wysłać.
    Zakres jego zawartości jest wprawdzie ograniczony do katalogów
    przypisanych grom, ale sam kanał jest gotowy, uwierzytelniony i zwykle
    pomijany przy przeglądzie dróg, którymi dane opuszczają maszynę.

    Drugi powód jest taki sam jak przy pozostałych składnikach tej rodziny:
    usługa działa i sięga do sieci po to, żeby obsłużyć funkcję, której na
    stanowisku nie ma powodu utrzymywać.
  en: |
    The service keeps the state of play off the machine and synchronises it between the
    same user's devices: it sends save files to an external service and fetches them back.

    The risk category is low, since the mechanism takes nothing from the network on its
    own initiative and makes nothing available to others. The item's worth lies in the
    outgoing direction: the service sends files from the machine to a store outside the
    organisation, tied to the user's private account.

    At a work station that is a channel for sending files existing regardless of any
    decision about what may be sent from that machine. The range of its contents is,
    true, limited to folders assigned to games, but the channel itself is ready,
    authenticated and usually passed over when the routes by which data leave the machine
    are reviewed.

    The second reason is the same as with this family's other components: the service
    runs and reaches out to the network in order to serve a function there is no reason
    to keep at a station.

disruption_description:
  pl: |
    Sprawdzenia wymaga to samo, co przy uwierzytelnianiu w platformie gier,
    i odpowiedź jest zwykle taka sama.

    Po wyłączeniu usługi gry ze sklepu systemowego przestają zapisywać stan
    poza maszyną. Część z nich zapisuje go wtedy lokalnie i działa dalej, część
    odmawia uruchomienia, uznając brak składnicy za błąd. Zachowanie zależy od
    gry i nie da się go przewidzieć bez sprawdzenia.

    Na zwykłym stanowisku biurowym nie ma to znaczenia. Na stanowisku
    szkoleniowym albo świetlicowym z dopuszczonymi grami skutek bywa odczuwalny
    i wart uzgodnienia z osobą odpowiedzialną.

    Stany zapisane wcześniej w składnicy zewnętrznej nie są usuwane. Zostają
    tam, gdzie były, i po cofnięciu zmiany wracają na maszynę.

    Poza grami nic nie korzysta z tego mechanizmu, więc poza tym jednym
    obszarem zmiana nie niesie skutków.

    Zmiana wymaga zatrzymania usługi.
  en: |
    The same needs checking as with authentication to the gaming platform, and the answer
    is usually the same.

    Once the service is off, games from the system store stop saving their state off the
    machine. Some of them then save it locally and carry on working, some refuse to
    start, taking the missing store for an error. The behaviour depends on the game and
    cannot be foretold without checking.

    At an ordinary office station that does not matter. At a training or common room
    station with games allowed the effect is sometimes felt and worth agreeing with
    whoever is responsible.

    States saved earlier in the external store are not removed. They stay where they
    were, and once the change is undone they come back to the machine.

    Nothing but games uses this mechanism, so outside that one area the change carries no
    effects.

    The change takes stopping the service.

implementation_consequences:
  impact_areas:
    - user-interface
    - network-and-firewall
  what_breaks:
    pl:
      - Gry ze sklepu systemowego przestają zapisywać stan rozgrywki poza maszyną
      - Część gier odmawia uruchomienia, uznając brak składnicy stanu za błąd
      - Stany zapisane wcześniej poza maszyną zostają nienaruszone i wracają po cofnięciu zmiany
      - Poza grami nic nie korzysta z tego mechanizmu i nic innego się nie zmienia
    en:
      - Games from the system store stop saving the state of play off the machine
      - Some games refuse to start, taking the missing state store for an error
      - States saved off the machine earlier stay untouched and come back once the change is undone
      - Nothing but games uses this mechanism and nothing else changes
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Stanowisko szkoleniowe albo świetlicowe ma dopuszczone gry i zapis stanu jest wymagany
      - Maszyna jest jedną z kilku, między którymi użytkownik przenosi stan rozgrywki za zgodą
    en:
      - A training or common room station has games allowed and saving their state is required
      - The machine is one of several between which the user moves the state of play with consent
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblGameSave'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\XblGameSave'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    Stop-Service -Name 'XblGameSave' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'XblGameSave' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'XblGameSave' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/mdm/policy-csp-system

notes:
  pl: |
    Reguła należy do czwórki opisującej platformę gier i jej wynik należy
    czytać razem z pozostałymi trzema. Usługa zależy od uwierzytelniania
    w platformie: bez niego nie ma do czego wysyłać zapisów. Wyłączenie tamtej
    reguły czyni tę bezprzedmiotową w skutkach, ale nie w zapisie — usługa
    pozostaje ustawiona na uruchamianie i wróci razem z tamtą.

    Punkt dotyczy wyłącznie zapisów gier. Nie ma wpływu na synchronizację
    plików użytkownika, na kopie zapasowe ani na jakikolwiek inny mechanizm
    przenoszenia danych poza maszynę — te mają własne ustawienia i własne
    reguły.

    Sprawdzenie czyta ustawienie uruchamiania z rejestru, a nie stan usługi
    w danej chwili.
  en: |
    The rule belongs to the quartet describing the gaming platform and its result should
    be read together with the other three. The service depends on authentication to the
    platform: without it there is nowhere to send saves. Disabling that rule makes this
    one moot in its effects but not in what is recorded - the service stays set to start
    and will come back together with that one.

    The item concerns games' saves alone. It bears neither on the synchronising of a
    user's files, nor on backups, nor on any other mechanism moving data off the machine
    - those have settings of their own and rules of their own.

    The check reads the startup setting from the registry rather than the service's state
    at a given moment.
