id: win10-bitlocker-cross-organisation-media-allowed

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > Windows Components > BitLocker Drive Encryption > Removable Data Drives
  title:
    pl: Zapis na nośnikach zaszyfrowanych w innej organizacji dopuszczony
    en: Writing to media encrypted in another organisation admitted
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: low
disruption: none
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie pozostawia możliwość zapisu na nośnikach, które zaszyfrowano
    w innej organizacji.

    Jest to jedyny punkt w tej rodzinie, w którym wartością wymaganą jest
    zero, czyli brak zakazu. Warto więc powiedzieć wprost, czemu służy
    wpis, który niczego nie zabrania.

    Wariant przeciwny — zakaz zapisu na cudzych nośnikach — brzmi jak
    utwardzenie, a w istocie nim nie jest. Nośnik zaszyfrowany gdzie
    indziej jest zaszyfrowany; jego zawartość jest chroniona tak samo
    i przed tym samym. Zablokowanie zapisu nie zwiększa niczyjego
    bezpieczeństwa, a zmusza ludzi do przełożenia danych na nośnik inny,
    częściej niezaszyfrowany.

    Zysk jest więc pośredni i polega na tym, że zakaz nie wypycha danych
    na słabszą drogę. Punkt zapisuję wprost, a nie zostawiam pustym, bo
    wtedy o stanie decyduje wartość domyślna, a nie decyzja.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: dane, które
    ominęły chroniony nośnik cudzy i trafiły na własny, niezaszyfrowany.
  en: |
    The setting leaves standing the chance of writing to media enciphered in another body.

    It is the one item of this family whose called-for value is zero, which is to say the want of a forbidding. It
    is therefore worth saying outright what an entry that forbids nothing serves.

    The opposite variant - a forbidding of writing to others' media - sounds like a hardening and in truth is
    none. A medium enciphered elsewhere is enciphered; its contents are guarded just the same and against the
    same. The shutting of writing raises nobody's safety and drives people to move the data onto another medium,
    the oftener an unenciphered one.

    The gain is therefore an indirect one and rests in this, that a forbidding does not push the data onto a
    weaker road. I write the item outright rather than leave it empty, for then the state is settled by a default
    value and not by a decision.

    What an attacker gains while the item goes unmet: data that went round a guarded medium of another's and
    landed upon an unenciphered one of one's own.

disruption_description:
  pl: |
    Klasa „bez uciążliwości".

    Ustawienie nie odbiera niczego i niczego nie wymaga. Zapisuje stan,
    który na maszynie bez wdrożonych zasad i tak obowiązuje, więc po
    zmianie nikt nie zauważy różnicy.

    Odnotowuję jedyny przypadek, w którym zmiana jest odczuwalna: maszyna,
    na której ten zakaz wcześniej wdrożono. Tam zapis na cudzych nośnikach
    zostanie przywrócony, czyli coś, co przestało działać, zacznie działać
    ponownie.

    Odnotowuję też, że punkt nie kłóci się z zakazem zapisu na nośnikach
    niezaszyfrowanych. Tamten dotyczy braku ochrony, ten — pochodzenia
    ochrony. Nośnik cudzy, ale zaszyfrowany, przechodzi przez oba.

    Czego to nie psuje: odczytu z nośników, zapisu na nośnikach własnych,
    pracy na dyskach stałych, logowania, drukowania.
  en: |
    The class is "no disruption".

    The setting takes nothing away and calls for nothing. It writes down a state that upon a machine with no
    policies rolled out holds anyway, so after the change nobody will mark a difference.

    I set down the one case in which the change is felt: a machine upon which that forbidding was rolled out
    earlier. There the writing to others' media will be given back, which is to say something that had ceased to
    work will work again.

    I set down likewise that the item does not quarrel with the forbidding of writing to unenciphered media. That
    one touches the want of guarding, this the guarding's origin. A medium of another's but enciphered passes
    through both.

    What this does not break: reading from media, writing to media of one's own, work upon fixed drives, logging
    on, or printing.

implementation_consequences:
  impact_areas:
    - removable-media
    - encryption-and-tls
  what_breaks:
    pl:
      - Na maszynie, gdzie zakaz wdrożono wcześniej, zapis na cudzych nośnikach zostanie przywrócony
      - Na pozostałych maszynach nikt nie zauważy różnicy, bo wpis utrwala stan już obowiązujący
      - Punkt nie kłóci się z zakazem zapisu na nośnikach niezaszyfrowanych, bo dotyczy pochodzenia ochrony
      - Nośnik cudzy, ale zaszyfrowany, przechodzi przez obie zasady
      - Odczyt z nośników, zapis na nośnikach własnych, praca na dyskach stałych i drukowanie pozostają bez zmian
    en:
      - Upon a machine where the forbidding was rolled out earlier the writing to others media will be given back
      - Upon the rest nobody will mark a difference, the entry setting down a state that already holds
      - The item does not quarrel with the forbidding of writing to unenciphered media, touching as it does the guarding s origin
      - A medium of another s but enciphered passes through both policies
      - Reading from media, writing to media of one s own, work upon fixed drives and printing stay unchanged
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Obowiązuje wymóg, żeby dane organizacji nie trafiały na nośniki cudze niezależnie od ich ochrony
    en:
      - A requirement holds that the body s data go onto no medium of another s, whatever its guarding
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
      $name = 'RDVDenyCrossOrg'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        if ($null -eq $item.$name) { 'MISSING' } else { [string]$item.$name }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '0'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    $name = 'RDVDenyCrossOrg'
    $current = (Get-ItemProperty -Path $path -Name $name -ErrorAction SilentlyContinue).$name
    [pscustomobject]@{
      path        = $path
      name        = $name
      value       = $current
      existed     = ($null -ne $current)
      key_existed = (Test-Path -Path $path)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Zero admits the writing. The value is set outright rather than left out, so
    # that the state is a decision and not whatever the default happened to be.
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\FVE'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'RDVDenyCrossOrg' -Value 0 -Type DWord

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.existed) {
      Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name $b.name -ErrorAction SilentlyContinue
      if (-not $b.key_existed) {
        # The key is removed only where the change created it and nothing else has
        # since been written into it.
        $k = Get-Item -Path $b.path -ErrorAction SilentlyContinue
        if ($k -and $k.ValueCount -eq 0 -and $k.SubKeyCount -eq 0) {
          Remove-Item -Path $b.path -Force -ErrorAction SilentlyContinue
        }
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/

notes:
  pl: |
    Reguła jest w tej rodzinie jedyną, która wymaga zapisania zera,
    i warto, żeby aplikacja wyjaśniła to przy samym punkcie. Czytelnik
    raportu zobaczy tu wpis dopuszczający i zapyta, dlaczego wśród reguł
    utwardzających znalazła się taka, która czegoś nie zabrania.

    Argument wart zachowania dotyczy tego, że zakaz nie zawsze podnosi
    bezpieczeństwo. Zablokowanie zapisu na cudzym nośniku zaszyfrowanym
    nie chroni danych — przesuwa je tylko na nośnik inny, a nośnik inny
    jest średnio słabiej chroniony niż ten, którego zakazano. Utwardzenie,
    które wypycha dane na gorszą drogę, jest utwardzeniem pozornym.

    Odnotowuję powód zapisywania wartości wprost. Stan pożądany jest tu
    zgodny z domyślnym, więc kusi, żeby wpisu nie robić. Wartość domyślna
    nie jest jednak decyzją i nie widać jej w raporcie — a punkt tej
    rodziny ma mówić, co zostało postanowione, nie co zastano.
  en: |
    The rule is the only one of this family calling for a zero to be written, and it is well that the application
    set that out at the item itself. Whoever reads the report will see here an entry that admits and will ask why
    among hardening rules there stands one that forbids nothing.

    The argument worth keeping touches this, that a forbidding does not always raise safety. The shutting of
    writing to another's enciphered medium guards no data - it merely shifts it onto another medium, and another
    medium is on average the less guarded of the two. A hardening that pushes data onto a worse road is a hardening
    in seeming only.

    I set down the ground for writing the value outright. The wanted state agrees here with the default, so it
    tempts one to make no entry. A default value is however no decision and does not show in the report - and an
    item of this family is to say what was settled, not what was found in place.
