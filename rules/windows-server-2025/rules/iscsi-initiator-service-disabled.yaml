id: win2025-iscsi-initiator-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2025 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa dołączania dysków blokowych przez sieć wyłączona
    en: The service attaching block disks over the network disabled
  level: 2
  profile: server

platform:
  system: windows-server-2025

risk_category: medium
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Punkt wyłącza usługę dołączającą do maszyny dyski udostępnione przez
    sieć. Dysk dołączony tą drogą widoczny jest w systemie jak dysk
    lokalny, mimo że leży gdzie indziej.

    Zostawiam kategorię średnią i chcę powiedzieć, dlaczego nie wyżej,
    skoro rzecz dotyczy dysków. Usługa ta jest stroną łączącą się, a nie
    przyjmującą — sama nie wystawia niczego i nie nasłuchuje na
    połączenia z zewnątrz. Napastnik nie zyskuje więc na niej wejścia.

    Zyskuje natomiast dwie rzeczy mniejsze, ale realne. Po pierwsze,
    możliwość dołączenia do serwera dysku spod własnej kontroli, czyli
    wniesienia na maszynę zawartości albo wyniesienia z niej danych bez
    dotykania sieciowych udziałów, które zwykle są obserwowane. Po drugie,
    ustawienia tej usługi mówią, gdzie leżą dyski tej maszyny — a to
    dobra wskazówka, gdzie szukać danych, jeżeli nie ma ich lokalnie.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: drogę
    dołączenia własnego dysku do serwera i wskazówkę, gdzie leży
    przestrzeń dyskowa tej maszyny.
  en: |
    The item switches off the service that binds onto the machine disks dealt out over the net. A
    disk bound on by that road is seen in the system as a disk near at hand, though it lies
    elsewhere.

    I leave the category middling and would say why no higher, the thing bearing as it does upon
    disks. That service is the side that binds and not the side that takes - it sets nothing forth of
    itself and listens for no bindings from without. An attacker wins therefore upon it no way in.

    They win, though, two lesser things that are true. First, the leave to bind onto the server a
    disk under their own hand, that is to bring what is theirs onto the machine or to bear data off
    it without a touching of the shares of the net, which are mostly watched. Second, the settings of
    that service say where the disks of that machine lie - and that is a good pointing to where data
    are to be sought, if they be not near at hand.

    What an attacker gains while the item goes unmet - a road for the binding on of a disk of their
    own to the server, and a pointing to where the storage of that machine lies.

disruption_description:
  pl: |
    Podnoszę klasę do świadomego wdrożenia wobec oceny dla stacji
    roboczej i jest to w tej grupie jedyny punkt, przy którym powodem
    podniesienia nie jest sieć ani dostęp, tylko dane.

    Na stacji roboczej dołączanie dysków przez sieć jest rzadkie
    i egzotyczne. Na serwerze jest to zwyczajny sposób podłączania
    przestrzeni dyskowej: wolumin bazy danych, cel kopii zapasowych,
    dysk rozstrzygający w klastrze, magazyn maszyn wirtualnych. Tam,
    gdzie ta usługa jest używana, jest używana do rzeczy, na których
    serwer stoi.

    Skutek natychmiastowy jest dotkliwy: zatrzymanie usługi odłącza dyski
    w trakcie pracy. Baza danych pisząca w tej chwili do takiego woluminu
    nie degraduje się łagodnie — zgłasza błąd zapisu, a to bywa początkiem
    awarii poważniejszej niż utrata dostępu.

    Jest też skutek odroczony i on jest tu najbardziej podstępny. Nawet
    jeżeli w chwili zmiany żaden dysk nie był dołączony i nic się nie
    stało, usługa wyłączona nie uruchomi się przy następnym starcie
    maszyny — a wtedy woluminy nie wrócą. Serwer wstanie bez części
    swoich dysków, i to po restarcie zrobionym z zupełnie innego powodu,
    tygodnie później. Nikt nie powiąże jednego z drugim.

    Sprawdzenie polega więc na jednym pytaniu, zadanym niezależnie od
    tego, co jest dołączone w tej chwili: czy ta maszyna kiedykolwiek
    dołącza dyski tą drogą.

    Zmiana cofa się natychmiast, ale ponowne dołączenie dysków bywa
    czynnością osobną.
  en: |
    I raise the class to a witting rolling out against the reckoning for a workstation, and it is in
    this group the one item whereat the ground of the raising is neither the net nor the reach but
    the data.

    On a workstation the binding on of disks over the net is seldom and outlandish. On a server it is
    an everyday way of binding storage on - the volume of a base of data, the mark of keepings of
    copies, the disk that settles a matter within a cluster, the holding of machines made by
    reckoning. Where that service is used, it is used for the things the server stands upon.

    The outcome at once bites - the stopping of the service unbinds the disks in the midst of work. A
    base of data writing at that hour onto such a volume does not fall away gently - it gives word of
    a fault of writing, and that is at times the beginning of a fault weightier than a loss of reach.

    There is also an outcome put off, and it is here the most underhand. Even if at the hour of the
    change no disk was bound on and nothing befell, a service switched off will not start at the next
    starting of the machine - and then the volumes will not come back. The server will rise without
    some of its disks, and that after a restart made of a wholly other ground, weeks later. Nobody
    will bind the one to the other.

    The checking comes therefore to one question, asked whatever be bound on at that hour - whether
    that machine ever binds disks on by that road.

    The change is undone at once, but the binding on of the disks anew is at times a doing of its
    own.

implementation_consequences:
  impact_areas:
    - file-sharing
    - drivers-and-devices
    - network-and-firewall
  what_breaks:
    pl:
      - Zatrzymanie usługi odłącza dyski dołączone przez sieć w trakcie pracy
      - Baza danych pisząca w tej chwili do takiego woluminu zgłasza błąd zapisu
      - Usługa wyłączona nie uruchomi się przy następnym starcie i woluminy nie wrócą
      - Serwer wstanie bez części dysków po restarcie zrobionym z innego powodu, tygodnie później
      - Ponowne dołączenie dysków po cofnięciu zmiany bywa czynnością osobną
    en:
      - The stopping of the service unbinds the disks bound on over the net in the midst of work
      - A base of data writing at that hour onto such a volume gives word of a fault of writing
      - A service switched off will not start at the next starting and the volumes will not come back
      - The server will rise without some of its disks after a restart made of another ground, weeks later
      - The binding on of the disks anew after the undoing is at times a doing of its own
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Maszyna dołącza tą drogą wolumin bazy danych, cel kopii zapasowych albo magazyn maszyn wirtualnych
      - Maszyna należy do klastra korzystającego z dysku rozstrzygającego dołączanego przez sieć
    en:
      - The machine binds on by that road the volume of a base of data, the mark of keepings of copies or the holding of machines made by reckoning
      - The machine belongs to a cluster that uses a disk of settling bound on over the net
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        # The key is there but carries no start value. That is not an inability
    # to check - the reading worked and found nothing to judge, which is a
    # different answer from a setting out of place.
    if ($null -eq $value) { 'NOT_APPLICABLE' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\MSiSCSI'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # Ask whether this machine ever attaches disks this way, not just whether
    # one is attached now: with the service disabled the volumes do not come
    # back at the next boot, weeks later, after an unrelated restart.
    Stop-Service -Name 'MSiSCSI' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'MSiSCSI' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ([int]$b.value -lt 4) { Start-Service -Name 'MSiSCSI' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows-server/storage/iscsi/iscsi-target-server

notes:
  pl: |
    Kategoria nie wyżej niż średnia, bo usługa jest stroną łączącą się,
    a nie przyjmującą — sama nie wystawia niczego i napastnik nie zyskuje
    na niej wejścia. Zyskuje drogę dołączenia własnego dysku
    i wskazówkę, gdzie leży przestrzeń dyskowa tej maszyny.

    Klasa podniesiona i jest to w tej grupie jedyny punkt, przy którym
    powodem podniesienia nie jest sieć ani dostęp, tylko dane.

    Najbardziej podstępny jest skutek odroczony: nawet jeżeli w chwili
    zmiany nic się nie stało, usługa wyłączona nie uruchomi się przy
    następnym starcie i woluminy nie wrócą — po restarcie zrobionym
    z zupełnie innego powodu, tygodnie później.
  en: |
    The category no higher than middling, the service being the side that binds and not the side that
    takes - it sets nothing forth of itself and an attacker wins upon it no way in. They win a road
    for the binding on of a disk of their own and a pointing to where the storage of that machine
    lies.

    The class is raised, and it is in this group the one item whereat the ground of the raising is
    neither the net nor the reach but the data.

    The most underhand is the outcome put off - even if at the hour of the change nothing befell, a
    service switched off will not start at the next starting and the volumes will not come back,
    after a restart made of a wholly other ground, weeks later.
