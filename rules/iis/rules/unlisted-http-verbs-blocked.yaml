id: iis-unlisted-http-verbs-blocked

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Request Filtering and Other Restriction Modules
  title:
    pl: Metody HTTP spoza listy dopuszczonych odrzucane
    en: HTTP methods outside the permitted list are rejected
  level: 1
  profile: application

platform:
  system: iis

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Żądanie HTTP zaczyna się od metody — słowa, które mówi serwerowi, co ma
    zrobić z zasobem. Witryna zwykle potrzebuje dwóch albo trzech: pobrania
    strony, wysłania formularza, czasem sprawdzenia nagłówków. Serwer rozumie
    ich znacznie więcej, a domyślnie przyjmuje każdą, której nie zabroniono.

    Ustawienie odwraca to rozstrzygnięcie: przechodzą wyłącznie metody wpisane
    na listę, reszta jest odrzucana, zanim żądanie dotrze do aplikacji.

    Co to odbiera atakującemu: metody zapisujące i diagnostyczne, o których
    autor aplikacji nie pomyślał, bo ich nie używa. Metoda przesyłająca plik
    pozwala położyć na serwerze cokolwiek, jeśli w którymkolwiek katalogu
    przypadkiem wolno pisać. Metoda kasująca pozwala usuwać. Metody
    diagnostyczne odsyłają żądanie w odpowiedzi razem z nagłówkami, które
    przeglądarka trzyma przed skryptami — w tym ciasteczka sesji.

    Sedno jest takie, że aplikacja zwykle nie sprawdza metody. Sprawdza adres
    i dane, a metodę przyjmuje taką, jaka przyszła. Filtr stawia to pytanie
    przed nią i odpowiada na nie sam.
  en: |
    An HTTP request opens with a method - the word telling the server what to do
    with the resource. A site usually needs two or three of them - fetch a page,
    submit a form, sometimes check the headers. The server understands a good
    many more, and by default accepts every one that has not been forbidden.

    The setting reverses that ruling - only the methods entered on the list get
    through and the rest are rejected before the request reaches the application.

    What it takes away from an attacker - the writing and diagnostic methods the
    author of the application never thought about, because they do not use them.
    A method that uploads a file allows anything to be laid on the server, if any
    directory happens to be writable. A method that deletes allows deleting.
    Diagnostic methods echo the request back in the response together with the
    headers the browser keeps away from scripts - session cookies among them.

    The heart of it is that the application usually does not check the method. It
    checks the address and the data, and takes the method as it came. The filter
    asks that question ahead of it and answers it itself.

disruption_description:
  pl: |
    Zmiana wymaga świadomego wdrożenia, bo lista dopuszczonych metod nie
    powstaje sama. Zasada odwraca rozstrzygnięcie domyślne i od tej chwili
    przechodzi tylko to, co ktoś wpisał — a wpisać trzeba wcześniej.

    Najczęstszy skutek uboczny dotyczy interfejsów programistycznych. Usługa
    odbierająca dane metodą zapisującą albo aktualizującą przestanie działać
    natychmiast, a odpowiedź nie powie, dlaczego: klient dostanie odmowę
    z filtra, nie błąd z aplikacji. Tam, gdzie po stronie klienta jest cudze
    oprogramowanie, zgłoszenie wróci jako awaria serwera.

    Drugi obszar to udostępnianie plików przez protokół rozszerzający HTTP.
    Opiera się on w całości na metodach spoza podstawowego zestawu, więc
    włączenie filtra bez wpisania ich na listę odcina go w całości.

    Kolejność jest jednoznaczna: najpierw wykaz metod faktycznie używanych
    przez witrynę i jej klientów, zebrany z dzienników, a dopiero potem to
    ustawienie. Dziennik serwera jest tu wiarygodnym źródłem, bo zapisuje
    metodę każdego żądania.
  en: |
    The change calls for a planned rollout, because the list of permitted methods
    does not write itself. The rule reverses the default ruling and from then on
    only what somebody entered gets through - and it has to be entered
    beforehand.

    The commonest side effect concerns programming interfaces. A service taking
    data by a writing or updating method stops working at once, and the response
    will not say why - the client gets a refusal from the filter, not an error
    from the application. Where the client side is somebody else's software, the
    report comes back as a server failure.

    The second area is file sharing over the protocol that extends HTTP. It rests
    entirely on methods outside the basic set, so turning the filter on without
    entering them cuts it off completely.

    The order is unambiguous - first a list of the methods the site and its
    clients actually use, gathered from the logs, and only then this setting. The
    server log is a trustworthy source here, since it records the method of every
    request.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
  what_breaks:
    pl:
      - Interfejsy programistyczne przyjmujące dane metodą zapisującą lub aktualizującą przestaną odpowiadać, dopóki metoda nie trafi na listę
      - Klient dostaje odmowę z filtra, a nie błąd z aplikacji, więc przyczyna nie jest widoczna po stronie wywołującego
      - Udostępnianie plików protokołem rozszerzającym HTTP przestanie działać w całości, bo opiera się na metodach spoza zestawu podstawowego
      - Narzędzia do publikowania treści łączące się z serwerem przestaną zapisywać zmiany
      - Metody diagnostyczne przestaną odpowiadać, co bywa mylone z awarią serwera przez osoby diagnozujące problem
    en:
      - Programming interfaces taking data by a writing or updating method stop answering until the method reaches the list
      - The client gets a refusal from the filter and not an error from the application, so the cause is invisible to the caller
      - File sharing over the protocol that extends HTTP stops working entirely, since it rests on methods outside the basic set
      - Content publishing tools connecting to the server stop saving changes
      - Diagnostic methods stop answering, which is sometimes taken for a server failure by whoever is diagnosing a problem
  interruption: none
  user_visible: false
  do_not_apply_when:
    pl:
      - Serwery udostępniające pliki protokołem rozszerzającym HTTP, dopóki jego metody nie trafią na listę
      - Witryny wystawiające interfejs programistyczny, zanim zbierze się wykaz metod używanych przez klientów
      - Środowiska, w których dziennik serwera nie rejestruje metod, bo nie ma wtedy z czego zbudować listy
    en:
      - Servers sharing files over the protocol that extends HTTP, until its methods reach the list
      - Sites exposing a programming interface, before a list of the methods clients use has been gathered
      - Environments where the server log does not record methods, since there is then nothing to build the list from
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/requestFiltering/verbs' -Name 'allowUnlisted' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([string]$value -eq 'True') { 'TRUE' }
          elseif ([string]$value -eq 'False') { 'FALSE' }
          else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FALSE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering/verbs' -Name 'allowUnlisted' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    # The list of permitted methods is recorded too. Rolling the attribute back
    # would otherwise leave whatever was added in the meantime in place, and the
    # reader of the backup file could not tell what the list looked like before.
    $verbs = @(Get-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering/verbs/add' -ErrorAction SilentlyContinue |
      ForEach-Object { [pscustomobject]@{ verb = $_.verb; allowed = $_.allowed } })
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.webServer/security/requestFiltering/verbs'
      name    = 'allowUnlisted'
      value   = [string]$value
      existed = ($null -ne $value)
      verbs   = $verbs
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # The attribute alone. The list of permitted methods is deliberately left
    # untouched - it is prepared before the rollout and writing a guessed one
    # here would either cut off a working site or quietly permit more than was
    # asked for.
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering/verbs' -Name 'allowUnlisted' -Value $false

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/requestfiltering/verbs/

notes:
  pl: |
    Zasada odwraca rozstrzygnięcie domyślne i sama nie tworzy listy dopuszczonych
    metod — listę przygotowuje się osobno, przed wdrożeniem. Naprawa zmienia
    wyłącznie to jedno ustawienie i celowo nie dopisuje żadnych metod, bo
    zgadnięty zestaw albo odciąłby działającą witrynę, albo przepuścił więcej,
    niż ktokolwiek prosił.

    Wykaz metod faktycznie używanych zbierz z dziennika serwera — zapisuje on
    metodę każdego żądania, więc kilka dni ruchu produkcyjnego wystarczy.
    Pamiętaj przy tym, że dziennik pokazuje, co przyszło, a nie co przyjdzie:
    integracja uruchamiana raz na kwartał w tym oknie się nie pojawi.

    Kopia zapasowa zapisuje także samą listę metod, żeby po wycofaniu dało się
    zobaczyć, jak wyglądała przed zmianą.
  en: |
    The rule reverses the default ruling and does not itself create the list of
    permitted methods - the list is prepared apart, before the rollout. The fix
    changes that one setting alone and deliberately adds no methods, since a
    guessed set would either cut off a working site or let through more than
    anybody asked for.

    Gather the list of methods actually in use from the server log - it records
    the method of every request, so a few days of production traffic is enough.
    Bear in mind that the log shows what came, not what will come - an
    integration that runs once a quarter will not appear in that window.

    The backup records the list of methods as well, so that after a rollback it
    can be seen what it looked like before the change.
