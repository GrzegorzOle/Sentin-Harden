id: iis-high-bit-characters-blocked

benchmark:
  name: CIS Microsoft IIS Benchmark
  version: TBD
  item: TBD
  section: Request Filtering and Other Restriction Modules
  title:
    pl: Znaki spoza podstawowego zestawu w adresie odrzucane
    en: Characters outside the basic set refused in an address
  level: 2
  profile: application

platform:
  system: iis

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Adres może nieść znaki spoza podstawowego zestawu — litery z ogonkami,
    alfabety niełacińskie, znaki sterujące zapisane w postaci wielobajtowej.
    Serwer przyjmuje je i przekazuje aplikacji.

    Problem bierze się stąd, że różne warstwy rozumieją te znaki inaczej. Znak
    zapisany w jednym kodowaniu przechodzi przez sprawdzenie jako niegroźny, a
    warstwa niżej odczytuje go jako co innego — najczęściej jako ukośnik albo
    kropkę, czyli jako przejście do katalogu nadrzędnego. Jest to ten sam
    mechanizm co przy podwójnym kodowaniu, tylko zapisany inaczej.

    Odrzucanie takich znaków sprawia, że adres znaczy to samo na każdym poziomie
    obsługi.
  en: |
    An address may carry characters outside the basic set - accented letters,
    non-Latin alphabets, control characters written in a multi-byte form. The
    server accepts them and passes them to the application.

    The trouble arises because different layers understand those characters
    differently. A character written in one encoding passes the check as harmless,
    while a layer below reads it as something else - most often as a slash or a
    dot, that is, as a step up to the parent folder. It is the same mechanism as
    with double encoding, merely written differently.

    Refusing such characters makes an address mean the same thing at every level
    of the handling.

disruption_description:
  pl: |
    Zmiana wymaga sprawdzenia i w środowisku polskojęzycznym jest to sprawdzenie
    istotne, nie formalne. Plik o nazwie zawierającej ogonki przestanie być
    dostępny pod swoim adresem — a takich plików na zasobach wewnętrznych bywa
    wiele.

    Dotyczy to zarówno nazw plików na dysku, jak i adresów budowanych z tytułów:
    artykuł, dokument albo załącznik z polską nazwą przestanie się otwierać.
    Objaw wygląda na brak pliku, choć plik jest na miejscu.

    Przed zmianą trzeba przejrzeć katalog zawartości pod kątem nazw ze znakami
    spoza podstawowego zestawu. Tam, gdzie takie są, właściwą drogą jest zmiana
    nazw albo wyjątek dla tego zasobu, a nie pozostawienie sprawy przypadkowi.
  en: |
    The change calls for a review, and in a Polish-speaking environment that
    review is substantive rather than formal. A file whose name holds accented
    letters stops being reachable at its address - and there tend to be many such
    files on internal resources.

    It touches both file names on the disk and addresses built from titles - an
    article, a document or an attachment with a Polish name stops opening. The
    symptom looks like a missing file, though the file is in place.

    Before the change the content folder has to be reviewed for names holding
    characters outside the basic set. Where there are such, the proper road is
    renaming them or an exception for that resource rather than leaving the matter
    to chance.

implementation_consequences:
  impact_areas:
    - web-server-services
    - legacy-applications
    - user-interface
  what_breaks:
    pl:
      - Pliki o nazwach zawierających polskie znaki przestaną być dostępne pod swoim adresem
      - Adresy budowane z tytułów dokumentów i artykułów przestaną się otwierać
      - Objaw wygląda na brak pliku, choć plik leży na swoim miejscu
      - Zasoby wielojęzyczne z adresami w alfabetach niełacińskich przestaną działać
      - Adresy zapisane znakami podstawowymi, formularze, przesyłanie plików i uwierzytelnianie pozostają bez zmian
    en:
      - Files whose names hold Polish characters stop being reachable at their address
      - Addresses built from the titles of documents and articles stop opening
      - The symptom looks like a missing file, though the file lies where it should
      - Multilingual resources with addresses in non-Latin alphabets stop working
      - Addresses written in basic characters, forms, file uploads and authentication are all unchanged
  interruption: service-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Zasoby z plikami o nazwach zawierających polskie znaki, dopóki nazwy nie zostaną zmienione
      - Serwisy wielojęzyczne z adresami budowanymi z tytułów w alfabetach niełacińskich
      - Zasoby, na których adresy powstają automatycznie z nazw dokumentów wprowadzanych przez użytkowników
    en:
      - Resources with files whose names hold Polish characters, until those names have been changed
      - Multilingual services with addresses built from titles in non-Latin alphabets
      - Resources where addresses are formed automatically from document names entered by users
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      # The overlay is judged only where the web server is installed at all.
      # Without the service the question does not apply, and that is a finding
      # rather than an inability to check.
      if (-not (Get-Service -Name W3SVC -ErrorAction SilentlyContinue)) {
        'NOT_APPLICABLE'
      }
      else {
        $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
        $principal = New-Object Security.Principal.WindowsPrincipal($identity)
        if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
          # The server configuration is unreadable without elevation. That is a
          # missing privilege, not a setting out of place, so it is said plainly
          # instead of being reported as an item unmet.
          [Console]::Error.WriteLine('Reading the web server configuration requires elevation.')
          'CHECK_ERROR'
        }
        else {
          Import-Module WebAdministration -ErrorAction Stop
          $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
            -Filter 'system.webServer/security/requestFiltering' -Name 'allowHighBitCharacters' -ErrorAction Stop
          # The cmdlet hands back an attribute object for some settings and a bare
          # value for others, so both shapes are reduced to one before comparing.
          $value = $raw
          if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
          if ($null -eq $value) { 'MISSING' }
          elseif ([string]$value -eq 'True') { 'TRUE' }
          elseif ([string]$value -eq 'False') { 'FALSE' }
          else { [string]$value }
        }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'FALSE'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    Import-Module WebAdministration -ErrorAction Stop
    # Two backups, on purpose. The named configuration backup is the server's own
    # mechanism and covers the whole configuration; the value written below lets
    # the rollback put back one setting without restoring everything around it.
    $stamp = 'sentin-' + (Get-Date -Format 'yyyyMMdd-HHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
    Backup-WebConfiguration -Name $stamp | Out-Null
    $raw = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering' -Name 'allowHighBitCharacters' -ErrorAction SilentlyContinue
    $value = $raw
    if ($null -ne $raw -and $null -ne $raw.Value) { $value = $raw.Value }
    [pscustomobject]@{
      scope   = 'server'
      backup  = $stamp
      filter  = 'system.webServer/security/requestFiltering'
      name    = 'allowHighBitCharacters'
      value   = [string]$value
      existed = ($null -ne $value)
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}} and configuration backup $stamp"

  change_command: |
    Import-Module WebAdministration -ErrorAction Stop
    Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
      -Filter 'system.webServer/security/requestFiltering' -Name 'allowHighBitCharacters' -Value $false

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    Import-Module WebAdministration -ErrorAction Stop
    if (-not $b.existed) {
      # Nothing was written here before, so the setting goes back to being
      # inherited rather than being written with a guessed value. The named
      # configuration backup recorded in that file stays available for a full
      # restore of the server configuration.
      Clear-WebConfiguration -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "$($b.filter)/@$($b.name)" -ErrorAction SilentlyContinue
    } else {
      Set-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' `
        -Filter $b.filter -Name $b.name -Value $b.value
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/iis/configuration/system.webserver/security/requestfiltering/

notes:
  pl: |
    Punkt jest poziomu drugiego i w środowisku polskojęzycznym bywa kandydatem do
    świadomego odpuszczenia — koszt jest realny i widoczny od razu. Zasada
    uzupełnia odrzucanie adresów zakodowanych dwukrotnie i obie ocenia się razem,
    bo zamykają ten sam mechanizm zapisany na dwa sposoby.
  en: |
    The item is of the second level and in a Polish-speaking environment is a
    candidate for being deliberately let go - the cost is real and visible at
    once. The rule completes the refusal of doubly encoded addresses, and the two
    are judged together, since they shut the same mechanism written in two ways.
