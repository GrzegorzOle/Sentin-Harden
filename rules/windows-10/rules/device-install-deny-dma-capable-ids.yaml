id: win10-device-install-deny-dma-capable-ids

benchmark:
  name: CIS Microsoft Windows 10 Benchmark
  version: TBD
  item: TBD
  section: Administrative Templates > System > Device Installation > Device Installation Restrictions
  title:
    pl: Zakaz instalacji kontrolerów sięgających wprost do pamięci
    en: The laying on of controllers reaching straight into memory forbidden
  level: 1
  profile: workstation

platform:
  system: windows-10

risk_category: high
disruption: needs-planned-rollout
assessment_state: assessed-impact-described

description:
  pl: |
    Ustawienie zakazuje instalowania sterowników kontrolerów, które
    sięgają wprost do pamięci maszyny z pominięciem procesora, i stosuje
    ten zakaz także do kontrolerów już zainstalowanych.

    Chodzi o złącza z bezpośrednim dostępem do pamięci: starsze złącze
    szeregowe do sprzętu wideo i nowsze złącze uniwersalne o wysokiej
    przepustowości. Urządzenie podłączone tą drogą może czytać i zapisywać
    pamięć maszyny, bo na tym polega ich sposób działania — przesył idzie
    z pominięciem procesora, żeby był szybki.

    Skutek jest taki, że sprzęt wielkości pendrive'a, podłączony do
    gniazda z boku laptopa, potrafi odczytać zawartość pamięci: klucze
    szyfrowania dysku, hasła trzymane w pamięci procesu, zawartość sesji.
    Maszyna nie musi być odblokowana, a atak nie zostawia śladu
    w systemie plików.

    Punkt jest jednym z niewielu, które bronią przed napastnikiem mającym
    maszynę w rękach. Dotyczy zwłaszcza sprzętu przenoszonego, zostawianego
    w pokoju hotelowym albo oddawanego do naprawy.

    Odnotowuję, że zakaz stosuje się wstecznie, czyli obejmuje kontrolery
    zainstalowane wcześniej. Bez tego punkt broniłby wyłącznie przed
    sprzętem podłączonym po raz pierwszy.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: odczyt
    pamięci maszyny przez urządzenie podłączone do gniazda.
  en: |
    The setting forbids the laying on of drivers of controllers that reach straight into the machine's memory,
    passing the reckoner by, and holds that ban to controllers already laid on as well.

    What is meant is connectors with a straight reach of memory: the older serial connector for things of picture
    and the newer universal connector of high throughput. A device put in by that road may read and write the
    machine's memory, that being how they work - the carrying goes past the reckoner so that it may be swift.

    The upshot is that a thing the size of a pocket memory, put into a socket at a laptop's side, can read what
    stands in memory: keys of the ciphering of the disk, words of passing held in a program's memory, the content
    of a sitting. The machine need not be unlocked, and the attack leaves no trace in the system of files.

    The item is among the few that guard against an attacker with the machine in their hands. It touches above all
    things carried about, left in a room at an inn or given in for mending.

    I set down that the ban holds backward, which is to say it takes in controllers laid on earlier. Without that
    the item would guard solely against a thing put in for the first time.

    What an attacker gains while the item goes unmet: the reading of the machine's memory by a device put into a
    socket.

disruption_description:
  pl: |
    Klasa „wymaga świadomego wdrożenia".

    Zakaz stosowany wstecznie potrafi zatrzymać kontroler już działający,
    a wraz z nim wszystko, co przez niego podłączono. Wymaga restartu
    i powrót też wymaga restartu, więc to nie jest zmiana do zrobienia
    w środku dnia.

    Miejscem pierwszym są stacje dokujące. Znaczna ich część korzysta
    z szybkiego złącza uniwersalnego i po zmianie przestanie podawać
    obraz, sieć i zasilanie peryferiów. Na stanowisku pracującym przez
    dok jest to zatrzymanie pracy, a nie uciążliwość.

    Miejscem drugim są zewnętrzne karty graficzne, macierze dyskowe
    i szybkie karty sieciowe na tym samym złączu. Wszystkie znikną.

    Miejscem trzecim jest sprzęt studyjny na starszym złączu szeregowym:
    kamery, interfejsy dźwiękowe, urządzenia pomiarowe. Tam wymiana bywa
    kosztowna i punkt trzeba świadomie odpuścić albo zaplanować.

    Odnotowuję, że nowoczesne maszyny mają osobne zabezpieczenie sprzętowe
    chroniące pamięć przed tą drogą. Tam koszt punktu bywa nieuzasadniony
    i warto to sprawdzić przed wdrożeniem.

    Czego to nie psuje: portów szeregowych zwykłych, gniazd na nośniki
    pamięci bez bezpośredniego dostępu, klawiatur, myszy, drukarek,
    logowania.
  en: |
    The class is "needs a planned rollout".

    A ban holding backward can stop a controller already working, and with it everything put in through it. It
    calls for a restart, and the going back calls for one too, so it is no change to be made in the middle of a
    day.

    The first place is stations of docking. A great part of them use the swift universal connector and after the
    change will cease to give picture, network and power for the things about them. Upon a station working through
    a dock that is a stopping of the work and no mere burden.

    The second place is outward cards of picture, arrays of disks and swift cards of the network upon that same
    connector. All will go.

    The third place is things of a studio upon the older serial connector: picture-takers, faces for sound,
    instruments of measuring. There the changing out is at times costly and the item has to be knowingly let go or
    planned for.

    I set down that machines of today have a guard of their own in the thing itself, shielding memory from that
    road. There the item's cost is at times without ground and it is worth looking into before the rollout.

    What this does not break: ordinary serial ports, sockets for memories without a straight reach, keyboards,
    mice, printers, or logging on.

implementation_consequences:
  impact_areas:
    - drivers-and-devices
    - removable-media
  what_breaks:
    pl:
      - Stacje dokujące na szybkim złączu uniwersalnym przestaną podawać obraz, sieć i zasilanie peryferiów
      - Zewnętrzne karty graficzne, macierze dyskowe i szybkie karty sieciowe na tym złączu znikną z systemu
      - Sprzęt studyjny na starszym złączu szeregowym przestanie działać, a jego wymiana bywa kosztowna
      - Zakaz stosowany wstecznie zatrzyma kontroler już działający, a powrót również wymaga restartu
      - Porty szeregowe zwykłe, gniazda na nośniki pamięci, klawiatury, myszy i drukarki pozostają bez zmian
    en:
      - Stations of docking upon the swift universal connector will cease to give picture, network and power for the things about them
      - Outward cards of picture, arrays of disks and swift cards of the network upon that connector will go from the system
      - Things of a studio upon the older serial connector will cease to work, and the changing of them out is at times costly
      - A ban holding backward will stop a controller already working, and the going back calls for a restart as well
      - Ordinary serial ports, sockets for memories, keyboards, mice and printers stay unchanged
  interruption: system-restart
  user_visible: true
  do_not_apply_when:
    pl:
      - Stanowisko pracuje przez stację dokującą na szybkim złączu uniwersalnym i nie ma innego sposobu podłączenia
      - Praca opiera się na sprzęcie studyjnym albo pomiarowym na starszym złączu szeregowym
      - Maszyna ma sprzętowe zabezpieczenie pamięci przed tą drogą i koszt punktu przewyższa zysk
    en:
      - The station works through a docking station upon the swift universal connector and there is no other way of putting things in
      - The work rests upon things of a studio or of measuring upon the older serial connector
      - The machine has a guard of memory in the thing itself against that road and the item s cost outweighs the gain
  reversibility: after-restart

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'MISSING' }
      else {
        $item = Get-ItemProperty -Path $path -ErrorAction Stop
        $deny = $item.DenyDeviceIDs
        $retroactive = $item.DenyDeviceIDsRetroactive
        $listKey = Join-Path $path 'DenyDeviceIDs'
        $listed = @()
        if (Test-Path -Path $listKey) {
          $listed = @(
            (Get-ItemProperty -Path $listKey -ErrorAction Stop).PSObject.Properties |
              Where-Object { $_.Name -notlike 'PS*' } |
              ForEach-Object { ([string]$_.Value).Trim().ToUpperInvariant() }
          )
        }
        # Naming what is missing matters more than a bare failure: a list set up by
        # halves is a different case from one nobody has touched.
        $absent = @(@('PCI\CC_0C0010', 'PCI\CC_0C0A') | Where-Object { $listed -notcontains $_ })
        if ($null -eq $deny -or $null -eq $retroactive) { 'MISSING' }
        elseif ([int]$deny -eq 1 -and [int]$retroactive -eq 1 -and $absent.Count -eq 0) { 'DENIED_RETROACTIVELY' }
        else { 'DENY=' + $deny + ' RETROACTIVE=' + $retroactive + ' ABSENT=' + ($absent -join ',') }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: 'DENIED_RETROACTIVELY'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    $item = Get-ItemProperty -Path $path -ErrorAction SilentlyContinue
    $listKey = Join-Path $path 'DenyDeviceIDs'
    $entries = @()
    if (Test-Path -Path $listKey) {
      $entries = @(
        (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties |
          Where-Object { $_.Name -notlike 'PS*' } |
          ForEach-Object { [pscustomobject]@{ name = $_.Name; value = [string]$_.Value } }
      )
    }
    [pscustomobject]@{
      path          = $path
      key_existed   = (Test-Path -Path $path)
      deny          = $item.DenyDeviceIDs
      deny_existed  = ($null -ne $item.DenyDeviceIDs)
      retro         = $item.DenyDeviceIDsRetroactive
      retro_existed = ($null -ne $item.DenyDeviceIDsRetroactive)
      list_key      = $listKey
      list_existed  = (Test-Path -Path $listKey)
      entries       = $entries
    } | ConvertTo-Json -Depth 4 | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    $path = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DeviceInstall\Restrictions'
    if (-not (Test-Path -Path $path)) { New-Item -Path $path -Force | Out-Null }
    Set-ItemProperty -Path $path -Name 'DenyDeviceIDs' -Value 1 -Type DWord
    Set-ItemProperty -Path $path -Name 'DenyDeviceIDsRetroactive' -Value 1 -Type DWord
    $listKey = Join-Path $path 'DenyDeviceIDs'
    if (-not (Test-Path -Path $listKey)) { New-Item -Path $listKey -Force | Out-Null }
    # Whatever somebody else put here guards against something this rule knows
    # nothing of, so the list is added to and never written over.
    $taken = @{}
    $present = @()
    foreach ($property in (Get-ItemProperty -Path $listKey -ErrorAction SilentlyContinue).PSObject.Properties) {
      if ($property.Name -notlike 'PS*') {
        $taken[$property.Name] = $true
        $present += ([string]$property.Value).Trim().ToUpperInvariant()
      }
    }
    $index = 1
    foreach ($id in @('PCI\CC_0C0010', 'PCI\CC_0C0A')) {
      if ($present -notcontains $id) {
        while ($taken.ContainsKey([string]$index)) { $index++ }
        New-ItemProperty -Path $listKey -Name ([string]$index) -Value $id -PropertyType String -Force | Out-Null
        $taken[[string]$index] = $true
      }
    }

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if ($b.deny_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceIDs' -Value $b.deny -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceIDs' -ErrorAction SilentlyContinue
    }
    if ($b.retro_existed) {
      Set-ItemProperty -Path $b.path -Name 'DenyDeviceIDsRetroactive' -Value $b.retro -Type DWord
    } else {
      Remove-ItemProperty -Path $b.path -Name 'DenyDeviceIDsRetroactive' -ErrorAction SilentlyContinue
    }
    Remove-Item -Path $b.list_key -Recurse -Force -ErrorAction SilentlyContinue
    if ($b.list_existed) {
      New-Item -Path $b.list_key -Force | Out-Null
      foreach ($entry in @($b.entries)) {
        New-ItemProperty -Path $b.list_key -Name $entry.name -Value $entry.value -PropertyType String -Force | Out-Null
      }
    }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/client-management/manage-device-installation-with-group-policy

notes:
  pl: |
    Reguła jest jedną z niewielu w całej bazie, które bronią przed
    napastnikiem trzymającym maszynę w rękach. Warto, żeby aplikacja
    postawiła to wprost, bo to zmienia rachunek: koszt jest wysoki,
    ale dotyczy sprzętu, a zysk dotyczy sytuacji, w której wszystkie
    zabezpieczenia programowe są już nieistotne.

    Argument wart zachowania dotyczy wsteczności zakazu. Bez niej punkt
    broniłby wyłącznie przed sprzętem podłączonym po raz pierwszy,
    a kontroler już zainstalowany działałby dalej. Dlatego sprawdzenie
    wymaga obu wartości naraz i mówi, której brakuje.

    Odnotowuję zastrzeżenie wobec maszyn z osobnym zabezpieczeniem
    sprzętowym pamięci. Tam ta sama droga jest zamknięta niżej i taniej,
    a koszt punktu bywa nieuzasadniony. Aplikacja powinna to wymienić,
    żeby decyzja opierała się na tym, co na maszynie faktycznie jest.
  en: |
    The rule is among the few in the whole base that guard against an attacker holding the machine in their hands.
    It is well that the application put that outright, it altering the reckoning: the cost is high but touches
    things, while the gain touches a case in which every guard of software is already beside the point.

    The argument worth keeping touches the ban's holding backward. Without it the item would guard solely against
    a thing put in for the first time, while a controller already laid on would work on. Therefore the check calls
    for both values at once and says which is wanting.

    I set down the reservation touching machines with a guard of memory of their own in the thing itself. There
    the same road is shut lower down and more cheaply, and the item's cost is at times without ground. The
    application ought to name that, so that the decision rest upon what truly stands upon the machine.
