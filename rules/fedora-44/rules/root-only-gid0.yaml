id: fedora44-root-only-gid0

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 5.4.2.2
  section: Access Control > User Accounts and Environment > Configure root and system accounts and environment
  title:
    pl: Tylko konto root ma grupę główną o GID 0
    en: Ensure root is the only GID 0 account
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Grupa o GID 0 ma dostęp do plików, które system daje grupie root, na
    przykład części plików w /etc i /root. Konto z taką grupą główną tworzy
    też pliki należące do tej grupy, więc łatwo o przeciek uprawnień do
    plików administratora.

    Punkt wymaga, żeby w /etc/passwd grupę główną o GID 0 miało tylko konto
    root. CIS pomija konta sync, shutdown, halt i operator, które Fedora
    tworzy z GID 0.
  en: |
    The group with GID 0 has access to the files the system gives to the
    root group, for example some files in /etc and /root. An account with
    such a primary group also creates files owned by this group, so the
    privileges of the administrator's files leak easily.

    The item requires that only the root account has the primary group with
    GID 0 in /etc/passwd. CIS leaves out the sync, shutdown, halt and
    operator accounts, which Fedora creates with GID 0.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/passwd.
  en: |
    Nobody will notice: the check only reads /etc/passwd.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd"; exit 0; }
    r=$(awk -F: '$1 == "root" { print $4; exit }' /etc/passwd)
    o=$(awk -F: '$1 !~ /^(root|sync|shutdown|halt|operator)$/ && $4 ~ /^[0-9]+$/ && $4 + 0 == 0 { printf "%s%s", s, $1; s = "," }' /etc/passwd)
    if [ "$r" != 0 ]; then echo "NOT_OK:root-gid=${r:-none}${o:+,gid0=$o}"
    elif [ -n "$o" ]; then echo "NOT_OK:gid0=$o"
    else echo "OK:root-only"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/passwd.5.html

notes:
  pl: |
    Wynik NOT_OK podaje nazwy innych kont z GID 0 albo inny GID konta root.
    Konto zmienia się ręcznie poleceniem usermod -g na jego własną grupę,
    po sprawdzeniu, do jakich plików potrzebuje dostępu. Konta sync,
    shutdown, halt i operator są pomijane po dokładnej nazwie. Reguła tylko
    sprawdza stan.
  en: |
    The NOT_OK result gives the names of other accounts with GID 0 or
    another GID of the root account. The account is changed by hand with
    usermod -g to its own group, after checking which files it needs to
    access. The sync, shutdown, halt and operator accounts are left out by
    exact name. The rule only checks the state.
