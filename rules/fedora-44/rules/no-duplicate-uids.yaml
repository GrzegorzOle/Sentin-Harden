id: fedora44-no-duplicate-uids

benchmark:
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  version: 2.0.0
  item: 7.2.4
  section: System Maintenance > Local User and Group Settings
  title:
    pl: Żaden UID nie powtarza się w /etc/passwd
    en: Ensure no duplicate UIDs exist
  level: 1
  profile: workstation

platform:
  system: fedora-44

risk_category: medium
disruption: none
assessment_state: assessed-no-impact

description:
  pl: |
    Jądro rozpoznaje użytkownika tylko po UID. Dwa konta z tym samym UID to
    dla systemu jedno konto: mają te same pliki i procesy, a dziennik
    audytu nie pozwala odróżnić, która osoba co zrobiła.

    Punkt wymaga, żeby każde konto w /etc/passwd miało własny UID.
  en: |
    The kernel knows a user only by the UID. Two accounts with the same UID
    are one account to the system: they share files and processes, and the
    audit log cannot tell which person did what.

    The item requires every account in /etc/passwd to have its own UID.

disruption_description:
  pl: |
    Nikt tego nie zauważy: sprawdzenie tylko czyta /etc/passwd.
  en: |
    Nobody will notice: the check only reads /etc/passwd.

implementation_consequences:
  impact_areas:
    - accounts-and-passwords
  what_breaks:
    pl: []
    en: []
  interruption: none
  user_visible: false
  reversibility: immediate

audit:
  shell: bash
  test_command: |
    [ -r /etc/passwd ] || { echo "NOT_OK:no-/etc/passwd"; exit 0; }
    o=$(awk -F: '$1 != "" { n[$3]++; w[$3] = w[$3] (w[$3] == "" ? "" : "+") $1 }
      END { for (k in n) if (n[k] > 1) print k "=" w[k] }' /etc/passwd | sort -n | paste -sd, -)
    if [ -n "$o" ]; then echo "NOT_OK:uid-$o"; else echo "OK:no-duplicate-uids"; fi
  expected: '^OK:'
  comparison: regex

privileges: root
runnable: false

sources:
  - https://man7.org/linux/man-pages/man5/passwd.5.html
  - https://man7.org/linux/man-pages/man8/pwck.8.html
  - https://man7.org/linux/man-pages/man8/usermod.8.html

notes:
  pl: |
    Wynik NOT_OK podaje każdy powtórzony UID z nazwami kont, na przykład
    uid-1001=anna+jan. Konto dostaje nowy UID ręcznie poleceniem usermod -u,
    a jego pliki poza katalogiem domowym trzeba potem przepisać poleceniem
    chown. Test działa bez roota. Reguła tylko sprawdza stan.
  en: |
    The NOT_OK result gives each repeated UID with the account names, for
    example uid-1001=anna+jan. An account gets a new UID by hand with
    usermod -u, and its files outside the home directory then need chown.
    The test works without root. The rule only checks the state.
