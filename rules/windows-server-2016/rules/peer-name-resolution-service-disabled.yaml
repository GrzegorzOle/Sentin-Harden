id: win2016-peer-name-resolution-service-disabled

benchmark:
  name: CIS Microsoft Windows Server 2016 Benchmark
  version: TBD
  item: TBD
  section: System Services
  title:
    pl: Usługa rozpoznawania nazw w sieci równorzędnej wyłączona
    en: The name resolution service in peer networking disabled
  level: 2
  profile: server

platform:
  system: windows-server-2016

risk_category: medium
disruption: needs-review
assessment_state: assessed-impact-described

description:
  pl: |
    Usługa zamienia nazwę używaną w sieci równorzędnej na adres, pod którym
    druga maszyna jest osiągalna — i odpowiada na takie pytania zadawane
    przez innych.

    Zwykłe rozpoznawanie nazw w organizacji idzie przez serwer nazw, który
    odpowiada z zapisu prowadzonego centralnie. Ten mechanizm działa
    odwrotnie: pytanie rozchodzi się po sieci między maszynami, a odpowiada
    ta, która uzna, że pytanie jej dotyczy. Nie ma tu żadnego miejsca,
    w którym dałoby się sprawdzić, czy odpowiedź jest prawdziwa.

    Z tego bierze się właściwy problem. Napastnik obecny w tej samej sieci
    może odpowiedzieć na cudze pytanie i wskazać siebie. Maszyna pytająca
    nie ma jak tego odróżnić, bo cała konstrukcja zakłada, że odpowiada ten,
    kogo dotyczy pytanie. Droga ta jest znana od dawna i wykorzystywana
    w praktyce właśnie dlatego, że nie wymaga niczego poza obecnością
    w segmencie.

    Mechanizm rozchodzi się przy tym szerzej niż jeden segment, bo potrafi
    sięgać przez sieć rozległą — i to odróżnia go od starszych, czysto
    lokalnych rozgłoszeń.

    Co zyskuje napastnik, dopóki punkt pozostaje niespełniony: możliwość
    odpowiedzenia na cudze pytanie o adres i wskazania siebie jako maszyny,
    której pytanie dotyczyło.
  en: |
    The service turns a name used in peer networking into an address at which the other
    machine is reachable - and answers such questions put by others.

    Ordinary name resolution in an organisation goes through a name server answering
    from a record kept centrally. This mechanism works the other way about: the question
    spreads over the network among machines, and the one that holds the question
    concerns it answers. There is here no place at which it could be checked whether the
    answer is true.

    From that comes the real trouble. An attacker present on the same network may answer
    another's question and point at themselves. The asking machine has no way of telling
    that apart, the whole construction assuming that the one the question concerns
    answers. That road has long been known and is used in practice precisely because it
    calls for nothing beyond presence in the segment.

    The mechanism spreads besides wider than one segment, being able to reach across a
    wide-area network - and that sets it apart from older, purely local broadcasts.

    What an attacker gains while the item goes unmet: the chance to answer another's
    question about an address and to point at themselves as the machine the question
    concerned.

disruption_description:
  pl: |
    Klasa „wymaga sprawdzenia", choć sprawdzenie jest zwykle krótkie.

    Mechanizm nie bierze udziału w rozpoznawaniu nazw w domenie ani
    w sieci. Nazwy serwerów, udziałów, kontrolerów i wszystkiego, czego
    używa się na co dzień, idą inną drogą i wyłączenie tej usługi ich nie
    dotyka. Jest to najważniejsza rzecz do powiedzenia, bo nazwa reguły
    brzmi szeroko i budzi obawę, że maszyna przestanie widzieć sieć.

    Zastosowania, które warto sprawdzić, są dwa. Pierwsze to pomoc zdalna
    nawiązywana zaproszeniem, w starszym wariancie opierającym się na
    połączeniu bezpośrednim zamiast na serwerze. Drugie to aplikacje
    wyszukujące sobie nawzajem stanowiska bez konfiguracji adresów —
    zwykle branżowe i zwykle starsze.

    Wyłączenie działa w obie strony naraz: maszyna przestaje pytać
    i przestaje odpowiadać. Skutek widoczny pojawia się zatem nie tylko
    u niej, ale i u tych, które szukały jej.

    Czego to nie psuje: rozpoznawania nazw w domenie i w sieci, dostępu do
    udziałów, pulpitu zdalnego, zarządzania zdalnego, uwierzytelniania.

    Wymaga zatrzymania usługi; poza tym natychmiast odwracalne.
  en: |
    The class is "needs review", though the review is as a rule a short one.

    The mechanism takes no part in resolving names in the domain or on the network. The
    names of servers, shares, controllers and everything used from day to day go by
    another road and switching this service off does not touch them. That is the most
    important thing to say, the rule's name sounding wide and rousing the fear that the
    machine will stop seeing the network.

    There are two uses worth checking. The first is remote assistance struck up by an
    invitation, in the older variant resting on a direct connection rather than on a
    server. The second is applications seeking one another's positions out without
    addresses being configured - as a rule line-of-business and as a rule older.

    Switching it off works both ways at once: the machine stops asking and stops
    answering. The visible consequence therefore appears not only at it but also at
    those that were seeking it.

    What this does not break: resolving names in the domain and on the network, access
    to shares, the remote desktop, remote management, or authentication.

    Calls for the service to be stopped; otherwise undone immediately.

implementation_consequences:
  impact_areas:
    - network-and-firewall
    - remote-management
    - legacy-applications
  what_breaks:
    pl:
      - Pomoc zdalna nawiązywana zaproszeniem w starszym wariancie bezpośrednim nie zestawi połączenia
      - Aplikacje wyszukujące sobie nawzajem stanowiska bez skonfigurowanych adresów przestaną się znajdować
      - Wyłączenie działa w obie strony naraz, więc skutek pojawi się także u maszyn, które szukały tej
      - Rozpoznawanie nazw w domenie i w sieci, dostęp do udziałów i pulpit zdalny pozostają bez zmian
    en:
      - Remote assistance struck up by an invitation in the older direct variant will not set up a connection
      - Applications seeking one another out with no addresses configured will stop finding one another
      - Switching it off works both ways at once, so the consequence will appear also at machines that were seeking this one
      - Resolving names in the domain and on the network, access to shares and the remote desktop stay unchanged
  interruption: service-restart
  user_visible: false
  do_not_apply_when:
    pl:
      - Pomoc zdalna w tej organizacji jest nawiązywana zaproszeniem w wariancie bez serwera pośredniczącego
      - Na maszynie pracuje aplikacja wyszukująca stanowiska po nazwie równorzędnej zamiast po adresie
    en:
      - Remote assistance in this organisation is struck up by an invitation in the variant without a server in between
      - An application seeking positions out by a peer name rather than by an address works on the machine
  reversibility: immediate

audit:
  shell: powershell
  test_command: |
    try {
      $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
      if (-not (Test-Path -Path $path -ErrorAction Stop)) { 'NOT_APPLICABLE' }
      else {
        $value = (Get-ItemProperty -Path $path -ErrorAction Stop).Start
        if ($null -eq $value) { 'CHECK_ERROR' } else { [string]$value }
      }
    } catch {
      'CHECK_ERROR'
    }
  expected: '4'
  comparison: equals

remediation:
  shell: powershell
  backup_command: |
    $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\PNRPsvc'
    $current = (Get-ItemProperty -Path $path -Name 'Start' -ErrorAction SilentlyContinue).Start
    [pscustomobject]@{
      path    = $path
      name    = 'Start'
      value   = $current
      existed = ($null -ne $current)
      running = ((Get-Service -Name 'PNRPsvc' -ErrorAction SilentlyContinue).Status -eq 'Running')
    } | ConvertTo-Json | Set-Content -Path '{{backup_file}}' -Encoding UTF8
    "Saved previous state to {{backup_file}}"

  change_command: |
    # The machine stops resolving peer names and stops answering resolution
    # queries from others. Both directions go at once.
    Stop-Service -Name 'PNRPsvc' -Force -ErrorAction SilentlyContinue
    Set-Service -Name 'PNRPsvc' -StartupType Disabled

  rollback_command: |
    $b = Get-Content -Path '{{backup_file}}' -Raw | ConvertFrom-Json
    if (-not $b.existed) { throw 'Backup holds no previous value - refusing to guess one.' }
    Set-ItemProperty -Path $b.path -Name $b.name -Value $b.value -Type DWord
    if ($b.running) { Start-Service -Name 'PNRPsvc' -ErrorAction SilentlyContinue }

privileges: administrator
runnable: true

sources:
  - https://learn.microsoft.com/windows/win32/p2psdk/peer-name-resolution-protocol

notes:
  pl: |
    Punkt jest w tej rodzinie najważniejszy z trzech, bo dotyczy jedynego
    miejsca, w którym mechanizm coś rozstrzyga — a rozstrzyga bez żadnej
    możliwości sprawdzenia rozstrzygnięcia.

    Warto przy nim wyraźnie postawić granicę zakresu. Reguła nie dotyczy
    rozpoznawania nazw w ogóle, tylko jednego równoległego mechanizmu.
    Czytelnik, który tego nie wie, ma pełne prawo odpuścić punkt w obawie,
    że maszyna straci kontakt z siecią — i będzie to odpuszczenie z powodu,
    który nie istnieje.

    Zasięg szerszy niż segment jest drugą rzeczą wartą pokazania. Odróżnia
    ten mechanizm od starszych rozgłoszeń lokalnych, których nie da się
    usłyszeć zza routera, i podnosi kategorię ryzyka wyżej, niż sugerowałby
    sam wiek rozwiązania.
  en: |
    The item is the most important of the three in this family, concerning the one place
    at which the mechanism settles anything - and settles it with no possibility of
    checking what was settled.

    A clear boundary of range is worth putting at it. The rule does not concern
    resolving names at large, only one parallel mechanism. A reader who does not know
    that has every right to let the item go for fear the machine will lose touch with
    the network - and it will be a letting go for a reason that does not exist.

    A reach wider than the segment is the second thing worth showing. It sets this
    mechanism apart from older local broadcasts, which cannot be heard from behind a
    router, and it lifts the risk category higher than the solution's age alone would
    suggest.
