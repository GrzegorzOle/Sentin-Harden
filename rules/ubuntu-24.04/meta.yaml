id: ubuntu-24.04
nazwa: Ubuntu 24.04 LTS
rodzina: linux
powloka: bash
profil: server

benchmark:
  nazwa: CIS Ubuntu Linux 24.04 LTS Benchmark
  wersja: UZUPELNIC

wykrywanie:
  polecenie: |
    . /etc/os-release
    printf '%s|%s\n' "$ID" "$VERSION_ID"
  dopasowanie: '^ubuntu\|24\.04$'

uwagi: |
  Bliski Debianowi, ale nie tożsamy — różnice dotyczą między innymi domyślnej
  konfiguracji zapory (ufw), profili AppArmor i obecności snapów.
  Nie kopiuj reguł z paczki Debiana bez sprawdzenia na żywym systemie.

  Menedżer pakietów: apt. Kontrola dostępu: AppArmor.
